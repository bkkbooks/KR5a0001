front:
  text: 靈寶無量度人上品妙經卷之五十三宙三
  hash: sha256:86dde8f9c9abd4916f5878a3622ef5a26fef8fae24f9becac003066a81b13c6c
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_053-001a, image: hfl/0011/0011-086.png}
body:
  text: 斬滅五行邪怪品道言昔於玉靈天中明景謡歌大威神土受元始度人斬滅五行邪怪無量上品元始天尊當説是經周回十過以召十方始當詣座天真大神上聖髙尊妙行真人五帝真官明威大將斬邪騎吏隂陽三五總統官曹紫微神兵無鞅數衆乘空而來金暉映虛寶輿仙飈華光羽蓋纒鬱晨霞萬景交朗煥耀八圓七日七夜十方仙真層樓寶闕洞化相通天綱停佪星絡正度神風微扇妙靄凝香氣象融和海嶽澄清一國地土山川林木緬平一等無復髙下土皆作華玉瑩鮮五明之色衆真侍座元始天尊玄坐空浮景耀神龍御化天元之座説經一遍諸天大聖同時稱善是時一國男女斷滅五欲之情説經二遍五化隆昌説經三遍五緯順𨇠説經四遍五氣常平萬物咸亨説經五遍五常不擾道治日新説經六逼五運推協無有乖愆説經七遍五文顯布玄教開明説經八遍五神守正威用宣張真氣充溢蠲蕩不祥説經九遍五精固養保育靈光説經十遍五行之內邪怪俱亡是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊説經一遍東方無極無量品斬滅青精邪怪至真大神無鞅之衆浮空而至説經二遍南方無極無量品斬滅赤精邪怪至真大神無鞅之衆浮空而至説經三遍西方無極無量品斬滅皓精邪怪至真大神無鞅之衆浮空而至説經四遍北方無極無量品斬滅黑精邪怪至真大神無鞅之衆浮空而至説經五遍東北無極無量品斬滅火行遊精邪怪至真大神無鞅之衆浮空而至説經六遍東南無極無量品斬滅金行遊精邪怪至真大神無鞅之衆浮空而至説經七遍西南無極無量品斬滅水行遊精中央黃精邪怪至真大神無鞅之衆浮空而至説經八遍西北無極無量品斬滅木行遊精邪怪至真大神無鞅之衆浮空而至説經九遍上方無極無量品斬滅天元五行邪怪至真大神無鞅之衆浮空而至説經十遍下方無極無量品斬滅地元五行邪怪至真大神無鞅之衆浮空而至十遍周竟十方無極斬滅五行邪怪天真大神一時同至一國男女傾心歸仰來者有如密雲細霧無鞅之衆迮國一半土皆傾陷非可禁止於是元始化一圓象大小無常煒耀五色在空玄之中去地九丈元始登引天真大神上聖髙尊妙行真人五帝真官明威大將斬邪騎吏隂陽三五總統官曹十方斬滅五行邪怪至真神王紫微神兵三天給事無鞅數衆俱入圎象之中天人仰看惟見拂拂從圓象中入既入圓象不知所在國人廓散地還平正無復欹陷元始即於圓象之內説經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸行正心不欹不陷不誑不佞不狠不愎不戾不乖不嫉不惡言行平直智識剛明齊同慧悟異骨和同國安民康欣樂沖融經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊説經中所言並是諸天上帝內名隱韻之音亦是真魔內諱斬滅五行邪怪百靈之隱名也非世上之常辭上聖已成真人通玄究微能悉其章誦之十過諸天讃詠五靈敬侍金木水火元土合并神粹凝和毒害不生混養內化洞冥至真邪怪鬼祅無緣而興至學之士誦之十過則五帝鑑觀九真舉仙邪試滅迹怪禍永蠲道業保固善行克全所以爾者通感五行之神蕩伏邪怪召制威靈克成至道和合真氣保育人命得躋玄境降會髙真不死而已豈復更生輕誦此章身則被殃供養尊禮門戶興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人無量為萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到十方斬滅五行邪怪之神勦絶魔精五行之內不為殃禍災咎永消用保福祥而運化常寧安鎮率土普承玄恩仁夀冨樂清靜自然也上學之士修誦是經消滌邪害道氣清真世人受誦則元真受妙惑念永忘全其壽年後皆得受鍊度之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役考官侍經五帝玉童玉女各三十六人營衛神文保護受經者身道言正月長齋誦詠是經召上元將軍斬滅五行邪怪不正之祅即使天界澄廓七耀常明七月長齋誦詠是經召中元官將斬滅五行邪怪不正之精保衛兆民使安其生十月長齋誦詠是經召下元官君將吏五嶽兵馬斬滅五行邪怪不正之靈安鎮天下慶祐君親歷世綿長後天而存八節之日誦詠是經召天地四方八極兵馬却絶魔靈順布五氣長養生成本命之日誦詠是經召天元九宫星宿真官威殺之神檢校命籙五行邪怪祛斬滅蹤五神守正萬氣資形生道靈堅超遷上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黃赤三色雲氣之中內外蓊冥有青龍白虎朱雀玄武師子白鶴羅列左右日月照明洞煥室內項生圎象光映十方如此分明密呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引氣三十二過東向誦經元始無量度人上品妙經元始洞玄靈寶本章上品妙首斬邪滅怪十回度人百魔隱韻離合自然五氣真文玄虛上神大混靈源天地幽根統運五氣五行之元大化總御歷劫綿綿五行布育相保生成非道不顯非道不明非道不立非道不真錯沴結靄邪怪流形自然神德祛伐無停是為妙範玄上之宗太極玉關金闕靈都隂陽元會三氣之樞浩浩元氣乍合乍殊青琳玉宫始暉妙庭墉臺積霄交和耀晶大周十境羅絡彌綸中有調運五行順化之神中有宰御玄極生育之君中有馘祅破害大神中有仙靈寶籙官君丈人中有隂陽三五七九明威正一定命尊神斷滅邪怪無量度人今日校録諸天臨軒東方無極飛天斬邪滅怪神王長生大聖無量度人南方無極飛天斬邪滅怪神王長生大聖無量度人西方無極飛天斬邪滅怪神王長生大聖無量度八北方無極飛天斬邪滅怪神王長生大聖無量度人東北無極飛天斬邪滅怪神王長生大聖無量度人東南無極飛天斬邪滅怪神王長生大聖無量度人西南無極飛天斬邪滅怪神王長生大聖無量度人西北無極飛天斬邪滅怪神王長生大聖無量度人上方無極飛天斬邪滅怪神王長生大聖無量度人下方無極飛天斬邪滅怪神王長生大聖無量度人十方至真飛天斬邪滅怪神王長生度世無量大神並乘晨霞寶輿仙飈華光羽蓋驂衛三元官將十極仙靈建斬邪之節滅怪神旙前嘯洞真之曲後詠靈虛妙歌紫鸞玄鵠吟嘯相和天蓬啓途龍虎翼轅億乘萬騎浮空而來傾光回駕監真度生天關內宰火鈴上曹監察大魔威禁玄靈紫清主録監度大神執麾仗鉞大布威靈齊奉帝符檢録五行察制萬類造化靈司山河海嶽經緯星躔八溟九壘十二宮辰祛蕩祅忒乖沴之愆束縳惡精邪怪之形不得怠縱逸肆魔群元始告命勑使神兵斬邪無蠲開化生津保安正道回度劫輪真機變鍊妙氣敷榮人無疾橫神德合明永度世厄與天齊齡超出三塗絶離苦難越升魔界遨遊上玄上玄之天天帝鬱延無色之境梵行東方八方玉儀明度天帝忽坰題蘇寂玄通正天帝寥遙初輔覺鎮陽天帝秀丹琡觀始明運修天帝辨盈子通靈澤隨化天帝海光洞珠方洞曆皇天帝去害無盡京基耀光天帝波斯普臺紫麟召仙天帝福長生南方八天太妙鬱晨天帝寶䇿紫微頂光履真天帝道極祕呈存玄慶智天帝頓希谷仁傳靈滅魔天帝駢邾蕩魔顯生變身天帝隂穴露堪赤寶垂安天帝益鹿杳機錫禧祐明天帝冤婁莎庸洞光敬玄天帝何童歷聰西方八天神文示宗天帝玉棊上元虎裳世標天帝梵無延康遊真虛用天帝謁昌華龍正氣符剛天帝邈育規測神問封天帝宣幽述真奏功證道天帝運常明烈地薈冥天帝號希淵途誅怪通政天帝處彥那靈北方八天禁鎮百無利元天帝瓊敷仙髙宸泰微抃宗天帝鳳華飛綱洞志幽虛禮剛天帝文何德揚九回轉德思本天帝陀邈清晦俱息康存一天帝陽文子持北清總司天帝判皇極洞玄微察命天帝壽蒙資成鑒神按獄訊靈天帝望頥夷卿三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻五行之音五行之尊五行之神五行大魔五行之靈九和十合變化上清無量玄奧深不可詳敷落神真普度天人今日欣慶受度歷關諸天請滅怪惡斬絶邪源調運五行功參大元真王鎮御道氣開宣東極化木西極生金北極凝液南極激炎中極上宫合會四玄青帝衛生白帝斂德赤帝蕩祅黑帝收毒黃帝中王萬禍俱息木行大魔飛光寶龍火行大魔耀天紫童金行大魔返神會容水行大魔駕氣乘風土行大魔劫霞洞穹五行大魔萬神之宗部率神官出入幽冥橫戈擁甲萬騎雲奔統攝成伐與道同倫玉天開化察録神姧靈明通泰蠲却無前玉樞流擲烈鋭八延三將馳驅四帥揚幡攫天觸爓擊雷散煙敢有干試拒遏上真金鉞前戮巨天後刑掃除邪怪風火無停千千截首萬萬剪形魔無干犯鬼無祅精三官北酆明檢鬼營不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列言上清玄元妙紀五氣開皇眇眇大混混化微茫上施神華下布靈光纒綿元梵羅絡乾坤剛柔相感序列五行五行相運造育生成推蕩無滯和合歸真妙道彌綸運度自然五真流演升降回旋施養生化媾氣如泉五用順常萬類滋繁勝氣傍凌兼位而遷淫則為癘邪怪起源出為祟祅民物銜冤上帝勑斬敷落五篇赤書玉字八威龍文保制劫運使天長存梵氣彌羅萬範開張元綱流演三十二天輪轉無色周回十方旋斗歷箕回度五行三十五分總氣上元八景冥合氣入玄玄玄中太皇上帝高真泛景太霞嘯詠洞章金真朗郁流響雲營玉音攝氣靈風聚煙紫虛鬱秀輔翼萬仙五氣混合自然成真真中有神太極元君三天真老大混尊神太一司化三五神官執符把籙保度靈真上遊上清出入華房八冥之內細微之中下鎮五嶽上安九天中理五氣混合百神十轉回靈萬氣齊仙五行邪怪斬滅無干髙明紫微流轉諸天掌世罪福與道同玄仙道貴生無量度人炎炎五星飛天如輪下維九宫上開八門罪福禁戒宿命因緣普受開度五行生身身得受生上聞諸天諸天之上各有生門中有五行空洞之章真王靈篇辭參髙真第一化生五行飛空之音大梵未開無形無名二儀分兮位列五行東青西素南丹北玄元一中黃五氣相循各有主性與道變遷此為道根色質相連寶臺玉宮碧山金門上真仙聖無量帝君冥冥之中運合真神錦幡黃綬紫蓋朱輪皆真五色隨化成形息意冥一分化億千超度三界飛空結仙此道世莫知真王當普宣神霄數萬里金闕相輝鮮飛神恍惚間萬聖馳雲軿世途念流轉使我常哀憐何如向玄道妙本晤所歸邪怪盡淪息長居玉帝前第二斬滅五行邪怪之章天元太乙帝司主兵護衛世上保合生精華衣繡裙玉冠青巾青龍左列白虎右賔佩服龍劔五福之章統部神官三五將軍檢校隂湯運合元機五行邪怪莫不傾摧有邪必斬有怪必摧敷祐福祥啓悟希夷邪怪已消滅五帝降靈威護世過萬年帝德日熙熙黃龍下中天帝壽天所期神霄空洞章奏香緑姻飛第三和合五行歸身契道歌曰太虛玄妙神空洞幽無君生於渺漭中造化標元根淡漠居正性返照滅邪氛消魔怪害除沖融和至真昭昭智慧鋒威伐叱祅群五濁安能擾明輝華景形佩服靈寶章雲光煥爾身玉符鎮內景龍虎纏胎嬰水火金木交混一宗皇靈巍巍御絳闕冥冥理百精誰知年劫運長保無窮齡舞輪三界外翶翔登九清此三界之上飛空之中真王歌音音參洞章誦之百遍名度南宫誦之千遍魔王保迎萬遍道備飛升太空過度三界位登仙公有聞靈音邪怪滅形勑制地祇護度生民消拔禍難超越惡津七祖升遷永離鬼群魂度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈真王隱祕之音皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寶祕於玄都髙上神霄玉清王府東館藏室依玄科三萬七千年應運下傳若有至人齎金寶質心依舊格告盟玉清然後而付焉道言夫五行氣逆則淫僣自生隂陽勃亂則邪怪乃作乘節隨氣刑害乃興凡有此災至士皆當齊心修齋六時行香十遍轉經福德立降消諸不祥無量之文普度無窮道言夫五行衰絶則命數終盡三元愆否則元氣凋微末學道淺仙品未充運應滅度身經太隂臨過之時同學至人為其行香誦經十過以度尸形如法魂神徑上南宫隨其學功計日而得更生轉輪不惑便得神仙道言五行之氣出為邪怪則致天地運終星宿錯度日月失明四時失度隂陽不調國界不寧兵火時起疫毒流行兆民死傷師友命過皆當修齋行香誦經則五行邪怪之鬼聞經鎮制呼其姓名稱説根本因緣之狀叩首請命永不敢干經隱妙道及以真符無不禳却也夫齋戒誦經功德甚重上消天災斬滅邪怪保鎮帝王下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能為天地帝主兆民行是功德有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衛右別至人剋得為聖君金闕之臣諸天記人功過毫分無失天中真王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君撰元始靈書中篇東方八天橙俞離瓊律角冥外祺羅屈丹妙頴楚僅雲霏瑶閎利逸謹慧參鐸鶉房偃營生記珠煥陽甫符梁照昧巒格燕盡冒德施隨青鄙洛汶華光擇匱嬰環何容枳墩陸會南方八天曖曨奎常九暄柏枚漾朗冀泮琢英明住卜慮罄曜丘抨驛催救溢秉琅圖倨金夷渺歷定籌恆佑慈理涓浦牛童加那彥東梵珞祕思以龍伾轅覿綿炳懟金庭蕭仙西方八天鈕陶紀延洞留啓宣角𨇠東虛疾通敬湍招定純微益素廬全騰秉紹宣竺路亨慜濟幽欣淵文邦師瀆寥幾秦元布庸疑拳直野魔池振篇琅祈昆漠未腆靈恍完怖北方八天列晤亶定耿澄微萊鑑萌資條陽璉印部膽但瓊拂拯紀盈剔撰慈窺冥番波氐石仙潭碧洙友句肆亭聿琳序演粲調持屏閟㕓靚沐洋略扁飛雷族咸崖迹真皇微道言此諸天中大梵隱語無量之音舊文字刻書太極東臺喬城之上喬城為五行出入之墟以正分度經變造化順隆時符字皆廣長一丈天真皇人昔書其文以為正音有知其音能齋而誦之者諸天皆遣日直仙吏飛玄大神下觀其身書其功勤上奏諸天萬神朝禮地祇侍鬥大㓛真王保舉五辰道備剋得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成天真自然之音也故誦之致仙吏下觀上帝遙唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響十方肅清河海靜默山嶽吞煙萬靈振伏招集群仙天無氛穢地無祅塵冥慧洞清大量玄玄也元始無量度人上品妙經卷之五十三斬滅木宫邪怪靈符斬滅火宫邪怪靈符斬滅土宮邪怪靈符斬滅金宫邪怪靈符斬滅水宮邪怪靈符

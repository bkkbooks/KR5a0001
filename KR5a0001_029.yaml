front:
  text: 靈寶無量度人上品妙經卷之二十九玄九
  hash: sha256:d63d8845b15672ff7d7e6bc4c2fb0f593f47dd5f6152ee48a5c596654d5c0c18
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_029-001a, image: hfl/0006/0006-128.png}
body:
  text: 降真延壽品道言昔於始青天中碧落空歌大浮黎土受元始度人降真延壽至極道品元始天尊當說是經周回十過以召十方始當詣座天真大神上聖髙尊妙行真人降真延壽福德神王開化司命定生道君護人靈宰十方真神無鞅數衆乘空而來控辰紫清凌飊碧落丹霞薦輪緑景繞轅天蓋結瑞仙葆奏香神光絳彩六氣和積虛梵空無七日七夜諸天大聖髙真境界凝現宮殿譙闕光毫四飛法鼓仙音自然嗚響韻律清應萬穴千喁容神風飄搖日月騰照合辰雙景洞映九天星妃攀綱肆容玉帝建常攝氣萬方昭徹三界澡瑩一國地土山川林木溪澗洞海混離金色各有真仙正容拱立冕服其下遙瞻遐眄若有待期神闕穹樓巍碧聳黛天花雨飛錦繡敷圍衆真侍座元始天尊玄生萬寶天宫結珠翔龍之上說經一遍十方天真應聲降駕同時稱善為世學真長延壽命是時一國男女皆具六通變化自然說經二遍真念通格天皇俯降說經三遍湛海不波龍宮明現說經四遍天隕紺霜地生紫奈供養降真說經五遍業病性魔道中法結皆得玄通神智開爽說經六遍永住道梵不緣報盡而有退墯說經七遍能運心香遍諸仙國迎降十方三境天尊延壽度人說經八遍靜觀三界萬類衆生皆是天仙髙真應化法身立功護國降請真靈延壽度人說經九遍見諸雲林竒妙壇靖悉有上真降身說法延壽度人說經十遍欣樂讃禮實未曾有元始上帝躬宣法要為此群生延壽降真是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方降真延壽至真大神無鞅之衆浮空而至說經二遍南方降真延壽至真大神無鞅之衆浮空而至說經三遍西方降真延壽至真大神無鞅之衆浮空而至說經四遍北方降真延壽至真大神無鞅之衆浮空而至說經五遍東北降真延壽至真大神無鞅之衆浮空而至說經六遍東南降真延壽至真大神無鞅之衆浮空而至說經七遍西南降真延壽至真大神無鞅之衆浮空而至說經八遍西北降真延壽至真大神無鞅之衆浮空而至說經九遍上方降真延壽至真大神無鞅之衆浮空而至說經十遍下方降真延壽至真大神無鞅之衆浮空而至十遍周竟十方降真延壽至真大神一時同至一國男女傾心歸仰來者各執花幡寶衣珍果香林妙供讃詠而來奉禮元始天尊願聽降真延壽度人上清十方天人至真大神一國男女各自思惟天尊大慈開我冥暗顯示法要為下方衆生宣說道要請降上真增延夀命我等天人雖以道業進登天位而南昌上宫亦繫限數壽年雖永不過百千萬歲而未能出離三界保天長存身入無形不歷生死我今欣聞天尊首為太上道君出度人上法降感真靈真靈下濟延人壽命我等位登諸天益當樂信是法依教修行躋於聖道永不輪轉如是讃歎議說一切音聲遍十方界猶如隱雷風雨飄驟金石交音震動天地五嶽八海十二神山煙凝波湧獅子躑躅鸞鳳吟嘯龍澤霐池雲濤宛轉碧落薦瑞翠亰發光於是元始即於座起命侍真靈妃太極玉郎燔鬱單無量壽天蘭薇千和之香鼓動法音簫𥲀吸張匏箎遞舉顧眄十方告太上道君十方天人言降真延壽之法已居聖位竟亦為之真中有真此真主攝萬真為三界化主我今燔香頂禮以蘄感降真既降接神氣合真真神歸體壽命永延壽者天德之和道壽無數天壽有窮人壽無定地壽有終若能降真真與道通壽則無數所謂長生久視壽曆無極萬歲唉笑億齡合歡作是語已頂禮十方心拜道元忽覩空玄之中光輝遍溢碧玉遊宫鬱藹臺殿萬聖千真棲息其間往來雲霞驂駕龍虎遙矚鬚眉仰觀如畫明逾日輪熠耀上下金剛之氣園繞維正作二十四種殊絶異色出沒顯晦金青煥麗瑩等月珠元始登引天真大神上聖髙尊妙行真人十方無極降真延壽至真大神俱入遊宮之中上下天人俯仰瞻望惟見拂拂從寶樓瑶闥中八道而入既入遊宫不知所在國人廓散地雲柔軟軟若蹈綿纊天雨衆花雜色盈尺壅輪沒履香風洗空絳光流動元始即於神宮之內說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度延其壽年無有中傷傾土歸依咸識道真延壽延神延氣延靈延法延形延息延化延福延祥言無二情口無僞聲齊同慈愛異骨成親國安民豐劫劫太平經始出教一國以道預有至心降真延壽皆得度世道言元始天尊說經中所言並是諸天降真內名隱韻之音亦皆延壽內諱百靈之隱名也非世之常辭上聖已成真人通玄究微能悉其章誦之十過則玉清降真神霄命靈天帝誦之以延劫真人誦之以延神上聖誦之以延道仙人誦之以延曆諸天遙降十華俯庭河海澄湛山嶽深凝日月合景太儀眇清群魔束形鬼精滅爽回尸起死白骨成人至學之士誦之十過則五帝駐輦三官在賔上真接禮靈人造扃魔精竄伏鬼祅伏形濟病度死絶而得生所以爾者學士故氣已消神漸降真召制十方延壽千齡攝御地司泉曲令丞削落玄簡過度之名延期却死道備長生輕誦此章身則被殃供養尊禮門尸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉亰度人無量為降真延壽之宗巍巍大範德難可滕道言凡誦是經十過諸天齊到司命司録延壽益算南昌大神為其降真揚軒紫雲偃蓋下邁録其姓名注上生籍延壽無垠五鬼大殃注訟元辰不得干犯降真之人而好學至經功滿德就皆得神仙飛升金闕遊宴玉亰也上學之士修誦是經能降天真皆即受度飛升九宫世人受誦則感降神靈延壽長年後皆得作尸解之道神氣易形出幽入冥返閉天藏洞入無形此經微妙普度無窮一切天人莫不受慶無量之福延生保惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官降真延壽玉童玉女各二十八人營衛神文保護受經者身道言正月長齊誦詠是經感降東方九氣青皇帝君斷絶連注鬼役呼徵身得延壽度名青皇宫七月長齊誦詠是經感降西方七氣太素帝君斷絶殃考傷害沉痾無留身得神仙刻書黃籙白簡削死上生十月長齊誦詠是經感降北方五氣玄老帝君斷絶水禁冢墓訟刑風濕邪源追考生魂為國王帝主君臣父子延壽長年保天長存世世不絶常為人君安鎮其方國祚太平八節之日誦詠是經感降八景髙聖太上丈人斷絶鬼厲殟毒三十六瘵野道不行五酉逃形得延壽命為九宮真人本命之日誦詠是經感降六甲靈妃三皇道君斷絶行年太歲大煞凶害諸神不得干犯受道者身魂神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齊戒入室東向叩齒二十八通上聞二十八天心拜二十八過閉目靜思身坐青黃白三色雲氣之中內外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞渙室內項生圓象光映十方如此分明密呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齊清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引氣三十二過東向誦經元始無量度人上品妙經元始洞玄靈寶本章降真延壽妙微靈品十遍度人諸天隱韻離合自然混洞無形空相冥冥元氣未生孰有其真真者太空之中生化之主不變不易無壞無成金剛成體空得其真真為司命校録萬靈真為天尊布教留經真為寶皇福祿生民真為延壽為世種情真為益算布局命神如是天真為空中之神冥中之精道中之真赴念隨感珠輗鳳軿首建九色身御金青駕氣乘雲萬千吏兵為世延壽注上生名上無復祖惟道為身能降天真命筆日增過度九六神氣通靈無真不光無真不明無真不立無真不成無真不度無真不生是為大梵真中之真碧虛圓羅金闕玉城上極神風重霄紫庭真本非形若亡若存太霞玉宫中有至真大行梵氣周回十方中有度人不死之神中有南極長生大君中有度世司馬大神中有好生韓君丈人中有南上司命司録延壽益算度厄尊神降真延壽無量度人今日校録諸天臨軒東方無極降真延壽神王長生大聖無量度人南方無極降真延壽神王長生大聖無量度人西方無極降真延壽神王長生大聖無量度人北方無極降真延壽神王長生大聖無量度人東北無極降真延壽神王長生大聖無量度人東南無極降真延壽神王長生大聖無量度人西南無極降真延夀神王長生大聖無量度人西北無極降真延壽神王長生大聖無量度人上方無極降真延壽神王長生大聖無量度人下方無極降真延壽神王長生大聖無量度人十方降真延壽福德神王長生度世無量大神並乘景霄碧霞寶輦珠蓋彤輪驂駕神虎赤甲飛龍建九光之節八景靈幡前嘯天籥齊唱後吹仙籟同鳴辟邪斑虯悲號嘶嘶五帥啓途三界奉轅億乘萬騎浮空而來赴誠降駕延壽度生諸天丞相南昌上宮韓司主録監生大神執籙把籍齊到帝前隨所應度嚴校諸天普告三界無極神鄉司命之府延壽益算降真大神二十八宿北斗九元上解祖考億劫種親疾除罪殃播植生根髙真下應開度生門元始符命時刻升遷長生大君垂護形魂制魔保舉延壽南宮氣骨受仙道德化身生身受度劫劫長存隨劫輪轉與天齊年永度三官五嶽八嶽九幽超凌三界逍遙上清上清之天天帝玉真無色之境梵行東方七天靈書降真之氣起華蓋斗樞之下回行二十八宿之上在房宿二十七度左回貫四種民天下在日月之上散入諸天已次東行復位西北而止近世執法端門左右應數而下與風氣相接故通真感格須有徵應者此也太明護真天帝圓多羅絶梵猷靈天帝康期伯靈胡樂萃秀天帝茂純德盈紫丹明儲天帝丘無那洞霞育真天帝赤仰師和空玄歷數天帝仲光享波僑通諸普天帝翰童離南方七天炎輿正始天帝𦔳覺正功亰維霄明天帝蒲鈐宛宗慶符濮檀天帝薄滋師蒙隨文希度天帝耀明芝修長基樂玩天帝朝斯元堂祈華布容天帝元定黃髙凌代無天帝通孫章西方七天周俞平無天帝澄占回景炎太真天帝道無明維緑井數陳天帝除彥荒施牛羅普逝天帝時祇洞芝定梁惠宗天帝南白溫冝兆靈蘇寂天帝梵初光九微洞皇天帝知極用藏北方七天帝舒光淨天帝鬼都玉蒼紫儀寂化天帝叱羅焰千至定允理天帝醮生玉完光梵救智天帝圖定九空虎勤正部天帝十華竟多伯燕無原天帝部單憂婆道冥混杳天帝末都成盧二十八天二十八帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻天中之音天中之尊天中之神天中之真天中之靈分神降真和合氤氲真神髙尊降駕上清無量之奧深不可詳有知降真延壽度人今日欣慶受度歷關諸天注簡誠通徹感幽玄飛降九真泛景太玄三真監舉升入天門東斗主算西斗記名北斗落死南斗上生中斗大魁度人降真青帝奏書白帝破劵赤帝露文黑帝紀願黃帝開通道真合變青天命神越玄九冥赤天火鈴斬伐魔魂白天操戟嚴陳帝敕黑天總靈萬萬神兵黃天布氣列真齊至五天上真萬神之尊飛行三界驅役雷霆揚旗擲火九醜奔驚降真延壽福德安榮盡摧鬼鋒諸天齊功上天度人蕩滅北酆冥官鬼庭殺氣橫空仰降髙真五華蔚葱八海練淨六天沖融天帝按籍上𡖖典封紫皇注壽億劫齊終後役電吏前催驛龍敢有干試拒遏上真騁煙絳房舞輪北清真降玉符易質童嬰上偕帝友刻位丹瓊搖光熒熒碧杳萬程中列九宮協宸玉亰續益生氣靈機內營恍惚變化躬接仙真司命秉筆帝君授經壽命無窮萬神咸聽三界
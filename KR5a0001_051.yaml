front:
  text: 靈寶無量度人上品妙經卷之五十一宙一
  hash: sha256:bb5fa20fb59a5828b3c9620fdecfd5d2207dcd9f31eacb22c4289444e5cb4f8a
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_051-001a, image: hfl/0011/0011-004.png}
body:
  text: 消除疾疫保命延年品道言昔於青元天中飛景真音大玉洲土受元始度人消除伏疫保命延年無量上品元始天尊當説是經周回十過以召十方始當詣座天真大神上聖髙尊妙行真人無鞅數衆乘空而來素雲飛霞瓊軒鳳蓋紫霄流靄碧落騰光靈芒暐曄洞煥太無五日五夜諸天宫室臺館靈關七色交耀璇璣停輪三辰合照萬象咸寂地發嘉祥天現玉文法音遠響洞徹諸天三界肅清四海澄靜一國地土山川林木緬平一等無復髙下土皆作碧玉無有異色衆真侍座元始天尊懸坐空浮九龍寶局之上説經一遍諸天大聖同時稱善是時一國男女仰聽法音玄悟仙真之道説經二遍正性虛明説經三遍靈氣降身説經四遍蕩除業纍萬疾皆愈説經五遍六腑五臟灌鍊生華説經六遍飛精變形金光易骨説經七遍神妙備體常保完全説經八遍化周三界恩及十方疫癘普消人民康樂説經九遍幽魂升天冥官息對説經十遍萬精遂性逍遙太平是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊説經一遍東方無極無量品皇老大神無鞅之衆浮空而至説經二遍南方無極無量品太丹大神無鞅之衆浮空而至説經三遍西方無極無量品月華大神無鞅之衆浮空而至説經四遍北方無極無量品靈光大神無鞅之衆浮空而至説經五遍東北無極無量品帝暉大神無鞅之衆浮空而至説經六遍東南無極無量品雲綱大神無鞅之衆浮空而至説經七遍西南無極無量品伏魔大神無鞅之衆浮空而至説經八遍西北無極無量品髙清大神無鞅之衆浮空而至説經九遍上方無極無量品沖虛大神無鞅之衆浮空而至説經十遍下方無極無量品洞元大神無鞅之衆浮空而至十遍周竟十方無極消除疾疫保命延年至真大神一時同至一國男女傾心歸仰始者心有法病身遭邪疫三界之內一切群生無量天民或有身雖得道未脫冥數為隂陽五行六氣之所陶冶者各各思惟因緣所證得道果位法身真形應報種體三十六變出沒幽顯又有世間衆生曽為不善凌犯五方金木水火土官之考身纍疾疫或愚氓暗陋不順天道不知生理五行尅伏凌勃騰負鬱怫萬變水疫則寒火疫則熱金疫則清燥土疫則喘汗木疫則惙慓疾疫流行鬼癘為害如是等衆十二類生咸皆雲集匝繞座下既聞元始十過宣説靈寶飛天玄妙大範三界十方悉皆濟度飛仙列聖來者有如細雨密霧於是元始神光八出普映十方逺覽萬天再告天衆曰道非情言象光無偶近比人心倏來忽往變化莫測混雜難量謂之心者非真常也衆生昏愚積業重厚假心以知智緣智以體神神凝而體道若不知真人修用之理則心識鄙濁近連鬼道合以邪癘之氣則為疾為疫害其本年不全天壽能固氣於虛合神於無心為神宇神宇靜則精正精正則形完萬邪莫干疾疫不入身既無疾保命延年輔以道念栖泊自然玉符金篆服銜雲霞長生得道列為真人是時十方天人聞是語已感歎稱慶天光顯瑞神寶揚輝混元玄珠并包九有虛皇説經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸行善心不妄不貪不偽不著不執不非不為不見不護不戒言無華綺口無惡聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊説經中所言並是諸天上帝內名隱韻之音亦是魔王內諱百靈之隱名也非世之常辭上聖已成真人通玄究微慈念群彚隂營萬生使三氣明正五常順德消除疾疫保命延年若疫毒一身疫遍世土正心護氣積善纍功則南極監簿韓司録名禳解禍尤宥過紀績能悉其章誦之十過諸天遙唱萬帝設禮河海靜默山嶽藏雲日月吐華列耀佪精濕邪滅熾疾疫清平虎符金簡紀録功名鬼魔百毒斷種戮形天令順道正氣流行三官執奏翼衛神兵捕魂大理考校檢程賞善除祅益靈駐真至學之士誦之十過則五帝侍衛三界稽首魔精喪眼鬼祅滅爽濟度疾疫絶而得生所以爾者學士穢氣未消體未洞真以制十方威未制天政德可伏御地祇束縳魔靈但却死而已不能更生輕誦此章癘鬼傳殃供養尊禮門戶興隆世世昌熾與善因緑萬災不干神官侍巾典省天機獨步玉京度人無量為萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到億曽萬祖幽魂苦爽皆即受度天機上生韓司易名格皆九年受化更生得為貴人而好學至經功滿德就皆得神仙飛升金闕遊宴玉京也上學之士修誦是經疾疫無干神間氣真濁府散開邪試無門丹火內鍊骨變延齡皆即受度飛升南宮世人受誦則延夀長年後皆得作尸解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齋誦詠是經消除青疫九夷老氣尅害人身為上世亡魂斷地逮役度上南極太微天機省中超化升職七月長齋誦詠是經消除白疫六戎老氣尅害人身身得神仙諸天書名神霄玉府西華堂中金書青簡削死上生十月長齋誦詠是經消除黑疫五狄老氣尅害人身為國土帝主安鎮國祚保天長存世世不絶常為人君安鎮其方民稱太平八節之日誦詠是經安寧八景奮靈八威辟却八邪永無百疫三田生珠諸節通理血變瓊醴精鍊玉華得為九宫真人本命之日誦詠是經異氣不生疫疫無侵年命固永鬼怪潛靈魂神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎秉政天樞雲騎珠纓萬神朝禮參位太玄功滿德就飛升上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐赤青黃三色雲氣之中內外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右六甲六丁伏魔大將備衛前後日月照明洞煥室內項生圓象光映十方如比分明密呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人闕啓所言今日吉慶長齋清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引氣三十二過東向誦經元始無量度人上品妙經元始洞玄靈寶本章消除疾疫保命延年無量度人百魔隱韻離合自然太始無形召氣成真氣出無緣泮虛凝玄玄為氣母徊耀飛煙玉液鍊光金精八騫玉京嗟峩碧落凝旋三景轉赤九暈澄淵自成玉文無極至真三五九一是為天根元始祖妙靈寶生神溫厚滋養堅澤剛輪開明三氣化生諸天玄黃混淪金火相乘變化隂陽正邪乃分正為物宗守之長生邪為疾疫禍害遷騰惟知道真可以全身五臟真氣結為靈文無文不光無文不明無文不立無文不成無文不度無文不生上應圓羅天中之天鬱萃玄臺太皇玉京髙極無上玄虛紫宸眇眇劫仞若亡若存三華離便泰清黃庭金闕玉堂景素神池流布洞氣消滅萬殃清正瓊輪周回十方中有度人不死之神中有南極長生帝君中有消除疾疫大神中有太微天機省主好生韓君丈人中有南上司命司録文昌益算度厄保命延年上真回骸起死無量度人今日校録諸天臨軒東方無極皇老神王長生大聖無量度人南方無極太丹神王長生大聖無量度人西方無極月華神王長生大聖無量度人北方無極靈光神王長生大聖無量度人東北無極帝暉神王長生大聖無量度人東南無極雲綱神王長生大聖無量度人西南無極伏魔神王長生大聖無量度人西北無極髙清神王長生大聖無量度人上方無極沖虛神王長生大聖無量度人下方無極洞元神王長生大聖無量度人十方至真飛天神王長生度世無量大神並乘三景飛龍十華翠輦九鳳雲車流光玉輿驂駕神虎辟非蒼甲之麟建召真之節耀空靈幡前列六陽大將後從八史神兵九天飛真遊空步虛五老啓途群仙翼轅億乘萬騎浮空而來傾光回駕監真度生玉宸保相南極至靈上生監察金闕元君執籙把藉齊到帝前隨所應度嚴校諸天內保至真建植功緣仁恕忠孝不犯三官六洞無名過度冥關宿疾普消疫災不干邪鬼破腦四目當前衆聖降接保命延年普告三界無極神鄉泉臺洞府北闕冥關六天雲營火刃鐵山列奏神霄玉簡敷宣釋除疾疫穢禍凶愆上解祖考億劫種親疾除黑簿落滅惡根不得沉淪拘制鬼群虛皇詔命時刻升遷北都寒庭檢會神魂大魔保度升化朱宫死魂受鍊隨運長存生身受度劫劫無傾隨劫輪轉與天齊年永度三塗五苦八難超凌三界逍遙上清上清之天天帝玉真無色之境梵行東方八天玉歌耀宗天帝平羅景都帝歷鳳昌天帝真章紫洛皇離正化天帝瑶府宛鈞齊命登華天帝尹詵持明江宵遘期天帝覺逸景虛球度蘭瑝天帝杳寂司干永生久臨天帝越梵治行樞落左玄天帝承安止宫南方八天願極宗召天帝嶽司校靈并道指頥天帝屢遠茲晞太微機輔天帝回明庸康召真訊智天帝除膚究當普信注玄天帝問亨補冝龍光照生天帝祈堂紀逢沖妙延常天帝轉英集輪月諸慶號天帝赤津良西方八天壟化嬰如天帝並京攄光奧洞演于天帝樂宣無垠照幽洗翾天帝磧疆延祕俞極混天帝總監真影為窈空天帝初嗣百還玄度意冥天帝報朝何嵩茲芽雲藏天帝降籍司陽胄重欣盧天帝伯巫期將北方八天監明正化天帝安途定方太華上光天帝祕師九祥日貟攝圍天帝肇無辨黃絡霞崴天帝攴諦霜朱涵溢今天帝彭民踐區印格制魔天帝元真瀛攝京回布天帝斛亢禮淵神倉放遂天帝幽強宇元三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱文天中之樞天中之機天中之轄天中之輗天中大魔天中之靈玉天金闕中有至神布氣度人福及萬生九和十合變化上清無量之奧深不可詳敷落神真普度天人辟除毒禍禳解北辰犯忤大殺南極元尊消除疾疫保命延年今日欣慶受度歷關諸天請滅三惡斬絶地根飛度五戶名列太玄魔王監舉無拘天門東斗消疫西斗除愆北斗保命南斗延年中斗大魁主領元官八十一神總監衆仙青帝蕩疫白帝施教赤帝宣威黑帝開導黃帝中主萬神從詔青天魔王身佩帝書赤天魔王飛行太虛白天魔王萬惡潛誅黑天魔王統攝真符黃天魔王布令玄都五帝大魔萬神之宗執天大範總領鬼兵麾旙仗節遊觀太冥神化無方與天同生上天度人嚴攝寒庭元王受命普掃祅祥疾疫莫作正氣流行生民自牧却滅禍殃命如山河福等昊蒼天師寶符玄靈大章龍文虎檄追召魁剛屠割鬼爽風火無停千千截首萬萬剪形魔無干犯鬼無祅精三官九都考察鬼營不得怠縱金馬驛呈化周無窮符告萬靈上宫玄宰飛奏帝宸無極髙妙耀華洞清氣生芳澄天地備成神運變化風火交騰精鍊九劫水躍龍門雲凝玉堅天闕九關瓊觀寶樓萬神守垣九絶明耀朱符召仙日揚九光月吹十霞五斗回車天英蘊蘭帝妃泝香玉真踞軒五老授職三官迅軿保民無疆吉慶如山真元吐氣金馬當前泛霄隱庭奏鐘舞津正道流行疾疫莫登命曆益算壽年億千五方天使虎巾龍官咸領制劵歸造真玄丹輝啓明運周自然元皇大布靈寶玉篇赤書五符八威正文保安大劫使氣飛行大梵色羅萬品施張元綱布演無極諸天輪轉無色周遍十方騰駕扶搖旋歷經常消除疾疫五方之神天溫六傷却以洞文災怪消殄毒害絶源天機奏名玄軌交纒二十五氣歸功上元八羅冥會合混玄玄玄中太真天帝髙皇泛景太霄吟引宸風金昌明秀消蕩祅凶豁落奮
front:
  text: 靈寶無量度人上品妙經卷之三十三黃三
  hash: sha256:c0826032e8435b8bc0222bf5de3285f1c19b40a0cf780b797b7f11376e6f749a
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_033-001a, image: hfl/0007/0007-098.png}
body:
  text: 五方正氣品道言昔於始青天中太明混洞上宫寶華靈闕無為大慈廣生玄妙虛清道境上干浮光元化混沌九微八關俯跨碧落太空星輪景耀之精中有真王號舍運樞道力自然功位髙玄中有妙寶神山連延天內有五方天尊紫霄光明飛霞之闕官將百萬民衆千億壽無窮期氣如長春雜萬花色以為光明瑶海朱鬐緑斑之龍常御九真玄玉之輅以奉玉帝此天五方正氣所生五行之精順天常道不為囚尅是謂真一元氣萬物之宗為瑞為寶非如隂陽交爭之氣生合離殺長育虧殘而無常也元皇大慈化此真境五方天尊間居寶座吹噓正氣採咽華根流波逺蔭逮於天界天得正氣圎蓋不傾地得正氣海嶽平寧帝得正氣道運太平人得正氣為世賢良慕道求仙上輔正化無所不真元始天尊當説是經周廽十過先向五方召命五方天尊東方九神太洞玉真天尊南方三華上極丹光天尊西方五明太真金耀天尊北方一真洞隂寶鏡天尊中央瓊華黃景微妙天尊五方天尊敬奉玄旨泛駕黃輿丹靈之輦三素飛雲龍鶴羽葆仙官執典天騶啓途來如迅風流鈴煥落雷火耀天十方無極世界悉皆震動一切天人咸知元始召命五方道主願聞真一之氣無等上妙大法五方天尊稽首作禮元始垂眄俯視以召十方始當詣座天真大神上聖髙尊妙行真人無鞅數衆乘空而來明耀流暉玉輿虹輪彩霧蔽空靈光靄華神煙密羅寶雲疊霞風煙澄息和氣彌羅土化堅剛湛如金魄衆真侍座元始天尊玄坐空浮天闕雲山妙光瓊臺之上説經一遍諸天大聖同時稱善是時一國男女初受真道靈慧虛通説經二遍心契妙微永無湮沉説經三遍五方正氣灌育華根説經四遍玄光流景映耀身形説經五遍赤書玉綱纏塞死關説經六遍福被普天慶瑞咸臻説經七遍四氣調和萬物豐昌説經八遍品彚生成保固無殃説經九遍邪精滅根魔害不行説經十遍老復壯盛少者永延是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊説經一遍東方無極無量品蒼精正氣至真大神無鞅之衆浮空而至説經二遍南方無極無量品丹精正氣至真大神無鞅之衆浮空而至説經三遍西方無極無量品皛精正氣至真大神無鞅之衆浮空而至説經四遍北方無極無量品紫精正氣至真大神無鞅之衆浮空而至説經五遍東北無極無量品鎮精正氣至真大神無鞅之衆浮空而至説經六遍東南無極無量品炎精正氣至真大神無鞅之衆浮空而至説經七遍西南無極無量品華精正氣至真大神無鞅之衆浮空而至説經八遍西北無極無量品玄精正氣至真大神無鞅之衆浮空而至説經九遍上方無極無量品虛精正氣至真大神無鞅之衆浮空而至説經十遍下方無極無量品幽精正氣至真大神無鞅之衆浮空而至十遍周竟十方無極天真大神一時同至一國男女凝瞻元始與五方天尊妙極玄微見大神變九色光明遍照十方世界一切國土即各相謂共目攜率齎持妙香珍寶竒花天衣幡蓋自十方來舉此種種珍竒妙供陳於天尊座前徘徊宛轉化成寶蓋百億珠玉百億結綬百億繒綵百億紋繡百億神竒百億光景遍於諸天所有世界如是男官女衆咸皆敬禮仰聽元始天尊宣揚靈寶大法無量度人五方正氣之道瞻望聖顔一心歸依爾時五方天尊五老上帝侍立元始天尊法座之側元始天尊舉身正衣良久復坐於是紫金神光從面門出此光暉耀與諸光明如相經緯縱橫微妙萬種華炫一一天人不由心目外見天尊安如寶山內見己身三一九宮諸境玄府光氣無極自下徹上自上徹下從東達西從西達東交射灌激聖變神化難可比倫元始告大衆曰今當度人説五方正氣護生萬有之法得吾正氣皆證妙道為諸天仙真十方之聖利益世界演説大法使諸天衆生聞道藴奧五方天尊環繞寶座各放大光暉耀世界猶如千日照徹諸天九萬億土天人宮殿帝王臺觀與光所照森然俱見無有隔礙是時諸天各於光中顯示正氣大道自然凝化相狀近可指矚天於光中各有玉書五篇真文炳煥張布屈曲飛動鎮召禳制普天安寧東方正氣晨光九羅素景徘徊碧壘鬱霞南方正氣紫雲沓煙朱丹三精生化億千西方正氣明石太素光芒凝化非煙非霧北方正氣玄闕飛精雙皇太微包羅玉清中央正氣上玄寶洞妙變盤結化成龍鳳五方正氣無量形相懸在太虛之中各飛瑞光灌元始耀明火玉如意之上迤邐盤匝五色混成大如朗日通含五方所見物象元始登引五方天尊天真大神上聖髙尊妙行真人十方無極至真大神無鞅之衆俱入五色混成圓光之內説經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法各受正氣道心開悟見生化門知道宗祖普得濟度全其本年年極數窮升入太空脫離生死與正氣俱存示身千億變化空常靜而為虛動而為形普應十方道同列聖識心如幻無作無為普濟萬生永斷輪轉有形安泰愛利俱忘正氣入身與化冥一離諸疑網習染解脫飛形太虛為天種民言無華綺口無惡聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊説經中所言並是諸天至尊五方正氣內名隱韻之音亦是三寶皇君丈人內諱百靈之隱名也非世之常辭上聖已成真人通玄究微能悉其章誦之十過召致五方正真之神化鍊結節靈感胎真東方正氣為英明文華清淨儀矩髙賢仁恕仙真之應於物為寶玉魂竒珍禽瑞獸希世之祥南方正氣為明慧禮制辨哲爽越命令布政輔弼尊神之應於物為丹華工麗艷妍色雘經畫之事西方正氣為義決剛別堅正果敢介守敕法大神尊官之應於物為介甲金石牢革牙角防鈴兵刑之象北方正氣為敏贍智數機謀變通玄化為真毋后太一隱靈之應於物為修蛇玄黮委曲怪異伏藏鬼神之符中央正氣為尊德祕道寬厚博容廣大碩學輔化帝王君主崇髙神聖之應於物為沖融柔順坎下盈滿逺隆甘和之驗遇正氣者上為帝仙中為宰牧下為賢德為長生為吉祥為福慶故誦詠此經諸天齊唱萬帝設禮正氣來集淵澄嶽靜日月合照璇璣歷天魔爽喪壞尸骨還生至學之士誦之十過則五帝侍衛三界稽首正氣臨斗鬼祅滅形濟度垂死絶而得生所以爾者學士思神致真坐招正氣生命遇之則貴極仙真召制十方與天為一五氣齊靈中粹發華福德自生輕誦此經身則被殃供養尊禮門户興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人無量為萬道之宗巍巍大範德難可勝道言凡誦是經十過五方真氣齊到以之治身則仙化長生使丹靈氣備以之生物則堅大瑞美煥偉靈異以之治人則明譽公端凛然超舉以之通鬼神則億曾萬祖幽魂苦爽皆即受度上升朱宫正氣所挺五方同真格皆九年受化更生得為貴人而好學至經功滿德就皆得神仙飛升金闕遊宴玉京也上學之士修誦是經五方正氣入身愚變為智俗化為賢賢則得道道成而仙為聖為神氣之正也為祅為孽氣之邪也皆即受度飛升南宮世人受誦五方天尊正氣之光照其真形則延壽長年後皆得作尸解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齋誦詠是經五方天尊登玉寶青華之闕布行五方正氣治化三界為上世亡魂斷地逮役度上南宮七月長齋誦詠是經五方天尊登朱陵丹華之闕布行五方正氣治化三界身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經五方天尊登紫雲瓊圖玄真之闕布行五方正氣治化三界為國土帝主安鎮國祚保天長存世世不絶常為人君安鎮其方民稱太平八節之日誦詠是經五方正氣周回八方還朝帝一化生萬靈得為九宮真人本命之日誦詠是經五老上帝下鎮五臟五方天尊口吐正氣入兆命宮絳府泥丸真道自然魂神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黃白三色雲氣之中內外蓊冥五方真氣繞絡身形光明洞耀有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室內項生圎象光映十方如此分明密呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齋清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引氣三十二過東向誦經元始無量度人上品妙經元始洞玄靈寶本章五方正氣十廽度人諸天隱韻離合自然玄漠無垠妙氣生根沓如紫煙分為三華玉清離便大有纏羅升過玄門盤結浮沉天元正道化為玄亰隂抱至陽陽合其真隂陽會化玄生其神神化為氣氣化為靈化無體狀至用圎成發生之氣髙祕黃庭神池絳淵色凝嬰丹旋轉浮遊上下無方黃老潛養道體居常東青西素南赤北玄中有寶皇正氣自然五方之神神運綿綿巡環周流雷動雲奔五帝授符五老合魂天光無象太朴混淪英芒晃耀靈液其滂物得之生鬼得之靈神得之明人得之仙天得之清地得之寧上分三界下列九泉風動虛清變化行天希夷正氣皇道開宣肇自天真幽微之君玉冠錦襡碧鳳飛裙乘駕九龍役御千官布行正氣運植五方沖氣所鍾為仙為靈時為尊賢用宏紀綱以之授形為物之英悉感正氣變化神真至真無形大象流精眇眇劫仞若亡若存琨琛麗房琪花妙庭紫戶玄關森羅浮霐五暈正氣周回十方中有太上三素之君中有上聖清毋之神中有太微玉帝之尊中有胎元帝一之君中有道德五方丈人中有主録主籍主生主化主變玄道尊神廽氣儲正無量度人今日校録諸天臨軒東方無極飛天正氣神王長生大聖無量度人南方無極飛天正氣神王長生大聖無量度人西方無極飛天正氣神王長生大聖無量度人北方無極飛天正氣神王長生大聖無量度人東北無極飛天正氣神王長生大聖無量度人東南無極飛天正氣神王長生大聖無量度人西南無極飛天正氣神王長生大聖無量度人西北無極飛天正氣神王長生大聖無量度人上方無極飛天正氣神王長生大聖無量度人下方無極飛天正氣神王長生大聖無量度人十方至真飛天正氣神王長生度世無量大神並乘化真九光丹輪之輿炎飊紫霞神虛之輦彤彩耀光百神之蓋五精天德大力之幢驂駕朱虯玉龍建萬天十華之節洞神招真之幡神獸夔龍悲鳴躑躅青鳳紫鸞翔騰飛翥前詠八素九陽之歌後吹六籥虛生之曲神虎钁天奔躍辟邪五老啓塗羣仙翼轅億乘萬騎浮空而來傾光回駕正氣度生中皇內弼元斗右宮紫垣太極妙通大神攝氣監真合會髙玄徘徊升降周歷虛圓敷告八冥幽微之關上極玉羅太空靈尊下該九壘洞淵之源運道正氣鍊化神仙五方大神玉司之官施生布養法道而行變凡入聖易骨超騰恍惚通感大混帝門北都寒池部衛形魂氣聚神生命出自然挺植正氣度品南宮死魂受鍊仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度三塗五苦八難超凌三界逍遙上清上清之天天帝妙和無色之境梵行此為五方正氣之天從角宿一度一杪半起經五星之分流演同法正行黃道不犯傍綱上稟皇極専行正氣四方各有二天配屬中央土位土無正形各居四方同會於正五方施化為造物之主得
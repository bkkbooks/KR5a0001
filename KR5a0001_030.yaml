front:
  text: 靈寶無量度人上品妙經卷之三十玄十
  hash: sha256:86c1ef51dc7294c6cdc4a7cf55282a36df7a641640cff1522707b80022c27f87
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_030-001a, image: hfl/0006/0006-168.png}
body:
  text: 斷絶胎根閉塞死戶品道言昔於始青天中紫清玄洞五明華宮受元始度人斷絶胎根閉塞死戶無量上品元始天尊當説是經周回十過以召十方始當詣座天真大神上聖髙尊神霄玉清真王太上消魔玉清神王扶桑青華帝君後聖金闕帝君萬天帝主無鞅數衆乘空而來飛雲丹霄緑輿瓊輪羽蓋垂蔭流精玉光五色鬱勃洞煥太空九日九夜諸天日月星宿璇璣玉衡一時停輪神風靜默山海藏雲天無浮翳四氣朗清一國地土山川林木緬平一等無復髙下人皆悟道成法土變作碧玉無有異色衆真侍座元始天尊玄坐翠浮玻璃靈陽實座之上説經一遍萬天帝君同時稱善稽首再拜咸得見道是時一國男女死者復生生者悟道説經二遍鳥獸介蟲皆得長生説經三遍四時和平無有寒暑説經四遍星宿日月天界停住無復東行説經五遍疾病沉痾並獲痊瘥説經六遍地土平正祅塵自潰説經七遍五行皆一混合天成説經八遍娠胎皆出芽蘖甲坼已生未生立獲生成説經九遍善惡無迹心歸正化説經十遍華夷一等無有邪僻是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊説經一遍東方扶桑青華洞境至真大聖無鞅之衆浮空而至説經二遍南方赤靈陽光洞元至真大聖無鞅之衆浮空而至説經三遍西方素景皓靈洞扶至真大聖無鞅之衆浮空而至説經四遍北方玄靈至妙洞化至真大聖無鞅之衆浮空而至説經五遍東北上靈通理洞妙至真大聖無鞅之衆浮空而至説經六遍東南鎮靈體元洞神至真大聖無鞅之衆浮空而至説經七遍西南耀靈瑩空洞徹至真大聖無鞅之衆浮空而至説經八遍西北華靈統化洞逺至真大聖無鞅之衆浮空而至説經九遍上方神靈普變洞觀至真大聖無鞅之衆浮空而至説經十遍下方靜靈化生洞慧至真大聖無鞅之衆浮空而至十遍周竟十方無極天真大聖一時同至一國男女傾心歸仰來者有如黃霧蔽密瑞煙雜沓無鞅之衆迮國一半土皆偏陷非可禁止於是元始內發心光外飛神氣上出泥丸火光輝耀遍於十方天界然後收光返照歸本聚氣變成寶珠狀若露圓去地億數萬丈元始登引天真大神上聖髙尊諸天帝主十方無極至妙神靈大聖無鞅數衆俱入寶珠之中天人仰看惟見勃勃從珠口中入既入珠口不知所在國人廓散地還平正地復元色無復碧玉元始即於寶珠之內説經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得長生全其本年無有夭傷傾土歸仰咸行善心不妄不貪不滿不盈不傾不敗不去不來不住不見心無妄想身無邪欹齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊説經中所言並是諸天上帝至靈神王內境妙道變仙化形隱祕之音亦是上帝內諱萬神之隱名也非世上之常辭上聖已成真人通玄究微能悉其章誦之十過諸天遙唱萬帝設禮河海靜默山嶽藏雲日月停景璇璣不行群魔束形鬼精滅爽回尸起死白骨成人至學之士誦之十過則五帝侍衛三界稽首萬神護法百靈祐身濟度垂死絶而得生所以爾者學士穢氣未消體未洞真以制十方威未制天政德可伏御地祇束縳魔靈但為常文未通微妙即却死而已不能更生輕誦此章身則被殃供養尊禮門戶興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉亰度人無量為萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到億曾萬祖幽魂苦爽皆即受度飛升朱宫皆得鍊形受化更生復為至人而好學至經功滿德就皆得神仙飛升金闕遊宴玉亰也上學之士修誦是經皆即受度飛升南宮中學之士修誦是經無有生滅去來快樂得升仙籍下學之士修誦是經即得神魂爽利疾病消除住世長年此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖罪及爾身長有天官侍香五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齋誦詠是經死戶立閉胎根斷滅形神微妙飛升南宫七月長齋誦詠是經身得神仙諸天書名金簡玉符召魂通微得獲長生十月長齋誦詠是經為國王帝主君臣父子安鎮國祚保天長存道玄不絶永斷劫運安鎮其方民稱太平八節之日誦詠是經得為九宫真人本命之日誦詠是經魂神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十六通上聞三十六天心拜三十六過閉目靜思身坐紅黃紫三色雲氣之中內外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月映照光耀洞空洞煥天地項生圓象遍滿十方如此分明密呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齋清室修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引氣三十二過東向誦經元始無量度人上品妙經元始大洞徊風混合本章上品妙首萬變度人千真隱韻離合自然太極玉文洞神上真元始祖劫開化諸天翕闢隂陽是生萬彚自然大道上無色界下無色根虛無渺漠惟道為身五文開廓普植神靈無文不顯無文不靈無文不動無文不明無文不化無文不成是為上清玉晨之天九霄梵氣蘂笈靈臺金闕玉京上極無上大羅聖境虛無寥廓若隱若存七景華房九變龍庭昌明玉閣紫微天霐純陽梵氣遍徹十方中有南極長生大君中有玉清消魔神王中有扶桑青華帝君中有好生韓君丈人中有南宮度人解厄定命天尊中有南極宫中慈仁通化真君回骸起死無量度人今日校録諸天臨軒東方無極青華神王長生大聖無量度人南方無極赤靈神王長生大聖無量度人西方無極素景神王長生大聖無量度人北方無極玄妙神王長生大聖無量度人東北無極保命神王長生大聖無量度人東南無極集慶神王長生大聖無量度人西南無極寶輪神王長生大聖無量度人西北無極梵氣神王長生大聖無量度人上方無極橫天神王長生大聖無量度人下方無極鎮壘神王長生大聖無量度人十方至真威德神王長生度世無量大神並乘飛天六龍雲輿九華寶輦翠蓋雕輪毛節朱幢驂駕鸞鳳跨馭金龍建降魔辟非五方靈節持除禍賜福四神靈幡前嘯靈璈泛景後吹簫瑟齊鳴獅子白鶴嘯唳嗈嗈太乙侍從真王翊軒億仙萬衆從空而來迎衛寶駕恭慶靈音統法持文諸天靈魔上相主宰天真神王南昌上宫韓司主録監生大神執籙把籍齊到帝前隨所應度嚴校諸天普告三界無極真王神霄玉府扶桑華宮三清九霄億兆天界百萬仙國上解祖考億世萬劫惡籍罪簿消滅惡根不得拘留道合仙真元始符命普率九埏南靈火光度越靈魄北府真符解脫幽魂神王保舉超生南宫死魂受鍊仙化成人生身受度劫劫長存隨劫輪轉與天齊年鍊尸聚氣保護胎仙內境泛光定息收玄永斷死戶纒鍊幽關超凌三界逍遙上清上清之天天帝玉真神霄之境梵行東方九天重華文朝天帝照泛叨景六晨泛景天帝定玄耀明至真極瑶天帝浮羅永延上靈元化天帝大元辰并曲鼎號都天帝勝金生光瓊瑛泛景天帝有提辨論七晨扶明天帝苑育飛衡推虛動神天帝昔齊浮黎樂化自宥天帝冕更容曦南方九天晃朗赤梵天帝元競錦霓惠正輝奉天帝擁愛加吟妙音飄颻天帝號施幸綿華離正定天帝呼立機成宣景六虛天帝整婆阿貪化形度敬天帝勃負孜真龍希幾遍天帝從扶鄉輕陽廓曠晞天帝緬移神機錦文絢赫天帝景束梵寧西方九天皓渺舒蕩天帝握林俯極倐揚始平天帝影浮金華落塵普盛天帝執翁施零蘂庭皇威天帝粵拂思誠元舉星瓊天帝顯加膺象龍政委恩天帝運嘉玄康快樂敷變天帝欲化無垠逍遙請福天帝豁落行夷旻景扇飊天帝動鬱蒼題北方九天玄明證赤天帝石育俯昌遠揚緑霄天帝浮纏方渶元漠誓訓天帝順通兮凝臨蒞物成天帝目羅景輪政理分化天帝範擲俱重誘黎汞勝天帝拱越林夷馥明大普天帝嚴度丹霞續區廣蒙天帝棟零延祺玉元淵淨天帝景大羅長三十六天三十六帝諸天隱祕萬天隱名天中玉文大梵靈章三天密諱天中神音天帝髙尊天真神王上相大魔靈文玉音回風混合鍊尸飛升無量之奧深不可詳守雌抱雄是為神真普度天人今日欣慶受度磿關諸天請滅三惡斬絶地根飛度死戶名列真仙魔王監舉無拘天門東斗監生西斗除殃北斗輔靈南斗化魂中斗成真總監衆靈青帝育生白帝守神赤帝升氣黑帝流光黃帝靜中萬神祐身青天魔王辟穢受形赤天魔王內寶神真白天魔王却邪輔正黑天魔王監持護法黃天魔王守衛萬靈五帝大魔萬神之宗飛行一身總貫泥丸藏氣元精澄神安鎮坐觀太空自號赤符諸天上功元始度人皆稟生宫神嬰受化普掃胎根斷除血穢閉塞死門流精反聚俱入妙庭天魔接引上升玉都屏除瘴癘鬼毒祅精天丁前驅大帥仗旙擲火萬里流鈴八衝敢有干試拒遏上真金鉞前戮臣天後刑屠割鬼爽風火無停千千截首萬萬翦形魔無干犯鬼無祅精七魄寧謐三尸速奔外營百關內保萬神白虎守芝青龍纒液普告無窮萬神咸聽三界五帝列言上清玉晨寶曆會玄神章龍漢開劫降自華房混沌九變斷滅邪亡戶戶即開上無道境下無道基生死之道玄牝之門惟神與氣散聚無停內觀元神反本方成回風死道復入生門還巡泥丸遍歷精門三十九戶戶戶可死閉之即生生從何戶戶戶即開閉之不出可以長生名戶即穴實穴即精神氣交會龍虎固根血凝神聚不散乃成散之無窮不可名成氣壯滿溢通徹泥丸流布丹田升降反嬰有出有入有死有生不出不入斷戶除根斷除之道以火鍊精安鎮其戶胞凝血根陽施隂化流響扇營上應天關下集百神實乃丹精閉即神英七星分散飛行隂房二儀攝氣流迹陽光分之既停隂陽交并以赤入黑變黃成紫精華流暢血穢殄平上納下奔死道未降赤霞遼繞瓊漿混迎上和下合自然成真胎根既存道成正生根斷乃仙名列南宫父母胎孕化體成形散之即氣聚之有名聚散為根斷之長存與道合真天機祕密洞徹萬靈三天龍篆元始玉文赤書玉字錦符朱囊洞妙泛景保劫運延梵氣彌羅萬範開張元綱流演三十六天輪轉無色周回十方璇景歷機回度五常三十九氣總禦一身八方冥合氣勝乃生玄中妙理斷絶胎根死戶周密得道成仙泛景太霞嘯詠洞章金真朗郁流響雲營玉音攝氣靈風聚煙紫虛鬱秀輔翼萬仙歸正合符鍊之見真真中有神長生大君消魔神王紫微元君無英公子髙玄真人執符把籙保命生根上遊上清出入液房明梁之內神化之中下鎮人身絶塞死根結胎五氣混合百神七世回靈萬真靈輝神風飊粲仙道貴生無量度人上開生門飛天法輪日月植根安固黃庭宿命因緣普受開度仙化生真身得受生上聞諸天諸天之上貴此仙門中有大洞消魔之章玉清靈篇道御髙真第一髙上神霄玉清王靈祕之音元始浩劫玉清靈文迷塗悟解洞徹真空天仙所愼祕久不通斷絶死戶直入生門三尸殄滅五斗束魂血化成精反此神嬰七祖受庇百神咸寧出有入無安鎮黃庭上保泥丸中理玄津下流丹田百關息封內體充溢我道乃成第二太上消魔玉清王隱韻之章天之大隱寶明梁塞下戶愼之祕元都結胎却生死守雌抱真一是為長生路斷絶生死根持握九命門仙庭回九變神聚反嬰童上無億劫祖惟道化爾身顒顒三境文過之即神丘披雲散紫煙離合由景輪禁戒非可言流光聚泥丸正氣召萬神滅尸七孔隂神華耀日英三素飄雲營回風扶晨景真源六虛靈太微轉日月度魂飛玉亰混沌生太漠故曰玄歌音第三扶桑青華帝君歌曰萬象化體百神歸根物備乃靈惟形與身大道之本是為玄精內觀即見外境隱停無此上道保生長存默誦萬過混合天成血穢斷除消滅惡根仰徹仙位超度南宮迷悟不解永沉鬼倫天籍祕語丹華杳冥南和握節北極守靈金氣入三界玉髓通九門帝一混合真無顯亦無明此三界之上玉文之中真王歌音音參洞章誦之百遍名度南宫誦之千遍斷絶死門萬遍道備飛升太空過度三界位登仙公有聞神音千真祐形敕制地祇侍衛送迎拔出地戶五苦八難七祖升天受事九宮魂度朱陵鍊尸更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈神王玉清真王隱祕之音皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寶祕於神霄玉清王府東壁經室華堂依玄科六萬劫一傳若有至人齎金寶質心依舊格告盟三天然後而付焉道言夫天地運度亦有否終日月五星亦有虧盈至聖神人亦有休否末學之夫亦有疾傷凡有此災同氣皆當以已鍊形受化濟度十過轉經移神駐氣復得更生無量之文普度無窮道言夫末學道淺或仙品未充死戶未閉胎根尚存運應滅度身經太隂臨過之時同學至人為其開神敷經攝氣傳道以度尸形如法魂神徑上南宫隨其學功計日而得更生輪轉不惑便得神仙道言夫天地運終亦當修齋行香誦經星宿錯度日月失昏亦當修齋行香誦經四時失度隂陽不調亦當修齋行香誦經國主有災兵革四興亦當修齋行香誦經疫毒流行兆民死傷亦當修齋行香誦經同學命過亦當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎮帝王下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能為天地帝主兆民行是功德斷絶生死超凌仙宫有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衛右别至人尅得為聖君金闕之臣諸天記人功過毫分無失天中魔王亦保舉爾身得道者乃當洞明至言也諸天中回風混合隱語無量音道君撰元始靈書中篇東方九天華明會竒耀魔赫奕玄精散妙絳英緑飛禮俯呼嘉泛屏境冝馥郁洞杳回禦泛輕靈褾煥麗蕩蔚薈陵納汚成灑慶集霄零尚佳那育冒曲萬亰叨回景鬱伐緬沉煙翼紀角纒六度虛玄南方九天嚴俱慕因光捍香披赫火吞霞梵氣九疑攝機泛陶龍遍赤旗枝離亢鬱林峯內希慶眇雲羅玉附化尸停升霽表揆徹永延澤逺紅輪覆明持圓廓靄敬連繡落明機定察并房大液浮黎西方九天定希交粹宛陵咎基靡恪凡潤幸施緑離指益繁影靄雅同遲空蕩巘訥干施惠文托落標由尋蘇延施潰緑首辨力轉回真迎照童苴倚母幾𡎘皓仰塗府彼億真庭究本知源翼生浮靈北方九天坤符握節炳煥太霄摛兊侵氐擇邈玄標都浮偏漠氷蓊虛林既魄見素齊叱封吟渠因劫奕晏勳加明綱演覆壁闡發輝停執符煥麗賂神保寧氣氤紫秀顯微徹升通神妙空徑曉成人道言此諸天中大梵隱語無量之音琅書玉文皆龍文丹篆寶篋玉函祕於東華堂金縷寶花瓊瑶浮光萬象神藏之中神霄玉清真王扶桑音華帝君皆知其音以傳其文能齋而誦之者諸天皆遣飛天神王持經神吏下觀其身書其功勤上奏諸天萬神朝禮地祇侍門玉清消魔神王保舉上仙道備尅得超度玉亰升入金門此音無所不通無所不降無所不度無所不成天真自然之音也故誦之致飛天下觀上帝遙唱萬神朝禮三界侍軒五帝侍迎鬼精自亡琳琅振響十方肅清河海靜默山嶽吞煙萬靈振伏招集群仙天無氛穢地無祅塵冥慧洞清大量玄玄也無始無量度人上品妙經卷之三十

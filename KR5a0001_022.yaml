front:
  text: 靈寶無量度人上品妙經卷之二十二玄二
  hash: sha256:def3f3d51145790c0af7f0fbff738ac0ceab468d7e422cd59e5df97bba5669aa
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_022-001a, image: hfl/0005/0005-046.png}
body:
  text: 飛神召靈品道言昔於始青天中九華塋徹靈明扶宫受元始度人飛神召靈無量上品元始天尊當說是經周回十過以召十方始當詣座紫清仙界梵氣靈音三天道主玉宸聖君諸天上帝金闕髙真無鞅數衆乘空而來飛雲丹霄緑輿瓊輪羽蓋埀䕃流精玉光五色鬱勃洞煥太空三日三夜諸天日月星宿璇璣玉𢖍一時停輪神風靜默山海藏雲和氣遼繞紫務氤氲天無浮翳四氣朗清一國地土山川林木緬平一等無復髙下土皆作碧玉無有異色衆真侍産元始天尊玄坐緑霄回旋泛光碧玉寶座之上說經一遍諸天上帝稽首言善法始出世人皆見妙理說經二遍三界萬天歸仰讃歎人獲長生說經三遍數出五行無有生滅說經四遍外境湛然內境明悟說經五遍生路可開死戶立閉說經六遍氣序和平四時混一說經七遍生死快樂無有窮已說經八遍悟解妙法得升仙境說經九遍鳥獸草木咸得盡數不被夭傷說經十遍幽魂滯魄久沉地獄皆得解脫是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方明耀十天帝君從吏神兵無鞅之衆浮空而至說經二遍南方赤明十天帝君從吏神兵無鞅之衆浮空而至說經三遍西方素明十天帝君從吏神兵無鞅之衆浮空而至說經四遍北方玄明十天帝君從吏神兵無鞅之衆浮空而至說經五遍東北洞明十天帝君從吏神兵無鞅之衆浮空而至說經六遍東南耀明十天帝君從吏神兵無鞅之衆浮空而至說經七遍西南離明十天帝君從吏神兵無鞅之衆浮空而至說經八遍西北靈明十天帝君從吏神兵無鞅之衆浮空而至說經九遍上方通明萬天帝君從吏神兵無鞅之衆浮空而至說經十遍下方普遍重壘山谷洞天主宰神兵鬼官無量數衆升空而至十遍周竟十方無極天真大神一時同至一國生靈度心稽首來者有如海波洋溢地泉湧發無鞅之衆迮國一半土皆遍陷非可禁止於是元始仙光自眉間出騰耀萬方分身入於光中各有元始聖像然後光明復入眉間聚成圓珠大若乾坤普照天地化形無體變象自然虛空天界盡入圓珠中天人仰看惟見萬身元始萬天帝君勃勃從珠口中入既入珠口不知所在國人廓散地還平正無復𣣱陷元始即於光明圓珠之上說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普受天恩咸得濟度全其本年無有夭傷傾土歸仰咸行善心無盡無滅無敗無壞無損無去無離無散無死無傷言無華𦂶口無惡聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是三景上帝祕密隱奧之文亦是玉宸大帝化形召真之隱名也非世之常辭上聖已成真人飛神召靈通玄究微能悉其章誦之十過萬天恭禮三界聽法河海靜默山嶽藏雲日月停景璇璣不行隂陽翕和晝夜皆明群魔束形鬼精滅爽回尸起死白骨成人至學之士誦之十過則五帝侍衛三界稽首鬼官束形魔精受法濟度埀死絶而得生所以初學道士血穢未除神不通爽身不清寧體未洞真以制十方威未制天政德可伏御地祇束縳魔靈但為華文不究精微輕誦此章身則被殃禍連九祖供養尊禮門戶興隆世世昌熾得為真仙萬災不干神明護門斯經尊妙獨步玉亰度人無量為萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到億曾萬祖支連屬籍皆即受度上升朱宫格皆九年受化更生得為真人而好學至經功滿德就皆得神仙飛升金闕遊宴玉亰也上學之士修誦是經神完氣具飛升南宫中學之士受誦是經皆即受度得為神仙下學之士悟解此經即得五行備足去來由己不沉鬼官若復投胎再受是經即獲飛升遊行太空此經微妙普度無窮一切天人莫不受慶集無量之道生死䝉惠上天所寶不傳下世永祕玉府三萬六千年劫運當興盟天而傳輕泄漏慢殃及九祖禍災門閥長役靈官神兵將吏侍經五帝神司朱靈金童青腰玉女各三十六人營衛神文保護受經者身道言正月長齊誦詠是經飛神召靈魂飛九天與道合真七月長齊誦詠是經神靈不昧出入杳冥洞達幽微永保長生十月長齊誦詠是經內外明徹氣出復還神隨意往聚散變化皆得運度性悟真空安鎮其方人稱太平八節之日誦詠是經得為南宮列仙本命之日誦詠是經超凌三界升入金門不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齊戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐九霄純陽五色梵氣之中內外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月光明照耀天地身化萬變遍歷十方如此分明密呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齊清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引氣三十二過東向誦經元始無量度人上品妙經元始洞玄飛神召靈本章上品妙首萬變度人千化隱韻離合自然出空入無混洞赤文無無上真元始祖劫化生神靈開明萬類是為道根上無復祖惟道為身通天徹地分神化靈無文不光無文不明無文不立無文不成無文不度無文不生是謂大梵天中之天紫瓊浮臺碧霄梵亰太極元尊大羅玉清混然六合移氣萬靈眇眇劫仭若亡若存洞華三境六宸巨庭蘂館嬰房紫微神霐九華梵氣周遍十方中有南極長生之君中有飛神召靈之君中有變化自然大神中有通天徹地靈君中有化氣萬形之神遊行太空微妙尊神回骸起死無量度人今日校録諸天臨軒東方無極飛神召靈長生大聖無量度人南方無極飛神召靈長生大聖無量度人西方無極飛神召靈長生大聖無量度人北方無極飛神召靈長生大聖無量度人東北無極飛神召靈長生大聖無量度人東南無極飛神召靈長生大聖無量度人西南無極飛神召靈長生大聖無量度人西北無極飛神召靈長生大聖無量度人上方無極飛神召靈長生大聖無量度人下方無極飛神召靈長生大聖無量度人十方至真飛神召靈長生度世無量大神並乘華蓋五色翠羽雲輿龍首絳蕚凝珠寶輦駕御靈鳳驂乘翠鸞建千真變化靈節萬氣聚散神幡前嘯神虎泛響後隨蒼龍發揮辟邪天鹿雷音大獸更唱迭和交映拱扶七曜啓扉千真擁轅億萬天仙浮空而來恭迎法駕俯持信幣專心稽首虔仰靈音主宰上相南陵火官掌經仙伯監籍大神執經把籍齊到帝前隨所應度嚴校諸天普告三界無極神鄉昌明玉閣瓊室華堂太一靈府九氣梵天上解祖考億劫種親罪籍幽玄落滅消釋不得拘留神合道符元始告命時刻升遷校録朱宫鑄鍊形魂靈魔保舉度品南宮死魂受鍊仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度三塗五苦八難超凌三界逍遙上清上清之天天帝玉真玉宸之境梵行東方八天青麗始緣天帝幸經綸夷日景微度天帝永須梵希惠正麗變天帝洞耀神凝靈兆緑敬天帝靄鬱延微廣華成化天帝泛光每支上靈清慧天帝委汝加非羽舞晃曦天帝大鞠零施呼變穆粹天帝弗支婁機南方八天陽離大盛天帝升欲玄生林宛極瓊天帝容純影光九變東文天帝永重威光寧丹正度天帝莫緬那方熙凝澤物天帝忽咤雲昌和明慶音天帝伏浮升康大定施變天帝臻齊何鄉好生長育天帝溫慧令長西方八天皓景今芳天帝既無漂生平敷玉素天帝擁靄行元飄颻影梵天帝龍斐角衣鎮觀至幾天帝壯敬玄機正始華光天帝妙睿升飛永極威庭天帝竸盛呼黎上浮碧蒙天帝整謂緣威雷零施政天帝弗綱兮歸北方八天淵默玄化天帝濛暮𢹂混慧宛成理天帝行緣金衝樂梵無欲天帝肯特妙通和同萬有天帝遍育元烘沖虛大漠天帝逺上來升元通法號天帝秀繞雲亰文英動妙天帝願施成并上靈七耀天帝慶貽宗真三十二天三十二帝玉清祕訣上清隱奧九霄梵音自然妙理萬天瓊文天中龍章玉符寶篆天中神機九天靈魔太清隱名萬和千合變化飛神無量之寶深莫可量敷落神真普度天人今日欣慶受度歷關諸天請滅三惡斬絶地根飛度五戶名列太玄魔王監舉無拘天門東斗發生西斗除殃北斗延算南斗注昌中斗仙形總監衆靈青帝飛神白帝聚魄赤帝流光黑帝召靈黃帝內升萬神合明青天魔王恭符神音赤天魔王書罰功非白天魔王斬馘不祥黑天魔王巨力施威黃天魔王持法守真五帝大魔萬神之宗飛行三界統領神兵麾幢持節遊遍太空目號神威諸天稱功上天度人施化靈文至真受命降法召靈八威奠維萬氣開張錦額前驅青甲仗幡擲火萬里流鈴八衝敢有干犯拒遏上真金鉞前戮巨戈後刑蕩除邪穢風火無停千千截首萬萬翦形魔無干犯鬼無祅精三官校録神司考魂不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列言上清洞元通曆玉宸開劫兩儀鑿象混沌始分上無色界下無色根道玄虛寂靈風自然天上天下無忘無想無本無源無體無纍混然六合照徹十方龍漢初劫傳法開生壬辰開度化育群元死戶閉塞胎根息滅氣靈通爽俱集神庭上衝太虛下徹幽關百體俱一內外無傷神隨氣運變化無常一體萬身呼吸非光神遊三界氣遍十方聚散為一皆由我身中為神王意乃神主意與神合飛神召靈仙道可入平視髙真太極混沌金函玉章洞達幽微坐通八景飛照億千性定神息回風紫煙道包萬象法制千魔與道同合自然成真真中之真長生大君玉靈公子飛化尊神遊空主宰內治形真氣聚靈全保命生根永固神靈出入上清八維之內三界之中通化萬神主握三宮應召九源混合萬神十轉回仙靈氣生全仙道隱祕運應度人上開天門飛神召靈超升玉闕浩劫無停普受開化身得列真鍊形太空永離凡緣上關九霄遍歷三台鍊尸黃庭飛升太清太清之上有此仙門中有飛神召靈之章真王靈篇辭參髙真第一神霄玉府飛神之章神靈變化奧隱無窮氣神相合真入仙門神乃身主氣乃神王神氣俱妙參御髙真飛靈八極召至萬神惟道可偕洞徹幽冥回風扇景天地育生誦詠除殃解悟成真真中妙理返本固根太乙真魔上相元君祕隱不顯億劫長存第二紫微玉府洞真召靈之歌神庭隱大羅梵氣為宗主不動乃經常動之即解悟祕於紫元都昌運符流布華房鬱紫煙靈臺釋長句開闢萬有法包括六虛成大道寂無體得道還爾身根斷死戶滅飛神入太清超凌億劫塗永離北鬼宫過三界兮道御長空升無為兮混合仙真既真空兮宿命開通飛靈八維兮億劫無終妙理通真兮虛玄寥廓究本還元兮出入御靈風第三景霄天尊洞神隱諱歌曰玉宸洞微大道隱存至真無體以道為身運神召靈抱括乾坤內實外虛陽光隂精浮黎玄寂身入杳冥變化自然遊觀太空太空之上混合九成五體生全百神咸寧出入影隨隨影見真真中之真即此真空悟解成道保之長存爾不悟真道永沉北羅酆轉輪生死根六趣無仙門此九霄之上玉靈之中神王歌音音諧玉律靈參金文誦之百遍超度南宮誦之千遍名列髙真萬遍道備飛升玉清度越三界位登仙籍有聞神音魔王敬形敕制地祇侍衛送迎拔出地戶五苦八難七祖升遷永離北官魂度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是玉宸上帝及九霄神王隱祕之音皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寶祕於神霄玉府內禁瓊宫華堂經室依玄科三萬六千年劫運當傳若有至人明內寶質心依舊格告盟三天然後而付焉道言夫天地運度亦有否終日月五星亦有虧盈至聖神人亦有休否末學之夫亦有疾傷凡有此災同學皆當運神鍊氣受化濟度十遍轉經以召神靈復獲更生無量之文普度無窮道言夫末學道淺或仙品未充神氣未備飛召不能運應滅度身經太隂臨過之時同學至人為其行香誦經傳法開悟神靈以度尸形如法魂神徑上南宮隨其學功計日而得更生轉輪不惑便得神仙道言夫天地運終亦當修齊行香誦經星宿錯度日月失昏亦當修齊行香誦經四時失度隂陽不調亦當修齊行香誦經國主有災兵革四興亦當修齊行香誦經同學命過亦當修齊行香誦經疫毒流行兆民死傷亦當修齊行香誦經夫齊戒誦經功德甚重上消天災保鎮帝王下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能為天地帝主兆民行是功德飛神玉闕召靈仙都有災之日發心修齊燒香誦經十過皆諸天記名萬神侍衛右別至人克得為聖君金闕之臣諸天記人功過毫分無失天中魔王亦保舉爾身得道者乃當洞明至言也諸天中飛神召靈隱語無量音道君撰元始靈書中篇東方八天坱圠妙本顯黎俱浮奕扉空柯華陸宛都敬既推哲景耀洞虛慶夷林遠育兆玄珠珠成靄何芬苾化舒飛光箕翼敷遍北樞太一靈房俯仰碧居回犯神漠運轉靈軀南方八天光動赤霞蒼梧火兢跖景紅希龍虎降升施展除布炯赫緑英日俱雲遠闡發齊并郁馥離晃定披錦星氣動掬基復邈洞清擲罔奠斯殊轉運丁卜扶貽建象宮鎮靈西方八天金光六支虛于大黎煥素耀景空華洞希惠余正蘊泛歌昃施注顯辨惡歸氏合持教筵宙落方鑑影提昺衛堅蒲勝凝神衣忽扶合策品度侔暉巨偭荒權符車合離北方八天淵淨浮羅弗離幽爽据盧圓軒玄漠訓敞丹宛屈騎挾展附長退呼魔魂統復施張沉息華兜泛曲會傷普落大化曜都定昌平隨劈護追幽反光度功罔極億化天仙道言此玉晨天中大梵隱語無量之音皆玉文丹書龍章雲篆祕於內闕華堂黃金寶函輝光百尋五色靈氣神章之中神霄玉清真王扶桑青華帝君皆知其音以傳其文能齊而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門玉清消魔神王保舉上仙道備克得飛神三界召靈千真此音無所不變無所不通無所不度無所不成天真自然之音也故誦之致飛天下觀上帝遙唱諸天朝禮三界侍軒群妖束首萬靈擁佑和氣叶流瑞煙蓊靄神靈湛寂琳琅振響十方肅清河海靜默山嶽吞煙萬靈振伏招集群仙天無氛穢地無祅塵冥慧洞清大量玄玄也元始無量度人上品妙經卷之二十二

  text: 靈寶無量度人上品妙經卷之十二地二
  hash: sha256:7ecec03d83597c90542ecea171f903f283b899b9da292fee64f3e6a2dd31a9cb
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_012-001a, image: hfl/0003/0003-050.png}
body:
  text: 隂陽化生品道言昔於太素皇極天中紫晨流光大善明土受元始度人隂陽化生無量上品元始天尊當說是經周回十過以召十方始當詣座天真大神上聖髙尊妙行真人無鞅數衆乘空而來碧雲凝暉紫金交映瓊花四集天籟成音丹玉真輿金華寶輦錦霞垂䕃絢彩蔚彰三素擁輪九真齊轡七日七夜儀璘交照五緯澄明瑞霧騰空鬱林藹秀一國地土山川林木緬平一等無復髙下土澤紺潤蘂闕飛霞衆真侍座元始天尊玄坐空浮五色師子之上說經一遍諸天大聖同時稱善是時一國男女明悟生機不天天壽說經二遍隂陽合德玄醴升和說經三遍飛仙蹈空靈真布籙說經四遍神龍奮迅隂惡蠲消說經五遍緑室生煙神窗照徹說經六遍卷芽甲拆陽德冲晞說經七遍生道普圎相儀周足說經八遍靈光垂䕃泉曲䝉恩說經九遍諸天諸地品彚生成說經十遍衆真監盟顯示大法是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品元化大神無鞅之衆浮空而至說經二遍南方無極無量品赤晶大神無鞅之衆浮空而至說經三遍西方無極無量品素威大神無鞅之衆浮空而至說經四遍北方無極無量品鬱微大神無鞅之衆浮空而至說經五遍東北無極無量品鎮極大神無鞅之衆浮空而至說經六遍東南無極無量品風輪大神無鞅之衆浮空而至說經七遍西南無極無量品太霄大神無鞅之衆浮空而至說經八遍西北無極無量品廣運大神無鞅之衆浮空而至說經九遍上方無極無量品髙玄大神無鞅之衆浮空而至說經十遍下方無極無量品執成大神無鞅之衆浮空而至十遍周竟十方無極天真大神一時同至一國男女傾心歸仰執持寶幢花蓋紛委雲騶風騎億萬咸集仰佇天尊敷演隂陽化生微妙大法無鞅之衆雜沓一國地發金玉惠露敷空於是元始天尊於眉間飛出日月之光九芒十華大如彈丸去面九尺騰躍上下光芒激射須㬰遍滿天地十方世界混然一色天人聖衆凝瞻不捨日月交映化成一珠元色殊特見者驚異於此珠中出見天文大字玉書真圗龍鳳寶章龜蛇之勢廓落罙布又於珠光之中見層觀危樓數仞鳳臺麟閣琪林華彩融麗碧虛去此地境懸停百丈元始登引天真大神上聖髙尊妙行真人十方無極隂陽化生至真大神無鞅數衆俱入神珠之中天人仰看惟見拂拂從珠口中入既入珠口不知所在國人廓散地還平正無復欹陷元始即於神珠之內寶殿之中請命諸天上帝統御隂陽調育化生諸天天尊八方真宰五老帝君長生大君東極紫晨上宮青華帝君皓真金庭祖氣元皇南曦昊靈玉真北玄水帝中黃太真玉華靈妃太玄氣毋九靈太妙隂陽化生萬道元毋髙皇帝尊列坐其上十方映見如隔琉璃光氣合冥空歌揚音其聲宛雅風和飄襲萬物遂成元始天尊顧眄仙衆旋觀勝妙萬天敬禮龍騰虎擲化見五輪紫金光明圎象即撫流雲山水蔚翠離羅之帔攬雕瓊結珠金真飛光之几宣告衆真曰此天文大字乃隂陽元根恍惚為門神為化本氣是生因隂陽二物元本無名以其相求變化所通一浮一沈一順一逆一剛一柔一內一外一隂一陽一龍一虎含孕構精故乃化生太虛太虛生太無太無生太洞太洞生太空太空生太漠太漠者在空玄無極之表交變隂陽以生二儀二儀生三才三才生萬物三界具備仙真分立金闕玉都百萬宫室山嶽列峙河流海澄此乃元始造化大器之旨而諸天上帝髙真帝主仙聖賢哲亦從北生下至九府北酆泉扄九地鬼神魔帥亦同其道至若人升為仙轉凡成聖證位真階亦如隂陽造立天地以隂陽龍虎逆順修之可以神氣鍊形形鍊為氣氣鍊合神鍊神合元以無合道乃為髙真真神飛化洞入自然以化以生與道同體謦咳萬劫億載夜旦爾不能悟輪轉諸業受苦報對皆由不知隂陽生成之妙造化大器之由也又有取隂陽之精升降水火左日右月中涵太無流運九九凝為紫華爾能服之合景飛升上朝太清此亦隂陽化生外景至和之道隱諱玄𧷤詳著金簡玉冊之內封於玄都玉京髙上真王玉清之府東華寶韞之內浩劫一開度人無量元始即於神珠之內說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度明悟化生壽與天長傾土歸仰咸見迫元化性化見化理化明化因生神生氣生精生動生物身有玉光聲洞靈音齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是上聖髙尊隂陽化生真王內諱百靈之隱名也非世之常辭上聖已成真人通玄究微能悉其章誦之十過諸天遙昌萬帝設禮天波泛瑞紫海凝煙日月吐輝璇璣回耀群魔東形鬼精滅爽回尸起死白骨成人至學之士誦之七過則五帝侍衛三界稽首魔精喪眼鬼祅滅爽濟度垂死絶而得生所以爾者以隂陽化生究其本始續絶繼傷還得性命之根以道為父以德為母以神為師以生為主穢氣普消體漸洞真召制十方威制魔靈伏制地祇束縛妖爽但却死而已不能更生輕誦此章身則被殃供飬尊禮門戶興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人無量為萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到億曽萬祖幽魂苦爽皆即受度上升朱宮格皆九年受化更生得為貴人而好學至經功滿德就皆得神仙飛升金闕遊宴玉京也上學之士修誦是經皆即受度飛升南宮世人受誦則隂陽順化生道入身延壽長平後皆得作尸解之道神魂暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死䝉惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃逮七玄責役冥官侍經五帝玉童玉女各二十四人營衛神文得護受經者身道言正月長齊誦詠是經上贊天地以時化生枯林槁𠏉盡得繁榮白骨朽骸天和播精真液內滋赤書經營太玄生符招還百神為上世亡魂斷地逮役度上南宫七月長齊誦詠是經天真下直萬寶遂登隂化陽生革堅膚凝五華結秀丹魂耀靈鑄鍊緑骨金髓玉筋身得神仙諸天書名黃籙白簡削死上生十月長齊誦詠是經玄一在前真一在後太一居中隂陽合湊恍愡至神混然太朴道運日新為國王帝主君臣父子安鎮國祚保天長存世世不絶常為人君安鎮其方民稱太平八節之日誦詠是經八景聚神元氣交並陽施隂納質具性真周回還返金書紀名八門九室隨意飛升得為九宮真人本命之日誦詠是經胎真始生生本太真隂陽順道天福自然魂魄保固萬氣俱仙不經干試壽曆綿綿天元定籍大魔列言萬神朝禮名書上天功滿德就飛升太玄道言行道之日皆當香湯沐浴齊戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黃白三色雲氣之中內外蓊𡨕有青龍白虎朱雀玄武師子白鶴羅列左右日月照明洞煥室內項生圓象光映十方如此分明密呪曰無上玄元太上道右召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齊清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引氣三十二過東向誦經元始無量度人上品妙經元始洞玄靈寶本章隂陽化生十轉度人天元隱韻混洞自然浩劫難名隂陽結精含霄貫氣大象開明動極成炎靜極成泉陽噓隂吹感化兆元龍呼於虎虎投於淵龍出於火反復化生玄波妙有虛極成形五運肇闢金真成天玉宮瑶闕九翠崇山內都億靈主校萬仙玉精凝華雲章寶篇六十四體支變八千隂陽氣交化生赤文無文不神無文不明無文不立無文不形無文不化無文不升是為太梵天中之天恍惚存亡真道推遷兆知其妙化體為仙仙貴長生生氣綿綿九天鳳氣大有之山下鎮百關長谷太元百二十官環拱太玄大行梵氣周回十方中有度人不死之神中有南極長生大君中有東林安寶帝君中有度世司馬大神中有好生韓君丈人中有南上司命司録延壽益算度厄尊神回骸起死無量度人今日校録諸天臨軒東方無極道憲神王長生大聖無量度人南方無極神應神王長生大聖無量度人西方無極氣合神王長生大聖無量度人北方無極玄一神王長生大聖無量度人東北無極陽範神王長生大聖無量度人東南無極隂境神王長生大聖無量度人西南無極正性神王長生大聖無量度人西北無極意化神王長生大聖無量度人上方無極感妙神王長生大聖無量度人下方無極真精神王長生大聖無量度人十方隂陽化生神王長生度世元量大神並乘瓊文紫霄玄車景耀流光之輦飛空羽蓋碧霞回映積珠丹輿素雲垂䕃虛轉虹輪驂駕神鳳白虎持十華之幡建命魔之節暉映雲錦之斾泛蕩紫瓊之旌天龍靈獸嘯歌噰噰元皇啓途妙行翼轅億乘萬騎浮空而來傾光回駕監真度生太微天帝玉闕至真中央黃老元素道君總執洞章齊到帝前陶鎔鍊化簡告諸天情識因緣五行變生三元九署品類聖凡下校三界無極神鄉太丹鬱霞紫度炎光玉晶金馬石景中方天津帝臺冥關扶桑交灌濯羅變合隂陽簡閲玉籍正道明輪域於隂陽二氣交并以植萬品開化元根生知妙元歸復神精三宫流運玉闕生華身得神仙福及後昆拔度上世九祖七玄疾除黑簿削落罪愆不得沈留速啓冥關虛皇告命時刻升遷北都寒池部衛形魂陽化其魂隂生其形形魂合道飛度朱陵逍遙解脫升化種民萬生欣慶隨運長存因緣輪轉與天齊年永度大魔干試之難超淩三界逍遙上清上清之天天帝鬱玄無色之境梵行東方八天隂陽化生之天起於西北兆於子位出於東北生於東齊於東南相見乎離成實於西隨日之度以立天分玉華元明天帝嗣都元嶇極化度天帝栁題灌生萬寧重暉天帝震光理監玄期耀和天帝需密爰芻會昌鬱明天帝嶽澄變徒扶搖恭靜天帝飄偃停隆太易洞浮天帝儔溢滋玉光盈虛天帝真玄升南方八天炎明號名天帝約遞淵圗鳳氣丹華天帝治乾方超朱靈彤輝天帝泰無萊紫素禁理天帝龍角爓基輝神仙𢍆天帝圎力寶昌化應奉晨天帝梵陽尚玄務猷合真天帝鬱靈標重離洞陽天帝僅宗九虛西方八天雲景利真天帝祖璫元名流輝素真天帝保盟壽天太華慶昭天帝妙羅永神極肇啓宗天帝敷回正旗金耀九司天帝辨伯史英浩都寶光天帝靈元昌同太明監化天帝三塗元明梁元素天帝映神圎北方八天玉林元上天帝裔玄本英合景太真天帝嚴固永期龍頥壽安天帝歸氣祖道流明玉清天帝尊太液初妙極周化天帝號奕太無紫蓋耀離天帝泰定惠光玄凝神秀天帝杜吉元公淵明澄虛天帝皛天中皇三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻天中之音天中之尊天中之神天中大魔天中之靈九陽十隂變化生根無量之奧深不可詳敷落神真普度天人陽胞隂胎吻固以神神為心本心以意行心意合道寓以強名不知自然神則變遷途隙守之神化為丹丹化氣祖玄化綿綿隂施陽華鍊精保神神魂永固合景飛升遊宴八極結滯散開九元妙本玄境生關混沌大劫三道交騰魔王監舉無拘天門東斗陽精西斗隂津北斗感胎南斗授生中斗運斡五氣混冥青帝施政白帝布德赤帝養鍊黑帝化育黃帝守道萬神無越青天魔王龍耀玄格赤天魔王丹靈感發白天魔王皓華玉澤黑天魔王神閭通徹黃天魔王朱嬰藏月五帝大魔萬神之宗飛行三界總領仙兵麾幢鼓節遊觀太空澒洞隂方玄激神風九陽元化三景羅空大小境域仙聖真公恍惚萬變猛馬毐龍長矛𠋣天玉杵摧峯真符流火焚蕩祅凶九天前征大醜按嚴列陳北都殺鬼億千無撓隂陽各遂化生三玄九官無使散離瓊章上奏金馬騰飛普告元窮萬氣齊歸三界五帝大振元機悶都洞清神光晦冥梵行周羅雲結為京碧嶽浮空太倉竦庭煙徊風搖鬱壘萬神帝元真氣彌盈百千原於一成支為王嬰隂道洪化陽魂秉權九變十合金關暈聮緑窗吐日靈綱命仙水為太乙形若含蓮化生大神玉號精延錦衣瓊幘坐鎮萬天亦自隂陽化生所傳五符瓊笈上道之元化生天地日月循環太空九氣中有玉淵湛鏡內象星斗外𨇠天上天下無幽無冥無形無影無極無窮溟𣸉大梵遼廓無光赤明開度運周自然元始浩氣如雲如煙結空成字寶篆金篇赤書玉符八景玄文保制劫運使天長存梵氣彌羅萬品恢張元綱流演三十二天輪轉無色周回十方旋斗歷箕回度五常三十五分總氣上元八景冥合氣入玄玄玄為神母隂使陽官消息長飬動靜洪纎以不易泰以地合天左入於右後極於先至道之機太空無關真一等空化生之元化極而變變極而玄玄中太皇上景飛纒朱霞舞空嘯詠合筵金真朗耀流運雲宮玉章召氣玄風散煙太霄鬱秀輔化飛仙千和萬合自然成真真中有神長生大君洞房黃老青華帝君左右玉妃太一尊神司命在心桃康運精腦膜赤文混黃元真無無曰玄赤文命神執符把籙保命生根上遊玉虛出入黃庭八冥之內細微之中下鎮人身泥丸絳宮中理五氣混合百神十轉回靈萬氣齊仙仙道貴生無量度人上開八門飛天法輪罪福禁戒宿命因緣普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有太空合變之章魔王隱文辭參髙真第一欲界魔王隂陽化生延壽隱訣太一空無翛然獨居靜極生動隂陽乃育陽火隂水流運周足中以大和萬氣齊鮮冥通妙應黃房發煙白雲之門有氣如泉以彼取此以此得彼流轉無窮神定則止赤入於黑黑還於赤或守以雄或守以雌感化情性長生保兹第一色界魔王隂陽化生神仙隱訣溟𣸉無色太空晦黑二物相吞忽生混沌梵氣交度九萬餘億玄定神生天精赫奕圎經千里中有神文龍鳳曲折變化三靈玉京玄山九真鳳氣金井澄霐消消滂沛絳闕萬天生同根柢復本去華上升仙家子若心得吸咽流霞流播琅玕玉芝丹砂非妙莫窺日轉龍車第三無色界魔王隂陽化生天地隱訣欲色既盡無色見前恍惚空洞中隱萬天無色意存意真惟精意召即至五辰三奔日精月華光耀生根方寸神宫宮羅玉真心火九陽鍊骨成金上極無上下極淵源火令急速飛龍八巡自隂自陽化生隱存天地大鼎水大中分不知生端見道無門生從感悅神氣至精霏霏瑞露灌治群靈三界安立大漠渾淪乘龍飛霄羽蓋青裙此三界之上飛空之中魔王歌音音參洞章誦之百遍名度南宫誦之千遍魔王保迎萬遍道備飛升太空過度三界位登仙公有聞靈章魔王敬形敕制地祇侍衛送迎拔出地戶五苦八難七祖升遷永離鬼官魂度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢隨地獄禍及七祖翁道言此二章並是諸天上帝及至靈魔王隱祕之音內明隂陽化生天地媾精萬物孕成之密要人知其要則久視延年神仙不死大則上法三尊生天立地飬育混沌中則移易隂陽卷舒造化仰合天德下則龍虎隂陽混合百神回風紫煙道和百節潜用五行隂陽變泰以至得道皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寶祕於玄都紫微上宮依玄科四萬劫一傳若有至人齎金寶質心依舊格告盟十天然後而付焉道言夫此經元始天尊說隂陽化生之道誦之者生德自昌不見終滅以內隱隂陽祕諱生氣致祥之理惡禍併消自得元吉若天地運度否終日月五星虧盈聖神休否末學疾傷凡有比災同氣皆當齊心修齊六時行香十遍轉經福德立降消諸不詳無量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太隂臨過之時同學至人為其行香誦經十過以度尸形如法隂陽二官為化生神氣五藏自生還白童顏神魂徑上南宫隨其學功計日而得更生輪轉不滅便得神仙道言混沌大器中有神風主營生化隨時吸張有如橐籥隂陽為神往來其間神氣相投剛柔構精自然化生而不知其生生亦無端不見其垠誦詠此經生神來降故氣蕩絶天地運終星宿錯度日月失昏四時失度隂陽不調國境不豐兵革侵寇疫毒流行兆民夭傷師友命過皆當修齊行香誦經大齊戒誦經功德甚重上消天災保鎮帝王下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能為天地帝主兆民行是功德有災之日發心修齊燒香誦經十過皆諸天記名萬神侍衛右别至人剋得為聖君金闕之臣諸天記人功過毫分無失天中魔王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君撰元始靈書中篇東方八天谷元子丹玄育滋明閔恪祕爐宏池閲銘窊隂起陽三素飛精北靈偶文氣容孕真玉峯金泉神液零清終核碧包元根神臯巨朗吟穴皓震分交化溉大源華生寶遨南方八天庚糅心液龍濤密芒明霞浥鉛巢火晉褒渙浹皓英養朱成膏璧燦液露𠅘曲華台意雷迅飄九旗洞招烈煙混微鼓冶凝飴珞殊欣𢍆黃室和媒雄守太廓雌抱玄脂西方八天焰輪赤靈交映斗卿鼎濟轉青酆制威摧丙求癸朋爽秀西冥太丘紫炎光蒸晨離萌化尾氐煥燭清微生變質剛混易筵儀句土動箕堂耀蔚啓霄瓊復施汪縻鄒岐北方八天蕆真燾都毛溪乾姝滉綿匝鈴輔恢團朧盜幾運召慜帝迂通私得還冥泥文紫朦無寂眇邈行真嵎蓬全利廣生大眇玄穹逺宙毫忽龍隱仙蹤海宗廓翟玉崑神宫道言此諸天中大梵隱語無量之音舊文祕於紫微上宫以明隂陽化生神變造立三界之真機大道之奧藴五色之雲蟠回成字紫金為界龍錦為篇字皆廣長一丈天真皇人昔書其文以為正音有知其音能齊而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳魔王保舉上真道備剋得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成天真自然之音也故誦之致飛天下觀上帝遙唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響十方肅清河海靜默山嶽吞煙萬靈振伏招集群仙天無氛穢地無祅塵冥慧洞清大量玄玄也元始無量度人上品妙經卷之十二

front:
  text: 靈寳無量度人上品妙經卷之三十九黄九
  hash: sha256:9da52cd01a9df438f319eeb6df0d1dee6d5887922a6beacfa96f6e68dceb302a
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_039-001a, image: hfl/0008/0008-132.png}
body:
  text: 南宮延生品道言昔於丹靈天中絳彩飊歌朱陵昌土受元始度人南宮延生無量上品元始天尊當說是經周廻十過以召十方始當詣座天真大神上聖髙尊妙行真人南昌上宮天機内省延生保僊上真道君南宮延生天機上相真宰天機上吏真宰天機真僊真宰天機直神真宰丹元僊官三元僊官天機都吏甲騎神吏無鞅數衆乗空而來彤霞神霄寳輿丹輪鳳蓋垂蔭流明紫光九色蓊蔚洞煥太空六日六夜南昌上宮星樞守躔候鼓不鳴龍嶽水刻玉滴停注煙旗浮空霧帷卷香樞機二省十官秉笏嚴領局部神風輕襲虚海澄映天容廓清氣界昭曠一國地土山川林木緬平一等無復髙下土成柔玉紺膩純明洞徹圎羅無有異色衆真侍座元始天尊玄坐空浮六龍戲珠交昇雲錦之座說經一遍諸天大聖同時稱善是時南昌宮中天機內省注上兆庶延生保僊之名萬億論計得仙之人九萬餘條說經二遍南辰朱華映滿碧虚雲綱縈回瑰衡蚪屈說經三遍琳琅振韻讃美洞章說經四遍南宮啓關生育萬彚說經五遍天機流運五德平昌說經六遍六星摇光萬神協慶說經七遍僊筭無終世壽遐逺說經八遍真魔降券度兆延生說經九遍雨花盈尺天香合雲說經十遍世無夭折樂慕靈真是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品延生至真大神無鞅之衆浮空而至說經二遍南方無極無量品延生至真大神無鞅之衆浮空而至說經三遍西方無極無量品延生至真大神無鞅之衆浮空而至說經四遍北方無極無量品延生至真大神無鞅之衆浮空而至說經五遍東北無極無量品延生至真大神無鞅之衆浮空而至說經六遍東南無極無量品延生至真大神無鞅之衆浮空而至說經七遍西南無極無量品延生至真大神無鞅之衆浮空而至說經八遍西北無極無量品延生至真大神無鞅之衆浮空而至說經九遍上方無極無量品延生至真大神無鞅之衆浮空而至說經十遍下方無極無量品延生至真大神無鞅之衆浮空而至十遍周竟十方無極南宮延生天真大神一時同至一國男女傾心歸仰將聞元始天尊宣示南宮延生之法成真之要各相謂言我等位證天人住諸天中未聞天司名品居處統治三元生死罪福功過所在南宮延生但知大略南昌上宮爲南極長生大帝君之緫司延生之所復在何治有何典宰主吏三元之民當何祈請遂獲延生將享無極今日天尊敷陳綱括開暁天人我等宜各精心歸依大法修證前詣再拜稽首來者有如細霧宻雲無鞅數衆迮國一半土皆偏䧟非可禁止一切大衆圍繞座側瞻佇靈顔覬聞妙法元始俯仰四顧攬几廻天儼紫金光容發言宣告大衆曰夫天地定位君臣乃立三大上帝設官布政分治三元紫微太微爲兩極之司以主生死世人罪福僊真功過紫微曹局係於北斗太微案掾隷於南辰紫微天官之司則有太玄都省以統三官太微大君之司則有天樞天機二省以延注生命校領羣靈南斗第五星曰天樞第六星曰天機樞機二省爲上帝之内司長生大帝正所御也天有三省以治三元則樞機之司並屬於南昌上宮即太微宮也三省之内金闕侍中上相上宰侍郞僊卿司命以共治之兆能長齋奉詞天機省中懇禮長生大帝嚴備供養勤誠不替則有九天採察考校真官按兆功過上聞機省則上相注筆爲兆延生壽無紀極不必丹芝可俟僊道大衆欣躍乞獲詳教渴佇聖言於是元始懸一寳珠大如黍米在空玄之中去地五丈元始登引天真大神上聖髙尊妙行真人天機内省上相真宰靈官直符甲卒統騎南宮延生無量大神十方無極至真尊神無鞅數衆俱入寳珠之中天人仰看惟見拂拂從珠口中入既入珠口不知所在國人廓散地還平正無復欹䧟元始即於寳珠之内說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸得延生不殺不害不嫉不妬不淫不盜不貪不欲不憎不𡜍言無華綺口無惡聲十二善行専則延生南宮自聞天機列言七世命僊齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬各得度世道言元始天尊說經中所言並是上帝南宮延生内名隱韻之音亦是天機省中上相内諱百靈之隱名也齋戒誦之直符詣天機省乞延生之籙太上度南宮之契兆得延生永世長存非世之常辭上聖已成真人通玄究微能悉其章誦之十過諸天遥唱萬帝設禮南宮延生天機紀齡雙景照頂泥丸返精羣魔束形鬼癘滅爽回屍起死白骨成人至學之士誦之十適則大君流遷三省言功魔精喪眼鬼祅滅爽濟度垂死絶而得生所以爾者學士穢氣未消體未洞真召制百神威未制天政徳可伏御地祇束縳魔靈但却死而已不能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因縁萬災不干神明護門斯經尊妙獨歩玉京度人無量爲萬道之宗巍巍大範徳難可勝道言凡誦是經十過諸天齊到南昌宮中天機省宰上相真君請長生大帝玉篆龍文九雲之書雲章寳籙統僊驅吏八鸞真符告下酆山泉曲之府使億曽萬祖幽魂苦爽皆即受度上升朱宮格皆九年受化更生得爲貴人而好學至經功滿徳就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經南極丹元左靈仙府真官直符神吏爲兆延生皆即受度飛昇南宮世人受誦則九元八極四斗三真十二仙官教兆隱遷延生長年後皆得作尸解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙恵上天所寳不傳下世至士齎金寳效心盟天而傳輕泄漏慢殃及九祖長役治官侍經南宮玉童玉女各二十四人營衛神文保護受經者身道言正月長齋誦詠是經南官延生長生大帝敕太玄九仙君太虚無上君太上九老仙都君爲兆開心通幽洞㝠爲上世亡魂斷地逮役度上南宮七月長齋誦詠是經南宮延生天機上相告太虚紫元洞陽元君太素仙元君太上秀樂君爲兆辟妄長獲至真身得神仙南宮書名黄籙白簡削死上生十月長齋誦詠是經南宮延生金闕侍郎請玉華洞靈君玉華紫靈君元丹中皇君爲兆護身忠事至尊孝及一門爲國王帝主君臣父子安鎮國祚保天長存世世不絶常爲人君安鎮其方民稱大平八節之日誦詠是經南宮延生玉清三皇太帝華陽仙君紫靈仙君洞陽仙君開兆八關得見真仙得爲九宮真人本命之日誦詠是經南宮延生長生大帝敕太極仙君清靈仙君九光仙君十華仙君延兆生籍赦罪超神魂神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿徳就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐紫赤絳三色雲氣之中内外蓊㝠有青龍白虎朱雀玄武獅子白鶴羅列左右南宮天機相宰神官俱降兆前日月照明洞煥室内項生圎相光映十方如此分明宻呪曰無上玄元太上道君召岀臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋清堂修行至經無量度人願所啓上徹俓御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始無量度人上品妙經元始洞玄靈寳本章南宮延生上品天機度人太微隱韻離合自然混洞赤精无无上真化爲南極六司髙宸天樞統兵緫御三元天機内省天政所干統攝南宮主校延生元始祖劫化生諸天開明兩極水火天根上無復祖惟道爲身九龍雲書八鸞真文攝氣命仙召靈招真十極飛報玉章瓊文三省開廓普植神靈太玄都紏樞機輔丞持印執法八天鳳文無文不光無文不明無文不立無文不成無文不度無文不生是謂大梵天中之天鬱羅蕭臺玉山上京上極無上大羅玉清眇眇劫刃若亡若存三華離便南昌妙庭金闕玉房森羅淨霐神霄梵氣周廻十方中有南宮延生之神中有南極長生大帝君中有神府青華帝君中有天機上相上吏真神真宰真君中有延生司馬大神中有好生主録韓司丈人真君中有南上司命司録延壽益筭度厄尊神廻骸起死無量度人今日校録諸天臨軒東方無極延生注善神王長生大聖無量度人南方無極延生考察神王長生大聖無量度人西方無極延生賞功神王長生大聖無量度人北方無極延生校録神王長生大聖無量度人東北無極延生定品神王長生大聖無量度人東南無極延生紀壽神王長生大聖無量度人西南無極延生上奏神王長生大聖無量度人西北無極延生僊誥神王長生大聖無量度人上方無極延生帝司神王長生大聖無量度人下方無極延生廵省神王長生大聖無量度人十方至真南宮延生神王長生大聖無量大神並乗紫雲琅輿朱輦華蓋碧輪驂駕丹鳳五色青龍建火鈴制魔之節六甲召真靈旛前嘯九部齊唱後吹八樂同鳴飛空遊僊嘯歌噰噰五帥啓塗四靈翼轅憶乗萬時浮空而來傾光廻駕監真延生天機丞相南昌上宮韓司主宰延生大神執籙把籍齊到帝前隨所應度嚴校諸天兆能投誠奏告南宮摽紀生命月日時年奏章通詞洞館隱天詣南昌上宮天機内省金闕侍郎南上司命靈虚真僊注筆丹籍延生續年已枯復榮已殘復完已滅復起已朽復堅天機上生錫兆長生普告三界無極神郷泉曲之府北都羅酆三官九府十二河源上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼羣南宮符命時刻昇遷北都寒池部衛形魂制魔保舉度品南宮死魂受鍊仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度三塗五苦八難超凌三界逍遥上清上清之天天帝洞機無色之境梵行東方八天玉曆司仁天帝慈持宗元化植蒼靈天帝廣繁儀王道華秀功天帝純平子夸寳宸妙生天帝冲玄定僊太玄靜真天帝慈持宗元遘僊滌想天帝廣繁儀王崿龍布和天帝純平子夸清丘洞夷天帝冲玄定僊南方八天正紀黄元天帝覺浮丹明朱房簡真天帝絶洞九方曲化耀威天帝恬昭延生炎正宗成天帝殿公維良皇極變成天帝放鐸卒馳丹明感僊天帝鍊歸牧玄飛龍晨燭天帝育垠祕懐神闕絳玉天帝浮棠嘉萌西方八天七靈素明天帝虎襄威機輪皓都天帝勝元衍光靜生太无天帝自真定開清明回光天帝監印主收敢司正刑天帝制懲檢㝠道嚴戒城天帝曜道离昌玉龍昇汭天帝昇竒纂神盈虚緫靈天帝對神把真北方八天朝極靜順天帝烈華至彬履剛召靈天帝常祐柯童玄真海遥天帝伯赤飄光玄洞五雲天帝曷廻樞純金呈禁理天帝保撫慶明玄靈斗宮天帝契超燕宗萬福帝皇天帝善持揭藍玉雲靉龍天帝母精羅源三十二天三十二帝南宮隱諱南宮隱名天中空洞自然靈章太微隱韻太微之音太微之尊南昌之神天機真宰南宮之靈九府十曹飛報上清無量之奥深不可詳敷落神真普度天人今日欣慶受度延生永固歷關諸天請滅衆惡斬絶地根超度五苦名列大玄東斗主筭西斗記名北斗落死南斗上生中斗大魁緫監衆靈青帝護魂白帝侍魄赤帝養氣黑帝通血黄帝中主萬神無越青籙真官吉多真伯赤籙真官擘山擎石白籙真官黄越赤靈黑籙真官銜雷鐵腹黄籙真官天道神力五籙真官萬神之宗飛行鼓從緫領僊兵麾幢鼓節遊觀南宮威聲赫奕帝省言功南昌績生嚴攝北酆神府受命普掃不祥神龍吐毒天馬四張金精前驅飛神仗旛擲火萬里流鈴八衝敢有干試拒遏上真金鉞前戮流火後刑屠割鬼爽炎飊無停千千截首萬萬剪形魔無干犯鬼無祅精三宫北酆明檢鬼營不得容隱金馬驛程普
front:
  text: 靈寶無量度人上品妙經卷之四十黃十
  hash: sha256:378c93f7505cc3080c0d57e11c90e50bcbe61698cfeaee1484e568f5d804bcd5
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_040-001a, image: hfl/0008/0008-174.png}
body:
  text: 北都除殃品道言昔於紫元天中流雲飄歌太玄光土受元始度人北都除殃無量上品元始天尊當說是經周回十過以召十方始當詣座天真大神上聖髙尊妙行真人北都大帝羅酆羣真北方斗牛女虛危室壁七宿星君北斗司命北都司察官曹掾吏北都飛騎立斗大神北都黑甲五氣魁吏溟泠大神北都九醜捉殺五天元帥除殃神王無鞅數衆乘空而來蒼霞紫璆之輿醫璧山雲之輦碧蓋垂蔭玄精玉光海色鬱凝洞煥太空七日七夜諸天層輪止虛辰緯停度龍山息鼓玉璣不行神風靜籟嶽雲散影天德髙清坤維靜粹一國地土山川林木緬平一等無復髙下土皆作碧玉無有異色衆真侍座元始天尊玄坐空浮六明純耀九宮混氣瓊山寶牀之上說經一遍諸天大聖同時稱善是時一國男女以念道力故豁然心開明悟下世生民先因積業罪報不停結釁羅酆若非聞經殃不可除說經二遍覩見元始身有慧光照徹十方猶如朝日北都三官上下六洞九幽無間𡨚仇和釋五苦停酸說經三遍法音清妙普聞十方證悟天人具無漏相說經四遍凡類衆生忘怨毒心隂相謀害變為法侣說經五遍殃注之苦三災之難沉瘵尸疰一時解脫歡喜更生說經六遍種民真學息鎮太無正念通虛神朝上境說經七遍國永太平尊道貴生無私無欲民不夭傷說經八遍諸天稱慶北都除殃和順運誠獲見真理說經九遍天流彩雲地録神芝說經十遍大帝遙臨來證說法天人讃歎聲徹九清是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品北都除殃大神無鞅之衆浮空而至說經二遍南方無極無量品北都除殃大神無鞅之衆浮空而至說經三遍西方無極無量品北都除殃大神無鞅之衆浮空而至說經四遍北方無極無量品北都除殃大神無鞅之衆浮空而至說經五遍東北無極無量品北都除殃大神無鞅之衆浮空而至說經六遍東南無極無量品北都除殃大神無鞅之衆浮空而至說經七遍西南無極無量品北都除殃大神無鞅之衆浮空而至說經八遍西北無極無量品北都除殃大神無鞅之衆浮空而至說經九遍上方無極無量品北都除殃大神無鞅之衆浮空而至說經十遍下方無極無量品北都除殃大神無鞅之衆浮空而至十遍周竟十方無極除殃大神一時同至一國男女傾心歸仰同悟無為方知一心造此多業愚民無知動干罪殃失忠孝之行懷隂賊之謀貪冒狠愎淫殺敗真妬害賢良犯禁玄科魂歸北都身謝三官受苦億劫無有休停乃至得生災病纏留萬無一善不知罪積致此受殃若不誦詠真文祈告北都醮謝七宿則殃不可除願聽元始明顯北都除殃之法來者有如細雨密霧無鞅之衆迮國一半土皆偏陷非可禁止於是元始宣示十方天人曰北都羅酆中有大帝六洞山城十二小洞三官九府百二十曹一十六獄二十四獄三十六獄八十一獄百二十獄如是大獄北都寒池逺在下方東北癸地大海之內有酆都羅山名曰北都天尊除真鬼帝所理故號鄷都酆為城名羅為山名都為聚處去此天境下觀非遙山髙三十六萬里山根入水三十女萬里宮闕樓觀貴擬諸天其間者對罪魂長夜不息悲苦之聲充震天地此大山之上干於斗牛七宿每宿之氣下貫都城此為北斗隂神制轄北都中有大帝玄滋天君黑帝尊神身長千尺服玄龍之衣圎冠方履乘駕九龍無極之輿丞相官屬萬億鬼神惟此鬼神實與人等並皆胎生其身自然通靈變化譬如龍蛇毒獸並是胎卵所生變化大小神化不測北都鬼神悉亦如之無量之衆還來人間與人婚宦商販生業一與人同皆是大帝密遣伺察生人衆生不能制戒心性肆造惡業不忠不孝不義不仁一一疏記奏上北都北都神王以日計時簡奏大帝帝敕惟允則使世人命為不遂運會凶殃一切橫夭皆自所招萬死萬生不可解脫我以哀憫普為救護敕使北都除殃滅禍且北都有諸大神一切衆生投詞叩請嚴醮築壇敷露真文誓天自悔則殃禍立除身壽安永諸大神者北都神王北都鬼相北都隂斗左司命主生諱閣隂斗右司命主死諱闓北都左司命主生死罪録諱灌生北都右司命主一切殃罰諱啓成北都左司察主考定功過諱闉北都右司非主治獄典録諱關已上諸大神乃主行殃禍特能除之奏章懇禱大殃積負頓可除釋汝其受之大衆伏地再拜稽首謹當奉行元始說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有禍殃傾土歸仰咸行善心不殺不害不嫉不妬不淫不監不貪不欲不憎不𡜍言無華綺口無惡聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是北都大帝內名隱韻之音亦是北王內諱百神之隱名也非世之常辭上聖已成真人通玄究微能悉其章誦之十過諸天遙唱萬帝設禮隂爽代釋殃苦消除福感自然祥應昭顯羣魔束形鬼精滅爽回尸起死白骨成人至學之士誦之十過則北真竦聞隂官稽首魔精喪眼鬼殃截源濟度垂死絶而得生所以爾者學士穢氣未消體未洞真以制十方威未制天政德可伏御地祇束縳魔靈但除殃而已不能更生輕誦此章身則被殃供養尊禮門戶興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉亰度人無量為萬道之宗巍巍大範德難可勝道言凡誦是經十過北君齊到億曽萬祖幽魂苦爽殃注斷絶皆即受度上升朱宮格皆九年受化更生得為貴人而好學至經功滿德就皆得神仙飛升金闕遊宴玉京也上學之士修習是經殃注解脫皆即受度飛升南宮世人受誦斷絶凶穢死尸閉塞北都除殃東華記名則延夀長年後皆得作尸解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長考北山侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齊誦詠是經北都除殃傳注速寧為上世亡魂斷地逮役度上南宮七月長齊誦詠是經北都除殃七祖超升身得神仙諸天書名黃籙白簡削死上生十月長齊誦詠是經北都除殃壽益增昌為國王帝主君臣父子安鎮國祚保天長存世世不絶常為人君安鎮其方民稱太平八節之日誦詠是經北都除殃萬彚蒙恩得為九宮真人本命之日誦詠是經北都除殃落兆死名魂神澄正萬氣長存不經苦惱身有光明三界侍衛北帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齊戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黃玄三色雲氣之中內外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右北都大神森然對几降臨兆前日月照明洞煥室內項生圎象光映十方如此分明密呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齊清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引氣三十二過東向誦經元始無量度人上品妙經元始洞玄靈寶本章北都除殃上品五氣度人酆羅隱韻冥漠自然混洞元老無無上真元始同生北帝髙尊隂斗七元下統酆城羅山巍峩九府奠分龍漢祖劫北都六天青河丹井雲門洞泉中有大神垂條龍巾攝制魔靈善惡咸論考謫慘酷疏記罪名律禁奉承無有不聞玄銅環牢海峙山根太玄鬼祖骨肉為身同道變化龍伏風奔窺盜世法窮搜業因遞種為殃永溺轉輪道有玉篇開宥靈文無文不光無文不明無文不立無文不成無文不度無文不生是為大梵天中之天酆羅北臺黑山玄亰上極髙上玄羅浩清眇眇劫仭若亡若存三華離便大有妙庭下極北都三官羅酆魔洞鬼營火山寒池左淨右霐太光梵氣周回十方中有北都除殃之神中有北極黑帝靈君中有九天都禁司馬大神中有注生定死北隂天君中有北斗司命司録延壽益算度厄尊神回骸起死除殃度人今日校録諸天臨軒東方無極飛天捕魂神王長生大聖無量度人南方無極飛天攝氣神王長生大聖無量度人西方無極飛天殺鬼神王長生大聖無量度人北方無極飛天羅山神王長生大聖無量度人東北無極飛天巡虛神王長生大聖無量度人東南無極飛天定名神王長生大聖無量度人西南無極飛天都關神王長生大聖無量度人西北無極飛天監領神王長生大聖無量度人上方無極飛天簡奏神王長生大聖無量度人下方無極飛天除殃神王長生大聖無量度人十方至真飛天北都除殃神王長生度世無量大神並乘蒼虬巨獸飛蓋奔輪驂駕蘷龍玄角神虎建召靈之節耀景神幡前嘯九歌齊唱後吹八音同鳴紫鯨玄羽嘯歌噰噰五老啓塗羣仙翼轅億乘萬騎浮空而來傾光廽駕除殃度生北都丞相酆域六宮總司主録除殃大神執籙把籍齊到帝前隨所應度嚴校六天普告三界無極神鄉泉曲之府北都羅鄷三官九府十二河源上解祖考億劫種親殃延禍種疾除罪簿落滅惡根不得拘留逼合鬼羣元始符命時刻升遷北都寒池部衛形魂制魔保舉度品南宮死魂受鍊仙化成人生身受度永劫無終隨劫輪轉與天齊年永度三塗五苦八難超凌三界逍遙上清上清之天天帝洞虛無色之境梵行東方八天太元都羅天帝𨴋𨵛齊宣玄滋耀成天帝辟乾毒王玉寶超想天帝演剛隆論明極濟天帝彥徒罙枚開物順真天帝平雷判生玉明朝始天帝綿都勤鐸元陽耿化天帝敢霞羅於道光初華天帝篤夏義端南方八天耀利宣真天帝主軍繁來四極廣晶天帝皇度振什帝樞圎寂天帝律佑符玄丹雲紀命天帝忽延輔章曆增元紀天帝齒將比耕還靈端神天帝卜直希辛混明委光天帝濵嘉熙亭道威崇虛天帝蔣露聰喬西方八天籍度髙明天帝抱符器圭昌慧資持天帝闌緒稽時維平智寂天帝昭虎育明素雲寶宗天帝尸繿鬱景普明度地天帝末頂昆舉仙鍊功天帝柏曽堯儲素神正矩天帝蹈鈞隱洮康祝運微天帝洪元次胥北方八天玄丘總神天帝盻邏伊房變玄極真天帝力可明俱度靈廣時天帝勃提維多生直慶緒天帝鎮咄匪盈定光浮羅天帝握瑶避須密濟禳助天帝術宣求衡餘梨葆生天帝安夷社辟九清昌陽道化天帝夜洋雲光三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章北都隱韻梵化之音北都之尊除殃之神北都真魔除殃之靈九聖十真變化上清無量之奧深不可詳敷落神真普度天人今日欣慶受度北都除殃歷關諸天請滅三途斬絶地根飛度五氣超神北都殃種注胚除蕩無餘滅尸鍊仙名列太玄真王監舉無拘天門東斗天蒼西斗天獄北斗帝車南斗天機中斗黃屋五斗降神牛女交宿符下北都除殃賜福青帝延年白帝斬精赤帝焚祅黑帝北君建都羅山峙闕酆城臣民萬億輸納帝庭主世罪惡除滅殃縈六天使者巡察幽明黃帝中主護國安人萬神來朝元始化身青天神王耀羅尸伯赤天神王振天騫石白天神王斬鬼破山黑天神王瞋睛激電黃天神王倒海巨力五帝神魔萬神之宗監領北都飛行鼓從總領鬼兵麾幢鼓節遊觀太空九旗赫奕六天齊功除殃度人嚴攝北酆神王受命普掃不祥羅天吐毒天狼四張火丁前驅都帥仗幡毒龍萬丈神虎八衝敢有干試拒遏上真金礕前戮巨天後形屠割鬼爽風火無停千千截首萬萬剪形魔無干犯鬼無祅精三官北酆明檢鬼營不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列言上清元晦未明空無邊極晃空生氣風火為石八阿九周非知非識忽化蒼龍身長百億纏結五柱自龍及康眇眇億劫混沌之中上海無色下海無淵中海風澤洞虛包天金石堅剛漸成碧圎六氣自行五運終天天上天下無幽無冥無形無影無極無窮溟涬太玄遼廓無光先生元始乃化北皇鼓鐡為山鍊金為房刻玉為樓九氣煥明乃號黑帝太玄元王主治死魂斷注除殃萬鬼魔羣威鎮十方赤明開圖運度自然元始安鎮敷落五篇赤書玉字八威龍文保制劫運使天長存梵氣彌羅萬範開張元綱流演三十二天輪轉五色周回十方旋斗歷箕回度五常三十五分總氣上元八景冥合氣入玄玄玄中太皇上帝髙真泛景太霞北都除殃殃為罪種經劫不亡消隂維何忠詠洞章金真明郁電火激焚流響雲營黑幘萬軍玉音攝氣禍殃速避靈風聚煙北都列言紫虛鬱秀輔翼萬仙鎮兆一身泥丸百關斬滅邪殃靈府氣宣萬神同會玉醴金樽千和萬合自然成真真中有神長生帝君青華大帝飛羅九神太一司命桃康合延執符把籙保命生根上遊上清出入華房八冥之內細微之中下鎮人身泥丸絳宮中理五氣混合百神十轉回靈萬氣齊仙仙道貴生無量度人上開八門飛天法輪罪福禁戒宿命因緣普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有空洞謡歌之章真王靈篇辭參髙真第一北都除殃上相飛空之音四馬揚鑣丹隨我輪飛雲如旗征此魔軍北都闐闐案牘紛紛愚為業因世植惡根殃自根生胡不爾悛念道太無委心帝前身佩八威金闕玉文十二大神為兆列陳除殃北尊乘駕鳳軒我行太空金廂玉轅俯視九州邈如深淵大道之妙非賢不傳聞此飛空音七祖升諸天第二北都除殃司命之章通晨大冠絳衣龍章惟我上笏司命之王上帝之策神璽之光來降北都蔭魁乘剛嚴備萬神侍書在傍為世之人生死尤殃龍祈北尊潔禱壇場敕命寶符仰貯靈光殃除福生壽䘵齊昌永離八難衰髙升紫雲房救世為真人範唱流無疆第三北都除殃北帝君歌曰三十六萬里北都羅酆山上有夜光闕下列九府官隂陽生死曹殃注停其間世愚不念道情欲相追攀出身百年中一往無再還地獄由爾心真境方寸邊何不謝北都默朝紫皇班首露革爾情天赦無留難一身可得道七祖超冥泉殃注永斷絶福來如轉丸我歎生死途萬劫囚幽關刻志禮神霄雲中仰金顔此三界之上飛空之中真魔歌音音參洞章誦之百遍名度南宮誦之千遍真魔保迎萬遍道備飛升太空過度三界位登仙公有聞靈音真魔敬形敕制地祇侍衛送迎拔出地户五苦八難七祖升遷永離殃纏魂度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及北都真元隱祕之音福佑生民消除殃禍有能起心祈向斷絶注傳橫害不生真靈垂蔭一身得道七祖升真皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寶祕於髙上神霄玉清玉府道君降聖按法以傳若有至人齎金寶質心依舊格告盟道君然後而付焉道言夫天地運度否終日月五星虧盈至聖神人休否末學之夫疾傷凡有此災同氣皆當齊心修齊六時行香十遍轉經福德立降消諸不祥無量之文普度無窮道言夫末學道淺或先品未充運應滅度身經太隂臨過之時同學至人為其行香誦經十過以度尸形如法則北都大帝玄滋天君監領殺鬼嚴敕幽方太一回生司命注昌使此形神固息含光魂神徑上南宮隨其學功計日而得更生輪轉不惑便得神仙道言大天地運終星宿錯度日月翳昏四時失度隂陽不調國境有災疫毒流行兆民死傷師友命過亦當修齊行香誦經夫齊戒誦經功德甚重上消天災保鎮帝王下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能為天地帝主兆民行是功德有災之日發心修齊燒香誦經十過皆諸天記名萬神侍衛右别至人尅得為聖君金闕之臣諸天記人功過毫分無失天中真王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君撰元始靈書北都除殃玉篇東方八天暨桓乙遲托圖延牝盧須迎皇迮羅紀清璞化馘廣娑賔雲承緬洛義忽猷郎匪京諸變方定益陀祖卿藍首伽婁亶迹墮昧覺邦𡡮廬英玄指門謁斗華溢晞俞嶽泰南方八天踴寧忌童炎窗赤功紹元帝祺令耙卷冲荑憫康洞幾賢特隆暉芒井墟隸邅俞蒙嬉云同宜逸鎖由夷爵恭韓延王頥預飛便梵竒綱素喧謹儀驛多斯靈變兹溟池西方八天色堂神禧薦福典隨驛洛規通咽服梁窺曆奔庚和彌錂藴微造星車禳回黃星微僥正絶仰徒姦報鎞越懋蕩宥曹巖丘佃卓頌嶤甫辨蕣揚艾紐資雲璫弼光迢泰北方八天晝謡瓊都北君隂拘勿淑令趣碧駢謨符洚道綿博映陛乾秀錠纍布酉拙倣晉酬熾瓶吳扶烈命𢍆斗巒正悽極動咸欹紐轉霞緑綱凝天扁陽吳投吉囉簿辰侣祥道言此諸天中大梵隱語無量之音舊文刻書酆城闍臺九阿之上使兆殃種不生為道正真逍遙無物字皆廣長一丈玄光真人昔書其文以為正音有知其音能齊而誦之者諸天皆遣考察真官下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大功真王保舉北元道備尅得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成天真自然之音也故誦之致考察下觀上帝遙唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅清河海靜默山嶽吞煙萬靈振伏招集羣仙天無氛穢地無祅塵冥慧洞清大量玄玄也元始無量度人上品妙經卷之四十

body:
  text: 安鎮九壘土祅不祥品道言昔於洞陽天中太微空歌晶華樂土受元始度人安鎮九壘土祅不祥妙品元始天尊當説是經周迥十過以召十方始當詣座天真大神上聖髙尊妙行真人仙王土皇官屬僚佐地真主宰無鞅數衆乘空而來黃雲度霄羽蓋琅輿彌覆九壘晃耀八冥流光錯落洞煥太空五日五夜諸天日月星宿璇璣玉衡一時停輪諸地海嶽洞穴溪壑碧華明徹風雲靜默天無浮翳地無伏祅一國地土林木原隰緬平一等無復髙下土皆作文玉雲霞炳煥無有異色衆真侍座元始天尊玄坐空浮九光金爓龍臺之上説經一遍大地土皇同時稱善俄頃五嶽靈宫化現真文説經二遍玄闕開通説經三遍醴泉湧出説經四遍山澤川源皆生祥瑞説經五遍地藏七寶流出人間説經六遍土祅鬼精捨邪歸正説經七遍禍害斷絶殃注消滅説經八遍北都羅酆九幽地獄一切罪魂並蒙原赦説經九遍鬼官主者咸進仙階説經十遍萬物遂性民無夭傷是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊説經一遍東方無極無量品色潤壘仙王土皇神君無鞅之衆浮空而至説經二遍南方無極無量品剛色壘仙王上皇神君無鞅之衆浮空而至説經三遍西方無極無量品石脂色壘仙王土皇神君無鞅之衆浮空而至説經四遍北方無極無量品潤澤壘仙王土皇神君無鞅之衆浮空而至説經五遍東北無極無量品金粟澤壘仙王土皇神君無鞅之衆浮空而至説經六遍東南無極無量品金剛鐡澤壘仙王土皇神君無鞅之衆浮空而至説經七遍西南無極無量品水制澤壘仙王土皇神君無鞅之衆浮空而至説經八遍西北無極無量品大風澤壘仙王土皇神君無鞅之衆浮空而至説經九遍上方無極無量品崑崙閬風珠闕瑶池八極靈仙九宮地真無鞅之衆浮空而至説經十遍下方無極無量品洞淵無色混黃洞空綱維壘仙王土皇神君無鞅之衆浮空而至十遍周竟十方無極九壘土司仙王皇君一時同至一國男女傾心歸仰來者有如密雪飛沙無鞅之衆迮國一半土皆偏陷非可禁止於是元始俯視九壘冥漠淵衆三十六宫諸大土皇殿闕臺觀冉冉上升至天尊所元始即以赤光火玉之拂輝映宫闕變為一珠初若彈丸三十六宫明徹可見元始再運神力揭此寶珠大如黍米在空玄之中去地九丈元始登引天真大神上聖髙尊妙行真人十方無極至真大神九壘仙王土皇神君無鞅數衆俱入寶珠之中天人仰看惟見勃勃從珠口中入既入珠口不知所在國人廓散地還平正無復欹陷元始即於寶珠之內照見九壘土祅惡鬼形狀種種不祥出示靈文安鎮除滅利益生民説經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人過值經法普得濟度全其本年無有中傷傾土傾仰咸居樂康不喜不怒不憂不悲不病不惱不苦不勞不擾不驚言歸至理意合天真齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊説經中所言並是九壘土皇內名隱韻之音亦是仙王內諱百靈之隱名也非世之常辭上聖已成真人通玄究微能悉其章誦之十過諸天遙唱萬帝設禮九壘明正土祅束形謹守天勑不敢害人上帝律令速付天丁至學之士誦之十過則五土聽命三玄稽首邪精喪眼土魔滅爽濟度垂死絶而得生所以爾者學士德化未充道未合真以制十方威未制九宮德可伏御百祅束縳魔靈但却死而已不能更生輕誦此章身則被殃供養尊禮門尸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙安鎮黃闕普掃不祥度人無量為九地之宗巍巍大範德難可勝道言凡誦是經十過九壘三十六仙王土皇神君齊到除蕩土祅刑犯地下害氣勑攝土公畏法護人億曽萬祖幽魂苦爽皆即受度上升朱官格皆九年受化更生得為貴人而好學至經功滿德就皆得神仙飛升金闕遊宴玉京也上學之士修誦是經中宮土德靈寶真人降浩元之氣流入身中皆即受度飛升南宮世人受誦則地司毀券不敢拘形償骨地官延壽長年後皆得作尸解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃沈九壘長役土官侍經五帝玉童玉女各三十六人營衛神文保護受經者身道言正月長齋誦詠是經安鎮青赤土政辟除九壘一十二種土殃注氣為上世亡魂斷地逮役度上南宫七月長齋誦詠是經安鎮白黃土司辟除九壘一十二種土殺刑氣身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經安鎮玄黑土官辟除九壘一十二種土怪害氣為國王帝主君臣父子安鎮國祚保天長存世世不絶常為人君安鎮其方民稱太平八節之日誦詠是經八方福土併及一身得為九宮真人本命之日誦詠是經土官降福軒始延齡仙王護命命存黃庭真人飲兆華池魂神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐黃黑紫三色雲氣之中內外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室內項生圎象光映十方如此分明密呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齋清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引氣三十二過東向誦經元始無量度人上品妙經元始洞玄靈寶本章安鎮九壘土祅不祥開闢妙品綿劫度人正行遊梵升降自然混極九輪虛無至真玄元祖氣流結成形風淵包絡妙運生根大法保鎮群類化成碧林蒼池羅列玄靈九光總統上帝玉文離合變立赤運開明太空輪轉飛範真香是為沖妙玄中之玄鬱壘六交攝御崑山下纒風澤劫仭泉臺茫茫大化晨浩凝精三真廣延黃耀琳庭軒始昌陽甲土元卿紫煙絳霞照朗髙清役使百魔坐鎮十方中有元關布氣之真中有通靈合變之君中有考察開化大神中有伏邪滅祅丈人中有九冥洞淵洞極載天持地皇老尊神共敷至教大道化身今日安鎮萬聖臨軒東方無極保世神王長生大聖無量度人南方無極滅祅神王長生大聖無量度人西方無極辟邪神王長生大聖無量度人北方無極伐惡神王長生大聖無量度人東北無極旺德神王長生大聖無量度人東南無極開道神王長生大聖無量度人西南無極正氣神王長生大聖無量度人西北無極成化神王長生大聖無量度人上方無極上清神王長生大聖無量度人下方無極風澤神王長生大聖無量度人十方至真九壘神王長生度世無量大神並乘黃雲絳輿翠輦黃蓋飛輪驂駕白虎玄鳳丹鸞建伏魔之節神錦龍旗前導耀昌主帥後從虎口上龍獅子麒麟左右騰擲七聖啓途四明捧轅億靈萬仙浮空而來泛氣太虛飛光景霄中元翼相靈紐右宫玄滋上佐太隂尊神總領地真齊到帝前隨所安鎮永保無傾普告九壘八極靈關混黃之闕蒼碧之庭三十六君化氣九宫洞天曹局山澤川源五河八海雙光洞泉三玄四始一切神靈收捕土祅殺伐邪精北都羅酆拘制鬼營生民安泰國祚清平死魂遷化白骨成人生身受度與氣長存因緣輪轉上升諸天永斷地下一十五種害物土祅殄滅不祥肅清四冥四冥之天天帝混成合道之境梵行東方八天黃中理玄天帝流銖延孫九壘神空天帝閟康庸極真耀和天帝閣曲尚筌生津布華漱靈天帝祕景丕瓊道昭厚化天帝照無敵元太沖德容天帝靈梵度光靜順頥元天帝抱由究非祖生無咎天帝唱息隱宫南方八天火壁赤墳天帝念極住元張泠流經天帝握善愈揚梵元度空天帝靜朱勝龍秀嬰委素天帝爍羅童瞻嶧穴妙光天帝石沖亮夫盤基微虛天帝直紀敦時陽𨽻曲池天帝殿祺祐山土府察獄天帝育神祕樞西方八天孔升幽化天帝嗇益至迥皇崖祖靈天帝瑶慶備修幽古繁宜天帝白元孔相陸冥四存天帝覺道屇純洞江微滸天帝梵龍九阿微生浩景天帝催謁令存離真樂常天帝兆復素空精纒次瑶天帝結絳特明北方八天太虛梵容照無天帝寧輔郎須太虛寶劫厚成天帝祝耻都安直明辨孚進志天帝邊落時明斗璣晃霄天帝極化塗先進神敷生天帝蔚伨無升翊皇總壘天帝迪諒切定懹察隂天帝悲豫蒙思貴利升遊逹真天帝無求太庸三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章九壘隱韻土皇之音仙王之尊土皇之神九都大魔風澤之靈九纒十壘混化元根妙會之祖德難可稱羅布靈真總治神機今日欣慶安鎮九壘斬斷土祅絶滅不祥升降道氣通運靈津土水風界二十七重真王檢察統御神功東極納氣西極結精北極合體南極成形中極上嶽盤鎮重冥青帝開機白帝握關赤帝運軸黑帝導脈黃帝合和祅𦍙蕩息青界神王龍剛耀密赤升神王炎華勵翼白界神王驍鋒電觸黑界神王含威冒育黃界神王該持洞極五界大神厚地之宗遊行地境部制靈官揮戈仗鉞總轄下司掌握綱紐體用之資造化生成並𨽻玄樞上承天政開闢隂陽交和一德品物隆昌蘷師攝毒虎將祛凶威兵振奕麟獸騰驤飛光八垣抗禦十鄉敢有干逆拒遏真皇金精啖食神獸吞傷殘割妖爽所誅無蠲群魔束首萬鬼潛形山川靜肅草本敷榮三光五老塞閉邪源不得容隱金馬驛傳普告無窮萬化敷宣九壘皇君列奏上玄虛無淪化開列乾坤元氣時浩混沌之形輕清上浮堅濁下凝劫數自然乘陽結隂真精間錯金剛鐵輪連構宫府寓屬其間內司真宰協治靈仙分稟三玄建號土皇統括機紐運度無窮不容怪沴致害祅凶五方安鎮敷落真文八會赤書玉字之章保持災運地軸無傾梵氣彌羅萬範開張元綱流演九壘重隂輪轉無色周回洞冥旋氣歷關回度合明三十六宫總理下元八景混合上入髙玄玄中帝皇無土玉真布衍太和黃一之靈包羅海嶽灌養流形玉華聚質神景生煙五山鬱秀環拱萬天上通下接升降自然中有真神洞皇天君坤元聖母后土尊靈甲土軒始輔正九官執符把籙保鎮地根遊行洞臺出入冥津淵窮之境香眇之中下鎮人身紫闕丹田中合五氣大混百神十轉回靈萬氣齊仙仙道貴生無量度人下鎮九壘開化法輪禍福教化命蒂因緣普受開度萬彚生全生道既昌下告幽玄玄關之內各有生門中有元洞謡歌之章真王靈篇辭參髙真第一安鎮九壘空洞之音元一結氣混洞之中下成形兮盤礴冥空地綱植根內有靈真號曰土皇君受位於帝宸宫府三十六經維統萬神金石相纒固機會總崑崙虛涵溟渤津風澤常彌綸妙理宗靈寶厚德堅無傾勃化周大數蛟龍俱負乘正道順自然祅姦何以興二儀通至用玄合保黃寧第二辟除土祅之章元始洞章靈妙結神下統帝氣檢攝群真勑命土皇三十六君稟承至用開闢地關九淵重壘祅滯蠲消沖德含和融融散寥運我正道混合玄標精禍滅兮品物逍遙保制劫災永亨利貞生靈樂子賴我髙宸科範宣布絶滅凶姦無窮無極海嶽滄茫衛養生成流形化光普世受度功歸上王第三却滅不祥歌曰九壘之下冥冥洞關綱維梵氣混渺玄虛中有真皇承化開方持運至氣條逹隂陽乖沴通釋祛蕩不祥無上玉文散禍滅殃地根綿邈神精化騰上陟昆丘升降纒旋沖妙周流萬寶清貞人道安泰福德相乘國界靜肅浩劫無淪巍巍太上尊部制神明宗萬境合玄圖生成保所同此三界之上飛空之中真王歌音音參洞章誦之百遍名度南宫誦之千遍真王保迎萬遍道備飛升太空過度三界位登仙公有聞靈音魔王敬形勑制地祇侍衛送迎拔出九壘五苦八難七祖升遷永離鬼官魂度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及九壘三十六宫土皇仙王隱祕之音安鎮土祅不得刑犯方隅祟害民物皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寶祕於神霄王清玉府東寶元堂運遇壬辰應數下傳若有至人齎金寶質心依舊格告盟玉玄然後而付焉道言夫地震山搖亦法氣運土陷坼裂亦由時曆九壘之大亦有祅祥凡有此災至士皆當齊心修齋六時行香十遍轉經福德立降保鎮不祥無量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太隂還骸土宫鍊骨重壘戀土為宅幽魂不悟臨過之時同學至人為其行香誦經十過以度尸形如法土皇辟斥祅凶安鎮百神計日而得更生轉輪不惑便得神仙道言夫天地之內天有九霄地有九壘一壘去天九十萬七千二百里九壘之下復去天一千二百一十八萬里則九壘上當昆崘在天之中正如卵內之黃混也土官有洞元之殿通隂之闕四十二曹其下則總為地司以治罪魂復有三十六洞仙王以居地下一切神靈攝御三十六種土祅怪異害誣生人冢宅不安水火為禍皆當修齋行香誦經夫齋戒誦經功德甚重上消天災安鎮九壘土祅不祥下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能為天地帝主安鎮國土兆民辟却禍殃有災之日發心修齋行香誦經十過皆諸天降真消滅不祥右别至人剋得為聖君金闕之臣諸天記人功過毫分無失天中真魔亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君撰元始靈書九壘妙篇東方八天杳洞蘭澮演明機珠耀璉益闔理丙玄舒曰苴載精圎奔海逋現祥留寂央笳潔圖律帝陽辭求開拯需約淳騎伸並散窈符濺積柯能正伎逸蘇沖維泰蝗熾度爓無南方八天赫延亘咖龍羅景吠蕩球送真祅伏屏異群苛曆盤變枚遼治謁濟橫博亭微綿禧衝計忌火落蘭侯師古洞無傑命青祈兹溢毒梁貝範尹凝施玦育衡定固賔邈冝西方八天邊奚巒卿孟初浩泰質福枚塗婁空止當光展論符救化度戒和召總靈察迅出辨鷲鸑吕余池名普觀優揓木多時萌正載魁鎮壘塊真妙驛大文戎竉渦柳倩推界北方八天紫雲藹都八景俱緾間羅蒙星祝舉夷騫叱張度宫救曾路宜傍默明徒衣飛寥玄漠題運沙稠祁英堅本漿極陽泛席心佺車勑放縳鄰枯劫般直戶遘同司兵拱仙道言此諸天中安鎮九壘大梵隱語無量之音舊文刋書王屋清虛小有洞天地官黃玉闕門之上以鎮九壘災氣土祅不祥字皆廣長一丈天真皇人昔書其文以為正音有知其音能齋而誦之者諸天皆遣檢地神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳真王保舉隱地道備剋得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成天真自然之音也故誦之致諸天下觀上帝遙唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響十方肅清河海靜默山嶽吞煙萬靈振伏招集群仙天無氛穢地無祅塵冥慧洞清大量玄玄也元始無量度人上品妙經卷之四十八

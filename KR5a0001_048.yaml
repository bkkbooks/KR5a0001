body:
  text: 安鎮九壘土祅不祥品道言昔於洞陽天中太微空歌晶華樂土受元始度人安鎮九壘土祅不祥妙品元始天尊當說是經周迥十過以召十方始當詣座天真大神上聖髙尊妙行真人仙王土皇官屬僚佐地真主宰无鞅數衆乗空而來黄雲度霄羽蓋琅輿彌覆九壘晃燿八冥流光錯落洞煥太空五日五夜諸天日月星宿璇璣玉衡一時停輪諸地海嶽洞穴谿壑碧華明徹風雲靜黙天无浮翳地无伏祅一國地土林木原隰緬平一等无復髙下土皆作文玉雲霞炳煥无有異色衆真侍座元始天尊玄坐空浮九光金爓龍臺之上說經一徧大地土皇同時稱善俄頃五嶽靈宫化現真文說經二徧玄闕開通說經三徧醴泉湧出說經四徧山澤川源皆生祥瑞說經五徧地蔵七寳流出人間說經六徧土祅鬼精捨邪歸正說經七徧禍害斷絶殃注消滅說經八徧北都羅酆九幽地獄一切罪䰟並蒙原赦說經九徧鬼官主者咸進仙階說經十徧萬物遂性民无夭傷是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一徧東方无極无量品色潤壘仙王土皇神君无鞅之衆浮空而至說經二徧南方无極无量品剛色壘仙王上皇神君无鞅之衆浮空而至說經三徧西方无極无量品石脂色壘仙王土皇神君无鞅之衆浮空而至說經四徧北方无極无量品潤澤壘仙王土皇神君无鞅之衆浮空而至說經五徧東北无極无量品金粟澤壘仙王土皇神君无鞅之衆浮空而至說經六徧東南无極无量品金剛鐡澤壘仙王土皇神君无鞅之衆浮空而至說經七徧西南无極无量品水制澤壘仙王土皇神君无鞅之衆浮空而至說經八徧西北无極无量品大風澤壘仙王土皇神君无鞅之衆浮空而至說經九徧上方无極无量品崑崙閬風珠闕瑶池八極靈仙九宮地真无鞅之衆浮空而至說經十徧下方无極无量品洞淵无色混黄洞空綱維壘仙王土皇神君无鞅之衆浮空而至十徧周竟十方无極九壘土司仙王皇君一時同至一國男女傾心歸仰來者有如宻雪飛沙无鞅之衆迮國一半土皆偏䧟非可禁止於是元始俯視九壘冥漠淵衆三十六宫諸大土皇殿闕臺觀冉冉上昇至天尊所元始即以赤光火玉之拂煇映宫闕變爲一珠初若彈丸三十六宫明徹可見元始再運神力揭此寳珠大如黍米在空玄之中去地九丈元始登引天真大神上聖髙尊妙行真人十方无極至真大神九壘仙王土皇神君无鞅數衆俱入寳珠之中天人仰看惟見勃勃從珠口中入既入珠口不知所在國人廓散地還平正无復欹䧟元始即於寳珠之内照見九壘土祅惡鬼形狀種種不祥出示靈文安鎮除滅利益生民說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂无遺響是時天人過值經法普得濟度全其本年无有中傷傾土傾仰咸居樂康不喜不怒不憂不悲不病不惱不苦不勞不擾不驚言歸至理意合天真齊同慈愛異骨成親國安民豐欣樂太平經始岀教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是九壘土皇内名隱韻之音亦是仙王内諱百靈之隱名也非世之常辭上聖已成真人通玄究微能悉其章誦之十過諸天遥唱萬帝設禮九壘明正土祅束形謹守天勑不敢害人上帝律令速付天丁至學之士誦之十過則五土聽命三玄稽首邪精喪眼土魔滅爽濟度垂死絶而得生所以爾者學士德化未充道未合真以制十方威未制九宮徳可伏御百祅束縳魔靈但却死而已不能更生輕誦此章身則被殃供養尊禮門尸興隆世世昌熾與善因縁萬災不干神明䕶門斯經尊妙安鎮黄闕普掃不祥度人无量爲九地之宗巍巍大範德難可勝道言凡誦是經十過九壘三十六仙王土皇神君齊到除蕩土祅刑犯地下害氣勑攝土公畏法護人億曽萬祖幽䰟苦爽皆即受度上昇朱官格皆九年受化更生得爲貴人而好學至經功滿徳就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經中宮土德靈寳真人降浩元之氣流入身中皆即受度飛昇南宮世人受誦則地司毀券不敢拘形償骨地官延壽長年後皆得作尸解之道䰟神暫滅不經地獄即得返形遊行太空此經微妙普度无窮一切天人莫不受慶无量之福生死蒙惠上天所寳不傳下世至士齎金寳效心盟天而傳輕泄漏慢殃沈九壘長役土官侍經五帝玉童玉女各三十六人營衛神文保護受經者身道言正月長齋誦詠是經安鎮青赤土政辟除九壘一十二種土殃注氣爲上世亡䰟斷地逮役度上南宫七月長齋誦詠是經安鎮白黄土司辟除九壘一十二種土殺刑氣身得神仙諸天書名黄籙白簡削死上生十月長齋誦詠是經安鎮玄黒土官辟除九壘一十二種土怪害氣爲國王帝主君臣父子安鎮國祚保天長存世世不絶常爲人君安鎮其方民稱太平八節之日誦詠是經八方福土併及一身得爲九宮真人本命之日誦詠是經土官降福軒始延齡仙王護命命存黄庭真人飲兆華池䰟神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐黄黑紫三色雲氣之中内外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室内項生圎象光映十方如此分明宻呪曰无上玄元太上道君召岀臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齋清堂修行至經无量度人願所啓上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始无量度人上品妙經元始洞玄靈寳本章安鎮九壘土祅不祥開闢妙品綿劫度人正行遊梵升降自然混極九輪虚无至真玄元祖氣流結成形風淵包絡妙運生根大法保鎮群類化成碧林蒼池羅列玄靈九光緫統上帝玉文離合變立赤運開明太空輪轉飛範真香是爲冲妙玄中之玄鬱壘六交攝御崑山下纒風澤劫仭泉臺茫茫大化晨浩凝精三真廣延黄燿琳庭軒始昌陽甲土元卿紫煙絳霞照朗髙清役使百魔坐鎮十方中有元關布氣之真中有通靈合變之君中有考察開化大神中有伏邪滅祅丈人中有九冥洞淵洞極載天持地皇老尊神共敷至教大道化身今日安鎮萬聖臨軒東方无極保世神王長生大聖无量度人南方无極滅祅神王長生大聖无量度人西方无極辟邪神王長生大聖无量度人北方无極伐惡神王長生大聖无量度人東北无極旺德神王長生大聖无量度人東南无極開道神王長生大聖无量度人西南无極正氣神王長生大聖无量度人西北无極成化神王長生大聖无量度人上方无極上清神王長生大聖无量度人下方无極風澤神王長生大聖无量度人十方至真九壘神王長生度世无量大神並乗黃雲絳輿翠輦黄蓋飛輪驂駕白虎玄鳳丹鸞建伏魔之節神錦龍旗前導燿昌主帥後從虎口上龍獅子麒麟左右騰擲七聖啓途四明捧轅億靈萬仙浮空而來泛氣太虚飛光景霄中元翼相靈紐右宫玄滋上佐太隂尊神緫領地真齊到帝前隨所安鎮永保无傾普告九壘八極靈關混黄之闕蒼碧之庭三十六君化氣九宫洞天曹局山澤川源五河八海雙光洞泉三玄四始一切神靈收捕土祅殺伐邪精北都羅酆拘制鬼營生民安泰國祚清平死䰟遷化白骨成人生身受度與氣長存因縁輪轉上升諸天永斷地下一十五種害物土祅殄滅不祥肅清四冥四冥之天天帝混成合道之境梵行東方八天黄中理玄天帝流銖延孫九壘神空天帝閟康庸極真燿和天帝閤曲尚筌生津布華漱靈天帝祕景丕瓊道昭厚化天帝照無敵元太沖德容天帝靈梵度光靜順頥元天帝抱由究非祖生無咎天帝唱息隱宫南方八天火壁赤墳天帝念極住元張泠流經天帝握善愈揚梵元度空天帝靜朱勝龍秀嬰委素天帝爍羅童瞻嶧穴妙光天帝石沖亮夫盤基微虚天帝直紀敦時陽𨽻曲池天帝殿祺祐山土府察獄天帝育神祕樞西方八天孔升幽化天帝嗇益至迥皇崖祖靈天帝瑶慶備修幽古繁宜天帝白元孔相陸冥四存天帝覺道屇純洞江微滸天帝梵龍九阿微生浩景天帝催謁令存離真樂常天帝兆復素空精纒次瑶天帝結絳特明北方八天太虛梵容照無天帝寧輔郎須太虚寳劫厚成天帝祝耻都安直明辨孚進志天帝邊落時明斗璣晃霄天帝極化涂先進神敷生天帝蔚伨無升翊皇緫壘天帝迪諒切定懹察隂天帝悲豫蒙思貴利升遊逹真天帝無求太庸三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章九壘隱韻土皇之音仙王之尊土皇之神九都大魔風澤之靈九纒十壘混化元根妙會之祖德難可稱羅布靈真緫治神機今日欣慶安鎮九壘斬斷土祅絶滅不祥升降道氣通運靈津土水風界二十七重真王檢察統御神功東極納氣西極結精北極合體南極成形中極上嶽盤鎮重冥青帝開機白帝握關赤帝運軸黑帝導脉黄帝合和祅𦍙蕩息青界神王龍剛燿宻赤昇神王炎華勵翼白界神王驍鋒電觸黑界神王含威冒育黄界神王該持洞極五界大神厚地之宗遊行地境部制靈官揮戈仗鉞緫轄下司掌握綱紐體用之資造化生成並𨽻玄樞上承天政開闢隂陽交和一德品物隆昌蘷師攝毒虎將祛凶威兵振奕麟獸騰驤飛光八垣抗禦十鄉敢有干逆拒遏真皇金精啖食神獸吞傷殘割妖爽所誅无蠲群魔束首萬鬼潜形山川靜肅草本敷榮三光五老塞閉邪源不得容隱金馬驛傳普告无窮萬化敷宣九壘皇君列奏上玄虚无淪化開列乾坤元氣時浩混沌之形輕清上浮堅濁下凝劫數自然乗陽結隂真精間錯金剛鐵輪連構宫府寓屬其間内司真宰恊治靈仙分禀三玄建號土皇統括機紐運度无窮不容怪沴致害祅凶五方安鎮敷落真文八會赤書玉字之章保持災運地軸无傾梵氣彌羅萬範開張元綱流演九壘重隂輪轉无色周回洞冥旋氣歷關迴度合明三十六宫緫理下元八景混合上入髙玄玄中帝皇无土玉真布衍太和黄一之靈包羅海嶽灌養流形玉華聚質神景生煙五山鬱秀環拱萬天上通下接升降自然中有真神洞皇天君坤元聖母后土尊靈甲土軒始輔正九官執符把籙保鎮地根遊行洞臺出入冥津淵窮之境香眇之中下鎮人身紫闕丹田中合五氣大混百神十轉回靈萬氣齊仙仙道貴生无量度人下鎮九壘開化法輪禍福教化命蔕因縁普受開度萬彚生全生道旣昌下告幽玄玄關之内各有生門中有元洞謡歌之章真王靈篇辭參髙真第一安鎮九壘空洞之音元一結氣混洞之中下成形兮盤礴冥空地綱植根内有靈真號曰土皇君受位於帝宸宫府三十六經維統萬神金石相纒固機會緫崑崙虚涵溟渤津風澤常彌綸妙理宗靈寳厚德堅無傾勃化周大數蛟龍俱負乗正道順自然祅姦何以興二儀通至用玄合保黄寧第二辟除土祅之章元始洞章靈妙結神下統帝氣檢攝群真勑命土皇三十六君禀承至用開闢地關九淵重壘祅滯蠲消沖德含和融融散寥運我正道混合玄標精禍滅兮品物逍遥保制劫災永亨利貞生靈樂子頼我髙宸科範宣布絶滅凶姦无窮无極海嶽滄茫衞養生成流形化光普世受度功歸上王第三却滅不祥歌曰九壘之下冥冥洞關綱維梵氣混渺玄虚中有真皇承化開方持運至氣條逹隂陽乖沴通釋祛蕩不祥无上玉文散禍滅殃地根綿邈神精化騰上陟崐丘升降纒旋沖妙周流萬寳清貞人道安泰福德相乗國界靜肅浩劫无淪巍巍太上尊部制神明宗萬境合玄圖生成保所同此三界之上飛空之中真王歌音音參洞章誦之百徧名度南宫誦之千徧真王保迎萬徧道備飛升太空過度三界位登仙公有聞靈音魔王敬形勑制地祇侍衛送迎拔出九壘五苦八難七祖升遷永離鬼官䰟度朱陵受鍊更生是謂无量普度无窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及九壘三十六宫土皇仙王隱祕之音安鎮土祅不得刑犯方隅祟害民物皆是大梵之言非世上常辭言无韻麗曲无華宛故謂玄奥難可尋詳上天所寳祕於神霄王清玉府東寳元堂運遇壬辰應數下傳若有至人齎金寳質心依舊格告盟玉玄然後而付焉道言夫地震山摇亦法氣運土䧟坼裂亦由時曆九壘之大亦有祅祥凡有此災至士皆當齊心修齋六時行香十徧轉經福德立降保鎮不祥无量之文普度无窮道言夫末學道淺或仙品未充運應滅度身經太隂還骸土宫鍊骨重壘戀土爲宅幽䰟不悟臨過之時同學至人爲其行香誦經十過以度屍形如法土皇辟斥祅凶安鎮百神計日而得更生轉輪不惑便得神仙道言夫天地之内天有九霄地有九壘一壘去天九十萬七千二百里九壘之下復去天一千二百一十八萬里則九壘上當崐崘在天之中正如卵内之黄混也土官有洞元之殿通隂之闕四十二曹其下則總爲地司以治罪䰟復有三十六洞仙王以居地下一切神靈攝御三十六種土祅怪異害誣生人冢宅不安水火爲禍皆當修齋行香誦經夫齋戒誦經功德甚重上消天災安鎮九壘土祅不祥下禳毒害以度兆民生死受頼其福難勝故曰无量普度天人道言凡有是經能爲天地帝主安鎮國土兆民辟却禍殃有災之日發心修齋行香誦經十過皆諸天降真消滅不祥右别至人剋得爲聖君金闕之臣諸天記人功過毫分无失天中真魔亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語无量音道君撰元始靈書九壘妙篇東方八天杳洞蘭澮演明機珠燿璉益闔理丙玄舒曰苴載精圎奔海逋現祥留寂央笳潔圖律帝陽辭求開拯需約淳騎伸並散窈符濺積柯能正伎逸甦沖維泰蝗熾度爓无南方八天赫延亘咖龍羅景吠蕩球送真祅伏屏異群苛曆盤變枚遼治謁濟横博亭微綿禧衝計忌火落蘭侯師古洞无傑命青祈兹溢毒梁貝範尹凝施玦育衡定固賔邈冝西方八天邊奚巒卿孟初浩泰質福枚涂婁空止當光展論符救化度戒和召緫靈察迅出辯鷲鸑吕余池名普觀優揓木多時萌正載魁鎮壘塊真妙驛大文戎竉渦柳倩推界北方八天紫雲藹都八景俱緾間羅蒙星祝舉夷騫叱張度宫救曾路宜傍嘿明徒衣飛寥玄漠題運沙稠祁英堅本漿極陽泛席心佺車勑放縳鄰枯劫般直戸遘同司兵拱仙道言此諸天中安鎮九壘大梵隱語无量之音舊文刋書王屋清虛小有洞天地官黄玉闕門之上以鎮九壘災氣土祅不祥字皆廣長一丈天真皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣檢地神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勲真王保舉隱地道備剋得遊行三界升入金門此音无所不辟无所不禳无所不度无所不成天真自然之音也故誦之致諸天下觀上帝遥唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響十方肅清河海靜黙山嶽吞煙萬靈振伏招集群仙天无氛穢地无祅塵冥慧洞清大量玄玄也元始无量度人上品妙經卷之四十八

front:
  text: 靈寶無量度人上品妙經卷之五十五宙五
  hash: sha256:a1002e59b8975bace82ba4dd4b51d37398cfead1b76d2051fde6cd07fcb0efb3
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_055-001a, image: hfl/0011/0011-168.png}
body:
  text: 追度上世亡魂品道言昔於龍梵天中景霄幽歌大鍊化土受元始度人追度上世亡魂無量上品元始天尊當說是經周回十過以召十方始當詣座九皇上真飛天大聖妙行真人玄中法師洞隂朔單鬱絶之境五靈玄老黑帝天君酆都北帝六天大魔救苦靈仙九宮曹屬三元考魂無鞅數衆乘空而來三素飛雲八景霄輿華蓋垂䕃碧翠交光九色瓊蕤洞煥太空七日七夜諸天臺城樓觀影徹幽寥珠緯玉毫停輪息耀神風襲瑞空藏傾波一國地土山川林木緬平一等無復髙下土皆作青玉萬里通映無有異色衆真侍座元始天尊玄坐空浮九光寶局之上說經一遍諸天大聖同時稱善是時大地衆生祖先積罪咸䝉赦原說經二遍光照九幽開悟宿命說經三遍雲周道境甘露灑空說經四遍火山息焰寒池靜波說經五遍地獄弛關幽魂解脫說經六遍落滅惡根不沈苦趣說經七遍焚燒黑簿考對休間說經八遍泉曲冥官進升仙品說經九遍暗域飛雲陽光蕩翳說經十遍枯骨更生皆起成人是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品青宫救苦大神無鞅之衆浮空而至說經二遍南方無極無量品朱宫明悟大神無鞅之衆浮空而至說經三遍西方無極無量品素靈宫玄定大神無鞅之衆浮空而至說經四遍北方無極無量品紫元官幽感大神無鞅之衆浮空而至說經五遍東此無極無量品酆都宮雲營大神無鞅之衆浮空而至說經六遍東南無極無量品九幽宮拔罪大神無鞅之衆浮空而至說經七遍西南無極無量品泉曲宮度生大神無鞅之衆浮空而至說經八遍西北無極無量品天福宫超化大神無鞅之衆浮空而至說經九遍上方無極無量品真都宮靈妙大神無鞅之衆浮空而至說經十遍下方無極無量品玄妙宫寂定大神無鞅之衆浮空而至十遍周竟十方無極升度苦爽天真大神一時同至元始天尊初說法時一國男女各各追懷上世亡魂億曽萬祖古往先親或繫宿因承於業力已遂生方遨遊三界或尚沈幽境滯爽冥關代歷綿長時丁久遠魂無依止體化塵埃性識未消尚存心念罹斯隂罪必犯陽愆今遇元始將陳追度之法慶㑹無邊願虛俟教廣利有生是時天尊四觀天人一切鬼神一方聖衆舉山水雲霞之袂揮九色碧光宛轉之紱良久之頃以九色碧光一縷之絲垂明下徹遙至九壘七圍鐡山之間十大地獄方面八千餘里髙廣深厚其量過之隨此碧光一縷之絲拔地之聲六種俱振猶於大海交磕二山亦如諸天五雷併起正行遊梵三十六宮應時傾動北酆諸大地獄翩翩高舉下離冥漠升於絶空碧紱之絲挽提獄頂洞出剛風及於天界以此大獄繫於絲杪形如彈丸無量之衆瞻矚無礙皆見諸大地獄五刑萬苦血刃火然表裹明覩不有纎障各見有罪祖光受諸苦報禁考獄中哀吟求救一切衆生見此事相舉聲號泣響震諸天祈告虛皇願垂追度元始怡顏微笑即於頂上出大光明煥照天地於光明中有赤文雲書升天寶券芒金角玉蚪曲詳分示衆宣言爾等衆生上世亡魂用此追度之法周回十過皆獲升天來者霧合雲屯非可禁止迮國一半土皆偏陷乃懸一寶珠大如黍米在空玄之中去地九丈元始登引天真大神上聖髙尊十方救苦拔罪真人至真大神無鞅數衆俱入寶珠之中天人仰看惟見拂拂從珠口中入既入珠口不知所在國人廓散地還平正無復欹陷元始即於寶珠之內說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟惠拔度祖先不墮惡道傾土歸仰咸行孝心能敬能讓能廉能貞能桑能和能奉能承能忍能養心無悖慢口無怨言齊同慈愛異國成親國安民豐欣樂太平經始出教一國以道預有志心宗奉禮敬皆得度世道言元始天尊說經中所言竝是諸天上帝內名隱韻之音亦是真王內諱百靈之隱名也非世之常辭上聖已成真人通玄究微能悉其章誦之十過諸天遙唱萬罪悉原上世亡魂皆獲升仙旁資一切普度萬生回尸起死白骨成人至學之士誦之十過則五嶽奏刺三官奉詞幽魂遷化逝魄超升濟度亡殁絶而得生所以爾者學士道德未充體未洞真以制十方威未制天政德可伏御地祇資濟幽靈濟拔祖先而已輕誦此章身則被殃供養尊禮門戶興隆世世昌熾與善因緣萬炎不干神明護門斯經尊妙獨步玉京度人無量為萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到億曾萬祖幽魂苦爽皆即受度上升朱宫格皆九年受化更生得為貴人而好學至經功滿德就追度髙玄皆得神仙飛升金闕遊宴玉京也上學之士修誦是經上世亡魂皆即追度飛升南宮世人受誦則亡過祖考得太隂鍊形之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死䝉恩上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及子孫長役三宮侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齊誦詠是經為上世亡魂斷地逮役度上南宫七月長齊誦詠是經九祖七玄升入天門赦罪遷善身得神仙十月長齊誦詠是經追度古先眷屬億逺幽靈即獲鍊化刻録太清八節之日誦詠是經遠世魂爽罪滅北都酆山息考罷役河源得為九宫真人本命之日誦詠是經玄堂七世往劫滯魂靈肉附骨近生為人魂神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齊戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐碧紫絳三色雲氣之中內外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室內十方救苦無量大神駐輦空極項生圓象光映十方如此分明密呪曰無上玄元太上道君召出臣身中三五功曹左君官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齊濟堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引氣三十二過東向誦經元始無量度人上品妙經元始洞玄靈寶本章追度上世亡魂十遍度人九冥隱韻開化自然空洞降靈太虛生神總治法象統歸三元瓊宫大聖髙居帝尊敷弘至妙考校因緣青編丹簡紀録玄文元陽紫微方諸洞泉太隂署罰火官舉遷生民隨業攝送酆山九河六洞萬鬼之營火城劒樹沸鑊寒庭鬼帥大魔考責罪魂元始玉符下拔幽扄普為衆生追度祖先上詣朱陵功告三官五嶽四瀆名山大川水府洞宮主宰神靈原赦滯爽不得稽停大㑹玄都速召萬神中有東極尋聲赴感太一救苦天尊中有度魂化形之君中有太冥鍊尸大神中有大慈妙行真人中有天樞天機好生文昌延壽度厄尊神招靈太玄無量度人今日校録諸天臨軒東方無極龍威神王長生大聖無量度人南方無極丹靈神王長生大聖無量度人西方無極皓華神王長生大聖無量度人北方無極玄英神王長生大聖無量度人東北無極鍊度神王長生大聖無量度人東南無極變身神王長生大聖無量度人西南無極復相神王長生大聖無量度人西北無極正精神王長生大聖無量度人上方無極火府神王長生大聖無量度人下方無極返形神王長生大聖無量度人十方至真飛天度魂超化神王長生度世無量大神竝乘八景琅輿飛雲葆蓋霞輦飈輪驂駕天馬白鳳青鸞建玄靈翠節緑羽龍幡前導鈞天廣樂後參八素陽歌巨象麒麟翼衛辟邪十精啓途七辰捧轅億靈萬神浮空而來光明照耀洞朗諸天神霄府相元黃左宮陶公仙伯執籙把籍齊到帝前普度衆生上世亡魂勑攝鬼帝來聽教言羅鄷六宫隂洞鐵山賔友僚佐四大明公司禁侍宸北河列侯各持黑簿削落罪根不得拘留逼合鬼群元始符命時刻升遷息苦寒池濯灌天津制魔保舉度品南宫九玄受錬仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度風火刀兵考訟連對之難超凌三界逍遙上清上清之天天帝合延無色之境梵行東方八天基化正宣天帝變津冝由明應玄天帝遍臻元極樂樞冥天帝六關玄玄變真九仙天帝陳希務夸耀靈華運天帝㨂丘澤方不驕悲識天帝覺海雲佑棋素寶周儲天帝栁䝉少滋歷爽古澠弘思天帝季路時南方八方李檀舜籍天帝木瑘舒霞洞宴王天帝景唐無央剎聽化髙天帝效慈澆穹封冥録隂天帝伯皇宥中魂度升慶天帝用鄰德光超對希樂天帝息常如慈登福果天帝不逸披門神校司官領録天帝蹈兟修璵西方八天應祈藤妙天帝適端俟通化慮仙易真天帝靖常嵩久世坰畿影化天帝虛凡自微道户寂然天帝吉動寵邦慜正遙靈師補天帝照符率從玉都蕭韓主成天帝命玄冲升虛玄變天帝乞章融留梵行太無天帝攝神總靈北方八天太微玉華天帝流傞宛興微覺宗仙天帝正刀蒲王度靈蹟真天帝椰題衍衡董正黎辨天帝步鏘極真隂臺總按天帝奏猗連嶽詔遷證天帝唐曜明輪龍化珍惠天帝定智丕旋女青攄文天帝阿都祉踈三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻返空之音化靈之尊追度之神監魂大魔返生之靈九聖十真變化上清無量之奧深不可詳敷落神真追度亡魂今日欣慶受度歷關諸天請滅三惡釋放地牢不經五道魂升太玄真王監舉無拘天門束斗濯神西斗錬精北斗追冥南斗度生中斗統運總司衆靈青帝護魂白帝侍魄赤帝養氣黑帝通血黃帝中主萬神無越青天魔王開運化機赤天魔王法令奮施白天魔王統領八威黑天魔王察凶檢非黃天魔王萬神總歸五帝大魔生化之宗飛行敼從下攝幽魂麾鐘鼓莭考校鬼神位號赫奕髙清上公上天度魂光勑北酆七玄受度追召冥陽九幽秦簡泰山列章真魔附靈生氣聚光乘化人天道力恢張敢有干試拒遏上真金鉞前戮巨天後刑屠割祅黨風火無停追度上世久遠亡魂化氣受神返生還形魔無干犯真識炯精三官北酆明檢魂營不得容隱金馬驛呈普告無窮萬神威聽三界五帝列言上清混黃元紀化用渺茫感激真妙筆立二儀風澤上騰元綱下施陽魂耀靈隂魄玄暉空洞杳冥中藏至神把握元化無上之尊號曰虛皇玄居玉清龍漢六劫蒼帝運終延康溟津長安太空無形無影無極無窮赤光啓運傳道玉宸柏陵長樂丹天始青開明三境三十六宫元變周流四方之天五斗列宿綱氣相連輪轉升降生育萬靈乃錫玄符九天玉文安鎮五山長保無傾洞淵九壘諸大土皇正行遊梵寶闕雲營軒始之主虎口土龍執天大憲與道同功運以神化色以剛風是為靈寶玄中之玄羅布萬神統歸三官生化品物考治人民録善登真惡業沈淪擔沙負石漣汲溟波驅雷役電幽夜之河萬劫受報備歷酸辛吾不原赦何以超升為汝追度上世亡魂是故宣告大道之根皆使開悟與善因緣靈符破獄萬苦咸停玄光照暗朗耀重昏鬼官升遷上聞諸天諸天之上各有生門中有追度上世亡魂之章飛天靈歌辭參髙真第一欲界追度飛空之音空洞辰景玉妙元皇統神化兮開生度人萬祖億曽中有沈魂欲念相牽纒幽幽長夜閽不遂齊玄覺何以超冥津滌慮脫塵垢清心蕩穢氛回我慈慧光靈風冉冉升𡨚仇當寵對由資大法乘摧破癡迷綱逍遙寓十方稽首無上王誦此靈寶章錬質陽華館受度歸南昌慶㑹合一際俱䝉登福堂第二色界追度成真之章杳杳冥途北帝鬼官下統幽府中有罪魂業禍喪真色纍苦神淪溺劫年以失其生我界險巇穢念紛紛開悟正道禀我玄科獲升度兮飛越匏河九天冲氣三元妙華混至化兮敷張慶雲統運機感結育成人億曽受錬解滅冤愆殃散福來逮及爾身濟拔無窮共獲帝仙哀斯塵昧故示法言第三無色追度升玄歌曰玉聖之尊太一上神號曰景精招真命靈接生降氣度魄超魂巍巍妙範昭昭洞文開悟無際愛結悉除慧朗回光煥耀幽關赫奕符告上扳七玄敕赦滯爽孰敢拘延永過三界錬化朱陵逍遙太清晏眄劫年我道廣大陶運億千不但於祖考而獲此登升萬遍既道備身俱乘景雲此三界之上飛空之中真王歌音音參洞章誦之百遍七祖飛升誦之千遍列仙保迎億曾萬祖逍遙太清萬遍道備普度含生身超三界位證仙卿有聞靈音六天敬形勑制地祇侍衛送迎拔出地戶五苦八難永離北鄷魂度朱陵是謂無量濟惠無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及玉清真王隱祕之音皆是大梵之言朗徹九幽追度祖考冥漠久逝之魂聞是洞文衆苦消解神識超升非世上常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寶祕於玄都神霄玉清王府東室寶經祕藏道亨昌運符運下傳若有至人齎金寶質心依舊格告盟神霄然後而付焉道言夫世之生民皆有玄祖上世高曽雖繼子孫鮮及遠代七世而上禮不稱論脫有先逝代數遼遠祭祀莫及資修之度不克稽用業纍未除魂留地司皆當祈告真靈請乞報應得告報祥感則已獲超遷慶想不真多見冡墓考對之像則亡魂幽繫未脫狴牢皆當齊心修齊六時行香十遍轉經以青紙丹書大梵隱語著亡魂姓氏去世年月作四門方符牒之面以丹書升天劵文背書年辰法師位號盛以絳囊祝地司主者及亡魂姓名焚於建齊處即得追度佩券生天福德立降消諸不祥無量之文普度無窮道言夫六親眷屬末學道淺或仙品未充運應滅度身經太隂臨過之時為其行香誦經十過以度尸形如法魂神徑上南宫隨其學功計日而得更生輪轉不惑便得神仙道言夫天地始生元始開圖即有人物人物具備即有死生死生者神氣來往人命之數也上世亡魂不惟久遠億曽萬祖有經劫成壞而魂未超升者世之學士不知天地幾經成壤為劫長短亡魂定業幽縶不解者皆當拜奏章表行香誦經焚升天寶券修齊設醮祈向髙真即得追度生大福堂夫齊戒誦經功德甚重使亡魂昭泰長夜通光地獄苦消火山息焰冥曹考罰頓罷炎寒一切受賴其福難勝故曰無量普度天人道言凡有是經能為兆民行是功德發心修齊燒香誦經十過皆諸天記名萬神侍衛右别至人剋得為聖君金闕之臣諸天記人功過毫分無失玉清真王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君撰元始靈書中篇東方八天達朗披覬玄紀法王魔師赫盧炎池誦光斗魯幽察擷司定廂宛了究氐盈門肥堂勑捕醜虐混開紫皇蔚房靜除寂音思彊汴神逸羅廣明檢禳破解妙行真氣耀邦南方八天籍羅八臺四明建仙匱録窮魂曆都命玄泉沙般拉阿列邅姿妙澄演覺離璘愆阿擺笳頻夷欹連遣那籠卯遏戍虛府蒲圭都文曷騤臻和夢持衮物汨謨塊額頥基西方八天乾帝華樞焦平觀都景孽銖行周萌賔呼烈井驅力玉判歸浮趙章延蹊鹿桓蚪檀追冥叩無綱石尸徒閲頂辭緯奕奕霹靈左翊箕制木玄魔丘略負廣須韓司主圖北方八天鱉靈典洞酆牢鎖魂赤章檢考問籍通詗檛求過諺報罰遣程億資歲成杳檄文靈變孤驛弭譎躍洞京雕嚚布欵孽齊交明昉邊冲廬九口津洴馬猛戮奴奔愛莽神道言此諸天中大梵隱語無量之音舊文字皆廣長一丈刻書北清玄天寶幢之上散酆都泉曲九幽之罪赦積世亡魂追度超升利拔苦爽解脫業因往劫定債獲免償還自在逍遙不拘泰山子孫福報貴祿冝官家無故氣傳逮不行天保其昌德冨爾身靈應元君昔書其文以為正音有知其音能齊而誦者諸天皆遣追度靈官下拔其魂書其功勤上奏諸天萬神朝禮地祇侍門大勳真王保舉神霄道備剋得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成天真自然之音也故誦之致靈人下觀上帝遙唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響十方肅清河海靜默山嶽吞烟萬靈振伏招集群仙天無氛穢地無祅塵冥慧洞清大量玄玄也元始無量度人上品妙經卷之五十五

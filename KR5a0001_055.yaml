front:
  text: 靈寳無量度人上品妙經卷之五十五宙五
  hash: sha256:c00e01f49869298545e13297b37d8b359a4e24a4087f239cad356b54015a4fde
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_055-001a, image: hfl/0011/0011-168.png}
body:
  text: 追度上世亡䰟品道言昔於龍梵天中景霄幽歌大鍊化土受元始度人追度上世亡䰟無量上品元始天尊當說是經周廻十過以召十方始當詣座九皇上眞飛天大聖妙行眞人玄中法師洞隂朔單鬱絶之境五靈玄老黑帝天君酆都北帝六天大魔救苦靈仙九宮曹屬三元考䰟無鞅數衆乗空而來三素飛雲八景霄輿華蓋垂䕃碧翠交光九色瓊蕤洞煥太空七日七夜諸天臺城樓觀影徹幽寥珠緯玉毫停輪息燿神風襲瑞空藏傾波一國地土山川林木缅平一等無復髙下土皆作青玉萬里通映無有異色衆眞侍座元始天尊玄坐空浮九光寳局之上說經一遍諸天大聖同時稱善是時大地衆生祖先積罪咸䝉赦原說經二遍光照九幽開悟宿命說經三遍雲周道境甘露灑空說經四遍火山息焰寒池靜波說經五遍地獄弛關幽䰟解脫說經六遍落滅惡根不沈苦趣說經七遍焚焼黑簿考對休閑說經八遍泉曲冥官進陞仙品說經九遍暗域飛雲陽光盪翳說經十遍枯骨更生皆起成人是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品青宫救苦大神無鞅之衆浮空而至說經二遍南方無極無量品朱宫明悟大神無鞅之衆浮空而至說經三遍西方無極無量品素靈宫玄定大神無鞅之衆浮空而至說經四遍北方無極無量品紫元官幽感大神無鞅之衆浮空而至說經五遍東此無極無量品酆都宮雲營大神無鞅之衆浮空而至說經六遍東南無極無量品九幽宮㧞罪大神無鞅之衆浮空而至說經七遍西南無極無量品泉曲宮度生大神無鞅之衆浮空而至說經八遍西北無極無量品天福宫超化大神無鞅之衆浮空而至說經九遍上方無極無量品眞都宮靈妙大神無鞅之衆浮空而至說經十遍下方無極無量品玄妙宫寂定大神無鞅之衆浮空而至十遍周竟十方無極升度苦爽天眞大神一時同至元始天尊初說法時一國男女各各追懷上世亡䰟億曽萬祖古往先親或繫宿因承於業力已遂生方遨遊三界或尚沈幽境滯爽冥關代歷綿長時丁久遠䰟無依止體化塵埃性識未消尚存心念罹斯隂罪必犯陽愆今遇元始將陳追度之法慶㑹無邊願虛俟教廣利有生是時天尊四觀天人一切鬼神一方聖衆舉山水雲霞之袂揮九色碧光宛轉之紱良乆之頃以九色碧光一縷之絲垂明下徹遙至九壘七圍鐡山之間十大地獄方面八千餘里髙廣深厚其量過之隨此碧光一縷之絲㧞地之聲六種俱振猶於大海交磕二山亦如諸天五雷併起正行遊梵三十六宮應時傾動北酆諸大地獄翩翩高舉下離冥漠昇於絶空碧紱之絲挽提獄頂洞出剛風及於天界以此大獄繫於絲杪形如彈丸無量之衆瞻矚無礙皆見諸大地獄五刑萬苦血刃火然表裹明覩不有纎障各見有罪祖光受諸苦報禁考獄中哀吟求救一切衆生見此事相舉聲號泣響震諸天祈告虚皇願垂追度元始怡顏微笑即於頂上出大光明煥照天地於光明中有赤文雲書昇天寳券芒金角玉蚪曲詳分示衆宣言爾等衆生上世亡䰟用此追度之法周廻十過皆獲昇天來者霧合雲屯非可禁止迮國一半土皆偏陷乃懸一寳珠大如黍米在空玄之中去地九丈元始登引天眞大神上聖髙尊十方救苦㧞罪眞人至眞大神無鞅數衆俱入寳珠之中天人仰看惟見拂拂從珠口中入旣入珠口不知所在國人廓散地還平正無復欹陷元始即於寳珠之内說經都竟衆眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟惠㧞度祖先不墮惡道傾土歸仰咸行孝心能敬能讓能廉能貞能桑能和能奉能承能忍能養心無悖慢口無怨言齊同慈愛異國成親國安民豐欣樂太平經始出教一國以道預有志心宗奉禮敬皆得度世道言元始天尊說經中所言竝是諸天上帝内名隱韻之音亦是眞王内諱百靈之隱名也非世之常辭上聖已成眞人通玄究微能悉其章誦之十過諸天遙唱萬罪悉原上世亡䰟皆獲昇仙旁資一切普度萬生回屍起死白骨成人至學之士誦之十過則五嶽奏刺三官奉詞幽䰟遷化逝魄超昇濟度亡殁絶而得生所以爾者學士道徳未充體未洞眞以制十方威未制天政德可伏御地祇資濟幽靈濟㧞祖先而已輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因縁萬炎不干神明護門斯經尊妙獨步玉京度人無量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到億曾萬祖幽䰟苦爽皆即受度上昇朱宫格皆九年受化更生得爲貴人而好學至經功滿德就追度髙玄皆得神仙飛升金闕遊宴玉京也上學之士修誦是經上世亡䰟皆即追度飛升南宮世人受誦則亡過祖考得太隂鍊形之道䰟神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死䝉恩上天所寳不傳下世至士齎金寳效心盟天而傳輕泄漏慢殃及子孫長役三宮侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齋誦詠是經爲上世亡䰟斷地逮役度上南宫七月長齋誦詠是經九祖七玄升入天門赦罪遷善身得神仙十月長齋誦詠是經追度古先眷屬億逺幽靈即獲鍊化刻録太清八節之日誦詠是經遠世䰟爽罪滅北都酆山息考罷役河源得爲九宫眞人本命之日誦詠是經玄堂七世往劫滯䰟靈肉附骨近生爲人䰟神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿徳就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐碧紫絳三色雲氣之中内外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室内十方救苦無量大神駐輦空極項生圓象光映十方如此分明宻呪曰無上玄元太上道君召出臣身中三五功曹左君官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋濟堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始無量度人上品妙經元始洞玄靈寳本章追度上世亡䰟十遍度人九㝠隠韻開化自然空洞降靈太虚生神總治法象統歸三元瓊宫大聖髙居帝尊敷弘至妙考校因縁青編丹簡紀録玄文元陽紫微方諸洞泉太隂署罰火官舉遷生民隨業攝送酆山九河六洞萬鬼之營火城劒樹沸鑊寒庭鬼帥大魔考責罪䰟元始玉符下㧞幽扄普爲衆生追度祖先上詣朱陵功告三官五嶽四瀆名山大川水府洞宮主宰神靈原赦滯爽不得稽停大㑹玄都速召萬神中有東極尋聲赴感太一救苦天尊中有度䰟化形之君中有太冥鍊屍大神中有大慈妙行眞人中有天樞天機好生文昌延壽度厄尊神招靈太玄無量度人今日校録諸天臨軒東方無極龍威神王長生大聖無量度人南方無極丹靈神王長生大聖無量度人西方無極皓華神王長生大聖無量度人北方無極玄英神王長生大聖無量度人東北無極鍊度神王長生大聖無量度人東南無極變身神王長生大聖無量度人西南無極復相神王長生大聖無量度人西北無極正精神王長生大聖無量度人上方無極火府神王長生大聖無量度人下方無極返形神王長生大聖無量度人十方至眞飛天度䰟超化神王長生度世無量大神竝乗八景琅輿飛雲葆蓋霞輦飈輪驂駕天馬白鳳青鸞建玄靈翠節緑羽龍旛前導鈞天廣樂後參八素陽歌巨象麒麟翼衛辟邪十精啓途七辰捧轅億靈萬神浮空而來光明照燿洞朗諸天神霄府相元黄左宮陶公仙伯執籙把籍齊到帝前普度衆生上世亡䰟勑攝鬼帝來聽教言羅鄷六宫隂洞鐵山賔友僚佐四大明公司禁侍宸北河列侯各持黑簿削落罪根不得拘留逼合鬼群元始符命時刻昇遷息苦寒池濯灌天津制魔保舉度品南宫九玄受錬仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度風火刀兵考訟連對之難超凌三界逍遙上清上清之天天帝合延無色之境梵行東方八天基化正宣天帝變津冝由明應玄天帝遍臻元極樂樞冥天帝六關玄玄變眞九仙天帝陣希務夸耀靈華運天帝㨂丘澤方不驕悲識天帝覺海雲佑棋素寳周儲天帝栁䝉少滋歴爽古澠弘思天帝季路時南方八方李檀舜籍天帝木瑘舒霞洞宴王天帝景唐無央刹聽化髙天帝效慈澆穹封冥録隂天帝伯皇宥中䰟度昇慶天帝用鄰德光超對希樂天帝息常如慈登福果天帝不逸披門神校司官領録天帝蹈兟修璵西方八天應祈藤妙天帝適端俟通化慮仙易眞天帝靖常崧乆世坰畿影化天帝虛凡自微道户寂然天帝吉動寵邦慜正遙靈師補天帝照符率從玉都蕭韓主成天帝命玄冲昇虛玄變天帝乞章融留梵行太無天帝攝神緫靈北方八天太微玉華天帝流傞宛興微覺宗仙天帝正刀蒲王度靈蹟眞天帝椰題衍衡董正黎辨天帝歩鏘極眞隂臺總按天帝奏猗連嶽詔遷證天帝唐曜明輪龍化珍惠天帝定智丕旋女青攄文天帝阿都祉踈三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻返空之音化靈之尊追度之神監䰟大魔返生之靈九聖十眞變化上清無量之奥深不可詳敷落神眞追度亡䰟今日欣慶受度歷關諸天請滅三惡釋放地牢不經五道䰟升太玄眞王監舉無拘天門束斗濯神西斗錬精北斗追冥南斗度生中斗統運總司衆靈青帝護䰟白帝侍魄赤帝養氣黒帝通血黃帝中主萬神無越青天魔王開運化機赤天魔王法令奮施白天魔王統領八威黒天魔王察凶檢非黄天魔王萬神總歸五帝大魔生化之宗飛行敼從下攝幽䰟麾鐘鼔莭考校鬼神位號赫奕髙清上公上天度䰟光勑北酆七玄受度追召冥陽九幽秦簡泰山列章眞魔附靈生氣聚光乗化人天道力恢張敢有干試拒遏上眞金鉞前戮巨天後刑屠割祅黨風火無停追度上世乆遠亡䰟化氣受神返生還形魔無干犯眞識炯精三官北酆明檢䰟營不得容隱金馬驛呈普告無窮萬神威聽三界五帝列言上清混黄元紀化用渺茫感激眞妙筆立二儀風澤上騰元綱下施陽䰟燿靈隂魄玄暉空洞杳冥中藏至神把握元化無上之尊號曰虛皇玄居玉清龍漢六劫蒼帝運終延康溟津長安太空無形無影無極無窮赤光啓運傳道玉宸柏陵長樂丹天始青開明三境三十六宫元變周流四方之天五斗列宿綱氣相連輪轉升降生育萬靈乃錫玄符九天玉文安鎭五山長保無傾洞淵九壘諸大土皇正行遊梵寳闕雲營軒始之主虎口土龍執天大憲與道同功運以神化色以剛風是爲靈寳玄中之玄羅布萬神統歸三官生化品物考治人民録善登眞惡業沈淪擔沙負石漣汲溟波驅雷役電幽夜之河萬劫受報備歷酸辛吾不原赦何以超升爲汝追度上世亡䰟是故宣告大道之根皆使開悟與善因縁靈符破獄萬苦咸停玄光照暗朗燿重昏鬼官升遷上聞諸天諸天之上各有生門中有追度上世亡䰟之章飛天靈歌辭參髙眞第一欲界追度飛空之音空洞辰景玉妙元皇統神化兮開生度人萬祖億曽中有沈䰟欲念相牽纒幽幽長夜閽不遂齊玄覺何以超冥津滌慮脫塵垢清心蕩穢氛回我慈慧光靈風冉冉昇𡨚仇當寵對由資大法乗摧破癡迷綱逍遙寓十方稽首無上王誦此靈寳章錬質陽華館受度歸南昌慶㑹合一際俱䝉登福堂第二色界追度成眞之章杳杳冥途北帝鬼官下統幽府中有罪䰟業禍䘮眞色累苦神淪溺劫年以失其生我界險巇穢念紛紛開悟正道禀我玄科獲昇度兮飛越匏河九天冲氣三元妙華混至化兮敷張慶雲統運機感結育成人億曽受錬解滅冤愆殃散福來逮及爾身濟㧞無窮共獲帝仙哀斯塵昧故示法言第三無色追度昇玄歌曰玉聖之尊太一上神號曰景精招眞命靈接生降氣度魄超䰟巍巍妙範昭昭洞文開悟無際愛結悉除慧朗回光煥燿幽關赫奕符告上扳七玄敕赦滯爽孰敢拘延永過三界錬化朱陵逍遙太清晏眄劫年我道廣大陶運億千不但於祖考而獲此登昇萬遍旣道備身俱乗景雲此三界之上飛空之中眞王歌音音參洞章誦之百遍七祖飛昇誦之千遍列仙保迎億曾萬祖逍遙太清萬遍道備普度含生身超三界位證仙卿有聞靈音六天敬形勑制地祇侍衛送迎㧞出地戸五苦八難永離北鄷䰟度朱陵是謂無量濟惠無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及玉清眞王隱祕之音皆是大梵之言朗徹九幽追度祖考冥漠久逝之䰟聞是洞文衆苦消解神識超昇非世上常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寳祕於玄都神霄玉清王府東室寳經祕藏道亨昌運符運下傳若有至人齎金寳質心依舊格告盟神霄然後而付焉道言夫世之生民皆有玄祖上世高曽雖繼子孫鮮及遠代七世而上禮不稱論脫有先逝代數遼遠祭祀莫及資修之度不克稽用業累未除䰟留地司皆當祈告眞靈請乞報應得告報祥感則已獲超遷慶想不眞多見冡墓考對之像則亡䰟幽繫未脫狴牢皆當齊心修齋六時行香十遍轉經以青紙丹書大梵隱語著亡䰟姓氏去世年月作四門方符牒之面以丹書昇天劵文背書年辰法師位號盛以絳囊祝地司主者及亡䰟姓名焚於建齋處即得追度佩券生天福德立降消諸不祥無量之文普度無窮道言夫六親眷屬末學道淺或仙品未充運應滅度身經太隂臨過之時爲其行香誦經十過以度屍形如法䰟神逕上南宫隨其學功計日而得更生輪轉不惑便得神仙道言夫天地始生元始開圖即有人物人物具備即有死生死生者神氣來往人命之數也上世亡䰟不惟久遠億曽萬祖有經劫成壊而䰟未超升者世之學士不知天地幾經成壌爲劫長短亡䰟定業幽縶不解者皆當拜奏章表行香誦經焚昇天寳券修齋設醮祈向髙眞即得追度生大福堂夫齋戒誦經功德甚重使亡䰟昭泰長夜通光地獄苦消火山息焰冥曹考罰頓罷炎寒一切受頼其福難勝故曰無量普度天人道言凡有是經能爲兆民行是功德發心修齋燒香誦經十過皆諸天記名萬神侍衛右别至人剋得爲聖君金闕之臣諸天記人功過毫分無失玉清眞王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君譔元始靈書中篇東方八天達朗披覬玄紀法王魔師赫盧炎池誦光斗魯幽察擷司定廂宛了究氐盈門肥堂勑捕醜虐混開紫皇蔚房靜除寂音思彊汴神逸羅廣明檢禳破解妙行眞氣耀邦南方八天籍羅八臺四明建仙匱録窮䰟曆都命玄泉沙般拉阿列邅姿妙澄演覺离璘愆阿擺笳頻夷欹連遣那籠卯遏戍虛府蒲圭都文曷騤臻和夢持衮物汨謨塊額頥基西方八天乾帝華樞焦平觀都景孽銖行周萌賔呼烈井驅力玉判歸浮趙章延蹊鹿桓蚪檀追冥叩無綱石尸徒閱頂辭緯奕奕霹靈左翊箕制木玄魔丘略負廣須韓司主圖北方八天鼈靈典洞酆牢鎻䰟赤章檢考問籍通詗檛求過諺報罰遣程億資歲成杳檄文靈變孤驛弭譎躍洞京彫嚚布欵孽齊交明昉邊冲廬九口津洴馬猛戮奴奔愛莽神道言此諸天中大梵隱語無量之音舊文字皆廣長一丈刻書北清玄天寳幢之上散酆都泉曲九幽之罪赦積世亡䰟追度超升利㧞苦爽解脫業因往劫定債獲免償還自在逍遙不拘泰山子孫福報貴禄冝官家無故氣傳逮不行天保其昌徳冨爾身靈應元君昔書其文以爲正音有知其音能齋而誦者諸天皆遣追度靈官下㧞其䰟書其功勤上奏諸天萬神朝禮地祇侍門大勳眞王保舉神霄道備剋得遊行三界昇入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致靈人下觀上帝遙唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響十方肅清河海靜黙山嶽吞烟萬靈振伏招集群仙天無氛穢地無祅塵冥慧洞清大量玄玄也元始無量度人上品妙經卷之五十五

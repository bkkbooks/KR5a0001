front:
  text: 靈寶无量度人上品妙經卷之二十六玄六
  hash: sha256:2d9a33189a497a10cedc9050aadf01b6cae936c4135224f0acb5b8242258e4df
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_026-001a, image: hfl/0006/0006-004.png}
body:
  text: 明體貫氣品道言昔於太丹天中絳雲凝霄赤光世界受元始度人明體貫氣无量上品元始天尊當說是經而乃謂言吾爲天地之祖萬氣之先三寶天君肇化之後道體分三於太空混黃清虚丹暉廣化大劫生第三元老號太上老君綂治玄氣養育人民即吾至道分神傳授大範巳經九萬九千九百九十九億妙氣氣分三劫无量度人吾昔於彼已明此道當命太上老君於太丹天中爲一切衆生剖析祕密開化天人吾已演化諸天明露道要三才五行隂陽玄極之旨明體貫氣最後分别冝命太上宣示隱微使諸衆生悟道通達作是念已太上老君居太清太極宫大光明殿敬聞敎誡徑詣座前稽首再拜長跪黙念大聖虚皇元始天尊寶號者三上奏天尊臣奉密旨令升法座爲十方天人說明體貫氣妙經謹依詔命諦奉宣揚禮足整衣將說是經周回十過以召十方始當詣座天眞大神列聖髙尊上清眞人無鞅數衆乘空而來九霞布空玄光内照華蓋飛軒碧落騰煇流雲丹景埀䕃太虚七日七夜清微禹餘大赤三境種民三界无極諸天日月宫府玉垣帝座太微寥陽鬱山玄亰丹臺紫閣瑶闕瓊樓皇極飛綱洞淵劫仞森然在目無有隔礙衆眞侍座太上老君玄坐空浮陽光玉闕寶臺之上說經一遍諸天大聖同時稱善是時一國男女咸悟生化之根說經二遍衆惡消除說經三遍萬善集身說經四遍眞氣下降灌注心田說經五遍所向皆眞玄符正範說經六遍神妙足備克獲飛仙說經七遍明體妙元貫氣達用說經八遍九玄七祖上世亡魂眷屬親姻逍遥離苦說經九遍玉章破暗靈光燭幽說經十遍一切衆生永斷惡趣冤仇解脫報對休停是時一國是男是女莫不傾心皆受護度咸得長生道言是時太上老君說經一遍東方无極无量品八景大神无鞅之衆浮空而至說經二遍南方无極无量品明光大神无鞅之衆浮空而至說經三遍西方无極无量品制魔大神无鞅之衆浮空而至說經四遍北方无極无量品蘂珠大神无鞅之衆浮空而至說經五遍東北无極无量品雲宫大神无鞅之衆浮空而至說經六遍東南无極无量品變化大神无鞅之衆浮空而至說經七遍西南无極无量品靈飛大神无鞅之衆浮空而至說經八遍西北无極无量品三素大神无鞅之衆浮空而至說經九遍上方无極无量品玉虚大神无鞅之衆浮空而至說經十遍下方无極无量品離合大神无鞅之衆浮空而至十遍周章十方无極明體貫氣大神一時同至一國男女傾心歸仰來者駢委叢踏数計億量非可爲比徧諸天境於是太上老君覩見四衆十方圍繞即向北方恭禮玉亰大聖元始天尊上清紫霞太上玉宸大道君旣畢復座東嚮環顧大衆運道神力移十方天人遐邇來者徧天觀聽之儔盡升虚空髙可百丈即取碧霓流雲黃縷萬花之帔迎取天人來置座下廣殿四開无鞅之衆厠如積粟讃歎禮拜聲震八極太上老君天顔微笑舉五明寶扇撫紅霄金光明之几重告大衆曰道出而爲神神化而爲氣氣者未有天地隂陽之先眞元萬化之祖道之妙感也其氣非色非形非有非無不隷隂陽不屬五行能生能化能成能實爲道之神用故剛於金石清於氷玉大於虚空長於上古内凝至精造立混沌下逮萬類此氣爲始其謂之氤氲恍愡者氣兆於形端質陶於太素作天地之妙本名曰一氣故有眞一玄一太一亦曰玄元始三氣自建植玉亰及於泉戸仙聖鬼神人物莫不由之均以道生無有分别髙下善惡彊弱堅脆以自然付受未常爲也洎三界成就神靈攸司君尊臣卑則役造化定隆殺興賢愚立髙下則道有至聖之神天有不私之帝三垣星斗八威神官以布其政記人功過生滅無失雖纎芥圭𥞫不得逃逾則先明體以貰其氣如道爲無體德爲有體照爲明體玄爲暗體陽爲動體隂爲靜體正爲仙體邪爲鬼體體分旣定則貫其氣以受其生無體則貫以浩氣有體則貫以元氣明體則貰以清氣暗體則貰以濁氣動體則貫以龍氣靜體則貰以常氣仙體則貰以靈氣鬼體則貫以異氣明體貰氣區畛有方萬化大定三才之政績用乃成超凌三界髙眞之業可覬善惡之録有科福禍之理大明天人鬼神十方億萬之衆化逺敎行出離輪轉仙道克登長生無爲允合太空太上老君說經都竟衆眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸行善心明信明因明縁明報明感明果明法明敎明戒明體言符至道行合天機齊同慈愛異骨成親國安民豐欣樂太平經始出敎一國以道預有志心宗奉禮敬皆得度世道言太上老君說經中所言並是諸天上帝内名隱韻之音亦是魔王内諱百靈之隠名也非世之常辭上聖已成眞人通玄明體眞氣貰身能悉其章誦之十過神光内燿魔鬼喪睛儀璘舒華璇璣煥明祟癘斬戮鬼神伏形回屍起死白骨成人至學之士誦之十過則太上遥鑒三府記名祅邪殞首滯爽登升濟度埀死絶而得生所以爾者學士未洞太玄務明體理穢氣不盡尚拘人累召制十方威未制天政德可伏御地祇束縳魔靈但却死而已不能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因縁萬災不干神明護門斯經尊妙獨歩玉亰度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸仙齊到體淨心明隂翳消瀹氣合神眞冥光晣暢億曾萬祖幽魂苦爽皆即受度上升朱宫格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛升金闕遊宴玉亰上學之士修誦是經皆即受度飛升南宫以其誠誦通感明體不昧靈氣貫形自然受鍊得詣流火之庭瑩玉光於靈顔納朱文於錦胃也世人受誦氣添生福屍故自斷血流清津腦塡素液則延壽長年後皆得作屍解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶効心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經明萬物受生之體仙靈人鬼變化之道皆從太无自然中來依道立體資氣爲用以神發知用明爲識隂陽水火鍊以成眞萬物之體仙靈人鬼其體若同變化所貫之氣各異神通妙密各各不同出没隱淪彰顯之道互出玄領爲上世亡魂斷地逮役度上南宫七月長齋誦詠是經明萬物受成之體仙靈人鬼隂息之道皆從靈氣貫質隂火烹鍊依定立堅慿靈爲變以清爲知以燥禀體月華滌沐鍊以成眞萬物之體仙靈人鬼其體若同變化所貫之氣各異神通冥運各各不同謝縁斷凡幽曠之道互出奥領身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經明萬物復命之體仙靈人鬼還元之道皆從玄一得命命以定體太黑貫氣兩半成功依液感生噏粹護養晦以生明以靜爲化玄霜碧露鍊以成眞萬物之體仙靈人鬼其體若同變化所貫之氣各異神行黙察各各不同出離遐舉之道互出祕領爲國王帝主君臣父子安鎭國祚保天長存世世不絶常爲人君安鎭其方民稱太平八節之日誦詠是經八風隱體貫氣八方八景會眞泥九洞明得爲九宫眞人本命之日誦詠是經兆自明體貫氣入身賢者爲聖凡骨爲眞魂神澄正萬氣長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黃白三色雲氣之中内外蓊冥東有木玄眞人南有炎象眞人西有金液眞人北有水象眞人上有玄妙眞人侍衞監觀獅子白鶴羅列左右日月照明洞煥室内項生圓象光映十方如此分明密呪曰无上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋清堂修行至經无量度人願所啓上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經天皇眞人曰此經神寶君代虚皇說之故亦詣元始上帝授太極元化保生眞人爲序眞人乃禹餘天髙眞道君之臣故亦稱道言元始无量度人上品妙經元始洞玄靈寶本章明體貫氣虚妙上品皇極度人淵微寶歷符應自然混合玉文龍康化眞泰洞無垠虚象流形空無眇邈植立萬天鴻濛正氣大朴分源飛騰升降包絡交纒開明雙景帝一合仙玄虚上宰演妙髙清鬰昌啓運肇生神靈是爲變化玉極元皇紫霄綱維晶燿琳琅飛輪持紐數度朱光上清劫仞大有黃房後聖廣筵三眞化宫下治崐丘瑶臺閬風端居天亰綂敎十方中有玄元大範之靈中有司天變化之君中有徊水儛空大神中有太微沖和妙行眞人中有鳳臺絳闕雌一玉檢曲素大洞髙眞共明正體无量度人今日貫氣諸天臨軒東方无極八景神王長生大聖无量度人南方无極明光神王長生大聖无量度人西方无極制魔神王長生大聖无量度人北方无極蘂珠神王長生大聖无量度人東北无極雲宫神王長生大聖无量度人東南无極變化神王長生大聖无量度人西南无極靈飛神王長生大聖无量度人西北无極三素神王長生大聖无量度人上方无極玉虚神王長生大聖无量度人下方无極離合神王長生大聖无量度人十方虚明正體神王開天貰氣无量大神並乘流光鳳車瑶輦華蓋丹輿驂駕神虎猛獸斑麟建七眞玄鉞三素朱旗前捧洞陽寶印後仗招靈信旛太極群仙飛空歩虚五佐啓途三官翼轅億乘萬騎浮空而來傾光回駕監眞度生太微玉輔紫宸上皇至陽元老沖妙大神總執生符來詣帝庭隨所開化攝召萬靈普告三界六極八冥廣霞飛圓寒嶽丹扃方諸靈紐暘谷洞泉通明大劫龍廄成池龜城瑶闕浮照星機三元上舘天憲九宫二十七府簡注元功持握生化考校羅酆眞光流布下拔罪魂息役鬼官業報休停冤仇和釋隨運長存因縁輪轉上升朱陵永斷貪愛牽纒之苦逍遥髙空受鍊太霄太霄之天天帝觀覺無色之境梵行東方八天力欲竟成天帝徂央微眞納乾晝登天帝辨崇至群都曾秀敷天帝杳良鳴祛非却妄天帝石完夫變正玄明天帝寂眞耕吕耀疆勒天帝胡顓希明極眞定瑶天帝章毗化居邀玄召雲天帝野昌曜虛南方八天利定宛圖天帝景昌祖名韓司主生天帝萌元評玉觀夷會天帝召靈紀須咸樂赭沖天帝確端由衢車揚璘下天帝度謡路音平煥鬱理天帝氣成専浮太皇育嶠天帝孔遵生藍英佐侯天帝洞覺靈西方八天童隨巘妙天帝圖賔良舉玄謝都天帝仇周九王赤震招仙天帝火提楚基標光咸思天帝璟明山師亮宗迪玄天帝召意并堂魁符大建天帝玉鍊演論空居杳樂天帝越婁浮光載梵阿史天帝隱題部延北方八天東井貫綱天帝北華粗彌幽華太虚天帝莊竭杜如劫刃降和天帝斗勇慈云玄方正嶽天帝籠亰麻𤤠通霄次皇天帝玉宫乾尊極張應加天帝洞神八威宗回浮化天帝黃朱景飊慧擇龍化天帝謝登溢常三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻天中之音天中之尊天中之神天中大魔天中之靈九華十晶遊宴鬱單生神妙冊髙祕亰山玄波鼓蕩運斡天關今日雙輪會合大慶因縁請除故滯眞降玄丹萬惡永消變景飛仙上靈監舉同升帝軒木曜宣威火曜施政金曜司察水曜行令土曜四據總持符命句芒主生蓐収化斂玄冥閉藏祝融流演后土居中執御大典青靈始老立天開發丹靈眞老檢校科格皓靈皇老主領殺伐鬱靈玄老大布聖澤玄靈元老坐鎭金闕五老帝尊萬神所歸飛行三界正綂元機持幢仗節遊觀太微位號顯著教令弘施上天戮邪豁落誅摧天皇受詔収滅魔凶石光交煥烈火流衝炎方攝精醜伯驅風寒夜雲營清穴隂宮敢容乖變拒遏髙眞融蒼大吏明示典刑泉沙苦刃捕逐無停風刀束送除蕩妖兵百邪歸正皇道長興簡奏大羅同功紫宸陽煇鳳曆九氣順行普告十方無量威靈列科定籍三元保寧丹華大誥分變推遷劫刃崑丘飛霞散煙上開八極下列九淵風轉圓羅肇生諸天天上天下混洞沉冥溟涬鴻濛玄極無形宏綱大範幽廓生音赤象黃方度劫自然元始流布霄煇上篇金籙簡章八景瓊文攝召衆魔保制天根正氣騰飛成結清都元和化演鳳眞玉書總祕蕭臺廣運沖虚紫微八會元素珠編陽景招靈无量飛仙同會太清氣合上玄玄中玉眞太極髙皇流泛洞霞吟嘯明堂三騫秀鬱煇燿絳房玉章化氣丹字騰光澄晶永劫安保延康千和萬合自然成眞眞中有神三天大君玉虚上帝黃老先生長生法師大洞髙尊執符把籙保度天民上居須延遊宴玉亰虚无之内空洞之中下鎭神洲五嶽名山六無相勝回轉天關不得怠縱三華列言皇道開生无量度人上升八羅運天彌綸九光至聖相慶因縁妖姦永息正敎洪宣通流萬化列奏三天三天之上各啓生門中歌開明合體之章貰氣靈篇辭參髙眞第一妙無廣化生氣之音雙明初判乃闢天關蕩蕩道境元始髙居玉剛橫空輪轉四虚鬱羅寶臺深祕龍章虎山海嶠開天御圖上玄降氣悉受眞符回環八素飛躍飄浮上清大洞篇三十九皇書道君受法言絳霧閟清都帝道旣已成眞文當廣敷普度學仙民飛神登太无第二妙有明體成道之章玄玄太羅天中有白玉亰瑶闕聳太虛端坐虚皇尊三氣遶蕭臺天闕列神靈太帝執虎符下召元皇君群品受眞體分化逐境生天魔列玄職朱旛校北營大聖憫淪溺玄章下太清元洞布靈慈爲爾敷眞經願爾進仙業咸得道果成光明照幽夜苦爽皆超升永斷相牽結冤對悉休停第三大混貫氣之歌元始立萬天正氣青黃白浮變爲髙清沉化成渾濁中和有邪正爲人復生物欲念弊眞元愛河常汩没契道入仙靈功圓歸帝闕造業墮輪回隨念沉幽獄豈知太空中三官秉化筆執我大威權九宫標憲格天堂諸種民南昌常快樂旣證玄悟道豈復有淪没受我天寶言速進長生業此三界之上飛空之中仙王歌音音參洞章誦之百遍名度南宮誦之千徧魔王保迎萬徧道備飛升太空過度三界位登仙公有聞靈音魔王敬形勑制地祇侍衞送迎拔出地戸五苦八難七祖升遷永離鬼官魂度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈魔王隱祕之音皆是大梵言非世上常辭明究生體貫氣隨材天政及民卓無私妄天之至公考驗於帝王法道以變通隨時以舉用通玄聖之隱密非凡修之可量故謂玄奥難可尋詳上天所寶祕於神霄玉清王府東藏寶室依科三萬七千年應運下傳若有至人齎金寶質心依舊格告盟十天然後而付焉道言夫誦詠此經則凡體成眞穢氣清蕩天光入心骨有玉津克證靈仙永謝死因萬道開通所爲者成上順天常日月五星中和人氣疾痛無侵下制魔爽百神衞形皆當齊心修齋六時行香十徧轉經福德立降消諸不祥無量之文普度無窮道言夫末學道淺或仙品未𠑽運應滅度身經太隂臨過之時同學至人爲其行香誦經十過以度屍形如法太上明體體變柔金司命貫氣氣陶玉津魄鍊屍滅九宮還靈魂神徑上南宮隨其學功計日而得更生轉輪不惑便得神仙道言夫天地運終星宿錯度日月失昏四時失度隂陽不調國境有災兵氣時現疫毒流行兆民死傷師友命過凡有此災皆業成變體德感致氣各有所由道之自然天之政也皆當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受賴其福難滕故曰无量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衞右别至人尅得爲聖君金闕之臣諸天記人功過毫分無失天中魔王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語无量音太極眞人譔太上明體貫氣靈篇東方八天亨健基圖偃明命輿句華品懋蘭第玄無刹篛忌到泯炎坤謀建書靈憲直眞帝壼呼正德銘越鼎亭莩詔彥遵澤古同焉誅敵假宥傑番離濳徂神岡破綱周愼斳都南方八天璲琩虚攸麗佃雅秋孟廊純被思瀏騫投勑鎭鬼井畢參萊休定斷神磔賜候印婁洸鉛洞溢霞晶散浮煌爛棲魂交駟蔚𢯱常古疑涵淨池火求冶滇感兊生蘇氣彪西方八天混契萌動融衝駿偷緑羅知大猛旂聿漚荷裙夷箭曷領逋遒日蘂鳥九文已空洲眇何呈叚曆江紫泉響抱親飼爻構道先君軀分體氣列由筵肇解魯住釋滋用筌北方八天哿陁阿陵辜胡拯玄景摶太霄舒靜播連赤鏤瑶秩亘閱宏遷符䟽雲華紅誕露翩關混東戸丘府壅年矗竝兟晉滬意邈傳色凝方確祕丹董源韓録罰爽道彰碧沿道言此諸天中大梵隱語无量之音舊文字皆廣長一丈天眞皇人昔詣柏林之舍對伏天玄五方率現帝仙唱虚納以火泉鍊之九劫文乃瑩鮮書太極鳳軒玉屏之上金光自生照徹諸天眞子佩文世世登仙龍車入門常侍帝前丹書燔之飲以瓊泉百病去身壽等九天昔書其文以爲正音有知其音變而通之爲道利亨齋而誦之諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勲魔王保舉上眞道備克得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成變凡體招靈氣克保升仙天眞自然之音也故誦之致飛天下觀上帝遥唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響十方肅清河海靜黙山嶽吞煙萬靈震伏招集群仙天無氛穢地無祅塵冥慧洞清大量玄玄也元始无量度人上品妙經卷之二十六

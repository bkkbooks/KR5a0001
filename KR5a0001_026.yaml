front:
  text: 靈寶無量度人上品妙經卷之二十六玄六
  hash: sha256:58dfa1fa6c7ac5b172b631243be0e036f49c4a687c4148a323f7ac085bfaeb08
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_026-001a, image: hfl/0006/0006-004.png}
body:
  text: 明體貫氣品道言昔於太丹天中絳雲凝霄赤光世界受元始度人明體貫氣無量上品元始天尊當說是經而乃謂言吾為天地之祖萬氣之先三寶天君肇化之後道體分三於太空混黃清虛丹暉廣化大劫生第三元老號太上老君統治玄氣養育人民即吾至道分神傳授大範巳經九萬九千九百九十九億妙氣氣分三劫無量度人吾昔於彼已明此道當命太上老君於太丹天中為一切衆生剖析祕密開化天人吾已演化諸天明露道要三才五行隂陽玄極之旨明體貫氣最後分别冝命太上宣示隱微使諸衆生悟道通達作是念已太上老君居太清太極宫大光明殿敬聞教誡徑詣座前稽首再拜長跪默念大聖虛皇元始天尊寶號者三上奏天尊臣奉密旨令升法座為十方天人說明體貫氣妙經謹依詔命諦奉宣揚禮足整衣將說是經周回十過以召十方始當詣座天真大神列聖髙尊上清真人無鞅數衆乘空而來九霞布空玄光內照華蓋飛軒碧落騰輝流雲丹景埀䕃太虛七日七夜清微禹餘大赤三境種民三界無極諸天日月宫府玉垣帝座太微寥陽鬱山玄亰丹臺紫閣瑶闕瓊樓皇極飛綱洞淵劫仞森然在目無有隔礙衆真侍座太上老君玄坐空浮陽光玉闕寶臺之上說經一遍諸天大聖同時稱善是時一國男女咸悟生化之根說經二遍衆惡消除說經三遍萬善集身說經四遍真氣下降灌注心田說經五遍所向皆真玄符正範說經六遍神妙足備克獲飛仙說經七遍明體妙元貫氣達用說經八遍九玄七祖上世亡魂眷屬親姻逍遙離苦說經九遍玉章破暗靈光燭幽說經十遍一切衆生永斷惡趣冤仇解脫報對休停是時一國是男是女莫不傾心皆受護度咸得長生道言是時太上老君說經一遍東方無極無量品八景大神無鞅之衆浮空而至說經二遍南方無極無量品明光大神無鞅之衆浮空而至說經三遍西方無極無量品制魔大神無鞅之衆浮空而至說經四遍北方無極無量品蘂珠大神無鞅之衆浮空而至說經五遍東北無極無量品雲宫大神無鞅之衆浮空而至說經六遍東南無極無量品變化大神無鞅之衆浮空而至說經七遍西南無極無量品靈飛大神無鞅之衆浮空而至說經八遍西北無極無量品三素大神無鞅之衆浮空而至說經九遍上方無極無量品玉虛大神無鞅之衆浮空而至說經十遍下方無極無量品離合大神無鞅之衆浮空而至十遍周章十方無極明體貫氣大神一時同至一國男女傾心歸仰來者駢委叢踏數計億量非可為比遍諸天境於是太上老君覩見四衆十方圍繞即向北方恭禮玉亰大聖元始天尊上清紫霞太上玉宸大道君既畢復座東嚮環顧大衆運道神力移十方天人遐邇來者遍天觀聽之儔盡升虛空髙可百丈即取碧霓流雲黃縷萬花之帔迎取天人來置座下廣殿四開無鞅之衆厠如積粟讃歎禮拜聲震八極太上老君天顔微笑舉五明寶扇撫紅霄金光明之几重告大衆曰道出而為神神化而為氣氣者未有天地隂陽之先真元萬化之祖道之妙感也其氣非色非形非有非無不隸隂陽不屬五行能生能化能成能實為道之神用故剛於金石清於氷玉大於虛空長於上古內凝至精造立混沌下逮萬類此氣為始其謂之氤氲恍愡者氣兆於形端質陶於太素作天地之妙本名曰一氣故有真一玄一太一亦曰玄元始三氣自建植玉亰及於泉戶仙聖鬼神人物莫不由之均以道生無有分别髙下善惡彊弱堅脆以自然付受未常為也洎三界成就神靈攸司君尊臣卑則役造化定隆殺興賢愚立髙下則道有至聖之神天有不私之帝三垣星斗八威神官以布其政記人功過生滅無失雖纎芥圭𥞫不得逃逾則先明體以貰其氣如道為無體德為有體照為明體玄為暗體陽為動體隂為靜體正為仙體邪為鬼體體分既定則貫其氣以受其生無體則貫以浩氣有體則貫以元氣明體則貰以清氣暗體則貰以濁氣動體則貫以龍氣靜體則貰以常氣仙體則貰以靈氣鬼體則貫以異氣明體貰氣區畛有方萬化大定三才之政績用乃成超凌三界髙真之業可覬善惡之録有科福禍之理大明天人鬼神十方億萬之衆化逺教行出離輪轉仙道克登長生無為允合太空太上老君說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸行善心明信明因明緣明報明感明果明法明教明戒明體言符至道行合天機齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有志心宗奉禮敬皆得度世道言太上老君說經中所言並是諸天上帝內名隱韻之音亦是魔王內諱百靈之隱名也非世之常辭上聖已成真人通玄明體真氣貰身能悉其章誦之十過神光內耀魔鬼喪睛儀璘舒華璇璣煥明祟癘斬戮鬼神伏形回尸起死白骨成人至學之士誦之十過則太上遙鑒三府記名祅邪殞首滯爽登升濟度埀死絶而得生所以爾者學士未洞太玄務明體理穢氣不盡尚拘人纍召制十方威未制天政德可伏御地祇束縳魔靈但却死而已不能更生輕誦此章身則被殃供養尊禮門戶興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉亰度人無量為萬道之宗巍巍大範德難可勝道言凡誦是經十過諸仙齊到體淨心明隂翳消瀹氣合神真冥光晣暢億曾萬祖幽魂苦爽皆即受度上升朱宫格皆九年受化更生得為貴人而好學至經功滿德就皆得神仙飛升金闕遊宴玉亰上學之士修誦是經皆即受度飛升南宫以其誠誦通感明體不昧靈氣貫形自然受鍊得詣流火之庭瑩玉光於靈顔納朱文於錦胃也世人受誦氣添生福尸故自斷血流清津腦填素液則延壽長年後皆得作尸解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齊誦詠是經明萬物受生之體仙靈人鬼變化之道皆從太無自然中來依道立體資氣為用以神發知用明為識隂陽水火鍊以成真萬物之體仙靈人鬼其體若同變化所貫之氣各異神通妙密各各不同出沒隱淪彰顯之道互出玄領為上世亡魂斷地逮役度上南宫七月長齊誦詠是經明萬物受成之體仙靈人鬼隂息之道皆從靈氣貫質隂火烹鍊依定立堅慿靈為變以清為知以燥禀體月華滌沐鍊以成真萬物之體仙靈人鬼其體若同變化所貫之氣各異神通冥運各各不同謝緣斷凡幽曠之道互出奧領身得神仙諸天書名黃籙白簡削死上生十月長齊誦詠是經明萬物復命之體仙靈人鬼還元之道皆從玄一得命命以定體太黑貫氣兩半成功依液感生吸粹護養晦以生明以靜為化玄霜碧露鍊以成真萬物之體仙靈人鬼其體若同變化所貫之氣各異神行默察各各不同出離遐舉之道互出祕領為國王帝主君臣父子安鎮國祚保天長存世世不絶常為人君安鎮其方民稱太平八節之日誦詠是經八風隱體貫氣八方八景會真泥九洞明得為九宫真人本命之日誦詠是經兆自明體貫氣入身賢者為聖凡骨為真魂神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齊戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黃白三色雲氣之中內外蓊冥東有木玄真人南有炎象真人西有金液真人北有水象真人上有玄妙真人侍衛監觀獅子白鶴羅列左右日月照明洞煥室內項生圓象光映十方如此分明密呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齊清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引氣三十二過東向誦經天皇真人曰此經神寶君代虛皇說之故亦詣元始上帝授太極元化保生真人為序真人乃禹餘天髙真道君之臣故亦稱道言元始無量度人上品妙經元始洞玄靈寶本章明體貫氣虛妙上品皇極度人淵微寶歷符應自然混合玉文龍康化真泰洞無垠虛象流形空無眇邈植立萬天鴻濛正氣大朴分源飛騰升降包絡交纒開明雙景帝一合仙玄虛上宰演妙髙清鬱昌啓運肇生神靈是為變化玉極元皇紫霄綱維晶耀琳琅飛輪持紐數度朱光上清劫仞大有黃房後聖廣筵三真化宫下治昆丘瑶臺閬風端居天亰統教十方中有玄元大範之靈中有司天變化之君中有徊水儛空大神中有太微沖和妙行真人中有鳳臺絳闕雌一玉檢曲素大洞髙真共明正體無量度人今日貫氣諸天臨軒東方無極八景神王長生大聖無量度人南方無極明光神王長生大聖無量度人西方無極制魔神王長生大聖無量度人北方無極蘂珠神王長生大聖無量度人東北無極雲宫神王長生大聖無量度人東南無極變化神王長生大聖無量度人西南無極靈飛神王長生大聖無量度人西北無極三素神王長生大聖無量度人上方無極玉虛神王長生大聖無量度人下方無極離合神王長生大聖無量度人十方虛明正體神王開天貰氣無量大神並乘流光鳳車瑶輦華蓋丹輿驂駕神虎猛獸斑麟建七真玄鉞三素朱旗前捧洞陽寶印後仗招靈信幡太極群仙飛空步虛五佐啓途三官翼轅億乘萬騎浮空而來傾光回駕監真度生太微玉輔紫宸上皇至陽元老沖妙大神總執生符來詣帝庭隨所開化攝召萬靈普告三界六極八冥廣霞飛圓寒嶽丹扃方諸靈紐暘谷洞泉通明大劫龍廄成池龜城瑶闕浮照星機三元上館天憲九宫二十七府簡注元功持握生化考校羅酆真光流布下拔罪魂息役鬼官業報休停冤仇和釋隨運長存因緣輪轉上升朱陵永斷貪愛牽纒之苦逍遙髙空受鍊太霄太霄之天天帝觀覺無色之境梵行東方八天力欲竟成天帝徂央微真納乾晝登天帝辨崇至群都曾秀敷天帝杳良鳴祛非却妄天帝石完夫變正玄明天帝寂真耕吕耀疆勒天帝胡顓希明極真定瑶天帝章毗化居邀玄召雲天帝野昌曜虛南方八天利定宛圖天帝景昌祖名韓司主生天帝萌元評玉觀夷會天帝召靈紀須咸樂赭沖天帝確端由衢車揚璘下天帝度謡路音平煥鬱理天帝氣成専浮太皇育嶠天帝孔遵生藍英佐侯天帝洞覺靈西方八天童隨巘妙天帝圖賔良舉玄謝都天帝仇周九王赤震招仙天帝火提楚基標光咸思天帝璟明山師亮宗迪玄天帝召意并堂魁符大建天帝玉鍊演論空居杳樂天帝越婁浮光載梵阿史天帝隱題部延北方八天東井貫綱天帝北華粗彌幽華太虛天帝莊竭杜如劫刃降和天帝斗勇慈云玄方正嶽天帝籠亰麻𤤠通霄次皇天帝玉宫乾尊極張應加天帝洞神八威宗回浮化天帝黃朱景飊慧擇龍化天帝謝登溢常三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻天中之音天中之尊天中之神天中大魔天中之靈九華十晶遊宴鬱單生神妙冊髙祕亰山玄波鼓蕩運斡天關今日雙輪會合大慶因緣請除故滯真降玄丹萬惡永消變景飛仙上靈監舉同升帝軒木曜宣威火曜施政金曜司察水曜行令土曜四據總持符命句芒主生蓐收化斂玄冥閉藏祝融流演后土居中執御大典青靈始老立天開發丹靈真老檢校科格皓靈皇老主領殺伐鬱靈玄老大布聖澤玄靈元老坐鎮金闕五老帝尊萬神所歸飛行三界正統元機持幢仗節遊觀太微位號顯著教令弘施上天戮邪豁落誅摧天皇受詔收滅魔凶石光交煥烈火流衝炎方攝精醜伯驅風寒夜雲營清穴隂宮敢容乖變拒遏髙真融蒼大吏明示典刑泉沙苦刃捕逐無停風刀束送除蕩妖兵百邪歸正皇道長興簡奏大羅同功紫宸陽輝鳳曆九氣順行普告十方無量威靈列科定籍三元保寧丹華大誥分變推遷劫刃崑丘飛霞散煙上開八極下列九淵風轉圓羅肇生諸天天上天下混洞沉冥溟涬鴻濛玄極無形宏綱大範幽廓生音赤象黃方度劫自然元始流布霄輝上篇金籙簡章八景瓊文攝召衆魔保制天根正氣騰飛成結清都元和化演鳳真玉書總祕蕭臺廣運沖虛紫微八會元素珠編陽景招靈無量飛仙同會太清氣合上玄玄中玉真太極髙皇流泛洞霞吟嘯明堂三騫秀鬱輝耀絳房玉章化氣丹字騰光澄晶永劫安保延康千和萬合自然成真真中有神三天大君玉虛上帝黃老先生長生法師大洞髙尊執符把籙保度天民上居須延遊宴玉亰虛無之內空洞之中下鎮神洲五嶽名山六無相勝回轉天關不得怠縱三華列言皇道開生無量度人上升八羅運天彌綸九光至聖相慶因緣妖姦永息正教洪宣通流萬化列奏三天三天之上各啓生門中歌開明合體之章貰氣靈篇辭參髙真第一妙無廣化生氣之音雙明初判乃闢天關蕩蕩道境元始髙居玉剛橫空輪轉四虛鬱羅寶臺深祕龍章虎山海嶠開天御圖上玄降氣悉受真符回環八素飛躍飄浮上清大洞篇三十九皇書道君受法言絳霧閟清都帝道既已成真文當廣敷普度學仙民飛神登太無第二妙有明體成道之章玄玄太羅天中有白玉亰瑶闕聳太虛端坐虛皇尊三氣繞蕭臺天闕列神靈太帝執虎符下召元皇君群品受真體分化逐境生天魔列玄職朱幡校北營大聖憫淪溺玄章下太清元洞布靈慈為爾敷真經願爾進仙業咸得道果成光明照幽夜苦爽皆超升永斷相牽結冤對悉休停第三大混貫氣之歌元始立萬天正氣青黃白浮變為髙清沉化成渾濁中和有邪正為人復生物欲念弊真元愛河常汩沒契道入仙靈功圓歸帝闕造業墮輪回隨念沉幽獄豈知太空中三官秉化筆執我大威權九宫標憲格天堂諸種民南昌常快樂既證玄悟道豈復有淪沒受我天寶言速進長生業此三界之上飛空之中仙王歌音音參洞章誦之百遍名度南宮誦之千遍魔王保迎萬遍道備飛升太空過度三界位登仙公有聞靈音魔王敬形勑制地祇侍衛送迎拔出地戶五苦八難七祖升遷永離鬼官魂度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈魔王隱祕之音皆是大梵言非世上常辭明究生體貫氣隨材天政及民卓無私妄天之至公考驗於帝王法道以變通隨時以舉用通玄聖之隱密非凡修之可量故謂玄奧難可尋詳上天所寶祕於神霄玉清王府東藏寶室依科三萬七千年應運下傳若有至人齎金寶質心依舊格告盟十天然後而付焉道言夫誦詠此經則凡體成真穢氣清蕩天光入心骨有玉津克證靈仙永謝死因萬道開通所為者成上順天常日月五星中和人氣疾痛無侵下制魔爽百神衛形皆當齊心修齊六時行香十遍轉經福德立降消諸不祥無量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太隂臨過之時同學至人為其行香誦經十過以度尸形如法太上明體體變柔金司命貫氣氣陶玉津魄鍊尸滅九宮還靈魂神徑上南宮隨其學功計日而得更生轉輪不惑便得神仙道言夫天地運終星宿錯度日月失昏四時失度隂陽不調國境有災兵氣時現疫毒流行兆民死傷師友命過凡有此災皆業成變體德感致氣各有所由道之自然天之政也皆當修齊行香誦經夫齊戒誦經功德甚重上消天災保鎮帝王下禳毒害以度兆民生死受賴其福難滕故曰無量普度天人道言凡有是經能為天地帝主兆民行是功德有災之日發心修齊燒香誦經十過皆諸天記名萬神侍衛右别至人尅得為聖君金闕之臣諸天記人功過毫分無失天中魔王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音太極真人撰太上明體貫氣靈篇東方八天亨健基圖偃明命輿句華品懋蘭第玄無剎篛忌到泯炎坤謀建書靈憲直真帝壼呼正德銘越鼎亭莩詔彥遵澤古同焉誅敵假宥傑番離濳徂神岡破綱周愼斳都南方八天璲琩虛攸麗佃雅秋孟廊純被思瀏騫投勑鎮鬼井畢參萊休定斷神磔賜候印婁洸鉛洞溢霞晶散浮煌爛棲魂交駟蔚搜常古疑涵淨池火求冶滇感兊生蘇氣彪西方八天混契萌動融衝駿偷緑羅知大猛旗聿漚荷裙夷箭曷領逋遒日蘂鳥九文已空洲眇何呈假曆江紫泉響抱親飼爻構道先君軀分體氣列由筵肇解魯住釋滋用筌北方八天哿陀阿陵辜胡拯玄景摶太霄舒靜播連赤鏤瑶秩亘閲宏遷符疏雲華紅誕露翩關混東戶丘府壅年矗竝兟晉滬意邈傳色凝方確祕丹董源韓録罰爽道彰碧沿道言此諸天中大梵隱語無量之音舊文字皆廣長一丈天真皇人昔詣柏林之舍對伏天玄五方率現帝仙唱虛納以火泉鍊之九劫文乃瑩鮮書太極鳳軒玉屏之上金光自生照徹諸天真子佩文世世登仙龍車入門常侍帝前丹書燔之飲以瓊泉百病去身壽等九天昔書其文以為正音有知其音變而通之為道利亨齊而誦之諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳魔王保舉上真道備克得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成變凡體招靈氣克保升仙天真自然之音也故誦之致飛天下觀上帝遙唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響十方肅清河海靜默山嶽吞煙萬靈震伏招集群仙天無氛穢地無祅塵冥慧洞清大量玄玄也元始無量度人上品妙經卷之二十六

  - {type: variant, offset: 0, length: 2221, content: 靈寳無量度人上品妙經卷之五十二宙二玄明洞淵品道言昔於紫元天中緑景空歌太晨光土受元始度人玄明洞淵無量上品元始天尊當說是經周廻十過以召十方始當詣座天眞大神上聖髙尊妙行眞人玄明洞淵五靈玄老水帝八方九海洞淵龍王水官四十二曹江河泉源官屬將吏無鞅數衆昇空而來流雲靄霧黳玉之輿玄明之輦紫蓋神輪洞霄垂蔭流虹寳光萬色鬱勃洞煥太空五日五夜諸天日月星宿象沈海影綱蟠玉樞珠暈璣徽停輪駐燿神宮鎭靜靈嶽收雲天浮八騫氣清九野一國地土山川林木緬平一等無復髙下土明玉晶無有異色衆眞侍座元始天尊玄坐空浮玉光七變靈鼇寳座之上說經一遍諸天大衆同時稱善是時一國男女歸依元始玄明洞淵之法悟此生元先從珠露說經二遍信知眞水變化無窮說經三遍知見柔明利物幾道說經四遍思念生宫初降洞淵之氣腎華甲坼神龜漾遊說經五逼心穴宏敷靈潮機動玄明散液萬竅滋流諦觀靜念體妙無爲說經六遍天霐澄湛明可分神一一玄中具我身相說經七遍洞淵靜碧龍神奉教說經八遍海雲擎露甘液潤生說經九遍水光發爓宫殿千層中有天民咸悟道法說經十遍玄明之氣化成紫雲普履諸天現無爲海幽沈苦爽解脫逍遙是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品玄明洞淵至眞大神無鞅之衆淨空而至說經二遍南方無極無量品玄明洞淵至眞大神無鞅之衆浮空而至說經三遍西方無極無量品玄明洞淵至眞大神無鞅之衆浮空而至說經四遍北方無極無量品玄明洞淵至眞大神無鞅之衆浮空而至說經五遍東北無極無量品玄明洞淵至眞大神無鞅之衆浮空而至說經六遍東南無極無量品玄明洞淵至眞大神無鞅之衆浮空而至說經七遍西南無極無量品玄明洞淵至眞大神無鞅之衆浮空而至說經八遍西北無極無量品玄明洞淵至眞大神無鞅之衆浮空而至說經九遍上方無極無量品玄明洞淵至眞大神無鞅之衆浮空而至說經十遍下方無極無量品玄明洞淵至眞大神無鞅之衆浮空而至十遍周竟十方無極玄明洞淵天眞大神一時同至一國男女傾心歸仰咸相議言元始天尊來降此天百寳紫元天宫爲諸仙衆顯揚玄妙五行眞水之法其氣名曰玄明洞淵我聞玄明爲眞水之德形色俱美洞淵爲眞水之量幽深無涯若以我等所見五行之水滔天洋洋洪浩不測不知無形五行謂之眞水名曰玄明洞淵作何體狀天地未分先有眞土土能固攝十方上下其中眞水無量無邊風氣鼔之凝爲萬物是生命本爲大道元始天尊今日宣演五行無形眞氣之妙我若得聞自得超昇神霄上境皆當朝禮天尊覬獲太慈遺我勝法作如是說敬禮再拜來者有如細雨密霧無鞅之衆迮國一半土皆偏陷非可禁止於是元始懸一寳珠大如黍米在空玄之中去地五丈元始登引天眞大神上聖髙尊妙行眞人玄明洞淵五靈玄老水帝八方九海洞淵龍王水官四十二曹靈司掾吏無鞅數衆俱入寳珠之中天人仰看惟見勃勃從珠口中入旣入珠口不知所在國人廓散地還平正無復欹陷元始即於寳珠之内說經都竟衆眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倏欻之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸行清淨妙靈智心心行如水利澤無盡明一明順明通明照明智明慧明辯明道明玄明空心無留滯黙契玄妙同造杳冥深悟至要國安民康逍遙太平經始岀教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝内名隱韻之音亦是眞王内諱百靈之隱名也妙化無形眞水玄明洞淵之法夫玄明爲水之情性洞淵爲水之室宅流則爲智靜則爲慧流故能通靜故能照爾能體之自然得道天地以靜眞水生民物以靜眞水行燥熱爲火靜寒爲水燥可勝寒靜可勝熱眞水生故也爾若安靜眞水自行變化日生靜爲命元靜則長生非世之常辭上聖已成眞人通玄究微能悉其章誦之十過諸天遙唱萬帝設禮河海靜默通導淵源日月合度璇璣不行群魔束形鬼精滅爽回屍超死白骨成人至學之士誦之十過則五帝侍衛三界稽首魔精喪眼鬼祅滅爽濟度垂死絶而得生所以爾者學士穢氣未消體未洞眞召制十方威未制天政德可伏御地祇束縳魔靈但却死而已不能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因縁萬災不干神明護門斯經尊妙獨歩玉京度人無量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到水帝列言泉曲悉宥開朗冥關億曽萬祖幽䰟苦爽皆即受度上昇朱宫格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經眞水上應五臓育嬰昇入泥丸玄霜紫冰皆即受度飛昇南宮世人受誦則洞靈激奔神泉八周益軀生神延壽長年後皆得作尸解之道䰟神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寳不傳下世至士齎金寳效心盟天而傳輕泄漏慢殃及九祖長役右官侍經五帝玉童玉女各六十四人營衛神文保護受經者身道言正月長齋誦詠是經九變三眞澤及重泉爲上世亡䰟斷地逮役度上南宫七月長齋誦詠是經眞水出胎道受永年身得神仙諸天書名黄籙白簡削死上生十月長齋誦詠是經復本還源功歸上玄總攝正氣統御髙仙爲國王帝主君臣父子安鎭國祚保天長存世世不絶常爲人君安鎭其方民樂太平八節之日誦詠是經神泉流轉玉關冲盈得爲九宮眞人本命之日誦詠是經眞水清明内照形神出紫入黄五臓生英䰟神澄正萬氣長存不經苦惱身有光明三界侍軒五帝司迎萬神朝禮名書上天功滿德就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黄白三色雲氣之中内外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室内玄明洞淵之氣狀如紫烟羅絡交灌洞見百神項生圓象光映十方如此分明密呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經, YP-C: ''}

  - {type: variant, offset: 0, length: 1892, content: 靈寳無量度人上品妙經卷之三十八黃八神符除難品道言昔於赤靈丹天燿華明煇八威神闕受元始度人神符除難祕奥妙品元始天尊當說是經周廻十過以召十方始當詣座天真大神上聖髙尊妙行真人無鞅數衆乗空而來宸霞映虚翠轂瓊軒華芝寳蓋明彩纏煇萬光蒨燦圎景合鮮五日五夜諸天妙氣交文煥落龍光鳳徊鬱藹自然一時成章靈風爽徹星宿停輪萬景廓奕氛穢消澄一國地土山川林木七寳凝華緬平均等無復髙下土皆作瑞雲浮鬱離羅之色衆真侍座元始天尊玄坐空浮八靈九變神圖玉局之上說經一遍諸天大聖同時稱善是時萬界廓清靈風散煙天發玄瑞地發祥應慶會咸臻普及含生說經二遍魔癘滅形丹刻麗空說經三遍災疾消除說經四遍自然靈章映現八虚說經五遍人民達悟符章之因說經六遍敬奉靈文皆獲道真說經七遍寳章玉書開度無窮說經八遍三光妙氣灌絡形神說經九遍苦魂受化鍊度朱陵說經十遍國祚安鎮永保升平是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極度符神王至真大神無鞅之衆浮空而至說經二遍南方無極度符神王至真大神無鞅之衆浮空而至說經三遍西方無極度符神王至真大神無鞅之衆浮空而至說經四遍北方無極度符神王至真大神無鞅之衆浮空而至說經五遍東北無極度符神王至真大神無鞅之衆浮空而至說經六遍東南無極度符神王至真大神無鞅之衆浮空而至說經七遍西南無極度符神王至真大神無鞅之衆浮空而至說經八遍西北無極度符神王至真大神無鞅之衆浮空而至說經九遍上方無極度符神王至真大神無鞅之衆浮空而至說經十遍下方無極度符神王至真大神無鞅之衆浮空而至十遍周竟十方無極主領神符度符神王天真大神一時同至一國男女傾心歸仰來者有如雨霧交集無鞅之衆繁積一國地土皆震非可禁止於是元始於其座中凝顧玄空運大神力口吐靈文雲篆龍章流金散燿八角垂芒遍於空際離合變化現一寳壇去地九丈下捧華雲元始登引天真大神上聖髙尊妙行真人十方無極天宫度符神王至真大神直符將吏無鞅數衆俱登所現寳壇之上天人仰看惟見冉冉從壇四面而升既登寳壇無不容載國人廓散地還平正復得安靜元始即於寳壇之上說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法皆得濟度全其本年除難免傷傾土歸仰普證善縁無憂無惱無疾無殃無驚無恐無厄無患無試無魔言惟道旨心惟道真齊同和樂異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是五老上帝火鍊光精豁落空玄變化之根三元妙氣神祕内名隱韻之音亦是三天内諱百靈之隱名也非世之常辭上聖已成真人通妙達玄能悉其章誦之十過魔王敬仰邪怪滅精氛穢蕩淨道氣合神二燿流景五華受明災癘消散却死回生至學之士誦之十過則帝真鑒祐髙宸降軒宻授玄言寳籙玉文緫治鬼魔却伏禍姦所以然者靈音會於眇清至理合於元根妙精感激召氣致真洞化莫窮無所不神輕誦此章身則被殃供養尊禮門尸興隆世世昌熾神符除難萬災不干神明護門斯經尊妙獨歩玉京度人無量爲萬道之宗巍巍大範徳難可勝道言凡誦是經十過諸天齊到三萬六千神符妙氣八萬四千赤文之精灌注其身身受鍊養結化僊真格皆九年玉籙定生削除死名億曽滯魄𡨚繫幽沈皆受濟度各獲逍遥遷變生形性識洞悟敬奉微言玄功備著昇於九宮超凌太霞逸轡紫清也上學之士修誦是經九天真文皆集其真結絡靈綱入其身中纏羅五臟養育華精延度壽考長生飛僊世人受誦則招集神吏符章從官三光真宰五氣天君威靈衛護萬禍不干身鍾道氣死不滅真俓上南宮返化常存此經微妙普度無窮一切天人莫不受慶生死蒙惠上夭所寳不傳下世至士齎金寳效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝直符玉童玉女各二十四人營衛神文保護受經者身道言正月長齋誦詠是經感致上元東極宮中長生玉真髙上帝皇敷降九氣玄生之符保度一身九祖沈魂皆獲超脫與道合并七月長齋誦詠是經感致中元西靈太皓宮中寳華上妙至極髙尊宣通七氣金光玉符斷除業累却伏魔精罪結散釋永保清貞金真鍊華瓊英内生玉體堅彊長生萬年十月長齋誦詠是經感致下元北真紫皇玄上宮中玉宸大道無上元皇垂華散靈惠布五氣天玄太符蕩除姦穢掃滅祅凶固衛家國敷佑庶民帝主壽康福禄綿綿徳被萬方常保太平八節之日誦詠是經感致八景赤精丹華玉文八威神策靈光妙氣下降身中灌澤九宮三田受真百痾蠲除萬害塞源羣魔憚伏脫離禍難青書奏功紫籙紀僊玄功偉著昇景上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黄白三色雲氣之中内外蓊㝠有六甲直符九宮掾吏度符神王直符將吏羅列左右日月照明洞煥室内項生圓象光映十方如此分明宻呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋清堂修行至經無量度人願所啓上徼徑御無上三十二天元始上帝至尊几前畢引炁三十二道東向誦經元始無量度人上品妙經, CK-KZ: ''}

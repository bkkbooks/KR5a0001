  - {type: variant, offset: 5830, length: 0, content: '', CK-KZ: 三道言昔於始靑天中碧落空歌大浮黎土受元始度人保胎護命妙品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖高尊妙行眞人保胎護命三元六甲大神无鞅數眾步景而來飛雲流軿泛霄紫輿翠輦金車彩蓋罙覆洞淸凝光三色煥麗映徹空𤣥十日十夜諸天寶苑鬱京墉臺庭闕浮積巍構萬壘靈綱神芒停璣駐燿海雲呈瑞山嶽徊烟遠逮浩杳近連陬壁雲煇鼓華仙澤飄曵觸衣聞香皆獲上道一國地土山川林木碧䝉綿密蘭風靜注委霞繞落道聲夷由无量天仙稱歎希有眾眞侍座元始天尊𤣥坐空浮一千}

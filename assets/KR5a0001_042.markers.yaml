  - {type: variant, offset: 5831, length: 0, content: '', CK-KZ: 百天宮萬龍虯揭明蘂繁珠大寶玉座之上說經一徧諸天聖母同時稱善是時一國仙妃神女憶悟往因見道本元信知天地未生元氣肇始神精吸粹陰陽定胎九十億劫三氣混淪九十大劫三華始分五老保胎三元育魂七竅洞張大塊乃坼二儀出胎始建寰海說經二徧胎卵濕生毛鱗介贏无不備成說經三徧喙鳴口語呼應調順眞協天律說經四徧膚革堅完金眞散靈剛風宛轉說經五徧道出英妙才韻秀爽說經六徧至巧功成曲遂天德說經七徧育嬰端就善慧滋身說經八徧婦人懷娠鳥獸含胎已生未生皆得生成說經九徧胎臟發泄內寶露形說經十徧道用神化自然成人是時一國是男是女莫不傾心保胎護命咸得長生道言是時元始天尊說經一徧東方无極甲宮天冥保胎萬和護命大神无鞅之眾浮空而至說經二徧南方无極丙宮天眞保胎𤣥明護命大神无鞅之眾浮空而至說經三徧西方无極庚宮天厯保胎肅靈護命大神无鞅之眾浮空而至說經四徧北方无極壬宮天胚保胎順生護命大神无鞅之眾浮空而至說經五徧東北无極癸宮天孕保胎護正護命大神无鞅之眾浮空而至說經六徧東南无極乙宮天壽保胎樂化護命大神无鞅之眾浮空而至說經七徧西南无極丁宮天申保胎道寂護命大神无鞅之眾浮空而至說經八徧西北无極辛宮天童保胎𤣥祖護命大神无鞅之眾浮空而至說經九徧上方无極戊宮天明保胎法義護命大神无鞅之眾浮空而至說經十徧下方无極己宮天陽保胎道康護命大神无鞅之眾浮空而至十徧周竟十方无極保胎護命大神一時同至一國男女傾心歸仰來者有如揚埃積塵繁星散霧无鞅之眾徧滿一國九地俱震非可禁止於是元始舉身放光洞照十方上下良久攝光從寶光雲葉中出上現元始天尊大慈玉相金容赫炳於其眉間出寶珠相此珠微妙光出一尋內見虛皇玉闕天靈寶臺无鞅天人行住棲止乘跨鸞鶴笑言顧矚一時同現水火交發山川宮殿圓寸而足元始旣在太𤣥眞一廣大靜定卽此化身分形无量登引天眞大神上聖高尊妙行眞人十方无極保胎護命至眞大神无鞅數眾俱入元始珠光之中天人仰看惟見拂拂從珠影中入旣入珠影不知所在國人廓散地還虛曠无復駢沓元始卽於神珠妙光之內說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂无遺響是時天人遇值經法普得濟度保胎護命无有殞傷傾土歸仰咸行善心不妄不惑不欺不欲不爽不違不思不怍不制不囘言與天通口无二聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天保胎護命神王內名隱韻之音亦是保胎三元六甲內諱百靈之隱名也非世之常辭上聖已成眞人通𤣥究微能悉其章誦之十過諸天遙唱萬帝設禮天地萬類含胞孕胎無不生成祕解道先深得元奥大至天地纎及昆蛸未有不深極胎眞受道眞氣布精凝血然後化成一切聖賢諸天帝王高仙未有不從胎根育養而出故保胎護命誦經召神易轉陰陽降福生人至學之士誦之十過則聖母降房司馬侍軒司命定籍五帝延生萬𢑥受形保胎護命壽德齊明所以爾者學士內咒隱名外誦眞經召制十方與道同榮伏御地祇束縛魔靈不但𨚫死亦可仙身謂其呼召三元六甲十方胎神使護己命身中胎元十眞百節赤君聽命使子神仙不惟女子胎孕之厄可以誦持而學道鍊眞不妨咏味輕誦此章身則受殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天三元六甲九宮保胎護命福善大神降應齊到斷絕六天惡鬼上世亡魂於一切眾生胎元命宮作諸誣害使眞氣消落神華傾喪孕化不登子嗣難成故氣流接注連累代速付北都斬戮鬼形考按錄籍善惡速分受道順生得爲貴人而好學至經功滿德就自識胎眞皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經皆卽受度眞神自飛出入胎宮女人受誦則得保胎護命天人爲子寶精變嬰誕育之日胎神護命无有損傷男子夙成福與道隆慶偕時興延壽長年後皆得作尸解之道魂神暫滅不經生滅卽得返形遊行太空此經微妙普度无窮一切天人莫不受慶无量之福生世蒙惠上天所寶不傳下世至士齎金寶効心盟天而傳輕泄漏慢殃及九祖長役鬼官保胎護命玉童玉女各三十二人營衞神文保護受經者身道言正月長齋誦詠是經速召上元六甲直符保胎護命斷上世亡魂追呼子孫訟在天官使胎不成絕孕无子鬼注孤𡞦七月長齋誦詠是經速召中元六甲直符保胎護命斷咒詛蠱厭妬害男女訟在地官使胎不成絕孕无子鬼厯著名十月長齋誦詠是經速召下元六甲直符保胎護命斷冡訟濕注祖世牽連鬼食胎精訟在水官使胎不成絕孕无子黑札定刑八節之日誦詠是經護諸眾生一切命元使命无傾八方胎神各領官屬入朝九宮太乙眞君延生保胎護命生根凡誦是經普及生民不獨女身而植道因天帝下觀得爲九宮眞人本命之日誦詠是經速召胎神聽受眞經明堂三君保護胎精魂神澄正萬氣長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上淸道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐靑黃白三色雲氣之中內外蓊冥有靑龍白虎朱雀𤣥武獅子白鶴羅列左右日月照明洞煥室內項生圓象光映十方如此分明密咒曰无上𤣥元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啟所言今日吉慶長齋淸堂修行至經无量度人願所啟上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經}

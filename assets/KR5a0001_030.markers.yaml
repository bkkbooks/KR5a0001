  - {type: variant, offset: 0, length: 1597, content: 靈寶无量度人上品妙經卷之三十玄十斷絶胎根閉塞死戸品道言昔於始青天中紫清玄洞五明華宮受元始度人斷絶胎根閉塞死戸无量上品元始天尊當說是經周回十過以召十方始當詣座天眞大神上聖髙尊神霄玉清眞王太上消魔玉清神王扶桑青華帝君後聖金闕帝君萬天帝主無鞅數衆乘空而來飛雲丹霄緑輿瓊輪羽蓋垂䕃流精玉光五色鬱勃洞煥太空九日九夜諸天日月星宿璇璣玉衡一時停輪神風静黙山海藏雲天無浮翳四氣朗清一國地土山川林木緬平一等無復髙下人皆悟道成法土變作碧玉無有異色衆眞侍座元始天尊玄坐翠浮玻瓈靈陽實座之上說經一遍萬天帝君同時稱善稽首再拜咸得見道是時一國男女死者復生生者悟道說經二遍鳥獸介蟲皆得長生說經三遍四時和平無有寒暑說經四遍星宿日月天界停住無復東行說經五遍疾病沉痾並獲痊瘥說經六遍地土平正祅塵自潰說經七遍五行皆一混合天成說經八遍娠胎皆岀芽蘖甲坼已生未生立獲生成說經九遍善惡無迹心歸正化說經十遍華夷一等無有邪僻是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方扶桑青華洞境至眞大聖無鞅之衆浮空而至說經二遍南方赤靈陽光洞元至眞大聖無鞅之衆浮空而至說經三遍西方素景皓靈洞扶至眞大聖無鞅之衆浮空而至說經四遍北方玄靈至妙洞化至眞大聖無鞅之衆浮空而至說經五遍東北上靈通理洞妙至眞大聖無鞅之衆浮空而至說經六遍東南鎭靈體元洞神至眞大聖無鞅之衆浮空而至說經七遍西南燿靈瑩空洞徹至眞大聖無鞅之衆浮空而至說經八遍西北華靈統化洞逺至眞大聖無鞅之衆浮空而至說經九遍上方神靈普變洞觀至眞大聖無鞅之衆浮空而至說經十遍下方靜靈化生洞慧至眞大聖無鞅之衆浮空而至十遍周竟十方無極天眞大聖一時同至一國男女傾心歸仰來者有如黃霧蔽密瑞煙雜沓無鞅之衆迮國一半土皆偏陷非可禁止於是元始内發心光外飛神氣上出泥丸火光煇燿遍於十方天界然後収光返照歸本聚氣變成寶珠狀若露圓去地億數萬丈元始登引天眞大神上聖髙尊諸天帝主十方无極至妙神靈大聖無鞅數衆俱入寶珠之中天人仰看惟見勃勃從珠口中入既入珠口不知所在國人廓散地還平正地復元色無復碧玉元始即於寶珠之内說經都竟衆眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得長生全其本年無有夭傷傾土歸仰咸行善心不妄不貪不滿不盈不傾不敗不去不來不住不見心無妄想身無邪欹齊同慈愛異骨成親國安民豐欣樂太平經始出敎一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝至靈神王内境妙道變仙化形隱祕之音亦是上帝内諱萬神之隱名也非世上之常辭上聖已成眞人通玄究微能悉其章誦之十過諸天遥唱萬帝設禮河海靜黙山嶽藏雲日月停景璇璣不行群魔束形鬼精滅爽回屍起死白骨成人至學之士誦之十過則五帝侍衞三界稽首萬神護法百靈祐身濟度垂死絶而得生所以爾者學士穢氣未消體未洞眞以制十方威未制天政德可伏御地祇束縳魔靈但爲常文未通微妙即却死而已不能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因縁萬災不干神明護門斯經尊妙獨歩玉亰度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到億曾萬祖幽魂苦爽皆即受度飛昇朱宫皆得鍊形受化更生復爲至人而好學至經功滿德就皆得神仙飛昇金闕遊宴玉亰也上學之士修誦是經皆即受度飛昇南宮中學之士修誦是經無有生滅去來快樂得陞仙籍下學之士修誦是經即得神魂爽利疾病消除住世長年此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寳不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖罪及爾身長有天官侍香五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經死戸立閉胎根斷滅形神微妙飛昇南宫七月長齋誦詠是經身得神仙諸天書名金簡玉符召魂通微得獲長生十月長齋誦詠是經爲國王帝主君臣父子安鎭國祚保天長存道玄不絶永斷劫運安鎮其方民稱太平八節之日誦詠是經得爲九宫眞人本命之日誦詠是經魂神澄正萬氣長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十六, CK-KZ: ''}

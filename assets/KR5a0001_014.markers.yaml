  - {type: variant, offset: 4395, length: 0, content: '', CK-KZ: 身身得受生上聞諸天諸天之上各有日門鍊陰全陽流火變形日精注凝克爲仙眞中有空洞謠歌之章眞王靈篇辭參高眞第一日精陽明飛空之音元始赤精三元賴成朱光照徹色洞幽冥青林金華瓊實熒熒赤城萬里絳闕紅庭五帝無爲萬仙列卿億民遊散飮光食英后妃玉女燒香奏罌兆能引霞奔神高清金顏寶冠錦旛繡旌前導六甲後從六丁陽明之威陰醜滅形帝錫長生延年久齡上眞之道九陽是稱第二日精陽明眞王之章日界遊空浮行九宮乘剛獨力周駕神風宇宙金色山海一同萬物賴生三元共功是元始身分形變容九鍊洞陽出先洪蒙朱芒靈烏吐納太沖兆能感之明智靈通靜察遠鑑還老成童}

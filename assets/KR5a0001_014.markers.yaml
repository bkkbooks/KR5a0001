  - {type: variant, offset: 3810, length: 245, content: 身身得受生上聞諸天諸天之上各有日門鍊隂全陽流火變形日精注凝克爲仙眞中有空洞謡歌之章眞王靈篇辭參高眞第一日精陽明飛空之音元始赤精三元頼成朱光照徹色洞幽㝠青林金華瓊實熒熒赤城萬里絳闕紅庭五帝無爲萬仙列𡖖億民遊散飲光食英后妃玉女燒香奏罌兆能引霞奔神髙清金顔寳𠜍錦旙繡旌前導六甲後從六丁陽明之威隂醜滅形帝錫長生延年乆齡上眞之道九陽是稱第二日精陽明眞王之章日界遊空浮行九宫乗剛獨力周駕神風宇宙金色山海一同萬物頼生三元共功是元始身分形變容九鍊洞陽出先洪䝉朱芒靈烏吐納太沖兆能感之明智靈通靜察逺鑑還老成童, CK-KZ: ''}

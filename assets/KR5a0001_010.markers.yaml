  - {type: variant, offset: 0, length: 2018, content: 靈寳无量度人上品妙經卷之十天十大赤靈文品道言昔於紫晨天中金碧飛空大明寳土受元始度人大赤靈文无量上品元始天尊當說是經周廻十過以召十方始當詣座天真大神上聖髙尊妙行真人太清真王七天列聖太極玉司左右官屬靈官童子無鞅數衆乗空而來雲駕飛軒琅輿瓊輪彤蓋垂影玉華散輝五色流眩洞耀太空五日五夜諸天道境玄英深輿神綱息輪玉標金魁一時停運天風靜籟虛象凝霄雲藏波湛乾坤洞清一國地土山川林木緬平一等無復髙下土皆明徹熠燿積翠無有異色衆真侍座元始天尊玄坐空浮五色煇明玉蓮之上說經一徧諸天大聖同時稱善是時一國男女心悟太空得道無爲說經二徧洞見法身永無漏塵說經三徧心超妙元通諸法相說經四徧神慧備足自在飛行說經五徧音辯如流敷揚至道說經六徧返照胎光定息無窮說經七徧玉闕合氣神宫流珠說經八徧騫林轉影普覆諸天說經九徧萬物發生中無夭折說經十徧天樂浮空雲營靄瑞是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一徧東方无極无量品至真大神無鞅之衆浮空而至說經二徧南方无極无量品至真大神無鞅之衆浮空而至說經三徧西方无極无量品至真大神無鞅之衆浮空而至說經四徧北方无極无量品至真大神無鞅之衆浮空而至說經五徧東北无極元量品至真大神無鞅之衆浮空而至說經六徧東南无極无量品至真大神無鞅之衆浮空而至說經七徧西南无極无量品至真大神無鞅之衆淨空而至說經八徧西北无極无量品至真大神無鞅之衆浮空而至說經九徧上方无極无量品至真大神無鞅之衆浮空而至說經十徧下方无極无量品至真大神無鞅之衆浮空而至十徧周竟十方十境无極天真大神一時同至一國男女傾心歸仰來者有如飄雲藴雨無鞅之衆各各稽首恭禮玉陛言臣所居之天在種民之上太清大赤玄空之中天中萬象應念即有息念即無莽蕩浩空光明遼廓道界之内九氣聖位超升已盡脫諸縁累一切空想不屬有無思悟永生大赤天中爲第三太空玄界景燿三華之色下安飛輪保鎮天闕恭聞天尊於此太極皇真仙境岀示靈文昭垂顯奥玄霄之中一切衆生下逮神洲无量世界同獲勝果爲无量福臣等各運道意佇聽至言上真大法於是元始懸一寳珠大如𥞫米在空玄之中去地五丈元始登引天真大神上聖髙尊妙行真人十方无極至真大神無鞅數衆俱入寳珠之中天人仰看大赤靈文徧見珠内方廣一丈八角垂芒惟見勃勃從珠口中入既入珠口不知所在國人廓散地還平正無復欹䧟元始即於寳珠之内說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸證玄空無想無念無色無聲無殺無欲無穢無垢無妄無私言無華麗口無惡聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝内名隱韻之音亦是大赤靈文九霄玉字上真之隱名也非世之常辭列聖已證真仙通玄究微佩服赤文能悉其章誦之十過諸天遥唱萬帝設禮靈文開廓十方化玄一切神靈咸歸至應真道發見群魔束形鬼精滅爽丹字開生廻屍起死白骨成人至學之士誦之十過則氣超五辰德動三界魔精喪眼鬼祅滅爽拔度垂死沉淪得升所以爾者學士初解玄空道登大赤欽味靈文體未洞真以制十方德未合上聖威可剋制百魔濟度萬微但超升而已不能洞玄輕誦此章身則被殃供養尊禮門尸興隆世世昌熾與善因縁萬災不干神明護門斯經尊妙獨歩玉京度人無量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過悟解之者道契大赤氣合太清縁想累入一切塵滯應時消盡惟一玄虚淡然微影明靜瑩徹洞觀妙體即爲真人諸天齊到億曽萬祖幽魂苦爽皆即受度上升朱宫格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛升金闕遊宴玉京也上學之士修誦是經悟道證玄登太極宫一切世縁廓然歸虚黙契此理開悟虚明永無變滅超度長生皆即受鍊飛升南宫世人受誦未入真靜漸棄有想太空之中自生真氣下浹凡體則延壽長年後皆得作尸解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶无量之福生死䝉恵上天所寳不傳下世至士齎金寳效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齋誦詠是經神風恊運薰養萬靈結累解落合真體元爲上世亡魂斷地逮役度上南宫七月長齋誦詠是經金真激雲混洞招真通靈致仙身得飛升諸天書名黄録白簡削死上生十月長齋誦詠是經紫雲鍊形飛飊左廻八景三真謁真命神嘯攝虎兵爲國王帝主君臣父子安鎮國祚保天長存世世不絶常爲人君安鎮其方民稱太平八節之日誦詠是經八景開通五宫洞清身入太無體合玄虚得爲九宮真人本命之日誦詠是經大赤靈文與兆相因千變萬化自然致真魂神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐蒼赤黄三色雲氣之中内外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室内項生圓象光映十方如此分明宻呪曰无上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傅言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋清堂修行至經无量度人願所啓上徹俓御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始无量度人上品妙經, CK-KZ: ''}

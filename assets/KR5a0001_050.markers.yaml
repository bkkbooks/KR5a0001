  - {type: variant, offset: 0, length: 2887, content: 靈寳无量度人上品妙經卷之五十字十蠲化水火災癘品道言昔於紫元寳皇天中空洞玉音大升明土受元始度人蠲化水火災癘妙品元始天尊當說是經周迴十過以召十方始當詣座天真大神上聖髙尊妙行真人無鞅數衆乗空而來瑞靄積霄靈煙揚彩瑶輪瓊輦華蓋垂廕萬景凝光百千寳色洞煥太空七日七夜諸天軓歩日月運度咸悉凝輝星宿𤪽璣舍次停流碧山層巘神海湛波天覆僊雲地成瓊玉臺闕長樓龍攀鳯舞素芝絳木捧露生香碧影金華普天共色衆真侍座元始天尊玄坐空浮九色直龍之上說經一遍諸天大聖同時稱善是時一國男女欣聽天尊宣說蠲化水火災癘慈救三界无量大法說經二遍天摇玉毫彌覆龍觀說經三遍明河瀉光玄珠飄灑說經四遍水騰火降變化自然說經五遍災癘不生劫數延逺說經六遍隂平陽泰氣無伏勝說經七遍混元顯化靈範流昌說經八遍冲用陶虚神真昭感說經九遍湧金爲壇神僊俯矚說經十遍枯骸重肉幽黨開明是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方无極无量品開運大神無鞅之衆浮空而至說經二遍南方无極无量品玉曆大神无鞅之衆浮空而至說經三遍西方无極无量品植劫大神无鞅之衆浮空而至說經四遍北方无極无量品度劫大神无鞅之衆浮空而至說經五遍東北无極无量品權量大神无鞅之衆浮空而至說經六遍東南无極无量品制水大神无鞅之衆浮空而至說經七遍西南无極无量品滅火大神无鞅之衆浮空而至說經八遍西北无極无量品蠲災大神无鞅之衆浮空而至說經九遍上方无極无量品化癘大神无鞅之衆浮空而至說經十遍下方无極无量品承濟大神无鞅之衆浮空而至十遍周竟十方无極天真大神一時同至一國男女傾心歸仰各施珍異神香妙衣无量法具旌幢繖蓋珮玉纓珠狀如屯雲宻雨无鞅之衆頂禮天尊願聞大法於是元始撫雕雲瓊几揮紫金丹光塵尾流眄垂光告命大衆十方天人曰吾自造立混沌化生二儀役御隂陽始封皇上元君青靈上真青天帝君青華帝君蒼華大帝青靈天君榑桑大帝九老仙都君上相青童君束華三官校量水火定平劫數極於九五八六之會地之維徑三億三萬三千三百億萬里南北則減千里東西増千里自地上至天半剛風八極則地之深亦如之通而廣之渾以相覆其數鉤股懸天之晷著地之儀移千里一寸而得之天之廣大約三百六十六萬里以萬天求之不可以爲度九氣青天天有九元九元運關周迴三十二覆晝夜三十日天氣一交一十二交爲一度三百三十度諸天氣王於木數至寅卯三千三百度青氣勃黃氣否陽數之九九者天之極謂小陽九六天氣上百官受會謂小百六此天氣勃於火宫巳午之嵗疫氣流行九千九百度青氣激黃氣蝕陽數九九謂大陽九六天氣反百神收氣謂大百六此天氣激於金宫申酉之歲兵疫並行三氣丹天運關三百六十度諸天氣王於火數至巳午三千三百度赤氣勃白氣否此小陽九小百六天氣勃於土宮辰戌丑未之歳土中生火九千九百度赤氣激白氣蝕此謂大陽九大百六天氣激於水宫亥子之歳當有洪災中央一氣黃天運關三百三十度諸天氣王於土數至辰戌丑未三千三百度黃氣勃黑氣否此謂小陽九小百六天氣勃於金宫申酉之歳瘴疫大起九千九百度黄氣激黑氣蝕此謂大陽九大百六天氣激於木宮寅卯之歳江河水溢災癘並興七氣素天運關三百六十度諸天氣王於金數至申酉國安民豐三千三百度白氣勃青氣否此則小陽九小百六天氣勃於水宫亥子之歳人民漂流咸至夭傷九千九百度白氣激青氣蝕此謂大陽九大百六天氣激於火宮巳午之歲赤怪焚𤑔災疾尤甚五氣玄天運關三百六十度諸天氣王於水數至亥子三千三百度黑氣勃赤氣否此則小陽九小百六天氣勃於木宫寅卯之歳水湧沛決人民夭傷九千九百度黑氣激赤氣蝕此謂大陽九大百六天氣激於土宫辰戌丑未之歳應以大旱五方運關三十二覆九千九百度周五方之氣皆上運元始青陽之氣迴轉靈寳玄都玉京山中周迴諸天日月星宿十空之外九億九萬九千九百九十九度天氣勃一劫之交天地再生此水火變化之道惟能蠲化則災癘自平是故道有九一天有九一地有九一人有九一四九合成三十六氣總會三十六天一一變生九一九九八十一元氣空有八十一道氣天有八十一聖天地有八十一真氣人有八十一僊氣總會三百六十氣道有三百六十虚无自然空玄之道天有三百六十聖化之道地有三百六十洞真之道人有三百六十骨節騰化飛僊之道此三百六十氣之所分化上有三十六空中有三十六天下有三十六地玄化在人則有三十六户道有三萬六千神變玄象天有三萬六千雲構宫殿地有三萬六千洞府人有三萬六千神識道爲玄空之至精人爲天地之至靈亦水火之變化也天地有劫數窮極水火之災癘惟上聖髙尊諸天帝王以平和之則劫數無終水火無激蝕之變世之水火災癘惟有道之聖君有徳之賢臣以平和之人身有水火災癘之變惟泰定無爲降火升水以平和之非至真上學所不能知凡此蠲化水火災癘大法之道元始說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無道響是時天人遏值經法普得濟度全其本年無有中傷傾土歸仰咸識道體實由水火二氣均調天地清寧人物安阜不爭不勝不勃不蝕不鬰不怫不抑不閉不塞不伏言無窮妄口無邪聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道
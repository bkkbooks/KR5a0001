  - {type: variant, offset: 6438, length: 0, content: '', CK-KZ: 八道言昔於紫空燿景天中𤣥風洞歌大靈妙土受元始度人迴生起死無量上品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖高尊妙行眞人無鞅數眾乘空而來靈煇燿虛瓊車玉輿扶華宸蓋雲旌四張瑞靄交鬱彌羅八𨇠五日五夜諸天諸地陰陽機運一時停回𤣥綱振肅海嶽澄明品物咸和普安其生一國地土山川林木凝鮮一等無復殘毁土皆作異寶燦麗熠熠眾眞侍座元始天尊𤣥坐空浮萬氣雲華寶座之上說經一遍諸天大聖同時稱善是時一國男女禍害不作無有夭傷說經二遍災病蠲消說經三遍翁艾返嬰說經四遍垂死得生壽獲永延說經五遍死入輪轉卽獲昇遷說經六遍沈屍九鍊陰質迴生說經}

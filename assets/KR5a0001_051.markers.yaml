  - {type: variant, offset: 5650, length: 0, content: '', YP-C: 二玄明洞淵品道言昔於紫元天中綠景空歌太晨光土受元始度人玄明洞淵無量上品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖高尊妙行眞人玄明洞淵五靈玄老水帝八方九海洞淵龍王水官四十二曹江河泉源官屬將吏無鞅數衆昇空而來流雲靄霧黳玉之輿玄明之輦紫蓋神輪洞霄垂蔭流虹寶光萬色鬱勃洞煥太空五日五夜諸天日月星宿象沈海影綱蟠玉樞珠暈璣徽停輪駐燿神宮鎭靜靈嶽收雲天浮八騫氣淸九野}

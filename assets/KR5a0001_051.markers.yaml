  - {type: variant, offset: 5651, length: 0, content: '', YP-C: 國地土山川林木緬平一等無復高下土明玉晶無有異色眾眞侍座元始天尊玄坐空浮三光七變靈鼇寶座之上說經一遍諸天大眾同時稱善是時一國男女歸依元始玄明洞淵之法悟此生元先從珠露說經二遍信知眞水變化無窮說經三遍知見柔明利物幾道說經四遍思念生宮初降洞淵之氣腎華甲坼神龜漾遊說經五遍心穴宏敷靈潮機動玄明散液萬竅滋流諦觀靜念體妙無爲說經六遍天霐澄湛明可分神一一玄中具我身相說經七遍洞淵靜碧龍神奉教說經八遍海雲擎露甘液潤生說經九遍水光發爓宮殿千層中有天民咸悟道法說經十遍玄明之氣化成紫雲普覆諸天現無爲海幽沈苦爽解脫逍遙是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品玄明洞淵至眞大神無鞅之眾浮空而至說經二遍南方無極無量品玄明洞淵至眞大神無鞅之眾浮空而至說經三遍西方無極無量品玄明洞淵至眞大神無鞅之眾浮空而至說經四遍北方無極無量品玄明洞淵至眞大神無鞅之眾浮空而至說經五遍東北無極無量品玄明洞淵至眞大神無鞅之眾浮空而至說經六遍東南無極無量品玄明洞淵至眞大神無鞅之眾浮空而至說經七遍西南無極無量品玄明洞淵至眞大神無鞅之眾浮空而至說經八遍西北無極無量品玄明洞淵至眞大神無鞅之眾浮空而至說經九遍上方無極無量品玄明洞淵至眞大神無鞅之眾浮空而至說經十遍下方無極無量品玄明洞淵至眞大神無鞅之眾浮空而至十遍周竟十方無極玄明洞淵天眞大神一時同至一國男女傾心歸仰咸相議言元始天尊來降此天百寶紫元天宮爲諸仙眾顯揚玄妙五行眞水之法其氣名曰玄明洞淵我聞玄明爲眞水之德形色俱美洞淵爲眞水之量幽深無涯若以我等所見五行之水滔天洋洋洪浩不測不知無形五行謂之眞水名曰玄明洞淵作何體狀天地未分先有眞土土能固攝十方上下其中眞水無量無邊風氣鼔之凝爲萬物是生命本爲大道元始天尊今日宣演五行無形眞氣之妙我若得聞自得超昇神霄上境皆當朝禮天尊覬獲大慈遺我勝法作如是說敬禮再拜來者有如細雨密霧無鞅之眾迮國一半土皆偏陷非可禁止於是元始懸一寶珠大如黍米在空玄之中去地五丈元始登引天眞大神上聖高尊妙行眞人玄明洞淵五靈玄老水帝八方九海洞淵龍王水官四十二曹靈司掾吏無鞅數眾俱入寶珠之中天人仰看惟見勃勃從珠口中入旣入珠口不知所在國人廓散地還平正無復欹陷元始卽於寶珠之內說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐欻之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸行淸淨妙靈智心心行如水利澤無盡明一明順明通明照明智明慧明辯明道明玄明空心無留滯默契玄妙同造杳冥深悟至要國安民康逍遙太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是眞王內諱百靈之隱名也妙化無形眞水玄明洞淵之法夫玄明爲水之情性洞淵爲水之室宅流則爲智靜則爲慧流故能通靜故能照爾能體之自然得道天地以靜眞水生民物以靜眞水行燥熱爲火靜寒爲水燥可勝寒靜可勝熱眞水生故也爾若安靜眞水自行變化日生靜爲命元靜則長生非世之常辭上聖已成眞人通玄究微能悉其章誦之十過諸天遙唱萬帝設禮河海靜默通導淵源日月合度璇璣不行羣魔束形鬼精滅爽回屍起死白骨成人至學之士誦之十過則五帝侍衞三界稽首魔精喪眼鬼祅滅爽濟度垂死絕而得生所以爾者學士穢氣未消體未洞眞召制十方威未制天政德可伏御地祇束縛魔靈但卻死而已不能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人無量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到水帝列言泉曲悉宥開朗冥關億曾萬祖幽魂苦爽皆卽受度上昇朱宮格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經眞水上應五臟育嬰昇入泥丸玄霜紫冰皆卽受度飛昇南宮世人受誦則洞靈激奔神泉八周益軀生神延壽長年後皆得作尸解之道魂神暫滅不經地獄卽得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役右官侍經五帝玉童玉女各六十四人營衞神文保護受經者身道言正月長齋誦詠是經九變三眞澤及重泉爲上世亡魂斷地逮役度上南宮七月長齋誦詠是經眞水出胎道受永年身得神仙諸天書名黄籙白簡削死上生十月長齋誦詠是經復本還源功歸上玄總攝正氣統御高仙爲國王帝主君臣父子安鎭國祚保天長存世世不絕常爲人君安鎭其方民樂太平八節之日誦詠是經神泉流轉玉關冲盈得爲九宮眞人本命之日誦詠是經眞水淸明內照形神出紫入黄五臟生英魂神澄正萬氣長存不經苦惱身有光明三界侍軒五帝司迎萬神朝禮名書上天功滿德就飛昇上淸道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐靑黄白三色雲氣之中內外蓊冥有靑龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室內玄明洞淵之氣狀如紫煙羅絡交灌洞見百神項生圓象光映十方如此分明密咒曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啟所言今日吉慶長齋淸堂修行至經無量度人願所啟上徹徑御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經}

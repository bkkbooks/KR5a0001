  - {type: variant, offset: 0, length: 2350, content: 靈寳無量度人上品妙經卷之三十二黃二五行順治品道言昔於玉虚大明天中九華寳光神瑞慶土受元始度人五行順治妙品元始天尊當說是經周廽十過以召十方始當詣座天真大神上聖髙尊妙行真人上清五星真君無鞅數衆乗空而來五色重光景雲四繞紅瓊之軿紫琳之輅金輪轉轂日駕浮空羽箑連霞金真警衛流虹交暎玉馬騰煙照徹碧虚三日三夜七宸啓靈五斗順位璣𢖍停運山嶽玄鎮天道開明華林薈彩長樓列觀接引凌風金闕瑶亰無復髙下地敷寳砌色吐瓊綿衆真侍座元始天尊玄坐五雲浮黎冰玉金暎萬寳之座與中天紫垣蒼華生徳萬壽道君丹華陽徳萬福道君皓華正徳萬善道君玄華一德萬生道君大華聖德萬順道君五方真元道君元始開圖之後五氣乃分道祖攸同氣母禀異將宣五行順治生化三界慈育萬彚之道說經一遍諸天大聖同時稱善是時一國男女宣行順教無有尅傷說經二遍四氣和平時不失度說經三遍沖用太和景物長春說經四遍騰氣均行人無衰薾說經五遍隂陽調運疾病不生說經六遍羣生遂性萬字咸寧說經七遍五星合明珠躔周軌說經八遍甘露浮空靈芝鬱秀說經九遍天光下濟泉曲開明說經十遍國被道化率土歸賔是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品蒼華九氣至真大聖無鞅之衆浮空而至說經二遍南方無極無量品丹華三氣至真大聖無鞅之衆浮空而至說經三遍西方無極無量品皓華七氣至真大聖無鞅之衆浮空而至說經四遍北方無極無量品玄華五氣至真大聖無鞅之衆浮空而至說經五遍東北無極無量品素華梵炁至真大聖無鞅之衆浮空而至說經六遍東南無極無量品碧華梵炁至真大聖無鞅之衆浮空而至說經七遍西南無極無量品大華梵炁至真大聖無鞅之衆浮空而至說經八遍西北無極無量品寳華梵炁至真大聖無鞅之衆浮空而至說經九遍上方無極無量品紫華一炁至真大聖無鞅之衆浮空而至說經十遍下方無極無量品黄華一十二氣至真大聖無鞅之衆浮空而至十遍周竟十方無極至真大聖一時同至一國男女傾心歸仰來者侍側圍繞咸欲欣聞元始天尊召集五元道君敷演五行順治長生之法物無夭傷永絶刑禍普天稱慶劫劫隆平於是元始變身示現天座髙遠大如蕭臺翠光層劫以億爲仞元始聖體巍巍瑩如寳山十方華林同蔭若蓋金色洞燿徧照無極元始登引天真大神上聖髙尊妙行真人五元道君十方無極至真大聖無鞅數衆俱升玄座天人仰看一一天真住一天界瓊欄藻井金闕琅軒無不備足說法之聲億衆如一心心相通法音無問同時說法無有違逆比之流泉傾瀉妙意一切衆生各各了知金木水火土五行之氣自相順治本無刑尅雖有勝復鬱拂之變斟酌天倪以生和氣五行混同升降合徳五氣調平三界泰定及於人物一切生身三元搆精五行結秀順治不逆沖徳滋神虚含道真凝如珠玉大若彈丸光華鮮灼太空有象是時天人一切衆生以順治故斷絶死道諸惡不生大業宿𡨚一時頓息地獄衆苦猛火洋銅變成青蓮九幽北都爲安樂國以五行順治則萬物化生三界靈仙一切種民悉無罪越諸天遥唱萬神設禮一國之境如懸冰玉及似寳珠表裹明徹略無浮翳以及纎塵元始即於玄座所現之境說經都竟衆真監度以授於我當此之時喜慶難言諸天復位倏欻之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸行順心順道順徳順善順法順真順明順生順神順化言無悖異口無惡聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝内名玄道順福五行不尅全物之隱音亦是五元道君内諱混交五氣之隱名也非世之常辭上聖已成真人通玄究微能悉其章誦之十過諸天順度萬物生榮天潢隨流氣無鬱藹山安海鎮六天運明三辰駐照九道齊并羣魔鬼精歸道成人白骨屍骼順治更生至學之士誦之十過則五行聚精三田結嬰人無中傷壽與天登所以爾者學士誦詠是經召命五星順應和樂六腑安寧穢氣消亡心感洞真以制十方法施天靈天人皈依灾害不生可伏御地祇束縳魔靈却死留形輕誦此章身則被殃供養尊禮門戸興隆世也昌熾與善因縁萬灾不干神明護門斯經尊妙獨歩玉京度人無量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到五星真君五方大神悉降其所三辰在人身命或凌犯勃蝕伏逆爲灾使世生民運爲不遂理務乖違宜齋戒誦經五星合度五行順治灾害消弭億曽萬祖幽魂苦爽皆即受度上升朱宮格皆九年受化更生得爲貴人而好學至經功滿徳就皆得神仙飛升金闕遊宴玉京也上學之士修誦是經五星旋行囬而不轉三宮填滿自然得真皆即受度飛升南宮世人受誦則天輪順次一十二宮不相違錯運過限臨氣超候接周徧宛協身無殃咎真氣内結邪癘不干延壽長年後皆得作尸解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寳不傳下世至士齎金寳效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齋誦詠是經五行順治春氣遂生萬物秀成胎卵化濕就形無隕自然通神上世亡魂斷地逮役座上南宮七月長齋誦詠是經五行順治秋氣遂成萬類堅革就養燕寧金真入骨身得神仙諸天書名黄籙白簡削死上生十月長齋誦詠是經五行順治冬氣剛凝萬物歸根陽氣潜形太一復位帝主道興五星聚中聖徳日新四海澄波六氣和平臣民康樂億載太平壽等天地日月無傾兵消疫散時清徳盈爲國王帝主君臣父子安鎮國祚保天長存世世不絶常爲人君安鎮其方民稱太平八節之日誦詠是經五行順治十方齊營真氣周流時化自然所作皆成内功克備得爲九宫真人本命之日誦詠是經五行順治灾害不經三刑六害劫耗傷驚星光暎身仙道自生魂神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿徳就飛升上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二夭心拜三十二過閉目靜思身坐青黄白三色雲氣之中内外蓊㝠五星在頭光氣纏繞青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室内項生圓象光映十方如此分明宻祝曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齋清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始無量度人上品妙經, CK-KZ: ''}

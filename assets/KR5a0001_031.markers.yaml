  - {type: variant, offset: 6521, length: 0, content: '', YP-C: 二五行順治品道言昔於玉虛大明天中九華寶光神瑞慶土受元始度人五行順治妙品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖高尊妙行眞人上清五星眞君無鞅數眾乘空而來五色重光景雲四繞紅瓊之軿紫琳之輅金輪轉轂日駕浮空羽箑連霞金眞警衛流虹交映玉馬騰煙照徹碧虛三日三夜七宸啓靈五斗順位璣衡停運山嶽玄鎭天道開明華林薈彩長樓列觀接引凌風金闕瑤京無復高下地敷寶砌色吐瓊綿眾眞侍座元始天尊玄坐五雲浮黎冰玉金暎萬寶之座與中天紫垣蒼華生德萬壽道君丹華陽德萬福道君皓華正德萬善道君玄華}

  - {type: variant, offset: 5025, length: 0, content: '', CK-KZ: 遍化周八極普度十方說經七遍冥曹罷對進補眞仙說經八遍元老五帝敷落妙音一切天人皆識雲芽說經九遍諸天諸地化現嘉祥說經十遍朽骨更生返形復命是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方无極无量品廣生大神無鞅之眾浮空而至說經二遍南方无極无量品明耀大神無鞅之眾浮空而至說經三遍西方无極无量品皓晶大神無鞅之眾浮空而至說經四遍北方无極无量品𤣥變大神無鞅之眾浮空而至說經五遍東北无極无量品靈暉大神無鞅之眾浮空而至說經六遍東南无極无量品混合大神無鞅之眾浮空而至說經七遍西南无極无量品鎭安大神無鞅之眾浮空而至說經八遍西北无極无量品回風大神無鞅之眾浮空而至說經九遍上方无極无量品純德大神無鞅之眾浮空而至說經十遍下方无極无量品輔化大神無鞅之眾浮空而至十遍周竟十方无極天眞青陽景燿大神一時同至一國男女傾心歸仰各以諸天寶花龍香百果恭敬供養來者有如雲影飛霧無鞅之眾迮國一半土皆偏陷非可禁止於是元始懸一寶珠大若明星在太空之中去地九丈元始登引天眞大神上聖高尊妙行眞人十方无極青陽大神無鞅數眾俱入寶珠之中天人仰看惟見勃勃從珠口中入旣入珠口不知所在國人廓散地還平正無復欹陷元始卽於寶珠之內說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸奉高眞合景合妙合炁合神合元合本合惠合靈合化合變合性合明心符上聖演範流行青陽降體雲芽發生二暉灌鍊眞道克成經始流布一國仰教咸罄至誠衞生保質皆得度世道言元始天尊說經中所言竝是諸天上帝內名隱韻之音亦是眞王內諱百靈之隱名也宣演扶桑帝景之山下接太溟青陽之炁纒結九霄圓景眞光三十萬里引其景者爲仙卿飲其華者爲至眞九道絳煙囘度三靈瓊瑶變質敷羅玉英非世之常辭上聖已成眞人通𤣥究微能悉其章誦之十過扶桑鍊神陽華自成寶明煥燭大福來臻上聖之道奔挹五辰妙炁合无飛昇玉京百邪伏滅大魔束形囘屍起死白骨成人至學之士誦之十過則青腰奉書太丹吐煇含景浮光天靈啟扉東極降璽萬炁齊歸濟度羣品遊行太微所以爾者扶桑爲崑崙玉誕之精青陽爲長生九榮之氣返年卻禍賜爾元老大帝之道也龍烟之神屈伸震垣肝葉敷玉關戸紫煙知此道者飛昇列仙色更嬰童變化神泉永保生妙合炁長延通眞達靈受慶綿綿輕誦此章身則受殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到青元上皇九華之精明燿扶桑大帝綠瑤之闕天葆少陽碧琳之宮敕命鳳光玉女持太𤣥開明青眞之符詔九幽寒庭泉府重陰之獄召青陽之神卻死蒙生太陽羣靈隨光上昇九祖幽魂受度飛昇格皆九年受化更生得爲貴人而好學是經功滿德就皆得神仙飛昇玉府下宴方諸也上學之士修誦是經青陽入身玉精內化流注無英威明執鉞斬伐屍根皆卽受度飛昇玉明世人受誦則洞戸琳琅朱火明璫陽眞來應丹化紫房生道續命萬藹流芳保鍊玉飴六府絳章五斗被膺坐鎭魁罡此經微妙普度無方一切天人莫不受慶无量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役冥官侍經始陽玉童朱光玉女各一十二人營衞瓊文保護受經者身道言正月長齋誦詠是經扶桑垂條青陽布英生炁變幽冥考悉停使上世亡魂斷地逮役度上南宮七月長齋誦詠是經方諸降眞青華召靈身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經東霞保生暘谷開成八關啟蘊九炁敷成爲國王帝主君臣父子安鎭國祚保天長存世世不絶常爲人君安鎭其方民樂太平八節之日誦詠是經天山通景玉極延齡得爲下元眞人本命之日誦詠是經太一下臨青帝監盟外運𤣥炁內育三嬰魂神澄正萬炁長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐九陽蒼雲之中內外蓊冥有青龍白虎朱雀𤣥武獅子白鶴羅列左右日月照明洞煥室內項生圓象光映十方如此分明密呪曰无上𤣥元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啟所言今日吉慶長齋清堂修行至經无量度人願所啟上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經}

  - {type: variant, offset: 0, length: 1753, content: 靈寳无量度人上品妙經卷之十六地六隂陽離合五行化體品道言昔於玄變天中元明靈歌大眞化土受元始度人隂陽離合五行化體无量上品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖髙尊妙行眞人無鞅數衆乗空而來凝輝明虚絳輦丹輿扶華翠葆暎燿非煙瑞炁八靄靈光四纒九日九夜諸天隂陽經緯二景三元停運息機太空騫朗洞極難名風雲靜肅物象敷榮一國地土山川林木緬平一等無復髙下土皆紋玉交纒萬彩衆眞侍座元始天尊玄坐浮空太極十華九光之座說經一徧諸天大聖同時稱善是時一國男女疾累悉得消除說經二偏物遂其生說經三徧道炁歸形說經四徧人民富壽俱獲延長說經五徧二儀升降和合自然說經六徧四時順德造育化愆說經七徧百靈恊化萬寳咸熈說經八徧率土之内安裕豐康欣樂太平保世榮昌說經九徧風俗淳厚尊崇道眞說經十徧存亡受惠普頼玄恩是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一徧東方无極无量品玉寳大神無鞅之衆浮空而至說經二徧南方无極无量品玄眞大神無鞅之衆浮空而至說經三徧西方无極无量品太妙大神無鞅之衆浮空而至說經四徧北方无極无量品紫陽大神無鞅之衆浮空而至說經五徧東北无極无量品度化大神無鞅之衆浮空而至說經六徧東南无極无量品好生大神無鞅之衆浮空而至說經七徧西南无極无量品明華大神無鞅之衆浮空而至說經八徧西北无極无量品玄㝠大神無鞅之衆浮空而至說經九徧上方无極无量品玉虚大神無鞅之衆浮空而至說經十徧下方无極无量品眞皇大神無鞅之衆浮空而至十徧周竟十方无極天眞大神一時同至一國男女傾心歸仰來者有如雲飛霧集無鞅之衆迮國一半土皆偏陷非可禁止於是元始攝聚二景日月玄根盤結縈纒成一寳輪大如車轂在空玄之中去地九丈元始登引天眞大神上聖髙尊妙行眞人十方无極隂陽五行至眞大神無鞅數衆俱入寳輪之中天人仰㸔惟見勃勃暎其光明而入於中既入寳輪不知所在國人廓散地還平正無復欹陷元始即於寳輪之内說經都竟衆眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷天地率土道合至眞無虧無敗無動無擾無愆無塞無乖無異無衰無滅物無夭喪命有長生慈恵相保仁善恊心國安民豐欣樂太平經始出教一國以道預有志心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝内名隱韻之音亦是眞王内諱百靈之隱名也出有入無離合隂陽五行變化其體歸常能明能光能存能亡知而行之驅隂運陽非世之常辭上聖已成眞人通玄究微能悉其章誦之十過諸天諸地隂陽五行運化之神設禮𦤺恭齊來敬仰妙用帝和正氣不忘生津自開品彚咸若無有隳殘至學之士誦之十過則隂陽順德五行齊功上循天紀歷度不窮保濟否厄絶而得延所以爾者學士道炁未純體未合神撫調𦤺理位未達玄任力可以消却時災禳制運會但祛害而已蠲其殃禍輕誦此章考罰被身供養尊禮門戸興隆世世昌熾與善因縁萬災不干神明護門斯經尊妙獨歩玉京度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到隂陽五行錯謬之氣勃沴之理皆即恊和𢍆會至眞道備三年輔化通幽咸𦤺神靈而運用玄關造育生成如司其權録名金闕簡在玉清也上學之士修誦是經隂陽五行外内合玄外營恢範内守天元内外之機符其自然世人受誦則日月星辰降注其晶於其身中後皆得作尸解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶元量之福生死䝉惠上天之寳不傳下世至士齎金寳效心盟天而傳輕泄漏慢殃及七祖長役鬼官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經隂陽離合萬物受生剛柔和恊錯綜五炁化體無傷形神永存七月長齋誦詠是經隂陽離合萬物受成載營抱魄充備五德化體彰明形神永全十月長齋誦詠是經隂陽離合萬物歸眞混合玄根育養五精化體常堅形神永昌緫其上道保鎭帝王國祚綿綿至治無疆八節之日誦詠是經開導和氣集助化功修積無已登獲仙宗本命之日誦詠是經隂陽五行神妙之元保我生命扶我驅靈長離苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上清道言行道之日皆當香湯沐浴齋戒入宣東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黄白三色雲炁之中内外蓊㝠有青龍白虎朱雀玄武師子白鶴羅列左右日月照明洞煥室内項生圓象光暎十方如此分明宻呪曰无上玄元太上道君召岀臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋清堂修行至經无量度人願所啓徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始无量度人上品妙經, CK-KZ: ''}

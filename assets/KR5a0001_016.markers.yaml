  - {type: variant, offset: 5024, length: 0, content: '', CK-KZ: 七道言昔於蒼靈天中青芽雲歌大好生土受元始度人扶桑青陽无量上品元始天尊當說是經周囘十過以召十方始當詣座天眞大神上聖高尊妙行眞人扶桑大帝青華帝君靑陽寶燿木皇九炁上眞道君天官從騎眞仙眞人無鞅數眾乘空而來寶雲青霄合沓紫烟琅碧瓊輿八眞飛輦葆葢流蔭靈霞散空七色蔚靄洞煥高空九日九夜諸天日月星宿停虛倚輪五緯舒光天經順行元綱鎭靜三道清平流暉關紐七辰煥明一國地土山川林木緬平一等無復高下土潤琳琅無有異色眾眞侍坐元始天尊𤣥坐空浮青麟玉臺海光寶雲之座說經一遍諸天大聖同時稱善是時一國男女眾惡消除默契眞道說經二遍流晶降體完堅萬神說經三遍五臟生華永無百疾說經四遍金光易骨瓊華鍊形說經五遍通體虛明飛行遊宴說經}

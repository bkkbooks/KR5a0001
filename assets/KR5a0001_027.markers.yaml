  - {type: variant, offset: 0, length: 1862, content: 靈寶无量度人上品妙經卷之二十七玄七紫光丹靈品道言昔於大丹天中絳華虚歌太玄景土受元始度人紫光丹靈无量上品元始天尊當說是經周回十過以名十方始當詣座天眞大神上聖髙眞妙行眞人紫光丹靈元化大神無鞅數衆乘空而來飛霞浮霄琅輿寶輪玉蓋埀䕃絳雲藹虚五色蓊蔚洞煥太无七日七夜諸天靈關日宫月府騰燿凝煇瑶闕層城通明瑩徹星綱回運五斗舒光九道散飊碧壘交纒寶圓泛景天貫飛煙一國地土川谷林藪緬平一等無復髙下土皆變紫瑶無有異色衆眞侍座元始天尊玄坐空浮九色寶華丹燿飛瓊之座說經一遍諸天大聖同時稱善是時一國男女道性開通了悟玄妙說經二遍神府流珍玄泉泛液說經三遍妙範宣微密周衆體說經四遍雙景朝元玉關合㑹說經五遍洞神應變生化自然說經六遍沖和降繞形極仙眞說經七遍靈功逺逮開濟祖先說經八遍天尊身光上騰大羅下降九淵長夜停悲寒宮罷對說經九遍鬼官考吏升補仙階說經十遍三界之下一切衆生皆見紫光丹靈之道是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方无極无量品青元大神無鞅之衆浮空而至說經二遍南方无極无量品太丹大神無鞅之衆浮空而至說經三遍西方无極无量品皓素大神無鞅之衆浮空而至說經四遍北方无極无量品玄光大神無鞅之衆浮空而至說經五遍東北无極无量品鎭靈大神無鞅之衆浮空而至說經六遍東南无極无量品流飊大神無鞅之衆浮空而至說經七遍西南无極无量品神金大神無鞅之衆浮空而至說經八遍西北无極无量品天垣大神無鞅之衆浮空而至說經九遍上方无極无量品圓羅大神無鞅之衆浮空而至說經十遍下方无極无量品沖妙大神無鞅之衆浮空而至十遍周竟十方无極紫光丹靈大神一時同至一國男女傾心歸仰各相謂言我初聞經即悟神丹眞氣灌鍊合體通明微妙道範永證仙眞來者有如繁星積霧飛雲細麈無鞅之衆迮國一半土皆偏陷非可禁止於是元始懸一寶珠大如𥞫米在空玄之中去地五丈元始登引天眞大神上聖髙尊妙行眞人十方无極紫光丹靈大神無鞅數衆俱入寶珠之中天人仰看惟見勃勃從珠口中入旣入珠口不知所在國人廓散地還平正無復欹陷元始即於寶珠之内說經都竟衆眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸得至眞養氣養神養元養精養志養妙養慧養形養生養性光華被體靈丹告成齊同慈愛異骨成親國安民豐欣樂太平經始出敎一國以道預有志心奉禮恭敬皆得度世道言元始天尊說經中所言並是諸天上帝内名隱韻之音亦是上眞内諱列聖之隱名也誦詠之者紫光内映丹靈輔魂玉丹餔飼太一降眞非世之常辭上聖已成眞人通玄究微能悉其章誦之十過諸天遥唱萬帝設禮合景升玄丹靈捧雲内化日月俠侍星辰群魔束形鬼精滅爽回屍起死白骨成人至學之士誦之十過則五帝侍衛三界稽首魔精喪眼鬼祅滅爽濟度埀死絶而得生所以爾者學士穢氣未消體未洞眞以制十方威未制天政德可伏御地祇束縳魔精但感丹光度形而已不能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因縁萬災不干神明護門斯經尊妙獨歩玉亰度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到心丹自靈紫光保身億曽萬祖幽魂苦爽皆即受度上升朱宫格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙太一玉丹賜兆長生飛升金闕遊宴玉京也上學之士修誦是經知覺性明元命歸神玉丹濳符紫光騰凌皆即受度飛升南宫世人受誦則丹津自生流注胎神延壽長年後皆得作屍解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役冥官侍經五帝玉童玉女各三十二人營衞神文保護受經者身道言正月長齋誦詠是經紫光丹靈陽德度冥玉丹九回七世成眞爲上世亡魂斷地逮役度上南宫七月長齋誦詠是經紫光丹靈眞道歸體能屈能伸身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經紫光丹靈太一授書玉丹護眞爲國王帝主君臣父子安鎭國祚保天長存世世不絶常爲人君安鎭其方民見太平八節之日誦詠是經紫光丹靈鑪開八門鼎有九宫太一爲尊得爲九宫眞人本命之日誦詠是經紫光丹靈悟兆元命得爲眞人魂神澄正萬氣長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐紫赤黃三色雲氣之中内外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右頂上紫光内有太一玉丹赤光如日大如彈丸捧在神雲之内日月照明洞煥室内頂生圓象光映十方如此分明密呪曰无上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋清堂修行至經无量度人願所啓上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始无量度人上品妙經, CK-KZ: ''}

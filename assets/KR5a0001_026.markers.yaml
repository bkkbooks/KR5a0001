  - {type: variant, offset: 5972, length: 0, content: '', YP-C: 徧沖和降繞形極仙眞說經七徧靈功遠逮開濟祖先說經八徧天尊身光上騰大羅下降九淵長夜停悲寒宮罷對說經九徧鬼官考吏升補仙階說經十遍三界之下一切眾生皆見紫光丹靈之道是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一徧東方无極无量品青元大神無鞅之眾浮空而至說經二徧南方无極无量品太丹大神無鞅之眾浮空而至說經三徧西方无極无量品皓素大神無鞅之眾浮空而至說經四徧北方无極无量品玄光大神無鞅之眾浮空而至說經五徧東北无極无量品鎭靈大神無鞅之眾浮空而至說經六徧東南无極无量品流飈大神無鞅之眾浮空而至說經七徧西南无極无量品神金大神無鞅之眾浮空而至說經八徧西北无極无量品天垣大神無鞅之眾浮空而至說經九徧上方无極无量品圓羅大神無鞅之眾浮空而至說經十遍下方无極无量品沖妙大神無鞅之眾浮空而至十遍周竟十方无極紫光丹靈大神一時同至一國男女傾心歸仰各相謂言我初聞經卽悟神丹眞氣灌鍊合體通明微妙道範永證仙眞來者有如繁星積霧飛雲細塵無鞅之眾迮國一半土皆偏陷非可禁止於是元始懸一寶珠大如黍米在空玄之中去地五丈元始登引天眞大神上聖高尊妙行眞人十方无極紫光丹靈大神無鞅數眾俱入寶珠之中天人仰看惟見勃勃從珠口中入旣入珠口不知所在國人廓散地還平正無復欹陷元始卽於寶珠之內說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸得至眞養氣養神養元養精養志養妙養慧養形養生養性光華被體靈丹告成齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有志心奉禮恭敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是上眞內諱列聖之隱名也誦詠之者紫光內映丹靈輔魂王丹餔飼太一降眞非世之常辭上聖已成眞人通玄究微能悉其章誦之十過諸天遙唱萬帝設禮合景升玄丹靈捧雲內化日月俠侍星辰羣魔束形鬼精滅爽回屍起死白骨成人至學之士誦之十過則五帝侍衞三界稽首魔精喪眼鬼祅滅爽濟度垂死絕而得生所以爾者學士穢氣未消體未洞眞以制十方威未制天政德可伏御地祇束縛魔精但感丹光度形而已不能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到心丹自靈紫光保身億曾萬祖幽魂苦爽皆卽受度上升朱宮格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙太一玉丹賜兆長生飛升金闕遊宴玉京也上學之士修誦是經知覺性明元命歸神玉丹潛符紫光騰淩皆卽受度飛升南宮世人受誦則丹津自生流注胎神延壽長年後皆得作屍解之道魂神暫滅不經地獄卽得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役冥官侍經五帝玉童玉女各三十二人營衞神文保護受經者身道言正月長齋誦詠是經紫光丹靈陽德度冥玉丹九回七世成眞爲上世亡魂斷地逮役度上南宮七月長齋誦詠是經紫光丹靈眞道歸體能屈能伸身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經紫光丹靈太一授書玉丹護眞爲國王帝主君臣父子安鎭國祚保天長存世世不絕常爲人君安鎭其方民見太平八節之日誦詠是經紫光丹靈鑪開八門鼎有九宮太一爲尊得爲九宮眞人本命之日誦詠是經紫光丹靈悟兆元命得爲眞人魂神澄正萬氣長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐紫赤黃三色雲氣之中內外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右頂上紫光內有太一玉丹赤光如日大如彈丸捧在神雲之內日月照明洞煥室內項生圓象光映十方如此分明密呪曰无上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啟所言今日吉慶長齋清堂修行至經无量度人願所啟上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經}

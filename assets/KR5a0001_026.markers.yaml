  - {type: variant, offset: 5971, length: 0, content: '', CK-KZ: 七道言昔於大丹天中絳華虛歌太𤣥景土受元始度人紫光丹靈无量上品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖高眞妙行眞人紫光丹靈元化大神無鞅數眾乘空而來飛霞浮霄琅輿寶輪玉蓋垂蔭絳雲藹虛五色蓊蔚洞煥太无七日七夜諸天靈關日宮月府騰燿凝煇瑤闕層城通明瑩徹星綱回運五斗舒光九道散飈碧壘交纒寶圓泛景天貫飛烟一國地土川谷林藪緬平一等無復高下土皆變紫瑤無有異色眾眞侍座元始天尊𤣥坐空浮九色寶華丹燿飛瓊之座說經一徧諸天大聖同時稱善是時一國男女道性開通了悟𤣥妙說經二徧神府流珍𤣥泉泛液說經三徧妙範宣微密周眾體說經四徧雙景朝元玉關合會說經五徧洞神應變生化自然說經}

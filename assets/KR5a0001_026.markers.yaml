  - {type: variant, offset: 0, length: 2752, content: 靈寶无量度人上品妙經卷之二十六玄六明體貫氣品道言昔於太丹天中絳雲凝霄赤光世界受元始度人明體貫氣无量上品元始天尊當說是經而乃謂言吾爲天地之祖萬氣之先三寶天君肇化之後道體分三於太空混黃清虚丹暉廣化大劫生第三元老號太上老君綂治玄氣養育人民即吾至道分神傳授大範巳經九萬九千九百九十九億妙氣氣分三劫无量度人吾昔於彼已明此道當命太上老君於太丹天中爲一切衆生剖析祕密開化天人吾已演化諸天明露道要三才五行隂陽玄極之旨明體貫氣最後分别冝命太上宣示隱微使諸衆生悟道通達作是念已太上老君居太清太極宫大光明殿敬聞敎誡徑詣座前稽首再拜長跪黙念大聖虚皇元始天尊寶號者三上奏天尊臣奉密旨令升法座爲十方天人說明體貫氣妙經謹依詔命諦奉宣揚禮足整衣將說是經周回十過以召十方始當詣座天眞大神列聖髙尊上清眞人無鞅數衆乘空而來九霞布空玄光内照華蓋飛軒碧落騰煇流雲丹景埀䕃太虚七日七夜清微禹餘大赤三境種民三界无極諸天日月宫府玉垣帝座太微寥陽鬱山玄亰丹臺紫閣瑶闕瓊樓皇極飛綱洞淵劫仞森然在目無有隔礙衆眞侍座太上老君玄坐空浮陽光玉闕寶臺之上說經一遍諸天大聖同時稱善是時一國男女咸悟生化之根說經二遍衆惡消除說經三遍萬善集身說經四遍眞氣下降灌注心田說經五遍所向皆眞玄符正範說經六遍神妙足備克獲飛仙說經七遍明體妙元貫氣達用說經八遍九玄七祖上世亡魂眷屬親姻逍遥離苦說經九遍玉章破暗靈光燭幽說經十遍一切衆生永斷惡趣冤仇解脫報對休停是時一國是男是女莫不傾心皆受護度咸得長生道言是時太上老君說經一遍東方无極无量品八景大神无鞅之衆浮空而至說經二遍南方无極无量品明光大神无鞅之衆浮空而至說經三遍西方无極无量品制魔大神无鞅之衆浮空而至說經四遍北方无極无量品蘂珠大神无鞅之衆浮空而至說經五遍東北无極无量品雲宫大神无鞅之衆浮空而至說經六遍東南无極无量品變化大神无鞅之衆浮空而至說經七遍西南无極无量品靈飛大神无鞅之衆浮空而至說經八遍西北无極无量品三素大神无鞅之衆浮空而至說經九遍上方无極无量品玉虚大神无鞅之衆浮空而至說經十遍下方无極无量品離合大神无鞅之衆浮空而至十遍周章十方无極明體貫氣大神一時同至一國男女傾心歸仰來者駢委叢踏数計億量非可爲比徧諸天境於是太上老君覩見四衆十方圍繞即向北方恭禮玉亰大聖元始天尊上清紫霞太上玉宸大道君旣畢復座東嚮環顧大衆運道神力移十方天人遐邇來者徧天觀聽之儔盡升虚空髙可百丈即取碧霓流雲黃縷萬花之帔迎取天人來置座下廣殿四開无鞅之衆厠如積粟讃歎禮拜聲震八極太上老君天顔微笑舉五明寶扇撫紅霄金光明之几重告大衆曰道出而爲神神化而爲氣氣者未有天地隂陽之先眞元萬化之祖道之妙感也其氣非色非形非有非無不隷隂陽不屬五行能生能化能成能實爲道之神用故剛於金石清於氷玉大於虚空長於上古内凝至精造立混沌下逮萬類此氣爲始其謂之氤氲恍愡者氣兆於形端質陶於太素作天地之妙本名曰一氣故有眞一玄一太一亦曰玄元始三氣自建植玉亰及於泉戸仙聖鬼神人物莫不由之均以道生無有分别髙下善惡彊弱堅脆以自然付受未常爲也洎三界成就神靈攸司君尊臣卑則役造化定隆殺興賢愚立髙下則道有至聖之神天有不私之帝三垣星斗八威神官以布其政記人功過生滅無失雖纎芥圭𥞫不得逃逾則先明體以貰其氣如道爲無體德爲有體照爲明體玄爲暗體陽爲動體隂爲靜體正爲仙體邪爲鬼體體分旣定則貫其氣以受其生無體則貫以浩氣有體則貫以元氣明體則貰以清氣暗體則貰以濁氣動體則貫以龍氣靜體則貰以常氣仙體則貰以靈氣鬼體則貫以異氣明體貰氣區畛有方萬化大定三才之政績用乃成超凌三界髙眞之業可覬善惡之録有科福禍之理大明天人鬼神十方億萬之衆化逺敎行出離輪轉仙道克登長生無爲允合太空太上老君說經都竟衆眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸行善心明信明因明縁明報明感明果明法明敎明戒明體言符至道行合天機齊同慈愛異骨成親國安民豐欣樂太平經始出敎一國以道預有志心宗奉禮敬皆得度世道言太上老君說經中所言並是諸天上帝内名隱韻之音亦是魔王内諱百靈之隠名也非世之常辭上聖已成眞人通玄明體眞氣貰身能悉其章誦之十過神光内燿魔鬼喪睛儀璘舒華璇璣煥明祟癘斬戮鬼神伏形回屍起死白骨成人至學之士誦之十過則太上遥鑒三府記名祅邪殞首滯爽登升濟度埀死絶而得生所以爾者學士未洞太玄務明體理穢氣不盡尚拘人累召制十方威未制天政德可伏御地祇束縳魔靈但却死而已不能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因縁萬災不干神明護門斯經尊妙獨歩玉亰度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸仙齊到體淨心明隂翳消瀹氣合神眞冥光晣暢億曾萬祖幽魂苦爽皆即受度上升朱宫格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛升金闕遊宴玉亰上學之士修誦是經皆即受度飛升南宫以其誠誦通感明體不昧靈氣貫形自然受鍊得詣流火之庭瑩玉光於靈顔納朱文於錦胃也世人受誦氣添生福屍故自斷血流清津腦塡素液則延壽長年後皆得作屍解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶効心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經明萬物受生之體仙靈人鬼變化之道皆從太无自然中來依道立體資氣爲用以神發知用明爲識隂陽水火鍊以成眞萬物之體仙靈人鬼其體若同變化所貫之氣各異神通妙密各各不同出没隱淪彰顯之道互出玄領爲上世亡魂斷地逮役度上南宫七月長齋誦詠是經明萬物受成之體仙靈人鬼隂息之道皆從靈氣貫質隂火烹鍊依定立堅慿靈爲變以清爲知以燥禀體月華滌沐鍊以成眞萬物之體仙靈人鬼其體若同變化所貫之氣各異神通冥運各各不同謝縁斷凡幽曠之道互出奥領身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經明萬物復命之體仙靈人鬼還元之道皆從玄一得命命以定體太黑貫氣兩半成功依液感生噏粹護養晦以生明以靜爲化玄霜碧露鍊以成眞萬物之體仙靈人鬼其體若同變化所貫之氣各異神行黙察各各不同出離遐舉之道互出祕領爲國王帝主君臣父子安鎭國祚保天長存世世不絶常爲人君安鎭其方民稱太平八節之日誦詠是經八風隱體貫氣八方八景會眞泥九洞明得爲九宫眞人本命之日誦詠是經兆自明體貫氣入身賢者爲聖凡骨爲眞魂神澄正萬氣長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黃白三色雲氣之中内外蓊冥東有木玄眞人南有炎象眞人西有金液眞人北有水象眞人上有玄妙眞人侍衞監觀獅子白鶴羅列左右日月照明洞煥室内項生圓象光映十方如此分明密呪曰无上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋清堂修行至經无量度人願所啓上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經, CK-KZ: ''}

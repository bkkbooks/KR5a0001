  - {type: variant, offset: 5220, length: 0, content: '', CK-KZ: 六道言昔於太丹天中絳雲凝霄赤光世界受元始度人明體貫氣无量上品元始天尊當說是經而乃謂言吾爲天地之祖萬氣之先三寶天君肇化之後道體分三於太空混黃清虛丹暉廣化大劫生第三元老號太上老君統治𤣥氣養育人民卽吾至道分神傳授大範已經九萬九千九百九十九億妙氣氣分三劫无量度人吾昔於彼已明此道當命太上老君於太丹天中爲一切眾生剖析祕密開化天人吾已演化諸天明露道要三才}
  - {type: variant, offset: 5220, length: 0, content: '', CK-KZ-jye: 六道言昔於太丹天中絳雲凝霄赤光世界受元始度人明體貫氣无量上品元始天尊當說是經而乃謂言吾爲天地之祖萬氣之先三寶天君肇化之後道體分三於太空混黃清虛丹暉廣化大劫生第三元老號太上老君統治𤣥氣養育人民卽吾至道分神傳授大範已經九萬九千九百九十九億妙氣氣分三劫无量度人吾昔於彼已明此道當命太上老君於太丹天中爲一切眾生剖析祕密開化天人吾已演化諸天明露道要三才}
  - {type: variant, offset: 5220, length: 0, content: '', YP-C: 六明體貫氣品道言昔於太丹天中絳雲凝霄赤光世界受元始度人明體貫氣无量上品元始天尊當說是經而乃謂言吾爲天地之祖萬氣之先三寶天君肇化之後道體分三於太空混黃清虛丹暉廣化大劫生第三元老號太上老君統治玄氣養育人民卽吾至道分神傳授大範已經九萬九千九百九十九億妙氣氣分三劫无量度人吾昔於彼已明此道當命太上老君於太丹天中爲一切眾生剖析祕密開化天人吾已演化諸天明露道要三才}

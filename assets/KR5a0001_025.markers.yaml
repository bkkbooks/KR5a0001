  - {type: variant, offset: 5206, length: 0, content: '', CK-KZ: 角集五音釋帀音浹周也音昶利也玦音決玉佩也㠗澱音電莛音廷又音挺閥音伐功也𢾭音孚𢻫也音弛坱音泱塵埃也圠音軋不測也钁音矍坌音分塵也皛音薂又音檄顯也芤音摳傍寶中空也𧊚音同虫也𧵥音垝財也俅音求}

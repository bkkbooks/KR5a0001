  - {type: variant, offset: 5575, length: 0, content: '', CK-KZ: 十道言昔於紫晨天中金碧飛空大明寶土受元始度人大赤靈文无量上品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖高尊妙行眞人太淸眞王七天列聖太極玉司左右官屬靈官童子無鞅數眾乘空而來雲駕飛軒琅輿瓊輪彤蓋垂影玉華散輝五色流眩洞耀太空五日五夜諸天道境𤣥英深輿神綱息輪玉標金魁一時停運天風靜籟虛象凝霄雲藏波湛乾坤洞清一國地土山川林木緬平一等無復高下土皆明徹熠燿積翠無有異色眾眞侍座元始天尊𤣥坐空浮五色煇明玉蓮之上說經一徧諸天大聖同時稱善是時一國男女心悟太空得道無爲說經二徧洞見法身永無漏塵說經三徧心超妙元通諸法相說經四徧神慧備足自在飛行說經五徧音辯如流敷揚至道說經六徧返照胎光定息無窮說經七徧玉闕合氣神宮流珠說經八徧騫林轉影普覆諸天說經}

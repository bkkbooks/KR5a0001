  - {type: variant, offset: 5576, length: 0, content: '', CK-KZ: 徧萬物發生中無夭折說經十徧天樂浮空雲營靄瑞是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一徧東方无極无量品至眞大神無鞅之眾浮空而至說經二徧南方无極无量品至眞大神無鞅之眾浮空而至說經三徧西方无極无量品至眞大神無鞅之眾浮空而至說經四徧北方无極无量品至眞大神無鞅之眾浮空而至說經五徧東北无極无量品至眞大神無鞅之眾浮空而至說經六徧東南无極无量品至眞大神無鞅之眾浮空而至說經七徧西南无極无量品至眞大神無鞅之眾浮空而至說經八徧西北无極无量品至眞大神無鞅之眾浮空而至說經九徧上方无極无量品至眞大神無鞅之眾浮空而至說經十徧下方无極无量品至眞大神無鞅之眾浮空而至十徧周竟十方十境无極天眞大神一時同至一國男女傾心歸仰來者有如飄雲藴雨無鞅之眾各各稽首恭禮玉陛言臣所居之天在種民之上太淸大赤𤣥空之中天中萬象應念卽有息念卽無莽蕩浩空光明遼廓道界之內九氣聖位超升已盡脫諸緣累一切空想不屬有無思悟永生大赤天中爲第三太空𤣥界景燿三華之色下安飛輪保鎭天闕恭聞天尊於此太極皇眞仙境出示靈文昭垂顯奧𤣥霄之中一切眾生下逮神洲无量世界同獲勝果爲无量福臣等各運道意佇聽至言上眞大法於是元始懸一寶珠大如黍米在空𤣥之中去地五丈元始登引天眞大神上聖高尊妙行眞人十方无極至眞大神無鞅數眾俱入寶珠之中天人仰看大赤靈文徧見珠內方廣一丈八角垂芒惟見勃勃從珠口中入旣入珠口不知所在國人廓散地還平正無復欹陷元始卽於寶珠之內說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸證𤣥空無想無念無色無聲無殺無欲無穢無垢無妄無私言無華麗口無惡聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是大赤靈文九霄玉字上眞之隱名也非世之常辭列聖已證眞仙通𤣥究微佩服赤文能悉其章誦之十過諸天遙唱萬帝設禮靈文開廓十方化𤣥一切神靈咸歸至應眞道發見羣魔束形鬼精滅爽丹字開生迴屍起死白骨成人至學之士誦之十過則氣超五辰德動三界魔精喪眼鬼祅滅爽拔度垂死沈淪得升所以爾者學士初解𤣥空道登大赤欽味靈文體未洞眞以制十方德未合上聖威可剋制百魔濟度萬微但超升而已不能洞𤣥輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人無量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過悟解之者道契大赤氣合太清緣想累入一切塵滯應時消盡惟一𤣥虛淡然微影明靜瑩徹洞觀妙體卽爲眞人諸天齊到億曾萬祖幽魂苦爽皆卽受度上升朱宮格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛升金闕遊宴玉京也上學之士修誦是經悟道證𤣥登太極宮一切世緣廓然歸虛默契此理開悟虛明永無變滅超度長生皆卽受鍊飛升南宮世人受誦未入眞靜漸棄有想太空之中自生眞氣下浹凡體則延壽長年後皆得作尸解之道魂神暫滅不經地獄卽得返形遊行太空此經微妙普度無窮一切天人莫不受慶无量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經神風協運薰養萬靈結累解落合眞體元爲上世亡魂斷地逮役度上南宮七月長齋誦詠是經金眞激雲混洞招眞通靈致仙身得飛升諸天書名黃籙白𥳑削死上生十月長齋誦詠是經紫雲鍊形飛飊左迴八景三眞謁眞命神嘯攝虎兵爲國王帝主君臣父子安鎭國祚保天長存世世不絕常爲人君安鎭其方民稱太平八節之日誦詠是經八景開通五宮洞淸身入太無體合𤣥虛得爲九宮眞人本命之日誦詠是經大赤靈文與兆相因千變萬化自然致眞魂神澄正萬氣長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛升上淸道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐蒼赤黃三色雲氣之中內外蓊冥有靑龍白虎朱雀𤣥武獅子白鶴羅列左右日月照明洞煥室內項生圓象光映十方如此分明密咒曰无上𤣥元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啟所言今日吉慶長齋淸堂修行至經无量度人願所啓上徹俓御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經}

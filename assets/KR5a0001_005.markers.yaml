  - {type: variant, offset: 5105, length: 0, content: '', CK-KZ: 角集一音釋喑音陰口不能言也㢌音阿病也迮音嘖起也倐音叔走疾也剡剡本字音䬍疾起也𡜍本作嫉音自如也𨚧音加笳音加馘音國截耳也飈音標暴風也洼音娃玃音瞿惒俗和字𤓁音言火門也摙音輦負擔也䆫同窗璈音敖樂器斡音宛轉也閴傾入聲靜也孱音茲瞢與𥌋同蚖音元蛇醫也鼇音敖大𣀴也䨧音陰雲貌馗音逵兟音莘也滷音魯鹽地侖音倫叙也璺音問玉破也狨音戎𦍙同牂𧕏音蘖妖虫也呇音起與啟同陁俗陀字沲同沱擲音躑投也攴音撲小擊也琤音爭玉聲}

  - {type: variant, offset: 2, length: 3051, content: 胎根斷除邪穢品道言昔於始青天中紫霄空歌太極玄土受元始度人生化胎根斷除邪穢无量上品元始天尊當說是經周回十過以召十方始當詣座天眞大神上聖髙尊妙行眞人無鞅數衆乘空而來絳煙捧塗華晶燿輦丹碧浮駕洞光羽輪五明錦色蓋映霞芳九氣合彩洞煥太空七日七夜諸天樓闕遥開玉毫隱顯星珠絡緯日景自停神隂舒煇金波泛滉璇璣玉衡還斡靈和注浹空海神風回混翠峯蟠偃天無浮翳四氣明清一國地土山川林木緬平一等無復髙下土皆作碧玉無有異色衆眞侍座元始天尊玄坐空浮七宸九華明离寳座之上說經一遍諸天大聖同時稱善是時一國男女妙氣凝胎生根超秀說經二遍邪穢斷除結節通解說經三遍神棲空洞梵氣冥涵說經四遍骨有玉華顏揚金色說經五遍七世散仇福堂慶㑹說經六遍紫煙灌身百神愷樂說經七遍雄雌混化三一昇遊說經八遍神光内映徹見百關說經九遍心悟洞靈證眞帝臺說經十遍䇿名玉清侍宸金闕是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方无極无量品青帝梁虚生化胎至眞大神無鞅之衆浮空而至說經二遍南方无極无量品赤帝仲明賔除穢至眞大神無鞅之衆浮空而至說經三遍西方无極无量品白帝詡成豫化胎至眞大神無鞅之衆浮空而至說經四遍北方无極无量品黑帝元道冥除穢至眞大神無鞅之衆浮空而至說經五遍東北无極无量品八景明微君化胎至眞大神無鞅之衆浮空而至說經六遍東南无極无量品八景玄靈君除穢至眞大神無鞅之衆浮空而至說經七遍西南无極无量品八景眞華君化胎至眞大神無鞅之衆浮空而至說經八遍西北无極无量品八景靈暉君除穢至眞大神無鞅之衆浮空而至說經九遍上方无極无量品八景吟穴君化胎至眞大神無鞅之衆浮空而至說經十遍下方无極无量品八景祕形君除穢至眞大神無鞅之衆浮空而至十遍周竟十方无極天眞大神一時同至一國男女傾心歸仰來者各相謂言元始天尊在始青天中演說生化胎根斷除邪穢之法我等自入流轉不出生死貪嗔愚癡墮在諸有雖福業因縁得生天上而諸天人愛迷執戀纔捨塵染尚居細塵習氣不除動罹結滯感化胎元不得淨盡生根堅固著於不滅以住爲本不知道體玄妙包養太空九聖十眞本無生滅胎根未斷致此撓競互相變化遞爲種族屍血流行骨壞形朽我雖天人未出三界形未獨化與道相隔縱使化身猶在色境故於相視接手語言音聲不契大洞使三尸蕩流穢血生瘕邪魔乘襲背遠眞道今當傾聞法音帀繞天座億劫之衆一時同㑹非可禁止於是元始埀衣正視命黃素元君執方規之鑑天地眞形支勢成字白素元君擊洞陽之鐘十方合響萬天交唱紫素元君埀浩景之珠大如𥞫米在空玄之中去地九丈元始登引天眞大神上聖髙尊妙行眞人十方无極至眞大神無鞅數衆俱入寶珠之中天人仰看惟見勃勃從珠口中入旣入珠口不知所在國人廓散天光煇映萬氣肅清元始即於寶珠之内說經都竟衆眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度解散結節齗絶邪源傾土歸仰咸行至心忘累忘有忘化忘得忘念忘情忘識忘動忘息忘形言無理宗口無欲聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝内名隠韻之音亦是魔王内諱百靈之隱名也非世之常辭皆生化道胎清鍊胞根斷除邪氣斬滅血屍修眞洞極之要言上聖已成眞人通玄究微能悉其章誦之十過諸天遥唱萬帝設禮河海靜黙山嶽藏雲日月停景璇璣不行群魔束形鬼精滅爽回屍起死白骨成人至學之士誦之十過則胎根生化無有世縁邪穢凋落百神合形五帝侍衞三界稽首魔精喪眼鬼祅滅爽濟度埀死絶而得生所以爾者學士邪穢漸消心未洞玄以制十方威未制天政德可伏御地祇束縳魔靈但得度身而已不能普濟萬生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因縁萬災不干神明護門斬經尊妙獨步玉京度人無量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到玄上丈人爲兆解禀胎已來宿血瘕穢赤黑大滯西明君爲兆解胞中積水腥汙屍鬼潢溺泉曲寒池之釁訟在水官考注不止連及生人生死之根災禍萌蘖不得興作使胎根生化玉液仙英妙姿自然得道七魄遊逸魔彭伺姦外構邪鬼淫犯胎宫夜夢燕樂與鬼同營太上玉帝以紫光九靈寶札詣南宫韓君丈人天機省中監簿按籍檢考善功生化胎根斷除邪穢億曾萬祖幽魂苦爽皆即受度上升朱宫格皆九年受化更生得爲貴人而好學至經功滿徳就皆得神仙飛昇金闕遊宴玉亰也上學之士修誦是經皆即受度飛昇南宫世人受誦胎根惡濁鍊化故氣尋得斷滅生化仙眞邪魂穢魄淘澤清淨則延夀長年後皆得作屍解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死䝉惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經上部九宫青帝羅文英執青宫之符開兆百關解散結節帝一内懽紫煙灌身神光洞照羽煇映玄爲上世亡魂斷地逮役度上南宫天機省也七月長齋誦詠是經中部九宫白帝寓文昇執素靈之符爲兆生化胎根使斷凡因流轉停關邪正速分穢垢清蕩日霞瑩形太素生五臓七雲入泥丸身得神仙諸天書
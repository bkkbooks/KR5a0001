  - {type: variant, offset: 0, length: 1755, content: 靈寳無量度人上品妙經卷之三十四黄四騰曜二景五星品道言昔於上極天中霄霞洞歌大光明土受元始度人騰曜二景五星上品元始天尊當說是經周廻十過以召十方始當詣座天真大神上聖髙尊妙行真人無鞅數衆乗空而來紫煙霏霏玉飊華車靈雲蔭蓋朗映晨煇九色蒨璨洞煥十方七日七夜諸天妙氣結化成形並爲珍寳八風惠暢四海和寧時無乖沴庶物自然一國地土山川林木緬平一等無復髙下土皆作月𤩹日珠靈華五色衆真侍座元始天尊玄坐空浮洞化龍仙曲晨萬象玄牀說經一遍諸天大聖同時稱善是時一國君臣修崇道徳感格神真說經二遍二景齊明說經三遍三才交暢說經四遍四時順序玉燭調和說經五遍五星循軌歷劫不愆說經六遍六氣周流運化協功說經七遍七元停徤光景延長說經八遍八方列宿刻注不干說經九遍九宮主宰捍厄除災說經十遍十神安位永致福祥是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品天晶騰曜至真大神無鞅之衆浮空而至說經二遍南方無極無量品天晶騰曜至真大神無鞅之衆浮空而至說經三遍西方無極無量品天晶騰曜至真大神無鞅之衆浮空而至說經四遍北方無極無量品天晶騰曜至真大神無鞅之衆浮空而至說經五遍東北無極無量品天晶騰曜至真大神無鞅之衆浮空而至說經六遍東南無極無量品天晶騰曜至真大神無鞅之衆浮空而至說經七遍西南無極無量品天晶騰曜至真大神無鞅之衆浮空而至說經八遍西北無極無量品天晶騰曜至真大神無鞅之衆浮空而至說經九遍上方無極無量品統辰御象至真大神無鞅之衆浮空而至說經十遍下方無極無量品承光合景至真大神無鞅之衆浮空而至十遍周竟十方無極天晶騰曜日月星宿天真大神一時同至一國男女傾心歸仰來者有如細雨宻霧無鞅之衆迮國一半土皆偏䧟非可禁止於是元始俯容笑喭億衆傾瞻於是旋命紫微玉妃啓御神寳鑪擁夜山火玉徊妙靈香煙結空中如寳如雲現一瓊室縹緲之間去地十丈元始登引天真大神上聖髙尊妙行真人十方無極至真大神無鞅數衆俱入瓊室之中天人仰看惟見拂拂從煙景中入既入瓊室不知所在國人廓散地還平正無復欹䧟元始即於瓊室之内說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏欻之間寂無遺響是時天人遇值經法皆獲開悟得保永年無有中傷順土受度與道齊真不災不害不夭不殘不虧不敗不愆不禍不哀不死顔如玉瑩體映金姿内外無疵徼妙合玄下保家邦安泰昌隆經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝内名隱韻之音亦是二景五星騰曜星君髙真隱韻之音亦是璘儀三素之隠名也非世之常辭上聖已成真人通玄究微能悉其章誦之十過請天遥唱萬帝設禮日月垂芒星辰映華寳炁流精妙灌三宮百神飲玉千真嚥芳羣魔束形鬼精滅爽廻屍起死白骨成人至學之士誦之十過則日君鑒徳月妃受靈超脫世難以得長生所以爾者學士方達妙詮未鍊至真勤苦修行道漸升玄自可祛蕩災疾感格妙氣但却死而已不能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因縁萬災不干神明護門斯經尊妙獨歩玉京度人無量爲萬道之宗巍巍大範徳難可勝道言凡誦是經十過諸天齊到七曜之真保度善人一身受度七祖昇遷享福天堂常處逍遥上學之士修誦是經與道契徳與天齊真世人受誦散禍延年後獲成功遇其經訣得作解化之道以度於世此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寳不傳下世至士齎金寳效心盟天而傳輕泄漏慢殃及九祖長役地官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齋誦詠是經招致日魂保生鍊屍注景成真爲上世亡魂斷地逮役度上南宮七月長齋誦詠是經招引月魂保生鍊屍降景成真身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經招引五星精魂保生鍊尸合景成真騰燿玉華普頼生成爲國王帝主君臣父子安鎮國祚保天長存世世不絶常爲人君安鎭其方民稱太平八節之日誦詠是經神氣纏綿運化形軀克就玄業得爲九宫真人本命之日誦詠是經寧固命府塞遏死津魂魄受鍊道體日新超出苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿徳就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐五色雲氣之中内外蓊㝠有青龍白虎朱雀玄武獅子白鶴羅列左右五星真氣纏綿兆身日月照明騰曜室内項生圎象光映十方如此分明宻呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齋清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始無量度人上品妙經, CK-KZ: ''}

  - {type: variant, offset: 5310, length: 0, content: '', YP-C: 五九宮仙籍品道言昔於太碧天中紫霞玄歌太空眞土受元始度人九宮仙籍無量上品元始天尊當說是經周回十過以召十方始當詣座天眞大神上聖高尊妙行眞人三元仙籍九宮大神無鞅數眾乘空而來流雲景霄琅輿鳳車羽葆神旛翠輦珠蓋金碧交光九色鬱明洞煥太空三日三夜諸天日月宮府星宿躔次化綱變紀大經彌綸停機息運寥廓沈冥地踴寶花天敷赤文韶響合奏靈韻生音煇燿上境洞開八門一國地土山川林木緬平一等無復高下土皆作紫瑤通明瑩徹照映圓羅光焰流晶無有異色眾眞侍座元始天尊玄坐空浮神化飛龍羽座之上說經一遍諸天大聖同時稱善是時一國男女心開悟解密契妙微說經二遍百神聚會降體玉英說經三遍生氣交纏合變正道說經}

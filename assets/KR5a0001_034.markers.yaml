  - {type: variant, offset: 5311, length: 0, content: '', CK-KZ-jye: 遍圓虛應化五府灌煙說經五遍內運修輪上符天範說經六遍浩劫結滯廓爾消融說經七遍神洞虛明徹見十方說經八遍九宮注籍身飛列仙說經九遍恩沾萬有福及八冥說經十遍寒夜眾生逍遙離苦是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍上元無極無量品𤣥都紫微宮正氣大神無鞅之眾浮空而至說經二遍上元無極無量品元黃太極宮合景大神無鞅之眾浮空而至說經三遍上元無極無量品洞白太淸宮燿煇大神無鞅之眾浮空而至說經四遍中元無極無量品洞虛淸靈宮運功大神無鞅之眾浮空而至說經五遍中元無極無量品南極洞陽宮仙籍大神無鞅之眾浮空而至說經六遍中元無極無量品羅淵導山宮元陰大神無鞅之眾浮空而至說經七遍下元無極無量品靑華方諸宮安保大神無鞅之眾浮空而至說經八遍下元無極無量品南水景翛宮元道大神無鞅之眾浮空而至說經九遍下元無極無量品陰天混化宮𤣥皇大神無鞅之眾浮空而至說經十遍仙府無極無量品考校功過𤣥籍靈官大神無鞅之眾浮空而至十遍周竟三元九宮二十七府百二十曹主領生化善惡飛天大神一時同至一國男女傾心歸仰元始天尊卽以五明寶扇指東南維天光煥赫照燿太空天人隨扇所指仰視神化見一寶山高聳玉虛廣大難量上有瓊臺玉觀華闕神功羅列天眞敬禮元始飛空步虛謠歌讚歎天尊乃召淸微高上治化玉虛萬寶一品天官黃闕大鎭敷化方輿元會二品地官大溟流運廣化九淵𤣥德三品水官立於座右三十二天帝君立於座左九天高聖自然眞王立於座前日月五斗經緯列宿元綱大神立於座後曜晶玉極持握彌綸二十五大魔王十方無極飛天大神按部九天儀衞三界神兵瓊花散空天樂互奏導從羽駕飛入東南天中天人仰看惟見億乘萬騎鳳輦龍車炳若繁星難可悉視須臾黃雲四合不復瞻見元始卽於東南玉闕之內說經都竟眾眞監度以授於我當此之時欣樂難言法事旣周萬眞復位俄頃之間寂爾無聞是時天民悟此大範普獲濟惠皆得長年永斷沉淪合境歸嚮咸識生根神眞開化標名九宮沖和變氣收伏祅凶物無瘥疹萬𢑥昭融邪關闔塞正道開通永輔上極威令敷𢎞世土升平國康民豐經始流布一國演教各運至心宗奉禮敬悉皆度世道言元始天尊說經中所言並是九天自然眞王內名隱韻之音亦是三元宮府內諱百靈之隱名也非世之常辭上淸開化眞人通眞悟𤣥悉契其章誦之十過天官遙唱眞公設禮太淵鎭靜神嶽收雲元皇錫教九宮書名大魔伏形羣祅滅景回靈化體朽骨成人妙學上士誦之十過則九官擁衞神帥稽顙鬼精逃遁不敢干犯濟拔品彙淪而復升也神州之民初學至道若能依科誦之十過則萬惡消摧千瑞來臨聲參太微道貫紫霄三元執筆注上九宮果備功圓升爲地眞也輕誦玉文永劫湮沉崇奉尊禮所願克成世世下教開度含生萬魔不干天眞護門斯經隱奧高祕玉淸度人無極爲靈寶之宗巍巍尊妙難可稱量道言凡誦是經十過九宮列曹眞吏持生化之簿書下臨監觀削滅羅酆黑籍注名靑編祖先幽魂皆得上升流火之庭鍊質召靈爲天種民而妙契有無修行至學大魔保奏升度朱陵飛行八極遊宴上淸降神天闕爲世賢人恢張至道輔弼明君世人受誦則百痾普消靈府虛明玉華內鍊金光外凝暫寄厚土太陰變形數極純陽隨運更生此經𤣥奧普濟無邊一切有生莫不蒙惠無量之福生化受賴上天所禁不傳下凡至士齎寶玉格心盟約而傳輕慢洞章殃及七𤣥長役冥塗侍經九宮玉童玉女各二十四人擁護靈文守衞受經者身道言正月長齋誦詠是經紫微上宮注籍金科妙行眞人乘少陽景霄之光下開幽關拔度上世亡魂升入天堂七月長齋誦詠是經洞虛元宮書功瓊簡龍燿神王奏明九天降以生氣身得神仙十月長齋誦詠是經方諸洞宮列章上聞持綱執紐𤣥天大魔淸蕩姦祅收伏百精消滅三災保世升平八節之日誦詠是經得爲地眞遊宴八冥本命之日誦詠是經五府灌鍊雙景交纏九元上會混合綿綿制魂拘魄升騰絳煙采集華芒流運靈泉功滿道備神飛列仙道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐九色雲氣之中內外蓊冥有靑龍白虎朱雀𤣥武獅子白鶴羅列左右三元九宮仙籍大神森然對目日月照明洞煥室內項生圓象光映十方如此分明宻咒曰無上𤣥元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啟所言今日吉慶長齋淸堂修行至經無量度人願所啟上徹徑御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經}

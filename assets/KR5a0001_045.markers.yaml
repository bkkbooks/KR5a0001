  - {type: variant, offset: 0, length: 216, content: 靈寳无量度人上品妙經卷之四十五字五解禳山谷瘴癘品道言昔於浩舒天中邃碧幽歌大神樂土受元始度人解禳山谷瘴癘妙品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖髙尊妙行眞人大小山谷仙官主宰十方國土列嶽群仙溪谷泉源鬼神令長直年方域行瘴爲癘神官曹屬部隷攸司无鞅數衆乗空而來從山現出紫軿碧輿飛雲暉映寳輪羽蓋扶華垂廕流明玉光千色蓬勃朗耀玄虚七日七夜諸天日月星宿樞衡玉闕駐景停輪神風靜黙山谷蔵雲天鑑鮮瑩和氣八騫一國地土山川林木緬平一等无復髙下土, CK-KZ: ''}

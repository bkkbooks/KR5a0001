  - {type: variant, offset: 5796, length: 0, content: '', CK-KZ: 四人營衞神文保護受經者身道言正月長齋誦詠是經死戸立閉胎根斷滅形神微妙飛昇南宮七月長齋誦詠是經身得神仙諸天書名金簡玉符召魂通微得獲長生十月長齋誦詠是經爲國王帝主君臣父子安鎭國祚保天長存道𤣥不絕永斷劫運安鎭其方民稱太平八節之日誦詠是經得爲}

  - {type: variant, offset: 0, length: 1862, content: 靈寳無量度人上品妙經卷之五十八宙八廻生起死品道言昔於紫空燿景天中玄風洞歌大靈妙土受元始度人廻生起死無量上品元始天尊當說是經周廻十過以召十方始當詣座天眞大神上聖髙尊妙行眞人無鞅數衆乗空而來靈煇燿虚瓊車玉輿扶華宸蓋雲旌四張瑞靄交鬱彌羅八纏五日五夜諸天諸地隂陽機運一時停回玄綱振肅海嶽澄明品物咸和普安其生一國地土山川林木凝鮮一等無復殘毀土皆作異寳燦麗熠熠衆眞侍座元始天尊玄坐空浮萬氣雲華寳座之上說經一遍諸天大聖同時稱善是時一國男女禍害不作無有夭傷說經二遍災病蠲消說經三遍翁艾返嬰說經四遍垂死得生壽獲永延說經五遍死入輪轉即獲昇遷說經六遍沈屍九鍊隂質廻生說經七遍受化太玄枯骨復形說經八遍普世明悟道性還淳尚德貴正斷滅姧邪說經九遍學道得道求仙得仙說經十遍妙氣周備混合神明是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品道化大神無鞅之衆浮空而至說經二遍南方無極無量品明性大神無鞅之衆浮空而至說經三遍西方無極無量品結氣大神無鞅之衆浮空而至說經四遍北方無極無量品開慧大神無鞅之衆浮空而至說經五遍東北無極無量品生䰟大神無鞅之衆浮空而至說經六遍東南無極無量品育形大神無鞅之衆浮空而至說經七遍西南無極無量品保命大神無鞅之衆浮空而至說經八遍西北無極無量品延年大神無鞅之衆浮空而至說經九遍上方無極無量品廻生大神無鞅之衆浮空而至說經十遍下方無極無量品起死大神無鞅之衆浮空而至十遍周竟十方無極天眞大神一時同至一國男女傾心歸仰一切淪化沈冥屍過䝉被道恩生氣入身旣死返形來者有如山嶽出雲四塞彌漫無鞅之衆迮國一半土皆偏䧟非可禁止於是元始開七寳山啓無邊目約衣歛几凝觀遐想以告衆眞曰衆生迷誤罔覺玄眞旣離胎育情逐化遷縁類隨著遂生業因業累敗性徇識爲愚利害交攻情色蕩意初爲童稚逮于壯時顧視之間已及於老焦牢枯竭生氣旋盡至於死壞殊不知道爲生德生爲道根心存於道常與生俱物有生死道無生死存道於形生氣自續數極形盡道復能生生道旣固不從化遷保形不化永存綿綿廻生轉死上眞所崇今爲衆等開演妙本普度無窮於是元始振揚華拂景霧四騰如雲如煙靄浮空際去地九丈元始攝引天眞大神上聖髙尊妙行眞人十方無極至眞大神無鞅數衆俱在景霧之中地還平正無復欹䧟元始即於景霧之上說經都竟衆眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度永植生根無有沈淪傾土歸仰咸行道心不競不擾不任不勤不念不欲不貪不嗔不營不思言無藻麗口無怨咨齊同慈愛異骨成親國安民豐欣樂太平經始岀教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝内名隱韻之音亦是眞王廻生起死內諱百靈之隱名也非世之常辭上聖已成眞人通玄究微能悉其章誦之十過諸天攝氣萬道齊眞靈化開宣咸受玄恩生津永啓召魄收䰟沈零結育以返屍形廻生起死白骨成人至學之士誦之十過則五帝命靈三元䇿眞靈眞降合死道散隳濟度垂死絶而得生所以爾者學士道氣未純體未契眞保制萬神德未全至用可回度命機開導生津但起死而已不復轉輪輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因縁萬災不干神明護門斯經尊妙獨歩玉京度人無量爲生道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到生道開明返化結軀億曽萬祖幽䰟苦爽亦皆受度上昇朱宫格皆九年受化更生得爲眞仙而好學至經功滿徳就皆得舉形飛昇金闕遊宴玉京也上學之士修誦是經皆即受度飛昇南宮世人受誦則延壽長年乆視無窮後天長存運數雖極並皆得作解化之道遁變神明不經絶滅常欣保榮逍遙十天此經微妙普度無窮一切天人莫不受慶無量之福生死䝉惠上天所寳不傳下世至士齎金寳效心告盟神霄而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齋誦詠是經爲㧞度衰亡死滅極㑹之災得保生存七月長齋誦詠是經神氣常全厄難蠲消名奏青籙當獲長生十月長齋誦詠是經爲普天率土保度民物仁壽咸臻與天無傾世世衍溢戴仰人君安鎭國祚萬劫昇平八節之日誦詠是經造化不愆金木交并神氣和同養育皇靈枯朽更生受其鍊度得證仙眞本命之日誦詠是經身保清貞體用日新禍患永消長享福祥天曹録善地司滅連慶延七祖名奏三天功滿德就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黄白三色雲氣之中内外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室内廻生起死玄化大神侍衛前後項生圓象光映十方如此分明宻呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始無量度人上品妙經, CK-KZ: ''}

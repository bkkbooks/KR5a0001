  - {type: variant, offset: 0, length: 2060, content: 靈寳无量度人上品妙經卷之十八地八素景曜靈品道言昔於元洞天中慶霞流音太空化土受元始度人素景燿靈无量上品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖髙尊妙行眞人西華玉妃四極眞王黄素元君飛天騎吏仙官主宰無鞅數衆乗空而來白雲緑霞羽駕飊輿華蓋浮晨珠璧交光五色鬱勃洞煥太空九日九夜諸天日官月府星闕長樓元斗停機三道平周剛風鎭靜崑嶽收雲地浮五瑞天開八門境土山川誠廓林木緬平一等無復髙下土皆變瓊瑤無有異色衆眞侍座元始天尊玄坐空浮萬葉寳蓮之上說經一徧諸天大聖同時稱善是時一國男女仰聽法音神識開悟說經二徧靈府虛明說經三徧黙𢍆玄妙說經四徧眞炁灌身萬疾皆愈說經五徧體合正道衆惡消摧說經六徧三十二天發見眞文說經七徧九天玉境四極玄宫三洞寳經昭然徹見說經八徧貟羅之下太空之中一切音聲皆參大範說經九徧九色妙光下燭幽夜普赦北酆受苦罪魂說經十徧十方萬類遂性逍遥是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一徧東方无極无量品華林大神無鞅之衆浮空而至說經二徧南方无極无量品赤文大神無鞅之衆浮空而至說經三徧西方无極无量品帝符大神無鞅之衆浮空而至說經四徧北方无極无量品元景大神無鞅之衆浮空而至說經五徧東北无極无量品青精大神無鞅之衆浮空而至說經六徧東南无極无量品圓珠大神無鞅之衆浮空而至說經七徧西南無極无量品廣霞大神無鞅之衆浮空而至說經八徧西北无極无量品金華大神無鞅之衆浮空而至說經九徧上方无極无量品紫霄大神無鞅之衆浮空而至說經十徧下方无極无量品靈都大神無鞅之衆浮空而至十徧周竟十方九極天眞大神一時同至一國男女傾心歸仰欣聞元始宜說素景燿靈之法外生天地結成混沌內生萬物變爲嶽瀆皆由无形五行眞金之性虚明同力不可破壞至生人神知見悲喜率因素景不鑿之剛燿靈明察之體而以爲之物有堅脆其成爲一人有聖凡其知爲一我等雖懐此金未經冶鍊今遇元始以此法火瑩此神金鑄爲法器成此道力无量變化作是說已欣樂再拜旋遶座側來者有如細雨宻霧無鞅之衆迮國一半土皆徧陷非可禁止於是元始懸一寳珠大如黍米在空玄之中去地七丈元始登引天眞大神上聖髙眞妙行眞人十方无極素景燿靈至眞大神無鞅數衆俱入寳珠之中天人仰看惟見勃勃從珠口中入既入珠口不知所在國人廓散地還平正無復欹陷元始即於寳珠之内說經都竟衆眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸知妙微無執無滯無想無結無愛無憎無苦無惱無敗無虧心行正道言合天機齊同慈愛異骨成親國上康安永慶太平經始出教一國以道頂有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝内名隱韻之音亦是眞王内諱百靈之隱名也開示道妙無形五行先天地生同寓一炁浩劫不分内有神金素景燿靈外成諸天内爲眞神剛堅無壞萬物仰成爾能知之可以長存非世之常辭上聖已成眞人能悉其章誦之十過諸天遥唱萬帝設禮河海靜黙山嶽藏雲金輪停景玉璣不行浩浩太空飛度生門柔爲至剛虛爲至藏大不可圍廣不可量金光素景燿靈無方堅凝流行得道之疆群魔東形鬼精滅爽回屍起死白骨成人至學之士誦之十過則金門校仙眞籙奉玄五帝侍衛三界稽首魔精喪眼鬼祅滅爽濟度垂死絶而得生所以爾者學士穢氣未消體未洞眞神金未堅遇火則鎔素景未潔燿靈昬曚召制十方威未制天政德可伏御地祇束縳魔靈但却死而已不能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因縁萬災不干神明護門斯經尊妙獨歩玉京度人无量爲萬道之宗巍巍大範徳難可勝道言凡誦是經十過素靈神金不散至靈燿魄長存隂關自開諸天齊到億曽萬祖幽魂苦爽皆即受度上升朱宫格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經素靈合性空體至神金身得道栖泊上清皆得受度飛昇南宫世人受誦眞一守身金德不朽業火不焚則延壽長年後皆得作尸解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶无量之福生死䝉惠上天所寳不傳下世至士齎金寳效心盟天而傳輕泄漏慢殃及九祖長役㝠官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經木表金胎五藏生春枯朽老敗得新長生爲上世亡魂斷地逮役度上南宫七月長齋誦詠是經燿景金津神威内㝠百關堅彊淵池𣿼靈身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經水得其金結爲聖胎天地一塵至妙至玄爾能行之變化飛仙爲國王帝主君臣父子安鎭國祚保天長存世世不絶長爲人君安鎭其方民稱太平八節之日誦詠是經水火土木併蝕於金永固其神得爲九宫眞人本命之日誦詠是經太一下臨素景燿靈呼子三魂左三右七役使無停魂神澄正萬炁長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書土天功滿德就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黄白三色雲炁之中内外蓊㝠有青龍白虎朱雀玄武獅子白鶴羅列左右素景燿靈之炁晃如皎月煇燿頂上日月照明洞煥室内項生圓象光暎
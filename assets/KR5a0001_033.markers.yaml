  - {type: variant, offset: 6685, length: 0, content: '', YP-C: 遍三才交暢說經四遍四時順序玉燭調和說經五遍五星循軌厯劫不愆說經六遍六氣周流運化協功說經七遍七元停健光景延長說經八遍八方列宿刻注不干說經九遍九宮主宰捍厄除災說經十遍十神安位永致福祥是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品天晶騰曜至眞大神無鞅之眾浮空而至說經二遍南方無極無量品天晶騰曜至眞大神無鞅之眾浮空而至說經三遍西方無極無量品天晶騰曜至眞大神無鞅之眾浮空而至說經四遍北方無極無量品天晶騰曜至眞大神無鞅之眾浮空而至說經五遍東北無極無量品天晶騰曜至眞大神無鞅之眾浮空而至說經六遍東南無極無量品天晶騰曜至眞大神無鞅之眾浮空而至說經七遍西南無極無量品天晶騰曜至眞大神無鞅之眾浮空而至說經八遍西北無極無量品天晶騰曜至眞大神無鞅之眾浮空而至說經九遍上方無極無量品統辰御象至眞大神無鞅之眾浮空而至說經十遍下方無極無量品承光合景至眞大神無鞅之眾浮空而至十遍周竟十方無極天晶騰曜日月星宿天眞大神一時同至一國男女傾心歸仰來者有如細雨密霧無鞅之眾迮國一半土皆偏陷非可禁止於是元始俯容笑喭億眾傾瞻於是旋命紫微玉妃啟御神寶鑪擁夜山火玉𤑔徊妙靈香煙結空中如寶如雲現一瓊室縹緲之間去地十丈元始登引天眞大神上聖高尊妙行眞人十方無極至眞大神無鞅數眾俱入瓊室之中天人仰看惟見拂拂從煙景中入旣入瓊室不知所在國人廓散地還平正無復欹陷元始卽於瓊室之內說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倏欻之間寂無遺響是時天人遇值經法皆獲開悟得保永年無有中傷傾土受度與道齊眞不災不害不夭不殘不虧不敗不愆不禍不衰不死顏如玉瑩體映金姿內外無疵徼妙合玄下保家邦安泰昌隆經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是二景五星騰曜星君高眞隱韻之音亦是璘儀三素之隱名也非世之常辭上聖已成眞人通玄究微能悉其章誦之十過諸天遙唱萬帝設禮日月垂芒星辰映華寶炁流精妙灌三宮百神飮玉千眞嚥芳羣魔束形鬼精滅爽迴屍起死白骨成人至學之士誦之十過則日君鑒德月妃受靈超脫世難以得長生所以爾者學士方達妙詮未鍊至眞勤苦修行道漸升玄自可祛蕩災疾感格妙氣但卻死而已不能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人無量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到七曜之眞保度善人一身受度七祖昇遷享福天堂常處逍遙上學之士修誦是經與道契德與天齊眞世人受誦散禍延年後獲成功遇其經訣得作解化之道以度於世此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役地官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經招致日魂保生鍊屍注景成眞爲上世亡魂斷地逮役度上南宮七月長齋誦詠是經招引月魄保生鍊屍降景成眞身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經招引五星精魂保生鍊尸合景成眞騰燿玉華普賴生成爲國王帝主君臣父子安鎭國祚保天長存世世不絕常爲人君安鎭其方民稱太平八節之日誦詠是經神氣纏綿運化形軀克就玄業得爲九宮眞人本命之日誦詠是經寗固命府塞遏死津魂魄受鍊道體日新超出苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上淸道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐五色雲氣之中內外蓊冥有靑龍白虎朱雀玄武獅子白鶴羅列左右五星眞氣纏綿兆身日月照明騰曜室內項生圓象光映十方如此分明密咒曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齋淸堂修行至經無量度人願所啟上徹徑御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經}

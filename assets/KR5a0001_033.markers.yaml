  - {type: variant, offset: 6684, length: 0, content: '', CK-KZ: 四道言昔於上極天中霄霞洞歌大光明土受元始度人騰曜二景五星上品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖高尊妙行眞人無鞅數眾乘空而來紫煙霏霏玉飆華車靈雲蔭蓋朗映晨煇九色蒨璨洞煥十方七日七夜諸天妙氣結化成形並爲珍寶八風惠暢四海和寗時無乖沴庶物自然一國地土山川林木緬平一等無復高下土皆作月璧日珠靈華五色眾眞侍座元始天尊𤣥坐空浮洞化龍仙曲晨萬象𤣥牀說經一遍諸天大聖同時稱善是時一國君臣修崇道德感格神眞說經二遍二景齊明說經}

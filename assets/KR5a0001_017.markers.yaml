  - {type: variant, offset: 5937, length: 0, content: '', CK-KZ: 八道言昔於元洞天中慶霞流音太空化土受元始度人素景燿靈无量上品元始天尊當說是經周逥十過以召十方始當詣座天眞大神上聖高尊妙行眞人西華玉妃四極眞王黃素元君飛天騎吏仙官主宰無鞅數眾乘空而來白雲綠霞羽駕飊輿華葢浮晨珠璧交光五色鬱勃洞煥太空九日九夜諸天日宮月府星闕長樓元斗停機三道平周剛風鎭靜崑嶽收雲地浮五瑞天開八門境土山川城廓林木緬平一等無復高下土皆變瓊瑤無有異色眾眞侍座元始天尊𤣥坐空浮萬葉寶蓮之上說經一遍諸天大聖同時稱善是時一國男女仰聽法音神識開悟說經二遍靈府虛明說經三遍黙契𤣥妙說經四遍眞炁灌身萬疾皆愈說經五遍體合正道眾惡消摧說經六遍三十二天發見眞文說經}

  - {type: variant, offset: 5938, length: 0, content: '', CK-KZ-jye: 遍九天玉境四極𤣥宮三洞寶經昭然徹見說經八遍員羅之下太空之中一切音聲皆參大範說經九遍九色妙光下燭幽夜普赦北酆受苦罪魂說經十遍十方萬類遂性逍遙是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方无極无量品華林大神無鞅之眾浮空而至說經二南方无極无量品赤文大神無鞅之眾浮空而至說經三遍西方无極无量品帝符大神無鞅之眾浮空而至說經四遍北方无極无量品元景大神無鞅之眾浮空而至說經五遍東北无極无量品青精大神無鞅之眾浮空而至說經六遍東南无極无量品圓珠大神無鞅之眾浮空而至說經七遍西南無極无量品廣霞大神無鞅之眾浮空而至說經八遍西北无極无量品金華大神無鞅之眾浮空而至說經九遍上方无極无量品紫霄大神無鞅之眾浮空而至說經十遍下方无極无量品靈都大神無鞅之眾浮空而至十遍周竟十方无極天眞大神一時同至一國男女傾心歸仰欣聞元始宣說素景燿靈之法外生天地結成混沌內生萬物變爲嶽瀆皆由无形五行眞金之性虛明同力不可破壞至生人神知見悲喜率因素景不鑿之剛燿靈明察之體而以爲之物有堅脆其成爲一人有聖凡其知爲一我等雖懷此金未經冶鍊今遇元始以此法火瑩此神金鑄爲法器成此道力无量變化作是說已欣樂再拜旋遶座側來者有如細雨密霧無鞅之眾迮國一半土皆徧陷非可禁止於是元始懸一寶珠大如黍米在空𤣥之中去地七丈元始登引天眞大神大聖高眞妙行眞人十方无極素景燿靈至眞大神無鞅數眾俱入寶珠之中天人仰看惟見勃勃從珠口中入旣入珠口不知所在國人廓散地還平正無復欹陷元始卽於寶珠之內說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸知妙微無執無滯無想無結無愛無憎無苦無惱無敗無虧心行正道言合天機齊同慈愛異骨成親國土康安永慶太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是眞王內諱百靈之隱名也開示道妙無形五行先天地生同寓一炁浩劫不分內有神金素景燿靈外成諸天內爲眞神剛堅無壞萬物仰成爾能知之可以長存非世之常辭上聖已成眞人能悉其章誦之十過諸天遙唱萬帝設禮河海靜默山嶽藏雲金輪停景玉璣不行浩浩太空飛度生門柔爲至剛虛爲至藏大不可圍廣不可量金光素景燿靈無方堅凝流行得道之疆羣魔束形鬼精滅爽囘屍起死白骨成人至學之士誦之十過則金門校仙眞籙奉𤣥五帝侍衞三界稽首魔精喪眼鬼祅滅爽濟度垂死絶而得生所以爾者學士穢氣未消體未洞眞神金未堅遇火則鎔素景未潔燿靈昏曚召制十方威未制天政德可伏御地祇束縛魔靈但卻死而已不能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不千神明護門斯經尊妙獨步玉京度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過素靈神金不散至靈燿魄長存陰關自開諸天齊到億曾萬祖幽魂苦爽皆卽受度上升朱宮格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經素靈合性空體至神金身得道栖泊上清皆得受度飛昇南宮世人受誦眞一守身金德不朽業火不焚則延壽長年後皆得作尸解之道魂神暫滅不經地獄卽得返形遊行太空此經微妙普度無窮一切天人莫不受慶无量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役冥官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經木表金胎五藏生春枯朽老敗得新長生爲上世亡魂斷地逮役度上南宮七月長齋誦詠是經燿景金津神威內冥百關堅彊淵池濬靈身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經水得其金結爲聖胎天地一塵至妙至𤣥爾能行之變化飛仙爲國王帝主君臣父子安鎭國祚保天長存世世不絶長爲人君安鎭其方民稱太平八節之日誦詠是經水火土木併蝕於金永固其神得爲九宮眞人本命之日誦詠是經太一下臨素景燿靈呼子三魂左三右七役使無停魂神澄正萬炁長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書土天功滿德就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黃白三色雲炁之中內外蓊冥有青龍白虎朱雀𤣥武獅子白鶴羅列左右素景曜靈之炁晃如皎月煇燿頂上日月照明洞煥室內項生圓象光暎十方如此分明密呪曰无上𤣥元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啟所言今日吉慶長齋清堂修行至經无量度人願所啟上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經}

  - {type: variant, offset: 0, length: 1968, content: 靈寳无量度人上品妙經卷之十七地七扶桑青陽品道言昔於蒼靈天中青芽雲歌大好生土受元始度人扶桑青陽无量上品元始天尊當說是經周回十過以召十方始當詣座天眞大神上聖髙尊妙行眞人扶桑大帝青華帝君青陽寳燿木皇九炁上眞道君天官從騎眞仙眞人無鞅數衆乗空而來寳雲青霄合沓紫煙琅碧瓊輿八眞飛輦葆蓋流䕃靈霞散空七色蔚靄洞煥髙空九日九夜諸天日月星宿停虚倚輪五緯舒光天經順行元綱鎭靜三道清平流暉關紐七辰煥明一國地土山川林木緬平一等無復髙下土潤琳琅無有異色衆眞待座元始天尊玄坐空浮青麟玉臺海光寳雲之座說經一徧諸天大聖同時稱善是時一國男女衆惡消除黙𢍆眞道說經二徧流晶降體完堅萬神說經三徧五臓生華永無百疾說經四徧金光易骨瓊華鍊形說經五徧通體虚明飛行遊宴說經六徧化周八極普度十方說經七徧冥曹罷對進補眞仙說經八徧元老五帝敷落妙音一切天人皆識雲芽說經九徧諸天諸地化現嘉祥說經十徧朽骨更生返形復命是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一徧東方无極无量品廣生大神無鞅之衆浮空而至說經二徧南方无極无量品明燿大神無鞅之衆浮空而至說經三徧西方无極无量品皓晶大神無鞅之衆浮空而至說經四徧北方无極无量品玄變大神無鞅之衆浮空而至說經五徧東北无極无量品靈暉大神無鞅之衆浮空而至說經六徧東南无極无量品混合大神無鞅之衆浮空而至說經七徧西南无極无量品鎭安大神無鞅之衆浮空而至說經八徧西北无極无量品回風大神無鞅之衆浮空而至說經九徧上方无極无量品純德大神無鞅之衆浮空而至說經十徧下方无極无量品輔化大神無鞅之衆浮空而至十徧周竟十方无極天眞青陽景燿大神一時同至一國男女傾心歸仰各以諸天寳花龍香百果恭敬供養來者有如雲影飛霧無鞅之衆迮國一半土皆偏䧟非可禁止於是元始懸一寳珠大若明星在太空之中去地九丈元始登引天眞大神上聖髙尊妙行眞人十方无極青陽大神無鞅數衆俱入寳珠之中天人仰看惟見勃勃從珠口中入既入珠口不知所在國人廓散地還平正無復欹陷元始即於寳珠之内說經都竟衆眞監度以授於我當比之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸奉髙眞合景合妙合炁合神合元合本合惠合靈合化合變合性合明心符上聖演範流行青陽降體雲芽發生二暉灌鍊眞道克成經始流布一國仰教咸罄至誠衞生保質皆得度世道言元始天尊說經中所言竝是諸天上帝內名隠韻之音亦是眞王内諱百靈之隱名也宣演扶桑帝景之山下接太溟青陽之炁纒結九霄圓景眞光三十萬里引其景者爲仙卿飲其華者爲至眞九道絳煙回度三靈瓊瑶變質敷羅玉英非世之常辭上聖已成眞人通玄究微能悉其章誦之十過扶桑鍊神陽華自成寳明煥燭大福來臻上聖之道奔挹五辰妙炁合无飛昇玉京百邪伏滅大𣝹束形回屍起死白骨成人至學之士誦之十過則青腰奉書太丹吐煇含景浮光天靈啓扉東極降璽萬炁齊歸濟度群品遊行太微所以爾者扶桑爲崑崙玉誕之精青陽爲長生九榮之氣返年却禍賜爾元老大帝之道也龍煙之神屈伸震垣肝葉敷玉關戸紫煙知此道者飛昇列仙色更嬰童變化神泉永保生妙合炁長延通眞達靈受慶綿綿輕誦此章身則受殃供養尊禮門戸興隆世世昌熾與善因縁萬災不干神明護門斯經尊妙獨步玉京度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到青元上皇九華之精明燿扶桑大帝縁瑶之闕天葆少陽碧琳之宫敕命鳳光玉女持太玄開明青眞之符詔九幽寒庭泉府重隂之獄召青陽之神却死䝉生太陽群靈隨光上昇九祖幽魂受度飛昇格皆九年受化更生得爲貴人而好學是經功滿德就皆得神仙飛昇玉府下宴方諸也上學之士修誦是經青陽入身玉精内化流注無英威明執鉞斬伐屍根皆即受度飛昇玉明世人受誦則洞戸琳琅朱火明璫陽眞來應丹化紫房生道續命萬藹流芳保鍊玉飴六府絳章五斗被膺坐鎭魁罡此經微妙普度無方一切天人莫不受慶无量之福生死蒙惠上天所寳不傳下世至士齎金寳效心盟天而傳輕泄漏慢殃及九祖長役冥官侍經始陽玉童朱光玉女各一十二人營衛瓊文保護受經者身道言正月長齋誦詠是經扶桑垂條青陽布英生炁變幽㝠考悉停使上世亡魂斷地逮役度上南官七月長齋誦詠是經方諸降眞青華召靈身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經東霞保生暘谷開成八關啓蘊九炁敷成爲國王帝主君臣父子安鎭國祚保天長存世世不絶常爲人君安鎮其方民樂太平八節之日誦詠是經天山通景玉極延齡得爲下元眞人本命之日誦詠是經太一下臨青帝監盟外運玄炁内育三嬰魂神澄正萬炁長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐九陽蒼雲之中内外蓊㝠有青龍白虎朱雀玄武師子白鶴羅列左右日月照明洞煥室内項生圎象光暎十方如此分明宻呪曰无上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋清堂修行至經无量度人願所啓上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始无量度人上品妙經, CK-KZ: ''}

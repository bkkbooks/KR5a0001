  - {type: variant, offset: 0, length: 1942, content: 靈寳無量度人上品妙經卷之三十五黃五九宮仙籍品道言昔於太碧天中紫霞玄歌太空真土受元始度人九宮仙籍無量上品元始天尊當說是經周囬十過以召十方始當詣座天真大神上聖髙尊妙行真人三元仙籍九宮大神無鞅教衆乗空而來流桑景霄琅輿鳳車羽葆神旛翠輦珠蓋金碧交光九色鬱明洞煥太空三日三夜諸天日月宮府星宿躔次化綱變紀大經彌綸停機息運寥廓沈㝠地踴寳花天敷赤文韶響合奏靈韻生音煇燿上境洞開八門一國地土山川林木緬平一等無復髙下土皆作紫瑶通明瑩徹照映圓羅光熖流晶無有異色衆真侍座元始天尊玄坐空浮神化飛龍羽座之上說經一遍諸天大聖同時稱善是時一國男女心開悟解宻契妙微說經二遍百神聚㑹降體玉英說經三遍生氣交纏合變正道說經四遍圓虚應化五府灌煙說經五遍内運修輪上符天範說經六遍浩刼結滯廓爾消融說經七遍神洞虚明徹見十方說經八遍九宮注籍身飛列仙說經九遍恩沾萬有福及八㝠說經十遍寒夜衆生逍遥離苦是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍上元無極無量品玄都紫微宮正氣大神無鞅之衆浮空而至說經二遍上元無極無量品元黄太極宮合景大神無鞅之衆浮空而至說經三遍上元無極無量品洞白太清宮燿煇大神無鞅之衆浮空而至說經四遍中元無極無量品洞虚清靈宮運功大神無鞅之衆浮空而至說經五遍中元無極無量品南極洞陽宮仙籍大神無鞅之衆浮空而至說經六遍中元無極無量品羅淵導山宮元隂大神無鞅之衆浮空而至說經七遍下元無極無量品青華方諸宮安保大神無鞅之衆浮空而至說經八遍下元無極無量品南水景翛宮元道大神無鞅之衆浮空而至說經九遍下元無極無量品隂天混化宮玄皇大神無鞅之衆浮空而至說經十遍仙府無極無量品考校功過玄籍靈官大神無鞅之衆浮空而至十遍周竟三元九宮二十七府百二十曹主領生化善惡飛天大神一時同至一國男女傾心歸仰元始天尊即以五明寳扇指東南維天光煥赫照燿太空天人隨扇所指仰視神化見一寳山髙聳玉虚廣大難量上有瓊臺玉觀華闕神功羅列天真敬禮元始飛空歩虚謡歌讃歎天尊乃召清微髙上治化玉虛萬寳一品天官黃闕大鎮敷化方輿元㑹二品地官大溟流運廣化九淵玄徳三品水官立於座右三十二天帝君立於座左九天髙聖自然真王立於座前日月五斗經緯列宿元綱大神立於座後曜晶玉極持握彌綸二十五大魔王十方無極飛天大神按部九天儀衛三界神兵瓊花散空天樂互奏導從羽駕飛入東南天中天人仰看惟見億乗萬騎鳳輦龍車炳若繁星難可悉視須臾黃雲四合不復瞻見元始即於東南玉闕之内說經都竟衆真監度以授於我當此之時欣樂難言法事既周萬真復位俄頃之間寂爾無聞是時天民悟此大範普獲濟惠皆得長年永斷沉淪合境歸響咸識生根神真開化標名九宮沖和變氣收伏祅凶物無瘥疹萬彚昭融邪關阖塞正道開通永輔上極威令敷弘世土升平國康民豐經始流布一國演教各運至心宗奉禮敬悉皆度世道言元始天尊說經中所言並是九天自然真王内名隱韻之音亦是三元宮府内諱百靈之隱名也非世之常辭上清開化真人通真悟玄悉𢍆其章誦之十過天官遥唱真公設禮太淵鎮靜神嶽收雲元皇錫教九宮書名大魔伏形羣祅滅景回靈化體杇骨成人妙學上士誦之十過則九官擁衛神帥稽顙鬼精逃遁不敢干犯濟㧞品彚瀹而復升也神州之民初學至道若能依科誦之十過則萬惡消摧千瑞來臨聲參太微道貫紫霄三元執筆注上九宮果備功圓升爲地真也輕誦玉文永劫湮沉崇奉尊禮所願克成世世下教開度含生萬魔不干天真護門斯經隱奥髙祕玉清度人無極爲靈寳之宗巍巍尊妙難可稱量道言凡誦是經十過九宮列曹真吏持生化之簿書下臨監觀削滅羅酆黑籍注名青編祖先幽魂皆得上升流火之庭鍊質召靈爲天種民而妙契有無修行至學大魔保奏升度朱陵飛行八極遊宴上清降神天闕爲世賢人恢張至道輔弼明君世人受誦則百痾普消靈府虛明玉華内鍊金光外凝暫寄厚土太隂變形數極純陽隨運更生此經玄奥普濟無邊一切有生莫不蒙惠無量之福生化受頼上天所禁不傳下凡至士齎寳玉格心盟約而傳輕慢洞章殃及七玄長役冥塗侍經九宮玉童玉女各二十四人擁護靈文守衛受經者身道言正月長齋誦詠是經紫微上宮注籍金科妙行真人乗少陽景霄之光下開幽關㧞度上世亡魂升入天堂七月長齋誦詠是經洞虛元宮書功瓊簡龍燿神王奏名九天降以生氣身得神仙十月長齋誦詠是經方諸洞宮列章上聞持綱執紐玄天大魔清蕩姦祅收伏百精消滅三災保世升平八節之日誦詠是經得爲地真遊宴八㝠本命之日誦詠是經五府灌鍊雙景交纏九元上㑹混合綿綿制魂拘𩲸升騰絳煙采集華芒流運靈泉功滿道備神飛列仙道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐九色雲氣之中内外蓊㝠有青龍白虎朱雀玄武獅子白鶴羅列左右三元九宮仙籍大神森然對目日月照明洞煥室内頂生圓象光映十方如此分明宻呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齋清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始無量度人上品妙經, CK
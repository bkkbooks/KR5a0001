  - {type: variant, offset: 5760, length: 0, content: '', CK-KZ: 五十道言昔於紫元寶皇天中空洞玉音大升明土受元始度人蠲化水火災癘妙品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖高尊妙行眞人無鞅數眾乘空而來瑞靄積霄靈煙揚彩瑶輪瓊輦華蓋垂蔭萬景凝光百千寶色洞煥太空七日七夜諸天軌步日月運度咸悉凝輝星宿𤪽璣舍次停流碧山層巘神海湛波天覆僊雲地成瓊玉臺闕長樓龍攀鳳舞素芝絳木捧露生香碧影金華普天共色眾眞侍座元始天尊𤣥坐空浮九色眞龍之上說經一遍諸天大聖同時稱善是時一國男女欣聽天尊宣說蠲化水火災癘慈救三界无量大法說經二遍天摇玉毫彌覆龍觀說經三遍明河瀉光𤣥珠飄灑說經}
  - {type: page-break, offset: 5760, content: '', id: CK-KZ_JY001_10p066b}

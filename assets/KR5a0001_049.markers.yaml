  - {type: variant, offset: 5763, length: 0, content: '', YP-C: 度天氣勃一劫之交天地再生此水火變化之道惟能蠲化則災癘自平是故道有九一天有九一地有九一人有九一四九合成三十六氣總會三十六天一一變生九一九九八十一元氣空有八十一道氣天有八十一聖天地有八十一眞氣人有八十一僊氣總會三百六十氣道有三百六十虛无自然空玄之道天有三百六十聖化之道地有三百六十洞眞之道人有三百六十骨節騰化飛僊之道此三百六十氣之所分化上有三十六空中有三十六天下有三十六地玄化在人則有三十六戸道有三萬六千神變玄象天有三萬六千雲構宮殿地有三萬六千洞府人有三萬六千神識道爲玄空之至精人爲天地之至靈亦水火之變化也天地有劫數窮極水火之災癘惟上聖高尊諸天帝王以平和之則劫數無終水火无激蝕之變世之水火災癘惟有道之聖君有德之賢臣以平和之人身有水火災癘之變惟泰定无爲降火升水以平和之非至眞上學所不能知凡此蠲化水火災癘大法之道元始說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸識道體實由水火二氣均調天地淸甯人物安阜不爭不勝不勃不蝕不鬱不怫不抑不閉不塞不伏言无窮妄口无邪聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是魔王內諱百靈之隱名也上聖已成眞人內制靈寶眞水無波丹靈無煙均調柔濟蠲化惡毒消滅災癘通玄究微能悉其章誦之十過北都唱嚴南陵錄善火山揚光昭温和浹龍澤澄瑩天德淸平毒害消弭劫世綿永災癘不生人民康悅至學之士誦之十過則五行循運三災自除魔精喪眼鬼祅滅爽濟度垂死絕而得生所以爾者學士抱神御氣水火有倫斟酌燔烠理合有常不差不忒正其紀綱焚蕩之災收付天綱輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到億曾萬祖幽魂苦爽皆卽受度上昇朱宮格皆九年受化更生得爲貴人以經法通感致水火二眞雙景合併奇偶得宜陰陽調平眞氣內應上徹玄關諸天降庭昭響南陵也而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京上學之士修誦是經日月俠傍水火飛光蠲化災癘皆卽受度飛昇南宮世人受誦則心火下降於紫室玄水上朝於金門中池朗秀白元懽忻害氣祓除眞神長存後皆得作尸解之道魂神暫滅不經地獄卽得返形遊行太空此經微妙普度无窮一切天人莫不受慶无量之福生死蒙惠上天所寶不傳下世至士齎金實效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經正三元之紀蠲化水火災癘之氣爲上世亡魂斷地逮役度上南宮七月長齋誦詠是經正五運之紀蠲化水火災癘之氣身得神僊諸天書名黃籙白簡削死上生十月長齋誦詠是經正六氣之紀蠲化水火災癘之氣爲國王帝主君臣父子安鎭國祚保天長存世世不絕常爲人君安鎭其方民稱太平八節之日誦詠是經正八方之紀大小劫運水火相伐勃蝕之災蠲化調平使九宮氣和人民康樂得爲九宮眞人本命之日誦詠是經使支干無傷水火均適眞氣自生魂神澄正萬氣長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上淸道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐靑黃白三色雲氣之中內外蓊冥有靑龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室內項生圓像光映十方如此分明密咒曰无上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝眞符直日香官各三十六人關啟所言今日吉慶長齋淸堂修行至經无量度人願所啟上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經}

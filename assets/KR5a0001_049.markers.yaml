  - {type: variant, offset: 5760, length: 0, content: '', YP-C: 五十蠲化水火災癘品道言昔於紫元寶皇天中空洞玉音大升明土受元始度人蠲化水火災癘妙品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖高尊妙行眞人無鞅數眾乘空而來瑞靄積霄靈煙揚彩瑶輪瓊輦華蓋垂蔭萬景凝光百千寶色洞煥太空七日七夜諸天軌步日月運度咸悉凝輝星宿𤪽璣舍次停流碧山層巘神海湛波天覆僊雲地成瓊玉臺闕長樓龍攀鳳舞素芝絳木捧露生香碧影金華普天共色眾眞侍座元始天尊玄坐空浮九色眞龍之上說經一遍諸天大聖同時稱善是時一國男女欣聽天尊宣說蠲化水火災癘慈救三界无量大法說經二遍天摇玉毫彌覆龍觀說經三遍明河瀉光玄珠飄灑說經}
  - {type: page-break, offset: 5760, content: '', id: KR5a0001_YP-C_02kangji-03-0066b, image: JY001/02kangji-03-0066b.png}
  - {type: variant, offset: 5761, length: 0, content: '', CK-KZ: 遍水騰火降變化自然說經五遍災癘不生劫數延遠說經六遍陰平陽泰氣无伏勝說經七遍混元顯化靈範流昌說經八遍冲用陶虛神眞昭感說經九遍湧金爲壇神僊俯矚說經十遍枯骸重肉幽黨開明是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方无極无量品開運大神无鞅之眾浮空而至說經二遍南方无極无量品玉厯大神无鞅之眾浮空而至說經三遍西方无極无量品植劫大神无鞅之眾浮空而至說經四遍北方无極无量品度劫大神无鞅之眾浮空而至說經五遍東北无極无量品權量大神无鞅之眾浮空而至說經六遍東南无極无量品制水大神无鞅之眾浮空而至說經七遍西南无極无量品滅火大神无鞅之眾浮空而至說經八遍西北无極无量品蠲災大神无鞅之眾浮空而至說經九遍上方无極无量品化癘大神无鞅之眾浮空而至說經十遍下方无極无量品承濟大神无鞅之眾浮空而至十遍周竟十方无極天眞大神一時同至一國男女傾心歸仰各施珍異神香妙衣无量法具旌幢繖蓋珮玉纓珠狀如屯雲密雨无鞅之眾頂禮天尊願聞大法於是元始撫雕雲瓊几揮紫金丹光塵尾流眄垂光告命大眾十方天人曰吾自造立混沌化生二儀役御陰陽始封皇上元君靑靈上眞靑天帝君靑華帝君蒼華大帝靑靈天君榑桑大帝九老仙都君上相靑童君東華三官較量水火定平劫數極於九五八六之會地之維徑三億三萬三千三百億萬里南北則減千里東西增千里自地上至天半剛風八極則地之深亦如之通而廣之渾以相覆其數鉤股懸天之晷著地之儀移千里一寸而得之天之廣大約三百六十六萬里以萬天求之不可以爲度九氣靑天天有九元九元運關周迴三十二覆晝夜三十日天氣一交一十二交爲一度三百三十度諸天氣王於木數至寅卯三千三百度靑氣勃黃氣否陽數之九九者天之極謂小陽九六天氣上百官受會謂小百六此天氣勃於火宮巳午之嵗疫氣流行九千九百度靑氣激黃氣蝕陽數九九謂大陽九六天氣反百神收氣謂大百六此天氣激於金宮申酉之歲兵疫並行三氣丹天運關三百六十度諸天氣王於火數至巳午三千三百度赤氣勃白氣否此小陽九小百六天氣勃於土宮辰戌丑未之歳土中生火九千九百度赤氣激白氣蝕此謂大陽九大百六天氣激於水宮亥子之歳當有洪災中央一氣黃天運關三百三十度諸天氣王於土數至辰戌丑未三千三百度黃氣勃黑氣否此謂小陽九小百六天氣勃於金宮申酉之歳瘴疫大起九千九百度黃氣激黑氣蝕此謂大陽九大百六天氣激於木宮寅卯之歳江河水溢災癘並興七氣素天運關三百六十度諸天氣王於金數至申酉國安民豐三千三百度白氣勃靑氣否此則小陽九小百六天氣勃於水宮亥子之歳人民漂流咸至夭傷九千九百度白氣激靑氣蝕此謂大陽九大百六天氣激於火宮巳午之歲赤怪焚爇災疾尤甚五氣𤣥天運關三百六十度諸天氣王於水數至亥子三千三百度黑氣勃赤氣否此則小陽九小百六天氣勃於木宮寅卯之歳水湧沛決人民夭傷九千九百度黑氣激赤氣蝕此謂大陽九大百六天氣激於土宮辰戌丑未之歳應以大旱五方運關三十二覆九千九百度周五方之氣皆上運元始靑陽之氣迴轉靈寶𤣥都玉京山中周迴諸天日月星宿十空之外九億九萬九千九百九}

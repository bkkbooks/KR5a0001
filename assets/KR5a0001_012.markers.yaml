  - {type: variant, offset: 6206, length: 0, content: '', YP-C: 徧思念日月交流河海並注憑何運搖依空獨立說經三徧一切天人回光洞視炁入玄元道合虛皇說經四徧一切天人俯仰三界雲動風施荐臻嘉瑞說經五徧證悟化本太乙元精无形眞土感化而生說經六徧靈心頓開懸知天地陰陽順度萬物遂成說經七徧玄沆泛灑玉芝自生龍虎悲吟感悟法相說經八徧身鍊爲空空化爲眞如是神通實爲希有說經九徧大會咸悅瞻見元始得悟道機元精爲妙說經十徧天樂流韻萬籟齊聲玉相垂慈潔如空素是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一徧東方无極无量品太乙元精至眞大神無鞅之眾浮空而至說經二徧南方无極无量品太乙元精至眞大神無鞅之眾浮空而至說經三徧西方无極无量品太乙元精至眞大神無鞅之眾浮空而至說經四徧北方无極无量品太乙元精至眞大神無鞅之眾浮空而至說經五徧東北无極无量品太乙元精至眞大神無鞅之眾浮空而至說經六徧東南无極无量品太乙元精至眞大神無鞅之眾浮空而至說經七徧西南无極无量品太乙元精至眞大神無鞅之眾浮空而至說經八徧西北无極无量品太乙元精至眞大神無鞅之眾浮空而至說經九徧上方无極无量品太乙元精至眞大神無鞅之眾浮空而至說經十徧下方无極无量品太乙元精至眞大神无鞅之眾浮空而至十徧周竟十方无極太乙元精天眞大神一時同至一國男女傾心歸仰咸聞元始天尊宣演太乙元精之法出生天地三界仙聖鬼神必依眞土胞胎養育然後而成眞土者非有形頑滯之土茲乃五行鍊化先天地生道之全體無形眞土識此眞土自然得道必當禮覲元始求此妙法來者有如細雨密霧無鞅之眾迮國一半土皆偏陷非可禁止於是元始懸一寶珠大如黍米在空玄之中去地五丈元始登引天眞大神上聖高尊妙行眞人黃老元帝太乙元精妙空眞君土中土下一切眞靈无量聖眾十方无極太乙元精至眞大神無鞅數眾俱入寶珠之中天人仰看惟見拂拂從珠口中入旣入珠口不知所在國人廓散地還平正無復欹陷元始卽於寶珠之內說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂無遺響是時天人值遇經法普得濟度全其本年無有中傷傾土歸仰咸行信心信道信經信師信法信位信證信常信生信化信本言無華曲口無邪聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是眞王內諱百靈之隱名也太乙元精者無形眞土也眞土無形卽是太空太空爲土其中生出三界一切天地眞仙龍神人鬼兆若知之以有合無以性合空以神合道卽爲高眞非世之常辭上聖已成眞人通玄究微能悉其章誦之十過諸天遙唱萬神設禮太乙臨景河海靜默元精布化山嶽藏雲眞土孕明內生日月無形示象璇璣不行羣魔束形鬼精滅爽迴屍起死白骨成人至學之士誦之十過則五帝侍衞三界稽首魔精喪眼鬼祅滅爽濟度垂死絕而得生太乙施德元精散靈收炁於空招神於無續命繼生土爲命先所以爾者學士穢炁未消體未洞眞以制十方威未制天政德可伏御地祇束縛魔靈但卻死而已不能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人無量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到太乙元精土眞變生道胎分神泉曲開明億曾萬祖幽魂苦爽皆卽受度上昇朱宮格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經太一孕靈土主五福元精入身皆得受度飛昇南宮世人受誦則延壽長年土爲金母水爲土孫土爲元炁金爲眞鉛水旣遇金鉛與汞親識者不死遇者知眞然後皆得作尸解之道魂神暫滅不經地獄卽得返形遊行太空含咀土精普度無窮一切天人莫不受慶无量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及七祖長役三塗侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經太乙元精萬變生形爲上世亡魂斷地逮役度上南宮七月長齋誦詠是經太乙元精土爲生根身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經太乙元精土號帝尊中臨四方乘黃豐文爲國王帝主君臣父子安鎭國祚保天長存世世不絕常爲人君安鎭其方民樂太平八節之日誦詠是經太乙元精八風朝元太乙在庭五福來佑八難不經得爲九宮眞人本命之日誦詠是經太乙元精保命長生无形上祖元始前生生命之本隱於太玄開目無見惟覩空玄空玄爲寶悟之昇仙魂神澄正萬炁長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黃白三色雲氣之中內外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室內太乙元精之氣烱烱赤景居兆頂上項生圓象光暎十方如此分明密咒曰无上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啟所言今日吉慶長齋清堂修行至經无量度人願所啟上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經}

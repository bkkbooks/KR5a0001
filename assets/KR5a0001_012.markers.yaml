  - {type: variant, offset: 6205, length: 0, content: '', YP-C: 三太乙元精品道言昔於元黃天中紫空金碧大方明土受元始度人太乙元精无量上品元始天尊當說是經周回十過以召十方始當詣座天眞大神上聖高尊妙行眞人黃老元帝太乙元精妙空眞君中央九壘三十六皇君仙王地眞大神土中眞皇靈仙土下官曹司馬无鞅數眾升空而來碧霞黃雲綠輿瓊輪丹華垂蔭元精玉光叢萃瑞色洞煥太空五日五夜太乙神眞徧覆諸天日月宮府星斗宮闕龍馭无馳玉機停揵纒厯凝煇洞如金色泠飈靜夷天谷深湛綠煙低微明煇昭敞碧天流綱紫煙飛靄三元浩回四炁眇清一國地土山川林木緬妥平砥無復高下土皆金璃厚柔含煇彩縟霞觀無有異色眾眞侍座元始天尊玄座空浮五色神龍之上說經一徧諸天大聖同時稱善是時一國男女目覩心思諸天諸地辰景山海瓊臺寶閣仙聖鬼神自何出生而具此相說經}

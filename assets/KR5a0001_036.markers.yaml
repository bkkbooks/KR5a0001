  - {type: variant, offset: 5554, length: 0, content: '', CK-KZ: 七道言昔於北淸𤣥靈天中大魁羅上妙寶華土受元始度人无量上品𤣥靈妙天內號太虛无上常容天其天帝主名曰總監鬼神居其宮殿思道因緣言我植福位爲天帝住不遷界中與北方諸天世界通爲一境十方天中及以天下一切大力鬼神國土咸我部屬我以福業故周足神通禁制魔種歸依三淸奉太上玉律金科威被鬼爽而今元始上帝當降此天爲諸天人十方眾生說无量度人无上法門我今處極眞世界聞聽法味實爲忻快當與天中聖人僊眞一切部寮男女等眾遠詣玉京恭請元始天尊降此天中爲眾說法敕命侍香金童都文瑜傳言玉女馮道倩啟蘂玉九色之蘊索三天降眞洞瓊寶香然丹天火玉驛龍捧爐千眞奏煙靈幡寶幢奇花珍供百千萬人俱詣玉京蕭臺金闕叩禮元始三說其辭仰祈大慈不違本念降眄天中宣演道法度脫一切開通靈虛使內識洞𤣥外伏魔試再拜長跪伏俟聖言天尊告曰吾本無形以道爲質住此玉京散爲五形變神萬億吾今住此見爲十方無極世界无量眾生各各演說法要明曉至眞示𤣥淸之路汝所居天上干無色下臨崑山傍及北臺幽嶽鬼都無不統御北淸𤣥靈俯及酆羅近於海際密與人境支連貫接人世眾錯臭濁難堪爲諸}

  - {type: variant, offset: 5412, length: 0, content: '', YP-C: 七解釋幽牢品道言昔於始靑天中碧落空歌大浮黎土受元始度人解釋幽牢妙品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖高尊妙行眞人十方救苦天尊玉淸雲宮大慈天尊大悲眞帝酆都九幽帝主仙官無鞅數眾乘空而來十方起雲混如丹色瓊臺寶宇隱顯太空玉馬金龍驂霞泛景飛光鳳蓋垂蔭珠軿瑞彩天光流煥四極蓊鬱淵映明徹碧空七日七夜紅霞搖曳遠羃神鄉天都紫微層影洞燿丹殿星宮瓊堂日闕珠緯躔虛玉綱流演紫烟紛華山海凝碧瑞金爲界色雲合防淸靜聖途明無纎玷眾眞侍座元始天尊玄坐空浮八山九海伏龍翔虎十極太玄之座說經一遍天帝鼓節高眞洞詠是時一國重冥陰域一時光明說經二遍地下重壘三十}

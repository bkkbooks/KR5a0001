  - {type: variant, offset: 5413, length: 0, content: '', YP-C: 皇俯伏恭聽簡閱皇籍說經三遍氣流甘濡灑潤枯朽說經四遍殺鬼滅爽魔眾失聲說經五遍地吐芝英八十一種赬蒼秀異奇文燕胎說經六遍酆山震搖黑海停沸說經七遍九幽地獄萬里鐵城業火熾然億劫洞赤說經之際毒勢氷消炎牢淸蕩說經八遍靈霞布空九色成字眞文廓現赦諸罪人說經九遍暗氣凝雲傷血隕雨聞經穢淨神風掃塵說經十遍屍骨歘起靈顏鮮瑩自然成人是時一國是男是女悟道知眞胞結解釋冥關錄籍字迹除脫素幅鍊章了無罪目歸嚮天尊咸遂生養道言是時元始天尊說經一遍東方無極無量品大慈九氣救苦天君無鞅之眾浮空而至說經二遍南方無極無量品大智三氣赦罪天君無鞅之眾浮空而至說經三遍西方無極無量品大明七氣執法天君無鞅之眾浮空而至說經四遍北方無極無量品大惠一氣息苦天君無鞅之眾浮空而至說經五遍東北無極無量品大悲梵氣破獄天君無鞅之眾浮空而至說經六遍東南無極無量品除過梵氣九幽天君無鞅之眾浮空而至說經七遍西南無極無量品大心梵氣拔罪天君無鞅之眾浮空而至說經八遍西北無極無量品大仁梵氣玉匱天君無鞅之眾浮空而至說經九遍上方無極無量品普濟一十二氣萬福天君無鞅之眾浮空而至說經十遍下方無極無量品不動五氣玄母天君無鞅之眾浮空而至十遍周竟十方無極天眞大神無量天君一時同至一國男女傾心歸仰咸荷慈恩下逮淪亡俱霑聖澤感嘆之聲響動幽夜鳥獸悲嘷人鬼悵惋來者有如沙塵飄委嚮風傾注於是元始遍視羣生彈指微笑金口發光光如皎月上極無上剛風頂際下極水輪泉曲九漏無底陰谷無不照見一一光中皆現三界眾生善惡命根宿報新緣互相酬對業果自明心目同證此光旋行暈成五色下覆人間上接天境運如輕車灼灼圓象逡巡九道狀如日出東䝉十方同色去地五丈炯爍停空元始登引天眞大神上聖高尊妙行眞人十方無極救苦天君至眞大神無鞅數眾俱入九色圓象之中天人仰看惟見拂拂從圓光中入旣入光中不知所在國人廓散境宇如初元始卽於九色圓象之中說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂無遺響是時天人遇值經法普得濟度解釋幽牢無有橫傷傾土歸仰幽顯披心不怨不憎不執不滯不著不愛不害不欺不𡨚不爭言必諧理口有和聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是魔王內諱百靈之隱名也非世之常辭上聖已成眞人通玄究微能悉其章誦之十過則諸天遙唱九幽啓關冥海靜默業山傾摧光徹幽夜積劫累代縲繫鬼都籍在三官朽骸積屍魂魄囚考黑氣腥腐破膽裂腦火山氷池焚爍烹瀆以萬計期無有晝夜聞此玉文天眞靈篇則太一錄魂南丹鍊神神還識明捨妄歸眞鬱結𡨚負應時淸明太和眞氣入其身形蓮花捧履龍瑞扶顏與天人樂大魔伺迎至學之士誦之十過則岱宗凛命紂絶凛恭此君奉書陰曹削名泥丸玄堂七祖故氣氤氲未開內構胎血百節蟲官骨中注吏地虎風獸啖骸食氣之鬼守禦泉府銅犬火蛇之神惡烟四激窮魂芒昧神官切齒百里洋鑊千尋鐵壘不見三辰詎曉道境眞知沈淪罪根駢委牽連生人追呼族緒冡宅之訟誣告天司冥漠無所一時萬死痛毒終天聞此洞篇魔帥弭節黑帝停軒往劫古爽近世苦魂道力陶冶變酷消仇玉厯定科紫雲覆座神風調逸墮魄飛昇死戸無拘逍遙三界輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙利樂幽靈度人無量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到億曾萬祖幽魂苦爽皆卽受度上昇朱宮格皆九年受化更生得爲貴人而有億劫結魂千載滯爽太上不以聞宥上帝不以恩原禁獄幽牢在女靑天一王平女沙九陰大禁都司檢形五老校錄暗黲芒窕之穴毒風醜類藴墮四瀆海閭枯削寒丁大魔勅制之魅誦此洞章歘然自生光梵變玄屍胔得度與神同昇洗除罪咎靑籙紀名刺姧司非不得鼓蝟鋒之斷筆韓君丈人將折簡於螭笈是皆玄司九幽酆泉之重刑此經解釋渙爾泮散而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經節關開通胎眞明正洞陰一府六峯遊精隨氣變化與時出入或感人呼吸流毒飮食因蒭梗以兆體假冥漠以潛靈九府捕索三官定書經道至神皆卽受度飛昇南宮世人受誦誠貫十天幽牢苦爽祖世親緣紀過泰山刋名北都皆得鍊質丹陵瑩魂炎海誦聲成雲載此冥魄逍遙太无過度輪轉不經生死奉行之者則延壽長年後皆得作屍解之道魂神暫滅不住地獄卽得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死䝉惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經爲上世亡魂斷地逮役度上南宮詣三元洞宮主生太陽火官焚除罪簿赦免吞火食炭洋銅沸鑊銅柱鐵床燒烹炮烙眾苦之罰經道神力變成淸池獄具惡器悉爲蓮花七月長齋誦詠是經爲上世亡魂祖考宗姻昇遷鍊化削滅罪緣慶流孫曾詣三元洞宮主死太陰水官漂蕩刑書滌濯元釁淨除溟波海瀆没溺寒夜冰池雷震霹靂泉曲徒役絞水暴注湍激驚濤眾苦之罰經道神力變成安室獄具惡器悉爲樂玩十月長齋誦詠是經爲上世亡魂姑妣娣姒往逝婦姬解斷徴呼復連傳逮詣三元洞宮主生死罪錄官釋放考掠訊訟簿錄證佐對定冤仇銜負悔恨喑鳴追召眾苦之罰經道神力變成德友獄具惡器悉爲珍寶八節之日誦詠是經奉詣九宮直符九府直事八方大獄九幽泉牢開通八門受生八道天人鬼神地獄餓鬼畜生魔帥祅魅出離禁獄各乘生功度脫九幽爲大施者本命之日誦詠是經爲北斗司命司錄主非典禁命在斗宮計年期月追召生魂上詣斗宮校定罪福度脫三災四殺五苦六害七傷八難九厄十極事在三元考官冥曹譴謫眾苦之罰經道神力不有害傷魂神澄正萬炁長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上淸道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐靑黃白三色雲氣之中內外蓊冥有靑龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室內項生圓象光映十方如此分明密咒曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啟所言今日吉慶長齋淸堂修行至經無量度人願所啟上徹徑御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經}

  - {type: variant, offset: 0, length: 2078, content: 靈寶無量度人上品妙經卷之五十六宙六濟度死䰟品道言昔於紫暉玄濟天中緑景虛明大慈靈土受元始度人濟度死䰟無量上品元始天尊當說是經周廻十過以召十方始當詣座天眞大神上聖髙尊北酆大帝九幽㧞罪天尊金闕濟度天尊太一救苦天尊大慈大悲救苦眞人大惠眞人無鞅數衆乗空而來碧燿流煇華雲映彩龍軿鳳駕寳蓋靈旛彌漫羅列香藹氛氲日月停景洞朗太无九日九夜諸天瓊樓玉闕雲殿霞房一時同明下極崑崗三山十洲四海九河泉曲之阿鄷都寒庭長夜之關悉被神光普獲開煥萬象澄清十天昭廓一國地土山川林木緬平一等無復高下地成紺碧無有異色衆眞侍座元始天尊玄坐空浮瓊光洞陽寳牀之上說經一遍諸天大聖同時稱善是時天地山嶽鐡城大獄自然齊啓咸釋罪爽來聽法音說經二遍鑊湯聲震忽變清涼水吐青蓮異氣芬馥萬刃刀山悉爲寳樹杻械銷鎔骨骸生復還得成人俱承道䕃說經三遍仙聖讃揚靈瑞咸臻說經四遍一切人民悟解法要說經五遍昆蟲善慧省識罪原說經六遍虎狼毒蝮滅斷惡根說經七遍冤仇和釋異骨成親說經八遍鬼道塞絶永保生津說經九遍幽沈滯魄鍊化昇遷說經十遍道德純一俱登妙眞是時一國有情有識冥不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品考較濟度大神無鞅之衆浮空而至說經二遍南方無極無量品司察濟度大神無鞅之衆浮空而至說經三遍西方無極無量品司禁濟度大神無鞅之衆浮空而至說經四遍北方無極無量品司化濟度大神無鞅之衆浮空而至說經五遍東北無極無量品典獄濟度大神無鞅之衆浮空而至說經六遍東南無極無量品九幽濟度大神無鞅之衆浮空而至說經七遍西南無極無量品泉曲濟度大神無鞅之衆浮空而至說經八遍西此無極無量品羅酆濟度大神無鞅之衆浮空而至說經九遍上方無極無量品超生濟度大神無鞅之衆浮空而至說經十遍下方無極無量品昇化濟度大神無鞅之衆浮空而至十遍周竟十方無極天眞濟度大神一時同至一國男女傾心歸仰來者萬億並駕同驅靈光散彩華霧彌空八部六天三官九署威光召致異趣苦䰟無鞅之衆迮國一半土皆偏䧟非可禁止於是元始洞觀遐邇哀念衆生手執寳翇翇出妙光光及十方一切聽法天仙聖衆自見身相有如瑠璃內映濯羅鬼神䰟爽各於其類中得圓滿心體清淨業火消除仙花時飛大震瓊音宣明法要爾等衆生造諸罪惡累彼死䰟飄蕩無依散入諸趣備經輪轉莫測道縁今以九陽神霄大梵之氣化十二靈文濟度死䰟超昇天境始從亡殁以鍊屍形屍神守骸滯爽超昇仙聖合徳還自成人出離三塗往度八難大衆欣躍仰俟恩光於是元始引眄惻然鑪炷寳香上結宻雲化爲玉闕去地九丈内垂天虹熒煌五色接待大衆俱入其中元始申命㧞罪天尊羅酆帝宰救苦眞人無鞅數衆同升化闕蘂華紫玉靈妙之臺天人仰看惟見勃勃影現萬殊旣入玉闕不知所在國人廓散地還平正無復欹䧟元始即於紫臺之上說經都竟衆眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其道眞無有沈淪傾土歸仰咸行善心不愆不犯不忿不爭不迷不忘不愛不著不擾不驚言必眞正口無惡聲齊恩慈愛道化合并存亡安泰度樂生榮經始出教幽顯恊德預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝内名隱韻之音亦是眞王内諱百靈濟度之隱名也非世之常辭上聖已成眞人通玄究微能悉其章誦之十過諸天遙唱萬帝設禮沈逝死䰟證升仙品縁愛積習皆獲蛻捨群魔敬衛蕩化鬼精至學之士誦之十過則四司釋訟九嶽除𡨚回屍起死白骨返形普受濟度以得生成所以爾者學士誦詠寳章招眞召靈妙氣來臻道生神德故可下濟死亡即獲超度而已莫不昇遷輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因縁萬炎不干神明護門斯經尊妙獨歩玉京度人無量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到酆都六洞鬼帝官君寒庭泉曲幽夜之河泰山地壘主宰神靈簡奏上功超㧞罪䰟億曽萬祖幽沈苦爽皆即受度上昇朱宫格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經皆即受度飛昇南宫世人受誦開度九玄出離地獄生福天堂延慶後昆永無身殃此經微妙普度無窮一切天人莫不受慶無量之福生死䝉惠上天所寳不傳下世至士齎金寳效心盟天而傳輕泄漏慢殃及九祖長役隂官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齋誦詠是經濟度死䰟解釋天官罪考之愆五方大殺屍劫之鬼威毒咸息開貸死䰟獲度南宫逍遙自然七月長齋誦詠是經濟度死䰟解釋地官罪考之愆五嶽四司北都羅酆曠野山澤社令城隍應關囚對禍害滅連黑簿削除白簡上生十月長齋誦詠是經濟度死䰟解釋水官罪考之愆北海河侯河伯溟泠四瀆主宰當令幽苦摙汲冥䰟役難散除度越生門八節之日誦詠是經濟度死䰟解釋罪考八方大獄八洞鬼牢悉承道化永變福庭迷識開悟咸登妙津得生世間智用髙明務勤上學克致成眞三元之日誦詠是經濟度死䰟各遂其情鍊度南宮返生受靈䰟神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿徳就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉司靜思身坐青黃白三色雲氣之中内外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室内項生圓象光映十方如此分明宻呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋清堂修行至經無量度人願所啓上徹俓御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經, YP-C: ''}

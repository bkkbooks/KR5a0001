  - {type: variant, offset: 6060, length: 0, content: '', CK-KZ: 四道言昔於太極天中靑華安保大眞明土受靈寶度人洞神禳災无量上品扶桑洞神大道君當說是經周迴十過以召十方扶桑世界一切眞仙亘太極之東九十萬里碧海之內中有大山根連洞溟金沙重疊貫軸下元上出大无紫空神境西連太極南峙炎陵北定幽門中通𤣥都而此世界十萬餘里神峰巨嶺隱顯滄浪梵浮瑞光靑霞之氣冪冪在上靑玉爲城碧林爲宮地凝紺華拱生扶桑根蟠東極枝條相向靑碧爲光千葉之上自然天文帝眞赤書九氣鳳文以鎭十方諸天日月下出陽機自運晝夜六時天漢波潮雲濤爭湧仙都人民十二品格百千種物太无}
  - {type: page-break, offset: 6060, content: '', id: CK-KZ_JY001_09p048b}

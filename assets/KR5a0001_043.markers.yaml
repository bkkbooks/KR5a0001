  - {type: variant, offset: 6061, length: 0, content: '', CK-KZ-jye: 氣化生號靑宮扶桑世界元始天尊分神萬天散形千億忽於此方命以扶桑之天靑華道境靈胄孕精挺生空洞之極號扶桑洞神大道君外曰扶桑大帝出納太陽賓餞濛汜眞形爲日月之精魂爲南極長生大帝其季次曰青華帝君扶桑育洞神之氣氣變九劫體貌完具東眞道成爲洞神大道君扶桑洞神者九陽眞精之氣也生於扶桑之內化爲劫火更爲明哲辯慧高聖之德德之至神爲大道之君道君執萬物之母以化生元胎含五行之精以鑪錘天地世之災變必由火殃火爲災本而道有扶桑洞神之祖以御其變扶桑靑林之氣大則冶鍊眞文增益𤣥道小則禳災散禍福祐羣生比之火然必緣於木木胎藏火火屬於神神養木中天災自息可禳之道故扶桑洞神大道君爲禳災之主也降於太極始當詣座扶桑眞境道德大神上聖高尊靑帝眞人无鞅數眾乘空而來碧落飛雲靑林鬱秀飊輪潛運洞蓋垂華蒼龍妙光迢遙无外流霞丹景混合渺茫七日七夜諸天昭臺日館星闕璣轅一時停軌靈風遠溢海岱明雲天无異色九氣鬱淸一國地土山川林木瓊蘂粲芳靑文壟起紫璆振響合音空洞扶桑洞神大道君於𤣥靜之中爲諸生民解禳災厄𤣥坐空浮紫霄寶光玉座之上說經一徧諸天大聖同時稱善是時一國男女災病普皆消散說經二徧太極天開萬眞同會說經三徧仙都揚烟慶周三界說經四徧靈心內通宛識妙體說經五徧龍鳴海空神波遠浹說經六徧三災不作萬物生榮說經七徧神煇同映層闕光明說經八徧五篇雲篆紫籟成音說經九徧玉華飛空重綵交煥說經十徧洞神垂照泉曲蒙恩是時一國是男是女莫不傾心皆受護度咸得長生道言是時扶桑洞神大道君說經一徧東方无極无量品禳災解厄洞神至眞大神无鞅之眾浮空而至說經二徧南方无極无量品禳災解厄洞神至眞大神无鞅之眾浮空而至說經三徧西方无極无量品禳災解厄洞神至眞大神无鞅之眾浮空而至說經四徧北方无極无量品禳災解厄洞神至眞大神无鞅之眾浮空而至說經五徧東北无極无量品禳災解厄洞神至眞大神无鞅之眾浮空而至說經六徧東南无極无量品禳災解厄洞神至眞大神无鞅之眾浮空而至說經七徧西南无極无量品禳災解厄洞神至眞大神无鞅之眾浮空而至說經八徧西北无極无量品禳災解厄洞神至眞大神无鞅之眾浮空而至說經九徧上方无極无量品禳災解厄洞神至眞大神无鞅之眾浮空而至說經十徧下方无極无量品禳災解厄洞神至眞大神无鞅之眾浮空而至十徧周竟十方无極禳災解厄天眞大神一時同至一國男女傾心歸仰來者如赴淵之流應潮之水渺然無際不見端涯无鞅之眾舉國內外或有體用未分因緣爲災智慧不爽法染爲災神氣不合分別爲災道性不明執妄爲災去取空有邪正爲災戀著法身認己爲災貪著神通變幻爲災欲出三界生死爲災識悟大道无作爲災測量元化狂瞽爲災不知洞神陰陽爲災出入胎藏凡聖爲災凡此十二大災天人大神至學之災也復有世間之災出胎之時業力所轉橫側爲災童孺之時驚忤爲災壯歳之時運度爲災營辦之時得喪爲災修舉之時氣候爲災起居之時疾病爲災有作之時鬼神爲災昧心之時天地爲災負國之時刑戮爲災不孝之時雷火爲災不戒之時天禁爲災汙慢之時夭折爲災潛毒之時陰陽爲災貪徇之時溢分爲災居世之時僞薄爲災凡此十五大災世所罹犯以至身命喪失五命加臨天星爲殃地司執錄三官上奏五帝注尤此等災厄累繫身心咸赴道君廣大法席周帀圍繞瞻望天顏佇聽玉音宣示禳災普利大法於是扶桑教主洞神太上大道君攬日月雲龍之綬轉瑞玉明光之几俯顧大眾欣眄十方倐歘之間分身千億一切眾生各起生緣及諸境界一眾生皆見己身親對聖身長跪受記撫頂訓言演說扶桑爲生氣之根中生洞神之氣爲萬類之精神一切大災存念洞神正眞九陽之光无災不除滌滅厄害於其會中見一道君浮坐紫雲曲蔭扶桑玉章紋葉之下洞神之氣化爲丹林丹林千眞冠劍竦列去地五丈洞神大道君登引禳災解厄洞神天眞大神韓司主錄南宮移度卻災順行神君上聖高尊靑華燿寶眞人十方无極至眞大神无鞅數眾俱入神林扶影之內天人仰看惟見勃勃從洞光中入旣入林光不知所在國人廓散碧壘砥平神林靜默洞神大道君卽於化境之內說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位空洞生神寂无遺響是時天人遇值經法普得濟度全其本年无有中傷傾土歸仰災患消禳淸靜本心心旣淨正邪道不干星軌淩犯鬼神禍刑三災四殺五行六害七傷八難九厄過度災咎除滅不祥言𢍆中道中无毀非齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉崇禮皆得度世道言洞神大道君說經中所言並是諸天上帝禳災致福隱韻之音亦是魔王內諱禳消萬災之隱名也非世之常辭上聖已成眞人通𤣥究微能悉其章誦之十過諸天降眞災氣沈滅厄禍擯竭本命開光生福自然天眞警衞非道无干羣仙凛顏靈司鼓節灝霞分絢寶海發光世故殄除惡烟飄息回災轉厄進業成眞至學之士誦之十過則列帝同格眾天遐映護世災殃悉令禳解民物安謐生道永昌毒害消散鬼精喪眼五帝侍近三界禀命濟度垂死絕而得生所以爾者學士道德充備鬼神尊仰體洞眞極神力周滿誦詠至經福降災消一切眾生禳脫眾難𤣥通天政伏御地祇束縛魔靈不但卻死亦能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過九天消災散禍諸天大神齊到禳除厄難暗宿陰曜𤣥天神首孛戾凶怪將臨命限齋心祈懇永斷衰殃數極劫終魂神受度上昇朱宮格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經惠澤滋洋生類蒙福重災巨厄淸蕩捐釋皆卽受度飛昇南宮世人受誦則延壽長年後皆得作尸解之道洞神火精鍊骨變仙形神隱顯出入自在棲泊福庭逍遙道域卽得返形遊行太空此經微妙普度无窮一切天人莫不受慶无量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經解禳上世亡魂塜訟鬼官臨注之災斷滅殃傳夜河之役度上南宮七月長齋誦詠是經解禳己身天羅地網九橫凶醜天獄刑害之厄身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經解日月勃蝕天地運否邪源祅𧕏境土國界之災人民毒疫傷犯天絕爲國王帝主君臣父子安鎭國祚保天長存世世不絕常爲人君安鎭其方民稱太平八節之日誦詠是經解禳氣數遷易交變時節之災口舌罪咎禁繫殺傷之厄水火窮衰閉塞之難九宮降神下衞其身本命之日誦詠是經解禳北斗追召生魂死注坎蹇窘辱之災魂神澄正萬氣長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上淸道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐靑黃白三色雲氣之中內外蓊冥有靑龍白虎朱雀𤣥武獅子白鶴羅列左右日月照明洞煥室內十方禳災洞神大神儼對前後項生圓象光映十方如此分明密咒曰无上𤣥元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啟所言今日吉慶長齋淸堂修行至經无量度人願所啟上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經}

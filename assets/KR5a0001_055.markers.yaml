  - {type: variant, offset: 5436, length: 0, content: '', YP-C: 六濟度死魂品道言昔於紫暉玄濟天中綠景虛明大慈靈土受元始度人濟度死魂無量上品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖高尊北酆大帝九幽拔罪天尊金闕濟度天尊太一救苦天尊大慈大悲救苦眞人大惠眞人無鞅數眾乘空而來碧燿流煇華雲映彩龍軿鳳駕寶蓋靈旛彌漫羅列香藹氛氲日月停景洞朗太无九日九夜諸天瓊樓玉闕雲殿霞房一時同明下極崑崗三山十洲四海九河泉曲之阿酆都寒庭長夜之關悉被神光普獲開煥萬象澄淸十天昭廓一國地土山川林木緬平一等無復高下地成紺碧無有異色眾眞侍座元始天尊玄坐空浮瓊光洞陽寶牀之上說經一遍諸天大聖同時稱善是時天地山嶽鐵城大獄自然齊啓咸釋罪爽來聽法音說經二遍鑊湯聲震忽變淸涼水吐靑蓮異氣芬馥萬刃刀山悉爲寶樹杻械銷鎔骨骸生復還得成人俱承道蔭說經三遍仙聖讚揚靈瑞咸臻說經四遍一切人民悟解法要說經}

  - {type: variant, offset: 5437, length: 0, content: '', YP-C: 遍昆蟲善慧省識罪原說經六遍虎狼毒蝮滅斷惡根說經七遍𡨚和解釋異骨成親說經八遍鬼道塞絕永保生津說經九遍幽沈滯魄鍊化昇遷說經十遍道德純一俱登妙眞是時一國有情有識冥不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品考較濟度大神無鞅之眾浮空而至說經二遍南方無極無量品司察濟度大神無鞅之眾浮空而至說經三遍西方無極無量品司禁濟度大神無鞅之眾浮空而至說經四遍北方無極無量品司化濟度大神無鞅之眾浮空而至說經五遍東北無極無量品典獄濟度大神無鞅之眾浮空而至說經六遍東南無極無量品九幽濟度大神無鞅之眾浮空而至說經七遍西南無極無量品泉曲濟度大神無鞅之眾浮空而至說經八遍西北無極無量品羅酆濟度大神無鞅之眾浮空而至說經九遍上方無極無量品超生濟度大神無鞅之眾浮空而至說經十遍下方無極無量品昇化濟度大神無鞅之眾浮空而至十遍周竟十方無極天眞濟度大神一時同至一國男女傾心歸仰來者萬億並駕同驅靈光散彩華霧彌空八部六天三官九署威光召致異趣苦魂無鞅之眾迮國一半土皆偏䧟非可禁止於是元始洞觀遐邇哀念眾生手執寶翇翇出妙光光及十方一切聽法天仙聖眾自見身相有如瑠璃內映濯羅鬼神魂爽各於其類中得圓滿心體淸淨業火消除仙花時飛大震瓊音宣明法要爾等眾生造諸罪惡累彼死魂飄蕩無依散入諸趣備經輪轉莫測道緣今以九陽神霄大梵之氣化十二靈文濟度死魂超昇天境始從亡歿以鍊屍形屍神守骸滯爽超昇仙聖合德還自成人出離三塗往度八難大眾欣躍仰俟恩光於是元始引眄惻然鑪炷寶香上結密雲化爲玉闕去地九丈內垂天虹熒煌五色接待大眾俱入其中元始申命拔罪天尊羅酆帝宰救苦眞人無鞅數眾同升化闕蘂華紫玉靈妙之臺天人仰看惟見勃勃影現萬殊旣入玉闕不知所在國人廓散地還平正無復欹䧟元始卽於紫臺之上說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂無遺響是時天人遇值經法普得濟度全其道眞無有沈淪傾土歸仰咸行善心不愆不犯不忿不爭不迷不忘不愛不著不擾不驚言必眞正口無惡聲齊恩慈愛道化合并存亡安泰度樂生榮經始出教幽顯協德預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是眞王內諱百靈濟度之隱名也非世之常辭上聖已成眞人通玄究微能悉其章誦之十過諸天遙唱萬帝設禮沈逝死魂證升仙品緣愛積習皆獲蛻捨羣魔敬衞蕩化鬼精至學之士誦之十過則四司釋訟九獄除𡨚回屍起死白骨返形普受濟度以得生成所以爾者學士誦詠寶章招眞召靈妙氣來臻道生神德故可下濟死亡卽獲超度而已莫不昇遷輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人無量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到酆都六洞鬼帝官君寒庭泉曲幽夜之河泰山地壘主宰神靈簡奏上功超拔罪魂億曾萬祖幽沈苦爽皆卽受度上昇朱宮格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經皆卽受度飛昇南宮世人受誦開度九玄出離地獄生福天堂延慶後昆永無身殃此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役陰官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經濟度死魂解釋天官罪考之愆五方大殺屍劫之鬼威毒咸息開貸死魂獲度南宮逍遙自然七月長齋誦詠是經濟度死魂解釋地官罪考之愆五嶽四司北都羅酆曠野山澤社令城隍應關囚對禍害滅連黑簿削除白簡上生十月長齋誦詠是經濟度死魂解釋水官罪考之愆北海河侯河伯溟泠四瀆主宰當令幽苦摙汲冥魂役難散除度越生門八節之日誦詠是經濟度死魂解釋罪考八方大獄八洞鬼牢悉承道化永變福庭迷識開悟咸登妙津得生世間智用高明務勤上學克致成眞三元之日誦詠是經濟度死魂各遂其情鍊度南宮返生受靈魂神澄正萬氣長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上淸道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐靑黃白三色雲氣之中內外蓊冥有靑龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室內項生圓象光映十方如此分明宻咒曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啟所言今日吉慶長齋淸堂修行至經無量度人願所啟上徹徑御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經}

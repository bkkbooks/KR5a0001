  - {type: variant, offset: 0, length: 2138, content: 靈寳無量度人上品妙經卷之五十四宙四斬馘不祥品道言昔於始青天中紫陽泛歌大福樂土受元始度人斬馘不祥妙品元始天尊當說是經周廻十過以召十方始當詣座天眞大神上聖髙尊妙行眞人靈威神王黑天玉京大將斬邪馘毒威兵巨魁伏魔誅䰟都吏無鞅散衆乗空而來寳雲接天明霞履海瑶車玉輪珠景垂䕃飛華妙光疊彩葱薈森映碧空三日三夜諸天宫殿山川谿谷混交九色三辰定照五斗停機四極運明神烟澄霽一國地土都鄙人物遞相鑒燭萬身入於一身一影普涵萬影色空同顯神氣合冥遐邇若等無復髙下土變柔碧洞徹九虚衆眞侍座元始天尊玄坐雙景廻旋神龍天寳之座說經一遍諸天大聖同時稱善是時一國男女天身淨睦妙香飄馥說經二遍天境髙嚴九霄散縟說經三遍沆露凝珠寳林綴網說經四遍天籟成音瓊金流響自然法唱讃詠冲玄說經五遍水光湛瑩海嶽呈祥說經六遍飛仙揚花彌空錦色說經七遍靈威降世掃滅祅氛說經八遍三界䝉福人道安寧說經九遍六氣順常三災消殄說經十遍天眞下濟說法度人是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品靈威勑法大神無鞅之衆浮空而至說經二遍南方無極無量品靈威斬祅大神無鞅之衆浮空而至說經三遍西方無極無量品靈威斬鬼大神無鞅之衆浮空而至說經四遍北方無極無量品靈威斬精大神無鞅之衆浮空而至說經五遍東北無極無量品靈威典獄大神無鞅之衆浮空而至說經六遍東南無極無量品靈威斯邪大神無鞅之衆淨空而至說經七遍西南無極無量品靈威飛符大神無鞅之衆浮空而至說經八遍西北無極無量品靈威吐毒大神無鞅之衆浮空而至說經九遍上方無極無量品靈威九首大神無鞅之衆浮空而至說經十遍下方無極無量品靈威殺伐大神無鞅之衆浮空而至十遍周竟十方無極靈威大神一時同至一國男女傾心歸仰來者有如歸雲歛霧無鞅之衆遍滿一國咸覬和寧斬馘群醜不祥捐蕩境字鎭清駢呇凝瞻非可禁止於是元始天尊於眉間示現金色光明色光宛轉於其光中化岀十方宫殿戸牖敞對重堂巍閣光氣同流冉冉浮空去地五丈也元始登引天眞大神上聖髙尊妙行眞人十方無極靈威大神無鞅數衆倶入化宫之中天人仰看惟見勃勃從化宫金光中入旣入光中不知所在國人廓散神宮流轉勢如旋虹元始即於其内說經都竟衆眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度邪正道分斬魔馘祅蕩滅不祥傾土歸仰咸行善心正智正道正神正念正思正意正力正威正行正儀言詞朗直口慧和聲齊同慈愛異骨成親國安民豐欣樂太平正教開廓魑魅馘平道妙至眞悉廣明心寳奉宗禮皆得度世道言元始天尊說經中所言並是諸天上帝正眞内名隱韻之音亦是十方靈威神王内諱斬馘不祥之隱名也非世之常辭上聖已成眞人探妙極微能悉其章誦之十過諸天命靈八威鼓氣神官執剌魔帥禀章綱緯合軌元魁吐暉邪精滅迹鬼徒䘮形正道通心眞光衛䰟陽施至德死而更生至學之士誦之十過則九天䇿名五帝給乗三元備兵惡注逃殞生功充盈邪關杜塞赤書降庭福源自布災殃不經所以爾者學士感徹玉清高上遐鑒羽葆列營召制十方威被六天道爲太極所仰萬靈咸尊已試無難固守黄寧地祇敬伏攝御魔靈辟除災病永與生存輕誦此章削落胎元神盧圯摧七魄蹈揚供養尊禮門戸興隆霄京降契福䘵共滂大帥秉鉞斬馘不祥世授道德孫葉茂昌慶善相因萬災伏藏斯經尊妙獨歩玉京度人無量爲大法之宗巍巍正氣天德自勝道言凡誦是經十過諸天齊到神綱五斗巨天斬馘天騶甲士威南巨兵五天大帥部率十方靈威河魁大神銜符操鉞即至其所摉捕九醜暗澤幽川古空巫祠一切祅魅及以䰟爽依附木石潜遘生人誣訟三官覬伺禱祭四目大呼神虎奮翅毒獸舉牙擲火激電斬首馘耳世之不祥應皆蠲蕩也上學之士修誦是經青房大神鳴鈴以却穢紫戸將軍引劔以辟魔玉女叩瓊於九室黄老振音於三素也世人受誦則延壽長年黄庭之下戸白雲之窮閭泉曲寒池萬鬼弭蟄腎海不波水怪竄迹上宫唱善三府樂玄後皆得作尸解之道魔鬼不得而徴呼地司不得而攝録神氣藴形自成法體魔精受鍊飛行太空此經微妙普度無窮一切天人莫不受慶天界五魔中元五尸地司五考永斷不祥長保元吉無量之福生死䝉惠上天所寳不傳下世至士齎金寳效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衛神文保衛受經者身道言正月長齋誦詠是經召攝北清洞隂尊神部督神兵奏詣上宫七月長齋誦詠是經召攝中天五帥三界大魔紫微帝君統按百神滌蕩邪源掃滅祅氛十月長齋誦詠是經召攝六天洞臺之靈三官曹局考䰟大神執御八山勾鎻勑殺大神九首龍君斬馘故氣不祥窮䰟五殟疫毒土木百精害於生類羗夷鬼神使國界安寧人民遂成國王帝主君臣父子安鎭國祚保天長存世世不絶常爲人君安鎭其方民稱太平八節之日誦詠是經召攝八天大威烟火洞熏太一八神八殺靈君領駕風雲遊盻九宮孤虚竒門斬馘不祥無使亂程本命之日誦詠是經召攝三眞升入泥丸斗極紫烟中黄上眞口吐青華鎭兆等身三尸消落殃疰枯焚黑結白姧斬伐無停三帝紀功七眞運靈神童導前身有光明三界侍衛五帝司迎萬神朝禮名書上夭功滿德就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黄白三色雲氣之中内外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右三天直事左右兵吏殺鬼使者斬馘天騶森然備衛日月照明洞煥室内項生圓象光映十方如此分明宻呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始無量度人上品妙經, CK-KZ: ''}

  - {type: variant, offset: 67, length: 2291, content: 鞅數衆乗空而來玉馬雲軺彩霞流靄丹輿彤轂陣蕚飛香三景蔚清合映太空七日七夜諸天日有龍文月呈寳字星樓鶴觀宿舍機𨇠一時停輪龍風兼雨鳳氣成山天無浮翳四象髙明一國地土山川林木緬平一等無復髙下土軟紫金外涵水火淨瑩交徹無有異色衆眞侍座元始天尊玄坐空浮無色海光之上金山不動瑞相儼如說經一遍諸天大聖同時稱善是時一國男女見道眞形猒捨生死說經二遍覺悟三業猶彼火聚說經三遍觀身穢壞願證法體說經四遍悲憫三界轉覆如輪說經五遍世間妄見回念正道說經六遍道可飛神不染麤惡說經七遍自知宿命不貴通靈說經八遍住此眞常永斷輪轉說經九遍壽過天地得眞長生說經十遍證位昇玄永無生化是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方无極无量品多聞大神無鞅之衆浮空而至說經二遍南方无極无量品多目大神無鞅之衆浮空而至說經三遍西方无極无量品堅住大神無鞅之衆浮空而至說經四遍北方无極无量品定海大神無鞅之衆浮空而至說經五遍東北无極无量品神用大神無鞅之衆浮空而至說經六遍東南无極无量品權化大神無鞅之衆浮空而至說經七遍西南无極无量品道聦大神無鞅之衆浮空而至說經八遍西北无極无量品玄藏大神無鞅之衆浮空而至說經九遍上方无極无量品永生大神無鞅之衆浮空而至說經十遍下方无極无量品息化大神無鞅之衆浮空而至十遍周竟十方無極天眞大神一時同至一國男女傾心歸仰於所住天所居宮殿咸見元始升座威儀說經演法无量十方光明照見宫殿赫如朝日各相謂言我等位證諸天未岀輪轉壽過五劫未免生死身相光明未免衰滅今聞天尊欲說大法永斷輪轉始得開悟入眞法門出生死網來者有如細雨宻霧無鞅之衆迮國一半土皆偏䧟非可禁止於是元始振衣凭几頂出大明普照十方世界無極仙眞國土一一國中見諸僊王將引臣從來赴法席又見諸天各持竒華異果玉芝仙草以爲供養有諸仙王居大宫殿而修仙業領理天政心猒欲樂或奔采光華嚥味眞景勸敎諸眞種種妙事會中天人心知目矚不敢陳議元始徐啓雷音遍告大衆欲免生死不入流浪先當無心爾若無心即無三業衆生迷妄指識爲心分别有無計度生死心本妄名以妄取名心則虚幻覺了能知本是道元何關心事認心著境即住生死若無妄心不住生死即永斷輪轉乃至諸大天僊髙眞帝王以無心故證位聖眞自然得道依心取捨趣死趣生終非究竟乃至服氣鍊化餌藥延年並爲小乗功用感應皆非解脫昇入無形之道爾若不爲心所遷易隨念用情心迹兩忘即見道體永斷輪轉不住生死與我今者在此無色海光說如是法若以有心則一切護法天人龍鬼悉各逺離不應來此頂禮欽奉故知無心是道眞形是無等法則身所行事十聖莫知口所出言是天帝勑心若計度則魔精來附終歸惡道元始忽從海光混入無色太玄空中懸一寳珠大如黍米在太虚之中去地千丈元始登引天眞大神上聖髙尊妙行眞人十方无極大道威神無鞅數衆俱入寳珠之中天人仰看惟見拂拂從珠口中入旣入珠口不知所在國人廓散地還平正無復欹䧟元始即於寳珠之内說經都竟衆眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得開悟玄黙虚明不著空見傾土歸仰咸行善心不殺不害不嫉不妬不淫不盗不貪不欲不憎不𡜍言無華綺口無惡聲齊同慈愛異骨成親國安民豐欣樂太平經始岀教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝内名隱韻之音亦是眞王内諱百靈之隱名也非世之常辭上聖已成眞人通玄究微能悉其章誦之十過諸天遙唱萬帝設禮雲烟靜黙海嶽深靈二象澄廓三景輝明一切有情心契眞道永斷生死輪轉休停至學之士誦之十過則五帝侍衛三界稽首魔精䘮眼鬼祅滅爽神飛形固遂其永生所以爾者學士穢氣未消體未洞眞召制十方威未制天政徳可伏御地祇束縳魔靈但濟兆身而已不能普度群靈輕誦此章身則被殃供養尊禮門户興隆世世昌熾與善因縁萬災不干神明護門斯經尊妙獨歩玉京度人无量爲萬道之宗巍巍大範徳難可勝道言凡誦是經十過諸天齊到三界停輪兆得至眞明曉生根不著有無不滯亡存若有大物爲生死門兆無物相混洞不分永斷輪轉與道杳冥億曽萬祖幽䰟苦爽皆即受度上昇朱宫格皆九年受化更生得爲貴人而好學至經功滿徳就復歸無名出離隂陽無犯剋并不屬生死永斷輪轉變化不化更生不生與道合體皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經皆即受度飛昇南宮世人受誦則延壽長年廓爾得悟玄解之道神識不昧應物無窮即得運形遊觀太冥此經微妙普度含靈一切天人莫不受慶無量之福生死蒙惠上天所寳不傳下世至士齎金寳效心盟天而傳輕泄漏慢殃及九祖長役考官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齋誦詠是經契道眞極止息生機於諸天中無去來因不住滅定得大乗門爲上世亡䰟斷地逮役度上南宮七月長齋誦詠是經惡心消解仇對和平不爲人縁徃返相因寓形黜明元精天成不死不生身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經不住永滅不欣長存乗物以遊爲光爲塵示兆大慈无量度人出教演法寳書天經爲國王帝主君臣父子安鎭國祚保天長存世世不絶常爲人君安鎭其方民稱太平八節之日誦詠是經挺然獨觀八風無傾兆出死生駕馭瓊輪得爲九宮眞人本命之日誦詠是經眞氣虧盈不亡不存永斷輪轉逍遙妙庭䰟神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿徳就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐黃緑青赤蒼黑碧紫白九色雲氣之中內外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右頭上有无无上眞道君頂七曜交泰寳冠面若瓊瑶方瞳素髯威耀光明身被緑霞絳章飛裙手執神劒斷生死魔三天殺鬼乗紫素雲住立嶷然身長九尺上應九眞日月照明洞煥室内項生三氣圓象光映十方如此分明密呪曰无上玄无太上道君召岀臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋清堂修行至經无量度人願所啓上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始无, YP-C: ''}

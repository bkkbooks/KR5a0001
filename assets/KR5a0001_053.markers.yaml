  - {type: variant, offset: 5192, length: 0, content: '', CK-KZ-jye: 元始無量度人上品妙經卷之五十四道言昔於始靑天中紫陽泛歌大福樂土受元始度人斬馘不祥妙品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖高尊妙行眞人靈威神王黑天玉京大將斬邪馘毒威兵巨魁伏魔誅䰟都吏無鞅數眾浮空而來寶雲接天明霞覆海瑶車玉輪珠景垂蔭飛華妙光疊彩葱薈森映碧空三日三夜諸天宮殿山川谿谷混交九色三辰定照五斗停機四極運明神烟澄霽一國地土都鄙人物遞相鑒燭萬身入於一身一影普涵萬影色空同顯神氣合冥遐邇若等無復高下土變柔碧洞徹九虛眾眞侍座元始天尊𤣥坐雙景迴旋神龍天寶之座說經一遍諸天大聖同時稱善是時一國男女天身淨睦妙香飄馥說經二遍天境高嚴九霄散縟說經三遍沆露凝珠寶林綴網說經四遍天籟成音瓊金流響自然法唱讚詠冲𤣥說經五遍水光湛瑩海嶽呈祥說經六遍飛仙揚花彌空錦色說經七遍靈威降世掃滅祅氛說經八遍三界蒙福人道安寧說經九遍六氣順常三災消殄說經十遍天眞下濟說法度人是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品靈威勅法大神無鞅之眾浮空而至說經二遍南方無極無量品靈威斬祅大神無鞅之眾浮空而至說經三遍西方無極無量品靈威斬鬼大神無鞅之眾浮空而至說經四遍北方無極無量品靈威斬精大神無鞅之眾浮空而至說經五遍東北無極無量品靈威典獄大神無鞅之眾浮空而至說經六遍東南無極無量品靈威斬邪大神無鞅之眾浮空而至說經七遍西南無極無量品靈威飛符大神無鞅之眾浮空而至說經八遍西北無極無量品靈威吐毒大神無鞅之眾浮空而至說經九遍上方無極無量品靈威九首大神無鞅之眾浮空而至說經十遍下方無極無量品靈威殺伐大神無鞅之眾浮空而至十遍周竟十方無極靈威大神一時同至一國男女傾心歸仰來者有如歸雲歛霧無鞅之眾遍滿一國咸覬和寧斬馘羣醜不祥捐蕩境宇鎭淸駢㳫凝瞻非可禁止於是元始天尊於眉間示現金色光明色光宛轉於其光中化出十方宮殿戸牖敞對重堂巍閣光氣同流冉冉浮空去地五丈也元始登引天眞大神上聖高尊妙行眞人十方無極靈威大神無鞅數眾倶入化宮之中天人仰看惟見勃勃從化宮金光中入旣入光中不知所在國人廓散神宮流轉勢如旋虹元始卽於其內說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂無遺響是時天人遇值經法普得濟度邪正道分斬魔馘祅蕩滅不祥傾土歸仰咸行善心正智正道正神正念正思正意正力正威正行正儀言詞朗直口慧和聲齊同慈愛異骨成親國安民豐欣樂太平正教開廓魑魅馘平道妙至眞悉廣明心寶奉宗禮皆得度世道言元始天尊說經中所言並是諸天上帝正眞內名隱韻之音亦是十方靈威神王內諱斬馘不祥之隱名也非世之常辭上聖已成眞人探妙極微能悉其章誦之十過諸天命靈八威鼓氣神官執剌魔帥禀章綱緯合軌元魁吐暉邪精滅迹鬼途喪形正道通心眞光衞䰟陽施至德死而更生至學之士誦之十過則九天策名五帝給乘三元備兵惡注逃殞生功充盈邪關杜塞赤書降庭福源自布災殃不經所以爾者學士感徹玉淸高上遐鑒羽葆列營召制十方威被六天道爲太極所仰萬靈咸尊已試無難固守黄寧地祇敬伏攝御魔靈辟除災病永與生存輕誦此章削落胎元神盧圮摧七魄蹈揚供養尊禮門戸興隆霄京降契福祿共滂大帥秉鉞斬馘不祥世授道德孫葉茂昌慶善相因萬災伏藏斯經尊妙獨步玉京度人無量爲大法之宗巍巍正氣天德自勝道言凡誦是經十過諸天齊到神綱五斗巨天斬馘天騶甲士威南巨兵五天大帥部率十方靈威河魁大神銜符操鉞卽至其所摉捕九醜暗澤幽川古空巫祠一切祅魅及以䰟爽依附木石潛遘生人誣訟三官覬伺禱祭四目大呼神虎奮翅毒獸舉牙擲火激電斬首馘耳世之不祥應皆蠲蕩也上學之士修誦是經靑房大神鳴鈴以卻穢紫戸將軍引劔以辟魔玉女叩瓊於九室黄老振音於三素也世人受誦則延壽長年黄庭之下戸白雲之窮閭泉曲寒池萬鬼弭蟄腎海不波水怪竄迹上宮唱善三府樂𤣥後皆得作尸解之道魔鬼不得而徴呼地司不得而攝錄神氣藴形自成法體魔精受鍊飛行太空此經微妙普度無窮一切天人莫不受慶天界五魔中元五戸地司五考永斷不祥長保元吉無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衞神文保衞受經者身道言正月長齋誦詠是經召攝北淸洞陰尊神部督神兵奏詣上宮七月長齋誦詠是經召攝中天五帥三界大魔紫微帝君統按百神滌蕩邪源掃滅祅氛十月長齋誦詠是經召攝六天洞臺之靈三官曹局考䰟大神執御八山勾鎻勅殺大神九首龍君斬馘故氣不祥窮䰟五殟疫毒土木百精害於生類羗夷鬼神使國界安寧人民遂成國王帝主君臣父子安鎭國祚保天長存世世不絕常爲人君安鎭其方民稱太平八節之日誦詠是經召攝八天大威烟火洞薰太一八神八殺靈君領駕風雲遊盻九宮孤虛奇門斬馘不祥無使亂程本命之日誦詠是經召攝三眞升入泥丸斗極紫烟中黄上眞口吐靑華鎭兆等身三尸消落殃疰枯焚黑結白姧斬伐無停三帝紀功七眞運靈神童導前身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上淸道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐靑黄白三色雲氣之中內外蓊冥有靑龍白虎朱雀𤣥武獅子白鶴羅列左右三天直事左右兵吏殺鬼使者斬馘天騶森然備衞日月照明洞煥室內項生圖象光映十方如此分明密咒曰無上𤣥元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啟所言今日吉慶長齋淸堂修行至經無量度人願所啟上徹徑御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經}

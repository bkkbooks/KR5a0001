  - {type: variant, offset: 7117, length: 0, content: '', CK-KZ: 寶凝華緬平均等無復高下土皆作瑞雲浮鬱離羅之色眾眞侍座元始天尊𤣥坐空浮八靈九變神圖玉局之上說經一遍諸天大聖同時稱善是時萬界廓淸靈風散煙天發𤣥瑞地發祥應慶會咸臻普及含生說經二遍魔癘滅形丹刻麗空說經三遍災疾消除說經四遍自然靈章映現八虛說經五遍人民達悟符章之因說經六遍敬奉靈文皆獲道眞說經七遍寶章玉書開度無窮說經八遍三光妙氣灌絡形神說經九遍苦魂受化鍊度朱陵說經十遍國祚安鎭永保升平是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方无極度符神王至眞大神无鞅之眾浮空而至說經二遍南方无極度符神王至眞大神无鞅之眾浮空而至說經三遍西方无極度符神王至眞大神无鞅之眾浮空而至說經四遍北方无極度符神王至眞大神无鞅之眾浮空而至說經五遍東北无極度符神王至眞大神无鞅之眾浮空而至說經六遍東南无極度符神王至眞大神无鞅之眾浮空而至說經七遍西南无極度符神王至眞大神无鞅之眾浮空而至說經八遍西北无極度符神王至眞大神无鞅之眾浮空而至說經九遍上方无極度符神王至眞大神无鞅之眾浮空而至說經十遍下方无極度符神王至眞大神无鞅之眾浮空而至十遍周竟十方无極主領神符度符神王天眞大神一時同至一國男女傾心歸仰來者有如雨霧交集无鞅之眾繁積一國地土皆震非可禁止於是元始於其座中凝顧𤣥空運大神力口吐靈文雲篆龍章流金散燿八角垂芒遍於空際離合變化現一寶壇去地九丈下捧華雲元始登引天眞大神上聖高尊妙行眞人十方无極天宮度符神王至眞大神直符將吏无鞅數眾俱登所現寶壇之上天人仰看惟見冉冉從壇四面而升旣登寶壇無不容載國人廓散地還平正復得安靜元始卽於寶壇之上說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂無遺響是時天人遇值經法皆得濟度全其本年除難免傷傾土歸仰普證善緣无憂无惱无疾无殃无驚无恐无厄无患无試无魔言惟道旨心惟道眞齊同和樂異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是五老上帝火鍊光精豁落空𤣥變化之根三元妙氣神祕內名隱韻之音亦是三天內諱百靈之隱名也非世之常辭上聖已成眞人通妙達𤣥能悉其章誦之十過魔王敬仰邪怪滅精氛穢蕩淨道氣合神二燿流景五華受明災癘消散卻死囘生至學之士誦之十過則帝眞鑒祐高宸降軒密授𤣥言寶籙玉文總治鬼魔卻伏禍姦所以然者靈音會於眇淸至理合於元根妙精感激召氣致眞洞化莫窮無所不神輕誦此章身則被殃供養尊禮門戸興隆世世昌熾神符除難萬災不干神明護門斯經尊妙獨步玉京度人無量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到三萬六千神符妙氣八萬四千赤文之精灌注其身身受鍊養結化仙眞格皆九年玉籙定生削除死名億曾滯魄𡨚繫幽沈皆受濟度各獲逍遥遷變生形性識洞悟敬奉微言𤣥功備著昇於九宮超凌太霞逸轡紫淸也上學之士修誦是經九天眞文皆集其眞結絡靈綱入其身中纏羅五臟養育華精延度壽考長生飛仙世人受誦則招集神吏符章從官三光眞宰五氣天君威靈衞護萬禍不干身鍾道氣死不滅眞徑上南宮返化常存此經微妙普度無窮一切天人莫不受慶生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝直符玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經感致上元東極宮中長生玉眞高上帝皇敷降九氣𤣥生之符保度一身九祖沈魂皆獲超脫與道合并七月長齋誦詠是經感致中元西靈太皓宮中寶華上妙至極高尊宣通七氣金光玉符斷除業累卻伏魔精罪結散釋永保淸貞金眞鍊華瓊英內生玉體堅强長生萬年十月長齋誦詠是經感致下元北眞紫皇𤣥上宮中玉宸大道无上元皇垂華散靈惠布五氣天𤣥太符蕩除姦穢掃滅祅凶固衞家國敷佑庶民帝主壽康福祿綿綿德被萬方常保太平八節之日誦詠是經感致八景赤精丹華玉文八威神策靈光妙氣下降身中灌澤九宮三田受眞百痾蠲除萬害塞源羣魔憚伏脫離禍難靑書奏功紫籙紀僊𤣥功偉著昇景上淸道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐靑黃白三色雲氣之中內外蓊冥有六甲直符九宮掾吏度符神王直符將吏羅列左右日月照明洞煥室內項生圓象光映十方如此分明密咒曰无上𤣥元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啟所言今日吉慶長齋淸堂修行至經无量度人願所啟上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經}

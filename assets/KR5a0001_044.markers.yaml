  - {type: variant, offset: 0, length: 2914, content: 靈寶无量度人上品妙經卷之四十四字四洞神禳災品道言昔於太極天中青華安保大真明土受靈寳度人洞神禳災无量上品扶桑洞神大道君當說是經周廻十過以召十方扶桑世界一切眞仙亘太極之東九十萬里碧海之内中有大山根連洞溟金沙重疊貫軸下元上出大无紫空神境西連太極南峙炎陵北定幽門中通玄都而此世界十萬餘里神峯巨嶺隱顯滄浪梵浮瑞光青霞之氣冪冪在上青玉爲城碧林爲宮地凝紺華拱生扶桑根蟠東極枝條相向青碧爲光千葉之上自然天文帝眞赤書九氣鳳文以鎭十方諸天日月下出陽機自運晝夜六時天漠波潮雲濤爭湧仙都人民十二品格百千種物太无三氣化生號青宫扶桑世界元始天尊分神萬天散形千億忽於此方命以扶桑之天青華道境靈冑孕精挺生空洞之極號扶桑洞神大道君外曰扶桑大帝出納太陽賔餞濛汜眞形爲日月之精魂爲南極長生大帝其季次曰青華帝君扶桑育洞神之氣氣變九劫體貌完具東眞道成爲洞神大道君扶桑洞神者九陽眞精之氣也生於扶桑之内化爲劫火更爲明哲辯慧髙聖之德德之至神爲大道之君道君執萬物之母以化生元胎含五行之精以鑪錘天地世之災變必由火殃火爲災本而道有扶桑洞神之祖以御其變扶桑青林之氣大則冶錬眞文増益玄道小則禳災散禍福祐群生比之火然必縁於木木胎蔵火火屬於神神養木中天災自息可禳之道故扶桑洞神大道君爲禳災之主也降於太極始當詣座扶桑眞境道德大神上聖髙尊青帝眞人无鞅數衆乗空而來碧落飛雲青林鬱秀飊輪潜運洞蓋垂華蒼龍妙光迢遥无外流霞丹景混合渺茫七日七夜諸天昭臺日館星闕璣轅一時停軌靈風逺溢海岱明雲天无異色九氣鬱清一國地土山川林木瓊蘂粲芳青文壟起紫璆振響合音空洞扶桑洞神大道君於玄靜之中爲諸生民解禳災厄玄坐空浮紫霄寳光玉座之上說經一徧諸天大聖同時稱善是時一國男女災病普皆消散說經二徧太極天開萬眞同㑹說經三徧仙都揚煙慶周三界說經四徧靈心内通宛識妙體說經五徧龍嗚海空神波逺浹說經六徧三災不作萬物生榮說經七徧神煇同映層闕光明說經八徧五篇雲篆紫籟成音說經九徧玉華飛空重綵交煥說經十徧洞神垂照泉曲蒙恩是時一國是男是女莫不傾心皆受護度咸得長生道言是時扶桑洞神大道君說經一徧東方无極无量品禳災解厄洞神至眞大神无鞅之衆浮空而至說經二徧南方无極无量品禳災解厄洞神至眞大神无鞅之衆浮空而至說經三徧西方无極无量品禳災解厄洞神至眞大神无鞅之衆浮空而至說經四徧北方无極无量品禳災解厄洞神至眞大神无鞅之衆浮空而至說經五徧東北无極无量品禳災解厄洞神至眞大神无鞅之衆浮空而至說經六徧東南无極无量品禳災解厄洞神至眞大神无鞅之衆浮空而至說經七徧西南无極无量品禳災解厄洞神至眞大神无鞅之衆浮空而至說經八徧西北无極无量品禳災解厄洞神至眞大神无鞅之衆浮空而至說經九徧上方无極无量品禳災解厄洞神至眞大神无鞅之衆浮空而至說經十徧下方无極无量品禳災解厄洞神至眞大神无鞅之衆浮空而至十徧周竟十方无極禳災解厄天眞大神一時同至一國男女傾心歸仰來者如赴淵之流應潮之水渺然无際不見端涯无鞅之衆舉國内外或有體用未分因縁爲災智慧不爽法染爲災神氣不合分别爲災道性不明執妄爲災去取空有邪正爲災戀著法身認己爲災貪著神通變幻爲災欲出三界生死爲災識悟大道无作爲災測量元化狂瞽爲災不知洞神隂陽爲災出入胎蔵凡聖爲災凡此十二大災天人大神至學之災也復有世間之災出胎之時業力所轉横側爲災童孺之時驚忤爲災壯歳之時運度爲災營辦之時得䘮爲災修舉之時氣候爲災起居之時疾病爲災有作之時鬼神爲災昩心之時天地爲災負國之時刑戮爲災不孝之時雷火爲災不戒之時天禁爲災汙慢之時夭折爲災潜毒之時隂陽爲災貪徇之時溢分爲災居世之時僞薄爲炎凡此十五大災世所罹犯以至身命喪失五命加臨天星爲殃地司執録三官上奏五帝注尤此等災厄累繫身心咸赴道君廣大法席周帀圍繞瞻望天顔佇聽玉音宣示禳災普利大法於是扶桑教主洞神太上大道君攬日月雲龍之綬轉瑞玉明光之几俯顧大衆欣眄十方倏歘之間分身千億一切衆生各起生縁及諸境界一一衆生皆見己身親對聖身長跪受記撫頂訓言演說扶桑爲生氣之根中生洞神之氣爲萬類之精神一切大災存念洞神正眞九陽之光无災不除滌滅厄害於其㑹中見一道君浮坐紫雲曲䕃扶桑玉章紋葉之下洞神之氣化爲丹林丹林千眞冠劒竦列去地五丈洞神大道君登引禳炎解厄洞神天眞大神韓司主録南宫移度却災順行神君上聖髙尊青華燿寳眞人十方无極至眞大神无鞅數衆俱入神林扶影之内天人仰看惟見勃勃從洞光中入既入林光不知所在國人廓散碧壘砥平神林靜默洞神大道君即於化境之内說經都竟衆眞監度以授於我當此之時喜慶難言法事粗悉諸天復位空洞生神寂无遺響是時天人遇值經法普得濟度全其本年无有中傷傾土歸仰災患消禳清靜本心心既淨正邪道不干星軌淩犯鬼神禍刑三災四殺五行六害七傷八難九厄過度災咎除滅不祥言契中道中无毀非齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉崇禮皆得度世道言洞神大道君說經中所言並是諸天上帝禳災致福隱韻之音亦是魔王内諱禳消萬災之隱
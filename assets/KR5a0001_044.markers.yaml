  - {type: variant, offset: 6735, length: 1, content: 四, CK-KZ: 五道言昔於浩舒天中邃碧幽歌大神樂土受元始度人解禳山谷瘴癘妙品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖高尊妙行眞人大小山谷仙官主宰十方國土列嶽羣仙溪谷泉源鬼神令長直年方域行瘴爲癘神官曹屬部隸攸司无鞅數眾乘空而來從山現出紫軿碧輿飛雲暉映寶輪羽蓋扶華垂廕流明玉光千色蓬勃朗耀𤣥虛七日七夜諸天日月星宿樞衡玉關駐景停輪神風靜默山谷藏雲天鑑鮮瑩和氣八騫一國地土山川林木緬平一等无復高下土}

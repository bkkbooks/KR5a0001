front:
  text: 靈寶無量度人上品妙經卷之三十八黃八
  hash: sha256:e69fa65237daa06ee244300638e8400411f289043cbcd79444ff4cbd0b0e7f6b
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_038-001a, image: hfl/0008/0008-094.png}
body:
  text: 神符除難品道言昔於赤靈丹天耀華明輝八威神闕受元始度人神符除難祕奧妙品元始天尊當説是經周回十過以召十方始當詣座天真大神上聖髙尊妙行真人無鞅數衆乘空而來宸霞映虛翠轂瓊軒華芝寶蓋明彩纏輝萬光蒨燦圎景合鮮五日五夜諸天妙氣交文煥落龍光鳳徊鬱藹自然一時成章靈風爽徹星宿停輪萬景廓奕氛穢消澄一國地土山川林木七寶凝華緬平均等無復髙下土皆作瑞雲浮鬱離羅之色衆真侍座元始天尊玄坐空浮八靈九變神圖玉局之上説經一遍諸天大聖同時稱善是時萬界廓清靈風散煙天發玄瑞地發祥應慶會咸臻普及含生説經二遍魔癘滅形丹刻麗空説經三遍災疾消除説經四遍自然靈章映現八虛説經五遍人民達悟符章之因説經六遍敬奉靈文皆獲道真説經七遍寶章玉書開度無窮説經八遍三光妙氣灌絡形神説經九遍苦魂受化鍊度朱陵説經十遍國祚安鎮永保升平是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊説經一遍東方無極度符神王至真大神無鞅之衆浮空而至説經二遍南方無極度符神王至真大神無鞅之衆浮空而至説經三遍西方無極度符神王至真大神無鞅之衆浮空而至説經四遍北方無極度符神王至真大神無鞅之衆浮空而至説經五遍東北無極度符神王至真大神無鞅之衆浮空而至説經六遍東南無極度符神王至真大神無鞅之衆浮空而至説經七遍西南無極度符神王至真大神無鞅之衆浮空而至説經八遍西北無極度符神王至真大神無鞅之衆浮空而至説經九遍上方無極度符神王至真大神無鞅之衆浮空而至説經十遍下方無極度符神王至真大神無鞅之衆浮空而至十遍周竟十方無極主領神符度符神王天真大神一時同至一國男女傾心歸仰來者有如雨霧交集無鞅之衆繁積一國地土皆震非可禁止於是元始於其座中凝顧玄空運大神力口吐靈文雲篆龍章流金散耀八角垂芒遍於空際離合變化現一寶壇去地九丈下捧華雲元始登引天真大神上聖髙尊妙行真人十方無極天宫度符神王至真大神直符將吏無鞅數衆俱登所現寶壇之上天人仰看惟見冉冉從壇四面而升既登寶壇無不容載國人廓散地還平正復得安靜元始即於寶壇之上説經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法皆得濟度全其本年除難免傷傾土歸仰普證善緣無憂無惱無疾無殃無驚無恐無厄無患無試無魔言惟道旨心惟道真齊同和樂異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊説經中所言並是五老上帝火鍊光精豁落空玄變化之根三元妙氣神祕內名隱韻之音亦是三天內諱百靈之隱名也非世之常辭上聖已成真人通妙達玄能悉其章誦之十過魔王敬仰邪怪滅精氛穢蕩淨道氣合神二耀流景五華受明災癘消散却死回生至學之士誦之十過則帝真鑒祐髙宸降軒密授玄言寶籙玉文總治鬼魔却伏禍姦所以然者靈音會於眇清至理合於元根妙精感激召氣致真洞化莫窮無所不神輕誦此章身則被殃供養尊禮門尸興隆世世昌熾神符除難萬災不干神明護門斯經尊妙獨步玉京度人無量為萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到三萬六千神符妙氣八萬四千赤文之精灌注其身身受鍊養結化仙真格皆九年玉籙定生削除死名億曽滯魄𡨚繫幽沈皆受濟度各獲逍遙遷變生形性識洞悟敬奉微言玄功備著升於九宮超凌太霞逸轡紫清也上學之士修誦是經九天真文皆集其真結絡靈綱入其身中纏羅五臟養育華精延度壽考長生飛仙世人受誦則招集神吏符章從官三光真宰五氣天君威靈衛護萬禍不干身鍾道氣死不滅真徑上南宮返化常存此經微妙普度無窮一切天人莫不受慶生死蒙惠上夭所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝直符玉童玉女各二十四人營衛神文保護受經者身道言正月長齋誦詠是經感致上元東極宮中長生玉真髙上帝皇敷降九氣玄生之符保度一身九祖沈魂皆獲超脫與道合并七月長齋誦詠是經感致中元西靈太皓宮中寶華上妙至極髙尊宣通七氣金光玉符斷除業纍却伏魔精罪結散釋永保清貞金真鍊華瓊英內生玉體堅強長生萬年十月長齋誦詠是經感致下元北真紫皇玄上宮中玉宸大道無上元皇垂華散靈惠布五氣天玄太符蕩除姦穢掃滅祅凶固衛家國敷佑庶民帝主壽康福祿綿綿德被萬方常保太平八節之日誦詠是經感致八景赤精丹華玉文八威神策靈光妙氣下降身中灌澤九宮三田受真百痾蠲除萬害塞源羣魔憚伏脫離禍難青書奏功紫籙紀仙玄功偉著升景上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黃白三色雲氣之中內外蓊冥有六甲直符九宮掾吏度符神王直符將吏羅列左右日月照明洞煥室內項生圓象光映十方如此分明密呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋清堂修行至經無量度人願所啓上徼徑御無上三十二天元始上帝至尊几前畢引氣三十二道東向誦經元始無量度人上品妙經元始洞玄靈寶本章神符除難妙首玉文變化無量十回度人天真隱韻離合自然妙虛八靄大混之初靈光結體朗煥玉都分化三景稟粹七元纏綿至用總括真神摽著符章統御羣靈因符而立因符而行因符而度因符而生符命所告莫敢不從禍難所臨消却無前是為神寶元始玉文赤書內籙八會垂芒威章豁落北帝隱銘天皇鳯璽玄律女青攝邪大檄都匠合明非尸斷滅山怪摧姦紫庭祕奧羅布魁剛屠割鬼爽伏魔洞淵黃籙白簡超鍊苦魂範圍太妙宰制玄虛存亡受度普被無窮中有明光合變之神中有除災散禍之君中有消魔破害大神中有九光三氣丈人中有掌符定籙三光五帝威伐尊神回生起死無量度人今日校録諸天臨軒東方無極飛天神符除難神王長生大聖無量度人南方無極飛天神符除難神王長生大聖無量度人西方無極飛天神符除難神王長生大聖無量度人北方無極飛天神符除難神王長生大聖無量度人東北無極飛天神符除難神王長生大聖無量度人東南無極飛天神符除難神王長生大聖無量度人西南無極飛天神符除難神王長生大聖無量度人西北無極飛天神符除難神王長生大聖無量度人上方無極飛天神符除難神王長生大聖無量度人下方無極飛天神符除難神王長生大聖無量度人十方至真飛天神符除難神王長生度世無量大神並乘景霞緑輿羽明流軿宸耀飛蓋玉精寶輪驂駕驎鳳丹歘靈飊建九光瓊節五氣華旙前嘯簫歌逸響後吹鸞鳳同鳴獅子白鶴音韻噰噰四將啓途玉帝翼轅億千萬乘泛皓凌煙騰輝驚電御化開玄明宸帝氣太微玉宮神綱主宰天靈上卿秉符執籙總會髙清考校天地萬類之情隨品救護三洞敷陳告下十方五嶽神君南丹北幽河海冥原帝命所至風火驛傳禁察祅凶削除罪姦至於長夜罪繫沈魂並令解釋氛穢咸蠲惡魔毒害孰敢當前生根寧極壽保長延神霄紀善青華宥愆寶章流演應會百靈皆受道德陽光鍊真永度三塗五苦八難超升三界遊觀上清上清之天天帝耀靈冥無之境梵行東方八天清祕元漠天帝竺羅啓英遼正訴明天帝元邵齊靈道凝至悰天帝府蔚徐名精務索離天帝明余梵平九墟梵度天帝覺猶光庭朱期符旨天帝祕宛須敕校峯闕天帝呪威越淵鬼符昭印天帝董道仲兵南方八天巖驅杳魂天帝歷沙王宿耶慶句天帝蒲妙光圖都叟裕天帝子侯真生玄利虎延天帝魔定張明斗玉符天帝除海勃陀混元太始天帝素來彥真曜京誅魔天帝神祐元貞玄城數極天帝鹿那容西方八天符離金利天帝弱甫耀昆戚奚鋪極天帝華瀦淵靈延那丘靖天帝玉間願寧太紫限常天帝鄒父近營歐盟俱于天帝密夫冕京資力勝玄天帝屈唐稽和道捨崇和天帝慈勝時遊孤正鷲臚天帝卷用勤登北方八天赤宜洪陟天帝虐龍為牛微元舉天帝玄師冥回童枚孔乾天帝變希常玄卓落辨蔽天帝統監鬼師混常化空夭帝河當灰迷眇忮明儒天帝喬思洞機那羅沖奧天帝滅都好微政奚居浩天帝邈無九期三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻天中之音天中之尊天中之神天中玄符天中之靈五符八策變化上清無量之奧深不可詳敷落神文普度天人今日欣慶受符歷關諸天請滅八難斬絶邪根飛步空常名列太玄魔王監舉無拘天門東斗青簡西斗素文北斗玄綱南斗火鈴中斗神符總監天兵青帝運仁白帝摧兵赤帝破暗黑帝驅精黃帝布命統制萬神青符神王揮英左翊赤符神王炎功破釋白符神王虎牙大嚇黑符神王橫吞跨驛黃符神王雄剛會極三符大神萬魔之尊揚旌揮戟兵騎合驅遊行天界檢察災虞奉命上帝宣布真符隨感應念善士相須與道齊契靈光衛驅玃天神獸鐵額長顱噴煙吐火啖食祅魔直符將吏旋電風行執法功曹威忿列陳作難之鬼幻惑神魂俱令捕録束送溟泠千禍沈消福慶皆臻三元九宮關奏玄清赤章青簡丹書紫文玉綱結斗妙用齊并該集沖氣永固道根空洞玄景赤明之初飛宸煥邈靈光耀敷三元五德至理冥無凝華結氣著象自然杳靄之中現出靈文翩翩耀羅赫奕萬天流金玉霞曲折回旋混成八朗靈芒四騫維持造化神明之元統運隂陽四序之行攝制萬魔威伏鬼精統御上極虛皇髙尊開度至化流演微言彌綸億劫玄治司權天真皇人洞達元根承命制篇解釋形模連貫成章紀録幽樞散布三境藏於五城隨劫顯受拯護生津小大定格參品分名龍章鳳書纏綿長存保仙度真安鎮靈關祅害不起蕩穢合靈敷落妙精育養人身一身受鍊上契清玄玄中有神三景真君五靈玄老太一尊神紫微北帝明威吏官執節奉符保命長延逸轡紫霄升雲駕龍朝拱玉軒接侍陽寥超度三災永脫八難七祖齊仙永離幽泉逍遙朱陵華陽洞臺玄恩普被無所不周浩浩法橋陶育萬生訓悟之科禁戒因緣善道既臻克獲推遷玉符開度神真散煙定簡青華關告諸天諸天之上各有真符中有三天靈音謡歌空洞之章上聖靈篇辭參髙真第一太一洞玄飛符之音赤明開大運妙應顯元皇冥冥空洞中靈文煥萬方輝燦耀神綱八角垂光芒纏羅元梵精隱靄藏神綱結書散萬篇感化無不藏敷落緯至用隨氣騰威光符命所降傳風火馳驛龍蕩滅祅魔迹稟粹神明宗永却八難厄與道同玄功福慶契自然儛輪飛太空第一元始神符泰清大赤天隱諱已下三符並丹妙書白箔過厄難百試佩服貼並同用第二太一洞玄度符之章八會三元氣宸華煒萬篇虛微該妙頥太一秉玄權元始垂金科玉律按格言隨功佩帝真衆害咸滅蠲神霄察善録定簡青華編摧遏羣魔鋒試敗不得行黃老保命基桃孩固百神哀此紅塵子夭喪迷玄津惟我髙宸師與世為梯衡運度無窮極三天散玉文萬劫保至道億兆無沈淪第二元始神符上清禹餘天隱諱第三太一洞玄化符之歌玉綱凝太眇靈輝散景敷煥落髙上文纏羅結八區紫極洞之體皇人按筆書衆道分氣化千篇保萬殊神虎制大魔金光却百邪總命清微館天職奉玄圖法治垂真範大格法幽樞混變齊一德咸歸無上居寥寥隱韻歌奕奕昭皇虛嘯詠契靈會我道長相扶輕飛駕緑軿旋轡登雲衢第
front:
  text: 靈寶無量度人上品妙經卷之十四地四
  hash: sha256:fd7ae668eb96d4420ed2c9877a7a7f35053d8e7a77375c85116bd440bdad9f57
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_014-001a, image: hfl/0003/0003-134.png}
body:
  text: 日精陽明品道言昔於赤明天中紫陽空歌大寶光土受元始度人日精陽明無量上品元始天尊當說是經周回十過以召十方始當詣座天真大神上聖髙尊妙行真人洞陽日宫帝后𡣕妃日中天官仙民無鞅數衆乘空而來絳雲丹霄緑輿瓊輪華蓋垂䕃日精陽光九色鬱勃洞煥太空七日七夜諸天星宿飛精垂芒交輝射映空極神宫虛定天樞止旋玉璣金𢖍端凝佇息神風靜默山海藏雲天景陽明氣流炯清一國地土山川林木緬平一等無復髙下土皆作紅玉無有異色衆真侍座元始天尊玄坐空浮九龍陽明爓珠寶山法座之上說經一遍諸天大聖同時稱善是時一國男女仰瞻日精燦華九道陽明霞氣分布諸天信此真精為萬物之祖說經二遍日中宫殿見千寶色天仙衆民咸歸正道說經三遍日中世界剛風所持獨立空際周行無窮說經四遍瓊軸駕雲紫金光聚下照無邊秀熟品物說經五遍天文大梵俱見日中字皆回旋霞芒曲折隱語深祕悉得洞悟說經六遍洞陽之氣九百萬丈下臨八極賢聖金寶憑氣生成說經七遍洞陽識明照徹幽夜白骸寒骨抑被溫曦隨明上登出離冥海說經八遍朱光四披玉石含精陽魂感接皆變丹英說經九遍洞室巖嶺栖真隱仙引景奔晨祖根開泰說經十遍日精停瑞萬品凝滋金液渙洋槁朽成寶是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品日中青帝大神無鞅之衆浮空而至說經二遍南方無極無量品日中赤帝大神無鞅之衆浮空而至說經三遍西方無極無量品日中曰帝大神無鞅之衆浮空而至說經四遍北方無極無量品日中黑帝大神無鞅之衆浮空而至說經五遍東北無極無量品日中黃帝大神無鞅之衆浮空而至說經六遍東南無極無量品日中鬱儀赤飈大神無鞅之衆浮空而至說經七遍西南無極無量品日中鬱儀紫晶大神無鞅之衆浮空而至說經八遍西北無極無量品日中鬱儀炎象大神無鞅之衆浮空而至說經九遍上方無極無量品日中鬱儀金藏大神無鞅之衆浮空而至說經十遍下方無極無量品日中鬱儀陽明大神無鞅之衆浮空而至十遍周竟十方無極日魂帝君天真無量大神一時同至一國男女傾心歸仰各各相謂共為議言我等夙以福因久承道力生居道境獲在日月之上但知乘光流景煥耀諸天激奔海嶽宫室圓林皆成真金微妙之色今日元始示我日精陽明之法淘澤重陽嘻吸華彩至陽浹髓骨肉成金而三元九氣覆育品物自非日精不能餔飼至學之士外鍊金石調制水火日月有數造化克靈內養一形日為心象日中之氣洞照百關三萬神童奔陽浥景日為火龍産成玉液胃為土釜元火烹鎔千日布功立成真道我所知者法之邊徼元始所宣定當隱奧願聞上法開我障山來者有如細雨密霧無鞅之衆迮國一半土皆偏陷非可禁止於是元始四觀大衆周覽會中出紫金光明臂約九色洞霄火玉離羅之服引手而出以大神力長三十三萬里下摘日輪如攀甘果亭亭火色光遍十方來自空玄日輪圎瑩內有山林河海宫殿城闉無量仙民逍遙自在如寶琉璃中含金色一會天人咸皆近覩於是元始以此日輪變成寶珠大如黍米在空玄之中去地九丈元始登引天真大神上聖髙尊妙行真人日中帝后無量大神無鞅之衆俱入寶珠之中天人仰看惟見拂拂從珠口中入既入珠口不知所在國人廓散地還平正無復𣣱陷元始即於寶珠之內說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人直遇經法普得濟度全其本年無有中傷傾土歸仰咸行善心明道明真明法明戒明經明理明隂明陽明神明氣言合洞章口無妄聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是日中上帝內名隱韻之音亦是日官內諱陽明之隱名也日為三氣之元衆陽之父仰之神仙無極引之天谷虛盈中生紫真存之滅尸鍊魂向之九霞注靈造化因之而得神聖用之而明非世之常辭上聖已成真人通玄究微能悉其章誦之十過祥光顯瑞五帝設禮神鳥扇赫金精騰耀赤車停輪丹輞不行群魔束形鬼精滅爽回尸起死白骨成人至學之士誦之十過則五帝侍衛三界稽首陽明洞照流火熾然魔精喪眼鬼祅滅爽濟度垂死絶而得生所以爾者學士穢氣未消體未洞真以制日精威未制天政德可伏御地祇束縳魔靈但却死而已不能更生輕誦此章身則被殃供飬尊禮門戶興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人無量為萬道之宗巍巍大梵德難可勝道言凡誦是經十過陽明降仙日闕轉機九隂開翳泉戶生光億曾萬祖幽魂苦爽皆即受度上升朱宫格皆九年受化更生得為貴人而好學至經道日捐隂九陽鍊質神光入心心如朝暉五藏成金皆即受度飛升南官世人受誦則延壽長年後皆得作尸解之道日精浮空紫煙鬱矇神宅清鎮天靈髙冲魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至十齎金寶效心盟天而傅輕泄漏慢殃及九祖長役冥官侍經五帝玉童玉女各二十四人營侍神文保護受經者身道言正月長齊誦詠是經五帝賜籙陽明度魂為上世亡魂斷地逮役度上南宫七月長齊誦詠是經日精流金赤童負瓶飲兆玉醴長存不傾身得神仙諸天書名黃籙白簡削死上生十月長齊誦詠是經日池寫光朱華玉英戲蘂凝露金霞流香為國王帝主君臣父子安鎮國祚保天長存世世不絶常為人君安鎮其方民樂太平八節之日誦詠是經日精混成先天蘊光周行玉京望拜金色仰希陽明得為九宮真人本命之日誦詠是經鎮兆神宫丹轂錦旌隨日以生得道之名魂神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齊戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐九色紫雲之內內外蓊冥有青龍白虎朱雀玄武師子白鶴羅列左右日月照明洞煥室內項生圓象光映十方如此分明密呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齊清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引氣三十二過東向誦經元始無量度人上品妙經元始洞玄靈寶本章日精陽明上品傾光度人百魔隱韻離合自然混洞赤晶無無上真未有天地自古固存月為水胞日為金精日如彈丸黑月胞之狀如雞卯內有五色旋為五暈日居其中月抱其外元氣裏之漸變天地地升于天天合於地其精混沌清濁未分名為胞元天地既開日月分胎日精陽明其數九五以應乾位日升東桑飛龍在天金水分形日精乃成晝升夜降子午為經日圓九萬中有金城洞陽之宫空青之林食其華實與日同壽飛行上清乘剛歷玄元始祖劫化生諸天開明三景是為天根上無復祖惟道為身鬱儀寶章日帝靈書赤文開廓普植神靈無文不光無文不明無文不立無文不成無文不度無文不生是為大梵天中之天瓊池絳臺赤林丹京九龍陽燧上奔日城眇眇劫刃若亡若存土華離便大有妙庭金闕玉房森羅淨霐神霄梵氣周回十方中有日精陽明之神中有南極長生之君中有東極青華帝君中有度世司馬大神中有好生韓君丈人中有南上司命司録延壽益算度厄尊神回骸起死無量度人今日校録諸天臨軒東方元極飛天日中神王長生大聖無量度人南方無極飛天日中神王長生大聖無量度人西方無極飛天日中神王長生大聖無量度人北方無極飛天日中神王長生大聖無量度人北無極飛天日中神王長生大聖無量度人南無極飛天日中神王長生大聖無量度人西南無極飛天日中神王長生大聖無量度人西北無極飛天日中神王長生大聖無量度人上方無極飛天日中神王長生大聖無量度人下方無極飛天日中神王長生大聖無量度人十方至真飛天日中神王長生度世無量大神並乘晨霧蒨燦之雲流鈴丹瓊之輦絳芙彤輪驂駕朱鳳日精火龍建耀羅之節赤珊靈幡前嘯九鳳齊唱後吹八鸞同鳴師子神雀嘯歌噰噰五帝啓途日仙扶轅億乘萬騎浮空而來傾光回駕監真度生金闕丞相南昌上宫韓司主録監生大神執籙把籍齊到帝前隨所應度嚴校諸天普告三界無極神鄉泉曲之府北都羅酆三官九署十二河源上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼群日帝符命時刻升遷北都寒池部衛形魂制魔保舉度品南宫死魂受鍊仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度三途五苦八難超淩三界逍遙上清上清之天玉帝洞明無色之境梵行東方八天帝暉瓊梁天帝總魔威摧九丹耀華天帝篤宴求韶青林振陽天帝玉琅希章日真寶慧天帝澤清守金旦明悟祕天帝精微髙升樂境觀元天帝術陀留蒼野化都天帝洞臯興雲歷軫耀明天帝荔華亭柞南方八天日車彤明天帝光赤瞰赤璣左徊輿神天帝利䝉隱元圓景蔚臺天帝庸熙驛符備神紫興天帝謁幽𣢾幾黃氣陽精天帝遼昊房朱娑帝都天帝皇落持微蘂館雲文天帝璇芳正仙乘陽可周天帝濟剛義沖西方八天絶兵素靈天帝封關誓隂秀樂慶舉天帝肅安基金芒聚霞天帝碧雲凝琚素氣七經天帝鏌丹竒孚資剛行迅天帝役電令神物録資衛天帝眇夷行修律禁斷魔天帝直印羅重蘄仙玉龍天帝青斧到牙北方八天運真布極天帝環樞髙璇保神𢍆宗天帝察理考房日盈都格天帝蹈靈猶光寶霞命真天帝極思建平蓬柱鎖鴻天帝昭損並敷寂常體明天帝連勤奉宗報幾悟元天帝叱底玄元明安順天帝鑄部聃三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻日中之音日中之尊日中之帝日中真皇日中之靈九光十華變化上清無量之奧深不可詳敷落神真普度天人今日欣慶受度降接日真潄霞咽景服御陽明金液銲骨玉漿返神身登寶車為帝髙賔升祖玄堂歷關諸天請滅衆惡斬絶欲根飛度五苦名列太玄東斗輔左西斗弼右北斗殿軍南斗太衝中斗隨輪驂日之後朱闕山聳絳都玉就運精施生世道乃行青帝護魂日精傳肝白帝侍魂日精經肺赤帝飬氣日精鍊心黑帝通血日精退隂黃帝主脾萬物同依青帝神王角奎洪儀赤帝神王迅煙傾離白帝神王素芒炎暉黑帝神王黔玄紫光黃帝神王金靈八翔五帝大神日陽之宗運明虛游飛行鼓從總領神兵麾幢鼓節遊觀太空自號赫奕諸天齊功上天度人嚴攝北酆神王受命普掃不祥炎光吐毒赤甲四張火兵前驅日將仗幡擲火萬里流鈴八衝敢有干試拒遏上真金鉞前戮钁天後刑屠割鬼爽風火無停千千截首萬萬翦形魔無干犯鬼無祅精三官北酆明檢鬼營不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列言上清元洞玉曆太初龍康洞陽氣元胞胎伏藏眇眇億劫混沌之中中如卵形日精赤靈日抱身身得受生上聞諸天諸天之上各有日門鍊隂全陽流火變形日精注凝克為仙真中有空洞謡歌之章真王靈篇辭參高真第一日精陽明飛空之音元始赤精三元賴成朱光照徹色洞幽冥青林金華瓊實熒熒赤城萬里絳闕紅庭五帝無為萬仙列𡖖億民遊散飲光食英后妃玉女燒香奏罌兆能引霞奔神髙清金顔寶𠜍錦旙繡旌前導六甲後從六丁陽明之威隂醜滅形帝錫長生延年久齡上真之道九陽是稱第二日精陽明真王之章日界遊空浮行九宫乘剛獨力周駕神風宇宙金色山海一同萬物賴生三元共功是元始身分形變容九鍊洞陽出先洪䝉朱芒靈烏吐納太沖兆能感之明智靈通靜察逺鑑還老成童而生三景之根金水既坼上下弦分為光明者是日之魂上洞赤色下洞靈淵風澤廓虛大明麗天天上天下無幽無冥無形無影無極無窮𣸉是道遼廓未光赤明開圗運度自然元始安鎮敷落五篇赤書玉字日中瓊文保制劫運使天長存梵氣彌羅萬範開張日精陽明三十二天輪轉無色周回十方旋斗歷箕回度五常三十五分總氣上元八景冥合氣入玄玄日中太皇五帝高真泛景太霞嘯詠洞章金真朗郁流響雲營玉音攝氣靈風聚煙紫景鬱儀日中萬仙日精入身傅降三田錬金為液胚土為鉛鑄入胃爐心火腎泉厥隂鼓橐液流百川碧海神龜吐氣如煙金液傅鼎胎成玉嬰千和萬合自然成真真中有神長生大君無英公子白元尊神太一司命桃康合延執符杷籙保命生根上遊上清出入華房八冥之內細微之中下鎮人身泥丸絳宫中理五氣混合百神十轉回靈萬氣齊仙仙道貴生無量度人上開八門飛天法輪罪福禁戒宿命因緣普受開度死魂生物得感之華秀清蕤丹沙寶玉燦耀瓊芝珠泳雲海鳳栖紫微日精陽明道之真歸我詠無量章保子無凶衰第三日精陽明真王歌曰丹霞飛紫煙瓊輪湧明海扶桑凝金芒萬古色不改故知元始精先天藴淵澮九龍駕陽車倏忽起世外乾坤為合谷三氣亦既濟日月為神丹吸精滅死潰哀此頑滯仙煆石漫成塊胡不引龍轅運液落珠貝穿節連百關日氣破冥昧咀雲碎紅璃飲景以神醉勿測蓬萊水每惜生死對晨本五帝前道袐索玄會此三界之上飛空之中真王歌音音參洞章誦之百遍名度南宫誦之千遍真王保迎萬遍道備飛升太空過度三界位登仙公有聞靈音真王敬形敕制地祇侍衛送迎拔出地戶五苦八難七祖升遷永離冥官魂度朱陵受鍊更生是謂無量普度無窮有袐上天文諸天共所崇泄慢墮地獄殃及七祖翁道言此二章並是日中五帝鬱儀神王隱祕之音昭晣日精陽明濛汜出入霞景濟真之道三界賴之以開明二儀持之以分判兆能納日精之氣披陽明之暉則金華變仙七祖受鍊皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寶祕於玄都髙上神霄玉清王府道君降世隨運流傳若有至人齎金寶質心依舊格告盟十天然後而付焉道言夫天地運度否終日月五星虧盈至聖神人休否末學之夫疾傷凡有此災同氣皆當齊心修齊六時行香十遍轉經福德立降消諸不祥無量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太隂臨過之時同學至人為其行香誦經十過以度尸形如法日精下流陽明開隂骨鍊尸滅氣合天真魂神徑上南宫隨其學功計日而得更生轉輪不惑便得神仙道言夫天地運終星宿錯度日月失暉四時失度隂陽不調國土有災疫毒流行兆民死傷師友命過亦當修齊行香誦經夫齊戒誦經功德甚重上消天災保鎮帝王下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能為天地帝主兆民行是功德有災之日發心修齊燒香誦經十過皆諸天記名萬神侍衛右别至人剋得為聖君金闕之臣諸天記人功過毫分無失天中真王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君撰元始靈書日精陽明中篇東方八天蒼明龍漪略苔泱蔽𡨚漠沙陀極浮蠢齊檀爛蘇曷覷生英妃烈注倪羡龍門狩尸嫣蠱錫野暴濵裒宜詠暢司閣斗環時華薦直芒忽晞靈披鸛獵耿躍眉玄酌微南方八天巢陽暄扶熾真嚴晦寶層報馮鈍剛昌宣婺軸浩雲川獲敏芭映彰弔圖狎光瑶盧智哲採禧抱𢖍存昭幽厥鄙托柱鉛飛吟髙蓋伽賞舍羶琅盆窈岫洞炎驅原華魂西方八天禪猷寂濛潔嶺候涪蹈淩酬緣軸俞昌壽庚途凝栖辦黨喬依聖度越延食總休基酉蕚輦秋由奚覽趨曆籛步稽畫拔屏持邈在玄落茂悅群作遍怙洎拜倫匠舊顙北方八天鎮佃丘㕓玉池慈源海影首逹辰火沇旋璫貟淨寶辟由光迷疆論壯治垂和邀瑰專臒史修白洮淪實耕蘧申虺清監槎排丙綿司彪穆都伴獨持錞敷緒涸鐸變梯道言此諸天中大梵隱語無量之音舊文書日闕長樓赤扉之上以陽鬱儀之光其道至禁為太上不泄之旨萬物為之依息千聖用之遊桓兆能知之招靈採真洞盈泥丸蘂嚲液泄神變成仙九祖受福身浮天雲字皆廣長一丈天真皇人昔書其文以為正音有知其音能齊少其音者諸天皆遣陽明神王下觀其身書其身勤上奏諸天萬神朝禮地祇侍門大功真王保舉上真道備剋得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成天真自然之音也故誦之致神王下觀日帝遙唱萬神朝禮三界侍軒群祅束首鬼精日亡琳琅振響十方肅清河海靜默山嶽吞煙萬靈振伏招集群仙天無氛穢地無妖塵冥慧洞清大量玄玄也元始無量度人上品妙經卷之十四

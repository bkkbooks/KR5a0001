front:
  text: 靈寶無量度人上品妙經卷之十一地一
  hash: sha256:f12e5ef32244691fe5cc4babb3a02064ebff6713b92f528d62f53ad57be3bdea
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_011-001a, image: hfl/0003/0003-004.png}
body:
  text: 玉明運度品道言昔於空碧天中玉霄景明大寶嚴土受元始度人玉明運度無量上品元始天尊當說是經周回十過以召十方始當詣座天真大神上聖髙尊妙行真人無鞅數衆乘空而來紫霞揚暉絳華舒彩鳳輿龍駕雲蓋霓輪蔭景含晶五色洞映煥麗太空九日九夜諸天日月星宿晨霞徊耀駐機停綱玉璇凝光金𢖍息運神風靜籟雲收海嶽六氣順明一國地土山川林木緬平一等無復髙下土成玉明碧無異色衆真侍座元始天尊玄坐空浮寶萼叢金九真鳯氣之座說經一遍諸天大聖同時稱善是時一國男女年壽隆長無有災夭說經二遍水騰火降刑害不生說經三遍六氣調平寰區安靜說經四遍天飛妙香遍空浮蓋說經五遍山澤呈瑞玉瑩珠游說經六遍悟生死根神證真境說經七遍欲界種民盡除塵染說經八遍五運均化萬物茂昌說經九遍天光下矚幽府開明說經十遍普解運度深得法門是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品玉明運度至真大神無鞅之衆浮空而至說經二遍南方無極無量品玉明運度至真大神無鞅之衆浮空而至說經三遍西方無極無量品玉明運度至真大神無鞅之衆浮空而至說經四遍北方無極無量品玉明運度至真大神無鞅之衆浮空而至說經五遍東北無極無量品玉明運度至真大神無鞅之衆浮空而至說經六遍東南無極無量品玉明運度至真大神無鞅之衆浮空而至說經七遍西南無極無量品玉明運度至真大神無鞅之衆浮空而至說經八遍西北無極無量品玉明運度至真大神無鞅之衆浮空而至說經九遍上方無極無量品玉明運度至真大神無鞅之衆浮空而至說經十遍下方無極無量品玉明運度至真大神無鞅之衆浮空而至十遍周竟十方無極玉明運度天真天神一時同至一國男女傾心歸仰遙見元始升座說法散大光明照徹無量諸天世界一國男女及諸天人其數無窮各居一天住一化境各各神聽恭聞天尊玉音響徹宣說微妙玉明運度之法即各相謂而共議言元始天尊今說玉明運度之法大小劫量窮盡之數我知一切天人生死根本悉由運度運度之數本於隂陽隂陽之氣即是生死陽氣為生隂氣為死既從隂陽轉此生形便有生死運度之數我若得道升入無形超過隂陽即無生死及以大劫小劫運度之數我等大衆各各運心齊赴空碧大寶之天請聞至要玉明運度何以修行出離隂陽得免生死證妙有身為大法王度諸衆生出大劫海來者有如細雨密霧無鞅之衆迮國一半土皆偏陷非可禁止於是元始懸一寶珠大如黍米在空玄之中去地五丈元始登引天真大神上聖髙尊妙行真人無鞅之衆俱入寶珠之中天人仰看惟見拂拂從珠口中入既入珠口不知所在元始即見神變珠內廣大含受十方諸天一切國土於大衆中出紫金光明作七種色一一色中出妙香雲遍滿珠內回青蓮目俯眄大衆攬百寶雕龍瑞玉之几德音和暢悅豫而言告大衆曰玉明者天之才名也言此萬天各運度運度不息生死不止一切天人困於有為無為勤勞休息之見墮在運度棄道德海入生死流皆由衆生心有取捨斷習諸見貪欲喜怒入隂陽之煆運度遷易萬生萬死不造無形不識道體我今宣示法要光明運度運度者天地之數也一隂一陽天地之根生死之根氣有終始故有運度之數天數三十年一小變百年中變五百年大變三大變為一紀三紀為大備六千年矣天圓十二綱地方十二紀天綱三百六十日運關一周地紀三千三百日推機一度天運關三百六十周為陽勃三百年地推機三千三百度為隂蝕三萬年也九千九百度則天地氣交為九萬年名曰大陽九大百六為大劫運度小陽九小百六小劫運度亦如之大運度之時天氣窮於太隂即為火地氣極於太陽即為水二氣相反萬物消化然後元氣復合更為混沌此名劫數運度也大劫之未水火之災上至三界之上下極九地之下並得化滅毫末無遺以是隂陽二氣所生故隨二氣化滅三界之上四民之天及我所都三清大羅之城極道之境水火不及災數不至出隂陽生死二氣之外九大運為一劫八十一萬年為大運度九萬年為小劫為小運度大劫運度既終我所流布金文玉字龍章鳳書一切經典皆還大羅玉京混沌重判真文復出聖人流通再傳下世一切衆生能厭生死斷諸染著世間習氣令此神氣妙合太空空體自然不屬隂陽自無生死𢍆此妙空應念現相升入無形運度終盡飛升大羅出三界地永離生死克證道位得為天真方名得道一切衆生以學道故住於小乘或壽限永劫飛行往來分形散影乘駕龍鳳此皆執著未名漏盡大衆聞語皆出三空證上真道國人廓散地還平正無復欹陷元始即於寶珠之內說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸證至真殺害嫉妬淫盜貪欲憎𡜍種種業心悉淪為空不見隂陽不有生死言無畏愛口無願幸齊同慈愛異骨成親國安民豐欣樂太平經始出教預有至心一國以道宗奉禮敬皆得度世道言元始天尊說經中所言並是玉明上帝內名隱韻之音亦是魔王內諱百靈之隱名也知元氣為生死之根見隂陽為生死之門生死所因是由運度運度不起即無生死得道成真體合太空永離生死超淩三界非世之常辭上聖已成真人通玄究微能悉其章誦之十過諸天遙唱萬帝設禮河海靜默山嶽藏雲天關不行地機不動運度休止人得長生群魔束形鬼精滅爽回骸超死白骨成人至學之士誦之十過則五行順常隂陽無傷運修度永福樂壽康魔精喪眼鬼祅滅爽濟度垂死絶而得生所以爾者學士至人氣拘隂陽體未洞真召制十方威未制天政德可伏御地祇束縛魔靈但却死而已不能更生輕誦此章身則被殃供養尊禮門戶興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人無量為萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到運度開光沈滯冥識辭隂希陽億曽萬祖幽魂苦爽皆即受度上升朱宫格皆九年受化更生得為貴人而好學至經功滿德就皆得神仙飛升金闕遊宴玉京也上學之士修誦是經皆即受度飛升南宫世人受誦玉明降氣生道來居則延壽長年後皆得作尸解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死䝉惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏漫殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齊誦詠是經玉明東旋運度丁壬生德開光九真簡名太乙青符拔度幽扃為上世亡魂斷地逮役度上南宮七月長齊誦詠是經玉明西經運度乙庚肅氣結金龜臺浚靈白素玉符鍊治兆形身得神仙諸天書名黃籙白簡削死上生十月長齊誦詠是經玉明北上運度丙辛正氣成龍紫庭命仙帝真玄告輔帝長生為國王帝主君臣父子安鎮國祚保天長存世世不絶常為人君安鎮其方民稱太平八節之日誦詠是經玉明合映運度允寧冲氣分華八門開明神虎赤書䇿號帝階得為九宮真人本命之日誦詠是經玉明保命運度千齡斗宮奏功録兆成真七元寶章星流太淵魂神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齊戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐碧緑白三色雲氣之中內外蓊冥有青龍白虎朱雀玄武師子白鶴羅列左右日月照明洞煥室內項生圓象光映十方如此分明密呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各六十四人關啓所言今日吉慶長齊清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引氣三十二過東向誦經元始無量度人上品妙經元始洞玄靈寶本章玉明運度上品妙首曆數度人百魔隱韻離合自然混洞太無九空道祖元氣內廓玉明映玄元分為二隂陽乃全役氣運神無無上真元始祖劫運度諸天八九六七劫運無窮太隂生火太陽為水五行反傳開明三景是為天根玉明梵景惟道為身運度推移五色乘天玄光成篆火錬為文五色定位流霞結篇五文列象普植神靈無文不光無文不明無文不立無文不成無文不度無文不生是為大梵天中之天鬱羅蕭臺玉明上京上極無上大羅玉清眇眇劫仞若亡若存三華離便大有妙庭金闕玉房森羅淨霐神霄梵氣周回十方中有度人不死之神中有南極長生之君中有玉明運度司馬大神中有好生韓君丈人中有南上司命司録延夀益算度厄尊神回骸起死無量度人今日校録諸天臨軒東方無極飛天玉明主運神王長生大聖無量度人南方無極飛天玉明主運神王長生大聖無量度人西方無極飛天玉明主運神王長生大聖無量度人北方無極飛天玉明主運神王長生大聖無量度人東北無極飛天玉明主運神王長生大聖無量度人東南無極飛天玉明立運神王長生大聖無量度人西南無極飛天玉明主運神王長生大聖無量度人西北無極飛天玉明主運神王長生大聖無量度人上方無極飛天玉明主運神王長生大聖無量度人下方無極飛天玉明主運神王長生大聖無量度人十方至真飛天玉明主運行度神王長生度世無量大神並乘紫蛟瓊色紋蚪慶霄彤雲鳳車龍輦玉蓋金輪驂駕丹鯨玉毛金精之獸建九氣之節十極之幡前嘯洞謡交音後吹梵唱齊鳴仙姬素童鸞歌噰噰三皇啓塗九老奐轅億乘萬騎浮空而來傾光回駕興劫開生推運行度劫運無終驅隂馭陽輪轉死生玉明丞相南昌上宰樞機列真韓司主録監生主死靈魔大神運度數元彌綸六虛水火兵災料别種人執籙把籍齊到帝前隨所應度嚴校諸天普告三界無極神鄉泉曲之府北都羅酆三官九府十二河源上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼羣元始符命時刻升遷北都寒池部衛形魂制魔保舉度品南宮死魂受鍊仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度三塗五苦八難超淩三界逍遙上清上清之天天帝洞虛無色之境梵行東方八天蒼室真符天帝曲臺祕鉉玉靈至玄天帝殿庸就孚寶洞元極天帝伯史頓千正志明仙天帝素綱履微九真義需天帝羊池空平維重華天帝赤師匠威神液鍊珠天帝鎮民具萊清都九龍天帝贊雲次章南方八天彤京降輿天帝浩緒純耀融輝舒真天帝變玄婁堪浩極升炎天帝回俞務元湛定無極天帝略府臯徊咸利開明天帝卓渾斯彊丹靈思真天帝治靜基嚴上簡奏天帝寥區馳光真光梵輔天帝溢爽杜蘄西方八天律檢萬魔天帝輔龍九飈金景浩靈天帝太微丙思素奏曲晨天帝邀夫直闌神虎威章八極天帝堲車翔明度修劫天帝掌覺平瓉登𧵥盟天帝巫雲慈仙陽府禀制天帝梁華美經勑録群魔天帝轉延沙侯北方八天玄靈感華天帝懷昉指濵節車問方天帝彭定思將鍊明玉宸天帝慮慈景遷靈關制神啓隂天帝建兜式南洞白廣功元化天帝衍第嗣羅振景耀光天帝輔章𩒫行北嚴護元天帝學儲佐祠歷度定運天帝超湟敬通三十二天三十二帝六十四重玉明運度周回終始法象綱維隂陽復起劫劫相因生化不息諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻玉明之音玉名之尊玉明之神九陽梵境運度之靈變化上清無量之奧深不可詳敷落神真普度天人今日推演運度理死别生會道之妙無形為真與空為一隱祕常名神變出沒自然之靈過度水火大劫刀兵身有金色堅固無傾欣慶受度歷關諸天請超三空絶隂陽根飛度五戶名列太玄真魔監舉無拘天門東斗受識西斗鑄形北斗禀慧南斗運心中斗大空是道真形青帝顯色白帝明空赤帝動覺黑帝玄通黃帝意運感合變生青運真王木劫諦阿赤運真王火劫部喃白運真王金劫剛嵯黑運真王水劫湮羅黃運真王土劫神丘五運真王萬神之宗抑張運度時刻不容飛行鼓從總領神兵麾旙鼓節遊觀太空威號赫奕諸天齊功超度劫運嚴攝北酆真王受命普掃不祥素虎吐毒天馬四張赤甲前驅大殺仗幡擲火萬里流鈴八衝敢有干試拒遏上真金鉞前戮巨天後刑屠割鬼爽風火無停千千截首萬萬翦形魔無干犯鬼無祅精三官北酆明檢鬼營不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列言上清元洞玉曆紀劫重關肇維元始生育天地混沌成合其數億千自有元氣合混已來其世莫量眇眇億劫爰龍達康玉明圎虛運度相期太一含運其形自然蕩蕩空景大道之元生化二景胞胎兩儀此道至妙世莫之知運度周極玉明成形大氣泛景或浮或沈真土傳之狀如卵圓中行運度萬匝無偏五行之中運度為先玉明為色元氣成淵其理如蒸氣升為露降則為泉神風鼓之鍊為真鉛鉛為金祖以金為天運度左行九萬九千五運成度九萬九千復代於水水行於天九地洑流崑山湧泉天上天下無幽無冥無形無影無極無窮溟𣸉大道遼廓無光赤明開圖運度自然行運合度六氣成天動有差忒萬物否焉玉明之數運度所傳元始安鎮敷落五篇赤書玉字八威龍文保制劫運使天長存梵氣彌羅萬範開張元綱流演六十四天輪轉無色周回十方旋斗歷箕運周四傍回度五常三十五分總氣上元為玉明鄉八景冥合氣入空玄玄空太皇上帝髙真泛景太霞嘯詠洞章金真明郁流響雲營玉音攝氣靈風聚煙紫虛鬱秀輔翼萬仙千和萬合運度周身天運合人自然成真真中玉明長生大君青霞公子東華帝君皓青帝妃白元尊神紫庭太一司命真君桃康合延玉光紫靈執符把籙保命生根上遊上清出入華房八冥之內細微之中玉精流液下鎮人身泥丸絳宫中理五氣混合百神十轉回靈萬氣齊仙仙道貴生無量度人運流八門飛天大梵之輪運旋明晦轉推死生罪福禁戒宿命因緣普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有空洞謡歌之章真王靈篇辭參髙真第一玉明飛空之音寥寥始青萬劫之名染空成碧變玉柔明為九氣毋是諸天根湛然景霄髙映青林上交雲騫枝覆萬天真霞千縷金色萬重是皆天章震撼神風帝真九老神仙真人出沒顯見在此天中一葉寶書八會之言嘯歌洞音以滅萬凶聞此玉明㫖得道無終窮第二玉明運度之章髙清之運九氣為防旋斗歷箕周行五方順生逆死載此百昌五運行度始於隂陽隂陽造化有數有名名數之域生死之程氣之流運三界成輪運度所召流轉無停天堂之樂地獄之苦皆未為道業果所因胡不爾思鍊性如空空無所空妙非形容須㬰億劫千載嬰童超過隂陽出離五運無有生死是真永命我運此章開兆之心世欲汩汩載浮載沈但存兆心量與空合久而自定隱于太漠出為真人福極寥廓坐證髙宸玉池金閣第三玉明真王歌曰九天如壘𠋣此仭臺蕭羅寶層玉關封開華房蘂宫含珠吐茸丹碧萬縷光纒六龍運度綱紀神梵為理玉明蕩蕩中包九清號曰虛皇不夜之庭兆若為真當證無形運度不拘以道為身神通變化惟意所成兆欲知之內去五欲虛光無留與道為儔長生無為真人同遊玉音為此歌用作慈悲舟捨此生死岸上升崑崙丘日月如跳丸安能使人憂此三界之上飛空之中真王歌音音參洞章誦之百遍名度南宫誦之千遍真王保迎萬遍道備飛升太空過度三界位登仙公有聞靈音真王敬形勑制地祇侍衛送迎拔出地戶五苦八難七祖升遷永離三宮魂度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈真王隱祕之音天體玉明自然髙凝運度成劫流浪死生真人獨立邈爾無形不墮諸有不涉智情混洞純一道從是生三境逍遙永劫太平皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寶祕於玄都髙上神霄玉清玉府經堂東室道君行化運當壬辰依科以傳若有至人齎金寶質心依舊格告盟神霄膝行露丹然後而付焉道言夫天地運度否終日月五星虧盈至聖神人休否末學之夫疾傷凡有此災同氣皆當齊心修齊六時行香十遍轉經福德立降消諸不祥無量之文普度無窮道言夫末學道淺或仙品未充玉明氣窮天度終盡運應滅度身經太隂臨過之時同學至人為其行香誦經十過以度尸形如法即太一回旗無英命幡公子度符玉明運還魂神徑上南宮隨其學功計日而得更生輪轉不惑便得神仙道言夫天地運終星宿錯度日月失明四時失御隂陽不調國土歲災兵饑鬼盜疫毒流行兆民死傷師友命過族系殞亡亦當修齊行香誦經夫齊戒誦經功德甚重上消天災保鎮帝王下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能為天地帝主兆民行是功德有災之日發心修齊燒香誦經十過皆諸天記名萬神侍衛右别至人克得為聖君金闕之臣諸天記人功過毫分無失天中真王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君撰元始靈書中篇東方八天瀕陽釜箕嶽直玄萃羌除明梁檀樂卷懟蓬仇仙畿麗璠烈蛻瀹鍊矜瓖房稽來呈閏益果旅瓓琳定迎遍慈侯謀品江條司鍔熾班秀庇場仵基頌南歷乙奔暘蝕微南方八天霞賞烈起汶瀘弼真華師雲篝𠅘洎頓回想芒屢延伯騤辭假液兟殿伾符決霞觀鮑嶧荃侣報瀛冥投注煙翹咸冕童胎算莊僖劫飛峒綿祖𠈉略元清巒月騎由鴈西方八天光編伏壘赫蠢補新窈蕩振索韞龍紀臣儔希輔蒼閲賈實瓊河樞燕庫庭齊止青耀慮勑隨兵圖總籍鉤戈承威火律延力嵩神楚苓閬覩府京宿足斗韓興生遄呼北方八天玄洞逸剛氣車無疆妙指勤旅八景靜昻電口漏脉擎支昆黃賫頒九辰蕭慈孥間逺無聽情寒盧瑩鮮空靈海昌流煙蒙山冪器拱玄喻華詛仙南奎秉神寥放寂顏道言此諸天中大梵隱語無量之音舊文刻書玉明之門中玄左臺天關地機之上以正五劫九成十壞水火金木之運以行三光五辰流演星宮宿舍遲伏留逆之度天運星度以紀劫數大小陽九百六始終之次小極三百六十有五日大極八十一萬或九千九百九十億氣之數天官運籌布算候氣觀象按曆奉圗以知玉明之運度運度畢於隂陽隂陽根於生死生死流轉因隂陽為之駟能釋念於虛滅心於無氣合於漠神合於空兆之介然之形鍊之如素如光如影如風如不可容則身之質礙如蛇有蚹如蜩有翼當委衣而登真也字皆廣長一丈天真皇人昔書其文以為正音有知其音能齊而誦之者諸天皆遣主運度真官下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大真王保舉上清道備克得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成天真自然之音也故誦之致天吏下觀上帝遙唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅清河海靜默山嶽吞煙萬靈振伏招集群仙天無氛穢地無祅塵𡨕慧洞清大量玄玄也元始無量度人上品妙經卷之十一

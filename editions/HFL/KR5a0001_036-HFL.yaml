front:
  text: 靈寳無量度人上品妙經卷之三十六黄六
  hash: sha256:7ccc7e09dad70647f7bf03ac52b387c2a30331f49619c746009b94ba3364f999
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_036-001a, image: hfl/0008/0008-004.png}
body:
  text: 八景神合品道言昔於朱陽天中玄極靈歌太融昌土受元始度人八景神合無量上品元始天尊當說是經周回十過以召十方始當詣座天真大神上聖髙尊妙行真人三元八景大神無鞅數衆乗空而來靈雲敷華寳輿玉軿紫蓋扶蔭神境同光瑞色交朗八道煥明七日七夜諸天八景合映自然千神萬靈㝠洞一氣混化同輪一國地土山川林木煒燿齊鮮髙下彌漫坦平一等土皆浮異彩纏羅之色衆真侍座元始天尊玄坐空浮萬氣穹窿洞景瓊臺之上說經一遍諸天大聖同時稱善是時一國男女欲念永獲斷除說經二遍達悟至真說經三遍識用通玄說經四遍妙和元氣一合其形說經五遍神精凝粹保鎮軀靈說經六遍萬神結華與身齊并說經七遍三宮帝尊朝集神真說經八遍百關固宻宮府相連死户塞絶斷滅胞根說經九遍三部開朗八景齊歸說經十遍神明洞合舉形飛仙是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品至真青景大神無鞅之衆浮空而至說經二遍南方無極無量品至真丹景大神無鞅之衆浮空而至說經三遍西方無極無量品至真素景大神無鞅之衆浮空而至說經四遍北方無極無量品至真玄景大神無鞅之衆浮空而至說經五遍東北無極無量品至真生景大神無鞅之衆浮空而至說經六遍東南無極無量品至真明景大神無鞅之衆浮空而至說經七遍西南無極無量品至真華景大神無鞅之衆浮空而至說經八遍西此無極無量品至真幽景大神無鞅之衆浮空而至說經九遍上方無極無量品至真合景大神無鞅之衆浮空而至說經十遍下方無極無量品至真化景大神無鞅之衆浮空而至十遍周竟十方無極天真八景大神一時同至一國男女傾心歸仰欣躍而言我等各以善因或從道業證遇福縁得居此天獲覩天尊說此八景神合之法上真至化之道非我衆等素所知聞今當聞者必獲位進上真備契玄理而我等昔來未聞此道不識八景神合之妙豈能超合混元大道之宗於是來詣天尊請聞至教有如細雨宻霧無鞅之衆迮國一半土皆偏䧟非可禁止是時元始天尊周覧十方垂顔凝顧揮五明羽扇徐啓玉音彰明法要開顯太極一氣分化判爲三辰離爲八景八景者八方光景自然之神也天之八景有三部以隷三元人之八景有三部以隷三閑故三部八景二十四真爲上道之髙靈修用其道使八景之氣與己神合則混合百神聚爲帝一散爲千真立成髙仙也天之八景上元八景在玉亰蕭臺中元八景在太微紫宮下元八景在崐崘之室人之八景上合泥丸中合絳宮下合丹田各有名字大小服色所居之處能招天景以合人神八景之靈混與神合則爲髙真矣其㫖要玄妙虛明洞徹清靜明照專此八事而修此道無不克臻此八者八景之徳性也兆知勤此陽精八景真神之道則八景之神自降於子授子洞玄長生之真仙矣大衆于時聞是語已再拜稽首願盡至言以教未悟今日慶幸獲聞妙法波我沈𧸃三請不止於是元始化一元精狀如朱日寳華熠燿在空玄之中去地九丈元始登引天真大神上聖髙尊妙行真人十方無極八景大神無鞅數衆俱入朱日之中天人仰看惟見勃勃從寳華中入既入其中不知所在國人廓散地還平正無復欹慆元始即於日華之内說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸行妙心合道合虚合无合神合明合景合照合清合玄合妙情無妄僞性備天真齊同慈愛異骨成親國安民豊欣樂太平經始岀教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝内名隱韻之音亦是三部人景内諱百靈之隱名也非世之常辭兆能長齋修誦八景神合與天爲一七世滅𣧛胞户閉塞上聖已成真人通玄究微能悉其章誦之十過諸天遥唱萬帝設禮心源澄寂害氣消沉洞合人景神真内盈羣魔束形鬼精滅爽廻屍起死白骨成人至學之士誦之十過閑八景挾衛三元稽首魔精喪眼鬼祅滅爽濟度垂死絶而得生所以爾者學士穢氣未消體未洞真存召八景功未克全天政德可伏除魔試却滅災患伹不死而已不能更生輕誦此章身則被殃供養尊禮門户興隆世世昌熾與善因縁萬災不千神明護門斯經尊妙獨歩玉亰度人無量爲萬道之宗巍蘶大範德難可勝道言凡誦是經十過八景齊降殃注斷滅億曽萬祖幽魂苦爽皆即受度上升朱宮格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經智慧開明舍光育英八景神合道契玄庭皆即受度飛昇南宮世人受誦則身中人景固律死門天中八景下合兆形神景齊㑹得道成真延壽長年後皆得作飛升之道魂神變鍊不經地獄哀惱常保孩嬰遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寳不傳下世至士齎金寳效心盟天而傳輕泄漏慢殃及九祖長役幽官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齋誦詠是經上部八景降兆神庭泥丸玄堂七祖超遷度上南宮七月長齋誦詠是經中部八景與兆合并黄元混一天地同靈身得神仙諸天書名青籙紫簡舉形飛仙十月長齋誦詠是經下部八景固兆生根真精鍊化萬炁結神儛輪太霄遨遊上清億世含歡浩劫齊齡八節之日誦詠是經八景神合超登玉亰得爲上清真人本命之日誦詠是經三部八景二十四真混變嬰兒錦衣繡裙列坐泥丸身宮之中魂神澄正萬炁長存百關受鍊身有光明三界侍衛五帝司迎萬神朝禮書名上天功滿徳就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐八色雲氣之中内外蓊㝠有青龍白虎朱雀玄武獅子白鶴羅列左右二十四真來到兆前日月照明洞煥室内項生圎象光映十方如此分明宻呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢別炁三十二過東向誦經元始無量度人上品妙經元始洞玄靈寳本章八景神合上品妙首十回度人八景隠韻離合自然帝氣元真幽寥髙宸冥漠之始空洞靈宗分化結形敷鎮百關三宮布列纏絡廻環混變上境合鍊精根無神不光無神不明無神不立無神不成無神不度無神不生是謂妙極天中之尊玉闕明堂流珠玄丹上衝華極巍峩崐崘紫文纏羅煇煥交騰下通中黄絳宮之門臍元幽室瓊房之田八景神氣周用廻旋中有三部八景二十四真之神中有虛明通徹清靜光照之君中有南極長生大帝君中有東極青華帝君中有度世司馬大神中有好生韓君丈人中有南上司命司録延壽益筭度厄尊神廻骸起死無量度人今日校録諸天臨軒東方無極一景天虚神王長生大聖無量度人南方無極二景天印神王長生大聖無量度人西方無極三景天曜神王長生大聖無量度人北方無極四景天玄神王長生大聖無量度人東北無極五景天符神王長生大聖無量度人東南無極六景天光神王長生大聖無量度人西南無極七景天姥神王長生大聖無量度人西北無極八景天真神王長生大聖無量度人上方無極三部緫真天慧神王長生大聖無量度人下方無極三部神合天順神王長生大聖無量度人十方至真三部八景神王長生度世無量大神並乗華雲流霄寳輿玉駢紫蓋霞輪驂駕素靈神虎蒼精妙龍建玄元之節洞景朱旛前詠三辰華曲後參五曜真歌青鸞翠鳯鳴嘯相和髙仙啓塗玉女翼轅億乘萬騎浮空駕虚傾光廻駕混合人身元皇太一洞房玄宫左持五籍右乗五符三廻九轉洞化㝠无隨景應召開朗八區凝和結氣髙超太無大魔保舉天皇授書普告十極洞府神君開釋祖考億劫沉魂脫除罪籍散落禍根敢有停滯烈火蕩梵身既升度上及億曽永岀夜庭復備形魂普受鍊化度品南宮朱陽紀録仙化成人生身受度劫劫長存隨劫流轉與天齊年永度三塗五苦八難超凌三界逍遥上清上清之天天帝洞昌無色之境梵行東方八天翼真元慈天帝經角司神洞靈開濟天帝恬淵景虚昭素欽宗天帝慶嘉盡玄輔元敢需天帝大極右扶玉履羲常天帝生功被蒼神徳仰真天帝逸車婁玄皇度禮方天帝善回夷陽生幟摽陽天帝主靈達華南方八天玉曆紀功天帝道忻致登雲韜素書天帝七皐無阿八真清明景合天帝孝儀奉仙化及冲要天帝烈常希真赫丹保年天帝妙氣承隅洞廬朝皇天帝絜維志聦抜皐濟靈天帝開明度生璇芳助月天帝蒲都斗皇西方八天㑹氣集景天帝昆堂抱思朝祖欽元天帝越康子明擲干起威天帝運明宥初奮容束魔天帝敕契頗庸受嚴持福天帝覺育自中宣道招靈天帝遜佑孚成啓極司化天帝章瑶兊梵廣審清天帝寅熈融神北方八天披真恭慶天帝昊蕭紫琚錫離崇用天帝鐸時勤應化成功天帝渝塘雲翻壁躔納靈天帝魂度九王析梁緒明天帝仲方竒海暎龍剛天帝蒙長生星井珞璣天帝歷陁麗寧八神合景天帝馘化曜靈三十二天三十二帝諸天隠諱諸天隱名天中空洞自然靈章諸天隱韻八景之音八景之尊八景之神八景真王八景之靈八景神合變化上清無量之奥深不可詳敷落神真普度天人今日欣慶受度神境爲一湛湛真元守而勿疑位登髙仙金顔玉葳虚微不窒明識無虧通導不壅徹運忘機清無滯濁淨無穢氛光華煇明照寂自然神有八道合此八關結化爲形錦帶龍衣神化純妙道遥王階受職東華制命三官永滅衆惡斬絶胎根塞斷死户名列太玄三省監舉無有留難東斗主筭西斗記名北斗落死南斗上生中斗大魁緫監衆靈青帝護魂洞景致真白帝侍魄華景安宅赤帝養氣元景受明黑帝通血慧景朗徹黄帝中主合景備列青天真王青景化神赤天真王丹景曜明白天真王素景混靈黑天真王玄景靜深黄天真王八景齊輪五天真王萬神之宗飛行鼓從緫領神兵麾幢鼓節遊觀太空自號赫奕諸天齊功上天度人嚴攝北酆神王受命普掃不祥神龍攝毒天馬四張辟非前驅天將持幢擲火萬里流鈴八衝敢有干試拒遏上真金鉞前戮玉斧後刑屠割鬼爽風火無停千千截首萬萬剪形魔無干犯鬼無祅精三官北酆明檢鬼營不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列言上清真皇玉訣玄化混㝠斡旋妙氣杳藹之中上景非色下景非淵中景太虚㝠合自然八景神合金剛乗天天上天下無幽無㝠無形無影無極無窮二十四真周環列宮天地始成神帝隱龍溟涬大梵遼廓無光八景開圖三部敷張元始安鎮敷落五篇赤書玉字八威龍文保制劫運使身長存梵氣彌羅萬範開張元綱流演三十二夭輪轉無色周回十方旋斗歷箕回度五常三十五分緫氣上元八景神合氣入玄玄玄中太皇上帝髙真汎景太霞嘯詠洞章金真朗郁流響雲營玉音攝氣靈風聚烟紫虚鬱香輔翼萬仙千和萬合自然成真真中有神八景玉玄神景之尊長生大君無英公子白元尊神太一司命桃康合延執符把籙保命生根上遊上清出入華房八景之内細微之中下鎮人身泥丸絳宮中理五炁混合百神十轉廻靈萬氣齊仙仙道貴生無量度人八景飛神過度輪轉罪福禁戒宿命因緑普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有空洞謡歌之章八景靈篇辭參高真第一八景神合飛空之音天有三元氣人有三部關二十四真神紫戸連青扉上
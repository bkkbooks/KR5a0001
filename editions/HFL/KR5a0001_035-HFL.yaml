body:
  text: 九宮仙籍品道言昔於太碧天中紫霞玄歌太空真土受元始度人九宮仙籍無量上品元始天尊當說是經周囬十過以召十方始當詣座天真大神上聖髙尊妙行真人三元仙籍九宮大神無鞅教衆乗空而來流桑景霄琅輿鳳車羽葆神旛翠輦珠蓋金碧交光九色鬱明洞煥太空三日三夜諸天日月宮府星宿躔次化綱變紀大經彌綸停機息運寥廓沈㝠地踴寳花天敷赤文韶響合奏靈韻生音煇燿上境洞開八門一國地土山川林木緬平一等無復髙下土皆作紫瑶通明瑩徹照映圓羅光熖流晶無有異色衆真侍座元始天尊玄坐空浮神化飛龍羽座之上說經一遍諸天大聖同時稱善是時一國男女心開悟解宻契妙微說經二遍百神聚㑹降體玉英說經三遍生氣交纏合變正道說經四遍圓虚應化五府灌煙說經五遍内運修輪上符天範說經六遍浩刼結滯廓爾消融說經七遍神洞虚明徹見十方說經八遍九宮注籍身飛列仙說經九遍恩沾萬有福及八㝠說經十遍寒夜衆生逍遥離苦是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍上元無極無量品玄都紫微宮正氣大神無鞅之衆浮空而至說經二遍上元無極無量品元黄太極宮合景大神無鞅之衆浮空而至說經三遍上元無極無量品洞白太清宮燿煇大神無鞅之衆浮空而至說經四遍中元無極無量品洞虚清靈宮運功大神無鞅之衆浮空而至說經五遍中元無極無量品南極洞陽宮仙籍大神無鞅之衆浮空而至說經六遍中元無極無量品羅淵導山宮元隂大神無鞅之衆浮空而至說經七遍下元無極無量品青華方諸宮安保大神無鞅之衆浮空而至說經八遍下元無極無量品南水景翛宮元道大神無鞅之衆浮空而至說經九遍下元無極無量品隂天混化宮玄皇大神無鞅之衆浮空而至說經十遍仙府無極無量品考校功過玄籍靈官大神無鞅之衆浮空而至十遍周竟三元九宮二十七府百二十曹主領生化善惡飛天大神一時同至一國男女傾心歸仰元始天尊即以五明寳扇指東南維天光煥赫照燿太空天人隨扇所指仰視神化見一寳山髙聳玉虚廣大難量上有瓊臺玉觀華闕神功羅列天真敬禮元始飛空歩虚謡歌讃歎天尊乃召清微髙上治化玉虛萬寳一品天官黃闕大鎮敷化方輿元㑹二品地官大溟流運廣化九淵玄徳三品水官立於座右三十二天帝君立於座左九天髙聖自然真王立於座前日月五斗經緯列宿元綱大神立於座後曜晶玉極持握彌綸二十五大魔王十方無極飛天大神按部九天儀衛三界神兵瓊花散空天樂互奏導從羽駕飛入東南天中天人仰看惟見億乗萬騎鳳輦龍車炳若繁星難可悉視須臾黃雲四合不復瞻見元始即於東南玉闕之内說經都竟衆真監度以授於我當此之時欣樂難言法事既周萬真復位俄頃之間寂爾無聞是時天民悟此大範普獲濟惠皆得長年永斷沉淪合境歸響咸識生根神真開化標名九宮沖和變氣收伏祅凶物無瘥疹萬彚昭融邪關阖塞正道開通永輔上極威令敷弘世土升平國康民豐經始流布一國演教各運至心宗奉禮敬悉皆度世道言元始天尊說經中所言並是九天自然真王内名隱韻之音亦是三元宮府内諱百靈之隱名也非世之常辭上清開化真人通真悟玄悉𢍆其章誦之十過天官遥唱真公設禮太淵鎮靜神嶽收雲元皇錫教九宮書名大魔伏形羣祅滅景回靈化體杇骨成人妙學上士誦之十過則九官擁衛神帥稽顙鬼精逃遁不敢干犯濟㧞品彚瀹而復升也神州之民初學至道若能依科誦之十過則萬惡消摧千瑞來臨聲參太微道貫紫霄三元執筆注上九宮果備功圓升爲地真也輕誦玉文永劫湮沉崇奉尊禮所願克成世世下教開度含生萬魔不干天真護門斯經隱奥髙祕玉清度人無極爲靈寳之宗巍巍尊妙難可稱量道言凡誦是經十過九宮列曹真吏持生化之簿書下臨監觀削滅羅酆黑籍注名青編祖先幽魂皆得上升流火之庭鍊質召靈爲天種民而妙契有無修行至學大魔保奏升度朱陵飛行八極遊宴上清降神天闕爲世賢人恢張至道輔弼明君世人受誦則百痾普消靈府虛明玉華内鍊金光外凝暫寄厚土太隂變形數極純陽隨運更生此經玄奥普濟無邊一切有生莫不蒙惠無量之福生化受頼上天所禁不傳下凡至士齎寳玉格心盟約而傳輕慢洞章殃及七玄長役冥塗侍經九宮玉童玉女各二十四人擁護靈文守衛受經者身道言正月長齋誦詠是經紫微上宮注籍金科妙行真人乗少陽景霄之光下開幽關㧞度上世亡魂升入天堂七月長齋誦詠是經洞虛元宮書功瓊簡龍燿神王奏名九天降以生氣身得神仙十月長齋誦詠是經方諸洞宮列章上聞持綱執紐玄天大魔清蕩姦祅收伏百精消滅三災保世升平八節之日誦詠是經得爲地真遊宴八㝠本命之日誦詠是經五府灌鍊雙景交纏九元上㑹混合綿綿制魂拘𩲸升騰絳煙采集華芒流運靈泉功滿道備神飛列仙道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐九色雲氣之中内外蓊㝠有青龍白虎朱雀玄武獅子白鶴羅列左右三元九宮仙籍大神森然對目日月照明洞煥室内頂生圓象光映十方如此分明宻呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齋清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始無量度人上品妙經元始洞玄靈寳本章九宮僊籍上品升降度人大經離合結氣自然玉洞紫文森羅景真虚無至化流範成尊圎光分妙洪象飛根九宮育質帝一生身琳琅廓落赤文化生奔天廽水三極玄津眇眇層關運空飛輪安陽紫微同歸帝宸是爲極變雲宮太霄鬱察神丘玉虚陽寥須延飛霞熒晶散飊劫仞元臺敷靈列曹數周綱維大運相交蕩簜天闕經緯華城流𤓁泛境保天蔚明中有萬垣太帝之真中有三官廣治之君中有九宮主籍之靈中有化周開導丈人中有二十七府百二十曹隂陽水火考校生死靈官大神敷弘至妙濟度天人遊觀太空護世長存上朝大羅下治泉扄緫領北鄷按察雲營神符告命玄詔奉行今日宣示諸天臨軒東方無極廣生神王長生大聖無量度人南方無極執範神王長生大聖無量度人西方無極司伐神王長生大聖無量度人北方無極普利神王長生大聖無量度人東北無極鎮極神王長生大聖無量度人東南無極運化神王長生大聖無量度人西南無極保經神王長生大聖無量度人西北無極玉輪神王長生大聖無量度人上方無極紫霄神王長生大聖無量度人下方無極黄闕神王長生大聖無量度人十方無極飛天神王長生度世無量大神並乗素雲飛輿浮光葆輦羽蓋飊輪驂駕朱虎神鳳金鸞建緑霞玄節翠燿華幢前導九天神印後仗伏魔信旛素靈秉鉞青真執麾神帥啓塗玄老主盟億乗萬騎浮空而來傾光回駕促氣召仙紫霄丞相太極上宮清微治録一品天官執簡捧籍齊㑹帝前隨所肇化開示諸天普告八㝠浩蕩神闕混合之府七都九淵羅酆暗域寒刄氷山炎城火翳剛風九旋考功六司羣魔同宮激飊迅流劫運交衝九宮符命伏制妖凶威光下濟普赦罪魂升入福堂度品朱陵逍遥解脫衆苦咸原超生受化慶會因縁隨劫運轉與天齊年過度三災九厄之難永居上境遊行九清九清之天天帝洞文無色之境梵行東方八天玄利族延天帝澄源舒明釐豐隱華天帝慶百靈昭靈碧滁天帝略儀燿和晉師長齡天帝玩生無遺漳亭主仙天帝恪順預平明極廻真天帝漠題甦英昧思純氣天帝定玄景監靜解應誠天帝隆欹皎淵南方八天皓明慶述天帝植秀友良炎華赤芒天帝託端承光鍊真消魔天帝一求微藍寂度忘塵天帝謹悟濟靈鑑射玄天帝紹儀祕常太極校仙圓明正化天帝力彊捐赤岡飛霞鍊中天帝無待資宣靜常惠神天帝篤慶生西方八天鍾仙校録天帝披冲薦光扶善紀功天帝都盈撩鄲西昌奉真天帝辨世正開鬼靈隔犀除魔天帝鍊咸俞仝逸曦助爲號明天帝勃陽持雲張虚留契左神天帝諒真召朞伯化救傷拯物天帝覺義通都司召靈天帝弼忠希恭北方八天宣隂布化天帝詢蒙若賖伏魔掌録天帝正威奠明氣輪壘業天帝嶽昌祠宗昇真進澄天帝輔東登華陶晶正思天帝穹嚴犂運龍直陽天帝烈江純思九宮典嶽天帝優圖訥庸順靈濟幽天帝呼成自康三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隠韻天中之音天中之尊天中之神主録真魔仙籍玄靈九運十周變化杳㝠無量隱妙廣不可量紀籍元真和合天人功書玉籙升進飛宸今日玄關應體洞告無垠削落黑籍曲素髙奔徊風上範超度弱淵大魔伏謁同揮玉軒東斗發生西斗執權北斗布澤南斗主遷中斗廣化攝御靈官青帝降神白帝制氣赤帝育胎黑帝合志黄帝坐鎮統天大惠青宮真王碧羅定基赤宮真王丹文耀開白宮真王玉景蔚扉黑宮真王紫素貟微黄宮真王金方化機五宮髙靈萬天之尊飛行九垣緫領天兵持幢秉節遊眄太㝠神威赫奕與道交并上天度人太憲流行元皇受命掃殄不祥石光交煥天令恢張玉馬奔馳巨獸衘岡炎精遐布封落靈郷敢肆干犯束縳誅摧玄鉞左戮玉斧後夷除蕩怪魅殺伐祅蜚正天元極寳運同歸魔無干試邪無遁形九署列曹校録鬼營不容怠縱天吏飛呈普告靈關羣真仰聽三界十極咸使知聞靈書大䇿寳籙玄篇周化五常三氣推延太極布形晶燿綿綿混洞浩劫眇莽升遷六氣代交無極無邊上陳五斗下布九淵風包太空徊水騰天玉京植立太素九城峩峩琳房仙籍命真翠霞蔚蕭散飊長庚凝爲山嶽流爲百川中藏上靈統領萬縁元綱流轉三界諸天包絡碧虚纏結生關旋紀度經回運極炎三十九帝統御四玄八治分真氣合淵源皇中紫宸玉府絳霞宴景洞英吟嘯玄華金書蔚明虚泛雲宮玉謡鍊質神音散沖瓊關騫秀開導元功千運萬周自然成真真中有神天官大君紫微玉輔暘谷髙尊嬰兒伯史太一千精緫執玉符保奏生根上遊太虚出入圎羅玉山之岫蕭仞之阿下應人身五府靈河腦宮之戸方池百盈六洞囬泉㮒質飛青青華九微開度天人上啓雲綱八門玉輪大福禁誥善惡因縁普獲濟度死魂生身身得受生上聞帝庭帝庭之上各有玄音中有九宮闢闔之章三元靈歌辭參髙真第一九宮羣仙飛空之音八明四虚包含九宮赤混髙清交羅太空八圎之上風澤之中洞合杳㝠下鎮北酆三官統領中有至神執天大憲與道同功立以天帝主以玉真妙化生育三十九君上輔元始浩劫稱尊出入有無飛遊玉京洞章下教萬天告行第二九宮仙籍之章紫瓊天策玉極真科髙真隱諱上祕圓羅朱璧列名紫素三華飛仙列聖赤文煥霞玄金寳簡黄玉柔編緫記羣真帝心所銓太極玄宮校籍命仙憫彼世人逐物流遷魂升魄降沈淪九泉胡不登山詠此洞篇一悟至道身飛帝軒第三太極九宮歌曰太清九方回秀流雲緫執天機開通杳㝠碧山紫河玄微結鄰太微上府中有老人騰天隱道合景生身扇霄蔚羅朱光燿明天輪回運經變元成九淵包絡通道河津清微帝一大洞靈尊黙念契大有自然成至真我歌九宮仙願同朝帝宸此三界之上飛空之中真王歌音音參洞章誦之百遍名度南宮誦之千遍真王保迎萬遍道備飛升九宮過度三界位登仙公有聞靈音魔王敬形敕制地祇侍衛送迎抜出地戸五苦八難七祖升遷永難北山魂度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及九宮仙籍隱祕之音内有九真雄一雌一真諱仙聖内名誦詠之者刻書太極證位九宮腦中有紫房真神列坐向外聞此經聲上參太極下應洞響九宮之神告兆仙期也皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奥難可尋詳上天所寳祕於髙上神霄玉清玉府東臺寳藏依科三萬七千年隨運下傳若有至人齎金寳質心依舊格告盟九宮然後而付焉道言夫天地運度否終日月五星虧盈至聖神人休否末學之夫疾傷凡有此災同氣皆當齊心修齋六時行香十遍轉經福徳立降消諸不祥無量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太隂臨過之時同學至人爲其行香誦經十過以度屍形如法則玉華帝妃執火炬以滅隂邪雲儀玉女擊天磬於腦宮于是百神混合九光之精入填泥丸返其所始魂神俓上南宮隨其學功計日而得更生轉輪不滅便得神仙道言夫天地運終星宿錯度日月翳昏四時失度隂陽不調國境生災疫毒流行兆民死傷師友命過同學罹殃皆當修齋行香誦經夫齋戒誦經功徳甚重上消天災保鎮帝王下禳毒害以度兆民生死受頼其福難勝故曰無量普度天人道言凡有是經能爲天地帝主兆民行是功徳有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衛右別至人克得爲聖君金闕之臣諸天記人功過毫分無失天中真王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君撰元始靈書九宮仙籍諸真寳諱首篇東方八天戞圖元鈴流體射回恍濡咸泰周漿明垂𤓁龍疋芻斗江頻雷仰斷鴻極招仙納暉演莆寂著空蒙華催都瑶審涂洽玄壁刀察陳澡珂袐來發深辨薈祈蔚壯卑茂彬南方八天赫那提都明邀𧦽彦荒度覺攸璣標暄煥仗掌雲籍曽湍游旻曜勤祝慈邊溏氣司駢胡耿池晶圭薄微摘卓鄙消幽羅菅屍靜立㝠洑揚華激彌滻雲驛童豐佐畢龜西方八天燎梵諸照環光秫羅邀兵無形堆逵輳圍應道洛馘周蒙宛毗屹左遊縳朱并丙持渺但洞澤僕幽楮奚亮愬祖穆由汾淇真獨綿閣韓夷虛角張宻變兹斐瓊迅時機北方八天叱麓擎蔽吟時陸絳海碧岨希幽烱梅逸躍便燭錫光瑶陀欽載更驅每官元師救漯壘嶽堅風育悲族蕩萃遠淑丕在丹陽輔葛則厭車橫鱗處滅生久關盤泊嬰道言此諸天中大梵隱語無量之音舊文刻書太極九宮崇墉之上以詔未度至學之士神棲九宮氣抱太極參味隱韻則録名仙籍上遊太玄策登左元字皆廣長一丈天真皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣太極右卿下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勲真王保舉九宮道備克得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成天真自然之音也故誦之致太極下觀上帝遥唱萬神朝禮三界侍軒羣祅東首鬼精自亡琳琅振響十方肅清河海静黙山嶽吞煙萬靈振伏招集羣仙天無氛穢地無祅塵㝠慧洞清大量玄玄也元始無量度人上品妙經卷之三十五

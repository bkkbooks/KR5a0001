front:
  text: 靈寳无量度人上品妙經卷之十六地六
  hash: sha256:c365dac6c7f06a757931ebd153bc1486c085d44ee5eefca1326289dd2d9e412b
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_016-001a, image: hfl/0004/0004-004.png}
body:
  text: 隂陽離合五行化體品道言昔於玄變天中元明靈歌大眞化土受元始度人隂陽離合五行化體无量上品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖髙尊妙行眞人無鞅數衆乗空而來凝輝明虚絳輦丹輿扶華翠葆暎燿非煙瑞炁八靄靈光四纒九日九夜諸天隂陽經緯二景三元停運息機太空騫朗洞極難名風雲靜肅物象敷榮一國地土山川林木緬平一等無復髙下土皆紋玉交纒萬彩衆眞侍座元始天尊玄坐浮空太極十華九光之座說經一徧諸天大聖同時稱善是時一國男女疾累悉得消除說經二偏物遂其生說經三徧道炁歸形說經四徧人民富壽俱獲延長說經五徧二儀升降和合自然說經六徧四時順德造育化愆說經七徧百靈恊化萬寳咸熈說經八徧率土之内安裕豐康欣樂太平保世榮昌說經九徧風俗淳厚尊崇道眞說經十徧存亡受惠普頼玄恩是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一徧東方无極无量品玉寳大神無鞅之衆浮空而至說經二徧南方无極无量品玄眞大神無鞅之衆浮空而至說經三徧西方无極无量品太妙大神無鞅之衆浮空而至說經四徧北方无極无量品紫陽大神無鞅之衆浮空而至說經五徧東北无極无量品度化大神無鞅之衆浮空而至說經六徧東南无極无量品好生大神無鞅之衆浮空而至說經七徧西南无極无量品明華大神無鞅之衆浮空而至說經八徧西北无極无量品玄㝠大神無鞅之衆浮空而至說經九徧上方无極无量品玉虚大神無鞅之衆浮空而至說經十徧下方无極无量品眞皇大神無鞅之衆浮空而至十徧周竟十方无極天眞大神一時同至一國男女傾心歸仰來者有如雲飛霧集無鞅之衆迮國一半土皆偏陷非可禁止於是元始攝聚二景日月玄根盤結縈纒成一寳輪大如車轂在空玄之中去地九丈元始登引天眞大神上聖髙尊妙行眞人十方无極隂陽五行至眞大神無鞅數衆俱入寳輪之中天人仰㸔惟見勃勃暎其光明而入於中既入寳輪不知所在國人廓散地還平正無復欹陷元始即於寳輪之内說經都竟衆眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷天地率土道合至眞無虧無敗無動無擾無愆無塞無乖無異無衰無滅物無夭喪命有長生慈恵相保仁善恊心國安民豐欣樂太平經始出教一國以道預有志心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝内名隱韻之音亦是眞王内諱百靈之隱名也出有入無離合隂陽五行變化其體歸常能明能光能存能亡知而行之驅隂運陽非世之常辭上聖已成眞人通玄究微能悉其章誦之十過諸天諸地隂陽五行運化之神設禮𦤺恭齊來敬仰妙用帝和正氣不忘生津自開品彚咸若無有隳殘至學之士誦之十過則隂陽順德五行齊功上循天紀歷度不窮保濟否厄絶而得延所以爾者學士道炁未純體未合神撫調𦤺理位未達玄任力可以消却時災禳制運會但祛害而已蠲其殃禍輕誦此章考罰被身供養尊禮門戸興隆世世昌熾與善因縁萬災不干神明護門斯經尊妙獨歩玉京度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到隂陽五行錯謬之氣勃沴之理皆即恊和𢍆會至眞道備三年輔化通幽咸𦤺神靈而運用玄關造育生成如司其權録名金闕簡在玉清也上學之士修誦是經隂陽五行外内合玄外營恢範内守天元内外之機符其自然世人受誦則日月星辰降注其晶於其身中後皆得作尸解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶元量之福生死䝉惠上天之寳不傳下世至士齎金寳效心盟天而傳輕泄漏慢殃及七祖長役鬼官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經隂陽離合萬物受生剛柔和恊錯綜五炁化體無傷形神永存七月長齋誦詠是經隂陽離合萬物受成載營抱魄充備五德化體彰明形神永全十月長齋誦詠是經隂陽離合萬物歸眞混合玄根育養五精化體常堅形神永昌緫其上道保鎭帝王國祚綿綿至治無疆八節之日誦詠是經開導和氣集助化功修積無已登獲仙宗本命之日誦詠是經隂陽五行神妙之元保我生命扶我驅靈長離苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上清道言行道之日皆當香湯沐浴齋戒入宣東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黄白三色雲炁之中内外蓊㝠有青龍白虎朱雀玄武師子白鶴羅列左右日月照明洞煥室内項生圓象光暎十方如此分明宻呪曰无上玄元太上道君召岀臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋清堂修行至經无量度人願所啓徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始无量度人上品妙經元始洞玄靈寳本章隂陽離合五行化體上品妙首十極度人天皇隱韻離合自然太極妙範幽微至玄大混之始運化百神清濁辨體升降隂陽交會變化景燿昭彰積氣定數五用分方下育其形上麗其精長養於中道有其常柔剛燥濕寒暑溫涼沖和元一緫括靈綱相資相化相剋相成無此不立無此不成無此不度無此不生是爲靈寳天中之眞瓊琅上境會月之宫總攝萬界統御玉晨鬱藹華煙縹緲之根三關九域承光妙宗金闕玉房森羅淨霐大行梵炁周迥十方中有隂陽造化之神中有開天立極之君中有主宰玄機大神中有三元皇君丈人中有司掌五靈五炁四時四序太歳尊神離合化體无量度人今日校録諸天臨軒東方无極啓靈神王長生大聖无量度人南方无極華景神王長生大聖无量度人西方无極育素神王長生大聖无量度人北方无極元精神王長生大聖无量度人東北无極定運神王長生大聖无量度人東南无極開生神王長生大聖无量度人西南无極成德神王長生大聖无量度人西北无極玄寳神王長生大聖无量度人上方无極天樞神王長生大聖无量度人下方无極地關神王長生大聖无量度人十方至眞主化神王長生度世无量大神並乗飛雲絳輦丹輿扶華翠葆驂駕瑞獸五色驪龍建流火之節玄燿大旛前導十天妙樂後參三界謡歌赤文洞章和合生音十華啓塗七精捧轅億仙萬眞吟詠而來遊空歩虛召炁攝雲天樞丞相无極元官九靈玄佐化炁大神執籙持符齊到帝庭隨所開化運斡諸天普告三界洞㝠六關青館丹池黄關泉臺離合隂陽化體五行驅役感變萬類生成包羅流布二炁飛騰大化交周升降相纒元運四虚綱紐回旋把握元機隂魄陽魂玄悟眞妙神飛玉京朱陵火鍊仙化起升升眞受度劫劫長存隂陽輪轉與天齊年永離鬼魔干試之難超淩三界逍遥太清太清之天天帝化光無色之境梵行東方八天燿祺靈藪天帝重機沖玄瑜昉智參天帝福世化仙乙羅沖試天帝都智益相景妙盡思天帝觀察九幽田靈緒成天帝露芝淵嶽離眞合玄變極天帝迮逵玄通道依顯靜虚神天帝猷神令思歷思證理明通天帝定旋希元南方八天持容慶緒拱化天帝道輔赤明樂佑思眞管熈天帝孟若享良魯咸至中天帝遵徒詢英齊裕管天帝嶧求滿眞栗還玄沖天帝邈暢洞禹周極盟眞天帝卓湛起玄明洞祕思天帝幾先承臯康宗楊義超無天帝動常遜西方八天敦極洞皇天帝玄華定明照志演微天帝道萬有來太始昭生天帝本希沖遥嚴極靜修天帝安丘居疇直輪渾樞天帝彦樂想敷吉令化時天帝碧琳次回温閔成儀天帝鐸儲庸良肅圓恭慶天帝煕德重光北方八天惠祖龍坡天帝全無定生寂無常善天帝無玄敬充䝉玄靈示天帝遁伯髙妙度進良天帝望宗景昭灝景護眞天帝宥慶離丞九眞大羽天帝變常宗黙和隆度天帝燿河司靈幽無委玄天帝奕功仲勲三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻隂陽之音五行之尊離合之神化體自然窮變之靈九和十合變化上清无量之奥深不可詳敷落神眞普度天人今日欣慶受度歷關諸天呼隂召陽聚散激燌春木孕火爲夏之炎秋金育水爲冬之寒四季運土萬物生全三炁化體離合幽關二景騰變乃辨五行三炁結精鼓躍陶鎔飛伏沉顯道行其權三界直立萬類俱安再離再合神精播宣玉丹凝結形具質靈化體萬變一眞自然眞王持鑰啓闢天門東斗生陽西斗誕隂隂陽斗降金魄木魂北斗玄津南斗赤明中斗緫御常司衆靈青帝發生白帝成形赤帝敷養黑帝通精黄帝定意檢䇿萬神青天魔王巴元醜伯赤天魔王負天擔石白天魔王翻山六目黑天魔王監醜朗馥黄天魔王横天擔力五帝大魔萬神之宗隨炁離合體化周流飛騰翕張與道爲儔建植大器分布九丘經營天地掌握神兵持符執節飛行太空自號赫奕諸天齊功上天度人巖攝北酆黄老奉詔殄滅祅祥𧃍龍禦毒驎騎驅鋒參尾警前赤甲揚旌擲火萬里流鈴八衝敢有干試拒遏上眞素靈前戮火兵後刑隂蕩鬼魅殺伐邪精明晨定録考校無停魔無干犯鬼無迯形六天列曹案察鬼營不得容隱風火驛呈普吿三元萬神咸聽九淵上佐簡奏太清洞劫綿曠太始龍康眇眇億劫混沌之中離合隂陽五性自生化體空常上窮三色下極重淵風轉九虚金火乗天天上天下無幽無㝠無形無影無極無窮溟涬化炁遼廓交纒丹光啓圖劫歷自然元始安鎮敷落五篇赤書玉字八威龍文保制劫運使天長存梵炁彌羅萬範開張元綱流演三十二天輪轉無色周迴十方旋斗歷箕回度五常三十五分緫炁上元八景㝠合炁入玄玄玄中太皇上帝髙尊汎景太霞嘯詠洞章金眞朗郁流響雲營玉音攝炁靈風聚煙紫虚鬱秀輔翼萬仙悉由隂陽離合五行化體顯充妙炁生成感變正道開化至眞眞中有神長生大君青華大帝皓靈尊神太乙務猷司命理明桃康主命合延帝尊執符把籙保命生根上遊九清出入黄房玄丹之内絳闕之中下鎭六扉洞穴蒼精中理五炁混合百神十轉迴靈萬炁齊仙仙道貴生无量度人上開八門飛天法輪罪福禁戒宿命因縁普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有離合化體之章眞王靈篇辭參髙眞第一離合飛空之音一炁既闢萬化通流離合隂陽大劫交周九天八極三十二關一離一合炁數推遷明明元象下應人身森羅宮闕統備百神欲斷輪轉順修五行五行變化是爲天元爾能識之舉形飛仙靈府濁昧爲道不成豈知悟道神炁同升隂陽離合萬物循萌逍遥過三界自然無死生神飛步圓羅雙闕朝髙眞第二眞人化體之章控駕遊八㝠停景崑山阿金闕禮虚皇鬱藹乗大霞化體空無中生成濯玄波拘形欲未蠲隂念無津涯業念相追尋漫漫沈愛河一墮穢濁境苦道興悲歌我今敷至教正炁遏邪源赤文度群品黄旗招大魔永以享大福億齡奚足多嗟爾塵中子背眞其如何第三五行隂陽歌曰渺渺三天上巍巍白玉京元始御明景立此大化根隂生結黄華陽光敷赤輪二炁相纒羅太空流五行七景忽騰變萬彚從此生五行互遷改誰測敗與成神霄執玄紀緫校諸天人左攝三界魔右制六天兵寳章召和炁玉符集百靈天丁秉瓊鉞赤帝擲流金收捕群魔醜境土皆澄清普天被眞䕃億劫保無傾此三界之上飛空之中眞王歌音音參洞章誦之百徧名度南宫誦之千徧眞王保迎萬徧道備飛昇太空過度三界位登仙公有聞靈音眞王敬形敕制地祇侍衞送迎拔出地戸五苦八難七祖升遷永離鬼官魂度朱陵受鍊更生是謂无量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈仙王隱祕之音隂陽離合之奥五行化體之機啓造天地三界剖析混沌之音皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奥難可尋詳上天所寳祕於神霄玉清王府東華經室數歷壬辰依玄科下傳若有至人齎金寳質心依舊格告盟眞王然後而付焉道言夫天地運度亦有否終日月五星亦有虧盈至聖神人亦有休否末學之夫亦有疾傷皆隂陽離合化體變現之象凡有此災同炁皆當齊心修齋六時行香十徧轉經福徳立降消諸不祥无量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太隂臨過之時同學至人爲其行香誦經十過以度屍形如法魂神徑上南宫隨其學功計日而得更生輪轉不惑便得神仙道言夫天地運終星宿錯度日月失明四時失度隂陽不調國畿水旱疫毒流行兆民死傷師友命過此爲隂陽五行離合化體之變皆當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受頼其福難勝故曰无量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋焼香誦經十過皆諸天記名萬神侍衞右别至人剋得爲聖君金闕之臣諸天記人功過毫分無失天中眞王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語无量音道君撰元始隂陽離合五行化體靈書玉篇東方八天登岐伽當漏采殊華畢遥普竟陽職奔涯畧栗延鎭欹幷宻夸昊嶺睦齎煙迷備賖燿戴紀落匪清晦陳遘逮嬰緒命列逾泰酢推晏優𨽻湖閱臻惑習疲驛延剛保垠南方八天墩籍肆濡騫連法眸定微勤索益名齒都昕京墉傍蔑神論壬既懇甫比演質元存亮澤育嶽遮地宻眞禱胥愛節𦕅安歩伸覩羅曷帝妙赤祕輪學但營茂紀并寥寅西方八天鈕鐸率堅蘭康滋孫敬鞠間熾躍持求昆琥驛傳牘韓機郁文驗考道聦汧林啓昬極侯備衷那牢雌能弼劉夷黙時圖印成迮淵期盧亶仝幽岑魯淡蹇望胡遄救金北方八天信祖熈路賔恭召經絡斗俯胃青君奕賔本應師鍔元堂古陳别則仇敏移精竹棼誥宗冝竦閣德宛循亭徼保際坤山野侖猛敵象魔孜猷窈靈敕意天放聊維幾雲道言此諸天中大梵隱語无量之音舊文字北斗元魁南斗天箕施行隂陽運斡五行鎭三界於混極立玄機於太清離合得以交其道水火得以榮其靈統攝群類與眞合盟浩劫不竭謁帝玄庭字皆廣長一丈天眞皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳眞王保舉神霄道備剋得遊行三界昇入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致飛天下觀上帝遥唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響十方肅清河海靜黙山嶽吞煙萬靈振伏招集群仙天無氛穢地無祅塵冥慧洞清大量玄玄也元始无量度人上品妙經卷之十六

front:
  text: 靈寳无量度人上品妙經卷之十五地五
  hash: sha256:d9847e4905526fcb68526a8cd3dc8ebcff18b2675b63b9ac1c8397879cc58eba
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_015-001a, image: hfl/0003/0003-174.png}
body:
  text: 月華隂景品道言昔於寳明天中黃華梵景太素光土受元始度人月華隂景无量上品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖髙尊妙行眞人廣寒上宫后妃元君𡣕御仙官散輝金童燿華玉女無鞅數衆乘空而來素雲玉霄金輿瓊輪羽蓋垂䕃流精玉光灝彩鬱奕洞煥太空七日七夜諸天日月星宿璇璣回標駐輪神風宛轉山海澄源天虚八浮地寂四清一國地土山川林木緬平一等無復髙下土皆作金璃通玉交暎無有異色衆眞侍座元始天尊玄坐空浮九龍瓊臺雲層之上說經一徧諸天大聖同時稱善是時一國男女始悟正因隂爲道母三元混沌於此孕成説經二徧心識性解明悟道源說經三徧超離隂胎即成化育說經四徧乗此經力得飛仙道說經五徧聞法解理神澄廣寒說經六徧金光徧空騫林搖響說經七徧法奥開顯保劫長存說經八徧空歌洞草萬天遐唱説經九徧月后降軿飄花凝秀說經十徧六陽俱朝忽成萬化是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一徧東方无極无量品月華隂景大神無鞅之衆浮空而至說經二徧南方无極无量品月華隂景大神無鞅之衆浮空而至說經三徧西方无極无量品月華隂景大神無鞅之衆浮空而至說經四徧北方无極无量品月華隂景大神無鞅之衆浮空而至説經五徧東北无極无量品月華隂景大神無鞅之衆浮空而至說經六徧東南无極无量品月華隂景大神無鞅之衆浮空而至說經七徧西南无極无量品月華陰景大神無鞅之衆浮空而至說經八徧西北无極无量品月華隂景大神無鞅之衆浮空而至說經九徧上方无極无量品月華隂景大神無鞅之衆浮空而至說經十徧下方无極无量品月華隂景大神無鞅之衆浮空而至十徧周竟十方无極月華隂景大神無鞅之衆一時同至一國男女傾心歸仰俱聞天尊將說大法月華隂景妙无上道各相謂言聞經十徧漸𢍆玄宗隂景之機未畢祕奥我等初聞月本無光望如黑鑑日滉水光暎以爲明金水之炁結爲隂景上弦爲金下弦爲水合弦爲月金體圓就乾象周滿月侍日明日依月燿望而純陽晦而純隂但知陽勝爲仙不知隂景爲六陽之母聖人尊陽貴隂蓋以此義隂生於陽陽能生隂玄烏縞兔交以天精極而返之得者無死元始首唱月華隂景之道各捨宻寳以覬受持來者有如細兩密霧無鞅之衆迮國一半土皆偏䧟非可禁止於是元始以大慈悲入九隂觀湛然大定大衆仰觀瞻見元始返神無息靜如寳山良乆之頃化爲明月月出十華靈芒交暎累累隂景狀如目瞳紫光淩空内隱輪際海會驚覩仙民再拜伏地忽然之間廣大月輪中現樓闕后妃宫殿仙民城郭明白如晝月華流光雜寳同色合座渴佇心目驚駭旋攝月華變成寳珠大如黍米在空玄之中去地五丈元始登引天眞大神上聖髙尊妙行眞人十方无極月華隂景大神無鞅數衆俱入寳珠之中天人仰㸔惟見拂拂從珠口中入既入珠口不知所在國人廓散地還平正無復欹陷元始即於寳珠之内說經都竟衆眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰悟道知隂隂景隂神隂氣隂精隂火隂化隂生隂胎隂變隂返至陽日月同并言爲陽華口爲隂闕齊同慈愛異骨成親國安民豐欣樂太平經始岀教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是月中結璘内名隠韻之音亦是月中后妃夫人内諱百靈之隱名也兆能知之挹華采景至隂生陽陽極仙身雌宫遐感席降靈眞固兆血腦使生乆存月爲魄神血爲至隂陽爲隂留陽號胎隂隂稱祖土緑書祕文非世之常辭上聖已成眞人通玄究微能悉其章誦之十過諸天遥唱萬帝設禮河海靜黙山嶽藏雲月降隂景黄飴易形群魔束形鬼精滅爽迴屍起死白骨成人至學之士誦之十過則五帝來衛隂格陽眞六龍負車三界稽首魔精䘮眼鬼祅滅爽済度垂死絶而得生所以爾者學士穢氣未消體未洞眞召制月華威未制天政德可伏御地祇束縛魔靈但却死而已不能更生輕誦此章身則被殃供飬尊禮門戸興隆世世昌熾與善因縁萬災不干神明護門斯經尊妙獨歩玉京度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到月眞佇軒月中夫人爲兆列言億曽萬祖幽魂苦爽皆即受度上昇朱官格皆九年受化更生得爲貴人而好學至經功滿德說皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經月華煥液變骨鍊神皆即受度飛昇南宫世人受誦則金精入身腦戸自鳴玉女捧章金童禀顏得延壽長年後皆得作尸解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶无量之福生死䝉惠上天所寳不傳下世至士齎金寳效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齋誦詠是經月華隂景中有大神龍衣虎符度兆先宗爲上世亡魂斷地逮役度上南宫七月長齋誦詠是經月華隂景中有大神黄衣寳章刻兆仙名身得神仙諸天書名黄籙白簡削死立生十月長齋誦詠是經月華隂景中有大神繡裳大紳坐鎭萬靈爲國王帝主君臣父子安鎭國祚保天長存世世不絶常爲人君安鎭其方民見大平八節之日誦詠是經月華隂景布光八天得爲九宫眞人本命之日誦詠是經月華隂景立兆生形神生腹中玉珮金璫靈液注胃身得長生魂神澄正萬炁長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐紫黃白三色素雲之中内外蓊冥有青龍白虎朱雀玄武師子白鶴羅列左右日月照明洞煥室内項生圓象光暎十方如此分明宻呪曰无上玄元太上道君召岀臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齋清堂修行至經无量度人願所啓上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始元量度人上品妙經元始洞玄靈寳本章月華隂景上品妙首十回度人結璘隱韻離合自然混同隂景无无上眞黑金之炁玄一之胎外隂内陽至精未開靜極生神金水聚形圓照浩劫海嶽澄明陽獨化息隂凝變停二象㝠合玄牝體幷隂升雨露陽降淵泉元始祖劫化生諸天祖爲隂景月華含蓮開明三辰是爲天根上無復祖惟道爲身月中靈文黃書騫林葉有玉章普殖神靈無文不光無文不明無文不立無文不成無文不度無文不生是爲大梵天中之大鬱羅玉闕蘂淵金臺上極无上大羅玉清眇眇劫仞若亡若存三華離便大有妙庭玉戸蘂房森羅紫霐神霄梵炁周回十方中有月華隂景之神中有南極長生之君中有東極青華帝君中有十龍飛車司馬大神中有好生韓君丈人中有南上司命司録延壽益筭度厄尊神迴骸起死无量度人今日校録諸天臨軒東方无極飛天月中黃華神王長生大聖无量度人南方无極飛天月中赤儀神王長生大聖无量度人西方无極飛天月中素魄神王長生大聖无量度人北方无極飛天月中紫字神王長生大聖无量度人東北无極飛天月中神光神王長生大聖无量度人東南无極飛天月中隂火神王長生大聖无量度人西南无極飛天月中紅露神王長生大聖无量度人西北无極飛天月中瑶闥神王長生大聖无量度人上方无極飛天月中五后神王長生大聖无量度人下方无極飛天月中玉妃神王長生大聖无量度人十方至眞飛天月華隂景神王長生度世无量大神並乗素雲玉輿丹輦霞蓋金輪驂駕靈鳳十眞白龍建廣寒之節燿靈神旙前嘯天樂齊唱後吹神籟同鳴師子白鶴嘯歌噰噰五老啓途群仙翼轅億乗萬騎浮空而來傾光回駕監眞度生玉闕丞相南昌上宫韓司主録監生大神執籙把籍齊到帝前兆能感恩玉天流霞注極碧玄月中黃缶挹華祕泉神水透漠眞光變仙嚥液寳章心念白元有五夫人扶擕躚泝煙奔車十龍駕軿上動髙晨下通幽關隨所應度嚴校諸天普告三界无極神郷泉曲之府北都羅酆三官九府十二河源上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼群月皇符命時刻昇遷北都寒池部衛形魂制魔保舉度品南宫死魂受鍊仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度三途五苦八難超凌三界逍遥上清上清之天天帝洞璘無色之境梵行東方八天玉里延皇天帝陸建封佐秀峯碧華天帝聖司髙安龍喬聖驥天帝逸徒超方平洞浩元天帝彭泠丕江濟眞帝樂天帝辨宗豫元震光保生天帝廖都洛兟化玄開叙天帝仙瓊紫璠九山龍淵天帝云濤迷成南方八天赤揚鳳炁天帝竺毗達良燿靈寂思天帝寧華笳熏載陋賔天帝妙瀆慈恭錫眞无極天帝隱梵多容絳立顯源天帝初炎英摩火巖考過天帝略多倚臺元命欽光天帝聦規謨名明虚正一天帝邊朋祛屍西方八天尾神監籍天帝乙魁綿都錬仙變玄天帝嶽漸穹蘷文斬魔天帝眞陀兮公七絶注明天帝覺禄幽僅太素布揚天帝𨓜寧无均梵光騰剛天帝直嘉韞初液靈化魔天帝蘇伯寅聖格致仙天帝仲務建師北方八天混光騎昇天帝號巴部迤寳炁耀精天帝正幼完時道育曲蒙天帝正昭泰光越龍玄鑒天帝海礜正該命仙海畿天帝保機永生落監總明天帝季光熾倫飛斗呈意天帝燿次夷極霄庭度眞天帝鄭澤䖍靈三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻月中之音月中之尊月中之神月中之眞月中之靈九炁十華變化上清无量之奥深不可詳敷落神眞普度天人今日欣慶受度歷關諸天請滅隂惡斬絶地根飛度五斗名列太玄眞王監舉無拘天門東斗龍光西斗虎翔北斗狼據南斗鳳璫中斗麟伏共成華芒爲月隂景變化竒常青帝吐霞白帝執玉赤帝執火黑帝隱局黃帝合神月精鍊眞青景神王角應巴元赤景神王箕翼擔天白景神王參力翻山黑景神王玄正醜監黃景神王魁𩲃横天月華隂景五色回旋降兆三宮眞王舉仙月華神王萬神之宗飛行鼓從緫領神兵揚霞太空神光赫奕諸天齊功隂眞度人嚴校北酆神公受命普掃不祥青龍吐毒白虎四張朱雀前驅玄武仗旙擲火萬里流鈴八衝敢有于試閉固月精金刀前戮玉㦸後刑屠割鬼爽風火無停千千截首萬萬翦形魔無干犯鬼無祅精三官北酆明檢鬼營不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列言上清元洞肇萌隂景誕陽陽求於隂隂留於陽終始五運自龍及康日在月中水護金房陽從隂生以柔德剛身無太隂發爲狂陽陽絶形斃非聖用藏眇眇億劫混沌之中上金爲色下水爲淵中有至無神炁所安風澤洞虛金剛乗天天上天下無幽無㝠無形無影無極無窮溟涬大梵遼廓無光隂景開明運度自然元始安鎮敷落五篇赤書玉字八威龍文保制劫運使天長存梵炁彌羅萬範開張元綱流演三十二天輪轉無色周回十方旋斗歷箕回度五常三十五分總炁上元八景㝠合炁入玄玄玄中太皇上帝高眞汎景太霞嘯詠洞章金真朗郁流響雲營玉音攝炁靈風聚煙紫虛鬱秀陰景化仙千和萬合自然成真真中有神長生大君青華公子月魄尊神太一司命桃康合延執符把籙保命生根上遊上清出入華房八㝠之內細微之中下鎮人身泥丸絳官中理五炁混合百神十轉回靈萬炁齊仙仙道貴生无量度人月有十門飛天寳輪罪福禁戒宿命因縁普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有空洞謡歌之章眞王靈篇辭參髙眞第一月華隂景飛空之音六合皆空初無一物空忽自嘘炁風轉足風號剛風炁爲元炁炁如黑霧風鼓而聚化爲黑月遊汎無所黑中生赤赤丸爲日天地華實月爲日根十者徧岀五色流津月華陰景萬靈仰尊至隂生陽其光乃昌造化之本隂陽爲防五引結璘精天人來我傍第二月華陰景眞王之章龍山之阿緑羅抱月天光潜遘四飛玉雪極陽生陰陰爲物君隂靜無爲萬物芸芸陽動陰靜隂景自正靜則變化各正性命兆不知眞常勞我神自破居空不知抱神抱神曰靜隂景爲令中生至陽飛神躡罡咽黄金液遊白靈鄉胡爲樂世間朱顏徒爾蒼第三月華隂景眞王歌曰神風駕明月世界隨雲行不知萬樓閣玉棟虹霓生天后服黄繡曵環響忽𢖍光分九天上十龍馳素英上學仰神廬引華含至精易骨三洗腸神霄刻仙名腦血自克溢隂景延遐齡玄露生海璖眞水來杳㝠南官度七祖北都消罪嬰逍遥乗飛車奔造廣寒庭浩劫留芳顏千載無愁聲故知上真道妙化生群靈我歌太清下俯輪驂玉馬金波漲天來秀色若可把月漿滋百神再歌调再陳此三界之上飛空之中眞王歌音音參洞章誦之百徧名度南宮誦之千徧眞王保迎萬徧道備飛昇太空過度三界位登仙公有聞靈音眞王敬形敕制地祇侍衛送迎拔出地戸五苦八難七祖昇遷永離㝠宮魂度朱陵受鍊更生是謂无量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是月中髙眞結璘神王隱祕之音隂景之道陽炁之先陽爲隂留月因日弦黑白分胎金水性全駐息延命育胎固年天地持之月華蘂淵内生炁母萬類之元伏藏始祖眞火繼傳三宮徃來造物功全上帝無爲元徳潜敷皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奥難可尋詳上天所寳祕於玄都髙上神霄玉清王府道君降世隨運下傳若有至人齎金寳質心依舊格告盟十天然後而付焉道言夫天運度否終日月五星虧盈至聖神人休否末學之夫疾傷凡有此災同炁皆當齊心修齋六時行香十徧轉經福德立降消諸不祥无量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太隂臨過之時同學至人爲其行香誦經十過以度尸形如法則月華停彩隂景降精眞炁歘生陽神盡復魂神徑上南宮隨其學功計日而得更生轉輪不滅便得神仙道言夫天地運終星宿錯度日月失光四時失度隂陽不調國土有災疫毒流行兆民死傷師友命過亦當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受頼其福難勝故曰无量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋燒香誦經十過則諸天記名萬神侍衞右别至人剋得爲聖君金闕之臣諸天記人功過毫分無失天中眞王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語无量音道君撰元始靈書月華隂景中篇東方八天隂睇遘景月珠凝液岵基輝魂碧霞投蹟粹功稱羅乙珠岡璧度靈䟽妙靈眞秀激郯中赫沙祕俞勤律昌角栁鬼竒明暎日慱訶元宗化池杳宻陽眞成風運華調遹南方八天丹曜蔚靈何訣膺珮陽規横登洎桴㳙極瑶湍函虚眞合定化流乗歩邦補雲浮廊叙驛騰炎司執遄漂瀾媚洞阿禁眞瓊洮穎兵芝露錞叩蘊塞奠振毗諦玄方岐泰西方八天靈持啓傳塾鍔雲帥轄餼維爵參畢昭對狀皇仙叢歷霞猶外青札禮光金雷寂渭鍊繁菲籠三素閲兊衍弼記寳鳳關璘嶢典執討廉玄郷神衝澄覇演熈長庚浮瑞北方八天峒淩魁浪敵波軒煥薰儲蕆輔龍眞丕傳握紐陣魔揭雷祝垓烈山傾奔黑虚刁端蒼龜火蛇幽泉斗官制邪馘醜頂剛巫鑾洪矝寳源𨇠危絡輪蓋辰捧台帝觀礫遵道言此諸天中月中璘文大梵隱語无量之音舊文刻書月中十芒之闕以招結璘大神布光太無召陽成眞萬類得文陽歸眞隂眞隂固陽使神炁存金體玉骨月華鍊形蕩穢致仙髙上欽聞賛天无功萬億福成字皆廣長一丈天眞皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣飛騎神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大功眞王保舉上眞道備剋得遊行三界昇入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之𦤺飛騎下觀月妃遥唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響十方肅清河海静黙山嶽吞煙萬靈振伏招集群仙天無氛穢地無祅塵㝠慧洞清大量玄玄也元始无量度人上品妙經卷之

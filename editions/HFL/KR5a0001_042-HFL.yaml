  text: 靈寳无量度人上品妙經卷之四十二
  hash: sha256:4f79d6e3b804c10d78edc5d15615e7aa233665f6fe0b79a4a933140fda6e9730
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_042-001a, image: hfl/0009/0009-042.png}
body:
  text: 祈求嗣續慶延門閥品道言昔於太始廣生天中紫霄洞歌大福樂土受元始度人祈求嗣續慶延門閥妙品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖髙尊妙行眞人無鞅數衆乗空而來香靄浮煙翔鸞隨蓋赤光前擲瑶車轉雷縟彩僊雲絢葆千色洞煥太空七日七夜諸天海嶽交碧揚霞日月星宿凝明並照神風遠襲玉嵒露煇天翠髙虚絳氣飄衍一國地土山川林木鑑潔緬平仰矚毫髮重影沓見萬象同規土成柔玉紺青一色衆眞侍座元始天尊玄坐空浮蘂珠寳臺之上說經一徧諸天大聖同時稱善是時一國男女悟識生根說經二徧定觀本元不落苦趣說經三徧咸知至道生育之宗說經四徧生逢聖運爲賢哲士說經五徧心行孝慈善於養老說經六徧隂陽合德感化靈胎說經七徧得至法門生道不終說經八徧雖有受生不爲愛慾持結淫想說經九徧暁解希微雌雄混合理參洞玄說經十徧一切有情永延嗣續慶流海宇福及幽明是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一徧東方無極無量品始生雲芽玄露大神無鞅之衆浮空而至說經二徧南方无極无量品明性雲芽寳華大神无鞅之衆浮空而至說經三徧西方无極无量品大素雲芽感化大神无鞅之衆浮空而至說經四徧北方无極无量品神水雲芽定嬰大神无鞅之衆浮空而至說經五徧東北无極无量品受識雲芽明智大神无鞅之衆浮空而至說經六徧東南无極无量品縷絡雲芽攝用大神无鞅之衆浮空而至說經七徧西南无極无量品賢質雲芽主福大神无鞅之衆浮空而至說經八徧西北无極无量品陽運雲芽徤育大神无鞅之衆浮空而至說經九徧上方无極无量品碧菡雲芽九宮大神无鞅之衆浮空而至說經十徧下方无極无量品靈藏雲芽復命大神无鞅之衆浮空而至十徧周竟十方无極天眞玄化大神一時同至一國男女傾心歸仰悉悟道元傳立嗣續生化之基繼其本宗聮芳襲慶其生无窮來者有如細雨宻霧无鞅之衆迮國一半土皆偏䧟非可禁止元始大慈欲使无量衆生明識造化之先至道之奥所以妙極隱諱者爲明雌一雄一之神偶而爲爻混合百神徊煙散風化生眞一即是人備至祕之道雖飛僊列眞未得道時皆以雲珠下投金液玄妙感合生此靈胎神氣充備内顯眞身无動之體開演祈求嗣續慶延門閥之法存念生根始由元氣元氣之精微細如纎粒於是懸一寳珠大如黍米在空玄之中去地十丈元始登引天眞大神上聖髙尊妙行眞人十方无極至眞雲芽生化玉嬰眞子大神无鞅數衆俱入寳珠之中天人仰看惟見拂拂從珠口中入既入珠口不知所在國人廓散地還平正无復欹陷元始即於寳珠之内化舍蓮胎嬰之相說經都竟衆眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂无遺響是時天人遇值經法嗣續昌隆福慶來臻全其本年无有中傷傾土歸仰咸行善心行惠行和行弱行化行悲行恕行儉行慈行定行仁言無唱宗口无佞聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心崇奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝内名生神育嬰隱韻之音亦是眞魔内諱混化變胎以致嗣續慶延世系百靈之隱名也非世之常辭開闡大法明道根元初從胎育朱精白鉛和混萬過三一鼓舞玉飴哺靈流珠啓明帝妃儛賡紫胞坼落天嬰挺生號曰眞一字曰精延爲形之主百神之尊固道元命生道眞身爾欲祈求賢嗣門戸亨榮使无絶氣與道无邊惟已得道大聖能悉其章誦之十過諸天遥唱萬帝設禮聖母破券司命定生監魂益善福慶駢蕃群魔束形鬼精滅爽回屍起死返胎更生至學之士誦之十過則天后衛房三界唱恭天機上相注命得生嗣續傳世慶延門閥濟度生厄絶而保完所以爾者學士外滌世殗内臻化淵童君捧箎女君奏塤聲和神布妙諱乃傳道胎靈孕嬰息自然召制十方保鍊胎僊克降嘉嗣無有夭殤輕誦此章身則被殃供養尊禮門閥慶延世世昌熾與善因縁萬災不干神明護門斯經尊妙獨歩玉京度人无量爲生道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到爲爾開呈生録降嗣繼賢永大僊宗億曽萬祖幽魂苦爽皆即受度上昇朱宮格皆九年受化更生得爲貴人而好學至經功滿德就嗣孫應僊葉葉受道門閥慶延皆得飛昇金闕遊宴玉京也上學之士修誦是經爲諸生民祈求嗣績使生道不絶民獲有後祭祀祖玄隂德垂裕皆即受度飛昇南宫世人受誦胄系錦昌則延壽長年後皆得作尸解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度无窮一切天人莫不受慶无量之福生死蒙惠上天所寳不傳下世至士齎金寳效心盟天而傳輕泄漏慢殃及九祖長役㝠官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齋誦詠是經析求嗣續慶延門閥感神眞風火之君傳降台光使命得生智識明秀人中之英拔度上世亡䰟斷地逮役升上南宫七月長齋誦詠是經祈求嗣續慶延門閥感金眞黄室之氣傳降幽精使形得備宫室内固百神入胎身得神僊諸天書名黄籙白簡削死上生十月長齋誦詠是經祈求嗣續慶延門閥感太玄眞一之精傳降爽靈使性徹寥漠慧通九㝠懸知吉先與化同營爲國王帝主祈請聖嗣璇蕚萬芳百靈稱慶普天䝉福安鎮國祚保天長存世世不絶常爲人君安鎮其方民稱太平八節之日誦詠是經爲諸絶嗣衆生降致道氣咸使有子克基其家得爲九宫真人本命之日誦詠是經三元返嬰白捧凝神道父道母長守泥丸司命定藉伯華益年魂神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛昇上清道言行道之日皆當香湯沐浴齋戒八室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐五色雲氣之中内外蓊㝠有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室内項生圎象光映十方如此分明宻呪曰无上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齋清堂修行至經无量度人願所啓上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始无量度人上品妙經元始洞玄靈寳本章祈嗣慶門生化度人雌雄隱韻混合自然空生三氣氣變赤文元始祖劫化生諸天對明雙景是起天根傳氣立祖法道爲身五文開廓五臓栖神上有天闕虛適群僊經絡血脉是爲至靈威制萬類身備天經傳孕嗣續紹祖列孫祈求勝氣貴慶來庭胞胎受眞羅列交纏碧縷貫瞳緑繒爲筋定爲僊宗應登髙玄體有朱誌舌有錦文三萬六千神符繞身永輔帝化飛昇玉宸下建民物皆著玄文流布大梵身中之天頭爲蕭臺腦爲玉山委曲九回宫室相連前有明堂赤鑑三君後有玄堂九祖七玄注記嗣續保慶家門元辰簡奏天馬驛傳定子注孫繼續本先方寸虚盈列坐髙眞紫衣絳裳狀如天嬰節㑹谿谷皆爲玉京百神㑹身大有妙庭金闕玉房森羅淨霐大行梵氣周迴十方中有度人不死之神中有南極感降嗣續長生之君中有度世司馬大神中有好生韓君文人中有南上司命司録延壽益筭度厄尊神迴骸起死无量度人今日校録諸天臨軒東方无極飛天主福神王長生大聖无量度人南方无極飛天定生神王長生大聖无量度人西方无極飛天注嗣神王長生大聖无量度人北方无極飛天錫慶神王長生大聖无量度人東北无極飛天益筭神王長生大聖无量度人東南无極飛天増品神王長生大聖无量度人西南无極飛天送生神王長生大聖无量度人西北无極飛天度厄神王長生大聖无量度人上方无極飛天進德神王長生大聖无量度人下方无極飛天輔聖神王長生大聖无量度人十方至眞飛天降慶神王長生度世无量大神並乗輕霄流軿翠霞瓊輦星車羽蓋綺仗風輪驂駕碧鳳神虎蒼龍建萬華之節天騎靈旙前嘯九靈齊唱後吹八渟同嗚獅子飛天嘯歌噰噰五老啓途群仙翼轅億乗萬騎浮空而來傾光回駕降嬰度生南昌上宰天機丞相金闕侍郎大玄司命紫靈僊君韓司主録監生大神執籙把籍齊到帝前隨所祈應生息蕃滋計考命禄嚴校諸天普告三界无極神鄉泉曲之府北都羅鄷三官九府十二河源欲致貴勝嗣續綿綿上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼群元始符命時刻升遷北都寒池部衛形魂制魔保舉度品南宫死魂受鍊僊化成人生身受度劫劫長存隨劫輪轉與天齊年永度三途五苦八難超淩三界逍遥上清上清之天天帝洞曜無色之境梵行東方八天十華招慶天帝洞覺好生勝宗益賢天帝定世茂玄澡明鍊光天帝陁明尚英龍種玉嬰天帝觀福廣營祖極承圖天帝妙無常生化樞運陽天帝肖眞元昆歷符應台天帝果都祕空傳福佑生天帝納液合煙南方八天光動降識天帝知無垠辨息理明天帝務延宗康回遼澤天帝順子榮傳機宗道天帝情何靈孝始慶初天帝始育上求素開皓都天帝玉蘭齊瑰繪微延霞天帝寂僊自盈盟系靄豐天帝屹多裔暉西方八天景祈報慶天帝伯雲郁羅辨華棄欲天帝眞交命神㝠緘宻陽天帝兆先祉包温醴濯支天帝乗氣赴儀敦道亨成天帝握符通窈洞遘甫天帝力孟成日灌彩裔天帝鹿本太王九華含露天帝靜延定明北方八天冥婁緫靈天帝孕咸同周料度正緒天帝寥持野舒積曜部俞天帝變蜞神綱雷第容天帝霞泮聦淨變卵珠天帝窮宅報恩述眞祀常天帝管師遥寧黙抱蘊和天帝揚嘉神英鬱華九微天帝醜並福完三十二天三十二帝諸天隱諱生化之機諸天隱名育嬰徽稱和陽合隂繼世嗣民神出空洞芒芽句茁自然靈章上眞隱名召氣之音帝一胎尊結節之靈上𨽻眞魔育嬰之僊九陽和眞十隂合神命嗣榮燿門閥慶延无量之奥深不可詳敷落神眞普度天人今日告祈受度歷關諸天請滅胎注斬絶邪祅誕子无殤命通太玄司命監舉无拘生門東斗禀氣西斗鑄形北斗降魄南斗賜魂中斗内主泥丸尊神七寳宫室牎牖分明神氣衝溢緫監衆靈青帝護魂白帝侍魄赤帝養氣黑帝通血黄帝中主萬神无越青天魔王怒役威明赤天魔王變遷守眞白天魔王憤擊虚成黑天魔王車轂玄㝠黄天魔王持犯互爭五帝大魔萬神之宗飛行鼓從緫領鬼兵麾幢鼓節遊行大空恍惚无常下入身中潜伏六根時廵九宫自頂達踵无不停容兆祈嗣繢願生天童淨蕩胎穢嚴攝北鄷神王受命普掃不祥玉女抱黃繡襦金璫聖毋護生福慶堂堂都吏甲馬捕災殃神吏甲馬斬付天綱擲火萬里流鈴八衝敢有厭魅拒遏胎嬰金鉞前戮巨天後刑屠割鬼爽風火无停千千截首萬萬剪形魔无干犯鬼无祅精三官北酆明檢鬼營不得容隱金馬驛呈普告无窮萬神咸聽三界五帝列言上清元造開始龍漢延康體同人胎混沌相包眼爲日月頭爲崑崙眉爲華蓋髮爲山林腸胃江海呼吸風雲聲爲雷霆岀初光明眇眇億劫其氣澤淪上无復色下无復淵風澤洞虚金剛乗天天生地育外護百關金氣堅剛質疆姿頑立劫之初无幽无㝠无形无影无極无窮溟涬大梵遼廓无光赤明開圖運度自然元始安鎭敷落五篇赤書玉字八威龍文保制劫運使天長存爾將降胎百神内存太一幽寥來過乂寧玉眞徹視華蕚流芳紫脉降絡曲折靈文腦膜丹縷自然流雲固攝命根使命長生梵氣彌羅萬範開張元綱流演三十二天輪轉无色周迴十方旋斗歷箕回度五常三十五分緫氣上元八景㝠合氣入玄玄玄中太皇上帝髙真泛景太霞嘯詠洞章金眞明郁流響雲營玉音攝氣靈風聚煙紫虚鬱秀輔翼萬仙祈求嗣續繼先承門風廻煙繞紫虚梵胞千和萬合自然成嬰嬰眞有神長生大君太乙主生司命紀年桃康合體遘精丹田執符把籙保命生根上遊上清出入華房八㝠之内細微之中永鎭人身泥丸絳宫中理五氣混合百神十轉迴靈萬氣齊仙仙道貴生无量度人上開化源生如飛輪罪福禁戒宿命因縁普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有空洞謡歌之章眞王靈篇辭參髙眞第一欲界祈嗣迎慶之音人道維何子孫是佑祖幹孫枝英房實茂世當綿泒淵胄遠久積德賜賢嗣上帝垂慶延稔惡斷爾續衰薾淪重泉帝心本無私福報爲善縁生民寡嗣孫黑籙在三天悔過祈至眞首罪露誠丹司命赦刑籍玉女抱眞還爲爾千年後積善廣眞源金車登紫庭慶積若丘山第二監生定嬰之章眞一玄一合爲天精飛露墮珠受胎爲人和氣肇元形模乃全精延入勝知而能言識明眞妙文武經綸爲帝爲王爲牧爲臣祖基爲先嗣承厥後生道不泯長生妙有積德垂代慶系无垠念道思眞至聖无親爰有簡籙福慧生民民亦何知謂天无神殺監貪嗔恣兆所行不知絶緒禍逮爾身天官執筆注其善功百子千孫禄食萬種兆能祈願醮禮僊公監生送魂九老降容使兆世其家生氣永不終故知道妙本太隂飛千龍第三玉帝聖子歌曰金闕絳霄飛龍繞嶽碧土紫房洞清寥廓帝有八子聖智神通長生大君赤日瞳朧青華東桑三天列封蓬萊僊王制命萬靈神璽玉䇿翠袍羽巾是皆上靈聖胄洪勲況爾下民貴繼其先杞祖奠宗慶延其門明不仰至教奏章敷玉文召氣得賢正祈爲聖君臣道常愛生化連連無斷倫隂陽合太和剛風舉其身此三界之上飛空之中眞王歌音音參洞章誦之百徧道氣充盈誦之千徧群僊監臨萬徧道備感激神靈生端潔士爲世賢人進道功業舉形上昇有聞靈音百神衛形勑制地祇岀入送迎拔出地戸五苦八難七祖昇遷永離鬼官魂度朱陵受鍊更生是謂无量普度无窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈眞王天機上宰垂系生民注定嗣續不斷孳育流通化源使生幾无盡自外得者後裔孫條孫枝擁茂自内得者雌雄神遇下接氣泉感生玉嬰禀受眞正肖顏同體紹立僊宗身得神僊分形萬德幽栖方寸神徧十方隱祕之音皆是大梵之言非世上常辭言无韻麗曲无華宛故謂玄奥難可尋詳上天所寳祕於神霄玉清上宮運當下傳垂教乃宣若有至人齎金寳質心依舊格告盟十天然後而付焉道言夫善信之士嗣子未立先胄不繼門閥萎落或屢生女男夭殤不成纔及幼孺便即淪没凡有此災同氣皆當奏詞投欵祈懇上眞齊心修齋六時行香十徧轉經福德立降嗣息生成慶延積世消諸不祥无量之文普度无窮道言夫末學道淺或福業未充祈求嗣續雖得生已未至成人多被夭害同學至人爲其行香誦經十過以度夭殤如法魂神徑上南宮隨其善功復得更生爲爾賢德之男慶延門第輪轉不滅便得神僊道言夫生民不知无後爲大定信此身滅已縁盡未明大道以生氣无終世世不絶爲本九玄七祖近世祖考廢泯時祀犯禁彌甚或年齒既大嗣續未立既常誕育不遂婚宦或生輙愚魯慧靈不開偶得成人不循四業所習凡下逺遊无方胎親憂憤弱稚縈疾治療无痊皆是父毋先世殃注訟呼所延悉當行香誦經祈求天司以招福慶夫齋戒誦經功德甚重上爲人君祈嗣蕃衍下爲兆庻延續家門生死受頼其福難勝故曰无量普度天人道言凡有是經能爲帝主兆民行是功德祈求之日發心修齋焼香誦經十過皆諸天記名萬神侍衛右别至人剋得爲聖君金闕之臣諸天記人功過毫分无失天中眞主亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語无量音道君撰元始靈書中篇東方八天緑應昭符黎學道蘇熈南允封契天合魚英晃爽夕麓素凝濡神灨誠布聿詔大魁鑒蹟匪回蘄永壽言帝澤寳有霄飛意冥道大真龍禳度沛度安祉變猷寀勝廣定南方八天綺命斗包子還戌髙天籍司枚福溱效嚴奚盧忻恚閱空辭彬洞咸幽計魂罔筵頥酎陣嶮縳鬼首樵肥鄒靈哿顏辨炳牛尼嶽驅機相玄省都微曜强注生監玄仰淵西方八天紀景靈定坤足邀明遥魔彦竪武箕婁魔洞洪寥濵元圖隱哥澤奕肆宗丘騎旼還縣禀列瞑億健由灘支務海洛冝勤棣般杳浦翹梭𣣱淇徧巒士浸蔚角秋火戈山北方八天酆程窅都支溪遄蕪歷眞离周氐室傳俞勿落盤濯神鳳著騫槎皇卷鋤謹命瓛序依攸憫遷覺稠倣傞雲兖披灊孟阿邢何龜華異邊祕邈道琪神曹把筵僊碧露芝道言此諸天中大梵隠語无量之音舊文字皆廣長一丈司命大禁南宫上宰監生大神以鸞羽紫瞳之紱書於絳臺瓊房金墉之上以為正音大定生息道氣襲隆祕諱之要侍文玉童玉女各六千人俠以寳華覆以龍巾有知其音能齋而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天嗣續貴壽慶延門閥大勲僊曹保舉上真道備剋得遊行三界昇入金門此音无所不辟无所不禳无所不度无所不成天真自然之音也故誦之致飛天下觀上帝遥唱萬神惠澤三界普聞群祅東首鬼精自亡琳琅振響十方肅清河海靜黙山嶽吞煙萬靈振伏招集群僊天无氛穢地无祅塵㝠慧洞清大量玄玄也元始无量度人上品妙經卷之四十二

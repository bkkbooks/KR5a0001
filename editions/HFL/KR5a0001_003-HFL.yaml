body:
  text: 天地八維安鎮國祚品道言昔於靜空天中朱落神風太玄妙土受元始度人天地八維安鎮國祚无量上品元始天尊當說是經周廻八過以召八維始當詣座天地八維大神上聖髙尊鎮國真君無鞅數衆乗空而來玉華紫氣瑞靄凝暉瓊車泛霞羽仗交映翠蓋駢羅香風散靈天精昭朗萬象澄鮮神光散揚黃霧芬苾緑羅泛景洞煥太盧八日八夜諸天日月星宿經緯魁衡一時停景金真玉明靈響靜空法雷輕震莫不肅然一國地土緬平一等山川煒麗林木敷榮威光應感天瑞咸臻衆真翊侍元始天尊玄坐玉蘂敷華御化寳牀之上說經一徧諸天大聖同時稱善是時萬國一切有情普䝉開化俱發善心說經二徧八維安鎮帝祚綿昌說經三徧品彚交和民人富樂說經四徧禍亂永消毒害不生說經五徧道化普宣咸陶聖範說經六徧天覆地載和氣沖融說經七徧靈文顯布正道清明說經八徧民物熈洽無有亊心說經九徧真文發現說經十徧嘉祥沓至是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊説經一徧東維无極无量品青華官君將吏無鞅之衆浮空而至說經二徧南維无極无量品丹華官君將吏無鞅之衆浮空而至說經三徧西維无極无量品皓華官君將吏無鞅之衆浮空而至說經四徧北維无極无量品紫華官君將吏無鞅之衆浮空而至說經五徧東北維无極无量品鬼門官君將吏無鞅之衆浮空而至說經六徧東南維无極无量品地戸官君將吏無鞅之衆浮空而至說經七徧西南維无極无量品人門官君將吏無鞅之衆浮空而至說經八徧西北維无極无量品天門官君將吏無鞅之衆浮空而至八徧周竟八維安鎮國祚官君將吏八景八威八史八神諸部仙官曹屬之衆一時同至一國男女傾心歸仰皆願天地八維福瑞應感安泰欣榮來聽天尊宣布法要安鎮國祚保天長存有如細雨宻霧無鞅之衆傾國圍繞非可禁止於是元始即於眉間額珠之上出異色寳光光分八道毎一道中現天書自然梵炁神符於此八維出此八符安鎮國祚保定乾坤復現丹章玉文靈篇迎至妙氣感攝嘉祥元始登引八維天曹地司官君將吏八方至真无量大神無鞅數衆俱入寳光之中天人仰看惟見拂拂從寳光中入混化梵炁神符之内既入寳光不知所在國人廓散地靄綿雲皎如柔玉元始即於妙景之内說安鎮國祚大法都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有殘傷傾土歸仰咸盡一心不欺不誣不忮不謀不毀不爭不佞不邪不媚不忍言尚忠正口無怨譽齊同慈愛異國成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝内名安鎮國祚禳解八維致福降祥隱韻之音亦是上靈内祕琅笈之書招集至真元聖妙有内諱保帝熈時之隱名也非世之常辭上聖已成真人通玄降靈力扶皇圖道持洪祚威伏邪醜德被生類能悉其章誦之八徧八維康靖六合乂寧諸天遥唱萬帝設禮河海湛然山嶽效靈日月重景璣星順𨇠群魔束形鬼精滅爽廻福延世安養種人至學之士誦之八過則五帝護國三天助持魔精喪眼鬼祅滅爽濟度垂死絶而得生所以爾者學士雖禀至科八維峙符安鎮靈法神氣未合體未洞真召制八神威未制天政德可伏御地祇東縳魔靈但請祥致福而已不能更生輕誦此章身則被殃供養尊禮家國興隆世世昌熾與善因縁萬災不干神明護門斯經尊妙獨歩玉京度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經八過天地八維八神官君將吏八景大神安鎮國祚八大神王八方真人同時齊到邪怪潜伏民物安和邦家寧鎮魔精妖魅八符禳解營護真靈八維之地伏骼蔵屍千年木石水火之怪丹蛇赤鼠隂影𥦙滯古昔之鬼徃衆先宗億曾萬祖幽魂苦爽皆即受度上升朱宫格皆九年受化更生得見太平而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經身合天地絡應八維頭中九宫上通太極八方玉文煥照身宫保鎮心君性靜無爲混合百神魂魄受鍊隂陽運靈左居無英右守白元中有晨暉照耀億千驛馬奏功司命結篇皆即受度飛昇南宫普世受誦俱獲道真玉符招神神安氣靈赤筋霜髓紫脉成文文布洞章骨變丹金則乃延壽長年後皆得作尸解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死䝉惠上天所寳不傳下世至士齎金寳效心盟天而傳輕泄漏慢殃及九祖長役地官侍經八維安鎮玉童玉女各三十二人營衛神文保護受經者身道言正月長齋誦詠是經安鎮寅卯辰巳午未申酉戌亥子丑之方維正之位兆域之中爲上世亡魂斷地逮役度上南宫七月長齋誦詠是經安鎮天地民物生靈咸遂道性克慕神仙諸天書名黄籙白簡削死上生十月長齋誦詠是經爲國王帝主君臣父子安鎮國祚保天長存世世不絶常爲人君安鎮其方民稱太平八節之日誦詠是經天地八維咸皆安鎮八景降祥瑞應備現靈文祕圖八柱刋瓊八官紀善道化保於無窮三元之日誦詠是經十二辰宫四方八維天神地祇施慈降福注定吉祥永使聖君上德日隆神洞無間體生玉華面有金顔魂神澄正萬炁長存断除苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黄白三色雲氣之中内外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室内八維符吏八面功曹環立侍直項生圓象内現天文龍鳳之書安鎮天地光映八維如此分明宻呪曰无上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋清堂修行至經无量度人願所啓上徹俓御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始无量度人上品妙經元始洞玄靈寳本章上品妙首安鎮度人天地八維八威隱韻凝篆自然八神赤文祖劫元真元始妙氣化生諸天開闡八維輔立天根天地神真分氣結身方維既定禍福乃陳上帝靈符辟魔護人無文不光無文不明無文不立無文不成無文不安無文不鎮是爲大梵安鎮乾坤國祚隆長慶瑞永綿鬱羅蕭境玉帝靈都上極无上大羅天中眇眇劫仞下至崑崙奠界八維區別萬方辨分正位皆有官君神吏守衛奏䟽上晨紀善注功率由于民大行梵炁周回八方中有天地八維之神直符殺鬼之使安鎮國祚之尊南極長生大君神霄真王青華之君出教立法保國護民符鎮八維天地朗明天省玉堂上相真君中有上宰玄司之君禳解災氣國祚咸寧中有南上司命司録延壽益筭度厄尊神清蕩方隅萬物欣欣今日開化諸天臨軒東維无極飛天護世神王長生大聖无量度人南維无極飛天護世神王長生大聖无量度人西維无極飛天護世神王長生大聖无量度人北維无極飛天護世神王長生大聖无量度人東北維无極飛天護世神王長生大聖无量度人東南維无極飛天護世神王長生大聖无量度人西南維无極飛天護世神王長生大聖无量度人西北維无極飛天護世神王長生大聖无量度人八維守符飛天護世神王長生大聖无量大神並乗玄雲都吏甲馬八維神官神吏旗旙騶騎乗駕風雲噴煙吐火龍神驛卒鬼官虎賁四面大將八臂神丁朱額青甲乗飊跨麟直符小吏安鎮靈曹地域之神億乗萬騎升降而來迎侍霄駕鎮國保生天機丞相南昌上官韓司主録八維大神執天地籍檢察萬神飛意宻召齊到帝前隨所方維嚴奏上天普告三界无極神郷泉曲之府北都羅酆三官九府十二河源急召積屍大靈星君使度生民八維剋害破射惡殺呼魄追魂上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼群元始符命安鎮升遷北都寒池部衛形魂地司保舉度品南昌天機都省道運長新死魂受鍊仙化生民生民受度劫劫永存隨劫輪轉與天齊年永度方維注害不干隨符安鎮保慶長年道備德成超凌三界逍遥上清上清之天天帝玉真護持國境梵行東方八天明持玉陽天帝至利師方角胎上極天帝勲夷思完儲淨妙有天帝群題士詢彦迹鉛宗天帝歷斬化常氐張輔皇天帝彭義慈太至昊祖天帝招機緫維祕瞢韓化天帝傳真識元𨓜邈希順天帝祖羅英南方八天㷬度霄炎天帝龍澌濔沙鑄神骨想天帝玄鮮生曜華麗舉天帝純寂渙池宣革慶鴻天帝香京沂牢變黼拭崇天帝肇玄慈名斗虚爓阿天帝真雲祕都阻義炎流天帝猛子廻堂略羽道餘天帝洞景易當西方八天紆論制魔天帝誥屠辛良栁寓偁當天帝伯定謨徼連紫鯨天帝奏祥敷傲靈悦空天帝上覺真越積渚安天帝演丘資賢宜封觀虚天帝峻淵辭朋義神飛廬天帝判極洞霞頌玄流景天帝泰遥康容北方八天兠玄隱微天帝氣襲龍枚兆化億光天帝保粹沖史阿奚幾天帝湊昌輪豫常尤俞天帝斷從堅賔張守符天帝曲回明方福王行𨓜天帝壽者晞靜原華鼎天帝度真天形道遠浩流天帝言永疆三十二天三十二帝諸天隱諱諸天隱名天中空洞安鎮國祚自然靈章八維隱韻安鎮之音安鎮之尊八維之神八維大魔八維之靈度符玄合變化上清无量之奥深不可詳召攝神真普度天人今日禳除度法歷關諸天請鎮國維斬絶祅群飛仙八景名列太玄真魔監舉無拘天門東斗定化西斗伏祅北斗斬姦南斗衛生中斗鎮惡總監八維青帝養育白帝輔成赤帝安民黑帝滅禍黄帝衛生保安兆時青天魔王安鎮東維赤天魔王寳符南離白天魔王西遏乃兵黑天魔王北維普寧黄天魔王八威神兵五帝大魔搜捕八維清肅天地總領鬼兵麾慞鼓節遊觀太空靈文煒煥羅布威光安鎮國祚嚴攝邪氛神王受命除世不祥玄蛇吐毒九都膽張天丁縛鬼北斗戮精擲火萬里流鈴八衝敢有干試拒遏八神金刀亂施千祅滅形仰嘯玉華俯咀絳津天地八維念道安真屠滅禍爽風火無停千千截首萬萬剪形魔無干犯鬼無祅精三官北酆明檢鬼營不得容隱金馬驛呈普告無窮萬神成聽三界五帝列言上清元始上帝和合三炁天地八維安鎮國祚之法祕於東華寳室威禁至重八維直符皆自然靈章飛玄之華九鳳之氣以成紫字用以救護世厄方隅邪怪境土不順之道若國境疾癘兵盗水火之難則行香修齋六時行道誦此妙經隨所災分丹書此符作旺相所宜之色設於國内焼香醮禮三天帝君八維神王將吏中庭法師仗劔歩躡斗罡禁氣誦呪隨所安符訖後三日或七日徹去壇席大吉如一家有方隅注害毒惡之氣身黄土符之殺亦用此符禳厭亦祭八維官君將吏等也此上清護世之文不可輕慢衛符皆有靈官童子玉女直符以申令行事焉具符如左八符或繒或紙金鑄石刻皆可毎維直符十九人使者三人守符官君將吏三千人安鎮東維青華丈人護世長生真符青書黑繒施震宫上安鎮南維赤靈真人護世旺福真符丹書黄繒施離宫上安鎮西維章簡玉女護世禳兵真符白書黑繒施兊宫上安鎮北維龍玄大神護世保祚真符黑書白繒施坎宫上安鎮東北維皓真靈君護世伏魔真符白書緑繒施艮宫上安鎮東南維碧仙神君護世通玄眞符碧書紫繒施巽宫上安鎮西南維玄真夫人護世寳皇真符黑書絳繒施坤宫上安鎮西北維天老帝君護世鎮國真符白書黑繒施乾宫上如上八符皆梵炁至精變化自然成文安鎮天地八維變災爲福帝尊萬年民有信誠取黄繒以丹書八符佩身辟萬邪千禍出入行來不
body:
  text: 蠲化水火災癘品道言昔於紫元寳皇天中空洞玉音大升明土受元始度人蠲化水火災癘妙品元始天尊當說是經周迴十過以召十方始當詣座天真大神上聖髙尊妙行真人無鞅數衆乗空而來瑞靄積霄靈煙揚彩瑶輪瓊輦華蓋垂廕萬景凝光百千寳色洞煥太空七日七夜諸天軓歩日月運度咸悉凝輝星宿𤪽璣舍次停流碧山層巘神海湛波天覆僊雲地成瓊玉臺闕長樓龍攀鳯舞素芝絳木捧露生香碧影金華普天共色衆真侍座元始天尊玄坐空浮九色直龍之上說經一遍諸天大聖同時稱善是時一國男女欣聽天尊宣說蠲化水火災癘慈救三界无量大法說經二遍天摇玉毫彌覆龍觀說經三遍明河瀉光玄珠飄灑說經四遍水騰火降變化自然說經五遍災癘不生劫數延逺說經六遍隂平陽泰氣無伏勝說經七遍混元顯化靈範流昌說經八遍冲用陶虚神真昭感說經九遍湧金爲壇神僊俯矚說經十遍枯骸重肉幽黨開明是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方无極无量品開運大神無鞅之衆浮空而至說經二遍南方无極无量品玉曆大神无鞅之衆浮空而至說經三遍西方无極无量品植劫大神无鞅之衆浮空而至說經四遍北方无極无量品度劫大神无鞅之衆浮空而至說經五遍東北无極无量品權量大神无鞅之衆浮空而至說經六遍東南无極无量品制水大神无鞅之衆浮空而至說經七遍西南无極无量品滅火大神无鞅之衆浮空而至說經八遍西北无極无量品蠲災大神无鞅之衆浮空而至說經九遍上方无極无量品化癘大神无鞅之衆浮空而至說經十遍下方无極无量品承濟大神无鞅之衆浮空而至十遍周竟十方无極天真大神一時同至一國男女傾心歸仰各施珍異神香妙衣无量法具旌幢繖蓋珮玉纓珠狀如屯雲宻雨无鞅之衆頂禮天尊願聞大法於是元始撫雕雲瓊几揮紫金丹光塵尾流眄垂光告命大衆十方天人曰吾自造立混沌化生二儀役御隂陽始封皇上元君青靈上真青天帝君青華帝君蒼華大帝青靈天君榑桑大帝九老仙都君上相青童君束華三官校量水火定平劫數極於九五八六之會地之維徑三億三萬三千三百億萬里南北則減千里東西増千里自地上至天半剛風八極則地之深亦如之通而廣之渾以相覆其數鉤股懸天之晷著地之儀移千里一寸而得之天之廣大約三百六十六萬里以萬天求之不可以爲度九氣青天天有九元九元運關周迴三十二覆晝夜三十日天氣一交一十二交爲一度三百三十度諸天氣王於木數至寅卯三千三百度青氣勃黃氣否陽數之九九者天之極謂小陽九六天氣上百官受會謂小百六此天氣勃於火宫巳午之嵗疫氣流行九千九百度青氣激黃氣蝕陽數九九謂大陽九六天氣反百神收氣謂大百六此天氣激於金宫申酉之歲兵疫並行三氣丹天運關三百六十度諸天氣王於火數至巳午三千三百度赤氣勃白氣否此小陽九小百六天氣勃於土宮辰戌丑未之歳土中生火九千九百度赤氣激白氣蝕此謂大陽九大百六天氣激於水宫亥子之歳當有洪災中央一氣黃天運關三百三十度諸天氣王於土數至辰戌丑未三千三百度黃氣勃黑氣否此謂小陽九小百六天氣勃於金宫申酉之歳瘴疫大起九千九百度黄氣激黑氣蝕此謂大陽九大百六天氣激於木宮寅卯之歳江河水溢災癘並興七氣素天運關三百六十度諸天氣王於金數至申酉國安民豐三千三百度白氣勃青氣否此則小陽九小百六天氣勃於水宫亥子之歳人民漂流咸至夭傷九千九百度白氣激青氣蝕此謂大陽九大百六天氣激於火宮巳午之歲赤怪焚𤑔災疾尤甚五氣玄天運關三百六十度諸天氣王於水數至亥子三千三百度黑氣勃赤氣否此則小陽九小百六天氣勃於木宫寅卯之歳水湧沛決人民夭傷九千九百度黑氣激赤氣蝕此謂大陽九大百六天氣激於土宫辰戌丑未之歳應以大旱五方運關三十二覆九千九百度周五方之氣皆上運元始青陽之氣迴轉靈寳玄都玉京山中周迴諸天日月星宿十空之外九億九萬九千九百九十九度天氣勃一劫之交天地再生此水火變化之道惟能蠲化則災癘自平是故道有九一天有九一地有九一人有九一四九合成三十六氣總會三十六天一一變生九一九九八十一元氣空有八十一道氣天有八十一聖天地有八十一真氣人有八十一僊氣總會三百六十氣道有三百六十虚无自然空玄之道天有三百六十聖化之道地有三百六十洞真之道人有三百六十骨節騰化飛僊之道此三百六十氣之所分化上有三十六空中有三十六天下有三十六地玄化在人則有三十六户道有三萬六千神變玄象天有三萬六千雲構宫殿地有三萬六千洞府人有三萬六千神識道爲玄空之至精人爲天地之至靈亦水火之變化也天地有劫數窮極水火之災癘惟上聖髙尊諸天帝王以平和之則劫數無終水火無激蝕之變世之水火災癘惟有道之聖君有徳之賢臣以平和之人身有水火災癘之變惟泰定無爲降火升水以平和之非至真上學所不能知凡此蠲化水火災癘大法之道元始說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無道響是時天人遏值經法普得濟度全其本年無有中傷傾土歸仰咸識道體實由水火二氣均調天地清寧人物安阜不爭不勝不勃不蝕不鬰不怫不抑不閉不塞不伏言無窮妄口無邪聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝内名隱韻之音亦是魔王内諱百靈之隱名也上聖已成真人内制靈寳真水無波丹靈無煙均調柔濟蠲化惡毒消滅災癘通玄究微能悉其章誦之十過北都唱嚴南陵録善火山揚光昭温和浹龍澤澄瑩天徳清平毒害消弭劫世綿永災癘不生人民康悅至學之士誦之十過則五行循運三災自除魔精喪眠鬼祅滅爽濟度垂死絶而得生所以爾者學士抱神御氣水火有倫斟酌燔烠理合有常不差不忒正其紀綱焚蕩之災收付天綱輕誦此章身則被殃供養尊禮門户興隆世世昌熾與善因縁萬災不干神明護門斯經尊妙獨歩玉京度人無量爲萬道之宗巍巍大範徳難可勝道言凡誦是經十過諸天齊到億曽萬祖幽魂苦爽皆即受度上昇朱宫格皆九年受化更生得爲貴人以經法通感致水火二真雙景合併竒偶得冝隂陽調平真氣内應上徹玄關諸天降庭昭響南陵也而好學至經功滿徳就皆得神仙飛昇金闕遊宴玉京上學之士修誦是經日月俠傍水火飛光蠲化災癘皆即受度飛昇南宮世人受誦則心火下降於紫室玄水上朝於金門中池朗秀白元懽忻害氣祓除真神長存後皆得作尸解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寳不傳下世至士齎金寳效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齋誦詠是經正三元之紀蠲化水火災癘之氣爲上世亡魂斷地逮役度上南宫七月長齋誦詠是經正五運之紀蠲化水火災癘之氣身得神僊諸天書名黄籙白簡削死上生十月長齋誦詠是經正六氣之紀蠲化水火災癘之氣爲國王帝主君臣父子安鎮國祚保天長存世世不絶常爲人君安鎮其方民稱太平八節之日誦詠是經正八方之紀大小劫運水火相伐勃蝕之災蠲化調平使九宫氣和人民康樂得爲九宮真人本命之日誦詠是經使支干無傷水火均適真氣自生魂神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿徳就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黄白三色雲氣之中内外蓊冥有青龍白虎朱雀玄武靜子白鶴羅列左右日月照明洞煥室内項生圓像光映十方如此分明宻呪曰无上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齋清堂修行至經無量度人願所啓上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始无量度人上品妙經元始洞玄靈寳本章蠲化水火災癘十迥度人百魔隱韻離合自然三天澄明霐寳不分元胞未開或浮或沉浮者爲陽沉者爲隂浮者炎上沉者潤下性成質具名曰水火有形無質若氣非氣爲至道祖爲太空精上水下火神濟其中上火下水氣營其門水火相交風爲之神變化天地生養乾坤金氣生明剛性發堅水潤成木木中成炎水火既具真土爲主土爲空母玉山上京黄房紫庭上聖九品帝極三真是由水火和感而生鬱伏彊弱變爲災癘頑敗朽惡氣撓神驚火精爲日水精爲月月成歳功日制軌刻三界萬物乃遂利亨五行六氣水火爲先大氣鍊養九萬九千赤明開圖運度自然歴水過火真得其真上無復祖惟道爲身水火交胎普植神靈靈文結篆龍鳳飛雲無文不光無文不明無文不立無文不成無文不度無文不生是爲大梵天中之天鬱羅蕭臺太微太階上極無上大羅玉清恍惚存亡水火真君行天運度畢觜昴參行人厄會水火漂焚行地爲癘土䧟山傾氣有逆順劫有壞成上真蠲化生道謐寧水火二氣周迴十方中有度人不死之神中有南極長生之君中有蠲化災癘之神中有度世司馬大神中有好生韓君文人中有南上司命司録延壽益筭度厄尊神迴骸起死無量度人今日校録諸天臨軒東方无極太玄神王長生大聖无量度人南方无極赤帝神王長生大聖无量度人西方无極九溟神王長生大聖无量度人北方无極洞海神王長生大聖无量度人東北无極火藏神王長生大聖无量度人東南无極絳府神王長生大聖无量度人西南无極水藏神王長生大聖无量度人西北无極黑穴神王長生大聖无量度人上方无極海空神王長生大聖无量度人下方无極元火神王長生大聖无量度人十方至真飛天神王長生度世无量大神並乗三素流雲八瓊丹輦風輪霞帳虎蓋蚪軒驂駕朱鳳五色玄龍建七燿之節九色靈旙前嘯萬舞齊唱後吹千籥同鳴朱鳳蒼蚪嘯歌噰噰玄獸神禽喙音宛宛五老啓途羣僊翼轅億乗萬騎浮空而來傾光回駕監真度生水火二相南昌上宫韓司主録監生大神執籙把籍齊到帝前蠲平水火災癘無干隨所應度嚴校諸天普告玄都玉京天闕十二宫分六甲之元水不濫溢火不焚然玄精守位絳章伏潜水火合氣不得流遷大小劫運九六之天消平災癘三界咸安無極神郷泉曲之府北都羅酆三官九府十二河源水怪弭息洪波靜淵九靈奉書𡨚負明伸上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼羣元始符命時刻昇遷北都寒池部衛形魂制魔保舉度品南宫死魂受鍊僊化成人生身受度劫劫長存隨劫流轉與天齊年永度三塗五苦八難超凌三界逍遥上清上清之天天帝玉真無色之境梵行水火災癘即大小陽九百六之變也惟種民天已上三炎不及自紫微垣至九壘重隂皆災害所及之處雖聖賢真宰不能變遷亦如日月之蝕也惟昇入無形方免水火之患此天亦三界之天與靈寳同法東方八天大濟榮稽天帝楚凡流阿邵真梵光天帝求何宗都靈觀陽符天帝彭樓提真淵鎮扶揺天帝伯嶽原殊太微正度天帝師聰耻明八景洞真天帝曷寧晶魁會昌延化天帝司典公樞紫津燿神天帝辨俁稱南方八天雲瓊憫玄天帝定思顯權玉闕禁盈天帝獨俾滋嚴
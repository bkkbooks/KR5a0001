front:
  text: 靈寳無量度人上品妙經卷之五十八宙八
  hash: sha256:383d4efa0f61d433fe896ed4f383922de0081b115c52da375b91c063a9e35995
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_058-001a, image: hfl/0012/0012-086.png}
body:
  text: 廻生起死品道言昔於紫空燿景天中玄風洞歌大靈妙土受元始度人廻生起死無量上品元始天尊當說是經周廻十過以召十方始當詣座天眞大神上聖髙尊妙行眞人無鞅數衆乗空而來靈煇燿虚瓊車玉輿扶華宸蓋雲旌四張瑞靄交鬱彌羅八纏五日五夜諸天諸地隂陽機運一時停回玄綱振肅海嶽澄明品物咸和普安其生一國地土山川林木凝鮮一等無復殘毀土皆作異寳燦麗熠熠衆眞侍座元始天尊玄坐空浮萬氣雲華寳座之上說經一遍諸天大聖同時稱善是時一國男女禍害不作無有夭傷說經二遍災病蠲消說經三遍翁艾返嬰說經四遍垂死得生壽獲永延說經五遍死入輪轉即獲昇遷說經六遍沈屍九鍊隂質廻生說經七遍受化太玄枯骨復形說經八遍普世明悟道性還淳尚德貴正斷滅姧邪說經九遍學道得道求仙得仙說經十遍妙氣周備混合神明是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品道化大神無鞅之衆浮空而至說經二遍南方無極無量品明性大神無鞅之衆浮空而至說經三遍西方無極無量品結氣大神無鞅之衆浮空而至說經四遍北方無極無量品開慧大神無鞅之衆浮空而至說經五遍東北無極無量品生䰟大神無鞅之衆浮空而至說經六遍東南無極無量品育形大神無鞅之衆浮空而至說經七遍西南無極無量品保命大神無鞅之衆浮空而至說經八遍西北無極無量品延年大神無鞅之衆浮空而至說經九遍上方無極無量品廻生大神無鞅之衆浮空而至說經十遍下方無極無量品起死大神無鞅之衆浮空而至十遍周竟十方無極天眞大神一時同至一國男女傾心歸仰一切淪化沈冥屍過䝉被道恩生氣入身旣死返形來者有如山嶽出雲四塞彌漫無鞅之衆迮國一半土皆偏䧟非可禁止於是元始開七寳山啓無邊目約衣歛几凝觀遐想以告衆眞曰衆生迷誤罔覺玄眞旣離胎育情逐化遷縁類隨著遂生業因業累敗性徇識爲愚利害交攻情色蕩意初爲童稚逮于壯時顧視之間已及於老焦牢枯竭生氣旋盡至於死壞殊不知道爲生德生爲道根心存於道常與生俱物有生死道無生死存道於形生氣自續數極形盡道復能生生道旣固不從化遷保形不化永存綿綿廻生轉死上眞所崇今爲衆等開演妙本普度無窮於是元始振揚華拂景霧四騰如雲如煙靄浮空際去地九丈元始攝引天眞大神上聖髙尊妙行眞人十方無極至眞大神無鞅數衆俱在景霧之中地還平正無復欹䧟元始即於景霧之上說經都竟衆眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度永植生根無有沈淪傾土歸仰咸行道心不競不擾不任不勤不念不欲不貪不嗔不營不思言無藻麗口無怨咨齊同慈愛異骨成親國安民豐欣樂太平經始岀教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝内名隱韻之音亦是眞王廻生起死內諱百靈之隱名也非世之常辭上聖已成眞人通玄究微能悉其章誦之十過諸天攝氣萬道齊眞靈化開宣咸受玄恩生津永啓召魄收䰟沈零結育以返屍形廻生起死白骨成人至學之士誦之十過則五帝命靈三元䇿眞靈眞降合死道散隳濟度垂死絶而得生所以爾者學士道氣未純體未契眞保制萬神德未全至用可回度命機開導生津但起死而已不復轉輪輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因縁萬災不干神明護門斯經尊妙獨歩玉京度人無量爲生道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到生道開明返化結軀億曽萬祖幽䰟苦爽亦皆受度上昇朱宫格皆九年受化更生得爲眞仙而好學至經功滿徳就皆得舉形飛昇金闕遊宴玉京也上學之士修誦是經皆即受度飛昇南宮世人受誦則延壽長年乆視無窮後天長存運數雖極並皆得作解化之道遁變神明不經絶滅常欣保榮逍遙十天此經微妙普度無窮一切天人莫不受慶無量之福生死䝉惠上天所寳不傳下世至士齎金寳效心告盟神霄而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齋誦詠是經爲㧞度衰亡死滅極㑹之災得保生存七月長齋誦詠是經神氣常全厄難蠲消名奏青籙當獲長生十月長齋誦詠是經爲普天率土保度民物仁壽咸臻與天無傾世世衍溢戴仰人君安鎭國祚萬劫昇平八節之日誦詠是經造化不愆金木交并神氣和同養育皇靈枯朽更生受其鍊度得證仙眞本命之日誦詠是經身保清貞體用日新禍患永消長享福祥天曹録善地司滅連慶延七祖名奏三天功滿德就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黄白三色雲氣之中内外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室内廻生起死玄化大神侍衛前後項生圓象光映十方如此分明宻呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始無量度人上品妙經元始洞玄靈寳本章廻生起死萬變度人眞王隠韻混合自然玉虛妙文總括至神元始之初洞化玄元肇明三氣生育萬靈是爲道本無所不眞隂陽總㑹玉華煥彰無文不光無文不明無文不立無文不成無文不度無文不生是爲大梵妙粹之宗紫清上京瓊室雲房極眞所御生化之根浩浩帝氣或聚或分朱陵丹天瑶臺閬風玉宸紫館方諸鬱青廵布流衍周廻十方中有度人起死之神中有廻生結化之君中有三素元君大神中有十方皇靈丈人中有南上司命司録延壽益筭度厄尊神廻生起死無量度人今日校錄諸天臨軒東方無極度命神王長生大聖無量度人南方無極鍊䰟神王長生大聖無量度人西方無極衛質神王長生大聖無量度人北方無極保化神王長生大聖無量度人東北無極致仙神王長生大聖無量度人東南無極寳氣神王長生大聖無量度人西南無極廻生神王長生大聖無量度人西北無極起死神王長生大聖無量度人上方無極超形神王長生大聖無量度人下方無極成德神王長生大聖無量度人十方至眞飛天神王廻生起死無量大神並乗灝彩梵氣金宸紫翠流華景雲瓊鑾散花八威羽輦絳旂組帷霞輪珠蓋驂駕龍鳳建執巾幢前嘯玉眞齊唱後吹簫籟同鳴獅子白鶴嘯歌噰噰六眞啓途四將翼轅億乗萬騎浮空而來傾光回駕起死廻生天機丞相南昌上宫韓司主録監生大神執籙把籍齊到帝前隨所應度嚴校諸天普告三界無極神郷泉曲之府北都羅酆三官九府十二河源速召司命廻生命還筭窮増夀形死易籖句姓移名黑籍灰焚上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼群元始符命時刻昇遷北都寒池部衛形䰟制魔保舉度品南宫死䰟受鍊仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度三途五苦八難超凌三界逍遙上清上清之天天帝洞眞無色之境梵行東方八天洞幾寂夷天帝重光晞明孔常茂祺天帝瑶旁祖璫彦麗漢度天帝翹亞寵璐昌治秔銖天帝方詵九圖冲忽晝虛天帝就佽爰表雍田禧福天帝覺龍燕斤全遙無思天帝斗巨莽沙側清舉藝天帝侯符命連南方八天角千火杵天帝霞鮮明尊洞微浩陽天帝和裔並耀起龍進成天帝藻濟倣滁極鵰祥天帝褒允嘉峻房光重天帝定中慈昇洎正由仙天帝邈思雲襄空玄懷漠天帝輔寧氏安崑嶼芳凝天帝妙曩滋來西方八天寳熈列儀天帝邈師至京道維部需天帝九宸微樞歷陶極眞天帝廻賛育敦慶緒統皇天帝蒲延已存制魔曠猷天帝澤煥頥洹亮恭侍祥天帝敷遠頓章溶境麗光天帝玉攴鹿歩夏琳朱府天帝月嬰無將北方八天聚咸承籍天帝演題池琥馬應崇元天帝頌頥布靈蘿暠福世天帝神洋觀璞詔印八鸞天帝都仙機𨓜登翠廓天帝燄摉披堂霄庭應朝天帝慧總龍釋虛素文天帝玄元神長梵元勝樂天帝行維上監三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻召生之音立命之尊感化之神變化屍魔出胎成靈陽和隂合降氣上清無量之奥深不可詳敷落神眞普度天人今日欣慶受度廻生起死歷關諸天請滅三惡斬絶地根飛度五苦命生太玄魔王監舉無拘生門東斗送䰟西斗筮魄北斗定品南斗課年中斗主福大魁保生周護三台總監衆靈青帝知覺白帝興能赤帝動識黑帝鍊精黄帝受形萬神居身青天魔王廻生繼絶赤天魔王還氣甦血白天魔王引息如繩黑天魔王六用通靈黄天魔王制鬼育嬰五帝大魔萬神之宗飛行鼔從總領鬼兵麾幢鼓節遊觀太空自號赫奕與天齊功上天度人嚴攝北酆都天受命普掃不祥八威起死枯朽更芳神龍列馭眞吏揚威天丁呼䰟大帥舉身百神返歸玉輅金軒死注斷絶鎭鬼北山擲火萬里流鈴八衝敢有干試拘遏上眞金鉞前戮巨天後刑屠割鬼爽風火無停千千截首萬萬剪形魔無干犯鬼無祅精三官北酆明檢鬼營不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列言上清寰虛遐黙劫胞混康眇眇億萬生化混沌外無定色内無定淵風行六虛金液浮天天上天下無幽無㝠無形無影無極無窮溟涬大梵遼廓無光中有至精自知自生覺亦無覺明亦無明不以覺明道化全神神來即生神去即死生即胎謝死乃蒂落氣接神生氣索神消血結骨枯挺然屍居九蟲爲魅蝕腦啖髓藏神泥丸生道固天神不去身起死成人爾有道力枯骨更生死滅冥黙䰟遊魄息如劫未開昏昏寂寂赤明開圖運度自然元始安鎭敷落五篇赤書玉字八威龍文保制劫運使天長存梵氣彌羅萬範開張元綱流演三十二天輪轉三界周廻十方旋房歷心廻生起死還返五常三十五分總氣上元八景冥合氣入玄玄玄中太皇上帝髙眞泛景神霄嘯詠洞章金眞煥擲流響雲營玉音攝氣廻風聚烟紫虛鬱秀輔翼萬仙千和萬合自然得生生命有神長生大君無英左官白元右神太一色識司命頒靈桃康氣元合延母精執符把籙追死更生上遊上清出入華房八冥之内細微之中下鎭人身泥丸絳宫中理五氣混合百神十轉回靈滌鍊神形三一還眞萬氣齊仙仙道貴生無量度人上開八門飛天法輪罪福禁戒宿命因縁普受開度死䰟生身身得受生上聞諸天諸天之上各有生門中有空洞謡歌之章廻生靈篇辭參髙眞第一欲界飛空廻生之音太空之中無有内外一熒生光變此天地天地何生熒光爲神神立成氣氣亦無形無形無名化生三清乾坤萬類以此得生能保此生生來無蹤天道貴生鬼道貴終終盡其氣不終其神神無終始和以天均自然廻生死壞不經死者神逝胡不留神神其可留生死俱濟屍形委委見性忽無見無所見與眞爲徒骨有玄空氣人如風歘然神至笑語形容此道維何以意合玄玄通意感自然而然靈文廻玉萎屍返五官我誦上清章制魔詣可韓執契告司命沈冥立生還第二色界起死長生之章赤扉景霄上環日流紫煙中有緑衣人吹簫乗白蓮稽首玉清王校籍徵萬仙執籍招九䰟秉策開八關命窮呼帝皇寳杖指神還延生佩黄縷赤書鬱斕斑七魄入蘂房玉女啓瓊軒羽蓋羅太上青龍遶烏鸞白雲廻絳宫靈光舞胎仙命魔塞寒池誅姧瑩竒泉滅形無常鬼恭誦大有篇百神守太玄流珠響珊珊靈津濯枯枝柔條翳蘭鮮眞氣洒八極玉骨同蜕蟬上道貴簡妙祕語寧輕宣第三無色界髙上神霄玉清王歌曰眇眇玉闕碧頂在上梵氣如河流演八天鳴湍冩鍊沸濤絞雷我氣炎衝萬物生回三界有生俱承妙氣黃𥹋金液山横鼎峙賦其巨者髙眞仙王與其細者公侯珮璫研丹比豆玉京俄就日月交飛我命長乆亹亹繁生握珠目得不知太空玄道是則化機不運三界休息眞一未明五行爲賊顧彼嵳峩風謡空歌咳笑浩劫神都可過我位上王萬變玄中惠兆絶命九竅互通返屍生形致天六龍至陽若無有感和忽玄同此三界之上飛空之中眞王歌音音參洞章誦之百遍名度南宮誦之千遍靈魔保迎萬遍道備飛昇太空過度三界位登仙公有聞靈音廻生返形勑制地祇侍衛送迎㧞岀地戸五苦八難七祖升遷永離鬼官䰟度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及神霄眞王隱祕之音招致生眞還復屍䰟九宫揚靈煇三府凝玉津身被紫景面澤朱光超凌玄都皆是大梵之言非世上當辭言無韻麗曲無華宛故謂玄奥難可尋詳上天所寳祕於神霄玉清上宫東華寳室依玄科應運下傳若有至人齎金寳質心依舊格告盟十天然後而付焉道言夫天地運度亦有否終日月五星亦有虧盈至聖神人亦有休否末學之夫亦有疾傷凡有此災皆可廻還生氣起濟窮絶同氣皆當齊心修齋六時行香十遍轉經福德立降消諸不詳無量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太隂臨過之時同學至人爲其行香誦經十過以度屍形如法則生神赴身宮室開明死戸閉塞穢胞蕩清天機玄省南昌上宮返其䰟神隨其學功計日而得更生轉輪不惑便得神仙道言夫廻生起死靈寳所重神霄禁書大至天地細逮人物皆有生死増減益筭之道天地運終己亥交氣星宿錯度日月失昏躔次推移四時失度隂陽不調金勝火伏國境有災兵盗時作太一行宫疫毒流行兆民死傷人運臨剋師友命過眞譜斷宗亦當修齋行香誦經廻生以成吉起死以破凶福應不淪生道咸頼切於己形施於天下靈祕至微下學殊昧夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受頼其福難勝故曰無量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋焼香誦經十過皆諸天記名萬神侍衛右别至人剋得爲聖君金闕之臣諸天記人功過毫分無失天中魔王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君撰元始靈書攝氣還和玉篇東方八天帝錫寳瑄賚仙績洪元奥昊允資昇九冲確璃峻翹璨華炎封邃亶瑶廓靈池杳府鑒池斗普載護龍祖尚師趫騫願寂宿與丹䇿韓璽玉璣遠威奏逕直鑾偏呈丘陂南方八天軸璆蘭序展𨓜冒弸歌移追胡回靈君漢萬齡柱天金鑿曜殿葳萎美眸皎慶枚施爵關神那彊鄙攸司鬼社興生獨官阿泉濟龍穴大灌瀆盿玄秀魁璘女福和育千西方八天适録伊駟隂裳比暄漬雲吸灨白鍊虎遍氣弦浴神庚䰟繞乾斗閣注簡命皇奏延渾恍廓合應殊交淵沔漠甫察丹露虯仙竟祈蕭琢月薦璵偕整審屍爽宸令迅傳北方八天極道無壁青神意閧溢漿泝巓黙求取饗餌歛藏鬼鳳石玉響香英靜南俱圍並黨隙窬宻靈妙好自并忽劫億仞止圓洞清教滔唱繁眞至眇綿浩宅罔住混古稽言道言此諸天中大梵隱語無量之音舊文神霄眞王紀録紫臺碧閬之上招諸天以回生勑北都以起死鬼神禮之以増靈仙聖佩之以洞妙天地因之以化育隂陽通之以媾形鼓槖運神氣來命㑹生道之諱不可不知以保長存天眞皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣廻生復形神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勲眞仙保舉上清道備剋得遊行三界昇入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致神王下觀上帝遙唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響十方肅清九峯靜黙七澤吞煙萬靈振伏招集群仙天無氛穢地無祅塵冥慧洞清大量玄玄也元始無量度人上品妙經卷之五十八

front:
  text: 靈寶无量度人上品妙經卷之二十一玄一
  hash: sha256:ebf30838b87285347ff33d5b18c9039c6929914264aff67b285ab04f612bafa5
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_021-001a, image: hfl/0005/0005-004.png}
body:
  text: 生化胎根斷除邪穢品道言昔於始青天中紫霄空歌太極玄土受元始度人生化胎根斷除邪穢无量上品元始天尊當說是經周回十過以召十方始當詣座天眞大神上聖髙尊妙行眞人無鞅數衆乘空而來絳煙捧塗華晶燿輦丹碧浮駕洞光羽輪五明錦色蓋映霞芳九氣合彩洞煥太空七日七夜諸天樓闕遥開玉毫隱顯星珠絡緯日景自停神隂舒煇金波泛滉璇璣玉衡還斡靈和注浹空海神風回混翠峯蟠偃天無浮翳四氣明清一國地土山川林木緬平一等無復髙下土皆作碧玉無有異色衆眞侍座元始天尊玄坐空浮七宸九華明离寳座之上說經一遍諸天大聖同時稱善是時一國男女妙氣凝胎生根超秀說經二遍邪穢斷除結節通解說經三遍神棲空洞梵氣冥涵說經四遍骨有玉華顏揚金色說經五遍七世散仇福堂慶㑹說經六遍紫煙灌身百神愷樂說經七遍雄雌混化三一昇遊說經八遍神光内映徹見百關說經九遍心悟洞靈證眞帝臺說經十遍䇿名玉清侍宸金闕是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方无極无量品青帝梁虚生化胎至眞大神無鞅之衆浮空而至說經二遍南方无極无量品赤帝仲明賔除穢至眞大神無鞅之衆浮空而至說經三遍西方无極无量品白帝詡成豫化胎至眞大神無鞅之衆浮空而至說經四遍北方无極无量品黑帝元道冥除穢至眞大神無鞅之衆浮空而至說經五遍東北无極无量品八景明微君化胎至眞大神無鞅之衆浮空而至說經六遍東南无極无量品八景玄靈君除穢至眞大神無鞅之衆浮空而至說經七遍西南无極无量品八景眞華君化胎至眞大神無鞅之衆浮空而至說經八遍西北无極无量品八景靈暉君除穢至眞大神無鞅之衆浮空而至說經九遍上方无極无量品八景吟穴君化胎至眞大神無鞅之衆浮空而至說經十遍下方无極无量品八景祕形君除穢至眞大神無鞅之衆浮空而至十遍周竟十方无極天眞大神一時同至一國男女傾心歸仰來者各相謂言元始天尊在始青天中演說生化胎根斷除邪穢之法我等自入流轉不出生死貪嗔愚癡墮在諸有雖福業因縁得生天上而諸天人愛迷執戀纔捨塵染尚居細塵習氣不除動罹結滯感化胎元不得淨盡生根堅固著於不滅以住爲本不知道體玄妙包養太空九聖十眞本無生滅胎根未斷致此撓競互相變化遞爲種族屍血流行骨壞形朽我雖天人未出三界形未獨化與道相隔縱使化身猶在色境故於相視接手語言音聲不契大洞使三尸蕩流穢血生瘕邪魔乘襲背遠眞道今當傾聞法音帀繞天座億劫之衆一時同㑹非可禁止於是元始埀衣正視命黃素元君執方規之鑑天地眞形支勢成字白素元君擊洞陽之鐘十方合響萬天交唱紫素元君埀浩景之珠大如𥞫米在空玄之中去地九丈元始登引天眞大神上聖髙尊妙行眞人十方无極至眞大神無鞅數衆俱入寶珠之中天人仰看惟見勃勃從珠口中入旣入珠口不知所在國人廓散天光煇映萬氣肅清元始即於寶珠之内說經都竟衆眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度解散結節齗絶邪源傾土歸仰咸行至心忘累忘有忘化忘得忘念忘情忘識忘動忘息忘形言無理宗口無欲聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝内名隠韻之音亦是魔王内諱百靈之隱名也非世之常辭皆生化道胎清鍊胞根斷除邪氣斬滅血屍修眞洞極之要言上聖已成眞人通玄究微能悉其章誦之十過諸天遥唱萬帝設禮河海靜黙山嶽藏雲日月停景璇璣不行群魔束形鬼精滅爽回屍起死白骨成人至學之士誦之十過則胎根生化無有世縁邪穢凋落百神合形五帝侍衞三界稽首魔精喪眼鬼祅滅爽濟度埀死絶而得生所以爾者學士邪穢漸消心未洞玄以制十方威未制天政德可伏御地祇束縳魔靈但得度身而已不能普濟萬生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因縁萬災不干神明護門斬經尊妙獨步玉京度人無量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到玄上丈人爲兆解禀胎已來宿血瘕穢赤黑大滯西明君爲兆解胞中積水腥汙屍鬼潢溺泉曲寒池之釁訟在水官考注不止連及生人生死之根災禍萌蘖不得興作使胎根生化玉液仙英妙姿自然得道七魄遊逸魔彭伺姦外構邪鬼淫犯胎宫夜夢燕樂與鬼同營太上玉帝以紫光九靈寶札詣南宫韓君丈人天機省中監簿按籍檢考善功生化胎根斷除邪穢億曾萬祖幽魂苦爽皆即受度上升朱宫格皆九年受化更生得爲貴人而好學至經功滿徳就皆得神仙飛昇金闕遊宴玉亰也上學之士修誦是經皆即受度飛昇南宫世人受誦胎根惡濁鍊化故氣尋得斷滅生化仙眞邪魂穢魄淘澤清淨則延夀長年後皆得作屍解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死䝉惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經上部九宫青帝羅文英執青宫之符開兆百關解散結節帝一内懽紫煙灌身神光洞照羽煇映玄爲上世亡魂斷地逮役度上南宫天機省也七月長齋誦詠是經中部九宫白帝寓文昇執素靈之符爲兆生化胎根使斷凡因流轉停關邪正速分穢垢清蕩日霞瑩形太素生五臓七雲入泥丸身得神仙諸天書名黄籙白簡削死上生十月長齋誦詠是經下部九宫黑帝鄭文通執黑帝之符入兆膀胱中使胞胎屍滅百穢遏絶邪魔祅爽然骨瀝血兆體有五帝之玉暉面有流金之皓姿常與太一公寢魁抱明月爲國王帝主君臣父子安鎮國祚保天長存世世不絶常爲人君安鎮其方民稱太平八節之日誦詠是經得爲九宫眞人三元三宫二十七眞雄一无英雌一白元五宫竒耦交變又玄生化胎根掃誅邪源孕精流光玉嬰生蓮帝一坐壇萬靈莫先本命之日誦詠是經十二大結三百六十骨節八關九宫神蓋童子中池内神感鍊變易生化胎根斷除邪穢使身不傾魂神澄正萬炁長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黄白三色雲氣之中内外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室内三部八景二十四眞環衛嚴肅項生圓象光映十方如此分明密呪曰无上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋清堂修行至經无量度人願所啓上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始无量度人上品妙經元始洞玄靈寶本章生化胎根斷除穢氣十回度人百神定命離合自然雌一變魄雄一化魂混洞變化中有帝尊呼陽召隂鍊精玉胞升降明堂煇映景霄内結流珠融媾萬方紫霞素雲玉嬰金光絳闕神池宛轉泠風下有北都萬鬼之營青蠱白姑蝕兆胎靈赤黑二魔賊命之基帝君符告勑斬血屍洗淨胎穢與氣交并鼔治眞元運化太冥上宫圓虚洞房玄丹明童持火焚燼邪根嬌女聞簫辟非和煙帝眞胞命䇿名上玄靈府散朗位登髙宸鬱罷蕭臺玉山上京上極无上大羅玉清眇眇劫仞若亡若存下備一身主制七關三部八景森列萬神三華離便大有妙庭金闕玉房玄煇燿靈大布正炁周回十方中有生化胎根之神中有斷除邪穢之君中有混合百神之君中有解結散節之神中有變胎易胞之神中有南極長生帝君中有東極青華帝君中有天機韓君丈人中有南上司命司録延壽益筭度厄尊神回骸起死无量度人今日校錄諸天臨軒東方无極飛天定生神王長生大聖无量度人南方无極飛天感化神王長生大聖无量度人西方无極飛天變胎神王長生大聖无量度人北方无極飛天斷根神王長生大聖无量度人東北无極飛天易胞神王長生大聖无量度人東南无極飛天解結神王長生大聖无量度人西南无極飛天散節神王長生大聖无量度人西北无極飛天極眞神王長生大聖无量度人上方无極飛天去邪神王長生大聖无量度人下方无極飛天除穢神王長生大聖无量度人十方至眞飛天神王長生度世无量大神並乗翠霞三景瑶輦素雲十華丹輿羽蓋瓊輪驂駕朱鳳五色玄龍建九道招神之節七絶霜羅之旙前嘯九鳳齊唱後吹八鸞同鳴靈眞導前吟詠洞章群仙景從嘯歌嗈嗈億乗萬騎浮空而來傾光回駕感化定生天機丞相南昌上宫韓司主録監生大神爲兆胎根生化玄靈胞門紫房中有大神叩玉鳴鐘擲火流鈴滌盡氛穢去血屍彭結節赤黑二十四關布兆生氣除却邪紛執籙把籍齊到帝前隨所應度嚴校諸天普告三界无極神郷泉曲之府北都羅酆三官九府十二河源上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼群元始符命時刻升遷胎根生化返塵歸眞斷邪除穢招鎭百神七祖散仇五帝監盟北都寒池變化形營鍊骨成仙出入无門制魔保舉度品南宮死魂受符仙化成人生身受度劫劫長存隨劫流轉與天齊年永度三塗五苦八難超凌三界逍遥上清上清之天天帝奎零無色之境梵行東方八天至眞堂回天帝輝離无生虚洞普摇天帝賀眞彌倪逺師崇濟天帝淵虚子鋹皓景環宗天帝相雲孳光略无燕神天帝爼司越章牛岵兆壷天帝直盧奚敦妙宮蔽无天帝亮辨由都顧靈定度天帝康化治衍南方八天喬繁麗空天帝變无元昌持命典仙天帝覺玄覧常元師究由天帝寂度孟斗霸澤回華天帝理名正騫太素夷微天帝廓益遼眞序乾標谷天帝羊輅國賔道表臻祥天帝麓錫來冥轉運邦天帝慶祖辤仁西方八天龍玄胎神天帝車梁賜蒂丘定漾炁天帝頥窮景冲昭力支羅天帝九用茲瀛孝至岡虞天帝極根環元洞化寶陽天帝玉汴自檀靈緒混甘天帝産珠凝方救牢拔塗天帝蔽山都眞流曜絳章天帝晉關肇宣北方八天耿易火帝天帝强完明華意寶聚眞天帝百憩隂成漑本歷孚天帝知玄得容河陣肆師天帝榖原彦昇鑄精育神天帝交鈴紫肆胞命元化淨光天帝秀隆幽虚芒兟欲度天帝並炁壷完觀竺吉猷天帝正𤤠寂仙三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隠韻洞眞之音洞无之尊洞觀之神攝制大魔變化神靈臭肺吞賊與天同生飲血揺精濳伏胎根使命夭閼仙道不成屍鬼改易飛身泥丸隱藏胞蒂隂構外邪入登玄牕薰亂宸霞上帝斬摧神燕玉堂九和十合變化空常无量之奥深不可詳敷落神眞普度天人今日欣慶受度歷關諸天解散結節斷絶胞根飛度五戸名列太玄魔王監舉無拘天門東斗延生西斗鍊胞北斗除穢南斗仙胎中斗混洞一合生神青帝徊風白帝命靈赤帝保根黑帝澡形黃帝守中胎穢不生青天魔王鬱珠洞羅赤天魔王炎光滅精白天魔王斷胞交眞黑天魔王伐邪命神黃天魔王洞觀太英五帝大魔萬神之宗飛行三界總攝眞胎揮邪命靈七關廓開流布妙化上變九回穢滯旣蕩骨肉同飛天眞承命召致福祥眞功内充神威外張凶祅殞息邪精伏藏浩炁纒結三丹玉房共輔帝化却滅凶衰六天大醜豁落誅摧金光散景玉道交馳拔度七祖𢷤絶百非三官黑書永落禍基不得容隱明正元機普告無窮萬神總歸遊宴玉闕列言太微空洞九玄玉帝玄靈招霞散景含虚紫煙降神玉妃舞華胎仙道本生化靈根無垠髙極太无上列諸天天上天下无幽无冥无形无影无極无窮溟涬大梵寥廓无光赤明開圖運度自然元始安鎭敷落五篇赤書玉字八威龍文保制劫運使天長存梵炁彌羅萬範開張元綱流演三十二天下逮一體混化五神眞命應仙玄紀彌綸九府六𡖖列坐蓮胎玄一洞魂踞斗跨魁左扶火王右奠伯嬰掃穢除邪玉靈四開位證金宸制到萬靈輪轉无色周回十方乘蹻飛歩斡運七元驅除邪穢澄廓璇羅充溢七門灌養青芽二十四圖總攝眞方八景冥合升降混黃中有玄一上帝髙眞泛景太霞嘯詠洞章金眞朗郁流響雲營玉音攝氣靈風聚煙紫虚鬱秀輔翼萬仙千和萬合自然成眞眞中有神長生大君紫戸青房流鈴大神坐鎭明堂守護玄眞執符把籙生化胎根斷除邪穢出入九宫八景之内細微之中蕩淨胃池通理百關速召萬神混合泥丸十轉回靈與氣齊仙仙道貴生无量度人上開八門飛天法輪罪福禁戒宿命因縁普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有空洞謡歌之章魔王靈篇辭參髙眞第一欲界飛空之音人道眇眇仙道莽莽鬼濳胎根當人生門使爾愚凡不樂仙眞虚宮襲邪穢腐來攻髙上清靈爽洞微同太虚生化寶胎根使爾仙道成故氣隨日消神風起崐崘太洞觀玉眞紫雲繞絳庭公子授靈符帝一俯仰存謝此帝穢途八道自然分羽蓋殊翩翩羽駕適九清錫告華天英瓊文燦靈篇第二色界魔王之章眇眇髙虚瓊闕峩峩元始靈章普敎仙賢下極綱維上極諸天无量之奥皆同我身如何邪穢亂我胎根血屍沉骸隂魄拘魂寶山化銷何能獨存玄受靈符致身帝前此時樂兮面返玉嬰赤明旣往猶能别眞我界輕染故錫寶文除蕩氛累召集百靈鍊胎飛仙授命玉宸淨穢凌空上爲帝賔第三無色界魔王歌曰骨有太空中蟠古尸故氣紛紛凋爾靈芝胞戸翳塞欲華四披血沉竒理穢絶元機我位上王綂御群靈左持玉符右呼天兵蠱積胎根擲以流鈴使命永延萬姦消摧三十九眞赤書開光生道妙玄服此天章干試無前我道其昌洞空洞无洞眞洞仙飛神玉霞泝車碧煙此三界之上飛空之中魔王歌音音參洞章誦之百遍胎根清正名度南宫誦之千遍永斷邪穢魔王保迎萬遍道備飛昇太空過度三界位登仙公有聞靈音魔王敬形勑制地祇侍衞送迎拔出地戸五苦八難七祖升遷永離鬼官鍊度朱陵受鍊更生是謂无量普度无窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈魔王隱祕之音皆是大梵之言非世上常辭言无韻麗曲无華宛故謂玄奥難可尋詳上天所寳祕於玄都紫微上宫依玄科四萬劫一傳若有至人齎金寳質心依舊格告盟十天然後而付焉道言生民宿无至縁識託業化胎命凡頑生根不眞朽蝕腐敗以道化鍊妙感通神邪魅穢沫害蠧節中隨結不開致冥爽來舍三眞退席上學同氣皆當齊心修齋六時行香十遍誦經福德立降消諸不祥无量之文普度无窮道言夫末學道淺或仙品未𠑽運應滅度身經太隂臨過之時同學至人爲其行香誦經十遍以度屍形如法胎根淨固魂臺四明邪穢斷除仙聖爲鄰魂神徑上南宮隨其學功計日而得更生轉輪不惑便得神仙道言夫生體不固毎有疾傷胎穢攻蝕面焦髮素孕育不成嗣係夭折起居憊劣道炁斷息三尸鼓動致兆死傷皆當修齋行香誦經夫齋戒誦經功德甚重上可生化胎根保身得道下除邪穢以度兆民生死受頼其福難勝故曰无量普度天人道言凡有是經能爲師友兆身民人行是功德有災之日發心修齋燒香誦經十過皆生化胎根斷除邪穢右别至人尅得爲聖君金闕之臣諸天記人功過毫分无失天中魔王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語无量音道君譔元始靈書中篇東方八天眞庭獻莊混璧卷常月離珉施几葉洞梁㠗車錫盤休留忘襄馬焉胡旗震正允臧道密意綿玄圖洞桓兆寂孔幽夷邈眇聞旨在爻應駢貫感番流淇温靜空觀无還南方八天素氣徊豫華跡罙滋延醜戮暑英照淵昆竭帝邃亰玉倉璉瓊霞枚雲施子丹雲征秀珠蔚華南韓肆駢宰聽幽貴天機監元綸極太冥亢孤攝煙龍運祕標黙目返縁西方八天欹悲觸荄仁澤流㳙槁梗昭炫靈化杳傳混浩莽都景驥飛旋長古轉臺運逸孔堅便穴液持澱霐龍鱞偃驅神虚相主八關演𡵻襲遒部鄒球奚胎居消晶玉津明微北方八天鬼适啖茹辛牢莛錮勑校九天省録韓注希恍罔覩覺超意龍昇祛翔周神虎萬丘洛歌嘯宛叩鳴和澗問絶溢酬化樞旣辨陀仙浮闃嵩漾林縣寶屈體光梵布于鍊道言此諸天中大梵隱語无量之音舊文字皆廣長一丈欲生化胎根斷除邪穢即布丹書石上坐誦洞文則尸賊伏匿雀隂𡀱怖琚驕喪睛姑俞竄隱天素佩身百靈朝謁檄綂萬神天眞皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勲魔王保舉上眞道備尅得遊行三界升入金門此音无所不辟无所不禳无所不度无所不成天眞自然之音也故誦之致飛天下觀上帝遥唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響十方肅清河海靜黙山嶽吞煙萬靈振伏招集群仙天無氛穢地無祅塵冥慧洞清太量玄玄也元始无量度人上品妙經卷之二十一

一切无礙翔爲龍鳳伏爲龜蛇道妙都括不使世知字皆廣長一丈天真皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣神府玉郎真王上吏下觀其身書其功勤上奏諸天萬神朝禮地祗侍門大勲真王保舉上清道備尅得遊行三界昇入金門此音无所不除无所不禳无所不度无所不成天真自然之音也故誦之致飛天下觀上帝遥唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響十方肅清水无漂溺火不炎燔萬靈振伏招集群僊天无氛穢地无祅塵㝠慧洞清大量玄玄也元始无量度人上品妙經卷之四十六

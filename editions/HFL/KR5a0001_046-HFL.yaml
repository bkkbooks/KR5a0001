front:
  text: 靈寳无量度人上品妙經卷之四十六字六
  hash: sha256:934c1272b33dae79a9d35ada3d87024c2cb97e38e4693b7f15b563681c4f5967
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_046-001a, image: hfl/0010/0010-004.png}
body:
  text: 除禳水火漂焚品道言昔於靜樂天中飛青寥歌大无畏土受元始度人除禳水火漂焚妙品元始天尊當說是經周回十過以召十方始當詣座天真大神上聖髙尊水火二司大將仙君將軍吏兵行水發火官曹掾吏度厄拔難真人无鞅數衆乗空而來紅黑奔雲虎輿甲馬黄麾絳節翠葆朱旛疾雷沸天雄風偃嶽異彩祥光縹緲鬱勃洞煥太空七日七夜諸天宫鑰震鳴殿觀傾動日月星辰靈芒噴射煒燿停輪仙梵佇雲迴霞繞斗碧影輕泛紫烟結樓一國地土山川林木緬平一等无復髙下土皆作蒼玉无有異色衆真侍座元始天尊玄坐空浮五色自然飛仙十華之座說經一徧諸天大聖同時稱善是時一國男女受福諸天常樂道化說經二徧太微紫微水火二曹奏功紀德隂陽調平說經三徧日帝奉笏月后致恭說經四徧二曜三元咸來禀命說經五徧水毋運機延劫永世火官布筭増曆益年說經六徧考罰得宜无有橫枉說經七徧漂焚息苦焼溺業消說經八徧三界晏安不生驚擾說經九徧地鑪天竈飛伏合倫說經十徧厄運俱濟人物乂寧是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一徧東方无極无量品水火司功大神无鞅之衆浮空而至說經二徧南方无極无量品水火司察大神无鞅之衆浮空而至說經三徧西方无極无量品水火司罰大神无鞅之衆浮空而至說經四徧北方无極无量品水火司直大神无鞅之衆浮空而至說經五徧東北无極无量品水火司厄大神无鞅之衆浮空而至說經六徧東南无極无量品水火司令大神无鞅之衆浮空而至說經七徧西南无極无量品水火司録大神无鞅之衆浮空而至說經八徧西北无極无量品水火司禁大神无鞅之衆浮空而至說經九徧上方无極无量品水火司命大神无鞅之衆浮空而至說經十徧下方无極无量品水火司非大神无鞅之衆浮空而至十徧周竟十方无極水火二司典録大神一時同至一國男女傾心歸仰來者皆各頂禮讃歎已證天尊願不罹水火大小劫災三界遷易之難尚處世身願不罹水火焚漂焼溺之厄不爲三官考按罪録刑在水火罰於漂焚乞使二曹順理天政和均人界清裕鬼道沈鎮邪神祅吏无妄行水發火作非横之厄稽首元始欣聞至要各以天寳妙具神州真𧵥勢同雲集无鞅之衆迮國一半土皆偏陷非可禁止於是元始流眄十方俯觀衆㑹振衣進几迴天轉地吹爲水光呵爲火燿二景交飛遊龍宛轉翔騰虚極良久之間變成寳珠大如黍米懸處髙空去地七丈元始登引天真大神上聖髙尊度厄拔難真人水火二司曹掾將吏漂溺焚𤑔執罰大神无鞅數衆俱入寳珠之中天人仰看惟見勃勃從珠口中入既入珠口不知所在國人廓散地還平正无復𣣱陷元始即於寳珠之内說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂无遺響是時天人遇值經法普得濟度全其本年无有中傷傾土歸仰咸行善心不猛不怒不侈不迅不察不蕩不散不時不諂不回言尚明析口无惡聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝内名除禳水火漂溺焚焼隱韻之音亦是真王内諱禁勑水火二司不得妄溢行發二考虐暴生民呼召主宰百靈之隱名也非世之常辭上聖已成真人通玄究微法寳已靈水火之變㝷源得涇燔燎炎暴知究祖因能悉其章誦之十過諸天遥唱萬帝設禮水土火蔵淵靜明離河海湛黙赫烈防扄日月停景璇璣不行群魔東形鬼精滅爽焚爍潜息漂溺自平至學之士誦之十過則黑精守位赤怪不生魔魅喪眼鬼妖滅爽濟度水火危厄不生所以爾者學士丹宮未成水騰火降體未洞真召制二司威未制天政德可伏御姦祅束縳遊火大醜故氣但却邪度厄而已不能使水火二神絶諸考罰輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因縁水火不干神明護門斯經尊妙獨歩玉京制御水火除禳漂焚爲萬道之宗巍巍大梵德難可勝道言水火二司有大威神號五嶽緫領真君主放大水漂流蕩溺發暴火焚𤑔燒延護善去惡考罰罪人下逮地獄寒池火車漂焚重苦烹注亡䰟謫役泉曲火山之府煮瀆焦然悉𨽻真君天有二燿隂陽靈根照映下民而惠災福非行禍厄之權也此大威神與九天司命採訪使者五嶽丈人五嶽都司共治水火水火之罰有六將軍以布令行災主水之將河魁將軍杜元吉天録將軍張子華執符將軍沙伯晃主火之將捷疾將軍劉天鏹定界將軍周君采發火將軍石完夫世界有水火之宂伏蕆隂陽之精化爲水火之龍民有危厄則飛龍降災水火併至北斗中勑北帝列司領水火神龍之政號玉光紫靈夫人官吏數千典掌其職生人先世有罪幽䰟在水火之獄徒水大之役運水灌四瀆之穴伐薪煎百里之鑊洪波滔天烈火亘地一日一夜受苦无量凡誦是經十過諸天齊到受苦衆生出離水獄遊神紫臺出離火獄上昇朱宫格皆九年受化更生得爲貴人除禳漂焚福慶自生而好學至經功滿德就靈寳成丹身生水火七返九還皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經真水上浮靈火下温日蔵於海萬竅生雲皆即受度飛昇南宫世人受誦則延壽長年後皆得作尸解之道䰟神暫滅不經地獄水火漂焚即得返形遊行太空此經微妙普度无窮一切天人莫不受慶无量之福生死蒙惠上天所寳不傳下世至士齋金寳效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齋誦詠是經爲上世亡䰟斷地逮役水火功考度上南宫七月長齋誦詠是經除禳水火漂梵身得神仙諸天書名黄籙白簡削死上生十月長齋誦詠是經除禳水火使二氣和平爲國王帝主君臣父子安鎮國祚保天長存世世下絶常爲人君安鎮其方民稱太平八節之日誦詠是經赤黑順界萬物遂成得爲九宫真人本命之日誦詠是經隂无僣陽臣忠於君火降水升德下而尊䰟神澄正萬炁長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青紫絳三色雲炁之中内外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右典緫水火二大靈司神官將吏備衛前後日月照明洞煥室内項生圓象光映十方如此分明宻呪曰无上玄元太上道君召岀臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齋清堂修行至經无量度人願所啓上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始无量度人上品妙經元始洞玄靈寳本章除禳水火漂焚保劫度人百魔隱韻從濟自然二象交輪无无上真元始祖劫神化无神有一未形氣生空玄大器内温温則氣升升爲玄露降爲天津水爲帝先太一杳冥温氣成炎火爲神津火明水晦二象備成水盈器中火動神温温久泫液結凝玉京九宫八門安鎭十方開明赤黑是爲天根水火无祖一九化真丹靈焚惑玄老大辰辟非朱鳳蒼龍皛精百六陽九剪滅凶群游火黑祅戰物災民道可除禳化空成文是名大法玄中之玄三元八㑹鳳真玉篇髙祕神文億千萬年真玉治世應運流傳普度生死一切苦䰟威悉應符永劫長年歷水過火三災不登暴氣邪侈移變世間成災可除將至乃禳焚𤑔漂溺速離逺方帝君行令敢有來當太虚焚氣運轉元綱中有除禳水火漂焚之神中有南極長生之君中有度世司馬大神中有好生韓君丈人中有南上司命司録延壽益筭度厄尊神迴骸起死无量度人今日校録諸天臨軒東方无極風力神王長生大聖无量度人南方无極威燿神王長生大聖无量度人西方无極金光神王長生大聖元量度人北方无極洞淵神王長生大聖无量度人東北无極制姦神王長生大聖无量度人東南无極熾𤓁神王長生大聖无量度人西南无極水蔵神王長生大聖无量度人西北无極禳禍神王長生大聖无量度人上方无極拔難神王長生大聖无量度人下方无極度厄神王長生大聖无量度人十方至真除禳水火漂焚神王長生度世无量大神並乗宸霞錦光玉輿紫清瓊輦彩盖霓輪驂駕五鳳十二玄龍建招真之節八景靈旙前嘯金巢齊唱後吹玉錀同鳴獅子白鶴啸歌噰噰列真啓途群仙翼轅億乗萬騎浮空而來傾駕水火監檢生靈神霄府相青華上宫韓君僊伯消災大神執籙把籍齊到帝前隨所應度嚴校諸天普告三界无極神鄉連宛之府靈紐之宫六天九獄冰池火山救解衝蕩漂溺焚燼過度生關沈屍苦䰟釋赦三官上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼群元始符命時刻昇遷火翳寒庭部衛形䰟制魔保舉度厄南昌死䰟受鍊僊化成人生身受度劫劫長存隨劫輪轉與天齊年永度漂沈焚蕩之苦超淩三界逍遥上清上清之天天帝洞覺无色之境梵行東方八天慶華瑶虞天帝臺昌舞霞歷明資玄天帝靈谷振光控神九真天帝巴慈引祥日觀揚靈天帝都竒昇方歩竒乗角天帝統貟羅氐舍次東天帝真陀流淵妙律垂科天帝閱道維美定儀師微天帝伯初桃英南方八天爍寰理赫天帝孫愚道奕禁明威勇天帝鄱滿祁桓安樂昭仁天帝鬱禎英陽化度僊天帝幽雲靜坊微境冲遊天帝子殊衡史滔逸䰟天帝符乾處寧赤洞顯幽天帝徧常澤墟利泰猶和天帝召無僅剛西方八天梵氣七真靈曜天帝繼元正基白章文皇天帝越定莊台玄極義天帝僊閔弗冥江霞子湘天帝韜樞蓋倉中遥玄變天帝師元同瑰靜妙委神天帝嶽録華由洞光素燿天帝落丘造章制飛鎮精天帝穴汨求輔北方八天麗正真期天帝黄武明超空昇化碧炎天帝詔智賔玉奔紫景露陽天帝宗耀湟祕清瑶章神府天帝仲季綿寳陳華几降龍天帝學吉隆雲澤敷成天帝達司進行紫融通微夭帝芾儀開正真萬齡天帝建裕崑三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻除禳水火漂焚之音水元太一之尊火元赤皇之神發水大魔行火真靈九陽十隂變化上清无量之奥深不可詳敷落神真濟拔漂焚今日欣慶度厄除禳却氛禁勅典司歷關諸天請滅漂焚斬絶邪冤飛度水火名列太玄魔王監舉无拘天門東斗紀善西斗降祥北斗水考南斗火殃中斗定刑燎溺存亡罪大殞命貴輕受厄青帝監䰟白帝攝𩲸赤帝執炬風火煥赫黑帝揚波漂蕩无極黄帝中主統行誅殛青天魔王監試群姦赤天魔王擲火騰烟白天魔王洶濤反山黑天魔王洪波汩淵黄天魔王焦屍泛骸五帝大魔萬神之宗飛行水火緫領威兵麾幢鼓節遊觀太空熾爓赫奕滔天縳龍上天度人嚴勑北酆真王受命救難迎祥八威衛駕猛馬廵疆飛天息火大帥塞洋除禳横厄厭解擊衝敢有干試抗拒上真司非定罪巨天注名赤祅大醜收行天丁千千遏塞萬萬滅形敢有漂溺燒害良民三官北酆明檢鬼營不得容隱金馬驛程普告无窮萬神咸聽三界五帝列言上清元洞同域水火二鄉隂含陽精陽頼隂疆二氣成物能柔能剛眇眇億劫混沌之中上淨爲色下沈爲淵水火遍空合質凝天天上天下无幽无冥无形无影无極无窮溟涬大梵遼廓无光水火既生三界境完久則氣勝進退升遷制暴遏邪水火立官考校罪業泉曲火山醜類僣逆僞妄行懽漂溺天人焚燎區寰昊帝震怒符召百神玉章正氣赤文命靈黑精啓胞龍毋拖紳钁天振威主領萬兵郁黙執旗醜伯攝精元老奉詔掃蕩妖氛收捕遊火開通水精不得犯縱明敬教言清肅字宙歸奏帝前威光下照廓
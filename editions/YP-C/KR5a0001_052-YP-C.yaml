front:
  text: 元始無量度人上品妙經元始洞玄靈寶本章玄明洞淵上品泉關度人蒼華隱韻肇氣自然混合玄明虛無至眞一元立本二氣始陳至陽下降純陰上昇天眞開發包絡飛騰元和大朴流結冲融氣達崑丘精通如泉泉號玄明積爲洞淵洞淵生龍龍爲玄蟲九首兩翼金額銅胷恍惚之中變化神通主持氣母宰育羣容品物旣宣玄道亦傳元始祖劫化生諸天玉光開景是植玄根元氣爲祖惟道爲身大明結華華芒蔚文五官建立變化神靈是爲大梵天中之天鬱察玄峯龜臺玉城上極元景泰洞高淸眇眇曆紀劫刃飛精三華廣堂虛梵琳庭金闕丹陽燿寶神池降注天液保度無衰玄明成霐流空洞淵洞淵無極九壘剛源變化之妙昇入九天周行正氣運轉天關中有玄明洞淵之神中有南極長生大帝中有東極靑華帝君中有度世司馬大神中有好生韓君丈人中有玄上司變司化持天保劫大洞尊神迴骸起死無量度人今日校錄諸天臨軒東方無極飛天玄明洞淵神王長生大聖無量度人南方無極飛天玄明洞淵神王長生大聖無量度人西方無極飛天玄明洞淵神王長生大聖無量度人北方無極飛天玄明洞淵神王長生大聖無量度人東北無極飛天玄明洞淵神王長生大聖無量度人東南無極飛天玄明洞淵神王長生大聖無量度人西南無極飛天玄明洞淵神王長生大聖無量度人西北無極飛天玄明洞淵神王長生大聖無量度人上方無極飛天玄明洞淵神王長生大聖無量度人下方無極飛天玄明洞淵神王長生大聖無量度人十方至眞飛天神王長生度世無量大神並乘明雲紫淵之輿靑玄玉輦鳳蓋蜺輪驂駕九鳳七色蒼龍建汗漫總靈之節十方洞淵之旛前嘯眾眞齊唱後吹列羽同鳴獅子白鶴嘯歌噰噰大帝啟途千官翼轅億乘萬騎浮空而來傾光回駕監眞度生太玄丞相暘谷靈宮玄司主錄下元水官執籙把籍齊到帝前黙召玄明制地參天萬生被浹枯涸生泉玄明眞水凝化億門高嶽巨山寶闕珍林皆資玄明結固變成九河水帝玄津大神上循閬崑十二洞樓絳海黄池素波紫川骨鍊金石面流渥丹長生隱遷司命帝闕隨所應度嚴校諸天普告三界無極神鄉泉關幽夜北闕酆都四空大帥六洞靈魔寒夜暗域考察玄司四凟七澤十二谿眞上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼羣洞淵符命時刻昇遷九源玉池部衞形魂制魔保舉度品南宮死魂受鍊遷變成人生身受度劫劫長存隨劫輪轉與天齊年永度三途五苦八難超凌三界逍遙上淸上淸之天天帝厚冲無色之境梵行

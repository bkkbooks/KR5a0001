body:
  text: 東方八天龍明瑞玉天帝肅辭祕登滋慶道兟天帝承翰鴻暉玉眞辨玄天帝殿運晞逢流華注靈天帝無惟育光崇延竟祝天帝盟章奉高理懷變化天帝玄玄鑒侯雲府降澤天帝執珠登全道英晶无天帝爽造延士南方八天珪辰鎭陽天帝錄莊修皇赤射飛光天帝保氣曜備洞溪迎龍天帝對榆倚玄化國雲宫天帝尚丁惟寧照玄生氣天帝著時量瓊天英和液天帝生演輔童龍肖溢眞天帝拂化慈元聖正仙期天帝洞梁無瓊西方八天毫靈伯江天帝足宗寧方金根養无天帝道微斥廬玄合流素天帝廣淡題徊朝仙變凟天帝優玄賜封契眞恭淨天帝翻山白從迂寂思冲天帝濮并屏誾逐神化幾天帝妙洞止評洋思定厯天帝籌突紀庸北方八天寶笥扈書天帝拂億蠢兹列源正一天帝命仙儀中瑶光述液天帝逸常京昌英正理和眞天帝隨洪次章攝司會光天帝召神略玄祈聖格淵天帝昌回敷紳現龍降河天帝擇毗衍門幾紀因盟天帝孚廷剛三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章玄明隱韻洞淵之音玄明之尊洞淵之神玄明眞魔洞淵之靈九品十階變化上淸洞淵之奥深不可詳龍以水神風爲火靈水中出火龍火水精眞氣返敷敷落神眞火中出水心動精成天中之水子命之神若有能之普度天人今日欣慶受度飲咀玄明身入洞淵厯關諸天請滅陰惡斬絕地根高超六氣神昇太玄眞王監舉無拘天門東斗蒼精西斗素童北斗玄眞南斗丹風中斗黄燿珠光化鎔如是神王居洞淵宮外玄內明八海攸同一氣變形眞水潛通天地合德萬物安豐生氣之海中有九龍太霄合景上與天通身關大運六氣之眞颷歘乘邁超遇九神靑帝生䰟白帝育魄赤帝攝氣黑帝滋血黄帝正極肇立眞宅靑帝龍王安寶飛華赤帝龍王元善鬱羅白帝龍王玄霄玉霞黑帝龍王道柔顯和黄帝龍王甲建持波五帝龍王玄明之靈生化洞淵飛行紫淸總領眞仙太上神兵麾幢鼓節遊觀杳冥自號赫奕諸天應機上天度人泉臺散開神王受命普度災危玄獸吐毒神龍八馳玉甲秉鉞靑童執旗擲火萬里流光四施敢有干試拒遏上聖風刀奔突巨天橫飛流鈴交煥玄仙振威千千截首萬萬滅形魔無干犯鬼無祅精三官北酆明立嚴刑不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列奏太淸玄化九變洞極圓方生育神龍持運陰陽與道同範體正純剛廣羅天闕妙立無形造化之本雲雨所藏眞水九淵回度元綱渺渺曆劫混沌之中上玄爲色下河爲淵風轉玉輪威光戴天一身九首蟠遶羣京蒼源瑶海龍嶽飛城天上天下無幽無冥洋洋洞淵萬龍斯官雲書玉字元始赤文保鎭下元護世長存龍漢彌羅黄闕開張玄明流演九地九天輪轉包羅旋遶十方履水結纏導化五常三十九氣昇降玉源九宮列職合會玄玄玄居太微龍帝飛眞泛景碧融執詠洞篇玉眞明燿煇映玄明空華御正純金散烟紫霄鬱陵輔衞高仙千和萬合化生流精流精變液自然成眞眞中有神長生大君東極靑華丹明紫靈無英混極白元保生太一校籍靑童灌津執符把籙保命生根上遊紫虛出入華房八溟之內東井之中下鎭人身黄庭絳淵中理五氣混合百神十轉迴靈萬品俱仙仙道貴生無量度人上開八門飛天法輪罪福禁戒宿命因緣普受玄澤結鍊生身身得受生上聞諸天諸天之上各有生門中有空洞謡歌之章眞王靈篇辭參高眞第一玄明洞淵飛空之音眞陽無形憑玄明生玄明眞露氣噓乃成太空無邊元氣騰烟氤氲迅飛水降如泉浩浩其聲洋洋積淵炎風入水自然蜿蜒數經九厯鱗角乃全倐忽變化入地通天口銜雲雨身如玉蚿叱電吐霧雷火之仙經營萬物開導生源玄明之功神龍爲先洞淵溟海注納百川一水爲祖中含五行人身法象神池淨霐震氣爲龍遊泳三田飛伏以道世壽億千無量度人吟此洞篇第二玄明洞淵眞王之章玉京崑崙植空爲根下跨碧海九億之元玄峯中峙日月交軒燿晶雙景臨光七眞流泉上升三十九門養鍊二象賴此玄明下包黄闕統制靈官圓羅降氣攝御元君一氣六纏三元化成出入三華浩蕩風淵緣霞鬱壘流鈴四奔生化之道肇立神靈哺餌元和保天無傾世有能知靑簡書名我今爲此章度命以眞水飛步登神霄仙眞當敬禮第三玄明洞淵眞王歌曰揚舲洞淵池靑林振靈風天聲自成音萬變復以同峩峩神霄闕執誥東華中度人迴淸流捨此百慮攻玄明散天露物體能滋融鍊骨生玉華長生得無憂如何背仙道濁穴隨尸蟲不悟大道元安能免衰凶有山旋碧虛有水藏神龍胡爲逐貪競沈穢老嬰童我位空洞王法駕嚴鼓鐘憫世統大憲救物興教宗執詠玉眞謡飛昇洞玄宮八難從此解歡樂永無窮此三界之上飛空之中眞王歌音音參洞章誦之百遍名度南宮誦之千遍飛仙保迎萬遍道備超昇太空過度三界位登眞公有聞靈音魔王敬形勅制地祇侍衞送迎拔出地戸五苦八難七祖昇遷永離冥官䰟度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈眞王隱祕之音妙寂無形眞水化成天地出生神龍兆能體之神仙無終皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奥難可尋詳上天所寶祕於玄都神霄玉淸王府東華之室依科三萬七千年隨運下傳若有至人齋金寶質心依舊格告盟十天然後而付焉道言夫天地運度否終日月五星虧盈至聖神人休否末學之夫疾傷凡有此災同氣皆當齊心修齋六時行香十遍轉經福德立降消諸不祥無量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太陰臨過之時同學至人爲其行香誦經十過以度屍形如法則玄明自生玄冥自還腎中玉女手把陽關死戸閉塞三官舞輪返命復形錄名帝軒䰟神徑上南宮隨其學功計日而得更生輪轉不惑便得神仙道言夫天地運終星宿錯度日月失昏四時失度陰陽不調國境不和人民災饉疫毒流行兆庶死傷師友命過同志殞亡皆當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衞右別至人尅得爲聖君金闕之臣諸天記人功過毫分無失天中眞王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君撰元始玄明洞淵靈書紫篇東方八天迮芹洒定淵婁池溟旣霸沔洟留靑濟眞唐屏卞師邀除止明鬱落月肌胡定杳征命澤玄嶽列淵自昇雲荼帝㠗利賓延承洞假幽狄越英仰靈鑄晶漾口道寂元經南方八天猛洪滋盈力羗華營建浦時會洙玄伺膺綠養漸宛被盧次丁蕩蒙愈謹玉毫途平赤宮赫蘇元首氣靈告命酆臺帝師虎臣祕魔截龍撲雷收星研期胡由並愆思稱西方八天眞庚六池神虎四飛栗洛衎覩優正兵施部亶吉會耶帑露源媾嫣和廬七元九司考謝已扁傲琅袁棐王典罪䰟幽扃圓登頂角珍上護眞載延窈斷皇極璽山封城北方八天蓬內伐北旗翟遄車翠儀交蔚九化方諸英丹心漑滂潢玉羅根納赤尾火龍遊波勝室燿蕩兵府紀銅黑遼追甯建餘百聰后爓水洞瀋桓箕臺勅催聻尚變仙神迴道言此諸天中大梵隱語無量之音舊文刻書玄明北山龍阿穴室之門爲萬物生根九天靈章其道禁諱隱奥無聞字皆廣長一丈天眞皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大功眞王保舉上眞道備尅得遊行三界昇入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致飛天下觀上帝遥唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅震響十方肅淸河海靜默山嶽吞烟萬靈振伏招集羣仙天無氛穢地無祅塵冥慧洞淸大量玄玄也

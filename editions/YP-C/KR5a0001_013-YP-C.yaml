front:
  text: 元始无量度人上品妙經元始洞玄靈寶本章太乙元精上品妙首黃庭度人百魔隱韻離合自然太乙元精无无上眞元始祖土名爲太空空爲太乙祖土元精胞養三界化生諸天開明三景是爲天根上無復祖惟道爲身無處無空無所非土空土土空爲道之母無形爲空有形爲土空能生化是爲眞空土元無形是爲眞土土爲生命識空者仙空可獨化土有至文太乙元精眞土之名五文開廓普殖神靈无文不光无文不明无文不立无文不成无文不度无文不生是爲大梵天中之天鬱羅蕭臺玉山上京上極无上大羅玉清眇眇劫仞若亡若存三華離便大有妙庭金闕玉房森羅淨霐神霄梵炁周回十方中有太乙元精之神中有南極長生帝君中有東極青華帝君中有度世司馬大神中有好生韓君丈人中有南上司命司錄延夀益算度厄尊神迴骸起死无量度人今日校錄諸天臨軒東方无極飛天太乙元精神王長生大聖无量度人南方无極飛天太乙元精神王長生大聖无量度人西方无極飛天太乙元精神王長生大聖无量度人北方无極飛天太乙元精神王長生大聖无量度人東北无極飛天太乙元精神王長生大聖无量度人東南无極飛天太乙元精神王長生大聖无量度人西南无極飛天太乙元精神王長生大聖无量度人西北无極飛天太乙元精神王長生大聖无量度人上方无極飛天太乙元精神王長生大聖无量度人下方无極飛天太乙元精神王長生大聖无量度人十方至眞飛天太乙元精神王長生度世无量大神並乘祥雲絳輿青輦華蓋文輪驂駕黃鳳五色金龍建太乙之節元精靈旛前嘯貔虎齊唱後吹鸞鶴同鳴獅子辟邪嘯歌噰噰五老啟途羣仙翼轅億乘萬騎浮空而來傾光回駕監眞度生皇極丞相南昌上宮韓司主錄監生大神執籙把籍齊到帝前體化探玄考驗靈關玄牝之門八極之根吸引太空土炁氤氲空中有眞祖命之神接和嚥液腦有土精下流黃庭上通泥丸玄牝呼吸空炁无端天光入淵七世命仙隨所應度嚴校諸天普告三界无極神鄉泉曲之府北都羅酆三官九署十二河源上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼羣元始符命時刻昇遷北都寒池部衞形魂制魔保舉度品南宮死魂受鍊仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度三塗五苦八難超淩三界逍遙上清上清之天天帝洞眞无色之境梵行

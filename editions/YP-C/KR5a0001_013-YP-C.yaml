body:
  text: 東方八天昭體通生天帝傳煇子譚義明理陽天帝虞戸逸承神英化靈天帝無竟訶孫眞慧無方天帝抱淵力南光持蒼景天帝匠洄庶嘉履昌收期天帝載疆幽低洞虛耀靈天帝直夷𨚧婁純化道威天帝尾頂內鮮南方八天龍梵信光天帝還求耳光大元逝炎天帝哲育辨徊丹輿平雲天帝黨遙復交耀華九光天帝卓爓鍊琚文爲空海天帝乙靈播成朱明散景天帝滔槩爽塗佐孚執符天帝密嶽敬良燿赤浮修天帝阿隸宥公西方八天儲神衍邱天帝崇幾種聞金眞浩懷天帝陸時碧仙眞妙簡升天帝亮剛質佗太空無思天帝虎凡禱韓太白定眞天帝泰物田果才極輔天帝落儒祈倪𩁹里齊明天帝突盧偃祉亶功慶恭天帝秉康俞垂北方八天淨鍊按地天帝略茹經玄蓋斷淨天帝覺玄奔承華洞虛天帝度仙變明道龍契明天帝報順思泉宮計眞天帝遊玄定蒙斗嚴校錄天帝拘神綩牢驅魔掖功天帝邈載靜高湛截珠孕天帝象希祕雲三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻太乙之音太乙之尊太乙之神太乙元精太乙之靈虛一爲九一爲土基極數爲十十爲土成土非形土變化上清无量之奧深不可詳敷落神眞普度天人今日欣慶受度還元知祖見道歸眞仰空引和土胎金神立兆生命爲兆眞身厯關諸天請滅三惡斬絕死根飛度五門名列太玄眞王監舉無拘天關東斗青龍西斗金虎北斗靈龜南斗鶉首中斗大魁四像依土土爲陰胞脫胎乃生青帝付魂白帝育魄赤帝生神黑帝傳靈黃帝主意注性飛神青土神王驅魔遣屍赤土神王勾吒血嗤白土神王磨堅遁儀黑土神王照精馘騤黃土神王屈多繁徒五方眞土太乙元精普周太空與空同形變化之母萬神之宗飛行鼓從總領鬼兵麾幢鼓節出入太空自號赫奕諸天齊功出生兩儀化成九宮三界分立眞土納容太乙元精使兆得道升眞達靈上天度人嚴攝北酆神王受命普掃不祥長牙吐毒方顱四張錦額前驅嚴斗仗旛擲火萬里流鈴八衝敢有干試拒遏上眞金鉞前戮巨獸後刑屠割鬼爽風火無停千千截首萬萬翦形魔無干犯鬼無祅精三官北酆明檢鬼營不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列言上清空洞元精太乙未名土行六虛變化萬生玉京金城神倉九清一土所生諸天備成非土不生非土無陽祖土爲空下出龍康眇眇億劫混沌之中上空生色下空生淵空極生風風蕩水傾風澤洞虛金剛乘天天上天下無幽無冥無形無影無極無窮溟涬眞土疆名太乙內號元精元精之陽遼廓無光赤明開圖運度自然元始道先安鎭土元空梵成文敷落五篇赤書玉字八威龍文保制劫運使天長存梵炁彌羅萬範開張元綱流演三十二天輪轉無色周回十方旋斗厯箕回度五常三十五分總炁上元八景冥合炁入玄玄玄中太皇上帝高眞汎景太霞嘯詠洞章金眞朗郁流響雲營玉音攝炁靈風聚煙紫虛鬱秀輔翼萬仙是皆眞土太乙元精變炁化成無土不成與道爲盟土雖無形內有生眞土爲牝牡播精留神千和萬合自然成眞眞中有神長生大君青華公子玉妃眞神太乙元精司命大神桃康合延體玉揚津執符把籙保命生根上遊上清出入華房八冥之內細微之中下鎭人身泥丸絳宮中理五炁混合百神十轉迴靈萬炁齊仙仙道貴生无量度人上開八門飛天法輪罪福禁戒宿命因緣普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有空洞謠歌之章眞王靈篇辭參高眞第一太乙元精太空之音三界未造天地無名十方皆空空亦遇稱不識道祖以空述形空爲無有徧處混成一切眾生但知土名爲空所隔不見道眞不知空者空非本稱認空棄道著空滯聲不知其空所空無形無形者何是眞土精不知眞土妄認爲空空性頑慢何緣物生故知三界萬天九清玉京大山鬱羅高臺不能自有因土乃生土名眞空出生萬化離空求眞皆是幻假勿取此空自障其目拂空翳除眞土露形蕩蕩道體無所不成兆之玄牝日飮土精故能長生遨遊赤城眞土之炁立可仙身第二太乙元精眞王之章高上神霄去地百萬周回八方眞遊降盼神霄之境碧空爲徒不知碧空是土所居此非世間陰濁之土獨能植生嵗除月更春至則復遇夏乃繁況此眞土無爲無形不有不無萬化之門積雲成霄剛炁所持履之如綿萬鈞可支玉臺千劫宏樓八披梵炁所乘雖高不巍內有眞土神力固維太乙元精世不能知我今爲此章清音自合離第三太乙元精眞王歌曰朝登太元阿夕宴天河源人間已再劫閬風春正鮮星羽整巍冠轡龍御神風霄程不計里紫雲但瞳矓玉女戞鳴庚清音自寥寥喚此浩劫迷爽愷登雲濤香煙起綠𥦗赤錦迴紫霄翠色悚長樓電旗隨雲飄彩虹展瓊梁萬仙舞靈謠世界量三千眞土所倫陶不知道德母委聖奔蕭翹哀此塵中流歌此撫雲璈此三界之上飛空之中眞王歌音音參洞章誦之百徧名度南宮誦之千徧眞王保迎萬徧道備飛昇太空過度三界位登仙公有聞靈音眞王敬形勑制地祇侍衞送迎拔出地戸五苦八難七祖昇遷永離鬼官魂度朱陵受鍊更生是謂无量普度无窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈眞王隱祕之音判指眞土道之所歸太乙元精長養光輝兆能體之不有凶衰性金空土子順母和定而守之息息不離太元之山巨樓雙谿納眞吐氣兆命所依滅空見土萬氣可補神氣相融死戸自封皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寶祕於玄都神霄玉清王府運行壬辰大君下降奉教以傳若有至人齎金寶質心依舊格告盟十天然後而付焉道言夫天地運度否終日月五星虧盈至聖神人休否末學之夫疾傷凡有此災同氣皆當齊心修齋六時行香十徧轉經福德立降消諸不詳无量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太陰臨過之時同學至人爲其行香誦經十過以度屍形如法則太乙護宅元精灌形眞王長生生炁來幷魂神徑上南宮隨其學功計日而得更生輪轉不惑便得神仙道言夫天地運終星宿錯度日月失明四時失序陰陽不調國土有災兵刑鬼盜疫毒流行兆民死傷師友命過法學禍殃亦當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受賴其福難勝故曰无量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衞右別至人尅得爲聖君金闕之臣諸天記人功過毫分無失天中眞王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語无量音道君撰元始靈書太乙元精中篇東方八天華生豐角徧阿靈昧至冥辨谷烈令均馳獻迪陽循離連國隣召證荷頂席度招卿桓卓野迂盧丁素偁馬闌召靜越度井庚茁苓球部騫靈處登溢揚秉弛辜訾徤澄南方八天嶽俞莊乾弊炎鍾利廓璘曠時偃阮輪技迸并驛司牛霐輦符治止物肅丹巒古州燕漏鼎洞隔彭輳流柄否激敦力奚玄焚潛求猛需液釜紀昆眞昻嵯幾燿梵就温西方八天覩莽浩都意梵寂類悅廣侈特亶想冥閎祝闌文克鬭關洪依蹈悅奔權秀眞雲微罷藿杏候迎東胃旗鍊祖頓思遠曠被圭鎭摹孽注協黨建宏敷落賚系淵覺祕涓北方八天臭漠澤官斗君司韓庭厯潘眞金房璧完隸畜渾島巴龍幽湍釋池頓魂萬卑左盤軸樊滋巡酉岨瑟觀灞霞注智畧汧洞關攝簡命神帝皇符溟作契爓海澗章暄盈道言此諸天中大梵隱語无量之音舊文太始眞王以玄狩之毫總括書之太空之中時隱時顯以招太乙元精之炁元始祖土出生萬靈爲混沌有物之母太玄有命之先兆能知之與空隱淪兆身本空寓精成身自有損實實去還虛虛乃空號身入太无入空如煙散化萬天出空成仙應感隨緣念之卽現忘之返玄不知所以自然而然字皆廣長一丈天眞皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳魔王保舉上眞道備尅得遊行三界昇入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致眞王下觀上帝遙唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅清河海靜默山嶽吞煙萬靈振伏招集羣仙天無氛穢地無祅塵冥慧洞清大量玄玄也

front:
  text: 元始无量度人上品妙經卷之二十八
  hash: sha256:2d77c3be0a241f10f9e02202a047698e08f42a8e3bd53fad37137c5ceccbf305
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_YP-C_01jiaoji-06-0033b, image: JY001/01jiaoji-06-0033b.png}
body:
  text: 三辰光煇保命延生品道言昔於始青天中碧落空歌大浮黎土受元始度人无量上品元始天尊當說是經周迴十過應現諸天說此度人六周十徧无量神靈盡來集會聽法大眾咸皆濟度其經藏於高上神霄玉府宣說玉音演暢大法元始天尊自上皇開基散布眞氣造立道境復於太皇之末中皇之始下於東方建通靈禁上太霞洞元之天開上皇梵飛世界運仙化飛昇之風舒飛仙洞羅之氣南方洞陽太光之天開陽明洞燿世界運赫炎朱火之風舒三天火鍊丹池之氣西方九仙梵行之天開渺行𩃬雲世界運高皇大霏之風舒少陰開明運仙之氣北方陰生廣靈之天開玄滋駕光回飛世界運上極羅天之風舒眞洞飛光之氣至於東北始青木皇之天開碧落空歌世界運融和九氣之風舒始陽震生之氣垂珠攝烟建法略竟元始法身示現三百六十變化大放九色神光洞照空有元始一氣敷落萬眞青陽宮中寶𦙍聖胎三氣周流木母生火出於東鄉玉雲萬華温明世界紫金巍闕狀如嬰童黃朱錦衣巾金帶瓊坐鎭三垣爲萬象之主膺我玉宸元皇之號現圓象於太空日月列宿儼侍左右赤景至陽爲日黃華純陰爲月八素流精爲星辰九元五章爲神靈鎭天剛之樞居三辰之上卽於太素天中景霄虛陰長樂化境受元始度人三辰光煇保命延生之法始當詣座天眞大神上聖高尊妙行眞人無鞅數眾乘空而來三素飛雲八景琅輿華旛翠節流彩揚光五色鬱勃洞煥高虛靈霞散空三辰交映華芒四射妙氣結形自成龍鳳甘露飄珠神煙卷縷纒綿縝靜綱紐旋回聖眞心目照達明徹山川林木互入無礙天蓋圓浮土如碧玉無有異色列仙環侍元始天尊玄坐虛浮火玉交光神虎之座說經一遍諸天大聖同時稱善是時太極元綱星羅雙燿宮闕通明說經二遍景星騰光照朗太微說經三遍黃氣陽精徊天儛空說經四遍五緯列眞同會玉闕說經五遍日闕月宮發現嘉祥說經六遍靈氣感降民獲延年說經七遍得見赤文齊修上範說經八遍執詠洞章挹景奔辰說經九遍功圓果滿下拔幽冥說經十遍萬品化成永開生道是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方无極无量品明眞大神无鞅之眾浮空而至說經二遍南方无極无量品眞陽大神无鞅之眾浮空而至說經三遍西方无極无量品太素大神无鞅之眾浮空而至說經四遍北方无極无量品羽明大神无鞅之眾浮空而至說經五遍東北无極无量品碧落大神无鞅之眾浮空而至說經六遍東南无極无量品洞戸大神无鞅之眾浮空而至說經七遍西南无極无量品飛符大神无鞅之眾浮空而至說經八遍西北无極无量品辟非大神无鞅之眾浮空而至說經九遍上方无極无量品靑都大神无鞅之眾浮空而至說經十遍下方无極无量品遠昌大神无鞅之眾浮空而至十遍周竟十方无極天眞大神一時同至一國男女傾心歸仰來者各乘七燿明霞三辰寶輦無邊翾積非可禁止各見日帝月皇列星宮殿各處世界一一宮中皆有帝尊羣臣吏民佐史國土境域不可臆度遍計天仙高眞羽蓋丹輿斑龍獅子驂駕往來採鍊奔挹明諸上道於是元始化現妙光大若圓象乃登引天眞大神上聖高尊妙行眞人十方无極至眞大神无鞅數眾俱入妙光論說三辰光輝保命延生大法示教至妙之先道非形相混成有物金水凝魂魂養胎宮光由神發乃立妙无上帝妙有大帝混元大帝三帝萬變經九七六億萬之數句陳上宮命天皇大帝左宮命太陽尊帝右宮命太陰元君中宮命紫微北極大帝總統二象運行五氣共領三辰斡以元斗三百六十五度四分度之一周流六十甲子運九陽之精爲日十陰之精爲月和合日月之精爲星辰日有九色月有十華日號九色圓象月爲十華圓光統大道之神靈故號太一天靈之光太玄無夜之光太蒼洞淸之光綠璃赤景之光五色濯羅燿明之光白素黃華神燿之光丹霞朱火之光太素玉華之光絳炎九微之光光中煥然自然梵氣結成紫書瓊簡眞文龍章鳳璽雲霞五篇之篆八方之氣支勢曲折隱韻垂芒作八卦之狀普濟天人救脫眾苦日之周徑一千里日行一度月之周徑一千里晝夜平行一十三度遲行十二度速行十四度日月合則萬物生成星大九百里小及百里行各有次水火之度不可爲準三辰光輝文理垂形靈書八會妙章玄圖曲素大洞知光輝之道參於風雲氣雨玄津玉液則形神洞妙奔光嚥霞引景步星則爲太上之眞人元始卽於妙光之內說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸悟光明神合於光氣合於明保命不終延生無窮三辰在天眞道冥沖三辰入心飛舉成眞三辰照地七寶鎭世識其道則骨成龍文飮其光則肉化金色出入有無永斷生滅齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱諱之音亦是日月內諱星宿之隱名也非世之常辭三辰光煇所以能保命延生者三光之精天眞之神下接人氣神氣混淪光性爲照於人爲識識在氣存神不離根是之謂命命洞斯旨可保而有命爲生主主在生延延生得道道妙自然上聖已成眞人通玄究微能悉其章誦之十過諸天遙唱萬帝設禮河海靜默山嶽藏雲日月停景璇璣不行羣魔束首鬼精滅爽回屍起死白骨成人至學之士誦之十過則眞神上奔三辰接景乘駕龍車與帝扶擕遊宴華庭屍蠧蕩滅胎穢淨明伏御地祇束縛魔靈返老卻死還年更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過則三辰之精下覆爾身心光上騰景氣冥一始煇之童採華之女執空青之紱以招三靈之神鍊神泥丸恍惚奔登燕觀太无諸天齊到億曾萬祖幽魂苦爽皆卽受度上昇朱宮格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經自然奔辰皆卽受度飛昇南宮世人受誦則三辰光煇降流身中注鍊形魂五臟金色面有玉光延壽長年後皆得作屍解之道魂神暫滅不經地獄卽得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶効心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經日帝下觀天光接身九霞鍊骨紫氣合神爲上世亡魂斷地逮役度上南宮七月長齋誦詠是經星帝下觀天光接身寶霞鍊質金色化精身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經月帝下觀天光接身寶霞鍊氣三光合身神奔意感萬變更生爲國王帝主君臣父子安鎭國祚保天長存世世不絕常爲人君安鎭其方民稱太平八節之日誦詠是經雙景朝元閉目內冥光洞天谷赤景鍊神五星降眞三辰繞身八威吐火元氣自生得爲九宮眞人本命之日誦詠是經日月煥照九元絡形朱煙飄溶使爾玄通乘龍紫霄據斗攀魁徘徊三陽遊行三玄辟試除殃八靈七政坐臥斗中辟卻萬凶三辰光煇爲我還容魂神澄正萬氣長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黃白三色雲氣之中內外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明五星交蔭洞煥室內項生圓象光映十方如此分明密呪曰无上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啟所言今日吉慶長齋清堂修行至經无量度人願所啟上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始无量度人上品妙經元始洞玄靈寶本章三辰光輝保命延生妙品十回度人三垣隱韻變化自然大範騰輝靈光散凝眞氣鴻濛混合杳冥外黃內赤二象交幷陰陽吸和天寶成文玉字五篇八方威神造化之祖二儀之源大化玄同溟涬無垠開明三景是爲天根日月含胞九道乃分元晶玄晶萬天化生上無復祖惟道爲身五文開廓普植神靈光氣結縷宛轉億尋龍章虎書寘玉布金華芒蔚構離合眞精劫仞圓羅玉山蕭京上極太无混洞三清渺渺鬱微紫葢黃庭左日右月中有赤熒六氣交纒三光結形五帝告符七曜玄經雲綱結帶神池育嬰中有奔景赤黑之神中有梵氣周回之君中有日童月女星妃之眞中有鬱儀結璘壘珠飛青燿紫之英中有挹煇採華八素之文中有赤帝黃老天魂高奔上靈圓景方象九色霞津灌鍊五臟澡治百關迅駕龍車上造帝軒三辰光煇保命延生回骸起死无量度人今日校錄諸天臨軒東方无極明眞神王長生大聖无量度人南方无極眞陽神王長生大聖无量度人西方无極太素神王長生大聖无量度人北方无極羽明神王長生大聖无量度人東北无極碧落神王長生大聖无量度人東南无極洞戸神王長生大聖无量度人西南无極飛符神王長生大聖无量度人西北无極辟非神王長生大聖无量度人上方无極清都神王長生大聖无量度人下方无極遠昌神王長生大聖无量度人十方至眞三辰光煇飛天神王長生度世无量大神並乘八素之雲紫霞之輦洞光之輿飛龍遊鳳杳靄萬香之車金碧瓊文之葢神明之節鬱絕之旛前擊鳴璈節奏後吹曲素生音玄鶴青鸞嘯歌嗈嗈九眞啟塗十華翼轅億乘萬騎浮空而來傾光回駕保命延生天魁內相玉輔帝靈太微司命玄合大神執籙把籍齊到帝前隨所應度嚴校諸天高奔赤帝吸御九元五辰協氣感接太玄光煇俯流保命億千朱景綠英飇象韜騫炎照虹離結璘黃華刻名絳臺鍊腦飛霞坐鎭明空佩服靈篇普告三界无極神鄉日宮月府左紀右綱九天五斗東井河源降氣玄丹同會崑崙疾除罪簿落滅惡根不得拘留逼合鬼羣元始符命時刻升遷三辰流火變化寒泉制魔保舉奔景成仙陰質受鍊神光綿綿三宮極眞道化玄精生身受度劫劫長存隨劫輪轉與天齊年永度三途五苦八難超淩辰極上登三垣三垣之天天帝紫微無色之境梵行東方八天三辰光輝應化之天如三奔之道上造日月宮有樓闕仙民世界皆晶光所生光洞極瑤天帝越靜靈公明梵燿白天帝道謹觀元玄德悅生天帝伯茲命棲恭紀彥張天帝角牢同氐妙玄九眞天帝兆育勤精洞關罙莊天帝永幽九英太飛玄頗天帝定正常無冥窈漏度天帝棘茲莊攸南方八天九道淵魚天帝日觀浮都林元允風天帝僑平子虛化淨寂夷天帝還竇阿婁梵雲深玄天帝憫江幽升成德寶氣天帝順護彥邱靜正霄敷天帝洞眞端堯升降治臻天帝卿度司兵清眞紫虛天帝奉貫治王西方八天混合寶眞天帝太素京保印又玄天帝刹陀奚洪拱祖秀天帝度仙元尊列辰九師天帝皇因太微虛明光无天帝敞冥氣玄韓司明禁天帝華屢眞機流精瓊球天帝博洞備符神龍變至天帝玉清監眞北方八天變度化眞天帝求何普林空梵影藏天帝覺仙蕩如風元易氣天帝鄙遲忽俞臨山降仙天帝斗魁玉宸集慶蒼室天帝覩多沙留朝燕猛部天帝泰師宣遐劫仞吉明天帝洞演務陂相夔島正天帝郝陂山尊三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻天中之音天中之尊天中之神天中大魔天中之靈九芒十華變化上清无量之奧深不可詳敷落神眞普度天人今日欣慶受度厯關諸天朝引辰光顧儀眄璘台元寫綱絳絃採玉月液裁防五星轉珠落落明堂飛神九宮存嚥太陽光輝炫晃無拘天門東斗青房西斗玉闕北斗紫戸南斗玄丹中斗黃庭合會飛仙口吐青氣錫祚萬年青帝拘魂白帝制魄赤帝火垢黑帝蕩𧕏黃帝召魔萬祅伏滅青華神王木景含元赤華神王執憲句天白華神王徊風絳烟黑華神王飛童飲玄黃華神王光燿三垣五華奔龍萬神之宗飛行鼓從總領天兵麾幢鼓節遊觀太空流精赫奕與道俱隆上天度人金虎玉龍浩風攝氣辰極鍊容英秀鳳羅保命無終五老持符太一鳴鐘速召萬神降光閟宮洗滌陰愆書紀玄功掃除不祥斬滅姦凶猛馬吐火金鉞前衝風雷巨霹電激四飛疾行帝命引挹光輝劫往方嬰生無凋摧三奔嚥華碧落同歸單青羽裙封山校精三官北酆明檢鬼營不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列言上清混洞九光玉輪十芒流珠曲直落落四張化行祖氣道之至精精澌泮霞寶斡旋回符圖龍書勢合交開鳳氣蟠丹仙雲偃芝嶽蹠卷玉赤曜吐奇太上靈篇保命正文三辰光煇凝化自然上極圓葢帝變億千周流化氣肇生三垣幽冥虛曠無極無窮溟涬大梵遼廓沖融神景炯爍梵氣淵旋妙液滋感恍惚變仙升降黃赤遊宴上清元綱流演五十二天輪轉星羅周回十方旋角度婁開生五常三十五分總氣上玄八景冥合氣入玄玄玄曜發光光神自生神曰赤皇五帝夫人洞闢九門白華隱存執把洞章召降天元紫虛鬱秀輔翼萬仙千和萬合自然成眞眞中有神天皇帝君太微北極天市玄宮日皇月燿總主星辰金霞朱芒保命延生上極上清出入黃房八冥之內細微之中下鎭人身泥丸絳宮四目密招炎光寶龍中理五氣混合百神甲爲陽日之始壬爲陽日之終庚爲陰月之始申爲陰月之終角爲星舍之始壁爲星舍之終黃赤黑白三辰之迹獨立周行亥沒子生十轉回靈萬氣齊仙仙道貴生光煇度人經厯八門飛天法輪奔引感接赤鏡左旋普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有三辰空洞之章上帝靈篇辭參高眞第一赤景奔日之音暘谷金城昇彼扶桑亘光萬里洞照十方珠景外圓中藏蘂淵五帝絳闕瓊池碧蓮青紫白黃丹氣綿綿下流爾身錫以長年騫林八羅雲膺玉芝散布百神精合二儀陽燧九龍駕天馬奔高風光老降華芒飛昇日帝宮錫爾洞元章上清爲眞公第二黃華奔月之章月精綠羅結璘化光中有大神號曰素皇浩蕩流軿杳不可量珠宮玉府寶閣琳房攝御神氣總統元綱羽儀騰飛車駕十龍潢波崑崙高峙玄峯交會祥源降我皓童泛霞注碧虛逍遙步靈風採精挹華芒下眄太無中注爾長生籙大惠永沖融第三八素奔辰之歌萬象布洪綱三垣主神靈嚴嚴天中尊斗極運飛輪紫微上帝君元皇之化身二景輔玄造五曜施天經大化積所變黃氣騰陽精九天降沖妙太霄羅七眞暘谷浮鬱微羣聖度西崑大慈虛皇帝化此開生門黃旛召天魔列眞趣大明六氣相纒結萬彙保生成皇極旣以立二道當順行八素下禹餘天民奔五辰齊修正元道飛神登玉京此三辰之上飛空之中天眞歌音音參洞章誦之百遍名度南宮誦之千徧天眞下迎萬徧道備飛昇太空過度三界位登仙公有聞靈音魔王敬形勅制地祇侍衞送迎拔出地戸五苦八難七祖升遷永離鬼官魂度朱陵受鍊更生是謂无量普度无窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝三辰天眞隱祕之音皆是大梵之言非世上常辭挹輝引景降致天光通玄變仙故謂玄奧難可尋詳上天所寶祕於神霄玉府東藏依科格三萬七千年應運下傳若有至人齎金寶質心依舊格告盟十天然後而付焉道言夫三辰光輝寂無虧蝕天運周行豈有否終月與日同道則陰侵陽以掩其光日與月同道則陽蔽陰而掩其華氣望而掩之三辰未嘗損也爲天地之至精爾能採其光華則爲上清之眞秉策於玄臺故運度虧盈人有休否至於疾傷存眞吸光按摩疾所或思握日月手把星綱坐致神仙保命無老齊心修齋六時行香十徧轉經福德立降消諸不祥无量之文普度无窮道言夫三辰光輝保命延生九色神光鍊骨灌心陽精合氣仙化通神或存三景於泥丸洞煥於六合之府併照洞房含芒嚥液上爲高眞而末學道淺或仙品未充運謝太陽身經太陰臥形五斗運應滅度臨過之時同學至人爲其行香誦經十過以度屍形如法魂神徑上南宮隨其學功計日而得更生輪轉不惑便得神仙道言三辰爲上道之宗萬象賴之以生仙聖因之而成仰其威神可以制伏六天魔鬼滅形引其光則遍徹幽關滌蕩胞胎屍血消散七世解仇吸其華則體有金色面流玉光位登太微神昇景霄光輝吐秀則萬蘂凝丹方寸萃寶飛晶接魂控辰紫庭浮駕上清遊宴玉京也天地運終星宿錯度日月失昏四時失度境土有災兵氣時見疫毒流行兆民死傷師友命過皆當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受賴其福難勝故曰无量普度天人道言凡有是經恭信之者三辰光煇下映爾身外辟不祥內拘神魂遷度幽爽使覩天英魄鍊屍滅保命延生上爲天地帝主兆民行是功德有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衞右別至人尅得爲聖君金闕之臣諸天記人功過毫分無失天中魔王亦保舉爾身得道者乃當洞明至言也諸天中三辰光煇大梵隱語无量音道君譔太上三垣保命延生玉篇東方八天祝盧球圖布遠孕諸影羅龍浦光神司璘旼微昭麓青璫曁蠙整震輅微玄离堪池道極霜褒珏井仇聯大宛阿柏珍天玄仙須華飛何楚渺那輹元碧洞空瑛瑤曇多南方八天魄燿曇明嶽泥通靈玉嵎醜火迷師鮮崙南澤雲霐亶稼答無惡陀珉竺廓奕嬰犢圈天山機琚鎭浮羅馘魔權漠意迅心和罔墜俟昔紛統烟遶梵由明緣法易玻鄒西方八天閻浮玉嵒穎吕總監无玄鏡卽鋤暮忱炎廓霐台北防斗德銜華舊由黎辨部平漂紫巒儼論謹邈馥芬巴靜戸央池演將奔於閴藪藏帝伯幾魂冶覩騫都陳漠卑孫北方八天玄宥猷度澄璠廉關鄭紇巫萍茲槎雲庭金太越還羅澤祺詩薄好率藉汶定淵恢周盟革鏐岵栗題營轉化嚳𥥆變冥祠丁資靈攝京和時莽桃寶宛辨育邈頗何枚道言此諸天中大梵隱語无量之音招三辰之光輝引九天之眞氣清詠佩閱天眞下迎舊文自然梵氣生於三辰之宮以制三界大小之殃水火之變天眞皇人刻題日月中及大宿星次以禳厄會斷絕否塞增駐運度有識其文勅制鬼神役使六丁保命延生與空傳靈字方廣一丈八角書形佩服朱綱玉策紀名有知其音能齋而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳魔王保舉上眞道備尅得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之三辰降光九霞攝氣化鍊凡骼祖考同僊頂生金華相具瓊顏壽等圓煇得道自然飛天下觀上帝遙唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅清河海靜默山嶽吞煙萬靈振伏招集羣仙天無氛穢地無祅塵冥慧洞清大量玄玄也

front:
  text: 元始无量度人上品妙經卷之二十五
  hash: sha256:846de64fe54d4293e209c2eea71a7d38b57b7d7b8f83c956051935d5ff7518e2
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_YP-C_01jiaoji-05-0061b, image: JY001/01jiaoji-05-0061b.png}
body:
  text: 赤符丹光品道言昔於絳霄天中丹景淸眞大玄明土受元始度人赤符丹光无量上品元始天尊當說是經周囘十過以召十方始當詣座天眞大神赤靈丈人三氣天君丹光九仙上聖高尊妙行眞人無鞅數眾乘空而來玉緯飛輪羽葆交蔭太霄騰晶八素流光璇極珠𨇠煥赫元綱五日五夜三淸四境无量諸天上極大羅下通黃闕各現赤混開刼飛霄寶符丹霞光散照映八門一國地土山川林木緬平一等無復高下土皆作紋玉凝煇瑩徹無有異色眾眞環侍元始天尊停駕空浮九龍陽燧神金萬變法輅之上說經一遍諸天大聖同時稱善是時一國男女仰聽聖教默悟重玄說經二遍天光內發照朗昏冥說經三遍神氣合混萬景生津說經四遍虛明曠達觀見十方說經五遍赤符丹光現於身中說經六遍生道交會疾癘蠲消說經七遍北酆暗域報對休停說經八遍金簡書功玉符定籍三官告命形化飛仙說經九遍法露珠英潤澤一切說經十遍十方三界无極幽關无量羣生逍遥離苦是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方无極无量品寶生大神无鞅之眾浮空而至說經二遍南方无極无量品洞浮大神无鞅之眾浮空而至說經三遍西方无極无量品燿明大神无鞅之眾浮空而至說經四遍北方无極无量品太一大神无鞅之眾浮空而至說經五遍東北无極无量品保安大神无鞅之眾浮空而至說經六遍東南无極无量品持化大神无鞅之眾浮空而至說經七遍西南无極无量品玉靈大神无鞅之眾浮空而至說經八遍西北无極无量品飛霞大神无鞅之眾浮空而至說經九遍上方无極无量品大變大神无鞅之眾浮空而至說經十遍下方无極无量品沖厚大神无鞅之眾浮空而至十遍周竟十方赤符丹光大神一時同至一國男女傾心歸仰皆見赤文大字遍滿虛廓丹光洞照十方同明內見自己身中心通萬道外與法合卽名赤符見察萬殊異體同照卽名丹光內外之道皆是元始外生天地內化一身皆同此道自非列聖開教不能化成譬如混沌初造終始九刼若非赤明不能開圖一身始生毛髮肢節九竅雖具若非神光外見心光內通一切聖賢不能成就是故我等咸悟元始所說大法役運神變開導天人來者有如細雨密霧无鞅之眾迮國一半土皆偏陷非可禁止於是元始懸一寶珠大如黍米在空玄之中去地五丈元始登引天眞大神上聖高尊妙行眞人十方無極赤符丹光至眞大神無鞅數眾俱入寶珠之中天人仰看惟見勃勃從珠口中入旣入珠口不知所在國人廓散地還平正無復欹陷元始卽於寶珠之內說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸行道心洞見洞識洞妙洞知洞悟洞徹洞照洞微洞明洞鑒言符至理默契玄機齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是眞王內諱百靈之隱名也開示大法造立天地內生人物外成混沌赤符應合丹光纒綿元氣烹煎眞火化鍊以成三界匠立萬天爾能體之自然得道非世之常辭上聖已成眞人通玄究微能悉其章誦之十過諸天遥唱萬帝設禮河海靜默山嶽藏雲絳煙布逸霄光亘玄心符內充丹寶外應羣魔束形鬼精滅爽囘屍起死白骨成人至學之士誦之十過則五帝侍衞三界稽首紫煇遐映神晶注盈妙開元造神泊其間魔精喪眼鬼祅滅爽濟度垂死絕而得生所以爾者學士穢氣未消赤符陰隱丹光內潛體未洞眞以制十方威未制天政德可伏御地祇束縛魔靈但卻死而已不能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到赤符度生丹光啟幽億曾萬祖幽魂苦爽皆卽受度上升朱宮格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛升金闕遊宴玉京也上學之士修誦是經神契赤符道融丹光皆卽受度飛升南宮世人受誦則延壽長年丹赤之華注澤屍腐骨剛氣眞後皆得作屍解之道魂神暫滅不經地獄卽得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經赤符召和丹光運明三元錫契萬象蒙生爲上世亡魂斷地逮役度上南宮七月長齋誦詠是經赤符召陰丹光育精四明奏功五老奉經身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經赤符召陽丹光用章九宮合氣玉女𧵥漿爲國王帝主君臣父子安鎭國祚保天長存世世不絕常爲人君安鎭其方民稱太平八節之日誦詠是經赤符周建丹光流行八景合體六司命眞得爲九宮眞人本命之日誦詠是經赤符召神丹光繞身魂神澄正萬氣長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上淸道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐靑黃白三色雲氣之中內外蓊冥有靑龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室內項生圓象光映十方如此分明密咒曰无上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啟所言今日吉慶長齋淸堂修行至經无量度人願所啟上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始无量度人上品妙經元始洞玄靈寶本章赤符丹光上品妙首明識度人龍康廣運開化因緣大洞隱章虛含至眞太旡三一流結諸天碧落敷明高峙天根大經離合萬境分神赤符帝氣丹光上靈恢張玄範洪厯冥冥六風交煥空象告成玉文肇啟天道流行是爲元造蒼混飛煙太霄鬱單玄丘景仙茫茫正化皇極推遷瓊羅騫仭至妙靈圓三周九復包絡綿綿億天羣品歸眞玉垣正行遊梵過度生關中有赤明校錄之神中有玉符攝氣之眞中有大丹流熖之君中有炎光開化丈人中有太一入纒黃庭鳳紐混合大洞高尊統御玄變淸都化身金篇消魔廣大飛輪三十九帝廓開八門今日敷教萬眞臨軒東方无極寶生神王長生大聖无量度人南方无極洞浮神王長生大聖无量度人西方无極燿明神王長生大聖无量度人北方无極太一神王長生大聖无量度人東北无極保安神王長生大聖无量度人東南无極持化神王長生大聖无量度人西南无極玉靈神王長生大聖无量度人西北无極飛霞神王長生大聖无量度人上方无極大變神王長生大聖无量度人下方无極沖厚神王長生大聖无量度人十方赤符丹光神王至眞度世飛天大神並乘三華絳霄流雲鳳輿瓊輦天蓋地輪驂駕朱光玉角神獸蒼鱗火鬛蛟龍建招眞之節告靈大旛前列玉虛寶仗後從三元化兵洞神九仙飛空步虛四帥啟塗三師告盟億乘萬騎浮空而來傾光囘駕監眞度生赤符經天三界同生丹光六飛萬物洪施心知目見神動意隨天人仰法至化同歸大象流布洞虛極玄方諸符召超登九天九天上宰元黃左宮流雲司命保世大神執籙持符同會帝庭隨所應度天化浮沉普告三界八極雲營崑崙瑶闕廣野寒扃五方玄嶽四極眞公九元大憲化見玉文疾除故氣淸正生根不得拘留上合仙眞赤符丹光時刻飛升北都六洞普赦幽魂制魔保舉度品朱陵死魂受鍊仙化成人生身受度刼刼長存隨刼輪轉與天齊年永度風刀水火之難超凌三界逍遥上淸上淸之天天帝朱明無色之境梵行東方八天靜都勤明天帝妙衡具傍昌郊九華天帝卿靈尹登符應智靈天帝曉虛妙常灼變丹神天帝遘氣圖生蒼京寶風天帝化招境形聖基密照天帝鑒眞定微運晶遂方移想天帝縛奔囊孤高虛赤符惠生天帝井虛厯維南方八天陽光化生天帝景中惟寗九宮明燿天帝閟淵求方丹霄注靈天帝赫爰胥延曲晨紫眞天帝護斗召仙太微瑞靈應精天帝直波夷倫光慧洞無天帝剛過擇躬寂意思玄天帝保玉令修洞玄摧魔拱雲天帝飛圓曜隨西方八天瑤府定民天帝按涂知元寒庭對兵天帝戒無象虛司覆開世天帝慈流升眞功定籍天帝問初顯非太上素晨禁綱天帝樞牢勝當內池誕華優陽天帝耨達用義簡微求祖知變天帝洞仙常師主錄度仙超化天帝山英謝方北方八天梵樂錄魔天帝變龍擲旌垂慈飛眞無想天帝志明淵符玄明左期靜光天帝甫昭叢希五氣交符鍊神天帝優頻景珠張育行眞天帝納生辨殊龍桑命仙天帝屈空冥神朱明合氣天帝極監盟眞靈綱正氣總陰天帝主羅察冥三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻天中之音天中之尊天中之神天中大魔天中之靈九奇十耦和合自成赤符丹光變化上淸无量之奧深不可詳敷落神眞普度天人今日欣慶受度大化開生感變幽關大會神靈請滅三惡斬絕地根斷胞閉死名列太玄眞王監舉無拘天門東斗執契西斗召仙北斗奏簡南斗列言中斗坐鎭運轉元關帝魁玉籙洞鑒冥無天眞玄一五斗之符下元化氣太刼丹書靑帝施令白帝禦敵赤帝正憲黑帝建立黃帝中主變化無極惟符所指陰陽乃宣吉凶示象善惡相連靑天魔王皛晶鬱羅赤天魔王明燿絳霞白天魔王金眞保華黑天魔王鼓化玄波黃天魔王安鎭崇阿五天大魔萬神之宗飛行鼓從總領天兵持幢仗節遊觀太冥自號赫弈諸天齊功上天度人嚴攝北酆眞王受命普掃不祥三元降詔大憲恢張飛符攝御淸蕩十方定界無邊風火八衝敢有抗拒糾送酆宮元眞振劔天曜施刑屠戮邪魅收捕無停千千斬馘萬萬滅形魔無干試鬼無祅精太陰北都按察鬼營不得怠縱飛章奏罡普告三官正道流行考功定籍書名紫淸玄曜大刼寶厯龍康洪運周流纒結陰陽一氣交絡開隆上皇飛生玉音廣布十方丹華升降輪轉剛風眇眇億氣赤混玄宮上周圓曜下變重淵風動八冥洪極成天赤符化鍊丹光發煙天上天下煇朗幽冥肇形虛象廣大無窮鴻濛溟涬豁落舒光太眞啟圖運度自然朱陵敷演徊風上篇碧簡金章玉籙瑤編保安天地永刼綿綿梵炁彌羅萬範開張丹光成立三境諸天輪轉崑𠀉包羅億千元老下教普度羣仙三天三地灌氣三垣八景玉羅氣入高玄玄中至眞丹霄上卿佩天瓊文校錄稱尊合景飛霞執詠洞經金華流彩普攝雲營玉章大誥鳳簡龍書徊天隱道接閱元圖千和萬合自然成眞眞中有神東華天君方諸帝一太素千精玄光保命混洞延生赤符丹籙永鎭玄根上遊淸微出入洞虛巍巍天闕列聖之居下降種民升舉淸都中理太極混合空无十轉囘靈萬景同升仙道貴生无量度人上開八門經天法輪罪福禁戒宿命因緣普受鍊度死魂生身身得受生上聞諸天諸天之上各有生門中有混天開刼之章仙聖靈篇辭參高眞第一混極飛仙赤符之音太虛元始生成天地空極杳冥肇於一炁廣大無邊化生眞帝上居玉京三界統制咸錫威靈不間巨細周流合變成此大器赤書敷落靈仙交會五山安鎭玄嶽高峙崑𠀉閬風黃老爲治虛皇憫眾生開演玄妙義洞章攝魔羣億天蒙大庇第二玄變眞君丹光之章嚴嚴大有宮萬靈朝上皇三氣包太虛飛霞結元綱上開廣瓊室下布流景房三垣懸帝座赤文羅五方內陳玉極眞保此大經常空生纒地紐冥冥度龍康眞王馭天馬寶闕舒丹光天運啟玄圖玉道發嘉祥元君乘化氣神變不可量俯觀三界民欲海徒茫茫披誦洞玄篇超升太福堂第三赤符丹光眞王歌曰岧岧金闕下臨太淸碧霞鬱合化此金城巍巍虛象飛臺玉京九龍大刼生育神靈妙氣交合變化天根赤文列聖丹光上眞三十九帝與道同生持握天憲空洞皇君校鍊飛天驂駕龍驎周遊三界正道開明威光下濟照徹重昏淸蕩北酆普赦幽魂萬類逍遙十方蒙恩此三界之上飛空之中眞王歌音音參洞章誦之百遍名度南宮誦之千遍眞王保迎萬遍道備飛升太空過度三界位登仙公有聞靈音魔王敬形敕制地祇侍衞送迎拔出地戸五苦八難七祖升遷永離鬼官魂度朱陵受鍊更生是謂无量普度无窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈眞王隱祕之音皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寶祕於神霄玉府東藏經室依科三萬七千年應運下傳若有至人齎金寶質心依舊格告盟眞王然後而付焉道言夫赤符道逆丹光內隱則二儀失序五行數睽故天地運度否終日月五星虧盈至聖神人休否末學之夫疾傷凡有此災同氣皆當齊心修齋六時行香十遍轉經福德立降消諸不祥無量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太陰臨過之時同學至人爲其行香誦經十過以度屍形如法則赤符照心丹光還形不與物化神凝氣淸魂神徑上南宮隨其學功計日而得更生轉輪不惑便得神仙道言夫天地運終星宿錯度日月失煇四時失度陰陽不調國土有災兵革四興疫毒流行兆民死傷師友命過良善橫殃皆當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受賴其福難勝故曰无量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衞右別至人克得爲聖君金闕之臣諸天記人功過毫分無失天中眞王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語无量音道君譔元始靈書赤符丹光玉篇東方八天弗黎竟桑徯邅輔璫庚福奠神揚騎時房兖枚郁澮周勤氐梁越贊傳野畢容治光按披曜師維誓鄞康靜學原蔽密都朱堂參據角首穹奇僖章絡昔魔靈粲秀東疆南方八天赤符三氣火山炎精照煥潛蟄幽離浮瓊定顯妙樞紀錫幾冥善旅逸修豫盈司奔嶽迭命召魂林繁騰無鐸演廬盤河哲承綿度令高慈尤并艱肆除獻寗太霞資明西方八天碧巒濟佑浮空景涯神策飛籙早馳玄華奎芒皇俅祿員禹瑶遵善旣邈閉延投嵬艮茲印宙玉微化伸昊素格畧利淵開仁掌紀緣釋湊智遠京抱月綠霞詠此至音北方八天衡圍太始芒露激虛句陁支云桓倣箕無正鄰投黃聚沖攸靈欲蘇踐荒祥實觀眞鬼由牢察玄屍杳丁沖熙日囿評霞嶽䖍氣膺逃宏沼領綿謨彫梗雲昆總靜遘泉道言此諸天中大梵隱語无量之音舊文刻書絳臺瓊華妙靈玉妃丹墉廣闕之上字皆廣長一丈天眞皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣赤符丹光神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大功魔王保舉上眞道備克得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致赤符告靈一呼萬應丹光囘照百理千通密授紫書上爲眞宰神王下觀上帝遥唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅淸河海靜默山嶽吞烟萬靈振伏招集羣仙天無氛穢地無祅塵冥慧洞淸大量玄玄也角集五音釋帀音浹周也鋹音昶利也玦音決玉佩也㠗澱音電莛音廷又音挺閥音伐功也𢾭音孚𢻫也音弛坱音泱塵埃也圠音軋不測也钁音矍坌音分塵也皛音薂又音檄顯也芤音摳傍寶中空也𧊚音同虫也𧵥音垝財也俅音求元始无量度人上品妙經卷之二十六明體貫氣品道言昔於太丹天中絳雲凝霄赤光世界受元始度人明體貫氣无量上品元始天尊當說是經而乃謂言吾爲天地之祖萬氣之先三寶天君肇化之後道體分三於太空混黃清虛丹暉廣化大劫生第三元老號太上老君統治玄氣養育人民卽吾至道分神傳授大範已經九萬九千九百九十九億妙氣氣分三劫无量度人吾昔於彼已明此道當命太上老君於太丹天中爲一切眾生剖析祕密開化天人吾已演化諸天明露道要三才五行陰陽玄極之旨明體貫氣最後分別宜命太上宣示隱微使諸眾生悟道通達作是念已太上老君居太清太極宮大光明殿敬聞教誡徑詣座前稽首再拜長跪默念大聖虛皇元始天尊寶號者三上奏天尊臣奉密旨令升法座爲十方天人說明體貫氣妙經謹依詔命諦奉宣揚禮足整衣將說是經周迴十過以召十方始當詣座天眞大神列聖高尊上清眞人無鞅數眾乘空而來九霞布空玄光內照華葢飛軒碧落騰煇流雲丹景垂蔭太虛七日七夜清微禹餘大赤三境種民三界无極諸天日月宮府玉垣帝座太微寥陽鬱山玄京丹臺紫閣瑤闕瓊樓皇極飛綱洞淵劫仞森然在目無有隔礙眾眞侍座太上老君玄坐空浮陽光玉闕寶臺之上說經一遍諸天大聖同時稱善是時一國男女咸悟生化之根說經二遍眾惡消除說經三徧萬善集身說經四徧眞氣下降灌注心田說經五徧所向皆眞玄符正範說經六徧神妙足備克獲飛仙說經七徧明體妙元貫氣達用說經八徧九玄七祖上世亡魂眷屬親姻逍遙離苦說經九遍玉章破暗靈光燭幽說經十遍一切眾生永斷惡趣𡨚仇解脫報對休停是時一國是男是女莫不傾心皆受護度咸得長生道言是時太上老君說經一徧東方无極无量品八景大神無鞅之眾浮空而至說經二徧南方无極无量品明光大神無鞅之眾浮空而至說經三徧西方无極无量品制魔大神無鞅之眾浮空而至說經四徧北方无極无量品蘂珠大神無鞅之眾浮空而至說經五徧東北无極无量品雲宮大神無鞅之眾浮空而至說經六徧東南无極无量品變化大神無鞅之眾浮空而至說經七徧西南无極无量品靈飛大神無鞅之眾浮空而至說經八徧西北无極无量品三素大神無鞅之眾浮空而至說經九徧上方无極无量品玉虛大神無鞅之眾浮空而至說經十徧下方无極无量品離合大神無鞅之眾浮空而至十徧周竟十方无極明體貫氣大神一時同至一國男女傾心歸仰來者駢委叢踏數計億量非可爲比徧諸天境於是太上老君覩見四眾十方圍繞卽向北方恭禮玉京大聖元始天尊上清紫霞太上玉宸大道君旣畢復座東嚮環顧大眾運道神力移十方天人遐邇來者徧天觀聽之儔盡升虛空高可百丈卽取碧霓流雲黃縷萬花之帔迎取天人來置座下廣殿四開无鞅之眾厠如積粟讚歎禮拜聲震八極太上老君天顏微笑舉五明寶扇撫紅霄金光明之几重告大眾曰道出而爲神神化而爲氣氣者未有天地陰陽之先眞元萬化之祖道之妙感也其氣非色非形非有非無不隸陰陽不屬五行能生能化能成能實爲道之神用故剛於金石清於氷玉大於虛空長於上古內凝至精造立混沌下逮萬類此氣爲始其謂之氤氲恍惚者氣兆於形端質陶於太素作天地之妙本名曰一氣故有眞一玄一太一亦曰玄元始三氣自建植玉京及於泉戸仙聖鬼神人物莫不由之均以道生無有分別高下善惡強弱堅脆以自然付受未常爲也洎三界成就神靈攸司君尊臣卑則役造化定隆殺興賢愚立高下則道有至聖之神天有不私之帝三垣星斗八威神官以布其政記人功過生滅無失雖纖芥圭黍不得逃逾則先明體以貫其氣如道爲無體德爲有體照爲明體玄爲暗體陽爲動體陰爲靜體正爲仙體邪爲鬼體體分旣定則貫其氣以受其生無體則貫以浩氣有體則貫以元氣明體則貫以清氣暗體則貫以濁氣動體則貫以龍氣靜體則貫以常氣仙體則貫以靈氣鬼體則貫以異氣明體貫氣區畛有方萬化大定三才之政績用乃成超淩三界高眞之業可覬善惡之錄有科福禍之理大明天人鬼神十方億萬之眾化遠敎行出離輪轉仙道克登長生無爲允合太空太上老君說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸行善心明信明因明緣明報明感明果明法明教明戒明體言符至道行合天機齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有志心宗奉禮敬皆得度世道言太上老君說經中所言並是諸天上帝內名隱韻之音亦是魔王內諱百靈之隱名也非世之常辭上聖已成眞人通玄明體眞氣貫身能悉其章誦之十過神光內燿魔鬼喪睛儀璘舒華璇璣煥明祟癘斬戮鬼神伏形回屍起死白骨成人至學之士誦之十過則太上遙鑒三府記名祅邪殞首滯爽登升濟度垂死絕而得生所以爾者學士未洞太玄務明體理穢氣不盡尚拘人累召制十方威未制天政德可伏御地祇束縛魔靈但卻死而已不能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸仙齊到體淨心明陰翳消瀹氣合神眞冥光晰暢億曾萬祖幽魂苦爽皆卽受度上升朱宮格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛升金闕遊宴玉京上學之士修誦是經皆卽受度飛升南宮以其誠誦通感明體不昧靈氣貫形自然受鍊得詣流火之庭瑩玉光於靈顏納朱文於錦胃也世人受誦氣添生福屍故自斷血流清津腦塡素液則延壽長年後皆得作屍解之道魂神暫滅不經地獄卽得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶効心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經明萬物受生之體仙靈人鬼變化之道皆從太无自然中來依道立體資氣爲用以神發知用明爲識陰陽水火鍊以成眞萬物之體仙靈人鬼其體若同變化所貫之氣各異神通妙密各各不同出沒隱淪彰顯之道互出玄領爲上世亡魂斷地逮役度上南宮七月長齋誦詠是經明萬物受成之體仙靈人鬼陰息之道皆從靈氣貫質陰火烹鍊依定立堅憑靈爲變以清爲知以燥稟體月華滌沐鍊以成眞萬物之體仙靈人鬼其體若同變化所貫之氣各異神通冥運各各不同謝緣斷凡幽曠之道互出奧領身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經明萬物復命之體仙靈人鬼還元之道皆從玄一得命命以定體太黑貫氣兩半成功依液感生噏粹護養晦以生明以靜爲化玄霜碧露鍊以成眞萬物之體仙靈人鬼其體若同變化所貫之氣各異神行默察各各不同出離遐舉之道互出祕領爲國王帝主君臣父子安鎭國祚保天長存世世不絕常爲人君安鎭其方民稱太平八節之日誦詠是經八風隱體貫氣八方八景會眞泥丸洞明得爲九宮眞人本命之日誦詠是經兆自明體貫氣入身賢者爲聖凡骨爲眞魂神澄正萬氣長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黃白三色雲氣之中內外蓊冥東有木玄眞人南有炎象眞人西有金液眞人北有水象眞人上有玄妙眞人侍衞監觀獅子白鶴羅列左右日月照明洞煥室內項生圓象光映十方如此分明密呪曰无上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啟所言今日吉慶長齋清堂修行至經无量度人願所啟上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經

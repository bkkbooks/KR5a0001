歌隱語无量音道君撰元始靈書碧霞玉文靈篇東方六天銜鏡鬱峩霞露四空容景杳期斗胃斯容明薄九陽周遊至宗會辨酉正入走八通丘坎鼎除金錄月春抱明玉野靈章夷沖南方六天井生尾箕柳張合岐正鈴東嘉雲龍瓊飴再命黃絡遘遇壁支炁運普口林嵠玉眸道幾正圖五陽交宮蘿媛紫景玄孚散公西方六天蕭池禺微珠明夜霏鬼柳冥疆走籍火池洞馬調合玉妃散夷昴張並驅女室相宜陽霐曲淨金鉉虎姬錯帝彥辰芺天太儀北方六天昆太傍由路正獄琳琳悔駿施火公電侯正笑正池淨明仙謀鉤合靈便殿軍伯修无无太罙洞臨逆樓龍機河銘紫微九邱道言此碧落空歌大梵隱語无量之音舊文字皆碧霞宛轉曲折成文垂芒八會天眞皇人雲迹句留筆而錄之以爲正音有知其音能齋而誦之者諸天皆遣玉音神王碧空至眞自然大神下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳魔王保舉剋得遊行碧落身御青門此音無所不禳無所不辟無所不度無所不成碧落神風自然之音也故誦之致飛天碧空大神下觀上帝遙唱萬神朝禮三界侍軒羣祅束首鬼精自亡神風振響碧落洞清十方交暎海嶽淵澄空洞凝光照暎合明羣仙稽首飛騰玉京天地曠極神音泠泠冥慧无極大量玄玄也角集四音釋汧同汧音牽水名爓音䀋火門也𢘍古弼字犇音賁牛驚也朒音衄嶪音業弇音𤲅䕡音閭涔音岑蚑音祗秷音窒稂音郎聻音伱泥上聲闠音潰湟音黃水名漻音𦕅屧音夑晃同晄音恍盅音蟲錞音純芺音夭重刋道藏輯要角集五元始无量度人上品妙經卷之二十一生化胎根斷除邪穢品道言昔於始靑天中紫霄空歌太極玄土受元始度人生化胎根斷除邪穢无量上品元始天尊當說是經周囘十過以召十方始當詣座天眞大神上聖高尊妙行眞人無鞅數眾乘空而來絳煙捧塗華晶燿輦丹碧浮駕洞光羽輪五明錦色蓋映霞芳九氣合彩洞煥太空七日七夜諸天樓闕遥開玉毫隱顯星珠絡緯日景自停神陰舒煇金波泛滉璇璣玉衡還斡靈和注浹空海神風囘混翠峯蟠偃天無浮翳四氣明淸一國地土山川林木緬平一等無復高下土皆作碧玉無有異色眾眞侍座元始天尊玄坐空浮七宸九華明离寶座之上說經一遍諸天大聖同時稱善是時一國男女妙氣凝胎生根超秀說經二遍邪穢斷除結節通解說經三遍神棲空洞梵氣冥涵說經四遍骨有玉華顏揚金色說經五遍七世散仇福堂慶會說經六遍紫煙灌身百神愷樂說經七遍雄雌混化三一昇遊說經八遍神光內映徹見百關說經九遍心悟洞靈證眞帝臺說經十遍策名玉淸侍宸金闕是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方无極无量品靑帝梁虛生化胎至眞大神無鞅之眾浮空而至說經二遍南方无極无量品赤帝仲明賓除穢至眞大神無鞅之眾浮空而至說經三遍西方无極无量品白帝詡成豫化胎至眞大神無鞅之眾浮空而至說經四遍北方无極无量品黑帝元道冥除穢至眞大神無鞅之眾浮空而至說經五遍東北无極无量品八景明微君化胎至眞大神無鞅之眾浮空而至說經六遍東南无極无量品八景玄靈君除穢至眞大神無鞅之眾浮空而至說經七遍西南无極无量品八景眞華君化胎至眞大神無鞅之眾浮空而至說經八遍西北无極无量品八景靈暉君除穢至眞大神無鞅之眾浮空而至說經九遍上方无極无量品八景吟穴君化胎至眞大神無鞅之眾浮空而至說經十遍下方无極无量品八景祕形君除穢至眞大神無鞅之眾浮空而至十遍周竟十方无極天眞大神一時同至一國男女傾心歸仰來者各相謂言元始天尊在始靑天中演說生化胎根斷除邪穢之法我等自入流轉不出生死貪嗔愚癡墮在諸有雖福業因緣得生天上而諸天人愛迷執戀纔捨塵染尚居細塵習氣不除動罹結滯感化胎元不得淨盡生根堅固著於不滅以住爲本不知道體玄妙包養太空九聖十眞本無生滅胎根未斷致此撓競互相變化遞爲種族屍血流行骨壞形朽我雖天人未出三界形未獨化與道相隔縱使化身猶在色境故於相視接手語言音聲不契大洞使三尸蕩流穢血生瘕邪魔乘襲背遠眞道今當傾聞法音帀繞天座億刼之眾一時同會非可禁止於是元始垂衣正視命黃素元君執方規之鑑天地眞形支勢成字白素元君擊洞陽之鐘十方合響萬天交唱紫素元君垂浩景之珠大如黍米在空玄之中去地九丈元始登引天眞大神上聖高尊妙行眞人十方无極至眞大神無鞅數眾俱入寶珠之中天人仰看惟見勃勃從珠口中入旣入珠口不知所在國人廓散天光煇映萬氣肅淸元始卽於寶珠之内說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂無遺響是時天人遇值經法普得濟度解散結節斷絕邪源傾土歸仰咸行至心忘累忘有忘化忘得忘念忘情忘識忘動忘息忘形言無理宗口無欲聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是魔王內諱百靈之隱名也非世之常辭皆生化道胎淸鍊胞根斷除邪氣斬滅血屍修眞洞極之要言上聖已成眞人通玄究微能悉其章誦之十過諸天遥唱萬帝設禮河海靜默山嶽藏雲日月停景璇璣不行羣魔束形鬼精滅爽囘屍起死白骨成人至學之士誦之十過則胎根生化無有世緣邪穢凋落百神合形五帝侍衞三界稽首魔精喪眼鬼祅滅爽濟度垂死絕而得生所以爾者學士邪穢漸消心未洞玄以制十方威未制天政德可伏御地祇束縛魔靈但得度身而已不能普濟萬生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人無量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到玄上丈人爲兆解禀胎已來宿血瘕穢赤黑大滯西明君爲兆解胞中積水腥汚屍鬼潢溺泉曲寒池之釁訟在水官考注不止連及生人生死之根災禍萌孽不得興作使胎根生化玉液仙英妙姿自然得道七魄遊逸魔彭伺姦外構邪鬼淫犯胎宮夜夢燕樂與鬼同營太上玉帝以紫光九靈寶札詣南宮韓君丈人天機省中監簿按籍檢考善功生化胎根斷除邪穢億曾萬祖幽魂苦爽皆卽受度上昇朱宮格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經皆卽受度飛昇南宮世人受誦胎根惡濁鍊化故氣尋得斷滅生化仙眞邪魂穢魄淘澤淸淨則延夀長年後皆得作屍解之道魂神暫滅不經地獄卽得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死䝉惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經上部九宮靑帝羅文英執靑宮之符開兆百關解散結節帝一內懽紫煙灌身神光洞照羽煇映玄爲上世亡魂斷地逮役度上南宮天機省也七月長齋誦詠是經中部九宮白帝㝢文昇執素靈之符爲兆生化胎根使斷凡因流轉停關邪正速分穢垢淸蕩日霞瑩形太素生五臟七雲入泥丸身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經下部九宮黑帝鄭文通執黑帝之符入兆膀胱中使胞胎屍滅百穢遏絕邪魔祅爽然骨瀝血兆體有五帝之玉暉面有流金之皓姿常與太一公寢魁抱明月爲國王帝主君臣父子安鎭國祚保天長存世世不絕常爲人君安鎭其方民稱太平八節之日誦詠是經得爲九宮眞人三元三宮二十七眞雄一无英雌一白元五宮奇耦交變又玄生化胎根掃誅邪源孕精流光玉嬰生蓮帝一坐壇萬靈莫先本命之日誦詠是經十二大結三百六十骨節八關九宮神蓋童子中池內神感鍊變易生化胎根斷除邪穢使身不傾魂神澄正萬炁長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上淸道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐靑黃白三

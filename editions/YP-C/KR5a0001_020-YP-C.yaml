front:
  text: 元始无量度人上品妙經卷之二十
  hash: sha256:b61a035c4e3198e85283cad6f0b240eb57ca65ce179e4faa13d9a4db52c6959e
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_YP-C_01jiaoji-04-0062a, image: JY001/01jiaoji-04-0062a.png}
body:
  text: 碧落空歌品道言昔於始青天中碧落空歌大浮黎土受元始度人空洞靈章自然之音碧落纏虛天霞流曼神風鼓激萬音合響浮沉清濁抑揚宛轉錯而成歌其聲洞徹交唱諸天當於是時天地萬物無聲之類一時能言敷道立教啟玄建宗一切生類通理明法元始天尊當說是經周迴十過以召十方碧落世界飛霞結縷妙於寶綱一切天人龍輿鳳葆倐忽往來若經幽竇空碧炫煥略無限礙光煇流影照一透萬中生神風徐速得度歌吟應節虛琴法音徧無有量珠樓寶闕咸出靈韻讚道讚法讚仙勸諸天人興崇善功深悟上道天眞大神上聖高尊妙行眞人碧落至眞自然空歌金童玉女無鞅數眾乘空而來紺虛凝湛寒碧洞清玉馬飊輪寶繖敷蔭天音妙梵隱密互作九光纒囬五明泛燿七日七夜諸天內眞各陞亶樓齊擊天鼓龍虎號嘯星機東揺二十四天寶宮殿中混然碧色嶽聳波澄七辰瑩澤雲容風寂灝景舒明一國地土山川林木緬平一等無復高下天海涵環土玉葱蒨漻然洞歌無有異色眾眞侍座元始天尊玄坐空浮九翠玉臺神龍萬珠之座說經一遍碧空洞歌羣響唱善是時一國男女聽牖解關無幽不聞說經二遍華童散煇照鑑无極說經三遍碧落成音神風緩奏言詞清越說經四遍大智該廣法身普同說經五遍聞歌悟法還元復命說經六遍視身與境潔如寶珠隨方現色道空不遷說經七遍悟此空歌元非起滅霞張風至音調自生入道登眞理從斯得說經八遍遊宮浮闕泳蕩碧虛內音清歌流轉隱顯說經九遍空洞生華湧成千界天人男女出入黃房沉碧還虛呈露道體說經十遍霞布十方歌成九奏上極大明下開幽夜天人大慶靈寶示祥是時一國是男是女莫不手結天維足躡雲綱飛形上清皆受護度咸得長生道言是時元始天尊說經一遍東方碧落空歌至眞大神無鞅之眾浮空而至說經二遍南方碧落空歌至眞大神無鞅之眾浮空而至說經三遍西方碧落空歌至眞大神無鞅之眾浮空而至說經四遍北方碧落空歌至眞大神無鞅之眾浮空而至說經五遍東北碧落空歌至眞大神無鞅之眾浮空而至說經六遍東南碧落空歌至眞大神無鞅之眾浮空而至說經七遍西南碧落空歌至眞大神無鞅之眾浮空而至說經八遍西北碧落空歌至眞大神無鞅之眾浮空而至說經九遍上方碧落空歌至眞大神無鞅之眾浮空而至說經十遍下方碧落空歌至眞大神無鞅之眾浮空而至十遍周竟十方无極碧落空歌至眞大神一時同至一國男女聞悟法音傾心歸仰來者有如无量風雲之聲繁音大音無等之聲未覩形儀先聞如是音景若歌謡笑語讚歎悲啼環珮履屧無邊眾音闠闠而來遍滿國界非可禁止於是元始手挽碧落長縷之霞盤屈寶掌圓如碧珠光明透徹十方世界碧落空歌無外之事若近眉睫俯窺傍矚如淨瑠璃先示法筵次示大眾瞻仰未久忽然之間擲於空中去地九仞大如飛星元始登引天眞大神上聖高尊妙行眞人十方无極碧落空歌至眞大神無鞅數眾俱入飛星妙光之中一切天人無不登入神光晃粲外者見內內者見外上者若附下者若仰表裏洞鑒不知所由內外咸觀湛然同體切處一光空歌自鳴碧霞鬱密神風鏘鏘十方玉城融麗齊等無鞅天人不知所在元始卽於妙寶光聚之中說此碧落空歌是出世道是長生法是大化源是玄妙宗十方眾生具此聖心眼耳口鼻悉能了知一切道境而未有不從碧落之中空生洞歌至道法音徧一切生類音言應答由是道生論法都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人值遇經法普得開悟究識本眞知此碧霞本元始精天地旣開霞精散遶經緯演布絡如絃縷風動其間五音共作不從天造不從緣生故知道玄自然出音聞此靈音開辨心目乃有分別得悟道眞無聲之中得聞遐唱道無終窮傾心歸仰咸行大心無作無欲無意無念無想無愛無執無得無虛無實無滅無生言無矯妄語無惡聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道咸露至心吟詠欽禮皆得度世道言元始天尊說經中所言並是碧落空歌天霞四飛神風濳唱擊搏生音內演諸天上帝內名隱韻之音亦是十方神王空歌內諱百靈之隱名也非世之常辭上聖已成眞人通玄究微能悉其章誦之十過空洞成歌神聲遠振萬帝稽首千眞竦聞海平兵偃天谷藏煙三辰駐輪權衡停運八威鼓氣羣魔喪眼綠骨增秀靈骸返生至學之士誦之十過則三元奉駕五帝同軿封山召雲攝御鬼營濟病度厄絶命更生所以爾者學士身洞眞極炁合青玄碧落之文刻記心骨可以召制三界政預天司敕戒地官速送魔醜壽無盡年還形度生輕誦此章七世傳殃頂護存禮道業興隆世世昌熾與善因緣萬試莫干靈人降房斯經高妙獨步玉京度人无量明碧落之音皇皇道宗妙莫與勝道言凡誦是經十過諸天齊到億曾萬祖幽魂苦爽皆卽受度上升東華青宮空歌召魂魂知其音還來附身魂鍊炁眞返生爲人能餐碧霞之玄芒濯神風以散襟而好學至經功滿德就皆得神仙飛升玉闕遊宴碧空也上學之士修誦是經皆卽受度飛升青宮世人受誦則延夀長生後皆得作尸解之道魂神暫滅耳聞空歌心不迷妄去如解衣神安炁定復爲聖民不經地獄用晦而明心與道俱普度天人莫不受慶无量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經碧落空歌青帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經以開碧霞始生之炁爲上世亡魂斷寒池長夜之役生其魂神度上青宮七月長齋誦詠是經降碧落之靈音澤金眞之剛炁使三田潔素身得神仙碧落成文記書仙名青玉玄簡削死上生十月長齋誦詠是經碧霞結篆空洞成文玄匠之音奉慶帝宸青簡執符東極授經君臣父子享德萬年四海太平世世不絶爲天下君安鎭十方劫劫長存八節之日誦詠是經八風洋音碧落垂文服燕青芽得爲上眞本命之日誦詠是經魂眞魄靈骨有玉英身得長生與道相宜不罹世患胎景光明三老錫命五帝攝京神司朝禮上天書名功滿德就飛升上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒二十四通上聞二十四天心拜二十四過閉目靜思身坐青黃白三色雲炁之中良久變爲碧霞內外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室內項生圓象光暎十方如此分明密呪曰无上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各二十四人關啟所言今日吉慶長齋清堂修行至經无量度人願所啟上徹徑御无上二十四天元始上帝至尊几前畢引炁二十四過東向誦經元始无量度人上品妙經元始洞玄靈寶本章碧落空歌九變度人神音隱韻離合自然混洞太无無无其无無爲浩空空與道俱空極而明明爲陽精陽精爲火火爲元始洞陽赤炁赤炁之中化生黃暈黃暈爲土是爲火子火土之炁九鍊而堅堅者金性金伏爲鉛鉛化爲水水成木居曰青黃白號玄元始三炁植根火力鍊之九萬餘歳其色凝碧碧光熠燿其晶霏霏乍騰乍躍乍伏乍飛或出或沒或步或馳陰火爲風陽光爲火風火合德碧晶混離若雲若霞如東如西神風鼓之碧霞析支支勢曲折或正或𣣱圓者如環銳者如珪屈伸匪常凡不可窺碧空落落光含四維霞張八極變化神竒天老上帝按筆以施模爲天章洞音深微雲霞之書三元八威六十四體象各有宜龍升其天鳳翥帝軒麟卧寶衢龜行澤邊三九五七星帶相連奎房畢觜鎭御十天碧霞縱橫布峙機延落猶絡也縻之無巓中空含虛風吟其間神音自然隱顯回騫洞歌玉文靈寶祕篇內明上眞超登之言一聞空歌腦宮發煙紫氣盈室六丁來前無歌不光無歌不明無歌不立無歌不成無歌不度無歌不生是爲大梵碧落空歌上清神音脫離死生天中之天鬱羅蕭臺玉山上京上極无上大羅玉清眇眇劫仭若亡若存皆有碧落自然空歌歌詠至眞洞解天靈天地萬神因歌得名碧空神音呼之卽聞是生神靈及諸上眞祕諱所重因歌得明碧落之中恍惚杳冥中有玉眞口吐氤氲碧霞梵炁周囘十方中有度人不死之神東極宮中青華之君中有空歌神音自然之神中有好生青皇九靈太妙生德之神碧空眞老天化丈人中有上清碧霞空極玉謡至眞洞文天一之君度生鍊神无量度人今日校錄諸天臨軒東方无極碧落空歌玉音神王長生大聖无量度人南方无極碧落空歌玉音神王長生大聖无量度人西方无極碧落空歌玉音神王長生大聖无量度人北方无極碧落空歌玉音神王長生大聖无量度人東北无極碧落空歌玉音神王長生大聖无量度人東南无極碧落空歌玉音神王長生大聖无量度人西南无極碧落空歌玉音神王長生大聖无量度人西北无極碧落空歌玉音神王長生大聖无量度人上方无極碧落空歌玉音神王長生大聖无量度人下方无極碧落空歌玉音神王長生大聖无量度人十方至眞碧落空歌玉音神王長生度世无量大神並乘碧霄綠輿紋輪驂駕青鳳蒼甲玄龍建碧霞之節十絶靈幢前嘯玉琯齊唱後吹瑶籥同鳴神禽玄鶴和音噰噰宛與空歌音流暢天卿秉策元帥扶轅億乘萬騎泛碧而來歌動海嶽聲越金石傾光囘駕監眞度生諸天丞相上清公卿霄極神宮碧空大聖雲營四司剛風九道監仙大神按籙御圖齊到帝前推校仙名嚴劾六天能知碧落洞章空歌至音神包太空炁停大淵過度世厄宿命應仙普告三界无極神鄉泉曲之府自非天維所關碧霞鬱壘九陽之界籍在三官列階九府十二河源上解祖考億劫種親積逮復連冥考冡訟罪錄所刋速落惡根不得拘留度魂命仙元始符命時刻升遷夜河積屍漏瀆寒泉隱停罪役檢制形魂度品青宮碧霞絡骨神音入玄召集百神九宮復完生身受度劫劫長存永不輪轉與道忘年永度傷柱景休開生驚死八關超登長生過度留難逍遙上清上清之天碧落之炁梵行東方六天碧落之炁起角宿一度一杪一虛漸次北行碧梵玄无天帝罙覺會英碧空臻際天帝辨極宛項碧羅元始天帝洞眞飛生碧合澄開天帝越常典興碧顏朱景天帝惠廓孚生碧宏虛曠天帝重盅途南方六天碧落之炁起箕宿十二度一匣之杪以次北行碧眞洞陽天帝九笳空玄碧瑶絳宮天帝龍混覺碧霞明素天帝紫景空崇碧无耀洞天帝茂極越宜碧運始圖天帝元延九眞碧浩正虛天帝都加遠稀西方六天碧落之炁起女宿三度十二杪之半以此北行近西碧神照智天帝常無覺碧沖紫耀天帝定極太元碧葢梵空天帝妙詢允延碧洞霞陽天帝眇莾自眞碧華開厯天帝無婁慶玄碧梵明遙天帝子虛太明北方六天碧落之炁起井宿十五度二十四分之半此眞碧落之維碧光寒華天帝龍耀化眞碧液注延天帝玄神太都碧丹化炁天帝泥樓偃京碧廓慈明天帝彥生元常碧落歌音天帝浮黎妙孚碧虛凝陽天帝妙恭太寗二十四天二十四帝碧落隱文碧落隱名碧落天中空洞自然空歌靈音諸天隱韻天中之音天中之尊天中之神天中玉文天中之靈九變六合變化上清碧落之奥深不可詳敷落至眞普度天人雲章霞書曲折成音金清土濁木浮火輕太一爲水渾然其音五炁就位五宮遂成碧霞絡空神風鼔吟流商抑徵含宮蘊羽空歌合奏萬天起舞今日大慶受度碧天厯告三元請斷五酉七世魔𡨚削落死根續命生元出離太陰乘駕青龍存揖玉女正坐明堂下遊九宮伏藏天牢隱淪八地出沒無方碧落至眞玉音神王聚煙攝炁遏絶鬼門東斗玉光西斗皓華北斗太妙南斗煇煜中斗
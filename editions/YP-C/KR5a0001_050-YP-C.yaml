front:
  text: 元始无量度人上品妙經元始洞玄靈寶本章蠲化水火災癘十迴度人百魔隱韻離合自然三天澄明霐寶不分元胞未開或浮或沉浮者爲陽沉者爲陰浮者炎上沉者潤下性成質具名曰水火有形无質若氣非氣爲至道祖爲太空精上水下火神濟其中上火下水氣營其門水火相交風爲之神變化天地生養乾坤金氣生明剛性發堅水潤成木木中成炎水火旣具眞土爲主土爲空母玉山上京黃房紫庭上聖九品帝極三眞是由水火和感而生鬱伏彊弱變爲災癘頑敗朽惡氣撓神驚火精爲日水精爲月月成歳功日制晷刻三界萬物乃遂利亨五行六氣水火爲先大氣鍊養九萬九千赤明開圖運度自然厯水過火眞得其眞上无復祖惟道爲身水火交胎普植神靈靈文結篆龍鳳飛雲无文不光无文不明无文不立无文不成无文不度无文不生是爲大梵天中之天鬱羅蕭臺太微太階上極无上大羅玉淸恍惚存亡水火眞君行天運度畢觜昴參行人厄會水火漂焚行地爲癘土䧟山傾氣有逆順劫有壞成上眞蠲化生道謐甯水火二氣周迴十方中有度人不死之神中有南極長生之君中有蠲化災癘之神中有度世司馬大神中有好生韓君丈人中有南上司命司錄延壽益算度厄尊神迴骸起死无量度人今日校錄諸天臨軒東方无極太玄神王長生大聖无量度人南方无極赤帝神王長生大聖无量度人西方无極九溟神王長生大聖无量度人北方无極洞海神王長生大聖无量度人東北无極火藏神王長生大聖无量度人東南无極絳府神王長生大聖无量度人西南无極水藏神王長生大聖无量度人西北无極黑穴神王長生大聖无量度人上方无極海空神王長生大聖无量度人下方无極元火神王長生大聖无量度人十方至眞飛天神王長生度世无量大神並乘三素流雲八瓊丹輦風輪霞帳虎葢虯軒驂駕朱鳳五色玄龍建七燿之節九色靈旛前嘯萬舞齊唱後吹千籥同鳴朱鳳蒼虯嘯歌噰噰玄獸神禽喙音宛宛五老啟途羣僊翼轅億乘萬騎浮空而來傾光回駕監眞度生水火二相南昌上宮韓司主錄監生大神執籙把籍齊到帝前蠲平水火災癘無干隨所應度嚴校諸天普告玄都玉京天闕十二宮分六甲之元水不濫溢火不焚然玄精守位絳章伏潛水火合氣不得流遷大小劫運九六之天消平災癘三界咸安无極神鄉泉曲之府北都羅酆三官九府十二河源水怪弭息洪波靜淵九靈奉書𡨚負明伸上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼羣元始符命時刻昇遷北都寒池部衞形魂制魔保舉度品南宮死魂受鍊僊化成人生身受度劫劫長存隨劫流轉與天齊年永度三塗五苦八難超淩三界逍遙上淸上淸之天天帝玉眞无色之境梵行

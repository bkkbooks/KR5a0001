body:
  text: 水火災癘卽大小陽九百六之變也惟種民天已上三災不及自紫微垣至九壘重陰皆災害所及之處雖聖賢眞宰不能變遷亦如日月之蝕也惟昇入无形方免水火之患此天亦三界之天與靈寶同法東方八天大濟榮稽天帝楚凡流阿邵眞梵光天帝求何宗都靈觀陽符天帝彭樓提眞淵鎭扶搖天帝伯嶽原殊太微正度天帝師聰恥明八景洞眞天帝曷甯晶魁會昌延化天帝司典公樞紫津燿神天帝辨俁稱南方八天雲瓊憫玄天帝定思顯權玉闕禁盈天帝獨俾滋嚴敷靈帝眞天帝輔華資臣冲裕慧孚天帝覺爽元祺九華變空天帝山麗玉相玄剛降生天帝察監領神晶明廣善天帝啟蒲昌光晃朗太元天帝烈智攜西方八天洞浮正樞天帝監鬱蒼五英和育天帝慮巴提文離明遘容天帝難洞申摽玉靈康濟天帝綠寶宗紫雲玄昇天帝才輔氐回玄緒慶猷天帝賜禺景方極眞號名天帝僊釐總皇初神顯祐天帝域圖檣北方八天玄洞祕神天帝居賓汪邱緒演眞天帝韓司秉觚元虛隱符天帝治極紫邙七變無極天帝震文啟玄高素昇聞天帝尹述希寂玄雲羽華天帝滔師越浪玄淸豁落天帝頤典宥方北華斗揺天帝龍几承倡三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻天中之音天中之尊天中之神天中大魔天中之靈九和十合變化上清玄化之奥深不可詳調運水火普告天人今日欣慶受度厯關諸天請滅漂焚流蕩燒爇劫運之災大小陽九大小百六之會旺否勃蝕貽毒三元飛度厄難名列太玄魔王監舉无拘天門東斗建杓西斗生氣北斗水神南斗火帝中斗大空爲劫之會靑帝化木白帝烹金赤帝孕火黑帝飛泉黃帝靈寶變化无邊靑天魔王母本太玄赤天魔王眞土成天白天魔王水德自然黑天魔王靑陽發煙黃天魔王剛粹冲淵五帝大魔萬神之宗飛行鼓從總領鬼兵麾幢鼓節遊觀太空自號赫弈諸天齊功水劫浩浩驚波萬重火劫炎熾惡煙渾蒙激流烘爓三界災凶元始正道養育和融蠲化陰陽毒惡莫從災癘却除時明國豐神公受命降世福祥日月合拱四斗明張玄瑞僊雲靈鳳飛翔水火作寶金玉凝堅六氣夷平四景回旋金不剋金木火降陰土爲水防木受土生五行旣協水火無偏致民夀慶心无忸𡨚魔鬼滅爽殺戮萬千三官北酆明檢鬼營不得容隱金馬驛呈普告无窮萬神咸聽三界五帝列言上淸鬱羅天關中環八門眇眇億劫祖氣未分上无復色下无復淵水火洞虛金剛乘天天上天下无幽无冥无形无影无極无窮赤明開圖日月麗天水火合濟運度自然元始安鎭水火爲丹內生玉字赤書五篇十方寶篆八威龍文保制劫運二氣長存梵氣彌羅萬範開張元綱流演三十二天輪轉水火周迴十方旋陰厯陽回度五常三十五分分氣三元八景冥合氣入玄玄玄中太皇上帝高眞泛景太霞嘯詠洞章金眞朗郁流響雲營玉音攝氣靈風聚煙紫虛鬱秀輔翼萬僊千和萬合自然成眞眞中有神長生大君玄帝水德丹元火君太一守氣司命留神桃康捧鑪合延命精執符把籙保命生根上遊上淸出入華房八冥之內細微之中下鎭人身泥丸絳宮中理五氣混合百神十轉回靈萬氣齊仙僊道貴生无量度人水火交分飛天法輪罪福禁戒宿命因緣普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有空洞謡歌之章魔王靈篇辭參高眞第一欲界蠲化大小劫運陽九百六水火災癘飛空之音玉京爲樞輪轉諸天龍樓鼓鳴九千餘周水開洪源炎飈九州陽勝陰伏木往金酬水火爲王激勃滂流燎山毀玉民物振憂水始上帝虎冠龍斿握策佩符呼攝酆幽啟靈寶篇黑帝布籌火神檢考萬靈速勾災害平甯无待无求第二色界魔王蠲化大小劫運陽九百六水火災癘之章元氣爲日陰母爲月日行月隨成歳分節天關運動水衝火蒸斗車其行三千有餘陽九百六爲世卷舒陰陽百六數之堂隅一十二度鼓鳴三周水火氣行日月傍流水勝河溢火熾焚舟至學无爲我神天游數極筭竭水火交結世號災癘物爲勦絕九復爲一混沌重生元始天王出沒變更兆度我界玉淸妙庭第三无色界魔王水火災癘不及玉淸神化歌曰雲營廓落浩蕩帝靑龍母九目萬里蟠形黑煙蓊鬱太音雷霆屈繞玉山八十萬層俯觀日月熒熒火星下臨九天玉闕金城我界自然无有火兵九靈眞母諸惡不經道空大妙无上僊眞昇入無形不染六塵與神氣合湛然長存天谷綿綿智覺不分知本无爲浩劫爲尊此三界之上飛空之中魔王歌音音參洞章誦之百遍名度南宮誦之千遍魔王保迎萬遍道備飛昇太空過度三界位登仙公有聞靈音魔王敬形勑制地祇侍衞送迎拔出地戸五苦八難七祖昇遷永離鬼官魂度朱陵受鍊更生是謂无量普度无窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈魔王隱祕之音皆是大梵之言非世上常辭言无韻麗曲无華宛故謂玄奧難可尋詳上天所寶祕於玄都紫微上宮依玄科四萬劫一傳以其調制水火保固劫運使天關之度數軌无終與天長存禁重之限不容宣泄若有至人齎金寶質心依舊格告盟十天然後而付焉道言夫天地運終則水火激戾洪流滔天金石焦朽於民爲疫癘寒熱之疾水起土壞風騰火炎於民命終亦猶劫焚水蕩數會運終之時也末學之夫亦有疾傷凡有此災皆當建立壇墠敷五方眞文三時行道制御水火蠲化災癘祈告上靈災害平息同氣皆當齊心修齋六時行香十遍轉經福德立降消諸不祥无量之文普度无窮道言夫末學道淺或仙品未充或四大燔灼眩惑躁競或則羸薾瘦枯寒窘跛痺此皆水火凌戰勝所不勝運應滅度身經太陰臨過之時同學至人爲其行香誦經十過以度屍形如法魂神徑上南宮隨其學功計日而得更生輪轉不滅便得神仙道言夫天地運終星宿錯度日月失昏四時失度陰陽不調國境有災兵革四興疫毒流行兆民死傷師友命過皆水火爲之災癘水火爲太微紫微兩極都曹主司人命總括禍福當依法建壇醮南北二斗水火尊帝奏詞懇願心香上達神眞自降亦當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受賴其福難勝故曰无量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衞右别至人剋得爲聖君金闕之臣諸天記人功過毫分无失天中魔王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語无量音道君撰元始靈書中篇東方八天蘋璣无玗珍華肆極辨祖幽池魔靈滋直𠃔被盧康景麗縛弈乾司燿帝禁離蒙辟猛牛涂巔侯闘魯僊障祅殿容典蓄魁哿梵流牡綦智泉隱嶽旅師戰瓏秀宛僅涂南方八天炎爍純瑶澄彭覩韶昭濟雲虛緣功鄙刀逸液興心巖温密潯毳巒芝茂瓊溜𥥆岑復察混洞露微悅愔化蹟罔圖生妙眞森和感混化乳珊朶丹茹道含祥中奇莫忱西方八天鑄交火水遘華噏邃嬉胞一醎氣淵賁蘂抱空意圖𤪽光素齒稽覆匪垠韞息優視神壘萬合天津寥致龍涓金瀝田根浹被光回燁驛太玄雌宮偶雄誕珠固肇奚窮北方八天晦默退樊稀賓徐安鼓釜爕種忽芒烏完蹈持夷廓明塊九還靜坦隳識霞都矚觀茅渙菁麗馥蘭帝韓冲龎符規劫眇黃壇徊度汗諧度寶期聯斗閣錄文巨籍紫元道言此諸天中大梵隱語无量之音舊文刻碧玉玄臺紫微太微二極之館以正水火之運蠲化三界劫數運度災癘奇變之殃使日月含華陰陽冲泰以成萬物之自然无爲而冥化字皆廣長一丈金霞煥曜蔚翠映圖天眞皇人昔書其文以爲正音

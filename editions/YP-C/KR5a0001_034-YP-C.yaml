front:
  text: 元始無量度人上品妙經元始洞玄靈寶本章騰燿二景五星上品妙首十迴度人七晨隱韻造化自然高上元精天皇至眞元始結化煥落天經陰陽推別分布五行自其本元凝積神精列象穹玄日月輪燿五星交躔各有宮府明皇道君玉妃夫人司領治化禍福生成騰燿經緯晝夜無停綱維次舍宿度之間隨其氣數以立權衡品物受命庶位眾靈凡隸臨照莫不稟承衰旺隱顯進退虧盈辯其主張亦有其方上攝中極紫微天皇高上玉眞曲素雲房金闕靈都森羅會宗太妙之極無所不周中有宰御天地之神中有大帝金母扶桑閬風二䦝之官中有乾元萬炁之君中有五靈眞老元都丈人中有南上司命司錄延壽益算度厄尊神回骸起死無量度人今日校錄諸天臨軒東方無極飛光騰燿神王長生大聖無量度人南方無極飛光騰燿神王長生大聖無量度人西方無極飛光騰燿神王長生大聖無量度人北方無極飛光騰燿神王長生大聖無量度人東北無極飛光騰燿神王長生大聖無量度人東南無極飛光騰燿神王長生大聖無量度人西南無極飛光騰燿神王長生大聖無量度人西北無極飛光騰燿神王長生大聖無量度人上方無極飛光騰燿神王長生大聖無量度人下方無極飛光騰燿神王長生大聖無量度人十方至眞飛光騰燿神王長生度世無量大神並乘華龍彩鳳金根陽燧之車五色瓊瑤之輦迴光紫蓋景燿靈旛前嘯空歌齊詠後吹靈響同鳴獅子白鶴嘯歌噰噰靈童散花玉女擁軒億乘萬騎浮空而來傾光迴駕監眞度生諸天丞相南昌上宮韓司主錄監生大神執綱乘紀齊到帝前隨所應度嚴校諸天二景五星眞光激旋採咽奔引注功太玄上爲高眞福施無邊普告三界無極神鄉泉曲之府北都羅酆三官九府十二河源上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼羣元始符命時刻升遷北都寒池部衞形魂制魔保舉度品南宮死魂受鍊仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度三塗五苦八難超凌三界逍遙上淸上淸之天天帝洞明無色之境梵行

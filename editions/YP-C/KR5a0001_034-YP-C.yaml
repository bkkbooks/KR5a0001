body:
  text: 東方八天極華燿眞天帝咸伸戈玉明純意天帝述正微無量燿景天帝邈自頻機朱經離雲天帝穹修度迴眞英鎖龍天帝召都康師燕常凌虛天帝翹里治因九芒淵靈天帝覺由洞閑仙臺乘光天帝冲遙客孚南方八天紫玄凝光暉逸天帝敏江約樊變霞隱金明幾天帝辯祺廣仙蓋空梵氣天帝紉德盧蓁陽神扶靈天帝古谷允嘉丹炎洞陽天帝太隆阿生竒都益元天帝波遲騰崇景空回雲天帝荷明思觀寶魂隱章天帝道陣勤和西方八天晨浩冥元天帝澤宣濟元淸瑤進希天帝運英摽華金羽芝帶天帝弼維員承煥極太眞天帝鼎跡瑤光綠光度玄天帝尚吠伯誨初皇含暉天帝長定宜文道諱對精天帝顓越慈信一混露液天帝博還陽恭北方八天螭房利神天帝攝萬精寥幽宗光天帝玄祖蘄清龍陁梵道天帝沖融定方元一生靈濟化天帝基昌化時垂熒灌炁易本天帝益趙進涓墉微建霞可智天帝浩搖微光熾文成流天帝沙逾變周法有足思天帝紂杳鳴潛三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章七晶隱韻御景之音天地之尊靈寶之神飛晨三素鬱儀結璘九色十華變化上淸無量之奧深不可詳招神飮光普度天人今日欣慶受度厯關諸天日魂月魄五星道君請注暉芒流霞絳津灌兆百骸凝固泥丸高奔帝宮入燕瓊臺乘駕寶車上造日門月妃贈珠蘂池浴身木星鎭肝金星保肺辰星固腎熒惑定心中央土皇厥號鎭星榮養脾元總衞一形靑霞護魂白霞侍魄赤霞養炁黑霞通血黃霞主命萬神無越五色流霞煥爛華鮮自天來下入兆九宮三田盤回八景蔚融靑華帝君天雉落澤赤華帝君皓雲充極白華帝君阿婁款幽黑華帝君碧瀾眞侯黃華帝君寶鬲承休五華帝君日月之神隨兆吸引降光運精神光照目玄珠意輪七辰帝尊萬神之宗飛行鼓從總領合明九億萬兵麾幢鼓節遊眄天津散靈育生共成玄功上天度人此道爲宗日月之使二景皇君五星上王迴霞綠英威南受命普掃不祥先斬陰孽下布威光金晶吐毒玉馬魁張天丁前驅大帥仗旛擲火萬里流鈴八衝敢有干試拒遏上眞金鉞前戮巨戈後刑屠割鬼爽風火無停千千截首萬萬翦形魔無干犯鬼無祅精三官北酆明檢鬼營不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列言上淸二景元精五星威神與道同德天地俱生騰燿未判混沌之中上無復色下無復淵神風淪激火液凝光日月合璧五星連珠共處玄胎以養天軀天上天下無幽無冥無形無影無極無窮赤明開圖運度自然元始安鎭七燿列玄二景飛騰五星運天水火分任萬物所尊兆引其精克爲眞人白華凝液神氣同符傳降天樓二十四關木榮土化金烹火鎔氣矢交射走虎蟠龍赤紋成脉布絡三元玉眞明堂敷落五篇赤書玉字八威龍文保制命會使身長存梵炁彌羅萬範開張元綱流演三十二天輪轉無色周回十方旋斗厯箕回度五常三十五分總氣上元八景冥合氣入玄玄玄中太皇上帝高眞汎景太霞嘯詠洞章冠帶日月衣服星辰垂芒騰燿朗徹高淸金眞明郁流燿雲營玉音攝炁靈風聚烟紫虛鬱秀輔翼萬仙二景五星通光入身千和萬合自然成眞眞中有神長生大君無英公子白元尊神太一司命桃康合延執符把籙保命生根上遊上淸出入華房八冥之內細微之中下鎭人身泥丸絳宮中理五氣混合百神十轉迴靈萬炁齊仙仙道貴生無量度人上開八門飛天法輪日月運行寒暑經緯五星主令導和生身身得受生上聞諸天諸天之上各有生門中有空洞謠歌之章眞王靈篇辭參高眞第一騰曜飛空之音水火相函氣號混芒柔於裹囊圓包不開浮沉太空天地神胎眞炁如煙左周右旋至精爲星日玄月靑熠燿生華煥顯難名天老剖象玉麗神嬰日月自飛五星內明冥冥交養騰燿而升景騰星燿色象齊幷萬物啟圖赤書玉文動植滋繁皆有天經中虛以節外華以紋虛則達氣紋以運精神爲生主動植炁均萬化淘澤騰燿是因太空杳杳玄漠深淪日月旣照屈者能伸眞王飛空交映寶輪洞鑒十方垂光度人行斯祕道神霄上賓第二二景飛霞之章玉海無際碧煙徘徊扶桑萬里靑闕崔嵬中有寶臺內隱樞機左日右月前罡後魁玉女持鑰神官啟扉晝日夜月翕受敷施舉標斡輪萬象分馳日月二門激電飛雷騰騰寶光命駕九龍絳霞紫雲映天瞳曨朱芒張絃金繩下連兆執二章引景八圓日童玄炎月妃華㛹吐光揚暉散注流分保兆生命變化神仙雙景並燿深入含蓮紫金爲容受書帝軒第三五星鍊眞歌曰東方九氣歳星九門玉樓萬重寶駕飛輪中有帝皇靑衣絳裙南方三炁熒星三門瓊臺八觚辟飛流煙中有帝皇錦衣寶冠西方七炁岡星七門靄靄金闕玉光散分中有帝皇素衣虎裙北方五炁辰星五門龍宮高浮紫雲擁軒中有帝皇玄衣飛裙中央十炁鎭星十門黃池帝臺五斗攝精中有帝皇黃衣錦裙彼五帝皇總御萬靈泛泛天光來入兆身鍊眞易骨刻兆仙名乘飛龍兮遊九宮宴妙庭兮舞千童交虎旗兮傾羽蓋震鍾鼓兮動天籟五皇歡樂兮福祐帝宮永陽春兮億壽無窮引靈光兮神炁熏融登上淸兮超淩碧空此三界之上飛空之中眞王歌音音參洞章誦之百遍名度南宮誦之千遍眞仙下迎萬遍道備飛升太空過度三界位登仙公有聞靈音眞王降形敕制地祇侍衞送迎拔出地戶五苦八難七祖升遷永離幽官魂度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及神霄眞王挹暉奔景騰燿日月五星上道隱祕之音皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寶祕於神霄玉淸玉府東華經室數當壬辰應運下傳若有至人齎金寶質心依舊格告盟眞王然後而付焉道言夫天地運度亦有否終日月五星亦有虧盈至聖神人亦有休否末學之夫亦有疾傷凡有此災同炁皆當齊心修齋六時行香十遍轉經福德立降消諸不祥無量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太陰臨過之時同學至人爲其行香誦經十過以度尸形如法二景五星之精鍊化屍穢魂神徑上南宮隨其學功計日而得更生轉輪不惑便得神仙道言夫天地運終星宿錯度日月失昏四時失度陰陽不調郡邑災蝗水旱流移疫毒流行兆民死傷師友命過皆二景五星之致也亦當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衞右別至人克得爲聖君金闕之臣諸天記人功過毫分無失天中眞王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君譔元始靈書七辰寶篇東方八天騫樓岸符宛蕭瑤琚玟還阿奢奔澤西杅落棧謨羣攴斗益敷渺化尤砭厯論伊尋光訛定拘定思雲魂神洞郁郁億亶胡汾赤咤慶廬戚驛資存佑路善特匪燿維騰南方八天素登邱霞月液芬葩九帝畜武迎田湊營畔府碧顏鳥鑑留南質承子敔燕程被幾靖暮輕槎愿廢猛寂乾竇殊堅波緘罔直瓊酴億歡奔升管堤爓陳宣嶷游丹沖昵西方八天晨鸞著啼翹趙忘雷乙戰兌醜祝照漂隨黨薄豫童鳩沙華谿勢式莊驅玉崑輔宣丙鉛雌神合規扶鄰正戟迴枚暴酉那兌俵道韓曲大庚樅竹臼積天屢萬闌敏目北方八天疆默窘闌夷增巨修岑永部承擊幾前謨飛魔周玄術如紀光洚欽野盧抱圖逸嵩稽庸等化飲謹周夷智洪觀區投幽運機慧仝昭徹晨鋒敕彌尺坎潯奏虎震威峙道言此諸天中大梵隱語招降二景五星神精霞液上道高眞命仙無量之音舊文元始開圖生於二景五星之中騰燿光華感化萬物字皆廣長一丈天眞皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣神霄上吏下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳靈司保舉洞玄道備克得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致日月流精身神上奔五星垂華鍊炁成仙太上之道經隱妙玄上帝遙唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響金石同鳴仙梵合律十方肅淸河海靜默七辰吐光天魔飛翥山嶽吞煙萬靈振伏招集羣仙天無氛穢地無祅塵冥慧洞淸大量玄玄也元始无量度人上品妙經卷之三十五九宮仙籍品道言昔於太碧天中紫霞玄歌太空眞土受元始度人九宮仙籍無量上品元始天尊當說是經周回十過以召十方始當詣座天眞大神上聖高尊妙行眞人三元仙籍九宮大神無鞅數眾乘空而來流雲景霄琅輿鳳車羽葆神旛翠輦珠蓋金碧交光九色鬱明洞煥太空三日三夜諸天日月宮府星宿躔次化綱變紀大經彌綸停機息運寥廓沈冥地踴寶花天敷赤文韶響合奏靈韻生音煇燿上境洞開八門一國地土山川林木緬平一等無復高下土皆作紫瑤通明瑩徹照映圓羅光焰流晶無有異色眾眞侍座元始天尊玄坐空浮神化飛龍羽座之上說經一遍諸天大聖同時稱善是時一國男女心開悟解密契妙微說經二遍百神聚會降體玉英說經三遍生氣交纏合變正道說經四遍圓虛應化五府灌煙說經五遍內運修輪上符天範說經六遍浩劫結滯廓爾消融說經七遍神洞虛明徹見十方說經八遍九宮注籍身飛列仙說經九遍恩沾萬有福及八冥說經十遍寒夜眾生逍遙離苦是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍上元無極無量品玄都紫微宮正氣大神無鞅之眾浮空而至說經二遍上元無極無量品元黃太極宮合景大神無鞅之眾浮空而至說經三遍上元無極無量品洞白太淸宮燿煇大神無鞅之眾浮空而至說經四遍中元無極無量品洞虛淸靈宮運功大神無鞅之眾浮空而至說經五遍中元無極無量品南極洞陽宮仙籍大神無鞅之眾浮空而至說經六遍中元無極無量品羅淵導山宮元陰大神無鞅之眾浮空而至說經七遍下元無極無量品靑華方諸宮安保大神無鞅之眾浮空而至說經八遍下元無極無量品南水景翛宮元道大神無鞅之眾浮空而至說經九遍下元無極無量品陰天混化宮玄皇大神無鞅之眾浮空而至說經十遍仙府無極無量品考校功過玄籍靈官大神無鞅之眾浮空而至十遍周竟三元九宮二十七府百二十曹主領生化善惡飛天大神一時同至一國男女傾心歸仰元始天尊卽以五明寶扇指東南維天光煥赫照燿太空天人隨扇所指仰視神化見一寶山高聳玉虛廣大難量上有瓊臺玉觀華闕神功羅列天眞敬禮元始飛空步虛謠歌讚歎天尊乃召淸微高上治化玉虛萬寶一品天官黃闕大鎭敷化方輿元會二品地官大溟流運廣化九淵玄德三品水官立於座右三十二天帝君立於座左九天高聖自然眞王立於座前日月五斗經緯列宿元綱大神立於座後曜晶玉極持握彌綸二十五大魔王十方無極飛天大神按部九天儀衞三界神兵瓊花散空天樂互奏導從羽駕飛入東南天中天人仰看惟見億乘萬騎鳳輦龍車炳若繁星難可悉視須臾黃雲四合不復瞻見元始卽於東南玉闕之內說經都竟眾眞監度以授於我當此之時欣樂難言法事旣周萬眞復位俄頃之間寂爾無聞是時天民悟此大範普獲濟惠皆得長年永斷沉淪合境歸嚮咸識生根神眞開化標名九宮沖和變氣收伏祅凶物無瘥疹萬𢑥昭融邪關闔塞正道開通永輔上極威令敷𢎞世土升平國康民豐經始流布一國演教各運至心宗奉禮敬悉皆度世道言元始天尊說經中所言並是九天自然眞王內名隱韻之音亦是三元宮府內諱百靈之隱名也非世之常辭上淸開化眞人通眞悟玄悉契其章誦之十過天官遙唱眞公設禮太淵鎭靜神嶽收雲元皇錫教九宮書名大魔伏形羣祅滅景回靈化體朽骨成人妙學上士誦之十過則九官擁衞神帥稽顙鬼精逃遁不敢干犯濟拔品彙淪而復升也神州之民初學至道若能依科誦之十過則萬惡消摧千瑞來臨聲參太微道貫紫霄三元執筆注上九宮果備功圓升爲地眞也輕誦玉文永劫湮沉崇奉尊禮所願克成世世下教開度含生萬魔不干天眞護門斯經隱奧高祕玉淸度人無極爲靈寶之宗巍巍尊妙難可稱量道言凡誦是經十過九宮列曹眞吏持生化之簿書下臨監觀削滅羅酆黑籍注名靑編祖先幽魂皆得上升流火之庭鍊質召靈爲天種民而妙契有無修行至學大魔保奏升度朱陵飛行八極遊宴上淸降神天闕爲世賢人恢張至道輔弼明君世人受誦則百痾普消靈府虛明玉華內鍊金光外凝暫寄厚土太陰變形數極純陽隨運更生此經玄奧普濟無邊一切有生莫不蒙惠無量之福生化受賴上天所禁不傳下凡至士齎寶玉格心盟約而傳輕慢洞章殃及七玄長役冥塗侍經九宮玉童玉女各二十四人擁護靈文守衞受經者身道言正月長齋誦詠是經紫微上宮注籍金科妙行眞人乘少陽景霄之光下開幽關拔度上世亡魂升入天堂七月長齋誦詠是經洞虛元宮書功瓊簡龍燿神王奏明九天降以生氣身得神仙十月長齋誦詠是經方諸洞宮列章上聞持綱執紐玄天大魔淸蕩姦祅收伏百精消滅三災保世升平八節之日誦詠是經得爲地眞遊宴八冥本命之日誦詠是經五府灌鍊雙景交纏九元上會混合綿綿制魂拘魄升騰絳煙采集華芒流運靈泉功滿道備神飛列仙道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐九色雲氣之中內外蓊冥有靑龍白虎朱雀玄武獅子白鶴羅列左右三元九宮仙籍大神森然對目日月照明洞煥室內項生圓象光映十方如此分明宻咒曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啟所言今日吉慶長齋淸堂修行至經無量度人願所啟上徹徑御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經

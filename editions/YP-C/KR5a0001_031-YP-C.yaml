研莬棊純精杳紛韜祕幽諱交渾冶崙氣徹內返神嬰自存職熾嶼崵偶銜丕容吟宂潛納寶粹温通屈流地海頂遘繪同玉霐延和仙鍊輔沖南方八天玻回霞液凝降崿樓玄黃滋化曲窊漕濛奎室虛光三宸皎昌靑白英元黃眞火堂冏照東華飮瀹粲張扶思舉龍軨車控翔熒庚揇壇玄井護昆網射激明靈魔渾然西方八天庭雲鬱披鋌瓊感機左池汩鳴結英懽尸灌引天淵復運太微眇私山玄恍命薰怡陰斗弼軀異爽挾和赤章綠典道廓應施合就匪緒忽辨意衡象肧先元化華甦宣北方八天獄酆都首影酪魂醜馥味音姦籍官統祅龍委瀆谷米聿輪腠此㖟宏出洞眞和玖隲功衞子壽頤煒觀呼徵大殺韓司詔候移超隱峯默彰離遘無號幙研碧空浮遷道言此諸天中大梵隱語無量之音舊文九炁丈人染赤彪之獸流丹之液題書長生大帝君南明之殿靑環之璧空中出字皆廣長一丈金氣鏤縷采明以紫寔丹入玄玄又入丹丹玄起煙鬱勃上元題寫佩服誦習相傳最上妙訣愼勿妄宣天眞皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳魔王保舉上仙道備尅得遊行三界昇入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致飛天下觀上帝遙唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳瑯振響十方肅清河海靜默山嶽吞煙萬靈振伏招集羣仙天無氛穢地無祅塵冥慧洞淸大量玄玄也元始無量度人上品妙經卷之三十二五行順治品道言昔於玉虛大明天中九華寶光神瑞慶土受元始度人五行順治妙品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖高尊妙行眞人上清五星眞君無鞅數眾乘空而來五色重光景雲四繞紅瓊之軿紫琳之輅金輪轉轂日駕浮空羽箑連霞金眞警衛流虹交映玉馬騰煙照徹碧虛三日三夜七宸啓靈五斗順位璣衡停運山嶽玄鎭天道開明華林薈彩長樓列觀接引凌風金闕瑤京無復高下地敷寶砌色吐瓊綿眾眞侍座元始天尊玄坐五雲浮黎冰玉金暎萬寶之座與中天紫垣蒼華生德萬壽道君丹華陽德萬福道君皓華正德萬善道君玄華一德萬生道君大華聖德萬順道君五方眞元道君元始開圖之後五氣乃分道祖攸同氣母禀異將宣五行順治生化三界慈育萬𢑥之道說經一遍諸天大聖同時稱善是時一國男女宣行順教無有尅傷說經二遍四氣和平時不失度說經三遍沖用太和景物長春說經四遍騰氣均行人無衰薾說經五遍陰陽調運疾病不生說經六遍羣生遂性萬宇咸寗說經七遍五星合明珠躔周軌說經八遍甘露浮空靈芝鬱秀說經九遍天光下濟泉曲開明說經十遍國被道化率土歸賓是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品蒼華九氣至眞大聖無鞅之眾浮空而至說經二遍南方無極無量品丹華三氣至眞大聖無鞅之眾浮空而至說經三遍西方無極無量品皓華七氣至眞大聖無鞅之眾浮空而至說經四遍北方無極無量品玄華五氣至眞大聖無鞅之眾浮空而至說經五遍東北無極無量品素華梵炁至眞大聖無鞅之眾浮空而至說經六遍東南無極無量品碧華梵炁至眞大聖無鞅之眾浮空而至說經七遍西南無極無量品大華梵炁至眞大聖無鞅之眾浮空而至說經八遍西北無極無量品寶華梵炁至眞大聖無鞅之眾浮空而至說經九遍上方無極無量品紫華一炁至眞大聖無鞅之眾浮空而至說經十遍下方無極無量品黃華一十二氣至眞大聖無鞅之眾浮空而至十遍周竟十方無極至眞大聖一時同至一國男女傾心歸仰來者侍側圍繞咸欲欣聞元始天尊召集五元道君敷演五行順治長生之法物無夭傷永絕刑禍普天稱慶劫劫隆平於是元始變身示現天座高遠大如蕭臺翠光層劫以億爲仞元始聖體巍巍瑩如寶山十方華林同蔭若蓋金色洞燿徧照無極元始登引天眞大神上聖高尊妙行眞人五元道君十方無極至眞大聖無鞅數眾俱升玄座天人仰看一一天眞住一天界瓊欄藻井金闕琅軒無不備足說法之聲億眾如一心心相通法音無間同時說法無有違逆比之流泉傾瀉妙意一切眾生各各了知金木水火土五行之氣自相順治本無刑尅雖有勝復鬱拂之變斟酌天倪以生和氣五行混同升降合德五氣調平三界泰定及於人物一切生身三元搆精五行結秀順治不逆沖德滋神虛含道眞凝如珠玉大若彈丸光華鮮灼太空有象是時天人一切眾生以順治故斷絕死道諸惡不生大業宿𡨚一時頓息地獄眾苦猛火洋銅變成靑蓮九幽北都爲安樂國以五行順治則萬物化生三界靈仙一切種民悉無罪越諸天遙唱萬神設禮一國之境如懸冰玉及似寶珠表裏明徹略無浮翳以及纖塵元始卽於玄座所現之境說經都竟眾眞監度以授於我當此之時喜慶難言諸天復位倏欻之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸行順心順道順德順善順法順眞順明順生順神順化言無悖異口無惡聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名玄道順福五行不尅全物之隱音亦是五元道君內諱混交五氣之隱名也非世之常辭上聖已成眞人通玄究微能悉其章誦之十過諸天順度萬物生榮天潢隨流氣無鬱藹山安海鎭六天運明三辰駐照九道齊幷羣魔鬼精歸道成人白骨屍骼順治更生至學之士誦之十過則五行聚精三田結嬰人無中傷壽與天登所以爾者學士誦詠是經召命五星順應和樂六腑安寗穢氣消亡心感洞眞以制十方法施天靈天人皈依災害不生可伏御地祇束縛魔靈卻死留形輕誦此章身則被殃供養尊禮門戶興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人無量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到五星眞君五方大神悉降其所三辰在人身命或凌犯勃蝕伏逆爲災使世生民運爲不遂理務乖違宜齋戒誦經五星合度五行順治災害消弭億曾萬祖幽魂苦爽皆卽受度上升朱宮格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛升金闕遊宴玉京也上學之士修誦是經五星旋行回而不轉三宮塡滿自然得眞皆卽受度飛升南宮世人受誦則天輪順次一十二宮不相違錯運過限臨氣超候接周徧宛協身無殃咎眞氣內結邪癘不干延壽長年後皆得作尸解之道魂神暫滅不經地獄卽得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經五行順治春氣遂生萬物秀成胎卵化溼就形無隕自然通神上世亡魂斷地逮役度上南宮七月長齋誦詠是經五行順治秋氣遂成萬類堅革就養燕寗金眞入骨身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經五行順治冬氣剛凝萬物歸根陽氣潛形太一復位帝主道興五星聚中聖德日新四海澄波六氣和平臣民康樂億載太平壽等天地日月無傾兵消疫散時淸德盈爲國王帝主君臣父子安鎭國祚保天長存世世不絕常爲人君安鎭其方民稱太平八節之日誦詠是經五行順治十方齊營眞氣周流時化自然所作皆成內功克備得爲九宮眞人本命之日誦詠是經五行順治災害不經三刑六害劫耗傷驚星光暎身仙道自生魂神澄正萬氣長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛升上淸道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐靑黃白三色雲氣之中內外蓊冥五星在頭光氣纏繞靑龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室內項生圓象光映十方如此分明密祝曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啟所言今日吉慶長齋淸堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經

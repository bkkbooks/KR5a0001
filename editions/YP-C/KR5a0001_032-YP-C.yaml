body:
  text: 東方八天運智正除天帝玉覺覩月洞霞寂夷天帝醜鑒元期彰直元通天帝馘妄理眞照效淸池天帝苦勤寥昌景仁政天帝吉義安蹈登煥夷天帝長肱正基崇譽炎常天帝整眞微晞玉眞高聖天帝道極元凝南方八天𧰟靜淵映天帝胡尤琛神鄉總樞天帝勾龍師存述理精玄天帝石嶽正璘火度化周天帝選妙資忱魔治宛靈天帝兆勤洞豪逸婁冲璩天帝彊鹿皓蘇赤奪摽秀天帝祈東偃名太極順皇天帝蕪軒董玄西方八天仇圖蔚育天帝爍陀郗明覩燿眞妙天帝祚莊堂梵度明瑤天帝宗燿頓康抱正斗機天帝斬伐魔凶辨伏安道天帝嗣康監生素明洞虛天帝惠施部慈華都燿明天帝雞樞婁侖要玄大皓天帝皛絕神環北方八天神府公符天帝宿陰城梵章紫皇天帝越平延龍猷轄洞天帝火旦爓焮僊平淸修天帝玉素眞華混合妙眞天帝抱光紫煇玄璘統儀天帝時承道生冥度𢎞嘉天帝杳曲玄嶼澄漢洞浮天帝中極幽微三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章順治五星不有遲留伏藏悖逆道氣左回逆犯者追使氣循軌由正相生交養萬𢑥與帝同榮無敢夭傷秀實華精一萬九千四百二十一種穀果蔬畜五行順生食者長年不作疾癘自致神仙此文隱諱知者不言悟眞識玄玉書明宣諸天隱韻無有尅勝戰爭違忤干凌五星之分協和致福帝主萬年正氣殄滅祅怪凶害永捐順治之音順治之尊順治之神順治之魔順治之靈二景六合順躔上淸紫微布氣招搖列星太和沖盈金木同形水火爲一土德共并殺害怒鬭以順得平無量之奧深不可詳敷落神眞普度天人今日欣慶受度厯關諸天請滅遲伏留逆勃蝕之氣斬絕祅根順度五常眞流太玄五帝轉樞經緯天門東斗延生西斗合氣北斗養胎南斗行勢中斗受形三界福凝靑帝樂金白帝同木赤帝運水黑帝助火黃帝舍虛五行協佐敢有惡逆不順道者戮以風火靑天眞王治木之鬼赤天眞王斬火之賊白天眞王斷金之邪黑天眞王滅水之怪黃天眞王伏土之殃五帝眞王萬神之宗飛行鼓從總領神兵麾幢鼓節遊觀太空自號赫奕諸天齊功上天度人嚴攝祅凶木氣逆土土制水窮水藏火精火鍊金鎔金還尅土相迭爲凶五帝握符五星御龍循繞靈綱使氣和同五行順治不有尅傷天人協道萬物煇昌自然長生時化明雍天地正輪六精允隆萬氣無愆聖運無窮萬神咸聽三界五帝列言上清龍漢延康眞道惟常恍惚無形初不隱彰元晶廓如混氣華芒赤黑濳孕五氣乃光方域定位東西擊攘形勢相乘或柔或剛金木爭戰龍虎騰驤陰制於陽陽薄於陰凌奪無期氣與神傷元始行道五星尊王善爲陽順惡爲凶戕正眞御樞中極命神順以治化化開玉京晃燦玄臺碧落維天天上天下無幽無冥無形無影無極無窮赤明開圖運度順行元始安鎭瓊篆玉文流雲翥鳳元氣道根保制劫運使天長存梵炁彌羅萬範開張元綱流演三十二天輪轉無色周回十方旋斗厯箕回度五常三十五分總氣上元是謂順行不犯神綱綱以制氣進退所將好生協從輪無蹶張順道偶和和密而淵八景冥合氣入玄玄玄中太皇上帝高眞泛景璇圖敷落洞章赤書五篇制斷不祥經緯得緒三界福堂帝德體循紫庭聯芳雲宅玉靜日闕金璫皇皇寶華空洞自然千和萬合五政成眞眞中有神長生大君無英木帝白元金神太一治土司命火尊桃康合延水祖大溟執符把籙保命生根上遊上淸出入華房八景之內細微之中下鎭人身泥丸絳宮中理五氣混合百神十轉回靈萬氣齊仙仙道貴生無量度人上通玄門飛天法輪順治命延罪福禁戒宿命因緣普受開度飛魂生身身得受生上聞諸天諸天之上各有生門中有空洞謠歌之章五眞靈篇辭參高眞第一五星眞君紫微定位飛空之音太空無邊道體自然冥漠匪迹混洞之先恍惚中物至精不遷升陰降陽元氣綿綿氣從何生太虛發煙晶明在胎神氣淵泉三五旣名七九相連氣分方畔水火變生彊弱剛柔道功無全根角有來落落在天生化由之悟則神仙五行共濟五賊爲緣水火金木中土天關尅制則鬱氣變成姦不動則平化力無傳歌此靈音泛駕翩翩第二五星眞君順治五氣招玄之章金光在東炎炎寶龍西靈授符南山起雷黃旗翻翻環拱太微履道無爽眞氣所歸錦輿琅軒金馬玉鞭吾何狩之周流八騫事君事父順忠孝先道妙在茲祕不可傳上輔帝臺出爲德宣吾道正明光揚九天生植和澤造化匪艱布于天道灌氣巡環庶品孳育各用其元光亘上下萬氣同仙內福三界外洞八玄天順明淸地順咸寗人順胎丹重閬胞扃出生無死徹視通靈神變入空驂駕九龍慶燿流彩五老命封玉策絳章左嘯華童右扶太眞流金火風順行祕道萬帝唱恭五行返一非有無中第三五星眞君順治運度大霞歌曰天市層垣列燿猶肆我執玉書赤文大字刻寶光門瓊館北軒星國萬里仙民軿繁中有帝皇絳闕紫烟雲盈我居光浮我廬陰陽二景瑤琳珮珠亹亹其行五色自生遲伏留逆順德無爭以順事帝動如符契以順事天得道自然以順生化神功綿綿氣合太無結錄寶圖五篇玉文迴旋帝車帝車在東仁化普從大標經西攙槍協齊順道爲治神造希夷我位上王炯炯其方善惡不遺德之所臧順爲聖德萬方作則不順天運變爲五賊道幾無形杳杳元精生化無窮螭迹彫瓊雲萌紫素咽服玉精目視三素倏忽變通神母玄父日月曈曨此三界之上飛空之中五星眞君順治五行至妙之音音參洞章誦之百遍名度南宮誦之千遍五帝保迎萬遍道備飛升太空過度三界位登仙翁有聞靈音萬神敬形敕制地祇侍衞送迎拔出地戸五苦八難七祖升遷永離鬼官魂度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及五方眞元道君至靈隱祕之音皆是大梵之言非世上常辭回度順綱使流演得宜遠諸災殃降致和氣福如太倉故謂玄奧難可尋詳上天所寶祕於玄都紫微上宮依玄科四萬劫一傳若有至人齎金寶質心依舊格告盟十天然後而付焉道言夫五行順治則萬物有宗陰陽至和三界歡樂天人長年無夭折尅傷之患若氣化失次星度迭軌刑殺制勝竟不休息則天地運度亦有否終日月五星亦有虧盈至聖神人亦有休否末學之夫亦有疾傷以其五行之氣不以順道則天人怒而不喜人鬼凶而不吉凡有此災同氣皆當齊心修齋六時行香十遍轉經福德立降消諸不祥無量之文普度無窮道言夫世人生命限臨滯厄運卽相須水火交錯數歸滅亡氣索命終以五行刑尅併於絕地故也不知身壞物弊而眞神本元之主道之至精未嘗滅也五行逆次則天地終極或末學道淺仙品未充運應滅度身經太陰臨過之時同學至人爲其行香誦經十過以度屍形如法魂神徑上南宮隨其學功計日而得更生轉輪不惑便得神仙道言五星凌犯不順治其道上爲天災下爲地禍中爲人患天地運終星宿錯度日月失昏四時失度陰陽不調不順於天也山摧地震水湧泉涸獸食人民蝗鼠害稼陷沒注決風火迸出壓溺倒裂不順於地也國境生災兵革興作疫毒流行兆民死傷師友命過鬼出爲祟不順於人也五行失順則物莫能治欲使順道自然天下安謐者皆當修齋敷露五方眞文立壇奉幣以告五帝行香誦經夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衞右別至人克得爲聖君金闕之臣諸天記人功過豪分無失天中眞王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君撰元始靈書五行順治玉篇東方八天神屢易圖玉遇山回子王七覺輔波僊深旦烈靜卒江梗呼迎寳煙披澤始栗備身閱碩彊偃辨卑羅蜜魯輦息家處檀移心魔詠枝河究屈張平蘭球珠忽离龍梵陰南方八天太玄混微斗著轉華移盈曲祿報該無涯念蕩董頤救明演徙極深光總九搖契遠露戟韓司洎詵招西飛玉投檢瓊籌泛芽丹明希沈長幾嶧訛騫傳良滌房覩迎陀西方八天音混眞隅柳寂鎭鋪義殿洪護遘健錫無仗伎亟丑月羅雲奔部茫哆參王中玄臺元洞惡奕靈童爓浮祥寗寔賈靈提丁謀勤玄樂明燿雄傳孤梵明皇景豐嬉並元北方八天太玄宛室旗正亭白沈酬幾澄貴眞奚名廓定逸革樞靈愬𦅌韶庭湄濩醜那奕升宿嶽林厯道混魔京罔被淵密龍固迷緣太陰九靈魔微朝徵神瑛沙蘭韞誥仙盟道言此諸天中大梵隱語無量之音舊文紫筆題璇璣之門以東方八天第一第二第三字正天分度丹書龍臺玉山中閣以南方第六天第四第七字使五行順治氣不害逆三華太玄碧落之文刻紀中斗𩵄宮司空之庭以西方第三天第五第七字第四天第一第八字以斬祅芒犯害順行之軌黃道之前爲𧕏之者使水火不尅正氣和寗帝道皇極吉昌薈延大素錄簡之筆著文斗箕東北龍母之山鳴鼓之樓眞靈瑤闕譙都之上以北方第二天第三天第四字第八天第一第四第七字以斷卻五行不循星車失度差躔之氣使五行順治降福人天爲百靈所仰萬神所遵字皆廣長一丈八角垂芒方廣如印天眞皇人昔書其文布於八天十方上下以爲正音有知其音能齋而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳魔王保舉上眞道備克得遊行三界升入金門此音出空洞之中太和沖杳之氣結成正音五行刑害不順行度失治禍及民者鼓其音而禳之天垂甘露地生神芝金寶開泄符瑞自生無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致飛天下觀上帝遙唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅淸河海靜默山嶽吞煙萬靈振伏招集羣仙天無氛穢地無祅塵冥慧洞淸大量玄玄也

front:
  text: 元始無量度人上品妙經元始洞玄靈寶本章五行順治眞化度人百魔隱韻離合自然大無元冥杳寂無眞空極生神眞炁神存兩半同升陰陽始分黑白二物爲天之尊中黃爲土四氣濳形赤明開圖乃有五星熒熒列位道之淵靈太空眞土鎭德自名鎭之父母甲巳爲源絪緼相求土形乃生乙庚合氣土乃孕金金德神武承天之根金液化水丙君辛臣水性潤下金土感化勾芒吐綠靑芽起雲雲回上淸癸魄戊魂日月含育赤精揚煙煙息體合氣歸返眞神化無門無門爲空空爲土公九還七返至道之宗是曰五行順治而通陽順則福陰逆爲凶順治五行惟帝之亨萬天凝粹浩劫乂寗五行尅伏鬱拂差勝自非通神不知至聖土爲中主五劫氣彊木來尅之非謂勝制欲其順昌木極金犯金勝火流火炎水濟凡此皆爲尅伏世之鄙愚不悟天道貴其中順惟其平調爲帝之德順治無偏玄之又玄至寶順生礫石迊成瓊臺玉闕金樓碧城鬱羅蕭臺玉山上京上極无上大羅玉淸若亡若存隨意而營浩浩梵氣瀰漫無形中有大帝三淸之君中有九老仙都之眞中有黃元九素大神中有白元皓空之君中有太玄五靈洞微之神中有靑華九仙丈人中有赤書紫文之君中有太皇萬福順治元化延壽度厄尊神今日校錄諸天臨軒東方無極靑帝木眞神王長生大聖無量度人南方無極赤帝火眞神王長生大聖無量度人西方無極白帝金眞神王長生大聖無量度人北方無極黑帝水眞神王長生大聖無量度人東北無極大帝玄女神王長生大聖無量度人東南無極大帝赤子神王長生大聖無量度人西南無極黃帝土眞神王長生大聖無量度人西北無極大帝天姥神王長生大聖無量度人上方無極眞帝玄父神王長生大聖無量度人下方無極元帝道母神王長生大聖無量度人十方至眞飛天神王長生度世無量大神並乘紫霞流精之輦太微金明五眞混變無極之駕素麟丹鳳靑鸞黃獸萬福之騎天仙扈從七億萬人執持雙珠月明白羽玄干冠帶九氣三辰之華九歌陽音八素陰唱嘯歌噰噰五老啟途羣仙翼轅億乘萬騎浮空而來傾光迴駕順治化生諸天丞相南昌上宮韓司主錄監生大神五帝司馬感生元君執籙把籍齊到帝前隨所應度循運諸天卻逆除暴調元五精水火不尅萬物悉全天人鬼神順道變仙順爲臣子忠孝德先忠感玉帝孝徹太玄陰陽和等三官列言人神感悅品𢑥駢繁下極幽都北山河源冥類苦爽時刻升遷以順得生仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度三塗五苦八難超凌三界逍遙上淸上淸之天天帝玉眞無色之境梵行

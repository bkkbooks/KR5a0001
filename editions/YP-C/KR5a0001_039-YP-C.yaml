front:
  text: 元始无量度人上品妙經卷之三十九
  hash: sha256:3ce0061c1b4cf4a9c13b35dc9d2b51b73858b2e5ea99a278488334f763d0bd30
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_YP-C_02kangji-01-0055b, image: JY001/02kangji-01-0055b.png}
body:
  text: 南宮延生品道言昔於丹靈天中絳彩飊歌朱陵昌土受元始度人南宮延生无量上品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖高尊妙行眞人南昌上宮天機內省延生保僊上眞道君南宮延生天機上相眞宰天機上吏眞宰天機眞僊眞宰天機直神眞宰丹元僊官三元僊官天機都吏甲騎神吏無鞅數眾乘空而來彤霞神霄寶輿丹輪鳳蓋垂蔭流明紫光九色蓊蔚洞煥太空六日六夜南昌上宮星樞守躔候鼓不鳴龍嶽水刻玉滴停注煙旗浮空霧帷卷香樞機二省十官秉笏嚴領局部神風輕襲虛海澄映天容廓淸氣界昭曠一國地土山川林木緬平一等無復高下土成柔玉紺膩純明洞徹圓羅無有異色眾眞侍座元始天尊玄坐空浮六龍戲珠交昇雲錦之座說經一遍諸天大聖同時稱善是時南昌宮中天機內省注上兆庶延生保僊之名萬億論計得仙之人九萬餘條說經二遍南辰朱華映滿碧虛雲綱縈囘瑰衡蚪屈說經三遍琳琅振韻讚美洞章說經四遍南宮啟關生育萬彙說經五遍天機流運五德平昌說經六遍六星搖光萬神協慶說經七遍仙算無終世壽遐遠說經八遍眞魔降券度兆延生說經九遍雨花盈尺天香合雲說經十遍世無夭折樂慕靈眞是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方无極无量品延生至眞大神无鞅之眾浮空而至說經二遍南方无極无量品延生至眞大神无鞅之眾浮空而至說經三遍西方无極无量品延生至眞大神无鞅之眾浮空而至說經四遍北方无極无量品延生至眞大神无鞅之眾浮空而至說經五遍東北无極无量品延生至眞大神无鞅之眾浮空而至說經六遍東南无極无量品延生至眞大神无鞅之眾浮空而至說經七遍西南无極无量品延生至眞大神无鞅之眾浮空而至說經八遍西北无極无量品延生至眞大神无鞅之眾浮空而至說經九遍上方无極无量品延生至眞大神无鞅之眾浮空而至說經十遍下方无極无量品延生至眞大神无鞅之眾浮空而至十遍周竟十方无極南宮延生天眞大神一時同至一國男女傾心歸仰將聞元始天尊宣示南宮延生之法成眞之要各相謂言我等位證天人住諸天中未聞天司名品居處統治三元生死罪福功過所在南宮延生但知大略南昌上宮爲南極長生大帝君之總司延生之所復在何治有何典宰主吏三元之民當何祈請遂獲延生將享无極今日天尊敷陳綱括開曉天人我等宜各精心歸依大法修證前詣再拜稽首來者有如細霧密雲无鞅數眾迮國一半土皆偏陷非可禁止一切大眾圍繞座側瞻伫靈顏覬聞妙法元始俯仰四顧攬几迴天儼紫金光容發言宣告大眾曰夫天地定位君臣乃立三天上帝設官布政分治三元紫微太微爲兩極之司以主生死世人罪福仙眞功過紫微曹局係於北斗太微案掾隸於南辰紫微天官之司則有太玄都省以統三官太微大君之司則有天樞天機二省以延注生命校領羣靈南斗第五星曰天樞第六星曰天機樞機二省爲上帝之內司長生大帝正所御也天有三省以治三元則樞機之司並屬於南昌上宮卽太微宮也三省之內金闕侍中上相上宰侍郎仙卿司命以共治之兆能長齋奉詞天機省中懇禮長生大帝嚴備供養勤誠不替則有九天採察考校眞官按兆功過上聞機省則上相注筆爲兆延生壽無紀極不必丹芝可俟仙道大眾欣躍乞獲詳教渴伫聖言於是元始懸一寶珠大如黍米在空玄之中去地五丈元始登引天眞大神上聖高尊妙行眞人天機內省上相眞宰靈官直符甲卒統騎南宮延生无量大神十方无極至眞尊神无鞅數眾俱入寶珠之中天人仰看惟見拂拂從珠口中入旣入珠口不知所在國人廓散地還平正無復欹陷元始卽於寶珠之內說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸得延生不殺不害不嫉不妬不淫不盜不貪不欲不憎不𡜍言無華綺口無惡聲十二善行專則延生南宮自聞天機列言七世命仙齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬各得度世道言元始天尊說經中所言並是上帝南宮延生內名隱韻之音亦是天機省中上相內諱百靈之隱名也齋戒誦之直符詣天機省乞延生之籙太上度南宮之契兆得延生永世長存非世之常辭上聖已成眞人通玄究微能悉其章誦之十過諸天遙唱萬帝設禮南宮延生天機紀齡雙景照頂泥丸返精羣魔束形鬼癘滅爽囘屍起死白骨成人至學之士誦之十過則大君流遷三省言功魔精喪眼鬼祅滅爽濟度垂死絕而得生所以爾者學士穢氣未消體未洞眞召制百神威未制天政德可伏御地祇束縛魔靈但卻死而已不能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到南昌宮中天機省宰上相眞君請長生大帝玉篆龍文九雲之書雲章寶籙統僊驅吏八鸞眞符告下酆山泉曲之府使億曾萬祖幽魂苦爽皆卽受度上升朱宮格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經南極丹元左靈仙府眞官直符神吏爲兆延生皆卽受度飛昇南宮世人受誦則九元八極四斗三眞十二仙官教兆隱遷延生長年後皆得作屍解之道魂神暫滅不經地獄卽得返形遊行太空此經微妙普度無窮一切天人莫不受慶无量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役治官侍經南宮玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經南宮延生長生大帝敕太玄九仙君太虛无上君太上九老仙都君爲兆開心通幽洞冥爲上世亡魂斷地逮役度上南宮七月長齋誦詠是經南宮延生天機上相告太虛紫元洞陽元君太素仙元君太上秀樂君爲兆辟妄長獲至眞身得神仙南宮書名黃籙白簡削死上生十月長齋誦詠是經南宮延生金闕侍郎請玉華洞靈君玉華紫靈君元丹中皇君爲兆護身忠事至尊孝及一門爲國王帝主君臣父子安鎭國祚保天長存世世不絕常爲人君安鎭其方民稱太平八節之日誦詠是經南宮延生玉淸三皇太帝華陽仙君紫靈仙君洞陽仙君開兆八關得見眞仙得爲九宮眞人本命之日誦詠是經南宮延生長生大帝敕太極仙君淸靈仙君九光仙君十華仙君延兆生籍赦罪超神魂神澄正萬氣長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上淸道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐紫赤絳三色雲氣之中內外蓊冥有靑龍白虎朱雀玄武獅子白鶴羅列左右南宮天機相宰神官俱降兆前日月照明洞煥室內項生圓相光映十方如此分明密咒曰无上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啟所言今日吉慶長齋淸堂修行至經无量度人願所啟上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始无量度人上品妙經元始洞玄靈寶本章南宮延生上品天機度人太微隱韻離合自然混洞赤精旡旡上眞化爲南極六司高宸天樞統兵總御三元天機內省天政所干統攝南宮主校延生元始祖劫化生諸天開明兩極水火天根上無復祖惟道爲身九龍雲書八鸞眞文攝氣命仙召靈招眞十極飛報玉章瓊文三省開廓普植神靈太玄都紏樞機輔丞持印執法八天鳳文無文不光無文不明無文不立無文不成無文不度無文不生是謂大梵天中之天鬱羅蕭臺玉山上京上極無上大羅玉清眇眇劫刃若亡若存三華離便南昌妙庭金闕玉房森羅淨霐神霄梵氣周迴十方中有南宮延生之神中有南極長生大帝君中有神府靑華帝君中有天機上相上吏眞神眞宰眞君中有延生司馬大神中有好生主錄韓司丈人眞君中有南上司命司錄延壽益算度厄尊神迴骸起死无量度人今日校錄諸天臨軒東方无極延生注善神王長生大聖无量度人南方无極延生考察神王長生大聖无量度人西方无極延生賞功神王長生大聖无量度人北方无極延生校錄神王長生大聖无量度人東北无極延生定品神王長生大聖无量度人東南无極延生紀壽神王長生大聖无量度人西南无極延生上奏神王長生大聖无量度人西北无極延生僊誥神王長生大聖无量度人上方无極延生帝司神王長生大聖无量度人下方无極延生巡省神王長生大聖无量度人十方至眞南宮延生神王長生大聖无量大神並乘紫雲琅輿朱輦華蓋碧輪驂駕丹鳳五色靑龍建火鈴制魔之節六甲召眞靈旛前嘯九部齊唱後吹八樂同鳴飛空遊僊嘯歌噰噰五帥啟塗四靈翼轅憶乘萬騎浮空而來傾光迴駕監眞延生天機丞相南昌上宮韓司主宰延生大神執籙把籍齊到帝前隨所應度嚴校諸天兆能投誠奏告南宮標紀生命月日時年奏章通詞洞館隱天詣南昌上宮天機內省金闕侍郎南上司命靈虛眞仙注筆丹籍延生續年已枯復榮已殘復完已滅復起已朽復堅天機上生錫兆長生普告三界无極神鄉泉曲之府北都羅酆三官九府十二河源上解祖考億刼種親疾除罪簿落滅惡根不得拘留逼合鬼羣南宮符命時刻昇遷北都寒池部衞形魂制魔保舉度品南宮死魂受鍊仙化成人生身受度刼刼長存隨刼輪轉與天齊年永度三塗五苦八難超凌三界逍遥上淸上淸之天天帝洞機無色之境梵行東方八天玉厯司仁天帝慈持宗元化植蒼靈天帝廣繁儀王道華秀功天帝純平子夸寶宸妙生天帝冲玄定僊太玄靜眞天帝慈持宗元遘僊滌想天帝廣繁儀王㟧龍布和天帝純平子夸淸邱洞夷天帝冲玄定僊南方八天正紀黃元天帝覺浮丹明朱房簡眞天帝絕洞九方曲化耀威天帝恬昭延生炎正宗成天帝殿公維良皇極變成天帝放鐸卒馳丹明感僊天帝鍊歸牧玄飛龍晨燭天帝育垠祕懷神闕絳玉天帝浮棠嘉萌西方八天七靈素明天帝虎襄威機輪皓都天帝勝元衍光靜生太无天帝自眞定開清明囘光天帝監印主收敢司正刑天帝制懲檢冥道嚴戒城天帝曜道离昌玉龍昇汭天帝昇奇纂神盈虛總靈天帝對神把眞北方八天朝極靜順天帝烈華至彬履剛召靈天帝常祐柯童玄眞海遙天帝伯赤飄光玄洞五雲天帝曷迴樞純金呈禁理天帝保撫慶明玄靈斗宮天帝契超燕宗萬福帝皇天帝善持揭藍玉雲靉龍天帝母精羅源三十二天三十二帝南宮隱諱南宮隱名天中空洞自然靈章太微隱韻太微之音太微之尊南昌之神天機眞宰南宮之靈九府十曹飛報上淸无量之奧深不可詳敷落神眞普度天人今日欣慶受度延生永固厯關諸天請滅眾惡斬絕地根超度五苦名列大玄東斗主算西斗記名北斗落死南斗上生中斗大魁總監眾靈靑帝護魂白帝侍魄赤帝養氣黑帝通血黃帝中主萬神無越靑籙眞官吉多眞伯赤籙眞官擘山擎石白籙眞官黃越赤靈黑籙眞官御雷鐵腹黃籙眞官天道神力五籙眞官萬神之宗飛行鼓從總領僊兵麾幢鼓節遊觀南宮威聲赫奕帝省言功南昌續生嚴攝北酆神府受命普掃不祥神龍吐毒天馬四張金精前驅飛神仗旛擲火萬里流鈴八衝敢有干試拒遏上眞金鉞前戮流火後刑屠割鬼爽炎飈無停千千截首萬萬剪形魔無干犯鬼無祅精三官北酆明檢鬼營不得容隱金馬驛程普告無窮萬神咸聽三界五帝列言上淸大洞啟厯道合自然恍惚結氣界域斯張君父臣民列職分庠凝玉爲京初易龍康帝出而治左右紀綱三宮肇基三省闢張三府總司按牘維防眇眇億刼混沌之中上空無色下空無淵風鼓澤涸水堅爲山空生元土金剛乘天天有萬官命世經天天上天下無幽無冥無形無影無極無窮自然神化變造形容溟涬大梵與道合同民有耳目不知視聽潛默漠昧遼廓無光赤明開圖運度乃宣元始安鎭敷落五篇赤書玉字八威龍文保制刼運三界長存符變僊眞官司臣鄰氣復成符象與空淪梵氣彌羅萬範開張元綱星舍隨氣流演三十二天輪轉無色周迴十方蔭蓋乘車階登紫房太玄都司大魁植彊旋樞厯機據斗建綱掖帶二省統號南昌順行六儀回度五常三十五分總氣上元八景冥合氣入玄玄上帝樞機天之喉舌下應體躬心目爲玄玄中太皇南宮延生上帝高眞泛景太霞嘯詠洞章金眞朗郁流響泥丸雲營在中白珠連連玉音攝氣耳聽鍾絃靈風自徊百神聚煙紫虛鬱秀輔翼萬仙千和萬合自然成眞眞中有神長生大君靑華左公玉妃右神高上道王執玉垂紳太一在前司命在後桃康合延吐英噏秀執符把籙保命生根閱籍南宮請算北元上遊上淸出入華房八冥之內細微之中下鎭人身樞爲腦空不動者空絳宮爲機索幽見微中理五氣混合百神十轉迴精萬氣齊仙南宮延生无量度人機開八門飛天法輪罪福禁戒宿命因緣普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有空洞謠歌之章眞聖靈篇辭參高眞第一南宮延生天機上相飛空之音天機據摛帝宮維南欲延爾生無引機轅機軸不動道大勿用機轅相馳不病則屍天機乘物召則應之善惡功過率關帝司機靜神動僊飛南宮謹機祕眞卓爲靈人運機以天道法自然運機以心喪精失身心目爲機象以四時我握其寶上帝所知第二南宮延生天樞上相之章六星在南上通朱陵炎炎丹霄絳闕彤庭環樞者空空體無形無形不動孰使其靈靈無使從惟帝是膺天政以常勿伐勿矜有相若助徒爲主名靜而無爲道以公平象彼泥丸中居至神混與空合百骸自生大樞任成無得無名我駕飛飈下觀億程第三南宮延生長生大帝歌曰電輪舞空命駕神宮雲旗燿熠紫雲光襲下有萬仙龍翼我轅紫霞爲蓋天衣河帶樂攜高上席宴華童南昌列言道濟眞功注善延生勳靄仙宗人無私機正意爲師情念蜂起招魔致鬼僊聖殊超然豈獨長生已浮身八景間俯眄靑圓羅丹林覆諸天玉音揚洞歌憫此塵中人一瞬隨流波燒香捧靈篇眞人自來過此三界之上飛空之中眞王歌音音參洞章誦之百遍名度南宮誦之千遍眞仙保迎萬遍道備飛昇太空過度三界位登仙公有聞靈音眞王敬形敕制地祇侍衞送迎拔出地戸五苦八難七祖昇遷永離幽關魂度朱陵受鍊更生是謂无量普度无窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及南宮延生隱祕之音統明樞機之司爲上帝喉舌心目之任皆隸南昌上宮爲金闕之要地兆能長齋封章奏告謁詣眞靈上吏眞宰敷功列言爲其延年身享天福澤逮後昆皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寶祕於玄都高上神霄玉淸玉府道合治世應法以傳若有至人齎金寶質心依舊格告盟玉淸然後而付焉道言夫天地運度否終日月五星虧盈至聖神人休否末學之夫疾傷凡有此災同氣皆當齊心修齋六時行香十遍轉經福德立降消諸不祥无量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太陰臨過之時同學至人爲其行香誦經十過以度屍形如法天機上相爲開南靈延生續命之簡注記善功魂神徑上南宮隨其學功計日而得更生輪轉不惑便得神仙道言夫天地運終星宿錯度日月失輝四時失度陰陽不調國境歲災疫毒流行兆民死傷師友命過皆當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受賴其福難勝故曰无量普度天人道言凡有是經能爲天地帝王兆民行是功德有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衞右別至人尅得爲聖君金闕之臣諸天記人功過毫分無失天中眞王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語无量音道君譔元始靈書南宮延生祕篇東方八天婁胃握樞裔延重波綽摩慶將陸徒𤁒帝抱能興生仗仙獨麗銳伯麟元綿洪騫熾角飛兼羅吻悅遘慧越嘉童貽雲鐸府位梵方應落彌迢緣遷辟都登廂丙寗盈牋南方八天烏東寗駝畢蒼兖囘壯輔裒淵星柯監摧爵邏謹韜闡時沂泉耀芒赤奕龜蹊宜陳聚掌滅魅寂盧厯聽號炎都利軫冲格眞漸旻蘇康嶽靈衝渦正并挾宥棘囉達辰西方八天灝景太華扄韓附瑾變淸流濊萌梁順忻曜燄剛式璞持妙成梵度元品恢漠連濱常融殊邱敵乾峩屏混化開兌偃池顫因樞關崿都避爻魚圍質傍樊儲遍蕩掖奔北方八天玄漢巨漠螣輪腆陽龍堅華育惠班至莊答落正位照艾虛危錫河律多禀察興和瓚鼐幽仰杞靈欽蓬晦洞室育俛墮熒敖竺洛紀籍燕坤呈魔內殺醜祅玉延終壁道言此諸天中大梵隱語无量之音舊文刻書南宮鳳臺之上召南極斗機眞人開兆玉厯延生永世拔度七祖帝澤千重身飛金房書籍朱童字皆廣長一丈長生大君昔寶其文以爲正音有知其音能齋而誦之者諸天皆遣定眞神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大功眞王保舉南昌道備尅得遊行三界昇入神霄此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致神王下觀上帝遥唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅淸河海靜默山嶽吞煙萬靈振伏招集羣仙天無氛穢地無祅塵冥慧洞淸大量玄玄也

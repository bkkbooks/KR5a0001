body:
  text: 東方八天惠靈眞極天帝侯適演均岫靈洞剛天帝巴光緣太乙思遊天帝直厯普疆皇覺慶宗天帝顯祕太茫九變玄黃天帝都京那無雲津主成天帝夢厯銖高靈濟生天帝魯常寂兟靈震八威天帝育尚庚元南方八天朱陵契賢天帝獻悆慈薦丹宇臻微天帝韓頣洞文上德太宗天帝默領希景皇澤龍天帝蕩會舒氲玄道通聖天帝房度炎暉育神感思天帝揚奚令傍中靈眞鑒天帝秀熏瑤丹練神正天帝呼甄蘄臻西方八天瓊眞嚴麗天帝祚梁十孫奏仙希福降玄天帝鐸華息因參尾元神天帝卓趾無辰大千仁靜天帝頂空眞魂玄道化儀天帝師慶祠温慶陽德廣天帝肇伯元咸行慶福天帝巫羗李容高靈宣智天帝畢童井機北方八天玄靈澄意天帝了洞微公寶驛定眞天帝乙安化宜四明玉龍天帝昭章北玄承華望極天帝抱沖胡捐寶運洞神洪濟天帝越覩誥霄極啓元露沖天帝祖昌明太無瑩神天帝鐸柱演邦凝化絡雲天帝眄索部喑三十二天三十二帝諸天隱諱諸天隠名天中空洞大赤靈文諸天隱韻太極之音太冥之尊太空之神玄氣眞魔大赤之靈神氣和合變化太淸无量之奧深不可詳敷落靈文普度天人今日欣慶受度厯關諸天請滅三惡斬絕地根靈文佩受名列太玄眞王監舉無拘天門東斗生識西斗受命北斗分神南斗得性中斗意眞五官以正靑帝玉字白帝金文赤帝丹芒黑帝玄晶黃帝成意飛神召靈靑文神王震氣鳴空赤文神王摧伏魔凶白文神王風火擊衝黑文神王萬滯開通黃文神王元化興隆五文神王大赤之雄變化靈文萬神之宗飛行鼓從總領仙兵麾幢鼓節遊行太空大明赫奕諸天齊功佩服靈文嚴攝北酆神王受命普掃不祥玉兕殄醜金獸四衝火兵前驅神首仗旛朱鳳流鈴煇電騰煙雲雷奮擊綠齒玃吞敢有干試拒遏靈文金鉞前戮威劒後刑屠割鬼爽風火無停千千截首萬萬戮魂魔無干犯鬼無祅精三官北酆明檢邪源不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列言上淸太淸大赤天靈文寶章之篇萬形主太空出入如飛龍名空太無體空無浩難窮三界萬千劫倏忽淪爲空大赤猶心象生滅茍取容心空無二門心盡亦歸空兆如念道眞滅境空無通玄元始三清是爲三妙空大赤心想盡玄影尚矇朧此爲第三觀玄炁太清宫心空見無色玄影杳無蹤自然識法體靈光合神風超登元境上縹緲禹餘中朱書青箔上三元日然爲灰以東流水服之役使鬼神坐知長生神仙佩之則石神稽首所向皆遂悟其旨則得道登眞也玄氣受鍊眞火洞燔九萬九氣變爲赤文六六數滿天元乃成玉樓丹闕飛觀神京昔在玄胞初龍末康眇眇億劫混沌之中上無其色下無其淵風行空內積剛爲堅堅性爲金金露流泉泉爲白水卽受金淵金水凝結化地生天天上天下無幽無冥無形無影無極無窮溟涬太朴遼廓無光大赤靈文運度自然元始安鎭丹元上篇赤書玉字火鍊龍文保制劫運使天長存玄氣彌羅萬範開張元精流演三十二關輪轉無色上入泥丸周回十方履火蹈泉旋斗厯箕回度五常白雲化液玉露玄霜三十五分總氣上元八景冥合氣入玄玄玄中至靈聖母元君汎景紫虛嘯詠洞音金華合氣流運雲宮玉音化景靈燿迴風太淸上化鬱秀八騫千和萬合自然成眞眞中有神長生大君金闕至玄無英白元華陽玉妃太乙上眞九宮司命桃康合延執把靈文保命生根上遊上清出入華房八冥之內細微之中下鎭人身泥丸絳宮中理五氣混合百神十轉迴靈萬氣齊仙仙道貴生生氣度人上開八門飛天法輪罪福禁戒宿命因緣普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有空洞謠歌之章眞王靈篇辭參高眞第一玄氣生大赤天飛空之音赤黑相半其名曰玄陰微陽妙復名太元浩空無染本物明白比此光空以名自攻赤黑來居玄氣乃敷玄爲陰陽邈未開圖陰盡則赤大赤是都上清之下種民之上統十二天太上之廬第三氣觀道境天衢如兆行道慾盡影餘心空未盡影跡不除於道未徹爲空所拘故號太清九仙之庭絕影去玄道乃可見爾若不知眞徒爲棲山林大赤有靈文詠之駕飈輪第二大赤天爲太淸仙境之章神氣浩浩純陽發煙眞火鍊之赤玉爲天火色未靜大赤有名火去眞存寥寥太清丹瓊爲闕紫雲爲庭峩峩大赤中上連玉都京太上黃錦衣汎景流金鈴左命九龍駕右策轡神虎風雨來導前鐘鼓爲後部三界諸天魔叩首祈眞度陰陽正下埃萬物由鼓舞大赤有靈文高靈咸所慕第三靈文神化眞王歌曰玄氣如破縷乘風類遊龍飄飄飛太空九陽生其中無然大赤色屈曲斜方弓結空乃成字靈文體高沖皇人按紫筆宛與天眞同符書策萬神度人功無窮兆能起心信佩服仰霄穹咽服召元氣玉津自流通胃池生絳煙骨節磨靑銅六丁來奉巾變化幽冥宗嘯歌升太淸神行本無蹤此三界之上飛空之中眞王歌音音參洞章誦之百徧名度南宮誦之千徧眞王保迎萬徧道備飛升太空過度三界位登仙公有聞靈音眞王敬形勅制地祇侍衞送迎拔出地戸五苦八難七祖升遷永離泉關魂度神霄受鍊更生是謂无量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝大赤靈文隱祕之音和天安地禳鎭國家佩服致眞卻災除殃上輔道化保民無疆皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寶祕於神霄玉淸玉府經室東藏道君行教應運下傳若有至人齎金寶質心依舊格告盟玉淸然後而付焉道言大赤靈文三氣之宗濟度垂死無所不成夫天地運度否終日月五星虧盈至聖神人休否末學之夫疾傷凡有此災同氣皆當齊心修齋六時行香十徧轉經福德立降消諸不祥无量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太陰臨過之時同學至人爲其行香誦經十過以度屍形如法以大赤靈文丹書靑素佩之或著心前魂神徑上南宮隨其學功計日而得更生輪轉不惑便得神仙道言夫天地運終星宿錯度日月失明四時失度陰陽不調國境有災鬼氣流行殟疰疫毒兆民死傷師友命過親愛終亡皆當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受賴其福難勝故曰无量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋行香誦經十過皆諸天記名萬神侍衞右別至人剋得爲聖君金闕之臣諸天記人功過毫分無失天中眞王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語无量音道君譔元始大赤靈文中篇東方八天伊檀抱時碧泉淇昧洞關岐都偃竺䖍回燿元仙址殿凝微師建扈猶略慈卭引機卓利復究淵增條約爰邦趨頻道鍊息嶽氣綿玄黃運冥部方淨壯韓府披維履剛南方八天精童浮曦七映瓊池定獎氣馬了澄玄漪華貫遘液魄拱神棲柔瑩濯澤芒忽閟持亮豫恕游謹濟莫常歛索妙咸沖逸揚頤紫山太無信思功宜問仙晃朗丹明玉微西方八天靜無何爲守神完煇浩爛疊熒結化崑䋿道育精傳溢鳴時譔天醴自波玄煇光河封命錫圖陰平校魔制泉部鋒馘凶斬祅文靈勅眞護帝金闕候海聽虛質誠介膺北方八天斗維𢹂丑理言變仙實交烜赫氣豐玄泉把珞迎漠奠區隨垣命蒂九齒辨驛祠綿蟾滋合華斗氏交車韓司少元邱資始房判漫曹令角新辭盤月鄙杜宮縢明阮光道言此諸天中大梵隱語无量之音舊文刻書大赤天丹闕之上以司天地之政輔陰陽之化制命萬靈字皆廣長一丈天眞皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣赤天神王下觀其身書其功勤上奏神霄萬神朝禮地祇侍門大勳眞王保舉上淸道備剋得遊行三界昇入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之則靈文見空紫雲滿室百神侍軒萬仙朝禮佩之則上帝降策八景登晨服之則五藏混交玉精流傳三元歡樂寶氣凝祥體之則神遊太淸身御赤氣妙合太無道超萬有分形千億坐在立亡琳琅振響十方肅淸河海靜默山嶽吞煙靈魔畏伏招集羣仙虛明合玄神化自然冥慧洞淸浩劫無遷也角集二音釋褭音嫋菂音的卽蓮寶也熠音煜光也埏音延倐音叔𠟡音䬍𧕏音蘖繖音㪚蓋也𣤛欻本字音䬍飊音標惒和本字瀋音沈艧音鸌舟也𦊰音卷竦音悚敬也駞同駝猋音標瞀音茂慜音敏兀音机矴音丁勑音萊勞也扆衣上聲濆音汾崿音諤殟音溫病也音註病也

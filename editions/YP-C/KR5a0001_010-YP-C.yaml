front:
  text: 元始无量度人上品妙經元始洞玄靈寶本章大赤靈文上品玄空无量度人太清隱韻離合自然混洞玉文冥寂玄通上皇之代神寶化生靈書度命凝泛玄空上淸之下森列三宮與道合混九光丈人冥无大劫變立諸天天中聖人大赤之庭眞人玉輔高玄化仙下統九品開署天官生無夀限劫災不登莽蒼浮空下臨眇城一十二域八景高淸周厯三道變化靈文應念自彰大象開明是爲玄梵天中之天三皇洞神太極太冥浮絕玉京金華龍山帝一躡景无上元靈正元玄氣三境神穹上極无上大羅玉清眇眇劫仞若亡若存玉華廣筵大有琳房金闕瓊樓森羅燿綱太霄正氣周徧十方下鎭八維分亘中央黃老大洞三天化章總氣沖元保世亨昌中有大赤靈文之神中有南極長生之君中有保生靑華之尊中有安鎭元皇大神中有好生韓君丈人中有赤元太一紫極眞君中有南昌司生司化燿明玉紀玄道尊神迴骸起死无量度人今日校錄諸天臨軒東方无極飛空神王長生大聖无量度人南方无極丹燿神王長生大聖无量度人西方无極白洞神王長生大聖无量度人北方无極紫霄神王長生大聖无量度人東北无極八景神王長生大聖无量度人東南无極明化神王長生大聖无量度人西南无極生道神王長生大聖无量度人西北无極氣祖神王長生大聖无量度人上方无極靈運神王長生大聖无量度人下方无極保鎭神王長生大聖无量度人十方至眞大化神王飛天度世无量大神並乘碧燿瓊霄之車洞陽丹輦鳳翣素蓋八景瓊輪馭九龍汗漫之駕抗朱霞飛生之輿建命仙之節十華大旛前嘯玉謠齊唱後吹泛唱同音獅子斑麟吟嘯辟邪五緯啓塗斗魁翼轅億乘萬騎浮空而來傾光回駕監眞度生三天大帥元老高尊四極眞王九天上靈執籙把籍齊到帝前隨所應度嚴校諸天大赤靈文神氣流玄上化天府下極幽泉高上推策太皇寫篇普吿三界碧落神鄉星羅之府北極元綱三垣九道十二通津上解祖考億劫種親疾除罪簿落滅惡根不得拘留形合高仙元始符命時刻升遷北都寒池部衞形魂制魔保舉度品南宮死魂受鍊仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度三塗五苦八難超凌三界逍遙上清上淸之天天帝洞清無色之境梵行

front:
  text: 元始无量度人上品妙經卷之五
  hash: sha256:57afe4114cab16749c989742301dca97ec67e84874ffb7fe4543700b867b654a
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_YP-C_01jiaoji-01-0072a, image: JY001/01jiaoji-01-0072a.png}
body:
  text: 消禳國君王侯世土災祥品道言昔於靜慶天中玉景安華大眞樂土受元始度人消禳國君王侯世土災祥无量上品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖高尊燿寶眞人諸天仙王太極公侯左右仙伯卿士神吏無鞅數眾乘空而來寶埒天馬流軿雲車揚光煇彩華宸燿浮金根飛輪五雲交映侍衞星羅九靈開瑞洞朗八虛七日七夜諸天三界仙眞境域一時慶樂羣眞協德人天康夀災患蠲消咸樂太平諸天世土山川林木緬平一等無復高下土皆作黃玉無有異色眾眞侍座元始天尊玄坐空浮九光寶蘂太和瓊龍之上說經一徧諸天大聖同時稱善是時普天世土之中風化晏清說經二徧祅沴不生說經三徧時序和平說經四徧星辰順軌日月常明說經五徧五穀咸茂無有凶橫說經六徧保眞棄僞民無欲心說經七徧民德歸仁富夀永康說經八徧正道流行羣生遂性說經九徧國王帝主益增萬夀說經十徧天人合慶福祚無窮是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一徧東方無極大聖消災大神無鞅之眾浮空而至說經二徧南方无極大聖禳凶大神無鞅之眾浮空而至說經三徧西方无極大聖散禍大神無鞅之眾浮空而至說經四徧北方无極大聖除殃大神無鞅之眾浮空而至說經五徧東北无極大聖滅醜大神無鞅之眾浮空而至說經六徧東南无極大聖馘惡大神無鞅之眾浮空而至說經七徧西南无極大聖蕩穢大神無鞅之眾浮空而至說經八徧西北无極大聖誅邪大神無鞅之眾浮空而至說經九徧上方无極大聖殄癘大神無鞅之眾浮空而至說經十徧下方无極大聖伏魔大神無鞅之眾浮空而至十徧周竟十方无極消禳世土一切災祥至眞大神一時同至諸天國土君臣兆民傾心歸仰來者有如雲奔霧合無鞅之眾迮國一半土皆偏陷非可禁止於是元始化一神珠大如鬱儀凝煇曜煥升降徘徊在太空之中元始攝引華芒徧及一切天眞大神上聖高尊燿寶眞人十方无極諸天國土君臣兆民消禳世土災祥大神無鞅數眾俱入神珠之中天人仰看惟見諸天國土君臣兆民消禳世土災祥大神惟見歘歘從華芒中入旣入華芒不知所在國人廓散地還平正無復欹陷元始卽於神珠之內說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷世土安泰莫不昌隆不擾不競不疾不傷不刑不殺不侵不盜不夭不殘上下一德保合太和齊同慈愛異骨成親國安民豐欣樂太平經始出教萬國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是眞王內諱百靈之隱名也十方世土之中國君王侯欲延永世襲保安境土使兵災不起水旱不生盜息民豐時康物泰皆當敷置五方消禳世土災祥眞文或以佩受迎致福祥鎭國之符立壇祈醮詠此神文消災禳禍克保太平非世上之常辭上聖已成眞人通玄究微能悉其章誦之十過諸天遙唱世土遐昌災病弭除水火蕩平政教大備道德齊隆福祥洊至民物熙熙至學之士誦之十過則天地協贊感格神靈經緯順次造化生成國祚綿遠善瑞日臻所以爾者世土氛穢旣消道氣還湻消禳妙範召制威神營衞於時運抗禦而不愆保度至治但無爲而已不復憂虞輕誦此章身則被殃供養尊禮社稷興隆世上昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京消禳一切災祥爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到億千萬國國君王侯世土之中皆蒙玄化普受道恩生養人物德澤咸均潛化蟊賊使姦慝無聞激揚和氣清靜自然介爾景福上契玉眞也上學之士修誦是經皆能爲國消禳疾害召致嘉祥世人受誦則上保家邦下無身災永爲忠孝延夀長年後獲鍊化超生沉淪返質登仙遊宴太清此經微妙普度無窮一切天人莫不受慶無量之福世土蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役冥關侍經五帝玉童玉女各二十四人營侍神文保護受經者身道言正月長齋誦詠是經消禳國君王侯世土爲天地陰陽乖沴成災禳制克平七月長齋誦詠是經消禳國君王侯世土日月星辰厄會之愆臨注身宮扶持妙用後天無終十月長齋誦詠是經消禳國君王侯世土災祥爲永延厯數降致仙眞安鎭國祚保天長存世世不絕長爲人君安鎭其方民稱太平八節之日誦詠是經靈慶覃被敷佑庶民本命之日誦詠是經消禳災禍保身之中三田八景九宮關節靈眞臟腑百神羅絡一形夀筭無傾鎭禳世土災凶保萬物以同榮尊享上功聖德齊明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黃白三色雲氣之中內外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室內項生圓象光映十方如此分明密呪曰无上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官使者各三十二人關啟所言今日吉慶長齋清堂修行至經无量度人願所啟上徹俓御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始无量度人上品妙經元始洞玄靈寶本章消禳國君王侯世土災祥上品妙首十回度人百靈隱韻離合自然五氣玉文三天妙根混沌之始感激神眞推判萬象品物流形光華布景與道合明總御三界羅絡八方邦國境域帝主侯王各統世土上玄所宗政治德化效法是崇動靜之機表應災祥善招其吉惡貽其殃洞合希夷天運隆昌存乎妙範皇極金篇彌綸範氣攝錄神王檢校禍福會於玉堂左右玄臺丹靈雲房簡察否厄隨氣消禳演溢太和周旋徘徊中有上化保度之司中有極眞雙皇太微中有五老卻災辟非中有道祖太乙天眞中有九靈太妙元神掌握樞紐西華玉妃迴愆散厄无量之功今日開化諸天臨軒東方无極消禳災厄神王長生大聖无量度人南方无極消禳災厄神王長生大聖无量度人西方无極消禳災厄神王長生大聖无量度人北方无極消禳災厄神王長生大聖无量度人東北无極消禳災厄神王長生大聖无量度人東南无極消禳災厄神王長生大聖无量度人西南无極消禳災厄神王長生大聖无量度人西北无極消禳災厄神王長生大聖无量度人上方无極消禳災厄神王長生大聖无量度人下方无極消禳災厄神王長生大聖无量度人十方消禳世土災厄保慶神王長生度世无量大神並乘寶埒天馬流駢雲車華葢燿浮金根飛輪騰馭驂駕玉鳳金龍建召神之節命靈之旛前詠洞虛之曲後歌天寶之章青鸞素鶴鳴嘯相和前馳後擁金華帝仙騎乘駢羅控景徘徊停旌駐蹕監眞度非十方主吏萬國神君天曹主宰皇綱眾靈持符執籍同會帝宸鑒觀善惡檢察災源宣命世土九地神州定化之府神霄外臺典錄仙卿九宮八道十二天元總提運會造育之權蕩除凶戾塞絕惡津不容邪𧕏激肆祅雲靈寶上法安鎭消禳回祥致福延祚無邊國君侯王常居自然端拱無爲燕禧劫年民物寗泰共保長存世難息氛三極澄清永致陰陽窮厄之愆四時和平五辰順序二運推遷妙用之本該通太玄太玄之天天帝洞明元皇之境梵行東方八天瀾部臻祺天帝南菩洎呈鎭平思化天帝越輔明津拱觀政神無竟天帝索可靈道端克遒天帝抱雌觀神眞華總明天帝侯昌都運陽扶世天帝孟奇晦山福納萬申天帝用達斯洞靈濟方天帝劉景標南方八天覺慧丹元天帝女裳益玄常應炎空天帝學統慈布光德保生天帝杜百還洪猷遠滋天帝照無拖澤施普揚天帝運撻默尋厯祚極隆天帝魁元仲嘉福熙昭績天帝孝攸倫政通神幾天帝洞皇利尊西方八天道功微妙天帝初顯蔚基鍊素證眞天帝登保妙持奇靈省世天帝雅玄旨宜百寶履完天帝畧伯季望順慈濟明天帝龍求信中智藏遁芒天帝退吉淵武威宗皓天帝助光浪同宇寗正隆天帝順佪靈夫北方八天玄生悟眞天帝報逸取仙施玄淨粹天帝伯師邊能戒精檢神明祖天帝賀室龍門遙龍普變思眞天帝釋乙叢直功進義天帝曜合紫清太玄思无天帝召變祝棊離緣定化天帝末那憂余司危履玄天帝虛生斗察三十二天三十二帝諸天隱諱諸天隱名虛玄變化無量洞章空无成韻九天之音三境之尊立極之神飛天大魔保鎭之靈陰運陽降法象生成元化之妙大不可量普育羣眞保國護人消禳災厄靜息祅氛收捕惡逆掃蕩姦凶解散厄會卻滅洪災眞王監舉過度天關東斗豐殖西斗持兵北斗注壽南斗政明中斗養德恩沛下民青帝備文白帝鑒觀赤帝行令黑帝察姦黃帝體道統攝天官青童持旛伐滅叛亡赤童執節消殄火殃素童秉旗四夷來王玄童建麾穀盈太倉黃童仗鉞守衞明堂五天靈童神化無方總領三界斡運天常召神制氣叩玉鳴鐘宣令布教飛行太空丹天赫弈與道同功鎭安世土保天無終上玄降命符告北酆眞王護世境土崇康眞文寶書普鎭不祥八靈翊衞雷電恢張金獸天馬神鳳毒龍流鈴煥落風火激衝炎炎赫赫朗燿高穹馘滅祅𧕏皇道升平社稷綿永萬邦咸寗魔無干試鬼無逃形六天列曹檢察鬼營不得怠縱使氣交并普告三官萬神咸聽三界五帝列言上清帝一元始皇老上眞三氣流芳化生神靈上列九宮下布九淵太漠眞精紫虛玉清曲宸高映燿景玄冥蒼混綠旻白章碧炎羅絡大梵素雲呇煙金闕黃房玉京寶山丹霞鬱壘蘂珠廣寒眇眇劫仞無極靈宮混黃下降輪轉剛風九水三周浩蕩頑空外運綱紐流演諸天中育萬類主之以君體備天地齊居獨尊陰陽升降庶物乃成元和沖妙牧養人民陰窮陽悖天災互生兵荒水旱疫毒流行民物夭傷何以禳除洞玄靈篇七眞印章五帝玉文石精金光太丹玄經消禳世土之災永亨利貞調正五常七曜齊明人主受福永保太平上遊玉虛九化飛輪太微之內玄極之中三元考校正道興隆蕩蕩灝景巍巍圓羅圓煇絳煙大明陰華朱爓蒼晶騰光散霞天道貴和无量度人出入八門生化之根陽九百六水火刀兵普受拯濟消滅災凶世獲樂康上聞三天三天之上玉帝玄居中有消禳世土災厄之章八景瓊書辭參高眞第一保鎭國君飛空之音浮羅神邱受錄紫皇乘雲落煙八道交光玉闕龍文保鎭帝皇妙哉神霄尊興此大法橋天光降紫微寶符攝羣祅翩翩歸上帝紛紛登絳霄國君受大福天歌朗幽寥世祚享太平懋昌道所招元始授靈章大梵何昭昭境界旣以肅惡根皆殄消正己道來格萬劫亦非遙第二消禳王侯災厄之章大道恢張變化無方峨峨諸天咸立侯王翼衞億千共正宏綱下及人世仰法高穹悠悠羣類功歸帝皇斡運斗極齊以崑崙召仙集眞開化超登感降和氣養育生民掃殄凶醜卻滅邪源肅清世土皇極眞明三玄寶符統攝萬兵得與飛仙同到玉階遊行太空所向利亨運神上景永居紫庭第三消禳世土災厄歌曰上列九天下分九淵蕩蕩道景經緯無邊輪轉元綱而定域中國界旣正宸極居尊森羅三境安鎭五山帝處神洲總攝萬靈若有災厄禳以玉文玄音八書六十四篇洞明天地六氣交纏拂除凶穢簡奏上玄保鎭隆平三界晏然至道本無形神妙可相傳玄德被羣有稽首神霄文此三界之上飛空之中眞王歌音音參洞章誦之百徧四海和同誦之千徧民化時雍萬徧道備世祚無窮超度三界德業興崇有聞靈音封山召靈勅制地祇侍衞送迎保安國土普濟羣生是謂无量億劫度人有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及神霄眞王隱祕之音消滅國君王侯世土之內一切災厄辟斥不祥禳除兵饑蝗旱洪災瘟疫繁霜雷電暴惡風雨一切怪異使世土遐長宗胄繁茂禁制邪魔召迎和氣皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寶祕於神霄玉清王府東室祕藏數丁壬辰應運下傳若有至人齎金寶質心依舊格告盟十天然後而付焉道言夫天地運度亦有否終日月五星亦有虧盈至聖神人亦有休否末學之夫亦有疾傷凡有此災同氣皆當齊心修齋六時行香十徧轉經福德立降消諸不祥无量之文普度無窮道言夫末學道淺或仙品未充運經災厄身厯傾危但當冥心行香誦經十徧卽得過度厄難隨其學功計日而得昇遷不犯干試超登列仙道言夫天地運終星宿錯度日月失明四時失度陰陽不調國境災怪疫毒流行兆民死傷師友命過皆當於國門之外築五方玄壇於有災之所向望其處敷露五方眞文六時行香讚禮誦詠投詞上章招致眞靈諸天卽遣消禳世土十大神將一合來降驅斷災厄除斬祅魅世土安寗五福荐至夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受賴其福難勝故曰无量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋焼香誦經十過皆諸天記名萬神侍衞右別至人尅得爲眞王玉府之臣諸天記人功過毫分無失天中眞王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語无量音道君譔元始消禳國君王侯世土災祥玉篇東方八天景位尸陁邀林詗歌辨樊至持韋詢丕多鉤白猛提韓淵竟傞徧霧勅符橫佐篇沙冀液秦屯渟侯總河无闌催宴離雲濯波壘慈貽明光廓幽羅正行梵龍天機玉沲南方八天星殿元基厯奔華邊轉擲賀門九峩承天化直占殿允皇逸權聊還注壺景運璣璇丙現守澤平遙屈連慶常驛飛流岐玄仙蕩方經構璧建趣堅陳東莫攴猛柞混田西方八天劔伊眞庭連岡驥晶變素莎臺治異涓靈卦室鎻疆飛翔定扃蔭末山峯汶時贄丁演亶祺陋祠婁決征祖判叔徒吉倚文寗頻酆曲泉例蘇雲城元被渦祖救慈蓬興北方八天纁組迎符樞台北圖究綿密祝嬰次縁桓苟隸寂曹月緒敷綿琤初凝紀遼笳牧班霞沛望逾令别將神削凝詔咸力宣固全錄梵廣報冥察裕玄栗微罔著覺陶茨輪道言此諸天中大梵隱語无量之音舊文祕在九天玉闕之內應運降世消禳下土諸國境域災癘字皆廣長一丈天眞皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣靈飛使者下觀其身書其功勤上奏諸天萬神朝禮地祇侍門四極眞王保舉上升道備尅得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致飛天下觀上帝遙唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅清河海靜默山嶽吞煙萬靈振伏招集羣仙天無氛穢地無祅塵冥慧洞清大量玄玄也太上五方眞文及國君王侯所佩消禳災祥符命並附於後東方眞文南方眞文西方眞文北方眞文中央眞文國君佩符王者佩符諸侯佩符右符安世土除災禍隨所旺色書碧繒上絳囊盛上香三再拜佩之吉更用一著社中尤勝角集一音釋喑音陰口不能言也㢌音阿病也迮音嘖起也倐音叔走疾也剡剡本字音䬍疾起也𡜍本作嫉音自如也𨚧音加笳音加馘音國截耳也飈音標暴風也洼音娃玃音瞿惒俗和字𤓁音言火門也摙音輦負擔也䆫同窗璈音敖樂器斡音宛轉也閴傾入聲靜也孱音茲瞢與𥌋同蚖音元蛇醫也鼇音敖大𣀴也䨧音陰雲貌馗音逵兟音莘也滷音魯鹽地侖音倫叙也璺音問玉破也狨音戎𦍙同牂𧕏音蘖妖虫也呇音起與啟同陁俗陀字沲同沱擲音躑投也攴音撲小擊也琤音爭玉聲

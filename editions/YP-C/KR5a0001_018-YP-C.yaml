body:
  text: 東方八天玉岐英實天帝伯戊景勳秀峯翠華天帝眇珍叢池寶林燿光天帝芳霄宛驛眞元靈韞天帝冥成妙沂玄符顯靈天帝肇啟元皇集瑞慶皇天帝方稽生瑶瑰暎虛仙穴天帝澤嶽匠靈汶波碧洞神宮天帝道光仙南方八天陽台化景鍊眞天帝寶宣紀延南明洞陽天帝劾章測神司炎治明天帝護生極言檢眞定厯天帝執機主民降炁大光天帝嚴威四衝冲和總領天帝化令正行溟无赤景天帝奉皇玉尊變化定籍天帝鑑英皓定西方八天主福定生天帝巽都景陽素景燿靈天帝綿觀典常閬圃瑶琳天帝露溥順華西臺玉匣天帝寶當元畸靈玉治方天帝訊先求爽剛山頂龍天帝奮光紫神七絶神虎天帝力關威京梵炁金乘天帝嚴幾靜山北方八天玄老海藏天帝宅神岳羅龍光萬虛天帝燿金爓剛雲營周華天帝微玄部清忠嶽洞波碧琳天帝絶崿珠瓊宮无極天帝昭高璿佪蒼目化山天帝拔方起雲京臺海穴天帝濯上慈眞五神泛洋召靈天帝宛令西波三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻天中之音天中之尊天中之神大化眞魔合變之靈九復於一十還於九九合十遷素景生煇金無結滯與神同并神無變壞鍊之卽鮮燿光爲澤共名火宮神金鼓冶合會太清无量之奥杳不可詳敷落三華普鍊神人今日欣逢化度厯試諸天請降至妙大慶因緣飛步五辰名列高玄眞王監察拘制元關東斗授神西斗化形北斗注籍南斗開生中斗黃華合景燿靈三眞之炁發爲金英青帝執規白帝御兵赤帝守衞黑帝結凝黃帝演化萬道乃成蒼華天王攝炁舉仙丹霄天王上炎流煙素景天王開天召山玄燿天王通導百川混極天王坐鎭崑山五天眞王萬神之宗飛行六合遊宴天宮總炁燿靈敷散太空自號赫奕諸天齊功上天鍊眞同會明堂神王震威掃蕩不祥青霞布天電火施張丹靈扇飊收滅遊光域中大帥擲劍剛風騰燿萬里流鈴八衝敢有干試拒抗三官玄鉞前戮神金後刑屠割祅魅風火無停千千斬戮萬萬誅形邪無侵犯保護生民六天九宮明檢鬼營不得怠縱金馬交呈普告羅酆無間溟泠三界大魔飛章玉京元洞玉冊五炁混淪金炁爲骨木炁爲筋水炁爲血火炁爲神土炁爲意物乃化形虛皇妙道三象告成玄元建立羅列神靈明以燭物烈以辨眞動則成禮靜則晦温神光變化火復依金金體無變運斡飛輪員華震燿風扇於明乃成大象皇極高清元微大素金現長庚紫融灌虛白章洞旻流結五炁生育七玄大洞消魔玉惠靈篇共敷至化天晶妙光九龍大劫數極延康眇眇億劫混化堅剛五炁爲色五精爲淵風水相包泰極無邊黃臺杳邈朱闕沉冥無形無影無極無窮鴻濛太朴遼廓開生芒華流彩運度自然虛皇保劫元素玉章丹景結璘大布青房赤燿至靈演炁十方旋斗厯箕囘度五常三垣化闕明列元綱八景赤文攝炁高玄玄中太眞上帝飛仙素景金霞嘯詠洞虛燿靈綠羅交響雲輿玉音泛霄黃華執符紫清鬱岳轉翼元居金爲神液流貫蒼圖千和萬合自然成眞眞中至神南昌上靈通班元老安寶帝尊玄一九輔司命眞君簡閱玉章變化飛根上遊清單出入華源八冥之內細微之中下極重泉九壘淵宮中治生民萬物混同十轉囘靈與炁俱仙仙道貴生无量度人上開八門燿景天輪罪業禁戒考校因緣普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有升遷顯燿之章黃素靈篇辭參高眞第一素景顯妙飛空之音太虛生至眞太空成有形運轉無津涯普育諸神靈玄清化圓羅混黄沉杳冥錯謬散爲物沖和構人倫朗朗諸天境持握生道根蕩蕩大化基八冥歸玉京元始顯眞妙素景融神金旣悟重玄旨合體通靈明七祖升天堂南昌朝帝尊五苦永解脫天魔詠謠音齊樂眞王化羣類皆長生第二燿靈常照眞王之章龍漢立劫仭丹光建元圖大聖玄一帝敷落飛天書高仙受天命正道祕清都洞章下玉京靈光煥八隅元尊示神變億天藏蘂珠故以常明金冶鍊貪愛徒神金眞化炁灌注度凡軀明明無濁汚玄精當不枯燿靈玉景源常照成空無巍巍大慈尊宣演開生符妙微上清旨眞悟合玄虛鍊炁登種民玉篇從此敷第三成道變化之歌百魔樂沉溺飛仙唯好生神炁常堅完三界無死生旣悟上清道與化相順成宴景常陽宮東井浥天津逍遙度剛風三垣朝帝尊茫茫大輪下俯世何營營一瞬爲虛空浩劫焉有程擕手誦大範素景永清澄運轉法輪綱變化通神靈東桑觀濯羅西崑眄長庚使爾見眞教靈府長虛明刻名玉眞檢削落酆泉名振衣淩太霄稽首虛皇庭此三界之上飛空之中飛仙歌音音參洞章誦之百遍名度南宮誦之千遍眞王保迎萬遍道備飛昇太空過度三界位登仙公有聞靈音魔王敬形敕制地祇侍衞送迎拔出地戸五苦八難七祖升遷永離冥關魂度朱陵受鍊更生是謂无量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈眞王隱祕之音發明至眞妙本生元大神雖因元始洞陽九鍊赤炁玄空眞火以爲明識覺了能知之體殊不知堅固不壞經劫不變今古常存湛然定觀全依無上清淨不動至大至剛眞金爲質能生能動木風爲助金風相耀遂成炎景洞然而明名曰純一妙靈之炁爲道之玄奥成立混沌生育三才無不由此兆若體之瑩我靈根以自神力徧無窮界仙靈鬼神人龍萬物自我陶鎔十方諸天不從外得皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奥難可尋詳上天所寶秘於玄都神霄玉清玉府東寶經室依科三萬七千年應運下傳若有至人齎金寶質心依舊格告盟道君然後而付焉道言夫天地運度否終日月五星虧盈至聖神人休否末學之夫疾傷此皆神炁內虧素金不靈故燿空有待則制殃衰凡有此災同炁皆當齊心修齋六時行香十徧轉經福德立降消諸不祥无量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太隂臨過之時同學至人爲其行香誦經十過以度屍形如法素景還復燿靈更明魂神徑上南宮隨其學功計日而得更生輪轉不滅便得神仙道言夫天地運終星宿錯度日月失昏四時失度陰陽不調國土生災水火風劫疾毒流行兆民死傷師友命過同學終亡皆當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受賴其福難勝故曰无量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衞右別至人克得爲聖君金闕之臣諸天記人功過毫分無失天中眞王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語无量音道君撰元始素景燿靈玉篇東方八天奎都出陌化揚入參霞虛激璘延謌沂涔萬竦柘宿淇華幾欽轉蘭彩望晨精典尋昭盈靈肆溢卜奚登擎莊荷露龍蚑捐沉靜佐亟道劉彬緒忱秷稂蕩卑里適逾金南方八天蓬整絕力赫難志外寅珞尤趣延需利瑾琢華透方儀奔汾郡哲疆仙稀珍異寔進燎灘盪虞色離弼應杳坤陳歆祕野桓定角聻敕戮陽山𦤺信風演孔雄厯帝充仭西方八天素景奠生紏都佳萌健納甲竺誓攻本神迮東獻威相妃蘄尊敬罷欽役奴軍總雲吉堂洄侶至戈鼎熒萬鑑獨持化師九成便良日辟斗往岡生浪恥達隨珪山啟兵北方八天闠程鋏遼景生系郎玄進紫玉投遠趣光董眞樞靈星侔箕羗遁履太幽北昆杳房庇夜軍利氐瑟齊邦度濳倚霞命旗洒藏桑碧螭首洞玄辭皇律躋魔丑臺止賓祥道言此諸天中大梵隱語无量之音舊文刻書玉臺西眞素景之堂以開三辰之光太一典經紫靈醮香元帝命神萬靈聿章目見口言神金流剛舉天承地使兆慧良總持冥機恍惚存亡鬼入神出變化無方帝之寶書豈世所聞字皆廣長一丈天眞皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣素景神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳魔王保舉上眞道備剋得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致素景下觀上帝遙唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅清河海靜默山嶽吞煙萬靈振伏招集羣仙天無氛穢地無祅塵冥慧洞清大量玄玄也

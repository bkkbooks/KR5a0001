front:
  text: 元始无量度人上品妙經元始洞玄靈寶本章素景燿靈上品妙首開天度人虛皇隱韻混合自然大洞元金空玄至眞堅剛明决神化彌綸不壞無染變境高清包含太虛內生九元無形眞妙道性靈玄元皇布炁肇立諸天剛風內鼓素燿外旋至陽凝質梵炁流泉結爲大器二象乃分開明素景是爲靈根上無復祖惟道爲身燿華流結普植神靈无上玉篇安鎭丹城無文不光無文不明無文不立無文不成無文不度無文不生是爲大梵天中之天鬱羅蕭峯金闕瓊山上極玄上大赤清源眇眇浩劫若亡若存三煇帝室大有黃庭瑤刃朱宮天眞玉房太素化炁同徧十方中有素景燿靈之眞中有南極九玄之君中有度世皇老大神中有太霄成妙眞人中有紫庭眞帝元素道君中有南昌定命司變主錄運化保鎭尊神回骸起死无量度人今日校錄諸天臨軒東方无極華林神王長生大聖无量度人南方无極赤文神王長生大聖无量度人西方无極帝符神王長生大聖无量度人北方无極元景神王長生大聖无量度人東北无極青精神王長生大聖无量度人東南无極圓珠神王長生大聖无量度人西南无極廣霞神王長生大聖无量度人西北無極金華神王長生大聖无量度人上方无極紫霄神王長生大聖无量度人下方无極靈都神王長生大聖无量度人十方素景燿靈神王長生度世无量大神並乘層雲金霄八景之輦玉輿羽軿素蓋飛輪驂駕九光神虎玄甲蒼龍建流金之節招靈大旛前列太玄寶仗後從三天化兵白鳳麒麟嘯歌噰噰七燿啟塗三眞翼轅億乘萬騎浮空而來傾光回駕召靈度生西崑上空瑤闕高仙九微太妙黃景元君執符把籙齊到帝前原兆生胎禀道以來業識念想纒思億𡨚汩亂素境燿靈翳昏神光正性曠劫冥頑元始洞火冶鍊純堅金華變體當爲眞人粗辱毀敗逐愛散分隨所應度嚴校神靈普告洞淵无極名山泉沙之嶽北闕寒庭神州五鎭十二溪源三河四瀆溟海咸池疾除罪簿落滅惡根不得留滯怠縱魔羣元始開化隨運升遷六天陰官拔度沉魂制玄監舉鍊度朱陵太清降炁仙變成眞生身受度劫劫長存隨劫輪轉與天齊年永度三塗五苦八難超淩三界逍遙上清上清之天天帝妙玄無色之境梵行

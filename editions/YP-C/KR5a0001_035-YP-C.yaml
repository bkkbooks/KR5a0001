body:
  text: 元始無量度人上品妙經元始洞玄靈寶本章九宮仙籍上品升降度人大經離合結氣自然玉洞紫文森羅景眞虛無至化流範成尊圓光分妙洪象飛根九宮育質帝一生身琳瑯廓落赤文化生奔天迴水三極玄津眇眇層關運空飛輪安陽紫微同歸帝宸是爲極變雲宮太霄鬱察神邱玉虛陽寥須延飛霞熒晶散飊劫仞元臺敷靈列曹數周綱維大運相交蕩蕩天闕經緯華城流爓泛境保天蔚明中有萬垣太帝之眞中有三官廣治之君中有九宮主籍之靈中有化周開導丈人中有二十七府百二十曹陰陽水火考校生死靈官大神敷𢎞至妙濟度天人遊觀太空護世長存上朝大羅下治泉扃總領北酆按察雲營神符告命玄詔奉行今日宣示諸天臨軒東方無極廣生神王長生大聖無量度人南方無極執範神王長生大聖無量度人西方無極司伐神王長生大聖無量度人北方無極普利神王長生大聖無量度人東北無極鎭極神王長生大聖無量度人東南無極運化神王長生大聖無量度人西南無極保經神王長生大聖無量度人西北無極玉輪神王長生大聖無量度人上方無極紫霄神王長生大聖無量度人下方無極黃闕神王長生大聖無量度人十方無極飛天神王長生度世無量大神並乘素雲飛輿浮光葆輦羽蓋飆輪驂駕朱虎神鳳金鸞建綠霞玄節翠燿華幢前導九天神印後仗伏魔信旛素靈秉鉞靑眞執麾神帥啟塗玄老主盟億乘萬騎浮空而來傾光回駕促氣召仙紫霄丞相太極上宮淸微治錄一品天官執簡捧籍齊會帝前隨所肇化開示諸天普告八冥浩蕩神闕混合之府七都九淵羅酆暗域寒刃冰山炎城火翳剛風九旋考功六司羣魔同宮激飆迅流劫運交衝九宮符命伏制妖凶威光下濟普赦罪魂升入福堂度品朱陵逍遙解脫眾苦咸原超生受化慶會因緣隨劫運轉與天齊年過度三災九厄之難永居上境遊行九淸九淸之天天帝洞文無色之境梵行東方八天玄利族延天帝澄源舒明釐豐隱華天帝慶百靈昭靈碧滁天帝略儀燿和晉師長齡天帝玩生無遺漳亭主仙天帝恪順預平明極迴眞天帝漠題甦英昧思純氣天帝定玄景監靜解應誠天帝隆欹皎淵南方八天皓明慶述天帝植秀友良炎華赤芒天帝託端承光鍊眞消魔天帝一求微藍寂度忘塵天帝謹悟濟靈鑑射玄天帝紹儀祕常太極校仙圓明正化天帝力彊捐赤岡飛霞鍊中天帝無待資宣靜常惠神天帝篤慶生西方八天鍾仙校錄天帝披沖薦光扶善紀功天帝都盈撩鄲西昌奉眞天帝辨世正開鬼靈隔犀除魔天帝鍊咸俞仝逸曦助爲號明天帝勃陽持雲張虛留契左神天帝諒眞召朞伯化救傷拯物天帝覺義通都司召靈天帝弼忠希恭北方八天宣陰布化天帝詢蒙若賖伏魔掌錄天帝正威奠明氣輪壘業天帝嶽昌祠宗昇眞進澄天帝輔東登華陶晶正思天帝穹嚴犂運龍直陽天帝烈江純思九宮典嶽天帝優圖訥庸順靈濟幽天帝呼成自康三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻天中之音天中之尊天中之神主錄眞魔仙籍玄靈九運十周變化杳冥無量隱妙廣不可量紀籍元眞和合天人功書玉籙升進飛宸今日玄關應體洞告無垠削落黑籍曲素高奔徊風上範超度弱淵大魔伏謁同揮玉軒東斗發生西斗執權北斗布澤南斗主遷中斗廣化攝御靈官靑帝降神白帝制氣赤帝育胎黑帝合志黃帝坐鎭統天大惠靑宮眞王碧羅定基赤宮眞王丹文耀開白宮眞王玉景蔚扉黑宮眞王紫素員微黃宮眞王金方化機五宮高靈萬天之尊飛行九垣總領天兵持幢秉節遊眄太冥神威赫奕與道交幷上天度人大憲流行元皇受命掃殄不祥石光交煥天令恢張玉馬奔馳巨獸銜岡炎精遐布封落靈鄉敢肆干犯束縛誅摧玄鉞左戮玉斧後夷除蕩怪魅殺伐祅蜚正大元極寶運同歸魔無干試邪無遁形九署列曹校錄鬼營不容怠縱天吏飛呈普告靈關羣眞仰聽三界十極咸使知聞靈書大策寶籙玄篇周化五常三氣推延太極布形晶燿綿綿混洞浩劫眇莽升遷六氣代交無極無邊上陳五斗下布九淵風包太空徊水騰天玉京植立太素九城峩峩琳房仙籍命眞翠霞蔚蕭散飆長庚凝爲山嶽流爲百川中藏上靈統領萬緣元綱流轉三界諸天包絡碧虛纏結生關旋紀度經回運極炎三十九帝統御四玄八治分眞氣合淵源皇中紫宸玉府絳霞宴景洞英吟嘯玄華金書蔚明虛泛雲宮玉謠鍊質神音散沖瓊關騫秀開導元功千運萬周自然成眞眞中有神天官大君紫微玉輔暘谷高尊嬰兒伯史太一千精總執玉符保奏生根上遊太虛出入圓羅玉山之岫蕭仞之阿下應人身五府靈河腦宮之戸方池百盈六洞回泉㮒質飛靑靑華九微開度天人上啟雲綱八門玉輪大福禁誥善惡因緣普獲濟度死魂生身身得受生上聞帝庭帝庭之上各有玄音中有九宮闢闔之章三元靈歌辭參高眞第一九宮羣仙飛空之音八明四虛包含九宮赤混高淸交羅太空八圓之上風澤之中洞合杳冥下鎭北酆三官統領中有至神執天大憲與道同功立以天帝主以玉眞妙化生育三十九君上輔元始浩劫稱尊出入有無飛遊玉京洞章下教萬天告行第二九宮仙籍之章紫瓊天策玉極眞科高眞隱諱上祕圓羅朱璧列名紫素三華飛仙列聖赤文煥霞玄金寶簡黃玉柔編總記羣眞帝心所銓太極玄宮校籍命仙憫彼世人逐物流遷魂升魄降沈淪九泉胡不登山詠此洞篇一悟至道身飛帝軒第三太極九宮歌曰太清九方回秀流雲總執天機開通杳冥碧山紫河玄微結鄰太微上府中有老人騰天隱道合景生身扇霄蔚羅朱光燿明天輪回運經變元成九淵包絡通道河津淸微帝一大洞靈尊默念契大有自然成至眞我歌九宮仙願同朝帝宸此三界之上飛空之中眞王歌音音參洞章誦之百遍名度南宮誦之千遍眞王保迎萬遍道備飛升九宮過度三界位登仙公有聞靈音魔王敬形敕制地祇侍衞送迎拔出地戶五苦八難七祖升遷永離北山魂度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及九宮仙籍隱祕之音內有九眞雄一雌一眞諱仙聖內名誦詠之者刻書太極證位九宮腦中有紫房眞神列坐向外聞此經聲上參太極下應洞響九宮之神告兆仙期也皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寶祕於高上神霄玉淸玉府東臺寶藏依科三萬七千年隨運下傳若有至人齎金寶質心依舊格告盟九宮然後而付焉道言夫天地運度否終日月五星虧盈至聖神人休否末學之夫疾傷凡有此災同氣皆當齊心修齋六時行香十遍轉經福德立降消諸不祥無量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太陰臨過之時同學至人爲其行香誦經十過以度屍形如法則玉華帝妃執火炬以滅陰邪雲儀玉女擊天磬於腦宮于是百神混合九光之精入塡泥丸返其所始魂神徑上南宮隨其學功計日而得更生轉輪不滅便得神仙道言夫天地運終星宿錯度日月翳昏四時失度陰陽不調國境生災疫毒流行兆民死傷師友命過同學罹殃皆當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衞右別至人克得爲聖君金闕之臣諸天記人功過毫分無失天中眞王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君撰元始靈書九宮仙籍諸眞寶諱首篇東方八天戛圖元鈴流體射回恍濡咸泰周漿明垂爓龍疋芻斗江頻雷仰斷鴻極招仙納暉演莆寂著空蒙華催都瑤審涂洽玄壁刀察陳澡珂祕來發深辨薈祈蔚壯卑茂彬南方八天赫那提都明邀診彥荒度覺攸璣標暄煥仗掌雲籍曾湍游旻曜勤祝慈邊溏氣司駢胡耿池晶圭薄微摘卓鄙消幽羅菅屍靜立冥洑揚華激彌滻雲驛童豐佐畢龜西方八天燎梵諸照環光秫羅邀兵無形堆逵輳圍應道洛馘周蒙宛毗屹左遊縛朱幷丙持渺但洞澤僕幽楮奚亮愬祖穆由汾淇眞獨綿閣韓夷虛角張密變兹斐瓊迅時機北方八天叱麓擎蔽吟時陸絳海碧岨希幽烱梅逸躍便燭錫光瑤陀欽載更驅每官元師救漯壘嶽堅風育悲族蕩萃遠淑丕在丹陽輔葛則厭車橫鱗處滅生久關盤泊嬰道言此諸天中大梵隱語無量之音舊文刻書太極九宮崇墉之上以詔未度至學之士神棲九宮氣抱太極參味隱韻則錄名仙籍上遊太玄策登左元字皆廣長一丈天眞皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣太極右卿下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳眞王保舉九宮道備克得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致太極下觀上帝遙唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅淸河海靜默山嶽吞煙萬靈振伏招集羣仙天無氛穢地無祅塵冥慧洞淸大量玄玄也角集七音釋赬音檉畹音宛田二十畝也皛音檄帟音亦帳也𩴹劬音藟縟音辱飾也縝音嗔黑也翬音煇羽聲也魒音飃星名莬音問草木新生也嶼胥上聲島也音陽窊音霔揇南上聲搦也㖟音授口㖟也薾音爾華盛也璩音渠環屬𦅌音騰鬐音耆馬𩯡也蘤音蔿花榮也音部噩音萼驚也腃音喟音珉和也㛹音楩便平聲杅音于飮水器敔音語禁也䙕音竦襌衣也滁音除水名撩音聊水名蜚音屝虫名㮒然上聲洑音伏洄流也滻音産水名音耶岨音砠

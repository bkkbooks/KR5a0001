front:
  text: 重刊道藏輯要元始无量度人上品妙經卷之四十一
  hash: sha256:261668bc895c70fc621367088d5221e3c674680ccfa9eaa4b12dc6f81021c7a7
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_YP-C_02kangji-01-0089b, image: JY001/02kangji-01-0089b.png}
body:
  text: 五行備足生靈壽域品道言昔於大羅浮光天中妙安飛眞大善極土受元始度人五行備足生靈壽域无量上品元始天尊當說是經周囘十過以召十方始當詣座天眞大神上聖高尊妙行眞人無鞅數眾乘空而來紫烟散景流雲交映仙歌合奏神風靜籟絳車彩蓋寶綱瓊軒三素玉光九華窈窕洞煥太空七日七夜諸天宮殿日觀月扉星綱舍次斗宿經躔璇璣玉衡泊然停景神烟散藹山海藏雲天無浮氣八景明淸一國地土山川林木緬平一等無復高下土皆作紺玉無有異色丹彩靑明涵影轉照眾眞侍座元始天尊玄坐空浮五色獅子之上說經一徧諸天大聖同時稱善是時一國男女安壽超逸五行之氣大備大足無有傷殘說經二徧慶雲昭瑞惠露敷空說經三徧萬寶呈祥五行昌順說經四徧神鍊心通民無疾病說經五徧天霐寶蓮眞仙化立說經六徧玉嬰空歌音參大洞說經七徧九幽息對水火分源說經八徧眞符宣宥幽顯霑恩說經九徧萬神迎光混生帝一說經十徧朽骸重起靈運成人是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一徧東方无極无量品顯仁大神無鞅之眾浮空而至說經二徧南方无極无量品威化大神無鞅之眾浮空而至說經三徧西方无極无量品周覽大神無鞅之眾浮空而至說經四徧北方无極无量品收攝大神無鞅之眾浮空而至說經五徧東北无極无量品定志大神無鞅之眾浮空而至說經六徧東南无極无量品普振大神無鞅之眾浮空而至說經七徧西南无極无量品保安大神無鞅之眾浮空而至說經八徧西北无極无量品正氣大神無鞅之眾浮空而至說經九徧上方无極无量品元光大神無鞅之眾浮空而至說經十徧下方无極无量品妙靈大神無鞅之眾浮空而至十徧周竟十方无極天眞大神一時同至一國男女傾心歸仰來者有如細雨泛空合沓駢至無鞅之眾迮國一半土皆偏䧟非可禁止於是元始運神眞境聚萬八千天十方國土九地幽泉團成一珠大如黍米在空玄之中去地百丈元始登引天眞大神上聖高尊妙行眞人十方无極五方備足至眞大神無鞅數眾俱入寶珠之中天人仰看惟見勃勃從珠口中入旣入珠口不知所在國人廓散地還平正無復欹䧟元始卽於寶珠之內十方國土無鞅數眾天人仙聖一切鬼神之中普告大眾曰五行備足生靈壽域者爲天地之終極大道之要妙自非上聖不得而明五行者三才之神用至眞之靈藴風熱燥濕寒爲天之五行木火土金水爲地之五行喜怒思憂恐爲人之五行生長化收藏爲四時之五行周天氣者六期爲一備終地紀者五歲爲一足五行備足則氣運平正氣運平正人無夭傷各得全其天年至學之士抑勝助衰使正氣長存無太過不及之患則長生神仙久視無窮得安壽域域者限畛軫封際之義數之終始五六相合而七百二十氣爲一紀凡三十歳千四百四十氣六十歳爲一周不及太過則非備足所謂備足正宮正徵爲備足少宮少徵卽非備足五行平正則陰陽無剋賊之患陽法順施長生不死變化返覆出生入死入死出生羽化神仙與道合體上爲眞人說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸行善心無爲無事無爭無欲無貪無起無滅無思無得無隨言無唱物口無邪聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是魔王內諱百靈之隱名也非世之常辭上聖已成眞人五行備足壽限無極通玄究微能悉其章誦之十過諸天遙唱萬帝設禮河海靜默山嶽藏雲日月停景璇璣不行羣魔束形鬼精滅爽迴屍起死白骨成人五星之精感降身形運備氣足生道永固紫脈纏腦赤筋霜髓枯朽更還至學之士誦之十過則五帝侍衞三界稽首魔精喪眼鬼祅滅爽濟度垂死絶而得生所以爾者學士知五氣之用補缺平勝續絶延生運極化源知生之幾得道之本雖備未足穢氣未消體未洞眞召制十方威未制天政德可伏御地祇束縛魔靈但卻死而已不能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到億曾萬祖幽魂苦爽皆卽受度上昇朱宮格皆九年受化更生得爲貴人五行備足數極於九九變爲一一變於九無過不及大小齊等則金木運和水火合德土之一氣遊行其中固此四象幽魂苦爽以洞文玄要而得受鍊備足之氣九年登眞受化生成而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經皆卽受度飛昇南宮南宮爲六氣五運之天非其位則邪當其位則正五行備足得昇南宮朱陵之府降正眞之氣入身得仙世人受誦則延壽長年備則不乏足則不極一切生靈能盡此道則壽域定算後皆得作尸解之道魂神暫滅不經地獄卽得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月修齋誦詠是經九氣發生爲上世亡魂斷地逮役度上南宮四月修齋誦詠是經三氣養育萬物滋榮眷屬宗親皆獲長年七月修齋誦詠是經七氣收歛萬寶結成以濟兆民身得神仙諸天書名黃籙白簡削死上生十月修齋誦詠是經五氣安鎭福歸人君國祚綿長永保太平四季吉日誦詠是經一氣和貞永斷剋害消滅瘟疫使生民安泰境土樂康位爲九宮眞人離合之日誦詠是經天道澄淸大地安甯心契至眞克獲飛昇魂神澄正萬炁長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上淸道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐靑黃白三色雲氣之中內外蓊冥有木九火三土一金七水五二十五眞侍衞左右日月照明五星煇燿項生圓象光映十方如此分明密咒曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啟所言今日吉慶長齋淸堂修行至經無量度人願所啟上徹徑御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始無量度人上品妙經元始洞玄靈寶本章五行備足生靈壽域十囘度人六氣五運合會飛昇太虛寥廓肇立元根神靈浮景大化生音三玄降鍊無象無形八垣舒光陰復陽明剛柔相勝皇道乃旋玉機飛輪流演萬天丹煇晶瑩正炁綿綿太玄帝一開生御圖皇上素燿普受眞符靑簡綠字鳳紐靈書七神啟煇備足五行經緯交絡輪轉四虛巍巍玄景萬聖之居中有廣霞校錄之君中有長離應運之尊中有麗陰仙鍊之眞中有鬱單變氣丈人中有崑崙閬風司執元化統御萬道延壽尊神浮霄鎭嶽無量度人今日敷教諸天臨軒東方无極開生神王長生大聖无量度人南方无極化育神王長生大聖无量度人西方无極玄變神王長生大聖无量度人北方无極持德神王長生大聖无量度人東北无極隱妙神王長生大聖无量度人東南无極泰幽神王長生大聖无量度人西南无極沖氣神王長生大聖无量度人西北无極合道神王長生大聖无量度人上方无極廣運神王長生大聖无量度人下方无極定鎭神王長生大聖无量度人十方至眞立極神王長生度世无量大神並乘流飈翠車華輦紫蓋飛輪驂駕龍虎道從風雲建丹光之節靈鳳黃旗左列九天寶器右陳八景眞文神印朱符收攝萬祅天綱前驅七元後從四極十華讚詠而來天經明燿召靈度仙鬱單翊相大洞高眞靑華上佐萬始先生總領圖籍來詣帝軒隨劫開建嚴校五行持紐運機使氣無傾大劫交周同會河源促召鳥毋役御蛟龍陀丘億眾下守崑山灌注東井通導水津洪波浩蕩風淵九重數殆百六陰極歸陽金玉化銷六合冥冥五常返復水火推遷延康旣往蕩穢除姦高仙下降拔度種民長安太虛遊宴上玄赤光開圖三象復明吾憫羣類乃降玉章以命五老安鎭長存茫茫萬有統以三官生正五嶽上列五神元和備足形具乃生受道眞妙皆獲長年永斷勝伏剋傷之數逍遙朱宮飛天太丹太丹之天天帝圓羅混合之境梵行東方八天太豫玉微天帝韞慈時明朱英蕣蘤天帝浮煇元霄惠佑太和天帝崿都仇瀾至正廓常天帝栢閑覩生寥霽散神天帝肇敷蒙儲徧景耀華天帝求時衍彊樂淵鏡皇天帝超度幽明皓煇慶名天帝總監韓司南方八天洞覺合帝天帝虛陳妙依玉元澄至天帝景伯孫梵光靜眞天帝泰初止騫照理極炎天帝盧神管魂九帝辨宗天帝陰君密通太丹沖基天帝鬼祖登逸用變神天帝嶽靈轉蹊藏氣化仙天帝領眞監西方八天大委顯光天帝素明燿羅紫宸大元天帝子竇窈門夜光含液天帝朱華正幾感穴凝金天帝瓊池祥延麗澤正肅天帝鬼化奇都玉瀾麗初天帝皛齊演山崇仁振幽天帝魂度陵照胎化眞天帝蕩元伯康北方八天太上眞化天帝絳氣玉華造遠揚天帝重明仙軫翼司赫天帝鍊神超雲直泉閱崇天帝黎松淨空燕和納嘉天帝宗冥祈修淵光元淨天帝四登朗期瓊聖紫霄天帝無常居洞波混溟天帝震厯五輪三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻天中之音天中之尊天中之神天中大魔天中之靈八遷四纏合并太淸玄運之度變化有常流演三華普育生民升騰兩曜灌鍊五行正綱執紀以化萬靈使氣備足壽域無傾七九相結大小相交大輪運化經緯幽寥周還四精囘度扶搖天開地闢梵炁流焱五神飛光萬類肇形離坎化眞咸契生成丹靈玄仞蒼宮浩淸今日欣慶建立三景騰煇鎭安地紐旋斡天維超昇玉闕位列太微大魔監察明啟元機歲星守肝太白檢肺熒惑正心辰燿輔腎鎭星定脾布天威令始老發生皇老保命眞老降氣玄老開性元老四據萬境以正九氣仙王總校圖籙三炁仙王攝御養育七氣仙王司執殺伐五氣仙王肅淸蕩滌一氣仙王坐鎭天闕五方上眞化天稱尊飛行八極總領神兵爲道元輔持握四溟遏絶邪源除蕩妖氛威光下濟周徧十方雷電爭激風火施張萬彚保安道化甯康息澄眞固並獲長生恢宣大範告命普聞五神協慶列象文明大殺豁落陰斗書名攝召六天考校雲營百邪摧伏氣合眞仙炎精振威淵燿持權生靈安泰壽域永延元始符告勅命天官不容隱遏開導冥關幽沉羣類俱遂昇遷三元上佐列奏上玄開天御厯龍燿剛風黃素敷眞太合玄空上輪元斗下立靈宮飛神化育梵炁成文渺渺洞泉無極冥冥天闕運轉群品流形元造億劫溟涬鴻濛赤光啟明混洞沖融泰淸遼邈杳杳無窮靈寶設象萬化之宗太微九道皇極彌隆上元浩立大洞玉篇三十九皇赤書寶章普植百神永鎭十方常安太虛正憲宣揚儀璘執試萬景舒光玄綱調攝位列高眞眞中上靈金闕輔臣揮霞紫房御氣太霄流音景延合範淸謠雲營定質炎方扇飊鬱察圓羅召命玉宸玉宸降氣自然化生生道妙微徊風帝尊雄一元父雌一元君混結交變成育五行五行御運六氣迭興素精金華萬和成仙靈威洞照明煥九天眞光下濟開闢幽關太陰曹局黃闕洞淵秉道威令勅告九官九官列奏上聞諸天考校罪福宿命因緣不得差忒戒教明宣普受開度咸獲升遷遷升太極書名玉京玉京之上各有生門中有五行空洞之音魔王靈章辭參高眞第一飛仙讚歎五行備足之音元始開圖生育陰陽二象旣成七燿飛光沖和布靈萬物無傷安鎭五山地久天長至覺體道與氣合并水火升降光照華京上下往來流運胎津百神混結徊風返生飛行玉闕坐觀十方採集雙華灌鍊黃房五行備足保天無傾役使百魔我道澄淸第二眞人吟詠生靈壽域之章龍漢眇眇回度三華降生靈兮受氣鬱羅茫茫貪欲沈溺愛河浩劫迷所趣安能出輪迴大魔攝汝形遊魂逐氣歸旣已背正道受生知何依汨没三途中空使天仙悲豈知造化心均壽何有期十部洞玄篇以爲登眞基一悟長生道靈府廓爾開運身入太虛合體皆仙飛第三高眞宣示超出五行成道歌曰嵳峩鬱察山玉宸誕茲嶽託靈洪氏胞幽棲經億劫得遇虛皇尊開演靈寶法鎭天永不傾怡然坐金闕濟度無量眾降神居斗極把握天地機經緯環拱立素靈秉朱旛靑皇建金鉞逍遙度赤光玉文當一出羣品之有生五行皆備足數極反歸無誰能定生滅學眞諸仙民胡不奔日月一誦飛天書大劫可超脫遊宴無何鄉億天歡且悅此三界之上飛空之中仙眞歌音音參洞章誦之百徧名度南宮誦之千徧魔王保迎萬徧道備飛昇太空過度三界位登仙公有聞靈音魔王敬形勅制地祇侍衞送迎拔出地戸五苦八難七祖昇遷永離鬼官魂度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈魔王隱祕之音皆是調制五行不相剋伐運備氣足招降和氣使生靈之命補斷續絶生生不窮福祉薦至壽域綿遠元始飛玄之氣結爲洞章大梵之言非世上常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寶祕於玄都紫微上宮依玄科四萬劫一傳若有至人齎金寶質心依舊格告盟十天然後而付焉道言夫天地運度否終日月五星虧盈至聖神人休否末學之夫疾傷皆非五行備足故爲災殃凡有此烖同氣皆當齊心修齋六時行香十徧轉經福德立降消諸不祥無量之文普度無窮道言夫末學道淺或以仙品未充運應滅度身經太陰五行之氣未備未足金木盜精水火伐氣土潰金鎔神爲之遷臨過之時同學至人爲其行香誦經十過以度屍形如法則五星氣協神精完滿備足之運還生於身魂神徑上南宮隨其學功計日而得更生輪轉不惑便得神仙道言夫天地運終星宿錯度日月失昏四時失度陰陽不調國境災癘兵氣犯斗疫毒流行兆民死傷師友命過同學殞逝皆五運大小之殊履非其道乖備足之福亦當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衞右別至人剋得爲聖君金闕之臣諸天記人功過毫分無失天中魔王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君撰元始靈書中篇東方八天玄密珠穴洞杳霞津機運水火龍浮妙梵混合神眞無英華紳白元錦裯帝一虎中素景囘黃散房成雲雄雌氣溢五露𦆯紛儀璘交煥中池帝君朱衣碧冠紫煙四屯南方八天生命固壽五老乘崑飛光漸海金液沄沄羅阿重冥寥無太宸倐忽萬化靈根自新愼諱天禁得知寸深郁玄上都瓊祁蕭森蹈白履虛鳳譙寶輪玄智神停生死流塵西方八天守不知知至道冥冥離邊去思神霄有門端待至空空爲生尊神運意鑪三一常明玉書寶章大梵岡輪結閑勿露自然成眞眞魔鬼帥走檄驅氛備運足數生靈保身北方八天壽實天福納錫種民九韶法纓叵濫無求攬綠泛景浮霐洛臺育蓋竺萌日導月付變質龍靈東薈南閻靜省玄評昊莽迷度那韓上京奏錄度楫元皇眇浼恢澤輔忱道言此諸天中大梵隱語無量之音舊文五老上帝刻書五星玉闕以正分度降備足之氣壽彼生靈字皆廣長一丈天眞皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳魔王保舉高眞道備尅得遊行三界升入金門此音無所不辟無不所禳無所不度無所不成天眞自然之音也故誦之致飛天下觀上帝遙唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅淸河海靜默山嶽吞煙萬靈振伏招集羣仙天無氛穢地無祅塵冥慧洞淸大量玄玄也

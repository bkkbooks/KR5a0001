body:
  text: 東方八天濟魂逸慶天帝扈迪狂曜澤證玄天帝梵聿斯平流剛昇陽天帝振祖流光梵氣舉神天帝尸眞化魂蕭臺校錄天帝拔苦尊祖猷徽緒天帝道玄巨英麗慈變生天帝敷承庸光道用超神天帝伯常妙沖南方八天紫暉洞明天帝覺善自伸玉宸慈化天帝退坂靑輿正宗玄露天帝定意須光初嬰育靈天帝判載司强佐無肇宗天帝嚇陳元防鵲史利眞天帝侯進斗光冥超生魂天帝妙智仙祖靈增變天帝勞提丙顓西方八天蠙棣益司天帝常容眞果成超衢天帝儀慈壽均瑛觀紫虛天帝韓承詡言溢靈慶彰天帝蹈方滋苹朱霞淇至天帝海暾總陽黨峻悅疆天帝孟勤禮冥度生昇魂天帝招雲鍊玄魁符考嶽天帝覺上生北方八天玉頤淨覩天帝柳昴順玄機牛亢化天帝耀洞觀周育乾次甯天帝顯道離田昭本神華天帝絶憇斯仁玄龍史墟天帝太完子賢仙斗迎祺天帝昭迪用寥朝瑞玉幘天帝伯緒遠康庸濟魂天帝常元隱公三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻開度之音開度之尊鍊化之神天中大魔玉淸之靈混合變化而成上眞無量之奥深不可詳敷落神篇濟度窮魂今日欣慶受度厯關諸天請滅三惡斬絶地根飛度五陰名昇太淸眞王監舉無拘天門東斗受性西斗結形北斗保命南斗超昇中斗大魁總御生成靑帝通眞白帝衞靈赤帝運化黑帝結神黃帝養育萬善咸臻九竅四體悉獲生全靑天魔王巴元醜伯赤天魔王負天擔石白天魔王反山六目黑天魔王監醜朗馥黃天魔王橫天擔力五帝大魔萬神之宗飛行鼓從總統神兵麾幢震節八道揚威遊觀天地開度死魂自號赫奕功用無窮啓運生津嚴攝北酆靈眞受命普掃不祥神龍吐毒驎騎騰驤天吏持麾蕩化不祥擲火萬里流鈴八衝敢有干試拒遏上眞金鉞前戮巨戈後刑制令鬼爽咸得昇遷𡨚愆和會盡獲釋形魔無干犯鬼無祅精三官北酆明檢鬼營不得容隱金馬驛程普告無窮萬神咸聽三界五帝列言上淸洞虛妙化海嶽河源中有冥關幽閉罪魂冥冥眇眇億劫長昏上無天光下無所安風刀亂施哀聲塞空惟有元皇太一之尊普施慈惠神力自然拔除罪苦敷落靈篇赤書玉字無上眞文超度魂爽使入生門梵氣彌羅萬形開張元綱流演三十二天輪轉無色周迴十方普被玄恩皆得升遷八景和合氣入高玄玄中太皇上帝高眞泛景太霄嘯詠洞章金眞明郁流響雲營玉音攝氣靈風聚魂紫虛鬱秀輔翼萬仙千和萬合自然成眞眞中有神長生大君無英公子白元尊神鍊化生死拔兆屍形太一司命攝氣還神桃康合延三一帝尊執符把籙保命生根上遊上淸出入華房八冥之內細微之中下鎭人身泥丸絳宮中理五氣混合百神十轉回靈萬氣齊仙仙道貴生無量度人上開八門飛天法輪罪福禁戒宿命因緣普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有空洞謠歌之章眞王靈篇辭參高眞第一度魂欲界飛空之音人道易墮塵心苦神神勞散逝杳杳沈魂魂爽何所覺忽爾離軀形形化爲劫灰魂魄歸無因默默有舊憶索索忘其親舉目無三光栖栖誰所鄰鬼官肆酷毒鞭撻常無停隊仵如驅羊渺渺沒冥津鐵獄常燒然惡烟起繽紛積骸若邱山涕泗如河傾經劫罪業纏死魂悲酸辛神霄玉淸王出書度天人元始靈寶符超化能生神第二昇玄色界眞王之章絳闕南昌景燿煇煌萬神之家生化之門中有長生大帝紫君碧羽龍衣飛靑紫裙手執黃籙靈寶上篇校功玉軒昇度死魂魂氣受鍊結植靈根神眞運度隨陽化升昇玄契妙水激火焚炎炎流池玉虹萬鱗跨池爲橋金光橫奔無上七元九幽罪魂銜領符命超昇化輪乘雲馭風與天相傾第三變化示體無色界眞王歌曰三天上境元皇妙宮迴超三界鬱鬱靈光中有大神號曰眞王設化開度萬道之宗元始上帝錫命靈篇普告下司罪苦昇遷破蕩冥暗普現光明滅除禍害永植福根生死受度仰承玄恩冥曹解散慶會長亨威化所被敢有不從玉符保鍊晏眄劫年上無色景與道同玄碧空圓羅億劫自然此三界之上飛空之中眞王歌音音參洞章誦之百遍名度南宮誦之千遍魔王保迎萬遍道備飛昇太空過度三界位登仙公有聞靈音魔王敬形勅制地祇侍衞送迎拔出地戸五苦八難七祖昇遷永離鬼官魂度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及神霄眞王隱祕之音鍊度死魂超登上遷天壽九劫罪愆𡨚仇俱䝉和釋理極奥妙皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寶祕於神府靑琳寶藏依玄科應運下傳若有至人齎信效盟質心依舊格告盟三天然後而付焉道言夫天地育形至道生神形爲靈宅神爲元靈神風鼓鍊天與其生生迷道本纏著罪緣疑網癡獄貪念爲愆境物亂心思慮攻神精喪氣謝形軀敗昏五臟內腐七情外奔神宅喪壞神去離形沈淪幽苦爲業所牽善者生天惡䧟酆泉死魂所賴至道宣慈靈文濟度眞符捧持冥官拜首眞吏咸依大梵之宗元眞是栖同氣皆當齊心修齋六時行香十遍轉經福德立降魂升天堂無量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太陰臨過之時同學至人爲其行香誦經十過以度屍形如法魂神徑上南宮隨其學功計日而得更生轉輪不惑便得神仙道言夫至學之士修誦上淸三洞寶文專持戒籙幽栖山澤淸虛忘世或積德行陰功及物父母師長去世之日欲濟度死魂使超登洞臺列名仙階者當以五香鍊湯沐浴屍魂以靑繒朱書元始靈文一十二符布著玄宮之內一形上下謂以臥符枕上符面上符兩手符兩足履中符安心前符槨四面符凡十二道焚香北向書訖安時咒曰道民王甲生奉仙眞運終鍊化形歸太陰上帝神符赤書玉文濟度死魂速付玉眞飛昇天堂刻簡仙名骨成蘭玉面有金英太一守屍三官衞靈忽然輕舉上登太淸土下大殺屍鬼百精敢干神符亂甲神明天丁把斧斬汝五形山澤水火風氣至眞護完甲屍返生還魂北帝驚咤落甲死名飛雲玉輿朝謁紫庭急急如律令行符訖更當修齋行香誦經夫齋戒誦經功德甚重魂爽飛化享福生形下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能爲王公侯伯兆民行是功德濟度之日發心修齋燒香誦經十過皆諸天記名萬神侍衞右別至人尅得爲聖君金闕之臣諸天記人功過毫分無失天中眞王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君撰元始靈書度魂中篇東方八天英曜斗極領帝都關運推息數水火流根生道禀玄聽天自然解掖蛻謝魂禧雙羅圓體用神曲阿明伸惒眞普玉慶雲門臻梵遷靈易魂度八極素華應厯符行昴畢南方八天鍊眸玉庭籍檢女侯勘𧷤有爽度昇昌都機保怍塵赴謨皇猷辜原升府名曹奏智璽選宰童魔化悉旣玄應大察冥拘寒池爍流瓊傳變合谷養救釋靈幹柏庸被經西方八天蹄陽隔樗卷烈飛野黥截鬼筵由庭軒庚符傳龍殿悔昔平涓生合神廬兆互成人穴液聚纏果溶圍身略靖司化巡祇輔眞陷錮兵旄井席相均演由欽觀滔輪鼓軿北方八天棄蚓乞魚勿頻懶蘇詔逸靜王慈并比圖虐古韓鎖婁移舌昧罶詛委奪默元衙沄綽辨鄙齊淵古靈回猖无慶育勅珞資俞强奎翳斗龍呼吳求左將魁酉變生遊嘉道言此諸天中大梵隱語無量之音舊文書玄天北靈玉闕之上以正北山酆泉鬼獄禁制九都大鬼濟度死魂生化福鄉神智逍遙字皆廣長一丈天眞皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣察錄神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳眞王保舉洞玄道備尅得遊行三界昇入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致神王下觀上帝遙唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅淸河海靜默山嶽吞烟萬靈振伏招集群仙天無氛穢地無祅塵冥慧洞淸大量玄玄也元始無量度人上品妙經卷之五十七解釋幽牢品道言昔於始靑天中碧落空歌大浮黎土受元始度人解釋幽牢妙品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖高尊妙行眞人十方救苦天尊玉淸雲宮大慈天尊大悲眞帝酆都九幽帝主仙官無鞅數眾乘空而來十方起雲混如丹色瓊臺寶宇隱顯太空玉馬金龍驂霞泛景飛光鳳蓋垂蔭珠軿瑞彩天光流煥四極蓊鬱淵映明徹碧空七日七夜紅霞搖曳遠羃神鄉天都紫微層影洞燿丹殿星宮瓊堂日闕珠緯躔虛玉綱流演紫烟紛華山海凝碧瑞金爲界色雲合防淸靜聖途明無纎玷眾眞侍座元始天尊玄坐空浮八山九海伏龍翔虎十極太玄之座說經一遍天帝鼓節高眞洞詠是時一國重冥陰域一時光明說經二遍地下重壘三十六皇俯伏恭聽簡閱皇籍說經三遍氣流甘濡灑潤枯朽說經四遍殺鬼滅爽魔眾失聲說經五遍地吐芝英八十一種赬蒼秀異奇文燕胎說經六遍酆山震搖黑海停沸說經七遍九幽地獄萬里鐵城業火熾然億劫洞赤說經之際毒勢氷消炎牢淸蕩說經八遍靈霞布空九色成字眞文廓現赦諸罪人說經九遍暗氣凝雲傷血隕雨聞經穢淨神風掃塵說經十遍屍骨歘起靈顏鮮瑩自然成人是時一國是男是女悟道知眞胞結解釋冥關錄籍字迹除脫素幅鍊章了無罪目歸嚮天尊咸遂生養道言是時元始天尊說經一遍東方無極無量品大慈九氣救苦天君無鞅之眾浮空而至說經二遍南方無極無量品大智三氣赦罪天君無鞅之眾浮空而至說經三遍西方無極無量品大明七氣執法天君無鞅之眾浮空而至說經四遍北方無極無量品大惠一氣息苦天君無鞅之眾浮空而至說經五遍東北無極無量品大悲梵氣破獄天君無鞅之眾浮空而至說經六遍東南無極無量品除過梵氣九幽天君無鞅之眾浮空而至說經七遍西南無極無量品大心梵氣拔罪天君無鞅之眾浮空而至說經八遍西北無極無量品大仁梵氣玉匱天君無鞅之眾浮空而至說經九遍上方無極無量品普濟一十二氣萬福天君無鞅之眾浮空而至說經十遍下方無極無量品不動五氣玄母天君無鞅之眾浮空而至十遍周竟十方無極天眞大神無量天君一時同至一國男女傾心歸仰咸荷慈恩下逮淪亡俱霑聖澤感嘆之聲響動幽夜鳥獸悲嘷人鬼悵惋來者有如沙塵飄委嚮風傾注於是元始遍視羣生彈指微笑金口發光光如皎月上極無上剛風頂際下極水輪泉曲九漏無底陰谷無不照見一一光中皆現三界眾生善惡命根宿報新緣互相酬對業果自明心目同證此光旋行暈成五色下覆人間上接天境運如輕車灼灼圓象逡巡九道狀如日出東䝉十方同色去地五丈炯爍停空元始登引天眞大神上聖高尊妙行眞人十方無極救苦天君至眞大神無鞅數眾俱入九色圓象之中天人仰看惟見拂拂從圓光中入旣入光中不知所在國人廓散境宇如初元始卽於九色圓象之中說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂無遺響是時天人遇值經法普得濟度解釋幽牢無有橫傷傾土歸仰幽顯披心不怨不憎不執不滯不著不愛不害不欺不𡨚不爭言必諧理口有和聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是魔王內諱百靈之隱名也非世之常辭上聖已成眞人通玄究微能悉其章誦之十過則諸天遙唱九幽啓關冥海靜默業山傾摧光徹幽夜積劫累代縲繫鬼都籍在三官朽骸積屍魂魄囚考黑氣腥腐破膽裂腦火山氷池焚爍烹瀆以萬計期無有晝夜聞此玉文天眞靈篇則太一錄魂南丹鍊神神還識明捨妄歸眞鬱結𡨚負應時淸明太和眞氣入其身形蓮花捧履龍瑞扶顏與天人樂大魔伺迎至學之士誦之十過則岱宗凛命紂絶凛恭此君奉書陰曹削名泥丸玄堂七祖故氣氤氲未開內構胎血百節蟲官骨中注吏地虎風獸啖骸食氣之鬼守禦泉府銅犬火蛇之神惡烟四激窮魂芒昧神官切齒百里洋鑊千尋鐵壘不見三辰詎曉道境眞知沈淪罪根駢委牽連生人追呼族緒冡宅之訟誣告天司冥漠無所一時萬死痛毒終天聞此洞篇魔帥弭節黑帝停軒往劫古爽近世苦魂道力陶冶變酷消仇玉厯定科紫雲覆座神風調逸墮魄飛昇死戸無拘逍遙三界輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙利樂幽靈度人無量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到億曾萬祖幽魂苦爽皆卽受度上昇朱宮格皆九年受化更生得爲貴人而有億劫結魂千載滯爽太上不以聞宥上帝不以恩原禁獄幽牢在女靑天一王平女沙九陰大禁都司檢形五老校錄暗黲芒窕之穴毒風醜類藴墮四瀆海閭枯削寒丁大魔勅制之魅誦此洞章歘然自生光梵變玄屍胔得度與神同昇洗除罪咎靑籙紀名刺姧司非不得鼓蝟鋒之斷筆韓君丈人將折簡於螭笈是皆玄司九幽酆泉之重刑此經解釋渙爾泮散而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經節關開通胎眞明正洞陰一府六峯遊精隨氣變化與時出入或感人呼吸流毒飮食因蒭梗以兆體假冥漠以潛靈九府捕索三官定書經道至神皆卽受度飛昇南宮世人受誦誠貫十天幽牢苦爽祖世親緣紀過泰山刋名北都皆得鍊質丹陵瑩魂炎海誦聲成雲載此冥魄逍遙太无過度輪轉不經生死奉行之者則延壽長年後皆得作屍解之道魂神暫滅不住地獄卽得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死䝉惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經爲上世亡魂斷地逮役度上南宮詣三元洞宮主生太陽火官焚除罪簿赦免吞火食炭洋銅沸鑊銅柱鐵床燒烹炮烙眾苦之罰經道神力變成淸池獄具惡器悉爲蓮花七月長齋誦詠是經爲上世亡魂祖考宗姻昇遷鍊化削滅罪緣慶流孫曾詣三元洞宮主死太陰水官漂蕩刑書滌濯元釁淨除溟波海瀆没溺寒夜冰池雷震霹靂泉曲徒役絞水暴注湍激驚濤眾苦之罰經道神力變成安室獄具惡器悉爲樂玩十月長齋誦詠是經爲上世亡魂姑妣娣姒往逝婦姬解斷徴呼復連傳逮詣三元洞宮主生死罪錄官釋放考掠訊訟簿錄證佐對定冤仇銜負悔恨喑鳴追召眾苦之罰經道神力變成德友獄具惡器悉爲珍寶八節之日誦詠是經奉詣九宮直符九府直事八方大獄九幽泉牢開通八門受生八道天人鬼神地獄餓鬼畜生魔帥祅魅出離禁獄各乘生功度脫九幽爲大施者本命之日誦詠是經爲北斗司命司錄主非典禁命在斗宮計年期月追召生魂上詣斗宮校定罪福度脫三災四殺五苦六害七傷八難九厄十極事在三元考官冥曹譴謫眾苦之罰經道神力不有害傷魂神澄正萬炁長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上淸道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐靑黃白三色雲氣之中內外蓊冥有靑龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室內項生圓象光映十方如此分明密咒曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啟所言今日吉慶長齋淸堂修行至經無量度人願所啟上徹徑御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經

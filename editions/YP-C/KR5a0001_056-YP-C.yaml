front:
  text: 元始無量度人上品妙經元始洞玄靈寶本章濟度死魂十迴度人元皇上錄鍊度自然九宮妙範靑華帝靈至神開運合會玄關制命造化長養生根上布玄功無所不周五氣承德結絡形軀萬神羅列帝一居尊二十四宮八景佪環混洞天闢辟非藏烟明梁開道塞絕死門斬伐胞樹超度億曾解釋罪考朱陵鍊魂太一定命南昌衞形無量濟度長生大君破滅罪府司馬大神超拔滯爽韓君丈人司命司錄除削𡨚愆拔罪天尊度厄尊神迴骸起死無量度人今日校錄萬聖臨軒東方無極保命神王長生大聖無量度人南方無極保化神王長生大聖無量度人西方無極散禍神王長生大聖無量度人北方無極度厄神王長生大聖無量度人東北無極救苦神王長生大聖無量度人東南無極衞生神王長生大聖無量度人西南無極拔罪神王長生大聖無量度人西北無極度魂神王長生大聖無量度人上方無極超化神王長生大聖無量度人下方無極自在神王長生大聖無量度人十方至眞濟度死魂神王長生度世無量大神並乘八色祥雲九華翠輦龍鳳驂駕羽蓋騰軒建度魂定命之節召神靈旛前嘯玉童齊唱後吹簫籟同鳴獅子白鶴嘯歌噰噰四明啓途神官翼轅億乘萬騎浮空而來傾光迴駕監魂度生南昌丞相天機上宰韓司主錄監生大神執籙把籍齊到帝前隨所應度嚴校諸天普告三界無極神鄉泉曲之府北都羅酆三官九府十二河源上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼羣元始符命時刻昇遷北都寒池部衞形魂制魔保舉度品南宮死魂受鍊仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度三塗五苦八難超淩三界逍遙上淸上淸之天天帝洞眞無色之境梵行

body:
  text: 消除疾疫保命延年品道言昔於靑元天中飛景真音大玉洲土受元始度人消除疾疫保命延年無量上品元始天尊當說是經周迴十過以召十方始當詣座天真大神上聖高尊妙行真人無鞅數眾乘空而來素雲飛霞瓊軒鳳蓋紫霄流靄碧落騰光靈芒暐曄洞煥太无五日五夜諸天宮室臺館靈關七色交燿璇璣停輪三辰合照萬象咸寂地發嘉祥天現玉文法音遠響洞徹諸天三界肅淸四海澄靜一國地土山川林木緬平一等無復高下土皆作碧玉無有異色眾真侍座元始天尊懸坐空浮九龍寶局之上說經一遍諸天大聖同時稱善是時一國男女仰聽法音玄悟仙真之道說經二遍正性虛明說經三遍靈氣降身說經四遍蕩除業累萬疾皆愈說經五遍六腑五臟灌鍊生華說經六遍飛精變形金光易骨說經七遍神妙備體常保完全說經八遍化周三界恩及十方疫癘普消人民康樂說經九遍幽魂昇天冥官息對說經十遍萬物遂性逍遙太平是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品皇老大神無鞅之衆浮空而至說經二遍南方無極無量品太丹大神無鞅之衆浮空而至說經三遍西方無極無量品月華大神無鞅之衆浮空而至說經四遍北方無極無量品靈光大神無鞅之衆浮空而至說經五遍東北無極無量品帝暉大神無鞅之衆浮空而至說經六遍東南無極無量品雲綱大神無鞅之衆浮空而至說經七遍西南無極無量品伏魔大神無鞅之衆浮空而至說經八遍西北無極無量品高淸大神無鞅之衆浮空而至說經九遍上方無極無量品冲虛大神無鞅之衆浮空而至說經十遍下方無極無量品洞元大神無鞅之衆浮空而至十遍周竟十方無極消除疾疫保命延年至眞大神一時同至一國男女傾心歸仰始者心有法病身遭邪疫三界之內一切羣生無量天民或有身雖得道未脫冥數爲陰陽五行六氣之所陶冶者各各思惟因緣所證得道果位法身真形應報種體三十六變出没幽顯又有世間衆生曾爲不善凌犯五方金木水火土官之考身累疾疫或愚氓暗陋不順天道不知生理五行剋伏凌勃騰負鬱怫萬變水疫則寒火疫則熱金疫則淸燥土疫則喘汗木疫則惙慓疾疫流行鬼癘爲害如是等衆十二類生咸皆雲集帀遶座下旣聞元始十過宣說靈寶飛天玄妙大範三界十方悉皆濟度飛仙列聖來者有如細雨密霧於是元始神光八出普映十方遠覽萬天再吿大衆曰道非情言象先無偶近比人心倐來忽往變化莫測混雜難量謂之心者非真常也衆生昏愚積業重厚假心以知智緣智以體神神凝而體道若不知真人修用之理則心識鄙濁近連鬼道合以邪癘之氣則爲疾爲疫害其本年不全天壽能固氣於虛合神於無心爲神宇神宇靜則精正精正則形完萬邪莫干疾疫不入身旣無疾保命延年輔以道念栖泊自然玉符金篆服御雲霞長生得道列爲真人是時十方天人聞是語已感歎稱慶天光顯瑞神寶揚煇混元玄珠并包九有虛皇說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸行善心不妄不貪不僞不著不執不非不爲不見不護不戒言無華綺口無惡聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是魔王內諱百靈之隱名也非世之常辭上聖已成真人通玄究微慈念羣彚陰營萬生使三氣明正五常順德消除疾疫保命延年若疫毒一身疫遍世土正心護氣積善累功則南極監簿韓司錄名禳解禍尤宥過紀績能悉其章誦之十過諸天遥唱萬帝設禮河海靜默山嶽藏雲日月吐華列燿佪精温邪滅熾疾疫淸平虎符金簡紀錄功名鬼魔百毒斷種戮形天令順道正氣流行三官執奏翼衞神兵捕魂大理考校檢程賞善除祅益靈駐眞至學之士誦之十過則五帝侍衞三界稽首魔精喪眼鬼祅滅爽濟度疾疫絕而得生所以爾者學士穢氣未消體未洞眞以制十方威未制天政德可伏御地祇束縛魔靈但𨚫死而已不能更生輕誦此章癘鬼傳殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神官侍巾典省天機獨步玉京度人無量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到億曾萬祖幽魂苦爽皆卽受度天機上生韓司易名格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經疾疫無干神閑氣眞濁府散開邪試無門丹火內鍊骨變延齡皆卽受度飛昇南宮世人受誦則延夀長年後皆得作尸解之道魂神暫滅不經地獄卽得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經消除靑疫九夷老氣尅害人身爲上世亡魂斷地逮役度上南極太微天機省中超化昇職七月長齋誦詠是經消除白疫六戎老氣尅害人身身得神仙諸天書名神霄玉府西華堂中金書靑簡削死上生十月長齋誦詠是經消除黑疫五狄老氣尅害人身爲國王帝主安鎭國祚保天長存世世不絕常爲人君安鎭其方民稱太平八節之日誦詠是經安寧八景奮靈八威辟卻八邪永無百疫三田生珠諸節通理血變瓊醴精鍊玉華得爲九宮眞人本命之日誦詠是經異氣不生疾疫無侵年命固永鬼怪潛靈魂神澄正萬氣長存不經苦惱身有光明三界侍衞五帝司迎秉政天樞雲騎珠纓萬神朝禮參位太玄功滿德就飛昇上淸道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐赤靑黃三色雲氣之中內外蓊冥有靑龍白虎朱雀玄武獅子白鶴羅列左右六甲六丁伏魔大將備衞前後日月照明洞煥室內項生圓象光映十方如此分明密咒曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋淸堂修行至經無量度人願所啟上徹徑御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始無量度人上品妙經元始洞玄靈寶本章消除疾疫保命延年無量度人百魔隱韻離合自然太始無形召氣成眞氣出無緣泮虛凝玄玄爲氣母佪燿飛煙玉液鍊光金精八騫玉京嵯峨碧落凝旋三景轉赤九暈澄淵自成玉文無極至眞三五九一是爲天根元始祖刧靈寶生神温厚滋養堅澤剛輪開明三氣化生諸天玄黃混淪金火相乘變化陰陽正邪乃分正爲物宗守之長生邪爲疾疫禍害遷騰惟知道眞可以全身五臟眞氣結爲靈文無文不光無文不明無文不立無文不成無文不度無文不生上應圓羅天中之天鬱萃玄臺太皇玉京高極無上玄虛紫宸眇眇劫仞若亡若存三華離便泰淸黃庭金闕玉堂景素神池流布洞氣消滅萬殃淸正瓊輪周迴十方中有度人不死之神中有南極長生帝君中有消除疾疫大神中有太微天機省主好生韓君丈人中有南上司命司錄文昌益算度厄保命延年上眞迴骸起死無量度人今日校錄諸天臨軒東方無極皇老神王長生大聖無量度人南方無極太丹神王長生大聖無量度人西方無極月華神王長生大聖無量度人北方無極靈光神王長生大聖無量度人東北無極帝暉神王長生大聖無量度人東南無極雲綱神王長生大聖無量度人西南無極伏魔神王長生大聖無量度人西北無極高清神王長生大聖無量度人上方無極冲虛神王長生大聖無量度人下方無極洞元神王長生大聖無量度人十方至眞飛天神王長生度世無量大神並乘三景飛龍十華翠輦九鳳雲車流光玉輿驂駕神虎辟非蒼甲之麟建召眞之節燿空靈旛前列六陽大將後從八吏神兵九天飛眞遊空步虛五老啟途羣仙翼轅億乘萬騎浮空而來傾光迴駕監眞度生玉宸保相南極至靈上生監察金闕元君執籙把籍齊到帝前隨所應度嚴校諸天內保至眞建植功緣仁恕忠孝不犯三官六洞無名過度冥關宿疾普消疫災不干邪鬼破腦四目當前眾聖降接保命延年普告三界無極神鄉泉臺洞府北闕冥關六天雲營火刃鐵山列奏神霄玉簡敷宣釋除疾疫穢禍凶愆上解祖考億劫種親疾除黑簿落滅惡根不得沉淪拘制鬼羣虛皇詔命時刻昇遷北都寒庭檢會神魂大魔保度升化朱宮死魂受鍊隨運長存生身受度劫劫無傾隨劫輪轉與天齊年永度三塗五苦八難超凌三界逍遙上淸上淸之天天帝玉眞無色之境梵行東方八天玉歌燿宗天帝平羅景都帝厯鳳昌天帝眞章紫洛皇离正化天帝瑶府宛鈞齊命登華天帝尹詵持明江宵遘期天帝覺逸景虛球度蘭瑝天帝杳寂司干永生久臨天帝越梵治行樞落左玄天帝承安止宮南方八天願極宗召天帝嶽司校靈并道指頤天帝屢遠茲晞太微機輔天帝迴明庸康召眞訊智天帝除膚究當普信注玄天帝問亨補宜龍光照生天帝祈堂紀逢冲妙延常天帝轉英集輪月諸慶號天帝赤津良西方八天壟化嬰如天帝並京攄光奧洞演于天帝樂宣無垠照幽洗翾天帝磧疆延祕俞極混天帝總監眞影爲窈空天帝初嗣百還玄度意冥天帝報朝何嵩茲芽雲藏天帝降籍司陽胄重忻盧天帝伯巫期將北方八天監明正化天帝安途定方太華上光天帝祕師九祥日員攝圍天帝肇無辨黃絡霞㟪天帝攴諦霜朱涵溢令天帝彭民踐區印格制魔天帝元眞瀛攝京回布天帝斛亢禮淵神倉放遂天帝幽强宇元三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱文天中之樞天中之機天中之轄天中之輗天中大魔天中之靈玉天金闕中有至神布氣度人福及萬生九和十合變化上淸無量之奧深不可詳敷落神眞普度天人辟除毒禍禳解北辰犯忤大殺南極元尊消除疾疫保命延年今日欣慶受度厯關諸天請滅三惡斬絕地根飛度五戸名列太玄魔王監舉無拘天門東斗消疾西斗除愆北斗保命南斗延年中斗大魁主領元官八十一神總監眾仙靑帝蕩疫白帝施教赤帝宣威黑帝開導黃帝中主萬神從詔靑天魔王身佩帝書赤天魔王飛行太虛白天魔王萬惡潛誅黑天魔王統攝眞符黃天魔王布令玄都五帝大魔萬神之宗執天大範總領鬼兵麾旛仗節遊觀太冥神化無方與天同生上天度人嚴攝寒庭元王受命普掃祅祥疾疫莫作正氣流行生民自牧却滅禍殃命如山河福等昊蒼天師寶符玄靈大章龍文虎檄追召魁剛屠割鬼爽風火無停千千截首萬萬剪形魔無干犯鬼無祅精三官九都考察鬼營不得怠縱金馬驛呈化周無窮符告萬靈上宮玄宰飛奏帝宸無極高妙燿華洞淸氣生芳澄天地備成神運變化風火交騰精鍊九劫水躍龍門雲凝玉堅天闕九關瓊觀寶樓萬神守垣九絕明燿朱符召仙日揚九光月吹十霞五斗回車天英藴蘭帝妃泝香玉眞踞軒五老授職三官迅軿保民無疆吉慶如山眞元吐氣金馬當前泛霄隱庭奏鐘舞津正道流行疾疫莫登命曆益算壽年億千五方天使虎巾龍官咸領制劵歸造眞玄丹煇啟明運周自然元皇大布靈寶玉篇赤書五符八威正文保安大劫使氣飛行大梵包羅萬品施張元綱布演無極諸天輪轉無色周遍十方騰駕扶摇旋厯經常消除疾疫五方之神天温六傷却以洞文災怪消殄毒害絕源天機奏名玄軌交纒二十五氣歸功上元八羅冥會合混玄玄玄中太眞天帝高皇泛景太霄吟引宸風金昌明秀消蕩祅凶豁落奮擊流響雲宮仙音攝氣靈光返生太微御正上昇玉京邪癘殞殄仙眞列言三氣護生六府散烟千和萬合自然成眞眞中有神長生大君正御南極掃滅祅氛收除怪害五疫消平太乙持火燒蕩魔官司命膺策收伏羣姦桃康命靈萬景合延執符把籙召命生根上遊上淸出入黃庭明堂之內絳闕之中保正玄丹三眞道宮中理五府境域明通十轉回靈萬氣齊升升仙鍊養無極度人上開八門飛天寶輪罪福禁戒宿命因緣普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有空洞謡歌之章魔王靈篇辭參高眞第一欲界消除疾疫飛空之音祅羣干正肆毒分身遊散八方疾疫生民水寒火熱穢氣紛紛進尸滅眞惑亂世人韓司校錄南極火鈴炎烟赫衝善惡速分文昌帝省九萬官君符命下傳風火無停疾疫普消壽樂康甯生道旣正名奏天機降集眞氣救災却非玉津灌鍊與身同飛第二色界魔王保命延年之章冠峩碧蕖龍文虎書帶劔朱綬杳靄雲衢丹文玉璽威鎭太虛太上黃籍五老天符仙官注筆布令元都夀年無窮大化安舒疾疫不入心有玄儲虛皇垂教萬惡皆驅南昌火府朱陵上宮洞陽火官嚴駕九龍寶珠顯妙眞文下敷丹化凡骨昇入帝居笑爾阿人詠此靈音舉形變仙上升天堂第三無色界魔王升神造玄歌曰剛風爲石壘此重山風澤堅凝深藏帝關日月運行流轉諸天化君主令有形悉頒爾氣淸空爾形秀冲邪疫無侵湛然神宫大經龍蟠合交景雲血化玉液精鍊瓊輪魔王虎冠繡幟朱軿錄子正心授子仙宮雲層峩峩黃霞碧波授過冥曹高仙玉仙擕手登翠都笑歌入無何此三界之上飛空之中魔王歌音音參洞章誦之百遍名度南宮誦之千遍魔王保迎萬遍道備飛昇太空過度三界位登仙公有聞靈音魔王敬形敕制地祇侍衞送迎拔出地戸五苦八難七祖昇遷永離鬼官魂度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈魔王隱祕之音皆是大梵消除疾疫保命延年之言非世上常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寶祕於玄都紫微上宮依玄科四萬劫一傳若有至人齎金寶質心依舊格告盟十天然後而付焉道言夫天運否終地道隔塞日月二星虧盈凌犯氣行勃亂度數差忒大則爲至聖神人之休否小則爲末學生民之疾傷時疫流染方域生災同氣皆當齊心修齋六時行香十遍轉經福德立降消諸不祥無量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太陰或疾疫爲害保命無傾臨過之時同學至人爲其行香誦經十過以度屍形如法魂神徑上南宮隨其學功計日而得更生轉輪不惑便得神仙疾疫淸甯人安道泰永保天齡道言夫天地運終星宿錯度日月失昏四時失度陰陽不調則災氣自生疾疫爲咎使國界水旱兵革未平疫毒流行兆民死傷師友契盟有致延染皆當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎭帝土下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衞右別至人尅得爲聖君金闕之臣諸天記人功過毫分無失天中魔王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君撰元始靈書中篇東方八天天相樞明機省元同中黃四司玉韜上公靈虛太玄錫命眞封雲文祕紀校績南韓文妃錄品簡昇紫垣章號瓊韞朱曜洪頒護字達龍府開命神碧圓通照萬道冥神南方八天感帝交仙羽縹素烟梵混自澄洞魔駐筵驛騰信馥官師允騫憫符昭濟功念幽泉利庇黎冲進除果嚴激思求邈深頥浩田無落由動壁刻元綿救澤苦涸常應匪邊西方八天空含意模仙令忮宣謹悟豈緘孔雄假乾遐函默祝兵胄潛蕃敕章钁究成島俠連變宥忽網測粹武賢諱愚祈昏奏迷縛還中帝赤懸威劔蒼蚖識爽杳辨斯質華聯北方八天玉宸宰儀洪蕩胡時忽透象察役曹橫旂統按宥生火迅車馳驛典責文嶽圄魂疑蒙乖亢正敷式奚重教檢斗剛太一九佪矢慘丙注符策按圍目夔公馬戮罰拉摧鬼滇長澤東谷雲敞施南赤圖震皇西馘醜榮垂北以上四句計一十六字消除疾疫朱書服之吉道言此諸天中大梵隱語無量之音後一十六字治病去疫斷瘟密敕其法祕重有知其音能齋而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳魔王保舉洞眞道備尅得遊行三界昇入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致飛天下觀上帝遙唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅淸河海靜默山嶽吞烟萬靈振伏招集羣仙天無氛穢地無祅塵冥慧洞淸大量玄玄也元始無量度人上品妙經卷之五十二玄明洞淵品道言昔於紫元天中綠景空歌太晨光土受元始度人玄明洞淵無量上品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖高尊妙行眞人玄明洞淵五靈玄老水帝八方九海洞淵龍王水官四十二曹江河泉源官屬將吏無鞅數衆昇空而來流雲靄霧黳玉之輿玄明之輦紫蓋神輪洞霄垂蔭流虹寶光萬色鬱勃洞煥太空五日五夜諸天日月星宿象沈海影綱蟠玉樞珠暈璣徽停輪駐燿神宮鎭靜靈嶽收雲天浮八騫氣淸九野一國地土山川林木緬平一等無復高下土明玉晶無有異色眾眞侍座元始天尊玄坐空浮三光七變靈鼇寶座之上說經一遍諸天大眾同時稱善是時一國男女歸依元始玄明洞淵之法悟此生元先從珠露說經二遍信知眞水變化無窮說經三遍知見柔明利物幾道說經四遍思念生宮初降洞淵之氣腎華甲坼神龜漾遊說經五遍心穴宏敷靈潮機動玄明散液萬竅滋流諦觀靜念體妙無爲說經六遍天霐澄湛明可分神一一玄中具我身相說經七遍洞淵靜碧龍神奉教說經八遍海雲擎露甘液潤生說經九遍水光發爓宮殿千層中有天民咸悟道法說經十遍玄明之氣化成紫雲普覆諸天現無爲海幽沈苦爽解脫逍遙是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品玄明洞淵至眞大神無鞅之眾浮空而至說經二遍南方無極無量品玄明洞淵至眞大神無鞅之眾浮空而至說經三遍西方無極無量品玄明洞淵至眞大神無鞅之眾浮空而至說經四遍北方無極無量品玄明洞淵至眞大神無鞅之眾浮空而至說經五遍東北無極無量品玄明洞淵至眞大神無鞅之眾浮空而至說經六遍東南無極無量品玄明洞淵至眞大神無鞅之眾浮空而至說經七遍西南無極無量品玄明洞淵至眞大神無鞅之眾浮空而至說經八遍西北無極無量品玄明洞淵至眞大神無鞅之眾浮空而至說經九遍上方無極無量品玄明洞淵至眞大神無鞅之眾浮空而至說經十遍下方無極無量品玄明洞淵至眞大神無鞅之眾浮空而至十遍周竟十方無極玄明洞淵天眞大神一時同至一國男女傾心歸仰咸相議言元始天尊來降此天百寶紫元天宮爲諸仙眾顯揚玄妙五行眞水之法其氣名曰玄明洞淵我聞玄明爲眞水之德形色俱美洞淵爲眞水之量幽深無涯若以我等所見五行之水滔天洋洋洪浩不測不知無形五行謂之眞水名曰玄明洞淵作何體狀天地未分先有眞土土能固攝十方上下其中眞水無量無邊風氣鼔之凝爲萬物是生命本爲大道元始天尊今日宣演五行無形眞氣之妙我若得聞自得超昇神霄上境皆當朝禮天尊覬獲大慈遺我勝法作如是說敬禮再拜來者有如細雨密霧無鞅之眾迮國一半土皆偏陷非可禁止於是元始懸一寶珠大如黍米在空玄之中去地五丈元始登引天眞大神上聖高尊妙行眞人玄明洞淵五靈玄老水帝八方九海洞淵龍王水官四十二曹靈司掾吏無鞅數眾俱入寶珠之中天人仰看惟見勃勃從珠口中入旣入珠口不知所在國人廓散地還平正無復欹陷元始卽於寶珠之內說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐欻之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸行淸淨妙靈智心心行如水利澤無盡明一明順明通明照明智明慧明辯明道明玄明空心無留滯默契玄妙同造杳冥深悟至要國安民康逍遙太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是眞王內諱百靈之隱名也妙化無形眞水玄明洞淵之法夫玄明爲水之情性洞淵爲水之室宅流則爲智靜則爲慧流故能通靜故能照爾能體之自然得道天地以靜眞水生民物以靜眞水行燥熱爲火靜寒爲水燥可勝寒靜可勝熱眞水生故也爾若安靜眞水自行變化日生靜爲命元靜則長生非世之常辭上聖已成眞人通玄究微能悉其章誦之十過諸天遙唱萬帝設禮河海靜默通導淵源日月合度璇璣不行羣魔束形鬼精滅爽回屍起死白骨成人至學之士誦之十過則五帝侍衞三界稽首魔精喪眼鬼祅滅爽濟度垂死絕而得生所以爾者學士穢氣未消體未洞眞召制十方威未制天政德可伏御地祇束縛魔靈但卻死而已不能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人無量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到水帝列言泉曲悉宥開朗冥關億曾萬祖幽魂苦爽皆卽受度上昇朱宮格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經眞水上應五臟育嬰昇入泥丸玄霜紫冰皆卽受度飛昇南宮世人受誦則洞靈激奔神泉八周益軀生神延壽長年後皆得作尸解之道魂神暫滅不經地獄卽得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役右官侍經五帝玉童玉女各六十四人營衞神文保護受經者身道言正月長齋誦詠是經九變三眞澤及重泉爲上世亡魂斷地逮役度上南宮七月長齋誦詠是經眞水出胎道受永年身得神仙諸天書名黄籙白簡削死上生十月長齋誦詠是經復本還源功歸上玄總攝正氣統御高仙爲國王帝主君臣父子安鎭國祚保天長存世世不絕常爲人君安鎭其方民樂太平八節之日誦詠是經神泉流轉玉關冲盈得爲九宮眞人本命之日誦詠是經眞水淸明內照形神出紫入黄五臟生英魂神澄正萬氣長存不經苦惱身有光明三界侍軒五帝司迎萬神朝禮名書上天功滿德就飛昇上淸道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐靑黄白三色雲氣之中內外蓊冥有靑龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室內玄明洞淵之氣狀如紫煙羅絡交灌洞見百神項生圓象光映十方如此分明密咒曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啟所言今日吉慶長齋淸堂修行至經無量度人願所啟上徹徑御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經

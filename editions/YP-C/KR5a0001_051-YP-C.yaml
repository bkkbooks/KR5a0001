front:
  text: 有知其音能齋而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳魔王保舉上淸道備剋得遊行三界昇入金門此音无所不辟无所不禳无所不度无所不成天眞自然之音也故誦之致飛天下觀上帝遥唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅淸河海靜默山嶽吞煙萬靈振伏招集羣仙天无氛穢地无祅塵冥慧洞淸大量玄玄也重刋道藏輯要元始無量度人上品妙經卷之五十一
  hash: sha256:c821cbc0b06958724ac34d29e8ef83297401832dee5c82fb510fa096e935d959

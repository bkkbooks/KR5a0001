body:
  text: 元始無量度人上品妙經元始洞玄靈寶本章解釋幽牢開光度人諸天隱韻離合自然太始無文杳冥中眞元氣化生紫烟氤氳風火陶埴流精自凝支勢低回鏤玉鎔金垂芒駕霞罙布十方混洞赤書命意寫形離爲萬象合爲寶經累珠貫花激濁揚淸五老吐符皇人寫靈造化以成三界開明天以之淸地以之甯人以之生神以之靈物以之成梵氣左騰春夏肇興天光右馳秋冬滋榮元始上帝命曰玉眞上無復祖惟道爲身五文開廓普殖神靈三辰揚煇鬱羅玉淸九壘植根冥渺酆城下有大魔與道同生羅山龍源醜都肆姧蕩蕩億程洞宮熒淩中有萬鬼鼓錞巨兵獄考幽陰大劫匪捐火鐵億壘天地無門大悲道王天中之尊口放神光光顯玉文瑞霞絡碧鳳氣成雲禁獄乃開黑界光明九龍銜符鍊度種人是爲大梵天中之天繁薈庶生知識自營內構巨業默與神爭神本自天元惡相纏苦魂冥冥墮拘重泉鬼帥執契虎卒仗鞭按券呼名敢干我前黑甲噴火電母攝仙萬毒備形閉以天關沈目塞耳寥邈南丹哀企玉符赦此幽艱碧空莽莽九劫重山太一黃旗司命騁轅告命九陰典宰司殺元童都禁大君北陰大神司錄主算捕魂化生四明五嶽泰山丈人解釋幽牢無量度人今日校錄諸天臨軒東方無極道化神王長生大聖無量度人南方無極度生神王長生大聖無量度人西方無極堅德神王長生大聖無量度人北方無極玄照神王長生大聖無量度人東北無極救苦神王長生大聖無量度人東南無極拔罪神王長生大聖無量度人西南無極濟苦神王長生大聖無量度人西北無極赦罪神王長生大聖無量度人上方無極昇度神王長生大聖無量度人下方無極普惠神王長生大聖無量度人十方至眞慈化神王長生度世無量大神並乘流雲彩車紫蓋彤輪驂駕綠象白獸斑龍建招神之節返生靈旛前合九眞之曲後奏八會之音天馬麒麟騰躍辟非六丁啟道七燿捧轅億乘萬騎浮空而來傾光回駕監眞度生北陰右相洞淵化宮三元助理太上靈君執籙持符同會帝庭隨所開度嚴誓百神普告黃闕無極幽關悲歌九映故試大魔六天治獄萬鬼之營冰池沸鑊銅柱火山飛戈飄㦸巨石刀輪三塗長役五苦夜河虛皇有命皆使超升北都寒池部衞形魂制魔保舉度品南宮死魂受鍊仙化成人生身受度劫劫長存隨劫輪轉與天齊年永斷幽沈苦趣之難超淩三界受鍊洞陽洞陽之天天帝道元無色之境梵行東方八天玉餘明報天帝蔚覽眞蒼靈洞籍天帝耶殊覺氛妙極神際天帝錄多淸夷長智通奇天帝元胎保眞救寂㥫和天帝元胥子明玉回霞緒天帝招靈款神赤瑜寶淨天帝珈輔龍琛道明雲覬天帝淸宣左聲南方八天德育正化天帝傳明道因玄靈妙濟天帝粤須延生虛璲澄廉天帝露憫遞聰彰容克間天帝彥韋常臻奏須曆靜天帝婆藍宛都太妙希玄天帝招眞烈元和遲竟觀天帝部陀鬱彌深極勝離天帝明朝紫賓西方八天鬼樞星映天帝光輿羅軒超氣皇度天帝柏華月璘昭寅澄觀天帝至輔虎林蕩拂遠想天帝覺慮騫奚靈微四極天帝彥光平舒月廣燿虛天帝布華總陳昌宜管祖天帝畢康參勅嚴制魔天帝開圖祖玄北方八天紫華慶陽天帝辯惠源常憫亟濟天帝羅遜義淵征旗闢盧天帝虛岐杳宗彊明拯機天帝魯評兟太極允明天帝未京左邱濯儲烈和天帝曜童齒南浸微液華天帝瀦靈宛甯河都曲泉天帝江定英三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻度幽之音降幽之尊感幽之神解釋幽牢化度羣靈九幽十極變化幽冥無量之奧深不可詳道出神眞普度窮魂今日欣慶受鍊厯關諸天請滅三惡斬絶地根飛度炎池名列太玄魔王監舉無拘天門東斗主訟西斗司刑北斗出命南斗變生中斗降神魂魄以靈靑帝授性白帝造形赤帝傳識黑帝運精黃帝養胃出納分明木獄神王考掠爭析火獄神王燒焚烙炙金獄神王斬摧钁戈水獄神王寒冰凝冽土獄神王䧟壓埋壘五獄大魔禁獄之宗飛行肆兇總領鬼兵持刀負钁鼓氣成風屠割幽爽酷慘莫容上天度人勅告北酆鬼相禀命晶皛效祥鐵城摧圮火綱不張肩雉按㦸冒虎執鎗威具咸息惡氣殄亡獄化仙苑人道翺翔敢有干試拒遏上眞金鉞前衝玄纛後停屍鬼得度眾苦斯平千千出獄萬萬賦形魔王審對鬼神考情三官北酆明檢鬼營不得容隱金馬驛程普告無窮萬神咸聽三界五帝列言上淸元陽玉匱區別冥魂大劫極於陽九小劫極於陰六是時水騰火飛九六爲變兵刃誅刑山嶽搖響宇傾宙移風烟雜亂神州玉京太玄之庭眇眇億劫非晦非明上達八剛不動之界下極種民不易之鄉崑崙龍淵玉州黃庭三災不干有諸淸靈明爽之魂皆道氣之佑不遷不馳自無營營元始大慈赤書合明煥爛玉屈霏縻紫淸鳳戴龍負赦釋苦靈有在三官動經億劫成壞之變業累無解囚閉幽牢劫載拘留墮黑暗城眇眇之中上極無色下極無淵風震九虛不知其天無光無明洞幽洞冥形影窮極出入死生汩汩混海昧魂交扃鎖鑄鉤鉗同業積生玉章開明運度自然玄老奮戈龍銜五篇赤書紫圖靑華虎文芒回露披金斗炳分保制劫運使天長存陰爽結羅道力開張北山元阿徂東陂陁惡根流演三十六都輪轉井獄周回九幽斗箕之緯旋厯五場萬八千牢總氣三元六洞列宮氣入太玄玄中大魔業等高眞泛氣鼓烟承聽玉章金馬驛告拔宥鬼營淸歌召神蘭音輔眞冥滯决舒隨感受生聖眞布化無幽不聞左嘯紫童右扶帝宸陽健陰闢元精化身千和萬合自然成人輪轉五道假受成形形中有神長生大君無英公子白元尊神太一司命桃康合延執符把籙保命生根三官錫符嶽帝紀名隨宿命緣三界乃生上極皇曾色界之天桂館華房八冥之內細微之中下及酆羅洞陰玄宮中分九類二十四生泉瀆嶽磧冥漠鬼神十轉幽關苦爽齊仙仙道貴生無量度人上開八門飛天法輪罪福禁戒宿命因緣普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有空洞謠歌之章救苦靈篇辭參高眞第一泉曲府滅罪濟苦天尊解釋幽牢飛空之音長川浩浩洪流九源波惡毒兮汩沒沈淪業纏結兮攝縛牽連大穴極無底杳杳藏萬凶冥冥眾苦爽受報北羅酆汲汲泉山下督責𡨚何窮鬼吏考業體哀號震寒空罪目在三官苦網脫無門飛天下太元八道開幽關洞文燭長夜拔度受生魂萬劫永逍遙稽首荷玄恩第二九幽府開光拔罪天尊解釋幽牢之章崑邱嵳峩仰祝八騫遐觀十天四睇諸方九幽大神變化億身善功刻名朽骨成仙太一在上綠宮光連幽壤在下穢氣紛紛黑山東兮鬼獄長存鐵牢依南萬劫火然遙遙九空流浹道恩狴域清蕩嚴降高眞鍊鬼登玄金籙簡文識坐蓮胎得度靈身不經三途世世爲人慶雲飄飄琅琅玉音第三酆都府五靈洞陰天尊歌曰北淵潭潭氣貫鬱羅鬼門四關酆山嵳峩六天九府是鬼神家癸海億萬嵌巖獸都洞陰流光潛通太虛元始眞王伏御眾魔飛雨甘露繽委天葩瑞臻福應度魂其多功德咸備遏截妄邪惟道爲謀罔識于他內眞自充神登三華永謝羅酆道仙境由是過超昇紫雲上翛翛入无何此三府之上飛空之中高眞靈音音參洞章誦之百遍名度南宮誦之千遍普攝魔魂萬遍道備解釋煩𡨚超度三界簡刻太玄有聞靈音魔王敬形勅制地祇侍衞送迎拔出地戸五苦八難七祖昇遷永離鬼官魂度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈冥尊隱祕之音皆是大梵之言非世上常辭言極幽黯歌洞靈筌故謂玄奧難可尋詳上天所寶祕於玄都紫微上宮依玄科四萬劫一傳若有至人下濟泉扃拔度幽窮救死回生齎金寶質心依舊格告盟十天然後而付焉道言夫依業託識依識顯神神爲來往之主識爲死生之根神識業因三者爲一萬劫䝉蔽不脫幽關神雖不遷因業外變六道四生天魔秉權注籍斯艱業力脗合氣精流傳歘爾爲人福命所懸貧富貴賤簡記本緣神風運轉萬形允宣生死之時同氣皆當齊心修齋六時行香十遍轉經福德立降消諸不祥無量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太陰臨過之時同學至人爲其行香誦經十遍以度屍形如法道業淨戒之魂在三官保命府左右侍中仙卿之間校記玄功者卽得乘駕飛龍侍軒帝宸修眞鍊道致一守神之魂在東華淸虛東榮童初遊散進功者卽得御素軿於北元朝太極於上宮位證高仙預治天政主化行權淸明苦爽隨世希仙三乘之魂在山川福壤主者之任者魂神徑上南宮隨其學功計日而得更生轉輪不惑便得神仙道言夫道無終始人有死生惟一眞大神與道同體永無變滅業風乘神搏識滅性假於形類形同於物故有終盡終盡者形之氣氣之限至神不終世人惑妄認爲死生執於業識墮於地獄迷蔽自惑鬼官執錄永閉幽牢黑暗萬重不覩圓曜元始運悲神文光麗玉書散芒醜形得度計日超昇沖氣滋融靈眸煒煥臨將鍊易皆當修齋行香誦經夫齋戒誦經功德甚重上通九天保鎭帝王下濟冥途以度罪魂生死受賴其福難勝故曰無量普度天人道言凡有是經能爲厯劫幽魂苦爽無量冥途行是功德開度之日發心修齋燒香誦經十過皆諸天記名萬神侍衞右別至人剋得爲聖君金闕之臣諸天記人功過毫分無失天中魔王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君撰元始靈書解釋幽牢洞篇東方八天厯阜輿衡謨民越琳迮池宛敷果箕拒藍崔波雲陁魔夷鹿彬滴無彥嘉明微奴銜至陳耀廬仙期阿曇劔島玉提魔棲珞敦鬼星皋房覺體運元善憫綠華敵司毗南內八字岱宗禁司南方八天霄虛敞熾遠釋皆賓墟除岡甯偃南俎澄月斗羅稽孟昏祉榮寥扈景瑰紫微胡凌波陀臺阿照徂曲征命延佐蕪路百祠輪道定虞渚厯正孚瓊兆堯柏巒洞淸湊營西方八天奏度球疑沖朋聯棲此八字爲九幽太一號迷盧蘇支寂幾渠施汶漠協钁神斗玉儀觀侔合積噓持米離玄方碧羅陽志荒時七覺遙祖卷逋索逵霞敷琯姬景育度元混幾央卑鼓龍澤歌他墀半飛龍皛由嵋內八字酆城官諱北方八天玉蹊亂基日淵孟池溥載願列坡荒元祠絳洞妙弼邱目藴飛定芒混逐坤齊建䝉激馘鬼鄙煙營方仇卯畜旣明菩郎罕投幽歌寒呱烈燔夢遊㦸旦悅攴仙都霞周內八字玄老內名道言此諸天中大梵隱語無量之音舊文書太玄北闕五靈長樓之上以開度泰山九幽羅酆泉曲冥關累苦之魂繫在三官不得自明逍遙玄空之者丹書揚之以濟淪苦昔天眞皇人詣夜光元后模倣書之字皆廣長一丈八角垂芒委宛如印九六之會離爲正音有知其音能齋而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳魔王保舉上眞道備剋得遊行三界昇入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致地獄釋縛長夜開曉幽牢陰界息苦超生人道安甯鬼途解脫碧宮霞覆丹陵發光鎭靜海嶽福及萬生天垂彩耀地湧玉英冥慧洞淸大量玄玄也元始無量度人上品妙經卷之五十八迴生起死品道言昔於紫空燿景天中玄風洞歌大靈妙土受元始度人迴生起死無量上品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖高尊妙行眞人無鞅數眾乘空而來靈煇燿虛瓊車玉輿扶華宸蓋雲旌四張瑞靄交鬱彌羅八𨇠五日五夜諸天諸地陰陽機運一時停回玄綱振肅海嶽澄明品物咸和普安其生一國地土山川林木凝鮮一等無復殘毁土皆作異寶燦麗熠熠眾眞侍座元始天尊玄坐空浮萬氣雲華寶座之上說經一遍諸天大聖同時稱善是時一國男女禍害不作無有夭傷說經二遍災病蠲消說經三遍翁艾返嬰說經四遍垂死得生壽獲永延說經五遍死入輪轉卽獲昇遷說經六遍沈屍九鍊陰質迴生說經七遍受化太玄枯骨復形說經八遍普世明悟道性還湻尚德貴正斷滅奸邪說經九遍學道得道求仙得仙說經十遍妙氣周備混合神明是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品道化大神無鞅之眾浮空而至說經二遍南方無極無量品明性大神無鞅之眾浮空而至說經三遍西方無極無量品結氣大神無鞅之眾浮空而至說經四遍北方無極無量品開慧大神無鞅之眾浮空而至說經五遍東北無極無量品生魂大神無鞅之眾浮空而至說經六遍東南無極無量品育形大神無鞅之眾浮空而至說經七遍西南無極無量品保命大神無鞅之眾浮空而至說經八遍西北無極無量品延年大神無鞅之眾浮空而至說經九遍上方無極無量品迴生大神無鞅之眾浮空而至說經十遍下方無極無量品起死大神無鞅之眾浮空而至十遍周竟十方無極天眞大神一時同至一國男女傾心歸仰一切淪化沈冥屍過䝉被道恩生氣入身旣死返形來者有如山嶽出雲四塞彌漫無鞅之眾迮國一半土皆偏䧟非可禁止於是元始開七寶山啟無邊目約衣斂几凝觀遐想以告眾眞曰眾生迷誤罔覺玄眞旣離胎育情逐化遷緣類隨著遂生業因業累敗性徇識爲愚利害交攻情色蕩意初爲童稚逮于壯時顧視之間已及於老焦牢枯竭生氣旋盡至於死壞殊不知道爲生德生爲道根心存於道常與生俱物有生死道無生死存道於形生氣自續數極形盡道復能生生道旣固不從化遷保形不化永存綿綿迴生轉死上眞所崇今爲眾等開演妙本普度無窮於是元始振揚華拂景霧四騰如雲如煙靄浮空際去地九丈元始攝引天眞大神上聖高尊妙行眞人十方無極至眞大神無鞅數眾俱在景霧之中地還平正無復欹䧟元始卽於景霧之上說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂無遺響是時天人遇值經法普得濟度永植生根無有沈淪傾土歸仰咸行道心不競不擾不任不勤不念不欲不貪不嗔不營不思言無藻麗口無怨咨齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是眞王迴生起死內諱百靈之隱名也非世之常辭上聖已成眞人通玄究微能悉其章誦之十過諸天攝氣萬道齊眞靈化開宣咸受玄恩生津永啓召魄收魂沈零結育以返屍形迴生起死白骨成人至學之士誦之十過則五帝命靈三元策眞靈眞降合死道散隳濟度垂死絶而得生所以爾者學士道氣未純體未契眞保制萬神德未全至用可回度命機開導生津但起死而已不復轉輪輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人無量爲生道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到生道開明返化結軀億曾萬祖幽魂苦爽亦皆受度上昇朱宮格皆九年受化更生得爲眞仙而好學至經功滿德就皆得舉形飛昇金闕遊宴玉京也上學之士修誦是經皆卽受度飛昇南宮世人受誦則延壽長年久視無窮後天長存運數雖極並皆得作解化之道遁變神明不經絶滅常欣保榮逍遙十天此經微妙普度無窮一切天人莫不受慶無量之福生死䝉惠上天所寶不傳下世至士齎金寶效心告盟神霄而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經爲拔度衰亡死滅極會之災得保生存七月長齋誦詠是經神氣常全厄難蠲消名奏靑籙當獲長生十月長齋誦詠是經爲普天率土保度民物仁壽咸臻與天無傾世世衍溢戴仰人君安鎭國祚萬劫昇平八節之日誦詠是經造化不愆金木交并神氣和同養育皇靈枯朽更生受其鍊度得證仙眞本命之日誦詠是經身保淸貞體用日新禍患永消長亯福祥天曹錄善地司滅連慶延七祖名奏三天功滿德就飛昇上淸道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐靑黃白三色雲氣之中內外蓊冥有靑龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室內迴生起死玄化大神侍衞前後項生圓象光映十方如此分明密咒曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋淸堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經

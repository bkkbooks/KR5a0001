front:
  text: 元始無量度人上品妙經卷之五十五
  hash: sha256:f222624df7d21983be3023b0df68d59548c0511043ccb23190ce57bb58375f24
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_YP-C_02kangji-04-0065b, image: JY001/02kangji-04-0065b.png}
body:
  text: 追度上世亡䰟品道言昔於龍梵天中景霄幽歌大鍊化土受元始度人追度上世亡䰟無量上品元始天尊當說是經周迴十過以召十方始當詣座九皇上眞飛天大聖妙行眞人玄中法師洞陰朔單鬱絕之境五靈玄老黑帝天君酆都北帝六天大魔救苦靈仙九宮曹屬三元考䰟無鞅數眾乘空而來三素飛雲八景霄輿華蓋垂蔭碧翠交光九色瓊蕤洞煥太空七日七夜諸天臺城樓觀影徹幽寥珠緯玉毫停輪息燿神風襲瑞空藏傾波一國地土山川林木緬平一等無復高下土皆作靑玉萬里通映無有異色眾眞侍座元始天尊玄坐空浮九光寶局之上說經一遍諸天大聖同時稱善是時大地眾生祖先積罪咸蒙赦原說經二遍光照九幽開悟宿命說經三遍雲周道境甘露灑空說經四遍火山息熖寒池靜波說經五遍地獄弛關幽魂解脫說經六遍落滅惡根不沉苦趣說經七遍焚燒黑簿考對休閑說經八遍泉曲冥官進陞仙品說經九遍暗域飛雲陽光盪翳說經十遍枯骨更生皆起成人是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品靑宮救苦大神無鞅之眾浮空而至說經二遍南方無極無量品朱宮明悟大神無鞅之眾浮空而至說經三遍西方無極無量品素靈宮玄定大神無鞅之眾浮空而至說經四遍北方無極無量品紫元宮幽感大神無鞅之眾浮空而至說經五遍東北無極無量品酆都宮雲營大神無鞅之眾浮空而至說經六遍東南無極無量品九幽宮拔罪大神無鞅之眾浮空而至說經七遍西南無極無量品泉曲宮度生大神無鞅之眾浮空而至說經八遍西北無極無量品天福宮超化大神無鞅之眾浮空而至說經九遍上方無極無量品眞都宮靈妙大神無鞅之眾浮空而至說經十遍下方無極無量品玄妙宮寂定大神無鞅之眾浮空而至十遍周竟十方無極升度苦爽天眞大神一時同至元始天尊初說法時一國男女各各追懷上世亡䰟億曾萬祖古往先親或繫宿因承於業力已遂生方遨遊三界或尚沈幽境滯爽冥關代厯綿長時丁久遠䰟無依止體化塵埃性識未消尚存心念罹斯陰罪必犯陽愆今遇元始將陳追度之法慶會無邊願虛俟教廣利有生是時天尊四觀天人一切鬼神一方聖眾舉山水雲霞之袂揮九色碧光宛轉之紱良久之頃以九色碧光一縷之絲垂明下徹遥至九壘七圍鐵山之間十大地獄方面八千餘里高廣深厚其量過之隨此碧光一縷之絲拔地之聲六種俱振猶於大海交磕二山亦如諸天五雷併起正行遊梵三十六宮應時傾動北酆諸大地獄翩翩高舉下離冥漠昇於絕空碧紱之絲挽提獄頂洞出剛風及於天界以此大獄繫於絲杪形如彈丸無量之眾瞻矚無礙皆見諸大地獄五刑萬苦血刃火然表裏明覩不有纎障各見有罪祖先受諸苦報禁考獄中哀吟求救一切眾生見此事相舉聲號泣響震諸天祈告虛皇願垂追度元始怡顏微笑卽於頂上出大光明煥照天地於光明中有赤文雲書昇天寶券芒金角玉蚪曲詳分示眾宣言爾等眾生上世亡䰟用此追度之法周迴十過皆獲昇天來者霧合雲屯非可禁止迮國一半土皆偏陷乃懸一寶珠大如黍米在空玄之中去地九丈元始登引天眞大神上聖高尊十方救苦拔罪眞人至眞大神無鞅數眾俱入寶珠之中天人仰看惟見拂拂從珠口中入旣入珠口不知所在國人廓散地還平正無復欹陷元始卽於寶珠之內說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂無遺響是時天人遇值經法普得濟惠拔度祖先不墮惡道傾心歸仰咸行孝心能敬能讓能廉能貞能柔能和能奉能承能忍能養心無悖慢口無怨言齊同慈愛異國成親國安民豐欣樂太平經始出教一國以道預有志心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是眞王內諱百靈之隱名也非世之常辭上聖已成眞人通玄究微能悉其章誦之十過諸天遥唱萬罪悉原上世亡䰟皆獲昇仙旁資一切普度萬生回屍起死白骨成人至學之士誦之十過則五嶽奏剌三官奉詞幽䰟遷化逝魄超昇濟度亡歿絕而得生所以爾者學士道德未充體未洞眞以制十方威未制天政德可伏御地祇資濟幽靈濟拔祖先而已輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人無量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到億曾萬祖幽䰟苦爽皆卽受度上昇朱宮格皆九年受化更生得爲貴人而好學至經功滿德就追度高玄皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經上世亡䰟皆卽追度飛升南宮世人受誦則亡過祖考得太陰鍊形之道䰟神暫滅不經地獄卽得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及子孫長役三宮侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經爲上世亡䰟斷地逮役度上南宮七月長齋誦詠是經九祖七玄升入天門赦罪遷善身得神仙十月長齋誦詠是經追度古先眷屬億遠幽靈卽獲鍊化刻錄太淸八節之日誦詠是經遠世䰟爽罪滅北都酆山息考罷役河源得爲九宮眞人本命之日誦詠是經玄堂七世往劫滯䰟靈肉附骨近生爲人䰟神澄正萬氣長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上淸道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐碧紫絳三色雲氣之中內外蓊冥有靑龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室內十方救苦無量大神駐輦空極項生圓象光映十方如此分明密咒曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啟所言今日吉慶長齋淸堂修行至經無量度人願所啟上徹徑御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始無量度人上品妙經元始洞玄靈寶本章追度上世亡䰟十遍度人九冥隱韻開化自然空洞降靈太虛生神總治法象統歸三元瓊宮大聖高居帝尊敷𢎞至妙考校因緣靑編丹簡紀錄玄文元陽紫微方諸洞泉太陰署罰火官舉遷生民隨業攝送酆山九河六洞萬鬼之營火城劒樹沸鑊寒庭鬼帥大魔考責罪䰟元始玉符下拔幽扃普爲眾生追度祖先上詣朱陵功告三官五嶽四凟名山大川水府洞宮主宰神靈原赦滯爽不得稽停大會玄都速召萬神中有東極尋聲赴感太一救苦天尊中有度䰟化形之君中有太冥鍊屍大神中有大慈妙行眞人中有天樞天機好生文昌延壽度厄尊神招靈太玄無量度人今日校錄諸天臨軒東方無極龍威神王長生大聖無量度人南方無極丹靈神王長生大聖無量度人西方無極皓華神王長生大聖無量度人北方無極玄英神王長生大聖無量度人東北無極鍊度神王長生大聖無量度人東南無極變身神王長生大聖無量度人西南無極復相神王長生大聖無量度人西北無極正精神王長生大聖無量度人上方無極火府神王長生大聖無量度人下方無極返形神王長生大聖無量度人十方至眞飛天度䰟超化神王長生度世無量大神並乘八景琅輿飛雲葆蓋霞輦颷輪驂駕天馬白鳳靑鸞建玄靈翠節綠羽龍旛前導鈞天廣樂後參八素陽歌巨象麒麟翼衞辟邪十精啟途七辰捧轅億靈萬神浮空而來光明照燿洞朗諸天神霄府相元黄左宮陶公仙伯執籙把籍齊到帝前普度眾生上世亡䰟勑攝鬼帝來聽教言羅酆六宮陰洞鐵山賓友僚佐四大明公司禁侍宸北河列侯各持黑簿削落罪根不得拘留逼合鬼羣元始符命時刻昇遷息苦寒池濯灌天津制魔保舉度品南宮九玄受鍊仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度風火刀兵考訟連對之難超凌三界逍遙上淸上淸之天天帝合延無色之境梵行東方八天基化正宣天帝變津宜由明應玄天帝遍臻元極樂樞冥天帝六關玄玄變眞九仙天帝陣希務夸耀靈華運天帝揀𠀉澤方不驕悲識天帝覺海雲佑祺素寶周儲天帝柳蒙少滋厯爽古澠弘思天帝季路時南方八天李檀舜籍天帝木瑘舒霞洞宴王天帝景唐無央刹聽化高天帝效慈澆穹封冥錄陰天帝伯皇宥中䰟度昇慶天帝用鄰德光超對希樂天帝息常如慈登福果天帝不逸披門神校司官領錄天帝蹈兟修璵西方八天應祈勝妙天帝適端俟通化慮仙易眞天帝靖常崧久世坰畿影化天帝虛凡自微道戸寂然天帝吉動寵邦慜正遙靈師補天帝符符率從玉都蕭韓主成天帝命玄冲昇虛玄變天帝乞章融留梵行太無天帝攝神總靈北方八天太微玉華天帝流傞宛興微覺宗仙天帝正刀蒲三度靈蹟眞天帝椰題衍衡董正黎辨天帝步鏘極眞陰臺總按天帝奏猗連嶽詔遷證天帝唐曜明輪龍化珍惠天帝定智丕旋女靑攄文天帝阿都祉疎三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻返空之音化靈之尊追度之神監䰟大魔返生之靈九聖十眞變化上淸無量之奥深不可詳敷落神眞追度亡䰟今日欣慶受度厯關諸天請滅三惡釋放地牢不經五道䰟升太玄眞王監舉無拘天門東斗濯神西斗鍊精北斗追冥南斗度生中斗統運總司眾靈靑帝護䰟白帝侍魄赤帝養氣黑帝通血黃帝中主萬神無越靑天魔王開運化機赤天魔王法令奮施白天魔王統領八威黑天魔王察凶檢非黄天魔王萬神總歸五帝大魔生化之宗飛行鼓從下攝幽䰟麾幢鼓節考校鬼神位號赫奕高淸上公上天度䰟光勑北酆七玄受度追召冥陽九幽奉簡泰山列章眞魔附靈生氣聚光乘化人天道力恢張敢有干試拒遏上眞金鉞前戮巨天後刑屠割祅黨風火無停追度上世久遠亡䰟化氣受神返生還形魔無干犯眞識炯精三官北酆明檢䰟營不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列言上淸混黄元紀化用渺茫感激眞妙肇立二儀風澤上騰元綱下施陽䰟燿靈陰魄玄暉空洞杳冥中藏至神把握元化無上之尊號曰虛皇玄居玉淸龍漢大劫蒼帝運終延康溟涬長安太空無形無影無極無窮赤光啟運傳道玉宸柏陵長樂丹天始靑開明三境三十六宮元變周流四方之天五斗列宿綱氣相連輪轉升降生育萬靈乃錫玄符九天玉文安鎭五山長保無傾洞淵九壘諸大土皇正行遊梵寶闕雲營軒始之主虎口土龍執天大憲與道同功運以神化包以剛風是爲靈寶玄中之玄羅布萬神統歸三官生化品物考治人民錄善登眞惡業沈淪擔沙負石漣汲溟波驅雷役電幽夜之河萬劫受報備厯酸辛吾不原赦何以超升爲汝追度上世亡䰟是故宣告大道之根皆使開悟與善因緣靈符破獄萬苦咸停玄光照暗朗燿重昏鬼官升遷上聞諸天諸天之上各有生門中有追度上世亡䰟之章飛天靈歌辭參高眞第一欲界追度飛空之音空洞宸景玉妙元皇統神化兮開生度人萬祖億曾中有沈䰟欲念相牽纏幽幽長夜昏不遂齊玄覺何以超冥津滌慮脫塵垢淸心蕩穢氛回我慈慧光靈風冉冉昇𡨚仇當罷對由資大法乘摧破癡迷網逍遙寓十方稽首無上王誦此靈寶章鍊質陽華館受度歸南昌慶會合一際俱蒙登福堂第二色界追度成眞之章杳杳冥途北帝鬼官下統幽府中有罪䰟業禍喪眞色累苦神淪溺劫年以失其生我界險巇穢念紛紛開悟正道禀我玄科獲昇度兮飛越匏河九天冲氣三元妙華混至化兮敷張慶雲統運機感結育成人億曾受鍊解滅𡨚愆殃散福來逮及爾身濟拔無窮共獲帝仙哀斯塵昧故示法言第三無色追度昇玄歌曰玉聖之尊太一上神號曰景精招眞命靈接生降氣度魄超䰟巍巍妙範昭昭洞文開悟無際愛結悉除慧朗回光煥燿幽關赫奕符告上㧞七玄敕赦滯爽孰敢拘延永過三界鍊化朱陵逍遙太淸晏眄劫年我道廣大陶運億千不但於祖考而獲此登昇萬遍旣道備身俱乘景雲此三界之上飛空之中眞王歌音音參洞章誦之百遍七祖飛昇誦之千遍列仙保迎億曾萬祖逍遥太淸萬遍道備普度含生身超三界位證仙卿有聞靈音六天敬形勑制地祇侍衞送迎拔出地戸五苦八難永離北酆䰟度朱陵是謂無量濟惠無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及玉淸眞王隱祕之音皆是大梵之言朗徹九幽追度祖考冥漠久逝之䰟聞是洞文眾苦消解神識超昇非世上常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寶祕於玄都神霄玉淸王府東室寶經祕藏道亨昌運符運下傳若有至人齎金寶質心依舊格告盟神霄然後而付焉道言夫世之生民皆有玄祖上世高雖繼子孫鮮及遠代七世而上禮不稱論脫有先逝代數遼遠祭祀莫及資修之度不克稽用業累未除䰟留地司皆當祈告眞靈請乞報應得告報祥感則已獲超遷夢想不眞多見冡墓考對之像則亡䰟幽繫未脫狴牢皆當齊心修齋六時行香十遍轉經以靑紙丹書大梵隱語著亡䰟姓氏去世年月作四門方符牒之面以丹書昇天劵文背書年辰法師位號盛以絳囊祝地司主者及亡䰟姓名焚於建齋處卽得追度佩券生天福德立降消諸不祥無量之文普度無窮道言夫六親眷屬末學道淺或仙品未充運應滅度身經太陰臨過之時爲其行香誦經十過以度屍形如法䰟神逕上南宮隨其學功計日而得更生輪轉不惑便得神仙道言夫天地始生元始開圖卽有人物人物具備卽有死生死生者神氣來往人命之數也上世亡䰟不惟久遠億曾萬祖有經劫成壞而䰟未超升者世之學士不知天地幾經成壞爲劫長短亡䰟定業幽縶不解者皆當拜奏章表行香誦經焚昇天寶券修齋設醮祈向高眞卽得追度生大福堂夫齋戒誦經功德甚重使亡䰟昭泰長夜通光地獄苦消火山息熖冥曹考罰頓罷炎寒一切受賴其福難勝故曰無量普度天人道言凡有是經能爲兆民行是功德發心修齋燒香誦經十過皆諸天記名萬神侍衞右別至人剋得爲聖君金闕之臣諸天記人功過毫分無失玉淸眞王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君譔元始靈書中篇東方八天達朗披覬玄紀法王魔師赫盧炎池誦光斗魯幽察擷司定廂宛了究氐盈門肥堂勑捕醜虐混開紫皇蔚房靜除寂音思彊汴神逸羅廣明檢禳破解妙行眞氣耀邦南方八天籍羅八臺四明建仙匱錄窮䰟厯都命玄泉沙般拉阿列邅姿妙澄演覺离璘愆阿擺笳頻夷欹連遣那籠卯遏戌虛府蒲圭都文曷騤臻和夢持衮物汨謨塊額頤基西方八天乾帝華樞焦平觀都景孽銖行周萌賓呼烈井驅力玉判歸浮趙章延蹊鹿桓蚪檀追冥叩無綱石尸徒閱頂辭緯奕奕霹靈左翊箕制木玄魔𠀉略負廣須韓司主圖北方八天鼈靈典洞酆牢鎻䰟赤章檢考問籍通詗檛求過諺報罰遣程億資歲成杳檄文靈變孤驛弭譎躍洞京雕嚚布款孽齊交明昉邊冲廬九口津洴馬猛戮奴奔愛莽神道言此諸天中大梵隱語無量之音舊文字皆廣長一丈刻書北淸玄天寶幢之上散酆都泉曲九幽之罪赦積世亡䰟追度超昇利拔苦爽解脫業因往劫定債獲免償還自在逍遙不拘泰山子孫福報貴祿宜官家無故氣傳逮不行天保其昌德富爾身靈應元君昔書其文以爲正音有知其音能齋而誦者諸天皆遣追度靈官下拔其䰟書其功勤上奏諸天萬神朝禮地祇侍門大勳眞王保舉神霄道備剋得遊行三界昇入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致靈人下觀上帝遙唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅淸河海靜默山嶽吞烟萬靈振伏招集羣仙天無氛穢地無祅塵冥慧洞淸大量玄玄也重刊道藏輯要元始無量度人上品妙經卷之五十六濟度死魂品道言昔於紫暉玄濟天中綠景虛明大慈靈土受元始度人濟度死魂無量上品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖高尊北酆大帝九幽拔罪天尊金闕濟度天尊太一救苦天尊大慈大悲救苦眞人大惠眞人無鞅數眾乘空而來碧燿流煇華雲映彩龍軿鳳駕寶蓋靈旛彌漫羅列香藹氛氲日月停景洞朗太无九日九夜諸天瓊樓玉闕雲殿霞房一時同明下極崑崗三山十洲四海九河泉曲之阿酆都寒庭長夜之關悉被神光普獲開煥萬象澄淸十天昭廓一國地土山川林木緬平一等無復高下地成紺碧無有異色眾眞侍座元始天尊玄坐空浮瓊光洞陽寶牀之上說經一遍諸天大聖同時稱善是時天地山嶽鐵城大獄自然齊啓咸釋罪爽來聽法音說經二遍鑊湯聲震忽變淸涼水吐靑蓮異氣芬馥萬刃刀山悉爲寶樹杻械銷鎔骨骸生復還得成人俱承道蔭說經三遍仙聖讚揚靈瑞咸臻說經四遍一切人民悟解法要說經五遍昆蟲善慧省識罪原說經六遍虎狼毒蝮滅斷惡根說經七遍𡨚和解釋異骨成親說經八遍鬼道塞絕永保生津說經九遍幽沈滯魄鍊化昇遷說經十遍道德純一俱登妙眞是時一國有情有識冥不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品考較濟度大神無鞅之眾浮空而至說經二遍南方無極無量品司察濟度大神無鞅之眾浮空而至說經三遍西方無極無量品司禁濟度大神無鞅之眾浮空而至說經四遍北方無極無量品司化濟度大神無鞅之眾浮空而至說經五遍東北無極無量品典獄濟度大神無鞅之眾浮空而至說經六遍東南無極無量品九幽濟度大神無鞅之眾浮空而至說經七遍西南無極無量品泉曲濟度大神無鞅之眾浮空而至說經八遍西北無極無量品羅酆濟度大神無鞅之眾浮空而至說經九遍上方無極無量品超生濟度大神無鞅之眾浮空而至說經十遍下方無極無量品昇化濟度大神無鞅之眾浮空而至十遍周竟十方無極天眞濟度大神一時同至一國男女傾心歸仰來者萬億並駕同驅靈光散彩華霧彌空八部六天三官九署威光召致異趣苦魂無鞅之眾迮國一半土皆偏䧟非可禁止於是元始洞觀遐邇哀念眾生手執寶翇翇出妙光光及十方一切聽法天仙聖眾自見身相有如瑠璃內映濯羅鬼神魂爽各於其類中得圓滿心體淸淨業火消除仙花時飛大震瓊音宣明法要爾等眾生造諸罪惡累彼死魂飄蕩無依散入諸趣備經輪轉莫測道緣今以九陽神霄大梵之氣化十二靈文濟度死魂超昇天境始從亡歿以鍊屍形屍神守骸滯爽超昇仙聖合德還自成人出離三塗往度八難大眾欣躍仰俟恩光於是元始引眄惻然鑪炷寶香上結密雲化爲玉闕去地九丈內垂天虹熒煌五色接待大眾俱入其中元始申命拔罪天尊羅酆帝宰救苦眞人無鞅數眾同升化闕蘂華紫玉靈妙之臺天人仰看惟見勃勃影現萬殊旣入玉闕不知所在國人廓散地還平正無復欹䧟元始卽於紫臺之上說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂無遺響是時天人遇值經法普得濟度全其道眞無有沈淪傾土歸仰咸行善心不愆不犯不忿不爭不迷不忘不愛不著不擾不驚言必眞正口無惡聲齊恩慈愛道化合并存亡安泰度樂生榮經始出教幽顯協德預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是眞王內諱百靈濟度之隱名也非世之常辭上聖已成眞人通玄究微能悉其章誦之十過諸天遙唱萬帝設禮沈逝死魂證升仙品緣愛積習皆獲蛻捨羣魔敬衞蕩化鬼精至學之士誦之十過則四司釋訟九獄除𡨚回屍起死白骨返形普受濟度以得生成所以爾者學士誦詠寶章招眞召靈妙氣來臻道生神德故可下濟死亡卽獲超度而已莫不昇遷輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人無量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到酆都六洞鬼帝官君寒庭泉曲幽夜之河泰山地壘主宰神靈簡奏上功超拔罪魂億曾萬祖幽沈苦爽皆卽受度上昇朱宮格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經皆卽受度飛昇南宮世人受誦開度九玄出離地獄生福天堂延慶後昆永無身殃此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役陰官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經濟度死魂解釋天官罪考之愆五方大殺屍劫之鬼威毒咸息開貸死魂獲度南宮逍遙自然七月長齋誦詠是經濟度死魂解釋地官罪考之愆五嶽四司北都羅酆曠野山澤社令城隍應關囚對禍害滅連黑簿削除白簡上生十月長齋誦詠是經濟度死魂解釋水官罪考之愆北海河侯河伯溟泠四瀆主宰當令幽苦摙汲冥魂役難散除度越生門八節之日誦詠是經濟度死魂解釋罪考八方大獄八洞鬼牢悉承道化永變福庭迷識開悟咸登妙津得生世間智用高明務勤上學克致成眞三元之日誦詠是經濟度死魂各遂其情鍊度南宮返生受靈魂神澄正萬氣長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上淸道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐靑黃白三色雲氣之中內外蓊冥有靑龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室內項生圓象光映十方如此分明宻咒曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啟所言今日吉慶長齋淸堂修行至經無量度人願所啟上徹徑御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經

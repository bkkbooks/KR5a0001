front:
  text: 靈寶无量度人上品妙經卷之三十玄十
  hash: sha256:0ce7c5b392d9036b8162aec8ca3fba949c81a440b3ad9c403c7f9fadaa3fda28
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_SJB_030-010196b, image: sjb/01/010196b.png}
body:
  text: 斷絶胎根閉塞死戸品道言昔於始青天中紫清玄洞五明華宮受元始度人斷絶胎根閉塞死戸无量上品元始天尊當說是經周回十過以召十方始當詣座天眞大神上聖髙尊神霄玉清眞王太上消魔玉清神王扶桑青華帝君後聖金闕帝君萬天帝主無鞅數衆乘空而來飛雲丹霄緑輿瓊輪羽蓋垂䕃流精玉光五色鬱勃洞煥太空九日九夜諸天日月星宿璇璣玉衡一時停輪神風静黙山海藏雲天無浮翳四氣朗清一國地土山川林木緬平一等無復髙下人皆悟道成法土變作碧玉無有異色衆眞侍座元始天尊玄坐翠浮玻瓈靈陽實座之上說經一遍萬天帝君同時稱善稽首再拜咸得見道是時一國男女死者復生生者悟道說經二遍鳥獸介蟲皆得長生說經三遍四時和平無有寒暑說經四遍星宿日月天界停住無復東行說經五遍疾病沉痾並獲痊瘥說經六遍地土平正祅塵自潰說經七遍五行皆一混合天成說經八遍娠胎皆岀芽蘖甲坼已生未生立獲生成說經九遍善惡無迹心歸正化說經十遍華夷一等無有邪僻是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方扶桑青華洞境至眞大聖無鞅之衆浮空而至說經二遍南方赤靈陽光洞元至眞大聖無鞅之衆浮空而至說經三遍西方素景皓靈洞扶至眞大聖無鞅之衆浮空而至說經四遍北方玄靈至妙洞化至眞大聖無鞅之衆浮空而至說經五遍東北上靈通理洞妙至眞大聖無鞅之衆浮空而至說經六遍東南鎭靈體元洞神至眞大聖無鞅之衆浮空而至說經七遍西南燿靈瑩空洞徹至眞大聖無鞅之衆浮空而至說經八遍西北華靈統化洞逺至眞大聖無鞅之衆浮空而至說經九遍上方神靈普變洞觀至眞大聖無鞅之衆浮空而至說經十遍下方靜靈化生洞慧至眞大聖無鞅之衆浮空而至十遍周竟十方無極天眞大聖一時同至一國男女傾心歸仰來者有如黃霧蔽密瑞煙雜沓無鞅之衆迮國一半土皆偏陷非可禁止於是元始内發心光外飛神氣上出泥丸火光煇燿遍於十方天界然後収光返照歸本聚氣變成寶珠狀若露圓去地億數萬丈元始登引天眞大神上聖髙尊諸天帝主十方无極至妙神靈大聖無鞅數衆俱入寶珠之中天人仰看惟見勃勃從珠口中入既入珠口不知所在國人廓散地還平正地復元色無復碧玉元始即於寶珠之内說經都竟衆眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得長生全其本年無有夭傷傾土歸仰咸行善心不妄不貪不滿不盈不傾不敗不去不來不住不見心無妄想身無邪欹齊同慈愛異骨成親國安民豐欣樂太平經始出敎一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝至靈神王内境妙道變仙化形隱祕之音亦是上帝内諱萬神之隱名也非世上之常辭上聖已成眞人通玄究微能悉其章誦之十過諸天遥唱萬帝設禮河海靜黙山嶽藏雲日月停景璇璣不行群魔束形鬼精滅爽回屍起死白骨成人至學之士誦之十過則五帝侍衞三界稽首萬神護法百靈祐身濟度垂死絶而得生所以爾者學士穢氣未消體未洞眞以制十方威未制天政德可伏御地祇束縳魔靈但爲常文未通微妙即却死而已不能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因縁萬災不干神明護門斯經尊妙獨歩玉亰度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到億曾萬祖幽魂苦爽皆即受度飛昇朱宫皆得鍊形受化更生復爲至人而好學至經功滿德就皆得神仙飛昇金闕遊宴玉亰也上學之士修誦是經皆即受度飛昇南宮中學之士修誦是經無有生滅去來快樂得陞仙籍下學之士修誦是經即得神魂爽利疾病消除住世長年此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寳不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖罪及爾身長有天官侍香五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經死戸立閉胎根斷滅形神微妙飛昇南宫七月長齋誦詠是經身得神仙諸天書名金簡玉符召魂通微得獲長生十月長齋誦詠是經爲國王帝主君臣父子安鎭國祚保天長存道玄不絶永斷劫運安鎮其方民稱太平八節之日誦詠是經得爲九宫眞人本命之日誦詠是經魂神澄正萬氣長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十六通上聞三十六天心拜三十六過閉目靜思身坐紅黄紫三色雲氣之中内外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月映照光燿洞空洞煥天地項生圓象遍滿十方如此分明密呪曰无上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齋清室修行至經无量度人願所啓上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始无量度人上品妙經元始大洞徊風混合本章上品妙首萬變度人千眞隱韻離合自然太極玉文洞神上眞元始祖劫開化諸天翕闢隂陽是生萬彚自然大道上无色界下无色根虚无渺漠惟道爲身五文開廓普植神靈無文不顯無文不靈無文不動無文不明無文不化無文不成是爲上清玉晨之天九霄梵氣蘂笈靈臺金闕玉京上極無上大羅聖境虚无寥廓若隱若存七景華房九變龍庭昌明玉閤紫微天霐純陽梵氣遍徹十方中有南極長生大君中有玉清消魔神王中有扶桑青華帝君中有好生韓君丈人中有南宮度人解厄定命天尊中有南極宫中慈仁通化眞君回骸起死无量度人今日校録諸天臨軒東方无極青華神王長生大聖无量度人南方无極赤靈神王長生大聖无量度人西方无極素景神王長生大聖无量度人北方无極玄妙神王長生大聖无量度人東北无極保命神王長生大聖无量度人東南无極集慶神王長生大聖无量度人西南无極寶輪神王長生大聖无量度人西北无極梵氣神王長生大聖无量度人上方无極橫天神王長生大聖无量度人下方无極鎭壘神王長生大聖无量度人十方至眞威德神王長生度世无量大神並乗飛天六龍雲輿九華寶輦翠蓋雕輪毛節朱幢驂駕鸞鳳跨馭金龍建降魔辟非五方靈節持除禍賜福四神靈旛前嘯靈璈汎景後吹簫瑟齊鳴獅子白鶴嘯唳嗈嗈太乙侍從眞王翊軒億仙萬衆從空而來迎衞寶駕恭慶靈音統法持文諸天靈魔上相主宰天眞神王南昌上宫韓司主録監生大神執籙把籍齊到帝前隨所應度嚴校諸天普告三界無極眞王神霄玉府扶桑華宮三清九霄億兆天界百萬仙國上解祖考億世萬劫惡籍罪簿消滅惡根不得拘留道合仙眞元始符命普率九埏南靈火光度越靈魄北府眞符解脫幽魂神王保舉超生南宫死魂受鍊仙化成人生身受度劫劫長存隨劫輪轉與天齊年鍊屍聚氣保護胎仙内境汎光定息収玄永斷死戸纒鍊幽關超凌三界逍遥上清上清之天天帝玉眞神霄之境梵行東方九天重華文朝天帝照汎叨景六晨汎景天帝定玄耀明至眞極瑶天帝浮羅永延上靈元化天帝大元辰并曲鼎號都天帝勝金生光瓊瑛汎景天帝有提辯論七晨扶明天帝苑育飛衡推虚動神天帝昔齊浮黎樂化自宥天帝冕更容曦南方九天晃朗赤梵天帝元競錦霓惠正煇奉天帝擁愛加吟妙音飄颻天帝號施幸綿華離正定天帝呼立機成宣景六虚天帝整婆阿貪化形度敬天帝勃負孜眞龍希幾遍天帝從扶郷輕陽廓曠晞天帝緬移神機錦文絢赫天帝景束梵寧西方九天皓渺舒蕩天帝握林俯極倐颺始平天帝影浮金華落塵普盛天帝執翁施零蘂庭皇威天帝粤拂思誠元舉星瓊天帝顯加膺象龍政委恩天帝運嘉玄康快樂敷變天帝欲化無垠逍遥請福天帝豁落行夷旻景扇飊天帝動鬱蒼題北方九天玄明證赤天帝石育俯昌遠揚緑霄天帝浮纏方渶元漠誓訓天帝順通兮凝臨蒞物成天帝目羅景輪政理分化天帝範擲俱重誘黎汞勝天帝拱越林夷馥明大普天帝嚴度丹霞續區廣蒙天帝棟零延祺玉元淵淨天帝景大羅長三十六天三十六帝諸天隱祕萬天隱名天中玉文大梵靈章三天密諱天中神音天帝髙尊天眞神王上相大魔靈文玉音回風混合鍊屍飛昇無量之奥深不可詳守雌抱雄是爲神眞普度天人今日欣慶受度磿關諸天請滅三惡斬絶地根飛度死戸名列眞仙魔王監舉無拘天門東斗監生西斗除殃北斗輔靈南斗化魂中斗成眞總監衆靈青帝育生白帝守神赤帝升氣黑帝流光黃帝靜中萬神祐身青天魔王辟穢受形赤天魔王内寶神眞白天魔王却邪輔正黑天魔王監持護法黃天魔王守衞萬靈五帝大魔萬神之宗飛行一身總貫泥丸藏氣元精澄神安鎭坐觀太空自號赤符諸天上功元始度人皆稟生宫神嬰受化普掃胎根斷除血穢閉塞死門流精反聚俱入妙庭天魔接引上升玉都屏除瘴癘鬼毒祅精天丁前驅大帥仗旙擲火萬里流鈴八衝敢有干試拒遏上眞金鉞前戮臣天後刑屠割鬼爽風火無停千千截首萬萬翦形魔無干犯鬼無祅精七魄寧謐三屍速奔外營百關内保萬神白虎守芝青龍纒液普告無窮萬神咸聽三界五帝列言上清玉晨寶曆㑹玄神章龍漢開劫降自華房混沌九變斷滅邪亡戸戸即開上無道境下無道基生死之道玄牝之門惟神與氣散聚無停内觀元神反本方成回風死道復入生門還廵泥丸遍歷精門三十九戸戸戸可死閉之即生生從何戸戸戸即開閉之不出可以長生名戸即穴實穴即精神氣交會龍虎固根血凝神聚不散乃成散之無窮不可名成氣壯滿溢通徹泥丸流布丹田升降反嬰有出有入有死有生不出不入斷戸除根斷除之道以火鍊精安鎭其戸胞凝血根陽施隂化流響扇營上應天關下集百神實乃丹精閉即神英七星分散飛行隂房二儀攝氣流迹陽光分之旣停隂陽交并以赤入黑變黃成紫精華流暢血穢殄平上納下奔死道未降赤霞遼遶瓊漿混迎上和下合自然成眞胎根旣存道成正生根斷乃仙名列南宫父母胎孕化體成形散之即氣聚之有名聚散爲根斷之長存與道合眞天機祕密洞徹萬靈三天龍篆元始玉文赤書玉字錦符朱囊洞妙汎景保劫運延梵氣彌羅萬範開張元綱流演三十六天輪轉無色周回十方璇景歷機回度五常三十九氣總禦一身八方冥合氣勝乃生玄中妙理斷絶胎根死戸週密得道成仙汎景太霞嘯詠洞章金眞朗郁流響雲營玉音攝氣靈風聚煙紫虚鬱秀輔翼萬仙歸正合符鍊之見眞眞中有神長生大君消魔神王紫微元君無英公子髙玄眞人執符把籙保命生根上遊上清出入液房明梁之内神化之中下鎭人身絶塞死根結胎五氣混合百神七世回靈萬眞靈煇神風飊粲仙道貴生无量度人上開生門飛天法輪日月植根安固黃庭宿命因縁普受開度仙化生眞身得受生上聞諸天諸天之上貴此仙門中有大洞消魔之章玉清靈篇道御髙眞第一髙上神霄玉清王靈祕之音元始浩劫玉清靈文迷塗悟解洞徹眞空天仙所愼祕乆不通斷絶死戸直入生門三屍殄滅五斗束魂血化成精反此神嬰七祖受庇百神咸寧出有入無安鎭黄庭上保泥丸中理玄津下流丹田百關息封内體充溢我道乃成第二太上消魔玉清王隱韻之章天之大隱寶明梁塞下戸愼之祕元都結胎却生死守雌抱眞一是爲長生路斷絶生死根持握九命門仙庭回九變神聚反嬰童上無億劫祖惟道化爾身顒顒三境文過之即神丘披雲散紫煙離合由景輪禁戒非可言流光聚泥丸正氣召萬神滅屍七孔隂神華燿日英三素飄雲營回風扶晨景眞源六虚靈太微轉日月度魂飛玉亰混沌生太漠故曰玄歌音第三扶桑青華帝君歌曰萬象化體百神歸根物備乃靈惟形與身大道之本是爲玄精内觀即見外境隱停無此上道保生長存黙誦萬過混合天成血穢斷除消滅惡根仰徹仙位超度南宮迷悟不解永沉鬼倫天籍祕語丹華杳冥南和握節北極守靈金氣入三界玉髓通九門帝一混合眞無顯亦無明此三界之上玉文之中眞王歌音音參洞章誦之百遍名度南宫誦之千遍斷絶死門萬遍道備飛升太空過度三界位登仙公有聞神音千眞祐形敕制地祇侍衞送迎拔出地戸五苦八難七祖升天受事九宮魂度朱陵鍊屍更生是謂无量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈神王玉清眞王隱祕之音皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奥難可尋詳上天所寶祕於神霄玉清王府東壁經室華堂依玄科六萬劫一傳若有至人齎金寶質心依舊格告盟三天然後而付焉道言夫天地運度亦有否終日月五星亦有虧盈至聖神人亦有休否末學之夫亦有疾傷凡有此災同氣皆當以已鍊形受化濟度十過轉經移神駐氣復得更生無量之文普度無窮道言夫末學道淺或仙品未充死戸未閉胎根尚存運應滅度身經太隂臨過之時同學至人爲其開神敷經攝氣傳道以度屍形如法魂神徑上南宫隨其學功計日而得更生輪轉不惑便得神仙道言夫天地運終亦當修齋行香誦經星宿錯度日月失昏亦當修齋行香誦經四時失度隂陽不調亦當修齋行香誦經國主有災兵革四興亦當修齋行香誦經疫毒流行兆民死傷亦當修齋行香誦經同學命過亦當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能爲天地帝主兆民行是功德斷絶生死超凌仙宫有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衞右别至人尅得爲聖君金闕之臣諸天記人功過毫分無失天中魔王亦保舉爾身得道者乃當洞明至言也諸天中回風混合隱語无量音道君撰元始靈書中篇東方九天華明會竒燿魔赫弈玄精散妙絳英緑飛禮俯呼嘉汎屏境冝馥郁洞杳回禦泛輕靈褾煥麗蕩蔚薈陵納汚成灑慶集霄零尚佳那育冒曲萬亰叨回景鬱伐緬沉煙翼紀角纒六度虚玄南方九天嚴俱慕因光捍香披赫火吞霞梵氣九疑攝機汎陶龍遍赤旗枝離亢鬱林峯内希慶眇雲羅玉附化屍停升霽表揆徹永延澤逺紅輪覆明持圓廓靄敬連繡落明機定察并房大液浮黎西方九天定希交粹宛陵咎基靡恪凡潤幸施緑離指益繁影靄雅同遲空蕩巘訥干施惠文托落標由尋蘇延施潰緑首辯力轉回眞迎照童苴倚母幾𡎘皓仰塗府彼億眞庭究本知源翼生浮靈北方九天坤符握節炳煥太霄摛兊侵氐擇邈玄標都浮偏漠氷蓊虚林旣魄見素齊叱封吟渠因劫弈晏勲加明綱演覆壁闡發煇停執符煥麗賂神保寧氣氤紫秀顯微徹升通神妙空徑暁成人道言此諸天中大梵隱語无量之音琅書玉文皆龍文丹篆寶篋玉函祕於東華堂金縷寶花瓊瑶浮光萬象神藏之中神霄玉清眞王扶桑音華帝君皆知其音以傳其文能齋而誦之者諸天皆遣飛天神王持經神吏下觀其身書其功勤上奏諸天萬神朝禮地祇侍門玉清消魔神王保舉上仙道備尅得超度玉亰升入金門此音無所不通無所不降無所不度無所不成天眞自然之音也故誦之致飛天下觀上帝遥唱萬神朝禮三界侍軒五帝侍迎鬼精自亡琳琅振響十方肅清河海靜黙山嶽吞煙萬靈振伏招集群仙天無氛穢地無祅塵冥慧洞清大量玄玄也无始无量度人上品妙經卷之三十

front:
  text: 靈寶无量度人上品妙經卷之二十五玄五
  hash: sha256:deaed8ab0b6534b45d9a4b02bb1022d049887cc98a55134d4908355fc53d5328
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_SJB_025-010163a, image: sjb/01/010163a.png}
body:
  text: 赤符丹光品道言昔於絳霄天中丹景清眞天玄明土受元始度人赤符丹光无量上品元始天尊當說是經周回十過以召十方始當詣座天眞大神赤靈丈人三氣天君丹光九仙上聖髙尊妙行眞人無鞅數衆乘空而來玉緯飛輪羽葆交䕃太霄騰晶八素流光璇極珠𨇠煥赫元綱五日五夜三清四境无量諸天上極大羅下通黃闕各現赤混開劫飛霄寶符丹霞光散照映八門一國地土山川林木緬平一等無復髙下土皆作紋玉凝煇瑩徹無有異色衆眞環侍元始天尊停駕空浮九龍陽燧神金萬變法輅之上說經一遍諸天大聖同時稱善是時一國男女仰聽聖敎黙悟重玄說經二遍天光内發照朗昏冥說經三遍神氣合混萬景生津說經四遍虚明曠達觀見十方說經五遍赤符丹光現於身中說經六遍生道交會疾癘蠲消說經七遍北酆暗域報對休停說經八遍金簡書功玉符定籍三官告命形化飛仙說經九遍法露珠英潤澤一切說經十遍十方三界无極幽關无量群生逍遥離苦是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方无極无量品寶生大神无鞅之衆浮空而至說經二遍南方无極无量品洞浮大神无鞅之衆浮空而至說經三遍西方无極无量品燿明大神无鞅之衆浮空而至說經四遍北方无極无量品太一大神无鞅之衆浮空而至說經五遍東北无極无量品保安大神无鞅之衆浮空而至說經六遍東南无極无量品持化大神无鞅之衆浮空而至說經七遍西南无極无量品玉靈大神无鞅之衆浮空而至說經八遍西北无極无量品飛霞大神无鞅之衆浮空而至說經九遍上方无極无量品大變大神无鞅之衆浮空而至說經十遍下方无極无量品沖厚大神无鞅之衆浮空而至十遍周竟十方赤符丹光大神一時同至一國男女傾心歸仰皆見赤文大字遍滿虚廓丹光洞照十方同明内見自己身中心通萬道外與法合即名赤符見察萬殊異體同照即名丹光内外之道皆是元始外生天地内化一身皆同此道自非列聖開敎不能化成譬如混沌初造終始九劫若非赤明不能開圖一身始生毛髮肢節九竅雖具若非神光外見心光内通一切聖賢不能成就是故我等咸悟元始所說大法役運神變開導天人來者有如細雨密霧无鞅之衆迮國一半土皆偏陷非可禁止於是元始懸一寶珠大如黍米在空玄之中去地五丈元始登引天眞大神上聖髙尊妙行眞人十方無極赤符丹光至眞大神無鞅数衆俱入寶珠之中天人仰看惟見勃勃從珠口中入既入珠口不知所在國人廓散地還平正無復欹陷元始即於寶珠之内說經都竟衆眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸行道心洞見洞識洞妙洞知洞悟洞徹洞照洞微洞明洞鍳言符至理黙契玄機齊同慈愛異骨成親國安民豐欣樂太平經始出敎一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝内名隱韻之音亦是眞王内諱百靈之隱名也開示大法造立天地内生人物外成混沌赤符應合丹光纒綿元氣烹煎眞火化鍊以成三界匠立萬天爾能體之自然得道非世之常辭上聖已成眞人通玄究微能悉其章誦之十過諸天遥唱萬帝設禮河海靜黙山嶽藏雲絳煙布逸霄光亘玄心符内充丹寶外應群魔束形鬼精滅爽回屍起死白骨成人至學之士誦之十過則五帝侍衞三界稽首紫煇遐映神晶注盈妙開元造神泊其間魔精喪眼鬼祅滅爽濟度埀死絶而得生所以爾者學士穢氣未消赤符隂隱丹光内濳體未洞眞以制十方威未制天政德可伏御地祇束縳魔靈但却死而已不能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因縁萬災不干神明護門斯經尊妙獨歩玉亰度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十遇諸天齊到赤符度生丹光啓幽億曽萬祖幽魂苦爽皆即受度上升朱宮格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛升金闕遊宴玉亰也上學之士修誦是經神契赤符道融丹光皆即受度飛升南宫世人受誦則延壽長年丹赤之華注澤屍腐骨剛氣眞後皆得作屍解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經赤符召和丹光運明三元錫契萬象蒙生爲上世亡魂斷地逮役度上南宫七月長齋誦詠是經赤符召隂丹光育精四明奏功五老奉經身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經赤符召陽丹光用章九宫合氣玉女𧵥漿爲國王帝主君臣父子安鎭國祚保天長存世世不絶常爲人君安鎭其方民稱太平八節之日誦詠是經赤符周建丹光流行八景合體六司命眞得爲九宫眞人本命之日誦詠是經赤符召神丹光繞身魂神澄正萬氣長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黃白三色雲氣之中内外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室内項生圓象光映十方如此分明密呪曰无上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齋清堂修行至經无量度人願所啓上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始无量度人上品妙經元始洞玄靈寶本章赤符丹光上品妙首明識度人龍康廣運開化因縁大洞隱章虚含至眞太无三一流結諸天碧落敷明髙峙天根大經離合萬境分神赤符帝氣丹光上靈恢張玄範洪歷冥冥六風交煥空象告成玉文肇啓天道流行是爲元造蒼混飛煙太霄鬱單玄丘景仙茫茫正化皇極推遷瓊羅騫仞至妙靈圓三周九復包絡綿綿億天群品歸眞玉垣正行遊梵過度生關中有赤明校録之神中有玉符攝氣之眞中有大丹流熖之君中有炎光開化丈人中有太一入纒黃庭鳯紐混合大洞髙尊綂御玄變清都化身金篇消魔廣大飛輪三十九帝廓開八門今日敷教萬眞臨軒東方元極寶生神王長生大聖无量度人南方无極洞浮神王長生大聖无量度人西方无極燿明神王長生大聖无量度人北方元極太一神王長生大聖无量度人東北无極保安神王長生大聖无量度人東南无極持化神王長生大聖无量度人西南无極玉靈神王長生大聖无量度人西北无極飛霞神王長生大聖无量度人上方无極大變神王長生大聖元量度人下方无極沖厚神王長生大聖无量度人十方赤符丹光神王至眞度世飛天大神並乘三華絳霄流雲鳳輿瓊輦天蓋地輪驂駕朱光玉角神獸蒼鱗火鬛蛟龍建招眞之節告靈大旙前列玉虚寶仗後從三元化兵洞神九仙飛空歩虚四帥啓塗三師告盟億乘萬騎浮空而來傾光回駕監眞度生赤符經天三界同生丹光六飛萬物洪施心知目見神動意隨天人仰法至化同歸大象流布洞虚極玄方諸符召超登九天九天上宰元黄左宫流雲司命保世大神執籙持符同會帝庭隨所應度天化浮沉普告三界八極雲營崐輪瑶闕廣野寒扃五方玄嶽四極眞公九元大憲化見玉文疾除故氣清正生根不得拘留上合仙眞赤符丹光時刻飛升北都六洞普赦幽魂制魔保舉度品朱陵死魂受鍊仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度風刀水火之難超凌三界逍遥上清上清之天天帝朱明無色之境梵行東方八天靜都勤明天帝妙𢖍具傍昌郊九華天帝𡖖靈尹登符應智靈天帝曉虚妙常灼變丹神天帝遘氣圖生蒼亰寶風天帝化招境形聖基密照天帝鑒眞定微運晶遂方移想天帝縳奔囊孤高虛赤符惠生天帝井虚歷維南方八天陽光化生天帝景中惟寧九宫明燿天帝閟淵求方丹霄注靈天帝赫爰胥延曲晨紫眞天帝護斗召仙太微瑞靈應精天帝直波夷倫光慧洞無天帝剛過擇躬寂意思玄天帝保玉令脩洞玄摧魔拱雲天帝飛圓曜隨西方八天瑶府定民天帝按涂知元寒庭對兵天帝戒無象虚司覆開世天帝慈流升眞功定籍天帝問初顯非太上素晨禁綱天帝樞牢勝當内池誕華優陽天帝耨達用義簡微求祖知變天帝洞仙常師主録度仙超化天帝山英謝方北方八天梵樂録魔天帝變龍擲旌垂慈飛眞無想天帝志明淵符玄明左期靜光天帝甫昭叢希五氣交符鍊神天帝優頻景珠張育行眞天帝納生辨殊龍桑命仙天帝屈空冥神朱明合氣天帝極監盟眞靈綱正氣總隂天帝主羅察冥三十二天三十二帝諸天隱諱諸天隠名天中空洞自然靈章諸天隱韻天中之音天中之尊天中之神天中大魔天中之靈九竒十耦和合自成赤符丹光變化上清无量之奥深不可詳敷落神眞普度天人今日欣慶受度大化開生感變幽關大會神靈請滅三惡斬絶地根斷胞閉死名列太玄眞王監舉無拘天門東斗執契西斗召仙北斗奏簡南斗列言中斗坐鎭運轉元關帝魁玉籙洞鑒冥無天眞玄一五斗之符下元化氣太劫丹書青帝施令白帝禦敵赤帝正憲黑帝建立黃帝中主變化無極惟符所指隂陽乃宣吉凶示象善惡相連青天魔王皛晶鬱羅赤天魔王明燿絳霞白天魔王金眞保華黑天魔王鼓化玄波黃天魔王安鎭崇阿五天大魔萬神之宗飛行鼓從總領天兵持幢仗節遊觀太冥自號赫弈諸天齊功上天度人嚴攝北酆眞王受命普掃不祥三元降詔大憲恢張飛符攝御清蕩十方定界無邊風火八衝敢有抗拒糾送酆宮元眞振劒天曜施刑屠戮邪魅収捕無停千千斬馘萬萬滅形魔無干試鬼無祅精太隂北都按察鬼營不得怠縱飛章奏罡普告三官正道流行考功定籍書名紫清玄曜大劫寶曆龍康洪運周流纒結隂陽一氣交絡開隆上皇飛生玉音廣布十方丹華升降輪轉剛風眇眇億氣赤混玄宫上周圓曜下變重淵風動八冥洪極成天赤符化鍊丹光發煙天上天下煇朗幽冥肇形虚象廣大無窮鴻濛溟涬豁落舒光太眞啓圖運度自然朱陵敷演徊風上篇碧簡金章玉籙瑶編保安天地永劫綿綿梵炁彌羅萬範開張丹光成立三境諸天輪轉崐丘包羅億千元老下敎普度群仙三天三地灌氣三垣八景玉羅氣入髙玄玄中至眞丹霄上𡖖佩天瓊文校録稱尊合景飛霞執詠洞經金華流彩普攝雲營玉章大誥鳳簡龍書徊天隱道接閱元圖千和萬合自然成眞眞中有神東華天君方諸帝一太素千精玄光保命混洞延生赤符丹籙永鎭玄根上遊清微出入洞虚巍巍天闕列聖之居下降種民升舉清都中理太極混合空无十轉回靈萬景同升仙道貴生无量度人上開八門經天法輪罪福禁戒宿命因縁普受鍊度死魂生身身得受生上聞諸天諸天之上各有生門中有混天開劫之章仙聖靈篇辭參髙眞第一混極飛仙赤符之音太虚元始生成天地空極杳冥肇于一炁廣大無邊化生眞帝上居玉亰三界綂制威錫威靈不問巨細周流合變成此大器赤書敷落靈仙交會五山安鎭玄嶽髙峙崐丘閬風黃老爲治虚皇憫衆生開演玄妙義洞章攝魔群億天蒙大庇第二玄變眞君丹光之章嚴嚴大有宮萬靈朝上皇三氣包太虚飛霞結元綱上開廣瓊室下布流景房三垣懸帝座赤文羅五方内陳玉極眞保此大經帝空生纒地紐冥冥度龍康眞王馭天馬寶闕舒丹光天運啓玄圖玉道發嘉祥元君乘化氣神變不可量俯觀三界民欲海徒茫茫披誦洞玄篇超升太福堂第三赤符丹光眞王歌曰岧岧金闕下臨太清碧霞鬱合化此金城巍巍虛象飛臺玉亰九龍大劫生育神靈妙氣交合變化天根赤文列聖丹光上眞三十九帝與道同生持握天憲空洞皇君校鍊飛天驂駕龍驎周遊三界正道開明威光下濟照徹重昏清蕩北酆普赦幽魂萬類逍遥十方蒙恩此三界之上飛空之中眞王歌音音參洞章誦之百遍名度南宫誦之千遍眞王保迎萬遍道備飛升太空過度三界位登仙公有聞靈普魔王敬形敕制地祇侍衞送迎拔出地戸五苦八難七祖升遷永離鬼官魂度朱陵受鍊更生是謂无量普度无窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈眞王隱祕之音皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奥難可尋詳上天所寶祕於神霄玉府東藏經室依科三萬七千年應運下傳若有至人齎金寶質心依舊格告盟眞王然後而付焉道言夫赤符道逆丹光内隠則二儀失序五行數睽故天地運度否終日月五星虧盈至聖神人休否末學之夫疾傷凡有此災同氣皆當齊心修齎六時行香十遍轉經福德立降消諸不祥無量之文普度無窮道言夫末學道淺或仙品未𠑽運應滅度身經太隂臨過之時同學至人爲其行香誦經十過以度屍形如法則赤符照心丹光還形不與物化神凝氣清魂神徑上南宮隨其學功計日而得更生轉輪不惑便得神仙道言夫天地運終星宿錯度日月失煇四時失度隂陽不調國土有災兵革四興疫毒流行兆民死傷師友命過良善橫殃皆當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受賴其福難勝故曰无量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋焼香誦經十過皆諸天記名萬神侍衞右别至人克得爲聖君金闕之臣諸天記人功過亳分無失天中眞王亦保舉爾身得道者乃當洞明至言也諸天中大梵隠語无量音道君譔元始靈書赤符丹光玉篇東方八天弗黎竟桑徯邅輔璫庚福奠神揚騎時房兖枚郁澮周勤氏梁越贊傳野畢容治光按披曜師維誓鄞康靜學原蔽密都朱堂參據角首穹竒僖章絡昔魔靈粲秀東疆南方八天赤符三氣火山炎精照煥濳蟄幽離浮瓊定顯妙樞紀錫幾冥善旅逸修豫盈司奔嶽迭命召魂林繁騰無鐸演廬盤河哲承綿度令髙慈尤并艱肆除獻寧太霞資明西方八天碧巒濟佑浮空景涯神策飛籙早馳玄華奎芒皇俅禄員禹瑶遵善旣邈閉延投嵬良茲印宙玉微化伸昊素格略利淵開仁掌紀縁釋湊智遠亰抱月緑霞詠此至音北方八天衡圍太始芒露激虚句陁支云桓倣箕無正鄰投黃聚沖攸靈欲蘇踐荒祥實觀眞鬼由牢察玄屍杳丁沖煕日囿評霞嶽䖍氣膺逃宏沼領綿謨彫梗雲昆總靜遘泉道言此諸天中大梵隱語无量之音舊文刻書絳臺瓊華妙靈玉妃丹墉廣闕之上字皆廣長一丈天眞皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣赤符丹光神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大功魔王保舉上眞道備克得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致赤符告靈一呼萬應丹光回照百理千通密授紫書上爲眞宰神王下觀上帝遥唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響十方肅清河海靜黙山嶽吞煙萬靈振伏招集群仙天無氛穢地無祅麈冥慧洞清大量玄玄也元始无量度人上品妙經卷之二十五

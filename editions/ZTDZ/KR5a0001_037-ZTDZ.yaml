front:
  text: 靈寳無量度人上品妙經卷之三十七黄七
  hash: sha256:db138545f5578649e5b79ed11a0006b9015c54b1a83ebfb6795eb2875c928de8
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_SJB_037-010245a, image: sjb/01/010245a.png}
body:
  text: 七星除祅品道言昔於北清玄靈天中大魁羅上妙寳華土受元始度人無量上品玄靈妙天内號太虚無上常容天其天帝主名曰緫監鬼神居其宫殿思道因縁言我植福位爲天帝住不遷界中與北方諸天世界通爲一境十方天中及以天下一切大力鬼神國土咸我部屬我以福業故周足神通禁制魔種歸依三清奉太上玉律金科威被鬼爽而今元始上帝當降此天爲諸天人十方衆生說無量度人無上法門我今處極真世界聞聽法味實爲忻快當與天中聖人僊真一切部寮男女等衆逺詣玉京恭請元始天尊降此天中爲衆說法敕命侍香金童都文瑜傳言玉女馮道倩啓蘂玉九色之蘊索三天降真洞瓊寳香然丹天火玉驛龍捧爐千真奏煙靈幡寳幢竒花珍供百千萬人俱詣玉京蕭臺金闕叩禮元始三說其辭仰祈大慈不違本念降眄天中宣演道法度脫一切開通靈虚使内識洞玄外伏魔試再拜長跪伏俟聖言天尊告曰吾本無形以道爲質住此玉京散爲五形變神萬億吾今住此見爲十方無極世界無量衆生各各演說法要明曉至真示玄清之路汝所居天上干無色下臨崑山傍及北臺幽嶽鬼都無不統御北清玄靈俯及酆羅近於海際宻與人境攴連貫接人世衆錯臭濁難堪爲諸六天遊精八方鬼神殺戮啖食一切人民不滿天壽横被夭傷於三元本命年限運㑹之上隂謀鬼吏遘說㝠官妄作災凶種種刑害是致呼魂之聲趣死之哀不絶於耳覩此厄害身縈災疾我今欲下彼天說度人法汝以挺生空洞乗此天位未明至道微妙大法吾以妙无天帝出生三氣三寳天君造立混沌分別萬天使帝闕列峙億真翔集三萬六千日月一時同明吾以是也吾下化爲玉宸大混居紫玉寳闕華蓋之下紫微垣中號北極大帝龍衣玄服垂絛大弁左右十二元士雷公霹靂居其傍三十六將衛其後五帥四徳導其前赤明開圖之初爲上清神公開皇之後爲北隂大帝平定功成位居中天紫極之庭十方世界望之不動謂之辰樞者是也然有形皆動惟無形不動北極星與羣星相逺三度有竒而中空者北辰上帝真形也望之炯炯五星煇映熒熒有光者帝座也但可見座豈可遽謁其帝也此北極大帝緫制三界星宿鬼神萬神千靈莫不叩頭請命五嶽四瀆山川之神皆再拜伏候乞請水旱風雨北極是吾第五化身位居皇極正統玉帝爲祖立太空之元在九宮則號中黄太一衣紫錦袍腰十二流金火鈴状如嬰兒手把七元口吐青色今居天中䕃華蓋乗斗車履三台席大角坐明堂左右七人服紫繍者北斗七星之精也汝宜徃彼請下天中論說法要開度天人天帝聞是說已整冠執圭再拜臣今上請北極帝君降此天宮願聞大法乃與天衆辭禮元始下詣中黄紫庭華宸玉闕之下真官導前執法從後徑達北極大帝御前具陳上事再拜作禮辭懇志切涕泗交下帝君被玄龍之服以降言曰吾上爲元始天尊敷揚至教當允斯請于是天帝垂光俯眄北清玄靈太虚無上常容天中寳闕之内三氣寳明之殿將昇法座當說是經周廻十過以召十方始當詣座五天大神七元真君上聖髙尊太虚真人無鞅數衆乗空而來彩霞亘虚雲光四布瓊臺鳳駕羽節金幢雜色寳蘊蓊曖鬱勃洞煥太無七日七夜諸天神真日月飛仙星真雲將璇綱玉緯一時停輪剛風啓韻豁落流光山川林木緬同玉色土變碧璃柔明瑩潤衆真侍座北極帝君先嚮玉亰心拜元始至恭修敬乃登玄空浮光五色龍臺之座說經一遍諸天大聖同時稱善是時一國男女皆聽北極帝君宣標玄旨無量度人七星除祅最上法要說經二遍七星明燿玄符見空說經三遍巨斧钁天山開石裂說經四遍乾坤交泰四海澄源說經五遍僊樂滿空靈香逺馥說經六遍天虹周遍跨空成橋說經七遍七真下觀魔精喪膽說經八遍鬼帝驚逃萬魔摧伏說經九遍天垂甘露珠璣散飄說經十遍鬼神悟道幽品登僊是時一國是男是女莫不傾心皆受護度咸得長生道言是時北極帝君說經一遍東方無極無量品天斗七星除祅大神無鞅之衆浮空而至說經二遍南方無極無量品人斗七星除祅大神無鞅之衆浮空而至說經三遍西方無極無量品地斗七星除祅大神無鞅之衆浮空而至說經四遍北方無極無量品隂斗七星除祅大神無鞅之衆浮空而至說經五遍東北無極無量品鬼斗七星除祅大神無鞅之衆浮空而至說經六遍東南無極無量品陽斗七星除祅大神無鞅之衆浮空而至說經七遍西南無極無量品遁斗七星除祅大神無鞅之衆浮空而至說經八遍西北無極無量品升斗七星除祅大神無鞅之衆浮空而至說經九遍上方無極無量品飛斗七星除祅大神無鞅之衆浮空而至說經十遍下方無極無量品降斗七星除祅大神無鞅之衆浮空而至十遍周竟十方無極天真制魔除祅大神一時同至一國男女傾心歸仰來者各各發心願除累劫以來心不正真穢念充塞三尸遊蕩七魄妬害交通鬼氣及諸魔類使有法病見遒不明雖處人天墮入流轉乃至證位諸地暫登真階以魔精入心祅試惑亂念動塵起攴縁傍對起無量因作百千業今聞北極大帝宣說七星除祅抜邪護正之法開迷翳眼蹈玄清路趣髙真品慚愧頂禮無鞅數衆佇立傾聽於是北極仰天俯地觀察萬彚運無量心啓靈寳慧普告大衆元始未生曠劫無跡混沌既坼七竅乃張大爲日月細爲星辰日月五星緫號七元而配屬北斗北斗十二星五星爲隱曜斗口之中有天一太一二十四玉皇光芒不顯惟七曜大明彰示萬方七星之精在人七竅亦分其神能視聽言齅知識悉皆由也輔弼二星之精分降爲目中瞳子七星之神有隂魄陽魂及正星之神斗中除祅之神有五帥四德七千神將天罡河魁大殺大角豁落立斗黑衣玄㝠七殺之神以滅除兇祅蕩遂魔鬼兆能齊心修齋服佩符籙奏告懇祝則七星大神下降兆所立除祅害有能稽索道要勤企止清七星之神教兆上道飛昇神僊七祖升度鍊化自然七星之精三辰五斗九宮八卦之妙皆在于是聖人之心七星降神華房之内方寸七室微妙祕諱不可宣泄已登上真後復爲此北極即於法㑹之中說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時夭人遇值經法普得濟度全其本年無有中傷七星垂光光映真形内生玄丹外除祅精傾土歸仰奉教遵行除魔除幻除妄除想除愛除有除見除得除疑除邪言中天律口無非聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言北極帝君說經中所言並是七星天中列帝内名隱韻之音亦是北帝内諱百神之隱名也非世之常辭上聖已成真人通玄究微能悉其章誦之十過八威揚兵五天擲火魔王警陣星使騁軒甲卒億萬斬邪除祅燒霞燎空金鉞寫光羣魔束形鬼精滅爽回屍起死白骨成人至學之士誦之十過則七元降真三界稽首魔精喪眼鬼祅滅矣濟度垂死絶而得生所以爾者學士欽詠洞章斗元布氣殺伐祅祥掃蕩穢氣體將洞真召制十方威未制天政德可服御地祇束縳魔靈但却死而已不能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緑萬災不干神明護門斯經尊妙獨歩玉亰度人無量爲萬道之宗巍巍大範徳難可勝道言凡誦是經十過斗中天騶七星大神天帝使者齊到爲兆除祅驅斷不祥億曾萬祖幽魂苦爽皆即受度上升朱宮格皆九年受化更生得爲貴人以誦詠此經身神明正氣無陳故則玄堂啓關魂爽超越不拘㝠昧而好學至經功滿徳就皆得神僊飛升金闕遊宴玉京也上學之士修誦是經七真登房妙極空常徃返三周履星蹈綱漱雲嚥液魂魄俱翔變化上清壽與天長皆即受度飛升南宫世人受誦拱侍北辰坐致神女風送雨迎左據𩵄魒右揖䰢魁六丁輔兆捕鬼搜尸則延壽長年後皆得作尸解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寳不傳下世至士齎金寳效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齋誦詠是經七星真君開北玄之籙校別罪魂斗中司命鍊七星之光導引㝠靈爲上世亡魂斷地逮役度上南宮七月長齋誦詠是經七星魁宮之氣紫光如絃灌兆泥丸星中大神七人扶胥兆身遊行斗關身得神僊諸天書名黄籙白簡削死上生十月長齋誦詠是經斗中天皇手把七星爲兆除祅赤帝黄老與兆陶魂同䕃華宸坐卧七星星精入腦真火鍊形泥丸紫君厥諱規英金床玉帳紫繍錦裙腰帶火鈴除祅滅精福慶自生位極人臣爲國王帝主君臣父子安鎭國祚保天長存世世不絶常爲人君安鎮其方民稱太平八節之日誦詠是經七星光色連布八方北帝位中九宮齊同一白二黑貪巨爓空下代鬼祖斷遏衰凶得爲九宮真人本命之日誦詠是經子魁午丑未二宮下臨生位七星廻陽延兆天年賜夀無疆魂神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿徳就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐紫青絳三色雲氣之中内外蓊宴七星覆頭五藏真氣繞絡身相脾生黄氣岀頂成雲存見北極金容天馬千萬青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室内項生圓象光映十方如此分明宻呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始無量度人上品妙經元始洞玄靈寳本章七星除祅元綱度人天關運斡離合自然天有三魂二景含晶天有七魄七曜流精華蓋曲直三五飛昇紫雲爲關緑煙蒙蒙中有北極金城九重山環峯列玄草垂茸洞戸鬱杳清虚八通頭建魁剛足履玄龍手揮碧霞鳴玉叩鍾天丁九首四目老翁秉仗金鉞息滅祅凶璇珠爲樞運機惟空真道自然光泛九宮立斗大神霹靂霳眇莽九醜衣斗乗風吐毒噴火衛世無窮鬼爽竄伏神府靈明青氣灌滌混合百神金闕玉房赤鏡飛光流雲萬丈周遍八㝠中有七星除祅之神中有天猷紫極之尊中有景霄太帝之真中有天丁縳龍大神中有玄天黑殺四徳五帥之君中有天蓬威化玄曜真君中有太元真紐綱紀關七星尊神廽骸起死無量度人今日校録諸天臨軒東方無極星符神王長生大聖無量度人南方無極星殺神王長生大聖無量度人西方無極星氣神王長生大聖無量度人北方無極星台神王長生大聖無量度人東北無極星藏神王長生大聖無量度人東南無極星使神王長生大聖無量度人西南無極星河神王長生大聖無量度人西北無極星令神王長生大聖無量度人上方無極星威神王長生大聖無量度人下方無極星根神王長生大聖無量度人十方至真七星除祅神王長生度世無量大神並乗七星燿羅之雲八色光明之輦天馬爲馭辟非驂羣六甲備駕天丁揚威徘徊丹霞翺翔胎僊建翠旄之節流光靈幡前嘯紫鳯齊唱後從玄獸同鳴獅子白鶴嘯歌噰噰天一啓途神兵翼轅億乗萬騎浮空而來傾光廻駕監真度生星宮丞相九霄上宮天英主録元斗大神執籙把籍齊到帝前隨所應度嚴校諸天七星寳宮七元真君帶月引日龍巾虎裙蒼舌虎賁北極神君赤書火籙黑籍黄文蕩除祅𧕏飛屍遊魂斬馘無拘束送泰山普告三界無極神郷泉曲之府北都羅酆三官九署十二河源上解祖考億劫種親疾除罪簿落滅惡
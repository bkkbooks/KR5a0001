地戸五苦八難七祖升遷永離鬼官魂度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言北二章並是諸天上帝及至靈魔王七星神王僊真隱祕之音皆是大梵之言非世上常辭言無韻麗曲無華宛皆七星除祅上真重諱宻妙之訣是謂玄奥難可尋詳上天所寳祕於玄都神霄玉闕東藏依玄科四萬劫一傳若有至人齎金寳質心依舊格告盟十天然後而付焉道言夫天地運度日月五星虧盈至聖神人休否末學疾傷凡有此災皆六天大魔五方大力惡鬼爲世祅𧕏因生人之命天地厄會作爲禍殃同氣皆當齊心修齋六時行香十遍轉經福徳立降消諸不祥無量之文普度無窮道言夫末學道淺或自營生業不識道真致土石之精草本之怪山𩴑山魈木客人都鳥都泉𩲲魍魎或稱古今廟社血食一切依附爲民祅害祈告北極大帝七元尊星以丹砂書七星真符燒灰以香水調服或佩帶自身安貼堂房之上七星真君立降天兵剪除大害變災爲吉七星降庭授爾真要身得神僊道言夫天地運終星宿錯度日月失昏四時失度隂陽不調國境有災水火漂焚疫毒流行兆民死傷師友命過同契殞傷或是大力魔神六洞鬼帥妄興祅變亦當修齋行香誦經夫齋戒誦經功徳甚重上消天災保鎮帝王下禳毒害以度兆民生死受頼其福難勝故曰無量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衛右別至人尅得爲聖君金闕之臣諸天記人功過毫分無失天中魔王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音明威真人譔七星除祅玉篇東方八天渙都瓊樓魂綦猷浮洞鏡宛貳嶽鄙顔仇吕正燕驛儻札遞侯懃寂恕愿京僅蕭侔輪豫關璞晉晝辯周固遁靈嶷互琤淙留卦評杜盤華逗燕彪元直和敕禧魯真收南方八天程計鄒強挹需閟牙紂閤師祥淵仍邈霞冀類屏塲宻圖景羅湫減殊芒力扁盟柄朱環柳檣玄鍊可韓魁漠救堂幼諦炎墮良便嬰郷美林斗樞回混巖康儔奕綿羅西方八天神途霄儀著㝠兖麗碧髙慶和雞堵曰逵莊池翊漿戞智完休鄺定符司馘酆秤微僊輦光谷囹穴鋒錐席衍黃琥縁索凝頥昊罔太煥天庚聿拯采鏹伏祅晶熒襄遼北方八天童緫靈邃刃截㝠爽衂清荼九道注生鞅璨華曜黨頗淙慈精良納胃藏通羽聮鴻剛婦瑶琩治巫允塞魂箕井昴泉獨興利寳迪澤昉玉誕赤𤤠梵輳滬幾意透飛驛魁𩲃𩵄䰢魓魒攝唐夏轄囚珠絡入度月妃東暄七殺黑聻内一十六字七星隱文符書如左道言此北極紫微七星大梵隱語諸天大將五斗大魔無量音舊文始生於北斗玉闕及三台垣門之上推正七星軌度統制鬼神斬邪除祅北君之祕文天真皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勲魔王保舉上真道備尅得遊行三界昇入金門此音無所不辟無所不禳無所不度無所不成天真自然之音也故誦之致飛天下觀上帝遥唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅清河海靜黙山嶽吞煙萬靈振伏招集羣仙天無氛穢地無祅塵㝠慧洞清大量玄玄也元始無量度人上品妙經卷之三十七

front:
  text: 靈寳无量度人上品妙經卷之五十一宙一
  hash: sha256:ff033f490de0b8843a11395c8c91e663302a1a4277ba24b9a9f711c018302b2f
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_SJB_051-010342a, image: sjb/01/010342a.png}
body:
  text: 消除疾疫保命延年品道言昔於青元天中飛景真音大玉洲土受元始度人消除伏疫保命延年無量上品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖髙尊妙行眞人無鞅數衆乘空而來素雲飛霞瓊軒鳳蓋紫霄流靄碧落騰光靈芒暐曄洞煥太无五日五夜諸天宫室臺館靈關七色交燿璇璣停輪三辰合照萬象咸寂地發嘉祥天現玉文法音遠響洞徹諸天三界肅清四海澄靜一國地土山川林木緬平一等無復髙下土皆作碧玉無有異色衆眞侍座元始天尊懸坐空浮九龍寳局之上說經一遍諸天大聖同時稱善是時一國男女仰聽法音玄悟仙眞之道說經二遍正性虚明說經三遍靈氣降身說經四遍蕩除業累萬疾皆愈說經五遍六腑五臓灌鍊生華說經六遍飛精變形金光易骨說經七遍神妙備體常保完全說經八遍化周三界恩及十方疫癘普消人民康樂說經九遍幽䰟昇天冥官息對說經十遍萬精遂性逍遥太平是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品皇老大神無鞅之衆浮空而至說經二遍南方無極無量品太丹大神無鞅之衆浮空而至說經三遍西方無極無量品月華大神無鞅之衆浮空而至說經四遍北方無極無量品靈光大神無鞅之衆浮空而至說經五遍東北無極無量品帝暉大神無鞅之衆浮空而至說經六遍東南無極無量品雲綱大神無鞅之衆浮空而至說經七遍西南無極無量品伏魔大神無鞅之衆浮空而至說經八遍西北無極無量品髙清大神無鞅之衆浮空而至說經九遍上方無極無量品冲虚大神無鞅之衆浮空而至說經十遍下方無極無量品洞元大神無鞅之衆浮空而至十遍周竟十方無極消除疾疫保命延年至眞大神一時同至一國男女傾心歸仰始者心有法病身遭邪疫三界之内一切群生無量天民或有身雖得道未脫冥數爲隂陽五行六氣之所陶冶者各各思惟因縁所證得道果位法身眞形應報種體三十六變出没幽顯又有世間衆生曽爲不善凌犯五方金木水火土官之考身累疾疫或愚氓暗陋不順天道不知生理五行尅伏凌勃騰負鬱怫萬變水疫則寒火疫則熱金疫則清燥土疫則喘汗木疫則惙慓疾疫流行鬼癘爲害如是等衆十二類生咸皆雲集帀遶座下旣聞元始十過宣說靈寳飛天玄妙大範三界十方悉皆濟度飛仙列聖來者有如細雨密霧於是元始神光八出普映十方逺覧萬天再吿天衆曰道非情言象光無偶近比人心倏來忽徃變化莫測混雜難量謂之心者非眞常也衆生昏愚積業重厚假心以知智縁智以體神神凝而體道若不知眞人修用之理則心識鄙濁近連鬼道合以邪癘之氣則爲疾爲疫害其本年不全天壽能固氣於虚合神於無心爲神宇神宇靜則精正精正則形完萬邪莫干疾疫不入身既無疾保命延年輔以道念栖泊自然玉符金篆服衘雲霞長生得道列爲眞人是時十方天人聞是語已感歎稱慶天光顯瑞神寳揚煇混元玄珠并包九有虚皇說經都竟衆眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸行善心不妄不貪不僞不著不執不非不爲不見不護不戒言無華綺口無惡聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝内名隱韻之音亦是魔王内諱百靈之隱名也非世之常辭上聖已成眞人通玄究微慈念群彚隂營萬生使三氣明正五常順德消除疾疫保命延年若疫毒一身疫遍世土正心護氣積善累功則南極監簿韓司録名禳解禍尤宥過紀績能悉其章誦之十過諸天遥唱萬帝設禮河海靜黙山嶽藏雲日月吐華列燿佪精湿邪滅熾疾疫清平虎符金簡紀録功名鬼魔百毒斷種戮形天令順道正氣流行三官執奏翼衛神兵捕䰟大理考校檢程賞善除祅益靈駐眞至學之士誦之十過則五帝侍衛三界稽首魔精喪眼鬼祅滅爽濟度疾疫絶而得生所以爾者學士穢氣未消體未洞眞以制十方威未制天政德可伏御地祇束縳魔靈但却死而已不能更生輕誦此章癘鬼傳殃供養尊禮門戸興隆世世昌熾與善因緑萬災不干神官侍巾典省天機獨歩玉京度人無量爲萬道之宗巍巍大範徳難可勝道言凡誦是經十過諸天齊到億曽萬祖幽䰟苦爽皆即受度天機上生韓司易名格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經疾疫無干神閑氣眞濁府散開邪試無門丹火内鍊骨變延齡皆即受度飛昇南宮世人受誦則延夀長年後皆得作尸解之道䰟神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寳不傳下世至士齎金寳效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齋誦詠是經消除青疫九夷老氣尅害人身爲上世亡䰟斷地逮役度上南極太微天機省中超化昇職七月長齋誦詠是經消除白疫六戎老氣尅害人身身得神仙諸天書名神霄玉府西華堂中金書青簡削死上生十月長齋誦詠是經消除黑疫五狄老氣尅害人身爲國土帝主安鎭國祚保天長存世世不絶常爲人君安鎭其方民稱太平八節之日誦詠是經安寧八景奮靈八威辟却八邪永無百疫三田生珠諸節通理血變瓊醴精鍊玉華得爲九宫眞人本命之日誦詠是經異氣不生疫疫無侵年命固永鬼怪潜靈䰟神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎秉政天樞雲騎珠纓萬神朝禮參位太玄功滿德就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐赤青黄三色雲氣之中内外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右六甲六丁伏魔大將備衛前後日月照明洞煥室内項生圓象光映十方如比分明密呪曰無上玄元太上道君召岀臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人闕啓所言今日吉慶長齋清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始无量度人上品妙經元始洞玄靈寳本章消除疾疫保命延年無量度人百魔隱韻離合自然太始無形召氣成真氣出無縁泮虚凝玄玄爲氣母徊燿飛烟玉液鍊光金精八騫玉京嗟峩碧落凝旋三景轉赤九暈澄淵自成玉文無極至眞三五九一是爲天根元始祖妙靈寳生神温厚滋養堅澤剛輪開明三氣化生諸天玄黄混淪金火相乘變化隂陽正邪乃分正爲物宗守之長生邪爲疾疫禍害遷騰惟知道真可以全身五臟眞氣結爲靈文無文不光無文不明無文不立無文不成無文不度無文不生上應圓羅天中之天鬱萃玄臺太皇玉京髙極無上玄虚紫宸眇眇劫仞若亡若存三華離便泰清黄庭金闕玉堂景素神池流布洞氣消滅萬殃清正瓊輪周廻十方中有度人不死之神中有南極長生帝君中有消除疾疫大神中有太微天機省主好生韓君丈人中有南上司命司録文昌益筭度厄保命延年上眞廻骸起死無量度人今日校録諸天臨軒東方無極皇老神王長生大聖無量度人南方無極太丹神王長生大聖無量度人西方無極月華神王長生大聖無量度人北方無極靈光神王長生大聖無量度人東北無極帝暉神王長生大聖無量度人東南無極雲綱神王長生大聖無量度人西南無極伏魔神王長生大聖無量度人西北無極髙清神王長生大聖無量度人上方無極冲虚神王長生大聖無量度人下方無極洞元神王長生大聖無量度人十方至眞飛天神王長生度世無量大神並乘三景飛龍十華翠輦九鳳雲車流光玉輿驂駕神虎辟非蒼甲之麟建召眞之節燿空靈旛前列六陽大將後從八史神兵九天飛眞遊空歩虚五老啓途群仙翼轅億乘萬騎浮空而來傾光廻駕監真度生玉宸保相南極至靈上生監察金闕元君執籙把藉齊到帝前隨所應度嚴校諸天内保至眞建植功縁仁恕忠孝不犯三官六洞無名過度冥關宿疾普消疫災不干邪鬼破腦四目當前衆聖降接保命延年普告三界無極神郷泉臺洞府北闕冥關六天雲營火刄鐵山列奏神霄玉簡敷宣釋除疾疫穢禍凶愆上解祖考億劫種親疾除黑簿落滅惡根不得沉淪拘制鬼群虚皇詔命時刻昇遷北都寒庭檢會神䰟大魔保度升化朱宫死䰟受鍊隨運長存生身受度劫劫無傾隨劫輪轉與天齊年永度三塗五苦八難超凌三界逍遥上清上清之天天帝玉眞無色之境梵行東方八天玉歌燿宗天帝平羅景都帝歷鳳昌天帝眞章紫洛皇离正化天帝瑶府宛鈞齊命登華天帝尹詵持明江宵遘期天帝覺𨓜景虚球度蘭瑝天帝杳寂司干永生久臨天帝越梵治行樞落左玄天帝承安止宫南方八天願極宗召天帝嶽司校靈并道指頥天帝屢遠茲晞太微機輔天帝廻明庸康召眞訊智天帝除膚究當普信注玄天帝問亨補冝龍光照生天帝祈堂紀逢冲妙延常天帝轉英集輪月諸慶號天帝赤津良西方八天壟化嬰如天帝並京攄光奥洞演于天帝樂宣無垠照幽洗翾天帝磧疆延祕俞極混天帝總監眞影爲窈空天帝初嗣百還玄度意冥天帝報朝何嵩茲芽雲藏天帝降籍司陽胄重忻盧天帝伯巫期將北方八天監明正化天帝安途定方太華上光天帝祕師九祥日貟攝圍天帝肇無辨黄絡霞㟪天帝攴諦霜朱涵溢今天帝彭民踐區印格制魔天帝元眞瀛攝京回布天帝斛亢禮淵神倉放遂天帝幽强宇元三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱文天中之樞天中之機天中之轄天中之輗天中大魔天中之靈玉天金闕中有至神布氣度人福及萬生九和十合變化上清無量之奥深不可詳敷落神真普度天人辟除毒禍禳解北辰犯忤大殺南極元尊消除疾疫保命延年今日欣慶受度歷關諸天請滅三惡斬絶地根飛度五戸名列太玄魔王監舉無拘天門東斗消疫西斗除愆北斗保命南斗延年中斗大魁主領元官八十一神總監衆仙青帝蕩疫白帝施教赤帝宣威黑帝開導黄帝中主萬神從詔青天魔王身佩帝書赤天魔王飛行太虚白天魔王萬惡潜誅黑天魔王統攝眞符黄天魔王布令玄都五帝大魔萬神之宗執天大範總領鬼兵麾旙仗節遊觀太冥神化無方與天同生上天度人嚴攝寒庭元王受命普掃祅祥疾疫莫作正氣流行生民自牧却滅禍殃命如山河福等昊蒼天師寳符玄靈大章龍文虎檄追召魁剛屠割鬼爽風火無停千千截首萬萬剪形魔無干犯鬼無祅精三官九都考察鬼營不得怠縱金馬驛呈化周無窮符告萬靈上宫玄宰飛奏帝宸無極髙妙燿華洞清氣生芳澄天地備成神運變化風火交騰精鍊九劫水躍龍門雲凝玉堅天闕九關瓊觀寳樓萬神守垣九絶明燿朱符召仙日揚九光月吹十霞五斗回車天英蘊蘭帝妃泝香玉眞踞軒五老授職三官迅軿保民無疆吉慶如山眞元吐氣金馬當前泛霄隱庭奏鐘舞津正道流行疾疫莫登命曆益筭壽年億千五方天使虎巾龍官咸領制劵歸造眞玄丹煇啓明運周自然元皇大布靈寳玉篇赤書五符八威正文保安大劫使氣飛行大梵色羅萬品施張元綱布演無極諸天輪轉無色周遍十方騰駕扶摇旋歷經常消除疾疫五方之神天温六傷却以洞文災怪消殄毒害絶源天機奏名玄軌交纒二十五氣歸功上元八羅冥會合混玄玄玄中太眞天帝髙皇泛景太霄吟引宸風金昌明秀消蕩祅凶豁落奮擊流響雲宫仙音攝氣靈光返生太微御正上昇玉京邪癘殞殄仙眞列言三氣護生六府散烟千和萬合自然成眞眞中有神長生大君正御南極掃滅祅氛收除怪害五疫消平太一持火焼蕩魔官司命膺䇿收伏群姧桃康命靈萬景合延執符把籙召命生根上遊上清出入黄庭明堂之内絳闕之中保正玄丹三眞道宫中理五府境域明通十轉回靈萬氣齊升升仙鍊養無極度人上開八門飛天寳輪罪福禁戒宿命因縁普受開度死䰟生身身得受生上聞諸天諸天之上各有生門中有空洞謡歌之章魔王靈篇辭參髙眞第一欲界消除疾疫飛空之音祅群干正肆毒分身遊散八方疾疫生民水寒火熱穢氣紛紛進尸滅眞惑亂世人韓司校録南極火鈴炎烟赫衝善惡速分文昌帝省九萬官君符命下傳風火無停疾疫普消壽樂康寧生道旣正名奏天機降集眞氣救災却非玉津灌鍊與身同飛第二色界魔王保命延年之章冠峩碧蕖龍文虎書帶劔朱綬杳靄雲衢丹文玉璽威鎭太虚太上黄藉五老天符仙官注筆布令元都夀年無窮大化安舒疾疫不入心有玄儲虚皇垂教萬惡皆驅南昌火府朱陵上宫洞陽火官嚴駕九龍寳珠顯妙眞文下敷丹化凡骨昇入帝居笑爾阿人詠此靈音舉形變仙上升天堂第三無色界魔王升神造玄歌曰剛風爲石壘此重山風澤堅凝深藏帝關日月運行流轉諸天化君主令有形悉頒爾氣清空爾形秀冲邪疫無侵湛然神宫大經龍蟠合交景雲血化玉液精鍊瓊輪魔王虎冠繡幟朱軿録子正心授子仙宫雲層峩峩黄霞碧波授過冥曹髙仙玉仙携手登翠都笑歌入無何此三界之上飛空之中魔王歌音音參洞章誦之百遍名度南宫誦之千遍魔王保迎萬遍道備飛昇太空過度三界位登仙公有聞靈音魔王敬形敕制地祇侍衛送迎㧞出地戸五苦八難七祖昇遷永離鬼官䰟度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈魔王隱祕之音皆是大梵消除疾疫保命延年之言非世上常辭言無韻麗曲無華宛故謂玄奥難可尋詳上天所寳祕於玄都紫微上宫依玄科四萬劫一傳若有至人齎金寳質心依舊格告盟十天然後而付焉道言夫天運否終地道隔塞日月二星虧盈凌犯氣行勃亂度數差忒大則爲至聖神人之休否小則爲末學生民之疾傷時疫流染方域生災同氣皆當齊心修齋六時行香十遍轉經福德立降消諸不祥無量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太隂或疾疫爲害保命無傾臨過之時同學至人爲其行香誦經十過以度屍形如法䰟神徑上南宫隨其學功計日而得更生轉輪不惑便得神仙疾疫清寧人安道泰永保天齡道言夫天地運終星宿錯度日月失昏四時失度隂陽不調則災氣自生疾疫爲咎使國界水旱兵革未平疫毒流行兆民死傷師友契盟有致延染皆當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎭帝土下禳毒害以度兆民生死受頼其福難勝故曰無量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋焼香誦經十過皆諸天記名萬神侍衛右别至人尅得爲聖君金闕之臣諸天記人功過毫分無失天中魔王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君撰元始靈書中篇東方八天天相樞明機省元同中黄四司玉韜上公靈虛太玄錫命眞封雲文祕紀校績南韓文妃録品簡昇紫垣章號瓊韞朱曜洪頒護字逹龍府開命神碧圓通照萬道冥神南方八天感帝交仙羽縹素烟梵混自澄洞魔駐筵驛騰信馥官師允騫憫符昭濟功念幽泉利庇黎冲進除果嚴激思求邈深頥浩田無落由動壁刻元綿救澤苦涸常應匪邊西方八天空含意模仙令忮宣謹悟豈緘孔雄假乾遐函黙祝兵胄潜蕃救章钁究成島俠連變宥忽網測粹武賢諱愚祈昏奏迷縳還中帝赤懸威劔蒼蚖識爽杳辨斯質華聮北方八天玉宸宰儀洪蕩胡時忽透象察役曹横旂統按宥生火迅車馳馹典責文嶽圄䰟疑䝉乖亢正敷式奚重教檢斗剛太一九佪矢慘丙注符䇿按圍目夔公馬戮罰拉摧鬼滇長澤東谷雲敞施南赤圖震皇西馘醜榮垂北已上四句計一十六字消除疾疫朱書服之吉道言此諸天中大梵隱語無量之音後一十六字治病去疫斷瘟密敕其法祕重有知其音能齋而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勲魔王保舉洞眞道備尅得遊行三界昇入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致飛天下觀上帝遥唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響十方肅清河海靜黙山嶽吞烟萬靈振伏招集群仙天無氛穢地無祅塵冥慧洞清大量玄玄也元始无量度人上品妙經卷之五十一

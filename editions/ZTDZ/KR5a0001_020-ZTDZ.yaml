body:
  text: 碧落空歌品道言昔於始青天中碧落空歌大浮黎土受元始度人空洞靈章自然之音碧落纒虚天霞流曼神風鼓激萬音合響浮沉清濁抑揚宛轉錯而成歌其聲洞徹交唱諸天當於是時天地萬物無聲之類一時能言敷道立教啓玄建宗一切生類通理明法元始天尊當說是經周迴十過以召十方碧落世界飛霞結縷妙於寳綱一切天人龍輿鳳葆倏忽徃來若經幽竇空碧炫煥略無限礙光煇流影照一透萬中生神風徐速得度歌吟應節虛琴法音徧無有量珠樓寳闕咸出靈韻讃道讃法讃仙勸諸天人興崇善功深悟上道天眞大神上聖髙尊妙行眞人碧落至眞自然空歌金童玉女無鞅數衆乗空而來紺虚凝湛寒碧洞清玉馬飊輪寳繖敷䕃天音妙梵隱宻互作九光纒回五明泛燿七日七夜諸天内眞各陞亶樓齊擊天鼓龍虎號嘯星機東揺二十四天寳宫殿中混然碧色嶽聳波澄七辰瑩澤雲容風寂灝景舒明一國地土山川林木緬平一等無復髙下天海涵環土玉葱蒨漻然洞歌無有異色衆眞侍座元始天尊玄坐空浮九翠玉臺神龍萬珠之座說經一徧碧空洞歌群響唱善是時一國男女聽牖解關無幽不聞說經二徧華童散煇照鑑无極說經三徧碧落成音神風緩奏言詞清越說經四徧大智該廣法身普同說經五徧聞歌悟法還元復命說經六徧視身與境㓗如寳珠隨方現色道空不遷說經七徧悟此空歌元非起滅霞張風至音調自生入道登眞理從斯得說經八徧遊宫浮闕詠蕩碧虚内音清歌流轉隱顯說經九徧空洞生華湧成千界天人男女出入黄房沉碧還虚呈露道體說經十徧霞布十方歌成九奏上極大明下開幽夜天人大慶靈寳示祥是時一國是男是女莫不手結天維足躡雲綱飛形上清皆受護度咸得長生道言是時元始天尊說經一徧東方碧落空歌至眞大神無鞅之衆浮空而至說經二徧南方碧落空歌至眞大神無鞅之衆浮空而至說經三徧西方碧落空歌至眞大神無鞅之衆浮空而至說經四徧北方碧落空歌至眞大神無鞅之衆浮空而至說經五徧東北碧落空歌至眞大神無鞅之衆浮空而至說經六徧東南碧落空歌至眞大神無鞅之衆浮空而至說經七徧西南碧落空歌至眞大神無鞅之衆浮空而至說經八徧西北碧落空歌至眞大神無鞅之衆浮空而至說經九徧上方碧落空歌至眞大神無鞅之衆浮空而至說經十徧下方碧落空歌至眞大神無鞅之衆浮空而至十徧周竟十方无極碧落空歌至眞大神一時同至一國男女聞悟法音傾心歸仰來者有如无量風雲之聲繁音大音無等之聲未覩形儀先聞如是音景若歌謡笑語讃歎悲啼環珮履屧無邊衆音闠闠而來徧滿國界非可禁止於是元始手挽碧落長縷之霞盤屈寳掌圓如碧珠光明透徹十方世界碧落空歌無外之事若近眉睫俯窺傍矚如淨瑠璃先示法筵次示大衆瞻仰未乆忽然之間擲於空中去地九劫大如飛星元始登引天眞大神上聖髙尊妙行眞人十方无極碧落空歌至眞大神無鞅數衆俱入飛星妙光之中一切天人無不登入神光晃粲外者見内内者見外上者若附下者若仰表裏洞鑒不知所由内外咸觀湛然同體切處一光空歌自鳴碧霞鬱宻神風鏘鏘十方玉城融麗齊等無鞅天人不知所在元始即於妙寳光聚之中說此碧落空歌是出世道是長生法是大化源是玄妙宗十方衆生具此聖心眼耳口鼻悉能了知一切道境而未有不從碧落之中空生洞歌至道法音徧一切生類音言應答由是道生論法都竟衆眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人值遇經法普得開悟究識本眞知此碧霞本元始精天地既開霞精散遶經緯演布絡如絃縷風動其間五音共作不從天造不從縁生故知道玄自然出音聞此靈音開辨心目乃有分别得悟道眞無聲之中得聞遐唱道無終窮傾心歸仰咸行大心無作無欲無意無念無想無愛無執無得無虚無實無滅無生言無矯妄語無惡聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道咸露至心吟詠欽禮皆得度世道言元始天尊說經中所言並是碧落空歌天霞四飛神風潜唱擊摶生音内演諸天上帝内名隱韻之音亦是十方神王空歌内諱百靈之隱名也非世之常辭上聖已成眞人通玄究微能悉其章誦之十過空洞成歌神聲逺振萬帝稽首千眞竦聞海平兵偃天谷藏煙三辰駐輪權衡停運八威鼓氣群魔䘮眼緑骨増秀靈骸返生至學之士誦之十過則三元奉駕五帝同軿封山召雲攝御鬼營濟病度厄絶命更生所以爾者學士身洞眞極炁合青玄碧落之文刻記心骨可以召制三界政預天司敕戒地官速送魔醜壽無盡年還形度生輕誦此章七世傳殃頂護存禮道業興隆世世昌熾與善因縁萬試莫干靈人降房斯經髙妙獨歩玉京度人无量明碧落之音皇皇道宗妙莫與勝道言凡誦是經十過諸天齊到億曽萬祖幽魂苦爽皆即受度上升東華青宫空歌召魂魂知其音還來附身魂鍊炁眞返生爲人能餐碧霞之玄芒濯神風以散襟而好學至經功滿徳就皆得神仙飛升玉闕遊宴碧空也上學之士修誦是經皆即受度飛升青宫世人受誦則延夀長生後皆得作尸解之道魂神暫滅耳聞空歌心不迷妄去如解衣神安炁定復爲聖民不經地嶽用晦而明心與道俱普度天人莫不受慶无量之福生死䝉惠上天所寳不傳下世至士齎金寳效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經碧落空歌青帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齋誦詠是經以開碧霞始生之炁爲上世亡魂斷寒池長夜之役生其魂神度上青宫七月長齋誦詠是經降碧落之靈音澤金眞之剛炁使三田㓗素身得神仙碧落成文記書仙名青玉玄簡削死上生十月長齋誦詠是經碧霞結篆空洞成文玄匠之音奉慶帝宸青簡執符東極授經君臣父子享德萬年四海太平世世不絶爲天下君安鎭十方劫劫長存八節之日誦詠是經八風洋音碧落垂文服燕青芽得爲上眞本命之日誦詠是經魂眞魄靈骨有玉英身得長生與道相冝不罹世患胎景光明三老錫命五帝攝京神司朝禮上天書名功滿徳就飛升上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒二十四通上聞二十四天心拜二十四過閉目靜思身坐青黄白三色雲炁之中良久變爲碧霞内外蓊冥有青龍白虎朱雀玄武師子白鶴羅列左右日月照明洞煥室内項生圎象光暎十方如此分明宻呪曰无上玄元太上道君召岀臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各二十四人關啓所言今日吉慶長齋清堂修行至經无量度人願所啓上徹徑御无上二十四天元始上帝至尊几前畢引炁二十四過東向誦經元始无量度人上品妙經元始洞玄靈寳本章碧落空歌九變度人神音隱韻離合自然混洞太无無无其無无爲浩空空與道俱空極而明明爲陽精陽精爲火火爲元始洞陽赤炁赤炁之中化生黄暈黄暈為土是爲火子火土之炁九鍊而堅堅者金性金伏爲鉛鉛化爲水水成木居曰青黄白號玄元始三炁植根火力鍊之九萬餘歳其色凝碧碧光熠燿其晶霏霏乍騰乍躍乍伏乍飛或出或没或歩或馳隂火爲風陽光爲火風火合德碧晶混離若雲若霞如東如西神風鼓之碧霞析支支勢曲折或正或欹圎者如環鋭者如珪屈伸匪常凡不可窺碧空落落光含四維霞張八極變化神竒天老上帝按筆以施模爲天章洞音深微雲霞之書三元八威六十四體象各有宜龍升其天鳳翥帝軒麟卧寳衢龜行澤邊三九五七星帶相連奎房畢觜鎭御十天碧霞縱橫布峙機延落猶絡也縻之無巓中空含虚風吟其間神音自然隱顯回騫洞歌玉文靈寳祕篇内明上眞超登之言一聞空歌腦宫發煙紫氣盈室六丁來前無歌不光無歌不明無歌不立無歌不成無歌不度無歌不生是為大梵碧落空歌上清神音脫離死生天中之天鬱羅䔥臺玉山上京上極无上大羅玉清眇眇劫仞若亡若存皆有碧落自然空歌歌詠至眞洞解天靈天地萬神因歌得名碧空神音呼之即聞是生神靈及諸上眞祕諱所重因歌得明碧落之中恍愡杳㝠中有玉眞口吐氤氲碧霞梵炁周回十方中有度人不死之神東極宫中青華之君中有空歌神音自然之神中有好生青皇九靈太妙生德之神碧空眞老天化丈人中有上清碧霞空極玉謡至眞洞文天一之君度生鍊神无量度人今曰校録諸天臨軒東方无極碧落空歌玉音神王長生大聖无量度人南方无極碧落空歌玉音神王長生大聖无量度人西方无極碧落空歌玉音神王長生大聖无量度人北方无極碧落空歌玉音神王長生大聖无量度人東北无極碧落空歌玉音神王長生大聖无量度人東南无極碧落空歌玉音神王長生大聖无量度人西南无極碧落空歌玉音神王長生大聖无量度人西北无極碧落空歌玉音神王長生大聖无量度人上方无極碧落空歌玉音神玉長生大聖无量度人下方无極碧落空歌玉音神王長生大聖无量度人十方至眞碧落空歌玉音神王長生度世无量大神並乗碧霄緑輿紋輪驂駕青鳳蒼甲玄龍建碧霞之節十絶靈幢前嘯玉琯齊唱後吹瑶籥同鳴神禽玄鶴和音噰噰宛與空歌恊音流暢天卿秉䇿元帥扶轅億乗萬騎泛碧而來歌動海嶽聲越金石傾光回駕監眞度生諸天丞相上清公卿霄極神宫碧空大聖雲營四司剛風九道監仙大神按籙神圖齊到帝前推校仙名嚴劾六天能知碧落洞章空歌至音神包太空炁停大淵過度世厄宿命應仙普告三界无極神郷泉曲之府自非天維所關碧霞鬱壘九陽之界藉在三官列階九府十二河源上解祖考億劫種親積逮復連冥考冡訟罪録所刋速落惡根不得拘留度魂命仙元始符命時刻升遷夜河積屍漏瀆寒泉隱停罪役檢制形魂度品青宫碧霞絡骨神音入玄召集百神九宫復完生身受度劫劫長存永不輪轉與道忘年永度傷柱景休開生驚死八關超登長生過度留難逍遥上清上清之天碧落之炁梵行東方六天碧落之炁起角宿一度一杪一虛漸次北行碧梵玄无天帝罙覺會英碧空臻際天帝辨極宛頃碧羅元始天帝洞眞飛生碧合澄開天帝越常典興碧顏朱景天帝惠廓孚生碧宏虚曠天帝重盅途南方六天碧落之炁起箕宿十二度一匣之杪以次北行碧眞洞陽天帝九笳空玄碧瑶絳宫天帝龍混覺碧霞明素天帝紫景空崇碧无耀洞天帝茂極越冝碧運始圖天帝元延九眞碧浩正虛天帝都加遠稀西方六天碧落之炁起女宿三度十二杪之半以此北行近西碧神照智天帝常無覺碧沖紫耀天帝定極太元碧蓋梵空天帝妙詢尤延碧洞霞陽天帝眇莾自眞碧華開曆天帝無婁慶玄碧梵明遥天帝子虛太明北方六天碧落之炁起井宿十五度二十四分之半此眞碧落之維碧光寒華天帝龍耀化眞碧液注延天帝玄神太都碧丹化炁天帝泥樓偃京碧廓慈明天帝彦生元常碧落歌音天帝浮黎妙孚碧虚凝陽天帝妙㳟太寧二十四天二十四帝碧落隱文碧落隱名碧落天中空洞自然空歌靈音諸天隠韻天中之音天中之尊天中之神天中玉文天中之靈九變六合變化上清碧落之奥深不可詳敷落至眞普度天人雲章霞書曲折成音金清土濁木浮火輕太一爲水渾然其音五炁就位五宫遂成碧霞絡空神風鼔吟流商抑徵含宫蘊羽空歌合奏萬天起舞今日大慶受度碧天歷告三元請斷五酉七世魔冤削落死根續命生元出離太隂乗駕青龍存揖玉女正坐明堂下遊九宫伏藏天牢隱淪八地岀没無方碧落至眞玉音神王聚煙攝炁遏絶鬼門東斗玉光西斗皓華北斗太妙南斗煇煜中斗黄雲覆我生方五炁錯霞碧空成章青帝執竽白帝振錞赤帝伐鼓黑帝擲鈴黄帝奉塤吹嘘揚音合奏空歌碧落仙京中有太皇服御飛青左嘯伯華右嘯君成青天玉音玉文自成赤天玉音神迹天經白天玉音戞石叩瓊黑天玉音萬羽蔚興黄天玉音神謡太清五天玉音碧落俱登空歌梵響詠道无名无極神王騎虎乗鯨吐火萬里飛雷鎭兵泛景碧空下極杳冥屠割馘裂誅斬鬼營諸天大魔嚴衞火兵六天作炁百靈首名清蕩羅都鬱絶洞溟揮戈揚旛流矢沸鉦號呼北山鬼無逃形五帝銜命四公校籍有功者録有過者停鬼主六目電師𢔪身流火騰毒八道速并敢有干試拒遏上眞碧空神音自然之書玉帝之敕上清之符火鈴風鐸萬神前驅普告無窮六天咸聽三界五帝列言碧虛元始玉精光停碧儲泛乎杳冥神道以敷太空莽莽萬眞開圖上浮下沉東卷西舒流彩九門景賁三途太上神公咸極有無玉斧金霹萬天立呼洞章四張斑斑寳書碧霞吐芒龍翔鳳翥縷飄仙錦雲蟠寳觚碧空道英變化無無天上天下無空無冥無光無聲無色無名浩廓遐邈混一非成成與道形形爲玉京碧峯峩峩大有妙庭中有元始貌奪雌嬰披服青袍摜帶月明頭建神光足乗五靈碧霞凝空神風八衝谷神幽鳴空歌有聲是爲靈寳赤書九天眞文保制劫運我道永存碧落彌羅萬象周張妙炁回度二十四天輪轉角氐井鬼栁房炁入上玄隨斗低昂元炁所行造化太陽炁鍊成文文錯爲聲聲因風激霞精九靈音謡蕩魔下制冥河碧煙右旋緫炁上元空碧冥合炁入玄玄玄中玉尊抱日而明徘徊龍澤檢御朱兵敢干我者戮以天丁神旗翻翠浪揺太清紫雲結華緑英散庭千離萬合鍊炁成眞眞中有神碧眞上𡣕霞章仙支太一髙眞帝宸玉輔天老同卿吹隂嘘陽保命絳津上遊上清岀入丹房三竅之内下連黄庭白雲幽門素霜層淩碧務羅迎下鎭人身蘭臺有宮紫玉重城中有大神號曰無英身輝青光口嚥玉津變化自然與空無形中理五斗敕制百靈九道還明三元應仙仙道貴眞无量度人上入玄門飛歩九宸罪福禁戒宿命因縁身登華宫脫離幽冥骨鍊屍滅飛魂生身身得受生上聞諸天諸天之上廓落仙門中有神王碧落空歌道玄之章辭參髙眞第一東方无極碧落空歌玉音神王之音太无非神道受其靈化變無方用之至神道不顯神至化冥冥神煙蔚青逍遥玉京第二南方无極碧落空歌玉音神王之音眇眇逮臺花文龍書成此空歌碧宫絳輿周遊九天令音簫竽詠此道王至眞無餘第三西方无極碧落空歌玉音神王之音奎張帷西落落明璣洞碧涵炁炁與空齊眞炁無形眞道無名藉此空無玉眞自成第四北方无極碧落空歌玉音神王之音大牛玄犂成亥飤之隂胞已除天斗陸離孕育萬類調養六儀呱呱夜號鬼庭散披第五東北无極碧落空歌玉音神王之音玄鳳在場洞洁至陽碧霞扇空歌吟神風聲凄韻微道有希夷我界黄丘萬生得冝第六東南无極碧落空歌玉音神王之音帝乗丹車號令天門碧書金函部索冥魂鍊炁赤明青芽發生歌洞神音大姥驂軒第七西南无極碧落空歌玉音神王之音鳥毋執幢水王捧節王鐀度人九幽澡雪龍仙轉機東井浴月今日大慶祖考分别第八西北无極碧落空歌玉音神王之音天父黃髮錦衣萬花口吹陽光足蹈神蟆玉刀斷魔鐘鼓斯鏜斬血玄黄碧落道昌第九上方无極碧落空歌玉音神王之音碧霞浩浩彌羅玉清印空成字八㑹洞文植至道根化生群倫巍峩天臺中有帝君第十下方无極碧落空歌玉音神王之音壘壘剛澤風海洞冥玄老校籍火煙鐵城黑虺張牙毒獸啖形天光時來萬苦息停此碧落之上十方之中玉音神王自然歌音誦之百徧名度青宫誦之千徧神王保迎萬徧道備飛昇太空過度三界上清眞公有聞玉音百靈衞形敕制地祇出入送迎超岀地戸三災九厄七祖昇遷永離冥關魂升碧宫太一之家碧爲四宫御衮乗龍匪若黑赤斗逆步凶碧空至眞知者大通壽年无極録記玄功有祕上天音諸天共所崇泄慢墮地獄禍及七祖翁道言此洞章並是碧落神王十方玉音自然至眞神王隱祕之音皆是大梵之言非世上常辭以明碧落空歌爲至眞上道大以參玄乗化岀入萬機正運玄度開世成天小以身𦤺神仙飛昇上清夫碧落之炁於人爲耳目下通肝腎之精出坎入離晝夜用之腦戸神鑪之中當有玄丹大如𥞫豆出子耳中子得而服換骨易形上爲帝賔其道若成神遊碧土洞見碧城寳樓玉闕龍虎崢嶸師子臼鶴蛟蚪至循碧落世界萬里逡巡故非世學難可尋詳上天所寳祕於玄都紫微上宫依玄科四萬劫一傳若有至人齎碧玉之環青錦之紋質心依格盟告上清然後而付焉道言夫髙厚之運亦有差次三光九元亦有隱伏至聖神人亦有隠顯末學之夫亦有人患凡有此災同炁皆當齊心修齋六時行香十徧轉經空歌神音福慶自生玄眞立降消諸不祥无量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太隂臨過之時同學至人爲其行香誦經十過使碧落空歌之音招其魂神碧落之炁下連骨相六腑生明眞炁自生以度屍形如法魂神徑上青宫隨其學功計日而得更生轉輪不惑便得神仙道言寅申失軌亦當修齋行香誦經儀璘勃暗亦當修齋行香誦經水火激射民炁不調亦當修齋行香誦經國界侵虞兵盜不息亦當修齋行香誦經異氣爲災民病疫癘亦當修齋行香誦經師友命過亦當修齋行香誦經夫齋戒誦經功德甚重上正天運中安帝王下除毒害以度兆民生死受頼其福難勝故曰无量普度天人道言凡有是經能爲天地帝主兆民行是功徳有災之日發心修齋焼香誦經十過皆諸天記名萬神侍衞右别至人剋得爲碧落帝君青宫之臣諸天記人功過毫分無失天中神王亦保舉爾身得道者乃當洞明至言也諸天中大梵碧落空歌隱語无量音道君撰元始靈書碧霞玉文靈篇東方六天銜鏡鬱峩霞露四空容景杳期斗胃斬容明薄九陽周遊至宗㑹辨酉正入走八通丘次鼎除金録月春抱明玉野靈章夷沖南方六天井生尾箕栁張合𡵨正鈴東嘉雲龍瓊飴再命黄絡遘隅壁支炁運普口林嵠玉眸道幾正圓五陽交宫蘿媛紫景玄孚散公西方六天蕭池禺微珠明夜霏鬼栁冥疆走藉火池洞馬調合玉妃散夷昴張並驅女室相宜陽霐曲淨金鉉虎姫錯帝彦辰芙天太儀北方六天昆太傍由路正獄琳琳悔駿施火公電侯正笑正池淨明仙謀鉤合靈便殿軍伯修无无太罙洞臨逆樓龍機河銘紫微九丘道言此碧落空歌大梵隠語无量之音舊文字皆碧霞宛轉曲折成文垂芒八會天眞皇人雲迹句留筆而録之以爲正音有知其音能齋而誦之者諸天皆遣玉音神王碧空至眞自然大神下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勲魔王保舉剋得遊行碧落身御青門此音無所不禳無所不辟無所不度無所不成碧落神風自然之音也故誦之致飛天碧空大神下觀上帝遥唱萬神朝禮三界侍軒群祅束首鬼精自亡神風振響碧落洞清十方交暎海嶽淵澄空洞凝光照暎合明群仙稽首飛騰玉京天地曠極神音泠泠冥慧无極大量玄玄也元始无量度人上品妙經卷之二十

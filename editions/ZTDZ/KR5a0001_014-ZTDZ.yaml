front:
  text: 靈寳无量度人上品妙經卷之十四地四
  hash: sha256:de06142b77711c2aa70968babe5769c1ab1388a0ae191f550203517655d96b0b
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_SJB_014-010091a, image: sjb/01/010091a.png}
body:
  text: 日精陽明品道言昔於赤明天中紫陽空歌大寳光土受元始度人日精陽明无量上品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖髙尊妙行眞人洞陽日宫帝后𡣕妃日中天官仙民無鞅數衆乗空而來絳雲丹霄緑輿瓊輪華蓋垂䕃日精陽光九色鬱勃洞煥太空七日七夜諸天星宿飛精垂芒交煇射暎空極神宫虚定天樞止旋玉璣金𢖍端凝佇息神風静黙山海藏雲天景陽明炁流炯清一國地土山川林木緬平一等無復髙下土皆作紅玉無有異色衆眞侍座元始天尊玄坐空浮九龍陽明爓珠寳山法座之上說經一徧諸天大聖同時稱善是時一國男女仰瞻日精燦華九道陽明霞炁分布諸天信此眞精爲萬物之祖說經二徧日中宫殿見千寳色天仙衆民咸歸正道說經三徧日中世界剛風所持獨立空際周行無窮說經四徧瓊軸駕雲紫金光聚下照無邊秀熟品物說經五徧天文大梵俱見日中字皆回旋霞芒曲折隱語深祕悉得洞悟說經六徧洞陽之炁九百萬丈下臨八極賢聖金寳憑炁生成說經七徧洞陽識明照徹幽夜白骸寒骨抑被温曦隨明上登出離㝠海說經八徧朱光四披玉石含精陽魂感接皆變丹英說經九徧洞室巖嶺栖眞隱仙引景奔晨祖根開泰說經十徧日精停瑞萬品凝滋金液渙洋槁朽成寳是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一徧東方无極无量品日中青帝大神無鞅之衆浮空而至說經二徧南方无極无量品日中赤帝大神無鞅之衆浮空而至說經三徧西方无極无量品日中曰帝大神無鞅之衆浮空而至說經四徧北方无極无量品日中黒帝大神無鞅之衆浮空而至說經五徧東北无極无量品日中黄帝大神無鞅之衆浮空而至說經六徧東南无極无量品日中鬱儀赤飈大神無鞅之衆浮空而至說經七徧西南无極无量品日中鬱儀紫晶大神無鞅之衆浮空而至說經八徧西北无極无量品日中鬰儀炎象大神無鞅之衆浮空而至說經九徧上方無極無量品日中鬱儀金藏大神無鞅之衆浮空而至說經十徧下方无極无量品日中鬰儀陽明大神無鞅之衆浮空而至十徧周竟十方无極日魂帝君天眞无量大神一時同至一國男女傾心歸仰各各相謂共爲議言我等夙以福因久承道力生居道境獲在日月之上但知乗光流景煥耀諸天激奔海嶽宫室圓林皆成眞金微妙之色今日元始示我日精陽明之法淘澤重陽嘻吸華彩至陽浹髓骨肉成金而三元九炁覆育品物自非日精不能餔飤至學之士外鍊金石調制水火日月有數造化克靈内養一形日爲心象日中之炁洞照百關三萬神童奔陽浥景日爲火龍産成玉液胃爲土釜元火烹鎔千日布功立成眞道我所知者法之邊徼元始所宣定當隱奥願聞上法開我障山來者有如細雨宻霧無鞅之衆迮國一半土皆偏陷非可禁止於是元始四觀大衆周覽會中出紫金光明臂約九色洞霄火玉離羅之服引手而出以大神力長三十三萬里下摘日輪如攀甘果亭亭火色光徧十方來自空玄日輪圎瑩内有山林河海宫殿城闉无量仙民逍遥自在如寳瑠璃中含金色一會天人咸皆近覩於是元始以此日輪變成寳珠大如黍米在空玄之中去地九丈元始登引天眞大神上聖髙尊妙行眞人日中帝后无量大神無鞅之衆俱入寳珠之中天人仰看惟見拂拂從珠口中入既入珠口不知所在國人廓散地還平正無復𣣱陷元始即於寳珠之内說經都竟衆眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人直遇經法普得濟度全其本年無有中傷傾土歸仰咸行善心明道明眞明法明戒明經明理明隂明陽明神明炁言合洞章口無妄聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是日中上帝內名隱韻之音亦是日官内諱陽明之隱名也日爲三炁之元衆陽之父仰之神仙无極引之天谷虚盈中生紫眞存之滅屍鍊魂向之九霞注靈造化因之而得神聖用之而明非世之常辭上聖已成眞人通玄究微能悉其章誦之十過祥光顯瑞五帝設禮神鳥扇赫金精騰耀赤車停輪丹輞不行群魔束形鬼精滅爽迴屍起死白骨成人至學之士誦之十過則五帝侍衛三界稽首陽明洞照流火熾然魔精䘮眼鬼祅滅爽濟度垂死絶而得生所以爾者學士穢炁未消體未洞眞以制日精威未制天政德可伏御地祇束縳魔靈但却死而已不能更生輕誦此章身則被殃供飬尊禮門戸興隆世世昌熾與善因縁萬災不干神明護門斯經尊妙獨歩玉京度人无量爲萬道之宗巍巍大梵德難可勝道言凡誦是經十過陽明降仙日闕轉機九隂開翳泉戸生光億曾萬祖幽魂苦爽皆即受度上昇朱宫格皆九年受化更生得爲貴人而好學至經道日捐隂九陽鍊質神光入心心如朝暉五藏成金皆即受度飛昇南官世人受誦則延壽長年後皆得作尸解之道日精浮空紫煙鬱矇神宅清鎭天靈髙冲魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶无量之福生死蒙惠上天所寳不傳下世至十齎金寳效心盟天而傅輕泄漏慢殃及九祖長役㝠官侍經五帝玉童玉女各二十四人營侍神文保護受經者身道言正月長齋誦詠是經五帝賜籙陽明度魂爲上世亡魂斷地逮役度上南宫七月長齋誦詠是經日精流金赤童負缾飲兆玉醴長存不傾身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經日池冩光朱華玉英戲蘂凝露金霞流香爲國王帝主君臣父子安鎭國祚保天長存世世不絕常爲人君安鎭其方民樂太平八節之日誦詠是經日精混成先天蘊光周行玉京望拜金色仰希陽明得爲九宮眞人本命之日誦詠是經鎭兆神宫丹轂錦旌隨日以生得道之名魂神澄正萬炁長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿徳就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐九色紫雲之内内外蓊㝠有青龍白虎朱雀玄武師子白鶴羅列左右日月照明洞煥室内項生圓象光暎十方如此分明宻呪曰无上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齋清堂修行至經无量度人願所啓上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始无量度人上品妙經元始洞玄靈寳本章日精陽明上品傾光度人百魔隱韻離合自然混洞赤晶無無上眞未有天地自古固存月爲水胞日爲金精日如弹丸黑月胞之狀如鷄卯内有五色旋爲五暈日居其中月抱其外元炁裏之漸變天地地昇于天天合於地其精混沌清濁未分名爲胞元天地既開日月分胎日精陽明其數九五以應乾位日昇東桑飛龍在天金水分形日精乃成晝昇夜降子午爲經日圓九萬中有金城洞陽之宫空青之林食其華實與日同壽飛行上清乗剛歷玄元始祖劫化生諸天開明三景是爲天根上無復祖惟道爲身鬱儀寳章日帝靈書赤文開廓普植神靈無文不光無文不明無文不立無文不成無文不度無文不生是爲大梵天中之天瓊池絳臺赤林丹京九龍陽燧上奔日城眇眇劫刃若亡若存土華離便大有妙庭金闕玉房森羅淨霐神霄梵炁周迴十方中有日精陽明之神中有南極長生之君中有東極青華帝君中有度世司馬大神中有好生韓君丈人中有南上司命司録延壽益筭度厄尊神迴骸起死无量度人今日校録諸天臨軒東方元極飛天日中神王長生大聖无量度人南方无極飛天日中神王長生大聖无量度人西方无極飛天日中神王長生大聖无量度人北方无極飛天日中神王長生大聖无量度人北无極飛天日中神王長生大聖无量度人南无極飛天日中神王長生大聖无量度人西南无極飛天日中神王長生大聖无量度人西北无極飛天日中神王長生大聖无量度人上方无極飛天日中神王長生大聖无量度人下方无極飛天日中神王長生大聖无量度人十方至眞飛天日中神王長生度世无量大神並乗晨霧蒨燦之雲流鈴丹瓊之輦絳芙彤輪驂駕朱鳳日精火龍建耀羅之節赤珊靈旛前嘯九鳳齊唱後吹八鸞同鳴師子神雀嘯歌噰噰五帝啓途日仙扶轅億乗萬騎浮空而來傾光迴駕監眞度生金闕丞相南昌上宫韓司主録監生大神執籙把籍齊到帝前隨所應度嚴校諸天普告三界无極神郷泉曲之府北都羅酆三官九署十二河源上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼群日帝符命時刻昇遷北都寒池部衞形魂制魔保舉度品南宫死魂受鍊仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度三途五苦八難超淩三界逍遥上清上清之天玉帝洞明無色之境梵行東方八天帝暉瓊梁天帝緫魔威摧九丹燿華天帝篤宴求韶青林振陽天帝玉琅希章日眞寳慧天帝澤清守金旦明悟祕天帝精微髙昇樂境觀元天帝術陁留蒼野化都天帝洞臯興雲歷軫燿明天帝荔華亭柞南方八天日車彤明天帝光赤瞰赤璣左徊輿神天帝利䝉隱元圓景蔚臺天帝庸熈驛符備神紫興天帝謁幽𣢾幾黄炁陽精天帝遼昊房朱娑帝都天帝皇落持微蘂館雲文天帝璇芳正仙乗陽可周天帝濟剛義沖西方八天絶兵素靈天帝封關誓隂秀樂慶舉天帝肅安基金芒聚霞天帝碧雲凝琚素炁七經天帝鏌丹竒孚資剛行迅天帝役電令神物録資衛天帝眇夷行修律禁斷魔天帝直印羅重蘄仙玉龍天帝青斧到牙北方八天運眞布極天帝環樞髙璇保神𢍆宗天帝察理考房日盈都格天帝蹈靈猶光寳霞命眞天帝極思建平蓬柱鎻鴻天帝昭損並敷寂常體明天帝連勤奉宗報幾悟元天帝叱底玄元明安順天帝鑄部耼三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻日中之音日中之尊日中之帝日中眞皇日中之靈九光十華變化上清无量之奥深不可詳敷落神眞普度天人今日欣慶受度降接日眞潄霞嚥景服御陽明金液銲骨玉漿返神身登寳車爲帝髙賔升祖玄堂歷關諸天請滅衆惡斬絶欲根飛度五苦名列太玄東斗輔左西斗弼右北斗殿軍南斗太衝中斗隨輪驂日之後朱闕山聳絳都玉就運精施生世道乃行青帝護魂日精傳肝白帝侍魂日精經肺赤帝飬炁日精鍊心黑帝通血日精退隂黄帝主脾萬物同依青帝神王角奎洪儀赤帝神王迅煙傾離白帝神王素芒炎暉黑帝神王黔玄紫光黃帝神王金靈八翔五帝大神日陽之宗運明虚游飛行鼓從緫領神兵麾幢鼓節遊觀太空自號赫奕諸天齊功上天度人嚴攝北酆神王受命普掃不祥炎光吐毒赤甲四張火兵前驅日將仗旛擲火萬里流鈴八衝敢有干試拒遏上眞金鉞前戮钁天後刑屠割鬼爽風火無停千千截首萬萬翦形魔無干犯鬼無祅精三官北酆明檢鬼營不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列言上清元洞玉曆太初龍康洞陽炁元胞胎伏藏眇眇億劫混沌之中中如卵形日精赤靈日抱身身得受生上聞諸天諸天之上各有日門鍊隂全陽流火變形日精注凝克爲仙眞中有空洞謡歌之章眞王靈篇辭參高眞第一日精陽明飛空之音元始赤精三元頼成朱光照徹色洞幽㝠青林金華瓊實熒熒赤城萬里絳闕紅庭五帝無爲萬仙列𡖖億民遊散飲光食英后妃玉女燒香奏罌兆能引霞奔神髙清金顔寳𠜍錦旙繡旌前導六甲後從六丁陽明之威隂醜滅形帝錫長生延年乆齡上眞之道九陽是稱第二日精陽明眞王之章日界遊空浮行九宫乗剛獨力周駕神風宇宙金色山海一同萬物頼生三元共功是元始身分形變容九鍊洞陽出先洪䝉朱芒靈烏吐納太沖兆能感之明智靈通靜察逺鑑還老成童而生三景之根金水既坼上下弦分爲光明者是日之魂上洞赤色下洞靈淵風澤廓虚大明麗天天上天下無幽無㝠無形無影無極無窮𣸉是道遼廓未光赤明開圗運度自然元始安鎭敷落五篇赤書玉字日中瓊文保制劫運使天長存梵炁彌羅萬範開張日精陽明三十二天輪轉無色周迴十方旋斗歴箕回度五常三十五分緫炁上元八景㝠合炁入玄玄日中太皇五帝高眞汎景太霞嘯詠洞章金眞朗郁流響雲營玉音攝炁靈風聚煙紫景鬱儀日中萬仙日精入身傅降三田錬金爲液胚土爲鉛鑄入胃鑪心火腎泉厥隂鼓橐液流百川碧海神龜吐炁如煙金液傅鼎胎成玉嬰千和萬合自然成眞眞中有神長生大君無英公子白元尊神太一司命桃康合延執符杷籙保命生根上遊上清岀入華房八㝠之内細微之中下鎭人身泥丸絳宫中理五炁混合百神十轉回靈萬炁齊仙仙道貴生无量度人上開八門飛天法輪罪福禁戒宿命因縁普受開度死魂生物得感之華秀清蕤丹沙寳玉燦燿瓊芝珠泳雲海鳳栖紫微日精陽明道之眞歸我詠无量章保子無凶衰第三日精陽明眞王歌曰丹霞飛紫煙瓊輪湧明海扶桑凝金芒萬古色不改故知元始精先天藴淵澮九龍駕陽車倏忽起世外乾坤爲合谷三炁亦既濟日月爲神丹吸精滅死潰哀此頑滯仙鍜石漫成塊胡不引龍轅運液落珠貝穿節連百關日氣破㝠昧咀雲碎紅璃飲景以神醉勿測蓬萊水毎惜生死對晨本五帝前道袐索玄會此三界之上飛空之中眞王歌音音參洞章誦之百徧名度南宫誦之千徧眞王保迎萬徧道備飛昇太空過度三界位登仙公有聞靈音眞王敬形敕制地祇侍衞送迎拔出地戸五苦八難七祖昇遷永離㝠官魂度朱陵受鍊更生是謂无量普度無窮有袐上天文諸天共所崇泄慢墮地獄殃及七祖翁道言此二章並是日中五帝鬱儀神王隱祕之音昭晣日精陽明濛汜出入霞景濟眞之道三界頼之以開明二儀持之以分判兆能納日精之炁披陽明之暉則金華變仙七祖受鍊皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奥難可尋詳上天所寳祕於玄都髙上神霄玉清王府道君降世隨運流傳若有至人齎金寳質心依舊格告盟十天然後而付焉道言夫天地運度否終日月五星虧盈至聖神人休否末學之夫疾傷凡有此災同炁皆當齊心修齋六時行香十徧轉經福德立降消諸不祥无量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太隂臨過之時同學至人爲其行香誦經十過以度屍形如法日精下流陽明開隂骨鍊屍滅炁合天眞魂神徑上南宫隨其學功計日而得更生轉輪不惑便得神仙道言夫天地運終星宿錯度日月失暉四時失度隂陽不調國土有災疫毒流行兆民死傷師友命過亦當修齋行香誦經夫齋戒誦經功徳甚重上消天災保鎭帝王下禳毒害以度兆民生死受頼其福難勝故曰无量普度天人道言凡有是經能爲天地帝主兆民行是功徳有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衞右别至人剋得爲聖君金闕之臣諸天記人功過毫分無失天中眞王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語无量音道君撰元始靈書日精陽明中篇東方八天蒼明龍漪略苔泱蔽𡨚漠沙陁極浮蠢齊檀爛蘇曷覷生英妃烈注倪羡龍門狩尸嫣蠱錫野暴濵裒宜詠暢司閣斗環時華薦直芒忽晞靈披鸛獵耿躍眉玄酌微南方八天巢陽暄扶熾眞嚴晦寳層報馮鈍剛昌宣婺軸浩雲川獲敏芭暎彰弔圖狎光瑶盧智哲採禧抱𢖍存昭幽厥鄙托柱鉛飛吟髙盖伽賞舍羶琅盆窈岫洞炎驅原華魂西方八天禪猷寂濛潔嶺候涪蹈淩酬縁軸俞昌壽庚途凝栖辦黨喬依聖度越延食緫休基酉蕚輦秋由奚覽趨曆篯步稽畫拔屏持邈在玄落茂悅群作徧怙洎拜倫匠舊顙北方八天鎭佃丘㕓玉池慈源海影首逹辰火沇旋璫貟淨寳辟由光迷疆論壯治垂和邀瑰專臒史脩白洮淪實耕蘧申虺清監槎排丙綿司彪穆都伴獨持錞敷緒涸鐸變梯道言此諸天中大梵隱語无量之音舊文書日闕長樓赤扉之上以陽鬱儀之光其道至禁爲太上不泄之旨萬物爲之依息千聖用之遊桓兆能知之招靈採眞洞盈泥丸蘂嚲液泄神變成仙九祖受福身浮天雲字皆廣長一丈天眞皇人昔書其文以爲正音有知其音能齋少其音者諸天皆遣陽明神王下觀其身書其身勤上奏諸天萬神朝禮地祇侍門大功眞王保舉上眞道備剋得遊行三界昇入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致神王下觀日帝遥唱萬神朝禮三界侍軒群祅束首鬼精日亡琳琅振響十方肅清河海静黙山嶽吞煙萬靈振伏招集群仙天無氛穢地無妖塵㝠慧洞清大量玄玄也元始无量度人上品妙經卷之十四

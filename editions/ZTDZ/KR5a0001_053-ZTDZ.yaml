front:
  text: 靈寳无量度人上品妙經卷之五十三宙三
  hash: sha256:d7d491d7431aa991e38a06f268c57ebd57b0e386999b14205d6ebdbdc12e7b87
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_SJB_053-010355c, image: sjb/01/010355c.png}
body:
  text: 斬滅五行邪怪品道言昔於玉靈天中明景謡歌大威神土受元始度人斬滅五行邪怪無量上品元始天尊當說是經周廻十過以召十方始當詣座天眞大神上聖髙尊妙行眞人五帝眞官明威大將斬邪騎吏隂陽三五總統官曹紫微神兵無鞅數衆乘空而來金暉映虚寳輿仙飈華光羽蓋纒鬱晨霞萬景交朗煥燿八圓七日七夜十方仙眞層樓寳闕洞化相通天綱停佪星絡正度神風微扇妙靄凝香氣象融和海嶽澄清一國地土山川林木緬平一等無復髙下土皆作華玉瑩鮮五明之色衆眞侍座元始天尊玄坐空浮景燿神龍御化天元之座說經一遍諸天大聖同時稱善是時一國男女斷滅五慾之情說經二遍五化隆昌說經三遍五緯順𨇠說經四遍五氣常平萬物咸亨說經五遍五常不擾道治日新說經六逼五運推恊無有乖愆說經七遍五文顯布玄教開明說經八遍五神守正威用宣張眞氣充溢蠲蕩不祥說經九遍五精固養保育靈光說經十遍五行之内邪怪俱亡是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品斬滅青精邪怪至眞大神無鞅之衆浮空而至說經二遍南方無極無量品斬滅赤精邪怪至眞大神無鞅之衆浮空而至說經三遍西方無極無量品斬滅皓精邪怪至眞大神無鞅之衆浮空而至說經四遍北方無極無量品斬滅黑精邪怪至眞大神無鞅之衆浮空而至說經五遍東北無極無量品斬滅火行遊精邪怪至眞大神無鞅之衆浮空而至說經六遍東南無極無量品斬滅金行遊精邪怪至眞大神無鞅之衆浮空而至說經七遍西南無極無量品斬滅水行遊精中央黄精邪怪至眞大神無鞅之衆浮空而至說經八遍西北無極無量品斬滅木行遊精邪怪至眞大神無鞅之衆浮空而至說經九遍上方無極無量品斬滅天元五行邪怪至眞大神無鞅之衆浮空而至說經十遍下方無極無量品斬滅地元五行邪怪至眞大神無鞅之衆浮空而至十遍周竟十方無極斬滅五行邪怪天眞大神一時同至一國男女傾心歸仰來者有如密雲細霧無鞅之衆迮國一半土皆傾䧟非可禁止於是元始化一圓象大小無常煒燿五色在空玄之中去地九丈元始登引天眞大神上聖髙尊妙行眞人五帝眞官明威大將斬邪騎吏隂陽三五總統官曹十方斬滅五行邪怪至眞神王紫微神兵三天給事無鞅數衆倶入圎象之中天人仰看惟見拂拂從圓象中入旣入圓象不知所在國人廓散地還平正無復欹陷元始即於圓象之内說經都竟衆眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸行正心不欹不䧟不誑不佞不狠不愎不戾不乖不嫉不惡言行平直智識剛明齊同慧悟異骨和同國安民康欣樂冲融經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝内名隱韻之音亦是眞魔内諱斬滅五行邪怪百靈之隱名也非世上之常辭上聖已成眞人通玄究微能悉其章誦之十過諸天讃詠五靈敬侍金木水火元土合并神粹凝和毒害不生混養内化洞冥至眞邪怪鬼祅無縁而興至學之士誦之十過則五帝鑑觀九眞舉仙邪試滅迹怪禍永蠲道業保固善行克全所以爾者通感五行之神蕩伏邪怪召制威靈克成至道和合眞氣保育人命得躋玄境降㑹髙眞不死而已豈復更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因縁萬災不干神明護門斯經尊妙獨歩玉京度人無量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到十方斬滅五行邪怪之神勦絶魔精五行之内不爲殃禍災咎永消用保福祥而運化常寧安鎭率土普承玄恩仁夀冨樂清靜自然也上學之士修誦是經消滌邪害道氣清眞世人受誦則元眞受妙惑念永忘全其壽年後皆得受鍊度之道䰟神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死䝉恵上天所寳不傳下世至士齎金寳效心盟天而傳輕泄漏慢殃及九祖長役考官侍經五帝玉童玉女各三十六人營衛神文保護受經者身道言正月長齋誦詠是經召上元將軍斬滅五行邪怪不正之祅即使天界澄廓七燿常明七月長齋誦詠是經召中元官將斬滅五行邪怪不正之精保衛兆民使安其生十月長齋誦詠是經召下元官君將吏五嶽兵馬斬滅五行邪怪不正之靈安鎭天下慶祐君親歷世綿長後天而存八節之日誦詠是經召天地四方八極兵馬却絶魔靈順布五氣長養生成本命之日誦詠是經召天元九宫星宿眞官威殺之神檢校命籙五行邪怪祛斬滅蹤五神守正萬氣資形生道靈堅超遷上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目静思身坐青黃赤三色雲氣之中内外蓊冥有青龍白虎朱雀玄武師子白鶴羅列左右日月照明洞煥室内項生圎象光映十方如此分明宻呪曰无上玄元太上道君召岀臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋清堂修行至經無量度人願所啓上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始无量度人上品妙經元始洞玄靈寳本章上品妙首斬邪滅怪十廻度人百魔隱韻離合自然五氣眞文玄虚上神大混靈源天地幽根統運五氣五行之元大化總御歷劫綿綿五行布育相保生成非道不顯非道不明非道不立非道不眞錯沴結靄邪怪流形自然神德祛伐無停是爲妙範玄上之宗太極玉關金闕靈都隂陽元㑹三氣之樞浩浩元氣乍合乍殊青琳玉宫始暉妙庭墉臺積霄交和燿晶大周十境羅絡彌綸中有調運五行順化之神中有宰御玄極生育之君中有馘祅破害大神中有仙靈寳籙官君丈人中有隂陽三五七九明威正一定命尊神斷滅邪怪無量度人今日校録諸天臨軒東方無極飛天斬邪滅怪神王長生大聖無量度人南方無極飛天斬邪滅怪神王長生大聖無量度人西方無極飛天斬邪滅怪神王長生大聖無量度八北方無極飛天斬邪滅怪神王長生大聖無量度人東北無極飛天斬邪滅怪神王長生大聖無量度人東南無極飛天斬邪滅怪神王長生大聖無量度人西南無極飛天斬邪滅怪神王長生大聖無量度人西北無極飛天斬邪滅怪神王長生大聖無量度人上方無極飛天斬邪滅怪神王長生大聖無量度人下方無極飛天斬邪滅怪神王長生大聖無量度人十方至眞飛天斬邪滅怪神王長生度世無量大神並乘晨霞寳輿仙飈華光羽蓋驂衛三元官將十極仙靈建斬邪之節滅怪神旙前嘯洞眞之曲後詠靈虛妙歌紫鸞玄鵠吟嘯相和天蓬啓途龍虎翼轅億乘萬騎浮空而來傾光廻駕監眞度生天關内宰火鈴上曹監察大魔威禁玄靈紫清主録監度大神執麾仗鉞大布威靈齊奉帝符檢録五行察制萬類造化靈司山河海嶽經緯星躔八溟九壘十二宮辰祛蕩祅忒乖沴之愆束縳惡精邪怪之形不得怠縱逸肆魔群元始告命勑使神兵斬邪無蠲開化生津保安正道廻度劫輪眞機變鍊妙氣敷榮人無疾横神德合明永度世厄與天齊齡超出三塗絶離苦難越昇魔界遨遊上玄上玄之天天帝鬱延無色之境梵行東方八方玉儀明度天帝忽冋題蘇寂玄通正天帝寥遙初輔覺鎭陽天帝秀丹琡觀始明運修天帝辯盈子通靈澤隨化天帝海光洞珠方洞曆皇天帝去害無盡京基耀光天帝波斯普臺紫麟召仙天帝福長生南方八天太妙鬱晨天帝寳䇿紫微頂光履眞天帝道極祕呈存玄慶智天帝頓希谷仁傳靈滅魔天帝駢邾蕩魔顯生變身天帝隂穴露堪赤寳垂安天帝益鹿杳機錫禧祐明天帝冤婁莎庸洞光敬玄天帝何童歷聰西方八天神文示宗天帝玉棊上元虎裳世標天帝梵無延康遊眞虚用天帝謁昌華龍正氣符剛天帝邈育䂓測神問封天帝宣幽述眞奏功證道天帝運常明烈地薈冥天帝號希淵途誅怪通政天帝處彦那靈北方八天禁鎭百无利元天帝瓊敷仙髙宸泰微抃宗天帝鳳華飛綱洞志幽虚禮剛天帝文何德揚九廻轉德思本天帝陁邈清晦俱息康存一天帝陽文子持北清緫司天帝判皇極峒玄微察命天帝壽䝉資成鍳神按獄訊靈天帝望頥夷卿三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻五行之音五行之尊五行之神五行大魔五行之靈九和十合變化上清無量玄奥深不可詳敷落神眞普度天人今日欣慶受度歷關諸天請滅怪惡斬絶邪源調運五行功參大元眞王鎭御道氣開宣東極化木西極生金北極凝液南極激炎中極上宫合㑹四玄青帝衛生白帝歛德赤帝蕩祅黑帝收毒黄帝中王萬禍俱息木行大魔飛光寳龍火行大魔燿天紫童金行大魔返神㑹容水行大魔駕氣乗風土行大魔劫霞洞穹五行大魔萬神之宗部率神官出入幽冥橫戈擁甲萬騎雲奔統攝成伐與道同倫玉天開化察録神姧靈明通泰蠲却無前玉樞流擲烈銳八延三將馳驅四帥揚旛攫天觸爓擊雷散烟敢有干試拒遏上眞金鉞前戮巨天後刑掃除邪怪風火無停千千截首萬萬剪形魔無干犯鬼無祅精三官北酆明檢鬼營不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列言上清玄元妙紀五氣開皇眇眇大混混化微茫上施神華下布靈光纒綿元梵羅絡乾坤剛柔相感序列五行五行相運造育生成推蕩無滯和合歸眞妙道彌綸運度自然五眞流演升降回旋施養生化媾氣如泉五用順常萬類滋繁勝氣傍凌兼位而遷淫則爲癘邪怪起源出爲祟祅民物銜冤上帝勑斬敷落五篇赤書玉字八威龍文保制劫運使天長存梵氣彌羅萬範開張元綱流演三十二天輪轉無色周廻十方旋斗歷箕回度五行三十五分總氣上元八景冥合氣入玄玄玄中太皇上帝高眞泛景太霞嘯詠洞章金眞朗郁流響雲營玉音攝氣靈風聚烟紫虚鬱秀輔翼萬仙五氣混合自然成眞眞中有神太極元君三天眞老大混尊神太一司化三五神官執符把籙保度靈眞上遊上清出入華房八冥之内細微之中下鎭五嶽上安九天中理五氣混合百神十轉廻靈萬氣齊仙五行邪怪斬滅無干髙明紫微流轉諸天掌世罪福與道同玄仙道貴生無量度人炎炎五星飛天如輪下維九宫上開八門罪福禁戒宿命因縁普受開度五行生身身得受生上聞諸天諸天之上各有生門中有五行空洞之章眞王靈篇辭參髙眞第一化生五行飛空之音大梵未開無形無名二儀分兮位列五行東青西素南丹北玄元一中黄五氣相循各有主性與道變遷此爲道根色質相連寳臺玉宮碧山金門上眞仙聖無量帝君冥冥之中運合眞神錦旛黃綬紫蓋朱輪皆眞五色隨化成形息意冥一分化億千超度三界飛空結仙此道世莫知眞王當普宣神霄數萬里金闕相輝鮮飛神恍惚間萬聖馳雲軿世途念流轉使我常哀憐何如向玄道妙本晤所歸邪怪盡淪息長居玉帝前第二斬滅五行邪怪之章天元太乙帝司主兵䕶衞世上保合生精華衣繡裙玉冠青巾青龍左列白虎右賔佩服龍劔五福之章統部神官三五將軍檢校隂湯運合元機五行邪怪莫不傾摧有邪必斬有怪必摧敷祐福祥啓悟希夷邪怪已消滅五帝降靈威護世過萬年帝德日熈熈黄龍下中天帝壽天所期神霄空洞章奏香緑姻飛第三和合五行歸身契道歌曰太虚玄妙神空洞幽无君生於渺漭中造化標元根淡漠居正性返照滅邪氛消魔怪害除冲融和至眞昭昭智慧鋒威伐叱祅群五濁安能擾明煇華景形佩服靈寳章雲光煥爾身玉符鎭內景龍虎纏胎嬰水火金木交混一宗皇靈巍巍御絳闕冥冥理百精誰知年劫運長保無窮齡舞輪三界外翶翔登九清此三界之上飛空之中眞王歌音音參洞章誦之百遍名度南宫誦之千遍魔王保迎萬遍道備飛昇太空過度三界位登仙公有聞靈音邪怪滅形勑制地祇護度生民消拔禍難超越惡津七祖昇遷永離鬼群䰟度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈眞王隱祕之音皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奥難可㝷詳上天所寳祕於玄都髙上神霄玉清王府東館藏室依玄科三萬七千年應運下傳若有至人齎金寳質心依舊格告盟玉清然後而付焉道言夫五行氣逆則淫僣自生隂陽勃亂則邪怪乃作乗節隨氣刑害乃興凡有此災至士皆當齊心修齋六時行香十遍轉經福德立降消諸不祥無量之文普度無窮道言夫五行衰絶則命數終盡三元愆否則元氣凋微末學道淺仙品未充運應滅度身經太隂臨過之時同學至人爲其行香誦經十過以度屍形如法䰟神俓上南宫隨其學功計日而得更生轉輪不惑便得神仙道言五行之氣出爲邪怪則致天地運終星宿錯度日月失明四時失度隂陽不調國界不寧兵火時起疫毒流行兆民死傷師友命過皆當修齋行香誦經則五行邪怪之鬼聞經鎭制呼其姓名稱說根本因縁之狀叩首請命永不敢干經隱妙道及以眞符無不禳却也夫齋戒誦經功德甚重上消天災斬滅邪怪保鎭帝王下禳毒害以度兆民生死受頼其福難勝故曰無量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衛右別至人剋得爲聖君金闕之臣諸天記人功過毫分無失天中眞王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君撰元始靈書中篇東方八天橙俞离瓊律角冥外祺羅屈丹妙頴楚僅雲霏瑶閎利逸謹慧參鐸鶉房偃營生記珠煥陽甫符梁照昧巒格燕盡冒德施隨青鄙洛汶華光擇匱嬰環何容枳墩陸㑹南方八天曖曨奎常九暄柏枚漾朗冀泮𤥨英明住卜慮罄曜丘抨驛催救溢秉琅圖倨金夷渺歷定籌𢘆佑慈理㳙浦牛童加那彦東梵珞祕思以龍伾轅覿綿炳懟金庭蕭仙西方八天鈕陶紀延洞留啓宣角𨇠東虚疾通敬湍招定純微益素廬全騰秉紹宣竺路亨慜濟幽忻淵文邦師瀆寥幾秦元布庸疑拳直野魔池振篇琅祈昆漠未腆靈恍完怖北方八天列晤亶定耿澄微萊鑑萌資條陽璉印部膽但瓊拂拯紀盈剔撰慈窺冥番波氐石仙潭碧洙友句肆亭聿琳序演粲調持屏閟㕓靚沐洋略扁飛雷族咸厓蹟眞皇微道言此諸天中大梵隱語無量之音舊文字刻書太極東臺喬城之上喬城爲五行出入之墟以正分度經變造化順隆時符字皆廣長一丈天眞皇人昔書其文以為正音有知其音能齋而誦之者諸天皆遣日直仙吏飛玄大神下觀其身書其功勤上奏諸天萬神朝禮地祇侍鬥大㓛眞王保舉五辰道備剋得遊行三界昇入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致仙吏下觀上帝遥唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響十方肅清河海靜默山嶽吞烟萬靈振伏招集群仙天無氛穢地無祅塵冥慧洞清大量玄玄也元始无量度人上品妙經卷之五十三斬滅木宫邪怪靈符斬滅火宫邪怪靈符斬滅土宮邪怪靈符斬滅金宫邪怪靈符斬滅水宮邪怪靈符

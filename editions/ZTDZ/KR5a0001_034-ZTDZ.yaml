front:
  text: 靈寳無量度人上品妙經卷之三十四黄四
  hash: sha256:17084a0767469a1516f75c472ed064a9f8662b2daf5f5e684e82f2624517c591
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_SJB_034-010226a, image: sjb/01/010226a.png}
body:
  text: 騰曜二景五星品道言昔於上極天中霄霞洞歌大光明土受元始度人騰曜二景五星上品元始天尊當說是經周廻十過以召十方始當詣座天真大神上聖髙尊妙行真人無鞅數衆乗空而來紫煙霏霏玉飊華車靈雲蔭蓋朗映晨煇九色蒨璨洞煥十方七日七夜諸天妙氣結化成形並爲珍寳八風惠暢四海和寧時無乖沴庶物自然一國地土山川林木緬平一等無復髙下土皆作月𤩹日珠靈華五色衆真侍座元始天尊玄坐空浮洞化龍仙曲晨萬象玄牀說經一遍諸天大聖同時稱善是時一國君臣修崇道徳感格神真說經二遍二景齊明說經三遍三才交暢說經四遍四時順序玉燭調和說經五遍五星循軌歷劫不愆說經六遍六氣周流運化協功說經七遍七元停徤光景延長說經八遍八方列宿刻注不干說經九遍九宮主宰捍厄除災說經十遍十神安位永致福祥是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品天晶騰曜至真大神無鞅之衆浮空而至說經二遍南方無極無量品天晶騰曜至真大神無鞅之衆浮空而至說經三遍西方無極無量品天晶騰曜至真大神無鞅之衆浮空而至說經四遍北方無極無量品天晶騰曜至真大神無鞅之衆浮空而至說經五遍東北無極無量品天晶騰曜至真大神無鞅之衆浮空而至說經六遍東南無極無量品天晶騰曜至真大神無鞅之衆浮空而至說經七遍西南無極無量品天晶騰曜至真大神無鞅之衆浮空而至說經八遍西北無極無量品天晶騰曜至真大神無鞅之衆浮空而至說經九遍上方無極無量品統辰御象至真大神無鞅之衆浮空而至說經十遍下方無極無量品承光合景至真大神無鞅之衆浮空而至十遍周竟十方無極天晶騰曜日月星宿天真大神一時同至一國男女傾心歸仰來者有如細雨宻霧無鞅之衆迮國一半土皆偏䧟非可禁止於是元始俯容笑喭億衆傾瞻於是旋命紫微玉妃啓御神寳鑪擁夜山火玉徊妙靈香煙結空中如寳如雲現一瓊室縹緲之間去地十丈元始登引天真大神上聖髙尊妙行真人十方無極至真大神無鞅數衆俱入瓊室之中天人仰看惟見拂拂從煙景中入既入瓊室不知所在國人廓散地還平正無復欹䧟元始即於瓊室之内說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏欻之間寂無遺響是時天人遇值經法皆獲開悟得保永年無有中傷順土受度與道齊真不災不害不夭不殘不虧不敗不愆不禍不哀不死顔如玉瑩體映金姿内外無疵徼妙合玄下保家邦安泰昌隆經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝内名隱韻之音亦是二景五星騰曜星君髙真隱韻之音亦是璘儀三素之隠名也非世之常辭上聖已成真人通玄究微能悉其章誦之十過請天遥唱萬帝設禮日月垂芒星辰映華寳炁流精妙灌三宮百神飲玉千真嚥芳羣魔束形鬼精滅爽廻屍起死白骨成人至學之士誦之十過則日君鑒徳月妃受靈超脫世難以得長生所以爾者學士方達妙詮未鍊至真勤苦修行道漸升玄自可祛蕩災疾感格妙氣但却死而已不能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因縁萬災不干神明護門斯經尊妙獨歩玉京度人無量爲萬道之宗巍巍大範徳難可勝道言凡誦是經十過諸天齊到七曜之真保度善人一身受度七祖昇遷享福天堂常處逍遥上學之士修誦是經與道契徳與天齊真世人受誦散禍延年後獲成功遇其經訣得作解化之道以度於世此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寳不傳下世至士齎金寳效心盟天而傳輕泄漏慢殃及九祖長役地官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齋誦詠是經招致日魂保生鍊屍注景成真爲上世亡魂斷地逮役度上南宮七月長齋誦詠是經招引月魂保生鍊屍降景成真身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經招引五星精魂保生鍊尸合景成真騰燿玉華普頼生成爲國王帝主君臣父子安鎮國祚保天長存世世不絶常爲人君安鎭其方民稱太平八節之日誦詠是經神氣纏綿運化形軀克就玄業得爲九宫真人本命之日誦詠是經寧固命府塞遏死津魂魄受鍊道體日新超出苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿徳就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐五色雲氣之中内外蓊㝠有青龍白虎朱雀玄武獅子白鶴羅列左右五星真氣纏綿兆身日月照明騰曜室内項生圎象光映十方如此分明宻呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齋清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始無量度人上品妙經元始洞玄靈寳本章騰燿二景五星上品妙首十廽度人七晨隠韻造化自然髙上元精天皇至真元始結化煥落天經隂陽推別分布五行自其本元凝積神精列象穹玄日月輪燿五星交躔各有宮府明皇道君玉妃夫人司領治化禍福生成騰燿經緯昼夜無停綱維次舍宿度之間隨其氣數以立權衡品物受命庶位衆靈凡隷臨照莫不禀承衰旺隠顯進退虧盈辯其主張亦有其方上攝中極紫微天皇髙上玉真曲素雲房金闕靈都森羅㑹宗太妙之極無所不周中有宰御天地之神中有大帝金毋扶桑閬風二䦝之官中有乾元萬炁之君中有五靈真老元都丈人中有南上司命司録延壽益筭度厄尊神囬骸起死無量度人今日校録諸天臨軒東方無極飛光騰燿神王長生大聖無量度人南方無極飛光騰燿神王長生大聖無量度人西方無極飛光騰燿神王長生大聖無量度人北方無極飛光騰燿神王長生大聖無量度人東北無極飛光騰燿神王長生大聖無量度人東南無極飛光騰燿神王長生大聖無量度人西南無極飛光騰燿神王長生大聖無量度人西北無極飛光騰燿神王長生大聖無量度人上方無極飛光騰燿神王長生大聖無量度人下方無極飛光騰燿神王長生大聖無量度人十方至真飛光騰燿神王長生度世無量大神並乗華龍彩鳳金根陽燧之車五色瓊瑤之輦廽光紫蓋景燿靈旛前嘯空歌齊詠後吹靈響同鳴獅子白鶴嘯歌噰噰靈童散花玉女擁軒億乗萬騎浮空而來傾光廽駕監真度生諸天丞相南昌上宮韓司主録監生大神執綱乗紀齊到帝前隨所應度嚴校諸天二景五星真光激旋採咽奔引注功太玄上爲髙真福施無邊普告三界無極神郷泉曲之府北都羅酆三官九府十二河源上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼羣元始符命時刻升遷北都寒池部衛形魂制魔保舉度品南宮死魂受鍊仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度三塗五苦八難超凌三界逍遥上清上清之天天帝洞明無色之境梵行東方八天極華燿真天帝咸伸戈玉明純意天帝述正微無量燿景天帝邈自頻機朱經離雲天帝穹修度廽真英鎖龍天帝召都康師燕常凌虚天帝翹里治因九芒淵靈天帝覺由洞閑仙臺乗光天帝冲遥客孚南方八天紫玄凝光暉逸天帝敏江約樊變霞隱金明幾天帝辯棋廣仙蓋空梵氣天帝紉徳盧蓁陽神扶靈天帝古谷允嘉丹炎洞陽天帝太隆阿生竒都益元天帝波遲騰崇景空回雲天帝荷明思觀寳魂隱章天帝道陣勤和西方八天晨浩㝠元天帝澤宣濟元清瑶進希天帝運英摽華金羽芝帶天帝弼維員承煥極太真天帝鼎跡瑶光緑光度玄天帝尚吠伯誨初皇含暉天帝長定宜文道諱對精天帝顓越慈信一混露液天帝博還陽恭北方八天螭房利神天帝攝萬精寥幽宗光天帝玄祖蘄清龍陁梵道天帝沖融定方元一生靈濟化天帝基昌化時垂熒灌炁易本天帝益趙進㳙墉微建霞可智天帝浩摇微光熾文成流天帝沙逾變周法有足思天帝紂杳鳴潛三十二天三十二帝諸天隠緯諸天隱名天中空洞自然靈章七晶隱韻御景之音天地之尊靈寳之神飛晨三素鬱儀結璘九色十華變化上清無量之奥深不可詳招神飲光普度天人今日欣慶受度歷關諸天日魂月魄五星道君請注暉芒流霞絳津灌兆百骸凝固泥丸髙奔帝宮入燕瓊臺乗駕寳車上造日門月妃贈珠蘂池浴身木星鎮肝金星保肺辰星固腎熒定心中央土皇厥號鎮星榮養脾元緫衛一形青霞護魂白霞侍魄赤霞養炁黑霞通血黄霞主命萬神無越五色流霞煥爛華鮮自天來下入兆九宮三田盤囬八景蔚融青華帝君天雉落澤赤華帝君皓雲充極白華帝君阿婁歘幽黑華帝君碧瀾真侯黄華帝君寳鬲承休五華帝君日月之神隨兆吸引降光運精神光照目玄珠意輸七辰帝尊萬神之宗飛行鼓從緫領合明九億萬兵麾幢鼓節遊眄天津散靈育生共成玄功上天度人此道爲宗日月之使二景皇君五星上王廽霞緑英威南受命普掃不祥先斬隂孽下布威光金晶吐毒玉馬魁張天丁前驅大帥仗旛擲火萬里流鈴八衝敢有干試拒遏上真金鉞前戮巨戈後刑屠割鬼爽風火無停千千截首萬萬翦形魔無干犯鬼無祅精三官北酆明檢鬼營不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列言上清二景元精五星威神與道同徳天地俱生騰燿未判混沌之中上無復色下無復淵神風淪激火液凝光日月合𤩹五星連珠共處玄胎以養天軀天上天下無幽無㝠無形無影無極無窮赤明開圖運度自然元始安鎮七燿列玄二景飛騰五星運天水火分任萬物所尊兆引其精克爲真人白華凝液神氣同符傳降天樓二十四關木榮土化金烹火鎔氣矢交射走虎蟠龍赤紋成脉布絡三元玉真明堂敷落五篇赤書玉字八威龍文保制命㑹使身長存梵炁彌羅萬範開張元綱流演三十二天輪轉無色周囬十方旋斗歷箕囬度五常三十五分緫氣上元八景㝠合氣入玄玄玄中太皇上帝髙真汎景太霞肅詠洞章冠帶日月衣服星辰垂芒騰燿朗徹髙清金真明郁流燿雲營玉音攝炁靈風聚烟紫虛鬱秀輔翼萬仙二景五星通光入身千和萬合自然成真真中有神長生大君無英公子白元尊神太一司命桃康合延執符把籙保命生根上遊上清出入華房八冥之内細微之中下鎮人身泥丸絳宮中理五氣混合百神十轉廽靈萬炁齊仙仙道貴生無量度人上開八門飛天法輪日月運行寒暑經緯五星主令導和生身身得受生上聞諸天諸天之上各有生門中有空洞謡歌之章真王靈篇辭參髙真第一騰曜飛空之音水火相函氣號混芒柔於裹囊圎包不開浮沉太空天地神胎真炁如煙左周右旋至精爲星日玄月青熠燿生華煥顯難名天老剖象玉麗神嬰日月自飛五星内明㝠㝠交養騰燿而升景騰星燿色象齊并萬物啓圖赤書玉丈動植滋繁皆有天經中虚以節外華以紋虚則達氣紋以運精神爲生主動植炁均萬化淘澤騰燿是因太空杳杳玄漠深淪日月既照屈者能伸真王飛空交映寳輪洞鑒十方垂光度人行斯祕道神霄上賔第二二景飛霞之章玉海無際碧煙徘徊扶桑萬里青闕崔嵬中有寳臺内隱樞機左日右月前罡後魁玉女持錀神官啓扉晝日夜月翕受敷施舉標斡輪萬象分馳日月二門激電飛雷騰騰寳光命駕九龍絳霞紫雲映天曈曨朱芒張絃金繩下連兆執二章引景八圎日童玄炎月妃華㛹吐光揚暉散注流分保兆生命變化神仙雙景並燿深入含蓮紫金爲容受書帝軒第三五星鍊真歌曰東方九氣歳星九門玉樓萬重寳駕飛輪中有帝皇青衣絳裙南方三炁熒星三門瓊臺八觚辟飛流煙中有帝皇錦衣寳冠西方七炁岡星七門靄靄金闕玉光散分中有帝皇素衣虎裙北方五炁辰星五門龍宮髙浮紫雲擁軒中有帝皇玄衣飛裙中央十炁鎮星十門黄池帝臺五斗攝精中有帝皇黄衣錦裙彼五帝皇緫御萬靈泛泛天光來入兆身鍊真易骨刻兆仙名乗飛龍兮遊九宮宴妙庭兮舞千童交虎旗兮傾羽蓋震鍾鼓兮動天籟五皇歡樂兮福祐帝宮永陽春兮億壽無窮引靈光兮神炁熏融登上清兮超凌碧空此三界之上飛空之中真王歌音音參洞章誦之百遍名度南宮誦之千遍真仙下迎萬遍道備飛升太空過度三界位登仙公有聞靈音真王降形鼓制地祇侍衛送迎抜出地戸五苦八難七祖升遷永離幽宫魂度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及神霄真王挹暉奔景騰燿日月五星上道隱祕之音皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奥難可尋詳上天所寳祕於神霄玉清玉府東華經室數當壬辰應運下傳若有至人齎金寳質心依舊格告盟真王然後而付焉道言夫天地運度亦有否終日月五星亦有虧盈至聖神人亦有休否末學之夫亦有疾傷凡有此災同炁皆當齊心修齋六時行香十遍轉經福徳立降消諸不祥無量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太隂臨過之時同學至人爲其行香誦經十過以度尸形如法二景五星之精鍊化屍穢魂神俓上南宮隨其學功計日而得更生轉輪不惑便得神仙失度陰陽不調郡邑災蝗水旱流移疫毒流道言夫天地運終星宿錯度日月失昏四時行兆民死傷師友命過皆二景五星之致也亦當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎮帝王下禳毒害以度兆民生死受頼其福難勝故曰無量普度天人道言凡有是經能爲天地帝主兆民行是功徳有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衛右別至人克得爲聖君金闕之臣諸天記人功過亳分無失天中眞王亦保舉爾身得道者乃當洞明至言也諸天中大梵隠語無量音道君譔元始靈書七辰寶篇東方八天騫樓岸符宛蕭瑶琚玟還阿奢奔澤西杅落棧謨群攴斗益敷渺化尤砭歷論伊尋光訛定拘定思雲魂神洞郁郁億亶胡汾赤咤慶廬戚驛資存佑路善特匪燿維騰南方八天素登丘霞月液芬葩九帝畜武迎田湊營畔府碧顔鳥鑑留南質承子敔燕程被幾靖暮輕槎愿廢猛寂訖竇殊堅波緘罔直瓊酴億歡奔升管堤爛陳宣嶷游丹沖昵西方八天晨鸞著啼翹趙忘雷乙戰兊醜祝照漂隨黨薄豫童鳩沙華谿勢式莊驅玉崑輔宣丙鉛雌神合規扶鄰正戟廽枚暴酉那兊俵道韓曲大庚樅竹臼積天屢萬闌敏目北方八天疆黙窘闌夷增巨修岑永部承擊幾前謨飛魔周玄術如紀光洚欽野盧抱圖𨓜嵩稽庸等化飲謹周夷智洪觀區投幽運機慧仝昭徹晨鋒敕彌尺坎潯奏虎震威峙道言此諸天中大梵隱語招降二景五星神精霞液上道髙真命仙無量之音舊文元始開圖生於二景五星之中騰燿光華感化萬物字皆廣長一丈天真皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣神霄上吏下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勲靈司保舉洞玄道備克得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成天真自然之音也故誦之致日月流精身神上奔五星垂華鍊炁成仙太上之道經隱妙玄上帝遥唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響金石同鳴仙梵合律十方肅清河海靜黙七辰吐光天魔飛翥山嶽吞煙萬靈振伏招集群仙天無氛穢地無祅塵㝠慧洞清大量玄玄也元始無量度人品妙經卷之三十四

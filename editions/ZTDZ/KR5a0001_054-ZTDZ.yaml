front:
  text: 靈寳無量度人上品妙經卷之五十四宙四
  hash: sha256:521e9f7f84c9b6d153ac3daab7476a82355ddafc2efcb55a630f22c7edfb8dee
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_SJB_054-010362b, image: sjb/01/010362b.png}
body:
  text: 斬馘不祥品道言昔於始青天中紫陽泛歌大福樂土受元始度人斬馘不祥妙品元始天尊當說是經周廻十過以召十方始當詣座天眞大神上聖髙尊妙行眞人靈威神王黑天玉京大將斬邪馘毒威兵巨魁伏魔誅䰟都吏無鞅散衆乗空而來寳雲接天明霞履海瑶車玉輪珠景垂䕃飛華妙光疊彩葱薈森映碧空三日三夜諸天宫殿山川谿谷混交九色三辰定照五斗停機四極運明神烟澄霽一國地土都鄙人物遞相鑒燭萬身入於一身一影普涵萬影色空同顯神氣合冥遐邇若等無復髙下土變柔碧洞徹九虚衆眞侍座元始天尊玄坐雙景廻旋神龍天寳之座說經一遍諸天大聖同時稱善是時一國男女天身淨睦妙香飄馥說經二遍天境髙嚴九霄散縟說經三遍沆露凝珠寳林綴網說經四遍天籟成音瓊金流響自然法唱讃詠冲玄說經五遍水光湛瑩海嶽呈祥說經六遍飛仙揚花彌空錦色說經七遍靈威降世掃滅祅氛說經八遍三界䝉福人道安寧說經九遍六氣順常三災消殄說經十遍天眞下濟說法度人是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品靈威勑法大神無鞅之衆浮空而至說經二遍南方無極無量品靈威斬祅大神無鞅之衆浮空而至說經三遍西方無極無量品靈威斬鬼大神無鞅之衆浮空而至說經四遍北方無極無量品靈威斬精大神無鞅之衆浮空而至說經五遍東北無極無量品靈威典獄大神無鞅之衆浮空而至說經六遍東南無極無量品靈威斯邪大神無鞅之衆淨空而至說經七遍西南無極無量品靈威飛符大神無鞅之衆浮空而至說經八遍西北無極無量品靈威吐毒大神無鞅之衆浮空而至說經九遍上方無極無量品靈威九首大神無鞅之衆浮空而至說經十遍下方無極無量品靈威殺伐大神無鞅之衆浮空而至十遍周竟十方無極靈威大神一時同至一國男女傾心歸仰來者有如歸雲歛霧無鞅之衆遍滿一國咸覬和寧斬馘群醜不祥捐蕩境字鎭清駢呇凝瞻非可禁止於是元始天尊於眉間示現金色光明色光宛轉於其光中化岀十方宫殿戸牖敞對重堂巍閣光氣同流冉冉浮空去地五丈也元始登引天眞大神上聖髙尊妙行眞人十方無極靈威大神無鞅數衆倶入化宫之中天人仰看惟見勃勃從化宫金光中入旣入光中不知所在國人廓散神宮流轉勢如旋虹元始即於其内說經都竟衆眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度邪正道分斬魔馘祅蕩滅不祥傾土歸仰咸行善心正智正道正神正念正思正意正力正威正行正儀言詞朗直口慧和聲齊同慈愛異骨成親國安民豐欣樂太平正教開廓魑魅馘平道妙至眞悉廣明心寳奉宗禮皆得度世道言元始天尊說經中所言並是諸天上帝正眞内名隱韻之音亦是十方靈威神王内諱斬馘不祥之隱名也非世之常辭上聖已成眞人探妙極微能悉其章誦之十過諸天命靈八威鼓氣神官執剌魔帥禀章綱緯合軌元魁吐暉邪精滅迹鬼徒䘮形正道通心眞光衛䰟陽施至德死而更生至學之士誦之十過則九天䇿名五帝給乗三元備兵惡注逃殞生功充盈邪關杜塞赤書降庭福源自布災殃不經所以爾者學士感徹玉清高上遐鑒羽葆列營召制十方威被六天道爲太極所仰萬靈咸尊已試無難固守黄寧地祇敬伏攝御魔靈辟除災病永與生存輕誦此章削落胎元神盧圯摧七魄蹈揚供養尊禮門戸興隆霄京降契福䘵共滂大帥秉鉞斬馘不祥世授道德孫葉茂昌慶善相因萬災伏藏斯經尊妙獨歩玉京度人無量爲大法之宗巍巍正氣天德自勝道言凡誦是經十過諸天齊到神綱五斗巨天斬馘天騶甲士威南巨兵五天大帥部率十方靈威河魁大神銜符操鉞即至其所摉捕九醜暗澤幽川古空巫祠一切祅魅及以䰟爽依附木石潜遘生人誣訟三官覬伺禱祭四目大呼神虎奮翅毒獸舉牙擲火激電斬首馘耳世之不祥應皆蠲蕩也上學之士修誦是經青房大神鳴鈴以却穢紫戸將軍引劔以辟魔玉女叩瓊於九室黄老振音於三素也世人受誦則延壽長年黄庭之下戸白雲之窮閭泉曲寒池萬鬼弭蟄腎海不波水怪竄迹上宫唱善三府樂玄後皆得作尸解之道魔鬼不得而徴呼地司不得而攝録神氣藴形自成法體魔精受鍊飛行太空此經微妙普度無窮一切天人莫不受慶天界五魔中元五尸地司五考永斷不祥長保元吉無量之福生死䝉惠上天所寳不傳下世至士齎金寳效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衛神文保衛受經者身道言正月長齋誦詠是經召攝北清洞隂尊神部督神兵奏詣上宫七月長齋誦詠是經召攝中天五帥三界大魔紫微帝君統按百神滌蕩邪源掃滅祅氛十月長齋誦詠是經召攝六天洞臺之靈三官曹局考䰟大神執御八山勾鎻勑殺大神九首龍君斬馘故氣不祥窮䰟五殟疫毒土木百精害於生類羗夷鬼神使國界安寧人民遂成國王帝主君臣父子安鎭國祚保天長存世世不絶常爲人君安鎭其方民稱太平八節之日誦詠是經召攝八天大威烟火洞熏太一八神八殺靈君領駕風雲遊盻九宮孤虚竒門斬馘不祥無使亂程本命之日誦詠是經召攝三眞升入泥丸斗極紫烟中黄上眞口吐青華鎭兆等身三尸消落殃疰枯焚黑結白姧斬伐無停三帝紀功七眞運靈神童導前身有光明三界侍衛五帝司迎萬神朝禮名書上夭功滿德就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黄白三色雲氣之中内外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右三天直事左右兵吏殺鬼使者斬馘天騶森然備衛日月照明洞煥室内項生圓象光映十方如此分明宻呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始無量度人上品妙經元始洞玄靈寳本章斬馘不祥十廻度人破邪隱韻離合自然太无无名混洞北清太一正眞化爲老人紫羽錦䙱腰帶流鈴首建天英執御洞經口吐靈和斬馘百精天和至眞眞氣煥明五色玄黄八角成文龍章虎書符圖啓靈化生六甲役使六丁三元定録五帝變形開廓隂穢正道聿興無文不光無文不明無文不立無文不成無文不度無文不生是謂大梵天中之夭玉符妙重諸天所尊變化金闕上清之神太霄九華梵氣洞冥圎羅紫極七九合玄玄臺玉京中有上皇斬邪討姧惡源消斷眞道自然自然靈威火山炎池冶鍊至神龍巾鳳衣主攝不祥聖頥通開萬二千神符圖火兵俠衛上皇都校三元眇眇玄道若亡若存雙景内朝隂陽循環紫景白霏嚴駕不停大行梵氣周廻十方中有三天正法之神中有北玄斬邪之君中有司禁勑法之神中有神符保命之君中有六天普護丈人中有九天司命採察之君廵遊五嶽丈人都禁眞官身化水火立生風雲神公萬億虎賁兆民斬馘不祥無量度人今日校緑諸天臨軒東方無極靈威神王長生大聖無量度人南方無極靈威神王長生大聖無量度人西方無極靈威神王長生大聖無量度人北方無極靈威神王長生大聖無量度人東北無極靈威神王長生大聖無量度人東南無極靈威神王長生大聖無量度人西南無極靈威神王長生大聖無量度人西北無極靈威神王長生大聖無量度人上方無極靈威神王長生大聖無量度人下方無極靈威神王長生大聖無量度人十方至眞靈威神王長生度世無量大神並乗紫氣丹霞佪光赫衝翠旌錦節素蓋瓊輿驂御龍虎導從仙眞建五神流煇之幢三素翔鸞之绂前嘯玉籟齊唱後吹碧籥同鳴絳鵲青禽嘯歌噰噰四明治道五仙陪車億乘萬騎浮空而來傾光廻駕檢録不祥諸天上公北鄷眞宰九天都司七政八靈騁霧凌風奔馳炎獸擲旗鼓革號呼獵響執案考籍齊到帝前隨所應度嚴校諸夭下及人都幽關冥界無極神郷泉曲之府北都羅鄷三官九府十二河源爍羅鬼國二十四境幽獄罪徒生䰟死魄停繫嶽瀆注害世間喜爲不祥促人壽命發災興毒成厄誣冤放施毒邪臨民命禄使福德不備智暗偏禀剋夭族屬隂曹肆便宄惑綿邈嚴奉赤文祇行符命神刀斬戮萬鬼縻睛解釋祖考億劫種親及大魔䰟攻蝕攝考肆虐生民不得拘留逼合鬼群元始符命時刻昇遷赦過伐罪一一記名北都寒池部衛形䰟制魔保舉度品南宫世無災殃福慶自生不斬馘者鬼録課盟死䰟受鍊仙化成人生身受度億劫無傾隂陽九六常與善循隨劫輪轉與天齊年永度三途五苦八難超凌三界逍遙上清上清之天天帝玉眞無色之境梵行東方八天紫景玉華天帝肇符喜生都極重明天帝鬱黎兼登宣眞都正天帝覺霞定符穹燿思微天帝正辨九區蒼微露帝天帝敦和學謀至正常無天帝孔彰儀能靈姬肇符天帝元昌崇燿樞觀化天帝龍扶越聰南方八天赤明燿明天帝賈須騫蒲阮諸綿丙天帝珠鋹祕圖太眞素霞天帝鳳趺玉孤道山空際天帝九星演湖洞浮紫華天帝光平敷元理妙機天帝奥庭竟星嶠嶼洞洪天帝别南彦冥烈歘髙晨天帝黨輔元需西方八天廖霞雲素天帝偃庭干鉏化宛丘緒天帝援揚斗然九道化陽天帝勃羅㑹明八地素曆天帝願慈眞逾太微妙觀天帝孽嶺昭淵飛華浩圓天帝翥祺夷妃金映灝都天帝那離權機玉鍊道成天帝虞亭玞北方八天冥洞斗魁天帝術遐卷承雉室羅宏天帝雲笏潜虛玄靈修化天帝尚賢玉明除眞穹臺天帝羅都元虚太霞玄眞天帝暮縁景昌混明燿景天帝眞期陽靜順慶宗天帝部靜祉詹玄精秀光天帝卞丁千期三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻天正之音天正之尊天正之神天正大魔天正之靈氣和道合變化此清出教布正萬邪莫干劔芒斬梟鬼井逃奔玄文紫書雲篇洞章敷落神眞普度天人生兆正氣奕奕法輪長矛巨矢瀝血喪睛今日急速關察火令橫摧斬馘刳滅五帝列儀炎烟萬丈雷電交馳車破鬼營兵散積屍冥官送檄九道併追飛行五門順逐三竒神王稽顙六天迎魔東斗降氣西斗垂綱北斗勑法南斗火然中斗紫宸役御九天青帝變文白帝斬形赤帝傳符黑帝運神黄帝出令萬靈咸聽青天神王瞿羅彭興赤天神王鼓畢冲明白天神王虎目昌英黑天神王礔石漂凌黃天神王皛都罙凝五天神王萬神之宗斬鬼億千馘殄不祥總領鬼兵泛泳大荒麾幢鼓節遊盻翶翔霞結成書龍舉爲章火風赫炎諸天齊功上天斬邪嚴攝北酆神公受命普掃不祥丹靈敷熾黄越誅殃六手操兵鐵額擲烟食邪之獸啖鬼之王霜甲秋陣殺氣夜河元帥統軍大帝命魔玄老前戮龍將殿圍擁騎雲崿玉鉞迎阿玄獸吞鎗青斗列言速登我前敢有干試拒遏上眞羽葆轉碧鸞惟翊軒萬旅震途群眞回軿屠割摧裂毒求激淵邪道靜黙有誅無捐萬萬截首千千劓勍魔無干犯鬼無祅精三官北酆明檢鬼營不得容隠金馬驛呈普告無窮靈威俯聽地司五皇列言上清寥無恢運幽虚含精龍漠延康浩浩赤明劫成界開隂陽體名倏忽變化三景玉清上通無玄下際無淵風爲隂火水爲陽津風秀成爓水凝爲石洞虚穹貫三十二天中有正氣爲道髙眞辟除萬邪㑹歸正明至化通玄鬼試莫干道爲天父神爲氣根金剛乗天天無幽冥天無形影天無極窮溟涬大梵爲道之宗遼廓天光萬象畢容爰有九都爲鬼之皇與帝同生龍穴徬徨擅治六天害正無光元始開圓赤明洞張三界化現千神佩璫玉文誅斬馘滅不祥麟迹虎符飛雲併臧元氣成符精𩲲滅亡帝一捧日玉女侍傍梵氣流行仙聖穰穰正意梵魔萬法克揚絡雲架霞綴珠垂芒丹繩絳縷屈曲低昻上布玉清三十二天輪轉無色周廻十方玉宇分譯大極洞房長樓寳山妙臺玉堂正天運度消滅不祥氣運五色玉虹奠方旋角歷氐遶心蒂奎牛女入斗冥祅四飛横度中樞廻行五緯二十八舍緫氣眞元八威合氣氣入太元玄中帝皇洞隂北眞身帶瓊璽頭建神光泛景紫霞嘯詠洞章流鈴電火響震鬼營玉眞吐氣靈官騎星風火敕命金石生烟地囊泮潰屍魅昇仙千化萬移自然知眞知眞得道道性通神中有至眞長生大君九氣丈人八極尊神五天元宰總正神靈太一轉式司命揀卿齊到下方斬伐祅倫符籙前驅兵馬糾紛青髻蝕暈赤靈考䰟校約宿命俱奏崑崙上遊上清岀入黄房八冥之内鬼道不祥束送帝君及於世間生化所因不得隠避枉禍善人細微之中下鎭人身泥丸絳宮黃池紫海十二之泉寒夜幽路百鬼之群佩服者書八㑹神文氣血流轉斬馘邪神鬼祖畢陽聽命喪精寳符降告變骨成眞中理五氣混合百神十轉回靈萬氣齊仙仙道自生無量度人神入天門心自通眞神珠運行如大法輪精守禁戒信悟因縁心目爲開見道眞形普受開度死䰟生身身得受生上聞諸天諸天之上各有生門變極不窮自然常存存者無形空洞合明謡歌之章神王靈篇辭參高眞第一天界靈威正道神王飛空之音玉巔碧嵯鳳軒八敞雲螭在樓飛仙俯仰金馬奔衝星階重重太極化生眞人遊龍正氣盤蔚回車梁光無窮赤書布金斗立召四目翁爲誅萬道魔千邪不爲凶三明烱無昏夀以浩劫終天老發紺城長劒磨太嵩精祟滅形影哀哀畏刀風我降九霄氣嚥之洞樓中施以救世悲成此脫度功第二人界靈威破邪神王之章絳章虎裳泛華十天龍刀斬邪六道侍軒印光凝海劒氣飛雷戮滅不祥正道所歸小醜其何禍試之媒我有洞章姧害元施大君惠生慶錫難老金華九色與天相保靜智合神玄元體妙蠢兹繁生䝉蔽眞道廣度天人萬善同因劫界共長上帝宏恩制魔成眞天籙紀名邪無干犯仙聖受盟元始洞空悟者幾人能悟自然泠泠玉音第三地界靈威斬鬼神王歌曰茫茫塊壘下有重山蒼崔白雲徃者不還太上哀之請度無間神風飄霞碧玉彎環出書九幽赤文乃宣制魄拘䰟斷此幽關生類何辜刑禍孱顔明明太帝正氣自然眞道正明子得昇遷捨此麈埃途庶免隂邪源我有元始章誦詠萬祖遷結滯超然散黙契歸無言度人豈終窮勤此眞王篇此三界之上飛空之中眞王歌音音參洞章誦之百遍名度南宫誦之千遍眞王保迎萬遍道備飛昇太空過度三界位登仙公有聞靈音神王敬形勑制地祇侍衛送迎㧞出地戸五苦八難七祖昇遷永離鬼官䰟度朱陵受鍊更生斬馘世不祥福慶隨日増是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及靈威神王隱祕之音皆是大梵之言非世上常辭皆斬馘不祥之要㫖六天殺鬼之司名隂類沮喪邪精消却身得長生位登仙眞故謂玄奧難可尋詳上天所寳祕於玄都紫微上宫依玄科四萬劫一傳若有至人齎金寳質心依舊格告盟十天然後而付焉道言夫斬馘不祥之道實繋大法有四謂九六運終三景虧盈聖神休否末學疾傷凡有此災不祥之重同氣皆當齊心修齋六時行香十遍轉經北極中玄天帝君洞隂天尊當勑飛雷電騎五方殺伐大神威劔神王符圖火兵素梟嚇天元帥下降斬馘災咎福德立降消諸不祥無量之文普度無窮道言末學道淺眞業未成有冥泉之鬼六天之神妄作災凶遘諸厄難身年注害福祿減削門戸不寧家庭祟害同學至人爲其行香誦經十過以解禳刑禍祓除苴穢如法中天大神七元眞氣下入身中吉祥自生永保利貞長存不滅便得神仙道言夫欲諸天降庭神兵衛身斬馘不祥者齋戒誦經可以致仙眞除咎癘也天地運終星宿錯度日月失昏四時失度隂陽不調兵革時動疫毒流行兆民夭傷師友命過皆當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受頼其福難勝故曰無量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衛右别至人剋得爲聖君金闕之臣諸天記人功過毫分無失天中神王亦保舉爾身得道者乃當洞明至言也諸天中大梵隠語無量音道君撰元始靈書斬馘不祥玉篇東方八天明箕海芒黨路徐忱珏勤合帝如輔洞眞鬱依多迂麥悋需雲拯河沙那碧淅東𩄒持定羽頥法坡波吟魯朝仙英依璉拯珂偃祕羅岑月珠素離美披元謡寳禇宏參南方八天抶陁九首攸敦遏壷皇鎭洞樊鄒阿頻蘇玄尚流函層論佑霞道悟正元麓謀仙居敬邈元岨景著眞丘圓羅季僕凝冝啓珠雲題迮粤賢梵遄涂藹原宋歸澄幾演虚西方八天直隨宛藪智嬰兹洪河究通極正斗飛雲祕鏗剛眉嵫池𩵄宗告辨丁孟嘉社元侯吉河大魁將馘冥求金度冶華紫鎭平優玄道維寂無始光休仙氣司屢酉露㳙舟北方八天黄玄載元玃虎昇乾梵景流弭符傳炎宣逵躍度命微玄力延儀丹鑒隱悟定仙謹濟順常道明妙筌軹騫縢盈府圖凝邊龍黎惡沙變歌保天洞瑞素尤芝瑜功都道言此諸天中大梵隱語無量之音舊文刻紀此都玄臺紫微南館下通酆羅九幽泉關以降道威神馘除鬼魔隂魄屍蠱之氣天眞皇人採洞清之華染丹筆以成文字皆廣長一丈以爲正音有知其音能齋而誦之者諸天皆遣護正斬邪之神天毒八威九首四目之吏導從丁史下衛其身剪伐不祥惠以福澤延命降眞書其功勤上奏諸天萬神朝禮地祇侍門大勲眞王保舉上眞道備剋得遊行三界昇入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致天眞下觀上帝遙唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響十方肅清河海靜黙山嶽吞烟萬靈振伏招集群仙天無氣穢地無祅麈冥慧洞清大量玄玄也元始無量度人上品妙經卷之五十四

front:
  text: 靈寶无量度人上品妙經卷之二十九玄九
  hash: sha256:5e3c35b88479b4fd74c9edcead3a9dae653a0108742e11a5081e3f9423151d15
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_SJB_029-010189c, image: sjb/01/010189c.png}
body:
  text: 降眞延壽品道言昔於始青天中碧落空歌大浮黎土受元始度人降眞延壽至極道品元始天尊當說是經周回十過以召十方始當詣座天眞大神上聖髙尊妙行眞人降眞延壽福德神王開化司命定生道君護人靈宰十方眞神無鞅數衆乗空而來控辰紫清凌飊碧落丹霞薦輪緑景繞轅天蓋結瑞仙葆奏香神光絳彩六氣和積虛梵空无七日七夜諸天大聖髙眞境界凝現宮殿譙闕光毫四飛法鼓仙音自然嗚響韻律清應萬穴千喁容神風飄揺日月騰照合辰雙景洞映九天星妃攀綱肆容玉帝建常攝氣萬方昭徹三界澡瑩一國地土山川林木谿澗洞海混離金色各有眞仙正容拱立冕服其下遥瞻遐眄若有待期神闕穹樓巍碧聳黛天花雨飛錦繡敷圍衆眞侍座元始天尊玄生萬寶天宫結珠翔龍之上說經一遍十方天眞應聲降駕同時稱善爲世學眞長延壽命是時一國男女皆具六通變化自然說經二遍眞念通格天皇俯降說經三遍湛海不波龍宮明現說經四遍天隕紺霜地生紫奈供養降眞說經五遍業病性魔道中法結皆得玄通神智開爽說經六遍永住道梵不縁報盡而有退墯說經七遍能運心香遍諸仙國迎降十方三境天尊延壽度人說經八遍靜觀三界萬類衆生皆是天仙髙眞應化法身立功護國降請眞靈延壽度人說經九遍見諸雲林竒妙壇靖悉有上眞降身說法延壽度人說經十遍欣樂讃禮實未曾有元始上帝躬宣法要爲此群生延壽降眞是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方降眞延壽至眞大神無鞅之衆浮空而至說經二遍南方降眞延壽至眞大神無鞅之衆浮空而至說經三遍西方降眞延壽至眞大神無鞅之衆浮空而至說經四遍北方降眞延壽至眞大神無鞅之衆浮空而至說經五遍東北降眞延壽至眞大神無鞅之衆浮空而至說經六遍東南降眞延壽至眞大神無鞅之衆浮空而至說經七遍西南降眞延壽至眞大神無鞅之衆浮空而至說經八遍西北降眞延壽至眞大神無鞅之衆浮空而至說經九遍上方降眞延壽至眞大神無鞅之衆浮空而至說經十遍下方降眞延壽至眞大神無鞅之衆浮空而至十遍周竟十方降眞延壽至眞大神一時同至一國男女傾心歸仰來者各執花旛寶衣珍果香林妙供讃詠而來奉禮元始天尊願聽降眞延壽度人上清十方天人至眞大神一國男女各自思惟天尊大慈開我冥暗顯示法要爲下方衆生宣說道要請降上眞增延夀命我等天人雖以道業進登天位而南昌上宫亦繫限數壽年雖永不過百千萬歳而未能出離三界保天長存身入無形不歷生死我今欣聞天尊首爲太上道君出度人上法降感眞靈眞靈下濟延人壽命我等位登諸天益當樂信是法依敎修行躋於聖道永不輪轉如是讃歎議說一切音聲遍十方界猶如隱雷風雨飄驟金石交音震動天地五嶽八海十二神山煙凝波湧獅子躑躅鸞鳳吟嘯龍澤霐池雲濤宛轉碧落薦瑞翠亰發光於是元始即於座起命侍眞靈妃太極玉郎燔鬱單无量壽天蘭薇千和之香鼓動法音簫𥲀吸張匏箎遞舉顧眄十方告太上道君十方天人言降眞延壽之法已居聖位竟亦爲之眞中有眞此眞主攝萬眞爲三界化主我今燔香頂禮以蘄感降眞旣降接神氣合眞眞神歸體壽命永延壽者天德之和道壽無數天壽有窮人壽無定地壽有終若能降眞眞與道通壽則無數所謂長生乆視壽曆無極萬歳唉笑億齡合歡作是語已頂禮十方心拜道元忽覩空玄之中光煇遍溢碧玉遊宫鬱藹臺殿萬聖千眞棲息其間往來雲霞驂駕龍虎遥矚鬚眉仰觀如畫明逾日輪熠燿上下金剛之氣園繞維正作二十四種殊絶異色出没顯晦金青煥麗瑩等月珠元始登引天眞大神上聖髙尊妙行眞人十方无極降眞延壽至眞大神俱入遊宮之中上下天人俯仰瞻望惟見拂拂從寶樓瑶闥中八道而入既入遊宫不知所在國人廓散地雲柔輭軟若蹈綿纊天雨衆花雜色盈尺壅輪没履香風洗空絳光流動元始即於神宮之内說經都竟衆眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度延其壽年無有中傷傾土歸依咸識道眞延壽延神延氣延靈延法延形延息延化延福延祥言無二情口無僞聲齊同慈愛異骨成親國安民豐劫劫太平經始出教一國以道預有至心降眞延壽皆得度世道言元始天尊說經中所言並是諸天降眞内名隱韻之音亦皆延壽内諱百靈之隱名也非世之常辭上聖已成眞人通玄究微能悉其章誦之十過則玉清降眞神霄命靈天帝誦之以延劫眞人誦之以延神上聖誦之以延道仙人誦之以延曆諸天遥降十華俯庭河海澄湛山嶽深凝日月合景太儀眇清群魔束形鬼精滅爽回屍起死白骨成人至學之士誦之十過則五帝駐輦三官在賔上眞接禮靈人造扃魔精竄伏鬼祅伏形濟病度死絶而得生所以爾者學士故氣已消神漸降眞召制十方延壽千齡攝御地司泉曲令丞削落玄簡過度之名延期却死道備長生輕誦此章身則被殃供養尊禮門尸興隆世世昌熾與善因縁萬災不干神明護門斯經尊妙獨歩玉亰度人无量爲降眞延壽之宗巍巍大範德難可滕道言凡誦是經十過諸天齊到司命司録延壽益筭南昌大神爲其降眞揚軒紫雲偃蓋下邁録其姓名注上生籍延壽無垠五鬼大殃注訟元辰不得干犯降眞之人而好學至經功滿德就皆得神仙飛昇金闕遊宴玉亰也上學之士修誦是經能降天眞皆即受度飛昇九宫世人受誦則感降神靈延壽長年後皆得作屍解之道神氣易形出幽入冥返閉天藏洞入無形此經微妙普度無窮一切天人莫不受慶無量之福延生保惠上天所寶不傳下世至士齎金寶効心盟天而傳輕泄漏慢殃及九祖長役鬼官降眞延壽玉童玉女各二十八人營衛神文保護受經者身道言正月長齋誦詠是經感降東方九炁青皇帝君斷絶連注鬼役呼徵身得延壽度名青皇宫七月長齋誦詠是經感降西方七炁太素帝君斷絶殃考傷害沉痾無留身得神仙刻書黃籙白簡削死上生十月長齋誦詠是經感降北方五炁玄老帝君斷絶水禁塚墓訟刑風濕邪源追考生魂爲國王帝主君臣父子延壽長年保天長存世世不絶常爲人君安鎭其方國祚太平八節之日誦詠是經感降八景髙聖太上丈人斷絶鬼厲殟毒三十六瘵野道不行五酉逃形得延壽命爲九宮眞人本命之日誦詠是經感降六甲靈妃三皇道君斷絶行年太歳大煞凶害諸神不得干犯受道者身魂神澄正萬氣長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒二十八通上聞二十八天心拜二十八過閉目靜思身坐青黄白三色雲氣之中内外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞渙室内項生圓象光映十方如此分明密呪曰无上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齋清堂修行至經无量度人願所啓上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始无量度人上品妙經元始洞玄靈寶本章降眞延壽妙微靈品十遍度人諸天隱韻離合自然混洞無形空相冥冥元氣未生孰有其眞眞者太空之中生化之主不變不易無壞無成金剛成體空得其眞眞爲司命校録萬靈眞爲天尊布敎留經眞爲寳皇福禄生民眞爲延壽爲世種情眞爲益筭布局命神如是天眞爲空中之神冥中之精道中之眞赴念隨感珠輗鳳軿首建九色身御金青駕氣乘雲萬千吏兵爲世延壽注上生名上無復祖惟道爲身能降天眞命筆日增過度九六神氣通靈無眞不光無眞不明無眞不立無眞不成無眞不度無眞不生是爲大梵眞中之眞碧虚圓羅金闕玉城上極神風重霄紫庭眞本非形若亡若存太霞玉宫中有至眞大行梵氣周回十方中有度人不死之神中有南極長生大君中有度世司馬大神中有好生韓君丈人中有南上司命司録延壽益筭度厄尊神降眞延壽无量度人今日校録諸天臨軒東方无極降眞延壽神王長生大聖无量度人南方无極降眞延壽神王長生大聖无量度人西方无極降眞延壽神王長生大聖无量度人北方无極降眞延壽神王長生大聖无量度人東北无極降眞延壽神王長生大聖无量度人東南无極降眞延壽神王長生大聖无量度人西南无極降眞延夀神王長生大聖无量度人西北无極降眞延壽神王長生大聖无量度人上方无極降眞延壽神王長生大聖无量度人下方无極降眞延壽神王長生大聖无量度人十方降眞延壽福德神王長生度世无量大神並乘景霄碧霞寶輦珠蓋彤輪驂駕神虎赤甲飛龍建九光之節八景靈旛前嘯天籥齊唱後吹仙籟同鳴辟邪斑虯悲號嘶嘶五帥啓途三界奉轅億乗萬騎浮空而來赴誠降駕延壽度生諸天丞相南昌上宮韓司主録監生大神執籙把籍齊到帝前隨所應度嚴校諸天普告三界无極神鄕司命之府延壽益筭降眞大神二十八宿北斗九元上解祖考億劫種親疾除罪殃播植生根髙眞下應開度生門元始符命時刻昇遷長生大君垂護形魂制魔保舉延壽南宮氣骨受仙道德化身生身受度劫劫長存隨劫輪轉與天齊年永度三官五嶽八嶽九幽超凌三界逍遥上清上清之天天帝玉眞無色之境梵行東方七天靈書降眞之氣起華蓋斗樞之下回行二十八宿之上在房宿二十七度左回貫四種民天下在日月之上散入諸天已次東行復位西北而止近世執法端門左右應數而下與風炁相接故通眞感格須有徵應者此也太明護眞天帝圓多羅絶梵猷靈天帝康期伯靈胡樂萃秀天帝茂純德盈紫丹明儲天帝丘無那洞霞育眞天帝赤仰師和空玄歴数天帝仲光享波僑通諸普天帝翰童離南方七天炎輿正始天帝𦔳覺正功亰維霄明天帝蒲鈐宛宗慶符濮檀天帝薄滋師蒙隨文希度天帝耀明芝修長基樂玩天帝朝斯元堂祈華布容天帝元定黄髙凌代无天帝通孫章西方七天周俞平无天帝澄占回景炎太眞天帝道无明維緑井數陳天帝除彦荒施牛羅普逝天帝時祇洞芝定梁惠宗天帝南白温冝兆靈蘇寂天帝梵初光九微洞皇天帝知極用藏北方七天帝舒光淨天帝鬼都玉蒼紫儀寂化天帝叱羅焰千至定允理天帝醮生玉完光梵救智天帝圖定九空虎懃正部天帝十華竟多伯燕無原天帝部單憂婆道冥混杳天帝末都成盧二十八天二十八帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻天中之音天中之尊天中之神天中之眞天中之靈分神降眞和合氤氲眞神髙尊降駕上清無量之奥深不可詳有知降眞延壽度人今日欣慶受度歷關諸天注簡誠通徹感幽玄飛降九眞泛景太玄三眞監舉昇入天門東斗主筭西斗記名北斗落死南斗上生中斗大魁度人降眞青帝奏書白帝破劵赤帝露文黑帝紀願黃帝開通道眞合變青天命神越玄九冥赤天火鈴斬伐魔魂白天操戟嚴陳帝敕黑天總靈萬萬神兵黃天布炁列眞齊至五天上眞萬神之尊飛行三界驅役雷霆揚旗擲火九醜奔驚降眞延壽福德安榮盡摧鬼鋒諸天齊功上天度人蕩滅北酆冥官鬼庭殺氣横空仰降髙眞五華蔚葱八海練淨六天沖融天帝按籍上𡖖典封紫皇注壽億劫齊終後役電吏前催驛龍敢有干試拒遏上眞騁煙絳房舞輪北清眞降玉符易質童嬰上偕帝友刻位丹瓊揺光熒熒碧杳萬程中列九宮協宸玉亰續益生氣靈機内營恍惚變化躬接仙眞司命秉筆帝君授經壽命無窮萬神咸聽三界五帝列言上清太光沉謐萬劫開光眇浩非迹混氣成空空無復色空無復淵空極生風風降爲澤風澤洞虚天中之天天中之神神爲天眞降氣運神天地用成三界爰立萬象容停天上天下無幽無冥無形無影無極無窮溟涬大梵遼廓無光神眞布化運度自然元始安鎭雲霞結篇九天虎篆八威龍文植化靈人格降上眞眞道流行萬範開張眞光洞流二十八天轉輪宸樞周回十方旋斗遶垣還度天端二十八舍總氣北元煇映冥合眞景通玄玄中太皇上帝髙眞泛輿景霄時來帝庭撫璈激音奏響雲營翩翩羽旗列聖來賔注命玉曆延壽度生氣具神備自然成眞眞中有神長生大君左神公子皓華尊神帝一輔皇神毋弼𡖖儼坐三宫保命生根眞氣下接壽命日增上遊上清燕息金房九曲之内細微之中下鎭人身泥丸絳宫中總道空混洞神眞九孔受靈萬氣齊仙仙道貴生无量度人出入天門俯車紞膽巾檢閱人世罪福禁戒宿命因縁普受開度鬼質生身身得受生上聞諸天諸天之上降眞有門中有空洞謡歌之章三眞靈篇辭參高眞第一玉清上眞金景明微大帝三華之音玉亰浩浩玄漠何有雲層嶪峩星隱舂臼下上其神沖和爲春跼芽自伸眞道斯陳第二上清上眞神景洞微大帝九華之章我乘八風褭褭飛龍下觀世間光青曈曨彼維何人企我神宮騁輪夜過寵福濛濛第三太清上眞玉景靈微大帝十華之歌壽定天籙我執其目降眞奏煙駐鳳流軒玉女灌香錫命億年子未知眞道去子身此三界之上飛空之中三眞歌音音參洞章誦之百遍名度南宮誦之千遍三眞保迎萬遍道備飛昇太空過度三界位登仙公有聞靈音天眞記名敕制地祇侍衞送迎拔出地戸五苦八難七祖昇遷永離鬼官眞人降堂壽窮更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翕道言此洞章並是諸天上帝及至靈眞王隱袐之音皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奥難可尋詳上天所寶祕於玄都紫微上宫依玄科四萬劫一傳若有至人齎金寶傾心依舊格告盟十天然後而付焉道言水火激射二運否終宿次星𨇠亦有虧盈至聖神人亦有遷遯未學之夫亦有疾傷凡有此災同氣皆當以此降眞延壽之法於名山靈水之間大林東流之側齋館靖堂之所建立壇塲香花禮念依教行持乞降三境髙眞十方聖衆九天兵騎捍厄除過延夀益筭大神三日五日七日夜亦如之天眞來降必先垂應當有異光白鶴天樂竒特之瑞或夢遊天闕親遇神人殊感日臻災殃退弭延壽添年長生得道或世縁重大無力營崇但皆齊心修齋六時行香十遍轉經福德立降消諸不祥無量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太隂臨過之時同學至人爲其降眞縁感未應世數終盡天賜之壽未得延益祈告殫竭威神不格者即當行香誦經十遍以度屍形如法魂神徑上南宮隨其學功計日而得更生還復故形而所延之壽併受於身眞氣來降滋澤顔嬰轉輪不惑便得神仙道言壽者天委之和原其始生即天官推策以定夀筭隂福添益陽過滅除一筭之軌凖爲三日筭於人壽一百二十過者千二百而天地日月四時隂陽皆有分畔若有災怪勃蝕爲其降眞而壽筭益延保天無窮也若有災殃兵氣干斗疫毒流行兆民夭傷師資法侣命過運終皆當祈降眞靈乞延壽命鍊度屍魂回殃轉福夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受賴其福難勝故曰无量普度世人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋燒香誦經十過皆諸天降眞萬神侍衞延壽度人尅得爲聖君金闕之臣諸天記人功過亳分無失天中仙眞亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語无量音道君撰元始降眞延壽玉文靈篇東方七天角龍浮羅晶儀辨訶帝觀下漠淵濟侔和景梵延鬱慶煙散那子騫影霞鍾猷夢安攬池煙施離箕盪戈宛巖玉眞帝錫宏魔婁都乾虚正軫玄阿赤文洞霞緑薈无峩南方七天丘峯肆機約謹遲微仙湊皇偃毗藍定基岐原天孤紫煙歷迷普九營室井鬼明夷斬戮酆酉太空眇微落元嘯然神父泉扉洞爽澤涸古鈐合持陋丙演著欽稽縁時西方七天朝謀彦期稼婁權尼法延鬼房碑眉無冝禁直南阜暉滇牛奎鑿落蔚仰輔規桓衣公由囹廡威殿皓龜紅微境兌虎標司披黨求洞基智竭名夷穹羅崿元龍晃艶救北方七天閣路治斗星張入栁馬格火涵潜靈縳醜句魁四張宦女元首玉嶽繞河曲參降酉符運赤天雷轟九浮蕩魔鉞鼎兵圖駢遊玄雲日陀月梵母𦈢都天可韓攝鄷珍連道言此諸天中降請三眞十方仙聖延壽益年大梵隱語无量之音舊文以丹金刻書辰樓天蓋之下回旋詰流支霞析煙天眞皇人仰而傳之以爲正音有知其音能齋而誦之者諸天皆遣飛天神王下觀其人不履犯道禁世殗即天眞立降五帝奉筆書其功勤延壽續命上奏諸天萬神朝禮地祇侍門大勲三官保舉上仙道備尅得遊行三界昇入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致飛天下觀上帝遥唱萬神朝禮三界侍軒群祅束首鬼精自亡眞衞遄集天駕停驂風沉煙空玉響振清大量玄玄也元始无量度人上品妙經卷之二十九

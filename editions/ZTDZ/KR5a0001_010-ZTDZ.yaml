front:
  text: 靈寳无量度人上品妙經卷之十天十
  hash: sha256:ba31036e2e742d5307120f185e180c06eed2bb6319f54636baeb0bc0f4072265
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_SJB_010-010062b, image: sjb/01/010062b.png}
body:
  text: 大赤靈文品道言昔於紫晨天中金碧飛空大明寳土受元始度人大赤靈文无量上品元始天尊當說是經周廻十過以召十方始當詣座天真大神上聖髙尊妙行真人太清真王七天列聖太極玉司左右官屬靈官童子無鞅數衆乗空而來雲駕飛軒琅輿瓊輪彤蓋垂影玉華散輝五色流眩洞耀太空五日五夜諸天道境玄英深輿神綱息輪玉標金魁一時停運天風靜籟虛象凝霄雲藏波湛乾坤洞清一國地土山川林木緬平一等無復髙下土皆明徹熠燿積翠無有異色衆真侍座元始天尊玄坐空浮五色煇明玉蓮之上說經一徧諸天大聖同時稱善是時一國男女心悟太空得道無爲說經二徧洞見法身永無漏塵說經三徧心超妙元通諸法相說經四徧神慧備足自在飛行說經五徧音辯如流敷揚至道說經六徧返照胎光定息無窮說經七徧玉闕合氣神宫流珠說經八徧騫林轉影普覆諸天說經九徧萬物發生中無夭折說經十徧天樂浮空雲營靄瑞是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一徧東方无極无量品至真大神無鞅之衆浮空而至說經二徧南方无極无量品至真大神無鞅之衆浮空而至說經三徧西方无極无量品至真大神無鞅之衆浮空而至說經四徧北方无極无量品至真大神無鞅之衆浮空而至說經五徧東北无極元量品至真大神無鞅之衆浮空而至說經六徧東南无極无量品至真大神無鞅之衆浮空而至說經七徧西南无極无量品至真大神無鞅之衆淨空而至說經八徧西北无極无量品至真大神無鞅之衆浮空而至說經九徧上方无極无量品至真大神無鞅之衆浮空而至說經十徧下方无極无量品至真大神無鞅之衆浮空而至十徧周竟十方十境无極天真大神一時同至一國男女傾心歸仰來者有如飄雲藴雨無鞅之衆各各稽首恭禮玉陛言臣所居之天在種民之上太清大赤玄空之中天中萬象應念即有息念即無莽蕩浩空光明遼廓道界之内九氣聖位超升已盡脫諸縁累一切空想不屬有無思悟永生大赤天中爲第三太空玄界景燿三華之色下安飛輪保鎮天闕恭聞天尊於此太極皇真仙境岀示靈文昭垂顯奥玄霄之中一切衆生下逮神洲无量世界同獲勝果爲无量福臣等各運道意佇聽至言上真大法於是元始懸一寳珠大如𥞫米在空玄之中去地五丈元始登引天真大神上聖髙尊妙行真人十方无極至真大神無鞅數衆俱入寳珠之中天人仰看大赤靈文徧見珠内方廣一丈八角垂芒惟見勃勃從珠口中入既入珠口不知所在國人廓散地還平正無復欹䧟元始即於寳珠之内說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸證玄空無想無念無色無聲無殺無欲無穢無垢無妄無私言無華麗口無惡聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝内名隱韻之音亦是大赤靈文九霄玉字上真之隱名也非世之常辭列聖已證真仙通玄究微佩服赤文能悉其章誦之十過諸天遥唱萬帝設禮靈文開廓十方化玄一切神靈咸歸至應真道發見群魔束形鬼精滅爽丹字開生廻屍起死白骨成人至學之士誦之十過則氣超五辰德動三界魔精喪眼鬼祅滅爽拔度垂死沉淪得升所以爾者學士初解玄空道登大赤欽味靈文體未洞真以制十方德未合上聖威可剋制百魔濟度萬微但超升而已不能洞玄輕誦此章身則被殃供養尊禮門尸興隆世世昌熾與善因縁萬災不干神明護門斯經尊妙獨歩玉京度人無量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過悟解之者道契大赤氣合太清縁想累入一切塵滯應時消盡惟一玄虚淡然微影明靜瑩徹洞觀妙體即爲真人諸天齊到億曽萬祖幽魂苦爽皆即受度上升朱宫格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛升金闕遊宴玉京也上學之士修誦是經悟道證玄登太極宫一切世縁廓然歸虚黙契此理開悟虚明永無變滅超度長生皆即受鍊飛升南宫世人受誦未入真靜漸棄有想太空之中自生真氣下浹凡體則延壽長年後皆得作尸解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶无量之福生死䝉恵上天所寳不傳下世至士齎金寳效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齋誦詠是經神風恊運薰養萬靈結累解落合真體元爲上世亡魂斷地逮役度上南宫七月長齋誦詠是經金真激雲混洞招真通靈致仙身得飛升諸天書名黄録白簡削死上生十月長齋誦詠是經紫雲鍊形飛飊左廻八景三真謁真命神嘯攝虎兵爲國王帝主君臣父子安鎮國祚保天長存世世不絶常爲人君安鎮其方民稱太平八節之日誦詠是經八景開通五宫洞清身入太無體合玄虚得爲九宮真人本命之日誦詠是經大赤靈文與兆相因千變萬化自然致真魂神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐蒼赤黄三色雲氣之中内外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室内項生圓象光映十方如此分明宻呪曰无上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傅言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋清堂修行至經无量度人願所啓上徹俓御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始无量度人上品妙經元始洞玄靈寳本章大赤靈文上品玄空无量度人太清隱韻離合自然混洞玉文冥寂玄通上皇之代神寳化生靈書度命凝泛玄空上清之下森列三宫與道合混九光丈人冥无大劫變立諸天天中聖人大赤之庭真人玉輔髙玄化仙下統九品開署天官生無夀限劫災不登莽蒼浮空下臨眇城一十二域八景髙清周歷三道變化靈文應念自彰大象開明是爲玄梵天中之天三皇洞神太極太冥浮絶玉京金華龍山帝一躡景无上元靈正元玄氣三境神穹上極无上大羅玉清眇眇劫仞若亡若存玉華廣筵大有琳房金闕瓊樓森羅燿綱太霄正氣周徧十方下鎮八維分亘中央黄老大洞三天化章總氣沖元保世亨昌中有大赤靈文之神中有南極長生之君中有保生青華之尊中有安鎮元皇大神中有好生韓君丈人中有赤元太一紫極真君中有南昌司生司化燿明玉紀玄道尊神廻骸超死无量度人今日校録諸天臨軒東方无極飛空神王長生大聖无量度人南方无極丹燿神王長生大聖无量度人西方无極白洞神王長生大聖无量度人北方无極紫霄神王長生大聖无量度人東北无極八景神王長生大聖无量度人東南无極明化神王長生大聖无量度人西南无極生道神王長生大聖无量度人西北无極氣祖神王長生大聖无量度人上方无極靈運神王長生大聖无量度人下方无極保鎮神王長生大聖无量度人十方至真大化神王飛天度世无量大神並乗碧燿瓊霄之車洞陽丹輦鳳真素蓋八景瓊輪馭九龍汗漫之駕抗朱霞飛生之輿建命仙之節十華大旙前嘯玉謡齊唱後吹泛唱同音獅子斑麟吟嘯辟邪五緯啓塗斗魁翼轅億乗萬騎浮空而來傾光回駕監真度生三天大帥元老髙尊四極真王九天上靈執籙把籍齊到帝前隨所應度嚴校諸天大赤靈文神氣流玄上化天府下極幽泉髙上推策太皇冩篇普吿三界碧落神郷星羅之府北極元綱三垣九道十二通津上解祖考億劫種親疾除罪簿落滅惡根不得拘留形合髙仙元始符命時刻升遷北都寒池部衛形魂制魔保舉度品南宫死魂受鍊仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度三塗五苦八難超凌三界逍遥上清上清之天天帝洞清無色之境梵行東方八天惠靈真極天帝侯適演均岫靈洞剛天帝巴光縁太乙思遊天帝直歷普疆皇覺慶宗天帝顯祕太茫九變玄黄天帝都京那無雲津主成天帝夢曆銖髙靈濟生天帝魯常寂兟靈震八威天帝育尚庚元南方八天朱陵契賢天帝獻悆慈薦丹宇臻微天帝韓頥洞文上德太宗天帝黙領希景皇澤龍天帝蕩會舒氲玄道通聖天帝房度炎暉育神感思天帝揚奚令傍中靈真鑒天帝秀熏瑶丹練神正天帝呼甄蘄臻西方八天瓊真嚴麗天帝祚梁十孫奏仙希福降玄天帝鐸華息因參尾元神天帝卓趾無辰大千仁靜天帝頂空真魂玄道化儀天帝師慶祠温慶陽德廣天帝肇伯元咸行慶福天帝巫羗李容髙靈宣智天帝畢童井機北方八天玄靈澄意天帝了洞微公寳驛定真天帝乙安化宜四明玉龍天帝昭章北玄承華望極天帝抱沖胡捐寳運洞神洪濟天帝越覩誥霄極啓元露沖天帝祖昌明太無瑩神天帝鐸柱演邦凝化絡雲天帝眄索部喑三十二天三十二帝諸天隱諱諸天隠名天中空洞大赤靈文諸天隱韻太極之音太㝠之尊太空之神玄氣真魔大赤之靈神氣和合變化太清无量之奥深不可詳敷落靈文普度天人今日欣慶受度歷關諸天請滅三惡斬絶地根靈文佩受名列太玄真王監舉無拘天門東斗生識西斗受命北斗分神南斗得性中斗意真五官以正青帝玉字白帝金文赤帝丹芒黑帝玄晶黄帝成意飛神召靈青文神王震氣鳴空赤文神王摧伏魔凶白文神王風火擊衝黑文神王萬滯開通黃文神王元化興隆五文神王大赤之雄變化靈文萬神之宗飛行鼔從總領仙兵麾幢鼓節遊行太空大明赫奕諸天齊功佩服靈文嚴攝北酆神王受命普掃不祥玉兕殄醜金獸四衝火兵前驅神首仗旛朱鳳流鈴煇電騰煙雲雷奮擊緑齒玃吞敢有干試拒遏靈文金鉞前戮威劔後刑屠割鬼爽風火無停千千截首萬萬戮魂魔無干犯鬼無祅精三官北酆明檢邪源不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列言上清太清大赤天靈文寳章之篇萬形主太空出入如飛龍名空太無體空無浩難窮三界萬千劫倏忽淪爲空大赤猶心象生滅茍取容心空無二門心盡亦歸空兆如念道真滅境空無通玄元始三清是爲三妙空大赤心想盡玄影尚矇朧此爲第三觀玄炁太清宫心空見無色玄影杳無蹤自然識法體靈光合神風超登元境上縹緲禹餘中朱書青箔上三元日然爲灰以東流水服之役使鬼神坐知長生神仙佩之則石神稽首所向皆遂悟其㫖則得道登真也玄氣受鍊真火洞燔九萬九氣變爲赤文六六數滿天元乃成玉樓丹闕飛觀神京昔在玄胞初龍末康眇眇億劫混沌之中上無其色下無其淵風行空内積剛爲堅堅性爲金金露流泉泉爲白水即受金淵金水凝結化地生天天上天下無幽無㝠無形無影無極無窮溟津太扑遼廓無光大赤靈文運度自然元始安鎮丹元上篇赤書玉字火鍊龍文保制劫運使天長存玄氣彌羅萬範開張元精流演三十二關輪轉無色上入泥丸周回十方履火蹈泉旋斗歷箕回度五常白雲化液玉露玄霜三十五分總氣上元八景冥合氣入玄玄玄中至靈聖母元君汎景紫虚嘯詠洞音金華合氣流運雲宮玉音化景靈燿廻風太清上化鬱秀八騫千和萬合自然成真真中有神長生大君金闕至玄無英白元華陽玉妃太乙上真九宮司命桃康合延執把靈文保命生根上遊上清出入華房八冥之内細微之中下鎮人身泥丸絳宫中理五氣混合百神十轉廻靈萬氣齊仙仙道貴生生氣度人上開八門飛天法輪罪福禁戒宿命因縁普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有空洞謡歌之章真王靈篇辭參髙真第一玄氣生大赤天飛空之音赤黑相半其名曰玄隂微陽妙復名太元浩空無染本物明白比此光空以名自攻赤黑來居玄氣乃敷玄爲隂陽邈未開圖隂盡則赤大赤是都上清之下種民之上統十二天太上之廬第三氣觀道境天衢如兆行道慾盡影餘心空未盡影跡不除於道未徹爲空所拘故號太清九仙之庭絶影去女道乃可見爾若不知真徒爲棲山林大赤有靈文詠之駕颷輪第二大赤天爲太清仙境之章神氣浩浩純陽發煙真火鍊之赤玉爲天火色未靜大赤有名火去真存寥寥太清丹瓊爲闕紫雲爲庭峩峩大赤中上連玉都京太上黃錦衣汎景流金鈴左命九龍駕右策轡神虎風雨來導前鐘鼓爲後部三界諸天魔叩首祈真度隂陽正下埃萬物由鼓舞大赤有靈文髙靈咸所慕第三靈文神化真王歌曰玄氣如破縷乗風類遊龍飄飄飛太空九陽生其中無然大赤色屈曲斜方弓結空乃成字靈文體髙沖皇人按紫筆宛與天真同符書䇿萬神度人功無窮兆能起心信佩服仰霄穹咽服召元氣玉津自流通胃池生絳煙骨節磨青銅六丁來奉巾變化幽冥宗嘯歌升太清神行本無蹤此三界之上飛空之中真王歌音音参洞章誦之百徧名度南宮誦之千徧真王保迎萬徧道備飛升太空過度三界位登仙公有聞靈音眞王敬形敕制地祇侍衛送迎拔出地戸五苦八難七祖升遷永離泉關魂度神霄受鍊更生是謂无量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝大赤靈文隱祕之音和天安地禳鎮國家佩服致真却災除殃上輔道化保民無疆皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奥難可尋詳上天所寳祕於神霄玉清玉府經室東藏道君行教應運下傳若有至人齎金寳質心依舊格告盟玉清然後而付焉道言大赤靈文三氣之宗濟度垂死無所不成夫天地運度否終日月五星虧盈至聖神人休否末學之夫疾傷凡有此災同氣皆當齊心修齋六時行香十徧轉經福德立降消諸不祥无量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太隂臨過之時同學至人爲其行香誦經十過以度屍形如法以大赤靈文丹書青素佩之或著心前魂神俓上南宮隨其學功計日而得更生輪轉不惑便得神仙道言夫天地運終星宿錯度日月失明四時失度隂陽不調國境有災鬼氣流行殟疰疫毒兆民死傷師友命過親愛終亡皆當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎮帝王下禳毒害以度兆民生死受賴其福難勝故曰无量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋行香誦經十過皆諸天記名萬神侍衛右别至人剋得爲聖君金闕之臣諸天記人功過毫分無失天中真王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語无量音道君譔元始大赤靈文中篇東方八天伊檀抱時碧泉淇昧洞關岐都偃竺䖍回燿元仙址殿凝微師建扈猶略慈卭引機卓利復究淵増條約爰邦趨頻道鍊息嶽氣綿玄黄運冥部方淨壯韓府披維履剛南方八天精童浮曦七映瓊池定獎氣馬了澄玄漪華貫遘液魄拱神棲柔瑩濯澤芒忽閟持亮豫恕游謹濟莫常歛索妙咸沖𨓜揚頥紫山太無信思功宜問仙晃朗丹明玉微西方八天靜無何爲守神完煇浩爛疊熒結化崑䋿道育精傳溢鳴時譔天醴自波玄煇光河封命錫圖隂平校魔制泉部鋒馘凶斬祅文靈敕真護帝金闕候海聽虚質誠介膺北方八天斗維携丑理言變仙實交烜赫氣豐玄泉把珞迎漠奠區隨垣命蒂九齒辨驛祠綿蟾滋合華斗氐交車韓司少元丘資始房判漫曹令角新辭盤月鄙杜宫縢明阮光道言此諸天中大梵隱語无量之音舊文刻書大赤天丹闕之上以司天地之政輔隂陽之化制命萬靈字皆廣長一丈天真皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣赤天神王下觀其身書其功勤上奏神霄萬神朝禮地祇侍門大勳真王保舉上清道備剋得遊行三界昇入金門此音無所不辟無所不禳無所不度無所不成天真自然之音也故誦之則靈文見空紫雲滿室百神侍軒萬仙朝禮佩之則上帝降䇿八景登晨服之則五藏混交玉精流傳三元歡樂寳氣凝祥體之則神遊太清身御赤氣妙合太無道超萬有分形千億坐在立亡琳琅振響十方粛清河海靜黙山嶽吞煙靈魔畏伏招集群仙虚明合玄神化自然冥慧洞清浩劫無遷也元始无量度人上品妙經卷之十

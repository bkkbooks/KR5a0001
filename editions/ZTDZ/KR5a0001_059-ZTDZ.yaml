front:
  text: 靈寳無量度人上品妙經卷之五十九宙九
  hash: sha256:50449035de52f875aaf6aa720491428fe8d30a95e57b4416d4df50de62591159
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_SJB_059-010395c, image: sjb/01/010395c.png}
body:
  text: 化屍受形品道言昔於洞光天中空化飛歌太玄育土受元始度人化屍受形無量上品元始天尊當說是經周廻十過以召十方始當詣座天眞大神上聖髙尊化屍受形妙行眞人無鞅數衆乗空而來浩氣排還䇿空扇景紫輿黄蓋絳霄瓊輪曲晨垂䕃丹精靈光衆彩騰燿蓊靄鬱勃洞煥太空三日三夜諸天星根日華珠綱月燿一時停輪和風却煙彩雲布瑞天無浮翳四氣朗清一國地土山川林木緬平一等無復髙下土作柔碧交煇紋玉無有異色衆眞侍座元始天尊玄坐空浮九氣梵光瓊臺之上說經一遍諸天大聖同時稱善是時一國男女屍穢殄殛受形變仙說經二遍雲華邏虚金容爍日說經三遍花凝仙露萬蘂呈珠說經四遍生神鍊骨屍化形完說經五遍大結開通神氣併會說經六遍名録上清靈津灌體說經七遍靈儀擲火洞照泥丸說經八遍天馬馳風易屍革故說經九遍三官命誥脫謝隂尸說經十遍神華定保生氣海澄是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品道寂大神無鞅之衆浮空而至說經二遍南方無極無量品神力大神無鞅之衆浮空而至說經三遍西方無極無量品攝精大神無鞅之衆浮空而至說經四遍北方無極無量品玄運大神無鞅之衆浮空而至說經五遍東此無極無量品尸魔大神無鞅之衆浮空而至說經六遍東南無極無量品靈儀大神無鞅之衆浮空而至說經七遍西南無極無量品胎靈大神無鞅之衆浮空而至說經八遍西北無極無量品機用大神無鞅之衆浮空而至說經九遍上方無極無量品化屍大神無鞅之衆浮空而至說經十遍下方無極無量品受形大神無鞅之衆浮空而至十遍周竟十方無極天眞大神一時同至一國男女傾心歸仰明暁大道深契神源咸言得生皆有夀紀筭歷千萬不免有期玄極威神施布大法使令一心開達根本知未生時復是何狀太空之中以何因縁忽生知覺及以見聞五行寒暑無不備識生道將去氣散神離尸穢徒在元始神智蓋養群生一感至靈化此尸朽受形更生上爲眞人必有妙藴是當敷宣如是天人其衆無量扶𢹂幼耄若賢若愚若凡若聖皆願傾聞雖彼天中尚繫愛欲所染輕微然於道妙未得虚明皆承勝化蓬靉雲集來者有如細雨宻霧無鞅之衆迮國一半土皆偏䧟非可禁止於是元始普知衆念頂出祥光其光九色照徹十方無極國土三十二天三十二帝無不明煥於此光中普現億劫衆生迷妄癡習遞相爲種展轉生滅不見道眞無量業果無量報對無量𡨚債一一瞭然如對心目元始俯觀大衆發言告曰玉清之道妙出萬天神氣回光尸滅形鍊形鍊爲氣抱神含虚隱顯自由出没無礙回觀世界細於一滴乃攝祥光所現境界摶爲寳珠大如黍米在空玄之中去地七丈元始登引天眞大神上聖髙尊化尸受形妙行眞人玄黙靈仙無鞅數衆俱入寳珠之中天人仰看惟見勃勃從珠口中入旣入珠口不知所在國人廓散地還平正無復欹䧟元始即於寳珠之内說經都竟衆眞監度以授於我當此之時喜慶難言法事精悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰化屍受形不晦不明不伐不侵不淨不穢不用不驚不戒不分化除尸質受度生形齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝化尸内名隱韻之音亦是眞王受形內諱百靈之隠名也非世之常辭上聖已成眞人通玄究微化滌尸朽受易靈形能悉其章誦之十過諸天遙感陳故改新萬帝歎嘉付形禀眞九海靜波五山吐雲日月雙景華芒運精回雌轉雄凡變爲仙群魔束形鬼魅滅爽化屍受形白骨成人至學之士誦之十過則五臓返生三尸逃奔魔精喪眼鬼祅滅爽濟度垂死絶而得生所以爾者學士穢氣未消體未洞眞以生制尸威未領天政德可伏御地祇束縳魔靈但却死而已不能降眞輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因縁萬災不干神明護門斯經尊妙獨歩玉京度人無量爲萬道之宗巍巍大範徳難可勝道言凡誦是經十過諸天齊到億曾萬祖幽䰟苦爽皆即化屍受形上昇朱宫格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經皆即受度形鍊尸滅飛昇南宫世人受誦則延夀長年後皆得作尸解之道䰟神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死䝉惠上天所寳不傳下世至士齎金寳效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齋誦詠是經太清傳靈紫皇帝君爲兆上世亡䰟斷地逮役化屍受形度上南宫七月長齋誦詠是經上清三眞太微帝君爲兆化屍受形身得神仙書名紫籙金簡削死上生十月長齋誦詠是經玉清神素飛玄帝君爲兆化屍受形得爲飛仙國王帝主君臣父子安鎭國祚保天長存世世不絶常爲人君安鎭其方民稱太平八節之日誦詠是經九天化屍受形帝君爲兆解度仙眞降庭得爲九宫眞人本命之日誦詠是經九天眞王飛駕空洞爲兆化屍澡潔䰟神受形太玄百神飲丹至命澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐碧紫白三色雲氣之中内外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室内頂生圓象光映十方如此分明宻呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始無量度人上品妙經元始洞玄靈寳本章化屍受形妙感度人百魔隱韻離合自然元氣赤上火鍊成眞元始祖劫化屍受形神去曰屍不覺不聞神附曰形動起屈伸是皆道機太上所尊無不化屍無不受形形動屍靜神運至均化屍成形精氣自生同本天地開明三景是爲天根神無相狀以道爲身五行之精神炁氤氲隨情感色因色賦形五色眞氣結爲五文五丈開廓普植神靈無文不光無文不明無文不立無文不成無文不度無文不生招靈眞符白骨成形人皇内書尸形更生鍊故反新眞得其眞化屍受形形固能存小大無常飛登太清是爲大梵天中之天鬱羅蕭臺玉山上京上極無上大羅玉清眇眇劫仞若亡若存三華離便大有妙庭金闕玉房森羅淨霐大行梵氣周廻十方中有化屍受形之神中有南極虚和變生長生大君中有易質降精受形司馬大神中有玄文化尸好生韓君丈人中有南上司命司録延壽益筭度厄尊神化尸受形無量度人今日校録諸天臨軒東方無極藴光神王長生大聖無量度人南方無極開明神王長生大聖無量度人西方無極大氣神王長生大聖無量度人北方無極子育神王長生大聖無量度人東北無極感德神王長生大聖無量度人東南無極慶生神王長生大聖無量度人西南無極母道神王長生大聖無量度人西北無極元父神王長生大聖無量度人上方無極生尸神王長生大聖無量度人下方無極回形神王長生大聖無量度人十方至眞飛天化尸受形神王長生度世無量大神並乗三素飛雲珠光洞霄靈輿翠輦羽葆驂駕白獸碧鳳麒麟建太微回黄之旗無英命靈朱旛前嘯洞章齊唱後奏內音同和玄鶴青鸞嘯歌噰噰七眞導前八靈翊後千乗萬騎浮空而來天光朗耀洞徹重昬方諸仙相南水左宫主生眞宰太陽火官執籙把籍齊到帝前隨業考校咸使升遷符告北帝太隂諸神九水佐理玄滋靈君雷電隂景豁落七元九映威劒六天大魔司録司命司察司功冥關幽府泉曲河源眞王有命普度沈骸太玄起尸黄水浴䰟流火蕩穢紫融鍊形施靈合氣仙化成人不歷胎垢澄净光明因縁輪轉與天齊年永離風刀塗炭魔試之難飛行遊宴逍遙上清上清之天天帝洞陽無色之境梵行東方八天利慶昭華天帝玉剛栖群浮輿秉衡天帝紹元子宗汩沱灔流天帝保仙冝逢少正除皇天帝辨宛通角滌聚蚿天帝毎承符公記淀蕕休天帝緑方旋容道治區玄天帝樂慈昇洞幽浚微天帝魯希伯文南方八天錫華紫眞天帝梵澤雲商廬文天帝覺蒲宛婁壯枝閱芒天帝奢維遲仝報遵陽彭天帝茂唐敖玄火藏照沙天帝極道嗣聽黄靈剡湧天帝福孳決生谷羅應仙天帝八冥杜防覩佃幼明天帝甘都求征西方八天鎭混洞香天帝伯上杲卿乾庇邈虛天帝紫雲仲枚烈命周隅天帝緬堲慷呼誾正雅極天帝益侃慈忸濯幹紇化天帝梵閔阿巴浩回奉靈天帝常招顯童夜河司靈天帝倩侍衢璫太紫輪眞天帝閔俞至晨北方八天寳聚紫陽天帝玄方九靈暴映神變天帝燎庠燕元瀆望昇持天帝雷智道開太始珍煇天帝璧明雲璲朝衛尊景天帝阿龍長妙禁霄址天帝握仙法王典教曆紀天帝億宇𡜍飛照罪解尸天帝善勝祈門三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻移氣之音復命之尊回生之神化屍大魔受形之靈九散十合變化上清無量之奥深不可詳敷落神眞普度天人今日欣慶受度歷關諸天請滅三惡斬絶尸根飛眞受形名列太玄眞王監舉無拘天門東斗主筭西斗記名北斗落死南斗上生中斗大魁化尸受形青帝召䰟白帝制魄赤帝還氣黑帝返血黄帝復命萬神持節速徵太一起尸復生形具神備調理三關神風入穴泉溢崑山玉童一呼六丁威南變化恍愡登仙隔凡神境具前黄誌金顏賜兆虎弁丹衣碧欄佩籙九霄仰視泥丸三五斗綱紫雲流煙尸化形鍊飛昇太淵坐鎭九戸嘯攝百靈青天魔王斬絶遊尸赤天魔王金印玉螭白天魔王元海素龜黑天魔王玄光老師黄天魔王絳帳紫嬰風令火勑急急化尸天尸皇君奏帝寳章地尸皇君殺鬼伏藏人尸皇君截戮死殃尸作生形緑海霞漿八萬四千華室曲房神靈畢至返一混芒骨有青霜髓如碧琅爲其化尸叱逐魔𡨚五帝大魔萬神之宗飛行鼓從總領神兵麾幢鼓節遊觀太空仗衛赫奕天録敷功化尸受形嚴攝此酆天機上相玉清神公恭受帝命普掃不祥雷雹激戾龍虎蹶張天丁驅邪大帥橐風黑雲萬里電火八衝敢有干試拒遏眞䰟金鉞前戮巨蟒吞精屠割鬼爽風火無停千千截首萬萬剪形魔無干犯鬼無祅精天中隱勑除籍勾名三官北酆明檢鬼營不得容隱金馬驛呈普告無窮萬神咸聴三界五嶽列言上清𣹟混昊曆龍漢儀康俶台莽劫號滉之中上立無色下開九淵風鼓波蕩三萬六千外堅中虚金鎖流玄玄極上下無幽無冥無形無影無極無窮若有大神虎齒龍脣六目八角乗駕風雲手托混沌狀如卵形三寸五分圓白如銀内有三界日月乾坤山海草木老父幼孫生者受形滅者化屍往來輪轉氣常運機尸化爲鬼鬼化爲人是道還返秋轉爲春帝吐玉符化尸斷死受形生眞眞無比倫太空浩氣北斗南辰合爲至無玄白不分溟涬大梵遼廓無光赤明開圖運度自然元始安鎭敷落五篇赤書玉字八威龍文保制劫運使天長存梵炁彌羅萬範開張元綱流演三十二天輪轉無色周廻十方旋斗歷箕回度五常三十五分總炁上元八景冥合炁入玄玄玄中太皇上帝髙眞泛景太霞嘯詠洞章金章明郁豁落擊摧尸鬼奔逃䰟來魄歸流響雲營虚寂聚炁律吕生神鳳舞鸞吟玉音雲熾風回雨施帝一在離群眞列位捧璧跨璫龍虎俠傍靈風聚煙青眞護肝紫虚鬱秀三官瓊堂輔翼萬仙千百相連千和萬合自然成眞眞中有神長生大君無英度籍白元執經太一稟生司命主盟桃康好生合延育形執符把籙保命固根上遊上清出入華房八冥之内細微之中下鎭人身泥丸絳宫中理五氣混合百神十轉回靈萬炁齊仙仙道貴生無量度人上開八門飛天法輪罪福禁戒宿命因縁普受開度死䰟生身身得受生上聞諸天諸天之上各有生門中有空洞謡歌之章眞王靈篇辭參髙眞第一欲界飛空化尸之音聚氣因精變形因風風通玄智造化之宗重閬九膜實由道功生而爲人巧笑雌雄仙聖鬼神往來其中慾海漫漫心波渺瀰意逐則往莫測所因生氣等秋毫結形如冰澌輔弼分斗光入兆雙目瞳見量出太虚至神一與同偕道數受増形死再童蒙數盡呼吸止委口但形容七魄擕三彭六道循無窮眞人自入妙化尸白日冲太一召百神稽首重冥空洞妙得天氣紫雲回九宫七祖生九霄保身如靈松第二色界眞王受形之章染空爲色色化爲空色化無常空即非空未形名空受形爲色形化色盡命謝歸空空亦無來形本不住形住色住空非來去以妄見空妄縁名色皆是大道何可詮擇寓空成形杳冥中精誰玄何受陽動而生空非隂陽隂陽非空認空爲道網中死禽非道非空象外飛龍能知此者受形無窮受形化尸不合不離化尸無相恍惚有象此非業道生化長養是吾道玄眞王靈篇告爾群氓非人勿傳第三無色界玉清王空洞歌曰梵炁无无玉清鬱羅下直神丘環洄海波七劫金山萬天瓊柯日月兩曜浩劫經過吹則隂生可乃陽至香風紅雨寳樓瑶址元始流精壘雪積酥遇火成液鑄彼玉京巨山崇石比兆泥丸内藴黄赤天潢奔注尾閭固塞洶洶洪濤湛有天德比兆脊節内有九眞白雲滔滔神風八回無英青巾御氣成雷玉女吹笙五音勃興七情啼笑道有至精無形無名化尸與受形仙籙書紫靈歌此空洞歌至理升無名世不悟眞道轉輪更復多去來何幾數永沈慾海河此三界之上飛空之中眞王歌音音參洞章誦之百遍名度南宮誦之千遍天眞保迎萬遍道備飛昇太空過度三界位登仙公有聞靈音魔王敬形勑制地祇侍衛送迎㧞出地戸五苦八難七祖昇遷永離考官䰟度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及玉清眞王隱祕之音皆是化易委尸受度生形成道登眞換氣回生自然大梵之言非世上常辭言無韻麗曲無華宛故謂玄奥難可尋詳上天所寳祕於神霄玉清王府東華玉堂應上帝誥命流傳若有至人齎金寳質心依舊格告盟十天然後而付焉道言夫逺道則失生離精則散氣炁寂神逝所遺肉骨齒髪形狀塊息尸居以其不能留神養炁儲精但同木石無知覺動起挺逕于是則謂之尸至聖神人將還氣招神慧生於尸歘爾而知旣受故形若返故都百神來歸遊宴金堂玉室之内若見世縁情欲所至心意所感不知其由仰視三辰俯觀萬類欣然自得得道高眞化尸受形物理皆如是已凡運度否終日星虧盈人有休否死亡疾傷凡有此災同氣皆當齊心修齋六時行香十遍轉經福德立降消諸不祥無量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太隂臨過之時同學至人爲其行香誦經十過化尸受形如法䰟神徑上南宫隨其學功計日而得更生轉輪不惑便得神仙道言夫化尸受形不但祇於人身可同等於天地迎生續氣致福請年與道無爽至若天地運終星宿錯度日月失昬四時失度隂陽不調國境有災疫毒流行兆民死傷師友命過皆當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎭帝土下禳毒害以度兆民生死受頼其福難勝故曰無量普度天人道言凡有是經能爲天地帝主兆民行是功徳有災之日發心修齎燒香誦經十過蕩滅尸穢身獲飛仙皆諸天記名萬神侍衛右别至人剋得爲聖君金闕之臣諸天記人功過毫分無失天中眞王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君撰元始靈書化尸受形玉篇東方八天潮瑜激瑛珍予交懷冠祕攸尚晞煥嶤經縁原珞珂宛翠肆陳撲乾邦都異嶧方岷蔽婁祠𣢾鬱丹儀迎便緑酆佑祈斗遥森明孺芽合淋津濤淋馥廓阿奕司茨奏雷南方八天烘炘烈光炯霞爛宿珥瑞韓司機詮隂煜力縉維南剛勑燿逐魚柄連題萬嶽官笛隷正籍契眷龍慈職勉湯句沙鐸神延繫倫極指徐邀䰟返策化受㳙煙宅輅展澤西方八天翼衛星楝鍊化莫綿軫常遄羅蹟運巴延電治肇零晶劒离田崿㽵乞池岵古登連忽息回火帝符靈玄承咸拱風竇牢瀆淵费陽宣洽動龍朗端混鎖溢負道命空觀北方八天驕舒玄佳婁突灌生交精忻蛇野鑿泛流蜃淮湧嶽流洄愬庚靈帶併火識覺轉周太虛玄漠素台冰渾執交機印造育仙謀循軌罔商日馳妙虛尸毛山斬耳魁東居道言此諸天中大梵隱語無量之音舊文靈祕琅函眞王勑太玄司命上清靈虛眞人以丹筆書之佩服化尸受生疾癘殃禍應當滅解如風揚塵世間異寃尸怪一切不祥朱書火化服之或禁勑廟社立應天書寳圖字皆廣長一丈天眞皇人昔書其文以爲正音有知其音能齋而誦之者诸天皆遣侍眞靈官下察其身書其功勤上奏諸天萬神朝禮地祇侍門大功眞王保舉洞妙德廣剋得遊行三界昇入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致飛天下觀上帝遙唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響十方肅清河海靜黙山嶽吞煙萬靈振伏招集群仙天無氛穢地無祅塵冥慧洞清大量玄玄也元始無量度人上品妙經卷之五十九

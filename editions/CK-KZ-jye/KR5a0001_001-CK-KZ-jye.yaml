body:
  text: 重刋道藏輯要元始无量度人上品妙經卷之一道言昔於始青天中碧落空歌大浮黎土受元始度人无量上品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖高尊妙行眞人無鞅數眾乘空而來飛雲丹霄綠輿瓊輪羽葢垂蔭流精玉光五色鬱勃洞煥太空七日七夜諸天日月星宿璇璣玉衡一時停輪神風靜默山海藏雲天無浮翳四氣朗清一國地土山川林木緬平一等無復高下土皆作碧玉無有異色眾眞侍座元始天尊𤣥坐空浮五色獅子之上說經一徧諸天大聖同時稱善是時一國男女聾病耳皆開聰說經二徧盲者目明說經三徧喑者能言說經四徧跛痾積逮皆能起行說經五徧久病痼疾一時復形說經六徧髮白反黑齒落更生說經七徧老者反壯少者皆强說經八徧婦人懷姙鳥獸含胎已生未生皆得生成說經九徧地藏發泄金玉露形說經十徧枯骨更生皆起成人是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一徧東方无極无量品至眞大神無鞅之眾浮空而至說經二徧南方无極无量品至眞大神無鞅之眾浮空而至說經三徧西方无極无量品至眞大神無鞅之眾浮空而至說經四徧北方无極无量品至眞大神無鞅之眾浮空而至說經五徧東北无極无量品至眞大神無鞅之眾浮空而至說經六徧東南无極无量品至眞大神無鞅之眾浮空而至說經七徧西南无極无量品至眞大神無鞅之眾浮空而至說經八徧西北无極无量品至眞大神無鞅之眾浮空而至說經九徧上方无極无量品至眞大神無鞅之眾浮空而至說經十徧下方无極无量品至眞大神無鞅之眾浮空而至十徧周竟十方无極天眞大神一時同至一國男女傾心歸仰來者有如細雨密霧無鞅之眾迮國一半土皆偏陷非可禁止於是元始懸一寶珠大如黍米在空𤣥之中去地五丈元始登引天眞大神上聖高尊妙行眞人十方无極至眞大神無鞅數眾俱入寶珠之中天人仰看唯見勃勃從珠口中入旣入珠口不知所在國人廓散地還平正無復𣣱陷元始卽於寶珠之內說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸行善心不殺不害不嫉不妬不淫不盜不貪不欲不憎不𡜍言無華綺口無惡聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有志心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是魔王內諱百靈之隱名也非世上之常辭上聖已成眞人通𤣥究微能悉其章誦之十過諸天遙唱萬帝設禮河海靜默山嶽藏雲日月停景璇璣不行羣魔束形鬼精滅爽迴屍起死白骨成人至學之士誦之十過則五帝侍衞三界稽首魔精喪眼鬼祅滅爽濟度垂死絕而得生所以爾者學士穢氣未消體未洞眞召制十方威未制天政德可伏御地祇束縛魔靈但卻死而已不能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬灾不干神明護門斯經尊妙獨步玉京度人无量爲萬道之宗巍巍大梵德難可勝道言凡誦是經十過諸天齊到億曾萬祖幽魂苦爽皆卽受度上昇朱宮格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經皆卽受度飛昇南宮世人受誦則延壽長年後皆得作尸解之道魂神暫滅不經地獄卽得返形遊行太空此經微妙普度無窮一切天人莫不受慶无量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經爲上世亡魂斷地逮役度上南宮七月長齋誦詠是經身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經爲國王帝主君臣父子安鎭國祚保天長存世世不絕常爲人君安鎭其方民稱太平八節之日誦詠是經得爲九宮眞人本命之日誦詠是經魂神澄正萬炁長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黃白三色雲炁之中內外蓊冥有青龍白虎朱雀𤣥武獅子白鶴羅列左右日月照明洞煥室內項生圓象光映十方如此分明密咒曰无上𤣥元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啟所言今日吉慶長齋清堂修行至經无量度人願所啟上徹俓御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始洞𤣥靈寶本章上品妙首十迴度人百魔隱韻離合自然混洞赤文无无上眞元始祖劫化生諸天開明三景是爲天根上无復祖唯道爲身五文開廓普殖神靈无文不光无文不明无文不立无文不成无文不度无文不生是爲大梵天中之天鬱羅蕭臺玉山上京上極无上大羅玉清渺渺劫仞若亡若存三華離便大有妙庭金闕玉房森羅淨霐大行梵炁周迴十方中有度人不死之神中有南極長生之君中有度世司馬大神中有好生韓君丈人中有南上司命司錄延壽益算度厄尊神迴骸起死无量度人今日校錄諸天臨軒東方无極飛天神王長生大聖无量度人南方无極飛天神王長生大聖无量度人西方无極飛天神王長生大聖无量度人北方无極飛天神王長生大聖无量度人東北无極飛天神王長生大聖无量度人東南无極飛天神王長生大聖无量度人西南无極飛天神王長生大聖无量度人西北无極飛天神王長生大聖无量度人上方无極飛天神王長生大聖无量度人下方无極飛天神王長生大聖无量度人十方至眞飛天神王長生度世无量大神並乘飛雲丹輿綠輦羽蓋瓊輪驂駕朱鳳五色𤣥龍建九色之節十絕靈旛前嘯九鳳齊唱後吹八鸞同鳴獅子白鶴嘯歌邕邕五老啟途羣仙翼轅億乘萬騎浮空而來傾光迴駕監眞度生諸天丞相南昌上宮韓司主錄監生大神執籙把籍齊到帝前隨所應度嚴校諸天普告三界無極神鄕泉曲之府北都羅酆三官九署十二河源上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼羣元始符命時刻昇遷北都寒池部衞形魂制魔保舉度品南宮死魂受鍊仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度三途五苦八難超淩三界逍遙上清上清之天天帝玉眞無色之境梵行東方八天太皇黃曾天帝鬱繿玉明太明玉完天帝須阿那田清明何童天帝元育齊京𤣥胎平育天帝劉度內鮮元明文舉天帝醜法輪上明七曜摩夷天帝恬懀延虛无越衡天帝正定光太極濛翳天帝曲育九昌南方八天赤明和陽天帝理禁上眞𤣥明恭華天帝空謠醜音耀明宗飄天帝重光明竺落皇笳天帝摩夷妙辯虛明堂曜天帝阿𨚧婁生觀明端靖天帝鬱密羅千𤣥明恭慶天帝龍羅菩提太煥極瑤天帝宛黎無延西方八天元載孔昇天帝開眞定光太安皇崖天帝婆婁阿貪顯定極風天帝招眞童始皇孝芒天帝薩羅婁王太皇翁重浮容天帝閔巴狂无思江由天帝明梵光上揲阮樂天帝勃勃監無極曇誓天帝飄弩穹隆北方八天皓庭霄度天帝慧覺昏淵通元洞天帝梵行觀生太文翰寵妙成天帝那育醜瑛太素秀樂禁上天帝龍羅覺長太虛无上常容天帝總監鬼神釋玉隆騰勝天帝眇眇行元龍變梵度天帝運上𤣥𤣥太極平育賈奕天帝大擇法門三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻天中之音天中之尊天中之神天中大魔天中之靈九和十合變化上清無量之奧深不可詳敷落神眞普度天人今日欣慶受度厯關諸天請滅三惡斬絕地根飛度五戸名列太𤣥魔王監舉無拘天門東斗主算西斗記名北斗落死南斗上生中斗大魁總監眾靈青帝護魂白帝侍魄赤帝養氣黑帝通血黃帝中主萬神无越青天魔王巴元醜伯赤天魔王負天擔石白天魔王反山六目黑天魔王監醜朗馥黃天魔王橫天擔力五帝大魔萬神之宗飛行鼓從總領鬼兵麾幢鼓節遊觀太空自號赫奕諸天齊功上天度人嚴攝北酆神公受命普掃不祥八威吐毒猛馬四張天丁前驅大帥仗旛擲火萬里流鈴八衝敢有干試拒遏上眞金鉞前戮巨天後刑屠割鬼爽風火無停千千截首萬萬翦形魔無干犯鬼無祅精三官北酆明檢鬼營不得容隱金馬驛程普告無窮萬神咸聽三界五帝列言上清元洞玉厯龍漢延康眇眇億劫混沌之中上無復色下無復淵風澤洞虛金剛乘天天上天下無幽無冥無形無影無極無窮溟涬大梵寥廓無光赤明開圖運度自然元始安鎭敷落五篇赤書玉字八威龍文保制劫運使天長存梵炁彌羅萬範開張元綱流演三十二天輪轉無色周回十方旋斗厯箕回度五常三十五分總炁上元八景冥合炁入𤣥𤣥𤣥中太皇上帝高眞汎景太霞嘯詠洞章金眞朗郁流響雲營玉音攝炁靈風聚烟紫虛鬱秀輔翼萬仙千和萬合自然成眞眞中有神長生大君無英公子白元尊神太一司命桃康合延執符把籙保命生根上游上清出入華房八冥之內細微之中下鎭人身泥丸絳宮中理五炁混合百神十轉回靈萬炁齊仙仙道貴生无量度人上開八門飛天法輪罪福禁戒宿命因緣普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有空洞謠歌之章魔王靈篇辭參高眞第一欲界飛空之音人道渺渺仙道莽莽鬼道樂兮當人生門仙道貴生鬼道貴終仙道常自吉鬼道常自凶高上清靈爽悲歌朗太空唯願仙道成不欲人道窮北都泉曲府中有萬鬼羣但欲遏人算斷絕人命門阿人歌洞章以攝北羅酆束送祅魔精斬馘六鬼鋒諸天炁蕩蕩我道日興隆第二色界魔王之章落落高張明炁四騫梵行諸天周迴十方无量大神皆由我身我有洞章萬徧成仙仙道貴度鬼道相連天地渺莽穢氣氛氛三界樂兮過之長存身度我界體入自然此時樂兮薄由我恩龍漢蕩蕩何能别眞我界難度故作洞文變化飛空以試爾身成敗懈退度者幾人笑爾不度故爲歌音第三無色界魔王歌曰三界之上眇眇大羅上無色根雲層峩峩唯有元始浩劫之家部制我界統乘𤣥都有過我界身入玉虛我位上王匡御眾魔空中萬變穢氣紛葩保眞者少迷惑者多仙道難固鬼道易邪人道者心諒不由他仙道貴實人道貴華爾不樂仙道三界那得過其欲轉五道我當復奈何此三界之上飛空之中魔王歌音音參洞章誦之百徧名度南宮誦之千徧魔王保迎萬徧道備飛昇太空過度三界位登仙公有聞靈音魔王敬形敕制地祇侍衞送迎拔出地戸五苦八難七祖昇遷永離鬼官魂度朱陵受鍊更生是謂无量普度无窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈魔王隱祕之音皆是大梵之言非世上常辭言無韻麗曲無華宛故謂𤣥奧難可尋詳上天所寶祕於𤣥都紫微上宮依𤣥科四萬劫一傳若有至人齎金寶質心依舊格告盟十天然後而付焉道言夫天地運度亦有否終日月五星亦有虧盈至聖神人亦有休否末學之夫亦有疾傷凡有此災同氣皆當齊心修齋六時行香十徧轉經福德立降消諸不祥无量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太陰臨過之時同學至人爲其行香誦經十過以度尸形如法魂神逕上南宮隨其學功計日而得更生轉輪不滅便得神仙道言夫天地運終亦當修齋行香誦經星宿錯度日月失昏亦當修齋行香誦經四時失度陰陽不調亦當修齋行香誦經國主有災兵革四興亦當修齋行香誦經疫毒流行兆民死傷亦當修齋行香誦經師友命過亦當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受賴其福難勝故曰无量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衞右別至人剋得爲聖君金闕之臣諸天記人功過毫分無失天中魔王亦保舉爾身得道者乃當洞明至言也東方八天廣生高映覺元洞虛應𤣥九眞化交肇圖文靈運構宗範𤣥都感變總括威昭自成綠岑遷景皇道含明天琳耀權炁晶育魂融羅負立圓英隱旻期巨神包洪綱告寗南方八天章炎通泛堅敷澄宗虛象𤣥華龍陽儛穹微正霄豔淵太凝沖元關三紐大梵飛空隱覺龍益天倫慶呈神戸纏絡眞元散精淨握冥照回合升遷導騫宴雲靈應騰天西方八天剛澤微控陰峻孤儀貫炁明素宸洞開微周化幽應澄輝帝臺平遐挹虛恢茂童池結飈臨育麗無散開陽通百六沈芒隱階幽廓冥默眞峯會靈堅丕順道告命騫林北方八天龍安洞變純陽隱𤣥方本還炁象伏高員神變惠允解鍊靈根赤精純道城號威尊利雲友常億仞中邱鬱成瓊壘謠音慶流受位玉室大憲通幽𤣥章煥落綱輪迺周東方八天亶婁阿薈無惒觀音須延明首法攬菩曇稼那阿奕忽訶流吟華都曲麗鮮菩育臻答落大梵散烟慶雲飛灑玉都明魔上門無行上首回蹠流𤣥阿陀龍羅四象吁員南方八天南閻洞浮玉眸詵詵梵形落空九靈推前澤洛菩臺綠羅大千眇莽九醜韶謠緣邅雲上九都飛生自騫那育郁馥摩羅法輪霐持無鏡攬姿運容馥朗廓奕神纓自宮西方八天刀利禪猷婆泥咎通宛藪滌色太眇之堂流羅梵萌景蔚蕭嵎易邈無寂宛首少都阿繿郁竺華莫延由九開自辯阿那品首无量扶蓋浮羅合神玉誕長桑栢空度仙北方八天玃無自育九日導乾坤母東覆形攝上𤣥陀羅育邈眇炁合雲飛天大醜總監上天沙陀劫量龍漢瑛鮮碧落浮黎空歌保珍惡奕無品洞妙自眞元梵恢漠幽寂度人道言此諸天中大梵隱語无量之音舊文字皆廣長一丈天眞皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勲魔王保舉上仙道備剋得遊行三界昇入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致飛天下觀上帝遙唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅清河海靜默山嶽吞煙萬靈振伏招集羣仙天無氛穢地無祅塵冥慧洞清大量𤣥𤣥也東方八天森甪儲雲九魂鍊晶枳默窺玦浮枚臼𨀛鹿幾陽房碧提酇回池滇黨負跂逭謁擕𧀉章變瑜蘭泮璧環亢滂野生極中昆清曜展洞涸寂無眇凝素倚虛羅皇達元靈南方八天炎鍍綽堂太霄謠隅厯遐薦漪周扃加圖披嶤蹊臄觚亶渾都戟芸荼炫井欺持蒲掌維迮儀奕洸琅璀扁屢益但幽微畢雷涓湟實東赤曜叢稽玉𤣥演侯柏渠至規西方八天鎬正左適婆泥煞靈悲招均疆洎南𨇠魁靜夷損光混元覺緣道守岑遙綿徵知宣太靈湮漠昺和盧隨哲京常華墟咸堅沙栗鐸黜株會衍球裴卓雲青府業覩般基北方八天洼孩蒙甘翠宇九蘭蕭鈎連興龍汾神關溝淪沉魔豁蠻祈通𤣥寥亢息無知肆明蟒修吉夕馥壇時畎湯長敷昌匪庸謹濟朝康堲寛祕法侈宜廣帝理生衞肇宏人天眞皇人梵炁𤣥遼天寶自然八合之音主治世會地壘洪澤變災厄難誦詠之者禳辟祅祥清淨道炁無不寗也地官奉書百靈敬畏神朱寫文服佩明驗施之於至學不宣於下俗也太極眞人頌神雲煥層虛梵羅屯碧霄元始九龍駕皇人按青軺靈光集萬眞珠景開陽寥出示靈寶篇福德由是招洞𤣥隱高嚴玉音泛雲璈无量匪得思道海生波濤法義同涓流滋植成嘉苗用以拯饑窮教興衞中朝帝尊壽億年太平滅兵刀稽首望玉宸靈華散金毫

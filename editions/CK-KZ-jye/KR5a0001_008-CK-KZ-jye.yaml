seq: 8
front:
  text: 元始无量度人上品妙經卷之八
  hash: sha256:bc13aae85e26da6b9f3a8013e99a71d7c77f71847b1a25d468bbdbfa749157ae
body:
  text: 道言昔於妙極天中靈洞霄音泰𤣥化境受元始度人淸微金科无量上品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖高尊妙行眞人淸微九聖上元天官衞法仙王無鞅數眾乘空而來玉光綠輿三素飛雲羽葆流輝𤣥虛散霞丹景浮英晃耀太空七日七夜諸天陽館陰宮金闕瓊樓羅列眞文靈風扇霄隱韻生音元綱停運雙曜高明一國地土山川林木緬平一等無復高下土皆作碧玉無有異色眾眞侍座元始天尊𤣥坐空浮九色神龍之上說經一徧諸天大聖同時稱善是時一國男女各運精誠願見𤣥妙說經二徧靈府虛明廓然開悟說經三徧神炁混合坐觀十方說經四徧了悟在心轉能化誘說經五徧未來眾生廣爲接引說經六徧證天仙業修上眞道說經七徧超出三界爲天種民說經八徧得見元尊神靈位號說經九徧注籍清微名上金科說經十徧與聖合眞永斷輪轉是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一徧東方无極无量品注生大神無鞅之眾浮空而至說經二徧南方无極无量品執憲大神無鞅之眾浮空而至說經三徧西方无極无量品定名大神無鞅之眾浮空而至說經四徧北方无極无量品司化大神無鞅之眾浮空而至說經五徧東北无極无量品簡奏大神無鞅之眾浮空而至說經六徧東南无極无量品敷教大神無鞅之眾浮空而至說經七徧西南无極无量品權變大神無鞅之眾浮空而至說經八徧西北无極无量品糾察大神無鞅之眾浮空而至說經九徧上方无極无量品監觀大神無鞅之眾浮空而至說經十徧下方无極无量品成德大神無鞅之眾浮空而至十徧周竟十方无極天眞大神一時同至一國男女傾心歸仰來者有如細雨密霧無鞅之眾迮國一半土皆偏陷非可禁止於是元始結清微𤣥妙之炁化一寶珠光如大星在空虛之中去地百丈元始登引金科生眞𤣥變高尊化炁眞人十方无極開導大神無鞅數眾俱入寶珠之中天人仰看惟見勃勃從珠口中入旣入珠口不知所在國人廓散地還平正無復欹陷元始卽於寶珠之內說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度一切羣生皆證善縁緣傾土歸仰咸契虛明妙見妙聞妙覺妙知妙有妙無妙合妙離妙變妙化言符至道心行大慈齊同𤣥悟淸正無爲國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆卽受度道言元始天尊說經中所言並是諸天化炁帝皇道君隱名聖號十方无極高眞上靈內諱𤣥章亦是九壘立極生音百魔考試之文非世之常辭上聖刻錄金科祕在淸微威禁至重鬼官不可得聞玉虛洞𤣥太極太淸四境三十九天神仙眞人能悉其章誦之十過聲振圓羅太一監臨保安天地億劫無傾五辰順道日月常明境土安寗永保太平回屍起死白骨成人太空飛仙誦之十過則五老保舉三界稽首大魔伏謁天官上功升入洞眞永侍元尊九宮地仙誦之十過元老降庭隨願濟拔大惠含生玉詔司迎上登天宮輕誦此章身則被殃供養尊禮門戶興隆世世昌熾與善因緣萬災不干百靈護身斯經尊妙獨步玉京度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到億曾萬祖幽魂苦爽皆卽受度上升朱宮格皆九年受化更生得爲貴人而好學妙經功滿德就皆得神仙飛升金闕遊宴玉京也上學之士修誦是經金科注名萬善咸臻皆卽受度飛升南宮世人受誦則靈官降身延夀長年後皆得證飛仙之道𤣥功外應神氣內充形神俱妙遊行太空此經微妙普度無窮一切天人莫不受慶生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經太丹玉童靑腰玉女各四十二人營衞神文保護受經者身道言正月長齋誦詠是經開導重泉光照九幽爲上世亡魂斷地逮役度上南宮七月長齋誦詠是經奏簡淸微名上金科身得神仙諸天書功黃籙白簡削死上生十月長齋誦詠是經三元曜明功歸帝君爲國主人王君臣父子安鎭國祚保天長存世世不絕常爲人君安鎭其方民稱太平八節之日誦詠是經天仙奉迎得爲九宮眞人本命之日誦詠是經魂神澄正萬炁合仙不經苦惱形運昇遷暉映八冥五帝臨軒萬神朝禮名書上天功滿德就飛升太𤣥道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐靑黃白三色雲氣之中內外蓊冥有靑龍白虎朱雀𤣥武獅子白鶴羅列左右日月照明洞煥室內項生圓象光映十方如此分明密咒曰无上𤣥元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋淸堂修行至經无量度人願所啓上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始洞𤣥靈寶本章清微金科上品符應度人天眞隱諱結氣自然混合𤣥文中藏至精虛皇開劫生育諸天洞光廓落三氣飛騰包含大象植立天根靑編金簡普錄神靈恢張正道赫奕冥冥雙元飛景五炁流形洞明變化羣類生成是爲沖妙萬道之宗太微陽華紫霄瓊宮上通大羅虛梵高空三眞杳漠無極無窮赤混太無玉境居尊應見十方无量化身敷教清微注籍金科中有諸天萬帝之名中有玉皇正行遊梵之帝中有山川海嶽之形中有羣魔考試之文中有三天洞眞洞𤣥洞神開天立極大憲飛輪我今宣示普召百靈三元同會諸天臨軒東方无極注生神王長生大聖无量度人南方无極執憲神王長生大聖无量度人西方无極定名神王長生大聖无量度人北方无極司化神王長生大聖无量度人東北无極簡奏神王長生大聖无量度人東南无極敷教神王長生大聖无量度人西南无極權變神王長生大聖无量度人西北无極糾察神王長生大聖无量度人上方无極監觀神王長生大聖无量度人下方无極成德神王長生大聖无量度人十方主錄金科神王飛天度世无量大神並乘騰燿瓊輿景霄華輦三素飛雲驂駕天馬斑獸燿晶蒼龍建鳳眞之節流光大旛左備九天羽衞右羅三界神兵太一帝元統制萬靈赤皇導前𤣥老監盟億乘萬騎浮空而來傾光回駕召仙集眞淸微帝氣大洞𤣥宮九華佐理混合大神總執金科列班奉迎簡閱符命仙聖隱名普告三境無極高尊太霄玉闕劫仞瓊峯紫微北府三十九君七轉七變回水儛天𤣥微結璘下統羅酆曲晨飛蓋同會東河光啓扇飊運轉天關斗極中方以正崑山開演至妙降氣𤣥丹經緯天地保鎭度人生成化育與我合仙五神淸朗億劫無傾永度諸天學道之民刻書金簡名奏紫宸紫宸之天天帝燿光無色之境梵行東方八天琅邱會元天帝澤力居英沖構集眞天帝化夕祺分霄林景暉天帝庭鬱嶽君洞宗慶先天帝領斗監明格梵飛靈天帝貫合部延大方制魔天帝肇肅志廖瓊文越章天帝濛總羅宇練洞陽天帝領都陰平南方八天定名感眞天帝洞泛景房𤣥空燿虛天帝落寶監章炎靈奉符天帝閣鄰古山玉書赤文天帝臻化定丹光啓明天帝扇揮音景運紫華天帝龍濱劫方極元洞皇天帝封正延靈皇範總生天帝員監利宣西方八天曇曜召魔天帝洞皇九雲洞寂存明叩沖天帝宣世瓊紫淸太漠洞極天帝令唱六宗玉陽妙眞天帝交舒化神迴風變合天帝道滋元流暉曜章天帝律定瑤華照元簡氣天帝梁瓊伯阿融結正綱天帝運皇極明北方八天化氣升元天帝眇利持淵八垣儛空天帝至沖猷生飛神降眞天帝微融妙𤣥太素干精天帝蔚京玉童碧華濟𤣥天帝冥敷尚登三虛極道天帝臨懷敏皇太英降房玉史天帝陳常律賔太淸正宗天帝梵行緘觀三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻天中之音天中之尊天中之神天中大魔天中之靈四𤣥七虛包含至眞金科大格結氣爲文敷化玉淸普度天人今日欣慶迴風受鍊嚴誓百神刻名文昌列告𤣥機飛度太素合景淸微眞仙考校萬化同歸東斗授符西斗司直北斗上功南斗定籍中斗合延正天無極靑帝舉仙白帝驅役赤帝攝氣黑帝典錄黃帝制魔統御化育靑元道君持握龍蹻丹光道君執法明曜少陰道君召山開導鬱微道君運斡𤣥妙中黃道君敷令布勅五方上靈至道之元飛行三界總領羣仙變化無窮遊觀萬天生成品彙執我威權上眞化民混合綿綿紫皇奉命收伏祅姦陽光激電照徹酆山淸正綱輪明啓元關六天沉魂受鍊洞陽神洲大域永保嘉祥休停惡對咸證善緣茫茫萬有皆獲長年神飛太無濯氣三華景暉被身灌鍊天河三元上佐明校百魔敢有干犯定罪懸沙普告眾靈同會圓羅升階進秩功列金科淸微金科首題三十六字餘列本科右三天道君玉號隱名告四九之數玉淸高𤣥自然之文朱書靑素佩身萬邪莫干灰服治病行之者名書金科洞元豁落升降圓方茫茫大化周厯龍康上開一氣下布陰陽包絡諸天風梵堅剛𤣥變流精太素冥冥虛明曠邈无極無形鴻濛元象三道化成八坦淸微數極自然玉京開衍金科上篇黃簡碧書八景𤣥文刻錄神名與道長存混洞騰飛布天彌綸萬景囘旋雙曜五辰統御元綱冥合靈根皇老大洞三十九章帝一分元安鎭萬方飛天妙書過度丹光丹光化生九天上靈駕景紫虛御氣𤣥音綠霞散空布彩騫林三華舞煙囘秀流雲扇霄鬱羅明耀長庚千和萬合自然成眞眞中有神元素道君方諸仙童靑華帝尊太乙合景司命迴風執簡持科錄注元功上遊玉淸劫仞瓊宮太微之內天界之中下極重淵黃闕𤣥宮囘首九壘三十六皇五鎭大域仙島十洲洞天福地无極名山八海四瀆主宰神靈三元官長无量飛仙咸鍚眞符功書帝宸列班定籍上聞三天三天之上慶會因緣中有淸微金科之章聖境仙音辭參高眞第一諸天化氣淸微之音眇眇大羅上帝氣降淸微眞光燿玉京攝御正化機茫茫厯龍康飛度敗與成三界化空無大地淪九淵元始憫羣類玉章下五山二景騰煇光元綱羅萬靈洞眞祕玉文靈寶立天根洞神主𤣥變萬品從此生諸方命天帝總校長生人剛風擎地紐天憲歸皇君生靈荷大庇億劫永無傾第二金科定籍之章鳳車舞空輪停駕鬱山阿劫仞立大空須延啓三華元聖閱章籍空中召靈魔太淸難可度輪轉如塵沙憫此去來際飛仙運謡歌蕩蕩龍漢基𤣥嶽高嵯峨萬靈會帝所東井貫天河濁境逐業緣沉淪將奈何誦此淸微篇正氣蕩邪痾三界諸天民齊奔濯燿羅願爾道果成刻名上金科永契長生理億齡焉足多第三聖境眞仙歌曰圓羅包玉虛高峙大有宮騫林覆諸天九聖步靈風宴景挹華明逍遙太无中下遊洞𤣥境控御飛天龍三十九道君朝禮虛皇尊大慈振法音聖澤常濛濛勑印啓天關敷落三景文玉詔下酆都拔度長夜魂鬼官停考對陽光燭九冥三塗息苦役八道運飛輪羣品保長年世土永安寗此三界之上飛空之中眞仙歌音音參洞章誦之百徧名度南宮誦之千徧魔王保迎萬徧道備飛昇太空過度三界位登仙公有聞眞音靈魔敬形勑制地祇侍衞送迎拔出地戸五苦八難七祖升遷永離鬼官魂度朱陵受鍊更生是謂无量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈眞王隱祕之音皆是大梵之言非世上常辭言無韻麗曲無華宛故謂𤣥奧難可尋詳上天所寶祕於𤣥都神霄玉清玉府依𤣥科三萬七千年應運下傳若有至人齎金寶質心依舊格告盟玉淸然後而付焉道言夫天地運度亦有否終日月五星亦有虧盈至聖神人亦有休否末學之夫亦有疾傷凡有此災同氣皆當齊心修齋六時行香十徧轉經三氣合神萬災普消天地清寗降氣𤣥眞金科玉律伏御鬼神无量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太陰臨過之時同學至人爲其行香誦經十過以度尸形如法不壞不傷形體堅完魂神徑上南宮隨其學功計日而得更生轉輪不滅便得神仙道言夫天地運終大劫流移星宿錯度日月失明四時失度陰陽不調國境歳飢水旱時出疫毒流行師友命過皆當修齋行香誦經存思清微金科降陽華之氣太微之神掃除災氛夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受賴其福難勝故曰无量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衞右別至人剋得爲聖君金闕之臣諸天記人功過毫分無失天中眞王亦保舉爾身得道者乃當洞明至言也東方八天飛天羅會浮化漫更居元梨久廓落司南冥陽御直局荷湄金加虛沃至遷書獨分玉極待貫貢遷正輪幾果得都清羅文雲宜令嚮淺才敵靈元波華風停氣上呼年南方八天山延洞明𤣥論康逋曜略景空斗綿揮珠山棘契錄明旋應符丹宅洞燄奎琳指琚韜眩資猗瓊府投虛何竹生育靈庭柏書宏朴義華𤣥阿宮都綠桓絳天紫霄正浮西方八天畔師霧攜建晉契輔太紫述羅逍遙薦素陽唐記方回曲才至允悟昊滿帝宜卷未耿液交蕩利咒唯戸稽門寔奔鄙廣憫度照燭離幽意篆宜慕先幾允和登豫琪鞅北方八天元簡長光鼓奚律前監索敷鄰武明義先北印極召龍帝炎煙神邈迪烏諸因思般妙𤣥六周絕馳酆丹孺常慈申誠虛府閑竇策勤佐寫祛秉研詔系始育靈題書編道言此諸天中大梵隱語无量之音舊文字刻書金闕玉樓華房之內以制和三氣安保萬靈字皆廣長一丈天眞皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳魔王保舉三𤣥道備剋得遊行三界昇入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致神王下觀上帝遙唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅淸河海靜默山嶽吞煙萬靈振伏招集羣仙天無氛穢地無祅塵冥慧洞清大量𤣥𤣥也

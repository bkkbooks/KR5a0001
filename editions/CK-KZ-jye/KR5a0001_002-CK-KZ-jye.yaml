front:
  text: 元始无量度人上品妙經卷之二
  hash: sha256:973f083278420b554851d4d746e9e8d1d97871e66d0b217f47dbb844e57bd9e2
body:
  text: 道言昔於始青天中大浮黎土受元始度人无量上品元始天尊初降清微示現珠瑞納無鞅眾天眞大神上聖高尊妙行眞人俱入珠中以无量度人靈寶上品之法眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位卽於開皇五劫之初𤣥龍昇度天關之時再降太丹流爓之天洞陽凝暉玉𤣥赤境度人萬億以玉宸大道付授於我元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖高尊妙行眞人玉宸大道元師仙君太極帝眞飛華九靈禹餘天帝紫霞丈人無鞅數眾乘空而來玉虛流煙三景煥彩碧輪寶輿羽軺絳葢神錦鳳羅𤣥明蔭几洞空合回神晶交炳九氣揚霞三房旋燿天廓地寗碧落凝眞飈靈散景迴風混合帝一監生圓羅灌氣飛動八門日珠含秀月璧泫波靈綱鬱靄徧周化境元始天尊𤣥坐空浮玉文寶臺之上說經一徧玉晨大聖同時稱善是時一國男女徹聽十方無有滯礙說經二徧周視无極徹然洞觀說經三徧語音清妙化度方來說經四徧一神應萬萬神合眞說經五徧三界種民念往卽至神行無迹說經六徧指按二儀倏忽周徧說經七徧永斷生滅億劫長存說經八徧道海呈祥𤣥山發瑞說經九徧形鍊爲氣氣鍊爲神說經十徧自然至眞玉宸證道十方三界俱獲超升是時一國是男是女莫不同心無有彼此咸得長生道言是時元始天尊說經一徧東方玉宸大道自然大神無鞅之眾浮空而至說經二徧南方玉宸大道自然大神無鞅之眾浮空而至說經三徧西方玉宸大道自然大神無鞅之眾浮空而至說經四徧北方玉宸大道自然大神無鞅之眾浮空而至說經五徧東北玉宸大道自然大神無鞅之眾浮空而至說經六徧東南玉宸大道自然大神無鞅之眾浮空而至說經七徧西南玉宸大道自然大神無鞅之眾浮空而至說經八徧西北玉宸大道自然大神無鞅之眾浮空而至說經九徧上方玉宸大道自然大神無鞅之眾浮空而至說經十徧下方玉宸大道自然大神無鞅之眾浮空而至十徧周竟十方无極天眞自然大神一時同至一國男女同心歸仰來者有如屯雲積霧不可稱計周徧一國四合浮虛非可禁止於是元始攝指飛光微如炯星暉燿九色亭立空𤣥照徹上下去土十仞洞表見裹此十方境宛同琉璃混然一色元始安座光暉普極觀此國土如鏡中像天人衣裾男女形相絲髮皎露大虛空中無有纖隔玉宸大道自然大神與諸上聖無量高尊妙行眞人十方化氣道品大神俱從一光徧攝法體十百千萬密如層縠回光返射容像互映明透分别了不雜亂其國天人來應證者仰看神光風馳雲繞萬聖咸在太虛空中觀妙寂然無體元始卽於道光之內說此玉宸大道度人之法周竟眾眞監度以授於我當此之時喜慶難言法事旣畢諸天復位頃刻之間寂無遺響是時天人遇值大範普獲昇度長生永存神凝氣專同而無分傾土歸仰以道爲心無念無爲無思無營無覺無識無滅無生無起無住無己無名言合至妙神飛紫清齊同慈愛異骨成親國安民豐欣樂太平玉宸大道无量度人欽信悟解得道成眞道言元始天尊說經中所言並是玉宸大道上帝內名隱韻之音亦是高眞玉清神王內諱百靈之隱名也非世上之常辭上聖已成眞人通𤣥究微能悉其章誦之十過萬天敬禮千帝伏聽玉京運搖海澄嶽峙三景合照七曜齊明魔魂滅種鬼爽絕嬰邪氣肅清三元廓靜槁形白骨返生還神至學之士誦之十過則五老監盟四帥下觀三官錄功八史外營魔王受事萬神禮廷濟夭度厄死而更生所以爾者學士心依玉宸氣合道眞威制六天無幽不聞勑制三界招眞致靈但知玉宸不必流丹誦詠洞文道氣入身目覩三元太上道君无極无形輕誦此經風刀考身刻名酆山𤣥老呼名供養尊禮道備德興業葉眞仙壽命億齡萬災不干神明護門斯經尊妙獨步玉京度人无量爲萬道之宗巍巍大梵德難可勝道言凡誦是經十過九帝降軿諸天遙唱億曾萬祖幽魂苦爽皆卽受度上登玉宸同與九帝上奔太霄爲帝之賓至學之士修誦是經功滿德就皆得神仙飛昇金闕成道玉宸也上學之士修誦是經皆受護度飛昇南宮炎火之陵世人受誦則延壽長年易骨變形得悟元皇大道自居眞神長存氣與道同去濁流清清爲神精氣合靈津不經地獄太陰鍊形三官衞尸太一養魂遊行虛空出入八門此經微妙普度天人已生未生皆得受度无量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄大道殃連祖考役使河源摙波鬼域受報北都侍經九老日中靈童大道玉女各三十六人扶翊眞人保護受經者身道言正月長齋誦詠是經青華帝君九光眞人爲子書名上拔祖考億世之靈上登玉宸七月長齋誦詠是經鍊氣成神神歸禹餘大道洪元鍊子神形身得仙眞記名寶書妙合天地永劫無傾十月長齋誦詠是經爲帝主人王溥天之民君臣父子育物如天好生如春福及萬方境域常寧宗緒昌衍永保長生永鎭天下康樂昇平八節之日誦詠是經九陽梵炁俱來入身純陽變體神氣永存本命之日誦詠是經玉宸降房大道休明魂魄澡潔六氣內榮不罹世患卻災辟兵六天閉邪三景挾昇萬道開通帝官奉迎刻名太微位登仙卿功滿德就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十六通上聞三十六天心拜三十六過閉目靜思身坐青紫絳三色雲氣之中內外蓊冥有青龍白虎朱雀𤣥武獅子白鶴羅列左右日月照明洞煥室內項生圓象光映十方如此分明密咒曰无上𤣥元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啟所言今日吉慶長齋清堂修行至經无量度人願所啟上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始洞𤣥靈寶本章玉宸大道十合度人𤣥眞帝書隱顯自然玉宸之眞眇眇上清若顯若晦若亡若存湛然虛寂交結紛紛其道至妙靈化所聞洞燿九元橫帶七宸左扶豁落右掖金眞紫霄流響赤光橫奔纒變其章大道生根伏於玉京蕭羅之臺下蟠淨霐雙池之源駢出二宮日月之門擲火萬丈掃蕩祅氛洞陽丹華朱烟八遙灌鍊神䆫崑崙九虛爛景噏霞玉神羅英嚥御長樓玉華散開神融骨化萬氣昭諧玉宸入𤣥道氣成身煥爛恍惚混極命仙道以生神氣以成形明以衞眞化以敷榮無往不至所作立成太微鍊精幽廓沈冥碧虛赤境大道元京上浮雲庭𤣥闕高清禹餘化氣周回十方中有豁落北台之神中有赤精九和之君中有泥丸天蓋眞人中有金闕輔皇上帝之卿中有上清三境之尊中有長生變仙之靈中有雙童流光赤文結珠自然玉宸金眞丈人太霞明堂少精綠軿圓規大有太一召仙降福度生天化綿綿今日御景萬帝臨軒東方无極自然神王玉宸大道无量度人南方无極自然神王玉宸大道无量度人西方无極自然神王玉宸大道无量度人北方无極自然神王玉宸大道无量度人東北无極自然神王玉宸大道无量度人東南无極自然神王玉宸大道无量度人西南无極自然神王玉宸大道无量度人西北无極自然神王玉宸大道无量度人上方无極自然神王玉宸大道无量度人下方无極自然神王玉宸大道无量度人十方至眞自然神王長生飛景玉宸大道无量大神並乘神光九陽之輿碧霄金根朱鸞之輦含象萬變之紱清靈洞光之蓋赤幢蔽日瑤輪碾空各駕𤣥晶神狩黑甲毒龍玃天辟非變化無窮拊須延之璈擊太霄之鼓紫烟素雲隱現萬靈天騶仗旛大帥啟程風火合發神霞散明垂祥降禧浮空自來揚音淩虛伏魔護生上清司馬高靈總眞玉宸帝司大道之神度人應仙長生大君佩籙執符齊到帝庭上極九空神蓋之宮泥丸之分三素流晶𤣥丹太寗中黃紫微上眞之靈普告三元紫戸青房烟羅雲營玉堂紫嬰伯華之神化骨之英雙童流鈴金眞玉光二景大神左轉豁落右電火鈴急催三五上清吏兵丹紋紫絡繞帀天經顧眄飛光吸納玉城下極幽泉河瀆溟泠曲折之理黑水內停玉女轉機金童絞繩上世𤣥祖考罰休停玉宸道炁速檢號名罪籍削解業道無縈不得拘留上帝嚴刑元始符命時刻昇遷積夜九都太溟弱淵一切魔爽寒露苦魂火鍊陰塞焚蕩百關凶姦滅種速制酆山玉宸大道變體生仙仙鍊身度劫劫無傾隨光引氣神池吐煙與道同生夀逾億年永度七傷八難九厄步登天門超淩三境鳳臺高軒逍遙上清上清之天天帝元眞妙空之境梵行東方九天玉宸梵遙天帝玉眞上華紀樂元須天帝大武洞尤抱素沖寂天帝鬱檀波田上化重空天帝樂化自生九光空素天帝遠扶仙朱極靜修天帝洞日芝𤣥曲照含離天帝子華琅英崇仁德修天帝赤珠咸和龍胎曜華天帝殊冥梵康南方九天粹華無鎭天帝耀殿六遊道辯沖容天帝玉羅仲神濯廣滋元天帝明豫靜通炎景燿明天帝無色嬰福應極眞天帝慮文次嵩玉苑法持天帝德夷和定名紫元天帝黃文臺父上極思眞天帝十華高聰𤣥龍隱羽天帝彰德用光西方九天大无空洞九明天帝燿日程家丹回綠鎖天帝芝元洞生覺源赤玉天帝回彥明宗素明慶奉天帝赤公伯文皇籍度生天帝長景羅境陽浩稱天帝玉神无竟芒忽變由天帝江生慕空九疇質陽天帝厯勤成蓋車青極天帝摩多容北方九天中極太素天帝理淵躬太上廣化天帝醜都九離白魂英遙天帝波帝呵都惠明招濟天帝洪棊蕩眞都照元陽天帝怙江子明亮極𤣥竺化靈天帝沖範查虛子定平无天帝沙何燿明易常究中天帝玉台丞光空百宗天帝越景王三十六天三十六帝玉宸隱諱玉宸隱名天中自然九空靈章上清隱道皇極之眞洞虛之尊太空之神玉京祕範大化之文變升之格開度之靈九晶十明明堂降生玉宸大道深不可詳豁落七眞普度天人其道至重下眞匪聞身佩五斗頭建三辰飛神景霄和合至眞今日欣慶受度厯關諸天刻名丹籍招眞命仙紫度炎光氣入太𤣥斬絕五道夙負咸原三靈共舉五帝同軒道成上清無拘天門東斗肇形西斗運精北斗育質南斗降神繞身纏絡太上千眞金玉混光擲奔火鈴中斗帝宮攝告萬靈青帝授符白帝攝兵赤帝執法黑帝典刑黃帝居中萬境保寗青天上靈玉光次明赤天上靈寶燿圓成白天上靈皓素虛明黑天上靈太乙干精黃天上靈伯常子京五方玉宸三界同賓騰天倒地電激雷奔周行十方下察杳冥神帥統制億萬神兵巡山索海旌佩紛紜變化太空神機乃分敢有干前斬伐橫吞玉宸降命驅蕩不祥蒼禽振羽長蚪列張黃神前衝赤帝持旛射火無極大殺揚鞭八景清邈十華列言皆奉玉宸自然至眞𤣥符所告钁天輔輪誅魔滅醜火令無文萬萬千千馘絕祅魂天獸吐毒電火噴雲速送三官檢捕無停有害正道追命北君玉宸大道感徹帝尊雲麾羽葆上朝玉清混劫帝厯精潜太明華芒倏變九道開生洞樓日月𤣥燿雙睛內徹泥丸赤文之庭琳條結氣奔飛火鈴左淨右霐三府澄清運用揮擊威化天京左爲金眞右爲玉光回翔八極石景中房身登太霞位列仙王玉垣上妙道所經常九丹太微絳闕瑤房洞空洞無洞陰洞陽非相非名非短非長流輝瓊室仰餌𤣥霜骨化柔金神度天梁上賓蘂淵日池龍塘太乙執綏玉女捧觴天老持符開化無疆普授要言刻書青琅解脫九幽扶飈散烟鳳厯赤書龍章隱篇密布五氣度人億千據衡揖魁功歸上𤣥大輪運斡三十六天上通神宮九帝眞軒司馬注書太史保延過度日月合宮蘊遷施政薦音大化綿綿包羅六虛陽景交纏十過九周氣合三元元中太嬪碧霄飛裙七眞御合上景靈尊𤣥中至陰紫闕大神神居𤣥丹絳臺生根雌一玉檢黃道生烟無量度人大洞青編遊體玉華攝命帝仙風爲火偶出沒無間梵謠激氣天聲舞𤣥紫雲合蔭白素回旋玉宸浮蓋校籍萬仙一合再合自然至眞流精五色太和入身身中之眞泥丸尊神輔卿弼仙三元帝君守護玉闕調養生元𤣥一老子林夫太眞白元蘂珠紫元鍊精明堂三暉玉宸度人移化就變萬氣高分太清太極冥空上靈錦衣星裾龍袍虎文攝氣保命億聖同倫茫茫至化妙立無垠上遊上清出入太微八景之內大有之機下鎭人身蒼碧丹池中合五氣服御晨暉左顧右眄七祖同飛仙貴長生生道貴眞眞神得道無量度人上開𤣥關四闢八門中有至精泥丸夫人手攀神光身流紫雲玉宸至重道非遠神神明得眞眞氣合生上清靈章列奏諸天諸天致神今子知眞三元之上各有生門中有飛神化氣之章仙王玉章辭參高眞第一下元玉宸大道碧空仙王之音雲光沖融霄風八通綠輿朝旌命駕神龍𤣥海澄碧朱旗攝魔九天齊威振蕩百邪是我泥丸靈光飛霞流煙八道蒼晶玉羅紫晨道成灌氣三華无量度人書功帝君元始符告天策紀名超離幽壤飛度朱陵帝庭蕭仞化鍊形魂第二中元玉宸大道紫洞仙王之章暉暉紫微眇莽八維化形御𤣥周矙靈圍天河灌津杓昂魁低玉璫繁明大珠小璣羣星搖光隨指帝旗安座紫宸流金四暉朱煙洞開火精飈馳中有老人絳章雲衣升我玉京下觀鬱儀佪風煽飊合景希夷日童混珠照映中規騰煇億境二氣合離道祕玉眞厥諱淵池手執長㦸腰帶瓊蕤左權右衡丹蛇𤣥龜賜我度人上清同歸第三上元玉宸大道太虛仙王歌曰吐氣成龍噓氣生風嚴我神駕蹈景飛空日月運轉交會無窮不見我神神與虛通子問大道道何形容殊不能知泥丸洞樓神蓋蔚薈正化興隆養鍊爾神鬱秀雙童流鈴擲火朱光九重周行八極天運剛淵鍊陰滅祅侍宸玉垣此道𤣥妙洪福綿綿此三界之上三元宮中玉宸仙王度人之音音參洞章誦之百徧名書上清誦之千徧三元降庭萬徧道備飛昇上清治按三元萬神禮庭有聞靈音仙王保眞勅制三界指策千靈永滅地官五司考神出入無難里社送迎九祖鍊化魂魄超升是謂玉晨道成至眞度人無量太極簡名有祕上清文諸天共所崇泄慢沈幽牢永謝太極翁道言此玉宸洞章皆諸天上帝及三元仙王隱祕之音皆是大梵之言非世之常辭其言混洞其文天成故於祕妙不可思詳上清所寶祕於𤣥都紫微上宫依𤣥科四萬劫一傳若有至人齎金寶質心依玉宸付授之格告盟九帝然後而傳焉道言二儀運行亦有終起七政九宮亦有災次至眞道士亦有隱顯末學之夫亦有疾傷凡有此災同氣皆當齊心修齋六時行香十徧轉經以玉宸大道祕重之力天回地轉神安鬼息福德立降消諸不祥玉宸洞文普度無窮道言夫末學道淺或仙品未充或知行玉宸未悉道要不悟自然以心爲託墮於有數運應滅度身經太陰臨過之時同學至人爲其行香誦經十過以度屍形如法則神宮縝密泥丸堅固流鈴內煥玉宸涵光屍鍊魄滅魂神上升隨其學功計日而得更生陽火入身還其朽形靈肉布體忽然更生轉輪不惑位登高仙道言辰申數極劫窮運否亦當修齋行香誦經黃赤改度勃蝕淩犯亦當修齋行香誦經時令勝鬱支干不和亦當修齋行香誦經國境水旱兵戈四興亦當修齋行香誦經疫癘流行鬼神害傷亦當修齋行香誦經師友命過亦當修齋行香誦經夫齋戒誦經功德甚重上消天災下消人禍保延帝王億載之夀安寗國家以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能爲天地帝主兆民行是功德告禮玉宸元皇至眞有願之日發心修齋燒香誦經十過皆上清記名萬神侍衞右別至人得爲聖君長生大帝玉府之臣諸天注其道功表著玉宸疏功錄過不失毫分三元仙王亦保舉爾身得道者乃當洞明至言也東方八天梵无眇虛玉會婁京玉明帝剛華逹宛須明落智閴昧孤成圖柏大除極涓罔茂禺翳勤煩宛提定𤣥謨卓景浩澄玉目高蘇圭華驅邪辯流瓊胡文殿正利猛鄙員都月津凝煇光神洞珠南方八天京嶎嵳會紫律夷余注極爛炎招來牛堅猛火極回素道懷然古眞元沖氣淵龍崇剛嚴鵲益駕聿乘容乾知挺格冥治呼𤣥玉羅京孱都開度軒九命沙摩緣鏟緣連升行周度秦廣交纏西方八天斗胃亢泰紫流衍盧擎河赤蹊轉止聞于無極耿爓厯塊扶羅天旌皓精眇神煥都帝厯卯室眞丙西徂懋覺月印池澄求浮道希采利正質滋延憑逋溟海淵力徒虛鑒凈極越四洞蘭儲北方八天稼元索靈聽孤自幾遲齒日紀丘華綸維火炎飈舉馳兆圓時命籍綠荆秀符偃稽陀諸號育慶舒景扉一式玉垣依衍弼希箕侍句尾臻童黨持彥度清靈雲銜紫移風禁寂傳太𤣥竟奇道言此上清天中玉宸大道君之隱文玉帝所祕无量之音舊文書太空華蓋紫微垣上境綠字蟠屈廣長一丈天眞皇人昔書其文以正天音有知其音能齋而誦之者上清諸天皆遣三元仙王玉宸萬眞下鑒子身書其功勤上奏諸天四司凜節九宮拜迎心未通悟但誦其文仙王保任飛昇玉京遊宴洞陽高奔紫庭此音玉宸大道之章無所不感無所不明無所不鎭無所不營三元用之無所不神天眞上帝自然至眞之音也故誦之則八素合景神光映形泥丸之中森列萬神𤣥眞大君告子以妙道也日誦此經耳聰目明髮毀更生自然契𤣥金眞玉光徧繞爾身神宮振暢萬氣歸眞千聖降霞道海明清无極開濟大量𤣥𤣥也

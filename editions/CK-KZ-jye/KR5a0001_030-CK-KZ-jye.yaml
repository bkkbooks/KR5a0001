seq: 30
body:
  text: 通上聞三十六天心拜三十六過閉目靜思身坐紅黃紫三色雲氣之中內外蓊冥有青龍白虎朱雀𤣥武獅子白鶴羅列左右日月映照光燿洞空洞煥天地項生圓象遍滿十方如此分明密呪曰无上𤣥元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啟所言今日吉慶長齋清室修行至經无量度人願所啟上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始大洞徊風混合本章上品妙首萬變度人千眞隱韻離合自然太極玉文洞神上眞元始祖劫開化諸天翕闢陰陽是生萬彙自然大道上無色界下無色根虛無渺漠惟道爲身五文開廓普植神靈無文不顯無文不靈無文不動無文不明無文不化無文不成是爲上清玉晨之天九霄梵氣蘂笈靈臺金闕玉京上極無上大羅聖境虛无寥廓若隱若存七景華房九變龍庭昌明玉閤紫微天霐純陽梵氣遍徹十方中有南極長生大君中有玉清消魔神王中有扶桑青華帝君中有好生韓君丈人中有南宮度人解厄定命天尊中有南極宮中慈仁通化眞君回骸起死无量度人今日校錄諸天臨軒東方无極青華神王長生大聖无量度人南方无極赤靈神王長生大聖无量度人西方无極素景神王長生大聖无量度人北方无極𤣥妙神王長生大聖无量度人東北无極保命神王長生大聖无量度人東南无極集慶神王長生大聖无量度人西南无極寶輪神王長生大聖无量度人西北无極梵氣神王長生大聖无量度人上方无極橫天神王長生大聖无量度人下方无極鎭壘神王長生大聖无量度人十方至眞威德神王長生度世无量大神並乘飛天六龍雲輿九華寶輦翠蓋雕輪毛節朱幢驂駕鸞鳳跨馭金龍建降魔辟非五方靈節持除禍賜福四神靈旛前嘯靈璈汎景後吹簫瑟齊鳴獅子白鶴嘯唳嗈嗈太乙侍從眞王翊軒億仙萬眾從空而來迎衞寶駕恭慶靈音統法持文諸天靈魔上相主宰天眞神王南昌上宮韓司主錄監生大神執籙把籍齊到帝前隨所應度嚴校諸天普告三界無極眞王神霄玉府扶桑華宮三清九霄億兆天界百萬仙國上解祖考億世萬劫惡籍罪簿消滅惡根不得拘留道合仙眞元始符命普率九埏南靈火光度越靈魄北府眞符解脫幽魂神王保舉超生南宮死魂受鍊仙化成人生身受度劫劫長存隨劫輪轉與天齊年鍊屍聚氣保護胎仙內境汎光定息收𤣥永斷死戸纒鍊幽關超凌三界逍遙上清上清之天天帝玉眞神霄之境梵行東方九天重華文朝天帝照汎叨景六晨汎景天帝定𤣥燿明至眞極瑶天帝浮羅永延上靈元化天帝大元辰幷曲鼎號都天帝勝金生光瓊瑛汎景天帝有提辯論七晨扶明天帝苑育飛衡推虛動神天帝昔齊浮黎樂化自宥天帝冕更容曦南方九天晃朗赤梵天帝元競錦霓惠正煇奉天帝擁愛加吟妙音飄颻天帝號施幸綿華離正定天帝呼立機成宣景六虛天帝整婆阿貪化形度敬天帝勃負孜眞龍希幾遍天帝從扶鄉輕陽廓曠晞天帝緬移神機錦文絢赫天帝景束梵寗西方九天皓渺舒蕩天帝握林俯極倐颺始平天帝影浮金華落塵普盛天帝執翁施零蘂庭皇威天帝粵拂思誠元舉星瓊天帝顯加膺象龍政委恩天帝運嘉𤣥康快樂敷變天帝欲化無根逍遙請福天帝豁落行夷旻景扇飇天帝動鬱蒼題北方九天𤣥明證赤天帝石育俯昌遠揚綠霄天帝浮纏方渶元漠誓訓天帝順通兮凝臨蒞物成天帝目羅景輪政理分化天帝範擲俱重誘黎汞勝天帝拱越林夷馥明大普天帝嚴度丹霞續區廣蒙天帝棟零延祺玉元淵淨天帝景大羅長三十六天三十六帝諸天隱祕萬天隱名天中玉文大梵靈章三天密諱天中神音天帝高尊天眞神王上相大魔靈文玉音回風混合鍊屍飛昇無量之奧深不可詳守雌抱雄是爲神眞普度天人今日欣慶受度厯關諸天請滅三惡斬絕地根飛度死戸名列眞仙魔王監舉無拘天門東斗監生西斗除殃北斗輔靈南斗化魂中斗成眞總監眾靈青帝育生白帝守神赤帝升氣黑帝流光黃帝靜中萬神佑身青天魔王辟穢受形赤天魔王內寶神眞白天魔王卻邪輔正黑天魔王監持護法黃天魔王守衞萬靈五帝大魔萬神之宗飛行一身總貫泥丸藏氣元精澄神安鎭坐觀太空自號赤符諸天上功元始度人皆稟生宫神嬰受化普掃胎根斷除血穢閉塞死門流精反聚倶入妙庭天魔接引上升玉都屏除瘴癘鬼毒祅精天丁前驅大帥仗旛擲火萬里流鈴八衝敢有干試拒遏上眞金鉞前戮巨天後刑屠割鬼爽風火無停千千截首萬萬翦形魔無干犯鬼無祅精七魄𡩋謐三屍速奔外營百關內保萬神白虎守芝青龍纏液普告無窮萬神咸聽三界五帝列言上清玉晨寶厯會𤣥神章龍漢開刧降自華房混沌九變斷滅邪亡戸戸卽開上無道境下無道基生死之道𤣥牝之門惟神與氣散聚無停內觀元神反本方成回風死道復入生門還巡泥丸遍厯精門三十九戸戸戸可死閉之即生生從何戸戸戸卽開閉之不出可以長生名戸卽穴實穴卽精神氣交會龍虎固根血凝神聚不散乃成散之無窮不可名成氣壯滿溢通徹泥丸流布丹田升降反嬰有出有入有死有生不出不入斷戸除根斷除之道以火鍊精安鎭其戸胞凝血根陽施陰化流響扇營上應天關下集百神實乃丹精閉卽神英七星分散飛行陰房二儀攝氣流迹陽光分之旣停陰陽交幷以赤入黑變黃成紫精華流暢血穢殄平上納下奔死道未降赤霞遼遶瓊漿混迎上和下合自然成眞胎根旣存道成正生根斷乃仙名列南宮父母胎孕化體成形散之卽氣聚之有名聚散爲根斷之長存與道合眞天機祕密洞徹萬靈三天龍篆元始玉文赤書玉字錦符朱囊洞妙汎景保劫運延梵氣彌羅萬範開張元綱流演三十六天輪轉無色周回十方璇景厯機回度五常三十九氣總禦一身八方冥合氣勝乃生𤣥中妙理斷絕胎根死戸週密得道成仙汎景太霞嘯詠洞章金眞朗郁流響雲營玉音攝氣靈風聚煙紫虛鬱秀輔翼萬仙歸正合符鍊之見眞眞中有神長生大君消魔神王紫微元君無英公子高𤣥眞人執符把籙保命生根上遊上清出入液房明梁之內神化之中下鎭人身絕塞死根結胎五氣混合百神七世回靈萬眞靈煇神風飈粲仙道貴生无量度人上開生門飛天法輪日月植根安固黃庭宿命因緣普受開度仙化生眞身得受生上聞諸天諸天之上貴此仙門中有大洞消魔之章玉清靈篇道御高眞第一高上神霄玉清王靈祕之音元始浩劫玉清靈文迷塗悟解洞徹眞空天仙所愼祕久不通斷絕死戸直入生門三屍殄滅五斗束魂血化成精反此神嬰七祖受庇百神咸寗出有入無安鎭黃庭上保泥丸中理𤣥津下流丹田百關息封內體充溢我道乃成第二太上消魔玉清王隱韻之音天之大隱寶明梁塞下戸愼之祕元都結胎卻生死守雌抱眞一是爲長生路斷絕生死根持握九命門仙庭回九變神聚反嬰童上無億劫祖惟道化爾身顒顒三境文過之卽神邱披雲散紫煙離合由景輪禁戒非可言流光聚泥丸正氣召萬神滅屍七孔陰神華燿日英三素飄雲營回風扶晨景眞源六虛靈太微轉日月度魂飛玉京混沌生太漠故曰𤣥歌音第三扶桑青華帝君歌曰萬象化體百神歸根物備乃靈惟形與身大道之本是爲𤣥精內觀卽見外境隱停守此上道保生長存默誦萬過混合天成血穢斷除消滅惡根仰徹仙位超度南宮迷悟不解永沉鬼倫天籍祕語丹華杳冥南和握節北極守靈金氣入三界玉髓通九門帝一混合眞無顯亦無明此三界之上玉文之中眞王歌音音參洞章誦之百徧名度南宮誦之千徧斷絕死門萬徧道備飛升太空過度三界位登仙公有聞神音千眞祐形敕制地祇侍衞送迎拔出地戸五苦八難七祖升天受事九宮魂度朱陵鍊屍更生是謂无量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈神王玉淸眞王隱祕之音皆是大梵之言非世上常辭言無韻麗曲無華宛故謂𤣥奧難可尋詳上天所寶祕於神霄玉清王府東璧經室華堂依𤣥科六萬劫一傳若有至人齎金寶質心依舊格告盟三天然後而付焉道言夫天地運度亦有否終日月五星亦有虧盈至聖神人亦有休否末學之夫亦有疾傷凡有此災同氣皆當以已鍊形受化濟度十過轉經移神駐氣復得更生无量之文普度無窮道言夫末學道淺或仙品未充死戸未閉胎根尚存運應滅度身經太陰臨過之時同學至人爲其開神敷經攝氣傳道以度屍形如法魂神徑上南宮隨其學功計日而得更生輪轉不惑便得神仙道言夫天地運終亦當修齋行香誦經星宿錯度日月失昏亦當修齋行香誦經四時失度陰陽不調亦當修齋行香誦經國主有災兵革四興亦當修齋行香誦經疫毒流行兆民死傷亦當修齋行香誦經同學命過亦當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能爲天地帝主兆民行是功德斷絕生死超凌仙宮有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衞右別至人尅得爲聖君金闕之臣諸天記人功過毫分無失天中魔王亦保舉爾身得道者乃當洞明至言也東方九天華明會奇燿魔赫奕𤣥精散妙絳英綠飛禮俯呼嘉汎屏境宜馥郁洞杳回禦泛輕靈標煥麗蕩蔚薈陵納污成灑慶集霄零尚佳那育冒曲萬京叨回景鬱伐緬沉煙翼紀角纒六度虛𤣥南方九天嚴俱慕因光捍香披赫火吞霞梵氣九疑攝機汎陶龍遍赤旗枝離亢鬱林峯內希慶眇雲羅玉附化屍停升霽表揆徹永延澤遠紅輪覆明持圓廓靄敬連繡落明機定察幷房大液浮黎西方九天定希交粹宛陵咎基靡恪凡潤幸施綠離指益繁影靄雅同遲空蕩巘訥干施惠文托落標由尋蘇延施潰綠首辯力轉回眞迎照童苴倚母幾瑛皓仰塗府彼億眞庭究本知源翼生浮靈北方九天坤符握節炳煥太霄摛兌侵氐擇邈𤣥標都浮偏漠冰蓊虛林旣魄見素齊叱封吟渠因劫弈晏勳加明綱演覆壁闡發煇停執符煥麗賂神保寗氣氤紫秀顯微徹升通神妙空徑曉成人道言此諸天中大梵隱語无量之音琅書玉文皆龍文丹篆寶篋玉函祕於東華堂金縷寶花瓊瑤浮光萬象神藏之中神霄玉清眞王扶桑青華帝君皆知其音以傳其文能齋而誦之者諸天皆遣飛天神王持經神吏下觀其身書其功勤上奏諸天萬神朝禮地祇侍門玉清消魔神王保舉上仙道備尅得超度玉京升入金門此音無所不通無所不降無所不度無所不成天眞自然之音也故誦之致飛天下觀上帝遙唱萬神朝禮三界侍軒五帝侍迎鬼精自亡琳琅振響十方肅清河海靜默山嶽吞煙萬靈振伏招集群仙天無氛穢地無祅塵冥慧洞清大量𤣥𤣥也角集六音釋脆俗脃字音毳小耎易齗也蒻音弱草名幷餅平聲合也跽音技長跪也𩃬古文陰字罙音彌旼音珉和也珏音覺骼音格禽獸骨也喁魚容切音顒柰音𡞏果名𥲀音巢樂器紞音耽褭音嫋

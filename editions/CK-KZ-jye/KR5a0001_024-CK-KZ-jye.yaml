front:
  text: 元始无量度人上品妙經卷之二十四
  hash: sha256:2a5cc34c7aaf4399958c3eddf888f8e1e14b130e82feb5809bc9dbeb0f1b9cca
body:
  text: 道言昔於太素天中皓景霄虛凌空曜土受元始度人神變氣化无量上品元始天尊當說是經周囘十過以召十方始當詣座天眞大神上聖高尊妙行眞人無鞅數眾乘空而來碧虛扇霞鳳輿瓊輪綠蓋華軿流彩降霄八景交輝洞煥太空三日三夜諸天玉籙寶光上照𤣥都宮闕森羅元綱臺觀朗然徹見刼仭巍峩飛輪煥赫一國地土山川林木緬平一等無復高下土皆作瑞玉無有異色眾眞侍座元始天尊𤣥坐空浮神化萬炁寶闕之上說經一遍諸天大聖同時稱善是時一國男女知道變化悉由神炁乃至天城紫殿碧閣黃房萬聖千眞皆是神變法身氣化眞境說經二遍金龍吐雲寶臺千柱說經三遍宸霞散縷結空成字說經四遍大音輕震甘露敷和說經五遍地發寶蓮萬葉凝光說經六遍玉京金闕神輝洞虛說經七遍萬神混一出有入無說經八遍神氣變微秋毫同體說經九遍地獄消滅死魂受生說經十遍神變氣化洞入太冥是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方无極无量品始陽大神無鞅之眾浮空而至說經二遍南方无極无量品炎輝大神无鞅之眾浮空而至說經三遍西方无極无量品少陰大神无鞅之眾浮空而至說經四遍北方无極无量品太一大神无鞅之眾浮空而至說經五遍東北无極无量品保鎭大神无鞅之眾浮空而至說經六遍東南无極无量品通生大神无鞅之眾浮空而至說經七遍西南无極无量品沖厚大神无鞅之眾浮空而至說經八遍西北无極无量品運關大神无鞅之眾浮空而至說經九遍上方无極无量品主變大神无鞅之眾浮空而至說經十遍下方无極无量品持化大神无鞅之眾浮空而至十遍周竟十方无極變化大神一時同至一國男女傾心歸仰雖未聞法各悟三界十方諸天高眞乃至宮殿臺觀未有一名不從神變氣化而有今覩天尊眞王宣眞演道聖容煒煥光徹諸天无量世界一一國中各有天尊眞王宣演大法故知神變無窮氣化無極我等今身色相根塵動轉音影皆是神變氣化所成來者億量無鞅之眾迮國一半土皆偏陷非可禁止於是元始示現神氣變化之道從𤣥坐起踴身虛空高齊刼仭在飛雲浮景之上去地千丈元始登引天眞大神上聖高尊妙行眞人十方无極變化大神无鞅數眾俱入浮景之中天人仰看惟見勃勃從虛空中入旣入空內不知所在國人廓散地還平正無復欹陷元始卽於飛雲浮景之上說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸滅有心極妙極𤣥極洞極眞極化極用極變極通極神極靈心悟至道合體虛明齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝神變氣化內名隱韻之音亦是眞王內諱變化百靈之隱名也非世之常辭上聖已成眞人神氣通𤣥能悉其章誦之十過諸天遥唱神氣合應變化倐忽河海山嶽俄爾亡存日月璇璣周流隱顯神之所變萬聖齊臨則羣魔束形鬼精滅爽氣之所化則囘屍起死白骨成人至學之士誦之十過則神變五帝氣化三界魔精喪眼鬼祅滅爽濟度垂死絕而得生所以爾者學士穢氣未消體未洞眞召制十方威未制天政德可伏御地祇束縛魔靈但卻死而已不能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人无量爲萬道之宗巍巍大梵德難可勝道言凡誦是經十過諸天齊到神感氣會變化自然不同起心作諸幻妄神氣混合無道不生億曾萬祖幽魂苦爽皆卽受度上昇朱宮格皆九年受化更生得爲貴人而好學至經功滿神變德就氣化皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經神氣鍊化皆卽受度飛昇南宮世人受誦神不去身眞氣內營則延壽長年後皆得作屍解之道魂神暫滅不經地獄卽得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經神變發生氣化敷榮內景煥彩玉雲結城爲上世亡魂斷地逮役度上南宮七月長齋誦詠是經神變道體內景明潔神嬰正位身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經神變深密氣化安寗內景齊仙遊宴玉華爲國王帝主安鎭國祚保天長存世世不絕常爲人君安鎭其方民稱太平八節之日誦詠是經神變順常氣化循經內景調衍金池玉霐得爲九宮眞人本命之日誦詠是經神變九宮氣化九眞混一自然與帝同盟魂神澄正萬氣長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上淸道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐靑紫白三色雲氣之中內外蓊冥有靑龍白虎朱雀𤣥武獅子白鶴羅列左右日月照明洞煥室內項生圓象光映十方次思太空之中洞眞神氣如紫光雲冉冉來覆兆首雲氣彌室內有萬神森然如視目中瞳子對兆面前次思兆九竅氣出如白烟烟雲右旋纒繞兆身象罔之中紫雲白烟亘遍天地良久覺見己身肝中有碧玉宮殿中有神人衣靑龍華羽之服口中吹氣成風吹此雲氣左囘約九九數周乃見空中所存來者萬神與兆身中百神合爲一身狀如嬰兒繡衣錦裳對兆面坐聽兆誦經訖還入兆口中上泥丸中晝面向外夜面向內此爲神變氣化之道如此分明密咒曰无上𤣥元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啟所言今日吉慶長齋淸堂修行至經无量度人願所啟上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始洞𤣥靈寶本章神變氣化上品囘混度人百魔隱韻離合自然洞空無形神氣爲眞神非恍惚氣非氤氲是道妙本於空爲神太空爲氣神生萬神氣生萬氣萬神歸一萬氣合一一萬之變神爲道機氣爲道樞機變樞化三界乃生元始祖神變生萬眞元始祖氣化生諸天開明三景是爲天根上無復祖惟道爲身神變赤書氣化玉文五文開廓普植神靈無文不光無文不明無文不立無文不成無文不度無文不生是爲大梵天中之天變化生成鬱羅蕭臺玉山上京上極无上大羅玉淸眇眇刼仭若亡若存三華離便大有妙庭金闕玉房森羅淨霐神霄梵炁周囘十方中有神變氣化之神中有南極長生大帝君中有度世司馬大神中有好生韓君丈人中有南上司命司錄延壽益算度厄尊神囘骸起死无量度人今日校錄諸天臨軒東方无極飛天超𤣥神王長生大聖无量度人南方无極飛天升炎神王長生大聖无量度人西方无極飛天易皓神王長生大聖无量度人北方无極飛天生神神王長生大聖无量度人東北无極飛天司變神王長生大聖无量度人東南无極飛天主化神王長生大聖无量度人西南无極飛天遷氣神王長生大聖无量度人西北无極飛天換質神王長生大聖无量度人上方无極飛天至有神王長生大聖无量度人下方无極飛天妙無神王長生大聖无量度人十方至眞飛天神王長生度世无量大神並乘玉虹萬寶之輿結綠千眞遊𤣥之車泛蓋旋羽驂駕丹鳳九色眞龍建召神攝氣變化之節三元囘命保生靈旛前詠洞文齊唱後吹部曲同音獅子白鶴嘯歌嗈嗈五老啟途羣仙翼轅億乘萬騎浮空而來傾光囘駕變化度人諸天丞相南昌上宮韓司主錄監生大神神變天司明令四張氣化神人據位持兵執籙把籍齊到帝前百億變化神氣自然官府在左刑罰著邊隨所應度嚴校諸天普告三界无極神鄉泉曲之府北都羅酆三官九府十二河源上解祖考億刼種親疾除罪簿落滅惡根不得拘留逼合鬼羣元始符命時刻昇𤣥北都寒池部衞形魂制魔保舉度品南宮死魂受鍊仙化成人神氣無窮變化無終無極神鄉變化所從神氣合空無所無容十方皆變一神混同十方皆化一氣普通變化生身生身受度刼刼長存隨刼輪轉與天齊年保度三塗五苦八難超凌三界逍遥上淸上淸之天天帝洞輪無色之境梵行東方八天神變九眞天帝梵靈虛泉角應震生天帝京繿婁虛曲眞啟元天帝混奇迎隆厯陳蒼華天帝明耀芒動緣仁宥天帝閣龍景盈嶽判紀靈天帝述蘭棲翠闕寶輝天帝飛英預嘉綠粹秀和天帝離如祕公南方八天薰微炎照天帝嗇運通陽光混虛天帝寶主輔元南玉化闕天帝部俞慶言耀景丹靈天帝祖簡尊猷朱明景平天帝伯舉沖幾安變澤神天帝曜華奉靈龍變慶元天帝廓都良赤氣定初天帝平披昌西方八天雲極素靈天帝正寶仙明正化觀行天帝時保基常帝靜順康天帝滋殊聿光竺珞道封天帝崇昇眞墟皛明虎寶天帝象日囘景思度逸沖天帝祝郭友太瑤葆存天帝道鑒沖升感羽浩名天帝極那輪北方八天紫度靜明天帝忱伯次恭句魂除邪天帝尾房忌侯正察高𤣥儀眞天帝島基錄開𤣥符虛轄天帝密觀赴靈德芳曜圓露神天帝超𤣥濟昏鍾陽溟混天帝曾微子都治化政安天帝寂浩素覺智冥洞空九常天帝本光希先三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻天中之音天中之尊天中之神天中大魔天中之靈神和氣合變化上淸无量之奧深不可詳敷落神眞普度天人今日欣慶受度厯關諸天神變萬眞請滅三惡氣化百靈斬絕地根飛度五戸名列太𤣥眞王監舉無拘天門東斗運機西斗司氣北斗𤣥樞南斗生神中斗混合總監眾靈神變五帝下領天人靑帝施仁白帝明義赤帝司禮黑帝生智黃帝主信萬神無越靑神魔王拘魂定華赤神魔王守神立慧白神魔王定魄蕩穢黑神魔王溺邪安正黃神魔王總監萬氣五神眞魔萬靈之宗飛行鼓從氣化神兵麾幢持節遊觀太空神變赫奕諸天齊功上天度人嚴攝北酆神王受命普掃不祥收神攝氣變化飛仙金精吐毒天馬四張神兵前驅流煙八衝敢有干試拒遏上眞金鉞前戮巨天後刑屠割鬼爽風火無停千千截首萬萬翦形魔無干犯鬼無祅精三官北酆明檢鬼營不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列言上淸天元洞極生化無窮眇眇億刼混沌之中上無復神下無復氣風澤洞虛虛極變𤣥𤣥生爲神神薄氣眞氣爲神子神爲氣母神氣合一萬變可取萬變萬化金剛乘天剛風爲氣風動爲神動生知識梵氣爲身神變氣化三界自成陽神爲天陰氣爲泉無極無色泉極無淵神氣冥冥地藏爲天天上天下無幽無冥無形無影無極無窮神降氣升流精鬱寥溟涬大梵遼廓無光赤明開圖運度自然元始安鎭敷落五篇赤書玉字八威龍文保制刼運神氣長存梵氣彌羅萬範開張元綱流演三十二天輪轉無色周囘十方神氣普運四達皇皇旋斗厯箕囘度五常三十五分總氣上元八景冥合氣入𤣥𤣥𤣥中太皇上帝高眞亦從神氣變化生成泛景太霞嘯詠洞章金眞朗郁流響雲營玉音攝氣靈風聚烟紫虛鬱秀神氣囘旋變化陰陽輔翼萬仙千和萬合自然成眞眞中有神神中有氣附景纒光返復氣神南極帝宮長生大君無英公子白元尊神太一司命桃康合延執符把籙保命生根上遊上淸出入華房八景之內細微之中下鎭人身泥丸絳宮中理五氣混合百神十轉囘靈萬氣齊仙仙道貴生无量度人上開八門飛化神氣往來無窮轉此法輪罪福禁戒宿命因緣普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有空洞謠歌之章眞王靈篇辭參高眞第一道𤣥神變飛空之音無形無名獨立太空合混萬神變化莫窮萬物咸賴神運圓通生天生地把握洪濛廓散無邊視之無蹤泛然自應名曰至神三界仙眞諸天雲宮神變周流皆由道身此道幽祕得之乃眞歌此沖妙𤣥中之天中有造化浩刼至神冥會樞運斡旋皇極萬炁長存保之勿息第二道𤣥氣化眞王之章空爲眞氣眞氣如空我其辨之與道皆同物得之生捨之則窮能生者何曰氣與神一切諸天神仙聖人乃至六道諸凶鬼神天地宮府呼吸屈伸是皆氣化無逃此輪如神守氣千刼無傾三界俱壞我獨長存九天停運神升太微攜盻玉京巔映日金華西願參空洞歌駕龍耕瓊芝第三神變氣化眞王歌曰俯軾東桑仰觀逮臺下有長樓刼海崔嵬億萬里兮超遙鑒開嗟此大道境攝之方寸規神變而氣化妙有相徘徊控轡玉龍駕奔雲太淸下無鞅繡衣人非若世幻假神變氣化成千刼忘衰薾笑爾榖仙輩區區辨靑黃垂白無所成咎道爲不祥自昧神氣元不知道有方歌此太上篇翛然禮眞王此三界之上飛空之中眞王歌音音參洞章誦之百遍名度南宮誦之千遍眞王保迎萬遍道備飛升太空過度三界位登仙公有聞靈音眞王敬形勅制地祇侍衞送迎拔出地戸五苦八難七祖升遷永離地官魂度朱陵受鍊更生是謂无量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈眞王隱祕之音神變氣化杳然難名皆是大梵之言非世上常辭言無韻麗曲無華宛故謂𤣥奧難可尋詳上天所寶祕於神霄玉淸王府東藏經室運應壬辰大法當傳若有至人齎金寶質心依舊格告盟玉府然後而付焉道言夫神有不變氣有不化則爲天地運度否終日月五星虧盈至聖神人休否末學之夫疾傷凡有此災同氣皆當齊心修齋六時行香十遍轉經福德立降消諸不祥无量之文普度无窮道言夫末學道淺或仙品未充運應滅度身經太陰臨過之時同學至人爲其行香誦經十過使神變爲仙氣化爲眞以度屍形如法魂神徑上南宮隨其學功計日而得更生轉輪不惑便得神仙道言夫神變氣化神氣能變化於物非神氣自變化也神氣剛大不可變化變而化之神氣使之非變化神氣也神氣不和則不能變化與物爲災故曰天地運終星宿錯度日月失明四時失度陰陽不調水旱兵災疫毒流行兆民死傷師友命過皆當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受賴其福難勝故曰无量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋燒香誦經十過神氣變化轉爲福祥諸天記名萬神侍衞右別至人尅得爲眞王玉府之臣左華記人功過毫分無失玉淸眞王亦保舉爾身得道者乃當洞明至言也東方八天明麤室寅宛奏滌澮阿留梵萌提覺辭外演羅丘微對境平施加那握温毗德佑機洞洛次禰原襄資連陳岡閼夏厯數惟年當著逸濳蒙祺益兼亟馳賓陀氣不汝偏南方八天秀旨峙滿偏登球敦炎井投枚八道耿英邈野駢路崔慈梁賓太極𤣥素尤難檢欹莽司馳微表師覽兌康達鈐宜碧圓漪外趣仙恭塗旦昌昭隨正華玉纂道戸祕持西方八天參諱投綿蔚羅大千妙乙丙族乾定婁弦舒騫魔堂逸變坤𤣥文定柳齊上剛思元圖靈祕寂部丹凝宣略要紀呈令商自全邈奎狼都竟邊普傳浪馬永儲希天怙專北方八天龍芤燕宮洞庭𧊚沖閣靜化極列賓慈洪乘聖逾棘召倫愷攻大藏敻莫厯泉己穹道度冥瓘力丁霞容冀翼房穴軫迹幾雄瑞廣靈約莊地萬鋒純澤固賢鄙開策空道言此諸天中大梵隱語无量之音舊文刻書蕭臺天樞玉衡之上神變氣化以正萬天无極世界三元眞皇莫不由其道知而鍊之神氣永留大刼成壞小刼生死皆爲之解顏傲視之也字皆廣長一丈天眞皇人昔書其文以爲正音有知其音能齋而誦之者神府皆遣飛仙天人下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳眞王保舉神霄道備尅得遊行三界昇入金門此音无所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致飛仙下觀上帝遙唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅淸河海靜默山嶽吞煙萬靈振伏招集羣仙天無氛穢地無祅塵冥慧洞淸大量𤣥𤣥也

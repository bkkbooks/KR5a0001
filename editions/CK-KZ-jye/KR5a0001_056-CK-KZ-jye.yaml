front:
  text: 重刊道藏輯要元始無量度人上品妙經卷之五十六
  hash: sha256:9893d64562c50493c69481250b84156de2379e5372c479b6eb9d2e728f20267c
body:
  text: 道言昔於紫暉𤣥濟天中綠景虛明大慈靈土受元始度人濟度死魂無量上品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖高尊北酆大帝九幽拔罪天尊金闕濟度天尊太一救苦天尊大慈大悲救苦眞人大惠眞人無鞅數眾乘空而來碧燿流煇華雲映彩龍軿鳳駕寶蓋靈旛彌漫羅列香藹氛氲日月停景洞朗太无九日九夜諸天瓊樓玉闕雲殿霞房一時同明下極崑崗三山十洲四海九河泉曲之阿酆都寒庭長夜之關悉被神光普獲開煥萬象澄淸十天昭廓一國地土山川林木緬平一等無復高下地成紺碧無有異色眾眞侍座元始天尊𤣥坐空浮瓊光洞陽寶牀之上說經一遍諸天大聖同時稱善是時天地山嶽鐵城大獄自然齊啓咸釋罪爽來聽法音說經二遍鑊湯聲震忽變淸涼水吐靑蓮異氣芬馥萬刃刀山悉爲寶樹杻械銷鎔骨骸生復還得成人俱承道蔭說經三遍仙聖讚揚靈瑞咸臻說經四遍一切人民悟解法要說經五遍昆蟲善慧省識罪原說經六遍虎狼毒蝮滅斷惡根說經七遍𡨚和解釋異骨成親說經八遍鬼道塞絕永保生津說經九遍幽沈滯魄鍊化昇遷說經十遍道德純一俱登妙眞是時一國有情有識冥不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品考較濟度大神無鞅之眾浮空而至說經二遍南方無極無量品司察濟度大神無鞅之眾浮空而至說經三遍西方無極無量品司禁濟度大神無鞅之眾浮空而至說經四遍北方無極無量品司化濟度大神無鞅之眾浮空而至說經五遍東北無極無量品典獄濟度大神無鞅之眾浮空而至說經六遍東南無極無量品九幽濟度大神無鞅之眾浮空而至說經七遍西南無極無量品泉曲濟度大神無鞅之眾浮空而至說經八遍西北無極無量品羅酆濟度大神無鞅之眾浮空而至說經九遍上方無極無量品超生濟度大神無鞅之眾浮空而至說經十遍下方無極無量品昇化濟度大神無鞅之眾浮空而至十遍周竟十方無極天眞濟度大神一時同至一國男女傾心歸仰來者萬億並駕同驅靈光散彩華霧彌空八部六天三官九署威光召致異趣苦魂無鞅之眾迮國一半土皆偏䧟非可禁止於是元始洞觀遐邇哀念眾生手執寶翇翇出妙光光及十方一切聽法天仙聖眾自見身相有如瑠璃內映濯羅鬼神魂爽各於其類中得圓滿心體淸淨業火消除仙花時飛大震瓊音宣明法要爾等眾生造諸罪惡累彼死魂飄蕩無依散入諸趣備經輪轉莫測道緣今以九陽神霄大梵之氣化十二靈文濟度死魂超昇天境始從亡歿以鍊屍形屍神守骸滯爽超昇仙聖合德還自成人出離三塗往度八難大眾欣躍仰俟恩光於是元始引眄惻然鑪炷寶香上結密雲化爲玉闕去地九丈內垂天虹熒煌五色接待大眾俱入其中元始申命拔罪天尊羅酆帝宰救苦眞人無鞅數眾同升化闕蘂華紫玉靈妙之臺天人仰看惟見勃勃影現萬殊旣入玉闕不知所在國人廓散地還平正無復欹䧟元始卽於紫臺之上說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂無遺響是時天人遇值經法普得濟度全其道眞無有沈淪傾土歸仰咸行善心不愆不犯不忿不爭不迷不忘不愛不著不擾不驚言必眞正口無惡聲齊恩慈愛道化合并存亡安泰度樂生榮經始出教幽顯協德預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是眞王內諱百靈濟度之隱名也非世之常辭上聖已成眞人通𤣥究微能悉其章誦之十過諸天遙唱萬帝設禮沈逝死魂證升仙品緣愛積習皆獲蛻捨羣魔敬衞蕩化鬼精至學之士誦之十過則四司釋訟九獄除𡨚回屍起死白骨返形普受濟度以得生成所以爾者學士誦詠寶章招眞召靈妙氣來臻道生神德故可下濟死亡卽獲超度而已莫不昇遷輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人無量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到酆都六洞鬼帝官君寒庭泉曲幽夜之河泰山地壘主宰神靈簡奏上功超拔罪魂億曾萬祖幽沈苦爽皆卽受度上昇朱宮格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經皆卽受度飛昇南宮世人受誦開度九𤣥出離地獄生福天堂延慶後昆永無身殃此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役陰官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經濟度死魂解釋天官罪考之愆五方大殺屍劫之鬼威毒咸息開貸死魂獲度南宮逍遙自然七月長齋誦詠是經濟度死魂解釋地官罪考之愆五嶽四司北都羅酆曠野山澤社令城隍應關囚對禍害滅連黑簿削除白簡上生十月長齋誦詠是經濟度死魂解釋水官罪考之愆北海河侯河伯溟泠四瀆主宰當令幽苦摙汲冥魂役難散除度越生門八節之日誦詠是經濟度死魂解釋罪考八方大獄八洞鬼牢悉承道化永變福庭迷識開悟咸登妙津得生世間智用高明務勤上學克致成眞三元之日誦詠是經濟度死魂各遂其情鍊度南宮返生受靈魂神澄正萬氣長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上淸道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐靑黃白三色雲氣之中內外蓊冥有靑龍白虎朱雀𤣥武獅子白鶴羅列左右日月照明洞煥室內項生圓象光映十方如此分明宻咒曰無上𤣥元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啟所言今日吉慶長齋淸堂修行至經無量度人願所啟上徹徑御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始洞𤣥靈寶本章濟度死魂十迴度人元皇上錄鍊度自然九宮妙範靑華帝靈至神開運合會𤣥關制命造化長養生根上布𤣥功無所不周五氣承德結絡形軀萬神羅列帝一居尊二十四宮八景佪環混洞天闢辟非藏烟明梁開道塞絕死門斬伐胞樹超度億曾解釋罪考朱陵鍊魂太一定命南昌衞形無量濟度長生大君破滅罪府司馬大神超拔滯爽韓君丈人司命司錄除削𡨚愆拔罪天尊度厄尊神迴骸起死無量度人今日校錄萬聖臨軒東方無極保命神王長生大聖無量度人南方無極保化神王長生大聖無量度人西方無極散禍神王長生大聖無量度人北方無極度厄神王長生大聖無量度人東北無極救苦神王長生大聖無量度人東南無極衞生神王長生大聖無量度人西南無極拔罪神王長生大聖無量度人西北無極度魂神王長生大聖無量度人上方無極超化神王長生大聖無量度人下方無極自在神王長生大聖無量度人十方至眞濟度死魂神王長生度世無量大神並乘八色祥雲九華翠輦龍鳳驂駕羽蓋騰軒建度魂定命之節召神靈旛前嘯玉童齊唱後吹簫籟同鳴獅子白鶴嘯歌噰噰四明啓途神官翼轅億乘萬騎浮空而來傾光迴駕監魂度生南昌丞相天機上宰韓司主錄監生大神執籙把籍齊到帝前隨所應度嚴校諸天普告三界無極神鄉泉曲之府北都羅酆三官九府十二河源上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼羣元始符命時刻昇遷北都寒池部衞形魂制魔保舉度品南宮死魂受鍊仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度三塗五苦八難超淩三界逍遙上淸上淸之天天帝洞眞無色之境梵行東方八天濟魂逸慶天帝扈迪狂曜澤證𤣥天帝梵聿斯平流剛昇陽天帝振祖流光梵氣舉神天帝尸眞化魂蕭臺校錄天帝拔苦尊祖猷徽緒天帝道𤣥巨英麗慈變生天帝敷承庸光道用超神天帝伯常妙沖南方八天紫暉洞明天帝覺善自伸玉宸慈化天帝退坂靑輿正宗𤣥露天帝定意須光初嬰育靈天帝判載司强佐無肇宗天帝嚇陳元防鵲史利眞天帝侯進斗光冥超生魂天帝妙智仙祖靈增變天帝勞提丙顓西方八天蠙棣益司天帝常容眞果成超衢天帝儀慈壽均瑛觀紫虛天帝韓承詡言溢靈慶彰天帝蹈方滋苹朱霞淇至天帝海暾總陽黨峻悅疆天帝孟勤禮冥度生昇魂天帝招雲鍊𤣥魁符考嶽天帝覺上生北方八天玉頤淨覩天帝柳昴順𤣥機牛亢化天帝耀洞觀周育乾次甯天帝顯道離田昭本神華天帝絶憇斯仁𤣥龍史墟天帝太完子賢仙斗迎祺天帝昭迪用寥朝瑞玉幘天帝伯緒遠康庸濟魂天帝常元隱公三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻開度之音開度之尊鍊化之神天中大魔玉淸之靈混合變化而成上眞無量之奥深不可詳敷落神篇濟度窮魂今日欣慶受度厯關諸天請滅三惡斬絶地根飛度五陰名昇太淸眞王監舉無拘天門東斗受性西斗結形北斗保命南斗超昇中斗大魁總御生成靑帝通眞白帝衞靈赤帝運化黑帝結神黃帝養育萬善咸臻九竅四體悉獲生全靑天魔王巴元醜伯赤天魔王負天擔石白天魔王反山六目黑天魔王監醜朗馥黃天魔王橫天擔力五帝大魔萬神之宗飛行鼓從總統神兵麾幢震節八道揚威遊觀天地開度死魂自號赫奕功用無窮啓運生津嚴攝北酆靈眞受命普掃不祥神龍吐毒驎騎騰驤天吏持麾蕩化不祥擲火萬里流鈴八衝敢有干試拒遏上眞金鉞前戮巨戈後刑制令鬼爽咸得昇遷𡨚愆和會盡獲釋形魔無干犯鬼無祅精三官北酆明檢鬼營不得容隱金馬驛程普告無窮萬神咸聽三界五帝列言上淸洞虛妙化海嶽河源中有冥關幽閉罪魂冥冥眇眇億劫長昏上無天光下無所安風刀亂施哀聲塞空惟有元皇太一之尊普施慈惠神力自然拔除罪苦敷落靈篇赤書玉字無上眞文超度魂爽使入生門梵氣彌羅萬形開張元綱流演三十二天輪轉無色周迴十方普被𤣥恩皆得升遷八景和合氣入高𤣥𤣥中太皇上帝高眞泛景太霄嘯詠洞章金眞明郁流響雲營玉音攝氣靈風聚魂紫虛鬱秀輔翼萬仙千和萬合自然成眞眞中有神長生大君無英公子白元尊神鍊化生死拔兆屍形太一司命攝氣還神桃康合延三一帝尊執符把籙保命生根上遊上淸出入華房八冥之內細微之中下鎭人身泥丸絳宮中理五氣混合百神十轉回靈萬氣齊仙仙道貴生無量度人上開八門飛天法輪罪福禁戒宿命因緣普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有空洞謠歌之章眞王靈篇辭參高眞第一度魂欲界飛空之音人道易墮塵心苦神神勞散逝杳杳沈魂魂爽何所覺忽爾離軀形形化爲劫灰魂魄歸無因默默有舊憶索索忘其親舉目無三光栖栖誰所鄰鬼官肆酷毒鞭撻常無停隊仵如驅羊渺渺沒冥津鐵獄常燒然惡烟起繽紛積骸若邱山涕泗如河傾經劫罪業纏死魂悲酸辛神霄玉淸王出書度天人元始靈寶符超化能生神第二昇𤣥色界眞王之章絳闕南昌景燿煇煌萬神之家生化之門中有長生大帝紫君碧羽龍衣飛靑紫裙手執黃籙靈寶上篇校功玉軒昇度死魂魂氣受鍊結植靈根神眞運度隨陽化升昇𤣥契妙水激火焚炎炎流池玉虹萬鱗跨池爲橋金光橫奔無上七元九幽罪魂銜領符命超昇化輪乘雲馭風與天相傾第三變化示體無色界眞王歌曰三天上境元皇妙宮迴超三界鬱鬱靈光中有大神號曰眞王設化開度萬道之宗元始上帝錫命靈篇普告下司罪苦昇遷破蕩冥暗普現光明滅除禍害永植福根生死受度仰承𤣥恩冥曹解散慶會長亨威化所被敢有不從玉符保鍊晏眄劫年上無色景與道同𤣥碧空圓羅億劫自然此三界之上飛空之中眞王歌音音參洞章誦之百遍名度南宮誦之千遍魔王保迎萬遍道備飛昇太空過度三界位登仙公有聞靈音魔王敬形勅制地祇侍衞送迎拔出地戸五苦八難七祖昇遷永離鬼官魂度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及神霄眞王隱祕之音鍊度死魂超登上遷天壽九劫罪愆𡨚仇俱䝉和釋理極奥妙皆是大梵之言非世上常辭言無韻麗曲無華宛故謂𤣥奧難可尋詳上天所寶祕於神府靑琳寶藏依𤣥科應運下傳若有至人齎信效盟質心依舊格告盟三天然後而付焉道言夫天地育形至道生神形爲靈宅神爲元靈神風鼓鍊天與其生生迷道本纏著罪緣疑網癡獄貪念爲愆境物亂心思慮攻神精喪氣謝形軀敗昏五臟內腐七情外奔神宅喪壞神去離形沈淪幽苦爲業所牽善者生天惡䧟酆泉死魂所賴至道宣慈靈文濟度眞符捧持冥官拜首眞吏咸依大梵之宗元眞是栖同氣皆當齊心修齋六時行香十遍轉經福德立降魂升天堂無量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太陰臨過之時同學至人爲其行香誦經十過以度屍形如法魂神徑上南宮隨其學功計日而得更生轉輪不惑便得神仙道言夫至學之士修誦上淸三洞寶文專持戒籙幽栖山澤淸虛忘世或積德行陰功及物父母師長去世之日欲濟度死魂使超登洞臺列名仙階者當以五香鍊湯沐浴屍魂以靑繒朱書元始靈文一十二符布著𤣥宮之內一形上下謂以臥符枕上符面上符兩手符兩足履中符安心前符槨四面符凡十二道焚香北向書訖安時咒曰道民王甲生奉仙眞運終鍊化形歸太陰上帝神符赤書玉文濟度死魂速付玉眞飛昇天堂刻簡仙名骨成蘭玉面有金英太一守屍三官衞靈忽然輕舉上登太淸土下大殺屍鬼百精敢干神符亂甲神明天丁把斧斬汝五形山澤水火風氣至眞護完甲屍返生還魂北帝驚咤落甲死名飛雲玉輿朝謁紫庭急急如律令行符訖更當修齋行香誦經夫齋戒誦經功德甚重魂爽飛化享福生形下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能爲王公侯伯兆民行是功德濟度之日發心修齋燒香誦經十過皆諸天記名萬神侍衞右別至人尅得爲聖君金闕之臣諸天記人功過毫分無失天中眞王亦保舉爾身得道者乃當洞明至言也東方八天英曜斗極領帝都關運推息數水火流根生道禀𤣥聽天自然解掖蛻謝魂禧雙羅圓體用神曲阿明伸惒眞普玉慶雲門臻梵遷靈易魂度八極素華應厯符行昴畢南方八天鍊眸玉庭籍檢女侯勘𧷤有爽度昇昌都機保怍塵赴謨皇猷辜原升府名曹奏智璽選宰童魔化悉旣𤣥應大察冥拘寒池爍流瓊傳變合谷養救釋靈幹柏庸被經西方八天蹄陽隔樗卷烈飛野黥截鬼筵由庭軒庚符傳龍殿悔昔平涓生合神廬兆互成人穴液聚纏果溶圍身略靖司化巡祇輔眞陷錮兵旄井席相均演由欽觀滔輪鼓軿北方八天棄蚓乞魚勿頻懶蘇詔逸靜王慈并比圖虐古韓鎖婁移舌昧罶詛委奪默元衙沄綽辨鄙齊淵古靈回猖无慶育勅珞資俞强奎翳斗龍呼吳求左將魁酉變生遊嘉道言此諸天中大梵隱語無量之音舊文書𤣥天北靈玉闕之上以正北山酆泉鬼獄禁制九都大鬼濟度死魂生化福鄉神智逍遙字皆廣長一丈天眞皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣察錄神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳眞王保舉洞𤣥道備尅得遊行三界昇入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致神王下觀上帝遙唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅淸河海靜默山嶽吞烟萬靈振伏招集群仙天無氛穢地無祅塵冥慧洞淸大量𤣥𤣥也

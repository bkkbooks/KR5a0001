front:
  text: 元始洞𤣥靈寶本章扶桑青陽九華上品化炁度人元晶隱韻正運自然東極青眞𤣥關化神九芒琅碧洞照陽門太无上劫化生八靈青宮肇立扶桑億尋虯龍交逥蛟螭委蟠青陽之精升爲歳星開明蒼景是化天根下爲青華方諸玉宮上無復祖與道同生玉垣眞炁析爲寶文安鎭東方𤣥變純仁挹采華芒結節洞明隱芝自生玉髓金筋蒼符開廓普殖神文無文不敷無文不通無文不建無文不崇無文不化無文不隆是爲至妙天中之宮瓊寶玉羅龍嶽剛峯上極无上圓燿高穹渺渺化城安鎭太空青華離便神變九龍金闕黃房森羅淨霐神霄道炁周徧天京中有度人不死之神中有方諸青童道君中有南極長生之君中有東極青華帝君中有挹霞採光度世司馬大神中有好生韓君丈人中有南上司命司錄延壽益筭度厄尊神逥骸起死无量度人今日校錄諸天臨軒東方无極飛天青符神王長生大聖无量度人南方无極飛天青炁神王長生大聖无量度人西方无極飛天青𤓁神王長生大聖无量度人北方无極飛天青精神王長生大聖无量度人東北无極飛天青虛神王長生大聖无量度人東南无極飛天青陽神王長生大聖无量度人西南无極飛天青運神王長生大聖无量度人西北无極飛天青帝神王長生大聖无量度人上方无極飛天青景神王長生大聖无量度人下方无極飛天青芽神王長生大聖无量度人十方至眞飛天神王長生度世无量大神竝乘飛光青軺之車蒼珠碧琅之輦綠葢𤣥輪驂駕丹鳳九首青龍建流霞之節廣生靈旛前按洞章齊奏後唱玉謠同音白鳳麒麟嘯歌噰噰青靈啟塗歲燿翼轅億乘萬騎浮空而來傾光囘駕監眞度生東極丞相暘谷神宮帝司𤣥一九炁大神導降青精光照八冥碧霞散飛三五順行骨生金輝逥燿瓊英青皇受書列位仙眞校定羣品區別眾靈執籙把籍齊到𤣥庭隨所應度嚴校清都普告十極杳漠高虛洞淵化府北闕靈居閬風崑丘瑤臺帝墟下逮寒池長夜幽扃拔度祖考削落惡根不得拘留剋獲超升青宮符命飛度無停神嶽鬱羅開衞形魂大魔監察度品朱陵死魂鍊炁變朽成人生身受度劫劫長存隨劫輪轉與天齊年永度三災八難九橫五苦超淩三界逍遙九清九清之天天帝保安無色之境梵行東方八天修方正華天帝天季宜庭青芒順綱天帝憫化神覺繹眞洞暎天帝善徂越文隆緒景師天帝遙符玉渦辨常起位天帝閧閑資仁厯濟桓輿天帝護諱難木極粹生天帝工機顯房廣風至化天帝孟麟九中南方八天慶炎崇古天帝信師拜凡綠眞應羅天帝賁寗禱𤣥宗理高明天帝𤣥攸叙嘉日旗招炁天帝太一紫庭液華澤根天帝雲蒲綠英常經衞和天帝燿靈洎元洞空蔚陽天帝飛日路咸青宮啟生天帝士勝育居西方八天定曦扶晨天帝光空極眞曲桑漱瓊天帝嬰定泰郊羣黎寂鎖天帝炁摩幽寗𤣥墟正魔天帝直鐶湛罙運厯開靈天帝時維康假素契治律天帝召可司非西清玉賓天帝茨留江道元聖山天帝臺堅庸北方八天潛池演滋天帝決隲少披虛闕對神天帝渺秩祿宜寞羅帝陀天帝呼畫頤光酆營總監天帝述廬猶朋智廬降眞天帝蘇杜善提號都佐理保福天帝部尤允淝海靜雲儀玉夷天帝洞義明持壬領六司天帝考按鬼神三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻青陽之音青陽之尊青陽之神青陽燿晶青陽之靈九炁十華變化上清无量之奥深不可詳敷落神眞普度天人今日欣慶受度厯關諸天木眞九皇倚杖扶桑妙靈攝炁結爲青陽青陽飛精碧光高升大圓照空億炁爲程仁德逮下福資聖君普覆區宇變化生靈仙眞神龍克應至神和煬慈恕微妙彰明上學感靈仰味天精神光下流骨玉顏金策登神霄披服組紋拔苦扶難振祐生民請滅三惡斬絶地根扶桑吐華蟠條散英瓊綠萬葉蒼雲千層上生靈寶紫光丹靈九芒纏虛煥爛東辰遐想青軿龍仗繽紛青炁如絃挹采𤣥曛洗髓鍊神奔騰玉津飛度九戸廓開八門眞王監舉列告元眞東斗降陽西斗燿明北斗𤣥沆南斗光淩中斗益生總括萬靈青華啟暉皓芳開性丹蘂扶衞𤣥津保命黃英中貫普行教令大帝碧羅三界大定蒼元上眞綠炁東桑丹元上眞鍊玉朱光素元上眞皓華流芳𤣥元上眞雙闕提綱中元上眞坐鎭明堂五元至神上景之眞含芳拱露交幹雙莛飛龍高舉落鳳騫星統部靈魔萬神之宗飛行三道總統仙兵麾幢鼓節遊觀九清自號赫奕諸天齊功上天化民嚴攝羅酆眞王受命普掃祅凶伯華降晶龍燿持鋒太丹流雲威化無邊神帥擲火萬里飛煙金鈴迸擊玉㦸八懸敢有干試拒遏高仙𤣥鉞前戮神金後刑屠割祅爽激蕩無停千千截首萬萬翦形魔無干犯鬼無祅精三官九司明按鬼營不得容隱玉馬交呈普告無方萬𢑥咸聽三界五帝列言上清元洞玉厯東極扶桑未開五劫初判青陽陽華發生三元紀綱生爲神仙道樞已張震動知覺龍漢延康眇眇億劫混沌之中青顯爲色陽墮成淵風爲木神澤爲木元風澤洞虛金石凝天天上天下大化冥冥陽光浩蕩無極無名洪濛大道遼廓無光丹暉啟圖運度自然青華安鎭綠誥瓊篇赤書玉字九炁龍文保制劫運使天長存梵炁彌羅萬範開張木眞流演四羅諸天輪轉綱維囘度無邊旋角厯箕粲斗車廂傍俠天經運化五帝玉城九門青帝東鄉三十五分總炁上元八景冥合炁入𤣥𤣥𤣥中太皇玉極仙眞乘景步虛下照桑林千眞共會帝庭飲食青陽浩劫冞淪汎景紫霄吟詠洞章金眞朗秀流響雲宮靈音化景混合囘風太虛鬱微輔翼𤣥空青陽入肝碧樓玉山中有少童錦衣美冠手執天籥吹噓百關內通境界感御披蘭白珠累累霐流三田鼓橐茹和赫然成丹千和萬合自然成眞眞爲青陽陽中有神長生大君曜元公子浩晶尊神方諸司命暘谷合延執符把籙保命生根上遊九清出入琳房八關之內細微之中下鎭人身瓊樓絳宮中理五炁混合百神十轉囘靈與炁俱仙仙道貴生蒼垣度人上開九門青光大輪司治天政下劾鬼神中主人民罪福因緣普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有碧桑雲葉自然青陽空洞之謠眞王靈篇辭參高眞第一碧海扶桑飛空之音玉都翠京下連碧淵光霞億萬青陽九𤣥寒波泛溢蒼景扶桑並生萬尋神風化綱葉映碧落中祕龍章歌空成韻枝舞鸞翔元精縈羅綠英瑶璫林密如雲中有上眞寶弁嵳峩交龍羽裙厥號太帝扶桑之尊無英伯華龍胎九魂主教至學灌鍊五形千變萬化八道揚旌勒我上範方諸紀名第二青陽寶曜眞王之章扶桑連理並幹相倚接雲龍升逼波雷起蟠根蜿蜒接曲千里青宮大神太一元尊碧霞鬱壘𤣥相老人三界仰德九土蒙恩桑林之眞炁名青陽昇於神天結秀紫房寶燿赫弈傾丹化鄉下照億天无極威光生育列聖飛度延康仰引神霞經天緯常悟此得生道識者通神靈吟詠青陽章九天俯雲輪第三東極青華帝君歌曰寶山峙東南上有眞王宮盤根淩太虛下眄九霄中內列諸靈司洞治億天宗元嗣輔上帝統御興眞風鑑觀圓羅下驂駕飛天龍十極秉元化大魔爲攷功收制六天兵使道永興隆飛章請玉詔𤣥符赦羅酆大慈憫長夜五苦使咸停與我本同氣翛然宴赤明變化無邊際普度諸天民胡爲樂須臾貪欲勞其神不學上眞道厯嵗空悲辛我今爲此歌清音感𤣥人此三界之上飛空之中眞王歌音音參洞章誦之百徧名度南宮誦之千徧眞王保迎萬徧道備飛昇太空過度三界位登仙公有聞靈音眞王召神敕制地祇侍衞送迎拔出地戸五苦八難七祖升遷永離幽山魂度朱陵受鍊更生是謂无量普度无窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈眞王隱祕之音顯明扶桑之山仙國宏遠其山面方萬里在碧海之東去中國九十萬里上通神霄五府億萬里中有太眞王扶桑大帝方諸山青童道君東極青華之別宮山生巨桑內黃而外紅其華食之長生其液狀如玉飴服之壽千劫鍊之爲丹餌爲高眞其根感玉京崑山之玉津孕於桑中下生玉璞如世松根而有茯苓茯苓千年生威善扶桑之下有玉璞温瑩殊美並能制鳳凰立於其上下方生玉玉結未成凝爲流液服之變爲嬰童壽等天地扶桑之上有靈雞鸞鳳九色之鳥日旦升於若木金烏飛於桑上卽日出暘谷其扶桑之頂有炁名青陽上爲木星光照三十萬里徑一百里十二年一周天三百九十九日一見伏凡八十三年七十六見而七周天中有星帝后妃夫人官屬木皇爲之主爾修其道則𤣥丹太一吐納青炁太一天尊授兆青符無英公子飲兆青精龍煙丈人威盟眞人受兆東方眞文御青陽以東升音旨微妙皆是大梵之言非世上常辭言無韻麗曲無華宛故謂𤣥奥難可尋詳上天所寶秘於𤣥都高上神霄玉清玉府東藏經室依科三萬七千年應運下傳若有至人齎金寶質心依舊格告盟十天然後而付焉道言夫青陽爲生福之力本有形之類無不賴之至若天地運度否終日月五星虧盈至聖神人休否末學之夫疾傷凡有此災同氣皆當齊心修齋六時行香十徧轉經福德立降消諸不祥无量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太陰臨過之時同學至人為其行香誦經十過以度屍形如法則東極青華帝君賜通光之符召青陽之炁於無英之宮流太𤣥青精生炁入兆之肝府死戸閉塞木皇內遊含明丈人爲兆啟紫蘭之室開青珠之檢授兆隱文兆之精靈按而誦之魂神徑上南宮隨其學功計日而得更生輪轉不惑便得神仙道言夫天地運終星宿錯度日月失明四時失序陰陽不調國土災怪水火厄難疫毒流行兆民死傷師友命過善士橫殃皆當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受賴其福難勝故曰无量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衞右別至人剋得爲聖君金闕之臣諸天記人功過毫分無失天中眞王亦保舉爾身得道者乃當洞明至言也

seq: 21
body:
  text: 化𤣥靈胞門紫房中有大神叩玉鳴鐘擲火流鈴滌盡氛穢去血屍彭結節赤黑二十四關布兆生氣除卻邪紛執籙把籍齊到帝前隨所應度嚴校諸天普告三界无極神鄉泉曲之府北都羅酆三官九府十二河源上解祖考億刼種親疾除罪簿落滅惡根不得拘留逼合鬼羣元始符命時刻升遷胎根生化返塵歸眞斷邪除穢招鎭百神七祖㪚仇五帝監盟北都寒池變化形營鍊骨成仙出入无門制魔保舉度品南宮死魂受符仙化成人生身受度刼刼長存隨刼流轉與天齊年永度三塗五苦八難超凌三界逍遙上淸上淸之天天帝奎零無色之境梵行東方八天至眞堂囘天帝輝離无生虛洞普搖天帝賀眞彌倪遠師崇濟天帝淵虛子鋹皓景環宗天帝栢雲孳光略无燕神天帝爼司越章牛岵兆壺天帝直盧奚敦妙宮蔽无天帝亮辨由都顧靈定度天帝康化治衍南方八天喬繁麗空天帝變无元昌持命典仙天帝覺𤣥覽常元師究由天帝寂度孟斗霸澤囘華天帝理名正騫太素夷微天帝廓益遼眞序乾標谷天帝羊輅國賓道表臻祥天帝麓錫來冥轉運邦天帝慶祖辭仁西方八天龍𤣥胎神天帝車梁賜蒂邱定漾炁天帝頤窮景沖昭力支羅天帝九用茲瀛孝至岡虞天帝極根環元洞化寶陽天帝玉汴自檀靈緒混甘天帝產珠凝方救牢拔塗天帝蔽山都眞流曜絳章天帝晉關肇宣北方八天耿易火帝天帝强完明華意寶聚眞天帝百憩陰成漑本厯孚天帝知𤣥得容河陣肆師天帝穀原彥昇鑄精育神天帝交鈴紫肆胞命元化淨光天帝秀隆幽虛芒兟欲度天帝並炁壺完觀竺吉猷天帝正玦寂仙三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻洞眞之音洞无之尊洞觀之神攝制大魔變化神靈臭肺吞賊與天同生飲血搖精潛伏胎根使命夭閼仙道不成屍鬼改易飛身泥丸隱藏胞蒂陰構外邪入登𤣥牕薰亂宸霞上帝斬摧神燕玉堂九和十合變化空常无量之奧深不可詳敷落神眞普度天人今日欣慶受度厯關諸天解散結節斷絕胞根飛度五戸名列太𤣥魔王監舉無拘天門東斗延生西斗鍊胞北斗除穢南斗化胎中斗混洞一合生神靑帝徊風白帝命靈赤帝保根黑帝澡形黃帝守中胎穢不生靑天魔王鬱珠洞羅赤天魔王炎光滅精白天魔王斷胞交眞黑天魔王伐邪命神黃天魔王洞觀太英五帝大魔萬神之宗飛行三界總攝眞胎揮邪命靈七關廓開流布妙化上變九回穢滯旣蕩骨肉同飛天眞承命召致福祥眞功內充神威外張凶祅殞息邪精伏藏浩炁纒結三丹玉房共輔帝化卻滅凶衰六天大醜豁落誅摧金光散景玉道交馳拔度七祖擯絕百非三官黑書永落禍基不得容隱明正元機普告無窮萬神總歸遊宴玉闕列言太微空洞九𤣥玉帝𤣥靈招霞散景含虛紫烟降神玉妃舞華胎仙道本生化靈根無垠高極太无上列諸天天上天下无幽无冥无形无影无極无窮溟涬大梵寥廓无光赤明開圖運度自然元始安鎭敷落五篇赤書玉字八威龍文保制刼運使天長存梵炁彌羅萬範開張元綱流演三十二天下逮一體混化五神眞命應仙𤣥紀彌綸九府六卿列坐蓮胎𤣥一洞魂踞斗跨魁左扶火王右奠伯嬰掃穢除邪玉靈四開位證金宸制到萬靈輪轉无色周囘十方乘蹻飛步斡運七元驅除邪穢澄廓璇羅充溢七門灌養靑芽二十四圖總攝眞方八景冥合升降混黃中有𤣥一上帝高眞泛景太霞嘯詠洞章金眞朗郁流響雲營玉音攝氣靈風聚烟紫虛鬱秀輔翼萬仙千和萬合自然成眞眞中有神長生大君紫戸靑房流鈴大神坐鎭明堂守護𤣥眞執符把籙生化胎根斷除邪穢出入九宮八景之內細微之中蕩淨胃池通理百關速召萬神混合泥丸十轉囘靈與氣齊仙仙道貴生无量度人上開八門飛天法輪罪福禁戒宿命因緣普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有空洞謠歌之章魔王靈篇辭參高眞第一欲界飛空之音人道眇眇仙道莽莽鬼潛胎根當人生門使爾愚凡不樂仙眞虛宮襲邪穢腐來攻高上淸靈爽洞微同太虛生化寶胎根使爾仙道成故氣隨日消神風起崑崙太洞觀玉眞紫雲繞絳庭公子授靈符帝一俯仰存謝此帝穢途八道自然分羽蓋殊翩翩羽駕適九淸錫告華天英瓊文燦靈篇第二色界魔王之章眇眇高虛瓊闕峩峩元始靈章普教仙賢下極綱維上極諸天无量之奧皆同我身如何邪穢亂我胎根血屍沉骸陰魄拘魂寶山化銷何能獨存𤣥受靈符致身帝前此時樂兮面返玉嬰赤明旣往猶能別眞我界輕染故錫寶文除蕩氛累召集百靈鍊胎飛仙授命玉宸淨穢凌空上爲帝賓第三無色界魔王歌曰骨有太空中蟠古尸故氣紛紛凋爾靈芝胞戸翳塞欲華四披血沉奇理穢絕元機我位上王統御羣靈左持玉符右呼天兵蠱積胎根擲以流鈴使命永延萬姦消催三十九眞赤書開光生道妙𤣥服此天章干試無前我道其昌洞空洞无洞眞洞仙飛神玉霞泝車碧煙此三界之上飛空之中魔王歌音音參洞章誦之百遍胎根淸正名度南宮誦之千遍永斷邪穢魔王保迎萬遍道備飛昇太空過度三界位登仙公有聞靈音魔王敬形勑制地祇侍衞送迎拔出地戸五苦八難七祖升遷永離鬼官鍊度朱陵受鍊更生是謂无量普度无窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈魔王隱祕之音皆是大梵之言非世上常辭言无韻麗曲無華宛故謂𤣥奧難可尋詳上天所寶祕於𤣥都紫微上宮依𤣥科四萬刼一傳若有至人齎金寶質心依舊格告盟十天然後而付焉道言生民宿無至緣識託業化胎命凡頑生根不眞朽蝕腐敗以道化鍊妙感通神邪魅穢沫害蠧節中隨結不開致冥爽來舍三眞退席上學同氣皆當齊心修齋六時行香十遍誦經福德立降消諸不祥无量之文普度无窮道言夫末學道淺或仙品未充運應滅度身經太陰臨過之時同學至人爲其行香誦經十過以度屍形如法胎根淨固魂臺四明邪穢斷除仙聖爲鄰魂神徑上南宮隨其學功計日而得更生轉輪不惑便得神仙道言夫生體不固每有疾傷胎穢攻蝕面焦髮素孕育不成嗣系夭折起居憊劣道炁斷息三屍鼓動致兆死傷皆當修齋行香誦經夫齋戒誦經功德甚重上可生化胎根保身得道下除邪穢以度兆民生死受賴其福難勝故曰无量普度天人道言凡有是經能爲師友兆身民人行是功德有災之日發心修齋燒香誦經十過皆生化胎根斷除邪穢右別至人尅得爲聖君金闕之臣諸天記人功過毫分无失天中魔王亦保舉爾身得道者乃當洞明至言也東方八天眞庭獻莊混璧卷常月離珉施几葉洞梁㠗車錫磐休留忘襄馬焉胡旗震正允臧道密意綿𤣥圖洞桓兆寂孔幽夷邈眇聞旨在爻應駢貫感番流淇温靜空觀无還南方八天素氣徊豫華跡罙滋延醜戮暑英照淵昆竭帝邃京玉倉璉瓊霞枚雲施子丹雲征秀珠蔚華南韓肆駢宰聽幽貴天機監元綸極太冥亢孤攝煙龍運祕標默目返緣西方八天欹悲觸荄仁澤流涓槁梗昭炫靈化杳傳混浩莽都景驥飛旋長古轉臺運逸孔堅便穴液持澱霐龍鱞偃驅神虛相主八關演坑襲遒部鄒球奚胎居消晶玉津明微北方八天鬼适啖茹辛牢莛錮勑校九天省錄韓注希恍罔覩覺超意龍昇祛翔周神虎萬𠀉洛歌嘯宛叩鳴和澗問絕溢酬化樞旣辨陀仙浮闐嵩漾林縣寶屈體光梵布于鍊道言此諸天中大梵隱語无量之音舊文字皆廣長一丈欲生化胎根斷除邪穢卽布丹書石上坐誦洞文則屍賊伏匿雀陰𡀱怖琚驕喪睛姑俞竄隱天素佩身百靈朝謁檄統萬神天眞皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳魔王保舉上眞道備尅得遊行三界升入金門此音无所不辟无所不禳无所不度无所不成天眞自然之音也故誦之致飛天下觀上帝遙唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳瑯振響十方肅淸河海靜默山嶽吞煙萬靈振伏招集羣仙天無氛穢地無祅塵冥慧洞淸太量𤣥𤣥也

body:
  text: 元始洞𤣥靈寶本章洞神禳災妙品天福度人百魔隱韻離合自然洞神赤文无无上眞元始祖劫化生諸天靑華木眞萬物生根生氣流布精液氤氳木之尊神元氣之子氣生眞水水變生木木含靑華之氣爲萬物之主其靑華木精中含明性化而爲火火色赤明通妙成眞自然生神體洞太虛解悟誠明其氣長生炎動熒熒名曰洞神洞神至眞物得生成一切邪殃見之悉甯爲道眞體災凶邪僞莫可禦當地有五金得火見精萬物入火變化无方易骨登𤣥思妙全天理臻又𤣥如世災殃非正之歸洞神乘之萬災折摧洞神九陽生福无量得者長存物感永臧神風揮激丹霞飄揚屈曲成文三景同光禳災護生刻榜瓊堂上通三天无无道鄉下極玉山鬱羅混黃中施羣類救禳災殃嚥佩神文引吸太陽紫烟內凝燦灼煒煌爲道之要超升之門天眞之因化生神靈制運保民皆由洞神神氣大梵周迴十方中有禳災回福之神滅禍延生之君洞神解厄尊神東華度命之君太皇萬福丈人中有扶桑定命除災之神消災散禍道德之君禳祈應契无量度人今日校錄諸天臨軒東方无極洞神禳災神王長生大聖无量度人南方无極洞神禳災神王長生大聖无量度人西方无極洞神禳災神王長生大聖无量度人北方无極洞神禳災神王長生大聖无量度人東北无極洞神禳災神王長生大聖无量度人東南无極洞神禳災神王長生大聖无量度人西南无極洞神禳災神王長生大聖无量度人西北无極洞神禳災神王長生大聖无量度人上方无極洞神禳災神王長生大聖无量度人下方无極洞神禳災神王長生大聖无量度人十方洞神禳災神王長生度世无量大神並乘飊輪囘旋燿景之輿丹瓊雕輦華蓋珠旛驂駕龍鳳十絕九光之幢四氣八景明離之帳前嘯梵音齊唱後吹瓊籟同鳴金鶴丹禽嘯歌噰噰六甲啟道九老翼轅億乘萬騎浮空而來傾光囘駕監眞度生諸天丞相南昌上宮司命司錄禳災散禍延壽益算度厄尊神執籙把籍齊到帝前隨所應度嚴校諸天普告三界无極神鄉泉曲之府北都羅酆三官九府十二河源行災主瘟天大殺鬼㝠曹之神禳免世間生類刑禍衰虛之災改易簿書勾落災祥使生常存福慶日增疾除罪釁落滅惡根不得拘留逼合鬼羣道君符命時刻升遷順剛入斗迴度天關出死入生上見帝宸制魔保舉度品南宮魂魄受鍊災消福應生身受度劫劫長存隨劫輪轉與天齊年永度三塗五苦八難超凌三界逍遙上淸上淸之天天帝玉眞无色之境梵行東方八天玉厯𤣥度天帝眞定儀陽錫納慶祖天帝仇辨嬰常九氣敬賢天帝收提耿光靑華利元天帝孚蒲耳敦韓都九司天帝旺池奚銘部同超後天帝鄙宗時隆丹林隱立天帝僑蹤彦松九色剛種天帝月支子容南方八天燿浮墠㝢天帝景肇建生重光普時天帝玉微觀靈洞極丹儀天帝祖奇歸仁正基太度天帝除思步肱辨阿錄成天帝感儀聰𤣥殊惠凝天帝彦侶馮靈九陽厯靖天帝路虯師陰章梵元淨天帝伍邱思仝西方八天參寂𤣥際天帝大无元兆津普夷天帝師度歌延妙瑜素靈天帝順師洞陰金扉皓墟天帝藻辭願晡洞惠明妙天帝根齊疎衮招眞空碧天帝蠙東枝傾國定慶基天帝浪敷由央皇思時龍天帝夢元夷𤣥北方八天道力宏度天帝學務演直豫懌𤣥明天帝長善珉助極德𢍆天帝景章融妃九素思𤣥天帝洞覺燿眞潛燿承光天帝軸羅用崔太元崇構天帝臺淵奔施皓幾宗神天帝鹿杜冥樞幽夐遼期天帝月上眞三十二天三十二帝諸天隱諱諸天隱名洞神梵氣自然靈章諸天隱韻洞神之音洞神之尊洞神之神洞神大魔洞神之靈性和神合變化上淸无量之奥深不可詳敷落神眞普度天人今日欣慶受度禳災去非太上考按宿舍囘軒黑道百試血火千殃災及世間鬼謀福怨誣成巨災厯關諸天請滅五苦勅斬五衰飛步天垣命據九元害氣永滅道君錫年洞神降精想入天門東斗校錄西斗攝靈北斗禳解改易災名南斗符命赤書護身中斗注壽大福總靈靑帝保命白帝遏殃赤帝度籙黑帝釋禳黃帝營衞福慶煌煌靑天大神使災不生赤天大神咒詛不成白天大神喪害潛形黑天大神淸蕩鬼營黃天大神靈圖鎭眞內安五臟外集百神靈文玉章元氣之根禍難撲滅光明赫升五天大神萬鬼之君飛行空界總領鬼兵麾幢鼓節遊觀九冥朱幡赫奕紫氣煇騰諸天改度災變福臻上天度人嚴攝北酆洞神太上普掃災凶八威攝氣猛馬四攻天丁捕鬼大帥縛龍擲火萬里流鈴八衝敢有干試妄爲眾災北帝漂骨南斗焚骸屠割鬼爽誅斬無偕風火浩浩豁落燒摧千千截首萬萬剪形魔無干犯鬼無祅精三官北酆明檢鬼營不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列言上淸元洞靑華氣結碧霞曲扶神桑紫文雲芽本神爲生生道爲春化物之祖洞神之尊洞神陰火制鍊陽魂人物遇之卽成仙眞允被世災邪囘所興心能𢍆眞禍散消雲洞神吐氣不祥如焚生福之源玉京𤣥山左淨右霐金液玉泉巍巍九天氣入重𤣥𤣥道無色𤣥下無淵風澤洞虛𤣥中有天天上天下無幽無冥無形無影無極無窮溟涬大梵遼廓無光當爾之時孰爲迍災赤明開圖萬象克諧善集成福積惡成災災福之肇皆心所生道體無形道心無爲無形無爲福災何媒洞神道君至慈運悲囘災就福護生不遺五篇玉字八威龍文禳革故氣延算遠期保制劫運使天長存梵氣彌羅萬災伏藏元綱流演三十二天輪轉無色周迴十方斗中司命注福除殃神氣運行三十五分總氣上元八景冥合氣入𤣥𤣥𤣥中太皇上帝高眞手把混元禳災寶符坐鎭明堂泛景太霞嘯詠洞章金眞朗郁流響太微祅星順度攝制祅氛白烟左囘紫氣右歸化生玉儀千和萬合自然成眞眞中有神扶桑碧宮洞神道君萬氣之祖長生大君首建靑霞身御錦紳無英公子白元尊神太一注筆桃康俯庭執符把籙保命生根上遊上淸出入華房八冥之內細微之中下鎭人身泥丸絳宮中理五氣混合百神十轉囘靈萬氣齊仙仙道貴生禳斥災氛神視天門奄見皇君授子密語自識天眞罪福禁戒宿命因緣普受開度洞神生身身以道生上聞諸天諸天之上永滅災因中有空洞謠歌之章三眞靈篇辭參高眞第一洞神道君禳災致福天市順度之音煌煌磊落明威八囘下照世間萬類所歸順度則吉逆天見衰再拜金色願應禳祈災害不生道德巍巍仙道無休否鬼道論興衰何不觀太無靈玅氣昭璀炯炯碧空上玉闕雲烟飛仙人挹香風嬰顏等春囘洞神變靑芽嚥餌光徘徊庶使扶桑道鳳章藹淸微下憫朝生徒亹亹輪轉間不知洞神旨蹢躅拘籠樊騁霄𢍆高靈偶景東華山第二洞神道君禳災致福太微空洞之章碧光流映金闕朱軒燦燦星株雲綱繞天繁秀貫珠遲伏見災留逆殃延我有赤文靈圖寶躔交綱合形禳災赦愆太上所祕萬劫一傳洞神元皇冒禁下宣霞章吐麗丹書寫𤣥除世厄尤延道永年扶順帝道億劫無遷連閣龍居金光蜿蜒吐火激波蕩滌魔冤與道冥一三界列言過度八難氣入自然第三洞神道君禳災致福紫微伏魔之歌圓景蕩蕩金馬四馳瓊車空遊日將月隨部衞萬神三官拱儀世有災數水火陵夷九六終窮交換坎離九靈鼓翮龍驛轉機兵刀雨暴殺氣橫陂災惡見象赤書布施五帝執筆四明捕非祅氛淨蕩福德洪罙帝壽萬年巨民燕頤荒服衎歌慶善襲之我歌洞文丹輿綠雲寶傘吹華神風杳芬紫宸周行三台屏伸浩氣臨斗流鈴鍊眞宸霞九色太素之君此三眞太上洞神道君分化法身遊行太空禳災萬福之音音參洞章誦之百徧名度南宮誦之千徧魔王保迎萬徧道備飛昇太空過度三界位登仙公有聞靈音魔王敬形勅制地祗侍衞送迎拔出地戸五苦八難七祖升遷永離鬼官災咎無留命福駢臻是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及禳災眞王隱祕之音皆是大梵之言非世上常辭言無韻麗曲無華宛故謂𤣥奥難可尋詳上天所寶祕於𤣥都紫微上宮依𤣥科四萬劫一傳若有至人齎金寶質心依舊格告盟十天然後而付焉道言夫洞神禳災之法其道至妙自非體𤣥究微不能悉知天人之災者運度否終日月虧盈聖神休否末學疾傷凡有此災同氣皆當齊心修齋六時行香十徧轉經福德立降消諸不祥無量之文普度無窮道言禳解種民之災或數窮命盡禳𨚫不祥者或末學道淺仙品未充運應滅度身經太陰臨過之時同學至人爲其行香誦經十過以度屍形如法夫如法者爲禳世災不逮更禳殁後之災也今旣身没魄逝而尚謂之災者謂水火之獄金鐵之獄考掠追召囚閉之災亦魂爽地下之災則於山水閴寂之地封土爲壇北向祈啟敷露五方眞文玉書修齋誦經以解魂神逕上南昌隨其學功計日而得更生轉輪不惑便得神仙道言夫天地運終星宿錯度日月失昏四時失度陰陽不調國主有災兵革四興疫毒流行兆民死傷師友命過皆當修齋行香誦經以五帝赤書五方靈文丹書碧素向方火而颺之以柏木爲簡丹注其意禳解之文投山水間埋著向處及有災之境則洞神大神收攝災氣降致福祥夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受頼其福難勝故曰無量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衞右別至人尅得爲聖君金闕之臣諸天記人功過毫分無失天中魔王亦保舉爾身得道者乃當洞明至言也東方八天箕鳴玉阜東井變仙牛室互交六氣辯𤣥離披寶泰𤣥踱迷夷諸羅梵摩陳帑萬微馘竺由慈字盻紛持角卓護景月帝陰霏辜乾擊陁變覺銘儀仙郴說林翼原巒微南方八天正坤九辨巴冥混東紫邱適河寂眞相同梵度遼普金極洪壠肇淨平育阿彌思蒙挺洞赤霞皛晶碧容桓羅閻救率宰營忠肆碑詩何竟卓懋舂公建霜緣哨粤垂雄鬼澤龍偃定白祕𤣥學靈鄙露支騫走檀自鬼字叩四句係禳災密文西方八天奎婁應仙旗高步蓮綽眞構攤景復滋堅太香玉度球浪楚傳牛室事無寶秤默云神諦梵藪靑朗奏矜龍霧侔就丹𧕏淵𢎞普載丁琥驥勅揚誡覽覺坰常狐兵資興北方八天鬱儀結璘佽堲功傳朗都究明道伯攸𤣥爻宜轉綱權融齒房玉邈稽微天魁辿延畢老墟圩景霽洞傷陽復雷捷越逵聿蒼蘇林奚兖神鳳膺張寂區環極道祕奇常道言此諸天中大梵隱語無量之音舊文字皆廣長一丈刻書大帝金宮扶桑靑林玉葉雙幹之上上禳天災下禳地禍中安民物神風振之洞神發音氣徧九有和合萬靈使災害不干萬眞降庭天眞皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣洞神禳災萬福神王下觀其身書其功勤上奏諸天萬神朝禮地祗侍門大勳魔王保舉上眞道備尅得遊行三界昇入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致飛天下觀上帝遙唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅淸河海靜默山嶽吞烟萬靈振伏招集羣仙天無氛穢地無祅塵冥慧洞淸大量𤣥𤣥也元始无量度人上品妙經卷之四十五道言昔於浩舒天中邃碧幽歌大神樂土受元始度人解禳山谷瘴癘妙品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖高尊妙行眞人大小山谷仙官主宰十方國土列嶽羣仙溪谷泉源鬼神令長直年方域行瘴爲癘神官曹屬部隸攸司无鞅數眾乘空而來從山現出紫軿碧輿飛雲暉映寶輪羽蓋扶華垂廕流明玉光千色蓬勃朗耀𤣥虛七日七夜諸天日月星宿樞衡玉關駐景停輪神風靜默山谷藏雲天鑑鮮瑩和氣八騫一國地土山川林木緬平一等无復高下土

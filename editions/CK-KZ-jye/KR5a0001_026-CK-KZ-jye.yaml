seq: 26
body:
  text: 天皇眞人曰此經神寶君代虛皇說之故亦詣元始上帝授太極元化保生眞人爲序眞人乃禹餘天高眞道君之臣故亦稱道言元始洞𤣥靈寶本章明體貫氣虛妙上品皇極度人淵微寶厯符應自然混合玉文龍康化眞泰洞無垠虛象流形空無渺邈植立萬天鴻濛正氣大朴分源飛騰升降包絡交纒開明雙景帝一合仙𤣥虛上宰演妙高清鬱昌啟運肇生神靈是爲變化玉極元皇紫霄綱維晶燿琳琅飛輪持紐數度朱光上清劫仞大有黃房後聖廣筵三眞化宮下治崑邱瑤臺閬風端居天京統敎十方中有𤣥元大範之靈中有司天變化之君中有徊水儛空大神中有太微沖和妙行眞人中有鳳臺絳闕雌一玉檢曲素大洞高眞共明正體无量度人今日貫氣諸天臨軒東方无極八景神王長生大聖无量度人南方无極明光神王長生大聖无量度人西方无極制魔神王長生大聖无量度人北方无極蘂珠神王長生大聖无量度人東北无極雲宮神王長生大聖无量度人東南无極變化神王長生大聖无量度人西南无極靈飛神王長生大聖无量度人西北无極三素神王長生大聖无量度人上方无極玉虛神王長生大聖无量度人下方无極離合神王長生大聖无量度人十方虛明正體神王開天貫氣无量大神並乘流光鳳車瑤輦華葢丹輿驂駕神虎猛獸斑麟建七眞𤣥鉞三素朱旗前捧洞陽寶印後仗招靈信旛太極羣仙飛空步虛五佐啟途三官翼轅億乘萬騎浮空而來傾光回駕監眞度生太微玉輔紫宸上皇至陽元老沖妙大神總執生符來詣帝庭隨所開化攝召萬靈普告三界六極八冥廣霞飛圓寒嶽丹扃方諸靈紐暘谷洞泉通明大劫龍廐成池龜城瑤闕浮照星機三元上館天憲九宮二十七府簡注元功持握生化考校羅酆眞光流布下拔罪魂息役鬼官業報休停𡨚仇和釋隨運長存因緣輪轉上升朱陵永斷貪愛牽纒之苦逍遙高空受鍊太霄太霄之天天帝觀覺無色之境梵行東方八天力欲竟成天帝居央微眞納乾晝登天帝辨崇至羣都曾秀敷天帝杳良鳴袪非卻妄天帝石完夫變正𤣥明天帝寂眞耕吕耀疆勒天帝胡顓希明極眞定瑤天帝章毗化居邀𤣥召雲天帝野昌曜虛南方八天利定宛圖天帝景昌祖名韓司主生天帝萌元評玉觀夷會天帝召靈紀須咸樂赭沖天帝確端由衢車揚璘下天帝度謠路音平煥鬱理天帝氣成專浮太皇育嶠天帝孔遵生藍英佐侯天帝洞覺靈西方八天童隨巘妙天帝圖賓良舉𤣥謝都天帝仇周九王赤震招仙天帝火提楚基標光咸思天帝璟明山師亮宗迪𤣥天帝召意幷堂魁符大建天帝玉練演論空居杳樂天帝越婁浮光載梵阿史天帝隱題部延北方八天東井貫綱天帝北華粗彌幽華太虛天帝莊竭杜如劫刃降和天帝斗勇慈云𤣥方正嶽天帝籠京麻𤤠通霄次皇天帝玉宮乾尊極張應加天帝洞神八威宗回浮化天帝黃朱景飈慧擇龍化天帝謝登溢常三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻天中之音天中之尊天中之神天中大魔天中之靈九華十晶遊宴鬱單生神妙册高祕京山𤣥波鼓蕩運斡天關今日雙輪會合大慶因緣請除故滯眞降𤣥丹萬惡永消變景飛仙上靈監舉同升帝軒木曜宣威火曜施政金曜司察水曜行令土曜四據總持符命句芒主生蓐收化斂𤣥冥閉藏祝融流演后土居中執御大典青靈始老立天開發丹靈眞老檢校科格皓靈皇老主領殺伐鬱靈𤣥老大布聖澤𤣥靈元老坐鎭金闕五老帝尊萬神所歸飛行三界正統元機持幢仗節遊觀太微位號顯著教令弘施上天戮邪豁落誅摧天皇受詔收滅魔凶石光交煥烈火流衝炎方攝精醜伯驅風寒夜雲營清穴陰宮敢容乖變拒遏高眞融蒼大吏明示典刑泉沙苦刃捕逐無停風刀束送除蕩妖兵百邪歸正皇道長興簡奏大羅同功紫宸陽煇鳳厯九氣順行普告十方無量威靈列科定籍三元保寗丹華大誥分變推遷劫刃崑邱飛霞散煙上開八極下列九淵風轉圓羅肇生諸天天上天下混洞沉冥溟涬鴻濛𤣥極無形宏綱大範幽廓生音赤象黃方度劫自然元始流布霄煇上篇金籙簡章八景瓊文攝召眾魔保制天根正氣騰飛成結清都元和化演鳳眞玉書總祕蕭臺廣運沖虛紫微八會元素珠編陽景招靈无量飛仙同會太清氣合上𤣥𤣥中玉眞太極高皇流泛洞霞吟嘯明堂三騫秀鬱煇燿絳房玉章化氣丹字騰光澄晶永劫安保延康千和萬合自然成眞眞中有神三天大君玉虛上帝黃老先生長生法師大洞高尊執符把籙保度天民上居須延遊宴玉京虛无之內空洞之中下鎭神洲五嶽名山六無相勝回轉天關不得怠縱三華列言皇道開生无量度人上升八羅運天彌綸九光至聖相慶因緣妖姦永息正教洪宣通流萬化列奏三天三天之上各啟生門中歌開明合體之章貫氣靈篇辭參高眞第一妙無廣化生氣之音雙明初判乃闢天關蕩蕩道境元始高居玉剛橫空輪轉四虛鬱羅寶臺深祕龍章虎山海嶠開天御圖上𤣥降氣悉受眞符回環八素飛躍飄浮上清大洞篇三十九皇書道君受法言絳霧閟清都帝道旣已成眞文當廣敷普度學仙民飛神登太无第二妙有明體成道之章𤣥𤣥太羅天中有白玉京瑤闕聳太虛端坐虛皇尊三氣遶蕭臺天闕列神靈太帝執虎符下召元皇君羣品受眞體分化逐境生天魔列𤣥職朱旛校北營大聖憫淪溺𤣥章下太清元洞布靈慈爲爾敷眞經願爾進仙業咸得道果成光明照幽夜苦爽皆超升永斷相牽結𡨚對悉休停第三大混貫氣之歌元始立萬天正氣青黃白浮變爲高清沈化成渾濁中和有邪正爲人復生物欲念弊眞元愛河常汩沒契道入仙靈功圓歸帝闕造業墮輪回隨念沉幽獄豈知太空中三官秉化筆執我大威權九宮標憲格天堂諸種民南昌常快樂旣證𤣥悟道豈復有淪沒受我天寶言速進長生業此三界之上飛空之中仙王歌音音參洞章誦之百徧名度南宮誦之千徧魔王保迎萬徧道備飛升太空過度三界位登仙公有聞靈音魔王敬形勅制地祇侍衞送迎拔出地戸五苦八難七祖升遷永離鬼官魂度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈魔王隱祕之音皆是大梵之言非世上常辭明究生體貫氣隨材天政及民卓無私妄天之至公考驗於帝王法道以變通隨時以舉用通𤣥聖之隱密非凡俗之可量故謂𤣥奧難可尋詳上天所寶祕於神霄玉清王府東藏寶室依科三萬七千年應運下傳若有至人齎金寶質心依舊格告盟十天然後而付焉道言夫誦詠此經則凡體成眞穢氣清蕩天光入心骨有玉津克證靈仙永謝死因萬道開通所爲者成上順天常日月五星中和人氣疾痛無侵下制魔爽百神衞形皆當齊心修齋六時行香十徧轉經福德立降消諸不祥無量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太陰臨過之時同學至人爲其行香誦經十過以度屍形如法太上明體體變柔金司命貫氣氣陶玉津魄鍊屍滅九宮還靈魂神徑上南宮隨其學功計日而得更生轉輪不惑便得神仙道言夫天地運終星宿錯度日月失昏四時失度陰陽不調國境有災兵氣時現疫毒流行兆民死傷師友命過凡有此災皆業成變體德感致氣各有所由道之自然天之政也皆當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衞右別至人克得爲聖君金闕之臣諸天記人功過毫分無失天中魔王亦保舉爾身得道者乃當洞明至言也東方八天亨健基圖偃明命輿句華品懋蘭第𤣥無刹蒻忌到泯炎坤謀建晝靈憲直眞帝壺呼正德銘越鼎亭莩詔彥遵澤古同焉誅敵假宥傑番離潛徂神岡破綱周愼斳都南方八天璲琩虛攸麗佃雅秋孟廊純被思瀏騫投勅鎭鬼井畢參萊休定斷神磔賜候印婁洸鉛洞溢霞晶散浮煌爛棲魂交駟蔚搜常古疑涵淨池火求治滇感兌生蘇氣彪西方八天混契萌動融衝駿偷綠羅知大猛旂聿漚荷裙夷箭曷領逋遒日蘂烏九文已空洲渺何呈叚厯江紫泉響抱親飼爻構道先君軀分體氣列由筵肇解魯住釋滋用筌北方八天哿陁阿陵辜胡拯𤣥景摶太霄舒靜播連赤鏤瑤秩亘閱宏遷符疏雲華紅誕露翩關溟東戸邱府壅年矗並兟晉滬意邈傳色凝方確祕丹董源韓錄罰爽道彰碧沿道言此諸天中大梵隱語无量之音舊文字皆廣長一丈天眞皇人昔詣柏林之舍對伏天𤣥五方率現帝仙唱虛納以火泉鍊之九劫文乃瑩鮮書太極鳳軒玉屏之上金光自生照徹諸天眞子佩文世世登仙龍車入門常侍帝前丹書燔之飲以瓊泉百病去身壽等九天昔書其文以爲正音有知其音變而通之爲道利亨齋而誦之諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳魔王保舉上眞道備克得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成變凡體招靈氣克保升仙天眞自然之音也故誦之致飛天下觀上帝遙唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅清河海靜默山嶽吞煙萬靈震伏招集羣仙天無氛穢地無祅塵冥慧洞清大量𤣥𤣥也元始无量度人上品妙經卷之二十七道言昔於大丹天中絳華虛歌太𤣥景土受元始度人紫光丹靈无量上品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖高眞妙行眞人紫光丹靈元化大神無鞅數眾乘空而來飛霞浮霄琅輿寶輪玉蓋垂蔭絳雲藹虛五色蓊蔚洞煥太无七日七夜諸天靈關日宮月府騰燿凝煇瑤闕層城通明瑩徹星綱回運五斗舒光九道散飈碧壘交纒寶圓泛景天貫飛烟一國地土川谷林藪緬平一等無復高下土皆變紫瑤無有異色眾眞侍座元始天尊𤣥坐空浮九色寶華丹燿飛瓊之座說經一徧諸天大聖同時稱善是時一國男女道性開通了悟𤣥妙說經二徧神府流珍𤣥泉泛液說經三徧妙範宣微密周眾體說經四徧雙景朝元玉關合會說經五徧洞神應變生化自然說經六徧沖和降繞形極仙眞說經七徧靈功遠逮開濟祖先說經八徧天尊身光上騰大羅下降九淵長夜停悲寒宮罷對說經九徧鬼官考吏升補仙階說經十遍三界之下一切眾生皆見紫光丹靈之道是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一徧東方无極无量品青元大神無鞅之眾浮空而至說經二徧南方无極无量品太丹大神無鞅之眾浮空而至說經三徧西方无極无量品皓素大神無鞅之眾浮空而至說經四徧北方无極无量品𤣥光大神無鞅之眾浮空而至說經五徧東北无極无量品鎭靈大神無鞅之眾浮空而至說經六徧東南无極无量品流飈大神無鞅之眾浮空而至說經七徧西南无極无量品神金大神無鞅之眾浮空而至說經八徧西北无極无量品天垣大神無鞅之眾浮空而至說經九徧上方无極无量品圓羅大神無鞅之眾浮空而至說經十遍下方无極无量品沖妙大神無鞅之眾浮空而至十遍周竟十方无極紫光丹靈大神一時同至一國男女傾心歸仰各相謂言我初聞經卽悟神丹眞氣灌鍊合體通明微妙道範永證仙眞來者有如繁星積霧飛雲細塵無鞅之眾迮國一半土皆偏陷非可禁止於是元始懸一寶珠大如黍米在空𤣥之中去地五丈元始登引天眞大神上聖高尊妙行眞人十方无極紫光丹靈大神無鞅數眾俱入寶珠之中天人仰看惟見勃勃從珠口中入旣入珠口不知所在國人廓散地還平正無復欹陷元始卽於寶珠之內說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸得至眞養氣養神養元養精養志養妙養慧養形養生養性光華被體靈丹告成齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有志心奉禮恭敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是上眞內諱列聖之隱名也誦詠之者紫光內映丹靈輔魂王丹餔飼太一降眞非世之常辭上聖已成眞人通𤣥究微能悉其章誦之十過諸天遙唱萬帝設禮合景升𤣥丹靈捧雲內化日月俠侍星辰羣魔束形鬼精滅爽回屍起死白骨成人至學之士誦之十過則五帝侍衞三界稽首魔精喪眼鬼祅滅爽濟度垂死絕而得生所以爾者學士穢氣未消體未洞眞以制十方威未制天政德可伏御地祇束縛魔精但感丹光度形而已不能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到心丹自靈紫光保身億曾萬祖幽魂苦爽皆卽受度上升朱宮格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙太一玉丹賜兆長生飛升金闕遊宴玉京也上學之士修誦是經知覺性明元命歸神玉丹潛符紫光騰淩皆卽受度飛升南宮世人受誦則丹津自生流注胎神延壽長年後皆得作屍解之道魂神暫滅不經地獄卽得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役冥官侍經五帝玉童玉女各三十二人營衞神文保護受經者身道言正月長齋誦詠是經紫光丹靈陽德度冥玉丹九回七世成眞爲上世亡魂斷地逮役度上南宮七月長齋誦詠是經紫光丹靈眞道歸體能屈能伸身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經紫光丹靈太一授書玉丹護眞爲國王帝主君臣父子安鎭國祚保天長存世世不絕常爲人君安鎭其方民見太平八節之日誦詠是經紫光丹靈鑪開八門鼎有九宮太一爲尊得爲九宮眞人本命之日誦詠是經紫光丹靈悟兆元命得爲眞人魂神澄正萬氣長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐紫赤黃三色雲氣之中內外蓊冥有青龍白虎朱雀𤣥武獅子白鶴羅列左右頂上紫光內有太一玉丹赤光如日大如彈丸捧在神雲之內日月照明洞煥室內項生圓象光映十方如此分明密呪曰无上𤣥元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啟所言今日吉慶長齋清堂修行至經无量度人願所啟上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經

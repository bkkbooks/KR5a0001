body:
  text: 東方八天明箕海芒黨路徐忱珏勤合帝如輔洞眞鬱依多迂麥悋需雲拯河沙那碧浙東𩄒持定羽頤法坡波吟魯朝仙英依璉拯珂偃祕羅岑月珠素離美披元謡寳楮宏參南方八天抶陁九首攸敦遏壺皇鎭洞樊鄒阿頻蘇𤣥尚流函屠論佑霞道悟正元麓謀仙居敬邈元岨景著眞𠀉圓羅季僕凝宜啟珠雲題迮粤賢梵遄涂藹原宋歸澄幾演虛西方八天直隨宛藪智嬰茲洪河究通極正斗飛雲祕鏗剛眉嵫池𩵄宗告辨丁孟嘉社元侯吉河大魁將馘冥求金度冶華紫鎭平優𤣥道維寂無始光休仙氣司屢酉露涓舟北方八天黄𤣥載元玃虎昇乾梵景流弭符傳炎宣逵躍度命微𤣥力延儀庚丹鑒隱悟定仙謹濟順常道明妙筌軹騫縢盈府圖凝邊龍黎惡沙變歌保天洞瑞素尤芝瑜功都道言此諸天中大梵隱語無量之音舊文刻紀北都𤣥臺紫微南館下通酆羅九幽泉關以降道威神馘除鬼魔陰魄屍蠱之氣天眞皇人採洞淸之華染丹筆以成文字皆廣長一丈以爲正音有知其音能齋而誦之者諸天皆遣護正斬邪之神天毒八威九首四目之吏導從丁史下衞其身剪伐不祥惠以福澤延命降眞書其功勤上奏諸天萬神朝禮地祇侍門大勳眞王保舉上眞道備尅得遊行三界昇入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致天眞下觀上帝遥唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅淸河海靜默山嶽吞烟萬靈振伏招集羣仙天無氛穢地無祅塵冥慧洞淸大量𤣥𤣥也

front:
  text: 元始洞𤣥靈寶本章斬馘不祥十迴度人破邪隱韻離合自然太无无名混洞北淸太一正眞化爲老人紫羽錦䙱腰帶流鈴首建天英執御洞經口吐靈和斬馘百精天和至眞眞氣煥明五色𤣥黄八角成文龍章虎書符圖啟靈化生六甲役使六丁三元定錄五帝變形開廓陰穢正道聿興無文不光無文不明無文不立無文不成無文不度無文不生是謂大梵天中之天玉符妙重諸天所尊變化金闕上淸之神太霄九華梵氣洞冥圓羅紫極七九合𤣥𤣥臺玉京中有上皇斬邪討姧惡源消斷眞道自然自然靈威火山炎池冶鍊至神龍巾鳳衣主攝不祥聖賾通開萬二千神符圖火兵俠衞上皇都校三元眇眇𤣥道若亡若存雙景內朝陰陽循環紫景白霏嚴駕不停大行梵氣周迴十方中有三天正法之神中有北𤣥斬邪之君中有司禁勅法之神中有神符保命之君中有六天普護丈人中有九天司命採察之君巡遊五嶽丈人都禁眞官身化水火立生風雲神么萬億虎賁兆民斬馘不祥無量度人今日校錄諸天臨軒東方無極靈威神王長生大聖無量度人南方無極靈威神王長生大聖無量度人西方無極靈威神王長生大聖無量度人北方無極靈威神王長生大聖無量度人東北無極靈威神王長生大聖無量度人東南無極靈威神王長生大聖無量度人西南無極靈威神王長生大聖無量度人西北無極靈威神王長生大聖無量度人上方無極靈威神王長生大聖無量度人下方無極靈威神王長生大聖無量度人十方至眞靈威神王長生度世無量大神並乘紫氣丹霞徊光赫衝翠旌錦節素蓋瓊輿驂御龍虎導從仙眞建五神流煇之幢三素翔鸞之紱前嘯玉籟齊唱後吹碧籥同鳴絳鵲靑禽嘯歌噰噰四明治道五仙陪車億乘萬騎浮空而來傾光迴駕檢錄不祥諸天上公北酆眞宰九天都司七政八靈騁霧凌風奔馳炎獸擲旗鼓革號呼獵響執案考籍齊到帝前隨所應度嚴校諸天下及人都幽關冥界無極神鄉泉曲之府北都羅酆三官九府十二河源爍羅鬼國二十四境幽獄罪徒生䰟死魄停繫嶽瀆注害世間喜爲不祥促人壽命發災興毒成厄誣𡨚放施毒邪臨民命祿使福德不備智暗偏禀剋夭族屬陰曹肆便宄惑綿邈嚴奉赤文祇行符命神刀斬戮萬鬼縻睛解釋祖考億劫種親及大魔䰟攻蝕攝考肆虐生民不得拘留逼合鬼羣元始符命時刻昇遷赦過伐罪一一記名北都寒池部衞形䰟制魔保舉度品南宮世無災殃福慶自生不斬馘者鬼錄課盟死魂受鍊仙化成人生身受度億刧無傾陰陽九六常與善循隨刧輪轉與天齊年永度三途五苦八難超凌三界逍遙上淸上淸之天天帝玉眞無色之境梵行東方八天紫景玉華天帝肇符喜生都極重明天帝鬱黎兼登宣眞都正天帝覺霞定符穹燿思微天帝正辨九區蒼微露帝天帝敦和學謀至正常無天帝孔彰儀能靈姬肇符天帝元昌崇燿樞觀化天帝龍扶越聰南方八天赤明燿明天帝賈須騫蒲阮諸綿丙天帝珠鋹祕圖太眞素霞天帝鳳跌玉孤道山空際天帝九星演湖洞浮紫華天帝光平敷元理妙機天帝奥庭竟星嶠嶼洞洪天帝別南彥冥烈歘高晨天帝黨輔元需西方八天寥霞雲素天帝偃庭干鉏化宛𠀉緒天帝援揚斗然九道化陽天帝勃羅會明八地素厯天帝願慈眞逾太微妙觀天帝孽嶺昭淵飛華浩圓天帝翥祺夷妃金映灝都天帝那離權機玉鍊道成天帝虞亭玞北方八天冥洞斗魁天帝術遐卷承雉室羅宏天帝雲笏潛虛𤣥靈修化天帝尚賢玉明除眞穹臺天帝羅都元虛太霞𤣥眞天帝暮緣景昌混明燿景天帝眞期陽靜順慶宗天帝部靜祉詹𤣥精秀光天帝卞丁千期三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻天正之音天正之尊天正之神天正大魔天正之靈氣和道合變化北淸出教布正萬邪莫干劔芒斬梟鬼井逃奔𤣥文紫書雲篇洞章敷落神眞普度天人生兆正氣奕奕法輪長矛巨矢瀝血喪睛今日急速關察火令橫摧斬馘刳滅五帝列儀炎烟萬丈雷電交馳車破鬼營兵散積屍冥官送檄九道併追飛行五門順逐三奇神王稽顙六天迎魔東斗降氣西斗垂綱北斗勅法南斗火然中斗紫宸役御九天靑帝變文白帝斬形赤帝傳符黑帝運神黄帝出令萬靈咸聽靑天神王瞿羅彭興赤天神王鼓畢冲明白天神王虎目昌英黑天神王礔石漂凌黃天神王皛都罙凝五天神王萬神之宗斬鬼億千馘殄不祥總領鬼兵泛泳大荒麾幢鼓節遊盻翶翔霞結成書龍舉爲章火風赫炎諸天齊功上天斬邪嚴攝北酆神公受命普掃不祥丹靈敷熾黄越誅殃六手操兵鐵額擲烟食邪之獸啖鬼之王霜甲秋陣殺氣夜河元帥統軍大帝命魔𤣥老前戮龍將殿圍擁騎雲崿玉鉞迎阿𤣥獸吞鎗靑斗列言速登我前敢有干試拒遏上眞羽葆轉碧鸞帷翊軒萬旅震途羣眞回軿屠割摧裂毒求激淵邪道靜默有誅無捐萬萬截首千千劓勍魔無干犯鬼無祅精三官北酆明檢鬼營不得容隱金馬驛呈普告無窮靈威俯聽地司五皇列言上淸寥無恢運幽虛含精龍漢延康浩浩赤明刧成界開陰陽體名倐忽變化三景玉淸上通無𤣥下際無淵風爲陰火水爲陽津風秀成爓水凝爲石洞虛穹貫三十二天中有正氣爲道高眞辟除萬邪會歸正明至化通𤣥鬼試莫干道爲天父神爲氣根金剛乘天天無幽冥天無形影天無極窮溟涬大梵爲道之宗遼廓天光萬象畢容爰有九都爲鬼之皇與帝同生龍穴徬徨擅治六天害正無光元始開圖赤明洞張三界化現千神佩璫玉文誅斬馘滅不祥麟迹虎符飛雲併臧元氣成符精𩲲滅亡帝一捧日玉女侍傍梵氣流行仙聖穰穰正意梵魔萬法克揚絡雲架霞綴珠垂芒丹繩絳縷屈曲低昂上布玉淸三十二天輪轉無色周迴十方玉字分譯大極洞房長樓寶山妙臺玉堂正天運度消滅不祥氣運五色玉虹奠方旋角厯氐遶心蒂奎牛女入斗冥祅四飛横度中樞迴行五緯二十八舍總氣眞元八威合氣氣入太元𤣥中帝皇洞陰北眞身帶瓊璽頭建神光泛景紫霞嘯詠洞章流鈴電火響震鬼營玉眞吐氣靈官騎星風火敕命金石生烟地囊泮潰屍魅昇仙千化萬移自然知眞知眞得道道性通神中有至眞長生大君九氣丈人八極尊神五天元宰總正神靈太一轉式司命揀卿齊到下方斬伐祅倫符籙前驅兵馬糾紛靑髻蝕暈赤靈考䰟校約宿命俱奏崑崙上遊上淸出入黄房八冥之內鬼道不祥束送帝君及於世間生化所因不得隱避枉禍善人細微之中下鎭人身泥丸絳宮黃池紫海十二之泉寒夜幽路百鬼之羣佩服者書八會神文氣血流轉斬馘邪神鬼祖畢陽聽命喪精寶符降告變骨成眞中理五氣混合百神十轉回靈萬氣齊仙仙道自生無量度人神入天門心自通眞神珠運行如大法輪精守禁戒信悟因緣心目爲開見道眞形普受開度死䰟生身身得受生上聞諸天諸天之上各有生門變極不窮自然常存存者無形空洞合明謡歌之章神王靈篇辭參高眞第一天界靈威正道神王飛空之音玉巔碧嵯鳳軒八敞雲螭在樓飛仙俯仰金馬奔衝星階重重太極化生眞人遊龍正氣盤蔚回車梁光無窮赤書布金斗立召四目翁爲誅萬道魔千邪不爲凶三明烱無昏夀以浩刧終天老發紺城長劒磨太嵩精祟滅形影哀哀畏刀風我降九霄氣嚥之洞樓中施以救世悲成此脫度功第二人界靈威破邪神王之章絳章虎裳泛華十天龍刀斬邪六道侍軒印光凝海劒氣飛雷戮滅不祥正道所歸小醜其何禍試之媒我有洞章姧害元施大君惠生慶錫難老金華九色與天相保靜智合神𤣥元體妙蠢兹繁生蒙蔽眞道廣度天人萬善同因刧界共長上帝宏恩制魔成眞天籙紀名邪無干犯仙聖受盟元始洞空悟者幾人能悟自然泠泠玉音第三地界靈威斬鬼神王歌曰茫茫塊壘下有重山蒼崔白雲往者不還太上哀之請度無間神風飄霞碧玉彎環出書九幽赤文乃宣制魄拘䰟斷此幽關生類何辜刑禍孱顏明明太帝正氣自然眞道正明子得昇遷捨此塵埃途庶免陰邪源我有元始章誦詠萬祖遷結滯超然散默契歸無言度人豈終窮勤此眞王篇此三界之上飛空之中眞王歌音音參洞章誦之百遍名度南宮誦之千遍眞王保迎萬遍道備飛昇太空過度三界位登仙公有聞靈音神王敬形勑制地祇侍衞送迎拔出地戸五苦八難七祖昇遷永離鬼官䰟度朱陵受鍊更生斬馘世不祥福慶隨日增是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及靈威神王隱祕之音皆是大梵之言非世上常辭皆斬馘不祥之要旨六天殺鬼之司名陰類沮喪邪精消卻身得長生位登仙眞故謂𤣥奧難可尋詳上天所寶祕於𤣥都紫微上宮依𤣥科四萬劫一傳若有至人齎金寶質心依舊格告盟十天然後而付焉道言夫斬馘不祥之道實繫大法有四謂九六運終三景虧盈聖神休否末學疾傷凡有此災不祥之重同氣皆當齊心修齋六時行香十遍轉經北極中𤣥天帝君洞陰天尊當勑飛雷電騎五方殺伐大神威劔神王符圖火兵素梟嚇天元帥下降斬馘災咎福德立降消諸不祥無量之文普度無窮道言末學道淺眞業未成有冥泉之鬼六天之神妄作災凶遘諸厄難身年注害福祿减削門戸不寧家庭祟害同學至人爲其行香誦經十過以解禳刑禍祓除苴穢如法中天大神七元眞氣下入身中吉祥自生永保利貞長存不滅便得神仙道言夫欲諸天降庭神兵衞身斬馘不祥者齋戒誦經可以致仙眞除咎癘也天地運終星宿錯度日月失昏四時失度陰陽不調兵革時動疫毒流行兆民夭傷師友命過皆當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衞右別至人剋得爲聖君金闕之臣諸天記人功過毫分無失天中神王亦保舉爾身得道者乃當洞明至言也

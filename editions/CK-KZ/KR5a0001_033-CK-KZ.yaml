seq: 33
front:
  text: 元始无量度人上品妙經卷之三十三
  hash: sha256:1f12aea45808a534f67794d8ea2dbae14d94151da99361b85abcab9dd37cba1c
body:
  text: 道言昔於始靑天中太明混洞上宮寶華靈闕無爲大慈廣生𤣥妙虛淸道境上干浮光元化混沌九微八關俯跨碧落太空星輪景燿之精中有眞王號舍運樞道力自然功位高𤣥中有妙寶神山連延天內有五方天尊紫霄光明飛霞之闕官將百萬民眾千億壽無窮期氣如長春雜萬花色以爲光明瑤海朱鬐綠斑之龍常御九眞𤣥玉之輅以奉玉帝此天五方正氣所生五行之精順天常道不爲囚尅是謂眞一元氣萬物之宗爲瑞爲寶非如陰陽交爭之氣生合離殺長育虧殘而無常也元皇大慈化此眞境五方天尊閒居寶座吹噓正氣採嚥華根流波遠蔭逮於天界天得正氣圓蓋不傾地得正氣海嶽平寗帝得正氣道運太平人得正氣爲世賢良慕道求仙上輔正化無所不眞元始天尊當說是經周迴十過先向五方召命五方天尊東方九神太洞玉眞天尊南方三華上極丹光天尊西方五明太眞金燿天尊北方一眞洞陰寶鏡天尊中央瓊華黃景微妙天尊五方天尊敬奉𤣥旨泛駕黃輿丹靈之輦三素飛雲龍鶴羽葆仙官執典天騶啟途來如迅風流鈴煥落雷火燿天十方無極世界悉皆震動一切天人咸知元始召命五方道主願聞眞一之氣無等上妙大法五方天尊稽首作禮元始垂眄俯視以召十方始當詣座天眞大神上聖高尊妙行眞人無鞅數眾乘空而來明燿流暉玉輿虹輪彩霧蔽空靈光靄華神煙密羅寶雲疊霞風煙澄息和氣彌羅土化堅剛湛如金魄眾眞侍座元始天尊𤣥坐空浮天闕雲山妙光瓊臺之上說經一遍諸天大聖同時稱善是時一國男女初受眞道靈慧虛通說經二遍心契妙微永無湮沉說經三遍五方正氣灌育華根說經四遍𤣥光流景映燿身形說經五遍赤書玉綱纏塞死關說經六遍福被普天慶瑞咸臻說經七遍四氣調和萬物豐昌說經八遍品𢑥生成保固無殃說經九遍邪精滅根魔害不行說經十遍老復壯盛少者永延是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品蒼精正氣至眞大神無鞅之眾浮空而至說經二遍南方無極無量品丹精正氣至眞大神無鞅之眾浮空而至說經三遍西方無極無量品皛精正氣至眞大神無鞅之眾浮空而至說經四遍北方無極無量品紫精正氣至眞大神無鞅之眾浮空而至說經五遍東北無極無量品鎭精正氣至眞大神無鞅之眾浮空而至說經六遍東南無極無量品炎精正氣至眞大神無鞅之眾浮空而至說經七遍西南無極無量品華精正氣至眞大神無鞅之眾浮空而至說經八遍西北無極無量品𤣥精正氣至眞大神無鞅之眾浮空而至說經九遍上方無極無量品虛精正氣至眞大神無鞅之眾浮空而至說經十遍下方無極無量品幽精正氣至眞大神無鞅之眾浮空而至十遍周竟十方無極天眞大神一時同至一國男女凝瞻元始與五方天尊妙極𤣥微見大神變九色光明遍照十方世界一切國土卽各相謂共目攜率齎持妙香珍寶奇花天衣旛蓋自十方來舉此種種珍奇妙供陳於天尊座前徘徊宛轉化成寶蓋百億珠玉百億結綬百億繒綵百億紋繡百億神奇百億光景遍於諸天所有世界如是男官女眾咸皆敬禮仰聽元始天尊宣揚靈寶大法無量度人五方正氣之道瞻望聖顏一心歸依爾時五方天尊五老上帝侍立元始天尊法座之側元始天尊舉身正衣良久復坐於是紫金神光從面門出此光暉燿與諸光明如相經緯縱橫微妙萬種華炫一一天人不由心目外見天尊安如寶山內見己身三一九宮諸境𤣥府光氣無極自下徹上自上徹下從東達西從西達東交射灌激聖變神化難可比倫元始告大眾曰今當度人說五方正氣護生萬有之法得吾正氣皆證妙道爲諸天仙眞十方之聖利益世界演說大法使諸天眾生聞道藴奧五方天尊環繞寶座各放大光暉燿世界猶如千日照徹諸天九萬億土天人宮殿帝王臺觀與光所照森然俱見無有隔礙是時諸天各於光中顯示正氣大道自然凝化相狀近可指矚又於光中各有玉書五篇眞文炳煥張布屈曲飛動鎭召禳制普天安寗東方正氣晨光九羅素景徘徊碧壘鬱霞南方正氣紫雲沓煙朱丹三精生化億千西方正氣明石太素光芒凝化非煙非霧北方正氣𤣥闕飛精雙皇太微包羅玉淸中央正氣上𤣥寶洞妙變盤結化成龍鳳五方正氣無量形相懸在太虛之中各飛瑞光灌元始燿明火玉如意之上迤邐盤帀五色混成大如朗日通含五方所見物象元始登引五方天尊天眞大神上聖高尊妙行眞人十方無極至眞大神無鞅之眾俱入五色混成圓光之內說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倏欻之間寂無遺響是時天人遇值經法各受正氣道心開悟見生化門知道宗祖普得濟度全其本年年極數窮升入太空脫離生死與正氣俱存示身千億變化空常靜而爲虛動而爲形普應十方道同列聖識心如幻無作無爲普濟萬生永斷輪轉有形安泰愛利俱忘正氣入身與化冥一離諸疑網習染解脫飛形太虛爲天種民言無華綺口無惡聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天至尊五方正氣內名隱韻之音亦是三寶皇君丈人內諱百靈之隱名也非世之常辭上聖已成眞人通𤣥究微能悉其章誦之十過召致五方正眞之神化鍊結節靈感胎眞東方正氣爲英明文華淸淨儀矩高賢仁恕仙眞之應於物爲寶玉瑰奇珍禽瑞獸希世之祥南方正氣爲明慧禮制辯哲爽越命令布政輔弼尊神之應於物爲丹華工麗𧰟妍色雘經畫之事西方正氣爲義決剛別堅正果敢介守敕法大神尊官之應於物爲介甲金石牢革牙角防鈴兵刑之象北方正氣爲敏贍智數機謀變通𤣥化爲眞母后太一隱靈之應於物爲修蛇𤣥黮委曲怪異伏藏鬼神之符中央正氣爲尊德祕道寛厚博容廣大碩學輔化帝王君主崇高神聖之應於物爲沖融柔順坎下盈滿遠隆甘和之驗遇正氣者上爲帝仙中爲宰牧下爲賢德爲長生爲吉祥爲福慶故誦詠此經諸天齊唱萬帝設禮正氣來集淵澄嶽靜日月合照璇璣厯天魔爽喪壞屍骨還生至學之士誦之十過則五帝侍衞三界稽首正氣臨斗鬼祅滅形濟度垂死絕而得生所以爾者學士思神致眞坐招正氣生命遇之則貴極仙眞召制十方與天爲一五氣齊靈中粹發華福德自生輕誦此經身則被殃供養尊禮門戶興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人無量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過五方眞氣齊到以之治身則仙化長生使丹靈氣備以之生物則堅大瑞美煥偉靈異以之治人則明譽公端凜然超舉以之通鬼神則億曾萬祖幽魂苦爽皆卽受度上升朱宮正氣所挺五方同眞格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經五方正氣入身愚變爲智俗化爲賢賢則得道道成而仙爲聖爲神氣之正也爲祅爲孽氣之邪也皆卽受度飛升南宮世人受誦五方天尊正氣之光照其眞形則延壽長年後皆得作尸解之道魂神暫滅不經地獄卽得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經五方天尊登玉寶靑華之闕布行五方正氣治化三界爲上世亡魂斷地逮役度上南宮七月長齋誦詠是經五方天尊登朱陵丹華之闕布行五方正氣治化三界身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經五方天尊登紫雲瓊圖𤣥眞之闕布行五方正氣治化三界爲國王帝王安鎭國祚保天長存世世不絕常爲人君安鎭其方民稱太平八節之日誦詠是經五方正氣周回八方還朝帝一化生萬靈得爲九宮眞人本命之日誦詠是經五老上帝下鎭五臟五方天尊口吐正氣入兆命宮絳府泥丸眞道自然魂神澄正萬炁長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上淸道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐靑黃白三色雲氣之中內外蓊冥五方眞氣繞絡身形光明洞燿有靑龍白虎朱雀𤣥武獅子白鶴羅列左右日月照明洞煥室內項生圓象光映十方如此分明密咒曰無上𤣥元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啟所言今日吉慶長齋淸堂修行至經無量度人願所啟上徹徑御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始洞𤣥靈寶本章五方正氣十迴度人諸天隱韻離合自然𤣥漠無垠妙氣生根沓如紫煙分爲三華玉淸離便大有纏羅升過𤣥門盤結浮沉天元正道化爲𤣥京陰抱至陽陽合其眞陰陽會化𤣥生其神神化爲氣氣化爲靈化無體狀至用圓成發生之氣高祕黃庭神池絳淵色凝嬰丹旋轉浮遊上下無方黃老潛養道體居常東靑西素南赤北𤣥中有寶皇正氣自然五方之神神運綿綿巡環周流雷動雲奔五帝授符五老合魂天光無象太朴混淪英芒晃燿靈液其滂物得之生鬼得之靈神得之明人得之仙天得之淸地得之寗上分三界下列九泉風動虛淸變化行天希夷正氣皇道開宣肇自天眞幽微之君玉冠錦䙱碧鳳飛裙乘駕九龍役御千官布行正氣運植五方沖氣所鍾爲仙爲靈時爲尊賢用宏紀綱以之授形爲物之英悉感正氣變化神眞至眞無形大象流精眇眇劫仞若亡若存琨琛麗房琪蘤妙庭紫戸𤣥關森羅浮霐五暈正氣周回十方中有太上三素之君中有上聖淸母之神中有太微玉帝之尊中有胎元帝一之君中有道德五方丈人中有主錄主籍主生主化主變𤣥道尊神迴氣儲正無量度人今日校錄諸天臨軒東方無極飛天正氣神王長生大聖無量度人南方無極飛天正氣神王長生大聖無量度人西方無極飛天正氣神王長生大聖無量度人北方無極飛天正氣神王長生大聖無量度人東北無極飛天正氣神王長生大聖無量度人東南無極飛天正氣神王長生大聖無量度人西南無極飛天正氣神王長生大聖無量度人西北無極飛天正氣神王長生大聖無量度人上方無極飛天正氣神王長生大聖無量度人下方無極飛天正氣神王長生大聖無量度人十方至眞飛天正氣神王長生度世無量大神並乘化眞九光丹輪之輿炎飆紫霞神虛之輦彤彩燿光百神之蓋五精天德大力之幢驂駕朱虯玉龍建萬天十華之節洞神招眞之旛神獸夔龍悲鳴躑躅靑鳳紫鸞翔騰飛翥前詠八素九陽之歌後吹六籥虛生之曲神虎钁天奔躍辟邪五老啟塗羣仙翼轅億乘萬騎浮空而來傾光回駕正氣度生中皇內弼元斗右宮紫垣太極妙通大神攝氣監眞合會高𤣥徘徊升降周厯虛圓敷告八冥幽微之關上極玉羅太空靈尊下該九壘洞淵之源運道正氣鍊化神仙五方大神玉司之官施生布養法道而行變凡入聖易骨超騰恍惚通感大混帝門北都寒池部衞形魂氣聚神生命出自然挺植正氣度品南宮死魂受鍊仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度三塗五苦八難超凌三界逍遙上清上清之天天帝妙和無色之境梵行此爲五方正氣之天從角宿一度一杪半起經五星之分流演同法正行黃道不犯傍綱上稟皇極專行正氣四方各有二天配屬中央土位土無正形各居四方同會於正五方施化爲造物之主得其正氣決爲高眞東方八天定都越𤣥
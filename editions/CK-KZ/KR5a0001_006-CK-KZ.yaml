front:
  text: 重刋道藏輯要元始无量度人上品妙經卷之六
  hash: sha256:fb79d7ec6c643c8037533f14f9e315dbe7e28a2695efcc593125d97d96239d39
body:
  text: 道言昔於始靑天中碧落空歌大浮黎土受元始度人太一神變妙品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖高尊妙行眞人三元太一眞君九宮八史靈圖玉局大神無鞅數眾乘空而來九光泛駕紫霄薦芷綠煙褭香丹鳳雲輿班龍寶輦雕輪層蓋注玉凝煇縟彩爭華仙雲呈麗洞照八極九日九夜諸天神嶽靜布靈風蕩除纖翳廓清區海澄覽太和一國地土山川林木芳潤等齊碧霞回宛周視寥虛妙光同色眾眞侍座元始天尊𤣥坐空浮玉京金梁八風浮臺雲珠寶構曲晨萬龍天德之座說經一徧諸天大聖同時稱善是時混沌營胎自無成有說經二徧太一稟生狀如蓮菂說經三徧含華吐蘂眞氣流虹說經四徧九色雲芽迸勾爲甲說經五徧太一居中外羅八景說經六徧𤣥液同滋元氣內輔說經七徧天嬰七竅開爽能聲說經八徧人物出胎太一仰視說經九徧太一試步九宮旋行說經十徧身御錦衣手持玉式是時一國是男是女欣覩天尊演示太一神變道機元宗降福度人冥信歸誠皆受濟護咸得長生道言是時元始天尊說經一徧東方三元太一慶生眞君至眞大神無鞅之眾浮空而至說經二徧南方三元太一廣明眞君至眞大神無鞅之眾浮空而至說經三徧西方三元太一神虎眞君至眞大神無鞅之眾浮空而至說經四徧北方三元太一隱道眞君至眞大神無鞅之眾浮空而至說經五徧東北三元太一鬼策眞君至眞大神無鞅之眾浮空而至說經六徧東南三元太一本生眞君至眞大神無鞅之眾浮空而至說經七徧西南三元太一坤母眞君至眞大神無鞅之眾浮空而至說經八徧西北三元太一大老眞君至眞大神無鞅之眾浮空而至說經九徧上方三元太一天呱眞君至眞大神無鞅之眾浮空而至說經十徧下方三元太一地齒眞君至眞大神無鞅之眾浮空而至十徧周竟十方三元太一眞君無鞅之眾一時同至一國男女傾心歸仰來者皆從上元九宮太一眞君中元九宮太一眞君下元九宮太一眞君三元每宮太一各變三宮於其三宮又變九宮九宮之內每宮九宮九九各變八十一宮太一居中十方太一垂光度人是諸天人咸詣元始瞻聽大法眾不可計侍從三元太一眞君雲塡海赴滿餘一國聖地震動觀闕傾搖晃耀無極不可禁止於是元始不起於座上攀玉鋼手把大魁忽從空落天人遠矚華蓋燦然萬寶縈結惟見斗口元魁墜空六炳昭列碧影之間圓映金色熠熠吐霞如大火聚其中有太上眞君金牀玉帳紫繡錦裙項負九色手持星珠瑩煥瓊都天尊顧視天人宣告無鞅乃曰三元九宮太一眞君各乘宮室神變福祥在人身中號中黃太一宴處𤣥丹今作神變降道元魁遐想玉城未逾方寸我以神力无量度人太一變身同我說法於是元始登引天眞大神上聖高尊妙行眞人十方无極三元太一眞君至眞大神無鞅數眾俱入元魁之中天人仰看惟見勃勃從魁星中入旣入星宮不知所在國人廓散地還平正無復欹震元始卽於星宮之內說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂無遺響是時天人遇值經法普得濟度太一神變隨運降福全其本年不有害傷傾土歸仰咸悟道心無難無兵無饑無病無暴無天無變無刑無畏無驚言符休應口饒善聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是三元太一內名隱韻之音亦是九宮內諱百靈之隱名也非世上之常辭上聖已成眞人通𤣥究微能悉其章誦之十過太一下觀三元鼓節天輪錯翠地局界金日月合璧星宿連珠河漢揚淸山嶽嚴峙靈風蕩虛萬穴吹籟移綱轉機化職自行羣魔束形鬼精滅爽迴屍起死白骨成人太一之福滅而更生至學之士誦之十過則五帝仗鉞三元命旛太一乘車周臨八埏福從氣行萬道克先斷除不祥災饉播遷魔鬼掃迹幽爽升仙君德所加慶熙億年神威無方位居綱前疾病垂死遇而能全所以爾者學士候氣待時太一命眞以制十方威攝萬天伏御地祇束縛魔靈辟災卻死脫難就生太一神文變化回靈輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干太一守門斯經尊妙獨步玉京度人無量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過當知太一神變之道夫三元二十七宮天元人元地元三部各有太一眞君主之隨九氣九星九宮之色各以定世之禍福濟時衞世護國保君使帝夀永隆天象共泰乃太一之𤣥功天之九宮北帝居東北遊樞東育生東南望黎南朱陵西南女房西皓清西北虛徵中黃靈其太一曰古蒼竹孚冥由紫儀九首白旗定嘉速吉兵囚人之九宮北道𤣥東北吐魂東嬰兒東南鬼都南火山西南虎身西熊女西北乾父中福堂其太一曰長生帝康伯輪臣斧𤣥圖九殺丹精七甲人母地之九宮北𤣥室東北蒼提東𤣥青東南宜明南赤兵西南將印西伏殺西北道京中普登其太一曰𤣥虎綠齒披髮九身青蛇白蒙血噬猖奴孟錞三元之隱名與世所稱異其道甚祕中宮五福之庭土神之精上爲天皇中爲太一下爲𤣥一在學道者身爲帝所而思之爲𤣥一得其道者以一爲萬以萬爲一通變化知生根夀而不死長生仙也五土之氣爲帝主福故四十五年而遷其室居北者九年而遷居西南者十八年而遷居東者二十七年而遷居東南者三十六年而遷居西者六十三年而遷居東北者七十二年而遷居南者八十一年而遷遷不背逆下無臨制上無刑剋則災害不生日享太平或履非其位遇非其時上下不相得則隨宮爲𧕏其災眚亦繫道德之所致也能誦是經則太一回旗使者執節召福致氣不戰而勝兵道大利吉歸帝尊與天齊年太一神變難可詳知太一者三元之貴神以福人君者也其變無常知之夀無紀極道德來備太一之氣朝變爲慶雲中變爲重輪暮變爲流金星光夜流丈餘者是也見之焚香誦經以迎其福坐致天祿得爲神仙遊宴飛升自然得道雲如弁士者五福在北也雲如飛龍者太一在東也雲如舟魚者太一在南也雲如旗常者太一在西也雲如繖蓋者太一在中也雲如遊女者太一在東北也雲如火炬者太一在東南也雲如邱隴者太一在西南也雲如戈矛介士者太一在西也雲如輅車者太一在西北也上學之士不以道俗望雲燒香誦經十過太一降九宮騎吏護國安人福慶普賴皆卽受度長生神仙太一眞君護國帝王保安人民有知太一總臨萬天近居一身則億曾萬祖幽魂苦爽皆悉受度上升朱宮格皆九年受化更生得爲貴人身自受誦心識意解則延夀長年後皆得作尸解之道魂神暫滅不經地獄卽得返形遊行太空此經微妙普度無窮太一神變天人受度無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經迎上元太一眞君從官將吏九宮大神爲上世亡魂斷地逮役兵刑殞命度上南宮七月長齋誦詠是經迎中元太一眞君從官將吏九宮大神消兵卻敵佐輔帝王福及人民身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經迎下元太一眞君從官將吏九宮大神爲國王帝主禳解五兵寗鎭八方盜賊喪形姦宄不生君臣父子安鎭國祚保天長存世世不絕常爲人君安鎭其方人樂太平八節之日誦詠是經奉迎五福太一眞君入居中宮得爲九宮眞人本命之日誦詠是經迎三元太一眞君入居命局降福兆身魂神澄正萬氣長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛升上淸道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐靑黃白三色雲氣之中內外蓊冥儼見十方太一各乘本宮布氣天內有靑龍白虎朱雀𤣥武獅子白鶴羅列左右日月照明洞煥室內項生圓象光映十方如此分明密呪曰无上𤣥元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋淸堂修行至經无量度人願所啓上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始洞𤣥靈寶本章太一神變五福度人三元隱韻離合自然混黃𥥆茫無門無傍朗朗太空道氣無方八十一劫遼廓無光混沌胞胎不從陰陽忽生至神强名太一乘駕黃龍手把天綱狀玉嬰兒丹錦綠裳回旋左右眞正八鄉萬靈伏從莫有敢當太一大神是爲天根時遊玉淸上聖之身泥丸九宮下生萬天及以人民各有知識分別種倫分形萬物居人腦宮是爲明覺一眞大神上居太微中安福庭下此九宮爲帝之賓太一生誕元始同眞上無復祖惟道爲身一旣植立天地乃凝無一不光無一不明無一不立無一不成無一不度無一不生是爲大梵天中之天太一眞形遊步玉京上極無上大羅玉清眇眇劫仞若亡若存乘道之精三元布宮以九爲程太一御之垂福弭兵與道同遷元始俱生動靜消息進退晦明前有金闕後有玉房東淨西霐太一經行支演梵炁周迴十方中有三元九圖之神中有玉局行算之君中有易度遷室之神中有揚旗望歲赤幘直符丈人中有太一前驅後部八殺五福六氣九虛尊神迴骸起死无量度人今日校錄諸天臨軒東方无極三元九宮太一眞皇長生大聖无量度人南方无極三元九宮太一眞皇長生大聖无量度人西方无極三元九宮太一眞皇長生大聖无量度人北方无極三元九宮太一眞皇長生大聖无量度人東北无極三元九宮太一眞皇長生大聖无量度人東南无極三元九宮太一眞皇長生大聖无量度人西南无極三元九宮太一眞皇長生大聖无量度人西北无極三元九宮太一眞皇長生大聖无量度人上方无極三元九宮太一眞皇長生大聖无量度人下方无極三元九宮太一眞皇長生大聖无量度人十方至眞太一眞皇長生度世无量大神並乘碧霞紫白交雲流光照空丹轂綠輿虯輪鳳軿羽翣朱紱蔭映搖曳驂駕九色巨天神獸玉宸飊歘之龍建靑髦之節七曜洞神靈旛前嘯九歌齊唱後吹八音同鳴天馬辟邪鼓舞躑躅鸞鶴鴻鶩嘯集噰噰六甲啓途玉女扶轅億乘萬騎浮空而來傾光回駕御運度生太一直符三元九宮布策推局招搖大神天目飛鳥揆氣推時下臨方外福禍應期執籙把籍齊到帝前隨所應度嚴校諸天普告三界九維八極二十八分所臨邦國兵饑水旱暴卒癘疫祥瑞福應君壽道德合符下上剋制所經三官九府十二河源陰陽氣局內外一千二百度運天界人域主治福禍下逮生民祖考億劫種親福會所臨太一降氣幽爽蒙度冥泉發光疾除罪簿落滅惡根不得拘留逼合鬼羣太一符命時刻升遷迎氣修誦升壇叩靈以祈福應雖植災宮所臨之國至信祈禳則三官鳴軫太一回轅災變爲福享國太平帝夀億年世人命厯所加當爲災害依法祈請天光映身及世長生太一紫宮福及天人至有滅化在貴福之分則北都寒池部衞形魂制魔保舉度品南宮死魂受鍊仙化成人生身受度劫劫長存隨圖輪轉御代直年有知其神身爲仙眞永度三災四殺五鬼六害七傷八難九厄超凌三界逍遙上清上清之天天帝玉眞無色之境梵行東方八天太一所行九宮三十二天九色之氣隨宮灌之三十二天亦九宮之分太一所臨制也學者存思服天氣避害迎福眞氣下降太一來應可致神仙有天下者依爲福之天以祈請奏告神機立應羽眞洞無天帝善契淵空元渚流祺天帝降流明蟄紫度九宮天帝華定膺太𤣥步氣天帝覺除溢生玉籍儲福天帝洞浮左嚴至元增妙天帝律用
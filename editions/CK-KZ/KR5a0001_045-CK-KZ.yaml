body:
  text: 皆作蘂珠含碧温明之玉无有異色眾眞侍座元始天尊𤣥坐空浮九靈夜光萬峰承景瓊臺之上說經一徧諸天大聖同時稱善是時三萬六千山嶽一時開明說經二徧𤣥霜灑空靈芝盤鬱說經三徧祥烟普覆岩竇生香說經四徧世境肅淸山雲吐秀說經五徧龍光照海天寶凝華說經六徧道炁昭蘇羣生怡悅說經七徧鬼魔潜伏瘴癘捐消說經八徧天谷虚𤣥神烟鬱藹說經九徧玉眞俯應妙瑞告𤣥說經十徧化洽窮夷天人稱歎是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一徧東方眞賢世界无極國土解禳山谷瘴癘大神无鞅之眾升空而至說經二徧南方慧觀世界无極國土解禳山谷瘴癘大神无鞅之眾升空而至說經三徧西方定仙世界无極國土解禳山谷瘴癘大神无鞅之眾升空而至說經四徧北方常善世界无極國土解禳山谷瘴癘大神无鞅之眾升空而至說經五徧東北明微世界无極國土解禳山谷瘴癘大神无鞅之眾升空而至說經六徧東南靈德世界无極國土解禳山谷瘴癘大神无鞅之眾升空而至說經七徧西南海靜世界无極國土解禳山谷瘴癘大神无鞅之眾升空而至說經八徧西北元皇世界无極國土解禳山谷瘴癘大神无鞅之眾升空而至說經九徧上方洞虛世界无極國土解禳山谷瘴癘大神无鞅之眾升空而至說經十徧下方通光世界无極國土解禳山谷瘴癘大神无鞅之眾升空而至十徧周竟十方世界无極國土解禳山谷瘴癘大神一時同至一國男女傾心歸仰求請天尊以大慈力普爲下元十方世界无極生類解禳山谷瘴癘保命全形演說普天山嶽洞谷幽墟有諸鬼神藏匿遊泊與諸惡毒御命之眾聚結黨屬施行毒炁瘴癘生民元始神文收攝解除毒害永消是時仙眞來者雲集雨飛駢羅圍繞无鞅之眾迮國一半土皆偏䧟非可禁止於是元始凝眸垂盻遐覽國土緩振玉音徧吿大眾混黃立極萬象同生故有三萬六千天地三萬六千日月又有大三千世界中三千世界小三千世界一一世界各有種類以分族緒三萬六千山谷處諸世界次二萬三千山谷一萬二千山谷一千二百山谷三百六十山谷以爲天地世界瀦澮藪澤山谷之炁化生毒酷醜惡蛇蝮大小之蟲乘其晨炁噓吐成烟毒霧蔽蒙觸冒世間世間男女依近山谷呼吸飲吞納受其邪搆爲瘴癘以至夭傷徧殆境邑我以法慧出示神符解禳之法使世間生民獲養安和修行得道大眾稱讚各願聽聞元始旣興妙教懸一寶珠大如黍米在空𤣥之中去地五丈元始登引天眞大神上聖高尊妙行眞人十方无極世界國土解禳山谷瘴癘大神无鞅數眾俱入寶珠之中天人仰看唯見勃勃從珠口中入旣入珠口不知所在國人廓散地還平正无復欹䧟元始卽於寶珠之內說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂无遺響是時天人遇值經法普得濟度全其本年无有中傷傾土歸仰咸行善心不邪不妄不恣不逸不驕不矜不詭不隨不誑不惑言止湻正體貌雍容齊同安泰異骨成親國安民康欣樂太平經始出教一國以道預有至誠宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是眞王內諱解禳山谷瘴癘百靈之隱名也非世之常辭上聖已成眞人通𤣥究微禁敕山谷行瘴爲癘毒惡鬼神解脫禍因厭禳疾害保濟生民能悉其章誦之十過諸天遙唱北帝設禮鬼神攝毒山谷藏雲瘴癘不行兆民淸安羣魔束形鬼精滅爽囘屍起死白骨成人至學之士誦之十過則五帝侍衞三界稽首魔精喪眼鬼祅滅爽濟度垂死絕而得生所以爾者學士棲眞山谷與道𤣥同不假解禳自无瘴癘若穢氣未消體未洞眞以制十方威未制天政德可伏御地祇束縛魔靈解禳瘴癘存救世人但卻疾而已不能長生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙福慧自然度人无量爲濟物之宗巍巍大範德難可勝道言凡誦是經十過十方解禳山谷瘴癘大神齊到毒惡之炁大小蟲蝮噴吐惡烟染害生民殘傷物命誦此洞文瘴癘消滅十方山谷總屬瘴癘之神有七仙童子奏事童子十二年王七十二候統瘟癘仙師掌病仙母主瘴癘歐陽神君華仙郭師君張師君鍾師君李師君白師君統兵行瘴病鬼帥邵侯欽聞帝勅急爲收攝毒炁山谷惡精解謝積世傳注禳辟災咎立離兆身長生降眞福祿永年淸淨通靈眾神護衞如符所勅病炁蠲釋而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經山谷之邪世間瘟疫不敢爲害神炁充全皆卽受度飛昇南宮世人受誦則延壽長年後皆得作尸解之道魂神蹔滅不經地獄卽得返形遊行太空此經微妙普度无窮一切天人莫不受慶无量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經解禳春夏山谷瘴癘不得染注生人爲上世亡魂斷地逮役度上南宮七月長齋誦詠是經解禳秋行山谷瘴癘不得染注生人身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經解禳冬行山谷瘴癘不得染注生人爲國土帝主安鎭國祚保天長存世世不絶常爲人君安鎭其方民稱太平八節之日誦詠是經解禳時行山谷瘴癘不得染注生人得爲九宮眞人本命之日誦詠是經解禳山谷瘴癘不得於本命刑害衝破死敗之日染傳毒炁殃注兆身魂神澄正萬炁長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上淸道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐靑絳黃三色雲氣之中內外蓊冥有靑龍白虎朱雀𤣥武獅子白鶴羅列左右日月照明洞煥室內解禳大神侍衞畢至項生圓象光映十方如此分明密咒曰無上𤣥元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啟所言今日吉慶長齋淸堂修行至經無量度人願所啟上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始洞𤣥靈寶本章解禳山谷瘴癘妙品十方度人勅魔隱韻冥合自然眞炁妙祖虛无上𤣥元始之炁寶液凝華植立天地山嶽洞宮棲烈萬神握御元綱經營造化順育生靈陰陽乖沴生積妖雲毒精結體以造魔羣蚖蛇巨蝮癘鬼之精八山四嶽隱穴幽墟乘其正炁騰化邪氛肆其酷毒傷害黎民爲瘴爲癘无以蕩除靈寶上道洞𤣥眞文攝召統制永保肅淸无文不光无文不明无文不立无文不成无文不度无文不生是爲大梵神妙之機鬱羅蕭臺玉山上京上極无上大羅玉淸渺渺劫刃若亡若存三華離便大有妙庭金闕玉房森羅淨霐斡旋大紐範圍十方中有解禳山谷瘴癘之神中有清淨萬福天君中有衞世吉祥大神中有无極保命丈人中有南上蕩妖滅注延壽益算度厄尊神迴骸起死无量度人今日校錄諸天臨軒東方无極攝毒神王長生大聖无量度人南方无極葆眞神王長生大聖无量度人西方无極破邪神王長生大聖无量度人北方无極靜天神王長生大聖无量度人東北无極辟禍神王長生大聖无量度人東南无極祛瘴神王長生大聖无量度人西南无極消癘神王長生大聖无量度人西北无極制妖神王長生大聖无量度人上方无極固命神王長生大聖无量度人下方无極護身神王長生大聖无量度人十方解禳山谷瘴癘神王長生度世无量大神並乘寶雲紫琳玉輦碧鳳神輿縟幰雕輪驂駕𤣥虎五色黃龍建九天之節八素靈幡前嘯洞章齊唱後歌隱韻同音獅子白鶴嘯歌嗈嗈仙卿啟途五老翼轅億乘萬騎浮空而來傾光囘駕監眞度世九地土皇五嶽上公九州社令四瀆神王解禳瘴癘疾厄大神執籙把籍齊到帝前隨所應度嚴校諸天普吿三界无極神鄉山谷之府四面八方三萬六千大小之山潛穴幽谷岩壑溪源上解鬱伏五行不正之炁寒温乖沴之邪遘合鬼異蒸發雲烟隨人呼吸傷害間關外薄肌膚侵擾內眞寒如冰凛熱如火燔形負萬苦神意哀𡨚急爲禳除速付三官不得怠縱逼合生靈元始符命敢有稽延天師將吏部衞形魂勿使惡毒枉致暴殘普世蒙惠福慶自然生身受度劫劫長存永无災患與天齊年過度三災五苦八難超凌三界逍遙上淸上淸之天天帝𤣥眞无色之境梵行東方八天螭明通化天帝景齊文普曜絕眞天帝昌嘉久隆生開悅感思皇天帝曜正尊洞空濟澤昭隨天帝驕持屍危奔中理神淨化天帝論祁允多虛德紀章天帝保眞自宜道思欵𤣥天帝覺子湘獻迪蒙示天帝伯越師昂南方八天玉除正强天帝班何子卿果寂思微天帝道伯靈都璣明𤣥講化天帝玉賢公梁章化夷德天帝滋季師明慧觀曜空天帝勅雷九莊太微妙宗極義天帝延岐保靈端靖存華天帝尚孝恭仙厯總眞平功天帝仲玦宜坤西方八天濬𤣥眞和天帝黃聿慈太上變炁天帝諒伯上𤣥辭化舉仙天帝千梁曜角道生光天帝湛扄羅强梵寶招靈用修天帝確覺眞鬱淵景慶天帝鎭微次霞叢陽絳英天帝高𤣥陽瓊度力房天帝正虞兆先北方八天𤣥靈七眞天帝班序正析慶𤣥宛縮天帝魯方躋騫校靈議湻天帝澤路龍符斗籍變魂升眞天帝優管黨無保仙順解理明天帝混道開初皇元首玉機天帝賢資漸容八道隱𤣥藏微天帝朝侯左還太素龍景逸王天帝烈修洞休三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻天中之音天中之尊天中之神天中大魔天中之靈九和十合變化上淸无量之奥深不可詳敷落神眞普度天人今日解禳瘴癘擒攝妖氛請消殃怪誅伐禍根削除疾橫上奏玉𤣥眞王護度塞絶死門東皇馘毒西帝錄精北君淨穢南眞衞形中皇太一司領化權調運正炁蕩辟魔烟靑帝布和白帝安肅赤帝激𤆌黑帝潤澤黃帝總生无令夭閼靑山魔王拘飛運格赤山魔王擊殃禦惡白山魔王鋒揮巨勃黑山魔王撫烈捍㦸黃山魔王董威利翼五山大魔攝毒之神各司將吏億萬之兵操戈揚麾祛掃不祥拱輔𤣥化與道齊功上天度人奕闡眞風神姦不作妙化澄淸萬種孽類肅殺成塵黑溪曠野下逮幽陰夔魖魑魅血食之賓奮鼓祅力乘負邪津流鈴震腦金鉞戮形元始告命敢有稽停癘魔喪迹瘴毒滅氛三官北酆明檢鬼營不得容隱金馬驛呈普告无窮萬神咸聽三界五帝列言上淸辟山谷瘴癘佩帶符絳囊盛朱書白素上男女大小通用朱書辟山谷瘴癘貼臥處朱書辟山谷瘴癘作小丸煎桃柳湯望東南吞服日三次病寒燒灰服朱書辟山谷瘴癘解穢符安水盂中天元之始萬刼之先渺渺祖刼混沌𤣥黃凝精結育融植乾坤陰陽升降四序推行中有沴炁化成毒精毒精之母號曰柏仙噓炁焦木吸潤枯泉造爲瘴癘冥晦遊天形爲莽鳥九頭相連聲如啼呱周行八山人觸其形病注羸孱天寶妙帝鎭伏邪源號曰赤靈被丹巾金威用无邊救護世人摧敗强𦍙召迎冲炁安輯元元太平開圖運度自然元始安鎭敷落五篇赤書玉字八威龍文保制病魔使命長存封山禁谷瘴癘不生梵炁彌羅萬範開張元綱流演三十二天輪轉无色周囘十方旋鬼厯心迴度八山三十六洞總炁上元八景冥合炁入三𤣥𤣥中太皇上帝高眞汎景紫雲嘯詠洞章金眞朗郁流響雲營玉符攝炁徊風聚烟紫虛鬱秀輔翼萬仙巨山神獸金虎玃天啖食瘴癘冲和自然天地康泰和合歸眞眞中有神靑華帝君太始靑炁來降下元兆民長生病无毒艱仙卿輔相眞妃侍軒叔火𤣥父擁衞華晨執符把籙保命生根上遊上淸出入雲房八冥之內細微之中下鎭人身泥丸絳宮中理五炁混合百神十轉囘靈萬炁齊仙仙道貴生无量度人地戸天門日車月輪隨道正炁救病得生山谷惡注禳解永蠲保度得生上聞諸天諸天之上各有生門中有空洞謠歌之章眞王靈篇妙化玉文第一解禳山谷瘴癘之音高上眇眇神用无涯御正炁兮蠲蕩百邪正炁衞生邪正酷殘魔毒旣滅迹怪孽熄其源妖氛害我眞乖沴相纏綿消魔玉淸王妙範卻百痾靈音鎭山岳琅琅招太和散攝禍根源瘴癘亦无餘噫嗟爾兆身未識𤣥中歌夭橫喪其軀哀𡨚將奈何不遇空洞音焉能脫世羅第二解禳靈感之章四炁无騫萬禍滅連瘴癘毒妖鬼莽邪烟神符驅甸威虛輝煌諸天大聖總御騰驤握鈴儀節掃絕不祥肅淸十界氛穢除蠲遠殃疾子安泰自然身度此難无量𤣥恩此其樂兮賴我生存和炁蕩蕩與道合眞靈寶上法元始玉文无所不禳无所不解保度无窮爲世津梁恐爾未悟設此歌章第三解禳降眞招靈歌曰朗朗高晨煥耀玉都布令千眞緫統萬魔神金虛章制召眾靈部衞世化闡我明科有崇我教遂保長年災橫莫干宴眄无虞上聖哀憐出此玉書消除苦毒我道不愆正道好生邪道夭殘遵我正道以合我眞正道常固疾禍无侵若不知此道何以感百神神威鎭八方上德長日新此三界之上飛空之中眞王歌音音參洞章誦之百遍瘴孽消除誦之千遍邪癘不生萬遍道備普護長年過度三界位列仙眞有聞靈音五嶽衞形敕制地祇侍衞送迎拔出禍難解禳不祥七祖升遷永離北山魂度朱陵受鍊更生是謂无量普度无窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈眞王隱祕之音解禳山谷之邪合雜鬼神異惡蟲蠆四時不常之炁以爲瘴癘輕病一家重疫一鄉州城聚落以至天下上聖哀憫出顯符章解禳之法救護生民皆是大梵之言非世上常辭言无韻麗曲无華宛故謂𤣥奥難可尋詳上天所寶祕於神霄玉淸王府東華經室歳厯壬辰應運下傳若有至人齎金寶質心依舊格告盟眞王然後而付焉道言夫山谷之炁險易不同高下不等寒濕不均炁之所至先後不時高則多寒下則多濕温蟲不蟄流水不冰毒蛇異物乘炁鼓邪金石燥濕鬱蒸成煙游魂癘鬼浮行其間觸冒生人以爲疾患上聖神人示以解禳二法若病炁方熾井邑流行則宜淨心修齋行香服佩符章以解之又以朱書大梵隱語燒灰著淸水之中徧令飮之无不甯息若歳炁失宜或涉履山谷預爲禳備之法則於所居之方爲壇醮祭十二年王山谷行病五方天使邵侯神君內外施符五方安瓶以桃柳香艾竹葉煎水貯於缾內大小隨時飮之或以沐浴又以大梵隱文朱書隨方安之卽瘴癘消散鄕邑乂安六時行香十徧轉經福德立降消諸不祥无量之文普度无窮道言夫末學道淺或仙品未充誤遘瘴癘失於解禳運應滅度身經太陰臨過之時同學至人爲其行香誦經十過以度屍形如法魂神逕上南宮隨其學功計日而得更生轉輪不惑便得神仙道言夫陰陽乖否亦當修齋行香誦經瘴癘爲愆疫毒流行亦當修齋行香誦經妖靈肆酷擾害生民亦當修齋行香誦經破除陰怪侵犯正眞亦當修齋行香誦經召集吉祥安鎭家門亦當修齋行香誦經夫齋戒誦經功德甚重上消天災下禳毒害以度兆民生死受賴其福難勝故曰无量普度天人道言凡有是經能爲一切兆民行是功德有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衞右別至人尅得爲聖君金闕之臣諸天記人功過毫分无失天中眞王亦保舉爾身得道者乃當洞明至言也東方八天桓精山佳鵰雲穴貍董猫虺蛛殺眞乾雷桃鬼枯柳月芝渠師遁寂胡蝣馬符螋非剪沙巖畜虎蜒流丹土蚿罔剛遙文敕馗化感夢仙趙邵𦁕靈氣淘海區性遂時凝南方八天社侯伯元南府三師勉凶移毒老父溪龍崿銁璉俞佐閑池蒙攝命符令轉火奔風屍牢鎖伏太空極雄依出恍成化石廣功操枝運靈察景殺童道遊天霞敕岸已舂西方八天崔杜監驅急攝縞女秦蘭丙垂幽寶竟東育典秋堲欽持決容茂果逸囘汶靈褒中馬𤣥離逐雲鄉耿漢殿合建孤明敏神昆盧蒼機淪藻品昧靜獨荒詛走阮夷陵北方八天眞勃陀婁燄珠擎門左太皇扆牛奎浮瓊去害子仙羅聦變𤣥波霽兖石何庚窈宣司饑鄭侯錄剌捦修泉合洞誐赤天瀛由定驛遣毒斬截橫鉤犯洛憂明酆官蟬旒道言此諸天中大梵隱語无量之音舊文刻書閬風𤣥臺以卻萬惡不惟解禳山谷瘴癘一切邪病鬼神爲害依法敕之无不立驗字皆廣長一丈天眞皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣十方神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門流傳此經普救世人治病除邪消卻禍災大勳眞王保舉上淸道備尅得遊行三界升入金門此音

凶種種刑害是致呼魂之聲趣死之哀不絕於耳覩此厄害身縈災疾我今欲下彼天說度人法汝以挺生空洞乘此天位未明至道微妙大法吾以妙无天帝出生三氣三寶天君造立混沌分別萬天使帝闕列峙億眞翔集三萬六千日月一時同明吾以是也吾下化爲玉宸大混居紫玉寶闕華蓋之下紫微垣中號北極大帝龍衣𤣥服垂絛大弁左右十二元士雷公霹靂居其傍三十六將衞其後五帥四德導其前赤明開圖之初爲上淸神公開皇之後爲北陰大帝平定功成位居中天紫極之庭十方世界望之不動謂之辰樞者是也然有形皆動惟無形不動北極星與羣星相遠三度有奇而中空者北辰上帝眞形也望之炯炯五星煇映熒熒有光者帝座也但可見座豈可遽謁其帝也此北極大帝總制三界星宿鬼神萬神千靈莫不叩頭請命五嶽四瀆山川之神皆再拜伏候乞請水旱風雨北極是吾第五化身位居皇極正統玉帝爲祖立太空之元在九宮則號中黃太一衣紫錦袍腰十二流金火鈴狀如嬰兒手把七元口吐靑色今居天中蔭華蓋乘斗車履三台席大角坐明堂左右七人服紫繡者北斗七星之精也汝宜往彼請下天中論說法要開度天人天帝聞是說已整冠執圭再拜臣今上請北極帝君降此天宮願聞大法乃與天眾辭禮元始下詣中黃紫庭華宸玉闕之下眞官導前執法從後徑達北極大帝御前具陳上事再拜作禮辭懇志切涕泗交下帝君被𤣥龍之服以降言曰吾上爲元始天尊敷揚至教當允斯請於是天帝垂光俯眄北淸𤣥靈太虛無上常容天中寶闕之內三氣寶明之殿將昇法座當說是經周迴十過以召十方始當詣座五天大神七元眞君上聖高尊太虛眞人無鞅數眾乘空而來彩霞亘虛雲光四布瓊臺鳳駕羽節金幢雜色寶蘊蓊曖鬱勃洞煥太無七日七夜諸天神眞日月飛仙星眞雲將璇綱玉緯一時停輪剛風啟韻豁落流光山川林木緬同玉色土變碧璃柔明瑩潤眾眞侍座北極帝君先嚮玉京心拜元始至恭修敬乃登𤣥空浮光五色龍臺之座說經一遍諸天大聖同時稱善是時一國男女皆聽北極帝君宣標𤣥旨无量度人七星除祅最上法要說經二遍七星明曜𤣥符見空說經三遍巨斧钁天山開石裂說經四遍乾坤交泰四海澄源說經五遍僊樂滿空靈香遠馥說經六遍天虹周遍跨空成橋說經七遍七眞下觀魔精喪膽說經八遍鬼帝驚逃萬魔摧伏說經九遍天垂甘露珠璣散飄說經十遍鬼神悟道幽品登僊是時一國是男是女莫不傾心皆受護度咸得長生道言是時北極帝君說經一遍東方无極无量品天斗七星除祅大神无鞅之眾浮空而至說經二遍南方无極无量品人斗七星除祅大神无鞅之眾浮空而至說經三遍西方无極无量品地斗七星除祅大神无鞅之眾浮空而至說經四遍北方无極无量品陰斗七星除祅大神无鞅之眾浮空而至說經五遍東北无極无量品鬼斗七星除祅大神无鞅之眾浮空而至說經六遍東南无極无量品陽斗七星除祅大神无鞅之眾浮空而至說經七遍西南无極无量品遁斗七星除祅大神无鞅之眾浮空而至說經八遍西北无極无量品升斗七星除祅大神无鞅之眾浮空而至說經九遍上方无極无量品飛斗七星除祅大神无鞅之眾浮空而至說經十遍下方无極无量品降斗七星除祅大神无鞅之眾浮空而至十遍周竟十方无極天眞制魔除祅大神一時同至一國男女傾心歸仰來者各各發心願除累刼以來心不正眞穢念充塞三尸遊蕩七魄妬害交通鬼氣及諸魔類使有法病見道不明雖處人天墮入流轉乃至證位諸地暫登眞階以魔精入心祅試惑亂念動塵起支緣傍對起无量因作百千業今聞北極大帝宣說七星除祅拔邪護正之法開迷翳眼蹈𤣥淸路趣高眞品慚愧頂禮无鞅數眾佇立傾聽於是北極仰天俯地觀察萬彚運无量心啟靈寶慧普告大眾元始未生曠刼無跡混沌旣坼七竅乃張大爲日月細爲星辰日月五星總號七元而配屬北斗北斗十二星五星爲隱曜斗口之中有天一太一二十四玉皇光芒不顯惟七曜大明彰示萬方七星之精在人七竅亦分其神能視聽言齅知識悉皆由也輔弼二星之精分降爲目中瞳子七星之神有陰魄陽魂及正星之神斗中除祅之神有五帥四德七千神將天罡河魁大殺大角豁落立斗黑衣𤣥冥七殺之神以滅除凶祅蕩逐魔鬼兆能齊心修齋服佩符籙奏告懇祝則七星大神下降兆所立除祅害有能稽索道要勤企上淸七星之神教兆上道飛昇神仙七祖升度鍊化自然七星之精三辰五斗九宮八卦之妙皆在於是聖人之心七星降神華房之內方寸七室微妙祕諱不可宣泄已登上眞後復爲此北極卽於法會之中說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷七星垂光光映眞形內生𤣥丹外除祅精傾土歸仰奉教遵行除魔除幻除妄除想除愛除有除見除得除疑除邪言中天律口無非聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言北極帝君說經中所言並是七星天中列帝內名隱韻之音亦是北帝內諱百神之隱名也非世之常辭上聖已成眞人通𤣥究微能悉其章誦之十過八威揚兵五天擲火魔王警陣星使騁軒甲卒億萬斬邪除祅燒霞燎空金鉞寫光羣魔束形鬼精滅爽囘屍起死白骨成人至學之士誦之十過則七元降眞三界稽首魔精喪眼鬼祅滅爽濟度垂死絕而得生所以爾者學士欽詠洞章斗元布氣殺伐祅祥掃蕩穢氣體將洞眞召制十方威未制天政德可服御地祇束縛魔靈但卻死而已不能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過斗中天騶七星大神天帝使者齊到爲兆除祅驅斷不祥億曾萬祖幽魂苦爽皆卽受度上升朱宮格皆九年受化更生得爲貴人以誦詠此經身神明正氣無陳故則𤣥堂啟關魂爽超越不拘冥昧而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經七眞登房妙極空常往返三周履星蹈綱漱雲嚥液魂魄俱翔變化上淸壽與天長皆卽受度飛升南宮世人受誦拱侍北辰坐致神女風送雨迎左據𩵄魒右揖䰢魁六丁輔兆捕鬼搜尸則延壽長年後皆得作屍解之道魂神暫滅不經地獄卽得返形遊行太空此經微妙普度無窮一切天人莫不受慶无量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經七星眞君開北𤣥之籙校別罪魂斗中司命鍊七星之光導引冥靈爲上世亡魂斷地逮役度上南宮七月長齋誦詠是經七星魁宮之氣紫光如絃灌兆泥丸星中大神七人扶胥兆身遊行斗關身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經斗中天皇手把七星爲兆除祅赤帝黃老與兆陶魂同蔭華宸坐卧七星星精入腦眞火鍊形泥丸紫君厥諱規英金床玉帳紫繡錦裙腰帶火鈴除祅滅精福慶自生位極人臣爲國王帝主君臣父子安鎭國祚保天長存世世不絕常爲人君安鎭其方民稱太平八節之日誦詠是經七星光色連布八方北帝位中九宮齊同一白二黑貪巨爓空下代鬼祖斷遏衰凶得爲九宮眞人本命之日誦詠是經子魁午魊丑未二宮下臨生位七星迴陽延兆天年賜夀無疆魂神澄正萬氣長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上淸道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐紫靑絳三色雲氣之中內外蓊冥七星覆頭五藏眞氣繞絡身相脾生黃氣出頂成雲存見北極金容天馬千萬靑龍白虎朱雀𤣥武獅子白鶴羅列左右日月照明洞煥室內項生圓象光映十方如此分明密咒曰无上𤣥元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啟所言今日吉慶長齋淸堂修行至經无量度人願所啟上徹徑俓御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始洞𤣥靈寶本章七星除祅元綱度人天關運斡離合自然天有三魂二景含晶天有七魄七曜流精華蓋曲直三五飛昇紫雲爲關綠煙蒙蒙中有北極金城九重山環峰列𤣥草垂茸洞戸鬱杳淸虛八通頭建魁剛足履𤣥龍手揮碧霞鳴玉叩鍾天丁九首四目老翁秉仗金鉞息滅祅凶璇珠爲樞運機惟空眞道自然光泛九宮立斗大神霹靂靊眇莽九醜衣斗乘風吐毒噴火衞世無窮鬼爽竄伏神府靈明靑氣灌滌混合百神金闕玉房赤鏡飛光流雲萬丈周遍八冥中有七星除祅之神中有天猷紫極之尊中有景霄大帝之眞中有天丁縛龍大神中有𤣥天黑殺四德五帥之君中有天蓬威化𤣥曜眞君中有太元眞紐綱紀關七星尊神迴骸起死无量度人今日校錄諸天臨軒東方无極星符神王長生大聖无量度人南方无極星殺神王長生大聖无量度人西方无極星氣神王長生大聖无量度人北方无極星台神王長生大聖无量度人東北无極星藏神王長生大聖无量度人東南无極星使神王長生大聖无量度人西南无極星河神王長生大聖无量度人西北无極星令神王長生大聖无量度人上方无極星威神王長生大聖无量度人下方无極星根神王長生大聖无量度人十方至眞七星除祅神王長生度世无量大神並乘七星燿羅之雲八色光明之輦天馬爲馭辟非驂羣六甲備駕天丁揚威徘徊丹霞翺翔胎僊建翠旄之節流光靈幡前嘯紫鳳齊唱後從𤣥獸同鳴獅子白鶴嘯歌噰噰天一啟途神兵翼轅億乘萬騎浮空而來傾光迴駕監眞度生星宮丞相九霄上宮天英主錄元斗大神執籙把籍齊到帝前隨所應度嚴校諸天七星寶宮七元眞君帶月引日龍巾虎裙蒼舌虎賁北極神君赤書火

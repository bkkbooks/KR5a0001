front:
  text: 重刋道藏輯要元始无量度人上品妙經卷之三十六
  hash: sha256:db0e8f3dfa56725c76faea21427e46e45a418760c55ad0a559f473fa2ba3edc9
body:
  text: 道言昔於朱陽天中𤣥極靈歌太融昌土受元始度人八景神合无量上品元始天尊當說是經週囘十過以召十方始當詣座天眞大神上聖高尊妙行眞人三元八景大神无鞅數眾乘空而來靈雲敷華寶輿玉軿紫蓋扶蔭神境同光瑞色交朗八道煥明七日七夜諸天八景合映自然千神萬靈冥洞一氣混化同輪一國地土山川林木煒燿齊鮮高下彌漫坦平一等土皆浮異彩纏羅之色眾眞侍座元始天尊𤣥坐空浮萬氣穹窿洞景瓊臺之上說經一遍諸天大聖同時稱善是時一國男女欲念永獲斷除說經二遍達悟至眞說經三遍識用通𤣥說經四遍妙和元氣一合其形說經五遍神精凝粹保鎭軀靈說經六遍萬神結華與身齊并說經七遍三宮帝尊朝集神眞說經八遍百關固密宮府相連死戸塞絕斷滅胞根說經九遍三部開朗八景齊歸說經十遍神明洞合舉形飛仙是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方无極无量品至眞靑景大神无鞅之眾浮空而至說經二遍南方无極无量品至眞丹景大神无鞅之眾浮空而至說經三遍西方无極无量品至眞素景大神无鞅之眾浮空而至說經四遍北方无極无量品至眞𤣥景大神无鞅之眾浮空而至說經五遍東北无極无量品至眞生景大神无鞅之眾浮空而至說經六遍東南无極无量品至眞明景大神无鞅之眾浮空而至說經七遍西南无極无量品至眞華景大神无鞅之眾浮空而至說經八遍西北无極无量品至眞幽景大神无鞅之眾浮空而至說經九遍上方无極无量品至眞合景大神无鞅之眾浮空而至說經十遍下方无極无量品至眞化景大神无鞅之眾浮空而至十遍周竟十方无極天眞八景大神一時同至一國男女傾心歸仰欣躍而言我等各以善因或從道業證遇福緣得居此天獲覩天尊說此八景神合之法上眞至化之道非我眾等素所知聞今當聞者必獲位進上眞備契𤣥理而我等昔來未聞此道不識八景神合之妙豈能超合混元大道之宗於是來詣天尊請聞至教有如細雨密霧无鞅之眾迮國一半土皆偏陷非可禁止是時元始天尊周覽十方垂顏凝顧揮五明羽扇徐啟玉音彰明法要開顯太極一氣分化判爲三辰離爲八景八景者八方光景自然之神也天之八景有三部以隸三元人之八景有三部以隸三闗故三部八景二十四眞爲上道之高靈修用其道使八景之氣與已神合則混合百神聚爲帝一散爲千眞立成高仙也天之八景上元八景在玉京蕭臺中元八景在太微紫宮下元八景在崑崙之室人之八景上合泥丸中合絳宮下合丹田各有名字大小服色所居之處能招天景以合人神八景之靈混與神合則爲高眞矣其旨要𤣥妙虛明洞徹淸靜明照專此八事而修此道無不克臻此八者八景之德性也兆知勤此陽精八景眞神之道則八景之神自降於子授子洞𤣥長生之眞仙矣大眾於時聞是語已再拜稽首願盡至言以教未悟今日慶幸獲聞妙法波我沈瞶三請不止於是元始化一元精狀如朱日寶華熠燿在空𤣥之中去地九丈元始登引天眞大神上聖高尊妙行眞人十方无極八景大神无鞅數眾俱入朱日之中天人仰看惟見勃勃從寶華中入旣入其中不知所在國人廓散地還平正無復欹䧟元始卽於日華之內說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸行妙心合道合虛合无合神合明合景合照合淸合𤣥合妙情無妄僞性備天眞齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是三部八景內諱百靈之隱名也非世之常辭兆能長齋修誦八景神合與天爲一七世滅殃胞戸閉塞上聖已成眞人通𤣥究微能悉其章誦之十過諸天遥唱萬帝設禮心源澄寂害氣消沉洞合八景神眞內盈羣魔束形鬼精滅爽迴屍起死白骨成人至學之士誦之十過則八景挾衞三元稽首魔精喪眼鬼祅滅爽濟度垂死絕而得生所以爾者學士穢氣未消體未洞眞存召八景功未克全天政德可伏除魔試卻滅災患但不死而已不能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過八景齊降殃注斷滅億曾萬祖幽魂苦爽皆卽受度上升朱宮格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經智慧開明含光育英八景神合道契𤣥庭皆卽受度飛昇南宮世人受誦則身中八景固律死門天中八景下合兆形神景齊會得道成眞延壽長年後皆得作飛升之道魂神變鍊不經地獄哀惱常保孩嬰遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役幽官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經上部八景降兆神庭泥丸𤣥堂七祖超遷度上南宮七月長齋誦詠是經中部八景與兆合并黃元混一天地同靈身得神仙諸天書名靑籙紫簡舉形飛仙十月長齋誦詠是經下部八景固兆生根眞精鍊化萬炁結神儛輪太霄遨遊上淸億世含歡浩劫齊齡八節之日誦詠是經八景神合超登玉京得爲一淸眞人本命之日誦詠是經三部八景二十四眞混變嬰兒錦衣繡裙列坐泥丸身宮之中魂神澄正萬炁長存百關受鍊身有光明三界侍衞五帝司迎萬神朝禮書名上天功滿德就飛昇上淸道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐八色雲氣之中內外蓊冥有靑龍白虎朱雀𤣥武獅子白鶴羅列左右二十四眞來到兆前日月照明洞煥室內項生圓象光映十方如此分明密咒曰無上𤣥元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啟所言今日吉慶長齋淸堂修行至經无量度人願所啟上徹徑御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始洞𤣥靈寶本章八景神合上品妙首十囘度人八景隱韻離合自然帝氣元眞幽寥高宸冥漠之始空洞靈宗分化結形敷鎭百關三宮布列纏絡迴環混變上境合鍊精根無神不光無神不明無神不立無神不成無神不度無神不生是謂妙極天中之尊玉闕明堂流珠𤣥丹上衝華極巍峩崑崙紫文纏羅煇煥交騰下通中黃絳宮之門臍元幽室瓊房之田八景神氣周用迴旋中有三部八景二十四眞之神中有虛明通徹淸靜光照之君中有南極長生大帝君中有東極靑華帝君中有度世司馬大神中有好生韓君丈人中有南上司命司錄延壽益算度厄尊神迴骸起死無量度人今日校錄諸天臨軒東方无極一景天虛神王長生大聖无量度人南方无極二景天印神王長生大聖无量度人西方无極三景天曜神王長生大聖无量度人北方无極四景天𤣥神王長生大聖无量度人東北无極五景天符神王長生大聖无量度人東南无極六景天光神王長生大聖无量度人西南无極七景天姥神王長生大聖无量度人西北无極八景天眞神王長生大聖无量度人上方无極三部總眞天慧神王長生大聖无量度人下方无極三部神合天順神王長生大聖无量度人十方至眞三部八景神王長生度世无量大神並乘華雲流霄寶輿玉駢紫蓋霞輪驂駕素靈神虎蒼精妙龍建𤣥元之節洞景朱旛前詠三辰華曲後參五曜眞歌靑鸞翠鳳鳴嘯相和高仙啟塗玉女翼轅億乘萬騎浮空駕虛傾光迴駕混合人身元皇太一洞房𤣥宮左持五籍右秉五符三迴九轉洞化冥无隨景應召開朗八區凝和結氣高超太无大魔保舉天皇授書普告十極洞府神君開釋祖考億刼沉魂脫除罪籍散落禍根敢有停滯烈火蕩焚身旣升度上及億曾永出夜庭復備形魂普受鍊化度品南宮朱陽紀錄仙化成人生身受度刼刼長存隨刼流轉與天齊年永度三塗五苦八難超凌三界逍遥上淸上淸之天天帝洞昌無色之境梵行東方八天翼眞元慈天帝經角司神洞靈開濟天帝恬淵景虛昭素欽宗天帝慶嘉盡𤣥輔元敢需天帝大極右扶玉履羲常天帝生功被蒼神德仰眞天帝逸車婁𤣥皇度禮方天帝善囘夷陽生幟摽陽天帝主靈達華南方八天玉厯紀功天帝道忻致登雲韜素書天帝七皐無阿八眞淸明景合天帝孝儀奉仙化及冲要天帝烈常希眞赫丹保年天帝妙氣承隅洞廬朝皇天帝絜維志聰拔辠濟靈天帝開明度生璇芳助月天帝蒲都斗皇西方八天會氣集景天帝昆堂抱思朝祖欽元天帝越康子明擲干起威天帝運明宥初奮容束魔天帝敕契頗庸受嚴持福天帝覺育自中宣道招靈天帝遜佑孚成啟極司化天帝章瑶兌梵廣審淸天帝寅熙融神北方八天披眞恭慶天帝昊蕭紫琚錫離崇用天帝鐸時勤應化成功天帝渝塘雲翻壁躔納靈天帝魂度九王析梁緒明天帝仲方奇海暎龍剛天帝蒙長生星井珞璣天帝厯陁麗寗八神合景天帝馘化曜靈三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻八景之音八景之尊八景之神八景眞王八景之靈八景神合變化上淸无量之奧深不可詳敷落神眞普度天人今日欣慶受度神境爲一湛湛眞元守而勿疑位登高仙金顏玉葳虛微不窒明識無虧通導不壅徹運忘機淸無滯濁淨無穢氛光華煇朗照寂自然神有八道合此八關結化爲形錦帶龍衣神化純妙逍遥玉階受職東華制命三官永滅眾惡斬絕胎根塞斷死戸名列太𤣥三省監舉有無留難東斗主算西斗記名北斗落死南斗上生中斗大魁總監眾靈靑帝護魂洞景致眞白帝侍魄華景安宅赤帝養氣元景受明黑帝通血慧景朗徹黃帝中主合景備列靑天眞王靑景化神赤天眞王丹景曜明白天眞王素景混靈黑天眞王𤣥景靜深黃天眞王八景齊輪五天眞王萬神之宗飛行鼓從總領神兵麾幢鼓節遊觀太空自號赫奕諸天齊功上天度人嚴攝北酆神王受命普掃不祥神龍攝毒天馬四張辟非前驅天將持幢擲火萬里流鈴八衝敢有干試拒遏上眞金鉞前戮玉斧後刑屠割鬼爽風火無停千千截首萬萬翦形魔無干犯鬼無祅精三官北酆明檢鬼營不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列言上淸眞皇玉訣𤣥化混冥斡旋妙氣杳藹之中上景非色下景非淵中景太虛冥合自然八景神合金剛乘天天上天下無幽無冥無形無影無極無窮二十四眞周環列宮天地始成神帝隱龍溟涬大梵遼廓無光八景開圖三部敷張元始安鎭敷落五篇赤書玉字八威龍文保制刼運使身長存梵氣彌羅萬範開張元綱流演三十二天輪轉無色周囘十方旋斗厯箕回度五常三十五分總氣上元八景神合氣入𤣥𤣥𤣥中太皇上帝高眞汎景太霞嘯詠洞章金眞朗郁流響雲營玉音攝氣靈風聚煙紫虛鬱秀輔翼萬仙千和萬合自然成眞眞中有神八景玉𤣥神景之尊長生大君無英公子白元尊神太一司命桃康合延執符把籙保命生根上遊上淸出入華房八景之內細微之中下鎭人身泥丸絳宮中理五炁混合百神十轉迴靈萬氣齊仙仙道貴生无量度人八景飛神過度輪轉罪福禁戒宿命因緣普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有空洞謠歌之章八景靈篇辭參高眞第一八景神合飛空之音天有三元氣人有三部關二十四眞神紫戸連靑扉上部有八景四景居泥丸又復四境居在
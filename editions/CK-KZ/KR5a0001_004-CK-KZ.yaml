front:
  text: 元始无量度人上品妙經卷之四
  hash: sha256:7401b2f02b5d20e2981929a15bf9368c43696513c619a52e0291b16a37711665
body:
  text: 道言昔於皇靈天中妙化飛音大黎樂土受元始度人永延劫運保世升平无量上品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖高尊妙行眞人無鞅數眾乘空而來瑞彩瀰漫靈香飛空龍車紫蓋交映拱扶流霞煇煥洞朗萬天九日九夜諸天浮蓋圓象森羅樞斗一時停機二景合光八極廓清湛然澄瑩一國山林川澤淵藪緬平蔚薈無不華明土皆作柔玉光照凝鮮無有異色眾眞侍座元始天尊𤣥坐太空九色𤣥龍寶局之上說經一徧諸天大聖同時稱善萬物民人咸皆遂性說經二徧物無札癘民息憂虞說經三徧人安其化無所爭求說經四徧時稱豐樂不識災凶說經五徧萬方率服遐邇同風說經六徧禽魚胎卵各保生成說經七徧麟鳳來儀天地應祥說經八徧至德熙洽民物還湻說經九徧國君王侯永保世續說經十徧普天率土咸證道妙是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一徧東方无極无量品延劫保世至眞大神無鞅之眾浮空而至說經二徧南方无極无量品延劫保世至眞大神無鞅之眾浮空而至說經三徧西方无極无量品延劫保世至眞大神無鞅之眾浮空而至說經四徧北方无極无量品延劫保世至眞大神無鞅之眾浮空而至說經五徧東北无極无量品延劫保世至眞大神無鞅之眾浮空而至說經六徧東南无極无量品延劫保世至眞大神無鞅之眾浮空而至說經七徧西南无極无量品延劫保世至眞大神無鞅之眾浮空而至說經八徧西北无極无量品延劫保世至眞大神無鞅之眾浮空而至說經九徧上方无極无量品延劫保世至眞大神無鞅之眾浮空而至說經十徧下方无極无量品延劫保世至眞大神無鞅之眾浮空而至十徧周竟十方无極天眞大神一時同至一國男女傾心歸仰來者萬億普徧方土咸皆欣願來詣天尊觀聽上法洞達妙無劫運綿長保世升平萬國歸依天人和同無鞅之眾迮國一半土皆偏陷非可禁止於是元始凝目斂神飛出妙氣結爲圓光大如赤日在空𤣥之中去地九丈元始登引天眞大神上聖高尊妙行眞人十方无極至眞大神無鞅數眾俱入圓光之內天人仰看惟見拂拂從光明中入旣入圓光不知所在國人廓散地還平正無復欹陷元始卽於圓光之內說經都竟眾眞監度以授於我當此之時延度劫數保世升平福德無量道法自然萬彙樂育喜慶難言法事粗悉諸天復位倐歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸契大道無夭無閼無患無殃無爭無擾無惡無邪無偏無黨意無貪欲心無怨憎齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬永延劫運道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是魔王內諱百靈之隱名也皆至道之神機天地之密文可以永延大小劫運保世升平帝享萬厯民物咸亨非世之常辭上聖已成眞人通𤣥究微能悉其章誦之十過天地合泰運度無愆三災消革五氣常平善瑞咸瑧帝祚綿昌至學之士誦之十過則身躬永固命運長延保世億齡感眞致仙濟度垂死絕而得生所以爾者學士道氣未純體未合靈召制十方威未制天政德可伏御地祇延度災衰但卻死而已不能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京保延无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到推延妙氣制水伏火不得淩犯劫運永長無有時災永保升平凡學至經功滿德就皆能保衞成其至治欣樂年豐也上學之士修誦是經外保六合內保一身內外一理同獲永延小大蒙福幽顯被恩此經微妙保衞無窮一切天人莫不受慶无量之福萬劫蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經厯劫萬世數會無窮道化長存七月長齋誦詠是經消除乖沴召致福祥十月長齋誦詠是經爲國王帝主君臣父子安鎭國祚保天長存世世不絕常爲人君安鎭其方民稱太平八節之日誦詠是經永延劫運保世升平身受道德祖禰超登得爲九宮三天眞人離合之日誦詠是經普濟生靈咸獲福夀擾競永消普世率寗萬神鎭衞五帝司存晏眄無窮以度億齡道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黃白三色雲氣之中內外蓊冥有青龍白虎朱雀𤣥武獅子白鶴羅列左右日月照明洞煥室內項生圓象光映十方如此分明密呪曰无上𤣥元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啟所言今日吉慶長齋清堂修行至經无量度人願所啟上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始洞𤣥靈寶本章上品妙首十回度人百神隱韻離合自然妙化玉眞高𤣥上神孕育元氣融結萬天開明華景和合陰陽陰陽合變五運推行寒暑代遷萬化生成冥冥大範妙數該通盛衰周布各有窮極陽九百六水火相厄號曰劫災造化俱忒大劫所交水火蕩焚乾坤滅景惟道獨存元始安鎭瓊書上篇總眞命靈檢校諸天星宿分度軌運無愆攝召蛟龍負塞河源東井不傾江海停淵統持世界各有眞神衞世之君太平高尊五靈𤣥老三氣丈人中有護國十方大聖永制劫仞度厄尊神回災散禍保世清貞今日宣布諸天臨軒東方无極飛天保延世劫神王長生大聖无量度人南方无極飛天保延世劫神王長生大聖无量度人西方无極飛天保延世劫神王長生大聖无量度人北方无極飛天保延世劫神王長生大聖无量度人東北无極飛天保延世劫神王長生大聖无量度人東南无極飛天保延世劫神王長生大聖无量度人西南无極飛天保延世劫神王長生大聖无量度人西北无極飛天保延世劫神王長生大聖无量度人上方无極飛天保延世劫神王長生大聖无量度人下方无極飛天保延世劫神王長生大聖无量度人十方至眞飛天神王永延劫運保世升平无量大神並乘靈瑞祥雲明霞寶輿翠蓋華輪驂駕玉龍侍衞辟邪建紫旄之節雲錦神旛前嘯鸞歌逸響後吹簫籟相和普天稱慶莫不欣歡金童散香玉女翼轅安天大將赤甲萬兵齊麾並驅擁衞高眞保度劫災蕩熄祅氛三元正吏九天上靈統化元老安鎭大神檢校運會簡奏帝前陰陽滯結隨應開宣斡旋大紐檢極靈關厯數相厄回順彌綸水火流布生成自然超淩安泰杜絕災原凶勃殄滅萬慶咸臻不容乖忒無招禍愆靈寶玉字安鎭劫延君民安泰億劫長存乾坤靜肅日月合明昆蟲遂性至化無邊神眞協贊世祚長年與道齊德功歸萬天越度三災福祿純全億兆無爲逍遙太平太平之機總攝上𤣥無色之境梵行東方八天羲明昭正天帝殊師彥希泰智雲陽天帝妙定無炎昌機游𤣥天帝肇初茲成魯思元舉天帝莊華永恩𤣥章變梵天帝無寂阮監韶動希音天帝陽浴利生度生救靈天帝辯混持雷周井虛秦天帝雲梁藻彌南方八天朱海霞藏天帝皓塞沖圖瑤扈璇侣天帝祭勤董猷利正京符天帝晉句頤澤六常賓愬天帝九方眞童呼恥更回天帝保紀定明魁神總令天帝捧罡飛霄抱日慶交天帝確生鼎孚量乎文珙天帝瑟那東西方八天察非正憲天帝崇四欽靈兆籍羅公天帝斬𦍙斗兵楮牧妙覩天帝陋都內眞幹定道庸天帝樂明報先龍羅竦持天帝漂粗尉宜侯宿推霞天帝大微亮宗道至玉翰天帝祈明俱唐上虛寶有天帝曲擇薈房北方八天沈淵泛生天帝廣侯無希冥回杳迹天帝魏覽變祥羽演婁籍天帝居門雲芒淵靈浪元天帝土狨庚驅遼微斷極天帝鑑伯眞侔鼎焞召氣天帝屢無遘規酌并傲冥天帝擢寒連妙微昆定天帝道驗中皇三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻天中之音天中之尊天中之神延劫大魔天中之靈和會帝氣統化上清无量之奧深不可詳敷教神霄保衞無窮今日欣慶受度厯關諸天統御劫化保世升平開延紀厯氣運無愆混合太乙回度五行歲星衞生太白司成辰星藏養熒惑敷榮鎭星中主皇一周行青靈定仁皓靈輔義丹靈贊禮𤣥靈衞智中央元老恢張沖氣東皇大神木祅蕩𧕏南眞大神炎禍寗極白帝大神金兵消革元晶大神𤣥會合德中皇大神總御符靈五方十界萬道之神握鈴仗鉞嚴衞億千鼓運化綱召制神眞厯劫天地保鎭不傾二十八宿抗禦四躔中斗臨向弭禍開生四序旋列寒暑循環陰陽輪轉怪沴勿干大劫至期辟卻災羣五河主宰溟泠大神促令檢錄開除水津元始符告敢有稽停攝送上宮所誅無存姦邪喪氣祅亂滅根世受大福道化澄清永載慶昌仁善興隆普推眾妙同升上宮順扶厯數列奏高空元始大梵三氣推延分判二象植立萬天神靈羅布造化生成生成陶育五氣流行六氣代遷榮謝相仍氣運否塞大劫纏綿命有數會水火風災華燿隳沒生靈滅根溟涬幽寥三景藏輝善惡無别凶咎交馳元始安鎭福德自然靈書大策寶錄上篇促召諸天十方大神統握𤣥圖綿綿不窮範圍道氣妙用開通神綱經緯運劫法輪樞轄造化常保元貞靈風鼓扇八極和平和氣沖融善瑞咸臻敷揚天政厯奏上眞眞中有神長生大君神霄後聖青華帝君東極西臺左右仙卿執符定簡以保希夷威明將吏掃絕百非上奉九天下制三災四維八區一德咸歸邪穢蕩盡魔癘折摧億萬斯載富樂又寧不容姦慝上善日新忠良輔化與道合明道貴保延无量劫津悉除鬼盜風火無停海宇清謐天地廓澄慶逮幽壤滯爽超登沈魂滅對釋解𡨚愆純化蕩蕩稱讚諸天諸天大聖咸喜歡言中爲空洞謠歌之章魔王靈篇辭參高眞第一欲界飛空永劫之音神化恢張吉慶方亨邪道滅兮嘉祥來臻天道昭昭息絕祅氛仁善歸至德姦凶造惡根貪愛忘眞守天經錯謬行勿使成華愆當令保太平惡魔樂殘敗傷困勞生靈擾我淸淨境怨毒苦相仍高上玉淸王賜我靈寶章攝制綿長劫常膺無上功真風旣蕩蕩世祚日興隆紫淸降福洞微天尊永劫寶符第二色界魔王延運之章混洞乾坤厯運無常陰陽否愆厄塞劫津劫災所至水火蕩焚萬景三辰冥冥莫存賴我眾靈安鎮普天推延大紀解釋災根調御四氣寒暑相和人何知此以享我恩禍害沈息淸晏自然此時樂兮護度億齡煌煌羣生一合俱眞上帝寶符敷落山川宗社寕肅永保太平善應元吉我道常尊太皇萬福天尊延運寶符第三無色界魔王保世歌曰三天之上萬景之宗元皇統御我界所崇勅制神靈保衞天根三災化蕩八道淸明劫輪無滯順化流行檢校星躔宿度悉分我奉帝符勅制魔羣敢有姦橫陽光激燌太平開化安鎮長存永膺福慶後天無傾造化𤣥樞上攝天機若不知此道何以登真梯無令逢運會羣祅得放威太平護國天尊保世真符已上三符以金銅鑄安闕門殿廡之上大吉學道者佩服延年卻災度厄丹書赤紙如科此三界之上飛空之中真魔謠詠之音音參洞章受之永延劫運帝祚克昌誦之百徧消卻時災誦之千徧魔王衞靈萬徧道備億世升平保度劫化萬凶摧傾有聞靈音魔王敬形勅制地祇侍衞神真臣民康樂超脫禍難福慶大來莫不咸臻是謂无量保度无窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈魔王隱祕之音皆是大梵之言扶佑劫運衞世降祥招真致神惠民安國言無韻麗曲無華宛故謂𤣥奧難可尋詳上天所寶祕於神霄玉淸玉府經室華堂應運六萬劫下傳若有至人齎內寶質心依舊格告盟九天然後而付焉道言夫天地運度亦有否終日月五星亦有虧盈劫數世運亦有促延至聖神人亦有休否末學之夫亦有疾傷凡有此災同氣皆當齊心修齋六時行香十徧轉經福德立降消諸不祥无量之文普度无窮道言夫末學道淺或仙品未充運應滅度身劫將終神經太陰臨過之時同學至人爲其行香誦經十過以度尸形如五鍊生尸法魂神俓上南宮度名天機𤣥省隨其學功計日而得更生轉輪不惑便得神仙道言夫天地運終亦當修齋行香誦經星宿錯度日月失昏亦當修齋行香誦經四時失度陰陽不調亦當修齋行香誦經大小劫終五運改易世紀延續亦當修齋行香誦經疫毒流行兆民死傷亦當修齋行香誦經稼穡不登亦當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受賴其福難勝故曰无量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衞右别至人尅得爲聖君金闕之臣諸天記人功過毫分無失天中魔王亦保舉爾身得道者乃當洞明至言也東方八天鬱羅高張化運𤣥庸厯譜緣世憫憒慈宮幸祐夷拱敷卓姦求輅儆提攸覺租沂鉤祝屠覩需琳局鄙幽大格省急宰錄并由獻嶽遘塞雲業道解鍚疇帝房畧勿鋤諫南方八天褒嶤儲祈星簡昉泰神音謹忱醮伯呼在漠延徂墀伐靈力心第粵著延高始耿亨昭符江愬山尸毛樊乙愬通輻卷白彼關升童照腦精延內鑒運意神占寸曠允閑西方八天明思彪陁鐸哥淨淙瓊阜煙佪媾茲綠姬蒙虛遙諴露液宻樂抱連卯墟𤣥冥洞覺蕪晶縻常活欲恥孤熾動命得無何劫空定本爲防眞絕乖當一同龍初子胎幻如北方八天罔光搖潤結沫陷海抽邱擬岡流漫溢蔓忽影紛象興沒降伏妄有認匪混獨消止生恩名慈伐毒擯非隨自納祥天收赴微繩遠丕固糅蔞邈窺榮竟弗悼諱契啟施道言此諸天中大梵隱語无量之音舊文字皆廣長一丈天眞皇人以絳玉之簡刻書其文以爲正音布諸臺闕及太微紫微館室之上以攝大小劫運世數水火克復不祥有知其音能齋而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳眞王保舉上仙道備尅得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致飛天下觀上帝遙唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅清河海靜默山嶽吞烟萬靈振伏招集羣仙天無氛穢地無祅塵冥慧洞清大量𤣥𤣥也

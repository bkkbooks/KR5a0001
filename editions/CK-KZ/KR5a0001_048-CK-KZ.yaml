front:
  text: 元始无量度人上品妙經卷之四十八
  hash: sha256:e06e4683e1ae818b2bbf0e20a1d054de4dd3b4bfabe089924efc7df49d83509f
body:
  text: 道言昔於洞陽天中太微空歌晶華樂土受元始度人安鎭九壘土祅不祥妙品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖高尊妙行眞人仙王土皇官屬僚佐地眞主宰无鞅數眾乘空而來黃雲慶霄羽葢琅輿彌覆九壘晃燿八冥流光錯落洞煥太空五日五夜諸天日月星宿璇璣玉衡一時停輪諸地海嶽洞穴谿壑碧華明徹風雲靜默天无浮翳地无伏祅一國地土林木原隰緬平一等无復高下土皆作文玉雲霞炳煥无有異色眾眞侍座元始天尊𤣥坐空浮九光金爓龍臺之上說經一徧大地土皇同時稱善俄頃五嶽靈宮化現眞文說經二徧𤣥闕開通說經三徧醴泉湧出說經四徧山澤川源皆生祥瑞說經五徧地藏七寶流出人間說經六徧土祅鬼精捨邪歸正說經七徧禍害斷絕殃注消滅說經八徧北都羅酆九幽地獄一切罪魂並蒙原赦說經九徧鬼官主者咸進仙階說經十徧萬物遂性民无夭傷是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一徧東方無極无量品色潤壘仙王土皇神君无鞅之眾浮空而至說經二徧南方无極无量品剛色壘仙王土皇神君无鞅之眾浮空而至說經三徧西方无極无量品石脂色壘仙王土皇神君无鞅之眾浮空而至說經四徧北方无極无量品潤澤壘仙王土皇神君无鞅之眾浮空而至說經五徧東北无極无量品金粟澤壘仙王土皇神君无鞅之眾浮空而至說經六徧東南无極无量品金剛鐵澤壘仙王土皇神君无鞅之眾浮空而至說經七徧西南无極无量品水制澤壘仙王土皇神君无鞅之眾浮空而至說經八徧西北无極无量品大風澤壘仙王土皇神君无鞅之眾浮空而至說經九徧上方无極无量品崑崙閬風珠闕瑶池八極靈仙九宮地眞无鞅之眾浮空而至說經十徧下方无極无量品洞淵无色混黃洞空綱維壘仙王土皇神君无鞅之眾浮空而至十徧周竟十方无極九壘土司仙王皇君一時同至一國男女傾心歸仰來者有如密雪飛沙无鞅之眾迮國一半土皆偏陷非可禁止於是元始俯視九壘冥漠淵眾三十六宮諸大土皇殿闕臺觀冉冉上昇至天尊所元始卽以赤光火玉之拂煇映宮闕變爲一珠初若彈丸三十六宮明徹可見元始再運神力揭此寶珠大如黍米在空𤣥之中去地九丈元始登引天眞大神上聖高尊妙行眞人十方无極至眞大神九壘仙王土皇神君无鞅數眾俱入寶珠之中天人仰看惟見勃勃從珠口中入旣入珠口不知所在國人廓散地還平正无復欹陷元始卽於寶珠之內照見九壘土祅惡鬼形狀種種不祥出示靈文安鎭除滅利益生民說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其本年无有中傷傾土歸仰咸居樂康不喜不怒不憂不悲不病不惱不苦不勞不擾不驚言歸至理意合天眞齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是九壘土皇內名隱韻之音亦是仙王內諱百靈之隱名也非世之常辭上聖已成眞人通𤣥究微能悉其章誦之十過諸天遙唱萬帝設禮九壘明正土祅束形謹守天勑不敢害人上帝律令速付天丁至學之士誦之十過則五土聽命三𤣥稽首邪精喪眼土魔滅爽濟度垂死絶而得生所以爾者學士德化未充道未合眞以制十方威未制九宮德可伏御百祅束縛魔靈但卻死而已不能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙安鎭黃闕普掃不祥度人无量爲九地之宗巍巍大範德難可勝道言凡誦是經十過九壘三十六仙王土皇神君齊到除蕩土祅刑犯地下害氣勑攝土公畏法護人億曾萬祖幽魂苦爽皆卽受度上昇朱宮格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經中宮土德靈寶眞人降浩元之氣流入身中皆卽受度飛昇南宮世人受誦則地司毀券不敢拘形償骨地官延壽長年後皆得作尸解之道魂神暫滅不經地獄卽得返形遊行太空此經微妙普度无窮一切天人莫不受慶无量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃沈九壘長役土官侍經五帝玉童玉女各三十六人營衞神文保護受經者身道言正月長齋誦詠是經安鎭靑赤土政辟除九壘一十二種土殃注氣爲上世亡魂斷地逮役度上南宮七月長齋誦詠是經安鎭白黃土司辟除九壘一十二種土殺刑氣身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經安鎭𤣥黑土官辟除九壘一十二種土怪害氣爲國王帝主君臣父子安鎭國祚保天長存世世不絕常爲人君安鎭其方民稱太平八節之日誦詠是經八方福土併及一身得爲九宮眞人本命之日誦詠是經土官降福軒始延齡仙王護命命存黃庭眞人飲兆華池魂神澄正萬氣長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上淸道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐黃黑紫三色雲氣之中內外蓊冥有靑龍白虎朱雀𤣥武獅子白鶴羅列左右日月照明洞煥室內項生圓象光映十方如此分明密呪曰无上𤣥元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啟所言今日吉慶長齋淸堂修行至經无量度人願所啟上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始洞𤣥靈寶本章安鎭九壘土祅不祥開闢妙品綿劫度人正行遊梵升降自然混極九輪虛无至眞𤣥元祖氣流結成形風淵包絡妙運生根大法保鎭羣類化成碧林蒼池羅列𤣥靈九光總統上帝玉文離合變立赤運開明太空輪轉飛範眞香是爲沖妙𤣥中之𤣥鬱壘六交攝御崑山下纏風澤劫仞泉臺茫茫大化晨浩凝精三眞廣延黃燿琳庭軒始昌陽甲土元卿紫煙絳霞照朗高淸役使百魔坐鎭十方中有元關布氣之眞中有通靈合變之君中有考察開化大神中有伏邪滅祅丈人中有九冥洞淵洞極載天持地皇老尊神共敷至教大道化身今日安鎮萬聖臨軒東方无極保世神王長生大聖无量度人南方无極滅祅神王長生大聖无量度人西方无極辟邪神王長生大聖无量度人北方无極伐惡神王長生大聖无量度人東北无極旺德神王長生大聖无量度人東南无極開道神王長生大聖无量度人西南无極正氣神王長生大聖无量度人西北无極成化神王長生大聖无量度人上方无極上清神王長生大聖无量度人下方无極風澤神王長生大聖无量度人十方至眞九壘神王長生度世无量大神並乘黃雲絳輿翠輦黃蓋飛輪驂駕白虎𤣥鳳丹鸞建伏魔之節神錦龍旗前導燿昌主帥後從虎口土龍獅子麒麟左右騰擲七聖啟途四明捧轅億靈萬仙浮空而來泛氣太虛飛光景霄中元翼相靈紐右宮𤣥滋上佐太陰尊神總領地眞齊到帝前隨所安鎭永保无傾普告九壘八極靈關混黃之闕蒼碧之庭三十六君化氣九宮洞天曹局山澤川源五河八海雙光洞泉三𤣥四始一切神靈收捕土祅殺伐邪精北都羅酆拘制鬼營生民安泰國祚淸平死魂遷化白骨成人生身受度與氣長存因緣輪轉上升諸天永斷地下一十五種害物土祅殄滅不祥肅淸四冥四冥之天天帝混成合道之境梵行東方八天黃中理𤣥天帝流銖延孫九壘神空天帝閟康庸極眞燿和天帝閤曲尚筌生津布華漱靈天帝祕景丕瓊道昭厚化天帝照無敵元太沖德容天帝靈梵度光靜順頥元天帝抱由究非祖生無咎天帝唱息隱宮南方八天火壁赤墳天帝念極住元張泠流經天帝握善愈揚梵元度空天帝靜朱勝龍秀嬰委素天帝爍羅童瞻嶧穴妙光天帝石沖亮夫盤基微虛天帝直紀敦時陽𨽻曲池天帝殿祺祐山土府察獄天帝育神祕樞西方八天孔升幽化天帝嗇益至迴皇崖祖靈天帝瑶慶備修幽古繁宜天帝白元孔相陸冥四存天帝覺道屇純洞江微滸天帝梵龍九阿微生浩景天帝催謁令存離眞樂常天帝兆復素空精纏次瑶天帝結降特明北方八天太虛梵容照无天帝甯輔郎須太虛寶劫厚成天帝祝恥都安直明辨孚進志天帝邊落時明斗璣晃霄天帝極化涂先進神敷生天帝蔚伨無升翊皇總壘天帝迪諒切定懷察陰天帝悲豫蒙思貴利升遊達眞天帝無求太庸三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章九壘隱韻土皇之音仙王之尊土皇之神九都大魔風澤之靈九纏十壘混化元根妙會之祖德難可稱羅布靈眞總治神機今日欣慶安鎭九壘斬斷土祅絶滅不祥升降道氣通運靈津土水風界二十七重眞王檢察統御神功東極納氣西極結精北極合體南極成形中極上嶽盤鎭重冥靑帝開機白帝握關赤帝運軸黑帝導脉黃帝合和祅𦍙蕩息靑界神王龍剛燿密赤界神王炎華勵翼白界神王驍鋒電觸黑界神王含威冒育黃界神王該持洞極五界大神厚地之宗遊行地境部制靈官揮戈仗鉞總轄下司掌握綱紐體用之資造化生成並𨽻𤣥樞上承天政開闢陰陽交和一德品物隆昌夔師攝毒虎將祛凶威兵振奕麟獸騰驤飛光八垣抗禦十鄉敢有干逆拒遏眞皇金精啖食神獸吞傷殘割妖爽所誅无蠲羣魔束首萬鬼潛形山川靜肅草木敷榮三光五老塞閉邪源不得容隱金馬驛傳普告无窮萬化敷宣九壘皇君列奏上𤣥虛无淪化開列乾坤元氣浩浩混沌之形輕淸上浮堅濁下凝劫數自然乘陽結陰眞精間錯金剛鐵輪連構宮府寓屬其間內司眞宰恊治靈仙分禀三𤣥建號土皇統括機紐運度无窮不容怪沴致害祅凶五方安鎭敷落眞文八會赤書玉字之章保持災運地軸无傾梵氣彌羅萬範開張元綱流演九壘重陰輪轉无色周回洞冥旋氣厯關迴度合明三十六宮總理下元八景混合上入高𤣥𤣥中帝皇无玉玉眞布衍太和黃一之靈包羅海嶽灌養流形玉華聚質神景生煙五山鬱秀環拱萬天上通下接升降自然中有眞神洞皇天君坤元聖母后土尊靈甲土軒始輔正九官執符把籙保鎭地根遊行洞臺出入冥津淵窮之境杳眇之中下鎭人身紫闕丹田中合五氣大混百神十轉回靈萬氣齊仙仙道貴生无量度人下鎭九壘開化法輪禍福教化命蔕因緣普受開度萬彚生全生道旣昌下告幽𤣥𤣥關之內各有生門中有元洞謡歌之章眞王靈篇辭參高眞第一安鎭九壘空洞之音元一結氣混洞之中下成形兮盤礴冥空地綱植根內有靈眞號曰土皇君受位於帝宸宮府三十六經維統萬神金石相纏固機會總崑崙虛涵溟渤津風澤常彌綸妙理宗靈寶厚德堅無傾勃化周大數蛟龍俱負乘正道順自然祅姦何以興二儀通至用𤣥合保黃甯第二辟除土祅之章元始洞章靈妙結神下統帝氣檢攝羣眞勅命土皇三十六君禀承至用開闢地關九淵重壘祅滯蠲消沖德含和融融散寥運我正道混合𤣥標精禍滅兮品物逍遙保制刼災永亨利貞生靈樂兮賴我高宸科範宣布絕滅凶姦无窮无極海嶽滄茫衞養生成流形化光普世受度功歸上王第三卻滅不祥歌曰九壘之下冥冥洞關綱維梵氣混渺𤣥虛中有眞皇承化開方持運至氣條達陰陽乖沴通釋祛蕩不祥无上玉文散禍滅殃地根綿邈神精化騰上陟崐邱升降纏旋沖妙周流萬寶淸貞人道安泰福德相乘國界靜肅浩劫无淪巍巍太上尊部制神明宗萬境合𤣥圖生成保所同此三界之上飛空之中眞王歌音音參洞章誦之百徧名度南宮誦之千徧眞王保迎萬徧道備飛昇太空過度三界位登仙公有聞靈音魔王敬形勑制地祇侍衞送迎拔出九壘五苦八難七祖升遷永離鬼官魂度朱陵受鍊更生是謂无量普度无窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及九壘三十六宮土皇仙王隱祕之音安鎭土祅不得刑犯方隅祟害民物皆是大梵之言非世上常辭言无韻麗曲无華宛故謂𤣥奧難可尋詳上天所寶祕於神霄玉淸王府東寶元堂運遇壬辰應數下傳若有至人齎金寶質心依舊格告盟玉𤣥然後而付焉道言夫地震山搖亦法氣運土陷坼裂亦由時厯九壘之大亦有祅祥凡有此災至士皆當齊心修齋六時行香十徧轉經福德立降保鎭不祥无量之文普度无窮道言夫末學道淺或仙品未充運應滅度身經太陰還骸土宮鍊骨重壘戀土爲宅幽魂不悟臨過之時同學至人爲其行香誦經十過以度屍形如法土皇辟斥祅凶安鎭百神計日而得更生轉輪不惑便得神仙道言夫天地之內天有九霄地有九壘一壘去天九十萬七千二百里九壘之下復去天一千二百一十八萬里則九壘上當崑崙在天之中正如卵內之黃混也土官有洞元之殿通陰之闕四十二曹其下則總爲地司以治罪魂復有三十六洞仙王以居地下一切神靈攝御三十六種土祅怪異害誣生人冢宅不安水火爲禍皆當修齋行香誦經夫齋戒誦經功德甚重上消天災安鎭九壘土祅不祥下禳毒害以度兆民生死受賴其福難勝故曰无量普度天人道言凡有是經能爲天地帝主安鎭國土兆民辟卻禍殃有災之日發心修齋行香誦經十過皆諸天降眞消滅不祥右別至人剋得爲聖君金闕之臣諸天記人功過毫分无失天中眞魔亦保舉爾身得道者乃當洞明至言也東方八天杳洞蘭澮演明機珠燿璉益闔理丙𤣥舒曰苴載精圓奔海逋現祥留寂央笳潔圖律帝陽辭求開拯需約湻騎伸並散窈符濺積柯能正伎逸甦沖維泰𧋸熾度爓无南方八天赫延亘咖龍羅景吠蕩球送眞祅伏屏異羣苛厯盤變枚遼治謁濟橫博亭微綿禧衝計忌火落蘭侯師古洞无傑命靑祈茲溢毒梁貝範尹凝施玞育衡定固賓邈宜西方八天邊奚巒卿孟初浩泰質福枚涂婁空止當光展論符救化度戒和召總靈察迅出辯鷲鸑吕余池名普觀優揓木多時萌正載魁鎭壘塊眞妙驛大文戎寵渦柳倩推界北方八天紫雲藹都八景俱纏閒羅蒙星祝舉夷騫叱張度宮救曾路宣傍嘿明徒衣飛寥𤣥漠題運沙稠祁英堅本漿極陽泛席心佺車勅放縛鄰枯劫般直戸遘同司兵拱仙道言此諸天中安鎭九壘大梵隱語无量之音舊文刋書王屋淸虛小有洞天地官黃玉闕門之上以鎭九壘災氣土祅不祥字皆廣長一丈天眞皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣檢地神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳眞王保舉隱地道備剋得遊行三界升入金門此音无所不辟无所不禳无所不度无所不成天眞自然之音也故誦之致諸天下觀上帝遙唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅淸河海靜默山嶽吞煙萬靈振伏招集羣仙天无氛穢地无祅塵冥慧洞淸大量𤣥𤣥也

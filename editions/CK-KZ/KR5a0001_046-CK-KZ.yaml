seq: 46
front:
  text: 无所不辟无所不禳无所不度无所不成天眞自然之音也故誦之致十方下觀上帝遙唱萬神朝禮三界侍軒群妖束首鬼精自亡琳琅振響十方肅淸河海靜默山岳吞烟萬靈振伏招集羣仙天无氛穢地无妖塵冥慧洞淸大量𤣥𤣥也重刋道藏輯要元始无量度人上品妙經卷之四十六
  hash: sha256:6e4a61aabed48c2b095e22b742eb3c97bd0d609d276fa8d8189a1bfb79ae3d83
body:
  text: 道言昔於靜樂天中飛靑寥歌大无畏土受元始度人除禳水火漂焚妙品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖高尊水火二司大將仙君將軍吏兵行水發火官曹掾吏度厄拔難眞人无鞅數眾乘空而來紅黑奔雲虎輿甲馬黃麾絳節翠葆朱旛疾雷沸天雄風偃嶽異彩祥光縹緲鬱勃洞煥太空七日七夜諸天宮鑰震鳴殿觀傾動日月星辰靈芒噴射煒燿停輪仙梵伫雲迴霞繞斗碧影輕泛紫烟結樓一國地土山川林木緬平一等无復高下土皆作蒼玉无有異色眾眞侍座元始天尊𤣥坐空浮五色自然飛仙十華之座說經一徧諸天大聖同時稱善是時一國男女受福諸天常樂道化說經二徧太微紫微水火二曹奏功紀德陰陽調平說經三徧日帝奉笏月后致恭說經四徧二曜三元咸來禀命說經五徧水母運機延劫永世火官布算增厯益年說經六徧考罰得宜无有橫枉說經七徧漂焚息苦燒溺業消說經八徧三界晏安不生驚擾說經九徧地鑪天竈飛伏合倫說經十徧厄運俱濟人物乂甯是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一徧東方无極无量品水火司功大神无鞅之眾浮空而至說經二徧南方无極无量品水火司察大神无鞅之眾浮空而至說經三徧西方无極无量品水火司罰大神无鞅之眾浮空而至說經四徧北方无極无量品水火司直大神无鞅之眾浮空而至說經五徧東北无極无量品水火司厄大神无鞅之眾浮空而至說經六徧東南无極无量品水火司令大神无鞅之眾浮空而至說經七徧西南无極无量品水火司錄大神无鞅之眾浮空而至說經八徧西北无極无量品水火司禁大神无鞅之眾浮空而至說經九徧上方无極无量品水火司命大神无鞅之眾浮空而至說經十徧下方无極无量品水火司非大神无鞅之眾浮空而至十徧周竟十方无極水火二司典錄大神一時同至一國男女傾心歸仰來者皆各頂禮讚歎已證天尊願不罹水火大小劫災三界遷易之難尚處世身願不罹水火焚漂燒溺之厄不爲三官考按罪錄刑在水火罰於漂焚乞使二曹順理天政和均人界淸裕鬼道沈鎭邪神祅吏无妄行水發火作非橫之厄稽首元始欣聞至要各以天寶妙具神州眞𧵥勢同雲集无鞅之眾迮國一半土皆偏陷非可禁止於是元始流眄十方俯觀眾會振衣進几迴天轉地吹爲水光呵爲火燿二景交飛遊龍宛轉翔騰虛極良久之間變成寶珠大如黍米懸處高空去地七丈元始登引天眞大神上聖高尊度厄拔難眞人水火二司曹掾將吏漂溺焚爇執罰大神无鞅數眾俱入寶珠之中天人仰看惟見勃勃從珠口中入旣入珠口不知所在國人廓散地還平正无復欹陷元始卽於寶珠之內說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂无遺響是時天人遇值經法普得濟度全其本年无有中傷傾土歸仰咸行善心不猛不怒不侈不𨑙不察不蕩不㪚不時不諂不回言尚明析口无惡聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名除禳水火漂溺焚燒隱韻之音亦是眞王內諱禁勅水火二司不得妄溢行發二考虐暴生民呼召主宰百靈之隱名也非世之常辭上聖已成眞人通𤣥究微法寶已靈水火之變尋源得涇燔燎炎暴知究祖因能悉其章誦之十過諸天遙唱萬帝設禮水土火藏淵靜明離河海湛默赫烈防扃日月停景璇璣不行羣魔束形鬼精滅爽焚爍潛息漂溺自平至學之士誦之十過則黑精守位赤怪不生魔魅喪眼鬼妖滅爽濟度水火危厄不生所以爾者學士丹宮未成水騰火降體未洞眞召制二司威未制天政德可伏御姦祅束縛遊火大醜故氣但卻邪度厄而已不能使水火二神絕諸考罰輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣水火不干神明護門斯經尊妙獨步玉京制御水火除禳漂焚爲萬道之宗巍巍大梵德難可勝道言水火二司有大威神號五嶽總領眞君主放大水漂流蕩溺發暴火焚爇燒延護善去惡考罰罪人下逮地獄寒池火車漂焚重苦烹注亡魂謫役泉曲火山之府煮漬焦然悉𨽻眞君天有二燿陰陽靈根照映下民而惠災福非行禍厄之權也此大威神與九天司命採訪使者五嶽丈人五嶽都司共治水火水火之罰有六將軍以布令行災主水之將河魁將軍杜元吉天錄將軍張子華執符將軍沙伯晃主火之將捷疾將軍劉天鏹定界將軍周君采發火將軍石完夫世界有水火之穴伏藏陰陽之精化爲水火之龍民有危厄則飛龍降災水火併至北斗中勑北帝列司領水火神龍之政號玉光紫靈夫人官吏數千典掌其職生人先世有罪幽魂在水火之獄徒水火之役運水灌四瀆之穴伐薪煎百里之鑊洪波滔天烈火亘地一日一夜受苦無量凡誦是經十過諸天齊到受苦眾生出離水獄遊神紫臺出離火獄上昇朱宫格皆九年受化更生得爲貴人除禳漂焚福慶自生而好學至經功滿德就靈寶成丹身生水火七返九還皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經眞水上浮靈火下温日蔵於海萬竅生雲皆卽受度飛昇南宮世人受誦則延壽長年後皆得作尸解之道魂神暫滅不經地獄水火漂焚卽得返形遊行太空此經微妙普度无窮一切天人莫不受慶无量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齋誦詠是經爲上世亡魂斷地逮役水火功考度上南宮七月長齋誦詠是經除禳水火漂焚身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經除禳水火使二氣和平爲國王帝主君臣父子安鎭國祚保天長存世世不絕常爲人君安鎭其方民稱太平八節之日誦詠是經赤黑順界萬物遂成得爲九宮眞人本命之日誦詠是經陰无僭陽臣忠於君火降水升德下而尊魂神澄正萬炁長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上淸道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐靑紫絳三色雲炁之中內外蓊冥有靑龍白虎朱雀𤣥武獅子白鶴羅列左右典總水火二大靈司神官將吏備衞前後日月照明洞煥室內項生圓象光映十方如此分明密呪曰无上𤣥元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啟所言今日吉慶長齋淸堂修行至經无量度人願所啟上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始洞𤣥靈寶本章除禳水火漂焚保劫度人百魔隱韻從濟自然二象交輪无无上眞元始祖劫神化无神有一未形氣生空𤣥大器內温温則氣升升爲𤣥露降爲天津水爲帝先太一杳冥温氣成炎火爲神津火明水晦二象備成水盈器中火動神温温久泫液結凝玉京九宮八門安鎭十方開明赤黑是爲天根水火无祖一九化眞丹靈熒惑𤣥老大辰辟非朱鳳蒼龍皛精百六陽九剪滅凶羣游火黑祅戰物災民道可除禳化空成文是名大法𤣥中之𤣥三元八會鳳眞玉篇高祕神文億千萬年眞王治世應運流傳普度生死一切苦魂咸悉應符永劫長年厯水過火三災不登暴氣邪侈移變世間成災可除將至乃禳焚爇漂溺速離遠方帝君行令敢有來當太虛焚氣運轉元綱中有除禳水火漂焚之神中有南極長生之君中有度世司馬大神中有好生韓君丈人中有南上司命司錄延壽益算度厄尊神迴骸起死无量度人今日校錄諸天臨軒東方无極風力神王長生大聖无量度人南方无極威燿神王長生大聖无量度人西方无極金光神王長生大聖无量度人北方无極洞淵神王長生大聖无量度人東北无極制姦神王長生大聖无量度人東南無極熾𤓁神王長生大聖无量度人西南無極水藏神王長生大聖无量度人西北無極禳禍神王長生大聖无量度人上方無極拔難神王長生大聖无量度人下方無極度厄神王長生大聖无量度人十方至眞除禳水火漂焚神王長生度世无量大神並乘宸霞錦光玉輿紫淸瓊輦彩葢霓輪驂駕五鳳十二𤣥龍建招眞之節八景靈旛前嘯金齊唱後吹玉鑰同鳴獅子白鶴嘯歌噰噰列眞啟途羣仙翼轅億乘萬騎浮空而來傾駕水火監檢生靈神霄府相靑華上宮韓君僊伯消災大神執籙把籍齊到帝前隨所應度嚴校諸天普告三界无極神鄉連宛之府靈紐之宮六天九獄冰池火山救解衝蕩漂溺焚燼過度生關沈屍苦魂釋赦三官上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼羣元始符命時刻昇遷火翳寒庭部衞形魂制魔保舉度厄南昌死魂受鍊僊化成人生身受度劫劫長存隨劫輪轉與天齊年永度漂沈焚蕩之苦超淩三界逍遙上淸上淸之天天帝洞覺无色之境梵行東方八天慶華瑶虞天帝臺昌舞霞厯明資𤣥天帝靈谷振光控神九眞天帝巴慈引祥日觀揚靈天帝都奇昇方步奇乘角天帝統員羅氐舍次東天帝眞陀流淵妙律垂科天帝閱道維美定儀師微天帝伯初桃英南方八天爍寰理赫天帝孫思道弈禁明威勇天帝鄱滿祁桓安樂昭仁天帝鬱禎英陽化度僊天帝幽雲靜坊微境冲遊天帝子殊衡史滔逸魂天帝符乾處甯赤洞顯幽天帝徧常澤墟利泰猶和天帝召無僅剛西方八天梵氣七眞靈曜天帝繼元正基白章文皇天帝越定莊台𤣥極義天帝僊閔弗冥江霞子湘天帝韜樞葢倉中遥𤣥變天帝師元同瑰靜妙委神天帝嶽錄華由洞光素燿天帝落丘造章制飛鎭精天帝穴汨求輔北方八天麗正眞期天帝黃武明超空昇化碧炎天帝詔智賓玉奔紫景露陽天帝宗耀湟祕淸瑶章神府天帝仲季綿寶陳華几降龍天帝學吉隆雲澤敷成天帝達司進行紫融通微天帝芾儀開正眞萬齡天帝建裕崑三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻除禳水火漂焚之音水元太一之尊火元赤皇之神發水大魔行火眞靈九陽十陰變化上淸无量之奥深不可詳敷落神眞濟拔漂焚今日欣慶度厄除禳却氛禁勑典司厯關諸天請滅漂焚斬絶邪冤飛度水火名列太𤣥魔王監舉无拘天門東斗紀善西斗降祥北斗水考南斗火殃中斗定刑燎溺存亡罪大殞命責輕受厄靑帝監魂白帝攝魄赤帝執炬風火煥赫黑帝揚波漂蕩无極黃帝中主統行誅殛靑天魔王監試羣姦赤天魔王擲火騰煙白天魔王洶濤反山黑天魔王洪波汩淵黃天魔王焦屍泛骸五帝大魔萬神之宗飛行水火總領威兵麾幢鼓節遊觀太空熾爓赫弈滔天縛龍上天度人嚴勑北酆眞王受命救難迎祥八威衞駕猛馬巡疆飛天息火大帥塞洋除禳橫厄厭解擊衝敢有干試抗拒上眞司非定罪巨天注名赤祅大醜收行天丁千千遏塞萬萬滅形敢有漂溺燒害良民三官北酆明檢鬼營不得容隱金馬驛程普告无窮萬神咸聽三界五帝列言上淸元洞同域水火二鄉陰含陽精陽賴陰疆二氣成物能柔能剛眇眇億劫混沌之中上浮爲色下沈爲淵水火遍空合質凝天天上天下无幽无冥无形无影无極无窮溟涬大梵遼廓无光水火旣生三界境完久則氣勝進退升遷制暴遏邪水火立官考校罪業泉曲火山醜類僭逆僞妄行權漂溺天人焚燎區寰昊帝震怒符召百神玉章正氣赤文命靈黑精啟胞龍母拖紳钁天振威王領萬兵郁默執旗醜伯攝精元老奉詔掃蕩妖氛收捕遊火開通水精不得犯縱明敬教言淸肅宇宙歸奏帝前威光下照廓開八門普赦北酆受報窮魂悉令𤣥悟明道之根因縁輪轉上生諸天永享大福鍊胎飛僊超出三界高居太淸蘂臺遊宴齊對功貞玉音攝氣洪波自平靈風聚煙狂爓不然停波息爓水火二光按科金律神文化眞眞中至神長生大君御火旺德萬天稱尊飛形九霄統政萬靈无英輔相白元泳淵太一冥燿司命光旋桃康二景字合精延執符把籙保命生根上遊上淸出入華房八冥之內細微之中下鎭人身泥丸絳宮中理五炁混合百神十轉回靈萬炁齊仙除禳漂焚救苦度人消滅厄會散解危迍帝君頒令罪福甄分普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有空洞謡歌之章眞王靈篇辭參高眞第一除滅水厄漂溺飛空之音水官檢精總御北元理陰制陽平定河源醜類亂天道羣祅歸一時蕩蕩移山嶽舟楫安能施河伯遠避勢𧕏蜃來助威生民罹此災空闊天難知血肉飽魚鼈骨骸落沙泥悲風吹九陰呱呱終夜啼大命旣夭枉流浪無所依祅乘其祭祀靈爽知何之眞王降九霄攝凶送七非馘耳斷腰頸山河戮其尸玉符召靈死魂受生詠此洞章丹簡書名皆受拔度上升朱陵第二禳解火難焚爇之章火官察惡領典南司大星熒熒老人赤衣臂弓鶉首乘駕辟非萬物賴功流火玉池天機御省六門景煇下官竊政亂行誅夷中夜忽起疾風交馳碧煙如龍烈𤓁橫施萬丈灼灼聲侔隱雷驚呼垣奔迷不出帷肉潰脂流殤鬼急追斷髻焦髮氣逐餘灰魂遊冥冥猛火離離脫有來饗惡鬼齅之渴不得飲困不獲栖僊聖在天孰謂使知天官按行執凶糾非玉符制火鬼道莫違帝君有命普獲純禧生民晏安不涉傾危第三除禳度厄拔難歌曰玉淸之上神霄鬱開帝都九門中有大君錦裳絳衣碧冠珠纓統治三界十方萬天千二百曹咸職列官八百七十按局羣僊七元罪福水火氣元制命勑律佐理億千校錄生死河海谿泉敢有故氣變化幽關妄行水火毒害生靈焚爇漂溺猖獗不停寶章玉符密告帝庭威劍巨斧斬伐鬼精水平火息厄難無侵誦詠洞文祈天引誠眞王下觀靑籙記名除禳度死七祖超昇氣鍊變僊神飛意靈萬世蒙福俱登玉京此三界之上飛空之中眞王歌音音參洞章誦之百徧永禳焚溺名度南宮誦之千徧眞王保迎萬徧道備飛昇太空過度三界位登僊公有聞靈音魔王敬形勑制地祗侍衞送迎拔出地戸水火厄難七祖昇遷永離幽冥魂度朱陵受鍊更生是謂无量普度无窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及神霄眞王隱祕之音除滅漂蕩之厄禳解燔燎之災邪精魔類盜行水火毒害生靈妄求血食鍾鼓之響眞王檢察斬戮邪魔安施玉符辟斷非橫水火之厄若有身歿水火魂魄精識爲上古傷鬼男女之𦍙所憑自赴水火或世世水厄年年火災皆是邪神竊權天司擅興焚蕩學者敬誦此經以爲救度卽能除斷皆是大梵之言非世上常辭言无韻麗曲无華宛故謂𤣥奧難可尋詳上天所寶祕於神霄玉淸王府東華藏室應運下傳若有至人齎金寶質心依舊格告盟眞王然後而付焉道言夫天地爲水火之神器天河在上則水鼎上居火海在下則火鼎下儲太空在中日月爲藥日月者水火之根本繫於南北二斗爲太微紫微兩極都曹以水親火則水能尅火以火隔水則火能尅水水火均等則旣濟成物水火有太少之運則萬物爲之刑災上天以水火爲生化之樞機樞機得則天政成下官故氣六天鬼魔盜水火而用之以害生類帝君出除禳之法救濟在危厄者大至天地運度否終日月五星虧盈至聖神人休否細至末學之夫疾傷凡有此災同氣皆當齊心修齋六時行香十徧轉經福德立降消諸不祥无量之文普度无窮道言夫末學道淺或僊品未充運應滅度身經太陰此皆身中淸霐之水與明堂之火未能升降身中之神與司命殺鬼戰於水火之門臨過之時同學至人爲其行香誦經十過以度屍形如法魂神徑上南宮隨其學功計日而得更生轉輪不惑便得神仙道言夫天地運終星宿錯度日月失昏四時失序陰陽不調國境焚漂四民失業疫毒流行兆民死傷師友命過同學夭傷皆由水火不調勝負爲災天官墮政魔怪爲𦍙雖外无焚爇漂溺之厄氣失其平奔注騰熾內爲失度暴發之咎皆當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受賴其福難勝故曰无量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衞右別至人尅得爲聖君金闕之臣諸天記人功過毫分無失天中眞王亦保舉爾身得道者乃當洞明至言也東方八天飊忽保靈蔚元浮砂覺濟飛泝迎機濮耶駚江兖敷卽𤣥蘄㠓允答貺策幽榭穆崇獻翰强憊資氓逸聰熛定澱化制碑畢戎弄斗閣越籍司奎鍾昊敘瀁建池鄒卷沖南方八天濡穴探益神命革遥聯彼洞宥極京龍桃錯鑿棤阮㵧蹇漠常杜鬲謹載晞蒸巴敖碧連運變亨極盧楊檢勑方帝烈飊疾裒熏露渙落統莫虛隆急制北律萬呼冥冥西方八天梵度乾鍛慈傳龜喏漸截鬼憂并野部嬴詔端鼎察意謨虛形曇現罔寂去河祭賓演漢洞譙月姑張兌采迅茹華紫令遹盛丁治鷺石刀丹錄魔胡賽判決神靂渾微北方八天虎臼緣璇箕論頓核甎陽銲世知閬遷火榜縉董掖麗珍元娑井估候驛延蘇慶隨宊稼厥展補因夸離剉減越絜靦疏柷基浩朏遘忽指嶽池瓖調明趨管遼儺蘊綽道言此諸天中大梵隱語无量之音舊文書北元逮臺水帝七精之室南靈騫陁未館飛華之宮用平制水火舉抑璇璣進退二候以成大化天地交泰日月運行陰陽發生仙聖變化升降上下比之權衡斟酌量宜以畜萬有其道不忒三辰順躔攝受失理則五魔盜柄太上所祕藏之寶缾神通自然一切无礙翔爲龍鳳伏爲龜蛇道妙都括不使世知字皆廣長一丈天眞皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣神府玉郎眞王上吏下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勲眞王保舉上淸道備尅得遊行三界昇入金門此音无所不除无所不禳无所不度无所不成天眞自然之音也故誦之致飛天下觀上帝遥唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅淸水无漂溺火不炎燔萬靈振伏招集羣仙天无氛穢地无祅塵冥慧洞淸大量𤣥𤣥也

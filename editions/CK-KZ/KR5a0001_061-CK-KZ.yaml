body:
  text: 東方八天騤䗁禹崿元佐句野河魁杜軍華侯張化沙洛維晃鏹神劉師勅周靈采石完天眞陸髑附䰟符驅陰名祭賚謹戒護救齊仁約誠奠私呼應合倫意通使捷丁威昵鄰南方八天闔闢谷𤣥妙液交瓘混氣接心道囿時會和迫知微兊意洪施換忽眇漠𤣥諱德宜洞淸絶往介尸端期邈默外世天眞俯攜雙路並遷由夷指馳歸畢空冲鬼路幽機西方八天祖瑑開宗氣根霞龍梵演洞乘恢化光容仙露昇格丹想文封怪悟異生水激火攻壽隱解遙遵叩祕濛守嚴修隆道㖟普風隨舉觀代繼軌述從善教屏邪權示𤣥籠北方八天一晶萬瓣生幾空常力弊紹新化代周遷旋易旺弛輻轉逸連昧無動𤣥匪知鄙天泯斬繁職圓廓獨空變囘實住圖析來還曷出俄居恍字厥如泮微祈醜混罔勿規道言此諸天中大梵隱語無量之音舊文𤣥都九老仙君以黃櫨漆液書於劫門帝闕之上至眞之人出三界離十方必登劫門詠中篇以升無形下世末學住生死流居小乘位不誦其文則地官錄其形質天司禁其魂爽取道暗杳不知至𤣥能味靈文中池之神告兆無極開大明於慧牖豁見海於定都也字皆廣長一丈天眞皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳十眞保舉上淸道備尅得遊行三界昇入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致三天下觀上帝遙唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅淸河海靜默山嶽吞烟萬靈振伏招集羣仙天無氛穢地無祅塵冥慧洞淸大量𤣥𤣥也

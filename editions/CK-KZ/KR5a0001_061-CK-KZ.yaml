front:
  text: 劫種親疾除罪簿落滅惡根不得拘留逼合鬼羣元始符命時刻昇遷北都寒池部衞形魂制魔保舉度品南宮死魂受鍊仙化成人生身受度劫劫長存永斷輪轉先天無年永度三途五苦八難超淩三界逍遙上淸上淸之天天帝洞光無色之境梵行東方八天玉娑平海天帝豪眞秉符驕炎祥備天帝思順孝猷雲碭龍磧天帝景命混圖驪性希矇天帝齊邱綠符鎭相流誓天帝古威罕常嶽樊膏汀天帝兆籍監王凝仙鹿觀天帝幾道元光斗浦𤣥司天帝蕩淵慈宜南方八天崿鱗飛機天帝廓洞自幽洞炎赤圭天帝息覺除營陽祁正父天帝杳晶皓黃金律整靈天帝弼由肅沙烏稷無變天帝密覩思微神歸合明天帝蹈靈防离太元機省天帝擇仝施虔校錄定眞天帝育韓籌冥西方八天明𤣥聖皇天帝直義伯鑾曲生司世天帝幽都仙總梵極元天帝閬騎遐非𤣥化典法天帝祖定延眞刑籍眞算天帝長靈度耽華晶慶霄天帝玉誕昌妙眞德女天帝九濟道戸列星交微天帝應大法謠北方八天孕魂敗臼天帝遷洞伏機卵化液流天帝遵犧眷雷温胞育陽天帝洞混光臨媾玉中華天帝括保命生池陰鎻神天帝師火交候太極抱愛天帝道眞欲化諱津人山天帝敵利寶龜丹精朱闕天帝妙華玉剛三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻元始之音無形之尊不轉之神超象眞魔斷妄之靈和合出流脫離化源永住諸輪變化上淸無量之奧深不可詳敷落神眞無三界因今日欣慶受度厯關諸天請滅三惡斬絶地根永淨六染名列太𤣥眞王監觀無拘天門東斗發生西斗義成北斗存道南斗降靈中斗運神九老三眞靑帝巧量白帝堅登赤帝通化黑帝淵淸黃帝中極指呼萬神靑天魔王以文定名赤天魔王知識散精白天魔王罪惡司刑黑天魔王智用乃分黃天魔王大宗非聲五帝大魔生死元雄飛行鼓從總領威兵麾幢鼓節遊觀太空軍騎赫奕佐天舉功永斷輪轉嚴攝北酆神功受命普掃不祥八威吐毒猛馬四張天丁把斧大帥持旛擲火燎焚流鈴四揚敢有干試拒遏上眞金鉞前衝巨劔後刑屠割鬼爽風火無停千千截首萬萬剪形魔無干犯鬼無祅精三官北酆明檢鬼營不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列言上淸元洞已迹紹厯龍康眇眇億劫輪轉無常劫終劫始太空難量恍漫不期混沌之中上無無色下無無淵風轉九虛金景定天天上天下無幽無冥無形無影無極無窮溟涬大梵遼廓無光不名生死無有去來三界輪轉皇道流行六氣變化忽合忽離神依靈寶永固精根赤明開圖運度自然元始安鎭敷落五篇赤書玉字八威龍文保制劫運使天長存梵炁彌羅萬範開張元綱流演三十二天輪轉無色周迴十方旋斗厯箕迴度五常三十五分總氣上𤣥八景冥合氣入𤣥𤣥𤣥中太皇上帝高眞泛景太霞嘯詠洞章金眞明郁流響雲營玉音攝氣靈風聚煙紫虛鬱秀輔翼萬仙千和萬合自然成眞眞中有神神無方體道寓姓名乃號南極太微長生大君無英靑華白元素眞太一始生司命算程桃康合延致兆有生生爲死本輪轉不停道初無爲豈毀豈成是爲仙眞養教種人執符把籙保命生根上遊上淸出入華房八冥之內細微之中下鎭人身泥丸絳宮中理五氣混合百神十轉迴靈萬氣齊仙仙道貴生無量度人上開八門飛天法輪罪福禁戒宿命因緣普受開度死魂生身身得受生永不輪轉上聞諸天諸天之上各有眞靈中有空洞謠歌之章眞王靈篇辭參高眞第一欲界飛空之音天道朗朗鬼道䝉䝉人道杳杳沈滯輪囘仙道樂兮太虛爲家男女相牽纏我界居其多聲色昧靈府頑空張網羅濁海流巨浪塵山鬱嵳峩但能錄其惡安能遏其邪遇我虛皇尊演此大洞篇頓然爲種民色景何足過憫嗟曠劫迷空中起悲歌茫茫愛欲徒不悟當奈何第二色界眞王之章峩峩無極山上有飛天宮羽衞羅億千我得治其中朝遊大有庭丹輿駕靈風夕歸校錄府眞仙執瓊編返神入太空下觀諸天民自然浩劫來身猶染輕塵未得斷輪轉安能忘色根一聞空洞章合體皆虛明息念七寶林濯身天河津永契皇極道稽首禮天尊第三無色界眞王歌曰蕩蕩龍漢眇眇赤明皇極生神無形無名始立三界我居其尊統制一切攝御眾靈曠朗諸天境域四開緣習未斷猶有傾隤乘運促會得升列眞元始敷化大演眞機此道堅固悉入無爲旣悟絶輪轉大福享爾身何慮塵沙劫天地應不傾靈光散十方齊爲白玉京此三界之上飛空之中眞王歌音音參洞章誦之百遍名度南宮誦之千遍羣眞保迎萬遍道備飛昇太空過度三界位登仙公有聞靈音三官敬形勅制地祇侍衞送迎拔出地戸五苦八難七祖昇遷永離冥關魂度朱陵超度死生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及神霄玉淸眞王隱祕之音兆能誦之見道全體洞入無名得悟證眞永斷輪轉皆是大梵之言非世上常辭言無韻麗曲無華宛故謂𤣥奧難可尋詳上天所寶祕於神府東華藏室依𤣥科應運下傳若有至人齎金寶質心依舊格吿盟三天然後而付焉道言夫天地運度亦有否終日月五星亦有虧盈至聖神人亦有休否末學之夫亦有疾傷凡有此災皆氣數窮極往來始終輪轉三界諸幻所生同氣皆當齊心修齋六時行香十遍轉經福德立降消諸不祥無量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太陰臨過之時同學至人爲其行香誦經十過以度屍形如法魂神徑上南宮隨其學功計日而得昇𤣥不入輪轉便得神仙道言夫天地運終星宿錯度日月失昏四時失度陰陽不調國境不稔疫毒流行兆民死傷師友命過悉爲有世之患刑傷之災皆當修齋行香誦經眞道內著永斷輪轉超出三界却滅刑災神靈聞之卽當消解夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衞右別至人尅得爲聖君金闕之臣諸天記人功過毫分無失天中眞王亦保舉爾身得道者乃當洞明至言也

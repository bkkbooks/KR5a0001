seq: 38
body:
  text: 元始洞𤣥靈寶本章神符除難妙首玉文變化无量十迴度人天眞隱韻離合自然妙虛八靄大混之初靈光結體朗煥玉都分化三景禀粹七元纏綿至用總括眞神標著符章統御羣靈因符而立因符而行因符而度因符而生符命所告莫敢不從禍難所臨消卻無前是爲神寶元始玉文赤書內籙八會垂芒威章豁落北帝隱銘天皇鳳璽𤣥律女靑攝邪大檄都匠合明非尸斷滅山怪摧姦紫庭祕奧羅布魁剛屠割鬼爽伏魔洞淵黃籙白簡超鍊苦魂範圍太妙宰制𤣥虛存亡受度普被無窮中有明光合變之神中有除災散禍之君中有消魔破害大神中有九光三氣丈人中有掌符定籙三光五帝威伐尊神迴生起死无量度人今日校錄諸天臨軒東方无極飛天神符除難神王長生大聖无量度人南方无極飛天神符除難神王長生大聖无量度人西方无極飛天神符除難神王長生大聖无量度人北方无極飛天神符除難神王長生大聖无量度人東北无極飛天神符除難神王長生大聖无量度人東南无極飛天神符除難神王長生大聖无量度人西南无極飛天神符除難神王長生大聖无量度人西北无極飛天神符除難神王長生大聖无量度人上方无極飛天神符除難神王長生大聖无量度人下方无極飛天神符除難神王長生大聖无量度人十方至眞飛天神符除難神王長生度世无量大神並乘景霞綠輿羽明流軿宸燿飛蓋玉精寶輪驂駕驎鳳丹歘靈飈建九光瓊節五氣華旛前嘯簫歌逸響後吹鸞鳳同鳴獅子白鶴音韻噰噰四將啟途五帝翼轅億千萬乘泛皓凌煙騰煇騖電御化開𤣥明宸帝氣太微玉宮神綱主宰天靈上卿秉符執籙總會高淸考校天地萬類之情隨品救護三洞敷陳告下十方五嶽神君南丹北幽河海冥原帝命所至風火驛傳禁察祅凶削除罪姦至於長夜罪繫沈魂並令解釋氛穢咸蠲惡魔毒害孰敢當前生根寗極壽保長延神霄紀善靑華宥愆寶章流演應會百靈皆受道德陽光鍊眞永度三塗五苦八難超升三界遊觀上淸上淸之天天帝燿靈冥无之境梵行東方八天淸祕元漠天帝竺羅啟英遼正愬明天帝元邵齊靈定凝至悰天帝府蔚徐名精務索離天帝明余梵平九墟梵度天帝覺猶光庭朱期符旨天帝祕宛須敕校峯闕天帝咒威越淵鬼符昭印天帝董道仲兵南方八天嵒驅杳魂天帝厯沙王宿耶慶句天帝蒲妙光圖都叟裕天帝子侯眞生𤣥利虎延天帝魔定張明斗玉符天帝除海勃陁混元太始天帝素來彥眞曜京誅魔天帝神祐元貞𤣥城數極天帝鹿那容西方八天符離金利天帝弱甫耀昆戚奚鋪極天帝華瀦淵靈延那邱靖天帝玉閑願寗太紫限常天帝鄒父近營歐盟俱于天帝密夫冕京資力勝𤣥天帝屈唐稽和道捨崇和天帝慈勝時遊孤正鷲臚天帝卷用勤登北方八天赤宜洪陟天帝虐龍爲牛微元舉天帝𤣥師冥囘童枚孔乾天帝變希常𤣥卓落辨蔽天帝統監鬼師混常化空天帝河當灰迷眇忮明儒天帝喬思洞機那羅沖奧天帝滅都好微政奚居浩天帝邈無九朞三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻天中之音天中之尊天中之神天中𤣥符天中之靈五符八策變化上淸无量之奧深不可詳敷落神文普度天人今日欣慶受符厯關諸天請滅八難斬絕邪根飛步空常名列太𤣥魔王監舉無拘天門東斗靑簡西斗素文北斗𤣥綱南斗火鈴中斗神符總監天兵靑帝運仁白帝摧兵赤帝破暗黑帝驅精黃帝布命統制萬神靑符神王揮英左翊赤符神王炎功破釋白符神王虎牙大嚇黑符神王橫吞跨驛黃符神王雄剛會極五符大神萬魔之尊揚旌揮㦸兵騎合驅遊行天界檢察災虞奉命上帝宣布眞符隨感應念善士相須與道齊契靈光衞驅玃天神獸鐵額長顱噴煙吐火㗖食祅魔直符將吏旋電風行執法功曹威忿列陳作難之鬼幻惑神魂俱令捕錄束送溟泠千禍沈消福慶皆臻三元九宮關奏𤣥淸赤章靑簡丹書紫文玉綱結斗妙用齊并該集冲氣永固道根空洞𤣥景赤明之初飛宸煥邈靈光燿敷三元五德至理冥无凝華結氣著象自然杳靄之中現出靈文翩翩耀羅赫奕萬天流金玉霞曲折囘旋混成八朗靈芒四騫維持造化神明之元統運陰陽四序之行攝制萬魔威伏鬼精統御上極虛皇高尊開度至化流演微言彌綸億刼𤣥治司權天眞皇人洞達元根承命制篇解釋形模連貫成章紀錄幽樞散布三境藏於五城隨刼顯受拯護生津小大定格參品分名龍章鳳書纏綿長存保仙度眞安鎭靈關祅害不起蕩穢合靈敷落妙精育養人身一身受鍊上契淸𤣥𤣥中有神三景眞君五靈𤣥老太一尊神紫微北帝明威吏官執節奉符保命長延逸轡紫霄升雲駕龍朝拱玉軒接侍陽寥超度三災永脫八難七祖齊僊永離幽泉逍遥朱陵華陽洞臺𤣥恩普被無所不周浩浩法橋陶育萬生訓悟之科禁戒因緣善道旣臻克獲推遷玉符開度神眞散煙定簡靑華關告諸天諸天之上各有眞符中有三天靈音謡歌空洞之章上聖靈篇辭參高眞第一太一洞𤣥飛符之音赤明開大運妙應顯元皇冥冥空洞中靈文煥萬方煇燦燿神綱八角垂光芒纏羅元梵精隱靄藏神綱結書散萬篇感化無不藏敷落緯至用隨氣騰威光符命所降傳風火馳驛龍蕩滅祅魔迹禀粹神明宗永卻八難厄與道同𤣥功福慶契自然儛輪飛太空第一元始神符泰淸大赤天隱諱已下三符並丹砂書白箔遇厄難百試佩服貼並同用第二太一洞𤣥度符之章八會三元氣宸華煒萬篇虛微該妙賾太一秉𤣥權元始垂金科玉律按格言隨功佩帝眞眾害咸滅蠲神霄察善錄定簡靑華編摧遏羣魔鋒試敗不得行黃老保命基桃孩固百神哀此紅塵子夭喪迷𤣥津惟我高宸師與世爲梯衡運度無窮極三天散玉文萬刼保至道億兆無沈淪第二元始神符上淸禹餘天隱諱第三太一洞𤣥化符之歌玉綱凝太眇靈煇散景敷煥落高上文纏羅結八區紫極洞之體皇人按筆書眾道分氣化千篇保萬殊神虎制大魔金光卻百邪總命淸微館天職奉𤣥圖法治垂眞範大格法幽樞混變齊一德咸歸無上居寥寥隱韻歌奕奕昭皇虛嘯詠契靈會我道長相扶輕飛駕綠軿旋轡登雲衢第三元始神符玉淸淸微天隱諱此三天之上飛空之中𤣥變神符自然成文太一眞符三洞眞君神符歌音音參洞章誦之百遍名度南宮誦之千遍魔王保迎萬遍道備飛昇太空過度三界位登仙公有聞靈音魔試逃形敕制地祇侍衞送迎過度世殃解除厄患治官刀兵五苦八難七祖昇遷永離鬼官神符度屍魄鍊更生乘道威神受化自然神符護生上聞諸天有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此洞章並是諸天上帝及度符神王直符眞君隱祕之音皆是大梵之言非世上常辭言無韻麗曲無華宛故謂𤣥奧難可尋詳上天所寶祕於三天三洞寶宮依𤣥科四萬刼一傳若有至人齎金寶質心依舊格告盟十天然後而付焉道言夫天地厄運亦有刑會日月五星亦有照臨爲厄爲殃至聖神人亦有休否末學之夫亦有厄難凡有此災同氣皆當齊心修齋六時行香受符轉經福德立降消諸不祥无量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太陰臨過之時同學至人爲其行香受符佩卧或安衣褥中誦經十過以度屍形如法魂神徑上南宮隨其學功計日而得更生轉輪不滅便得神仙道言三元厄運災難競生亦當修齋行香受符誦經星宿臨命遘難橫逆亦當修齋行香受符誦經賊難兵難水火河井摧石刀繩疫癘𡨚害夫婦刑破男女夭傷師友連注一切諸難皆當修齋行香受符誦經夫受符誦經功德甚重三天神符隨師所用悉致大驗上消天災保鎭帝王下禳禍難以度兆民生死受符其福難勝故曰无量普度天人道言凡有是經能爲君臣父子兆民行是功德有災之日發心修齋燒香受符誦經十過皆諸天記名萬神侍衞受符至人尅得爲聖君金闕之臣諸天記人功過毫分無失天中眞仙度符神王亦保舉爾身得道者乃當洞明至言也東方八天紫宸洞京太敔靈音緬羅極梵太覺洎曇玉那何逮丹綱惠矜華常健無僊補爰臻然眇梵羅都美奚雲領陁宛遂素已正門妙神越虛責部靈𤣥超慶仙度天蹟逾員南方八天符名顯驅金英玉詵昭敕制魔月儀祖前文尼逮臺花明郁千都山由房招卑帝邅瓊除絳齒沆浮靑騫安進日賓蘂池四輪竟育空遥珍極魔容太盡仙離浩冥思宮西方八天龜亭浦中燕希奇通莽畸兖列虹景逸堂宋榭沈曦盧東嶽嵎梵寂空歌卦奧靈都子景覓瞿步亨峙由符止冕律霞芒熖首柏苔星蘇梵津演神韻慶牛張微陳篤仙北方八天關敖秀名丹精播乾化樂自幾升斗乘𤣥注盡隸兌無眞妙雲迪門求叔碧圓用天湛餌輝庸道孚弭鮮澤婁蘭龍女布師珍崛空敕嘉璹滋辨眞狄陁微胡長規孳人道言此諸神符布化之天所現赤書大梵隱語无量之音舊文流演天門樓觀館軒之上天眞皇人紫筆錄之字方一丈八角垂芒曲麗遒妙施於十方上下以爲神靈寶符之文也有知其音能齋而誦之或以丹書一天八字爲符用之大驗諸天皆遣度符神王直符眞君太一使者下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳三界保舉上眞道備尅得遊行神景昇入帝關此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致飛天下觀上帝遙唱萬神聽命三元侍軒羣祅束首鬼精自亡空洞泛響海嶽凝煙天映碧彩地秀丹蓮淨朗宛默萬氣囘旋靈文廓奕招集羣仙上無氛穢下無祅塵冥慧洞淸大量𤣥𤣥也

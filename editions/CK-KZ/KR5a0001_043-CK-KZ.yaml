body:
  text: 元始洞𤣥靈寶本章保胎護命十徧度人生根隱韻離合自然太漠未分大道隱存倐忽變化是生精神神爲物靈混沌斯成上下相錯二象氤氲以白入赤陰陽齊并以赤入黑胞胎乃凝中含太虛明燿三淸神室峩峩无始未名有玉嬰兒出𤣥入靑上无復祖惟道爲身紫胞解蒂瑩然眞形混元脫胎產育神靈二儀同化恍惚杳冥冥中之精至眞之神无神不光无神不明无神不立无神不成无神不度无神不生是爲大梵胎中之胎億劫玉山七寶崚嶒九宮十闕億千萬門皆自道胎化運精神逮於人物三華妙庭紫閣朱宮胎光爽靈細微幽精潛伏胎根神風轉靡周囘十方中有保胎叔火之君中有變嬰和菟之神中有司男伯華之君中有太𤣥監生之神中有衞房在庭之眞男呼孟非女呼子宜𤣥胞未開二神同依胎血之鬼聞名斬摧不敢干試生道永歸天壽之福護命𤣥師龍文虎裳五斗攝衣速召三官太極主非握鈴嘯咤謦欬風雷挾衞胎宮素煙霏微五帝大魔金火八威保胎成眞貴務光煇除難度厄无念无爲今日校錄諸天臨軒東方无極保胎生道神王長生大聖无量度人南方无極保胎生德神王長生大聖无量度人西方无極保胎扶貴神王長生大聖无量度人北方无極保胎衞眞神王長生大聖无量度人東北无極保胎福善神王長生大聖无量度人東南无極護命昭化神王長生大聖无量度人西南无極護命度精神王長生大聖无量度人西北无極護命食厄神王長生大聖无量度人上方无極護命斷死神王長生大聖无量度人下方无極護命廣慧神王長生大聖无量度人十方至眞保胎護命神王長生度世无量大神並乘紫霞吉光越蒼之獸神禽丹鳳之輿瓊宮瑤輦左驂七靈右服九絕巨鳥戢羽夔龍負轅建保胎之節護命神旛前嘯八渟齊唱後吹九律同鳴仙舞秦侯嘯歌噰噰五老啟塗三元列言億乘萬騎浮空而來天貴生道胎命爲先上帝躬簡太極候煙總眞命神監房度生九天聖母浮駕綠軿天后王妃𤣥虎擁筵保胎護命齊到帝前隨所應度嚴校諸天普告三界无極神鄉延生之府太一三垣十二胎神布氣錫年使召天眞絳膜紫淵交氣黃庭掃蕩河源若有故氣祖考逮傳閉塞生道破胎敗傷不繼種嗣剋害殃延疾除宿注落滅禍根不得拘留逼合鬼群元始符命時刻升遷斷絕惡試五道不祥保胎育嬰部衞形魂制魔保舉護命朱宮靈降出貴仙化成人生身受度劫劫長存隨劫輪轉與天齊年太度生災胎中八難超度三元道備飛昇逍遙上淸上淸之天北華台元主世生道各有種天天帝玉眞無色之境梵行東方八天此三十二天專主保胎護命及天下胎生種類莫不隸之其胎氣所行之天起於辰極之下自北斗𤣥冥星支入三台三台六星主生養萬物胎護羣生下左囘纏房宿十三度女宿十七度至寶鉼宮子位而止凡遇氣到本命及本生胎宿則女人有胎胎脫生子故謂之子寶鉼者取其受而出之亦胎之象也惟天人化生住無形胎自天人至於人鬼龍魔皆不化生住有形胎也此天傍連欲界一十八天亦有帝君官屬治之世人請乞則降貴氣生男安胎室也靈梵居羅天帝恭慈眞秀明華燿天帝辨元胥極眞洞生天帝劉行眞提蒲離正化天帝羌度霞迷上治宏默天帝延神關熙六凝眞度天帝抑眞虛夷英延飛度天帝汩燄婁呬覺儲應始天帝正察眞微南方八天燄魔靜空天帝崔臨支題旋樞赤界天帝理常都氐正護雛天帝辯遲樓藍越理至𤣥天帝薈端思蒙梵符昭濟天帝約尚良虛球彦渚天帝淵憂毗棲禁非司政天帝眇圖卑羅玉庭明度天帝鬱童傒人西方八天風舉大剛天帝匪常儀生金嵬賢善天帝火𤣥行瓊嶽修盛天帝力摧大魔陶化揚儀天帝都演奢多曲魚斗刺天帝求婆貪貢判靈宣平天帝智辟郎據皓華成備天帝倪仙連高𤣥智豫天帝九都赫盧北方八天太始拘墟天帝弗欲單齊廣曜黎明天帝阿留眞明鶴臺統全天帝開躬朗充應利囘冥天帝惠屈眉龍善幾率陀天帝偃幾西康𤣥胎修妙天帝定梵光稽元厯除天帝著克頤陽不驕道循天帝鬼府洞侯三十二天三十二帝諸天隱諱諸天隱名胎神空洞自然靈章保胎隱韻變胎靈音天中之尊天中之神天中太𤣥天中之靈保胎化成氣連玉淸皆自元始播精移神无量之奧深不可詳敷落胎眞普度天人今日欣慶受度厯關諸天請滅胎種傳注不祥食穢惡鬼黑齒夫人黃女春姑白殃日巡噉胎殺子西宮鬼神靑蛇天狗白虎花源老翁幼婦誣害胎元生民嗷嗷但抱深𡨚不知胎害故氣相連神王監舉无拘生民東斗布算西斗定名北斗結胎南斗送魂中斗大魁土爲胎眞靑帝護魂白帝侍魄赤帝養氣黑帝通血黃帝中主萬神无越靑天降胎木眞碧羅赤天降胎紫蓋婆娑白天降胎金眞九囘黑天降胎水帝灌池黃天降胎福禧登期五天胎神萬生之宗飛行三台涉過氐房攀女揖虛遊觀太空光霞赫奕諸天齊功保胎護命嚴攝北酆八方害氣敢爲災凶監生大神校課不容風馳雲奔擊劈前衝火師迅烟𤣥虎檢蹤燔裂洞浩神兵四攻敢有干試拒遏上眞金馬傳驛玉眞衞營屠割鬼爽風火无停千千截首萬萬剪形魔无干犯鬼无祅精保生瓊胎天壽和甯普告无窮萬神咸聽三界五帝列言上淸玉泉无波龍澤靈阿眇眇梵氣道胎駢羅孕化混沌攝制大魔混沌之中上无復色下无復淵風水舍虛紫胞洞然神來感格氣本先天天上天下无幽无冥无形无影无極无窮溟涬大梵遼廓无光生道開明度人億千元始安鎭建植諸天人氣昇𤣥胎神內連妙氣成文雲章玉篇三元寶書鳳蹟龍文保胎護命運厯長存大梵泛維萬胎啟張星光流演三十二天輪轉无色周迴十方旋女厯房迴度三台三十五分總氣上元八景冥合氣入生元元中太皇上帝高眞乘景太和唱詠洞章司錄定生聖母履綱斷除胎注生厄除殃時貴月吉三元惟良旣誕勝慶載齡協昌千和萬合道化成身身從胎生胎中有眞帝一至尊司命保胎宮室布分天一左眞保胎神君天一右眞保胎神君泥丸大神保護胎門玉女出入抱火握鈴玉帝在頭赤子住心黃庭老師守護帝闕與天爲一百子千孫斬逐腐敗狼藉血痕不得忤胎使嬰晏存上通玉淸呼吸華房綠室神牕細微之中護命安魂玉宮明堂金闕崑崙生氣保胎道德委純十月九周萬氣齊仙仙道貴生无量度人開通人門飛天元君恍惚常經變化无垠保護胎命三景同明罪福禁戒宿命因緣普受開度降魂生身身得受生上聞諸天諸天之上各有生門中有空洞謠歌之章保胎靈篇辭參高眞第一天元保胎大神護命眞君甲子甲戌監生之音大道有神地魄天魂日月同并結胎變靈玉佩左飛金璫右迴流精九轉光被八垂赤子妙微房參尾箕神女錦䙱華纓寶衣入宴胎宮三元共禧扶攜眞童自然合離辟𨚫萬凶不蹈傾危祈男公侯禱女嬙妃保固利亨天眞永綏第二地元保胎大神護命眞君甲申甲午監生之章黃旗舞空紫白當宮胎全子生天福濛濛我來自東泛靑雲兮御彼長虹捫星斗兮玉馬金風下眞庭兮素女么童傾光降車兮翠裾六龍彼天人兮揖我上公保胎神於三元固靈根於九重紫皇太一萬天齊功坐嘯千神斬馘殃窮擲火億程化明飲風保定生胎道德无終晨霞吐光照徹𤣥穹第三水元保胎大神護命眞君甲辰甲寅監生之歌陰胞陽胎萬生同賴一氣共旋三界斯在我執玉彝來奠洪儀聖妃瓊顏光華夷蕤紫氣在戸胎室甯固卽召九天華蓋翩翻六丁鼓瑟三元掬煙衞此生房日月齊年神公誅斬北帝列言天兵合圍仙眞按軒燒香稽顙注記无偏善功自生翊侍𤣥元此三元之上六甲之宮保胎護命自然歌音音參洞章誦之百徧靜衞胎宮誦之千徧百神保迎萬徧道備胎化仙容過度三元護命王公有聞靈音六甲扶承勅制地祇寢息无驚拔出地官夭墮橫傷五苦八難生孳繁榮永離禍姦魂魄和明合道長生是謂无量普度无窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此洞章並是三元上帝六甲神王隱祕之音皆是大梵之言非世上常辭言无韻麗曲无華宛故謂𤣥奥難可尋詳上天所寶祕於𤣥都三台上宮依𤣥科六萬劫一傳若有至人齎金寶質心依舊格告盟十天然後而付焉道言下元女人身抱胎脤或犯五傷日月刑衝返害母命分降之時爲上世亡魂无道鬼爽阻礙移殃不得生就天魁大殺作諸妖賊凡有此災此時皆當淨心修齋六時行香十徧轉經福德立降消諸不祥无量之文普度无窮道言夫胎宮氣衰生福不行多致墮落羸涸不榮祖考訟呼嗣種斷緒母子不良三孤九病乳育乘邪災咎隨妨奉眞至人爲其行香誦經十徧保胎護命監生奏上南宮爲添筭紀全祐生身隨其道功計其隆殺富壽神仙道言有傷胎之鬼致訟三官賊其年命滅折祿員使胎嬰病注子養不榮皆鬼神之所爲也亦有善人橫被陵害使失嗣續世微門戸凋謝可以急誦此經祈告胎星以保命生基或上世乏德鬼責人怒天刑其胎不得安完速宜改愼洗心自悔以免此災害胎之鬼其名有九食二月胎鬼名黃球食三月胎鬼名厲生食四月胎鬼名兆非食五月胎鬼名陸蜞食六月胎鬼名血尸食七月胎鬼名窮奇食八月胎鬼名火期食九月胎鬼名龍眉食十月胎鬼名赤奚知其鬼名焚香誦詠永保安甯生死受頼其福難勝故曰无量普度世人道言凡有是經能爲下世男女保胎護命有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衞學道之士修誦是經則胎神明正三宮煥騰長生致眞聖胎內結不但女子可以奉行也右別至人尅得爲聖君金闕之臣諸天記人功過毫分无失三元胎仙六甲神王亦保舉爾身得道者乃當洞明至言也東方八天祁彥荒正北台元旋梵形結生帝火洞遷求离柏名希樓都𤣥玉觀浩劫女房幾延景命神魔綠英回檀感屢碧戚華瀾過邅公都阿夷雲符月淵仙握流微慶落孤賢南方八天九獸蔚无曠圖日珠酆曲鬼神正頤温甦望祕蕭竟紫華𤣥胡舊井逼府渾謀宛遒雅協仙梵芝格乘除建土生屈道𤣥遮吳律覽角媒乾卑浸孤萬眸逸度天耀傳侔西方八天羅扃野垂騫泥偃池劍婁尹虛機泰迎埤宴月霞昇𤣥默瀆齊景瑤綠璆交拳近師宛樂大藪勤封陂時骨夜求覩部目隱佀歌逾昭樂鼎琯赤容飛屢耿名仙庭洎峰北方八天苟无猴余琥具凝浮威曠安迎冥居岫臺洚澥尸枚九眞迷崖阿都子他平奚海嘉魯登丞丕昞榭頤陀木罔魁漠𤣥篨願華斗畢觀齒明愬灝差洞鎭希閱天句衢羅道言此諸天中辰魁三台元生之音靈芒結文布鎭三十二天以施生定命化肇種民光煇縟麗含景玉霄天眞皇人模按其文以爲正音有知其音能齋而誦之者諸天皆遣飛天神王下觀其身保胎護命上奏諸天萬神朝禮地祇侍門大勳仙王保舉上仙上眞下臨尅得遊行三界昇入金門此音無所不辟无所不禳无所不度无所不成天眞自然之音也故誦之致飛天下觀上帝遙唱萬神朝禮三界侍軒羣祅束首鬼精自亡胎眞洞映三府肅淸天蓋旋碧地樞𤣥明嶽峙海澄日月煥照靈音幽響羣仙慶賓四氣宴寂道景虛凝大量𤣥𤣥也元始无量度人上品妙經卷之四十四道言昔於太極天中靑華安保大眞明土受靈寶度人洞神禳災无量上品扶桑洞神大道君當說是經周迴十過以召十方扶桑世界一切眞仙亘太極之東九十萬里碧海之內中有大山根連洞溟金沙重疊貫軸下元上出大无紫空神境西連太極南峙炎陵北定幽門中通𤣥都而此世界十萬餘里神峰巨嶺隱顯滄浪梵浮瑞光靑霞之氣冪冪在上靑玉爲城碧林爲宮地凝紺華拱生扶桑根蟠東極枝條相向靑碧爲光千葉之上自然天文帝眞赤書九氣鳳文以鎭十方諸天日月下出陽機自運晝夜六時天漢波潮雲濤爭湧仙都人民十二品格百千種物太无三氣化生號靑宮扶桑世界元始天尊分神萬天散形千億忽於此方命以扶桑之天靑華道境靈胄孕精挺生空洞之極號扶桑洞神大道君外曰扶桑大帝出納太陽賓餞濛汜眞形爲日月之精魂爲南極長生大帝其季次曰青華帝君扶桑育洞神之氣氣變九劫體貌完具東眞道成爲洞神大道君扶桑洞神者九陽眞精之氣也生於扶桑之內化爲劫火更爲明哲辯慧高聖之德德之至神爲大道之君道君執萬物之母以化生元胎含五行之精以鑪錘天地世之災變必由火殃火爲災本而道有扶桑洞神之祖以御其變扶桑靑林之氣大則冶鍊眞文增益𤣥道小則禳災散禍福祐羣生比之火然必緣於木木胎藏火火屬於神神養木中天災自息可禳之道故扶桑洞神大道君爲禳災之主也降於太極始當詣座扶桑眞境道德大神上聖高尊靑帝眞人无鞅數眾乘空而來碧落飛雲靑林鬱秀飊輪潛運洞蓋垂華蒼龍妙光迢遙无外流霞丹景混合渺茫七日七夜諸天昭臺日館星闕璣轅一時停軌靈風遠溢海岱明雲天无異色九氣鬱淸一國地土山川林木瓊蘂粲芳靑文壟起紫璆振響合音空洞扶桑洞神大道君於𤣥靜之中爲諸生民解禳災厄𤣥坐空浮紫霄寶光玉座之上說經一徧諸天大聖同時稱善是時一國男女災病普皆消散說經二徧太極天開萬眞同會說經三徧仙都揚烟慶周三界說經四徧靈心內通宛識妙體說經五徧龍鳴海空神波遠浹說經六徧三災不作萬物生榮說經七徧神煇同映層闕光明說經八徧五篇雲篆紫籟成音說經九徧玉華飛空重綵交煥說經十徧洞神垂照泉曲蒙恩是時一國是男是女莫不傾心皆受護度咸得長生道言是時扶桑洞神大道君說經一徧東方无極无量品禳災解厄洞神至眞大神无鞅之眾浮空而至說經二徧南方无極无量品禳災解厄洞神至眞大神无鞅之眾浮空而至說經三徧西方无極无量品禳災解厄洞神至眞大神无鞅之眾浮空而至說經四徧北方无極无量品禳災解厄洞神至眞大神无鞅之眾浮空而至說經五徧東北无極无量品禳災解厄洞神至眞大神无鞅之眾浮空而至說經六徧東南无極无量品禳災解厄洞神至眞大神无鞅之眾浮空而至說經七徧西南无極无量品禳災解厄洞神至眞大神无鞅之眾浮空而至說經八徧西北无極无量品禳災解厄洞神至眞大神无鞅之眾浮空而至說經九徧上方无極无量品禳災解厄洞神至眞大神无鞅之眾浮空而至說經十徧下方无極无量品禳災解厄洞神至眞大神无鞅之眾浮空而至十徧周竟十方无極禳災解厄天眞大神一時同至一國男女傾心歸仰來者如赴淵之流應潮之水渺然無際不見端涯无鞅之眾舉國內外或有體用未分因緣爲災智慧不爽法染爲災神氣不合分別爲災道性不明執妄爲災去取空有邪正爲災戀著法身認己爲災貪著神通變幻爲災欲出三界生死爲災識悟大道无作爲災測量元化狂瞽爲災不知洞神陰陽爲災出入胎藏凡聖爲災凡此十二大災天人大神至學之災也復有世間之災出胎之時業力所轉橫側爲災童孺之時驚忤爲災壯歳之時運度爲災營辦之時得喪爲災修舉之時氣候爲災起居之時疾病爲災有作之時鬼神爲災昧心之時天地爲災負國之時刑戮爲災不孝之時雷火爲災不戒之時天禁爲災汙慢之時夭折爲災潛毒之時陰陽爲災貪徇之時溢分爲災居世之時僞薄爲災凡此十五大災世所罹犯以至身命喪失五命加臨天星爲殃地司執錄三官上奏五帝注尤此等災厄累繫身心咸赴道君廣大法席周帀圍繞瞻望天顏佇聽玉音宣示禳災普利大法於是扶桑教主洞神太上大道君攬日月雲龍之綬轉瑞玉明光之几俯顧大眾欣眄十方倐歘之間分身千億一切眾生各起生緣及諸境界一眾生皆見己身親對聖身長跪受記撫頂訓言演說扶桑爲生氣之根中生洞神之氣爲萬類之精神一切大災存念洞神正眞九陽之光无災不除滌滅厄害於其會中見一道君浮坐紫雲曲蔭扶桑玉章紋葉之下洞神之氣化爲丹林丹林千眞冠劍竦列去地五丈洞神大道君登引禳災解厄洞神天眞大神韓司主錄南宮移度卻災順行神君上聖高尊靑華燿寶眞人十方无極至眞大神无鞅數眾俱入神林扶影之內天人仰看惟見勃勃從洞光中入旣入林光不知所在國人廓散碧壘砥平神林靜默洞神大道君卽於化境之內說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位空洞生神寂无遺響是時天人遇值經法普得濟度全其本年无有中傷傾土歸仰災患消禳淸靜本心心旣淨正邪道不干星軌淩犯鬼神禍刑三災四殺五行六害七傷八難九厄過度災咎除滅不祥言𢍆中道中无毀非齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉崇禮皆得度世道言洞神大道君說經中所言並是諸天上帝禳災致福隱韻之音亦是魔王內諱禳消萬災之隱名也非世之常辭上聖已成眞人通𤣥究微能悉其章誦之十過諸天降眞災氣沈滅厄禍擯竭本命開光生福自然天眞警衞非道无干羣仙凛顏靈司鼓節灝霞分絢寶海發光世故殄除惡烟飄息回災轉厄進業成眞至學之士誦之十過則列帝同格眾天遐映護世災殃悉令禳解民物安謐生道永昌毒害消散鬼精喪眼五帝侍近三界禀命濟度垂死絕而得生所以爾者學士道德充備鬼神尊仰體洞眞極神力周滿誦詠至經福降災消一切眾生禳脫眾難𤣥通天政伏御地祇束縛魔靈不但卻死亦能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過九天消災散禍諸天大神齊到禳除厄難暗宿陰曜𤣥天神首孛戾凶怪將臨命限齋心祈懇永斷衰殃數極劫終魂神受度上昇朱宮格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經惠澤滋洋生類蒙福重災巨厄淸蕩捐釋皆卽受度飛昇南宮世人受誦則延壽長年後皆得作尸解之道洞神火精鍊骨變仙形神隱顯出入自在棲泊福庭逍遙道域卽得返形遊行太空此經微妙普度无窮一切天人莫不受慶无量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經解禳上世亡魂塜訟鬼官臨注之災斷滅殃傳夜河之役度上南宮七月長齋誦詠是經解禳己身天羅地網九橫凶醜天獄刑害之厄身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經解日月勃蝕天地運否邪源祅𧕏境土國界之災人民毒疫傷犯天絕爲國王帝主君臣父子安鎭國祚保天長存世世不絕常爲人君安鎭其方民稱太平八節之日誦詠是經解禳氣數遷易交變時節之災口舌罪咎禁繫殺傷之厄水火窮衰閉塞之難九宮降神下衞其身本命之日誦詠是經解禳北斗追召生魂死注坎蹇窘辱之災魂神澄正萬氣長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上淸道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐靑黃白三色雲氣之中內外蓊冥有靑龍白虎朱雀𤣥武獅子白鶴羅列左右日月照明洞煥室內十方禳災洞神大神儼對前後項生圓象光映十方如此分明密咒曰无上𤣥元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啟所言今日吉慶長齋淸堂修行至經无量度人願所啟上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經

body:
  text: 元始洞𤣥靈寶本章紫光丹靈上品妙首九轉度人太一隱韻玉丹自然混洞赤晶華元上眞生育天地造化羣靈太有𤣥宮燿光彌綸開導九淵交絡天根太一蔚微萬物生神熒熒丹景圓照通明外連四虛包含玉嬰元始大劫五緯流形是爲靈瑞紫極高清鬱嶽蕭山太上𤣥京上通圓曜瑤闕飛精神運廣筵昌玉純英方臨帝仞元化開生太微明堂青霞碧城安鎭十方貫氣八冥下連列宿降妙羣星巍巍上帝安坐玉垣中有紫陽大範之眞中有光飛𤣥極之君中有丹華符應元君中有靈通上妙眞人中有開天化氣司生司育九微八道皇老尊神丹靈上範宸極度人載天持地列聖開生共宣洪化度劫回津今日降鍊萬神臨軒東方无極紫光丹靈神王長生大聖无量度人南方无極紫光丹靈神王長生大聖无量度人西方无極紫光丹靈神王長生大聖无量度人北方无極紫光丹靈神王長生大聖无量度人東北无極紫光丹靈神王長生大聖无量度人東南无極紫光丹靈神王長生大聖无量度人西南无極紫光丹靈神王長生大聖无量度人西北无極紫光丹靈神王長生大聖无量度人上方无極紫光丹靈神王長生大聖无量度人下方无極紫光丹靈神王長生大聖无量度人十方至眞紫光丹靈神王長生度世无量大神並乘紫光飛雲丹霞寶輿綠璟神輦方蓋圓輪驂駕白虎綠鳳丹鸞建八元神節明飈羽旛前列三天大仗後從朱陽萬兵鬱單玉眞遊空步虛三師啟塗九仙捧轅億乘萬騎浮空而來傾光回駕錫丹度生統仙丞相太極元宮九垣玉輔皇老大神執簡持章齊會帝宸俯閱教科下頒幽扃變化梵氣周流五行隨所飛奏開導諸天普告神洲仙境靈鄉洞天福地海嶽河源三元曹局九淵化城關紐綱維閬風崑崙瑤闕三眞𤣥華帝臺劫仞彌羅大經玉輪元皇詔命時刻飛升開度先祖受對苦魂逍遙解脫隨光上賓玉眸鍊質素暉蕩形上登流火仙變生身合景太霄與運長存因緣輪轉劫劫無傾永斷衰凶勝伏尅害之厄超凌玉虛受化洞陰過度生關飛神絳垣之天天帝洞丹無色之境梵行東方八天旌房簡宮天帝伯弓思臧慶德昭符天帝正車燕良用靈希祕天帝契岸孔沖求𤣥絜聞天帝持時明利陽開華天帝招仙圖休勝穆問宗天帝叔洪藴都降華極光天帝規童倚賢寵猷清儀天帝梁部央畸南方八天紹經師濟天帝靜敷樂襄火洞薦隆天帝勅陀除魔燿神司丙天帝華魂錄靈特靜淪化天帝確啟紋嵩廉聖廣明天帝謁通俟會極陽遠靈天帝將維卑光純修至感天帝兆用無兼杳冥普居天帝黨南式回西方八天光遼慈息天帝蒙擊還俅神燿總靈天帝顓多鄰洙碧蕚璇珍天帝鐸妙田幷定籍朱宮天帝胡堂祕公虎章考錄天帝阿韓吕全太無眞首天帝儲能捨祇錄皇寂根天帝瀹仲息完平虞夙野天帝資緣景班北方八天𤣥晨昌化天帝獨勤王眞極康庸天帝離文逸恭備神息尤天帝釋乾次開道覺遊靈天帝奠𤣥池侖瑤虛漢霞管眞天帝達匪報祥霄墟厯皇紫光天帝略淵詞皐文欽哲員天帝格涂𤣥昌都萬華秀宗天帝冒嘉龍周三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章太一隱韻丹靈之音丹靈之尊紫光之神紫光玉垣正憲丹靈六運十飛變化九清无量隱妙神不可量敷落三華普度天人太一玉丹化育生民民有元命實丹之靈奕奕紫光入體生眞以劫爲晝生滅無輪授書玉臺招眞命神今日欣慶受度厯試萬天請滅種惡斷絕胎根飛運五行上列太冥御省注籍紀功仙官眞王監察過度天門東斗保生西斗降神南斗注籍北斗化精中斗混合紫光丹靈青帝順行白帝司金赤帝炎燿黑帝主成黃帝立極正氣交幷化生寶丹九道鬱凝青霞神王覺除虛開赤霞神王孟都昌期白霞神王玉光凌罙黑霞神王紫扉密回黃霞神王金郯靈晞五方神王萬氣之宗佐天丹靈飛行九宮持幢仗節遊化高空紫光赫奕列聖齊功上天濟生開度北酆神王受命掃蕩不祥青龍左持白虎右張朱雀前驅𤣥武後防四象纒結丹符洞章擲火流鈴揮擊十方敢有妖魅干我黃房𤣥鉞斬滅天吏定刑屠割鬼爽風火飛騰千千馘首萬萬誅形魔無考試鬼無祅精三元九司嚴校雲營不容怠縱飛章奏呈普告三界諸地八冥九宮𤣥師言功太清靈符大籙太上眞文三光妙氣浩劫生成崑崙𤣥嶽巨液之明開張𤣥化火燿金升赤白旣顯元神鬱凝天廓澄高覆周九冥太一王境爲丹之靈上連下接非色非淵風轉至陰虛動神源源神合道植立億天天上天下泛景浮沉元光浩蕩玉極無形溟涬太一𤣥丹赤明皇運金華景晶彌綸宣布洪京元始瑤篇赤書寶符合氣成仙安制九方使命長延梵氣騰飛包絡交纒紫光散分爲緯爲經元風流演三十六門輪轉太虛周結生根旋紐厯綱回度飛輪六十九氣總御三元二景冥符氣降𤣥泉𤣥泉太眞帝道洪軒八威萬華安鎭綿綿七關四維與天齊并絳霄鬱單煇映無傾皇一三帝大洞徊風伯史育嬰千景𤣥童千交萬和自然成眞眞中有神萬境居尊紫光眞人丹天上靈長生大帝青華玉君太一務猷司命無英白元赤子制魄拘魂桃康合延布氣營精執册運關保度天民上遊清微內居琳琅太極寶洞大經明堂下鎭人身六府五宮中理百神混合飛空十詠洞章與氣俱仙道貴眞丹紫光度人神鑪八門運天三輪陳羅禁戒宿化因緣咸獲開濟無量生身身得受生舉形上升升入玉垣俾各應丹靈大勳羣魔吟詠謠音九華隱篇辭參高眞第一紫光丹靈飛空之音天谷靈泉眞光絳煙飛霞挹芒雲周九淵回遶崑崙萬景合仙升騰紫虛灌鍊交纒妙有空無降氣𤣥丹𤣥丹化生無極眞關九道神輝下燭酆山眞功昭著開度七𤣥采煇登晨飛升玉軿金華變體遊行八騫永超神府大福綿綿第二紫光丹靈仙王之章天垣玉霞九和育嬰丹章上道宸極珠英太華大寶化爲玉京𤣥元祖範紫光煥明人有元象中藏至精變化沖妙升入皇寗元始眞氣肇立生根青琅丹碧徊水玉晶濯羅結璘絳天奔星周旋三景流飛火鈴蕩蕩帝氣巍巍劫城雙元合應大朴構形普天安鎭億劫無傾第三紫光丹靈眞王歌曰金闕啟靈扉眞光遍諸天萬仙集帝宮鳴鐘藹飛煙一唱召萬神再歌來眾眞茫茫化八圓珠樓竦琳庭太上攝千精元始命伯華令奔紫晨煇長生引眞牙妙範祕𤣥嶽碧落回雲霞端坐九霄中天墉羅九門日月列其傍下有層雲屯紫光化丹靈驂駕舞龍軿自然玉清帝瓊岳請元尊宣布玉丹道太一天皇文普使諸天境悟𤣥爲種民設此大法梁正憲永流行此三界之上飛空之中眞王歌音音參洞章誦之百遍名度南宮誦之千遍眞王保迎萬徧道備飛升太空過度三界位登仙公有聞靈音眞王敬形勅制地祇侍衞送迎拔出地戸五苦八難七祖升遷永離北陰魂度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及紫光丹靈隱祕之音能知太一玉丹爲己元命存而保之不使陰穢邪妄昏觸返歸心源紫光照燭逆知彊名寓於心相非心非神非丹非靈𤣥關脫畧悟而得道旣得道已卽心卽神卽丹卽靈生死往還並無所礙天宮上境遂性遊嬉謂之眞人亦曰神仙七祖飛升逍遙億劫皆是大梵之言非世上常辭言無韻麗曲無華宛故謂𤣥奧難可尋詳上天所寶祕於高上神霄玉清王府東室寶藏之內依科三萬七千年運應下傳若有至人齎金寶質心依舊格告盟十天然後而付焉道言夫天地運度否終日月五星虧盈至聖神人休否末學之夫疾傷凡有此災同氣皆當齊心修齋六時行香十徧轉經福德立降消諸不祥無量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太陰臨過之時同學至人爲其行香誦經十過以度屍形如法則泥丸中太一諱重冥空字幽寥無吐玉丹之英返兆生氣魂神徑上南宮隨其學功計日而得更生輪轉不惑便得神仙道言夫天地運終星宿錯度日月失輝四時失度陰陽不調國境有災疫毒流行兆民死傷師友命過同氣災殃皆當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受賴其福難勝故曰无量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衞右別至人克得爲聖君金闕之臣諸天記人功過毫分無失天中眞王亦保舉爾身得道者乃當洞明至言也東方八天乙羅刹賔䖍跽恆微祕裝則泯高牙輦綏仗毅秦役瑤眞元岐洞嶽勅玉琅卿簡瓖幽流互曾越田正催頗惟澤柄推察冥稽趙品逸鐸梁辭變機郝完賜鉤洪延伯龜南方八天品慈盈菌戞和淩京燕翳洛巓祝勿幻平離皇遠寅欹輪夷恒旦奏屏約車塗石扃道辯驛別熙都索明慶備河湄奚梅趙眞記益瞢弼烏靈交兵赤旃胡陀摩求默湻西方八天教飛瓊格厯本日箕論伫明席延閩次鈞長儀並敷閻披江薰祕露忽漠餘棠已門察落正梵依畢嵯純勤裒曜比杓範交幷闡第委媚斗紐升行君支陽微隕作常呈北方八天關師時昌聯將易蕭碧斷幽根霞激邊毫原趨遲昺季學明刀政霜堅濤杞南惟商漸胙華敵晶焰求興丁𦍑把房族英猷卿綠冥使裔焦昻步汀兌臨其雩爵述撩靈道言此諸天中大梵隱語无量之音舊文書高上神霄玉清王府紫光丹靈之閣金門左扉之上以盟諸眞亦傳東極宮中已成眞人者使知妙道字皆廣長一丈天眞皇人上眞道君昔書其文以爲正音有知其音能齋而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳眞王保舉上升道備克得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致大魔下觀上帝遙唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅清河海靜默山嶽吞烟萬靈振伏招集羣仙天無氛穢地無祅塵冥慧洞清大量𤣥𤣥也

太一號迷盧蘇支寂幾渠施汶漠協钁神斗玉儀觀侔合積噓持米離𤣥方碧羅陽志荒時七覺遙祖卷逋索逵霞敷琯姬景育度元混幾央卑鼓龍澤歌他墀半飛龍皛由嵋內八字酆城官諱北方八天玉蹊亂基日淵孟池溥載願列坡荒元祠絳洞妙弼邱目藴飛定芒混逐坤齊建䝉激馘鬼鄙煙營方仇卯畜旣明菩郎罕投幽歌寒呱烈燔夢遊㦸旦悅攴仙都霞周內八字𤣥老內名道言此諸天中大梵隱語無量之音舊文書太𤣥北闕五靈長樓之上以開度泰山九幽羅酆泉曲冥關累苦之魂繫在三官不得自明逍遙𤣥空之者丹書揚之以濟淪苦昔天眞皇人詣夜光元后模倣書之字皆廣長一丈八角垂芒委宛如印九六之會離爲正音有知其音能齋而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳魔王保舉上眞道備剋得遊行三界昇入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致地獄釋縛長夜開曉幽牢陰界息苦超生人道安甯鬼途解脫碧宮霞覆丹陵發光鎭靜海嶽福及萬生天垂彩耀地湧玉英冥慧洞淸大量𤣥𤣥也元始無量度人上品妙經卷之五十八道言昔於紫空燿景天中𤣥風洞歌大靈妙土受元始度人迴生起死無量上品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖高尊妙行眞人無鞅數眾乘空而來靈煇燿虛瓊車玉輿扶華宸蓋雲旌四張瑞靄交鬱彌羅八𨇠五日五夜諸天諸地陰陽機運一時停回𤣥綱振肅海嶽澄明品物咸和普安其生一國地土山川林木凝鮮一等無復殘毁土皆作異寶燦麗熠熠眾眞侍座元始天尊𤣥坐空浮萬氣雲華寶座之上說經一遍諸天大聖同時稱善是時一國男女禍害不作無有夭傷說經二遍災病蠲消說經三遍翁艾返嬰說經四遍垂死得生壽獲永延說經五遍死入輪轉卽獲昇遷說經六遍沈屍九鍊陰質迴生說經七遍受化太𤣥枯骨復形說經八遍普世明悟道性還湻尚德貴正斷滅奸邪說經九遍學道得道求仙得仙說經十遍妙氣周備混合神明是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品道化大神無鞅之眾浮空而至說經二遍南方無極無量品明性大神無鞅之眾浮空而至說經三遍西方無極無量品結氣大神無鞅之眾浮空而至說經四遍北方無極無量品開慧大神無鞅之眾浮空而至說經五遍東北無極無量品生魂大神無鞅之眾浮空而至說經六遍東南無極無量品育形大神無鞅之眾浮空而至說經七遍西南無極無量品保命大神無鞅之眾浮空而至說經八遍西北無極無量品延年大神無鞅之眾浮空而至說經九遍上方無極無量品迴生大神無鞅之眾浮空而至說經十遍下方無極無量品起死大神無鞅之眾浮空而至十遍周竟十方無極天眞大神一時同至一國男女傾心歸仰一切淪化沈冥屍過䝉被道恩生氣入身旣死返形來者有如山嶽出雲四塞彌漫無鞅之眾迮國一半土皆偏䧟非可禁止於是元始開七寶山啟無邊目約衣斂几凝觀遐想以告眾眞曰眾生迷誤罔覺𤣥眞旣離胎育情逐化遷緣類隨著遂生業因業累敗性徇識爲愚利害交攻情色蕩意初爲童稚逮于壯時顧視之間已及於老焦牢枯竭生氣旋盡至於死壞殊不知道爲生德生爲道根心存於道常與生俱物有生死道無生死存道於形生氣自續數極形盡道復能生生道旣固不從化遷保形不化永存綿綿迴生轉死上眞所崇今爲眾等開演妙本普度無窮於是元始振揚華拂景霧四騰如雲如煙靄浮空際去地九丈元始攝引天眞大神上聖高尊妙行眞人十方無極至眞大神無鞅數眾俱在景霧之中地還平正無復欹䧟元始卽於景霧之上說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂無遺響是時天人遇值經法普得濟度永植生根無有沈淪傾土歸仰咸行道心不競不擾不任不勤不念不欲不貪不嗔不營不思言無藻麗口無怨咨齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是眞王迴生起死內諱百靈之隱名也非世之常辭上聖已成眞人通𤣥究微能悉其章誦之十過諸天攝氣萬道齊眞靈化開宣咸受𤣥恩生津永啓召魄收魂沈零結育以返屍形迴生起死白骨成人至學之士誦之十過則五帝命靈三元策眞靈眞降合死道散隳濟度垂死絶而得生所以爾者學士道氣未純體未契眞保制萬神德未全至用可回度命機開導生津但起死而已不復轉輪輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人無量爲生道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到生道開明返化結軀億曾萬祖幽魂苦爽亦皆受度上昇朱宮格皆九年受化更生得爲眞仙而好學至經功滿德就皆得舉形飛昇金闕遊宴玉京也上學之士修誦是經皆卽受度飛昇南宮世人受誦則延壽長年久視無窮後天長存運數雖極並皆得作解化之道遁變神明不經絶滅常欣保榮逍遙十天此經微妙普度無窮一切天人莫不受慶無量之福生死䝉惠上天所寶不傳下世至士齎金寶效心告盟神霄而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經爲拔度衰亡死滅極會之災得保生存七月長齋誦詠是經神氣常全厄難蠲消名奏靑籙當獲長生十月長齋誦詠是經爲普天率土保度民物仁壽咸臻與天無傾世世衍溢戴仰人君安鎭國祚萬劫昇平八節之日誦詠是經造化不愆金木交并神氣和同養育皇靈枯朽更生受其鍊度得證仙眞本命之日誦詠是經身保淸貞體用日新禍患永消長亯福祥天曹錄善地司滅連慶延七祖名奏三天功滿德就飛昇上淸道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐靑黃白三色雲氣之中內外蓊冥有靑龍白虎朱雀𤣥武獅子白鶴羅列左右日月照明洞煥室內迴生起死𤣥化大神侍衞前後項生圓象光映十方如此分明密咒曰無上𤣥元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋淸堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經

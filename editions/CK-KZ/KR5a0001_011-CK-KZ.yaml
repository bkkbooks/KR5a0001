front:
  text: 重刊道藏輯要角集三元始无量度人上品妙經卷之十一
  hash: sha256:1aca415bdca5dd8312cb51acf4ecee9f93948936aa4bc4d56137435d2a5795ad
body:
  text: 道言昔於空碧天中玉霄景明大寶嚴土受元始度人玉明運度无量上品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖高尊妙行眞人無鞅數眾乘空而來紫霞揚暉絳華舒彩鳳輿龍駕雲蓋霓輪蔭景含晶五色洞映煥麗太空九日九夜諸天日月星宿晨霞徊燿駐機停綱玉璇凝光金衡息運神風靜籟雲收海嶽六氣順明一國地土山川林木緬平一等無復高下土成玉明碧無異色眾眞侍坐元始天尊𤣥坐空浮寶萼叢金九眞鳳氣之座說經一徧諸天大聖同時稱善是時一國男女年壽隆長無有災夭說經二徧水騰火降刑害不生說經三徧六氣調平寰區安靜說經四徧天飛妙香徧空浮蓋說經五徧山澤呈瑞玉瑩珠游說經六徧悟生死根神證眞境說經七徧欲界種民盡除塵染說經八徧五運均化萬物茂昌說經九徧天光下矚幽府開明說經十徧普解運度深得法門是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一徧東方无極无量品玉明運度至眞大神無鞅之眾浮空而至說經二徧南方无極无量品玉明運度至眞大神無鞅之眾浮空而至說經三徧西方无極无量品玉明運度至眞大神無鞅之眾浮空而至說經四徧北方无極无量品玉明運度至眞大神無鞅之眾浮空而至說經五徧東北无極无量品玉明運度至眞大神無鞅之眾浮空而至說經六徧東南无極无量品玉明運度至眞大神無鞅之眾浮空而至說經七徧西南无極无量品玉明運度至眞大神無鞅之眾浮空而至說經八徧西北无極无量品玉明運度至眞大神無鞅之眾浮空而至說經九徧上方无極无量品玉明運度至眞大神無鞅之眾浮空而至說經十徧下方无極无量品玉明運度至眞大神無鞅之眾浮空而至十徧周竟十方无極玉明運度天眞大神一時同至一國男女傾心歸仰遙見元始升座說法散大光明照徹无量諸天世界一國男女及諸天人其數無窮各居一天住一化境各各神聽恭聞天尊玉音響徹宣說微妙玉明運度之法卽各相謂而共議言元始天尊今說玉明運度之法大小劫量窮盡之數我知一切天人生死根本悉由運度運度之數本於陰陽陰陽之氣卽是生死陽氣爲生陰氣爲死旣從陰陽轉此生形便有生死運度之數我若得道升入無形超過陰陽卽無生死及以大劫小劫運度之數我等大眾各各運心齊赴空碧大寶之天請聞至要玉明運度何以修行出離陰陽得免生死證妙有身爲大法王度諸眾生出大劫海來者有如細雨密霧無鞅之眾迮國一半土皆偏陷非可禁止於是元始懸一寶珠大如黍米在空𤣥之中去地五丈元始登引天眞大神上聖高尊妙行眞人無鞅之眾俱入寶珠之中天人仰看惟見拂拂從珠口中入旣入珠口不知所在元始卽見神變珠內廣大含受十方諸天一切國土於大眾中出紫金光明作七種色一一色中出妙香雲徧滿珠內回青蓮目俯眄大眾攬百寶雕龍瑞玉之几德音和暢悅豫而言告大眾曰玉明者天之內名也言此萬天各運度運度不息生死不止一切天人困於有爲無爲勤勞休息之見墮在運度棄道德海入生死流皆由眾生心有取捨斷習諸見貪欲喜怒入陰陽之煆運度遷易萬生萬死不造無形不識道體我今宣示法要光明運度運度者天地之數也一陰一陽天地之根生死之根氣有終始故有運度之數天數三十年一小變百年中變五百年大變三大變爲一紀三紀爲大備六千年矣天圓十二綱地方十二紀天綱三百六十日運關一周地紀三千三百日推機一度天運關三百六十周爲陽勃三百年地推機三千三百度爲陰蝕三萬年也九千九百度則天地氣交爲九萬年名曰大陽九大百六爲大劫運度小陽九小百六小劫運度亦如之大運度之時天氣窮於太陰卽爲火地氣極於太陽卽爲水二氣相反萬物消化然後元氣復合更爲混沌此名劫數運度也大劫之末水火之災上至三界之上下極九地之下並得化滅毫末無遺以是陰陽二氣所生故隨二氣化滅三界之上四民之天及我所都三清大羅之城極道之境水火不及災數不至出陰陽生死二氣之外九大運爲一劫八十一萬年爲大運度九萬年爲小劫爲小運度大劫運度旣終我所流布金文玉字龍章鳳書一切經典皆還大羅玉京混沌重判眞文復出聖人流通再傳下世一切眾生能厭生死斷諸染著世間習氣令此神氣妙合太空空體自然不屬陰陽自無生死契此妙空應念現相升入無形運度終盡飛昇大羅出三界地永離生死克證道位得爲天眞方名得道一切眾生以學道故住於小乘或壽限永劫飛行往來分形散影乘駕龍鳳此皆執著未名漏盡大眾聞語皆出三空證上眞道國人廓散地還平正無復欹陷元始卽於寶珠之內說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸證至眞殺害嫉妬淫盜貪欲憎𡜍種種業心悉淪爲空不見陰陽不有生死言無畏愛口無願幸齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是玉明上帝內名隱韻之音亦是魔王內諱百靈之隱名也知元氣爲生死之根見陰陽爲生死之門生死所因是由運度運度不起卽無生死得道成眞體合太空永離生死超淩三界非世之常辭上聖已成眞人通𤣥究微能悉其章誦之十過諸天遙唱萬帝設禮河海靜默山嶽藏雲天關不行地機不動運度休止人得長生羣魔束形鬼精滅爽迴骸超死白骨成人至學之士誦之十過則五行順常陰陽無傷運修度永福樂壽康魔精喪眼鬼祅滅爽濟度垂死絕而得生所以爾者學士至人氣拘陰陽體未洞眞召制十方威未制天政德可伏御地祇束縛魔靈但却死而已不能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到運度開光沈滯冥識辭陰希陽億曾萬祖幽魂苦爽皆卽受度上升朱宫格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經皆卽受度飛昇南宫世人受誦玉明降氣生道來居則延壽長年後皆得作尸解之道魂神暫滅不經地獄卽得返形遊行太空此經微妙普度無窮一切天人莫不受慶无量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏漫殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經玉明東旋運度丁壬生德開光九眞簡名太乙青符拔度幽扃爲上世亡魂斷地逮役度上南宮七月長齋誦詠是經玉明西經運度乙庚肅氣結金龜臺浚靈白素玉符鍊冶兆形身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經玉明北上運度丙辛正氣成龍紫庭命仙帝眞𤣥告輔帝長生爲國王帝主君臣父子安鎭國祚保天長存世世不絕常爲人君安鎭其方民稱太平八節之日誦詠是經玉明合映運度允寗沖氣分華八門開明神虎赤書策號帝階得爲九宮眞人本命之日誦詠是經玉明保命運度千齡斗宮奏功錄兆成眞七元寶章星流太淵魂神澄正萬氣長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐碧綠白三色雲氣之中內外蓊㝠有青龍白虎朱雀𤣥武獅子白鶴羅列左右日月照明洞煥室內項生圓象光映十方如此分明密咒曰无上𤣥元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各六十四人關啟所言今日吉慶長齋清堂修行至經无量度人願所啟上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始洞𤣥靈寶本章玉明運度上品妙首厯數度人百魔隱韻離合自然混洞太无九空道祖元氣內廓玉明暎𤣥元分爲二陰陽乃全役氣運神无无上眞元始祖劫運度諸天八九六七劫運無窮太陰生火太陽爲水五行反傳開明三景是爲天根玉明梵景惟道爲身運度推移五色乘天𤣥光成篆火鍊爲文五色定位流霞結篇五文列象普植神靈無文不光無文不明無文不立無文不成無文不度無文不生是爲大梵天中之天鬱羅蕭臺玉明上京上極无上大羅玉清眇眇劫仞若亡若存三華離便大有妙庭金闕玉房森羅淨霐神霄梵氣周回十方中有度人不死之神中有南極長生之君中有玉明運度司馬大神中有好生韓君丈人中有南上司命司錄延夀益算度厄尊神回骸起死无量度人今日校錄諸天臨軒東方无極飛天玉明主運神王長生大聖无量度人南方无極飛天玉明主運神王長生大聖无量度人西方无極飛天玉明主運神王長生大聖无量度人北方无極飛天玉明主運神王長生大聖无量度人東北无極飛天玉明主運神王長生大聖无量度人東南无極飛天玉明主運神王長生大聖无量度人西南无極飛天玉明主運神王長生大聖无量度人西北无極飛天玉明主運神王長生大聖无量度人上方无極飛天玉明主運神王長生大聖无量度人下方无極飛天玉明主運神王長生大聖无量度人十方至眞飛天玉明主運行度神王長生度世无量大神並乘紫蛟瓊色紋蚪慶霄彤雲鳳車龍輦玉蓋金輪驂駕丹鯨玉毛金精之獸建九氣之節十極之旛前嘯洞謠交音後吹𣑽唱齊鳴仙姬素童鸞歌噰噰三皇啟塗九老翼轅億乘萬騎浮空而來傾光回駕興劫開生推運行度劫運無終驅陰馭陽輪轉死生玉明丞相南昌上宰樞機列眞韓司主錄監生主死靈魔大神運度數元彌綸六虛水火兵災料別種人執籙把籍齊到帝前隨所應度嚴校諸天普告三界无極神鄉泉曲之府北都羅酆三官九府十二河源上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼羣元始符命時刻昇遷北都寒池部衞形魂制魔保舉度品南宮死魂受鍊仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度三塗五苦八難超淩三界逍遙上清上清之天天帝洞虛無色之境梵行東方八天蒼室眞符天帝曲臺祕鉉玉靈至𤣥天帝殿庸就孚寶洞元極天帝伯史頓千正志明仙天帝素綱履微九眞義需天帝羊池空平維重華天帝赤師匠威神液鍊珠天帝鎭民具萊清都九龍天帝贊雲次章南方八天彤京降輿天帝浩緒純燿融煇舒眞天帝變𤣥婁堪浩極升炎天帝回俞務元湛是无極天帝略府皐徊咸利開明天帝早渾斯疆丹靈思眞天帝治靜基嚴上簡奏天帝寥區馳光眞光梵輔天帝溢爽杜蘄西方八天律檢萬魔天帝輔龍九飈金景浩靈天帝太微丙思素奏曲晨天帝邀夫直闌神虎威章八極天帝堲車翔明度修劫天帝掌覺平瓚登𧵥盟天帝巫雲慈仙陽府稟制天帝梁華美經勑錄羣魔天帝轉延沙侯北方八天𤣥靈感華天帝懷昉指濱節車問方天帝彭定思將鍊明玉宸天帝慮慈景遷靈關制神啟陰天帝建式南洞白廣功元化天帝衍第嗣羅振景耀光天帝輔章頧行北嚴護元天帝學儲佐祠厯度定運天帝超湟敬通三十二天三十二帝六十四重玉明運度周回終始法象綱維陰陽復起劫劫相因生化不息諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻玉明之音玉名之尊玉明之神九陽梵境運度之靈變化上清无量之奧深不可詳敷落神眞普度天人今日推演運度理死別生會道之妙無形爲眞與空爲一隱祕常名神變出沒自然之靈過度水火大劫刀兵身有金色堅固無傾欣慶受度厯關諸天請超三空絕陰陽根飛度五戸名列太𤣥眞魔監舉無拘天門東斗受識西斗鑄形北斗稟慧南斗運心中斗大空是道眞形青帝顯色白帝明空赤帝動覺黑帝𤣥通黃帝意運感合變生青運眞王木劫諦阿赤運眞王火劫部喃白運眞王金劫剛嵯黑運眞王水劫湮羅黃運眞王土劫神兵五運眞王萬神之宗抑張運度時刻不容飛行鼓從總領神兵麾旛鼓節遊觀太空威號赫奕諸天齊功超度劫運嚴攝北酆眞王受命普掃不祥素虎吐毒天馬四張赤甲前驅大殺仗旛擲火萬里流鈴八衝敢有干試拒遏上眞金鉞前戮巨天後刑屠割鬼爽風火無停千千截首萬萬剪形魔無干犯鬼無祅精三官北酆明檢鬼營不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列言上清元洞玉厯紀劫重關肇維元始生育天地混沌成合其數億千自有元氣合混已來其世莫量眇眇億劫爰龍達康玉明圓虛運度相期太一含運其形自然蕩蕩空景大道之元生化二景胞胎兩儀此道至妙世莫之知運度周極玉明成形大氣泛景或浮或沈眞土傳之狀如卵圓中行運度萬匝無偏五行之中運度爲先玉明爲色元氣成淵其理如蒸氣升爲露降則爲泉神風鼓之鍊爲眞鉛鉛爲金祖以金爲天運度左行九萬九千五運成度九萬九千復代於水水行於天九地洑流崑山湧泉天上天下無幽無冥無形無影無極無窮溟涬大道遼廓無光赤明開圖運度自然行運合度六氣成天動有差忒萬物否焉玉明之數運度所傳元始安鎭敷落五篇赤書玉字八威龍文保制劫運使天長存梵氣彌羅萬範開張元綱流演六十四天輪轉無色周迴十方旋斗厯箕運周四傍迴度五常三十五分總氣上元爲玉明鄉八景冥合氣入空𤣥𤣥空太皇上帝高眞汎景太霞嘯咏洞章金眞明郁流響雲營玉音攝氣靈風聚煙紫虛鬱秀輔翼萬仙千和萬合運度周身天運合人自然成眞眞中玉明長生大君青霞公子東華帝君皓青帝妃白元尊神紫庭太一司命眞君桃康合延玉光紫靈執符把籙保命生根上遊上清出入華房八冥之內細微之中玉精流液下鎭人身泥丸絳宫中理五氣混合百神十轉回靈萬氣齊仙仙道貴生无量度人運流八門飛天大梵之輪運旋明晦轉推死生罪福禁戒宿命因緣普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有空洞謠歌之章眞王靈篇辭參高眞第一玉明飛空之音寥寥始青萬劫之名染空成碧變玉柔明爲九氣母是諸天根湛然景霄高暎青林上交雲騫枝覆萬天眞霞千縷金色萬重是皆天章震撼神風帝眞九老神仙眞人出沒顯見在此天中一葉寶書八會之言嘯歌洞音以滅萬凶聞此玉明旨得道無終窮第二玉明運度之章高清之運九氣爲防旋斗厯箕周行五方順生逆死載此百昌五運行度始於陰陽陰陽造化有數有名名數之域生死之程氣之流運三界成輪運度所召流轉無停天堂之樂地獄之苦皆未爲道業果所因胡不爾思鍊性如空空無所空妙非形容須臾億劫千載嬰童超過陰陽出離五運無有生死是眞永命我運此章開兆之心世欲汩汩載浮載沈但存兆心量與空合久而自定隱於太漠出爲眞人福極寥廓坐證高宸玉池金閣第三玉明眞王歌曰九天如壘倚此仞臺蕭羅寶層玉關對開華房蘂宮含珠吐茸丹碧萬縷光纒六龍運度綱紀神梵爲理玉明蕩蕩中包九清號曰虛皇不夜之庭兆若爲眞當證無形運度不拘以道爲身神通變化惟意所成兆欲知之內去五欲虛光無留與道爲儔長生無爲眞人同遊玉音爲此歌用作慈悲舟捨此生死岸上升崑崙邱日月如跳丸安能使人憂此三界之上飛空之中眞王歌音音參洞章誦之百徧名度南宮誦之千徧眞王保迎萬徧道備飛昇太空過度三界位登仙公有聞靈音眞王敬形勅制地祇侍衞送迎拔出地戸五苦八難七祖升遷永離三官魂度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈眞王隱祕之音天體玉明自然高凝運度成劫流浪死生眞人獨立邈爾無形不墮諸有不涉智情混洞純一道從是生三境逍遙永劫太平皆是大梵之言非世上常辭言無韻麗曲無華宛故謂𤣥奧難可尋詳上天所寶祕於𤣥都高上神霄玉清玉府經堂東室道君行化運當壬辰依科以傳若有至人齎金寶質心依舊格告盟神霄膝行露丹然後而付焉道言夫天地運度否終日月五星虧盈至聖神人休否末學之夫疾傷凡有此災同氣皆當齊心修齋六時行香十徧轉經福德立降消諸不祥無量之文普度無窮道言夫末學道淺或仙品未充玉明氣窮天度終盡運應滅度身經太陰臨過之時同學至人爲其行香誦經十過以度屍形如法卽太一回旗無英命旛公子度符玉明運還魂神徑上南宮隨其學功計日而得更生輪轉不惑便得神仙道言夫天地運終星宿錯度日月失明四時失御陰陽不調國土歳災兵饑鬼盜疫毒流行兆民死傷師友命過族系殞亡亦當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受賴其福難勝故曰无量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衞右别至人克得爲聖君金闕之臣諸天記人功過毫分無失天中眞王亦保舉爾身得道者乃當洞明至言也東方八天瀕陽釜箕嶽直𤣥萃羗除明梁檀樂卷懟蓬仇仙畿麗璠烈蛻瀹鍊矜瓖房稽來呈閏益果旅瓓琳定迎徧慈侯謀品江條司鍔熾班秀庇場什基頌南厯乙奔暘蝕微南方八天霞賞烈起汶瀘弼眞革師雲篝亭洎頓回想芒屢延伯騤辭段液兟殿伾符決霞觀鮑嶧荃侣報瀛冥投注煙翹咸冕童貽算莊僖劫飛峒綿柤侃畧元清巒月騎由鴈西方八天光編伏壘赫蠢補新𥥆蕩振索韞龍紀臣儔希輔蒼閱賈實瓊河樞燕庫庭齊止青燿慮勅隨兵圖總籍鉤戈承威火律延力嵩神楚苓閬覩府京宿足斗韓興生遄呼北方八天𤣥洞逸剛氣車無疆妙指勤旅八景靜昻電口漏脈擎支昆黃賚頒九辰蕭慈拏閑遠無聽情寒盧瑩鮮空靈海昌流煙蒙山冪器拱𤣥喻華詛仙南奎秉神寥放寂顏道言此諸天中大梵隱語无量之音舊文刻書玉明之門中𤣥左臺天關地機之上以正五劫九成十壤水火金木之運以行三光五辰流演星宮宿舍遲伏留逆之度天運星度以紀劫數大小陽九百六始終之次小極三百六十有五日大極八十一萬或九千九百九十億氣之數天官運籌布筭候氣觀象按厯奉圖以知玉明之運度運度畢於陰陽陰陽根於生死生死流轉因陰陽爲之駟能釋念於虛滅心於無氣合於漠神合於空兆之介然之形鍊之如素如光如影如風如不可容則身之質礙如蛇有蚹如蜩有翼當委衣而登眞也字皆廣長一丈天眞皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣主運度眞官下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳眞王保舉上清道備克得遊行三界升入金門此音無所不辟无所不禳无所不度无所不成天眞自然之音也故誦之致天吏下觀上帝遙唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅清河海靜默山嶽吞煙萬靈振伏招集羣仙天无氛穢地无祅塵𡨕慧洞清大量𤣥𤣥也

front:
  text: 元始无量度人上品妙經卷之十五
  hash: sha256:d1d160554bf2c0830b003bfa9efe14aef2cdedbe506a4eca37e074f96858667c
body:
  text: 道言昔於寶明天中黃華梵景太素光土受元始度人月華陰景无量上品元始天尊當說是經周迴十過以召十方始當詣座天尊大神上聖高尊妙行眞人廣寒上宫后妃元君嬪御仙官散輝金童燿華玉女無鞅數眾乘空而來素雲玉霄金輿瓊輪羽蓋垂蔭流精玉光灝彩結璘洞煥太空七日七夜諸天日月星宿璇璣回標駐輪神風宛轉山海澄源天虛八浮地寂四清一國地土山川林木緬平一等無復高下土皆作金璃通玉交暎無有異色眾眞侍座元始天尊𤣥坐空浮九龍瓊臺雲層之上說經一徧諸天大聖同時稱善是時一國男女始悟正因陰爲道母三元混沌於此孕成說經二徧心識性解明悟道源說經三徧超離陰胎卽成化育說經四徧乘此經力得飛仙道說經五徧聞法解理神澄廣寒說經六徧金光徧空騫林搖響說經七徧法奧開顯保劫長存說經八徧空歌洞章萬天遐唱說經九徧月后降軿飄花凝秀說經十徧六陽俱朝忽成萬化是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一徧東方无極无量品月華陰景大神無鞅之眾浮空而至說經二徧南方无極无量品月華陰景大神無鞅之眾浮空而至說經三徧西方无極无量品月華陰景大神無鞅之眾浮空而至說經四徧北方无極无量品月華陰景大神無鞅之眾浮空而至說經五徧東北无極无量品月華陰景大神無鞅之眾浮空而至說經六徧東南无極无量品月華陰景大神無鞅之眾浮空而至說經七徧西南无極无量品月華陰景大神無鞅之眾浮空而至說經八徧西北无極无量品月華陰景大神無鞅之眾浮空而至說經九徧上方无極无量品月華陰景大神無鞅之眾浮空而至說經十徧下方无極无量品月華陰景大神無鞅之眾浮空而至十徧周竟十方无極月華陰景大神無鞅之眾一時同至一國男女傾心歸仰俱聞天尊將說大法月華陰景妙无上道各相謂言聞經十徧漸契𤣥宗陰景之機未畢祕奧我等初聞月本無光望如黑鑑日滉水光暎以爲明金水之炁結爲陰景上弦爲金下弦爲水合弦爲月金體圓就乾象周滿月侍日明日依月燿望而純陽晦而純陰但知陽勝爲仙不知陰景爲六陽之母聖人尊陽貴陰蓋以此義陰生於陽陽能生陰𤣥烏縞兎交以天精極而返之得者無死元始首唱月華陰景之道各捨密寶以覬受持來者有如細雨密霧無鞅之眾迮國一半土皆偏陷非可禁止於是元始以大慈悲入九陰觀湛然大定大眾仰觀瞻見元始返神無息靜如寶山良久之頃化爲明月月出十華靈芒交暎累累陰景狀如目瞳紫光凌空內隱輪際海會驚覩仙民再拜伏地忽然之間廣大月輪中現樓闕后妃宫殿仙民城郭明白如晝月華流光雜寶同色合座渴伫心目驚駭旋攝月華變成寶珠大如黍米在空𤣥之中去地五丈元始登引天眞大神上聖高尊妙行眞人十方无極月華陰景大神無鞅數眾俱入寶珠之中天人仰看惟見拂拂從珠口中入旣入珠口不知所在國人廓散地還平正無復欹陷元始卽於寶珠之內說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰悟道知陰陰景陰神陰氣陰精陰火陰化陰生陰胎陰變陰返至陽日月同并言爲陽華口爲陰關齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是月中結璘內名隱韻之音亦是月中后妃夫人內諱百靈之隱名也兆能知之挹華採景至陰生陽陽極仙身雌宫遐感席降靈眞固兆血腦使生久存月爲魄神血爲至陰陽爲陰留陽號胎陰陰稱祖土綠書祕文非世之常辭上聖已成眞人通𤣥究微能悉其章誦之十過諸天遙唱萬帝設禮河海靜默山嶽藏雲月降陰景黃飴易形羣魔束形鬼精滅爽迴屍起死白骨成人至學之士誦之十過則五帝來衞陰格陽眞六龍負車三界稽首魔精喪眼鬼祅滅爽濟度垂死絕而得生所以爾者學士穢氣未消體未洞眞召制月華威未制天政德可伏御地祇束縛魔靈但卻死而已不能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到月眞佇軒月中夫人爲兆列言億曾萬祖幽魂苦爽皆卽受度上昇朱宮格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經月華煥液變骨鍊神皆卽受度飛昇南宫世人受誦則金精入身腦戸自鳴玉女捧章金童稟顏得延壽長年後皆得作尸解之道魂神暫滅不經地獄卽得返形遊行太空此經微妙普度无窮一切天人莫不受慶无量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經月華陰景中有大神龍衣虎符度兆先宗爲上世亡魂斷地逮役度上南宫七月長齋誦詠是經月華陰景中有大神黃衣寶章刻兆仙名身得神仙諸天書名黃籙白簡削死立生十月長齋誦詠是經月華陰景中有大神繡裳大紳坐鎭萬靈爲國王帝主君臣父子安鎭國祚保天長存世世不絕常爲人君安鎭其方民見太平八節之日誦詠是經月華陰景布光八天得爲九宫眞人本命之日誦詠是經月華陰景立兆生形神生腹中玉珮金璫靈液注胃身得長生魂神澄正萬炁長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐紫黃白三色素雲之中內外蓊冥有青龍白虎朱雀𤣥武師獅子白鶴羅列左右日月照明洞煥室內項生圓象光暎十方如此分明密咒曰无上𤣥元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啟所言今日吉慶長齋清堂修行至經无量度人願所啟上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始洞𤣥靈寶本章月華陰景上品妙首十回度人結璘隱韻離合自然混同陰景无无上眞黑金之炁𤣥一之胎外陰內陽至精未開靜極生神金水聚形圓照浩劫海嶽澄明陽獨化息陰凝變停二象冥合𤣥牝體幷陰升雨露陽降淵泉元始祖劫化生諸天祖爲陰景月華含蓮開明三辰是爲天根上無復祖惟道爲身月中靈文黃書騫林葉有玉章普殖神靈無文不光無文不明無文不立無文不成無文不度無文不生是爲大梵天中之天鬱羅玉闕蘂淵金臺上極無上大羅玉清眇眇劫仞若亡若存三華離便大有妙庭玉戸蘂房森羅紫霐神霄梵炁周回十方中有月華陰景之神中有南極長生之君中有東極青華帝君中有十龍飛車司馬大神中有好生韓君丈人中有南上司命司錄延壽益算度厄尊神迴骸起死量度人今日校錄諸天臨軒東方无極飛天月中黃華神王長生大聖无量度人南方无極飛天月中赤儀神王長生大聖无量度人西方无極飛天月中素魄神王長生大聖无量度人北方无極飛天月中紫字神王長生大聖无量度人東北无極飛天月中神光神王長生大聖无量度人東南无極飛天月中陰火神王長生大聖无量度人西南无極飛天月中紅露神王長生大聖无量度人西北无極飛天月中瑤闥神王長生大聖无量度人上方无極飛天月中五后神王長生大聖无量度人下方无極飛天月中玉妃神王長生大聖无量度人十方至眞飛天月華陰景神王長生度世无量大神並乘素雲玉輿丹輦霞蓋金輪驂駕靈鳳十眞白龍建廣寒之節燿靈神旛前嘯天樂齊唱後吹神籟同鳴獅子白鶴嘯歌噰噰五老啟途羣仙翼轅億乘萬騎浮空而來傾光回駕監眞度生玉闕丞相南昌上宫韓司主錄監生大神執籙把籍齊到帝前兆能感恩玉天流霞注極碧𤣥月中黃缶挹華祕泉神水透漠眞光變仙嚥液寶章心念白元有五夫人扶擕蹁躚泝煙奔車十龍駕軿上動高晨下通幽關隨所應度嚴校諸天普告三界无極神鄉泉曲之府北都羅酆三官九府十二河源上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼羣月皇符命時刻昇遷北都寒池部衛形魂制魔保舉度品南宫死魂受鍊仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度三途五苦八難超淩三界逍遙上清上清之天天帝洞璘無色之境梵行東方八天玉里延皇天帝陸建封佐秀峯碧華天帝聖司髙安龍喬聖驥天帝逸徒超方平洞浩元天帝彭泠丕江濟眞常樂天帝辨宗豫元震光保生天帝廖都洛兟化𤣥開叙天帝仙瓊紫璠九山龍淵天帝云濤迷成南方八天赤陽鳳炁天帝竺毗達良燿靈寂思天帝寗華笳熏載陋賓天帝妙瀆慈恭錫眞无極天帝隱梵多容絳立顯源天帝初炎英摩火巖考過天帝略多倚臺元命欽光天帝聰規謨名明虛正一天帝邊朋袪屍西方八天尾神監籍天帝乙魁綿都錬仙變𤣥天帝嶽漸穹蘷文斬魔天帝眞陀兮公七絕注明天帝覺祿幽僅太素布揚天帝逸寧无均梵光騰剛天帝直嘉韞初液靈化魔天帝蘇伯寅聖格致仙天帝仲務建師北方八天混光騎昇天帝號巴部迤寶炁耀精天帝正幼完時道育曲蒙天帝正昭泰光越龍𤣥鑒天帝海礜正該命仙海畿天帝保機永生落監總明天帝季光熾倫飛斗呈意天帝燿次夷極霄庭度眞天帝正澤䖍靈三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻月中之音月中之尊月中之神月中之眞月中之靈九炁十華變化上清无量之奧深不可詳敷落神眞普度天人今日欣慶受度厯關諸天請滅陰惡斬絕地根飛度五斗名列太𤣥眞王監舉無拘天門東斗龍光西斗虎翔北斗狼據南斗鳳璫中斗麟伏共成華芒爲月陰景變化奇常青帝吐霞白帝執玉赤帝執火黑帝隱局黃帝合神月精鍊眞青景神王角應巴元赤景神王箕翼擔天白景神王參力翻山黑景神王𤣥正醜監黃景神王魁𩲃横天月華陰景五色回旋降兆三宮眞王舉仙月華神王萬神之宗飛行鼓從總領神兵揚霞太空神光赫奕諸天齊功陰眞度人嚴校北酆神公受命普掃不祥青龍吐毒白虎四張朱雀前驅𤣥武仗旛擲火萬里流鈴八衝敢有干試閉固月精金刀前戮玉戟後刑屠割鬼爽風火無停千千截首萬萬翦形魔無干犯鬼無祅精三官北酆明檢鬼營不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列言上清元洞肇萌陰景誕陽陽求於陰陰留於陽終始五運自龍及康日在月中水護金房陽從陰生以柔德剛身無太陰發爲狂陽陽絕形斃非聖用藏眇眇億劫混沌之中上金爲色下水爲淵中有至無神炁所安風澤洞虛金剛乘天天上天下無幽無冥無形無影無極無窮溟涬大梵遼廓無光陰景開明運度自然元始安鎭敷落五篇赤書玉字八威龍文保制劫運使天長存梵炁彌羅萬範開張元綱流演三十二天輪轉無色周回十方旋斗厯箕回度五常三十五分總炁上元八景冥合炁入𤣥𤣥𤣥中太皇上帝高眞汎景太霞嘯詠洞章金眞朗郁流響雲營玉音攝炁靈風聚煙紫虛鬱秀陰景化仙千和萬合自然成眞眞中有神長生大君青華公子月魄尊神太乙司命桃康合延執符把籙保命生根上遊上清出入華房八冥之內細微之中下鎭人身泥丸絳官中理五炁混合百神十轉回靈萬炁齊仙仙道貴生无量度人月有十門飛天寶輪罪福禁戒宿命因緣普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有空洞謠歌之章眞王靈篇辭參高眞第一月華陰景飛空之音六合皆空初无一物空忽自噓炁風轉足風號剛風炁爲元炁炁如黑霧風鼓而聚化爲黑月遊汎無所黑中生赤赤丸爲日天地華實月爲日根十者徧出五色流津月華陰景萬靈仰尊至隂生陽其光乃昌造化之本陰陽爲防五引結璘精天人來我傍第二月華陰景眞王之章龍山之阿綠羅抱月天光潛遘四飛玉雪極陽生陰陰爲物君陰靜無爲萬物芸芸陽動陰靜陰景自正靜則變化各正性命兆不知眞常勞我神自破居空不知抱神抱神曰靜陰景爲令中生至陽飛神躡罡咽黃金液遊白雲鄉胡爲樂世間朱顏徒爾蒼第三月華陰景眞王歌曰神風駕明月世界隨雲行不知萬樓閣玉棟虹霓生天后服黃繡曳環響葱衡光分九天上十龍馳素英上學仰神廬引華含至精易骨三洗腸神霄刻仙名腦血自充溢陰景延遐齡𤣥露生海璖眞水來杳冥南宮度七祖北都消罪嬰逍遙乘飛車奔造廣寒庭浩劫留芳顏千載無愁聲故知上眞道妙化生羣靈我歌太清下俯輪驂玉馬金波漲天來秀色若可把月漿滋百神再歌調再陳此三界之上飛空之中眞王歌音音參洞章誦之百徧名度南宮誦之千徧眞王保迎萬徧道備飛昇太空過度三界位登仙公有聞靈音眞王敬形敕制地祇侍衞送迎拔出地戸五苦八難七祖昇遷永離冥官魂度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是月中高眞結璘神王隱祕之音陰景之道陽炁之先陽爲陰留月因日弦黑白分胎金水性全駐息延命育胎固年天地持之月華蕊淵內生炁母萬類之元伏藏始祖眞火繼傳三官往來造物功全上帝無爲元德潛敷皆是大梵之言非世上常辭言無韻麗曲無華宛故謂𤣥奧難可尋詳上天所寶祕於𤣥都高上神霄玉清王府道君降世隨運下傳若有至人齎金寶質心依舊格告盟十天然後而付焉道言夫天地運度否終日月五星虧盈至聖神人休否末學之夫疾傷凡有此災同炁皆當齊心修齋六時行香十徧轉經福德立降消諸不祥无量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太陰臨過之時同學至人爲其行香誦經十過以度尸形如法則月華停彩陰景降精眞炁歘生陽神盡復魂神徑上南宮隨其學功計日而得更生轉輪不滅便得神仙道言夫天地運終星宿錯度日月失光四時失度陰陽不調國土有災疫毒流行兆民死傷師友命過亦當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受賴其福難勝故曰无量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋燒香誦經十過則諸天記名萬神侍衞右別至人尅得爲聖君金闕之臣諸天記人功過毫分無失天中眞王亦保舉爾身得道者乃當洞明至言也東方八天陰睇遘景月珠凝液岵基輝魂碧霞投蹟粹功稱羅乙珠岡璧度靈疏妙靈眞秀激郯中赫沙祕俞勤律昌角柳鬼奇明暎日博訶元宗化池杳密陽眞成風運華調遹南方八天丹曜蔚靈伺訣膺珮陽規橫登洎桴涓極瑤湍函虛眞合定化流乘步邦補雲浮廊敘驛騰炎司執遄漂瀾媚洞阿禁眞瓊洮穎兵芝露錞叩蘊塞奠振毗諦𤣥方岐泰西方八天靈持啟傳塾鍔雲帥轄餼維爵參畢昭對狀皇仙叢厯霞猶外青扎禮光金雷寂渭鍊繁菲籠三素閱兌衍弼記寶鳳關璘嶢典執討廉𤣥鄉神衝澄霸演熙長庚浮瑞北方八天峒淩魁浪敵波軒煥薰儲蕆輔龍眞丕傳握紐陣魔揭雷祝垓烈山傾奔黑虛刁端蒼龜火蛇幽泉斗官制邪馘醜頂剛巫鑾洪矜寶源𨇠危絡輪蓋辰捧台帝觀礫遵道言此諸天中月中璘文大梵隱語无量之音舊文刻書月中十芒之闕以招結璘大神布光太無召陽成眞萬類得文陽歸眞陰眞陰固陽使神炁存金體玉骨月華鍊形蕩穢致仙高上欽聞贊天元功萬億福成字皆廣長一丈天眞皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣飛騎神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大功眞王保舉上眞道備尅得遊行三界昇入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致飛騎下觀月妃遙唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅清河海靜默山嶽吞煙萬靈振伏招集羣仙天無氛穢地無祅塵冥慧洞清大量𤣥𤣥也角集三音釋𡜍嫉本字𡏅音卽𧵥音垝財也頧同追不正貌瓌音傀爛音瀾鍔音咢冪澒余頃切窊音䨟下也鈆音鉛𨚧音加𩁹音于甘雨也暎與映同克飤音寺粮也耼音丹銲音翰覷蛆去聲滉音愰水光也汵音紺池也礜音預毒石也璖音渠環屬也洎音曁卽競字重刋道藏輯要元始无量度人上品妙經卷之十六道言昔於𤣥變天中元明靈歌大眞化土受元始度人陰陽離合五行化體无量上品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖高尊妙行眞人無鞅數眾乘空而來凝輝明虛絳輦丹輿扶華翠葆暎燿非煙瑞炁八靄靈光四纏九日九夜諸天陰陽經緯二景三元停運息機太空騫朗洞極難名風雲靜肅物象敷榮一國地土山川林木緬平一等無復高下土皆紋玉交纏萬彩眾眞侍座元始天尊𤣥坐浮空太極十華九光之座說經一徧諸天大聖同時稱善是時一國男女疾累悉得消除說經二徧物遂其生說經三徧道炁歸形說經四徧人民富夀俱獲延長說經五徧二儀升降和合自然說經六徧四時順德造育化愆說經七徧百靈恊化萬寶咸熙說經八徧率土之內安裕豐康欣樂太平保世榮昌說經九徧風俗湻厚尊崇道眞說經十徧存亡受惠普賴𤣥恩是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一徧東方无極无量品玉寶大神無鞅之眾浮空而至說經二徧南方无極无量品𤣥眞大神無鞅之眾浮空而至說經三徧西方无極无量品太妙大神無鞅之眾浮空而至說經四徧北方无極无量品紫陽大神無鞅之眾浮空而至說經五徧東北无極无量品度化大神無鞅之眾浮空而至說經六徧東南无極无量品好生大神無鞅之眾浮空而至說經七徧西南无極无量品明華大神無鞅之眾浮空而至說經八徧西北无極无量品𤣥冥大神無鞅之眾浮空而至說經九徧上方无極无量品玉虛大神無鞅之眾浮空而至說經十徧下方无極无量品眞皇大神無鞅之眾浮空而至十徧周竟十方无極天眞大神一時同至一國男女傾心歸仰來者有如雲飛霧集無鞅之眾迮國一半土皆徧陷非可禁止於是元始攝聚二景日月𤣥根盤結縈纏成一寶輪大如車轂在空𤣥之中去地九丈元始登引天眞大神上聖高尊妙行眞人十方无極陰陽五行至眞大神無鞅數眾俱入寶輪之中天人仰看惟見勃勃暎其光明而入於中旣入寶輪不知所在國人廓散地還平正無復欹陷元始卽於寶輪之內說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷天地率土道合至眞無虧無敗無動無擾無愆無塞無乖無異無衰無滅物無夭喪命有長生慈惠相保仁善恊心國安民豐欣樂太平經始出教一國以道預有志心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是眞王內諱百靈之隱名也出有入無離合陰陽五行變化其體歸常能明能光能存能亡知而行之驅陰運陽非世之常辭上聖已成眞人通𤣥究微能悉其章誦之十過諸天諸地陰陽五行運化之神設禮致恭齊來敬仰妙用常和正氣不忘生津自開品彙咸若無有隳殘至學之士誦之十過則陰陽順德五行齊功上循天紀厯度不窮保濟否厄絶而得延所以爾者學士道炁未純體未合神撫調致理位未達𤣥任力可以消卻時災禳制運會但袪害而已蠲其殃禍輕誦此章考罰被身供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到陰陽五行錯謬之氣勃沴之理皆卽協和契會至眞道備三年輔化通幽咸致神靈而運用𤣥關造育生成如司其權錄名金闕簡在玉清也上學之士修誦是經陰陽五行外內合𤣥外營恢範內守天元內外之機符其自然世人受誦則日月星辰降注其晶於其身中後皆得作尸解之道魂神暫滅不經地獄卽得返形遊行太空此經微妙普度無窮一切天人莫不受慶无量之福生死蒙惠上天之寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及七祖長役鬼官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經陰陽離合萬物受生剛柔和恊錯綜五炁化體無傷形神永存七月長齋誦詠是經陰陽離合萬物受成載營抱魄充備五德化體彰明形神永全十月長齋誦詠是經陰陽離合萬物歸眞混合𤣥根育養五精化體常堅形神永昌總其上道保鎭帝王國祚綿綿至治無疆八節之日誦詠是經開導和氣集助化功修積無已登獲仙宗本命之日誦詠是經陰陽五行神妙之元保我生命扶我軀靈長離苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐靑黃白三色雲炁之中內外蓊冥有靑龍白虎朱雀𤣥武師子白鶴羅列左右日月照明洞煥室內項生圓象光暎十方如此分明密呪曰无上𤣥元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啟所言今日吉慶長齋清堂修行至經无量度人願所啟徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經

front:
  text: 元始洞𤣥靈寶本章迴生起死萬變度人眞王隱韻混合自然玉虛妙文總括至神元始之初洞化𤣥元肇明三氣生育萬靈是爲道本無所不眞陰陽總會玉華煥彰無文不光無文不明無文不立無文不成無文不度無文不生是爲大梵妙粹之宗紫淸上京瓊室雲房極眞所御生化之根浩浩帝氣或聚或分朱陵丹天瑤臺閬風玉宸紫館方諸鬱靑巡布流衍周迴十方中有度人起死之神中有迴生結化之君中有三素元君大神中有十方皇靈丈人中有南上司命司錄延壽益算度厄尊神迴生起死無量度人今日校錄諸天臨軒東方無極度命神王長生大聖無量度人南方無極鍊魂神王長生大聖無量度人西方無極衞質神王長生大聖無量度人北方無極保化神王長生大聖無量度人東北無極致仙神王長生大聖無量度人東南無極寶氣神王長生大聖無量度人西南無極迴生神王長生大聖無量度人西北無極起死神王長生大聖無量度人上方無極超形神王長生大聖無量度人下方無極成德神王長生大聖無量度人十方至眞飛天神王迴生起死無量大神並乘灝彩梵氣金宸紫翠流華景雲瓊鑾散花八威羽輦絳旗組帷霞輪珠蓋驂駕龍鳳建執巾幢前嘯玉眞齊唱後吹簫籟同鳴獅子白鶴嘯歌噰噰六眞啓途四將翼轅億乘萬騎浮空而來傾光回駕起死迴生天機丞相南昌上宮韓司主錄監生大神執籙把籍齊到帝前隨所應度嚴校諸天普告三界無極神鄉泉曲之府北都羅酆三官九府十二河源速召司命迴生命還算窮增夀形死易籖勾姓移名黑籍灰焚上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼羣元始符命時刻昇遷北都寒池部衞形魂制魔保舉度品南宮死魂受鍊仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度三途五苦八難超淩三界逍遙上淸上淸之天天帝洞眞無色之境梵行東方八天洞幾寂夷天帝重光晞明孔常茂祺天帝瑤旁祖璫彥麗漢度天帝翹亞寵璐昌治秔銖天帝方詵九圖沖忽晝虛天帝就佽爰表雍田禧福天帝覺龍燕斤全遙無思天帝斗巨莽沙側淸舉藝天帝侯符命連南方八天角千火杵天帝霞鮮明尊洞微浩陽天帝和裔並耀起龍進成天帝藻濟倣滁極鵰祥天帝褒允嘉峻房光重天帝定中慈昇洎正由仙天帝邈思雲襄空𤣥懷漠天帝輔甯氐安崑嶼芳凝天帝妙曩滋來西方八天寶熙列儀天帝邈師至京道維部需天帝九宸微樞厯陶極眞天帝迴贊育敦慶緒統皇天帝蒲延已存制魔曠猷天帝澤煥頤洹亮恭侍祥天帝敷遠頓章溶境麗光天帝玉攴鹿步夏琳朱府天帝月嬰無將北方八天聚咸承籍天帝演題池琥馬應崇元天帝頌頥布靈蘿暠福世天帝神洋觀璞詔印八鸞天帝都仙機逸登翠廓天帝燄摉披堂霄庭應朝天帝慧總龍釋虛素文天帝𤣥元神長梵元勝樂天帝行維上監三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻召生之音立命之尊感化之神變化屍魔出胎成靈陽和陰合降氣上淸無量之奥深不可詳敷落神眞普度天人今日欣慶受度迴生起死厯關諸天請滅三惡斬絶地根飛度五苦命生太𤣥魔王監舉無拘生門東斗送魂西斗筮魄北斗定品南斗課年中斗主福大魁保生周護三台總監眾靈靑帝知覺白帝興能赤帝動識黑帝鍊精黃帝受形萬神居身靑天魔王迴生繼絶赤天魔王還氣甦血白天魔王引息如繩黑天魔王六用通靈黃天魔王制鬼育嬰五帝大魔萬神之宗飛行鼓從總領鬼兵麾幢鼓節遊觀太空自號赫奕與天齊功上天度人嚴攝北酆都天受命普掃不祥八威起死枯朽更芳神龍列馭眞吏揚威天丁呼魂大帥舉身百神返歸玉輅金軒死注斷絕鎖鬼北山擲火萬里流鈴八衝敢有干試拘遏上眞金鉞前戮巨天後刑屠割鬼爽風火無停千千截首萬萬剪形魔無干犯鬼無祅精三官北酆明檢鬼營不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列言上淸寰虛遐默劫胞混康眇眇億萬生化混沌外無定色內無定淵風行六虛金液浮天天上天下無幽無冥無形無影無極無窮溟涬大梵遼廓無光中有至精自知自生覺亦無覺明亦無明不以覺明道化全神神來卽生神去卽死生卽胎謝死乃蒂落氣接神生氣索神消血結骨枯挺然屍居九蟲爲魅蝕腦啖髓藏神泥丸生道固天神不去身起死成人爾有道力枯骨更生死滅冥默魂遊魄息如劫未開昏昏寂寂赤明開圖運度自然元始安鎭敷落五篇赤書玉字八威龍文保制劫運使天長存梵氣彌羅萬範開張元綱流演三十二天輪轉三界周迴十方旋房厯心迴生起死還返五常三十五分總氣上元八景冥合氣入𤣥𤣥𤣥中太皇上帝高眞泛景神霄嘯詠洞章金眞煥擲流響雲營玉音攝氣迴風聚烟紫虛鬱秀輔翼萬仙千和萬合自然得生生命有神長生大君無英左官白元右神太一包識司命頒靈桃康氣元合延母精執符把籙追死更生上遊上淸出入華房八溟之內細微之中下鎭人身泥丸絳宮中理五氣混合百神十轉回靈滌鍊神形三一還眞萬氣齊仙仙道貴生無量度人上開八門飛天法輪罪福禁戒宿命因緣普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有空洞謠歌之章迴生靈篇辭參高眞第一欲界飛空迴生之音太空之中無有內外一熒生光變此天地天地何生熒光爲神神立成氣氣亦無形無形無名化生三淸乾坤萬類以此得生能保此生生來無蹤天道貴生鬼道貴終終盡其氣不終其神神無終始和以天均自然迴生死壞不經死者神逝胡不留神神其可留生死俱濟屍形委委見性忽無見無所見與眞爲徒骨有𤣥空氣入如風歘然神至笑語形容此道維何以意合𤣥𤣥通意感自然而然靈文迴玉算萎屍返五官我誦上淸章制魔詣可韓執契告司命沈冥立生還第二色界起死長生之章赤扉景霄上環日流紫煙中有綠衣人吹簫乘白蓮稽首玉淸王校籍徵萬仙執籍招九魂秉策開八關命窮呼帝皇寶杖指神還延生佩黃縷赤書鬱斕斑七魄入蘂房玉女啓瓊軒羽蓋羅太上靑龍遶烏鸞白雲迴絳宮靈光舞胎仙命魔塞寒池誅奸瑩奇泉滅形無常鬼恭誦大有篇百神守太𤣥流珠響珊珊靈津濯枯枝柔條翳蘭鮮眞氣灑八極玉骨同蛻蟬上道貴簡妙祕語甯輕宣第三無色界高上神霄玉淸王歌曰眇眇玉闕碧頂在上梵氣如河流演八天鳴湍寫鍊沸濤絞雷我氣炎衝萬物生囘三界有生俱承妙氣黃𥹋金液山橫鼎峙賦其巨者高眞仙王與其細者公侯佩璫研丹比豆玉京俄就日月交飛我命長久亹亹繁生握珠自得不知太空𤣥道是則化機不運三界休息眞一未明五行爲賊顧彼嵳峩風謠空歌咳笑浩劫神都可過我位上王萬變𤣥中惠兆絶命九竅互通返屍生形致天六龍至陽若無有感和忽𤣥同此三界之上飛空之中眞王歌音音參洞章誦之百遍名度南宮誦之千遍靈魔保迎萬遍道備飛昇太空過度三界位登仙公有聞靈音迴生返形勅制地祇侍衞送迎拔出地戸五苦八難七祖升遷永離鬼官魂度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及神霄眞王隱祕之音招致生眞還復屍魂九宮揚靈煇三府凝玉津身被紫景面澤朱光超淩𤣥都皆是大梵之言非世上常辭言無韻麗曲無華宛故謂𤣥奧難可尋詳上天所寶祕於神霄玉淸上宮東華寶室依𤣥科應運下傳若有至人齎金寶質心依舊格告盟十天然後而付焉道言夫天地運度亦有否終日月五星亦有虧盈至聖神人亦有休否末學之夫亦有疾傷凡有此災皆可迴還生氣起濟窮絶同氣皆當齊心修齋六時行香十遍轉經福德立降消諸不詳無量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太陰臨過之時同學至人爲其行香誦經十過以度屍形如法則生神赴身宮室開明死戸閉塞穢胞蕩淸天機𤣥省南昌上宮返其䰟神隨其學功計日而得更生轉輪不惑便得神仙道言夫迴生起死靈寶所重神霄禁書大至天地細逮人物皆有生死增減益算之道天地運終己亥交氣星宿錯度日月失昏躔次推移四時失度陰陽不調金勝火伏國境有災兵盜時作太一行宮疫毒流行兆民死傷人運臨剋師友命過眞譜斷宗亦當修齋行香誦經迴生以成吉起死以破凶福應不淪生道咸賴切於己形施於天下靈祕至微下學殊昧夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衞右别至人剋得爲聖君金闕之臣諸天記人功過毫分無失天中魔王亦保舉爾身得道者乃當洞明至言也

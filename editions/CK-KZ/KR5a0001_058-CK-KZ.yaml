body:
  text: 東方八天帝錫寶瑄賚仙績洪元奥昊允資昇九沖確璃峻翹璨華炎封邃亶瑤廊靈池杳府鑒池斗普載護龍祖尚師趫騫願寂宿與丹策韓璽玉璣遠威奏逕直鑾偏呈邱陂南方八天軸璆蘭序展逸冒弸欹移追胡囘靈君漢萬齡柱天金鑿曜殿葳萎美眸皎慶枚施爵關神那疆鄙攸司鬼社興生獨官呵泉濟龍穴火灌瀆旼𤣥秀魁璘女福和育千西方八天适錄伊駟陰裳比暄漬雲吸灨白鍊虎邅氣弦浴神庚魂繞乾斗閣注簡命皇奏延渾恍廓合應殊交淵沔漠甫察丹露虯仙竟祈蕭琢月薦璵偕整審屍爽宸令迅傳北方八天極道無壁靑神意閧溢漿泝巓默求取饗餌歛藏鬼鳳石玉響香英靜南俱圍並黨隙窬密靈妙好自并忽劫億仞止圓洞淸教滔唱繁眞至眇綿浩宅罔住混古稽言道言此諸天中大梵隱語無量之音舊文神霄眞王紀錄紫臺碧閬之上招諸天以囘生勑北都以起死鬼神禮之以增靈仙聖佩之以洞妙天地因之以化育陰陽通之以媾形鼓槖運神氣來命會生道之諱不可不知以保長存天眞皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣囘生復形神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳眞仙保舉上淸道備尅得遊行三界昇入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致神王下觀上帝遙唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅淸九峯靜默七澤吞烟萬靈振伏招集羣仙天無氛穢地無祅塵冥慧洞淸大量𤣥𤣥也

front:
  text: 元始无量度人上品妙經卷之四十
  hash: sha256:6a763ca9117d952852883a561575bf81c0affa07e6b61843665aabba79234b2d
body:
  text: 道言昔於紫元天中流雲飄歌太𤣥光土受元始度人北都除殃无量上品元始天尊當說是經週囘十過以召十方始當詣座天眞大神上聖高尊妙行眞人北都大帝羅酆羣眞北方斗牛女虛危室壁七宿星君北斗司命北都司察官曹掾吏北都飛騎立斗大神北都黑甲五氣魁吏溟泠大神北都九醜捉殺五天元帥除殃神王无鞅數眾乘空而來蒼霞紫璆之輿瑿璧山雲之輦碧蓋垂蔭𤣥精玉光海色鬱凝洞煥太空七日七夜諸天層輪止虛辰緯停度龍山息鼓玉璣不行神風靜籟嶽雲散影天德高淸坤維靜粹一國地土山川林木緬平一等無復高下土皆作碧玉無有異色眾眞侍座元始天尊𤣥坐空浮六明純燿九宮混氣瓊山寶牀之上說經一遍諸天大聖同時稱善是時一國男女以念道力故豁然心開明悟下世生民先因積業罪報不停結釁羅酆若非聞經殃不可除說經二遍覩見元始身有慧光照徹十方猶如朝日北都三官上下六洞九幽無間𡨚仇和釋五苦停酸說經三遍法音淸妙普聞十方證悟天人具無漏相說經四遍凡類眾生忘怨毒心陰相謀害變爲法侶說經五遍殃注之苦三災之難沉瘵屍疰一時解脫歡喜更生說經六遍種民眞學息鎭太无正念通虛神朝上境說經七遍國永太平尊道貴生無私無欲民不夭傷說經八遍諸天稱慶北都除殃和順運誠獲見眞理說經九遍天流彩雲地錄神芝說經十遍大帝遙臨來證說法天人讚歎聲徹九淸是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方无極无量品北都除殃大神无鞅之眾浮空而至說經二遍南方无極无量品北都除殃大神无鞅之眾浮空而至說經三遍西方无極无量品北都除殃大神无鞅之眾浮空而至說經四遍北方无極无量品北都除殃大神无鞅之眾浮空而至說經五遍東北无極无量品北都除殃大神无鞅之眾浮空而至說經六遍東南无極无量品北都除殃大神无鞅之眾浮空而至說經七遍西南无極无量品北都除殃大神无鞅之眾浮空而至說經八遍西北无極无量品北都除殃大神无鞅之眾浮空而至說經九遍上方无極无量品北都除殃大神无鞅之眾浮空而至說經十遍下方无極无量品北都除殃大神无鞅之眾浮空而至十遍周竟十方无極除殃大神一時同至一國男女傾心歸仰同悟無爲方知一心造此多業愚民無知動干罪殃失忠孝之行懷陰賊之謀貪冒狠愎淫殺敗眞妬害賢良犯禁𤣥科魂歸北都身謝三官受苦億刼無有休停乃至得生災病纏留萬無一善不知罪積致此受殃若不誦詠眞文祈告北都醮謝七宿則殃不可除願聽元始明顯北都除殃之法來者有如細雨密霧无鞅之眾迮國一半土皆偏陷非可禁止於是元始宣示十方天人曰北都羅酆中有大帝六洞山城十二小洞三官九府百二十曹一十六獄二十四獄三十六獄八十一獄百二十獄如是大獄北都寒池遠在下方東北癸地大海之內有酆都羅山名曰北都天尊陰眞鬼帝所理故號酆都酆爲城名羅爲山名都爲聚處去此天境下觀非遙山高三十六萬里山根入水三十六萬里宮闕樓觀貴擬諸天其間考對罪魂長夜不息悲苦之聲充震天地此大山之上干於斗牛七宿每宿之氣下貫都城此爲北斗陰神制轄北都中有大帝𤣥滋天君黑帝尊神身長千尺服𤣥龍之衣圓冠方履乘駕九龍無極之輿丞相官屬萬億鬼神惟此鬼神實與人等並皆胎生其身自然通靈變化譬如龍蛇毒獸並是胎卵所生變化大小神化不測北都鬼神悉亦如之无量之眾還來人間與人婚宦商販生業一與人同皆是大帝密遣伺察生人眾生不能制戒心性肆造惡業不忠不孝不義不仁一一疏記奏上北都北都神王以日計時簡奏大帝帝敕惟允則使世人命爲不遂運會凶殃一切橫夭皆自所招萬死萬生不可解脫我以哀憫普爲救護敕使北都除殃滅禍且北都有諸大神一切眾生投詞叩請嚴醮築壇敷露眞文誓天自悔則殃禍立除身壽安永諸大神者北都神王北都鬼相北都陰斗左司命主生諱閣陰斗右司命主死諱闓北都左司命主生死罪錄諱灌生北都右司命主一切殃罰諱啟成北都左司察主考定功過諱闉北都右司非主治獄典錄諱關已上諸大神乃主行殃禍特能除之奏章懇禱大殃積負頓可除釋汝其受之大眾伏地再拜稽首謹當奉行元始說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有禍殃傾土歸仰咸行善心不殺不害不嫉不妬不淫不盜不貪不欲不憎不𡜍言無華綺口無惡聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是北都大帝內名隱韻之音亦是北王內諱百神之隱名也非世之常辭上聖已成眞人通𤣥究微能悉其章誦之十過諸天遙唱萬帝設禮陰爽代釋殃苦消除福感自然祥應昭顯羣魔束形鬼精滅爽迴屍起死白骨成人至學之士誦之十過則北眞竦聞陰官稽首魔精喪眼鬼殃截源濟度垂死絕而得生所以爾者學士穢氣未消體未洞眞以制十方威未制天政德可伏御地祇束縛魔靈但除殃而已不能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過北君齊到億曾萬祖幽魂苦爽殃注斷絶皆卽受度上昇朱宮格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也上學之士修習是經殃注解脫皆卽受度飛昇南宮世人受誦斷絕凶穢死戸閉塞北都除殃東華記名則延夀長年後皆得作屍解之道魂神暫滅不經地獄卽得返形遊行太空此經微妙普度无窮一切天人莫不受慶无量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長考北山侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經北都除殃傳注速寗爲上世亡魂斷地逮役度上南宮七月長齋誦詠是經北都除殃七祖超昇身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經北都除殃壽益增昌爲國王帝主君臣父子安鎭國祚保天長存世世不絕常爲人君安鎭其方民稱太平八節之日誦詠是經北都除殃萬彚蒙恩得爲九宮眞人本命之日誦詠是經北都除殃落兆死名魂神澄正萬炁長存不經苦惱身有光明三界侍衞北帝司迎萬神朝禮名書上天功滿德就飛昇上淸道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐靑黃𤣥三色雲氣之中內外蓊冥有靑龍白虎朱雀𤣥武獅子白鶴羅列左右北都大神森然對几降臨兆前日月照明洞煥室內項生圓象光映十方如此分明密咒曰无上𤣥元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啟所言今日吉慶長齋淸堂修行至經无量度人願所啟上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始洞𤣥靈寶本章北都除殃上品五氣度人酆羅隱韻冥漠自然混洞元老无无上眞元始同生北帝高尊陰斗七元下統酆城羅山巍峩九府奠分龍漢祖刼北都六天靑河丹井雲門洞泉中有大神垂絛龍巾攝制魔靈善惡咸論考謫慘酷疏記罪名律禁奉承無有不聞𤣥銅環牢海峙山根太𤣥鬼祖骨肉爲身同道變化龍伏風奔窺盜世法窮搜業因遞種爲殃永溺轉輪道有玉篇開宥靈文無文不光無文不明無文不立無文不成無文不度無文不生是爲大梵天中之天酆羅北臺黑山𤣥京上極高上𤣥羅浩淸眇眇劫仭若亡若存三華離便大有妙庭下極北都三官羅酆魔洞鬼營火山寒池左淨右霐太光梵炁周囘十方中有北都除殃之神中有北極黑帝靈君中有九天都禁司馬大神中有注生定死北陰天君中有北斗司命司錄延壽益算度厄尊神迴骸起死除殃度人今日校錄諸天臨軒東方无極飛天捕魂神王長生大聖无量度人南方无極飛天攝氣神王長生大聖无量度人西方无極飛天殺鬼神王長生大聖无量度人北方无極飛天羅山神王長生大聖无量度人東北无極飛天巡虛神王長生大聖无量度人東南无極飛天定名神王長生大聖无量度人西南无極飛天都關神王長生大聖无量度人西北无極飛天監領神王長生大聖无量度人上方无極飛天簡奏神王長生大聖无量度人下方无極飛天除殃神王長生大聖无量度人十方至眞飛天北都除殃神王長生度世无量大神並乘蒼虬巨獸飛蓋奔輪驂駕夔龍𤣥角神虎建召靈之節燿景神旛前嘯九歌齊唱後吹八音同鳴紫鯨𤣥羽嘯歌噰噰五老啟塗羣仙翼轅億乘萬騎浮空而來傾光迴駕除殃度生北都丞相酆城六宮總司主錄除殃大神執籙把籍齊到帝前隨所應度嚴校六天普告三界无極神鄉泉曲之府北都羅酆三官九府十二河源上解祖考億刼種親殃延禍種疾除罪簿落滅惡根不得拘留逼合鬼羣元始符命時刻昇遷北都寒池部衞形魂制魔保舉度品南宮死魂受鍊仙化成人生身受度永刼無終隨刼輪轉與天齊年永度三塗五苦八難超凌三界逍遙上淸上淸之天天帝洞虛無色之境梵行東方八天太元都羅天帝𨴋𨵛齊宣𤣥滋燿成天帝辟乾毒王玉寶超想天帝演剛隆論明極濟天帝彥徒罙枚開物順眞天帝平雷判生玉明朝始天帝綿都勤鐸元陽耿化天帝敢霞羅於道光初華天帝篤夏義端南方八天燿利宣眞天帝主軍繁來四極廣晶天帝皇度振什帝樞圓寂天帝律佑符𤣥丹雲紀命天帝忽延輔章厯增元紀天帝齒將比耕還靈端神天帝卜直希辛混明委光天帝濱嘉熙亭道威崇虛天帝蔣露聰喬西方八天籍度高明天帝抱符器圭昌慧資持天帝闌緒稽時維平智寂天帝昭虎育明素雲寶宗天帝尸繿鬱景普明度地天帝末頂昆舉仙鍊功天帝柏曾堯儲素神正矩天帝蹈鈞隱洮康祝運微天帝洪元次胥北方八天𤣥邱總神天帝盻邏伊房變𤣥極眞天帝力可明俱度靈廣時天帝勃提維多生眞慶緒天帝鎭咄匪盈定光浮羅天帝握瑤避須密濟禳助天帝術宣求衡餘梨葆生天帝安夷社辟九淸昌陽道化天帝夜洋雲光三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章北都隱韻梵化之音北都之尊除殃之神北都眞魔除殃之靈九聖十眞變化上淸无量之奧深不可詳敷落神眞普度天人今日欣慶受度北都除殃厯關諸天請滅三途斬絕地根飛度五炁超神北都殃種注胚除蕩無餘滅屍鍊仙名列太𤣥眞王監舉無拘天門東斗天蒼西斗天獄北斗帝車南斗天機中斗黃屋五斗降神牛女交宿符下北都除殃賜福靑帝延年白帝斬精赤帝焚祅黑帝北君建都羅山峙闕酆城臣民萬億輸納帝庭主世罪惡除滅殃縈六天使者巡察幽明黃帝中主護國安人萬神來朝元始化身靑天神王燿羅屍伯赤天神王振矢騫石白天神王斬鬼破山黑天神王瞋睛激電黃天神王倒海巨力五帝神魔萬神之宗監領北都飛行鼓從總領鬼兵麾幢鼓節遊觀太空九旗赫奕六天齊功除殃度人嚴攝北酆神王受命普掃不祥羅天吐毒天狼四張火丁前驅都帥仗旛毒龍萬丈神虎八衝敢有干試拒遏上眞金礕前戮巨天後刑屠割鬼爽風火無停千千截首萬萬剪形魔無干犯鬼無祅精三官北酆明檢鬼營不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列言上淸元晦未明空無邊極晃空生氣風火爲石八阿九周非知非識忽化蒼龍身長百億纏結五柱自龍及康眇眇億刼混沌之中上海無色下海無淵中海風澤洞虛包天金石堅剛漸成碧圓六氣自行五運終天天上天下無幽無冥無形無影無極無窮溟涬太𤣥遼廓無光先生元始乃化北皇鼓鐵爲山鍊金爲房刻玉爲樓九氣煥明乃號黑帝太𤣥元王主治死魂斷注除殃萬鬼魔羣威鎭十方赤明開圖運度自然元始安鎭敷落五篇赤書玉字八威龍文保制刼運使天長存梵氣彌羅萬範開張元綱流演三十二天輪轉五色周囘十方旋斗厯箕回度五常三十五分總氣上元八景冥合氣入𤣥𤣥𤣥中太皇上帝高眞泛景太霞北都除殃殃爲罪種經刼不亡消陰維何志詠洞章金眞朗郁電火激焚流響雲營黑幘萬軍玉音攝氣禍殃速避靈風聚煙北都列言紫虛鬱秀輔翼萬仙鎭兆一身泥丸百關斬滅邪殃靈府氣宣萬神同會玉醴金樽千和萬合自然成眞眞中有神長生帝君靑華大帝飛羅九神太一司命桃康合延執符把籙保命生根上遊上淸出入華房八冥之內細微之中下鎭人身泥丸絳宮中理五炁混合百神十轉囘靈萬氣齊仙仙道貴生无量度人上開八門飛天法輪罪福禁戒宿命因緣普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有空洞謠歌之章眞王靈篇辭參高眞第一北都除殃上相飛空之音四馬揚鑣丹隨我輪飛雲如旗征此魔軍北都闐闐案牘紛紛愚爲業因世植惡根殃自根生胡不爾悛念道太无委心帝前身佩八威金闕玉文十二大神爲兆列陳除殃北尊乘駕鳳軒我行太空金廂玉轅俯視九州邈如深淵大道之妙非賢不傳聞此飛空音七祖升諸天第二北都除殃司命之章通晨大冠絳衣龍章惟我上笏司命之王上帝之策神璽之光來降北都蔭魁乘剛嚴備萬神侍書在傍爲世之人生死尤殃龍祈北尊潔禱壇場敕命寶符仰貯靈光殃除福生壽祿齊昌永離八難衰高升紫雲房救世爲眞人範唱流無疆第三北都除殃北帝君歌曰三十六萬里北都羅酆山上有夜光闕下列九府官陰陽生死曹殃注停其間世愚不念道情欲相追攀出身百年中一往無再還地獄由爾心眞境方寸邊何不謝北都默朝紫皇班首露革爾情天赦無留難一身可得道七祖超冥泉殃注永斷絕福來如轉丸我歎生死途萬刼囚幽關刻志禮神霄雲中仰金顏此三界之上飛空之中眞魔歌音音參洞章誦之百遍名度南宮誦之千遍眞魔保迎萬遍道備飛升太空過度三界位登仙公有聞靈音眞魔敬形敕制地祇侍衞送迎拔出地戸五苦八難七祖昇遷永離殃纏魂度朱陵受鍊更生是謂无量普度无窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及北都眞元隱祕之音福佑生民消除殃禍有能起心祈向斷絕注傳橫害不生眞靈垂蔭一身得道七祖昇眞皆是大梵之言非世上常辭言無韻麗曲無華宛故謂𤣥奧難可尋詳上天所寶祕於高上神霄玉淸玉府道君降聖按法以傳若有至人齎金寶質心依舊格告盟道君然後而付焉道言夫天地運度否終日月五星虧盈至聖神人休否末學之夫疾傷凡有此災同氣皆當齊心修齋六時行香十遍轉經福德立降消諸不祥无量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太陰臨過之時同學至人爲其行香誦經十過以度屍形如法則北都大帝𤣥滋天君監領殺鬼嚴敕幽方太一囘生司命注昌使此形神固息含光魂神徑上南宮隨其學功計日而得更生輪轉不惑便得神仙道言夫天地運終星宿錯度日月翳昏四時失度陰陽不調國境有災疫毒流行兆民死傷師友命過亦當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受賴其福難勝故曰无量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衞右别至人尅得爲聖君金闕之臣諸天記人功過毫分無失天中眞王亦保舉爾身得道者乃當洞明至言也東方八天暨桓乙遲托圖延牝盧須迎皇迮羅紀淸璞化馘廣娑賓雲承緬洛叉忽猷郎匪京諸變方定益陀祖卿藍首伽婁亶迹墮昧覺邦嬪廬英𤣥指門謁斗華溢晞俞嶽秦南方八天踴甯忌童炎牕赤功紹元帝祺令鈀卷冲荑憫康洞幾賢特隆暉芒井圩隸邅俞蒙嬉云同宜逸鎖由夷爵恭韓延王頤預飛便梵奇綱素諠謹儀驛多斯靈變兹溟池西方八天巴堂神禧薦福典隨驛洛規通咽服梁窺厯奔庚和彌錂藴微造星車禳囘黃星微僥正絕仰徒姦報鎞越懋蕩宥曹巖邱佃卓頌嶤甫辨蕣揚艾紐資雲璫弼光迢泰北方八天晝謠瓊都北君陰拘勿淑令趣碧駢謨符洚道綿博映陛乾秀錠累布酉拙倣晉酧熾缾吳扶烈命契斗巒正悽極動咸欹紐轉霞綠綱凝天扁陽吳投吉囉薄辰侶祥道言此諸天中大梵隱語无量之音舊文刻書酆城闍臺九阿之上使兆殃種不生爲道正眞逍遥無物字皆廣長一丈𤣥光眞人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣考察眞官下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大功眞王保舉北元道備尅得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致考察下觀上帝遥唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅淸河海靜默山嶽吞煙萬靈振伏招集羣僊天無氛穢地無祅塵冥慧洞淸大量𤣥𤣥也

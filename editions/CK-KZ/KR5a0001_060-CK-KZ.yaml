運應滅度氣停太陰臨過之時同學至人爲其行香誦經十過以鍊屍炁如法魂神徑上南宮隨其學功計日而得更生轉輪不滅變神爲仙道言天地氣終亦當修齋行香誦經星炁錯度日月失明亦當修齋行香誦經四氣失度陰陽不調亦當修齋行香誦經國土有災兵氣四興亦當修齋行香誦經疫氣流行兆民死傷亦當修齋行香誦經師友氣絶亦當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎭帝王下禳害炁以度兆民生死受鍊其福難勝故曰無量普度天人道言凡有是經能爲天地帝主兆民行是功德氣災之日發心修齋燒香誦經十過皆諸天記名萬神侍衞右别至人剋得爲聖君金闕之臣諸天記人功過毫分無失炁中眞王亦保舉爾身得道者乃當洞明至言也東方八天潭無景憐起寂洞珉太極竟羅𤣥牡犒澠玉幾纏眸碧畢完辰霞廓益眇昆池鏡騰虛蕩醜訐華延目君法達幽演逗雲离寅吹昴葛希樊堂普澄愛祕曲賴滋球侍巾南方八天金基明俞控志煙陵清都閬文舒馘屏迎暮孤燕飛赤冀懋層宛利皇建喬强預侁辨淨普徒微邱霸形花祈若龍道羅韻聲薦巴耶尼九日𤣥京烏佳求嵋碧除隱彌西方八天泉曲監阿齒精浮黎覺逸湛定絳闃侔兮帝忽兹投鉤圖建施流育律逐桑殊巷非林振卽盧苟旨元衣崪岧天山黳樓綿披僅房遠交軒多瓊曲爓絕送治䰟動太儀北方八天蔚蘭未司局丹燿禧崿龍煙梁精泓蘇𢌿氣道神散空中煩璀德鎭洞后題鉏乾羅霞落美太敕淵捧猊璧瑤員月追冥素旗出氣度玉金道八埤黃臺四空虎首澆欹道言此諸天中大梵隱語無量之音鍊氣變仙九宮𤣥文天眞皇人知氣之元得氣之根氣化廓落縱橫成文丹筆書之八角垂輝疊玉排瓊其方一丈四景燿明昔書其文以爲正音有知其音能齋而誦之者道炁鍊眞神隱冲冥諸天眞王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳眞王保舉上眞道備剋得遊行三界昇入金門此音無所不鍊無所不營無所不化無所不明鍊炁變仙自然之音也故誦之致飛天下觀上帝遙唱萬神朝禮三界侍軒羣祅束首鬼精自亡氣激神宮玉音自鳴天球振響道空鬱淸海平嶽竦碧煙金城鶴觀壘壁仙都虛盈萬仙駢擁紫蓋丹旌天地鍊炁變化昊京冥夷超忽大量𤣥𤣥也元始无量度人上品妙經卷之六十一道言昔於始靑天中大浮洞歌𤣥明黎土受元始度人永斷輪轉無量上品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖高尊妙行眞人無鞅數眾乘空而來玉馬雲軺彩霞流靄丹輿彤轂陣蕚飛香三景蔚淸合映太空七日七夜諸天日有龍文月呈寶字星樓鶴觀宿舍機躔一時停輪龍風兼雨鳳氣成山天無浮翳四象高明一國地土山川林木緬平一等無復高下土軟紫金外涵水火淨瑩交徹無有異色眾眞侍座元始天尊𤣥坐空浮無色海光之上金山不動瑞相儼如說經一遍諸天大聖同時稱善是時一國男女見道眞形厭捨生死說經二遍覺悟三業猶彼火聚說經三遍觀身穢壞願證法體說經四遍悲憫三界轉覆如輪說經五遍世間妄見囘念正道說經六遍道可飛神不染麤惡說經七遍自知宿命不貴通靈說經八遍住此眞常永斷輪轉說經九遍壽過天地得眞長生說經十遍證位昇𤣥永無生化是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品多聞大神無鞅之眾浮空而至說經二遍南方無極無量品多目大神無鞅之眾浮空而至說經三遍西方無極無量品堅住大神無鞅之眾浮空而至說經四遍北方無極無量品定海大神無鞅之眾浮空而至說經五遍東北無極無量品神用大神無鞅之眾浮空而至說經六遍東南無極無量品權化大神無鞅之眾浮空而至說經七遍西南無極無量品道聰大神無鞅之眾浮空而至說經八遍西北無極無量品𤣥藏大神無鞅之眾浮空而至說經九遍上方無極無量品永生大神無鞅之眾浮空而至說經十遍下方無極無量品息化大神無鞅之眾浮空而至十遍周竟十方無極天眞大神一時同至一國男女傾心歸仰於所住天所居宮殿咸見元始升座威儀說經演法無量十方光明照見宮殿赫如朝日各相謂言我等位證諸天未出輪轉壽過五劫未免生死身相光明未免衰滅今聞天尊欲說大法永斷輪轉始得開悟入眞法門出生死網來者有如細雨密霧無鞅之眾迮國一半土皆偏䧟非可禁止於是元始振衣凭几頂出大明普照十方世界無極仙眞國土一一國中見諸仙王將引臣從來赴法席又見諸天各持奇華異果玉芝仙草以爲供養有諸仙王居大宮殿而修仙業領理天政心厭欲樂或奔采光華嚥味眞景勸教諸眞種種妙事會中天人心知目矚不敢陳議元始徐啓雷音遍告大眾欲免生死不入流浪先當無心爾若無心卽無三業眾生迷妄指識爲心分別有無計度生死心本妄名以妄取名心則虛幻覺了能知本是道元何關心事認心著境卽住生死若無妄心不住生死卽永斷輪轉乃至諸大天仙高眞帝王以無心故證位聖眞自然得道依心取舎趣死趣生終非究竟乃至服氣鍊化餌藥延年並爲小乘功用感應皆非解脫昇入無形之道爾若不爲心所遷易隨念用情心迹兩忘卽見道體永斷輪轉不住生死與我今者在此無色海光說如是法若以有心則一切護法天人龍鬼悉各遠離不應來此頂禮欽奉故知無心是道眞形是無等法則身所行事十聖莫知口所出言是天帝勅心若計度則魔精來附終歸惡道元始忽從海光混入無色太𤣥空中懸一寶珠大如黍米在太虛之中去地千丈元始登引天眞大神上聖高尊妙行眞人十方无極大道威神無鞅數眾俱入寶珠之中天人仰看惟見拂拂從珠口中入旣入珠口不知所在國人廓散地還平正無復欹䧟元始卽於寶珠之內說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂無遺響是時天人遇值經法普得開悟𤣥默虛明不著空見傾土歸仰咸行善心不殺不害不嫉不妬不淫不盜不貪不欲不憎不𡜍言無華綺口無惡聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是眞王內諱百靈之隱名也非世之常辭上聖已成眞人通𤣥究微能悉其章誦之十過諸天遙唱萬帝設禮雲煙靜默海嶽深靈二象澄廓三景輝明一切有情心契眞道永斷生死輪轉休停至學之士誦之十過則五帝侍衞三界稽首魔精喪眼鬼祅滅爽神飛形固遂其永生所以爾者學士穢氣未消體未洞眞召制十方威未制天政德可伏御地祇束縛魔靈但濟兆身而已不能普度羣靈輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人無量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到三界停輪兆得至眞明曉生根不著有無不滯亡存若有大物爲生死門兆無物相混洞不分永斷輪轉與道杳冥億曾萬祖幽魂苦爽皆卽受度上昇朱宮格皆九年受化更生得爲貴人而好學至經功滿德就復歸無名出離陰陽無犯剋并不屬生死永斷輪轉變化不化更生不生與道合體皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經皆卽受度飛昇南宮世人受誦則延壽長年廓爾得悟𤣥解之道神識不昧應物無窮卽得運形遊觀太冥此經微妙普度含靈一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役考官侍經五帝玉童玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經契道眞極止息生機於諸天中無去來因不住滅定得大乘門爲上世亡魂斷地逮役度上南宮七月長齋誦詠是經惡心消解仇對和平不爲人緣徃返相因寓形黜明元精天成不死不生身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經不住永滅不欣長存乘物以遊爲光爲塵示兆大慈無量度人出教演法寶書天經爲國王帝主君臣父子安鎭國祚保天長存世世不絶常爲人君安鎭其方民稱太平八節之日誦詠是經挺然獨觀八風無傾兆出死生駕馭瓊輪得爲九宮眞人本命之日誦詠是經眞氣虧盈不亡不存永斷輪轉逍遙妙庭魂神澄正萬氣長存不經苦惱身有光明三界侍衞五帝司迎萬神朝禮名書上天功滿德就飛昇上淸道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐黃綠青赤蒼黑碧紫白九色雲氣之中內外蓊冥有靑龍白虎朱雀𤣥武獅子白鶴羅列左右頭上有无无上眞道君頂七曜交泰寶冠面若瓊瑤方瞳素髯威耀光明身被綠霞絳章飛裙手執神劒斷生死魔三天殺鬼乘紫素雲住立嶷然身長九尺上應九眞日月照明洞煥室內項生三氣圓象光映十方如此分明密咒曰无上𤣥元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋淸堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始洞𤣥靈寶本章永斷輪轉周迴度人洞眞隱奧緣起自然赤混靈根空無化成太虛朗徹肇生諸天流演三氣大機彌綸中有虛皇是爲我身𤣥文散落普育萬靈赤景爲陽黃華爲陰圓光森列羅布諸星太一紫房瑤簡綠編啓運元造𤣥中之𤣥圓羅大梵靈闕瓊宮下包黃氣洞淵綱維眇眇蕩蕩六闢九開招靈化人體備百關神變無方與道俱隆顧盻八垣端居玉京中有𤣥極至道之尊中有主生象帝之君中有開天龍蹻大神中有九皇天眞丈人中有把握元紀斡運機紐至妙尊神生成二象无量度人普告一切悟道之元永斷輪轉得爲種民今日校錄諸天臨軒東方無極淸信神王長生大聖無量度人南方無極明感神王長生大聖無量度人西方無極堅立神王長生大聖無量度人北方無極海空神王長生大聖無量度人東北無極聖仙神王長生大聖無量度人東南無極妙慧神王長生大聖無量度人西南無極定常神王長生大聖無量度人西北無極證眞神王長生大聖無量度人上方無極無影神王長生大聖無量度人下方無極不迴神王長生大聖無量度人十方至眞飛天神王永斷輪轉無量大神並乘瓊光綠雲八景琅輿丹霞玉輦驂駕碧鳳九色神龍建交眞之節素虎靈旛前按九章齊奏後吹六竽同鳴靑鸞白鵠和鳴噰噰九靈控飊七眞乘煙謠歌步虛浮空而來傾光迴駕召生命仙南昌上宰總御朱宮韓司主錄堅固大神執籙把籍齊到帝前隨所應度嚴校諸天普告三界無極神鄉泉曲之府北都羅酆三官九府十二河源守識本眞悟見自然無有生死不著變遷道無去來形爲寶山智火鍊之金光玉混比之晝夜日月常懸往還非妄眇眇綿綿法體虛明象外眞仙永斷輪轉昇入太𤣥上解祖考億

front:
  text: 元始無量度人上品妙經卷之五十二
  hash: sha256:07b42046b17643e0f492600f5c730f1000a1488fcd597188f7dd1bd7ddeeaec0
body:
  text: 道言昔於紫元天中綠景空歌太晨光土受元始度人𤣥明洞淵無量上品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖高尊妙行眞人𤣥明洞淵五靈𤣥老水帝八方九海洞淵龍王水官四十二曹江河泉源官屬將吏無鞅數衆昇空而來流雲靄霧黳玉之輿𤣥明之輦紫蓋神輪洞霄垂蔭流虹寶光萬色鬱勃洞煥太空五日五夜諸天日月星宿象沈海影綱蟠玉樞珠暈璣徽停輪駐燿神宮鎭靜靈嶽收雲天浮八騫氣淸九野一國地土山川林木緬平一等無復高下土明玉晶無有異色眾眞侍座元始天尊𤣥坐空浮三光七變靈鼇寶座之上說經一遍諸天大眾同時稱善是時一國男女歸依元始𤣥明洞淵之法悟此生元先從珠露說經二遍信知眞水變化無窮說經三遍知見柔明利物幾道說經四遍思念生宮初降洞淵之氣腎華甲坼神龜漾遊說經五遍心穴宏敷靈潮機動𤣥明散液萬竅滋流諦觀靜念體妙無爲說經六遍天霐澄湛明可分神一一𤣥中具我身相說經七遍洞淵靜碧龍神奉教說經八遍海雲擎露甘液潤生說經九遍水光發爓宮殿千層中有天民咸悟道法說經十遍𤣥明之氣化成紫雲普覆諸天現無爲海幽沈苦爽解脫逍遙是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品𤣥明洞淵至眞大神無鞅之眾浮空而至說經二遍南方無極無量品𤣥明洞淵至眞大神無鞅之眾浮空而至說經三遍西方無極無量品𤣥明洞淵至眞大神無鞅之眾浮空而至說經四遍北方無極無量品𤣥明洞淵至眞大神無鞅之眾浮空而至說經五遍東北無極無量品𤣥明洞淵至眞大神無鞅之眾浮空而至說經六遍東南無極無量品𤣥明洞淵至眞大神無鞅之眾浮空而至說經七遍西南無極無量品𤣥明洞淵至眞大神無鞅之眾浮空而至說經八遍西北無極無量品𤣥明洞淵至眞大神無鞅之眾浮空而至說經九遍上方無極無量品𤣥明洞淵至眞大神無鞅之眾浮空而至說經十遍下方無極無量品𤣥明洞淵至眞大神無鞅之眾浮空而至十遍周竟十方無極𤣥明洞淵天眞大神一時同至一國男女傾心歸仰咸相議言元始天尊來降此天百寶紫元天宮爲諸仙眾顯揚𤣥妙五行眞水之法其氣名曰𤣥明洞淵我聞𤣥明爲眞水之德形色俱美洞淵爲眞水之量幽深無涯若以我等所見五行之水滔天洋洋洪浩不測不知無形五行謂之眞水名曰𤣥明洞淵作何體狀天地未分先有眞土土能固攝十方上下其中眞水無量無邊風氣鼔之凝爲萬物是生命本爲大道元始天尊今日宣演五行無形眞氣之妙我若得聞自得超昇神霄上境皆當朝禮天尊覬獲大慈遺我勝法作如是說敬禮再拜來者有如細雨密霧無鞅之眾迮國一半土皆偏陷非可禁止於是元始懸一寶珠大如黍米在空𤣥之中去地五丈元始登引天眞大神上聖高尊妙行眞人𤣥明洞淵五靈𤣥老水帝八方九海洞淵龍王水官四十二曹靈司掾吏無鞅數眾俱入寶珠之中天人仰看惟見勃勃從珠口中入旣入珠口不知所在國人廓散地還平正無復欹陷元始卽於寶珠之內說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐欻之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸行淸淨妙靈智心心行如水利澤無盡明一明順明通明照明智明慧明辯明道明𤣥明空心無留滯默契𤣥妙同造杳冥深悟至要國安民康逍遙太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是眞王內諱百靈之隱名也妙化無形眞水𤣥明洞淵之法夫𤣥明爲水之情性洞淵爲水之室宅流則爲智靜則爲慧流故能通靜故能照爾能體之自然得道天地以靜眞水生民物以靜眞水行燥熱爲火靜寒爲水燥可勝寒靜可勝熱眞水生故也爾若安靜眞水自行變化日生靜爲命元靜則長生非世之常辭上聖已成眞人通𤣥究微能悉其章誦之十過諸天遙唱萬帝設禮河海靜默通導淵源日月合度璇璣不行羣魔束形鬼精滅爽回屍起死白骨成人至學之士誦之十過則五帝侍衞三界稽首魔精喪眼鬼祅滅爽濟度垂死絕而得生所以爾者學士穢氣未消體未洞眞召制十方威未制天政德可伏御地祇束縛魔靈但卻死而已不能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人無量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到水帝列言泉曲悉宥開朗冥關億曾萬祖幽魂苦爽皆卽受度上昇朱宮格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經眞水上應五臟育嬰昇入泥丸𤣥霜紫冰皆卽受度飛昇南宮世人受誦則洞靈激奔神泉八周益軀生神延壽長年後皆得作尸解之道魂神暫滅不經地獄卽得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役右官侍經五帝玉童玉女各六十四人營衞神文保護受經者身道言正月長齋誦詠是經九變三眞澤及重泉爲上世亡魂斷地逮役度上南宮七月長齋誦詠是經眞水出胎道受永年身得神仙諸天書名黄籙白簡削死上生十月長齋誦詠是經復本還源功歸上𤣥總攝正氣統御高仙爲國王帝主君臣父子安鎭國祚保天長存世世不絕常爲人君安鎭其方民樂太平八節之日誦詠是經神泉流轉玉關冲盈得爲九宮眞人本命之日誦詠是經眞水淸明內照形神出紫入黄五臟生英魂神澄正萬氣長存不經苦惱身有光明三界侍軒五帝司迎萬神朝禮名書上天功滿德就飛昇上淸道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐靑黄白三色雲氣之中內外蓊冥有靑龍白虎朱雀𤣥武獅子白鶴羅列左右日月照明洞煥室內𤣥明洞淵之氣狀如紫煙羅絡交灌洞見百神項生圓象光映十方如此分明密咒曰無上𤣥元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啟所言今日吉慶長齋淸堂修行至經無量度人願所啟上徹徑御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始洞𤣥靈寶本章𤣥明洞淵上品泉關度人蒼華隱韻肇氣自然混合𤣥明虛無至眞一元立本二氣始陳至陽下降純陰上昇天眞開發包絡飛騰元和大朴流結冲融氣達崑丘精通如泉泉號𤣥明積爲洞淵洞淵生龍龍爲𤣥蟲九首兩翼金額銅胷恍惚之中變化神通主持氣母宰育羣容品物旣宣𤣥道亦傳元始祖劫化生諸天玉光開景是植𤣥根元氣爲祖惟道爲身大明結華華芒蔚文五官建立變化神靈是爲大梵天中之天鬱察𤣥峯龜臺玉城上極元景泰洞高淸眇眇曆紀劫刃飛精三華廣堂虛梵琳庭金闕丹陽燿寶神池降注天液保度無衰𤣥明成霐流空洞淵洞淵無極九壘剛源變化之妙昇入九天周行正氣運轉天關中有𤣥明洞淵之神中有南極長生大帝中有東極靑華帝君中有度世司馬大神中有好生韓君丈人中有𤣥上司變司化持天保劫大洞尊神迴骸起死無量度人今日校錄諸天臨軒東方無極飛天𤣥明洞淵神王長生大聖無量度人南方無極飛天𤣥明洞淵神王長生大聖無量度人西方無極飛天𤣥明洞淵神王長生大聖無量度人北方無極飛天𤣥明洞淵神王長生大聖無量度人東北無極飛天𤣥明洞淵神王長生大聖無量度人東南無極飛天𤣥明洞淵神王長生大聖無量度人西南無極飛天𤣥明洞淵神王長生大聖無量度人西北無極飛天𤣥明洞淵神王長生大聖無量度人上方無極飛天𤣥明洞淵神王長生大聖無量度人下方無極飛天𤣥明洞淵神王長生大聖無量度人十方至眞飛天神王長生度世無量大神並乘明雲紫淵之輿靑𤣥玉輦鳳蓋蜺輪驂駕九鳳七色蒼龍建汗漫總靈之節十方洞淵之旛前嘯眾眞齊唱後吹列羽同鳴獅子白鶴嘯歌噰噰大帝啟途千官翼轅億乘萬騎浮空而來傾光回駕監眞度生太𤣥丞相暘谷靈宮𤣥司主錄下元水官執籙把籍齊到帝前黙召𤣥明制地參天萬生被浹枯涸生泉𤣥明眞水凝化億門高嶽巨山寶闕珍林皆資𤣥明結固變成九河水帝𤣥津大神上循閬崑十二洞樓絳海黄池素波紫川骨鍊金石面流渥丹長生隱遷司命帝闕隨所應度嚴校諸天普告三界無極神鄉泉關幽夜北闕酆都四空大帥六洞靈魔寒夜暗域考察𤣥司四凟七澤十二谿眞上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼羣洞淵符命時刻昇遷九源玉池部衞形魂制魔保舉度品南宮死魂受鍊遷變成人生身受度劫劫長存隨劫輪轉與天齊年永度三途五苦八難超凌三界逍遙上淸上淸之天天帝厚冲無色之境梵行東方八天龍明瑞玉天帝肅辭祕登滋慶道兟天帝承翰鴻暉玉眞辨𤣥天帝殿運晞逢流華注靈天帝無惟育光崇延竟祝天帝盟章奉高理懷變化天帝𤣥𤣥鑒侯雲府降澤天帝執珠登全道英晶无天帝爽造延士南方八天珪辰鎭陽天帝錄莊修皇赤射飛光天帝保氣曜備洞溪迎龍天帝對榆倚𤣥化國雲宫天帝尚丁惟寧照𤣥生氣天帝著時量瓊天英和液天帝生演輔童龍肖溢眞天帝拂化慈元聖正仙期天帝洞梁無瓊西方八天毫靈伯江天帝足宗寧方金根養无天帝道微斥廬𤣥合流素天帝廣淡題徊朝仙變凟天帝優𤣥賜封契眞恭淨天帝翻山白從迂寂思冲天帝濮并屏誾逐神化幾天帝妙洞止評洋思定厯天帝籌突紀庸北方八天寶笥扈書天帝拂億蠢兹列源正一天帝命仙儀中瑶光述液天帝逸常京昌英正理和眞天帝隨洪次章攝司會光天帝召神略𤣥祈聖格淵天帝昌回敷紳現龍降河天帝擇毗衍門幾紀因盟天帝孚廷剛三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章𤣥明隱韻洞淵之音𤣥明之尊洞淵之神𤣥明眞魔洞淵之靈九品十階變化上淸洞淵之奥深不可詳龍以水神風爲火靈水中出火龍火水精眞氣返敷敷落神眞火中出水心動精成天中之水子命之神若有能之普度天人今日欣慶受度飲咀𤣥明身入洞淵厯關諸天請滅陰惡斬絕地根高超六氣神昇太𤣥眞王監舉無拘天門東斗蒼精西斗素童北斗𤣥眞南斗丹風中斗黄燿珠光化鎔如是神王居洞淵宮外𤣥內明八海攸同一氣變形眞水潛通天地合德萬物安豐生氣之海中有九龍太霄合景上與天通身關大運六氣之眞颷歘乘邁超遇九神靑帝生䰟白帝育魄赤帝攝氣黑帝滋血黄帝正極肇立眞宅靑帝龍王安寶飛華赤帝龍王元善鬱羅白帝龍王𤣥霄玉霞黑帝龍王道柔顯和黄帝龍王甲建持波五帝龍王𤣥明之靈生化洞淵飛行紫淸總領眞仙太上神兵麾幢鼓節遊觀杳冥自號赫奕諸天應機上天度人泉臺散開神王受命普度災危𤣥獸吐毒神龍八馳玉甲秉鉞靑童執旗擲火萬里流光四施敢有干試拒遏上聖風刀奔突巨天橫飛流鈴交煥𤣥仙振威千千截首萬萬滅形魔無干犯鬼無祅精三官北酆明立嚴刑不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列奏太淸𤣥化九變洞極圓方生育神龍持運陰陽與道同範體正純剛廣羅天闕妙立無形造化之本雲雨所藏眞水九淵回度元綱渺渺曆劫混沌之中上𤣥爲色下河爲淵風轉玉輪威光戴天一身九首蟠遶羣京蒼源瑶海龍嶽飛城天上天下無幽無冥洋洋洞淵萬龍斯官雲書玉字元始赤文保鎭下元護世長存龍漢彌羅黄闕開張𤣥明流演九地九天輪轉包羅旋遶十方履水結纏導化五常三十九氣昇降玉源九宮列職合會𤣥𤣥𤣥居太微龍帝飛眞泛景碧融執詠洞篇玉眞明燿煇映𤣥明空華御正純金散烟紫霄鬱陵輔衞高仙千和萬合化生流精流精變液自然成眞眞中有神長生大君東極靑華丹明紫靈無英混極白元保生太一校籍靑童灌津執符把籙保命生根上遊紫虛出入華房八溟之內東井之中下鎭人身黄庭絳淵中理五氣混合百神十轉迴靈萬品俱仙仙道貴生無量度人上開八門飛天法輪罪福禁戒宿命因緣普受𤣥澤結鍊生身身得受生上聞諸天諸天之上各有生門中有空洞謡歌之章眞王靈篇辭參高眞第一𤣥明洞淵飛空之音眞陽無形憑𤣥明生𤣥明眞露氣噓乃成太空無邊元氣騰烟氤氲迅飛水降如泉浩浩其聲洋洋積淵炎風入水自然蜿蜒數經九厯鱗角乃全倐忽變化入地通天口銜雲雨身如玉蚿叱電吐霧雷火之仙經營萬物開導生源𤣥明之功神龍爲先洞淵溟海注納百川一水爲祖中含五行人身法象神池淨霐震氣爲龍遊泳三田飛伏以道世壽億千無量度人吟此洞篇第二𤣥明洞淵眞王之章玉京崑崙植空爲根下跨碧海九億之元𤣥峯中峙日月交軒燿晶雙景臨光七眞流泉上升三十九門養鍊二象賴此𤣥明下包黄闕統制靈官圓羅降氣攝御元君一氣六纏三元化成出入三華浩蕩風淵緣霞鬱壘流鈴四奔生化之道肇立神靈哺餌元和保天無傾世有能知靑簡書名我今爲此章度命以眞水飛步登神霄仙眞當敬禮第三𤣥明洞淵眞王歌曰揚舲洞淵池靑林振靈風天聲自成音萬變復以同峩峩神霄闕執誥東華中度人迴淸流捨此百慮攻𤣥明散天露物體能滋融鍊骨生玉華長生得無憂如何背仙道濁穴隨尸蟲不悟大道元安能免衰凶有山旋碧虛有水藏神龍胡爲逐貪競沈穢老嬰童我位空洞王法駕嚴鼓鐘憫世統大憲救物興教宗執詠玉眞謡飛昇洞𤣥宮八難從此解歡樂永無窮此三界之上飛空之中眞王歌音音參洞章誦之百遍名度南宮誦之千遍飛仙保迎萬遍道備超昇太空過度三界位登眞公有聞靈音魔王敬形勅制地祇侍衞送迎拔出地戸五苦八難七祖昇遷永離冥官䰟度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈眞王隱祕之音妙寂無形眞水化成天地出生神龍兆能體之神仙無終皆是大梵之言非世上常辭言無韻麗曲無華宛故謂𤣥奥難可尋詳上天所寶祕於𤣥都神霄玉淸王府東華之室依科三萬七千年隨運下傳若有至人齋金寶質心依舊格告盟十天然後而付焉道言夫天地運度否終日月五星虧盈至聖神人休否末學之夫疾傷凡有此災同氣皆當齊心修齋六時行香十遍轉經福德立降消諸不祥無量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太陰臨過之時同學至人爲其行香誦經十過以度屍形如法則𤣥明自生𤣥冥自還腎中玉女手把陽關死戸閉塞三官舞輪返命復形錄名帝軒䰟神徑上南宮隨其學功計日而得更生輪轉不惑便得神仙道言夫天地運終星宿錯度日月失昏四時失度陰陽不調國境不和人民災饉疫毒流行兆庶死傷師友命過同志殞亡皆當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衞右別至人尅得爲聖君金闕之臣諸天記人功過毫分無失天中眞王亦保舉爾身得道者乃當洞明至言也東方八天迮芹洒定淵婁池溟旣霸沔洟留靑濟眞唐屏卞師邀除止明鬱落月肌胡定杳征命澤𤣥嶽列淵自昇雲荼帝㠗利賓延承洞假幽狄越英仰靈鑄晶漾口道寂元經南方八天猛洪滋盈力羗華營建浦時會洙𤣥伺膺綠養漸宛被盧次丁蕩蒙愈謹玉毫途平赤宮赫蘇元首氣靈告命酆臺帝師虎臣祕魔截龍撲雷收星研期胡由並愆思稱西方八天眞庚六池神虎四飛栗洛衎覩優正兵施部亶吉會耶帑露源媾嫣和廬七元九司考謝已扁傲琅袁棐王典罪䰟幽扃圓登頂角珍上護眞載延窈斷皇極璽山封城北方八天蓬內伐北旗翟遄車翠儀交蔚九化方諸英丹心漑滂潢玉羅根納赤尾火龍遊波勝室燿蕩兵府紀銅黑遼追甯建餘百聰后爓水洞瀋桓箕臺勅催聻尚變仙神迴道言此諸天中大梵隱語無量之音舊文刻書𤣥明北山龍阿穴室之門爲萬物生根九天靈章其道禁諱隱奥無聞字皆廣長一丈天眞皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大功眞王保舉上眞道備尅得遊行三界昇入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致飛天下觀上帝遥唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅震響十方肅淸河海靜默山嶽吞烟萬靈振伏招集羣仙天無氛穢地無祅塵冥慧洞淸大量𤣥𤣥也

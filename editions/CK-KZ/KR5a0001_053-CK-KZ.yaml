front:
  text: 元始無量度人上品妙經卷之五十三
  hash: sha256:dd95e90785ec2b64ce5cceeef8ab2fbd1e5560dd17e8bf7965299bcb4fad057d
body:
  text: 道言昔於玉靈天中明景謡歌大威神土受元始度人斬滅五行邪怪無量上品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖高尊妙行眞人五帝眞官明威大將斬邪騎吏陰陽三五總統官曹紫微神兵無鞅數眾乘空而來金暉映虛寶輿仙飈華光羽蓋纏鬱晨霞萬景交朗煥燿八圓七日七夜十方仙眞層樓寶闕洞化相通天綱停佪星絡正度神風微扇妙靄凝香氣象融和海嶽澄淸一國地土山川林木緬平一等無復高下土皆作華玉瑩鮮五明之色眾眞侍座元始天尊𤣥坐空浮景燿神龍御化天元之座說經一遍諸天大聖同時稱善是時一國男女斷滅五慾之情說經二遍五化隆昌說經三遍五緯順躔說經四遍五氣常平萬物咸亨說經五遍五常不擾道治日新說經六遍五運推協無有乖愆說經七遍五文顯布𤣥教開明說經八遍五神守正威用宣張眞氣充溢蠲蕩不祥說經九遍五精固養保育靈光說經十遍五行之內邪怪俱亡是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品斬滅靑精邪怪至眞大神無鞅之眾浮空而至說經二遍南方無極無量品斬滅赤精邪怪至眞大神無鞅之眾浮空而至說經三遍西方無極無量品斬滅皓精邪怪至眞大神無鞅之眾浮空而至說經四遍北方無極無量品斬滅黑精邪怪至眞大神無鞅之眾浮空而至說經五遍東北無極無量品斬滅火行遊精邪怪至眞大神無鞅之眾浮空而至說經六遍東南無極無量品斬滅金行遊精邪怪至眞大神無鞅之眾浮空而至說經七遍西南無極無量品斬滅水行遊精中央黄精邪怪至眞大神無鞅之眾浮空而至說經八遍西北無極無量品斬滅木行遊精邪怪至眞大神無鞅之眾浮空而至說經九遍上方無極無量品斬滅天元五行邪怪至眞大神無鞅之眾浮空而至說經十遍下方無極無量品斬滅地元五行邪怪至眞大神無鞅之眾浮空而至十遍周竟十方無極斬滅五行邪怪天眞大神一時同至一國男女傾心歸仰來者有如密雲細霧無鞅之眾迮國一半土皆傾陷非可禁止於是元始化一圓象大小無常煒燿五色在空𤣥之中去地九丈元始登引天眞大神上聖高尊妙行眞人五帝眞官明威大將斬邪騎吏陰陽三五總統官曹十方斬滅五行邪怪至眞神王紫微神兵三天給事無鞅數眾倶入圓象之中天人仰看惟見拂拂從圓象中入旣入圓象不知所在國人廓散地還平正無復欹陷元始卽於圓象之內說經都竟眾眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐欻之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸行正心不欹不陷不誑不佞不狠不愎不戾不乖不嫉不惡言行平直智識剛明齊同慧悟異骨和同國安民康欣樂冲融經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是眞魔內諱斬滅五行邪怪百靈之隱名也非世上之常辭上聖已成眞人通𤣥究微能悉其章誦之十過諸天讚詠五靈敬侍金木水火元土合并神粹凝和毒害不生混養內化洞冥至眞邪怪鬼祅無緣而興至學之士誦之十過則五帝鑑觀九眞舉仙邪試滅迹怪禍永蠲道業保固善行克全所以爾者通感五行之神蕩伏邪怪召制威靈克成至道和合眞氣保育人命得躋𤣥境降會高眞不死而已豈復更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人無量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到十方斬滅五行邪怪之神勦絕魔精五行之內不爲殃禍災咎永消用保福祥而運化常寧安鎭率土普承𤣥恩仁夀富樂淸靜自然也上學之士修誦是經消滌邪害道氣淸眞世人受誦則元眞受妙惑念永忘全其壽年後皆得受鍊度之道䰟神暫滅不經地獄卽得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役考官侍經五帝玉童玉女各三十六人營衞神文保護受經者身道言正月長齋誦詠是經召上元將軍斬滅五行邪怪不正之祅卽使天界澄廓七燿常明七月長齋誦詠是經召中元官將斬滅五行邪怪不正之精保衞兆民使安其生十月長齋誦詠是經召下元官君將吏五嶽兵馬斬滅五行邪怪不正之靈安鎭天下慶祐君親厯世綿長後天而存八節之日誦詠是經召天地四方八極兵馬卻絕魔靈順布五氣長養生成本命之日誦詠是經召天元九宮星宿眞官威殺之神檢校命籙五行邪怪祛斬滅蹤五神守正萬氣資形生道靈堅超遷上淸道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐靑黃赤三色雲氣之中內外蓊冥有靑龍白虎朱雀𤣥武獅子白鶴羅列左右日月照明洞煥室內項生圓象光映十方如此分明密咒曰无上𤣥元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啟所言今日吉慶長齋淸堂修行至經無量度人願所啟上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始洞𤣥靈寶本章上品妙首斬邪滅怪十迴度人百魔隱韻離合自然五氣眞文𤣥虛上神大混靈源天地幽根統運五氣五行之元大化總御厯劫綿綿五行布育相保生成非道不顯非道不明非道不立非道不眞錯沴結靄邪怪流形自然神德祛伐無停是爲妙範𤣥上之宗太極玉關金闕靈都陰陽元會三氣之樞浩浩元氣乍合乍殊靑琳玉宮始暉妙庭墉臺積霄交和燿晶大周十境羅絡彌綸中有調運五行順化之神中有宰御𤣥極生育之君中有馘祅破害大神中有仙靈寶籙官君丈人中有陰陽三五七九明威正一定命尊神斷滅邪怪無量度人今日校錄諸天臨軒東方無極飛天斬邪滅怪神王長生大聖無量度人南方無極飛天斬邪滅怪神王長生大聖無量度人西方無極飛天斬邪滅怪神王長生大聖無量度人北方無極飛天斬邪滅怪神王長生大聖無量度人東北無極飛天斬邪滅怪神王長生大聖無量度人東南無極飛天斬邪滅怪神王長生大聖無量度人西南無極飛天斬邪滅怪神王長生大聖無量度人西北無極飛天斬邪滅怪神王長生大聖無量度人上方無極飛天斬邪滅怪神王長生大聖無量度人下方無極飛天斬邪滅怪神王長生大聖無量度人十方至眞飛天斬邪滅怪神王長生度世無量大神並乘晨霞寶輿仙飈華光羽蓋驂衞三元官將十極仙靈建斬邪之節滅怪神旛前嘯洞眞之曲後詠靈虛妙歌紫鸞𤣥鵠吟嘯相和天蓬啟途龍虎翼轅億乘萬騎浮空而來傾光迴駕監眞度生天關內宰火鈴上曹監察大魔威禁𤣥靈紫淸主錄監度大神執麾仗鉞大布威靈齊奉帝符檢錄五行察制萬類造化靈司山河海嶽經緯星躔八溟九壘十二宮辰祛蕩祅忒乖沴之愆束縛惡精邪怪之形不得怠縱逸肆魔羣元始告命勅使神兵斬邪無蠲開化生津保安正道迴度劫輪眞機變鍊妙氣敷榮人無疾横神德合明永度世厄與天齊齡超出三塗絕離苦難越昇魔界遨遊上𤣥上𤣥之天天帝鬱延無色之境梵行東方八天玉儀明度天帝忽冋題蘇寂𤣥通正天帝寥遙初輔覺鎭陽天帝秀丹琡觀始明運修天帝辯盈子通靈澤隨化天帝海光洞珠方洞厯皇天帝去害無盡京基耀光天帝波斯普臺紫麟召仙天帝福長生南方八天太妙鬱晨天帝寶策紫微頂光履眞天帝道極祕呈存𤣥慶智天帝頓希谷仁傳靈滅魔天帝駢邾蕩魔顯生變身天帝陰穴露堪赤寶垂安天帝益鹿杳機錫禧祐明天帝冕婁莎庸洞光敬𤣥天帝何童厯聰西方八天神文示宗天帝玉棊上元虎裳世標天帝梵無延康遊眞虛用天帝謁昌華龍正氣符剛天帝邈育規測神問封天帝宣幽述眞奏功證道天帝運常明烈地薈冥天帝號希淵途誅怪通政天帝處彥那靈北方八天禁鎭百無利元天帝瓊敷仙高宸泰微抃宗天帝鳳華飛綱洞志幽虛禮剛天帝文何德揚九迴轉德思本天帝陁邈淸晦俱息康存一天帝陽文子持北淸總司天帝判皇極峒𤣥微察命天帝壽蒙資成鑒神按獄訊靈天帝望賾夷卿三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻五行之音五行之尊五行之神五行大魔五行之靈九和十合變化上淸無量𤣥奥深不可詳敷落神眞普度天人今日欣慶受度厯關諸天請滅怪惡斬絕邪源調運五行功參大元眞王鎭御道氣開宣東極化木西極生金北極凝液南極激炎中極上宮合會四𤣥靑帝衞生白帝歛德赤帝蕩祅黑帝收毒黄帝中王萬禍俱息木行大魔飛光寶龍火行大魔燿天紫童金行大魔返神會容水行大魔駕氣乘風土行大魔劫霞洞穹五行大魔萬神之宗部率神官出入幽冥橫戈擁甲萬騎雲奔統攝威伐與道同倫玉天開化察錄神姧靈明通泰蠲卻無前玉樞流擲烈銳八延三將馳驅四帥揚旛攫天觸爓擊雷散烟敢有干試拒遏上眞金鉞前戮巨天後刑掃除邪怪風火無停千千截首萬萬剪形魔無干犯鬼無祅精三官北酆明檢鬼營不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列言上淸𤣥元妙紀五氣開皇眇眇大混混化微茫上施神華下布靈光纏綿元梵羅絡乾坤剛柔相感序列五行五行相運造育生成推蕩無滯和合歸眞妙道彌綸運度自然五眞流演升降迴旋施養生化媾氣如泉五用順常萬類滋繁勝氣傍凌兼位而遷淫則爲癘邪怪起源出爲祟祅民物銜冤上帝勅斬敷落五篇赤書玉字八威龍文保制刧運使天長存梵氣彌羅萬範開張元綱流演三十二天輪轉無色周迴十方旋斗厯箕回度五行三十五分總氣上元八景冥合氣入𤣥𤣥𤣥中太皇上帝高眞泛景太霞嘯詠洞章金眞朗郁流響雲營玉音攝氣靈風聚烟紫虛鬱秀輔翼萬仙五氣混合自然成眞眞中有神太極元君三天眞老大混尊神太一司化三五神官執符把籙保度靈眞上遊上淸出入華房八冥之內細微之中下鎭五嶽上安九天中理五氣混合百神十轉迴靈萬氣齊仙五行邪怪斬滅無干高明紫微流轉諸天掌世罪福與道同𤣥仙道貴生無量度人炎炎五星飛天如輪下維九宮上開八門罪福禁戒宿命因緣普受開度五行生身身得受生上聞諸天諸天之上各有生門中有五行空洞之章眞王靈篇辭參高眞第一化生五行飛空之音大梵未開無形無名二儀分兮位列五行東靑西素南丹北𤣥元一中黄五氣相循各有主性與道變遷此爲道根色質相連寶臺玉宮碧山金門上眞仙聖無量帝君冥冥之中運合眞神錦旛黃綬紫蓋朱輪皆眞五色隨化成形息意冥一分化億千超度三界飛空結仙此道世莫知眞王當普宣神霄數萬里金闕相輝鮮飛神恍惚間萬聖馳雲軿世途念流轉使我常哀憐何如向𤣥道妙本晤所歸邪怪盡淪息長居玉帝前第二斬滅五行邪怪之章天元太乙帝司主兵護衞世上保合生精華衣繡裙玉冠靑巾靑龍左列白虎右賓佩服龍劔五福之章統部神官三五將軍檢校陰陽運合元機五行邪怪莫不傾摧有邪必斬有怪必摧敷祐福祥啟悟希夷邪怪已消滅五帝降靈威護世過萬年帝德日熙熙黄龍下中天帝壽天所期神霄空洞章奏香綠烟飛第三和合五行歸身契道歌曰太虛𤣥妙神空洞幽无君生於渺漭中造化標元根淡漠居正性返照滅邪氛消魔怪害除冲融和至眞昭昭智慧鋒威伐叱祅羣五濁安能擾明煇華景形佩服靈寶章雲光煥爾身玉符鎭內景龍虎纏胎嬰水火金木交混一宗皇靈巍巍御絳闕冥冥理百精誰知
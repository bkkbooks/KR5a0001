body:
  text: 靈寶無量度人上品妙經卷之一天一道言昔於始青天中碧落空歌大浮黎土受元始度人無量上品元始天尊當説是經周回十過以召十方始當詣座天真大神上聖髙尊妙行真人無鞅數衆乘空而來飛雲丹霄緑輿瓊輪羽蓋垂蔭流精玉光五色鬱勃洞煥太空七日七夜諸天日月星宿璇璣玉衡一時停輪神風靜默山海藏雲天無浮翳四氣朗清一國地土山川林木緬平一等無復髙下土皆作碧玉無有異色衆真侍座元始天尊懸坐空浮五色獅子之上説經一遍諸天大聖同時稱善是時一國男女聾病耳皆開聰説經二遍盲者目眀説經三遍喑者能言説經四遍跛痾積逮皆能起行説經五遍久病痼疾一時復形説經六遍髮白反黑齒落更生説經七遍老者反壯少者皆強説經八遍婦人懷妊鳥獸含胎已生未生皆得生成説經九遍地藏發泄金玉露形説經十遍枯骨更生皆起成人是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊説經一遍東方無極無量品至真大神無鞅之衆浮空而至説經二遍南方無極無量品至真大神無鞅之衆浮空而至説經三遍西方無極無量品至真大神無鞅之衆浮空而至説經四遍北方無極無量品至真大神無鞅之衆浮空而至説經五遍東北無極無量品至真大神無鞅之衆浮空而至説經六遍東南無極無量品至真大神無鞅之衆浮空而至説經七遍西南無極無量品至真大神無鞅之衆浮空而至説經八遍西北無極無量品至真大神無鞅之衆浮空而至説經九遍上方無極無量品至真大神無鞅之衆浮空而至説經十遍下方無極無量品至真大神無鞅之衆浮空而至十遍周竟十方無極天真大神一時同至一國男女傾心歸仰來者有如細雨密霧無鞅之衆迮國一半土皆偏陷非可禁止於是元始懸一寶珠大如黍米在空玄之中去地五丈元始登引天真大神上聖髙尊妙行真人十方無極至真大神無鞅數衆俱入寶珠之中天人仰看唯見勃勃從珠口中入既入珠口不知所在國人廓散地還平正無復𣣱陷元始即於寶珠之內説經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏欻之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸行善心不殺不害不嫉不妬不淫不盜不貪不欲不憎不嫉言無華綺口無惡聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有志心宗奉禮敬皆得度世道言元始天尊説經中所言並是諸天上帝內名隱韻之音亦是魔王內諱百靈之隱名也非世上之常辭上聖已成真人通玄究微能悉其章誦之十過諸天遙唱萬帝設禮河海靜默山嶽藏雲日月停景璇璣不行群魔束形鬼精滅爽回尸起死白骨成人至學之士誦之十過則五帝侍衛三界稽首魔精喪眼鬼祅滅爽濟度垂死絶而得生所以爾者學士穢氣未消體未洞真召制十方威未制天政德可伏御地祇束縳魔靈但却死而已不能更生輕誦此章身則被殃供養尊禮門戶興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人無量為萬道之宗巍巍大梵德難可勝道言凡誦是經十過諸天齊到億曾萬祖幽魂苦爽皆即受度上升朱宫格皆九年受化更生得為貴人而好學至經功滿德就皆得神仙飛升金闕遊宴玉京也上學之士修誦是經皆即受度飛升南宫世人受誦則延壽長年後皆得作尸解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齋誦詠是經為上世亡魂斷地逮役度上南宫七月長齋誦詠是經身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經為國王帝主君臣父子安鎮國祚保天長存世世不絶常為人君安鎮其方民稱太平八節之日誦詠是經得為九宫真人本命之日誦詠是經魂神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黃白三色雲氣之中內外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室內項生圓象光映十方如此分明密呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引氣三十二過東向誦經元始無量度人上品妙經元始洞玄靈寶本章上品妙首十回度人百魔隱韻離合自然混洞赤文無無上真元始祖劫化生諸天開明三景是為天根上無復祖唯道為身五文開廓普殖神靈無文不光無文不明無文不立無文不成無文不度無文不生是為大梵天中之天鬱羅蕭臺玉山上京上極無上大羅玉清渺渺劫仞若亡若存三華離便大有妙庭金闕玉房森羅淨霐大行梵氣周回十方中有度人不死之神中有南極長生之君中有度世司馬大神中有好生韓君丈人中有南上司命司録延壽益算度厄尊神回脢起死無量度人今日校録諸天臨軒東方無極飛天神王長生大聖無量度人南方無極飛天神王長生大聖無量度人西方無極飛天神王長生大聖無量度人北方無極飛天神王長生大聖無量度人東北無極飛天神王長生大聖無量度人東南無極飛天神王長生大聖無量度人西南無極飛天神王長生大聖無量度人西北無極飛天神王長生大聖無量度人上方無極飛天神王長生大聖無量度人下方無極飛天神王長生大聖無量度人十方至真飛天神王長生度世無量大神並乘飛雲丹輿緑輦羽蓋瓊輪驂駕朱鳳五色玄龍建九色之節十絶靈旙前嘯九鳳齊唱後吹八鸞同鳴獅子白鶴嘯歌雍雍五老啓途群仙翼轅億乘萬騎浮空而來傾光回駕監真度生諸天丞相南昌上宫韓司主録監生大神執籙把籍齊到帝前隨所應度嚴校諸天普告三界無極神鄉泉曲之府北都羅酆三官九暑十二河源上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼群元始符命時刻升遷北都寒池部衛形魂制魔保舉度品南宫死魂受鍊仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度三途五苦八難超淩三界逍遙上清上清之天天帝玉真無色之境梵行東方八天太皇黃曽天帝鬱繿玉明太明玉完天帝須阿那田清明何童天帝元育齊京玄胎平育天帝劉度內鮮元明文舉天帝醜法輪上明七曜摩夷天帝恬懀延虛無越衡天帝正定光太極濛翳天帝曲育九昌南方八天赤明和陽天帝理禁上真玄明恭華天帝空謡醜音耀明宗飄天帝重光明竺落皇笳天帝摩夷妙辨虛明堂曜天帝阿𨚧婁生觀明端靖天帝鬱密羅千玄明恭慶天帝龍羅菩提太煥極瑶天帝宛黎無延西方八天元載孔升天帝開真定光太安皇崖天帝婆婁阿貪顯定極風天帝招真童始皇孝芒天帝薩羅婁王太皇翁重浮容天帝閔巴狂無思江由天帝明梵光上揲阮樂天帝勃勃監無極曇誓天帝飄弩穹隆北方八天皓庭霄度天帝慧覺昏淵通元洞天帝梵行觀生太文翰寵妙成天帝那育醜瑛太素秀樂禁上天帝龍羅覺長太虛無上常容天帝總監鬼神太釋玉隆騰勝天帝眇眇行元龍變梵度天帝運上玄玄太極平育賈奕天帝大擇法門三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻天中之音天中之尊天中之神天中大魔天中之靈九和十合變化上清無量之奧深不可詳敷落神真普度天人今日欣慶受度歷關諸天請滅三惡斬絶地根飛度五户名列太玄魔王監舉無拘天門東斗主算西斗記名北斗落死南斗上生中斗大魁總監衆靈青帝護魂白帝侍魄赤帝養氣黑帝通血黃帝中主萬神無越青天魔王巴元醜伯赤天魔王負天擔石白天魔王反山六目黑天魔王監魂朗馥黃天魔王橫天擔力五帝大魔萬神之宗飛行鼓從總領鬼兵麾幢鼓節遊觀太空自號赫奕諸天齊功上天度人嚴攝北酆神公受命普掃不祥八威吐毒猛馬四張天丁前驅大帥仗幡擲火萬里流鈴八衝敢有干試拒遏上真金鉞前戮巨天後刑屠割鬼爽風火無停千千截首萬萬翦形魔無干犯鬼無祅精三官北酆明檢鬼營不得容隱金馬驛程普告無窮萬神咸聽三界五帝列言上清元洞玉曆龍漢延康眇眇億劫混沌之中上無復色下無復淵風澤洞虛金剛乘天天上天下無幽無冥無形無影無極無窮溟涬大梵寥廓無光赤明開圖運度自然元始安鎮敷落五篇赤書玉字八威龍文保制劫運使天長存梵氣彌羅萬範開張元綱流演三十二天輪轉無色周回十方旋斗歷箕回度五常三十五分總氣上元八景冥合氣入玄玄玄中太皇上帝髙真泛景太霞嘯詠洞章金真朗郁流響雲營玉音攝氣靈風聚煙紫虛鬱秀輔翼萬仙千和萬合自然成真真中有神長生大君無英公子白元尊神太一司命桃康合延執符把籙保命生根上遊上清出入華房八冥之內細微之中下鎮人身泥丸絳宫中理五氣混合百神十轉回靈萬氣齊仙仙道貴生無量度人上開八門飛天法輪罪福禁戒宿命因緣普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有空洞謡歌之章魔王靈篇辭參髙真第一欲界飛空之音人道渺渺仙道莽莽鬼道樂兮當人生門仙道貴生鬼道貴終仙道常自吉鬼道常自凶髙上清靈爽悲歌朗太空唯願仙道成不欲人道窮北都泉曲府中有萬鬼群但欲遏人算斷絶人命門阿人歌洞章以攝北羅酆束送祅魔精斬馘六鬼鋒諸天氣蕩蕩我道日興隆第二色界魔王之章落落髙張明氣四騫梵行諸天周回十方無量大神皆由我身我有洞章萬遍成仙仙道貴度鬼道相連天地渺莽穢氣氛氛三界樂兮過之長存身度我界體入自然此時樂兮薄由我恩龍漢蕩蕩何能别真我界難度故作洞文變化飛空以試爾身成敗懈退度者幾人笑爾不度故為歌音第三無色界魔王歌曰三界之上眇眇大羅上無色根雲層峩峩唯有元始浩劫之家部制我界統承玄都有過我界身入玉虛我位上王匡御衆魔空中萬變穢氣紛葩保真者少迷惑者多仙道難固鬼道易邪人道者心諒不由他仙道貴實人道貴華爾不樂仙道三界那得過其欲轉五道我當復奈何此三界之上飛空之中魔王歌音音參洞章誦之百遍名度南宫誦之千遍魔王保迎萬遍道備飛升太空過度三界位登仙公有聞靈音魔王敬形敕制地祇侍衛送迎拔出地戶五苦八難七祖升遷永離鬼官魂度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈魔王隱祕之音皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寶祕於玄都紫微上宫依玄科四萬劫一傳若有至人齎金寶質心依舊格告盟十天然後而付焉道言夫天地運度亦有否終日月五星亦有虧盈至聖神人亦有休否末學之夫亦有疾傷凡有此災同氣皆當齊心修齋六時行香十遍轉經福德立降消諸不祥無量之文普度無窮道言夫末學道淺或仙品末充運應滅度身經太隂臨過之時同學至人為其行香誦經十過以度尸形如法魂神徑上南宫隨其學功計日而得更生轉輪不滅便得神仙道言夫天地運終亦當修齋行香誦經星宿錯度日月失昏亦當修齋行香誦經四時失度隂陽不調亦當修齋行香誦經國主有災兵革四興亦當修齋行香誦經疫毒流行兆民死傷亦當修齋行香誦經師友命過亦當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎮帝王下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能為天地帝主兆民行是功德有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衛右別至人剋得為聖君金闕之臣諸天記人功過毫分無失天中魔王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君撰元始靈書上篇東方八天廣生髙映覺元洞虛應玄九真化交肇圖文靈運構宗範玄都感變總括威昭自成緑岺遷景皇道含明天琳耀權氣晶育魂融羅負立圓英隱旻期巨神包洪綱告寧南方八天章炎通泛堅敷澄宗虛象玄華龍陽儛穹微正霄艷淵太凝沖元關三紐大梵飛空隱覺龍益天倫慶呈神戶纒絡真元散精淨握冥照回合升遷導騫宴雲靈應騰天西方八天剛澤微控隂峻孤儀貫氣明素宸洞開微周化幽應澄輝帝臺平遐挹虛恢茂池結飈臨育麗無散開陽通百六沈芒隱階幽廓冥默真峯會靈堅丕順道告命騫林北方八天龍安洞變純陽隱玄方本還氣象伏髙貟神變惠允解鍊靈根赤精純道成號威尊利雲友常億仞中丘鬱城瓊壘謡音慶流受位玉室大憲通幽玄章煥落綱輪乃周元始靈書中篇道君撰東方八天亶婁阿薈無惒觀音須延明首法攬菩曇稼那阿奕忽訶流吟華都曲麗鮮善育臻答落大梵散煙慶雲飛灑玉都明魔上門無行上首回跖流玄阿陀龍羅四象吁貟南方八天南𨶒洞浮玉眸詵詵梵形落空九靈推前澤洛菩臺緑羅大千眇莽九醜韶謡緣邅雲上九都飛生自騫那育郁馥摩羅法輪霐持無鏡攬姿運容馥朗廓奕神纓自宫西方八天刀利禪猷婆泥咎通究藪滌色太眇之堂流羅梵萌景蔚蕭嵎易邈無寂宛首少都阿繿郁竺華莫延由九開自辨阿那品首無量扶蓋浮羅合神玉誕長桑柏空度仙北方八天玃無自育九日導乾坤母東覆形攝上玄陀羅育邈眇氣合雲衆天大醜總監上天沙陀劫量龍漠瑛鮮碧落浮黎空歌保珍惡奕無品洞妙自真元梵恢漠幽寂度人道言此諸天中大梵隱語無量之音舊文字皆廣長一丈天真皇人昔書其文以為正音有知其音能齋而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祗侍門大勳魔王保舉上仙道備剋得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成天真自然之音也故誦之致飛天下觀上帝遙唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響十方肅清河海靜默山嶽吞煙萬靈振伏招集群仙天無氛穢地無祅塵冥慧洞清大量玄玄也元始靈書下篇天真皇人撰東方八天森角儲雲九魂鍊晶枳默窺玦浮枚臼蹲鹿幾陽房碧提鄼回池滇黨負跂逭謁携藻章變瑜蘭泮璧環亢滂野生極中昆清曜展洞涸寂無眇凝素倚虛羅皇違元靈南方八天炎鍍綽堂太霄謡隅歷遐薦漪周扃加圖披嶤蹊臄觚亶渾都戟藝荼炫井欺持蒲掌維迮儀奕洗琅璀扁屢益但幽微畢雷涓湟實東赤矅業稽玉玄演侯柏渠至規西方八天鎬正左適婆泥煞靈悲招均疆洎南𨇠魁靜夷損光混元覺緣道守岑遙綿徵知宣太靈湮漠昺和盧隨哲京常華墟咸堅沙栗鐸黜株會衍球裴卓雲青府業覩般基北方八天窪孩蒙甘翠宇九蘭蕭鈎連興龍汾神關溝淪𣲽魔豁蠻祈通玄寥亢息無知肆明蟒修吉夕馥壇時畎湯長敷昌匪庸謹濟朝康堲寬祕法侈宜廣帝理生衛肇宏人天真皇人梵氣玄遼天寶自然八合之音主治世會地壘洪澤變災厄難誦詠之者禳辟祅祥清淨道氣無不寧也地官奉書百靈敬畏神朱寫文服佩明驗施之於至學不宣於下俗也太極真人頌神雲煥層虛梵羅屯碧霄元始九龍駕皇人按青軺靈光集萬真珠景開陽寥出示靈寶篇福德由是招洞玄隱髙嚴玉音泛雲璈無量匪得思道海生波濤法義同涓流滋植成嘉苗用以拯飢窮教興衛中朝帝尊壽億年太平滅兵刀稽首望玉宸靈華散金毫元始無量度人上品妙經卷之一

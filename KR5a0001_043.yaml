front:
  text: 靈寶無量度人上品妙經卷之四十三
  hash: sha256:92ebf8f0f7aaf85a24e42c6d506fc870069d0847be16d69cd8afcf19950ffef4
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_043-001a, image: hfl/0009/0009-082.png}
body:
  text: 保胎護命品道言昔於始青天中碧落空歌大浮黎土受元始度人保胎護命妙品元始天尊當說是經周回十過以召十方始當諸座天真大神上聖髙尊妙行真人保胎護命三元六甲大神無鞅數衆步景而來飛雲流軿泛霄紫輿翠輦金車彩藎罙覆洞清凝光三色煥麗映徹空玄十日十夜諸天寶苑鬱京墉臺庭闕浮積巍構萬壘靈綱神芒停璣駐耀海雲呈瑞山嶽徊煙遠逮浩杳近連陬壁雲輝鼓華仙澤飄曵觸衣聞香皆獲上道一國地土山川林木碧䝉綿密蘭風靜注委霞繞落道聲夷由無量天仙稱歎希有衆真侍座元始天尊玄坐空浮一千二百天宮萬龍蚪揭明蘂繁珠大寶玉座之上說經一遍諸天聖母同時稱善是時一國仙妃神女憶悟往因見道本元信知天地未生元氣肇始神精吸粹隂陽定胎九十億劫三氣混淪九十大劫三華始分五老保胎三元育魂七竅洞張大塊乃坤二儀出胎始建寰海說經二遍胎卵濕生毛鱗介嬴無不備成說經三遍喙鳴口語呼應調順真協天律說經四遍膚革堅完金真散靈剛風宛轉說經五遍道出英妙才韻秀爽說經六遍至巧功成曲遂天德說經七遍育嬰端就善慧滋身說經八遍婦人懹娠鳥獸含胎已生未生皆得生成說經九遍胎臟發泄內寶露形說經十遍道用神化自然成人是時一國是男是女莫不傾心保胎護命咸得長生道言是時元始天尊說經一遍東方無極甲宫天冥保胎萬和護命大神無鞅之衆浮空而至說經二遍南方無極丙宫天真保胎玄明護命大神無鞅之衆浮空而至說經三遍西方無極庚宫天曆保胎肅靈護命大神無鞅之衆浮空而至說經四遍北方無極壬宫天胚保胎順生護命大神無鞅之衆浮空而至說經五遍東北無極癸宫天孕保胎護正護命大神無鞅之衆浮空而至說經六遍東南無極乙宫天壽保胎樂化護命大神無鞅之衆浮空而至說經七遍西南無極丁宫天申保胎道寂護命大神無鞅之衆浮空而至說經八遍西北無極辛宫天童保胎玄祖護命大神無鞅之衆浮空而至說經九遍上方元極戊宮天明保胎法義護命大神無鞅之衆浮空而至說經十遍下方無極己宫天陽保胎道康護命大神無鞅之衆浮空而至十遍周竟十方無極保胎護命大神一時同至一國男女傾心歸仰來者有如揚埃積塵繁星散霧無鞅之衆遍滿一國九地俱震非可禁止於是元始舉身放光洞照十方上下良久攝光從寶光雲葉中出上現元始天尊大慈玉相金容赫炳於其眉間出寶珠相此珠微妙光出一尋內見虛皇玉闕天靈寶臺無鞅天人行住栖止乘跨鸞鶴笑言顧矚一時同現水火交發山川宮殿圓寸而足元始既在太玄真一廣大靜定即此化身分形無量登引天真大神上聖髙尊妙行真人十方無極保胎護命至真大神無鞅數衆俱入元始珠光之中天人仰看惟見拂拂從珠影中入既入珠影不知所在國人廓散地還虛曠無復駢沓元始即於神珠妙光之內說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂無遺響是時天人遇值經法普得濟度保胎護命無有殞傷傾土歸仰咸行善心不妄不惑不欺不欲不爽不違不思不怍不制不回言與天通口無二聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天保胎護命神王內名隱韻之音亦是保胎三元六甲內諱百靈之隱名也非世之常辭上聖已成真人通玄究微能悉其章誦之十過諸天遙唱萬帝說禮天地萬類合胞孕胎無不生成祕解道先深得元奧大至天地纎及昆蛸未有不深極胎真受道真氣布精凝血然後化成一切聖賢諸天帝王髙仙未有不從胎根育養而出故保胎護命誦經召神易轉隂陽降福生人至學之士誦之十過則聖母降房司馬侍軒司命定籍五帝延生萬彚受形保胎護命壽德齊明所以爾者學士內呪隱名外誦真經召制十方與道同榮伏御地祇束縳魔靈不但却死亦可仙身謂其呼召三元六甲十方胎神使護己命身中胎元十真百節赤君聽命使子神仙不惟女子胎孕之厄可以誦持而學道鍊真不妨咏味輕誦此章身則受殃供養尊禮門戶興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人無量為萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天三元六甲九宫保胎護命福善大神降應齊到斷絶六天惡鬼上世亡魂於一切衆生胎元命宮作諸誣害使真氣消落神華傾喪孕化不登子嗣難成故氣流接注連纍代速付北都斬戮鬼形考按録籍善惡速分受道順生得為貴人而好學至經功滿德說自識胎真皆得神仙飛升金闕遊宴玉京也上學之士修誦是經皆即受度真神自飛出入胎宮女人受誦則得保胎護命天人為子寶精變嬰誕育之日胎神護命無有損傷男子夙成福與道隆慶偕時興延壽長年後皆得作尸解之道魂神暫滅不經生滅即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生世蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官保胎護命玉童玉女各三十二人營衛神文保護受經者身道言正月長齊誦詠是經速召上元六甲直符保胎護命斷上世亡魂追呼子孫訟在天官使胎不成絶孕無子鬼注孤婢七月長齊誦詠是經速召中元六甲直符保胎護命斷呪詛蠱厭妬害男女訟在地官使胎不成絶孕無子鬼曆著名十月長齊誦詠是經速召下元六甲直符保胎護命斷冢訟濕注祖世牽連鬼食胎精訟在水官使胎不成絶孕無子黑札定刑八節之日誦詠是經護諸衆生一切命元使命無傾八方胎神各領官屬入朝九宫太一真君延生保胎護命生根凡誦是經普及生民不獨女身而植道因天帝下觀得為九宫真人本命之日誦詠是經速召胎神聽受其經明堂三君保護胎精魂神澄正萬氣長存不經普惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齊戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黃白三色雲氣之中內外䈵冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室內項生圎象光映十方如此分明密呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齊清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引氣三十二過東向誦經元始無量度人上品妙經元始洞玄靈寶本章保胎護命十遍度人生根隱韻離合自然太漠未分大道隱存倐忽變化是生精神神為物靈混沌斯成上下相錯二象氤氲以白入赤隂陽齊并以赤入黑胞胎乃凝中含太虛明耀三清神室峩峩無始未名有玉嬰兒出玄入青上無復祖惟道為身紫胞解蒂瑩然真形混元脫胎産育神靈二儀同化恍惚杳冥冥中之精至真之神無神不光無神不明無神不立無神不成無神不度無神不生是為大梵胎中之胎億劫玉山七寶崚嶒九宮十闕億千萬門皆自道胎化運精神逮於人物三華妙庭紫閣朱宫胎光爽靈細微幽精潜伏胎根神風轉靡周回十方中有保胎叔火之君中有變嬰和菟之神中有司男伯華之君中有太玄監生之神中有衛房在庭之真男呼孟非女呼子宜玄胞未開二神同依胎血之鬼聞名斬摧不敢干試生道永歸天壽之福護命玄師龍文虎裳五斗攝衣速召三官太極主非握鈴嘯咤謦咳風雷挾衛胎宮素煙霏微五帝大魔金火八威保胎成真貴務光輝除難度厄無念無為今日校録諸天臨軒東方無極保胎生道神王長生大聖無量度入南方無極保胎生德神王長生大聖無量度人西方無極保胎扶貴神王長生大聖無量度人北方無極保胎衛真神王長生大聖無量度人東北無極保胎福善神王長生大聖無量度人東南無極護命昭化神王長生大聖無量度人西南無極護命度精神王長生大聖無量度人西北無極護命食厄神王長生大聖無量度人上方無極護命斷死神王長生大聖無量度人下方無極護命廣慧神王長生大聖無量度人十方至真保胎護命神王長生度世無量大神並乘紫霞吉光越蒼之獸神禽丹鳯之輿瓊宫瑶輦左驂七靈右服九絶巨鳥戢羽夔龍負轅建保胎之節護命神旙前嘯八渟齊唱後吹九律同嗚仙舞秦侯嘯歌噰噰五老啓塗三元列言億乘萬騎浮空而來天貴生道胎命為先上帝躬簡大極候煙總真命神監房度生九天聖母浮駕緑軿天后王妃玄虎擁筵保胎護命齊到帝前隨所應度嚴校諸天普告三界無極神鄉延生之府太一三垣十二胎神布氣錫年使召天真絳膜紫淵交氣黃庭掃蕩河源若有故氣祖考逮傳閉塞生道破胎敗傷不繼種嗣剋害殃延疾除宿注落滅禍根不得枸留逼合鬼群元始符命時刻升遷斷絶惡試五道不祥保胎育嬰部衛形魂制魔保舉護命朱宮靈降出貴仙化成人生身受度劫劫長存隨劫輪轉與天齊年太度生災胎中八難超度三元道備飛升道遙上清上清之天北華台元主世生道各有種天天帝玉真無色之境梵行東方八天此三十二天專主保胎護命及天下胎生種類莫不隸之其胎氣所行之天起於晨極之下自北斗玄冥星文入三台三台六星主生養萬物胎護群生下左回纒房宿十三度女宿十七度至寶鉼宮子位而止凡過氣到本命及本生胎宿則女人有胎胎脫生子故謂之子寶鉼者取其受而出之亦胎之象也惟天人化生住無形胎自天人至於人鬼龍魔皆不化生住有形胎也此天傍連欲界一十八天亦有帝君宮屬治之世人諸乞則降貴氣生男安胎室也靈梵居羅天帝恭慈真秀明華耀天帝辨元胥極真洞生天帝劉行真提蒲離正化天帝羌度霞迷上治宏默天帝延神關熙六凝真度天帝抑真虛夷英延飛度天帝汩焰婁呬覺儲應始天帝正察真微南方八天焰魔靜空天帝崔臨支題旋樞赤界天帝理常都氐正護雛天帝辨遲樓藍越理至玄天帝薈端思䝉梵符昭濟天帝約尚良虛球彥渚天帝淵憂毗栖禁非司政天帝眇圖卑羅玉庭明度天帝鬱童傒人西方八天風舉大剛天帝匪常儀生金嵬賢善天帝火玄行瓊嶽修盛天帝力摧大魔陶化揚儀天帝都演奢多曲魚斗剌天帝求婆貪貢判靈宣平天帝智辟郎據皓華成備天帝倪仙連髙玄智豫天帝九都赫盧北方八天太始拘墟天帝弗欲單齊廣曜黎明天帝阿留真明鶴臺統全天帝開躬朗充應利回冥天帝惠屈眉龍善幾率陀天帝偃幾西康玄胎修妙天帝定梵光稽元曆除天帝著克頥陽不驕道循天帝鬼府洞侯三十二天三十二帝諸天隱諱諸天隱名胎神空洞自然靈章保胎隱龍變胎靈音天中之尊天中之神天中太玄天中之靈保胎化成氣連玉清皆自元始播精移神無量之奧深不可詳敷落胎真普度天人今日欣慶受度歷關諸天請滅胎種傳注不祥食穢惡鬼黑齒夫人黃女春姑白殃日巡噉胎殺子西宫鬼神青蛇天狗白虎花源老翁幼婦誣害胎元生民嗷嗷但抱深冤不知胎害故氣相連神王監舉無拘生民東斗布算西斗定名北斗結胎南斗送魂中斗大魁土為胎真青帝護魂白帝侍魄赤帝養氣黑帝通血黃帝中主萬神無越青天降胎木真碧羅赤天降胎紫蓋婆娑白天降胎金真九回黑天降胎水帝灌池黃天降胎福禧登期五天胎神萬生之宗飛行三台涉過氐房攀女揖虛遊觀太空光霞赫奕諸天齊功保胎護命嚴攝北鄷八方害氣敢為災凶監生大神校課不容風馳雲奔擊劈前衝火師迅煙玄虎檢蹤燔裂洞浩神兵四攻敢有干試拒遏上真金馬傳驛玉真衛營屠割鬼爽風火無停千千截首萬萬剪形魔無千犯鬼無祅精保生瓊胎天壽和寧普告無窮萬神咸聽三界五帝列言上清玉泉無波龍澤靈阿眇眇梵氣道胎駢羅孕化混沌攝制大魔混沌之中上無復色下無復淵風水舍虛紫胞洞然神來感格氣本先天天上天下無幽無冥無形無影無極無窮溟涬大梵遼廓無光生道開明度人億千元始安鎮建植諸天人氣升玄胎神內連妙氣成文雲章玉篇三元寶書鳯蹟龍文保胎護命運曆長存大梵泛維萬貽啓張星光流演三十二天輪轉無色周回十方旋女歷房回度三台三十五分總氣上元八景冥合氣入生元元中太皇上帝髙真乘景太和唱詠洞章司録定生聖毋履綱斷除胎注生厄除殃時貴月吉三元惟良既誕勝慶載齡協昌千和萬合道化成身身從胎生胎中有真帝一至尊司命保胎宮室布分天一左真保胎神君天一右真保胎神君泥丸大神保護胎門玉女出入抱火握鈴玉帝在頭赤子住心黃庭老師守護帝闕與天為一百子千孫斬逐腐敗狼藉血痕不得忤胎使嬰晏存上通玉清呼吸華房緑室神窗細微之中護命安魂玉宫明堂金闕昆崘生氣保胎道德委純十月九周萬氣齊仙仙道貴生無量度人開通人門飛天元君恍惚常經變化無垠保護胎命三景同明罪福禁戒宿命因緣普受開度降魂生身身得受生上聞諸天諸天之上各有生門中有空洞謡歌之章保胎靈篇辭參髙真第一天元保胎大神護命真君甲子甲戌監生之音大道有神地𩲸天魂日月同并結胎變靈玉佩左飛金璫右回流精九轉光被八垂赤子妙微房參尾箕神女錦䙱華纓寶衣入宴胎宫三元共禧扶𢹂真童自然合離辟却萬凶不蹈傾危祈男公侯禱女嬙妃保固利亨天真永綏第二地元保胎大神護命真君甲申甲午監生之章黃旗舞空紫白當宮胎全子生天福濛濛我來自東泛青雲兮御彼長虹捫星斗兮玉馬金風下真庭兮素女么童傾光降車兮翠裾六龍彼天人兮揖我上公保胎神於三元固靈根於九重紫皇太一萬天齊功坐嘯千神斬馘殃窮擲火億程化明飲風保定生胎道德無終晨霞吐光照徹玄穹第三水元保胎大神護命真君甲辰甲寅監生之歌隂胞陽胎萬生同賴一氣共旋三界斯在我執玉彝來奠洪儀聖妃瓊顏光華夷㽔紫氣在戶胎室寧固即召九天華蓋翩翻六丁鼓瑟三元掬煙衛此生房日月齊年神公誅斬北帝列言天兵合圍仙真按軒燒香稽顙注記無偏善功自生翊侍玄元此三元之上六甲之宮保胎護命自然歌音音參洞章誦之百遍靜衛胎宮誦之千遍百神保迎萬遍道備胎化仙容過度三元護命王公有聞靈音六甲扶承勑制地祇寢息無驚拔出地官夭墮橫傷五苦八難生孳繁榮永離禍姦魂𩲸和明合道長生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此洞章並是三元上帝六甲神王隱祕之音皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寶祕於玄都三台上宮依玄科六萬劫一傳若有至人齎金寶質心依舊格告盟十天然後而付焉道言下元女人身抱胎脤或犯五傷日月刑衝返害母命分降之時為上世亡魂無道鬼爽阻礙移殃不得生就天魁大殺作諸妖賊凡有此災此時皆當淨心修齊六時行香十遍轉經福德立降消諸不祥無量之文普度無窮道言夫胎宮氣衰生福不行多致墮落羸涸不榮祖考訟呼嗣種斷緒母子不良三孤九病乳育乘邪災咎隨妨奉真至人為其行香誦經十遍保胎護命監生奏上南宮為添算紀全祐生身隨其道功計其隆殺冨壽神仙道言有傷胎之鬼致訟三官賊其年命滅折祿貟使胎嬰病注子養不榮皆鬼神之所為也亦有善人橫被陵害使失嗣續世微門戶凋謝可以急誦此經祈告胎星以保命生基或上世之德鬼責人怒天刑其胎不得安完速宜改愼洗心自悔以免此災害胎之鬼其名有九食二月胎鬼名黃球食三月胎鬼名厲生食四月胎鬼名兆非食五月胎鬼名陸蜞食六月胎鬼名血尸食七月胎鬼名窮竒食八月胎鬼名火朞食九月胎鬼名龍眉食十月胎鬼名赤奚知其鬼名焚香誦詠永保安寧生死受賴其福難勝故曰無量普度世人道言凡有是經能為下世男女保胎護命有災之日發心修齊燒香誦經十過皆諸天記名萬神侍衛學道之士修誦是經則胎神明正三宮煥騰長生致真聖胎內結不但女子可以奉行也右別至人尅得為聖君金闕之臣諸天記人功過毫分無失三元胎仙六甲神王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君撰元始保胎護命靈篇東方八天祁彥荒正北台元旋梵形結生帝火洞遷求離柏名希樓都玄玉觀浩劫女房幾延景命神魔緑英回檀感屢碧戚華瀾過邅公都阿夷雲符月淵仙握流微慶落孤賢南方八天九獸蔚無曠圖日珠鄷曲鬼神正頥溫蘇望祕蕭竟紫華玄胡舊井逼府渾謀宛道雅協仙梵芝格乘除建土生屈道玄遮吳律覽角媒乾卑浸孤萬眸逸度天耀傳侔西方八天羅扃野垂騫泥偃池劔婁尹虛機泰迎埤宴月霞升玄默瀆齊景瑶緑璆交拳近師宛樂太藪勤封陂時骨夜求覩部目隱似歌逾昭樂鼎琯赤容飛屢耿名仙庭洎峯北方八天苟無猴余琥具凝浮威曠安迎冥居岫臺洚澥尸枚九真迷崖阿都子他平奚海嘉魯登丞丕昞榭頥陀木罔魁漠玄篨願華斗畢觀齒明訴灝差洞鎮希閲天句衢羅道言此諸天中辰魁三台元生之音靈芒結文布鎮三十二天以施生定命化肇種民光輝縟麗含景玉霄天真皇人模按其文以為正音有知其音能齊而誦之者諸天皆遣飛天神王下觀其身保胎護命上奏諸天萬神朝禮地祗侍門大勳仙王保舉上仙上真下臨尅得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成天真自然之音也故誦之致飛天下觀上帝遙唱萬神朝禮三界侍軒群祅束首鬼精自亡胎真洞映三府肅清天藎旋碧地樞玄明嶽峙海澄日月煥照靈音幽響群仙慶賔四氣宴寂道景虛凝大量玄玄也元始無量度人上品妙經卷之四十三

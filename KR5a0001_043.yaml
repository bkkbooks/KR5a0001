front:
  text: 靈寳无量度人上品妙經卷之四十三
  hash: sha256:022d999e412a4453fb2a28234154ad68f4016d148eecde694f2e3fe460a01b79
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_043-001a, image: hfl/0009/0009-082.png}
body:
  text: 保胎護命品道言昔於始青天中碧落空歌大浮黎土受元始度人保胎護命妙品元始天尊當說是經周迴十過以召十方始當諸座天眞大神上聖髙尊妙行眞人保胎護命三元六甲大神无鞅數衆歩景而來飛雲流軿泛霄紫輿翠輦金車彩藎罙覆洞清凝光三色煥麗映徹空玄十日十夜諸天寳苑鬱京墉臺庭闕浮積巍構萬壘靈綱神芒停璣駐燿海雲呈瑞山嶽徊煙遠逮浩杳近連陬壁雲煇鼔華僊澤飄曵觸衣聞香皆獲上道一國地土山川林木碧䝉綿宻蘭風靜注委霞繞落道聲夷由无量天仙稱歎希有衆眞侍座元始天尊玄坐空浮一千二百天宮萬龍蚪揭明蘂繁珠大寳玉座之上說經一徧諸天聖母同時稱善是時一國僊妃神女憶悟往因見道本元信知天地未生元氣肇始神精吸粹隂陽定胎九十億劫三氣混淪九十大劫三華始分五老保胎三元育魂七竅洞張大塊乃坤二儀岀胎始建寰海說經二徧胎卵濕生毛鱗介嬴无不備成說經三徧喙鳴口語呼應調順眞恊天律說經四徧膚革堅完金眞散靈剛風宛轉說經五徧道出英妙才韻秀爽說經六徧至巧功成曲遂天德說經七徧育嬰端就善慧滋身說經八徧婦人懹娠鳥獸含胎已生未生皆得生成說經九徧胎臓發泄内寳露形說經十徧道用神化自然成人是時一國是男是女莫不傾心保胎護命咸得長生道言是時元始天尊說經一徧東方无極甲宫天㝠保胎萬和護命大神无鞅之衆浮空而至說經二徧南方无極丙宫天眞保胎玄明護命大神无鞅之衆浮空而至說經三徧西方无極庚宫天曆保胎肅靈護命大神无鞅之衆浮空而至說經四徧北方无極壬宫天胚保胎順生護命大神无鞅之衆浮空而至說經五徧東北无極癸宫天孕保胎護正護命大神无鞅之衆浮空而至說經六徧東南无極乙宫天壽保胎樂化護命大神无鞅之衆浮空而至說經七徧西南无極丁宫天申保胎道寂護命大神无鞅之衆浮空而至說經八徧西北无極辛宫天童保胎玄祖護命大神无鞅之衆浮空而至說經九徧上方元極戊宮天明保胎法義護命大神无鞅之衆浮空而至說經十徧下方无極己宫天陽保胎道康護命大神无鞅之衆浮空而至十徧周竟十方无極保胎護命大神一時同至一國男女傾心歸仰來者有如揚埃積塵繁星散霧无鞅之衆徧滿一國九地俱震非可禁止於是元始舉身放光洞照十方上下良久攝光從寳光雲葉中出上現元始天尊大慈玉相金容赫炳於其眉間出寳珠相此珠微妙光岀一㝷内見虚皇玉闕天靈寶臺无鞅天人行住栖止乗跨鸞鶴笑言顧矚一時同現水火交發山川宮殿圓寸而足元始既在太玄眞一廣大靜定即此化身分形无量登引天眞大神上聖髙尊妙行眞人十方无極保胎護命至眞大神无鞅數衆俱入元始珠光之中天人仰看惟見拂拂從珠影中入既入珠影不知所在國人廓散地還虚曠无復駢沓元始即於神珠妙光之内說經都竟衆眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂无遺響是時天人遇值經法普得濟度保胎護命无有殞傷傾土歸仰咸行善心不妄不惑不欺不欲不爽不違不思不怍不制不回言與天通口无二聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天保胎護命神王内名隠韻之音亦是保胎三元六甲内諱百靈之隱名也非世之常辭上聖已成眞人通玄究微能悉其章誦之十過諸天遥唱萬帝說禮天地萬類合胞孕胎無不生成祕解道先深得元奥大至天地纎及昆蛸未有不深極胎眞受道眞氣布精凝血然後化成一切聖賢諸天帝王髙僊未有不從胎根育養而出故保胎護命誦經召神易轉隂陽降福生人至學之士誦之十過則聖母降房司馬侍軒司命定籍五帝延生萬彚受形保胎護命壽德齊明所以爾者學士内呪隱名外誦眞經召制十方與道同榮伏御地祇束縳魔靈不但却死亦可僊身謂其呼召三元六甲十方胎神使護己命身中胎元十眞百節赤君聽命使子神僊不惟女子胎孕之厄可以誦持而學道鍊眞不妨咏味輕誦此章身則受殃供養尊禮門戸興隆世世昌熾與善因縁萬災不干神明護門斯經尊妙獨歩玉京度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天三元六甲九宫保胎護命福善大神降應齊到斷絶六天惡鬼上世亡䰟於一切衆生胎元命宮作諸誣害使眞氣消落神華傾丧孕化不登子嗣難成故氣流接注連累代速付北都斬戮鬼形考按録籍善惡速分受道順生得爲貴人而好學至經功滿德說自識胎眞皆得神僊飛昇金闕遊宴玉京也上學之士修誦是經皆即受度眞神自飛出入胎宮女人受誦則得保胎護命天人爲子寶精變嬰誕育之日胎神護命无有損傷男子夙成福與道隆慶偕時興延壽長年後皆得作尸解之道魂神暫滅不經生滅即得返形遊行太空此經微妙普度无窮一切天人莫不受慶无量之福生世蒙惠上天所寳不傳下世至士齎金寳効心盟天而傳輕泄漏慢殃及九祖長役鬼官保胎護命玉童玉女各三十二人營衛神文保護受經者身道言正月長齋誦詠是經速召上元六甲直符保胎護命斷上世亡䰟追呼子孫訟在天官使胎不成絶孕无子鬼注孤婢七月長齋誦詠是經速召中元六甲直符保胎護命斷呪詛蠱厭妬害男女訟在地官使胎不成絶孕无子鬼曆著名十月長齋誦詠是經速召下元六甲直符保胎護命斷冢訟濕注祖世牽連鬼食胎精訟在水官使胎不成絶孕无子黒札定刑八節之日誦詠是經護諸衆生一切命元使命无傾八方胎神各領官屬入朝九宫太一眞君延生保胎護命生根凡誦是經普及生民不獨女身而植道因天帝下觀得爲九宫眞人本命之日誦詠是經速召胎神聽受其經明堂三君保護胎精魂神澄正萬氣長存不經普惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黄白三色雲氣之中内外䈵㝠有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室内項生圎象光映十方如此分明宻呪曰无上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齋清堂修行至經无量度人願所啓上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始无量度人上品妙經元始洞玄靈寳本章保胎護命十徧度人生根隱韻離合自然太漠未分大道隱存倐忽變化是生精神神爲物靈混沌斯成上下相錯二象氤氲以白入赤隂陽齊并以赤入黒胞胎乃凝中含太虚明燿三清神室峩峩无始未名有玉嬰兒出玄入青上无復祖惟道爲身紫胞解蔕瑩然眞形混元脫胎産育神靈二儀同化恍惚杳㝠㝠中之精至眞之神无神不光无神不明无神不立无神不成无神不度无神不生是爲大梵胎中之胎億劫玉山七寳崚嶒九宮十闕億千萬門皆自道胎化運精神逮於人物三華妙庭紫閣朱宫胎光爽靈細微幽精潜伏胎根神風轉靡周回十方中有保胎叔火之君中有變嬰和菟之神中有司男伯華之君中有太玄監生之神中有衛房在庭之眞男呼孟非女呼子宜玄胞未開二神同依胎血之鬼聞名斬摧不敢干試生道永歸天壽之福護命玄師龍文虎裳五斗攝衣速召三官太極主非握鈴嘯咤謦欬風雷挾衛胎宮素煙霏微五帝大魔金火八威保胎成眞貴務光煇除難度厄无念无爲今日校録諸天臨軒東方无極保胎生道神王長生大聖无量度入南方无極保胎生德神王長生大聖无量度人西方无極保胎扶貴神王長生大聖无量度人北方无極保胎衞眞神王長生大聖无量度人東北无極保胎福善神王長生大聖无量度人東南无極護命昭化神王長生大聖无量度人西南无極護命度精神王長生大聖无量度人西北无極護命食厄神王長生大聖无量度人上方无極護命斷死神王長生大聖无量度人下方无極護命廣慧神王長生大聖无量度人十方至眞保胎護命神王長生度世无量大神並乗紫霞吉光越蒼之獸神禽丹鳯之輿瓊宫瑶輦左驂七靈右服九絶巨鳥戢羽夔龍負轅建保胎之節護命神旙前嘯八渟齊唱後吹九律同嗚僊舞秦侯嘯歌噰噰五老啓塗三元列言億乗萬騎浮空而來天貴生道胎命爲先上帝躬簡大極候煙緫眞命神監房度生九天聖母浮駕緑軿天后王妃玄虎擁筵保胎護命齊到帝前隨所應度嚴校諸天普告三界无極神鄉延生之府太一三垣十二胎神布氣錫年使召天眞絳膜紫淵交氣黃庭掃蕩河源若有故氣祖考逮傳閉塞生道破胎敗傷不繼種嗣剋害殃延疾除宿注落滅禍根不得枸留逼合鬼群元始符命時刻升遷斷絶惡試五道不祥保胎育嬰部衛形魂制魔保舉護命朱宮靈降出貴僊化成人生身受度劫劫長存隨劫輪轉與天齊年太度生災胎中八難超度三元道備飛昇道遥上清上清之天北華台元主世生道各有種天天帝玉眞無色之境梵行東方八天此三十二天專主保胎護命及天下胎生種類莫不隸之其胎氣所行之天起於晨極之下自北斗玄冥星文入三台三台六星主生養萬物胎護群生下左回纒房宿十三度女宿十七度至寳鉼宮子位而止凡過氣到本命及本生胎宿則女人有胎胎脫生子故謂之子寳鉼者取其受而出之亦胎之象也惟天人化生住無形胎自天人至於人鬼龍魔皆不化生住有形胎也此天傍連欲界一十八天亦有帝君宮屬治之世人诸乞則降貴氣生男安胎室也靈梵居羅天帝恭慈眞秀明華燿天帝辨元胥極眞洞生天帝劉行眞提蒲離正化天帝羌度霞迷上治宏黙天帝延神關熈六凝眞度天帝抑眞虚夷英延飛度天帝汩燄婁呬覺儲應始天帝正察眞微南方八天燄魔靜空天帝崔臨支題旋樞赤界天帝理常都氐正護雛天帝辯遲樓藍越理至玄天帝薈端思䝉梵符昭濟天帝約尚良虚球彦渚天帝淵憂毗栖禁非司政天帝眇圖卑羅玉庭明度天帝鬰童傒人西方八天風舉大剛天帝匪常儀生金嵬賢善天帝火玄行瓊嶽修盛天帝力摧大魔陶化揚儀天帝都演奢多曲魚斗剌天帝求婆貪貢判靈宣平天帝智辟郎據皓華成備天帝倪僊連髙玄智豫天帝九都赫盧北方八天太始拘墟天帝弗欲單齊廣曜黎明天帝阿留眞明鶴臺統全天帝開躬朗充應利回㝠天帝惠屈眉龍善幾率陀天帝偃幾西康玄胎修妙天帝定梵光稽元曆除天帝著克頥陽不驕道循天帝鬼府洞侯三十二天三十二帝諸天隱諱諸天隱名胎神空洞自然靈章保胎隱龍變胎靈音天中之尊天中之神天中太玄天中之靈保胎化成氣連玉清皆自元始播精移神无量之奥深不可詳敷落胎眞普度天人今日欣慶受度歷關諸天請滅胎種傳注不祥食穢惡鬼黑齒夫人黄女春姑白殃日廵噉胎殺子西宫鬼神青蛇天狗白虎花源老翁幼婦誣害胎元生民嗷嗷但抱深冤不知胎害故氣相連神王監舉无拘生民東斗布筭西斗定名北斗結胎南斗送魂中斗大魁土爲胎眞青帝護魂白帝侍魄赤帝養氣黑帝通血黄帝中主萬神无越青天降胎木眞碧羅赤天降胎紫蓋婆娑白天降胎金眞九回黑天降胎水帝灌池黄天降胎福禧登期五天胎神萬生之宗飛行三台渉過氐房攀女揖虚遊觀太空光霞赫奕諸天齊功保胎護命嚴攝北鄷八方害氣敢爲災凶監生大神校課不容風馳雲奔擊劈前衝火師迅煙玄虎檢蹤燔裂洞浩神兵四攻敢有干試拒遏上眞金馬傳驛玉眞衛營屠割鬼爽風火无停千千截首萬萬剪形魔无千犯鬼无祅精保生瓊胎天壽和寧普告无窮萬神咸聽三界五帝列言上清玉泉无波龍澤靈阿眇眇梵氣道胎駢羅孕化混沌攝制大魔混沌之中上无復色下无復淵風水舍虚紫胞洞然神來感格氣本先天天上天下无幽无㝠无形无影无極无窮溟涬大梵遼廓无光生道開明度人億千元始安鎭建植諸天人氣昇玄胎神内連妙氣成文雲章玉篇三元寳書鳯蹟龍文保胎護命運曆長存大梵泛維萬貽啓張星光流演三十二天輪轉无色周迴十方旋女歷房迴度三台三十五分緫氣上元八景冥合氣入生元元中太皇上帝髙眞乗景太和唱詠洞章司録定生聖毋履綱斷除胎注生厄除殃時貴月吉三元惟良既誕勝慶載齡恊昌千和萬合道化成身身從胎生胎中有眞帝一至尊司命保胎宮室布分天一左眞保胎神君天一右眞保胎神君泥丸大神保護胎門玉女出入抱火握鈴玉帝在頭赤子住心黄庭老師守護帝闕與天爲一百子千孫斬逐腐敗狼藉血痕不得忤胎使嬰晏存上通玉清呼吸華房緑室神牎細微之中護命安魂玉宫明堂金闕崐崘生氣保胎道德委純十月九周萬氣齊仙僊道貴生无量度人開通人門飛天元君恍惚常經變化无垠保護胎命三景同明罪福禁戒宿命因縁普受開度降魂生身身得受生上聞諸天諸天之上各有生門中有空洞謡歌之章保胎靈篇辭參髙眞第一天元保胎大神護命眞君甲子甲戌監生之音大道有神地𩲸天䰟日月同并結胎變靈玉佩左飛金璫右迴流精九轉光被八垂赤子妙微房參尾箕神女錦䙱華纓寳衣入宴胎宫三元共禧扶𢹂眞童自然合離辟却萬凶不蹈傾危祈男公侯禱女嬙妃保固利亨天眞永綏第二地元保胎大神護命眞君甲申甲午監生之章黃旗舞空紫白當宮胎全子生天福濛濛我來自東泛青雲兮御彼長虹捫星斗兮玉馬金風下眞庭兮素女么童傾光降車兮翠裾六龍彼天人兮揖我上公保胎神於三元固靈根於九重紫皇太一萬天齊功坐嘯千神斬馘殃窮擲火億程化明飲風保定生胎道德无終晨霞吐光照徹玄穹第三水元保胎大神護命眞君甲辰甲寅監生之歌隂胞陽胎萬生同頼一氣共旋三界斯在我執玉彝來奠洪儀聖妃瓊顏光華夷㽔紫氣在戸胎室寧固即召九天華蓋翩翻六丁鼓瑟三元掬煙衛此生房日月齊年神公誅斬北帝列言天兵合圍僊眞按軒燒香稽顙注記无偏善功自生翊侍玄元此三元之上六甲之宮保胎護命自然歌音音參洞章誦之百徧靜衛胎宮誦之千徧百神保迎萬徧道備胎化僊容過度三元護命王公有聞靈音六甲扶承勑制地祇寢息无驚拔岀地官夭墮横傷五苦八難生孳繁榮永離禍姦䰟𩲸和明合道長生是謂无量普度无窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此洞章並是三元上帝六甲神王隠祕之音皆是大梵之言非世上常辭言无韻麗曲无華宛故謂玄奥難可尋詳上天所寳祕於玄都三台上宮依玄科六萬劫一傳若有至人齎金寳質心依舊格告盟十天然後而付焉道言下元女人身抱胎脤或犯五傷日月刑衝返害母命分降之時爲上世亡䰟无道鬼爽阻礙移殃不得生就天魁大殺作諸妖賊凡有此災此時皆當淨心修齋六時行香十徧轉經福德立降消諸不祥无量之文普度无窮道言夫胎宮氣衰生福不行多致墮落羸涸不榮祖考訟呼嗣種斷緒母子不良三孤九病乳育乗邪災咎隨妨奉眞至人爲其行香誦經十徧保胎護命監生奏上南宮爲添筭紀全祐生身隨其道功計其隆殺冨壽神僊道言有傷胎之鬼致訟三官賊其年命滅折禄貟使胎嬰病注子養不榮皆鬼神之所爲也亦有善人横被陵害使失嗣續世微門戸凋謝可以急誦此經祈告胎星以保命生基或上世之德鬼責人怒天刑其胎不得安完速宜改愼洗心自悔以免此災害胎之鬼其名有九食二月胎鬼名黄球食三月胎鬼名厲生食四月胎鬼名兆非食五月胎鬼名陸蜞食六月胎鬼名血尸食七月胎鬼名窮竒食八月胎鬼名火朞食九月胎鬼名龍眉食十月胎鬼名赤奚知其鬼名焚香誦詠永保安寧生死受頼其福難勝故曰无量普度世人道言凡有是經能爲下世男女保胎護命有災之日發心修齋焼香誦經十過皆諸天記名萬神侍衛學道之士修誦是經則胎神明正三宮煥騰長生致眞聖胎内結不但女子可以奉行也右別至人尅得爲聖君金闕之臣諸天記人功過毫分无失三元胎僊六甲神王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語无量音道君譔元始保胎護命靈篇東方八天祁彦荒正北台元旋梵形結生帝火洞遷求离柏名希樓都玄玉觀浩劫女房幾延景命神魔緑英回檀感屢碧戚華瀾過邅公都阿夷雲符月淵僊握流微慶落孤賢南方八天九獸蔚无曠圖日珠鄷曲鬼神正頥温甦望祕蕭竟紫華玄胡舊井逼府渾謀宛道雅恊僊梵芝格乗除建土生屈道玄遮吳律覧角媒乾卑浸孤萬眸逸度天耀傳侔西方八天羅扃野垂騫泥偃池劔婁尹虛機泰迎埤宴月霞昇玄黙瀆齊景瑶緑璆交拳近師宛樂太藪勤封陂時骨夜求覩部目隱佀歌逾昭樂鼎琯赤容飛屢耿名僊庭洎峯北方八天苟无猴余琥具凝浮威曠安迎㝠居岫臺洚澥尸枚九真迷崖阿都子他平奚海嘉魯登丞丕昞榭頥陀木罔魁漠玄篨願華斗畢觀齒明愬灝差洞鎭希閱天句衢羅道言此諸天中辰魁三台元生之音靈芒結文布鎮三十二天以施生定命化肇種民光煇缛麗含景玉霄天真皇人模按其文以為正音有知其音能齋而誦之者諸天皆遣飛天神王下觀其身保胎護命上奏諸天萬神朝禮地祗侍門大勲僊王保舉上僊上真下臨尅得遊行三界昇入金門此音无所不辟无所不禳无所不度无所不成天真自然之音也故誦之致飛天下觀上帝遥唱萬神朝禮三界侍軒群祅束首鬼精自亡胎真洞映三府肅清天藎旋碧地樞玄明嶽峙海澄日月煥照靈音幽響群仙慶賔四氣宴寂道景虚凝大量玄玄也元始无量度人上品妙經卷之四十三

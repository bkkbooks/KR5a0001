front:
  text: 靈寶無量度人上品妙經卷之五十七宙七
  hash: sha256:f2d6d72eb7335b7ace1cba409bfb85c71c11fb66c13400174c03b97bf3b834b3
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_057-001a, image: hfl/0012/0012-042.png}
body:
  text: 解釋幽牢品道言昔於始青天中碧落空歌大浮黎土受元始度人解釋幽牢妙品元始天尊當說是經周回十過以召十方始當詣座天真大神上聖髙尊妙行真人十方救苦天尊玉清雲宫大慈天尊大悲真帝酆都九幽帝主仙官無鞅數衆乘空而來十方起雲混如丹色瓊臺寶宇隱顯太空玉馬金龍驂霞泛景飛光鳳蓋垂䕃珠軿瑞彩天光流煥四極蓊鬱淵映明徹碧空七日七夜紅霞搖曵遠幕神鄉天都紫微層影洞耀丹殿星宮瓊堂日闕珠緯躔虛玉綱流演紫烟紛華山海凝碧瑞金為界色雲合防清靜聖途明無纎玷衆真侍座元始天尊玄坐空浮八山九海伏龍翔虎十極太玄之座說經一遍天帝鼓節髙真洞詠是時一國重冥隂域一時光明說經二遍地下重壘三十六皇俯伏恭聽簡閲皇籍說經三遍氣流甘濡灑潤枯朽說經四遍殺鬼滅爽魔衆失聲說經五遍地吐芝英八十一種赬蒼秀異竒文燕胎說經六遍酆山震搖黑海停沸說經七遍九幽地獄萬里鐡城業火熾然億劫洞赤說經之際毒勢氷消炎牢清蕩說經八遍靈霞布空九色成字真文廓現赦諸罪人說經九遍暗氣凝雲傷血隕雨聞經穢淨神風掃麈說經十遍尸骨歘起靈顔鮮瑩自然成人是時一國是男是女悟道知真胞結解釋冥關録籍字迹除脫素幅鍊章了無罪目歸嚮天尊咸遂生養道言是時元始天尊說經一遍東方無極無量品大慈九氣救苦天君無鞅之衆浮空而至說經二遍南方無極無量品大智三氣赦罪天君無鞅之衆浮空而至說經三遍西方無極無量品大明七氣執法天君無鞅之衆浮空而至說經四遍北方無極無量品大惠一氣息苦天君無鞅之衆浮空而至說經五遍東北無極無量品大悲梵氣破獄天君無鞅之衆浮空而至說經六遍東南無極無量品除過梵氣九幽天君無鞅之衆浮空而至說經七遍西南無極無量品大心梵氣拔罪天君無鞅之衆浮空而至說經八遍西北無極無量品大仁梵氣玉匱天君無鞅之衆浮空而至說經九遍上方無極無量品普濟一十二氣萬福天君無鞅之衆浮空而至說經十遍下方無極無量品不動五氣玄毋天君無鞅之衆浮空而至十遍周竟十方無極天真大神無量天君一時同至一國男女傾心歸仰咸荷慈恩下逮淪亡俱霑聖澤感嘆之聲響動幽夜鳥獸悲嘷人鬼悵惋來者有如沙塵飄委嚮風傾注於是元始遍視群生彈指微笑金口發光光如皎月上極無上剛風頂際下極水輪泉曲九漏無底隂谷無不照見一一光中皆現三界衆生善惡命根宿報新緣互相酬對業果自明心目同證此九旋行暈成五色下覆人間上接天境運如輕車灼灼圓象逡巡九道狀如日出東䝉十方同色去地五丈炯爍停空元始登引天真大神上聖髙尊妙行真人十方無極救苦天君至真大神無鞅數衆俱入九色圓象之中天人仰看惟見拂拂從圓光中入既入光中不知所在國人廓散境宇如初元始即於九色圓象之中說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度解釋幽牢無有橫傷傾土歸仰幽顯披心不怨不憎不執不滯不著不愛不害不欺不𡨚不爭言必諧理口有和聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是魔王內諱百靈之隱名也非世之常辭上聖已成真人通玄究微能悉其章誦之十過則諸天遙唱九幽啓關冥海靜默業山傾摧光徹幽夜積劫纍代縲繫鬼都籍在三官朽骸積尸魂魄囚考黑氣腥腐破膽裂腦火山氷池焚爍烹瀆以萬計期無有晝夜聞此玉文天真靈篇則太一録魂南丹鍊神神還識明捨妄歸真欎結𡨚負應時清明太和真氣入其身形蓮花捧履龍瑞扶顏與天人樂大魔伺迎至學之士誦之十過則岱宗凛命紂絶凛恭此君奉書隂曹削名泥丸玄堂七祖故氣氤氲未開內構胎血百節蟲官骨中注吏地虎風獸啖骸食氣之鬼守禦泉府銅大火蛇之神惡烟四激窮魂芒昧神官切齒百里洋鑊千尋鐵壘不見三辰詎曉道境真知沈淪罪根駢委牽連生人追呼族緒冡宅之訟誣告天司冥漠無所一時萬死痛毒終天聞此洞篇魔帥弭節黑帝停軒往劫古爽近世苦魂道力陶冶變酷消仇玉曆定科紫雲覆座神風調逸墮魄飛升死戶無拘逍遙三界輕誦此章身則被殃供養尊禮門戶興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙利樂幽靈度人無量為萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到億曾萬祖幽魂苦爽皆即受度上升朱宫格皆九年受化更生得為貴人而有億劫結魂千載滯爽太上不以聞宥上帝不以恩原禁獄幽牢在女青天一王平女沙九隂大禁都司撿形五老校録暗黲芒窕之穴毒風醜類藴墮四瀆海閭枯削寒丁大魔勑制之魅誦此洞章歘然自生光梵變玄尸胔得度與神同升洗除罪咎青籙紀名刺姧司非不得鼓蝟鋒之斷筆韓君丈人將折簡於螭笈是皆玄司九幽酆泉之重刑此經解釋渙爾泮散而好學至經功滿德就皆得神仙飛升金闕遊宴玉京也上學之士修誦是經節關開通胎真明正洞隂一府六峯遊精隨氣變化與時出入或感人呼吸流毒飲食因芻梗以兆體假冥漠以潜靈九府捕索三官定書經道至神皆即受度飛升南宫世人受誦誠貫十天幽牢苦爽祖世親緣紀過泰山刋名北都皆得鍊質丹陵瑩魂炎海誦聲成雲載此冥魄逍遙太無過度輪轉不經生死奉行之者則延壽長年後皆得作尸解之道魂神暫滅不住地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死䝉惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齊誦詠是經為上世亡魂斷地逮役度上南宮詣三元洞宮主生太陽火官焚除罪簿赦免吞火食炭洋銅沸鑊銅柱鐵床燒烹炮烙衆苦之罰經道神力變成清池獄具惡器悉為蓮花七月長齊誦詠是經為上世亡魂祖考宗姻升遷鍊化削滅罪緣慶流孫曽詣三元洞宮主死太隂水官漂蕩刑書滌濯元釁淨除溟波海瀆沒溺寒夜冰池雷震霹靂泉曲徒役絞水暴注湍激驚濤衆苦之罰經道神力變成安室獄具惡器悉為樂玩十月長齊誦詠是經為上世亡魂姑妣娣姒往逝婦姫解齗徴呼復連傳逮詣三元洞宫主生死罪録官釋放考掠訊訟簿録證佐對定𡨚仇銜負悔恨喑嗚追召衆苦之罰經道神力變成德友獄具惡器悉為珍寶八節之日誦詠是經奉詣九宮直符九府直事八方大嶽九幽泉牢開通八門受生八道天人鬼神地獄餓鬼畜生魔帥祅魅出離禁獄各乘生功度脫九幽為大施者本命之日誦詠是經為北斗司命司録主非典禁命在斗宫計年期月追召生魂上詣斗宫校定罪福度脫三災四殺五苦六害七傷八難九厄十極事在三元考官冥曹譴謫衆苦之罰經道神力不有害傷魂神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齊戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黃白三色雲氣之中內外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室內項生圓象光映十方如此分明密呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齊清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引氣三十二過東向誦經元始無量度人上品妙經元始洞玄靈寶本章解釋幽牢開光度人諸天隱韻離合自然太始無文杳冥中真元氣化生紫烟氤氳風火陶埴流精自凝支勢低回鏤玉鎔金垂芒駕霞罙布十方混洞赤書命意寫形離為萬象合為寶經纍珠貫花激濁揚清五老吐符皇人寫靈造化以成三界開明天以之清地以之寧人以之生神以之靈物以之成梵氣左騰春夏肇興天光右馳秋冬滋營元始上帝命曰玉真上無復祖惟道為身五文開廓普殖神靈三辰揚輝鬱羅玉清九壘植根冥渺酆城下有大魔與道同生羅山龍源醜都肆姧蕩蕩億程洞宮熒凌中有萬鬼鼓錞巨兵獄考幽隂大劫匪捐火鐵億壘天地無門大悲道王天中之尊口放神光光顯玉文瑞霞絡碧鳳氣成雲禁獄乃開黑界光明九龍銜符鍊度種人是為大梵天中之天繁薈庶生知識自營內構巨業默與神爭神本自天元惡相纏苦魂冥冥墮拘重泉鬼帥執契虎卒仗鞭按券呼名敢干我前黑甲噴火電毋攝仙萬毒備形閉以天關沈目塞耳寥邈南丹哀企玉符赦此幽艱碧空莽莽九劫重山太一黃旗司命騁轅告命九隂典宰司殺元童都禁大君北隂大神司録主算捕魂化生四明五嶽泰山丈人解釋幽牢無量度人今日校録諸天臨軒東方無極道化神王長生大聖無量度人南方無極度生神王長生大聖無量度人西方無極堅德神王長生大聖無量度人北方無極玄照神王長生大聖無量度人東北無極救苦神王長生大聖無量度人東南無極拔罪神王長生大聖無量度人西南無極濟苦神王長生大聖無量度人西北無極赦罪神王長生大聖無量度人上方無極升度神王長生大聖無量度人下方無極普惠神王長生大聖無量度人十方至真慈化神王長生度世無量大神並乘流雲彩車紫蓋彤輪驂駕緑象白獸斑龍建招神之節返生靈旙前合九真之曲後奏八會之音天馬麒麟騰躍辟非六丁啓道七耀捧轅億乘萬騎浮空而來傾光回駕監真度生北隂右相洞淵化宫三元助理太上靈君執籙持符同會帝庭隨所開度嚴誓百神普告黃闕無極幽關悲歌九映故試大魔六天治獄萬鬼之營冰池沸鑊銅柱火山飛戈飄㦸巨石刀輪三塗長役五苦夜河虛皇有命皆使超升北都寒池部衛形魂制魔保舉度品南宮死魂受鍊仙化成人生身受度劫劫長存隨劫輪轉與天齊年永斷幽沈苦趣之難超凌三界受鍊洞陽洞陽之天天帝道元無色之境梵行東方八天玉餘明報天帝蔚覽真蒼靈洞籍天帝耶殊覺氛妙極神際天帝録多清夷長智通奇天帝元胎保真救寂惇和天帝元胥子明玉回霞緒天帝招靈𣢾神赤瑜寶淨天帝珈輔龍琛道明雲覬天帝清宣左聲南方八天德育正化天帝傳明道因玄靈妙濟天帝粵須延生虛璲澄廉天帝露憫遞聰彰容克間天帝彥韋常臻奏須曆靜天帝婆藍宛都太妙希玄天帝招真烈元和遲竟觀天帝部陀鬱彌深極勝離天帝明朝紫賔西方八天鬼樞星映天帝光興羅軒超氣皇度天帝柏華月璘昭寅澄觀天帝至輔虎林蕩拂遠想天帝覺慮騫奚靈微四極天帝彥光平舒月廣耀虛天帝布華總陳昌冝管祖天帝畢康參勑嚴制魔天帝開圖祖玄北方八天紫華慶陽天帝辨惠源常憫亟濟天帝羅遜義洲征旗闢盧天帝虛𡵨杳宗彊明拯機天帝魯評兟太極允明天帝未京左丘濯儲烈和天帝曜童齒南浸微液華天帝瀦靈宛寧河都曲泉天帝江定英三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻度幽之音降幽之尊感幽之神解釋幽牢化度群靈九幽十極變化幽冥無量之奧深不可詳道出神真普度窮魂今日欣慶受鍊歷關諸天請滅三惡斬絶地根飛度炎池名列太玄魔王監舉無拘天門東斗主訟西斗司刑北斗出命南斗變生中斗降神魂魄以靈青帝授性白帝造形赤帝傳識黑帝運精黃帝養胃出納分明木獄神王考掠爭析火嶽神王燒焚烙炙金獄神王斬摧钁戈水嶽神王寒冰凝冽土獄神王陷壓埋壘五獄大魔
路百祠輪道定虞渚歷正孚瓊兆堯柏巒洞清湊營西方八天奏度球疑冲朋聮棲此八字為九幽太一號迷盧蘇攴寂幾渠施汶漢钁神斗玉儀觀侔合積噓持米離玄方碧羅陽志荒時七覺遙祖卷逋索逵霞敷琯姬景育度元混幾央卑鼓龍澤歌他墀半飛龍皛由嵋內八字鄷城官諱北方八天玉蹊亂基日淵盂池漙載願列坡荒元祠絳洞妙弼丘目藴飛定芒混逐坤齊建䝉激馘鬼鄙煙營方仇卯畜既明菩郎罕投幽歌寒呱烈燔夢遊㦸旦悅攴仙都霞周內八字玄老內名道言此諸天中大梵隱語無量之音舊文書太玄北闕五靈長樓之上以開度泰山九幽羅酆泉曲冥關纍苦之魂繫在三官不得自明逍遙玄空之者丹書揚之以濟淪苦昔天真皇人詣夜光元后模倣書之字皆廣長一丈八角垂芒委宛如印九六之㑹離為正音有知其音能齊而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳魔王保舉上真道備剋得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成天真自然之音也故誦之致地獄釋縳長夜開曉幽牢隂界息苦超生人道安寧鬼途解脫碧宫霞覆丹陵發光鎮靜海嶽福及萬生天垂彩耀地湧玉英冥慧洞清大量玄玄也元始無量度人上品妙經卷之五十七

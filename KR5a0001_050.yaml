諸天記人功過毫分無失天中魔王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君撰元始靈書中篇東方八天蘋璣無玕珍華肆極辨祖幽池魔靈滋直允被盧康景麗縳奕乾司耀帝禁離蒙辟猛牛塗巔候鬪魯仙障祅殿容典蓄魁哿梵流牡綦智泉隱嶽旅師戰瓏秀宛僅塗南方八天炎爍純瑶澄彭覩韶昭濟雲虛緣功鄙刀逸液興心巖溫密潯毳巒芝茂瓊溜𥥆岑復察混洞露微悅愔化迹罔圖生妙真森和感混化乳珊朵丹茹道含祥中竒莫忱西方八天鑄交火水邁華吸邃嬉胞一醎氣淵賁蘂抱空意圖𤪽光素齒稽覆匪垠韞息優視神壘萬合天津寥致龍涓金瀝田根浹被光回燁驛太玄雌宫偶雄誕珠固肇奚窮北方八天晦默退樊稀賔徐安鼓釜燮種忽芒烏完蹈持夷廓明塊九還靜坦隳識霞都矚觀茅渙菁麗馥蘭帝韓沖龎符規劫眇黃壇徊度汗諧度寶期聮斗閣録文巨籍紫元道言此諸天中六梵隱語無量之音舊文刻碧玉玄臺紫微太微二極之館以正水火之運蠲化三界劫數運度災癘竒變之殃使日月含華隂陽沖泰以成萬物之自然無為而冥化字皆廣長一丈金霞煥曜蔚翠映圖天真皇人昔書其文以為正音有知其音能齋而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祗侍門大勳魔王保舉上清道備剋得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成天真自然之音也故誦之致飛天下觀上帝遙唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅清河海靜默山嶽吞煙萬靈振伏招集羣仙天無氛穢地無祅塵冥慧洞清大量玄玄也元始無量度人上品妙經卷之五十

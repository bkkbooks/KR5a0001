front:
  text: 靈寶无量度人上品妙經卷之二十三玄三
  hash: sha256:9f84500d8dd8f145d5a913b27e2a78cb56b494cd2aecc5746f0f6776a903961a
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_023-001a, image: hfl/0005/0005-082.png}
body:
  text: 降眞召靈品道言昔於太極宮中紫燿騰歌大通神土受元始度人降眞召靈无量上品元始天尊當說是經周回十過以召十方始當詣座天眞大神上聖髙尊妙行眞人無鞅數衆乘空而來紫煙騰霄羽騎雲車霓旌霞蓋映靄晨煇五色羅絡鬱燿九空七日七夜諸天諸地日月星辰海嶽洞宫一時開朗靈光照徹景氣澄清一國地土山川林木緬平一等無復髙下土皆作七寶異珍十華妙色衆眞侍座元始天尊玄座空浮天靈洞化神金萬變之摩說經一遍天眞大聖同時稱善是時一國男女尊崇道德開悟性眞說經二遍神化彰明說經三遍昧識達玄說經四遍霄虚妙響雅韻成音說經五遍空洞靈文朗煥八方說經六遍髙眞上聖下敎人間說經七遍三洞經法普用宣行說經八遍幽顯神靈應念隨心感善降祥與德合并說經九遍魔試蠲息五帝舉仙說經十遍百神結體萬炁齊升是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方无極无量品元道大神無鞅之衆浮空而至說經二遍南方无極无量品明會大神無鞅之衆浮空而至說經三遍西方无極无量品浩素大神無鞅之衆浮空而至說經四遍北方无極无量品靜復大神無鞅之衆浮空而至說經五遍東北无極无量品萬化大神無鞅之衆浮空而至說經六遍東南无極无量品通光大神無鞅之衆浮空而至說經七遍西南无極无量品華眞大神無鞅之衆浮空而至說經八遍西北无極无量品玄虚大神無鞅之衆浮空而至說經九遍上方无極无量品紫極大神無鞅之衆浮空而至說經十遍下方无極无量品洞皇大神無鞅之衆浮空而至十遍周竟十方无極天眞大神一時同至一國男女傾心歸仰來者有如雲飛霧合無鞅之衆迮國一半土皆偏陷非可禁止於是元始化一寶山狀如崐崘内有洞室玉扉四開在空玄之中去地千丈元始登引天眞大神上聖髙尊妙行眞人十方无極至眞大神無鞅數衆俱入寶山之中天人仰看惟見勃勃從玉扉中入旣入玉扉不知所在國人廓散地還平正無復𣣱陷元始即於寶山之内說經都竟衆眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度乆視長年無有疾傷傾土歸仰咸啓悟心不邪不詖不昧不愚不荒不蕩不求不欲不念不思性與道通體合至眞慈惠爲本風俗長淳國安民豐欣樂太平經始出敎一國以道預有至心崇奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝内名隱韻之音亦是神霄内諱玉洞之隠名也非世之常辭上聖已成眞人通玄究微能悉其章誦之十過諸天遥唱萬帝設禮河海靜黙天眞降庭招命神靈三天駐軒璇璣不行千官列班負赤玉之寶圖握黑帝之隠篇回屍起死降眞得生白骨成人上獲髙仙至學之士誦之十過則五帝臨察三官赦愆地根伐絶魔試莫侵濟度埀死絶而得生所以爾者學士穢氣未消體未洞眞以制十方威未制天政德可伏御地祇束縳魔靈但却死而已不能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因縁萬災不干神明護門斯經尊妙獨歩玉亰度人无量爲萬道之宗巍巍大梵德難可勝道言凡誦是經十過降眞召靈諸天齊到海嶽神官隂陽主宰俱來護度簡奏髙宸格皆九年道就長生獲受玉書而上列帝臣功滿德就無不克升朝于金闕遊宴玉亰也上學之士修誦是經降眞召靈混化百神洞合幽妙超鍊飛昇世人受誦雖未逹玄要精念若勤亦可感眞期靈延致妙氣灌養身形脫離疾患保壽長年後皆得作尸解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙恵上天所寶不傳下世至士齎金寶効心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各三十二人營衞神文保衞受經者身道言正月長齋誦詠是經降太上之上眞召三界之衆靈爲上世玄曾下逮一身消絶積禍散滅惡愆上升玉宮參晨帝軒七月長齋誦詠是經降太一之中眞召九宫之衆靈保度我身上奏玄名紀功青簡十月長齋誦詠是經降太上之下眞召洞臺之衆靈爲國土封疆社稷民人撫調時序風雨順冝稼穡豐禳永享升平八節之日誦詠是經降召八方玄虚日月宿度眞靈消禳殃沴感格福祥本命之日誦詠是經降召天地隂陽五行眞靈之神混合我形鎭守百關九宫泥丸骨骸玉固色潤金鮮使我長存上賔帝前道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黃白三色雲炁之中内外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室内項生圓象光映十方如此分明密呪曰无上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齊清堂修行至經无量度人願所啓上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始无量度人上品妙經元始洞玄靈寶本章降眞召靈上品妙首十回度人百魔隱韻感格自然神素靈章合明妙關虚清大梵經緯萬天總括三道玄通化樞宗於會極與道涵虚開布精誠分辨靈塗非志不達非德不攄神文攝炁冥冥相符上該玉闕旁周洞无彌羅梵境幽寥之中紫微瓊館龜臺閬風天機所主歷劫无綱混茫之精祕頥幽光煥落萬景鬱秀五華大羅法輪總御十方佩受帝炁降眞召靈中有消愆散厄之神中有長生延壽之君中有三玄定命大神中有五老皇靈丈人中有隂陽丁甲元根主宰太一尊神回光鍳映无量度人今日存感萬聖臨軒東方无極景眞神王長生大聖无量度人南方无極化靈神王長生大聖无量度人西方无極昭應神王長生大聖无量度人北方无極冥慧神王長生大聖无量度人東北无極妙智神王長生大聖无量度人東南无極洞明神王長生大聖无量度人西南无極藏光神王長生大聖无量度人西北无極寶華神王長生大聖无量度人上方无極寶仙神王長生大聖无量度人下方无極舉度神王長生大聖无量度人十方降眞召靈神王長生度世无量大神並乘三素華雲飛飊霞輦浮燿玉輿翼衞钁天大獸神虎辟邪建降眞之節召靈之旛前列鐘鼓震響後參廣樂簫歌景龍碧鳳音韻相和千眞馳驅萬象回旋天仙兵馬羅布億千傾光回燿應化而來神霄上宰太極諸天玄機玉輔二臺仙𡖖奉符秉籍簡奏晨玄眞皇敷化告下三元八極世界洞府泉源重河九壘酆都六宫南闕北溟百二十曹檢校仙士學眞之人丹心淵徹志念精微感通妙際契會幽機隨所昭格敢有愆違玉都上房錫命靈飛上清六甲豁落五符左招無英右挾白元保鍊形骨與天齊年永度三塗五苦八難超凌三界逍遥上清上清之天天帝合元無色之境梵行東方八天幽澄至感天帝順蘄允隆九生論化天帝賀玉渟汶巴那浩公天帝落定形垠谿政修天帝寥吉有騑角明動中天帝司關正儀光量勤德總彰天帝卓蘭冥竒銖滿自利天帝運希生幼直感容天帝護特化昭南方八天鳳陂文隠天帝權變朱英丹宮簡房天帝竺月羅樞洪歷瑶天帝燿童眞度仙勝延天帝眞來乗夫變世壽華天帝祕度無傍逸龍雲景天帝驛追萬靈胎素衞慈天帝握炁盈孫寶紀定名天帝達眞和西方八天神營受符天帝老景星昌召靈促軿天帝石燿公儀印道誓玄天帝術律用封眞化瓊靈天帝召嬰伯康皓靈傳𡖖天帝和總山圭太微七司天帝祝望枚宗流精大安天帝就思九生剌陽廵斗檢靈天帝正輿傾光北方八天奠辰髙清大混天帝瑶弓致眞證道示虚納空天帝範堂賔舞雷舒光玄報天帝温慈明旂洞色紫精天帝召靈考仙修陽啓珠天帝伯述無回騎史信書天帝益沖領方太上閱功天帝普英元王仙曹劾功録王天帝壽都基昌三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻混合之音立極之尊儛天之神飛空大魔攝氣之靈四被六周騰變太清玄上之化廣難可名召降靈眞普度天人今日感生鍊度歷試諸天成體玉華合景飛根佩服赤書功列紫宸玄司考察名參上宫東斗奏言西斗授章北斗奉簡南斗化光中斗元標運斡萬方青帝開生白帝舉仙赤帝執法黑帝賞延黃帝秉正攝御威權青天眞君大憲明曆丹天眞君龍燿司直素天眞君摧伏亞逆黑天眞君施玄布德黄天眞君鎭安四極五天至眞萬道之元飛行太虚綂領群仙總校圖籙髙居上玄周行八冥坐鎭天關蒼河碧海瑶闕瓊山宣令布化普告無窮元皇受命掃蕩災凶钁天震威流光四衝天老持符照辟不祥驅除萬惡理正元綱敢有干犯亂我天常不容乖變糾送溟泠風火交激殺伐祅群學道得度開濟生民斷滅魔試皆獲飛升拔度七祖永離幽沉不得留滯受鍊朱陵宣告北酆萬神咸聽三官九府列奏玉京天元大籙變化玄虚纒結周流騰降沉浮下沖鬱絶上朗太无靈風扇霄開天御圖天上天下幽廓冥冥玄光浩蕩大劫無形鴻濛元炁雙象交升混沌懸立保運自然負山召龍億曆綿綿周行離合包絡諸天玉昌安鎭五方赤文妙化生育三十九篇立以天帝主以道君流演隂陽統治萬靈攝領群魔持運彌綸大範宣布八垣流精澄景天華眇眇玄微玄微上皇炁合眞機飛光紫清燿英霄煇明霞散空太眞儛開玉章灌鍊靈煙九回玄亰納正輔化三才千備萬周混道成眞眞中至神萬帝之尊宴處圓羅我之化身龍漢億劫植立無垠丹光煥發萬品生成上遊紫虚劫仞蕭臺琳宫之内華闕之中召降眞靈普度群生蕩除穢滯通理百關七轉回風與氣俱仙仙道永存无量度人上開八門經天化輪考校功業罪福因縁普度七祖一切幽魂逍遥十極上升九天九天之上各有生音中有玄虚通感之章列聖靈篇辭參髙眞第一天人通感之音玄化蕩簜流結眞精肇立諸天生育神靈茫茫三界无極天民邪想淪惡趣通感登髙清穢濁相沉溺使爾道無成不受洞元章何以超玄津欲念隨所樂學仙多苦辛縈累須臾滅業盡化埃塵一悟永逍遥萬劫保長存精誠貫紫霄遼思達玉亰神飛合太虚同妙際幽冥第二仙王降眞之章玉文羅碧霄降眞玄上峯服嚥日月華髙奔玉帝宫逍遥過三界倏駕徊靈風中育孩道康内居伯史原巾金佩緑羽騰煇乘紫煙相命諸仙僚齊禮帝一尊下觀無極郷塵境何紛紛丹簡攝大魔黃旗校雲營蔚蕭祕青編普度學眞民玄符下三界萬炁皆齊仙元始會百神回光臨我軒七祖離長夜幽魂度五關與我永相期超升出世縁第三元皇召靈之篇三天之上洞靈清微玄景崇阿劫仞靈宮中有至尊運化元機綂御群品萬炁總歸巍巍大梵太素髙神丹光曆明二象豁開鬱察受敎布列眞階飛天流演包絡泉臺八威玉文安鎭五山永保億劫使炁無傾人能玄感悟道通靈修眞進仙業萬聖自來臨世慾坌眞趣何不栖山林此三界之上飛空之中飛仙眞音音參洞章誦之百遍通感無垠誦之千遍召降眞靈萬遍道備玄聖來臨過度三界位登仙𡖖有聞靈音群魔敬形勑制地祇侍衞送迎拔出地戸五苦八難七祖升遷永離鬼官魂度朱陵受鍊更生是謂无量普度无窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至眞仙王隠祕之音皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奥難可尋詳上天所寶祕於神霄玉清王府東華寶藏依玄科隨運下傳若有至人齎金寶質心依舊格告盟玉清然後而付焉道言夫降眞則災厄息召靈則禍難除安國寧家悉從玄感若劫運否終三光虧盈神人休否末學疾傷同氣皆當齊心修齋六時行香十遍轉經髙聖立降消諸不祥无量之文普度无窮道言夫末學道淺或仙品未𠑽運應滅度身經太隂臨過之時同學至人爲其行香誦經十過致五靈之童以始生之英鍊度屍形如法魂神徑上南宫隨其學功計日而得更生轉輪不惑便得神仙道言夫天地運終星宿錯度日月失明隂陽不調國境有災兆民死傷師友命過皆當修齋行香誦經則八天主司各遣飛仙收滅禍害之氣使國土安寧生民康泰已化超升夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民隨其功業感格眞靈故曰无量普度天人道言凡有是經能爲天地帝主兆民行是功德召降之日發心修齋焼香誦經十過皆眞靈記名萬聖來臨右别至人克得爲帝君玉府之臣列曹記人功過毫分無失神霄公𡖖亦保舉爾身得道者乃當洞明至言也諸天中大梵隠語无量音道君譔元始降眞召靈中篇東方八天陣林斗廬弔角歷虚帝明愬恪景昭化于丙純祠文律慶自模滅叔止普政惒慜居昌極禇鄰兊挹元符札遘時畢臻魯張須甲華左周轉辰閻師杳太逸王紫天毗分南方八天朱光含道析眞流陽固已洞温伏覬玻璫露乾迹非雲押寧章旣獲由祭夢奪元剛注靈鸞泰旬使治倉弗閑獲度平太勇光赤華煇帝廣素啓方望智無問義并委常西方八天頓叉瑶敕冥湄阻衰釋謐房弼定局可歸稱玄弗極用祕提回猛歌昆縁邾墟淑階髙華偃聰拱師陀開煇路湛見嶽察守臺至鎭栢趨珙袍碧微山眞夷郎道英格非北方八天玃侯察姦主兵元環盧起瞻谿歷魔簿監文華權陽液掖嵎盤麗審密火化混雲輪交到乂谷羅弈穹旻暝和情比紫眞降璘展義漠涘晦張垠綿緯投穴互畢忽輕遷道言此諸天中大梵隱語无量之音舊文刻書青城宮玉臺館主降天地之髙眞幽顯之玄靈助行大化以唱三境之仙宗字皆廣長一丈天眞皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆命化炁仙王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勲魔王保舉飛升道備克得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致飛天下觀上帝遥唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響十方肅清河海靜黙山嶽吞煙萬靈振伏招集群仙天無氛穢地無祅麈冥慧洞清大量玄玄也髙上仙王降眞之符元始无量度人上品妙經卷之二十三

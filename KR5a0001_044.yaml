body:
  text: 洞神禳災品道言昔於太極天中青華安保大真明土受靈寳度人洞神禳災无量上品扶桑洞神大道君當說是經周廻十過以召十方扶桑世界一切眞仙亘太極之東九十萬里碧海之内中有大山根連洞溟金沙重疊貫軸下元上出大无紫空神境西連太極南峙炎陵北定幽門中通玄都而此世界十萬餘里神峯巨嶺隱顯滄浪梵浮瑞光青霞之氣冪冪在上青玉爲城碧林爲宮地凝紺華拱生扶桑根蟠東極枝條相向青碧爲光千葉之上自然天文帝眞赤書九氣鳳文以鎭十方諸天日月下出陽機自運晝夜六時天漠波潮雲濤爭湧仙都人民十二品格百千種物太无三氣化生號青宫扶桑世界元始天尊分神萬天散形千億忽於此方命以扶桑之天青華道境靈冑孕精挺生空洞之極號扶桑洞神大道君外曰扶桑大帝出納太陽賔餞濛汜眞形爲日月之精魂爲南極長生大帝其季次曰青華帝君扶桑育洞神之氣氣變九劫體貌完具東眞道成爲洞神大道君扶桑洞神者九陽眞精之氣也生於扶桑之内化爲劫火更爲明哲辯慧髙聖之德德之至神爲大道之君道君執萬物之母以化生元胎含五行之精以鑪錘天地世之災變必由火殃火爲災本而道有扶桑洞神之祖以御其變扶桑青林之氣大則冶錬眞文増益玄道小則禳災散禍福祐群生比之火然必縁於木木胎蔵火火屬於神神養木中天災自息可禳之道故扶桑洞神大道君爲禳災之主也降於太極始當詣座扶桑眞境道德大神上聖髙尊青帝眞人无鞅數衆乗空而來碧落飛雲青林鬱秀飊輪潜運洞蓋垂華蒼龍妙光迢遥无外流霞丹景混合渺茫七日七夜諸天昭臺日館星闕璣轅一時停軌靈風逺溢海岱明雲天无異色九氣鬱清一國地土山川林木瓊蘂粲芳青文壟起紫璆振響合音空洞扶桑洞神大道君於玄靜之中爲諸生民解禳災厄玄坐空浮紫霄寳光玉座之上說經一徧諸天大聖同時稱善是時一國男女災病普皆消散說經二徧太極天開萬眞同㑹說經三徧仙都揚煙慶周三界說經四徧靈心内通宛識妙體說經五徧龍嗚海空神波逺浹說經六徧三災不作萬物生榮說經七徧神煇同映層闕光明說經八徧五篇雲篆紫籟成音說經九徧玉華飛空重綵交煥說經十徧洞神垂照泉曲蒙恩是時一國是男是女莫不傾心皆受護度咸得長生道言是時扶桑洞神大道君說經一徧東方无極无量品禳災解厄洞神至眞大神无鞅之衆浮空而至說經二徧南方无極无量品禳災解厄洞神至眞大神无鞅之衆浮空而至說經三徧西方无極无量品禳災解厄洞神至眞大神无鞅之衆浮空而至說經四徧北方无極无量品禳災解厄洞神至眞大神无鞅之衆浮空而至說經五徧東北无極无量品禳災解厄洞神至眞大神无鞅之衆浮空而至說經六徧東南无極无量品禳災解厄洞神至眞大神无鞅之衆浮空而至說經七徧西南无極无量品禳災解厄洞神至眞大神无鞅之衆浮空而至說經八徧西北无極无量品禳災解厄洞神至眞大神无鞅之衆浮空而至說經九徧上方无極无量品禳災解厄洞神至眞大神无鞅之衆浮空而至說經十徧下方无極无量品禳災解厄洞神至眞大神无鞅之衆浮空而至十徧周竟十方无極禳災解厄天眞大神一時同至一國男女傾心歸仰來者如赴淵之流應潮之水渺然无際不見端涯无鞅之衆舉國内外或有體用未分因縁爲災智慧不爽法染爲災神氣不合分别爲災道性不明執妄爲災去取空有邪正爲災戀著法身認己爲災貪著神通變幻爲災欲出三界生死爲災識悟大道无作爲災測量元化狂瞽爲災不知洞神隂陽爲災出入胎蔵凡聖爲災凡此十二大災天人大神至學之災也復有世間之災出胎之時業力所轉横側爲災童孺之時驚忤爲災壯歳之時運度爲災營辦之時得䘮爲災修舉之時氣候爲災起居之時疾病爲災有作之時鬼神爲災昩心之時天地爲災負國之時刑戮爲災不孝之時雷火爲災不戒之時天禁爲災汙慢之時夭折爲災潜毒之時隂陽爲災貪徇之時溢分爲災居世之時僞薄爲炎凡此十五大災世所罹犯以至身命喪失五命加臨天星爲殃地司執録三官上奏五帝注尤此等災厄累繫身心咸赴道君廣大法席周帀圍繞瞻望天顔佇聽玉音宣示禳災普利大法於是扶桑教主洞神太上大道君攬日月雲龍之綬轉瑞玉明光之几俯顧大衆欣眄十方倏歘之間分身千億一切衆生各起生縁及諸境界一一衆生皆見己身親對聖身長跪受記撫頂訓言演說扶桑爲生氣之根中生洞神之氣爲萬類之精神一切大災存念洞神正眞九陽之光无災不除滌滅厄害於其㑹中見一道君浮坐紫雲曲䕃扶桑玉章紋葉之下洞神之氣化爲丹林丹林千眞冠劒竦列去地五丈洞神大道君登引禳炎解厄洞神天眞大神韓司主録南宫移度却災順行神君上聖髙尊青華燿寳眞人十方无極至眞大神无鞅數衆俱入神林扶影之内天人仰看惟見勃勃從洞光中入既入林光不知所在國人廓散碧壘砥平神林靜默洞神大道君即於化境之内說經都竟衆眞監度以授於我當此之時喜慶難言法事粗悉諸天復位空洞生神寂无遺響是時天人遇值經法普得濟度全其本年无有中傷傾土歸仰災患消禳清靜本心心既淨正邪道不干星軌淩犯鬼神禍刑三災四殺五行六害七傷八難九厄過度災咎除滅不祥言契中道中无毀非齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉崇禮皆得度世道言洞神大道君說經中所言並是諸天上帝禳災致福隱韻之音亦是魔王内諱禳消萬災之隱名也非世之常辭上聖巳成眞人通玄究微能悉其章誦之十過諸天降眞災氣沈滅厄禍𢷤竭本命開光生福自然天眞警衛非道无干群仙凛顔靈司鼔節灝霞分絢寳海發光世故殄除惡煙飄息回災轉厄進業成眞至學之士誦之十過則列帝同格衆天遐映護世災殃悉令禳解民物安謐生道永昌毒害消散鬼精䘮眼五帝侍迎三界禀命濟度垂死絶而得生所以爾者學士道德充備鬼神尊仰體洞眞極神力周滿誦詠至經福降災消一切衆生禳脫衆難玄通天政伏御地祇束縳魔靈不但却死亦能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因縁萬災不干神明護門斯經尊妙獨歩玉京度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過九天消災散禍諸天大神齊到禳除厄難暗宿隂曜玄天神首孛戾凶怪將臨命限齋心祈懇永斷衰殃數極劫終魂神受度上昇朱宫格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經惠澤滋洋生類蒙福重災巨厄清蕩捐釋皆即受度飛昇南宫世人受誦則延壽長年後皆得作尸解之道洞神火精錬骨變仙形神隱顯出入自在栖泊福庭逍遥道域即得返形遊行太空此經微妙普度无窮一切天人莫不受慶无量之福生无蒙惠上天所寳不傳下世至士齋金寳效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉量玉女各二十四人營衞神文保護受經者身道言正月長齋誦詠是經解禳上世亡䰟塜訟鬼官臨注之災斷滅殃傳夜河之役度上南宫七月長齋誦詠是經解禳己身天羅地網九横凶醜天獄刑害之厄身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經解日月勃蝕天地運否邪源祅𧕏境土國界之炎人民毒疫傷犯天絶爲國王帝主君臣父子安鎭國祚保天長存世世不絶常爲人君安鎭其方民稱太平八節之日誦詠是經解禳氣数遷易交變時節之災口舌罪咎禁繫殺傷之厄水火窮衰閉塞之難九宫降神下衛其身本命之日誦詠是經解禳北斗追召生魂死注坎蹇窘辱之災魂神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黄白三色雲氣之中内外蓊㝠有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室内十方禳災洞神大神儼對前後項生圎象光映十方如此分明宻呪曰无上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齋清堂修行至經无量度人願所啓上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始无量度人上品妙經元始洞玄靈寳本章洞神禳災妙品天福度人百魔隱韻離合自然洞神赤文无无上眞元始祖劫化生諸天青華木眞萬物生根生氣流布精液氤氲木之尊神元氣之子氣生眞水水變生木木含青華之氣爲萬物之主其青華木精中舍明性化而爲火火色赤明通妙成眞自然生神體洞太虚解悟誠明其氣長生炎動熒熒各曰洞神洞神至眞物得生成一切邪殃見之悉寧爲道眞體災凶邪僞莫可禦當地有五金得火見精萬物入火變化无方易骨登玄思妙全天理臻又玄如世災殃非正之歸洞神乗之萬災折摧洞神九陽生福无量得者長存物感永臧神風揮激丹霞飄揚屈曲成文三景同光禳災護生刻榜瓊堂上通三天无无道鄉下極玉山鬱羅混黄中施群類救禳災殃嚥佩神文引吸太陽紫烟内凝燦灼煒煌爲道之要超升之門天眞之因化生神靈制運保民皆由洞神神氣大梵周迴十方中有禳災回福之神滅禍延生之君洞神解厄尊神東華度命之君太皇萬福丈人中有扶桑定命除災之神消災散禍道德之君禳祈應契无量度人今日校録諸天臨軒東方无極洞神禳災神王長生大聖无量度人南方无極洞神禳災神王長生大聖无量度人西方无極洞神禳災神王長生大聖无量度人北方无極洞神禳災神王長生大聖无量度人東北无極洞神禳災神王長生大聖无量度人東南无極洞神禳災神王長生大聖无量度人西南无極洞神禳災神王長生大聖无量度人西北无極洞神禳災神王長生大聖无量度人上方无極洞神禳災神王長生大聖无量度人下方无極洞神禳災神王長生大聖无量度人十方洞神禳災神王長生度世无量大神並乗飊輪回旋燿景之輿丹瓊雕輦華蓋珠旙諸駕龍鳳十絶九光之幢四氣八景明离之帳前嘯梵音齊唱後吹瓊籟同嗚金鶴丹禽嘯歌噰噰六甲啓道九老翼轅億乗萬騎浮空而來傾光回駕監眞度生諸天丞相南昌上宫司命司録禳災散禍延壽益筭度厄尊神執籙把籍齊到帝前隨所應度嚴校諸天普告三界无極神鄉泉曲之府北都羅鄷三官九府十二河源行災主瘟天大殺鬼㝠曹之神禳免世間生類刑禍衰虚之災改易簿書勾落災祥使生常存福慶日増疾除罪釁落滅惡根不得拘留逼合鬼群道君符命時刻升遷順剛入斗迴度天關出死入生上見帝宸制魔保舉度品南宮魂魄受鍊災消福應生身受度劫劫長存隨劫輪轉與天齊年永度三塗五苦八難超淩三界逍遥上清上清之天天帝玉眞无色之境梵行東方八天玉曆玄度天帝眞定儀陽錫納慶祖天帝仇辨嬰常九氣敬賢天帝收提耿光青華利元天帝孚蒲耳敦韓都九司天帝旺池奚銘部同超後天帝鄙宗時隆丹林隠立天帝僑蹤彦松九色剛種天帝月支子容南方八天燿浮墠寓天帝景肇建生重光普時天帝玉微觀靈洞極丹儀天帝祖竒歸仁正基太度天帝除思歩肱辨阿録成天帝感儀聦玄殊惠凝天帝彦侣馮靈九陽歷靖天帝路蚪師隂章梵元淨天帝伍丘思仝西方八天參寂玄際天帝大无元兆津普夷天帝師度歌延妙瑜素靈天帝順師洞隂金扉皓墟天帝藻辭願晡洞惠明妙天帝根齊踈衮招眞空
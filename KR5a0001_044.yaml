木爲簡丹注其意禳解之文投山水間埋著向處及有災之境則洞神大神收攝災氣降致福祥夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受頼其福難勝故曰無量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋焼香誦經十過皆諸天記名萬神侍衛右別至人尅得爲聖君金闕之臣諸天記人功過毫分無失天中魔王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君譔扶桑洞神大道君禳菑靈書中篇東方八天箕鳴玉阜東井變仙牛室互交六氣辯玄离披寳泰玄踱迷夷諸羅梵摩陳帑萬微馘竺由慈字盻紛持角卓護景月帝隂霏辜乾擊陁變覺銘儀仙郴說林翼原巒微南方八天正坤九辨巴㝠混東紫丘適河寂真相同梵度遼普金極洪壠肇淨平育阿彌思蒙挺洞赤霞皛晶碧容桓羅閻救率宰營忠肆碑詩何竟卓懋舂公建霜縁哨粤垂雄鬼澤龍偃定白祕玄學靈鄙露支騫走檀自鬼字叩四句係禳災宻文西方八天奎婁應仙旗髙步蓮綽真構攤景復滋堅太香玉度球浪楚傳牛室事無寳秤黙云神諦梵藪青朗奏矜龍霧侔就丹𧕏淵弘普載丁琥驥敕揚誡覧覺坰常狐兵資興北方八天鬱儀結璘佽堲功傳朗都究明道伯攸玄爻宜轉綱權融齒房玉邈稽微天魁辿延畢老墟圩景霽洞傷陽復雷捷越逵聿蒼蘇林奚兖神鳯膺張寂區環極道祕竒常道言此諸天中大梵隱語無量之音舊文字皆廣長一丈刻書大帝金宫扶桑青林玉葉雙幹之上上禳天災下禳地禍中安民物神風振之洞神發音氣徧九有和合萬靈使災害不干萬真降庭天真皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣洞神禳災萬福神王下觀其身書其功勤上奏諸天萬神朝禮地祗侍門大勲魔王保舉上真道備尅得遊行三界昇入金門此音無所不辟無所不禳無所不度無所不成天真自然之音也故誦之致飛天下觀上帝遥唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響十方肅清河海靜黙山嶽吞烟萬靈振伏招集群仙天無氛穢地無祅塵㝠慧洞清大量玄玄也元始无量度人上品妙經卷之四十四

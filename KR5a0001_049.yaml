front:
  text: 靈寶無量度人上品妙經卷之四十九字九
  hash: sha256:4ea35c8000beab28279dac8c7558767cd14a0cdd858f5b6b2ba0f38675851f05
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_049-001a, image: hfl/0010/0010-122.png}
body:
  text: 消除病癘跛痾品道言昔於太安天中遙響風歌太和樂土受元始度人消隂病癘跛痾無量妙品元始天尊當説是經周回十過以召十方始當詣座天翳大神上聖髙尊普濟真人通治童子無鞅數衆乘空而來飛光𥢢霄彤輪華蓋花雲覆蔭明霞舞輝天錦交漫洞映太空五日五夜諸天幽竇嵌巖普皆大明星璣月館畫夜停輪神風倚煙靈香拂雲天無飄翳六虛洞清一國地土山川林木砥平齊等無復髙下土皆紺碧無有異色衆真侍座元始天尊玄坐空浮五色晶明寶座之上説經一遍諸天大聖同時稱善是時一國男女身報為病漸獲開爽説經二遍聾者耳聰盲者目明喑者能言説經三遍枯羸沈瘵充澤豐平説經四遍積逮注傳不及于門説經五遍跛痾萎墮皆能起行説經六遍鬼癘消除正氣流通説經七遍老者反壯少者皆強説經八遍軀體病除法身怡悅説經九遍消除病癘跛痾輕安悟病皆妄本非真有返照回光則無痛楚起滅悉從假幻既識道本病從何來説經十遍面流紫華身有玉明魔疾普消神氣合道是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊説經一遍東方無極無量品候氣大神無鞅之衆浮空而至説經二遍南方無極無量品持運大神無鞅之衆浮空而至説經三遍西方無極無量品司年大神無鞅之衆浮空而至説經四遍北方無極無量品定命大神無鞅之衆浮空而至説經五遍東北無極無量品鬼主大神無鞅之衆浮空而至説經六遍東南無極無量品行病大神無鞅之衆浮空而至説經七遍西南無極無量品却癘大神無鞅之衆浮空而至説經八遍西北無極無量品八風大神無鞅之衆浮空而至説經九遍上方無極無量品天醫大神無鞅之衆浮空而至説經十遍下方無極無量品除病大神無鞅之衆浮空而至十遍周竟十方無極天醫普濟大神一時同至一國男女傾心歸仰謂言我等元以福報得生天上非如人間父母精血濁穢之形復有何病是故思惟神氣雖明化生融結而我心想習染尚粗身中妄生疾病痛苦未除譬如世人夢中飲食寒溫起居一如平時夢中之身與今處世父母所生實無有異乃至夢身中疾病痛癢悲歡亦復同狀無有殊别故今身中猶當有此病癘跛痾當詣天尊以求除瘥咸各恭敬願禮道前來者有如細雨密霧無鞅之衆迮國一半土皆偏陷非可禁止於是元始知如是等衆獲果天人猶有病癘跛痾等相何況世間胎化濕感七十二類無量衆生寧免斯苦我以慈悲説是妙經消除衆患衆患欲除無非法藥法藥之妙莫越神丹即運紫光明如寶焰聚五輪手法自九色離羅萬寶星雲玉錦之帔內出神丸化成寶珠大如黍米在空玄之中去地五丈元始登引天醫大神上聖髙尊普濟真人十方無極除病大神無鞅數衆俱入寶珠之中天人仰看惟見勃勃從珠口中入既入珠口不知所在國人廓散地還平正無復欹陷元始即於寶珠之內説經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸行善心不疑不妄不淫不貪不欲不喜不怒不暗不邪不狂言務忠信口無疾聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊説經中所言並是諸天上帝內名隱韻之音亦是真王內諱消除病癘起行跛痾百靈救疾攝邪之隱名也非世之常辭上聖已成真人出離五種病癘廣大法身純陽光明能隱能顯顯則普現十方隱則聖真莫測世病法病並已消殞通玄究微能悉其章誦之十過諸天遙唱萬帝設禮內境澄瑩峩山靡平病癘痊復跛痺全寧身嶽不傾日月同明群魔束形鬼精滅爽回生起痼朽質成人至學之士調之十過則五藏生華膽腦堅真百神守體癘鬼喪睛濟度垂死絶而得生所以爾者學士穢氣未消體未洞真以制十方威未制天政德可漸杜世患蘇決沈苦而已不能更生輕誦此章身則被殃供養尊禮病癘消除緩跛健行世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人無量為萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到病癘衆生痛苦消除跛痾久疾舉用完健邪氣無干百脈受靈一身萬神永不去身身無疾疚自然長生億曾萬祖幽魂苦爽皆即受度上升朱宫格皆九年受化更生得為貴人而好學至經功滿德就皆得神仙飛升金闕遊宴玉京也以經法神護消除病癘跛痾澤惠兆民生類安逸疾痛莫干上帝遐觀報兆真名上學之士修誦是經道備群倫病災拂除癘邪不興跛癮登舉宿痾更蠲皆即受度上升朱宫世人受誦困病自安瘕穢泮落靈秀通玄則延壽長年後皆得作尸解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役三官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齋誦詠是經消除痼病積歲纒綿世藥不治鬼神異氣遘為癘病工所不曉或智或癡或生或死傳習先代冢注為殃鬼氣祟物相呼附著為上世亡魂斷地逮役度上南宫七月長齋誦詠是經消除金旺剋水筋落受邪或因土木或因葬刑害之氣注及肢體手足不理跛癵不行沈冥宿痾上關天律考在斗宫訟連隂府者使各完固不有傷絶身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經遍為生民消除病癘風傷勞疾痼疸痿瘧寒熱伏留泉𩲲腫汗水注咳逆種種怪病普使和捐致國王帝主君臣父子安鎮國祚保天長存世世不絶常為人君安鎮其方民稱太平八節之日誦詠是經消解八風邪氣毒病得為九宮真人本命之日誦詠是經萬疾消蕩鬼癘無侵魂神澄正萬氣長存不經苦惱身有光明三界侍衛五常司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐緑紫青三色雲氣之中內外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室內天醫尚童砭石小吏咸在前後項生圎象光映十方如此分明密呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齋清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引氣三十二過東向誦經元始無量度人上品妙經元始洞玄靈寶本章消除病癘跛痾安化度人百魔隱韻離合自然道為法身太虛生神神寂無形無無上真元始祖劫化生諸天天降地騰隂陽生人人為貽種病癘因緣考謫跛痾積逮因連採食三景命固天根病癘既蕩神氣為鄰玄悟成仙舉意飛神上無復祖惟道為身五文開廓普植神靈無文不光無文不明無文不立無文不成無文不度無文不生是為大梵天中之天鬱羅蕭臺玉山上京上極無上大羅玉清九品仙聖為自然人身病法病普得安寧未證大乘病癘所縈鍊身為氣鍊氣為神神合太無若亡若存三華離便大有妙庭金闕玉房森羅淨霐大正道氣周回十方中有度人病癘跛痾之神中有南極長生大帝君中有度世司馬大神中有好生韓君丈人中有南上司命司録延壽益算度厄尊神回骸起死無量度人今日校録諸天臨軒東方無極消除病厄神王長生大聖無量度人南方無極消除邪癘神王長生大聖無量度人西方無極消除偏跛神王長生大聖無量度人北方無極消除纒痾神王長生大聖無量度人東北無極消除世疾神王長生大聖無量度人東南無極消除注氣神王長生大聖無量度人西南無極消除考瘵神王長生大聖無量度人西北無極消除宿報神王長生大聖無量度人上方無極消除見病神王長生大聖無量度人下方無極消除意病神王長生大聖無量度人十方無極消除病癘跛痾神王長生度世無量大神並乘奔雲迅電赤鳳科車營從天仙靈官將吏侍直神司驂駕大獸天鹿夔龍絳節瑶旌瓊干翠羽前嘯吳嘮同嘯後吹筠篥同鳴吟仙飛籟嘯歌噰噰天丁啓途青髻翼轅億乘萬騎浮空而來傾光回駕除痾度生諸天丞相南昌上宮韓司主録監生大神執籙把籍齊到帝前隨所應度嚴校諸天普告三界無極神鄉泉曲之府北都羅酆三官九府十二河源上解尸注冢訟積逮世傳病瘠鬼癘故氣跛癵宿業纒痾及以祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼群元始符命時刻升遷北都寒池部衛形魂制魔保舉度品南宮死魂受錬仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度三災九厄八難超淩三界逍遙上清上清之天天帝洞淵無色之境梵行東方八天太安順陽天帝景闍玄仁至無化神天帝玉都求輪靜華初元天帝樂真輔仙覺昭情微天帝廣穹良奔序止隂夷天帝部圭士畦落具澄炎天帝斗布紫昆賁亭瀘河天帝除患慈英浪絶妙圃天帝曉因祕巫南方八天碭城寶真天帝仇卑振篁寥居信靈天帝爻霞總祥辨宗虛攸天帝極真途騫楊寶區天帝輔觀盈璖香泮赤和天帝變丁匪邦亮部求玄天帝古定梵康主延無童天帝空基民宣仙房校藉天帝閲都賢昌西方八天考勝徑靈天帝嶽傳至文咸興遞迎天帝關巴罔欹鬱珠逹想天帝召冥履元屏栖烈廣天帝度命微沖璐真確濟天帝眇仙儔輪預逆遊天帝智侈龍液度司夕天帝被曦光旋緑史洞綿天帝道嚴阮通北方八天泝逹紫垣天帝治冥信方曠倚遵宜天帝端究精䐈洞慈慶周天帝露進璣回頌咸褒聖天帝裒丘繫璫太始至念天帝稟卿徐韋光梵九名天帝實幾鄰應象徐盈天帝蒙符靜康畢堂六輪天帝演巴就剛三十二天三十二帝諸天隱諱諸天隱名天中空洞除病靈章諸天隱韻天中靈音天醫之尊天樂靈神主病靈魔生神之靈九變七轉飛升太清無量之奧深不可詳起癘回年普度天人今日欣慶受度歷關諸天諸滅跛痾斬絶注根飛度六尸命延太玄司命檢録氣隆天門東斗斷傳西斗殺蠱北斗縳鬼南斗療痾中斗大魁五臟之精消除病癘總監衆靈青帝護魂白帝侍魄赤帝養氣黑帝通血黃帝操藥扶廢續絶中主太和萬神無越青方魔王溫癘春行赤方魔王陽毒發煙白方魔王偏廢委跛黑方魔王沈痾歷痤黃方魔王腫痞狐蝕五方大魔行病元凶隨運出入與時迎逢初下昆崘攜駕毒龍統領惡鬼遊觀域中屠害生民誅惡不容上宮符告收攝姦祅真王降世殄滅殃𦍙神池紫雲天馬玉韁電獸吐火巨龜出黃五酋仗旙走馬飛光玄蟒千丈鬼車百箱朱旗橫天雷奔雨滂敢有干試誅斬為當玄鉞前戮赤刃後刑消除病癘人道安寧風火交發跨斗乘星魔無干犯鬼無祅精三官北酆明檢鬼營不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列言上清洞皇玉極龍漢延康眇眇曠寂混沌環剛上無見色下無見淵風空運虛金精凝天天上天下無幽無冥無形無影無極無窮溟涬大梵寥廓無光赤明開圖運度自然元始安鎮敷落五篇赤書玉字八威龍文保制劫運使天長存下比人身大小混淪六腑九臟自然赤文風空天淵九一變分合道無病跛痾不生鬼癘除滅長生神仙絡膜溪谷梵氣彌羅玄府骨竅萬範開張脈如元綱蟠結流行輪轉一體周回九門二十四真總御三關中為天樞前為廣明列布宫室後為至隂隂抱陽交總氣上元八景冥合氣入玄玄玄中太皇上帝髙真泛景太霄吟詠玉章金真啓元流響雲營玉音攝氣靈風聚煙紫虛鬱秀輔翼萬仙千和萬合自然成真穢結解散病癘不行跛步輕奔壞痾蕩擯和合育真真中有神長生大君無英公子洞陽之靈白元尊神靜湛而明太一守房司命振鈴桃康攝邪合延運精執符把籙保濟生根飛升上清遊宴瓊宫碧羅之內混黃之中上騰下降玄華泥丸植立萬毛集鍊百神絳闕龍泉統御要津尸注速滅宿瘕摧消總理五氣混合八瓊十轉回靈易骨變形六周甲子萬氣齊仙仙道貴生無量度人上開八門飛天法輪罪福禁戒宿命因緣普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有空洞謡歌之章真王靈篇辭參髙真第一天醫大神拂魔除病飛空之音熒熒五色維此神丸為世凡夫百病孔艱𡨚憤幽憂日殞殊顔繼緣著境神志不安寒比冰烈熱極火然命等風燈沈冥永歎我施大慈悟爾癃殘絳宫既平照映億千虛明無礙徹地通天玉帝聳觀群仙列言度爾證仙公萬氣常調完病從緣業生魂逝役鬼官徒令爾親徒悲苦垂辛酸不知道無形輪轉生死間見道守虛無飛神玉京山爾時上智慧邪試當無干第二普濟真人勑誡鬼癘之章夔龍蒼甲十丈綱鬚日食萬鬼邪癘元餘瘟毒喪睛幽爽急驅召集都天神吏斬誅按藉考追九獄﨑嶇爾何老氣假形妄謀入人血脈塞彼神廬使氣不行尸鬼為徒夢想所通意感隂靈變其形服干亂黃房爾不自悟坐與物矜名書北酆報對無停何不栖山林思真道自成吾行紫煙中救苦居黃庭第三長生大聖振拔跛痾歌曰千尋碧山萬旗飛火虎丘控弦河鼓拖大神騁雲星流雷過俯視阿人起而復墮邪注骨萎筋癵家禍敗風廢手足賊鬼成曵嚲不知宿業因真心泪流塵貪嗔信癡緣殺命祭鬼神死入玄沙牢億載豈得伸爾當悟道奧妙玄生爾神自然無死生永為上清人逍遙學無為至陽續窮薪此三界之上飛空之中真王歌音音參洞章誦之百遍疾病永消誦之千遍緣習亦除萬遍道成普度一切飛升太空超出三界位登仙公有聞靈音萬魔東形勑制地祇侍衛送迎拔出地戶五苦八難七祖升遷永離鬼官魂度朱陵受鍊更生是謂無量普度無窮有袐上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈仙真除病癘起跛痾明本真元先天不動無有變遷疾病之報皆由業緣展轉結習氣從而化故有呻吟痛楚如是等類鍊神洞虛億劫長久不入流轉體證真人無有生死隱祕之音皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寶祕於神霄真王上宫依元劫三萬八千年應運下傳若有至人齎金寶質心依舊格告盟三天然後而付焉道言夫天地病癘則為震劈陷拆水旱風雹運度否終日月五星病癘則為陵犯薄蝕虧盈至聖神人雖捨病緣無世跛患亦有休否隱顯隨運興衰末學之夫亦有疾傷凡有此災同氣皆當齊心修齋六時行香十遍轉經福德立降消諸不祥無量之文普度無窮道言夫末學道淺或仙品未充病癘所縈跛履痾瘵使真念退悔謂道無靈同學至人為其行香誦經十過以度病癘如法則神氣流行上下升降真性開悟疾恙消解隨其學功計日而得生理壽齡延永便得神仙道言夫天地運終星宿錯度日月失昏四時失度隂陽不調國境有災疾癘四起疫毒流行兆民死傷師友誤履淹衝致身疾痛皆當修齋行香誦經夫齋戒誦經功德甚重上消天災保安邪國下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能為天地一切兆民行是功德有炎之日發心修齋燒香誦經十過疾病跛痾並皆消滅諸天記名萬神侍衛右别至人尅得為聖君金闕之臣諸天記人功過毫分無失天中魔王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君撰元始消除病癘跛痾靈書中篇東方八天聖應魁闡牘嘉慶緣昊赴微露肅格中乾教益彖遷亦太真邈逸珉匪類奏通寶卓意靈氣玄道忱免宣揚裔備法濟生度孱輔天蠁靈廓濡企延鑒賚洞寂夀蘄汭漠南方八天神飈散霞梵極侔幽無沔道夷流淵離疇猛甡投端轉拳莬泉冀瀛䇿思馘靜魔玄九露叱落奚祠精涓含熙傳青比生麗班鴟牙公都樞機總南錠丹焰酢澨婁毛鶼西方八天牝關玉停勾旗慜蒸黃婁緾奎鬼井搖箕鬱亶滌澤首莫那羅合神仙度無阿流刀桓尢稱怛嶔豈俄由罔徹太匠鳥耿爭蚪車盈荼宛洴適岐釋開韓斗師救局魂堂北方八天魚曲玄校女璌蚑斗柏麻初幾正朕室酉幕河鄙虛紇陋根湊坤纓脾籍呼轉丹候月神華玦條飛察周燕泊芒肫狸延畫覺晦並彌混權空咄古泰定長阿為上仙道言此諸天中大梵隱語無量之音舊文以琅華朱光之毫書太極玄定天中紫館北扉之上以氣下臨纒宿星尾之分救諸病癘跛痾報償惡業解除縈纒詛訟𡨚負之氣使知德自施疾癘消滅鳯迹龍紀之書字皆廣長一文東華上相青童道君昔書其文以為正音有知其音能齋而誦之者諸天皆遣飛霄騎吏下觀其身書其功勤上奏諸天萬神朝禮地祗侍門大勳天樞保舉上仙道備剋得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成天真自然之音也故誦之致飛霄下觀上帝遙唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅清河海靜默山嶽吞煙萬靈振伏招集羣仙天無氣穢地無祅麈冥慧洞清大量玄玄也元始無量度人上品妙經卷之四十九

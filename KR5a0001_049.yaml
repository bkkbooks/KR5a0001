body:
  text: 消除病癘跛痾品道言昔於太安天中遥響風歌太和樂土受元始度人消隂病癘跛痾无量妙品元始天尊當說是經周迴十過以召十方始當詣座天翳大神上聖髙尊普濟真人通治童子无鞅數衆乗空而來飛光𥢢霄彤輪華蓋花雲覆蔭明霞舞輝天錦交漫洞映太空五日五夜諸天幽竇嵌巖普皆大明星璣月舘畫夜停輪神風倚煙靈香拂雲天无飄翳六虚洞清一國地土山川林木砥平齊等无復髙下土皆紺碧无有異色衆真侍座元始天尊玄坐空浮五色晶明寳座之上說經一徧諸天大聖同時稱善是時一國男女身報爲病漸獲開爽說經二徧聾者耳聦盲者目明喑者能言說經三徧枯羸沈瘵充澤豐平說經四徧積逮注傳不及于門說經五徧跛痾萎墮皆能起行說經六徧鬼癘消除正氣流通說經七徧老者反壯少者皆强說經八徧軀體病除法身怡悅說經九徧消除病癘跛痾輕安悟病皆妄本非真有返照回光則无痛楚起滅悉從假幻既識道本病從何來說經十徧面流紫華身有玉明魔疾普消神氣合道是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一徧東方无極无量品候氣大神无鞅之衆浮空而至說經二徧南方无極无量品持運大神无鞅之衆浮空而至說經三徧西方无極无量品司年大神无鞅之衆浮空而至說經四徧北方无極无量品定命大神无鞅之衆浮空而至說經五徧東北无極无量品鬼主大神无鞅之衆浮空而至說經六徧東南无極无量品行病大神无鞅之衆浮空而至說經七徧西南无極无量品却癘大神无鞅之衆浮空而至說經八徧西北无極无量品八風大神无鞅之衆浮空而至說經九徧上方无極无量品天醫大神无鞅之衆浮空而至說經十徧下方无極无量品除病大神无鞅之衆浮空而至十徧周竟十方无極天醫普濟大神一時同至一國男女傾心歸仰謂言我等元以福報得生天上非如人間父母精血濁穢之形復有何病是故思惟神氣雖明化生融結而我心想習染尚麄身中妄生疾病痛苦未除譬如世人夢中飲食寒温起居一如平時夢中之身與今處世父母所生實无有異乃至夢身中疾病痛痒悲歡亦復同狀无有殊别故今身中猶當有此病癘跛痾當詣天尊以求除瘥咸各恭敬願禮道前來者有如細雨宻霧无鞅之衆迮國一半土皆偏䧟非可禁止於是元始知如是等衆獲果天人猶有病癘跛痾等相何況世間胎化濕感七十二類无量衆生寧免斯苦我以慈悲說是妙經消除衆患衆患欲除无非法藥法藥之妙莫越神丹即運紫光明如寳焰聚五輪手法自九色離羅萬寳星雲玉錦之帔内出神丸化成寳珠大如黍米在空玄之中去地五丈元始登引天醫大神上聖髙尊普濟真人十方无極除病大神无鞅數衆俱入寳珠之中天人仰看惟見勃勃從珠口中入既入珠口不知所在國人廓散地還平正无復欹陷元始即於寳珠之内說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂无遺響是時天人遇值經法普得濟度全其本年无有中傷傾土歸仰咸行善心不疑不妄不淫不貪不欲不喜不怒不暗不邪不狂言務忠信口无疾聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝内名隱韻之音亦是真王内諱消除病癘起行跛痾百靈救疾攝邪之隱名也非世之常辭上聖已成真人出離五種病癘廣大法身純陽光明能隱能顯顯則普現十方隱則聖真莫測世病法病並已消殞通玄究微能悉其章誦之十過諸天遥唱萬帝設禮内境澄瑩峩山靡平病癘痊復跛痺全寧身嶽不傾日月同明群魔束形鬼精滅爽回生起痼朽質成人至學之士調之十過則五蔵生華膽腦堅真百神守體癘鬼喪睛濟度垂死絶而得生所以爾者學士穢氣未消體未洞真以制十方威未制天政德可漸杜世患甦決沈苦而已不能更生輕誦此章身則被殃供養尊禮病癘消除緩跛健行世世昌熾與善因縁萬災不干神明護門斯經尊妙獨歩玉京度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到病癘衆生痛苦消除跛痾久疾舉用完健邪氣无干百脉受靈一身萬神永不去身身无疾疚自然長生億曾萬祖幽䰟苦爽皆即受度上昇朱宫格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也以經法神護消除病癘跛痾澤惠兆民生類安逸疾痛莫干上帝遐觀報兆真名上學之士修誦是經道備群倫病災拂除癘邪不興跛瘾登舉宿痾更蠲皆即受度上昇朱宫世人受誦困病自安瘕穢泮落靈秀通玄則延壽長年後皆得作尸解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度无窮一切天人莫不受慶无量之福生死蒙惠上天所寳不傳下世至士齎金寳效心盟天而傳輕泄漏慢殃及九祖長役三官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齋誦詠是經消除痼病積歲纒綿世藥不治鬼神異氣遘爲癘病工所不曉或智或癡或生或死傳習先代冢注爲殃鬼氣祟物相呼附著爲上世亡䰟斷地逮役度上南宫七月長齋誦詠是經消除金旺剋水筋落受邪或因土木或因葬刑害之氣注及肢體手足不理跛𤼣不行沈冥宿痾上關天律考在斗宫訟連隂府者使各完固不有傷絶身得神仙諸天書名黄籙白簡削死上生十月長齋誦詠是經徧爲生民消除病癘風傷勞疾痼癉痿瘧寒熱伏留泉𩲲腫汗水注咳逆種種怪病普使和捐致國王帝主君臣父子安鎮國祚保天長存世世不絶常爲人君安鎮其方民稱太平八節之日誦詠是經消解八風邪氣毒病得爲九宮真人本命之日誦詠是經萬疾消蕩鬼癘无侵䰟神澄正萬氣長存不經苦惱身有光明三界侍衛五常司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐緑紫青三色雲氣之中内外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室内天醫尚童砭石小吏咸在前後項生圎象光映十方如此分明宻呪曰无上玄元太上道君召岀臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齋清堂修行至經无量度人願所啓上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始无量度人上品妙經元始洞玄靈寳本章消除病癘跛痾安化度人百魔隱韻離合自然道爲法身太虚生神神寂无形无无上真元始祖劫化生諸天天降地騰隂陽生人人爲貽種病癘因縁考謫跛痾積逮因連採食三景命固天根病癘既蕩神氣爲鄰玄悟成仙舉意飛神上无復祖惟道爲身五文開廓普植神靈无文不光无文不明无文不立无文不成无文不度无文不生是爲大梵天中之天鬱羅蕭臺玉山上京上極无上大羅玉清九品仙聖爲自然人身病法病普得安寧未證大乗病癘所縈鍊身爲氣鍊氣爲神神合太无若亡若存三華離便大有妙庭金闕玉房森羅淨霐大正道氣周回十方中有度人病癘跛痾之神中有南極長生大帝君中有度世司馬大神中有好生韓君丈人中有南上司命司録延壽益筭度厄尊神回骸起死无量度人今日校録諸天臨軒東方无極消除病厄神王長生大聖无量度人南方无極消除邪癘神王長生大聖无量度人西方无極消除偏跛神王長生大聖无量度人北方无極消除纒痾神王長生大聖无量度人東北无極消除世疾神王長生大聖无量度人東南无極消除注氣神王長生大聖无量度人西南无極消除考瘵神王長生大聖无量度人西北无極消除宿報神王長生大聖无量度人上方无極消除見病神王長生大聖无量度人下方无極消除意病神王長生大聖无量度人十方无極消除病癘跛痾神王長生度世无量大神並乗奔雲迅電赤鳳科車營從天仙靈官將吏侍直神司驂駕大獸天鹿夔龍絳節瑶旌瓊干翠羽前嘯呉嘮同嘯後吹筠篥同鳴吟僊飛籟嘯歌噰噰天丁啓途青髻翼轅億乗萬騎浮空而來傾光回駕除痾度生諸天丞相南昌上宮韓司主録監生大神執籙把籍齊到帝前隨所應度嚴校諸天普告三界无極神鄉泉曲之府北都羅酆三官九府十二河源上解尸注冢訟積逮世傳病瘠鬼癘故氣跛𤼣宿業纒痾及以祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼群元始符命時刻升遷北都寒池部衛形䰟制魔保舉度品南宮死䰟受錬仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度三災九厄八難超淩三界逍遥上清上清之天天帝洞淵无色之境梵行東方八天太安順陽天帝景闍玄仁至无化神天帝玉都求輪靜華初元天帝樂真輔仙覺昭情微天帝廣穹良奔序止隂夷天帝部圭士畦落具澄炎天帝斗布紫昆賁亭瀘河天帝除患慈英浪絶妙圃天帝暁因祕巫南方八天碭城寳真天帝仇卑振篁寥居信靈天帝爻霞緫祥辨宗虚攸天帝極真途騫楊寳區天帝輔觀盈璖香泮赤和天帝變丁匪邦亮部求玄天帝古定梵康主延无童天帝空基民宣仙房校藉天帝閱都賢昌西方八天考勝逕靈天帝嶽傳至文咸興遞迎天帝關巴罔欹鬱珠逹想天帝召冥履元屏栖烈廣天帝度命微沖璐真確濟天帝眇仙儔輪預逆游天帝智侈龍液度司夕天帝被曦光旋緑史洞綿天帝道嚴阮通北方八天泝逹紫垣天帝治冥信方曠倚遵宜天帝端究精䐈洞慈慶周天帝露進璣回頌咸褒聖天帝裒丘繫璫太始至念天帝禀卿徐韋光梵九名天帝寔幾鄰應象徐盈天帝蒙符靜康畢堂六輪天帝演巴就剛三十二天三十二帝諸天隱諱諸天隱名天中空洞除病靈章諸天隱韻天中靈音天醫之尊天樂靈神主病靈魔生神之靈九變七轉飛昇太清无量之奥深不可詳起癘回年普度天人今日欣慶受度歷關諸天諸滅跛痾斬絶注根飛度六尸命延太玄司命檢録氣隆天門東斗斷傳西斗殺蠱北斗縳鬼南斗療痾中斗大魁五臟之精消除病癘緫監衆靈青帝護䰟白帝侍魄赤帝養氣黑帝通血黄帝操藥扶廢續絶中主太和萬神无越青方魔王温癘春行赤方魔王陽毒發煙白方魔王偏廢委跛黑方魔王沈痾歷痤黄方魔王腫痞狐蝕五方大魔行病元凶隨運出入與時迎逢初下崐崘𢹂駕毒龍統領惡鬼遊觀域中屠害生民誅惡不容上宮符告收攝姦祅真王降世殄滅殃𦍙神池紫雲天馬玉韁電獸吐火巨龜出黄五酋仗旙走馬飛光玄蟒千丈鬼車百箱朱旗横天雷奔雨滂敢有干試誅斬爲當玄鉞前戮赤刃後刑消除病癘人道安寧風火交發跨斗乗星魔无干犯鬼无祅精三官北酆明檢鬼營不得容隱金馬驛呈普告无窮萬神咸聽三界五帝列言上清洞皇玉極龍漢延康眇眇曠寂混沌環剛上无見色下无見淵風空運虚金精凝天天上天下无幽无冥无形无影无極无窮溟涬大梵寥廓无光赤明開圖運度自然元始安鎮敷落五篇赤書玉字八威龍文保制劫運使天長存下比人身大小混淪六腑九臓自然赤文風空天淵九一變分合道無病跛痾不生鬼癘除滅長生神仙絡膜谿谷梵氣彌羅玄府骨竅萬範開張脉如元綱蟠結流行輪轉一體周回九門二十四真緫御三關中爲天樞前爲廣明列布宫室後爲至隂隂抱陽交緫氣上元八景冥合氣入玄玄玄中太皇上帝髙真泛景太霄吟詠玉章金真啓元流響雲營玉音攝氣靈風聚煙紫虚鬱秀輔翼萬仙千和萬合自然成真穢結解散病癘不行跛歩輕奔壞痾蕩擯和合育真真中有神長生大君无英公子洞陽之靈白元尊神靜湛而明太一守房司命
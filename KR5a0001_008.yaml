front:
  text: 靈寶無量度人上品妙經卷之八天八
  hash: sha256:b19b941fdd5c183367c2b60088c706ea59648cbe7c5ef1918181f1436ee53052
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_008-001a, image: hfl/0002/0002-084.png}
body:
  text: 清微金科品道言昔於妙極天中靈洞霄音泰玄化境受元始度人清微金科無量上品元始天尊當說是經周回十過以召十方始當詣座天真大神上聖髙尊妙行真人清微九聖上元天官衛法仙王無鞅數衆乘空而來玉光緑輿三素飛雲羽葆流輝玄虛散霞丹景浮英晃耀太空七日七夜諸天陽館隂宮金闕瓊樓羅列真文靈風扇霄隱韻生音元綱停運雙曜髙明一國地土山川林木緬平一等無復髙下土皆作碧玉無有異色衆真侍座元始天尊玄坐空浮九色神龍之上說經一遍諸天大聖同時稱善是時一國男女各運精誠願見玄妙說經二遍靈府虛明廓然開悟說經三遍神氣混合坐觀十方說經四遍了悟在心轉能化誘說經五遍未來衆生廣為接引說經六遍證天仙業修上真道說經七遍超出三界為天種民說經八遍得見元尊神靈位號說經九遍注籍清微名上金科說經十遍與聖合真永斷輪轉是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品注生大神無鞅之衆浮空而至說經二遍南方無極無量品執憲大神無鞅之衆浮空而至說經三遍西方無極無量品定名大神無鞅之衆浮空而至說經四遍北方無極無量品司化大神無鞅之衆浮空而至說經五遍東北無極無量品簡奏大神無鞅之衆浮空而至說經六遍東南無極無量品敷教大神無鞅之衆浮空而至說經七遍西南無極無量品權變大神無鞅之衆浮空而至說經八遍西北無極無量品紏察大神無鞅之衆浮空而至說經九遍上方無極元量品監觀大神無鞅之衆浮空而至說經十遍下方無極無量品成德大神無鞅之衆浮空而至十遍周竟十方無極天真大神一時同至一國男女傾心歸仰來者有如細雨密霧無鞅之衆迮國一半土皆偏陷非可禁止於是元始結清微玄妙之氣化一寶珠光如大星在空虛之中去地百丈元始登引金科生真玄變髙尊化氣真人十方無極開導大神無鞅數衆俱入寶珠之中天人仰看惟見勃勃從珠口中入既入珠口不知所在國人廓散地還平正無復𣣱陷元始即於寶珠之內說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度一切群生皆證善緣傾土歸仰咸契虛明妙見妙聞妙覺妙知妙有妙無妙合妙離妙變妙化言符至道心行大慈齊同玄悟清正無為國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆即受度道言元始天尊說經中所言並是諸天化氣帝皇道君隱名聖號十方無極髙真上靈內諱玄章亦是九壘立極生音百魔考試之文非世之常辭上聖刻録金科祕在清微威禁至重鬼官不可得聞玉虛洞玄大極太清四境三十九天神仙真人能悉其章誦之十過聲振圓羅太一監臨保安天地億劫無傾五辰順道日月常明境土安寧永保太平回尸起死白骨成人太空飛仙誦之十過則五老保舉三界稽首大魔伏謁天官上功升入洞真永侍元尊九宮地仙誦之十過元老降庭隨願濟拔大惠含生玉詔司迎上登天宫輕誦此章身則被殃供養尊禮門戶興隆世世昌熾與善因緣萬災不干百靈護身斯經尊妙獨步玉京度人無量為萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到億曽萬祖幽魂苦爽皆即受度上升朱宫格皆九年受化更生得為貴人而好學妙經功滿德就皆得神仙飛升金闕遊宴玉京也上學之士修誦是經金科注名萬善咸臻皆即受度飛升南宮世人受誦則靈官降身延夀長年後皆得證飛仙之道玄功外應神氣內充形神俱妙遊行太空此經微妙普度無窮一切天人莫不受慶生死䝉惠上天所寶不傳下世至士齎金寶效心盟天而傅輕泄漏慢殃及九祖長役鬼官侍經太丹玉童青腰玉女各四十二人營衛神文保護受經者身道言正月長齊誦詠是經開導重泉光照九幽為上世亡魂斷地逮役度上南宫七月長齊誦詠是經奏簡清微名上金科身得神仙諸天書功黃籙白簡削死上生十月長齊誦詠是經三元曜明功歸帝君為國主人王君臣父子安鎮國祚保天長存世世不絶常為人君安鎮其方民稱太平八節之日誦詠是經天仙奉迎得為九宫真人本命之日誦詠是經魂神澄正萬氣合仙不經苦惱形運升遷暉映八冥五帝臨軒萬神朝禮名書上天功滿德就飛升太玄道言行道之日皆當香湯沐浴齊戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黃白三色雲氣之中內外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室內項生圓象光映十方如此分明密呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齊清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引氣三十二過東向誦經元始無量度人上品妙經元始洞玄靈寶本章清微金科上品符應度人天真隱諱結氣自然混合玄文中藏至精虛皇開劫生育諸天洞光廓落三氣飛騰包含大象植立天根青編金簡普録神靈恢張正道赫奕冥冥雙元飛景五氣流形洞明變化群類生成是為沖妙萬道之宗太微陽華紫霄瓊宫上通大羅虛梵髙空三真杳漠無極無窮赤混太無玉境居尊應見十方無量化身敷教清微注籍金科中有諸天萬帝之名中有玉皇正行遊梵之帝中有山川海嶽之形中有群魔考試之文中有三天洞真洞玄洞神開天立極大憲飛輪我今宣示普召百靈三元同會諸天臨軒東方無極注生神王長生大聖無量度人南方無極執憲神王長生大聖無量度人西方無極定名神王長生大聖無量度人北方無極司化神王長生大聖無量度人東北無極簡奏神王長生大聖無量度人東南無極敷教神王長生大聖無量度人西南無極權變神王長生大聖無量度人西北無極紏察神王長生大聖無量度人上方無極監觀神王長生大聖無量度人下方無極成德神王長生大聖無量度人十方主録金科神王飛天度世無量大神並乘騰耀瓊輿景霄華輦三素飛雲驂駕天馬斑獸耀晶蒼龍建鳳真之節流光大幡左備九天羽衛右羅三界神兵太一帝元統制萬靈赤皇導前玄老監盟億乘萬騎浮空而來傾光回駕召仙集真清微帝氣大洞玄宫九華佐理混合大神總執金科列班奉迎簡閲符命仙聖隱名普告三境無極髙尊太霄玉闕劫仞瓊峯紫微北府三十九君七轉七變回水儛天玄微結璘下統羅酆曲晨飛蓋同會東河光啓扇飊運轉天關斗極中方以正崑山開演至妙降氣玄丹經緯天地保鎮度人生成化育與我合仙五神清朗億劫無傾永度諸天學道之民刻書金簡名奏紫宸紫宸之天天帝耀光無色之境梵行東方八天琅丘會元天帝澤力居英沖構集真天帝化夕祺分霄林景暉天帝庭鬱嶽君洞宗慶先天帝領斗監明格梵飛靈天帝貫合部延大方制魔天帝肇肅志廖瓊文越章天帝濛總羅宇練洞陽天帝領都隂平南方八天定名感真天帝洞泛景房玄空耀虛天帝落寶監章炎靈奉符天帝閣鄰古山玉書赤文天帝臻化定丹光啓明天帝扇揮音景運紫華天帝龍濵劫方極無洞皇天帝封正延靈皇範總生天帝貟監利宣西方八天曇曜召魔天帝洞皇九雲洞寂存明叩沖天帝宣世瓊紫清太漠洞極天帝令唱六宗玉陽妙真天帝交舒化神回風變合天帝道滋元流暉曜章天帝律定瑶華照元簡氣天帝梁瓊伯阿融結正綱天帝運皇極明北方八天化氣升元天帝眇利持淵八垣儛空天帝至冲猷生飛神降真天帝微融妙玄太素干精天帝蔚京玉童碧華濟玄天帝𡨕敷尚登三虛極道天帝臨懷敏皇太英降房玉史夭帝陳常律賔太清正宗天帝梵行緘觀三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻天中之音天中之尊天中之神天中大魔天中之靈四玄七虛包含至真金科大格結氣為文敷化玉清普度天人今日欣慶回風受鍊嚴誓百神刻名文昌列告玄機飛度太素合景清微真仙考校萬化同蹄東斗授符西斗司直北斗上功南斗定籍中斗合延正天無極青帝舉仙白帝驅役赤帝攝氣黑帝典録黃帝制魔統御化育青元道君持握龍蹻丹光道君執法明曜少隂道君召山開導鬱微道君運斡玄妙中黃道君敷令布勑五方上靈至道之元飛行三界總領群仙變化無窮遊觀萬天生成品彚執我威權上真化民混合綿綿紫皇奉命收伏祅姦陽光激電照徹酆山清正綱輪明啓元關六天沉魂受鍊洞陽神洲大域永保嘉祥休停惡對咸證善緣茫茫萬有皆獲長年神飛太無濯氣三華景暉被身灌鍊天河三元上佐明校百魔敢有干犯定罪懸沙普告衆靈同會圓羅升階進秩功列金科清微金科首題三十六字餘列本科右三天道君玉號隱名告四九之數玉清髙玄自然之文朱書青素佩身萬邪莫干灰服治病行之者名書金科洞元豁落升降圓方茫茫大化周歷龍康上開一氣下布隂陽包絡諸天風梵堅剛玄變流精太素冥冥虛明曠邈無極無形鴻濛元象三道化成八坦清微數極自然玉京開衍金科上篇黃簡碧書八景玄文刻録神名與道長存混洞騰飛布天彌綸萬景回旋雙曜五辰統御元綱冥合靈根皇老大洞三十九章帝一分元安鎮萬方飛天妙書過度丹光丹光化生九天上靈駕景紫虛御氣玄音緑霞散空布彩騫林三華舞煙回秀流雲扇霄鬱羅明耀長庚千和萬合自然成真真中有神元素道君方諸仙童青華帝尊太乙合景司命回風執簡持科録注元功上遊玉清劫仭瓊宫太微之內天界之中下極重淵黃闕玄宫回首九壘三十六皇五鎮大域仙島十洲洞天福地無極名山八海四瀆主宰神靈三元官長無量飛仙咸錫真符功書帝宸列班定籍上聞三天三天之上慶會因緣中有清微金科之章聖境仙音辭參髙真第一諸天化氣清微之音眇眇大羅上帝氣降清微真光耀玉京攝御正化機茫茫歷龍康飛度敗與成三界化空無大地淪九淵元始憫群類玉章下五山二景騰輝光元綱羅萬靈洞真祕玉文靈寶立天根洞神主玄變萬品從此生諸方命天帝總校長生人剛風擎地紐天憲歸皇君生靈荷大庇億劫永無傾第二金科定籍之章鳳車舞空輪停駕鬱山阿劫仭立大空須延啓三華元聖閲章籍空中召靈魔太清難可度輪轉如塵沙憫此去來際飛仙運謡歌蕩蕩龍漢基玄嶽髙嵯峨萬靈會帝所東井貫天河濁境逐業緣沉淪將奈何誦此清微篇正氣蕩邪痾三界諸天民齊奔濯耀羅願爾道果成刻名上金科永契長生理億齡焉足多第三聖境真仙歌曰圓羅包玉虛髙峙大有宮騫林覆諸天九聖步靈風宴景挹華明逍遙太無中下遊洞玄境控御飛天龍三十九道君朝禮虛皇尊大慈振法音聖澤常濛濛勑印啓天關敷落三景文玉詔下酆都拔度長夜魂鬼官停考對陽光燭九冥三塗息苦役八道運飛輪群品保長年世土永安寧此三界之上飛空之中真仙歌音音參洞章誦之百遍名度南宮誦之千遍魔王保迎萬遍道備飛升太空過度三界位登仙公有聞真音靈魔敬形勑制地祇侍衛送迎拔出地戶五苦八難七祖升遷永離鬼官魂度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈真王隱祕之音皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寶祕於玄都神霄玉清玉府依玄科三萬七千年應運下傳若有至人齎金寶質心依舊格告盟玉清然後而付焉道言夫天地運度亦有否終日月五星亦有虧盈至聖神人亦有休否末學之夫亦有疾傷凡有此災同氣皆當齊心修齊六時行香十遍轉經三氣合神萬災普消天地清寧降氣玄真金科玉律伏御鬼神無量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太隂臨過之時同學至人為其行香誦經十過以度尸形如法不壞不傷形體堅完魂神徑上南宫隨其學功計日而得更生轉輪不滅便得神仙道言夫天地運終大劫流移星宿錯度日月失明四時失度隂陽不調國境歲飢水旱時出疫毒流行師友命過皆當修齊行香誦經存思清微金科降陽華之氣太微之神掃除災氛夫齊戒誦經功德甚重上消天災保鎮帝王下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能為天地帝主兆民行是功德有災之日發心修齊燒香誦經十過皆諸天記名萬神侍衛右别至人剋得為聖君金闕之臣諸天記人功過毫分無失天中真王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君撰元始靈書清微金科玉篇東方八天飛天羅會浮化漫更居元梨久廓落司南冥陽御直局荷湄金加虛沃至遷書獨分玉極待貫貢遷正輪幾果得都清羅文雲宜今嚮淺才敵靈元波華風停氣上呼年南方八天山延洞明玄論康逋曜略景空斗綿揮珠山棘契録明旋應符丹宅洞焰奎琳指琚韜眩資猗瓊府投虛何竹生育靈庭柏書宏朴義華玄阿宫都緑桓絳天紫霄正浮西方八天畔師霧攜建晉契輔太紫述羅逍遙薦素陽唐記方回曲才至允悟昊滿帝宜卷未耿液交蕩利呪唯戶稽門實奔鄙廣憫度照燭離幽意篆宜慕光幾允和登豫琪鞅北方八天元簡長光鼓奚律前監索敷鄰武明義先北印極召龍帝炎煙神邈迪烏諸因思般妙玄六周絶馳酆丹孺常慈申誠虛府間竇策勤佐寫袪秉研詔系始育靈題書編道言此諸天中大梵隱語無量之音舊文字刻書金闕玉樓華房之內以制和三氣安保萬靈字皆廣長一丈天真皇人昔書其文以為正音有知其音能齊而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳魔王保舉三玄道備剋得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成天真自然之音也故誦之致神王下觀上帝遙唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響十方肅清河海靜默山嶽吞煙萬靈振伏招集群仙天無氛穢地無祅塵冥慧洞清大量玄玄也元始無量度人上品妙經卷之八

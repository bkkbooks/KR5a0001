front:
  text: 靈寶無量度人上品妙經卷之二十五玄五
  hash: sha256:d4a239f70b0d32fce394f302143e71c076c3233562597686b5d230fd32333d78
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_025-001a, image: hfl/0005/0005-156.png}
body:
  text: 赤符丹光品道言昔於絳霄天中丹景清真天玄明土受元始度人赤符丹光無量上品元始天尊當說是經周回十過以召十方始當詣座天真大神赤靈丈人三氣天君丹光九仙上聖髙尊妙行真人無鞅數衆乘空而來玉緯飛輪羽葆交䕃太霄騰晶八素流光璇極珠𨇠煥赫元綱五日五夜三清四境無量諸天上極大羅下通黃闕各現赤混開劫飛霄寶符丹霞光散照映八門一國地土山川林木緬平一等無復髙下土皆作紋玉凝輝瑩徹無有異色衆真環侍元始天尊停駕空浮九龍陽燧神金萬變法輅之上說經一遍諸天大聖同時稱善是時一國男女仰聽聖教默悟重玄說經二遍天光內發照朗昏冥說經三遍神氣合混萬景生津說經四遍虛明曠達觀見十方說經五遍赤符丹光現於身中說經六遍生道交會疾癘蠲消說經七遍北酆暗域報對休停說經八遍金簡書功玉符定籍三官告命形化飛仙說經九遍法露珠英潤澤一切說經十遍十方三界無極幽關無量群生逍遙離苦是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品寶生大神無鞅之衆浮空而至說經二遍南方無極無量品洞浮大神無鞅之衆浮空而至說經三遍西方無極無量品耀明大神無鞅之衆浮空而至說經四遍北方無極無量品太一大神無鞅之衆浮空而至說經五遍東北無極無量品保安大神無鞅之衆浮空而至說經六遍東南無極無量品持化大神無鞅之衆浮空而至說經七遍西南無極無量品玉靈大神無鞅之衆浮空而至說經八遍西北無極無量品飛霞大神無鞅之衆浮空而至說經九遍上方無極無量品大變大神無鞅之衆浮空而至說經十遍下方無極無量品沖厚大神無鞅之衆浮空而至十遍周竟十方赤符丹光大神一時同至一國男女傾心歸仰皆見赤文大字遍滿虛廓丹光洞照十方同明內見自己身中心通萬道外與法合即名赤符見察萬殊異體同照即名丹光內外之道皆是元始外生天地內化一身皆同此道自非列聖開教不能化成譬如混沌初造終始九劫若非赤明不能開圖一身始生毛髮肢節九竅雖具若非神光外見心光內通一切聖賢不能成就是故我等咸悟元始所說大法役運神變開導天人來者有如細雨密霧無鞅之衆迮國一半土皆偏陷非可禁止於是元始懸一寶珠大如黍米在空玄之中去地五丈元始登引天真大神上聖髙尊妙行真人十方無極赤符丹光至真大神無鞅數衆俱入寶珠之中天人仰看惟見勃勃從珠口中入既入珠口不知所在國人廓散地還平正無復欹陷元始即於寶珠之內說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸行道心洞見洞識洞妙洞知洞悟洞徹洞照洞微洞明洞鍳言符至理默契玄機齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是真王內諱百靈之隱名也開示大法造立天地內生人物外成混沌赤符應合丹光纒綿元氣烹煎真火化鍊以成三界匠立萬天爾能體之自然得道非世之常辭上聖已成真人通玄究微能悉其章誦之十過諸天遙唱萬帝設禮河海靜默山嶽藏雲絳煙布逸霄光亘玄心符內充丹寶外應群魔束形鬼精滅爽回尸起死白骨成人至學之士誦之十過則五帝侍衛三界稽首紫輝遐映神晶注盈妙開元造神泊其間魔精喪眼鬼祅滅爽濟度埀死絶而得生所以爾者學士穢氣未消赤符隂隱丹光內濳體未洞真以制十方威未制天政德可伏御地祇束縳魔靈但却死而已不能更生輕誦此章身則被殃供養尊禮門戶興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉亰度人無量為萬道之宗巍巍大範德難可勝道言凡誦是經十遇諸天齊到赤符度生丹光啓幽億曽萬祖幽魂苦爽皆即受度上升朱宮格皆九年受化更生得為貴人而好學至經功滿德就皆得神仙飛升金闕遊宴玉亰也上學之士修誦是經神契赤符道融丹光皆即受度飛升南宫世人受誦則延壽長年丹赤之華注澤尸腐骨剛氣真後皆得作尸解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齊誦詠是經赤符召和丹光運明三元錫契萬象蒙生為上世亡魂斷地逮役度上南宫七月長齊誦詠是經赤符召隂丹光育精四明奏功五老奉經身得神仙諸天書名黃籙白簡削死上生十月長齊誦詠是經赤符召陽丹光用章九宫合氣玉女𧵥漿為國王帝主君臣父子安鎮國祚保天長存世世不絶常為人君安鎮其方民稱太平八節之日誦詠是經赤符周建丹光流行八景合體六司命真得為九宫真人本命之日誦詠是經赤符召神丹光繞身魂神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齊戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黃白三色雲氣之中內外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室內項生圓象光映十方如此分明密呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齊清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引氣三十二過東向誦經元始無量度人上品妙經元始洞玄靈寶本章赤符丹光上品妙首明識度人龍康廣運開化因緣大洞隱章虛含至真太無三一流結諸天碧落敷明髙峙天根大經離合萬境分神赤符帝氣丹光上靈恢張玄範洪歷冥冥六風交煥空象告成玉文肇啓天道流行是為元造蒼混飛煙太霄鬱單玄丘景仙茫茫正化皇極推遷瓊羅騫仞至妙靈圓三周九復包絡綿綿億天群品歸真玉垣正行遊梵過度生關中有赤明校録之神中有玉符攝氣之真中有大丹流熖之君中有炎光開化丈人中有太一入纒黃庭鳯紐混合大洞髙尊統御玄變清都化身金篇消魔廣大飛輪三十九帝廓開八門今日敷教萬真臨軒東方元極寶生神王長生大聖無量度人南方無極洞浮神王長生大聖無量度人西方無極耀明神王長生大聖無量度人北方元極太一神王長生大聖無量度人東北無極保安神王長生大聖無量度人東南無極持化神王長生大聖無量度人西南無極玉靈神王長生大聖無量度人西北無極飛霞神王長生大聖無量度人上方無極大變神王長生大聖元量度人下方無極沖厚神王長生大聖無量度人十方赤符丹光神王至真度世飛天大神並乘三華絳霄流雲鳳輿瓊輦天蓋地輪驂駕朱光玉角神獸蒼鱗火鬛蛟龍建招真之節告靈大旙前列玉虛寶仗後從三元化兵洞神九仙飛空步虛四帥啓塗三師告盟億乘萬騎浮空而來傾光回駕監真度生赤符經天三界同生丹光六飛萬物洪施心知目見神動意隨天人仰法至化同歸大象流布洞虛極玄方諸符召超登九天九天上宰元黃左宫流雲司命保世大神執籙持符同會帝庭隨所應度天化浮沉普告三界八極雲營昆輪瑶闕廣野寒扃五方玄嶽四極真公九元大憲化見玉文疾除故氣清正生根不得拘留上合仙真赤符丹光時刻飛升北都六洞普赦幽魂制魔保舉度品朱陵死魂受鍊仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度風刀水火之難超凌三界逍遙上清上清之天天帝朱明無色之境梵行東方八天靜都勤明天帝妙𢖍具傍昌郊九華天帝𡖖靈尹登符應智靈天帝曉虛妙常灼變丹神天帝遘氣圖生蒼亰寶風天帝化招境形聖基密照天帝鑒真定微運晶遂方移想天帝縳奔囊孤高虛赤符惠生天帝井虛歷維南方八天陽光化生天帝景中惟寧九宫明耀天帝閟淵求方丹霄注靈天帝赫爰胥延曲晨紫真天帝護斗召仙太微瑞靈應精天帝直波夷倫光慧洞無天帝剛過擇躬寂意思玄天帝保玉令修洞玄摧魔拱雲天帝飛圓曜隨西方八天瑶府定民天帝按涂知元寒庭對兵天帝戒無象虛司覆開世天帝慈流升真功定籍天帝問初顯非太上素晨禁綱天帝樞牢勝當內池誕華優陽天帝耨達用義簡微求祖知變天帝洞仙常師主録度仙超化天帝山英謝方北方八天梵樂録魔天帝變龍擲旌垂慈飛真無想天帝志明淵符玄明左期靜光天帝甫昭叢希五氣交符鍊神天帝優頻景珠張育行真天帝納生辨殊龍桑命仙天帝屈空冥神朱明合氣天帝極監盟真靈綱正氣總隂天帝主羅察冥三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻天中之音天中之尊天中之神天中大魔天中之靈九竒十耦和合自成赤符丹光變化上清無量之奧深不可詳敷落神真普度天人今日欣慶受度大化開生感變幽關大會神靈請滅三惡斬絶地根斷胞閉死名列太玄真王監舉無拘天門東斗執契西斗召仙北斗奏簡南斗列言中斗坐鎮運轉元關帝魁玉籙洞鑒冥無天真玄一五斗之符下元化氣太劫丹書青帝施令白帝禦敵赤帝正憲黑帝建立黃帝中主變化無極惟符所指隂陽乃宣吉凶示象善惡相連青天魔王皛晶鬱羅赤天魔王明耀絳霞白天魔王金真保華黑天魔王鼓化玄波黃天魔王安鎮崇阿五天大魔萬神之宗飛行鼓從總領天兵持幢仗節遊觀太冥自號赫奕諸天齊功上天度人嚴攝北酆真王受命普掃不祥三元降詔大憲恢張飛符攝御清蕩十方定界無邊風火八衝敢有抗拒糾送酆宮元真振劒天曜施刑屠戮邪魅收捕無停千千斬馘萬萬滅形魔無干試鬼無祅精太隂北都按察鬼營不得怠縱飛章奏罡普告三官正道流行考功定籍書名紫清玄曜大劫寶曆龍康洪運周流纒結隂陽一氣交絡開隆上皇飛生玉音廣布十方丹華升降輪轉剛風眇眇億氣赤混玄宫上周圓曜下變重淵風動八冥洪極成天赤符化鍊丹光發煙天上天下輝朗幽冥肇形虛象廣大無窮鴻濛溟涬豁落舒光太真啓圖運度自然朱陵敷演徊風上篇碧簡金章玉籙瑶編保安天地永劫綿綿梵氣彌羅萬範開張丹光成立三境諸天輪轉昆丘包羅億千元老下教普度群仙三天三地灌氣三垣八景玉羅氣入髙玄玄中至真丹霄上𡖖佩天瓊文校録稱尊合景飛霞執詠洞經金華流彩普攝雲營玉章大誥鳳簡龍書徊天隱道接閲元圖千和萬合自然成真真中有神東華天君方諸帝一太素千精玄光保命混洞延生赤符丹籙永鎮玄根上遊清微出入洞虛巍巍天闕列聖之居下降種民升舉清都中理太極混合空無十轉回靈萬景同升仙道貴生無量度人上開八門經天法輪罪福禁戒宿命因緣普受鍊度死魂生身身得受生上聞諸天諸天之上各有生門中有混天開劫之章仙聖靈篇辭參髙真第一混極飛仙赤符之音太虛元始生成天地空極杳冥肇于一氣廣大無邊化生真帝上居玉亰三界統制威錫威靈不問巨細周流合變成此大器赤書敷落靈仙交會五山安鎮玄嶽髙峙昆丘閬風黃老為治虛皇憫衆生開演玄妙義洞章攝魔群億天蒙大庇第二玄變真君丹光之章嚴嚴大有宮萬靈朝上皇三氣包太虛飛霞結元綱上開廣瓊室下布流景房三垣懸帝座赤文羅五方內陳玉極真保此大經帝空生纒地紐冥冥度龍康真王馭天馬寶闕舒丹光天運啓玄圖玉道發嘉祥元君乘化氣神變不可量俯觀三界民欲海徒茫茫披誦洞玄篇超升太福堂第三赤符丹光真王歌曰岧岧金闕下臨太清碧霞鬱合化此金城巍巍虛象飛臺玉亰九龍大劫生育神靈妙氣交合變化天根赤文列聖丹光上真三十九帝與道同生持握天憲空洞皇君校鍊飛天驂駕龍驎周遊三界正道開明威光下濟照徹重昏清蕩北酆普赦幽魂萬類逍遙十方蒙恩此三界之上飛空之中真王歌音音參洞章誦之百遍名度南宫誦之千遍真王保迎萬遍道備飛升太空過度三界位登仙公有聞靈普魔王敬形敕制地祇侍衛送迎拔出地戶五苦八難七祖升遷永離鬼官魂度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈真王隱祕之音皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寶祕於神霄玉府東藏經室依科三萬七千年應運下傳若有至人齎金寶質心依舊格告盟真王然後而付焉道言夫赤符道逆丹光內隱則二儀失序五行數睽故天地運度否終日月五星虧盈至聖神人休否末學之夫疾傷凡有此災同氣皆當齊心修齎六時行香十遍轉經福德立降消諸不祥無量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太隂臨過之時同學至人為其行香誦經十過以度尸形如法則赤符照心丹光還形不與物化神凝氣清魂神徑上南宮隨其學功計日而得更生轉輪不惑便得神仙道言夫天地運終星宿錯度日月失輝四時失度隂陽不調國土有災兵革四興疫毒流行兆民死傷師友命過良善橫殃皆當修齊行香誦經夫齊戒誦經功德甚重上消天災保鎮帝王下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能為天地帝主兆民行是功德有災之日發心修齊燒香誦經十過皆諸天記名萬神侍衛右别至人克得為聖君金闕之臣諸天記人功過亳分無失天中真王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君撰元始靈書赤符丹光玉篇東方八天弗黎竟桑徯邅輔璫庚福奠神揚騎時房兖枚郁澮周勤氏梁越贊傳野畢容治光按披曜師維誓鄞康靜學原蔽密都朱堂參據角首穹竒僖章絡昔魔靈粲秀東疆南方八天赤符三氣火山炎精照煥濳蟄幽離浮瓊定顯妙樞紀錫幾冥善旅逸修豫盈司奔嶽迭命召魂林繁騰無鐸演廬盤河哲承綿度令髙慈尤并艱肆除獻寧太霞資明西方八天碧巒濟佑浮空景涯神策飛籙早馳玄華奎芒皇俅祿員禹瑶遵善既邈閉延投嵬良茲印宙玉微化伸昊素格略利淵開仁掌紀緣釋湊智遠亰抱月緑霞詠此至音北方八天衡圍太始芒露激虛句陀支云桓倣箕無正鄰投黃聚沖攸靈欲蘇踐荒祥實觀真鬼由牢察玄尸杳丁沖煕日囿評霞嶽䖍氣膺逃宏沼領綿謨雕梗雲昆總靜遘泉道言此諸天中大梵隱語無量之音舊文刻書絳臺瓊華妙靈玉妃丹墉廣闕之上字皆廣長一丈天真皇人昔書其文以為正音有知其音能齊而誦之者諸天皆遣赤符丹光神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大功魔王保舉上真道備克得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成天真自然之音也故誦之致赤符告靈一呼萬應丹光回照百理千通密授紫書上為真宰神王下觀上帝遙唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響十方肅清河海靜默山嶽吞煙萬靈振伏招集群仙天無氛穢地無祅麈冥慧洞清大量玄玄也元始無量度人上品妙經卷之二十五

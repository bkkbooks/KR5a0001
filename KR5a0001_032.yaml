front:
  text: 靈寶無量度人上品妙經卷之三十二黃二
  hash: sha256:1ebd482326b3ba2383b1e8dd74411fe62ce434b0fc97dc18aee721445b676a79
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_032-001a, image: hfl/0007/0007-052.png}
body:
  text: 五行順治品道言昔於玉虛大明天中九華寶光神瑞慶土受元始度人五行順治妙品元始天尊當說是經周廽十過以召十方始當詣座天真大神上聖髙尊妙行真人上清五星真君無鞅數衆乘空而來五色重光景雲四繞紅瓊之軿紫琳之輅金輪轉轂日駕浮空羽箑連霞金真警衛流虹交映玉馬騰煙照徹碧虛三日三夜七宸啓靈五斗順位璣𢖍停運山嶽玄鎮天道開明華林薈彩長樓列觀接引凌風金闕瑶亰無復髙下地敷寶砌色吐瓊綿衆真侍座元始天尊玄坐五雲浮黎冰玉金映萬寶之座與中天紫垣蒼華生德萬壽道君丹華陽德萬福道君皓華正德萬善道君玄華一德萬生道君大華聖德萬順道君五方真元道君元始開圖之後五氣乃分道祖攸同氣母禀異將宣五行順治生化三界慈育萬彚之道說經一遍諸天大聖同時稱善是時一國男女宣行順教無有尅傷說經二遍四氣和平時不失度說經三遍沖用太和景物長春說經四遍騰氣均行人無衰薾說經五遍隂陽調運疾病不生說經六遍羣生遂性萬字咸寧說經七遍五星合明珠躔周軌說經八遍甘露浮空靈芝鬱秀說經九遍天光下濟泉曲開明說經十遍國被道化率土歸賔是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品蒼華九氣至真大聖無鞅之衆浮空而至說經二遍南方無極無量品丹華三氣至真大聖無鞅之衆浮空而至說經三遍西方無極無量品皓華七氣至真大聖無鞅之衆浮空而至說經四遍北方無極無量品玄華五氣至真大聖無鞅之衆浮空而至說經五遍東北無極無量品素華梵氣至真大聖無鞅之衆浮空而至說經六遍東南無極無量品碧華梵氣至真大聖無鞅之衆浮空而至說經七遍西南無極無量品大華梵氣至真大聖無鞅之衆浮空而至說經八遍西北無極無量品寶華梵氣至真大聖無鞅之衆浮空而至說經九遍上方無極無量品紫華一氣至真大聖無鞅之衆浮空而至說經十遍下方無極無量品黃華一十二氣至真大聖無鞅之衆浮空而至十遍周竟十方無極至真大聖一時同至一國男女傾心歸仰來者侍側圍繞咸欲欣聞元始天尊召集五元道君敷演五行順治長生之法物無夭傷永絶刑禍普天稱慶劫劫隆平於是元始變身示現天座髙遠大如蕭臺翠光層劫以億為仞元始聖體巍巍瑩如寶山十方華林同蔭若蓋金色洞耀遍照無極元始登引天真大神上聖髙尊妙行真人五元道君十方無極至真大聖無鞅數衆俱升玄座天人仰看一一天真住一天界瓊欄藻井金闕琅軒無不備足說法之聲億衆如一心心相通法音無問同時說法無有違逆比之流泉傾瀉妙意一切衆生各各了知金木水火土五行之氣自相順治本無刑尅雖有勝復鬱拂之變斟酌天倪以生和氣五行混同升降合德五氣調平三界泰定及於人物一切生身三元搆精五行結秀順治不逆沖德滋神虛含道真凝如珠玉大若彈丸光華鮮灼太空有象是時天人一切衆生以順治故斷絶死道諸惡不生大業宿𡨚一時頓息地獄衆苦猛火洋銅變成青蓮九幽北都為安樂國以五行順治則萬物化生三界靈仙一切種民悉無罪越諸天遙唱萬神設禮一國之境如懸冰玉及似寶珠表裹明徹略無浮翳以及纎塵元始即於玄座所現之境說經都竟衆真監度以授於我當此之時喜慶難言諸天復位倏欻之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸行順心順道順德順善順法順真順明順生順神順化言無悖異口無惡聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名玄道順福五行不尅全物之隱音亦是五元道君內諱混交五氣之隱名也非世之常辭上聖已成真人通玄究微能悉其章誦之十過諸天順度萬物生榮天潢隨流氣無鬱藹山安海鎮六天運明三辰駐照九道齊并羣魔鬼精歸道成人白骨尸骼順治更生至學之士誦之十過則五行聚精三田結嬰人無中傷壽與天登所以爾者學士誦詠是經召命五星順應和樂六腑安寧穢氣消亡心感洞真以制十方法施天靈天人皈依灾害不生可伏御地祇束縳魔靈却死留形輕誦此章身則被殃供養尊禮門戶興隆世也昌熾與善因緣萬灾不干神明護門斯經尊妙獨步玉京度人無量為萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到五星真君五方大神悉降其所三辰在人身命或凌犯勃蝕伏逆為灾使世生民運為不遂理務乖違宜齊戒誦經五星合度五行順治灾害消弭億曽萬祖幽魂苦爽皆即受度上升朱宮格皆九年受化更生得為貴人而好學至經功滿德就皆得神仙飛升金闕遊宴玉京也上學之士修誦是經五星旋行回而不轉三宮填滿自然得真皆即受度飛升南宮世人受誦則天輪順次一十二宮不相違錯運過限臨氣超候接周遍宛協身無殃咎真氣內結邪癘不干延壽長年後皆得作尸解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齊誦詠是經五行順治春氣遂生萬物秀成胎卵化濕就形無隕自然通神上世亡魂斷地逮役座上南宮七月長齊誦詠是經五行順治秋氣遂成萬類堅革就養燕寧金真入骨身得神仙諸天書名黃籙白簡削死上生十月長齊誦詠是經五行順治冬氣剛凝萬物歸根陽氣潜形太一復位帝主道興五星聚中聖德日新四海澄波六氣和平臣民康樂億載太平壽等天地日月無傾兵消疫散時清德盈為國王帝主君臣父子安鎮國祚保天長存世世不絶常為人君安鎮其方民稱太平八節之日誦詠是經五行順治十方齊營真氣周流時化自然所作皆成內功克備得為九宫真人本命之日誦詠是經五行順治灾害不經三刑六害劫耗傷驚星光映身仙道自生魂神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齊戒入室東向叩齒三十二通上聞三十二夭心拜三十二過閉目靜思身坐青黃白三色雲氣之中內外蓊冥五星在頭光氣纏繞青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室內項生圓象光映十方如此分明密祝曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齊清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引氣三十二過東向誦經元始無量度人上品妙經元始洞玄靈寶本章五行順治真化度人百魔隱韻離合自然大無元冥杳寂無真空極生神真氣神存兩半同升隂陽始分黑白二物為天之尊中黃為土四氣潜形赤明開圖乃有五星熒熒列位道之淵靈太空真土鎮德自名鎮之父母甲己為源絪緼相求土形乃生乙庚合氣土乃孕金金德神武承天之根金液化水丙君辛臣水性潤下金土感化句芒吐緑青芽起雲雲回上清癸魄戊魂日月含育赤精揚煙煙息體合氣歸返真神化無門無門為空空為土公九還七返至道之崇是曰五行順治而通陽順則福隂逆為凶順治五行惟帝之亨萬天凝粹浩劫乂寧五行尅伏鬱拂差勝自非通神不知至聖土為中主五劫氣彊木來尅之非謂勝制欲其順昌木極金犯金勝火流火炎水濟凡此皆為尅伏世之鄙愚不悟天道貴其中順惟其平調為帝之德順治無偏玄之又玄至寶順生礫石匝成瓊臺玉闕金樓碧城鬱羅䔥臺玉山上亰上極無上大羅玉清若亡若存隨意而營浩浩梵氣瀰漫無形中有大帝三清之君中有九老仙都之真中有黃元九素大神中有白元皓空之君中有太玄五靈洞微之神中有青華九仙丈人中有赤書紫文之君中有太皇萬福順治元化延壽度厄尊神今日校録諸天臨軒東方無極青帝木真神王長生大聖無量度人南方無極赤帝火真神王長生大聖無量度人西方無極白帝金真神王長生大聖無量度人北方無極黑帝水真神王長生大聖無量度人東北無極大帝玄女神王長生大聖無量度人東南無極大帝赤子神王長生大聖無量度人西南無極黃帝土真神王長生大聖無量度人西北無極大帝天姥神王長生大聖無量度人上方無極真帝玄父神王長生大聖無量度人下方無極元帝道母神王長生大聖無量度人十方至真飛天神王長生度世無量大神並乘紫霞流精之輦太微金明五真混變無極之駕素麟丹鳳青鸞黃獸萬福之騎天仙扈從七億萬人執持雙珠月明白羽玄干冠帶九氣三辰之華九歌陽音八素隂唱嘯歌噰噰五老啓途羣仙翼轅億乘萬騎浮空而來傾光廽駕順治化生諸天丞相南昌上宮韓司主録監生大神五帝司馬感生元君執籙把籍齊到帝前隨所應度循運諸天却逆除暴調元五精水火不尅萬物悉全天人鬼神順道變仙順為臣子忠孝德先忠感玉帝孝徹太玄隂陽和等三官列言人神感恱品彚駢繁下極幽都北山河源冥類苦爽時刻升遷以順得生仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度三塗五苦八難超凌三界逍遙上清上清之天天帝玉真無色之境梵行東方八天運智正除天帝玉覺覩月洞霞寂夷天帝醜鑒元期彰直元通天帝馘妄理真照效清池天帝苦勤寥昌景仁政天帝吉義安蹈登煥夷天帝長肱正基崇譽炎常天帝整真微晞玉真髙聖天帝道極元凝南方八天艷靜淵映天帝胡尤琛神鄉總樞天帝勾龍師存述理精玄天帝石嶽正璘火度化周天帝選妙資忱魔治宛靈天帝兆勤洞豪逸婁冲璩天帝彊鹿皓蘇赤奪摽秀天帝祈東偃名太極順皇天帝蕪軒董玄西方八天仇圖蔚育天帝爍陀郗明覩耀真妙天帝祚莊堂梵度明瑶天帝宗耀頓康抱正斗機天帝斬伐魔凶辨伏安道天帝嗣康監生素明洞虛天帝惠施部慈華都耀明天帝雞樞婁侖要玄大皓天帝皛絶神環北方八天神府公符天帝宿隂城梵章紫皇天帝越平延龍猷轄洞天帝火旦𤓁焮仙平清修天帝玉素真華混合妙真天帝抱光紫輝玄璘統儀天帝時承道生冥度弘嘉天帝杳曲玄嶼澄漢洞浮天帝中極幽微三十二天二十二帝諸天隱諱諸天隱名天中空洞自然靈章順治五星不有遲留伏藏悖逆道氣左回逆犯者追使氣循軌由正相生交養萬彚與帝同榮無敢夭傷秀實華精一萬九千四百二十一種穀果蔬畜五行順生食者長年不作疾癘自致神仙此文隱諱知者不言悟真識玄玉書明宣諸天隱韻無有尅勝戰爭違忤干凌五星之分協和致福帝主萬年正氣殄滅祅怪凶害永捐順治之音順治之尊順治之神順治之魔順治之靈二景六合順躔上清紫微布氣招搖列星太和沖盈金木同形水火為一土德共并殺害怒鬪以順得平無量之奧深不可詳敷落神真普度天人令日欣慶受度歷關諸天請滅遲伏留逆勃蝕之氣斬絶祅根順度五常真流太玄五帝轉樞經緯天門東斗延生西斗合氣北斗養胎南斗行勢中斗受形三界福凝青帝樂金白帝同木赤帝運水黑帝助火黃帝含虛五行協佐敢有惡逆不順道者戮以風火青天真王治木之鬼赤天真王斬火之賊白天真王斷金之邪黑天真王滅水之怪黃天真王伏土之殃五帝真王萬神之宗飛行鼓從總領神兵麾幢鼓節遊觀太空自號赫奕諸天齊功上天度人嚴攝祅凶木氣逆土土制水窮水藏火精火鍊金鎔金還尅本相迭為凶五帝握符五星御龍循繞靈綱使氣和同五行順治不有尅傷天人協道萬物輝昌自然長生時化明雍天地正輪六精允隆萬氣無愆聖運無窮萬神咸聽三界五帝列言上清龍漢延康真道惟常恍愡無形初不隱彰元晶廓如混氣華芒赤黑潜孕五氣乃光方域定位東西擊攘形勢相乘或柔或剛金木爭戰龍虎騰驤隂制於陽陽薄於隂凌奪無期氣與神傷元始行道五星尊王善為陽順惡為凶戕正真御樞中極命神順以治化化開玉亰晃燦玄臺碧落維天天上天下無幽無冥無形無影無極無窮赤明開圖運度順行元始安鎮瓊篆玉文流雲翥鳳元氣道根保制劫運使天長存梵氣彌羅萬範開張元綱流演三十二天輪轉無色周回十方旋斗歷箕回度五常三十五分總氣上元是謂順行不犯神綱綱以制氣進退所將好生協從輪無蹶張順道偶和和密而淵八景冥合氣入玄玄玄中太皇上帝髙真泛景璇圖敷落洞章赤書五篇制斷不祥經緯得緒三界福堂帝德體循紫庭聮芳雲宅玉靜日闕金璫皇皇寶華空洞自然千和萬合五政成真真中有神長生大君無英木帝白元金神太一治土司命火尊桃康合延水祖大溟執符把籙保命生根上遊上清出入華房八景之內細微之中下鎮人身泥丸絳宮中理五氣混合百神十轉回靈萬氣齊仙仙道貴生無量度人上通玄門飛天法輪順治命延罪福禁戒宿命因緣普受開度飛魂生身身得受生上聞諸天諸天之上各有生門中有空洞謡歌之章五真靈篇辭參髙真第一五星真君紫微定位飛空之音太空無邊道體自然冥漠匪迹混洞之先恍惚中物至精不遷升隂降陽元氣綿綿氣從何生太虛發煙晶明在胎神氣淵泉三五既名七九相連氣分方畔水火變生彊弱剛柔道功無全根角有來落落在天生化由之悟則神仙五行共濟五賊為緣水火金木中土天關尅制則鬱氣變成姦不動則平化力無傳歌此靈音泛駕翩翩第二五星真君順治五氣招玄之章金光在東炎炎寶龍西靈授符南山起雷黃旗翻翻環拱太微履道無爽真氣所歸錦輿琅軒金馬玉鞭吾何狩之周流八騫事君事父順忠孝先道妙在兹祕不可傳上輔帝臺出為德宣吾道正明光揚九天生植和澤造化匪艱布于天道灌氣巡環庶品孳育各用其元光亘上下萬氣同仙內福三界外洞人玄天順明清地順咸寧人順胎丹重閬胞扄出生無死徹視通靈神變入空驂駕九龍慶耀流彩五老命封玉策絳章左嘯華童右扶太真流金火風順行祕道萬帝唱恭五行返一非有無中第三五星真君順治運度大霞歌曰天市層垣列耀猶肆我執玉書赤文大字刻寶光門瓊館北軒星國萬里仙民軿繁中有帝皇絳闕紫煙雲盈我居光浮我廬隂陽二景瑶琳珮珠亹亹其行五色自生遲伏留逆順德無爭以順事帝動如符契以順事天得道自然以順生化神功綿綿氣合太無結録寶圖五篇玉文回旋帝車帝車在東仁化普從大標經西攙槍協齊順道為治神造希夷我位上王炯炯其方善惡不遺德之所臧順為聖德萬方作則不順天運變為五賊道幾無形杳杳元精生化無窮螭迹雕瓊雲萌紫素咽服玉精目視三素倏忽變通神母玄父日月曈曨此三界之上飛空之中五星真君順治五行至妙之音音參洞章誦之百遍名度南宮誦之千遍五帝保迎萬遍道備飛升太空過度三界位登仙翁有聞靈音萬神敬形敕制地祇侍衛送迎拔出地戶五苦八難七祖升遷永離鬼官魂度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及五方真元道君至靈隱祕之音皆是大梵之言非世上常辭回度順綱使流演得宜逺諸災殃降致和氣福如太倉故謂玄奧難可尋詳上天所寶祕於玄都紫微上宫依玄科四萬劫一傳若有至人齎金寶質心依舊格告盟十天然後而付焉道言夫五行順治則萬物有宗隂陽至和三界歡樂天人長年無夭折尅傷之患若氣化失次星度迭軌刑殺制勝竟不休息則天地運度亦有否終日月五星亦有虧盈至聖神人亦有休否末學之夫亦有疾傷以其五行之氣不以順道則天人怒而不喜人鬼凶而不吉凡有此災同氣皆當齊心修齊六時行香十遍轉經福德立降消諸不祥無量之文普度無窮道言夫世人生命限臨滯厄運即相須水火交錯數歸滅亡氣索命終以五行刑尅併於絶地故也不知身壞物弊而真神本元之主道之至精未常滅也五行逆次則天地終極或末學道淺仙品未充運應滅度身經太隂臨過之時同學至人為其行香誦經十過以度尸形如法魂神徑上南宮隨其學功計日而得更生轉輪不惑便得神仙道言五星凌犯不順治其道上為天灾下為地禍中為人患天地運終星宿錯度日月失昏四時失度隂陽不調不順於天也山摧地震水湧泉涸獸食人民蝗鼠害稼陷沒注決風火迸出壓溺倒裂不順於地也國境生災兵革興作疫毒流行兆民死傷師友命過鬼出為祟不順於人也五行失順則物真能治欲使順道自然天下安謐者皆當修齊敷露五方真文立壇奉幣以告五帝行香誦經夫齊戒誦經功德甚重上消天災保鎮帝王下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能為天地帝主兆民行是功德有災之日發心修齊燒香誦經十過皆諸天記名萬神侍衛右別至人克得為聖君金闕之臣諸天記人功過豪分無失天中真王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君撰元始靈書五行順治玉篇東方八天神屢易圖玉遇山回子王七覺輔波𠎣深旦烈靜卒江梗呼迎寶煙披澤始栗備身閲碩彊偃辨卑羅蜜魯輦息家處檀移心魔詠枝河究屈張平蘭球珠忽離龍梵隂南方八天太玄混微斗著轉華移盈曲祿報該無涯念蕩董頥救明演徙極深光總九搖契逺露㦸韓司洎詵招西飛玉投檢瓊籌泛芽丹明希沈長幾嶧訛騫傳良滌房覩迎陀西方八天音混真隅柳寂鎮鋪義殿洪護遘健錫無仗𠆸亟丑月羅雲奔部茫哆參王中玄臺元洞惡奕靈童爓浮祥寧實賈靈提丁謀勤玄樂明耀雄傳孤梵明皇景豐嬉並元北方八天太玄宛室旗正亭白沈酬幾澄貴真奚名廓定逸革樞靈訴𦅌韶庭湄濩醜那奕升宿嶽林曆道混魔亰罔被淵密龍固迷緣太隂九靈魔微朝徵神瑛沙蘭韞諸仙盟道言此諸天中大梵隱語無量之音舊文紫筆題璇璣之門以東方八天第一第二第三字正天分度丹書龍臺玉山中閣以南方第六天第四第七字使五行順治氣不害逆三華太玄碧落之文刻紀中斗𩵄宫司空之庭以西方第三天第五第七字第四天第一第八字以斬祅芒犯害順行之軌黃道之前為𧕏之者使水火不尅正氣和寧帝道皇極吉昌薈延大素録簡之筆著文斗箕東北龍毋之山鳴鼓之樓真靈瑶闕譙都之上以北方第二天第三天第四字第八天第一第四第七字以斷却五行不循星車失度差躔之氣使五行順治降福人天為百靈所仰萬神所遵字皆廣長一丈八角垂芒方廣如印天真皇人昔書其文布於八天十方上下以為正音有知其音能齊而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳魔王保舉上真道備克得遊行三界升入金門此音出空洞之中太和沖杳之氣結成正音五行刑害不順行度失治禍及民者鼓其音而禳之天垂甘露地生神芝金寶開泄符瑞自生無所不辟無所不禳無所不度無所不成天真自然之音也故誦之致飛天下觀上帝遙唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅清河海靜默山嶽吞煙萬靈振伏招集羣仙天無氛穢地無祅塵冥慧洞清大量玄玄也元始無量度人上品妙經卷之三十二

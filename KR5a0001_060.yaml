front:
  text: 靈寶無量度人上品妙經卷之六十宙十
  hash: sha256:7bb7f71a8436a72a8fdd76a676c1ec6ec1c2627ab50084823224d76492eca29d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_060-001a, image: hfl/0012/0012-166.png}
body:
  text: 鍊氣變仙品道言昔於始青天中碧落空歌大浮黎土受元始度人鍊氣變仙超神上清之品元始天尊當說是經周回十過以召十方始當詣座天真大神上聖髙尊妙行真入十方鍊氣變仙生神道君化骨住命功曹天吏主録仙名應真得度鍊氣變仙無量度人諸天大神無鞅數衆御氣而來其氣徘徊非空非有非形非色混洞無極雲霞霄霧難喻其體九色不定乍光乍明或絳或青煥爛九空映耀三界自非諸天神靄靈華仙雲瑞彩之可比類發於元始玉京翠房淵岩冥竇之中靡靡布散中有百千無量光景各現丹輿緑輦羽蓋瓊輪龍旌鳳軒夜光神馬九絶猛獸玉蕤停空紫蓋髙蔭流精玉光浩氣鬱勃洞煥太空三日三夜諸天日月星宿垂象之輪金璣玉關瑶樞寶纂靈綱雲域宿舍絳𡵨一時運動行度流移不與常等是時天司上官主典掾司各守輪轂推紐轉括不能循軌以應常次咸各驚駭而相謂言是何瑞因覩此竒變即建天鼓以候斗車鳴鼓九通下觀玉京之傍一十二山靈海碧濤神津潮應龍虯出沒其聲沸雷大淵汪洋㳙流湮汩不與天鼓鳴時機會相應諸天帝宫未識何緣以致斯異𢋫料簿籍默會簡籙將詣帝臺質其所疑速命威神分雲掃途攝氣治道驂駕龍虎秉執旌旗時未當行神煙四起天風灑灑三辰回照妙氣澄廓方輿圓蓋左行右旋天籟揚音洞歌宛奏千界流光八騫髙欒靜覩群真咸得侍座元始天尊玄坐虛浮紺碧蓮花之上其花萬葉蘂珠周繞一葉下廣遐覆一天一蘂之珠各現金色天妙世界一一界中各有天仙帝王首冠寶華衣搖仙彩乘鶴駕鸞往來無礙於此蓮幹明如水晶其直參空根蟠玉海圓徑萬里中有寶樓琛闕瓊宫瑰殿層壘鬱峩所現靈觀不可思說及以比量以近言之猶於太倉遙瞻積粟元始天尊安坐蓮花下觀諸天而是身相大小齊等不有偏陷說經一遍諸天大聖同時稱善是時一國男女身光影相互相涉入說經二遍神現無極玉京崑崙等一塵芥無有限際說經三遍萬象群類一時同聲讃歎經法清詠道真說經四遍上清九空三萬六千日月一時同明九隂腐骸未度之骨還起成人說經五遍金龍神獸競吐風雲合呇九色洞妙混淪說經六遍一國男女含氣之倫童嬰其顔金玉其身不知有死食氣游神說經七遍天垂碧玉地變黃金紅露飄注甘醴冲盈說經八遍金翅不生神龍夜鳴五嶽收煙八景現形說經九遍玉悔揚波碧山秀榮飛仙來朝雲輅鳳旌說經十遍地藏甘露七寶均生頑堅濁礎瑞光化成是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方鍊氣變仙至真大神無鞅之衆浮空而至說經二遍南方鍊氣變仙至真大神無鞅之衆浮空而至說經三遍西方鍊氣變仙至真大神無鞅之衆浮空而至說經四遍北方鍊氣變仙至真大神無鞅之衆浮空而至說經五遍東北鍊氣變仙至真大神無鞅之衆浮空而至說經六遍東南鍊氣變仙至真大神無鞅之衆浮空而至說經七遍西南鍊氣變仙至真大神無鞅之衆浮空而至說經八遍西北鍊氣變仙至真大神無鞅之衆浮空而至說經九遍上方鍊氣變仙至真大神無鞅之衆浮空而至說經十遍下方鍊氣變仙至真大神無鞅之衆浮空而至十遍周竟十方鍊氣變仙天真大神一時同至一國男女傾心歸仰來者聞於妙氣彌塞普遍泛此浩蕩無量俱來形同於氣氣同於形無有東西及以涯涘種種人物男女相貌忽出忽沒忽隱忽顯遍一大國氣皆散滿非可禁止於是元始含笑出紫金光明寶掌五指手相望氣斂約瑩然開顯即見諸天一切衆生聽法真寮無量大道威神冥空天界一切神司大俱吒鬼皆在光氣之內稽首作禮旋匝座下願聞法要眇眇之中去地百丈元始登引天真大神上聖髙尊妙行真人十方鍊氣變仙至真諸大神王無鞅數衆俱入光氣之內一切天人見元始天尊上聖髙尊如處寶珠及淨琉璃天海交映渾渾空碧光照內外潔無纎翳見十方空湛同天眼一切真仙仰看歌詠步虛禮拜惟見拂拂出入來往光融氣化不知所在國人廓散天境平正虛通踈徹元始即於氣觀有無之中說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位恍愡之間空氣合體寂無遺響是時一切天司三辰二景主運轉機一切真神始悟異因氣變神移莫知所緣乃識元始欲說鍊氣變仙最上妙道先現斯瑞諸天真仙一切天人遇值經法普得濟度全其天年無有中傷傾土歸仰識道忘心氣鍊氣明氣大氣剛氣空氣淵氣冲氣運氣有氣無氣變氣仙言不唱宗口不命物齊同慈愛異骨成親國安民豐欣樂太平經始出教一國鍊氣悟十二法以氣合道以道合心心合於神神變為仙宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝鍊氣變仙生神易骨隱韻之音亦是十方變氣變仙至真大神內諱鍊氣變仙之隱名也非世之常辭上聖已成真人通玄究微能悉其章氣已超登聖地升入無形猶固鍊之誦之十過諸天召氣萬帝變仙天地返元氣如淵泉山鍊為氣地鍊為氣天鍊為氣人鍊為氣三景萬象皆鍊為氣氣無形端恍惚存亡人能識之變神為仙未能識氣未知鍊道齊戒誦經真氣自生鍊氣自然天地自應三辰不行群魔束形鬼精滅爽回尸起死白骨變仙至學之士誦之十過則精血化氣氣達百川五臟六腑不逆無偏自有入無氣鍊綿綿綿綿永存變神為仙則五帝列侍三元發煙魔精喪膽鬼官揚鞭滌蕩九醜氣極通玄濟病度死絶命更生所以爾者學士鍊氣未明體未洞真召制萬氣氣登天門氣還天門不知無形德可伏御地祇束縳魔靈但却死而已氣鍊得生輕誦此章氣不光揚流精玉化塞閼明堂玄曹記言注子餘殃供養尊禮門戶興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人無量為鍊氣變仙萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天氣到億曽萬祖幽魂苦爽既滅之後皆化為氣氣不經鍊冥漠不生受誦氣鍊皆即受度上升朱宫格皆九年受化更生得為貴人而好學至經功滿德就鍊氣變仙飛升金闕遊宴玉京也上學之士修誦是經皆即受度飛升南宫世人受誦則延壽長年後皆得作尸解之道形隨氣出化入無門魂神合氣氣結成神不經地獄即得返形泛氣太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各六十四人營衛神文保護受經者身道言正月長齊誦詠是經鍊氣鬱青為上世亡魂故氣鍊新斷地司牽役復連冡訟度上南宫七月長齊誦詠是經氣鍊空白身變神仙諸天書名玉籙素契削死上生十月長齊誦詠是經氣鍊太黃為道王帝主君臣父子召氣九天天福氣冥安鎮國祚保天長存世世不絶常為人君安鎮其方永享太平八節之日誦詠是經氣鍊九星化為九色戴九履一左三右七二四扶身六八挾足氣繞九宫變為真身得為九宮真人本命之日誦詠是經氣鍊太微自干入支六甲從官一氣化竒魂神澄正萬氣相隨不經苦惱神變希夷三界奉輪五天揚麾萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齊戒入室東向叩齒六十四通上聞六十四天心拜六十四過閉目靜思身坐青黃白三色雲氣之中內外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室內項生圓象光映十方如此分明密呪日無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各六十四人關啓所言今日吉慶長齊清堂修行至經無量度人願所啓上徹徑御無上六十四天元始上帝至尊几前畢引氣三十二過東向誦經元始無量度人上品妙經元始洞玄靈寶本章鍊氣變仙九變度人道氣隱韻離合自然混洞太無混無為虛虛為空體氣與空俱氣為太真妙入玄無氣為道性不屬有無變化通神神與氣俱氣非氤氲氣非呼吸氣無蒸出氣非雲煙氣非形質真氣無體彊有氣名氣能生化氣能變遷㤅能堅剛氣能返還氣能長久氣能綿綿我氣非物能生衆物我氣無情能化有情氣為道母氣為大神動而為有靜而為空化生玉京蕭臺鬱峩大羅玉清金闕玉房紫閣朱庭真氣流間化結上真無氣不光無氣不明無氣不立無氣不成無氣不度無氣不生是為大梵玄中之玄𣲖分攴析如環相連蟠延屈回紫氣白煙上下無常剛柔有方髙聖靈仙萬帝千真混化一氣鍊而變仙譬諸世間山海樓闕萬物榮繁智蠢賢愚上宰下官皆從氣生受鍊變遷氣無生死氣無頗偏隨感而應氣妙相傳若亡若存眇眇三便虹京瓊池日澤蘂淵大行梵氣周回十方化生度人不死之神化生南極長生大君化生鍊氣變仙大神化生道氣自然威神化生上清神氣紫君鍊化元氣始生變仙至真尊神氣存不死無量度人今日校録諸天臨軒東方無極鍊氣變仙長生大聖無量度人南方無極鍊氣變仙長生大聖無量度人西方無極鍊氣變仙長生大聖無量度人北方無極鍊氣變仙長生大聖無量度人東北無極鍊氣變仙長生大聖無量度人東南無極鍊氣變仙長生大聖無量度人西南無極鍊氣變仙長生大聖無量度人西北無極鍊氣變仙長生大聖無量度人上方無極鍊氣變仙長生大聖無量度人下方無極鍊氣變仙長生大聖無量度人十方至真鍊氣變仙長生度世無量大神並乘梵氣變成紫雲碧琳之輦瓊鳳之輿黃蓋素輪驂駕九龍三氣之軿景雲之𢡠流火之鈴鳴金考革撼響帝鐘前鳴玉童齊唱後吹玉女笳鳴獅子辟邪嘯歌噰噰八極開圖五帝奏煙億乘萬騎浮氣而來含空降光監真度生諸天丞相太素上宫主道攝氣變仙大神執籙把籍齊到帝前隨所應度嚴校諸天普告三界無極神鄊泉曲之府北都羅酆三宮九府十二河源上解祖考億劫種親隂尸滯魄萬氣魔魂身謝三官魂氣久凝宿業如風飄流惡根氣無生死但有杳冥識念慿氣遊停何依善化福堂惡化炎池性因識迷隨氣所之一如在世驚喜笑啼魔氣為吏聿來訊之魂氣飄揚憶念含悲元始道恩攝氣鍊持積𡨚成和積故成新死氣蕩化落滅罪根不得拘留逼合鬼群元始符命時刻升遷返氣太無混道元胚天魔六合火獄冰池業盡氣鍊玉光洞微寂然空廓獨存希夷死魂受鍊仙化天竒道為我身氣為我神念世迷妄徒取悲辛鍊氣變仙無量度人生身受度劫劫長存隨劫輪轉與天齊年永度粗染漏念輕欲業道天牢魂魄不經超凌三界逍遙上清上清之天天氣至真無色之境梵行東方十六天此氣大梵初無起止皆是道性元神所現天境本無體象道化為真此名氣觀亦非鍊變而現天真自然太空之玄妙也不歷星度次舍在無色之境出隂陽之分皆上聖之居宛空明梵天帝空冲嬰紫元伯無天帝明子歸燕景鬱需天帝虛父自康冲正洞極天帝耀未駢羅明辨元黃天帝太無留延理重淵虛天帝道時建華覺真權衆天帝弗泰用師清微黃羽天帝鬼度監救明望世天帝常遊江因越甫問時天帝蘇來鳩生氣靈昭浦天帝慶皇上宗玄虛光範天帝招集女魂上極四種天帝羌陳焰易化正鎮天帝杜常生孤罡八範天帝孔堅明婁九延玉定天帝智定嚴南方十六天丹摩逸化天帝崇真斯臺斗鑑虛輿天帝沙劫子安帝光無濟天帝望朞明朱陵耀光天帝洞雲無真紫畢斷白天帝宛醯羅降仙台元天帝呼牛演池爽至謝深天帝鹿堂子家鬱江斯蟬天帝日曜春估侯利真天帝曽和太空谷玄道用天帝吐明芝生李步明微天帝圖何部多神廬昌應天帝隨宫祕主度正克宗天帝舜角明基大火赤衣天帝翰覺賢青帝洞遙天帝江平延孫亥城百化天帝奚流夜陀西方十六天金離光啓
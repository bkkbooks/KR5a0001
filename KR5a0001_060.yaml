front:
  text: 靈寳無量度人上品妙經卷之六十宙十
  hash: sha256:b84386503edba27fed2d83a29760f05e5d18f0c7b36d7f0d02f5ff32514b5588
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_060-001a, image: hfl/0012/0012-166.png}
body:
  text: 鍊氣變仙品道言昔於始青天中碧落空歌大浮黎土受元始度人鍊氣變仙超神上清之品元始天尊當說是經周廻十過以召十方始當詣座天眞大神上聖髙尊妙行眞入十方鍊氣變仙生神道君化骨住命功曹天吏主録仙名應眞得度鍊氣變仙無量度人諸天大神無鞅數衆御氣而來其氣徘徊非空非有非形非色混洞無極雲霞霄霧難喻其體九色不定乍光乍明或絳或青煥爛九空映燿三界自非諸天神靄靈華仙雲瑞彩之可比類發於元始玉京翠房淵岩冥竇之中靡靡布散中有百千無量光景各現丹輿緑輦羽蓋瓊輪龍旌鳳軒夜光神馬九絶猛獸玉蕤停空紫蓋髙蔭流精玉光浩氣鬱勃洞煥太空三日三夜諸天日月星宿垂象之輪金璣玉關瑶樞寳纂靈綱雲域宿舍絳𡵨一時運動行度流移不與常等是時天司上官主典掾司各守輪轂推紐轉括不能循軌以應常次咸各驚駭而相謂言是何瑞因覩此竒變即建天鼓以候斗車鳴鼓九通下觀玉京之傍一十二山靈海碧濤神津潮應龍虯出没其聲沸雷大淵汪洋㳙流湮汩不與天鼓鳴時機會相應諸天帝宫未識何縁以致斯異𢋫料簿籍黙會簡籙將詣帝臺質其所疑速命威神分雲掃途攝炁治道驂駕龍虎秉執旌旗時未當行神煙四起天風洒灑三辰廻照妙炁澄廓方輿圓蓋左行右旋天籟揚音洞歌宛奏千界流光八騫髙欒靜覩群眞咸得侍座元始天尊玄坐虚浮紺碧蓮花之上其花萬葉蘂珠周遶一葉下廣遐覆一天一蘂之珠各現金色天妙世界一一界中各有天仙帝王首冠寳華衣搖仙彩乗鶴駕鸞往來無礙於此蓮榦明如水晶其直參空根蟠玉海圓徑萬里中有寳樓琛闕瓊宫瑰殿層壘鬱峩所現靈觀不可思說及以比量以近言之猶於太倉遙瞻積粟元始天尊安坐蓮花下觀諸天而是身相大小齊等不有偏陷說經一遍諸天大聖同時稱善是時一國男女身光影相互相渉入說經二遍神現無極玉京崑崙等一塵芥無有限際說經三遍萬象群類一時同聲讃歎經法清詠道眞說經四遍上清九空三萬六千日月一時同明九隂腐骸未度之骨還起成人說經五遍金龍神獸競吐風雲合呇九色洞妙混淪說經六遍一國男女含炁之倫童嬰其顔金玉其身不知有死食炁游神說經七遍天垂碧玉地變黄金紅露飄注甘醴冲盈說經八遍金翅不生神龍夜鳴五嶽收煙八景現形說經九遍玉悔揚波碧山秀榮飛仙來朝雲輅鳳旌說經十遍地藏甘露七寳均生頑堅濁礎瑞光化成是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方鍊炁變仙至眞大神無鞅之衆浮空而至說經二遍南方鍊炁變仙至眞大神無鞅之衆浮空而至說經三遍西方鍊炁變仙至眞大神無鞅之衆浮空而至說經四遍北方鍊炁變仙至眞大神無鞅之衆浮空而至說經五遍東北鍊炁變仙至眞大神無鞅之衆浮空而至說經六遍東南鍊炁變仙至眞大神無鞅之衆浮空而至說經七遍西南鍊炁變仙至眞大神無鞅之衆浮空而至說經八遍西北鍊炁變仙至眞大神無鞅之衆浮空而至說經九遍上方鍊炁變仙至眞大神無鞅之衆浮空而至說經十遍下方鍊炁變仙至眞大神無鞅之衆浮空而至十遍周竟十方鍊炁變仙天眞大神一時同至一國男女傾心歸仰來者聞於妙炁彌塞普遍泛此浩蕩無量俱來形同於氣氣同於形無有東西及以涯涘種種人物男女相貌忽出忽没忽隱忽顯遍一大國炁皆散滿非可禁止於是元始含笑出紫金光明寳掌五指手相望炁歛約瑩然開顯即見諸天一切衆生聽法眞寮無量大道威神冥空天界一切神司大俱吒鬼皆在光氣之内稽首作禮旋匝座下願聞法要眇眇之中去地百丈元始登引天眞大神上聖髙尊妙行眞人十方鍊炁變仙至眞諸大神王無鞅數衆俱入光炁之内一切天人見元始天尊上聖髙尊如處寳珠及淨瑠璃天海交映渾渾空碧光照内外潔無纎翳見十方空湛同天眼一切眞仙仰看歌詠歩虚禮拜惟見拂拂出入來往光融炁化不知所在國人廓散天境平正虚通踈徹元始即於炁觀有無之中說經都竟衆眞監度以授於我當此之時喜慶難言法事粗悉諸天復位恍愡之間空炁合體寂無遺響是時一切天司三辰二景主運轉機一切眞神始悟異因炁變神移莫知所縁乃識元始欲說鍊炁變仙最上妙道先現斯瑞諸天眞仙一切天人遇值經法普得濟度全其天年無有中傷傾土歸仰識道忘心炁鍊炁明炁大炁剛炁空炁淵炁冲炁運炁有炁無炁變炁仙言不唱宗口不命物齊同慈愛異骨成親國安民豐欣樂太平經始出教一國鍊氣悟十二法以炁合道以道合心心合於神神變爲仙宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝鍊炁變仙生神易骨隱韻之音亦是十方變氣變仙至眞大神内諱鍊炁變仙之隱名也非世之常辭上聖已成眞人通玄究微能悉其章炁已超登聖地升入無形猶固鍊之誦之十過諸天召炁萬帝變仙天地返元氣如淵泉山鍊爲炁地鍊爲炁天鍊爲炁人鍊爲炁三景萬象皆鍊爲炁炁無形端恍惚存亡人能識之變神爲仙未能識氣未知鍊道齋戒誦經眞炁自生鍊炁自然天地自應三辰不行群魔束形鬼精滅爽回屍起死白骨變仙至學之士誦之十過則精血化炁炁達百川五臟六腑不逆無偏自有入無炁鍊綿綿綿綿永存變神爲仙則五帝列侍三元發煙魔精喪膽鬼官揚鞭滌蕩九醜炁極通玄濟病度死絶命更生所以爾者學士鍊氣未明體未洞眞召制萬炁炁登天門炁還天門不知無形徳可伏御地祇束縳魔靈但却死而已氣鍊得生輕誦此章炁不光揚流精玉化塞閼明堂玄曹記言注子餘殃供養尊禮門戸興隆世世昌熾與善因縁萬災不干神明護門斯經尊妙獨歩玉京度人無量爲鍊炁變仙萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天氣到億曽萬祖幽䰟苦爽旣滅之後皆化爲炁炁不經鍊冥漠不生受誦氣鍊皆即受度上升朱宫格皆九年受化更生得爲貴人而好學至經功滿德就鍊炁變仙飛昇金闕遊宴玉京也上學之士修誦是經皆即受度飛昇南宫世人受誦則延壽長年後皆得作尸解之道形隨炁出化入無門䰟神合氣氣結成神不經地獄即得返形泛氣太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寳不傳下世至士齎金寳效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各六十四人營衛神文保護受經者身道言正月長齋誦詠是經鍊炁鬱青爲上世亡䰟故炁鍊新斷地司牽役復連冡訟度上南宫七月長齋誦詠是經氣鍊空白身變神仙諸天書名玉籙素契削死上生十月長齋誦詠是經炁鍊太黄爲道王帝主君臣父子召炁九天天福炁冥安鎭國祚保天長存世世不絶常爲人君安鎮其方永享太平八節之日誦詠是經炁鍊九星化爲九色戴九履一左三右七二四扶身六八挾足氣遶九宫變爲眞身得爲九宮眞人本命之日誦詠是經氣鍊太微自干入支六甲從官一炁化竒䰟神澄正萬炁相隨不經苦惱神變希夷三界奉輪五天揚麾萬神朝禮名書上天功滿德就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒六十四通上聞六十四天心拜六十四過閉目靜思身坐青黄白三色雲氣之中内外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室内項生圓象光映十方如此分明宻呪日無上玄元太上道君召岀臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各六十四人關啓所言今日吉慶長齋清堂修行至經無量度人願所啓上徹徑御無上六十四天元始上帝至尊几前畢引炁三十二過東向誦經元始無量度人上品妙經元始洞玄靈寳本章鍊炁變仙九變度人道氣隱韻離合自然混洞太无混无爲虚虚爲空體炁與空俱炁爲太眞妙入玄無炁爲道性不屬有無變化通神神與炁俱炁非氤氲炁非呼吸炁無蒸岀炁非雲煙炁非形質眞炁無體彊有炁名炁能生化炁能變遷㤅能堅剛炁能返還炁能長乆炁能綿綿我炁非物能生衆物我炁無情能化有情炁爲道母炁爲大神動而爲有靜而爲空化生玉京蕭臺鬱峩大羅玉清金闕玉房紫閣朱庭眞炁流間化結上眞無炁不光無炁不明無炁不立無炁不成無炁不度無炁不生是爲大梵玄中之玄𣲖分攴析如環相連蟠延屈回紫炁白煙上下無常剛柔有方髙聖靈仙萬帝千眞混化一炁鍊而變仙譬諸世間山海樓闕萬物榮繁智蠢賢愚上宰下官皆從炁生受鍊變遷炁無生死炁無頗偏隨感而應炁妙相傳若亡若存眇眇三便虹京瓊池日澤蘂淵大行梵炁周廻十方化生度人不死之神化生南極長生大君化生鍊炁變仙大神化生道炁自然威神化生上清神炁紫君鍊化元炁始生變仙至眞尊神炁存不死無量度人今日校録諸天臨軒東方無極鍊氣變仙長生大聖無量度人南方無極鍊氣變仙長生大聖無量度人西方無極鍊氣變仙長生大聖無量度人北方無極鍊氣變仙長生大聖無量度人東北無極鍊氣變仙長生大聖無量度人東南無極鍊氣變仙長生大聖無量度人西南無極鍊氣變仙長生大聖無量度人西北無極鍊氣變仙長生大聖無量度人上方無極鍊氣變仙長生大聖無量度人下方無極鍊氣變仙長生大聖無量度人十方至眞鍊氣變仙長生度世無量大神並乗梵炁變成紫雲碧琳之輦瓊鳳之輿黄蓋素輪驂駕九龍三炁之軿景雲之𢡠流火之鈴鳴金考革撼響帝鐘前鳴玉童齊唱後吹玉女笳鳴獅子辟邪嘯歌噰噰八極開圖五帝奏煙億乗萬騎浮炁而來含空降光監眞度生諸天丞相太素上宫主道攝炁變仙大神執籙把籍齊到帝前隨所應度嚴校諸天普告三界無極神鄊泉曲之府北都羅酆三宮九府十二河源上解祖考億劫種親隂屍滯魄萬炁魔䰟身謝三官䰟炁乆凝宿業如風飄流惡根炁無生死但有杳冥識念慿炁遊停何依善化福堂惡化炎池性因識迷隨炁所之一如在世驚喜笑啼魔炁爲吏聿來訊之䰟炁飄揚憶念含悲元始道恩攝炁鍊持積𡨚成和積故成新死炁蕩化落滅罪根不得拘留逼合鬼群元始符命時刻昇遷返炁太无混道元胚天魔六合火獄冰池業盡炁鍊玉光洞微寂然空廓獨存希夷死䰟受鍊仙化天竒道爲我身炁爲我神念世迷妄徒取悲辛鍊炁變仙無量度人生身受度劫劫長存隨劫輪轉與天齊年永度麤染漏念輕欲業道天牢䰟魄不經超凌三界逍遙上清上清之天天炁至眞無色之境梵行東方十六天此炁大梵初無起止皆是道性元神所現天境本無體象道化爲眞此名炁觀亦非鍊變而現天眞自然太空之玄妙也不歷星度次舍在無色之境出隂陽之分皆上聖之居宛空明梵天帝空冲嬰紫元伯无天帝明子歸燕景鬱需天帝虚父自康冲正洞極天帝耀未駢羅明辨元黄天帝太无留延理重淵虚天帝道時建華覺眞權衆天帝弗泰用師清微黄羽天帝鬼度監救明望世天帝常遊江因越甫問時天帝蘇來鳩生炁靈昭浦天帝慶皇上宗玄虚光範天帝招集女䰟上極四種天帝羗陳燄易化正鎭天帝杜常生孤罡八範天帝孔堅明婁九延玉定天帝智定嚴南方十六天丹摩逸化天帝崇眞斯臺斗鑑虚輿天帝沙劫子安帝光無濟天帝望朞明朱陵耀光天帝洞雲无眞紫畢斷白天帝宛醯羅降仙台元天帝呼牛演池爽至謝深天帝鹿堂子家鬱江斯蟬天帝日曜春估侯利眞天帝曽和太空谷玄道用天帝吐明芝生李歩明微天帝圖何部多神廬昌應天帝隨宫祕主度正克宗天帝舜角明基大火赤衣天帝翰覺賢青帝洞遙天帝江平延孫亥城百化天帝奚流夜陁西方十六天金離光啓
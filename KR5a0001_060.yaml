度無窮道言夫末學道淺或鍊氣未功運應滅度氣停太隂臨過之時同學至人為其行香誦經十過以鍊尸氣如法魂神徑上南宫隨其學功計日而得更生轉輪不滅變神為仙道言天地氣終亦當修齊行香誦經星氣錯度日月失明亦當修齊行香誦經四氣失度隂陽不調亦當修齊行香誦經國土有災兵氣四興亦當修齊行香誦經疫氣流行兆民死傷亦當修齊行香誦經師友氣絶亦當修齊行香誦經夫齊戒誦經功德甚重上消天災保鎮帝王下禳害氣以度兆民生死受鍊其福難勝故曰無量普度天人道言凡有是經能為天地帝主兆民行是功德氣災之日發心修齊燒香誦經十過皆諸天記名萬神侍衛右别聖人剋得為聖君金闕之臣諸天記人功過毫分無失氣中真王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君撰元始洞玄鍊氣變仙玉篇東方八天潭無景憐起寂洞珉太極竟羅玄牡犒澠玉幾纏眸碧畢完辰霞廓益眇昆池鏡騰虛蕩醜訐華延目君法達幽演逗雲離寅吹昴葛希樊堂普澄愛祕曲賴滋球侍巾南方八天金基明俞控志煙陵清都閬文舒馘屏迎暮孤燕飛赤冀懋層宛利皇建喬强預侁辨淨普徒微立霸形花祈若龍道羅韻聲薦巴耶尼九日玄京鳥佳求嵋碧除隱彌西方八天泉曲監阿齒精浮黎覺逸湛定絳闃侔兮帝忽兹投鈎圖建施流育律逐桑殊巷非林振即盧苟旨元衣崒岧天山黳樓綿披僅房逺交軒多瓊曲爓絶送治魂動太儀北方八天蔚蘭未司局丹耀禧崿龍煙梁精泓蘇畀氣道神散空中煩璀德鎮洞后題鉏乾羅霞落美太敕淵捧猊璧瑤貟月追冥素旗出氣度玉金道八埤黃臺四空虎首澆欹道言此諸天中大梵隱語無量之音鍊氣變仙九宫玄文天真皇人知氣之元得氣之根氣化廓落縱橫成文丹筆書之八角垂輝疊玉排瓊其方一丈四景耀明昔書其文以為正音有知其音能齊而誦之者道氣鍊真神隱冲冥諸天真王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳真王保舉上真道備剋得遊行三界升入金門此音無所不鍊無所不營無所不化無所不明鍊氣變仙自然之音也故誦之致飛天下觀上帝遙唱萬神朝禮三界侍軒群祅束首鬼精自亡氣激神宫玉音自鳴天球振響道空鬱清海平嶽竦碧煙金城鶴觀壘壁仙都虛盈萬仙駢擁紫蓋丹旌天地鍊氣變化昊京冥夷超忽大量玄玄也元始無量度人上品妙經卷之六十

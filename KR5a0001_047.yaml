front:
  text: 靈寶無量度人上品妙經卷之四十七字七
  hash: sha256:a0cba76c2ed870dc33bb0af78a75cda1f8815d6247f223d4b8d5e8b04879e158
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_047-001a, image: hfl/0010/0010-048.png}
body:
  text: 祈禳水旱品道言昔於妙成天中晨霞風歌大真和土受元始度人祈禳水旱妙品元始天尊當説是經周回十過以召十方始當詣座天真大神上聖髙尊妙行真人十方龍王水旱二司八海水曹三元火官四瀆主者雷電大神流火神將赤帝使者靈官騎吏無鞅數衆乘空而來流景之輿洞霄之輦曲晨垂蔭丹精吐光叢色分華煥朗太空七日七夜諸天金闕瓊宫絳房琳府一時靜肅星𨇠交彩丹桂凝芳騫林蔚蔥虹梁控帶天光暉曜日映重輪一國地土山川林木緬平一等無復髙下土皆作翠玉柔明瑩徹無有異色衆真侍座元始天尊玄坐空浮九光結雲圓景遊龍之上説經一遍諸天大聖同時稱善一國境界和氣沖融物無疪癘説經二遍草木敷榮萬寶成實説經三遍鶱林集鳳葉布天章説經四遍蓮露含華蘂藏仙液説經五遍水火得宜動植榮暢説經六遍雲行雨施泉定河平説經七遍三靈奉時熙明合曜説經八遍聖運普亨群生同泰説經九遍萬國咸寧隂陽時若説經十遍帝道永昌業隆政備是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊説經一遍東方發令龍王水旱二司無鞅之衆浮空而至説經二遍南方大明龍王水旱二司無鞅之衆浮空而至説經三遍西方肅政龍王水旱二司無鞅之衆浮空而至説經四遍北方通生龍王水旱二司無鞅之衆浮空而至説經五遍東北鎮山龍王水旱二司無鞅之衆浮空而至説經六遍東南風化龍王水旱二司無鞅之衆浮空而至説經七遍西南執紐龍王水旱二司無鞅之衆浮空而至説經八遍西北運綱龍王水旱二司無鞅之衆浮空而至説經九遍上方布潤龍王水旱二司無鞅之衆浮空而至説經十遍下方騰變龍王水旱二司無鞅之衆浮空而至十遍周竟十方無極龍王水旱主者天真大神一時同至一國男女傾心歸仰來者有如細雨密霧各持珍寶供養天尊瞻仰聖顔欣聞妙道於是元始光散諸天出霞萬道法身示變恍惚存亡水火二輪旋暉掩日霄音逸響流激千尋仙花散飛天樂互作靈音扇藹瑞氣聚空天尊口吐玉文影羅億界發言微笑再告天人曰水旱者天地太少之氣生民所感不同故於方域之境其見各異天有天地司嵗之運與人氣交爭亦使之然水為隂溢旱為陽淫王者之德應於天地政平則時和溢則為水亢則為旱或帝德純穆恩逮八表而有水旱者即司嵗天時之制也歲丙辛戊癸太羽太徵之運災發一六二七之宫不得不為水旱水旱為世害之大遇少即祈遇太即禳祈禳十方龍王水旱二司大神俾調其氣正其令謹其時則民物無癘隂陽政等道不私用是時水火二輪合一成珠大如黍米在空玄之中去地五丈元始登引天真大神上聖髙尊十方龍王水旱二司大神無鞅數衆俱入寶珠之中天人仰看惟見拂拂從珠口中入既入珠口不知所在國人廓散遵奉教言元始即於寶珠之內説經都竟衆真監度以授於我當此之時喜慶難言法事精悉諸天復位倏歘之間寂無遺響是時天人值遇經法普得濟度全其本年無有中傷傾土歸仰咸平過心不悔不吝不亢不獨不昧不冒不濫不愆不爽不誣言以善化口無嗔聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊説經中所言並是諸天上帝內名隱韻之音亦是真王內諱祈禳水旱召龍致神百靈之隱名也非世之常辭上聖已成真人通玄究微能悉其章誦之十過諸天遙唱二象均行進退順常水旱不忒祈禳隨應字育繁滋群魔束形鬼精滅爽代無飢饉福被兆人至學之士誦之十過祈澤世霔禳水𣿼源方界安和生物蒙祐所以爾者學士身中水火升濟氣候履常格應二儀祈禳遂請穢滓已消體向洞真召制十方龍神降祥感和德備保見長生輕誦此章身則被殃供養尊禮時榖豐盈世世昌熾與善因緣萬災不干神明護門斯經靈妙通奏玉京度人無量為萬道之先巍巍大範德難可勝道言凡誦是經十過諸天齊到請雨則群龍吐雲玄澤滋稿煙披霧集涸坎波涵請晴則皎日效明隂蠥消殄陽光煥燭幽蔀開昭而好學至經功滿德就皆得神仙飛升金闕遊宴玉京也上學之士修誦是經隂平陽祕水火內交皆即受度飛升南宫世人受誦則五內清康三田昌茂身中水旱適養無虧隂鼎陽爐鍊真成道延壽長年後皆得作尸解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齋金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齋誦詠是經祈禳水旱使春夏華實各遂繁榮七月長齋誦詠是經祈禳水旱遏氣使平嘉茂克遂群實獲成十月長齋誦詠是經祈禳水旱民物阜康天英積秀病癘消禳為國王帝主君臣父子安鎮國祚使天長存歲歲豐稔常保元亨安鎮其方民稱太平八節之日誦詠是經祈禳水旱循時虛盈雨暘得宜動植咸寧本命之日誦詠是經身中水火升降二輪雙景合照安順天經魂神澄正道氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齋戒入宣東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐赤黑黃三色雲氣之中內外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右十方龍王水旱二司大神侍衛前後日月照明洞煥室內項生圎象光映十方如此分明密呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齋清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引氣三十二過東向誦經元始無量度人上品妙經元始洞玄靈寶本章祈禳水旱降應度人承康隱韻妙感因緣大洞隱文空無至神虛皇祖氣生育群真周流三境開化洞玄執網持紐運斡彌綸朗耀大羅紫融碧炎洞煥九壘風水河源包括至化中宅萬靈隂陽升降天地以寧陽乖為亢隂否為淫二氣錯繆水旱乃生壅塞沖和災我生民虛勞人力稼穡不成赤文告命召龍致雲永斷旱怪開通水津大布教令普告十方中有祈禳水旱之神中有太少隂陽之君中有攝龍行雨大神中有收斂隂雲翳景之真中有生成萬物延壽益算度厄尊神導迎和氣無量度人今日校録諸天臨軒東方無極龍德神王長生大聖無量度人南方無極龍𤓁神王長生大聖無量度人西方無極龍威神王長生大聖無量度人北方無極龍藏神王長生大聖無量度人東北無極龍變神王長生大聖無量度人東南無極龍慧神王長生大聖無量度人西南無極龍隂神王長生大聖無量度人西北無極龍升神王長生大聖無量度人上方元極龍父神王長生大聖無量度人下方無極龍化神王長生大聖無量度人十方至真水火龍王長生度世無量大神並乘十色飛雲瓊輿朱輦碧蓋瑶輪驂駕神獸六馬華旌建八威降澤之節開六陽暉日之幡前嘯洞歌齊唱後吹虛籥同鳴獅子白鶴吟嘯噰噰五雷治道九夔贊轅億乘萬騎浮空而來傾光迥駕應祈護生三天丞相洞白右宫天樞上宰水旱大神執籙把籍齊到帝前考檢節氣太少運年隨所應格嚴校諸天普告三界無極神鄉九水寒夜泉曲幽關三官九府曹局名山八海五湖四瀆九江七澤六野十二靈溪雷電大神旱司火官揭日之陽赫煙炎爐火山炯池燠鬱陽曹元始符命時刻升遷祈禳降答應告關宣風雨霜雪隨令無愆若或過縱執送水官庶物昭蘇普惠兆民咸使受度得道長存隨劫輪轉與天齊年永度旱災水厄一切之難超淩三界逍遙上清上清之天天帝洞雲無色之界梵行東方八天曆華昭庸天帝丑都造晨紀靈素王天帝揚琪祕清訥澄祛義章祈天帝竺嶽暾頓覽覺玄居淨智天帝伯林先明虛存一天帝洞時光隱中慈信天帝嗣蔚度田龍札書雲天帝孽長自倫道冥朝極天帝主器安雱南方八天禱真寵黎天帝南子崇務津敬至天帝亶室尊玄符傳九遙天帝格斗司官進氣運樞天帝望烈真臾侯博權天帝重地穴旺協昊輔靈奏成天帝紀兊交略訊八極驛報天帝康求領言景耀化應天帝正免遙流西方八天緑斜楚峩天帝髙塗順英靈還迅智天帝獨泝建鏜行皇輳流天帝孝質夷冥辨氣司玄天帝備黎汶定頥祝祠天帝蹈方希斌光洞龍軍天帝抱臺一敻日鈴奔車天帝估彌農嵫谷養華天帝黃時仲北方八天龍康耀雲天帝六野非去海瀾溢度天帝迦婁遁網詔神消魔天帝密多逹悲魚塘沸蛟天帝揭沙陀王録功考泉天帝輦安夀玄都北宮恬昭天帝古歸起川幽真返尸生化天帝邈廬逺義注澤判冥天帝勃勃禧三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻招降之音水火之尊隂陽之神變氣大魔直候之靈九并十交變化上清無量之奧深不可詳敷落神真普度天人今日祈禳水旱歷關諸天請逐魃鬼興起雨工回戈揮日駐雲偃風沛然潤施廓明四騫飛度災期誠斂太玄二司監舉吸張天門東斗雷府西斗雨都北斗暴泛南斗赤田中斗立符水旱都詮句芒御春蓐收乘秋和融統夏玄冥正冬后土中季散發流通應天及人德著玄功青天魔王震劈拉摧赤天魔王猛令炎威白天魔王隂連浥煤黑天魔王溟渤淵洄黃天魔王水火同推五帝大魔萬神之宗飛行鼓從總領鬼兵麾幢鼓節遊觀紫霄課驗巡行水旱蠲消祈禳上天却滅凶祅天官稟令旱震不行滔泛洪波戊己厭災黃頭兵將斬縳蛟螭玄冠真人禁暴無威回稿變青食和挹羲敢有干試妄縱二司政令遍頗民物竛竮金鉞前戮巨天後刑屠割姦祅風火無停千千截首萬萬翦形魔無干犯鬼無祅精三官北酆明檢鬼營不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列言上清元洞玉曆水火運行神器在中大小無過混沌包之無色無淵風升氣舉積陽為天天上天下無幽無冥無形無影無極無窮溟涬大梵遼廓無光赤明開圖真火燎然八龍負水九壘嘖泉水火成之敷落五篇赤書玉字鑄金為篇保制劫運消息至均世久去道水旱浮沈害傷生物勝伏追尋不知妙玄綿綿若存梵氣彌羅萬範開張元綱流演三十二天輪轉水火升降低昻旋斗歷箕回度五常三十五分總氣上元八景冥合氣入玄玄玄中太皇上帝髙真泛景秉霞嘯詠洞章金真朗郁流響雲營太陽元精道合常經玉音攝氣靈風聚煙隂景內煥雲澤翩翻紫虛鬱秀輔翼萬仙水旱不作日月無偏千和萬合自然成真神霄至尊長生大君東極宫中青華帝君握水火籍臨萬國民祈禳納靈降福天人無英在左白元在右太一在前司命在後桃康海伯合延河侯調鍊平暢水火數周執符把籙保命生根上遊上清出入華房八冥之內細微之中下通人身泥丸絳宫中理五氣混合百神三田豐植水旱無并顧視一身天地同營氣候不失華池液溫十轉回靈萬氣齊仙仙道貴生無量度人上開八門飛天法輪罪福禁戒宿命因緣水火二官統秉權衡普受開度生世欣榮害氣永滅上聞諸天諸天之上各有生門中有空洞謡歌之章真王靈篇辭參髙真第一祈禳水旱飛空之音油雲展布雷車轣轣飛雨既來百川盈尺食墮爾竈均平爾屋下民何知罹此愁毒炎炎畏日流金焦石四野生煙草木皆赤有田兆拆溏可卜宅不見泉聲莫勾涓瀝卒歲無儲罹此災凶我壇其封洞歌鼓鍾符召十龍樂舞千童焚香誦經逹誠紫穹水旱止息福祿濛濛億載享太平稽首青華宫第二召龍致雨之章大田南山誅葦拔菅深耕遠耘度此歲寒彼土如石堅不可索欲覬有成天愛其澤爰釀醪醴潔醮皇壇青龍銜符山隴潺潺赤龍銜符飄雨班班白龍銜符粳稌早繁黑龍銜符積倉如巒黃龍銜符雲罙雨瀾十方龍君憫此下民滋及生物茂泰傾伸誠感三天恩霑八垠讃禮空洞章驛龍莫輕奔第三止雨請晴歌曰水官弛禁不鎖雷城鬼盜其車輪墮其瓶強龍未馴泄雨霖霪雲靄原野烏集狐驚頑石有苔枯桑出耳田夫咄嗟囷徹其底日匿于天龍背生煙不知世間芳簷瀉湍道勑玉文止雨請晴陽光晨發野馬如蒸海嶽澄霽萬谷藏雲符闢我田乃築爾盧日靜風和生類以蘇烈壷奠漿四極真王旋敕歲直富彼倉箱祐世承平教律斯昌玉龍銜獨照映十方聖壽萬年衮衣黼裳此三界之上飛空之中真上歌音音參洞章誦之百遍萬物阜成誦之千遍和氣流通萬遍道備水旱永消過度三界升入神霄有關靈音天司敬形敕制地祗侍衛送迎拔出死戶五苦八難七祖升遷永離鬼官魂度朱陵受鍊更生是謂無量普度無窮有袐上天文諸天共所宗泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及神霄真王隱祕之音可以致雨請晴祈禳水旱佐國佑民皆是大梵之言非世之常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寶祕於神霄玉清王府東華經室運過壬辰應天以傳若有至人齎金寶質心依舊格告盟天君然後而付焉道言夫天地之氣亦有差正子午卯酉為正寅申己亥為初辰戌丑未為終皆差也水旱之災因天時差正之會或民之動息相輸應以致之不及則祈之太過則禳之致雨為祈請晴為禳凡有此災同氣皆當齊心修齋六時行香十遍轉經福德立降消諸不祥無量之文普度無窮道言夫祈禳水旱致雨即於國西南除地為壇壇四面安十方龍王形中安致雨靈符五方貯水以桐竹枝青白楊枝安水中以青紙墨書詞詣三元四海水曹太玄天機二省以祈之請晴即於國南除地為壇壇並髙九尺為三仞上圎下方傍開四門門通九壘以為步道四面安十方龍王形中安請晴靈符五方施香火燈燭以破隂暝丹書青詞詣二省火曹以禳之至人為其行香誦經十過祈禳斯應不為嵗災隨水旱大小為期初七日至三七日為小期也精念懇逹諸天監舉便得神仙道言夫四時失度隂陽不調則氣隨勝以為過故隂霪為水陽亢為旱所臨之境則民庶流移鳥獸失道疫毒流行橫被夭傷亦當修齋行香誦經祈禳悔謝夫齋戒誦經功德甚重上消天災保鎮帝王下禳毒害以度兆民生世受賴其福難勝故曰無量普度天人道言凡有是經能為天地帝主兆民除禳水旱有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衛右別至人剋得為聖君金闕之臣諸天記人功過毫分無失天中真王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君撰元始靈書水火三十二天祈禳中篇東方八天磐唐機孫耀徹瓊祖壇池玉淵景龍允府淀靈有校嶽鍊卷魯竊玄建封淘薰罥古神穴銷螭白龍薦午陳飛斗和鬼占角普袁聚祈油山離緣韓召杵甲黨九昆堯桓南方八天驗稽聿巒赫回耀丹宸林杳叱萬華構觀帝丁率霞馬哲遼還期逾峴籠幽沙丘淵斬觀苟術西靖煙聮合升露遂妖陀蔽佺戶呈牛黎火洞責關旅司要莫休牟師雷西方八天莓儔晏叟拒靈齊裒轉鋤有賢式尼汶斗祠訛騫魂奔荼婁夷弼賞堂鉉曰協使馳獨恩悶卓溢敦侯貟左蘭契兆牧臨傒端登符閲真慶兵司陳蕩忽卯皇勤度伊承北方八天虎聃柚閣殺直空精道密薰降雲黃交門洞混叔火朴沐指分合魂神護昭清樊盈敕魔正酆省甫輔經杲陽吸懷氣無順存叱洛泗爓囚縳攝坤太考生獲靈吟鑒荀道言此諸天中大梵隱語無量之音舊文刻書太微紫微水火二宫蒼玉靈崖之上以行天地四時水火之氣神化之書功不能名世問學士祈禳水旱隨法丹墨書隱文著壇四門以召隂陽之氣水火之祅臨人境為害向有處安之大吉字皆廣長一丈天真皇人昔書其文以為正音有知其音能齋而誦之者諸天皆遣飛天驛龍使者下觀其身書其功勤上奏神霄萬神朝禮地祇侍門大功三天命職洞玄道備剋得遊行三界升入金門此音無所不辟無所不祈無所不禳無所不度無所不成天真自然之音也故誦之致天吏下觀上帝遙唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響十方肅清河海靜默山嶽吞煙萬靈振伏招集群仙天無氛穢地無祅塵冥慧洞清大量玄玄也元始無量度人上品妙經卷之四十七

  text: 靈寶無量度人上品妙經卷之四十二
  hash: sha256:949aca32a7afd71c48a8619a8a1487f1e2ab8ce6d34ff41bcde2a6b6f6f263b6
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_042-001a, image: hfl/0009/0009-042.png}
body:
  text: 祈求嗣續慶延門閥品道言昔於太始廣生天中紫霄洞歌大福樂土受元始度人祈求嗣續慶延門閥妙品元始天尊當說是經周回十過以召十方始當詣座天真大神上聖髙尊妙行真人無鞅數衆乘空而來香靄浮煙翔鸞隨蓋赤光前擲瑶車轉雷縟彩仙雲絢葆千色洞煥太空七日七夜諸天海嶽交碧揚霞日月星宿凝明並照神風遠襲玉嵒露輝天翠髙虛絳氣飄衍一國地土山川林木鑑潔緬平仰矚毫髮重影沓見萬象同規土成柔玉紺青一色衆真侍座元始天尊玄坐空浮蘂珠寶臺之上說經一遍諸天大聖同時稱善是時一國男女悟識生根說經二遍定觀本元不落苦趣說經三遍咸知至道生育之宗說經四遍生逢聖運為賢哲士說經五遍心行孝慈善於養老說經六遍隂陽合德感化靈胎說經七遍得至法門生道不終說經八遍雖有受生不為愛欲持結淫想說經九遍曉解希微雌雄混合理參洞玄說經十遍一切有情永延嗣續慶流海宇福及幽明是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品始生雲芽玄露大神無鞅之衆浮空而至說經二遍南方無極無量品明性雲芽寶華大神無鞅之衆浮空而至說經三遍西方無極無量品大素雲芽感化大神無鞅之衆浮空而至說經四遍北方無極無量品神水雲芽定嬰大神無鞅之衆浮空而至說經五遍東北無極無量品受識雲芽明智大神無鞅之衆浮空而至說經六遍東南無極無量品縷絡雲芽攝用大神無鞅之衆浮空而至說經七遍西南無極無量品賢質雲芽主福大神無鞅之衆浮空而至說經八遍西北無極無量品陽運雲芽健育大神無鞅之衆浮空而至說經九遍上方無極無量品碧菡雲芽九宮大神無鞅之衆浮空而至說經十遍下方無極無量品靈藏雲芽復命大神無鞅之衆浮空而至十遍周竟十方無極天真玄化大神一時同至一國男女傾心歸仰悉悟道元傳立嗣續生化之基繼其本宗聮芳襲慶其生無窮來者有如細雨密霧無鞅之衆迮國一半土皆偏陷非可禁止元始大慈欲使無量衆生明識造化之先至道之奧所以妙極隱諱者為明雌一雄一之神偶而為爻混合百神徊煙散風化生真一即是人備至祕之道雖飛仙列真未得道時皆以雲珠下投金液玄妙感合生此靈胎神氣充備內顯真身無動之體開演祈求嗣續慶延門閥之法存念生根始由元氣元氣之精微細如纎粒於是懸一寶珠大如黍米在空玄之中去地十丈元始登引天真大神上聖髙尊妙行真人十方無極至真雲芽生化玉嬰真子大神無鞅數衆俱入寶珠之中天人仰看惟見拂拂從珠口中入既入珠口不知所在國人廓散地還平正無復欹陷元始即於寶珠之內化舍蓮胎嬰之相說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法嗣續昌隆福慶來臻全其本年無有中傷傾土歸仰咸行善心行惠行和行弱行化行悲行恕行儉行慈行定行仁言無唱宗口無佞聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心崇奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名生神育嬰隱韻之音亦是真魔內諱混化變胎以致嗣續慶延世系百靈之隱名也非世之常辭開闡大法明道根元初從胎育朱精白鉛和混萬過三一鼓舞玉飴哺靈流珠啓明帝妃儛賡紫胞坼落天嬰挺生號曰真一字曰精延為形之主百神之尊固道元命生道真身爾欲祈求賢嗣門戶亨榮使無絶氣與道無邊惟已得道大聖能悉其章誦之十過諸天遙唱萬帝設禮聖母破券司命定生監魂益善福慶駢蕃群魔束形鬼精滅爽回尸起死返胎更生至學之士誦之十過則天后衛房三界唱恭天機上相注命得生嗣續傳世慶延門閥濟度生厄絶而保完所以爾者學士外滌世殗內臻化淵童君捧箎女君奏塤聲和神布妙諱乃傳道胎靈孕嬰息自然召制十方保鍊胎仙克降嘉嗣無有夭殤輕誦此章身則被殃供養尊禮門閥慶延世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人無量為生道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到為爾開呈生録降嗣繼賢永大仙宗億曽萬祖幽魂苦爽皆即受度上升朱宮格皆九年受化更生得為貴人而好學至經功滿德就嗣孫應仙葉葉受道門閥慶延皆得飛升金闕遊宴玉京也上學之士修誦是經為諸生民祈求嗣績使生道不絶民獲有後祭祀祖玄隂德垂裕皆即受度飛升南宫世人受誦胄系錦昌則延壽長年後皆得作尸解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役冥官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齊誦詠是經析求嗣續慶延門閥感神真風火之君傳降台光使命得生智識明秀人中之英拔度上世亡魂斷地逮役升上南宫七月長齊誦詠是經祈求嗣續慶延門閥感金真黃室之氣傳降幽精使形得備宫室內固百神入胎身得神仙諸天書名黃籙白簡削死上生十月長齊誦詠是經祈求嗣續慶延門閥感太玄真一之精傳降爽靈使性徹寥漠慧通九冥懸知吉先與化同營為國王帝主祈請聖嗣璇蕚萬芳百靈稱慶普天䝉福安鎮國祚保天長存世世不絶常為人君安鎮其方民稱太平八節之日誦詠是經為諸絶嗣衆生降致道氣咸使有子克基其家得為九宫真人本命之日誦詠是經三元返嬰白捧凝神道父道母長守泥丸司命定藉伯華益年魂神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齊戒八室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐五色雲氣之中內外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室內項生圎象光映十方如此分明密呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齊清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引氣三十二過東向誦經元始無量度人上品妙經元始洞玄靈寶本章祈嗣慶門生化度人雌雄隱韻混合自然空生三氣氣變赤文元始祖劫化生諸天對明雙景是起天根傳氣立祖法道為身五文開廓五臟栖神上有天闕虛適群仙經絡血脉是為至靈威制萬類身備天經傳孕嗣續紹祖列孫祈求勝氣貴慶來庭胞胎受真羅列交纏碧縷貫瞳緑繒為筋定為仙宗應登髙玄體有朱志舌有錦文三萬六千神符繞身永輔帝化飛升玉宸下建民物皆著玄文流布大梵身中之天頭為蕭臺腦為玉山委曲九回宫室相連前有明堂赤鑑三君後有玄堂九祖七玄注記嗣續保慶家門元辰簡奏天馬驛傳定子注孫繼續本先方寸虛盈列坐髙真紫衣絳裳狀如天嬰節㑹溪谷皆為玉京百神㑹身大有妙庭金闕玉房森羅淨霐大行梵氣周回十方中有度人不死之神中有南極感降嗣續長生之君中有度世司馬大神中有好生韓君文人中有南上司命司録延壽益算度厄尊神回骸起死無量度人今日校録諸天臨軒東方無極飛天主福神王長生大聖無量度人南方無極飛天定生神王長生大聖無量度人西方無極飛天注嗣神王長生大聖無量度人北方無極飛天錫慶神王長生大聖無量度人東北無極飛天益算神王長生大聖無量度人東南無極飛天增品神王長生大聖無量度人西南無極飛天送生神王長生大聖無量度人西北無極飛天度厄神王長生大聖無量度人上方無極飛天進德神王長生大聖無量度人下方無極飛天輔聖神王長生大聖無量度人十方至真飛天降慶神王長生度世無量大神並乘輕霄流軿翠霞瓊輦星車羽蓋綺仗風輪驂駕碧鳳神虎蒼龍建萬華之節天騎靈旙前嘯九靈齊唱後吹八渟同嗚獅子飛天嘯歌噰噰五老啓途群仙翼轅億乘萬騎浮空而來傾光回駕降嬰度生南昌上宰天機丞相金闕侍郎大玄司命紫靈仙君韓司主録監生大神執籙把籍齊到帝前隨所祈應生息蕃滋計考命祿嚴校諸天普告三界無極神鄉泉曲之府北都羅鄷三官九府十二河源欲致貴勝嗣續綿綿上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼群元始符命時刻升遷北都寒池部衛形魂制魔保舉度品南宫死魂受鍊仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度三途五苦八難超淩三界逍遙上清上清之天天帝洞曜無色之境梵行東方八天十華招慶天帝洞覺好生勝宗益賢天帝定世茂玄澡明鍊光天帝陀明尚英龍種玉嬰天帝觀福廣營祖極承圖天帝妙無常生化樞運陽天帝肖真元昆歷符應台天帝果都祕空傳福佑生天帝納液合煙南方八天光動降識天帝知無垠辨息理明天帝務延宗康回遼澤天帝順子榮傳機宗道天帝情何靈孝始慶初天帝始育上求素開皓都天帝玉蘭齊瑰繪微延霞天帝寂仙自盈盟系靄豐天帝屹多裔暉西方八天景祈報慶天帝伯雲郁羅辨華棄欲天帝真交命神冥緘密陽天帝兆先祉包溫醴濯支天帝乘氣赴儀敦道亨成天帝握符通窈洞遘甫天帝力孟成日灌彩裔天帝鹿本太王九華含露天帝靜延定明北方八天冥婁總靈天帝孕咸同周料度正緒天帝寥持野舒積曜部俞天帝變蜞神綱雷第容天帝霞泮聰淨變卵珠天帝窮宅報恩述真祀常天帝管師遙寧默抱蘊和天帝揚嘉神英鬱華九微天帝醜並福完三十二天三十二帝諸天隱諱生化之機諸天隱名育嬰徽稱和陽合隂繼世嗣民神出空洞芒芽句茁自然靈章上真隱名召氣之音帝一胎尊結節之靈上𨽻真魔育嬰之仙九陽和真十隂合神命嗣榮耀門閥慶延無量之奧深不可詳敷落神真普度天人今日告祈受度歷關諸天請滅胎注斬絶邪祅誕子無殤命通太玄司命監舉無拘生門東斗禀氣西斗鑄形北斗降魄南斗賜魂中斗內主泥丸尊神七寶宫室窗牖分明神氣衝溢總監衆靈青帝護魂白帝侍魄赤帝養氣黑帝通血黃帝中主萬神無越青天魔王怒役威明赤天魔王變遷守真白天魔王憤擊虛成黑天魔王車轂玄冥黃天魔王持犯互爭五帝大魔萬神之宗飛行鼓從總領鬼兵麾幢鼓節遊行大空恍惚無常下入身中潜伏六根時巡九宫自頂達踵無不停容兆祈嗣繢願生天童淨蕩胎穢嚴攝北鄷神王受命普掃不祥玉女抱黃繡襦金璫聖毋護生福慶堂堂都吏甲馬捕災殃神吏甲馬斬付天綱擲火萬里流鈴八衝敢有厭魅拒遏胎嬰金鉞前戮巨天後刑屠割鬼爽風火無停千千截首萬萬剪形魔無干犯鬼無祅精三官北酆明檢鬼營不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列言上清元造開始龍漢延康體同人胎混沌相包眼為日月頭為崑崙眉為華蓋髮為山林腸胃江海呼吸風雲聲為雷霆出初光明眇眇億劫其氣澤淪上無復色下無復淵風澤洞虛金剛乘天天生地育外護百關金氣堅剛質疆姿頑立劫之初無幽無冥無形無影無極無窮溟涬大梵遼廓無光赤明開圖運度自然元始安鎮敷落五篇赤書玉字八威龍文保制劫運使天長存爾將降胎百神內存太一幽寥來過乂寧玉真徹視華蕚流芳紫脉降絡曲折靈文腦膜丹縷自然流雲固攝命根使命長生梵氣彌羅萬範開張元綱流演三十二天輪轉無色周回十方旋斗歷箕回度五常三十五分總氣上元八景冥合氣入玄玄玄中太皇上帝髙真泛景太霞嘯詠洞章金真明郁流響雲營玉音攝氣靈風聚煙紫虛鬱秀輔翼萬仙祈求嗣續繼先承門風回煙繞紫虛梵胞千和萬合自然成嬰嬰真有神長生大君太乙主生司命紀年桃康合體遘精丹田執符把籙保命生根上遊上清出入華房八冥之內細微之中永鎮人身泥丸絳宫中理五氣混合百神十轉回靈萬氣齊仙仙道貴生無量度人上開化源生如飛輪罪福禁戒宿命因緣普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有空洞謡歌之章真王靈篇辭參髙真第一欲界祈嗣迎慶之音人道維何子孫是佑祖幹孫枝英房實茂世當綿泒淵胄遠久積德賜賢嗣上帝垂慶延稔惡斷爾續衰薾淪重泉帝心本無私福報為善緣生民寡嗣孫黑籙在三天悔過祈至真首罪露誠丹司命赦刑籍玉女抱真還為爾千年後積善廣真源金車登紫庭慶積若丘山第二監生定嬰之章真一玄一合為天精飛露墮珠受胎為人和氣肇元形模乃全精延入勝知而能言識明真妙文武經綸為帝為王為牧為臣祖基為先嗣承厥後生道不泯長生妙有積德垂代慶系無垠念道思真至聖無親爰有簡籙福慧生民民亦何知謂天無神殺監貪嗔恣兆所行不知絶緒禍逮爾身天官執筆注其善功百子千孫祿食萬種兆能祈願醮禮仙公監生送魂九老降容使兆世其家生氣永不終故知道妙本太隂飛千龍第三玉帝聖子歌曰金闕絳霄飛龍繞嶽碧土紫房洞清寥廓帝有八子聖智神通長生大君赤日瞳朧青華東桑三天列封蓬萊仙王制命萬靈神璽玉䇿翠袍羽巾是皆上靈聖胄洪勳況爾下民貴繼其先杞祖奠宗慶延其門明不仰至教奏章敷玉文召氣得賢正祈為聖君臣道常愛生化連連無斷倫隂陽合太和剛風舉其身此三界之上飛空之中真王歌音音參洞章誦之百遍道氣充盈誦之千遍群仙監臨萬遍道備感激神靈生端潔士為世賢人進道功業舉形上升有聞靈音百神衛形勑制地祇出入送迎拔出地戶五苦八難七祖升遷永離鬼官魂度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈真王天機上宰垂系生民注定嗣續不斷孳育流通化源使生幾無盡自外得者後裔孫條孫枝擁茂自內得者雌雄神遇下接氣泉感生玉嬰禀受真正肖顏同體紹立仙宗身得神仙分形萬德幽栖方寸神遍十方隱祕之音皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寶祕於神霄玉清上宮運當下傳垂教乃宣若有至人齎金寶質心依舊格告盟十天然後而付焉道言夫善信之士嗣子未立先胄不繼門閥萎落或屢生女男夭殤不成才及幼孺便即淪沒凡有此災同氣皆當奏詞投欵祈懇上真齊心修齊六時行香十遍轉經福德立降嗣息生成慶延積世消諸不祥無量之文普度無窮道言夫末學道淺或福業未充祈求嗣續雖得生已未至成人多被夭害同學至人為其行香誦經十過以度夭殤如法魂神徑上南宮隨其善功復得更生為爾賢德之男慶延門第輪轉不滅便得神仙道言夫生民不知無後為大定信此身滅已緣盡未明大道以生氣無終世世不絶為本九玄七祖近世祖考廢泯時祀犯禁彌甚或年齒既大嗣續未立既常誕育不遂婚宦或生輒愚魯慧靈不開偶得成人不循四業所習凡下逺遊無方胎親憂憤弱稚縈疾治療無痊皆是父毋先世殃注訟呼所延悉當行香誦經祈求天司以招福慶夫齊戒誦經功德甚重上為人君祈嗣蕃衍下為兆庶延續家門生死受賴其福難勝故曰無量普度天人道言凡有是經能為帝主兆民行是功德祈求之日發心修齊燒香誦經十過皆諸天記名萬神侍衛右别至人剋得為聖君金闕之臣諸天記人功過毫分無失天中真主亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君撰元始靈書中篇東方八天緑應昭符黎學道蘇熙南允封契天合魚英晃爽夕麓素凝濡神贛誠布聿詔大魁鑒蹟匪回蘄永壽言帝澤寶有霄飛意冥道大真龍禳度沛度安祉變猷寀勝廣定南方八天綺命斗包子還戌髙天籍司枚福溱效嚴奚盧欣恚閲空辭彬洞咸幽計魂罔筵頥酎陳嶮縳鬼首樵肥鄒靈哿顏辨炳牛尼嶽驅機相玄省都微曜强注生監玄仰淵西方八天紀景靈定坤足邀明遙魔彥竪武箕婁魔洞洪寥濵元圖隱哥澤奕肆宗丘騎旻還縣禀列瞑億健由灘支務海洛冝勤棣般杳浦翹梭𣣱淇遍巒士浸蔚角秋火戈山北方八天酆程窅都支溪遄蕪歷真離周氐室傳俞勿落盤濯神鳳著騫槎皇卷鋤謹命瓛序依攸憫遷覺稠倣傞雲兖披灊孟阿邢何龜華異邊祕邈道琪神曹把筵仙碧露芝道言此諸天中大梵隱語無量之音舊文字皆廣長一丈司命大禁南宫上宰監生大神以鸞羽紫瞳之紱書於絳臺瓊房金墉之上以為正音大定生息道氣襲隆祕諱之要侍文玉童玉女各六千人俠以寶華覆以龍巾有知其音能齊而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天嗣續貴壽慶延門閥大勳仙曹保舉上真道備剋得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成天真自然之音也故誦之致飛天下觀上帝遙唱萬神惠澤三界普聞群祅東首鬼精自亡琳琅振響十方肅清河海靜默山嶽吞煙萬靈振伏招集群仙天無氛穢地無祅塵冥慧洞清大量玄玄也元始無量度人上品妙經卷之四十二

front:
  text: 靈寶無量度人上品妙經卷之二十一玄一
  hash: sha256:8ff805843004d950ddc001055394a1c75eaa3244353287b0640bd8a21895da88
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_021-001a, image: hfl/0005/0005-004.png}
body:
  text: 生化胎根斷除邪穢品道言昔於始青天中紫霄空歌太極玄土受元始度人生化胎根斷除邪穢無量上品元始天尊當說是經周回十過以召十方始當詣座天真大神上聖髙尊妙行真人無鞅數衆乘空而來絳煙捧塗華晶耀輦丹碧浮駕洞光羽輪五明錦色蓋映霞芳九氣合彩洞煥太空七日七夜諸天樓闕遙開玉毫隱顯星珠絡緯日景自停神隂舒輝金波泛滉璇璣玉衡還斡靈和注浹空海神風回混翠峯蟠偃天無浮翳四氣明清一國地土山川林木緬平一等無復髙下土皆作碧玉無有異色衆真侍座元始天尊玄坐空浮七宸九華明離寶座之上說經一遍諸天大聖同時稱善是時一國男女妙氣凝胎生根超秀說經二遍邪穢斷除結節通解說經三遍神棲空洞梵氣冥涵說經四遍骨有玉華顏揚金色說經五遍七世散仇福堂慶㑹說經六遍紫煙灌身百神愷樂說經七遍雄雌混化三一升遊說經八遍神光內映徹見百關說經九遍心悟洞靈證真帝臺說經十遍䇿名玉清侍宸金闕是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品青帝梁虛生化胎至真大神無鞅之衆浮空而至說經二遍南方無極無量品赤帝仲明賔除穢至真大神無鞅之衆浮空而至說經三遍西方無極無量品白帝詡成豫化胎至真大神無鞅之衆浮空而至說經四遍北方無極無量品黑帝元道冥除穢至真大神無鞅之衆浮空而至說經五遍東北無極無量品八景明微君化胎至真大神無鞅之衆浮空而至說經六遍東南無極無量品八景玄靈君除穢至真大神無鞅之衆浮空而至說經七遍西南無極無量品八景真華君化胎至真大神無鞅之衆浮空而至說經八遍西北無極無量品八景靈暉君除穢至真大神無鞅之衆浮空而至說經九遍上方無極無量品八景吟穴君化胎至真大神無鞅之衆浮空而至說經十遍下方無極無量品八景祕形君除穢至真大神無鞅之衆浮空而至十遍周竟十方無極天真大神一時同至一國男女傾心歸仰來者各相謂言元始天尊在始青天中演說生化胎根斷除邪穢之法我等自入流轉不出生死貪嗔愚癡墮在諸有雖福業因緣得生天上而諸天人愛迷執戀才捨塵染尚居細塵習氣不除動罹結滯感化胎元不得淨盡生根堅固著於不滅以住為本不知道體玄妙包養太空九聖十真本無生滅胎根未斷致此撓競互相變化遞為種族尸血流行骨壞形朽我雖天人未出三界形未獨化與道相隔縱使化身猶在色境故於相視接手語言音聲不契大洞使三尸蕩流穢血生瘕邪魔乘襲背遠真道今當傾聞法音匝繞天座億劫之衆一時同㑹非可禁止於是元始埀衣正視命黃素元君執方規之鑑天地真形支勢成字白素元君擊洞陽之鐘十方合響萬天交唱紫素元君埀浩景之珠大如𥞫米在空玄之中去地九丈元始登引天真大神上聖髙尊妙行真人十方無極至真大神無鞅數衆俱入寶珠之中天人仰看惟見勃勃從珠口中入既入珠口不知所在國人廓散天光輝映萬氣肅清元始即於寶珠之內說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度解散結節齗絶邪源傾土歸仰咸行至心忘纍忘有忘化忘得忘念忘情忘識忘動忘息忘形言無理宗口無欲聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是魔王內諱百靈之隱名也非世之常辭皆生化道胎清鍊胞根斷除邪氣斬滅血尸修真洞極之要言上聖已成真人通玄究微能悉其章誦之十過諸天遙唱萬帝設禮河海靜默山嶽藏雲日月停景璇璣不行群魔束形鬼精滅爽回尸起死白骨成人至學之士誦之十過則胎根生化無有世緣邪穢凋落百神合形五帝侍衛三界稽首魔精喪眼鬼祅滅爽濟度埀死絶而得生所以爾者學士邪穢漸消心未洞玄以制十方威未制天政德可伏御地祇束縳魔靈但得度身而已不能普濟萬生輕誦此章身則被殃供養尊禮門戶興隆世世昌熾與善因緣萬災不干神明護門斬經尊妙獨步玉京度人無量為萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到玄上丈人為兆解禀胎已來宿血瘕穢赤黑大滯西明君為兆解胞中積水腥汙尸鬼潢溺泉曲寒池之釁訟在水官考注不止連及生人生死之根災禍萌蘖不得興作使胎根生化玉液仙英妙姿自然得道七魄遊逸魔彭伺姦外構邪鬼淫犯胎宫夜夢燕樂與鬼同營太上玉帝以紫光九靈寶札詣南宫韓君丈人天機省中監簿按籍檢考善功生化胎根斷除邪穢億曾萬祖幽魂苦爽皆即受度上升朱宫格皆九年受化更生得為貴人而好學至經功滿德就皆得神仙飛升金闕遊宴玉亰也上學之士修誦是經皆即受度飛升南宫世人受誦胎根惡濁鍊化故氣尋得斷滅生化仙真邪魂穢魄淘澤清淨則延夀長年後皆得作尸解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死䝉惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齊誦詠是經上部九宫青帝羅文英執青宫之符開兆百關解散結節帝一內歡紫煙灌身神光洞照羽輝映玄為上世亡魂斷地逮役度上南宫天機省也七月長齊誦詠是經中部九宫白帝寓文升執素靈之符為兆生化胎根使斷凡因流轉停關邪正速分穢垢清蕩日霞瑩形太素生五臟七雲入泥丸身得神仙諸天書名黃籙白簡削死上生十月長齊誦詠是經下部九宫黑帝鄭文通執黑帝之符入兆膀胱中使胞胎尸滅百穢遏絶邪魔祅爽然骨瀝血兆體有五帝之玉暉面有流金之皓姿常與太一公寢魁抱明月為國王帝主君臣父子安鎮國祚保天長存世世不絶常為人君安鎮其方民稱太平八節之日誦詠是經得為九宫真人三元三宫二十七真雄一無英雌一白元五宫竒耦交變又玄生化胎根掃誅邪源孕精流光玉嬰生蓮帝一坐壇萬靈莫先本命之日誦詠是經十二大結三百六十骨節八關九宫神蓋童子中池內神感鍊變易生化胎根斷除邪穢使身不傾魂神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齊戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黃白三色雲氣之中內外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室內三部八景二十四真環衛嚴肅項生圓象光映十方如此分明密呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齊清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引氣三十二過東向誦經元始無量度人上品妙經元始洞玄靈寶本章生化胎根斷除穢氣十回度人百神定命離合自然雌一變魄雄一化魂混洞變化中有帝尊呼陽召隂鍊精玉胞升降明堂輝映景霄內結流珠融媾萬方紫霞素雲玉嬰金光絳闕神池宛轉泠風下有北都萬鬼之營青蠱白姑蝕兆胎靈赤黑二魔賊命之基帝君符告勑斬血尸洗淨胎穢與氣交并鼓治真元運化太冥上宫圓虛洞房玄丹明童持火焚燼邪根嬌女聞簫辟非和煙帝真胞命䇿名上玄靈府散朗位登髙宸鬱罷蕭臺玉山上京上極無上大羅玉清眇眇劫仞若亡若存下備一身主制七關三部八景森列萬神三華離便大有妙庭金闕玉房玄輝耀靈大布正氣周回十方中有生化胎根之神中有斷除邪穢之君中有混合百神之君中有解結散節之神中有變胎易胞之神中有南極長生帝君中有東極青華帝君中有天機韓君丈人中有南上司命司録延壽益算度厄尊神回骸起死無量度人今日校録諸天臨軒東方無極飛天定生神王長生大聖無量度人南方無極飛天感化神王長生大聖無量度人西方無極飛天變胎神王長生大聖無量度人北方無極飛天斷根神王長生大聖無量度人東北無極飛天易胞神王長生大聖無量度人東南無極飛天解結神王長生大聖無量度人西南無極飛天散節神王長生大聖無量度人西北無極飛天極真神王長生大聖無量度人上方無極飛天去邪神王長生大聖無量度人下方無極飛天除穢神王長生大聖無量度人十方至真飛天神王長生度世無量大神並乘翠霞三景瑶輦素雲十華丹輿羽蓋瓊輪驂駕朱鳳五色玄龍建九道招神之節七絶霜羅之旙前嘯九鳳齊唱後吹八鸞同鳴靈真導前吟詠洞章群仙景從嘯歌嗈嗈億乘萬騎浮空而來傾光回駕感化定生天機丞相南昌上宫韓司主録監生大神為兆胎根生化玄靈胞門紫房中有大神叩玉鳴鐘擲火流鈴滌盡氛穢去血尸彭結節赤黑二十四關布兆生氣除却邪紛執籙把籍齊到帝前隨所應度嚴校諸天普告三界無極神鄉泉曲之府北都羅酆三官九府十二河源上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼群元始符命時刻升遷胎根生化返塵歸真斷邪除穢招鎮百神七祖散仇五帝監盟北都寒池變化形營鍊骨成仙出入無門制魔保舉度品南宮死魂受符仙化成人生身受度劫劫長存隨劫流轉與天齊年永度三塗五苦八難超凌三界逍遙上清上清之天天帝奎零無色之境梵行東方八天至真堂回天帝輝離無生虛洞普搖天帝賀真彌倪逺師崇濟天帝淵虛子鋹皓景環宗天帝相雲孳光略無燕神天帝爼司越章牛岵兆壷天帝直盧奚敦妙宮蔽無天帝亮辨由都顧靈定度天帝康化治衍南方八天喬繁麗空天帝變無元昌持命典仙天帝覺玄覽常元師究由天帝寂度孟斗霸澤回華天帝理名正騫太素夷微天帝廓益遼真序乾標谷天帝羊輅國賔道表臻祥天帝麓錫來冥轉運邦天帝慶祖辭仁西方八天龍玄胎神天帝車梁賜蒂丘定漾氣天帝頥窮景冲昭力支羅天帝九用茲瀛孝至岡虞天帝極根環元洞化寶陽天帝玉汴自檀靈緒混甘天帝産珠凝方救牢拔塗天帝蔽山都真流曜絳章天帝晉關肇宣北方八天耿易火帝天帝强完明華意寶聚真天帝百憩隂成溉本歷孚天帝知玄得容河陳肆師天帝榖原彥升鑄精育神天帝交鈴紫肆胞命元化淨光天帝秀隆幽虛芒兟欲度天帝並氣壷完觀竺吉猷天帝正𤤠寂仙三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻洞真之音洞無之尊洞觀之神攝制大魔變化神靈臭肺吞賊與天同生飲血搖精濳伏胎根使命夭閼仙道不成尸鬼改易飛身泥丸隱藏胞蒂隂構外邪入登玄窗薰亂宸霞上帝斬摧神燕玉堂九和十合變化空常無量之奧深不可詳敷落神真普度天人今日欣慶受度歷關諸天解散結節斷絶胞根飛度五戶名列太玄魔王監舉無拘天門東斗延生西斗鍊胞北斗除穢南斗仙胎中斗混洞一合生神青帝徊風白帝命靈赤帝保根黑帝澡形黃帝守中胎穢不生青天魔王鬱珠洞羅赤天魔王炎光滅精白天魔王斷胞交真黑天魔王伐邪命神黃天魔王洞觀太英五帝大魔萬神之宗飛行三界總攝真胎揮邪命靈七關廓開流布妙化上變九回穢滯既蕩骨肉同飛天真承命召致福祥真功內充神威外張凶祅殞息邪精伏藏浩氣纒結三丹玉房共輔帝化却滅凶衰六天大醜豁落誅摧金光散景玉道交馳拔度七祖𢷤絶百非三官黑書永落禍基不得容隱明正元機普告無窮萬神總歸遊宴玉闕列言太微空
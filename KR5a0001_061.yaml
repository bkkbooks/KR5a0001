front:
  text: 靈寳无量度人上品妙經卷之六十一洪一
  hash: sha256:5c5933ff7263c3ca45d857334544f6e8c166a6ca9c7c61221cf5bef76d64b5ae
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_061-001a, image: hfl/0013/0013-004.png}
body:
  text: 永斷輪轉品道言昔於始青天中大浮洞歌玄明黎土受元始度人永斷輪轉无量上品元始天尊當說是經周迴十過以召十方始常詣座天眞大神上聖髙尊妙行眞人無鞅數衆乗空而來玉馬雲軺彩霞流靄丹輿彤轂陣蕚飛香三景蔚清合映太空七日七夜諸天日有龍文月呈寳字星樓鶴觀宿舍機𨇠一時停輪龍風兼雨鳳氣成山天無浮翳四象髙明一國地土山川林木緬平一等無復髙下土軟紫金外涵水火淨瑩交徹無有異色衆眞侍座元始天尊玄坐空浮無色海光之上金山不動瑞相儼如說經一遍諸天大聖同時稱善是時一國男女見道眞形猒捨生死說經二遍覺悟三業猶彼火聚說經三遍觀身穢壞願證法體說經四遍悲憫三界轉覆如輪說經五遍世間妄見回念正道說經六遍道可飛神不染麤惡說經七遍自知宿命不貴通靈說經八遍住此眞常永斷輪轉說經九遍壽過天地得眞長生說經十遍證位昇玄永無生化是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方无極无量品多聞大神無鞅之衆浮空而至說經二遍南方无極无量品多目大神無鞅之衆浮空而至說經三遍西方无極无量品堅住大神無鞅之衆浮空而至說經四遍北方无極无量品定海大神無鞅之衆浮空而至說經五遍東北无極无量品神用大神無鞅之衆浮空而至說經六遍東南无極无量品權化大神無鞅之衆浮空而至說經七遍西南无極无量品道聦大神無鞅之衆浮空而至說經八遍西北无極无量品玄藏大神無鞅之衆浮空而至說經九遍上方无極无量品永生大神無鞅之衆浮空而至說經十遍下方无極无量品息化大神無鞅之衆浮空而至十遍周竟十方無極天眞大神一時同至一國男女傾心歸仰於所住天所居宮殿咸見元始升座威儀說經演法无量十方光明照見宫殿赫如朝日各相謂言我等位證諸天未岀輪轉壽過五劫未免生死身相光明未免衰滅今聞天尊欲說大法永斷輪轉始得開悟入眞法門出生死網來者有如細雨宻霧無鞅之衆迮國一半土皆偏䧟非可禁止於是元始振衣凭几頂出大明普照十方世界無極仙眞國土一一國中見諸僊王將引臣從來赴法席又見諸天各持竒華異果玉芝仙草以爲供養有諸仙王居大宫殿而修仙業領理天政心猒欲樂或奔采光華嚥味眞景勸敎諸眞種種妙事會中天人心知目矚不敢陳議元始徐啓雷音遍告大衆欲免生死不入流浪先當無心爾若無心即無三業衆生迷妄指識爲心分别有無計度生死心本妄名以妄取名心則虚幻覺了能知本是道元何關心事認心著境即住生死若無妄心不住生死即永斷輪轉乃至諸大天僊髙眞帝王以無心故證位聖眞自然得道依心取捨趣死趣生終非究竟乃至服氣鍊化餌藥延年並爲小乗功用感應皆非解脫昇入無形之道爾若不爲心所遷易隨念用情心迹兩忘即見道體永斷輪轉不住生死與我今者在此無色海光說如是法若以有心則一切護法天人龍鬼悉各逺離不應來此頂禮欽奉故知無心是道眞形是無等法則身所行事十聖莫知口所出言是天帝勑心若計度則魔精來附終歸惡道元始忽從海光混入無色太玄空中懸一寳珠大如黍米在太虚之中去地千丈元始登引天眞大神上聖髙尊妙行眞人十方无極大道威神無鞅數衆俱入寳珠之中天人仰看惟見拂拂從珠口中入旣入珠口不知所在國人廓散地還平正無復欹䧟元始即於寳珠之内說經都竟衆眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得開悟玄黙虚明不著空見傾土歸仰咸行善心不殺不害不嫉不妬不淫不盗不貪不欲不憎不𡜍言無華綺口無惡聲齊同慈愛異骨成親國安民豐欣樂太平經始岀教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝内名隱韻之音亦是眞王内諱百靈之隱名也非世之常辭上聖已成眞人通玄究微能悉其章誦之十過諸天遙唱萬帝設禮雲烟靜黙海嶽深靈二象澄廓三景輝明一切有情心契眞道永斷生死輪轉休停至學之士誦之十過則五帝侍衛三界稽首魔精䘮眼鬼祅滅爽神飛形固遂其永生所以爾者學士穢氣未消體未洞眞召制十方威未制天政徳可伏御地祇束縳魔靈但濟兆身而已不能普度群靈輕誦此章身則被殃供養尊禮門户興隆世世昌熾與善因縁萬災不干神明護門斯經尊妙獨歩玉京度人无量爲萬道之宗巍巍大範徳難可勝道言凡誦是經十過諸天齊到三界停輪兆得至眞明曉生根不著有無不滯亡存若有大物爲生死門兆無物相混洞不分永斷輪轉與道杳冥億曽萬祖幽䰟苦爽皆即受度上昇朱宫格皆九年受化更生得爲貴人而好學至經功滿徳就復歸無名出離隂陽無犯剋并不屬生死永斷輪轉變化不化更生不生與道合體皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經皆即受度飛昇南宮世人受誦則延壽長年廓爾得悟玄解之道神識不昧應物無窮即得運形遊觀太冥此經微妙普度含靈一切天人莫不受慶無量之福生死蒙惠上天所寳不傳下世至士齎金寳效心盟天而傳輕泄漏慢殃及九祖長役考官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齋誦詠是經契道眞極止息生機於諸天中無去來因不住滅定得大乗門爲上世亡䰟斷地逮役度上南宮七月長齋誦詠是經惡心消解仇對和平不爲人縁徃返相因寓形黜明元精天成不死不生身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經不住永滅不欣長存乗物以遊爲光爲塵示兆大慈无量度人出教演法寳書天經爲國王帝主君臣父子安鎭國祚保天長存世世不絶常爲人君安鎭其方民稱太平八節之日誦詠是經挺然獨觀八風無傾兆出死生駕馭瓊輪得爲九宮眞人本命之日誦詠是經眞氣虧盈不亡不存永斷輪轉逍遙妙庭䰟神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿徳就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐黃緑青赤蒼黑碧紫白九色雲氣之中內外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右頭上有无无上眞道君頂七曜交泰寳冠面若瓊瑶方瞳素髯威耀光明身被緑霞絳章飛裙手執神劒斷生死魔三天殺鬼乗紫素雲住立嶷然身長九尺上應九眞日月照明洞煥室内項生三氣圓象光映十方如此分明密呪曰无上玄无太上道君召岀臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋清堂修行至經无量度人願所啓上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始无量度人上品妙經元始洞玄靈寳本章永斷輪轉周迴度人洞眞隱奥縁起自然赤混靈根空無化成太虛朗徹肇生諸天流演三氣大機彌綸中有虚皇是爲我身玄文散落普育萬靈赤景爲陽黃華爲隂圎光森列羅布諸星太一紫房瑤簡緑編啓運元造玄中之玄圎羅大梵靈闕瓊宫下包黃氣洞淵綱維眇眇蕩簜六闢九開招靈化人體備百關神變無方與道俱隆顧盻八垣端居玉京中有玄極至道之尊中有主生象帝之君中有開天龍蹻大神中有九皇天眞丈人中有把握元紀斡運機紐至妙尊神生成二象无量度人普告一切悟道之元永斷輪轉得爲種民今日校録諸天臨軒東方无極清信神王長生大聖无量度人南方无極明感神王長生大聖无量度人西方无極堅立神王長生大聖无量度人北方无極海空神王長生大聖无量度人東北无極聖仙神王長生大聖无量度人東南无極妙慧神王長生大聖无量度人西南无極定常神王長生大聖无量度人西北无極證眞神王長生大聖无量度人上方无極無影神王長生大聖无量度人下方无極不迴神王長生大聖无量度人十方至眞飛天神王永斷輪轉无量大神並乗瓊光緑雲八景琅輿丹霞玉輦驂駕碧鳳九色神龍建交眞之節素虎靈旙前按九章齊奏後吹六竽同鳴普鸞白鵠和鳴噰噰九靈控飊七眞乗烟謡歌歩虛浮空而來傾光迴駕召生命仙南昌上宰總御朱宮韓司主録堅固大神執籙把籍齊到帝前隨所應度嚴校諸天普告三界无極神郷泉曲之府北都羅酆三官九府十二河源守識本眞悟見自然無有生死不著變遷道無去來形爲寳山智火鍊之金光玉混比之晝夜日月常懸徃還非妄眇眇綿綿法體虚明象外眞仙永斷輪轉昇入太玄上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼羣元始符命時刻昇遷北都寒池部衛形䰟制魔保舉度品南宮死䰟受鍊仙化成人生身受度劫劫長存永斷輪轉先天無年永度三途五苦八難超凌三界逍遙上清上清之天天帝洞光無色之境梵行東方八天玉娑平海天帝豪眞秉符驕炎祥備天帝思順孝猷雲碭龍磧天帝景命混圖驪性希矇天帝齊丘緑符鎭相液誓天帝古威罕常嶽樊膏汀天帝兆籍監王凝仙鹿觀天帝幾道元光斗浦玄司天帝蕩淵慈宜南方八天崿鱗飛機天帝廓洞自幽洞炎赤圭天帝息覺除營陽祁正父天帝杳晶皓黄金律整靈天帝弼由肅沙烏稷無變天帝宻覩思微神歸合明天帝蹈靈防离太元機省天帝擇仝施虔校録定眞天帝育韓籌冥西方八天明玄聖皇天帝直義伯鑾曲生司世天帝幽都仙總梵極元天帝閬騎遐非玄化典法天帝祖定延眞刑籍眞筭天帝長靈度耽華皛慶霄天帝玉誕昌妙眞德女天帝九濟道戸列星交微天帝應大法謡北方八天孕䰟敗臼天帝遷洞伏機卵化液流天帝遵犠眷雷温胞育陽天帝洞混光臨媾玉中華天帝括保命生池隂鎻神天帝師火交侯太極抱愛天帝道眞欲化諱津人山天帝敵利寳龜丹精朱闕天帝妙華玉剛三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻元始之音無形之尊不轉之神超象眞魔斷妄之靈和合岀流脫離化源永住諸輪變化上清无量之奥深不可詳敷落神眞無三界因今日欣慶受度歷關諸天請滅三惡斬絶地根永淨六染名列太玄眞王監觀無拘天門東斗發生西斗義成北斗存道南斗降靈中斗運神九老三眞青帝巧量白帝堅登赤帝通化黑帝淵清黃帝中極指呼萬神青天魔王以文定名赤天魔王知識散精白天魔王罪惡司刑黑天魔王智用乃分黄天魔王大宗非聲五帝大魔生死元雄飛行鼓從總領威兵麾幢鼓節遊觀太空軍騎赫奕佐天舉功永斷輪轉嚴攝北酆神功受命普掃不祥八威吐毒猛馬四張天丁把斧大帥持旙擲火燎焚流鈴四揚敢有干試拒遏上眞金鉞前衝巨劔後刑屠割鬼爽風火無停千千截首萬萬翦形魔無干犯鬼無祅精三官北酆明撿鬼營不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列言上清元洞己迹紹曆龍康眇眇億劫輪轉無常劫終劫始太空難量恍漫不期混沌之中上無無色下無無淵風轉九虚金景定天天上天下無幽無冥無形無影無極無窮溟涬大梵遼廓無光不名生死無有去來三界輪轉皇道流行六氣變化忽合忽離神依靈寳永固精根赤明開圖運度自然元始安鎭敷落五篇赤書玉字八威龍文保制劫運使天長存梵炁彌羅萬範開張元綱流演三十二天輪轉無色周迥十方旋斗歷箕迴度五常三十五分總氣上玄八景冥合氣入玄玄玄中太皇上帝髙眞泛景太霞嘯詠洞章金眞明郁流響雲營玉音攝氣靈風聚烟紫虚鬱秀輔翼萬仙千和萬合自然成眞眞中有神神無方體道寓姓名乃號南極太微長生大君無英青華白元素眞太一始生司命筭程桃康合延致兆有生生爲死本輪轉不停道初無爲豈毀豈成是爲仙眞養教種人執符把籙保命生根上遊上清出入華房八冥之内細微之中下鎭人身泥丸絳宫中理五氣混合百神十轉迴靈萬氣齊仙仙道貴生无量度人上開八門飛天法輪罪福禁戒宿命因縁普受開度死䰟生身身得受生永不輪轉上聞諸天諸天之上各有眞靈中有空洞謡歌之章眞王靈篇辭參髙眞第一欲界飛空之音天道朗朗鬼道䝉䝉人道杳杳沈滯輪回仙道樂兮太虚爲家男女相牽纒我界居其多聲色昧靈府頑空張綱羅濁海流巨浪塵山鬱嵳峩但能録其惡安能遏其邪遇我虚皇尊演此大洞篇頓然爲種民色景何足過憫嗟曠劫迷空中起悲歌茫茫愛欲徒不悟當奈何第二色界眞王之章峩峩無極山上有飛天宫羽衛羅億千我得治其中朝遊大有庭丹輿駕靈風夕歸校録府眞仙執瓊編返神入太空下觀諸天民自然浩劫來身猶染輕塵未得斷輪轉安能忘色根一聞空洞章合體皆虚明息念七寳林濯身天河津永契皇極道稽首禮天尊第三無色界眞王歌曰蕩蕩龍漢眇眇赤明皇極生神無形無名始立三界我居其尊統制一切攝御衆靈曠朗諸天境域四開縁習未斷猶有傾隤乗運促會得升列眞元始敷化大演眞機此道堅固悉入無爲旣悟絶輪轉大福享爾身何慮麈沙劫天地應不傾靈光散十方齊爲白玉京此三界之上飛空之中眞王歌音音參洞章誦之百遍名度南宫誦之千遍群眞保迎萬遍道備飛昇太空過度三界位登仙公有聞靈音三官敬形勑制地祇侍衛送迎拔出地户五苦八難七祖昇遷永離冥關䰟度朱陵超度死生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及神霄玉清眞王隱祕之音兆能誦之見道全體洞入無名得悟證眞永斷輪轉皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奥難可㝷詳上天所寳祕於神府東華藏室依玄科應運下傳若有至人齎金寳質心依舊格吿盟三天然後而付焉道言夫天地運度亦有否終日月五星亦有虧盈至聖神人亦有休否末學之夫亦有疾傷凡有此災皆氣數窮極徃來始終輪轉三界諸幻所生同氣皆當齊心修齋六時行香十遍轉經福德立降消諸不祥无量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太隂臨過之時同學至人爲其行香誦經十過以度屍形如法䰟神徑上南宫隨其學功計日而得昇玄不入輪轉便得神仙道言夫天地運終星宿錯度日月失昏四時失度隂陽不調國境不稔疫毒流行兆民死傷師友命過悉爲有世之患刑傷之災皆當修齋行香誦經眞道内著永斷輪轉超出三界却滅刑災神靈聞之即當消解夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受頼其福難勝故曰无量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衛右别至人剋得爲聖君金闕之臣諸天記人功過毫分無失天中眞王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語无量音元始靈書中篇東方八天騤䗁禹崿元佐句野河魁杜軍華侯張化沙洛維晃鏹神劉師勑周靈采石完天眞陸髑附䰟符驅隂名祭賚謹戒護救齊仁約誠奠私呼應合倫意通使捷丁威昵鄰南方八天闔闢谷玄妙液交瓘混氣接心道囿時㑹和迫知微兊意洪施換忽眇漠玄諱德宜洞清絶徃介尸端期邈黙外世天眞俯擕雙路並遷由夷指馳歸畢空冲鬼路幽機西方八天祖瑑開宗氣根霞龍梵演洞乗恢化光容仙露昇格丹想文封怪悟異生水激火攻壽隱解遙遵叩祕濛守嚴修隆道㖟普風隨舉觀代繼軌述從善教屏邪權示玄籠北方八天一晶萬瓣生幾空常力弊紹新化代周遷旋易旺弛輻轉𨓜連昧無動玄匪知鄙天泯斬繁職圓廓獨空變回寔住圖析來還曷岀俄居恍字厥如泮微祈醜混罔勿規道言此諸天中大梵隱語无量之音舊文玄都九老仙君以黄櫨漆液書於劫門帝闕之上至眞之人岀三界離十方必登劫門詠中篇以升無形下世末學住生死流居小乗位不誦其文則地官録其形質天司禁其魂爽取道暗杳不知至玄能味靈文中池之神告兆無極開大明於慧牖豁見海於定都也字皆廣長一丈天眞皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勲十眞保舉上清道備剋得遊行三界昇入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致三天下觀上帝遙唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響十方肅清河海靜黙山嶽吞烟萬靈振伏招集群仙天無氛穢地無祅塵冥慧洞清大量玄玄也元始无量度人上品妙經卷之六十一

front:
  text: 靈寶無量度人上品妙經卷之二十七玄七
  hash: sha256:5905d2ab2c62e4232271d345e8e53a0ae291f8ec0b057482e0483fa266c40cc1
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_027-001a, image: hfl/0006/0006-046.png}
body:
  text: 紫光丹靈品道言昔於大丹天中絳華虛歌太玄景土受元始度人紫光丹靈無量上品元始天尊當說是經周回十過以名十方始當詣座天真大神上聖髙真妙行真人紫光丹靈元化大神無鞅數衆乘空而來飛霞浮霄琅輿寶輪玉蓋埀䕃絳雲藹虛五色蓊蔚洞煥太無七日七夜諸天靈關日宫月府騰耀凝輝瑶闕層城通明瑩徹星綱回運五斗舒光九道散飊碧壘交纒寶圓泛景天貫飛煙一國地土川谷林藪緬平一等無復髙下土皆變紫瑶無有異色衆真侍座元始天尊玄坐空浮九色寶華丹耀飛瓊之座說經一遍諸天大聖同時稱善是時一國男女道性開通了悟玄妙說經二遍神府流珍玄泉泛液說經三遍妙範宣微密周衆體說經四遍雙景朝元玉關合㑹說經五遍洞神應變生化自然說經六遍沖和降繞形極仙真說經七遍靈功逺逮開濟祖先說經八遍天尊身光上騰大羅下降九淵長夜停悲寒宮罷對說經九遍鬼官考吏升補仙階說經十遍三界之下一切衆生皆見紫光丹靈之道是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品青元大神無鞅之衆浮空而至說經二遍南方無極無量品太丹大神無鞅之衆浮空而至說經三遍西方無極無量品皓素大神無鞅之衆浮空而至說經四遍北方無極無量品玄光大神無鞅之衆浮空而至說經五遍東北無極無量品鎮靈大神無鞅之衆浮空而至說經六遍東南無極無量品流飊大神無鞅之衆浮空而至說經七遍西南無極無量品神金大神無鞅之衆浮空而至說經八遍西北無極無量品天垣大神無鞅之衆浮空而至說經九遍上方無極無量品圓羅大神無鞅之衆浮空而至說經十遍下方無極無量品沖妙大神無鞅之衆浮空而至十遍周竟十方無極紫光丹靈大神一時同至一國男女傾心歸仰各相謂言我初聞經即悟神丹真氣灌鍊合體通明微妙道範永證仙真來者有如繁星積霧飛雲細麈無鞅之衆迮國一半土皆偏陷非可禁止於是元始懸一寶珠大如𥞫米在空玄之中去地五丈元始登引天真大神上聖髙尊妙行真人十方無極紫光丹靈大神無鞅數衆俱入寶珠之中天人仰看惟見勃勃從珠口中入既入珠口不知所在國人廓散地還平正無復欹陷元始即於寶珠之內說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸得至真養氣養神養元養精養志養妙養慧養形養生養性光華被體靈丹告成齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有志心奉禮恭敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是上真內諱列聖之隱名也誦詠之者紫光內映丹靈輔魂玉丹餔飼太一降真非世之常辭上聖已成真人通玄究微能悉其章誦之十過諸天遙唱萬帝設禮合景升玄丹靈捧雲內化日月俠侍星辰群魔束形鬼精滅爽回尸起死白骨成人至學之士誦之十過則五帝侍衛三界稽首魔精喪眼鬼祅滅爽濟度埀死絶而得生所以爾者學士穢氣未消體未洞真以制十方威未制天政德可伏御地祇束縳魔精但感丹光度形而已不能更生輕誦此章身則被殃供養尊禮門戶興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉亰度人無量為萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到心丹自靈紫光保身億曽萬祖幽魂苦爽皆即受度上升朱宫格皆九年受化更生得為貴人而好學至經功滿德就皆得神仙太一玉丹賜兆長生飛升金闕遊宴玉京也上學之士修誦是經知覺性明元命歸神玉丹濳符紫光騰凌皆即受度飛升南宫世人受誦則丹津自生流注胎神延壽長年後皆得作尸解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役冥官侍經五帝玉童玉女各三十二人營衛神文保護受經者身道言正月長齊誦詠是經紫光丹靈陽德度冥玉丹九回七世成真為上世亡魂斷地逮役度上南宫七月長齊誦詠是經紫光丹靈真道歸體能屈能伸身得神仙諸天書名黃籙白簡削死上生十月長齊誦詠是經紫光丹靈太一授書玉丹護真為國王帝主君臣父子安鎮國祚保天長存世世不絶常為人君安鎮其方民見太平八節之日誦詠是經紫光丹靈爐開八門鼎有九宫太一為尊得為九宫真人本命之日誦詠是經紫光丹靈悟兆元命得為真人魂神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齊戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐紫赤黃三色雲氣之中內外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右頂上紫光內有太一玉丹赤光如日大如彈丸捧在神雲之內日月照明洞煥室內頂生圓象光映十方如此分明密呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齊清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引氣三十二過東向誦經元始無量度人上品妙經元始洞玄靈寶本章紫光丹靈上品妙首九轉度人太一隱韻玉丹自然混洞赤晶華元上真生育天地造化群靈太有玄宮耀光彌綸開導九淵交絡天根太一蔚微萬物生神熒熒丹景圓照通明外連四虛包含玉嬰元始大劫五緯流形是為靈瑞紫極髙清鬱嶽蕭山太上玄亰上通圓曜瑶闕飛精神運廣筵昌玉純英方臨帝仞元化開生太微明堂青霞碧城安鎮十方貫氣八冥下連列宿降妙群星巍巍上帝安坐玉垣中有紫陽大範之真中有光飛玄極之君中有丹華符應元君中有靈通上妙真人中有開天化氣司生司育九微八道皇老尊神丹靈上範宸極度人載天持地列聖開生共宣洪化度劫回津今日降鍊萬神臨軒東方無極紫光丹靈神王長生大聖無量度人南方無極紫光丹靈神王長生大聖無量度人西方無極紫光丹靈神王長生大聖無量度人北方無極紫光丹靈神王長生大聖無量度人東北無極紫光丹靈神王長生大聖無量度人東南無極紫光丹靈神王長生大聖無量度人西南無極紫光丹靈神王長生大聖無量度人西北無極紫光丹靈神王長生大聖無量度人上方無極紫光丹靈神王長生大聖無量度人下方無極紫光丹靈神王長生大聖無量度人十方至真紫光丹靈神王長生度世無量大神並乘紫光飛雲丹霞寶輿緑璟神輦方蓋圓輪驂駕白虎緑鳳丹鸞建八元神節明飊羽幡前列三天大仗後從朱陽萬兵鬱單玉真遊空步虛三師啓塗九仙捧轅億乘萬騎浮空而來傾光回駕錫丹度生統仙丞相太極元宫九垣玉輔皇老大神執簡持章齊㑹帝宸俯閲教科下頒幽扃變化梵氣周流五行隨所飛奏開導諸天普告神洲仙境靈鄉洞天福地海嶽河源三元曹局九淵化城關紐綱維閬風昆崘瑶闕三真玄華帝臺劫仞彌羅大經玉輪元皇詔命時刻飛升開度先祖受對苦魂逍遙解脫隨光上賔玉眸鍊質素暉蕩形上登流火仙變生身合景太霄與運長存因緣輪轉劫劫無傾永斷衰凶勝伏尅害之厄超凌玉虛受化洞隂過度生關飛神絳垣之天天帝洞丹無色之境梵行東方八天旌房簡宫天帝伯弓思臧慶德昭符天帝正車燕良用靈希祕天帝契岸孔沖求玄潔聞天帝持時明利陽開華天帝招仙圖休勝穆問宗天帝叔洪藴都降華極光天帝規童倚賢寵猷清儀天帝梁部央畸南方八天紹經師濟天帝靜敷樂襄火洞薦隆天帝勑陀除魔耀神司丙天帝華魂録靈特靜淪化天帝確啓紋嵩廉聖廣明天帝謁通俟㑹極陽逺靈天帝將維卑光純修至感天帝兆用無兼杳冥普居天帝黨南式回西方八天光遼慈息天帝蒙擊還俅神耀總靈天帝顓多鄰洙碧蕚璇珍天帝鐸妙田并定籍朱宮天帝胡堂祕公虎章考録天帝阿韓吕全太無真首天帝儲能捨祇録皇寂根天帝淪仲息完平虞夙野天帝資緣景班北方八天玄晨昌化天帝獨勤王真極康庸天帝離文逸恭備神息尤天帝釋乾次開道覺遊靈天帝奠玄池侖瑶虛漢霞管真天帝達匪報祥霄墟歷皇紫光天帝略淵詞皋文欽哲員天帝格涂玄昌都萬華秀宗天帝冒嘉龍周三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章太一隱韻丹靈之音丹靈之尊紫光之神紫光玉垣正憲丹靈六運十飛變化九清無量隱妙神不可量敷落三華普度天人太一玉丹化育生民民有元命實丹之靈奕奕紫光入體生真以劫為晝生滅無輪授書玉臺招真命神今日欣慶受度歷試萬天請滅種惡斷絶胎根飛運五行上列太冥御省注籍紀功仙官真王監察過度天門東斗保生西斗降神南斗注籍北斗化精中斗混合紫光丹靈青帝順行白帝司金赤帝炎耀黑帝主成黃帝立極正氣交并化生寶丹九道鬱凝青霞神王覺除虛開赤霞神王孟都昌期白霞神王玉光凌罙黑霞神王紫扉密回黃霞神王金郯靈晞五方神王萬氣之宗佐天丹靈飛行九宫持幢仗節遊化髙空紫光赫奕列聖齊功上天濟生開度北酆神王受命掃蕩不祥青龍左持白虎右張朱雀前驅玄武後防四象纒結丹符洞章擲火流鈴揮擊十方敢有妖魅干我黃房玄鉞斬滅天吏定刑屠割鬼爽風火飛騰千千馘首萬萬誅形魔無考試鬼無祅精三元九司嚴校雲營不容怠縱飛章奏呈普告三界諸地八冥九宫玄師言功太清靈符大籙太上真文三光妙氣浩劫生成昆崘玄嶽巨液之明開張玄化火耀金升赤白既顯元神鬱凝天廓澄高覆周九冥太一王境為丹之靈上連下接非色非淵風轉至隂虛動神源源神合道植立億天天上天下泛景浮沉元光浩蕩玉極無形溟涬太一玄丹赤明皇運金華景晶彌綸宣布洪亰元始瑶篇赤書寶符合氣成仙安制九方使命長延梵氣騰飛包絡交纒紫光散分為緯為經元風流演三十六門輪轉太虛周結生根旋紐歷綱回度飛輪六十九氣總御三元二景冥符氣降玄泉玄泉太真帝道洪軒八威萬華安鎮綿綿七關四維與天齊并絳霄鬱單輝映無傾皇一三帝大洞徊風伯史育嬰千景玄童千交萬和自然成真真中有神萬境居尊紫光真人丹天上靈長生大帝青華玉君太一務猷司命無英白元赤子制魄拘魂桃康合延布氣營精執冊運關保度天民上遊清微內居琳琅太極寶洞大經明堂下鎮人身六府五宫中理百神混合飛空十詠洞章與氣俱仙道貴真丹紫光度人神爐八門運天三輪陳羅禁戒宿化因緣咸獲開濟無量生身身得受生舉形上升升入玉垣俾各應丹靈大勳群魔吟詠謡音九華隱篇辭參高真第一紫光丹靈飛空之音天谷靈泉真光絳煙飛霞挹芒雲周九淵回繞昆崘萬景合仙升騰紫虛灌鍊交纒妙有空無降氣玄丹玄丹化生無極真關九道神輝下燭酆山真功昭著開度七玄采輝登晨飛升玉軿金華變體遊行八騫永超神府大福綿綿第二紫光丹靈仙王之章天垣玉霞九和育嬰丹章上道宸極珠英太華大寶化為玉亰玄元祖範紫光煥明人有元象中藏至精變化沖妙升入皇寧元始真氣肇立生根青琅丹碧徊水玉晶濯羅結璘絳天奔星周旋三景流飛火鈴蕩蕩帝氣巍巍劫城雙元合應大朴構形普天安鎮億劫無傾第三紫光丹靈真王歌曰金闕啓靈扉真光遍諸天萬仙集帝宮鳴鐘藹飛煙一唱召萬神再歌來衆真茫茫化八圓珠樓竦琳庭太上攝千精元始命伯華令奔紫晨輝長生引真牙妙範祕玄嶽碧落回雲霞端坐九霄中天墉羅九門日月列其傍下有層雲屯紫光化丹靈驂駕舞龍軿自然玉清帝瓊獄請元尊宣布玉丹道太一天皇文普使諸天境悟玄為種民設此大法梁正憲永流行此三界之上飛空之中真王歌音音參洞章誦之百遍名度南宫誦之千遍真王保迎萬遍道備飛升太空過度三界位登仙公有聞靈音真王敬形勑制地祇侍衛送迎拔出地戶五苦八難七祖升遷永離北隂魂度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及紫光丹靈隱祕之音能知太一玉丹為己元命存而保之不使隂穢邪妄昏觸返歸心源紫光照燭逆知彊名寓於心相非心非神非丹非靈玄關脫略悟而得道既得道已即心即神即丹即靈生死往還並無所礙天宫上境遂性遊嬉謂之真人亦曰神仙七祖飛升逍遙億劫皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寶祕於髙上神霄玉清王府東室寶藏之內依科三萬七千年運應下傳若有至人齎金寶質心依舊格告盟十天然後而付焉道言夫天地運度否終日月五星虧盈至聖神人休否末學之夫疾傷凡有此災同氣皆當齊心修齊六時行香十遍轉經福德立降消諸不祥無量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太隂臨過之時同學至人為其行香誦經十過以度尸形如法則泥丸中太一諱重冥空字幽寥無吐玉丹之英返兆生氣魂神徑上南宫隨其學功計日而得更生輪轉不惑便得神仙道言夫天地運終星宿錯度日月失輝四時失度隂陽不調國境有災疫毒流行兆民死傷師友命過同氣災殃皆當修齊行香誦經夫齊戒誦經功德甚重上消天災保鎮帝王下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能為天地帝主兆民行是功德有災之日發心修齊燒香誦經十過皆諸天記名萬神侍衛右別至人克得為聖君金闕之巨諸天記人功過毫分無失天中真王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君撰元始紫光丹靈玉篇東方八天乙羅剎賔䖍跽恆微祕裝則泯髙牙輦綏仗毅秦役瑶真元𡵨洞嶽勑玉琅𡖖簡瓖幽流互曾越田正催頗惟澤柄推察冥稽趙品逸鐸梁辭變機郝完賜鉤洪延伯龜南方八天品慈盈菌戞和凌亰燕翳洛巔祝勿幻平離皇遠寅欹輪夷恆旦奏屏約車塗石扃道辨驛别熙都索明慶備河湄奚梅趙真記益瞢弼烏靈交兵赤旃胡陀摩求默淳西方八天教飛瓊格曆本日箕論佇明席延閩次鈞長儀並敷閻披江薰祕露忽漠餘棠已門察落正梵依畢嵳純勤裒曜比杓範交并闡第委媚斗紐升行君支陽微隕作常呈北方八天關師時昌聮將易蕭碧斷幽根霞激邊毫原趨遲昺季學明刀政霜堅濤杞南惟商漸胙華敵晶焰求興丁羌把房族英猷𡖖緣冥使裔焦昂步汀兊臨其雩爵述撩靈道言此諸天中大梵隱語無量之音舊文書髙上神霄玉清王府紫光丹靈之閣金門左扉之上以盟諸真亦傳東極宫中已成真人者使知妙道字皆廣長一丈天真皇人上真道君昔書其文以為正音有知其音能齊而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳真王保舉上升道備克得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成天真自然之音也故誦之致大魔下觀上帝遙唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響十方肅清河海靜默山嶽吞煙萬靈振伏招集群仙天無氛穢地無祅塵冥慧洞清大量玄玄也元始無量度人上品妙經卷之二十七

front:
  text: 靈寶無量度人上品妙經卷之五十六宙六
  hash: sha256:e23c8a7100633e8b8b8444cdff2473402b7ebacf399c2b061a0c9255815bad90
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_056-001a, image: hfl/0012/0012-004.png}
body:
  text: 濟度死䰟品道言昔於紫暉玄濟天中緑景虛明大慈靈土受元始度人濟度死䰟無量上品元始天尊當說是經周廻十過以召十方始當詣座天眞大神上聖髙尊北酆大帝九幽㧞罪天尊金闕濟度天尊太一救苦天尊大慈大悲救苦眞人大惠眞人無鞅數衆乗空而來碧燿流煇華雲映彩龍軿鳳駕寳蓋靈旛彌漫羅列香藹氛氲日月停景洞朗太无九日九夜諸天瓊樓玉闕雲殿霞房一時同明下極崑崗三山十洲四海九河泉曲之阿鄷都寒庭長夜之關悉被神光普獲開煥萬象澄清十天昭廓一國地土山川林木緬平一等無復高下地成紺碧無有異色衆眞侍座元始天尊玄坐空浮瓊光洞陽寳牀之上說經一遍諸天大聖同時稱善是時天地山嶽鐡城大獄自然齊啓咸釋罪爽來聽法音說經二遍鑊湯聲震忽變清涼水吐青蓮異氣芬馥萬刃刀山悉爲寳樹杻械銷鎔骨骸生復還得成人俱承道䕃說經三遍仙聖讃揚靈瑞咸臻說經四遍一切人民悟解法要說經五遍昆蟲善慧省識罪原說經六遍虎狼毒蝮滅斷惡根說經七遍冤仇和釋異骨成親說經八遍鬼道塞絶永保生津說經九遍幽沈滯魄鍊化昇遷說經十遍道德純一俱登妙眞是時一國有情有識冥不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品考較濟度大神無鞅之衆浮空而至說經二遍南方無極無量品司察濟度大神無鞅之衆浮空而至說經三遍西方無極無量品司禁濟度大神無鞅之衆浮空而至說經四遍北方無極無量品司化濟度大神無鞅之衆浮空而至說經五遍東北無極無量品典獄濟度大神無鞅之衆浮空而至說經六遍東南無極無量品九幽濟度大神無鞅之衆浮空而至說經七遍西南無極無量品泉曲濟度大神無鞅之衆浮空而至說經八遍西此無極無量品羅酆濟度大神無鞅之衆浮空而至說經九遍上方無極無量品超生濟度大神無鞅之衆浮空而至說經十遍下方無極無量品昇化濟度大神無鞅之衆浮空而至十遍周竟十方無極天眞濟度大神一時同至一國男女傾心歸仰來者萬億並駕同驅靈光散彩華霧彌空八部六天三官九署威光召致異趣苦䰟無鞅之衆迮國一半土皆偏䧟非可禁止於是元始洞觀遐邇哀念衆生手執寳翇翇出妙光光及十方一切聽法天仙聖衆自見身相有如瑠璃內映濯羅鬼神䰟爽各於其類中得圓滿心體清淨業火消除仙花時飛大震瓊音宣明法要爾等衆生造諸罪惡累彼死䰟飄蕩無依散入諸趣備經輪轉莫測道縁今以九陽神霄大梵之氣化十二靈文濟度死䰟超昇天境始從亡殁以鍊屍形屍神守骸滯爽超昇仙聖合徳還自成人出離三塗往度八難大衆欣躍仰俟恩光於是元始引眄惻然鑪炷寳香上結宻雲化爲玉闕去地九丈内垂天虹熒煌五色接待大衆俱入其中元始申命㧞罪天尊羅酆帝宰救苦眞人無鞅數衆同升化闕蘂華紫玉靈妙之臺天人仰看惟見勃勃影現萬殊旣入玉闕不知所在國人廓散地還平正無復欹䧟元始即於紫臺之上說經都竟衆眞監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其道眞無有沈淪傾土歸仰咸行善心不愆不犯不忿不爭不迷不忘不愛不著不擾不驚言必眞正口無惡聲齊恩慈愛道化合并存亡安泰度樂生榮經始出教幽顯恊德預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝内名隱韻之音亦是眞王内諱百靈濟度之隱名也非世之常辭上聖已成眞人通玄究微能悉其章誦之十過諸天遙唱萬帝設禮沈逝死䰟證升仙品縁愛積習皆獲蛻捨群魔敬衛蕩化鬼精至學之士誦之十過則四司釋訟九嶽除𡨚回屍起死白骨返形普受濟度以得生成所以爾者學士誦詠寳章招眞召靈妙氣來臻道生神德故可下濟死亡即獲超度而已莫不昇遷輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因縁萬炎不干神明護門斯經尊妙獨歩玉京度人無量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到酆都六洞鬼帝官君寒庭泉曲幽夜之河泰山地壘主宰神靈簡奏上功超㧞罪䰟億曽萬祖幽沈苦爽皆即受度上昇朱宫格皆九年受化更生得爲貴人而好學至經功滿德就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經皆即受度飛昇南宫世人受誦開度九玄出離地獄生福天堂延慶後昆永無身殃此經微妙普度無窮一切天人莫不受慶無量之福生死䝉惠上天所寳不傳下世至士齎金寳效心盟天而傳輕泄漏慢殃及九祖長役隂官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齋誦詠是經濟度死䰟解釋天官罪考之愆五方大殺屍劫之鬼威毒咸息開貸死䰟獲度南宫逍遙自然七月長齋誦詠是經濟度死䰟解釋地官罪考之愆五嶽四司北都羅酆曠野山澤社令城隍應關囚對禍害滅連黑簿削除白簡上生十月長齋誦詠是經濟度死䰟解釋水官罪考之愆北海河侯河伯溟泠四瀆主宰當令幽苦摙汲冥䰟役難散除度越生門八節之日誦詠是經濟度死䰟解釋罪考八方大獄八洞鬼牢悉承道化永變福庭迷識開悟咸登妙津得生世間智用髙明務勤上學克致成眞三元之日誦詠是經濟度死䰟各遂其情鍊度南宮返生受靈䰟神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿徳就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉司靜思身坐青黃白三色雲氣之中内外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室内項生圓象光映十方如此分明宻呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋清堂修行至經無量度人願所啓上徹俓御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始無量度人上品妙經元始洞玄靈寳本章濟度死䰟十廻度人元皇上録鍊度自然九宮妙範青華帝靈至神開運合㑹玄關制命造化長養生根上布玄功無所不周五氣承德結絡形軀萬神羅列帝一居尊二十四宫八景佪環混洞天闢辟非藏烟明梁開道塞絶死門斬伐胞樹超度億曽解釋罪考朱陵鍊䰟太一定命南昌衛形無量濟度長生大君破滅罪府司馬大神超扳滯爽韓君丈人司命司録除削𡨚愆㧞罪天尊度厄尊神廻骸起死無量度人今日校録萬聖臨軒東方無極保命神王長生大聖無量度人南方無極保化神王長生大聖無量度人西方無極散禍神王長生大聖無量度人北方無極度厄神王長生大聖無量度人東北無極救苦神王長生大聖無量度人東南無極衛生神王長生大聖無量度人西南無極㧞罪神王長生大聖無量度人西北無極度䰟神王長生大聖無量度人上方無極超化神王長生大聖無量度人下方無極自在神王長生大聖無量度人十方至眞濟度死䰟神王長生度世無量大神並乗八色祥雲九華翠輦龍鳳驂駕羽蓋騰軒建度䰟定命之節召神靈旛前嘯玉童齊唱後吹簫籟同鳴獅子白鶴嘯歌噰噰四明啓途神官翼轅億乗萬騎浮空而來傾光廻駕監䰟度生南昌丞相天機上宰韓司主録監生大神執籙把籍齊到帝前隨所應度嚴校諸天普告三界無極神郷泉曲之府北都羅酆三官九府十二河源上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼群元始符命時刻昇遷北都寒池部衛形䰟制魔保舉度品南宮死䰟受鍊仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度三塗五苦八難超凌三界逍遙上清上清之天天帝洞眞無色之境梵行東方八天濟䰟𨓜慶天帝扈迪狂曜澤證玄天帝梵聿斯平流剛昇陽天帝振祖流光梵氣舉神天帝尸眞化䰟蕭臺校録天帝㧞苦尊祖猷徽緒天帝道玄巨英麗慈變生天帝敷承庸光道用超神天帝伯常妙冲南方八天紫暉洞明天帝覺善自伸玉宸慈化天帝退坂青輿正宗玄露天帝定意須光初嬰育靈天帝判載司強佐無肇宗天帝嚇陳元防鵲史利眞天帝侯進斗光冥超生䰟天帝妙智仙祖靈增變天帝勞提丙顓西方八天𧓍棣益司天帝常容眞果成超衢天帝儀慈壽均瑛觀紫虛天帝韓承詡言溢靈慶彰天帝蹈方滋苹朱霞淇至天帝海暾總陽黨峻悅疆天帝孟勤禮冥度生昇䰟天帝招雲鍊玄魁符考嶽天帝覺上生北方八天玉頥淨覩天帝柳昴順玄機牛亢化天帝耀洞觀周育乾次寧天帝顯道離田昭本神華天帝絶憇斯仁玄龍史墟天帝太完子賢仙斗迎祺天帝昭迪用寥朝瑞玉幘天帝伯緒遠康庸濟䰟天帝常元隱公三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隠韻開度之音開度之尊鍊化之神天中大魔玉清之靈混合變化而成上眞無量之奥深不可詳敷落神篇濟度窮䰟今日欣慶受度歷關諸天請滅三惡斬絶地根飛度五隂名昇太清眞王監舉無拘天門東斗受性西斗結形北斗保命南斗超昇中斗大魁總御生成青帝通眞白帝衛靈赤帝運化黑帝結神黄帝養育萬善咸臻九竅四體悉獲生全青天魔王巴元醜伯赤天魔王負天擔石白天魔王反山六目黑天魔王監醜朗馥黄天魔王橫天擔力五帝大魔萬神之宗飛行鼓從總統神兵麾憧震節八道揚威遊觀天地開度死䰟自號赫奕功用無窮啓運生津嚴攝北酆靈眞受命普掃不祥神龍吐毒驎騎騰驤天吏持麾蕩化不祥擲大萬里流鈴八衝敢有干試拒遏上眞金鉞前戮巨戈後刑制令鬼爽咸得昇遷𡨚愆和㑹盡獲釋形魔無干犯鬼無祅精三官北酆明檢鬼營不得容隱金馬驛程普告無窮萬神咸聽三界五帝列言上清洞虛妙化海嶽河源中有冥關幽閉罪䰟冥冥眇眇億劫長昏上無天光下無所安風刀亂施哀聲塞空惟有元皇太一之尊普施慈惠神力自然扳除罪苦數落靈篇赤書玉字無上眞文超度䰟爽使入生門梵氣彌羅萬形開張元綱流演三十二天輪轉無色周廻十方普被玄恩皆得升遷八景和合氣入高玄玄中太皇上帝髙眞泛景太霄嘯詠洞章金眞明郁流響雲管玉音攝氣靈風聚䰟紫虛鬱秀輔翼萬仙千和萬合自然成眞眞中有神長生大君無英公子白元尊神鍊化生死㧞兆屍形太一司命攝氣還神桃康合延三一帝尊執符把籙保命生根上遊上清出入華房八冥之内細微之中下鎭人身泥丸絳宫中理五氣混合百神十轉回靈萬氣齊仙仙道貴生無量度人上開八門飛天法輪罪福禁戒宿命因緑普受開度死䰟生身身得受生上聞諸天諸天之上各有生門中有空洞謡歌之章眞王靈篇辭參高眞第一度䰟欲界飛空之音人道易墮麈心苦神神勞散逝杳杳沈䰟䰟爽何所覺忽離難軀形形化爲劫灰䰟魄歸無因黙黙有舊憶索索忘其親舉目無三光栖栖誰所鄰鬼官肆酷毒鞭撻常無停隊仵如驅羊渺渺没冥津鐡獄常焼然惡烟起𦆯紛積骸若丘山涕泗如河傾經劫罪業纏死䰟悲酸辛神霄玉清王出書度天人元始靈寳符超化能生神第二昇玄色界眞王之章絳闕南昌景燿煇煌萬神之家生化之門中有長生大帝紫君碧羽龍衣飛青紫裙手執黄籙靈寳上篇校功玉軒昇度死䰟䰟氣受鍊結植靈根神眞運度隨陽化升昇玄契妙水激火焚炎炎流池玉虹萬鱗跨池爲橋金光横奔無上七元九幽罪䰟銜領符命超昇化輪乗雲馭風與天相傾第三變化示體無色界眞王歌曰三天上境元皇妙宮廻超三界鬱鬱靈光中有大神號曰眞王設化開度萬道之宗元始上帝錫命靈篇普告下司罪苦昇遷破蕩冥暗普現光明滅除禍害永植福根生死受度仰承玄恩冥曹解散慶會長亨威化所被敢有不從玉符保鍊晏眄劫年上無色景與道同玄碧空圓羅億劫自然此三界之上飛空之中眞王歌音音參洞章誦之百遍名度南宫誦之千遍魔王保迎萬遍道備飛昇太空過度三界位登仙公有聞靈音魔王敬形敕制地祇侍衛送迎㧞出地戸五苦八難七祖昇遷永離鬼官䰟度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及神霄眞王隱祕之音鍊度死䰟超登上遷天壽九劫罪愆𡨚仇俱䝉和釋理極奥妙皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寳祕於神府青琳寳藏依玄科應運下傳若有至人齎信效盟質心依舊格告盟三天然後而付焉道言夫天地育形至道生神形爲靈宅神爲元靈神風鼓鍊天與其生生迷道本纏著罪縁疑網癡獄貪念爲愆境物亂心思慮攻神精喪氣謝形軀敗昏五臓内腐七情外奔神宅喪壞神去離形沈淪幽苦爲業所牽喜者生天惡䧟鄷泉死䰟所頼至道宣慈靈文濟度眞符捧持冥官拜首眞吏咸依大梵之宗元眞是栖同氣皆當齊心修齋六時行香十遍轉經福德立降䰟升天堂無量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太隂臨過之時同學至人爲其行香誦經十過以度屍形如法䰟神徑上南宮隨其學功計日而得更生轉輪不惑便得神仙道言夫至學之士修誦上清三洞寳文專持戒籙幽栖山澤清虚忘世或積德行隂功及物父母師長去世之日欲濟度死䰟使超登洞臺列名仙階者當以五香鍊湯沐浴屍䰟以青繒朱書元始靈文一十二符布著玄宫之内一形上下謂以卧符枕上符面上符兩手符兩足履中符安心前符槨四面符凡十二道焚香北向書訖安時呪曰道民王甲生奉仙眞運終鍊化形歸太隂上帝神符赤書玉文濟度死䰟速付玉眞飛昇天堂刻簡仙名骨成蘭玉面有金英太一守屍三官衛靈忽然輕舉上登太清土下大殺屍鬼百精敢干神符亂甲神明天丁把斧斬汝五形山澤水火風氣至眞護完甲屍返生還䰟北帝驚咤落甲死名飛雲玉輿朝謁紫庭急急如律令行符訖更當修齋行香誦經夫齋戒誦經功德甚重䰟爽飛化享福生形下禳毒害以度兆民生死受頼其福難勝故曰無量普度天人道言凡有是經能爲王公侯伯兆民行是功德濟度之日發心修齋焼香誦經十過皆諸天記名萬神侍衛右别至人剋得爲聖君金闕之臣諸天記人功過毫分無失天中眞王亦保舉爾身得道者乃當洞明至言也諸天中大梵隠語無量音道君撰元始靈書度䰟中篇東方八天英曜斗極領帝都關運推息數水火流根生道禀玄聽天自然解掖蛻謝䰟禧雙羅圓體用神曲阿明伸惒眞普玉慶雲門臻梵遷靈易䰟度八極素華應曆符行昴畢南方八天鍊眸玉庭籍檢女侯勘頥有爽度昇昌都機保怍塵赴謨皇猷辜原升府名曹奏智璽選宰童魔化悉旣玄應大察冥拘寒池爍流瓊傳變合谷養救釋靈幹柏庸被經西方八天蹄陽隔樗卷烈飛野黥截鬼筵由庭軒庚符傳龍殿悔昔平㳙生合神廬兆互成人穴液聚纒果溶圍身略靖司化廵祇輔眞陷錮兵旄井席相均演由欽觀滔輪鼔軿北方八天棄蚓乞魚勿頻懶蘇詔𨓜静王慈并比圖虐古韓鎻婁移舌昧罶詛委奪黙元衙沄綽辨鄙齊淵古靈回猖无慶育勑珞資俞強奎翳斗龍呼呉求左將魁酉變生遊嘉道言此諸天中大梵隱語無量之音舊文書玄天北靈玉闕之上以正北山酆泉鬼獄禁制九都大鬼濟度死䰟生化福郷神智逍遙字皆廣長一丈天眞皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣察録神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳眞王保舉洞玄道備剋得遊行三界昇入金門此音無所不辟無所不禳無所不度無所不成天眞自然之音也故誦之致神王下觀上帝遙唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響十方肅清河海靜黙山嶽吞烟萬靈振伏招集群仙天無氛穢地無祅塵冥慧洞清大量玄玄也元始無量度人上品妙經卷之五十六

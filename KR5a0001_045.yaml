body:
  text: 解禳山谷瘴癘品道言昔於浩舒天中邃碧幽歌大神樂土受元始度人解禳山谷瘴癘妙品元始天尊當說是經周回十過以召十方始當詣座天真大神上聖髙尊妙行真人大小山谷仙官主宰十方國土列嶽群仙溪谷泉源鬼神令長直年方域行瘴為癘神官曹屬部隸攸司無鞅數衆乘空而來從山現出紫軿碧輿飛雲暉映寶輪羽蓋扶華垂廕流明玉光千色蓬勃朗耀玄虛七日七夜諸天日月星宿樞衡玉闕駐景停輪神風靜默山谷藏雲天鑑鮮瑩和氣八騫一國地土山川林木緬平一等無復髙下土皆作蘂珠含碧溫明之玉無有異色衆真侍座元始天尊玄坐空浮九靈夜光萬峰承景瓊臺之上說經一遍諸天大聖同時稱善是時三萬六千山嶽一時開明說經二遍玄霜灑空靈芝盤鬱說經三遍祥煙普覆岩竇生香說經四遍世境肅清山雲吐秀說經五遍龍光照海天寶凝華說經六遍道氣昭蘇群生怡悅說經七遍鬼魔潜伏瘴癘捐消說經八遍天谷虛玄神煙鬱藹說經九遍玉真俯應妙瑞告玄說經十遍化洽窮夷天人稱嘆是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方真賢世界無極國土解禳山谷瘴癘大神無鞅之衆升空而至說經二遍南方慧觀世界無極國土解禳山谷瘴癘大神無鞅之衆升空而至說經三遍西方定仙世界無極國土解禳山谷瘴癘大神無鞅之衆升空而至說經四遍北方常善世界無極國土解禳山谷瘴癘大神無鞅之衆升空而至說經五遍東北明微世界無極國土解禳山谷瘴癘大神無鞅之衆升空而至說經六遍東南靈德世界無極國土解禳山谷瘴癘大神無鞅之衆升空而至說經七遍西南海靜世界無極國土解禳山谷瘴癘大神無鞅之衆升空而至說經八遍西北元皇世界無極國土解禳山谷瘴癘大神無鞅之衆升空而至說經九遍上方洞虛世界無極國土解禳山谷瘴癘大神無鞅之衆升空而至說經十遍下方通光世界無極國土解禳山谷瘴癘大神元鞅之衆升空而至十遍周竟十方世界無極國土解禳山谷瘴癘大神一時同至一國男女傾心歸仰求請天尊以大慈力普為下元十方世界無極生類解禳山谷瘴癘保命全形演說普天山嶽洞谷幽墟有諸鬼神藏匿遊泊與諸惡毒御命之衆聚結黨屬施行毒氣瘴癘生民元始神文收攝解除毒害永消是時仙真來者雲集雨飛駢羅圍繞無鞅之衆迮國一半土皆偏陷非可禁止於是元始凝眸垂盻遐覽國土緩振玉音遍告大衆混黃立極萬象同生故有三萬六千天地三萬六千日月又有大三千世界中三千世界小三千世界一一世界各有種類以分族緒三萬六千山谷處諸世界次二萬三千山谷一萬二千山谷一千二百山谷三百六十山谷以為天地世界瀦澮藪澤山谷之氣化生毒酷醜惡蛇蝮大小之蟲乘其晨氣噓吐成烟毒霧蔽蒙觸冒世間世間男女依近山谷呼吸飲吞納受其邪搆為瘴癘以至夭傷遍殆境邑我以法慧出示神符解禳之法使世間生民獲養安和修行得道大衆稱讃各願聽聞元始既興妙教懸一寶珠大如黍米在空玄之中去地五丈元始登引天真大神上聖髙尊妙行真人十方無極世界國土解禳山谷瘴癘大神無鞅數衆俱入寶珠之中天人仰看唯見勃勃從珠口中入既入珠口不知所在國人廓散地還平正無復𣣱陷元始即於霄珠之內玩經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倐歘之間寂無遺響是時天人過值經法普得濟度全其本年無有中傷傾土歸仰咸行善心不邪不妄不恣不逸不驕不矜不說不隨不誑不惑言止淳正體貌雍容齊同安泰異骨成親國安民康欣樂太平經始出教一國以道預有至誠宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是真王內諱解禳山谷瘴癘百靈之隱名也非世之常辭上聖已成真人通玄究微禁敕山谷行瘴為癘毒惡鬼神解脫禍因厭禳疾害保濟生民能悉其章誦之十過諸天遙唱北帝設禮鬼神攝毒山谷藏雲瘴癘不行兆民清安群魔束形鬼精滅奚回尸起死白骨成人至學之士誦之十過則五帝侍衛三界稽首魔精喪眼鬼祅滅爽濟度垂死絶而得生所以爾者學士棲真山谷與道玄同不假解禳自無瘴癘若穢氣未消體未洞真以制十方威未制天政德可伏御地祇束縳魔靈解禳瘴癘存救世人但却疾而已不能長生輕誦此章身則被殃供養尊禮門戶興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙福慧自然度人無量為濟物之宗巍巍大範德難可勝道言凡誦是經十過十方解禳山谷瘴癘大神齊到毒惡之氣大小蟲蝮噴吐惡烟染害生民殘傷物命誦此洞文瘴癘消滅十方山谷總屬瘴癘之神有七仙童子奏事童子十二年王七十二候統瘟癘仙師掌病仙母主瘴癘歐陽神君華仙郭師君張師君鍾師君李師君白師君統兵行瘴病鬼帥邵侯欽聞帝勑急為收攝毒氣山谷惡精解謝積世傳注禳辟災咎立離兆身長生降真福祿永年清淨通靈衆神護衛如符所勑病氣蠲釋而好學至經功滿德就皆得神仙飛升金闕遊宴玉京也上學之士修誦是經山谷之邪世間瘟疫不敢為害神氣充全皆即受度飛升南宫世人受誦則延壽長年後皆得作尸解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齊誦詠是經解禳春夏山谷瘴癘不得染注生人為上世亡魂斷地逮役度上南宫七月長齊誦詠是經解禳秋行山谷瘴癘不得染注生人身得神仙諸天書名黃籙白簡削死上生十月長齊誦詠是經解禳冬行山谷瘴癘不得染注生人為國土帝主安鎮國祚保天長存世世不絶常為人君安鎮其方民稱太平八節之日誦詠是經解禳時行山谷瘴癘不得染注生人得為九宫真人本命之日誦詠是經解禳山谷瘴癘不得於本命刑害衝破死敗之日染傳毒氣殃注兆身魂神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齊戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青絳黃三色雲氣之中內外蓊冥有青龍白虎朱雀玄武御子白鶴羅列左右日月照明洞煥室內解禳大神侍衛畢至項生圓象光映十方如此分明密呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齊清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引氣三十二過東向誦經元始無量度人上品妙經元始洞玄靈寶本章解禳山谷瘴癘妙品十方度人勑魔隱韻冥合自然真氣妙祖虛無上玄元始之氣寶液凝華植立天地山嶽洞宫棲烈萬神握御元綱經營造化順育生靈隂陽乖沴生積妖雲毒精結體以造魔群蚖蛇巨蝮癘鬼之精八山四嶽隱穴幽墟乘其正氣騰化邪氛肆其酷毒傷害黎民為瘴為癘無以蕩除靈寶上道洞玄真文攝召統制永保肅清無文不光無文不明無文下立無文不成無文不度無文不生是為大梵神妙之機鬱羅蕭臺玉山上京上極無上大羅玉清渺渺劫刃若亡若存三華離便大有妙庭金闕玉房森羅淨霐幹旋大紐範圍十方中有解禳山谷瘴癘之神中有清淨萬福天君中有衛世吉祥大神中有無極保命丈人中有南上蕩妖滅注延壽益算度厄尊神回骸起死無量度人今日校録諸天臨軒東方無極攝毒神王長生大聖無量度人南方無極葆真神王長生大聖無量度人四方無極破邪神王長生大聖無量度人北方無極靜天神王長生大聖無量度人東北無極辟禍神王長生大聖無量度人東南無極祛瘴神王長生大聖無量度人西南無極消癘神王長生大聖無量度人西北無極制妖神王長生大聖無量度人上方無極固命神王長生大聖無量度人下方無極護身神王長生大聖無量度人十方解禳山谷瘴癘神王長生度世無量大神並乘寶雲紫琳玉輦碧鳳神輿縟幰雕輪驂駕玄虎五色黃龍建九天之節八素靈幡前嘯洞章齊唱後歌隱韻同音獅子白鶴嘯歌嗈嗈仙𡖖啓途五老翼轅億乘萬騎浮空而來傾光回駕監真度世九地土皇五嶽上公九州社今四瀆神王解禳瘴癘疾厄大神執籙把籍齊到帝前隨所應度嚴校諸天普告三界無極神鄉山谷之府四面八方三萬六千大小之山潜穴幽谷岩壑溪源上解鬱伏五行不正之氣寒溫乖沴之邪遘合鬼異蒸發雲烟隨人呼吸傷害間關外薄肌膚侵擾內真寒如冰凛熱如火燔形負萬苦神意哀冤急為禳除速付三官不得怠縱逼合生靈元始符命敢有稽延天師將吏部衛形魂勿使惡毒枉致暴殘普世蒙惠福慶自然生身受度劫劫長存永無災患與天齊年過度三災五苦八難超淩三界逍遙上清上清之天天帝玄真無色之境梵行東方八天螭明通化天帝景齊文普曜絶真天帝昌嘉久隆生開悅感思皇天帝曜正尊洞空濟澤昭隨天帝驕持尸危奔中理神淨化天帝論祁允多虛德紀章天帝保真自宜道思欵玄天帝覺子湘獻迪蒙示天帝伯越師昂南方八天玉除正强天帝班何子卿果寂思微天帝道伯靈都璣明玄講化天帝玉賢公梁章化夷德天帝滋季師明慧觀曜空天帝勑雷九莊太微妙宗極義天帝延岐保靈端靖存華天帝尚孝恭仙曆總真平功天帝仲玦宜坤西方八天𣿼玄真和天帝黃聿慈太上變氣天帝諒伯上玄辭化舉仙天帝千梁曜角道生光天帝湛扄羅强梵寶招靈用修天帝確覺真鬱淵景慶天帝鎮微次霞叢陽絳英天帝髙玄陽瓊度力房天帝正虞兆先北方八天玄靈七真天帝班序正析慶玄宛縮天帝魯方躋騫校靈議淳天帝澤路龍符斗籍變魂升真天帝優管黨無保仙順解理明天帝混道開初皇元首玉機天帝賢資漸容八道隱玄藏微天帝朝侯左還太素龍景逸王天帝烈修洞休三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻天中之音天中之尊天中之神天中大魔天中之靈九和十合變化上清無量之奧深不可詳敷落神真普度天人今日解禳瘴癘擒攝妖氛請消殃怪誅伐禍根削除疾橫上奏玉玄真王護度塞絶死門東皇馘毒西帝録精北君淨穢南真衛形中皇太一司領化權調運正氣蕩辟魔烟青帝布和白帝安肅赤帝激炎黑帝潤澤黃帝總生無令夭閼青山魔王拘飛運格赤山魔王擊殃禦惡白山魔王鋒揮巨勃黑山魔王撫烈捍㦸黃山魔王董威利翼五山大魔攝毒之神各司將吏億萬之兵操戈揚麾祛掃不祥拱輔玄化與道齊功上天度人奕闡真風神姦不作妙化澄清萬種孽類肅殺成塵黑溪曠野下逮幽隂夔魖魑魅血食之賔奮鼓祅力乘負邪津流鈴震腦金鉞戮形元始告命敢有稽停癘魔喪迹瘴毒滅氛三官北鄷明檢鬼營不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列言上清辟山谷瘴癘佩帶符絳囊盛朱書白素上男女大小通用朱書辟山谷瘴癘貼臥處朱書辟山谷瘴癘作小丸煎桃湯望東南吞服曰三次病寒燒灰服朱書辟山谷瘴癘解穢符安水盂中天元之始萬劫之先渺渺祖劫混沌玄黃凝精結育融植乾坤隂陽升降四序推行中有沴氣化成毒精毒精之母號曰柏仙噓氣焦木吸潤枯泉造為瘴癘冥晦遊天形為莽鳥九頭相連聲如啼呱周行八山人觸其形病注羸孱天寶妙帝鎮伏邪源號曰赤靈被丹巾金威用無邊救護世人摧敗强𦍙召迎冲氣安輯元元太平開圖運度自然元始安鎮敷落五篇赤書玉字八威龍文保制病魔使命長存封山禁谷瘴癘不生梵氣彌羅萬範開張元綱流演三十二天輪轉無色周回十方旋鬼歷心回度八山三十六洞總氣上元八景冥合氣入三玄玄中太皇上帝髙真泛景紫雲嘯詠洞章金真朗郁流響雲營玉符攝氣徊風聚烟紫虛欎秀輔翼萬仙巨山神獸金虎玃天啖食瘴癘冲和自然天地康泰和合歸真真中有神青華帝君太始青氣來降下元兆民長生病無毒艱仙卿輔相真妃侍軒叔火玄父擁衛華晨執符把籙保命生根上遊上清出入雲房八冥之內細微之中下鎮人身泥丸絳宫中理五氣混合百神十轉回靈萬氣齊仙仙道貴生無量度人地戶天門日車月輪隨道正氣救病得生山谷惡注禳解永蠲保度得生上聞諸天諸天之上各有生門中有空洞謡歌之章真王靈篇妙化玉文第一解禳山谷瘴癘之音髙上眇眇神用無涯御正氣兮蠲蕩百邪正氣衛生邪正酷殘魔毒既滅迹怪孽熄其源妖氛害我真乖沴相纒綿消魔玉清王妙範却百痾靈音鎮山嶽琅琅招太和散攝禍根源瘴癘亦無餘噫嗟爾兆身未識玄中歌夭橫喪其軀哀冤將奈何不遇空洞音焉能脫世羅第二解禳靈感之章四氣無騫萬禍滅連瘴癘毒妖鬼莾邪烟神符驅甸威虛輝煌諸天大聖總御騰驤握鈴儀節掃絶不祥肅清十界氣穢除蠲遠殃疾子安泰自然身度此難無量玄恩此其樂兮賴我生存和氣蕩蕩與道合真靈寶上法元始玉文無所不禳無所不解保度無窮為世津梁恐爾未悟設此歌章第三解禳降真招靈歌曰朗朗髙晨煥耀玉都布今千真總統萬魔神金虛章制召衆靈部衛世化闡我明科有崇我教遂保長年災橫莫千晏眄無虞上聖哀憐出此玉書消除苦毒我道不愆正道好生邪道夭殘遵我正道以合我真正道常固疾禍無侵若不知此道何以感百神神威鎮八方上德長日新此三界之上飛空之中真王歌音音參洞章誦之百遍瘴孽消除誦之千遍邪癘不生萬遍道備普護長年過度三界位列仙真有聞靈音五嶽衛形敕制地祗侍衛送迎拔出禍難解禳不祥七祖升遷永離北山魂度朱陵受鍊更生是謂無量普度天窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈真王隱祕之音解禳山谷之邪合雜鬼神異惡蟲蠆四時不常之氣以為瘴癘輕病一家重疫一鄉州城聚落以至天下上聖哀憫出顯符章解禳之法救護生民皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寶祕於神霄玉清王府東華經室歲曆壬辰應運下傳若有至人齎金寶質心依舊格告盟真王然後而付焉道言夫山各之氣險易不同髙下不等寒濕不均氣之所至先後不時髙則多寒下則多濕溫蟲不蟄流水不水毒蛇異物乘氣鼓邪金石燥濕鬱蒸成烟游魂癘鬼浮行其間觸冒生人以為疾患上聖神人示以解禳二法若病氣方熾井邑流行則宜淨心修齊行香服佩符章以解之又以朱薑大梵隱語燒灰著清水之中遍令飲之無不寧息若歲氣夫宜或涉履山谷預為禳備之法則於所居之方為壇醮祭十二年王山谷行病五方天使邵侯神君內外施符五方安瓶以桃柳香艾竹葉煎水貯於瓶內大小隨時飲之或以沐浴又以大梵隱文朱書隨方安之即瘴癘消散鄉邑乂安六時行香十遍轉經福德立降消諸不祥無量之文普度無窮道言夫末學道淺或仙品未充誤遘瘴癘失於解禳運應滅度身經太隂臨過之時同學至人為其行香誦經十過以度尸形如法魂神徑上南宫隨其學功計日而得更生韓輪不惑便得神仙道言夫隂陽乖否亦當修齊行香誦經瘴癘為愆疫毒流行亦當修齊行香誦經妖靈肆酷擾害生民亦當修齊行香誦經破除隂怪侵犯正真亦當修齊行香誦經召集吉祥安鎮家門亦當修齊行香誦經夫齊戒誦經功德甚重上消天災下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能為一切兆民行是功德有災之日發心修齊燒香誦經十過皆諸天記名萬神侍衛右別至人尅得為聖君金闕之臣諸天記人功過毫分無失天中真正亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量之音道君撰無始靈書解禳山谷瘴癘玉篇束方八天桓精山佳鵰雲穴貍董猫虺蛛殺真乾雷桃鬼枯柳月芝渠師遁寂胡蝣馬符螋非剪沙岩畜虎蜒流丹土蚿罔剛遙文敕馗化感夢仙趙邵總靈氣淘海區性遂時凝南方八天社侯伯元南府三師勉凶移毒老父溪龍崿鈞璉俞佐間池蒙攝命符令轉火奔風尸牢鎖伏太空極雄依出恍成化石廣功操枝運靈察景殺童道遊天霞敕岸已舂西方八天崔杜監驅急攝縞女秦蘭丙垂幽寶竟東育典秋堲欽持決容茂果逸回汶靈褒中馬玄離逐雲鄉耿漢殿合建孤明瑶敏神昆盧蒼機淪藻品昧靜獨荒詛走阮夷陵北方八天真勃陀婁焰珠擎門左太皇扆牛奎浮瓊去害子仙羅聰變玄波霽兖石何庚窈宣司饑鄭侯録剌擒修泉合洞誐赤天瀛由定驛遣毒斬截橫鉤犯洛憂明酆官蟬旒道言此諸天中大梵隱語無量之音舊文刻書閬風玄臺以却萬惡不惟解禳山谷瘴癘一切邪病鬼神為害依法敕之無不立驗字皆廣長一丈天真皇人昔書其文以為正音有知其音能齊而誦之者諸天皆遣十方神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門流傳此經普救世人治病除邪消却禍災大勳真王保舉上清道備剋得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成天真自然之音也故誦之致十方下觀上帝遙唱萬神朝禮三界侍軒群妖束首鬼精自亡琳琅振響十方肅清河海靜默山嶽吞烟萬靈振伏招集群仙天無氛穢地無妖塵冥慧洞清大量玄玄也無始無量度人上品妙經卷之四十五

front:
  text: 靈寶無量度人上品妙經卷之十七地七
  hash: sha256:9700fb35d2d134a9f8c4a856d61f3f99d368f9d4013ebfb40b7bebe54b1bdc5e
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_017-001a, image: hfl/0004/0004-040.png}
body:
  text: 扶桑青陽品道言昔於蒼靈天中青芽雲歌大好生土受元始度人扶桑青陽無量上品元始天尊當說是經周回十過以召十方始當詣座天真大神上聖髙尊妙行真人扶桑大帝青華帝君青陽寶耀木皇九氣上真道君天官從騎真仙真人無鞅數衆乘空而來寶雲青霄合沓紫煙琅碧瓊輿八真飛輦葆蓋流䕃靈霞散空七色蔚靄洞煥髙空九日九夜諸天日月星宿停虛倚輪五緯舒光天經順行元綱鎮靜三道清平流暉關紐七辰煥明一國地土山川林木緬平一等無復髙下土潤琳琅無有異色衆真待座元始天尊玄坐空浮青麟玉臺海光寶雲之座說經一遍諸天大聖同時稱善是時一國男女衆惡消除默𢍆真道說經二遍流晶降體完堅萬神說經三遍五臟生華永無百疾說經四遍金光易骨瓊華鍊形說經五遍通體虛明飛行遊宴說經六遍化周八極普度十方說經七遍冥曹罷對進補真仙說經八遍元老五帝敷落妙音一切天人皆識雲芽說經九遍諸天諸地化現嘉祥說經十遍朽骨更生返形復命是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品廣生大神無鞅之衆浮空而至說經二遍南方無極無量品明耀大神無鞅之衆浮空而至說經三遍西方無極無量品皓晶大神無鞅之衆浮空而至說經四遍北方無極無量品玄變大神無鞅之衆浮空而至說經五遍東北無極無量品靈暉大神無鞅之衆浮空而至說經六遍東南無極無量品混合大神無鞅之衆浮空而至說經七遍西南無極無量品鎮安大神無鞅之衆浮空而至說經八遍西北無極無量品回風大神無鞅之衆浮空而至說經九遍上方無極無量品純德大神無鞅之衆浮空而至說經十遍下方無極無量品輔化大神無鞅之衆浮空而至十遍周竟十方無極天真青陽景耀大神一時同至一國男女傾心歸仰各以諸天寶花龍香百果恭敬供養來者有如雲影飛霧無鞅之衆迮國一半土皆偏陷非可禁止於是元始懸一寶珠大若明星在太空之中去地九丈元始登引天真大神上聖髙尊妙行真人十方無極青陽大神無鞅數衆俱入寶珠之中天人仰看惟見勃勃從珠口中入既入珠口不知所在國人廓散地還平正無復欹陷元始即於寶珠之內說經都竟衆真監度以授於我當比之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸奉髙真合景合妙合氣合神合元合本合惠合靈合化合變合性合明心符上聖演範流行青陽降體雲芽發生二暉灌鍊真道克成經始流布一國仰教咸罄至誠衛生保質皆得度世道言元始天尊說經中所言竝是諸天上帝內名隱韻之音亦是真王內諱百靈之隱名也宣演扶桑帝景之山下接太溟青陽之氣纒結九霄圓景真光三十萬里引其景者為仙卿飲其華者為至真九道絳煙回度三靈瓊瑶變質敷羅玉英非世之常辭上聖已成真人通玄究微能悉其章誦之十過扶桑鍊神陽華自成寶明煥燭大福來臻上聖之道奔挹五辰妙氣合無飛升玉京百邪伏滅大𣝹束形回尸起死白骨成人至學之士誦之十過則青腰奉書太丹吐輝含景浮光天靈啓扉東極降璽萬氣齊歸濟度群品遊行太微所以爾者扶桑為崑崙玉誕之精青陽為長生九榮之氣返年却禍賜爾元老大帝之道也龍煙之神屈伸震垣肝葉敷玉關戶紫煙知此道者飛升列仙色更嬰童變化神泉永保生妙合氣長延通真達靈受慶綿綿輕誦此章身則受殃供養尊禮門戶興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人無量為萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到青元上皇九華之精明耀扶桑大帝緣瑶之闕天葆少陽碧琳之宫敕命鳳光玉女持太玄開明青真之符詔九幽寒庭泉府重隂之獄召青陽之神却死䝉生太陽群靈隨光上升九祖幽魂受度飛升格皆九年受化更生得為貴人而好學是經功滿德就皆得神仙飛升玉府下宴方諸也上學之士修誦是經青陽入身玉精內化流注無英威明執鉞斬伐尸根皆即受度飛升玉明世人受誦則洞戶琳琅朱火明璫陽真來應丹化紫房生道續命萬藹流芳保鍊玉飴六府絳章五斗被膺坐鎮魁罡此經微妙普度無方一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役冥官侍經始陽玉童朱光玉女各一十二人營衛瓊文保護受經者身道言正月長齊誦詠是經扶桑垂條青陽布英生氣變幽冥考悉停使上世亡魂斷地逮役度上南官七月長齊誦詠是經方諸降真青華召靈身得神仙諸天書名黃籙白簡削死上生十月長齊誦詠是經東霞保生暘谷開成八關啓蘊九氣敷成為國王帝主君臣父子安鎮國祚保天長存世世不絶常為人君安鎮其方民樂太平八節之日誦詠是經天山通景玉極延齡得為下元真人本命之日誦詠是經太一下臨青帝監盟外運玄氣內育三嬰魂神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齊戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐九陽蒼雲之中內外蓊冥有青龍白虎朱雀玄武師子白鶴羅列左右日月照明洞煥室內項生圎象光映十方如此分明密呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齊清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引氣三十二過東向誦經元始無量度人上品妙經元始洞玄靈寶本章扶桑青陽九華上品化氣度人元晶隱韻正運自然東極青真玄關化神九芒琅碧洞照陽門太無上劫化生八靈青宫肇立扶桑億尋蚪龍交回蛟螭委蟠青陽之精升為歲星開明蒼景是化天根下為青華方諸玉宫上無復祖與道同生玉垣真氣析為寶文安鎮東方玄變純仁挹采華芒結節洞明隱芝自生玉髓金筋蒼符開廓普殖神文無文不敷無文不通無文不建無文不崇無文不化無文不隆是為至妙天中之宫瓊寶玉羅龍嶽剛峯上極無上圓耀髙穹眇渺化城安鎮太空青華離便神變九龍金闕黃房森羅淨霐神霄道氣周遍天京中有度人不死之神中有方諸青童道君中有南極長生之君中有東極青華帝君中有挹霞採光度世司馬大神中有好生韓君丈人中有南上司命司録延壽益算度厄尊神回骸起死無量度人今日校録諸天臨軒東方無極飛天青符神王長生大聖無量度人南方無極飛天青氣神王長生大聖無量度人西方無極飛天青𤓁神王長生大聖無量度人北方無極飛天青精神王長生大聖無量度人東北無極飛天青虛神王長生大聖無量度人東南無極飛天青陽神王長生大聖無量度人西南無極飛天青運神王長生大聖無量度人西北無極飛天青帝神王長生大聖無量度人上方無極飛天青景神王長生大聖無量度人下方無極飛天青芽神王長生大聖無量度人十方至真飛天神王長生度世無量大神竝乘飛光青軺之車蒼珠碧琅之輦緑蓋玄輪驂駕丹鳳九首青龍建流霞之節廣生靈旙前按洞章齊奏後唱玉謡同音白鳳麒麟嘯歌噰噰青靈啓塗歲耀翼轅億乘萬騎浮空而來傾光回駕監真度生東極丞相暘谷神宫帝司玄一九氣大神導降青精光照八冥碧霞散飛三五順行骨生金輝回耀瓊英青皇受書列位仙真校定群品區别衆靈執籙把籍齊到玄庭隨所應度嚴校清都普告十極杳漠髙虛洞淵化府北闕靈居閬風崑丘瑤臺帝墟下逮寒池長夜幽扃拔度祖考削落惡根不得拘留剋獲超升青宫符命飛度無停神嶽鬱羅開衛形魂大魔監察度品朱陵死魂鍊氣變朽成人生身受度劫劫長存隨劫輪轉與天齊年永度三災八難九橫五苦超淩三界逍遙九清九清之天天帝保安無色之境梵行東方八天修方正華天帝天季宜庭青芒順綱天帝憫化神覺繹真洞映天帝善伹越文隆緒景師天帝遙符玉渦辨常起位天帝關間資仁歷濟桓輿天帝護諱難木極粹生天帝工機顯房廣風至化天帝孟麟九中南方八天慶炎崇古天帝信師拜凡緑真應羅天帝賁寧禱玄宗理髙明天帝玄攸叙嘉日旗招氣天帝太一紫庭液華澤限天帝雲蒲緑英常經衛和天帝耀靈洎元洞空蔚陽天帝飛日路咸青宫啓生天帝士勝育居西方八天定曦扶晨天帝光空極真曲桑漱瓊天帝嬰定泰郊群黎寂鎖天帝氣摩幽寧玄墟正魔天帝直鐶湛罘運曆開靈天帝時維康假素𢍆治律天帝召可司非西清玉賔天帝茨留江道元聖山天帝臺堅庸北方八天潜池演滋天帝決隲少披虛闕對神天帝渺秩祿冝寞羅帝陀天帝呼畫頥光酆營總監天帝述盧猶朋智廬降真天帝蘇杜善提號都佐理保福天帝部尤允淝海靜雲儀玉夷天帝洞義明持壬領六司天帝考按鬼神三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻青陽之音青陽之尊青陽之神青陽耀晶青陽之靈九氣十華變化上清無量之奧深不可詳敷落神真普度天人今日欣慶受度歷關諸天木真九皇倚杖扶桑妙靈攝氣結為青陽青陽飛精碧光髙升大圓照空億氣為程仁德逮下福資聖君普覆區宇變化生靈仙真神龍克應至神和煬慈恕微妙彰明上學感靈仰味天精神光下流骨玉顔金䇿登神霄彼服組紋拔苦扶難振祐生民請滅三惡斬絶地根扶桑吐華蟠條散英瓊緑萬葉蒼雲千層上生靈寶紫光丹靈九芒纒虛煥爛東晨遐想青軿龍仗𦆯紛青氣如絃挹采玄曛洗髓鍊神奔騰玉津飛度九戶廓開八門真王監舉列告元真東斗降陽西斗耀明北斗玄沆南斗光淩中斗益生總括萬靈青華啓暉皓芳開性丹蘂扶衛玄津保命黃英中貫普行教令大帝碧羅三界大定蒼元上真緑氣東桑丹元上真鍊玉朱光素元上真皓華流芳玄元上真雙闕提綱中元上真坐鎮明堂五元至神上景之真含芳拱露交幹雙莚飛龍髙舉落鳯騫星統部靈魔萬神之宗飛行三道總統仙兵麾幢鼓節遊觀九清自號赫奕諸天齊功上天化民嚴攝羅酆真王受命普掃祅凶伯華降晶龍耀持鋒太丹流雲威化無邊神帥擲大萬里飛煙金鈴迸擊玉㦸八懸敢有干試拒遏髙仙玄鉞前戮神金後刑屠割祅爽激蕩無停千千截首萬萬翦形魔無干犯鬼無祅精三官九司明按鬼營不得容隱玉馬交呈普告無方萬彚咸聽三界五帝列言上清元洞玉曆東極扶桑未開五劫初判青陽陽華發生三元紀綱生為神仙道樞已張震動知覺龍漢延康眇眇億劫混沌之中青顯為色陽墮成淵風為木神澤為木元風澤洞虛金石凝天天上天下大化冥冥陽光浩蕩無極無名洪濛大道遼廓無光丹暉啓圖運度自然青華安鎮緑誥瓊篇赤書王字九氣龍文保制劫運使天長存梵氣彌羅萬範開張木真流演四羅諸天輪轉綱維回度無邊旋角歷箕粲斗車廂傍俠天經運化五帝玉城九門青帝東鄉三十五分總氣上元八景冥合氣入玄玄玄中太皇玉極仙真乘景步虛下照桑林千真共會帝庭飲食青陽浩劫冞淪泛景紫霄吟詠洞章金真朗秀流響雲宫靈音化景混合回風太虛鬱微輔翼玄空青陽入肝碧樓玉山中有少童錦衣美𠜍手執天籥吹噓百關內通境界感御披蘭白珠纍纍霐流三田鼓橐茹和赫然成丹千和萬合自然成真真為青陽陽中有神長生大君曜元公子浩晶尊神方諸司命晹谷合延執符把籙保命生根上遊九清出入琳房八關之內細微之中下鎮人身瓊樓絳宫中理五氣混合百神十轉回靈與氣俱仙仙道貴生蒼垣度人上開九門青光大輪司治天政下劾鬼神中主人民罪福因緣普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有碧桑雲葉自然青陽空洞之謡真王靈篇辭參髙真第一碧海扶桑飛空之音玉都翠京下速碧淵光霞億萬青陽九玄寒波泛溢蒼景扶桑並生萬尋神風化綱葉映碧落中祕龍章歌空成韻枝舞鸞翔元精縈羅緑英瑶璫林密如雲中有上真寶辨嵳峩交龍羽裙厥號太帝扶桑之尊無英伯華龍胎九魂主教至學灌鍊五形千變萬化八道揚旌勒我上範方諸紀名第二青陽寶耀真王之章扶桑連理並幹相倚接雲龍升逼波雷起蟠根蜿蜒接曲千里青宫大神太一元尊碧霞鬱壘玄相老人三界仰德九土蒙恩桑林之真氣名青陽升於神天結秀紫房寶耀赫奕傾丹化鄉下照億天無極威光生育列聖飛度延康仰引神霞經天緯常悟此得生道識者通神靈吟詠青陽章九天俯雲輪第三東極青華帝君歌曰寶山峙東南上有真王宫盤根淩太虛下眄九霄中內列諸靈司洞治億天宗元嗣輔上帝統御興真風鑑觀圎羅下驂駕飛天龍十極秉元化大魔為考功收制六天兵使道永興隆飛章請玉詔玄符赦羅酆大慈憫長夜五苦使咸停與我本同氣翛然宴赤明變化無邊際普度諸天民胡為樂須㬰貪欲勞其神不學上真道歷嵗空悲辛我今為此歌清音感玄人此三界之上飛空之中真王歌音音參洞章誦之百遍名度南宫誦之千遍真王保迎萬遍道備飛升太空過度三界位登仙公有聞靈音真王召神敕制地祇侍衛送迎拔出地戶五苦八難七祖升遷永離幽山魂度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈真王隱祕之音顯明扶桑之山仙國宏遠其山面方萬里在碧海之東去中國九十萬里上通神霄五府億萬里中有太真王扶桑大帝方諸山青童道君東極青華之别宫山生巨桑內黃而外紅其華食之長生其液狀如玉飴服之壽千劫鍊之為丹餌為髙真其根感玉京崑山之玉津孕於桑中下生玉璞如世松根而有茯苓茯苓千年生威善扶桑之下有玉璞溫瑩殊美並能制鳳凰立於其上下方生玉玉結未成凝為流液服之變為嬰童壽等天地扶桑之上有靈雞鸞鳳九色之鳥日旦升於若木金鳥飛於桑上即日出暘谷其扶桑之頂有氣名青陽上為木星光照三十萬里徑一百里十二年一周天三百九十九日一見伏凡八十三年七十六見而七周天中有星帝后妃夫人官屬木皇為之主爾修其道則玄丹太一吐納青氣太一天尊授兆青符無英公子飲兆青精龍煙丈人威盟真人受兆東方真文御青陽以東升音旨微妙皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寶祕於玄都髙上神霄玉清玉府東藏經室依科三萬七千年應運下傳若有至人齊金寶質心依舊格告盟十天然後而付焉道言夫青陽為生福之力本有形之類無不賴之至若天地運度否終日月五星虧盈至聖神人休否末學之夫疾傷凡有此災同氣皆當齊心修齊六時行香十遍轉經福德立降消諸不祥無量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太隂臨過之時同學至人為其行香誦經十過以度尸形如法則東極青華帝君賜通光之符召青陽之氣於無英之宫流太玄青精生氣入兆之肝府死戶閉塞木皇內遊含明丈人為兆啓紫蘭之室開青珠之檢授兆隱文兆之精靈按而誦之魂神徑上南宫隨其學功計日而得更生輪轉不惑便得神仙道言夫天地運終星宿錯度日月失明四時失序隂陽不調國土災怪水火厄難疫毒流行兆民死傷師友命過善士橫殃皆當修齊行香誦經夫齊戒誦經功德甚重上消天災保鎮帝王下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能為天地帝主兆民行是功德有災之日發心修齊燒香誦經十過皆諸天記名萬神侍衛右别至人剋得為聖君金闕之臣諸天記人功過毫分無失天中真王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君撰元始靈書扶桑青陽玉篇東方八天翟軒嵋羅傾音謨光曆紀𢘍響迎贖丘玄濟淙欹纍固淵蔽芒憫協華迹曜度氐房竒魚立𡣕制儀䝉剛海鄒夜潭舒毗琳琅扁幾合無遘盈東祥矧測雉兊兟胡并唐南方八天戰熾兜郢陀騰炯瞻戚孺臧殷命魔設官極臺勑吏走驛告嚴陽居始都究萌部端猛聚定棘鹿溫冥牢景補皇位靜部尤常烈卑柄重吉祺信諭茂期諶于昆熙夷光西方八天瑟那志靈褥逹侯度頂磋蔚京陸省備助菴乙布獰求銖閲正狼文薢嶇途營撰兵厭騰釋璘葆疇尹倉萬彥師倫池府爵尸奔竇印里述冥關蘭幽河斗神金名祝伸北方八天扶曦霞梁絶革忮疆耀學素寂抱帝澤門䕡符紫丁夜舍追擬託詫藴朒叵沙燕稱縳爾泉弇交奇浮綱淨信同法罔慈擊亢瀆延龍裒計羅卓傳業俞鄭璠石雷皓清道言此諸天中大梵隱語無量之音舊文刻書青華帝君左闕玉臺之上青陽洞煥木道其昌仁澤純被壽樂靈遐施生於地惠德於天中遊至虛妙歸三元福貴本始道賞其玄字皆廣長一丈天真皇人昔書其文以為正音有知其音能齊而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大成真王保舉木真道備剋得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成天真自然之音也故誦之致神王下觀上帝遙唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響十方肅清河海靜默山嶽吞煙萬靈振伏召集群仙天無氛穢地無祅塵冥慧洞清大量玄玄也元始無量度人上品妙經卷之十七

front:
  text: 靈寳无量度人上品妙經卷之十七地七
  hash: sha256:554af6edfd23b5cd752608d618109abe6992ff0389d2d7922d7bd7a9fd4be55d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_017-001a, image: hfl/0004/0004-040.png}
body:
  text: 扶桑青陽品道言昔於蒼靈天中青芽雲歌大好生土受元始度人扶桑青陽无量上品元始天尊當說是經周回十過以召十方始當詣座天眞大神上聖髙尊妙行眞人扶桑大帝青華帝君青陽寳燿木皇九炁上眞道君天官從騎眞仙眞人無鞅數衆乗空而來寳雲青霄合沓紫煙琅碧瓊輿八眞飛輦葆蓋流䕃靈霞散空七色蔚靄洞煥髙空九日九夜諸天日月星宿停虚倚輪五緯舒光天經順行元綱鎭靜三道清平流暉關紐七辰煥明一國地土山川林木緬平一等無復髙下土潤琳琅無有異色衆眞待座元始天尊玄坐空浮青麟玉臺海光寳雲之座說經一徧諸天大聖同時稱善是時一國男女衆惡消除黙𢍆眞道說經二徧流晶降體完堅萬神說經三徧五臓生華永無百疾說經四徧金光易骨瓊華鍊形說經五徧通體虚明飛行遊宴說經六徧化周八極普度十方說經七徧冥曹罷對進補眞仙說經八徧元老五帝敷落妙音一切天人皆識雲芽說經九徧諸天諸地化現嘉祥說經十徧朽骨更生返形復命是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一徧東方无極无量品廣生大神無鞅之衆浮空而至說經二徧南方无極无量品明燿大神無鞅之衆浮空而至說經三徧西方无極无量品皓晶大神無鞅之衆浮空而至說經四徧北方无極无量品玄變大神無鞅之衆浮空而至說經五徧東北无極无量品靈暉大神無鞅之衆浮空而至說經六徧東南无極无量品混合大神無鞅之衆浮空而至說經七徧西南无極无量品鎭安大神無鞅之衆浮空而至說經八徧西北无極无量品回風大神無鞅之衆浮空而至說經九徧上方无極无量品純德大神無鞅之衆浮空而至說經十徧下方无極无量品輔化大神無鞅之衆浮空而至十徧周竟十方无極天眞青陽景燿大神一時同至一國男女傾心歸仰各以諸天寳花龍香百果恭敬供養來者有如雲影飛霧無鞅之衆迮國一半土皆偏䧟非可禁止於是元始懸一寳珠大若明星在太空之中去地九丈元始登引天眞大神上聖髙尊妙行眞人十方无極青陽大神無鞅數衆俱入寳珠之中天人仰看惟見勃勃從珠口中入既入珠口不知所在國人廓散地還平正無復欹陷元始即於寳珠之内說經都竟衆眞監度以授於我當比之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸奉髙眞合景合妙合炁合神合元合本合惠合靈合化合變合性合明心符上聖演範流行青陽降體雲芽發生二暉灌鍊眞道克成經始流布一國仰教咸罄至誠衞生保質皆得度世道言元始天尊說經中所言竝是諸天上帝內名隠韻之音亦是眞王内諱百靈之隱名也宣演扶桑帝景之山下接太溟青陽之炁纒結九霄圓景眞光三十萬里引其景者爲仙卿飲其華者爲至眞九道絳煙回度三靈瓊瑶變質敷羅玉英非世之常辭上聖已成眞人通玄究微能悉其章誦之十過扶桑鍊神陽華自成寳明煥燭大福來臻上聖之道奔挹五辰妙炁合无飛昇玉京百邪伏滅大𣝹束形回屍起死白骨成人至學之士誦之十過則青腰奉書太丹吐煇含景浮光天靈啓扉東極降璽萬炁齊歸濟度群品遊行太微所以爾者扶桑爲崑崙玉誕之精青陽爲長生九榮之氣返年却禍賜爾元老大帝之道也龍煙之神屈伸震垣肝葉敷玉關戸紫煙知此道者飛昇列仙色更嬰童變化神泉永保生妙合炁長延通眞達靈受慶綿綿輕誦此章身則受殃供養尊禮門戸興隆世世昌熾與善因縁萬災不干神明護門斯經尊妙獨步玉京度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到青元上皇九華之精明燿扶桑大帝縁瑶之闕天葆少陽碧琳之宫敕命鳳光玉女持太玄開明青眞之符詔九幽寒庭泉府重隂之獄召青陽之神却死䝉生太陽群靈隨光上昇九祖幽魂受度飛昇格皆九年受化更生得爲貴人而好學是經功滿德就皆得神仙飛昇玉府下宴方諸也上學之士修誦是經青陽入身玉精内化流注無英威明執鉞斬伐屍根皆即受度飛昇玉明世人受誦則洞戸琳琅朱火明璫陽眞來應丹化紫房生道續命萬藹流芳保鍊玉飴六府絳章五斗被膺坐鎭魁罡此經微妙普度無方一切天人莫不受慶无量之福生死蒙惠上天所寳不傳下世至士齎金寳效心盟天而傳輕泄漏慢殃及九祖長役冥官侍經始陽玉童朱光玉女各一十二人營衛瓊文保護受經者身道言正月長齋誦詠是經扶桑垂條青陽布英生炁變幽㝠考悉停使上世亡魂斷地逮役度上南官七月長齋誦詠是經方諸降眞青華召靈身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經東霞保生暘谷開成八關啓蘊九炁敷成爲國王帝主君臣父子安鎭國祚保天長存世世不絶常爲人君安鎮其方民樂太平八節之日誦詠是經天山通景玉極延齡得爲下元眞人本命之日誦詠是經太一下臨青帝監盟外運玄炁内育三嬰魂神澄正萬炁長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐九陽蒼雲之中内外蓊㝠有青龍白虎朱雀玄武師子白鶴羅列左右日月照明洞煥室内項生圎象光暎十方如此分明宻呪曰无上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋清堂修行至經无量度人願所啓上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始无量度人上品妙經元始洞玄靈寳本章扶桑青陽九華上品化炁度人元晶隱韻正運自然東極青眞玄關化神九芒琅碧洞照陽門太无上劫化生八靈青宫肇立扶桑億尋蚪龍交迴蛟螭委蟠青陽之精升爲歳星開明蒼景是化天根下爲青華方諸玉宫上無復祖與道同生玉垣眞炁析爲寳文安鎭東方玄變純仁挹采華芒結節洞明隱芝自生玉髓金筋蒼符開廓普殖神文無文不敷無文不通無文不建無文不崇無文不化無文不隆是爲至妙天中之宫瓊寳玉羅龍嶽剛峯上極无上圓燿髙穹眇渺化城安鎭太空青華離便神變九龍金闕黃房森羅淨霐神霄道炁周徧天京中有度人不死之神中有方諸青童道君中有南極長生之君中有東極青華帝君中有挹霞採光度世司馬大神中有好生韓君丈人中有南上司命司録延壽益筭度厄尊神迴骸起死无量度人今日校録諸天臨軒東方无極飛天青符神王長生大聖无量度人南方无極飛天青炁神王長生大聖无量度人西方无極飛天青𤓁神王長生大聖无量度人北方无極飛天青精神王長生大聖无量度人東北无極飛天青虚神王長生大聖无量度人東南无極飛天青陽神王長生大聖无量度人西南无極飛天青運神王長生大聖无量度人西北无極飛天青帝神王長生大聖无量度人上方无極飛天青景神王長生大聖无量度人下方无極飛天青芽神王長生大聖无量度人十方至眞飛天神王長生度世无量大神竝乗飛光青軺之車蒼珠碧琅之輦緑蓋玄輪驂駕丹鳳九首青龍建流霞之節廣生靈旙前按洞章齊奏後唱玉謡同音白鳳麒麟嘯歌噰噰青靈啓塗歲燿翼轅億乗萬騎浮空而來傾光回駕監眞度生東極丞相暘谷神宫帝司玄一九炁大神導降青精光照八㝠碧霞散飛三五順行骨生金輝迴燿瓊英青皇受書列位仙眞校定群品區别衆靈執籙把籍齊到玄庭隨所應度嚴校清都普告十極杳漠髙虚洞淵化府北闕靈居閬風崑丘瑤臺帝墟下逮寒池長夜幽扃拔度祖考削落惡根不得拘留剋獲超升青宫符命飛度無停神嶽鬱羅開衞形魂大魔監察度品朱陵死魂鍊炁變朽成人生身受度劫劫長存隨劫輪轉與天齊年永度三災八難九横五苦超淩三界逍遥九清九清之天天帝保安無色之境梵行東方八天修方正華天帝天季宜庭青芒順綱天帝憫化神覺繹眞洞暎天帝善伹越文隆緒景師天帝遥符玉渦辨常起位天帝關閑資仁歷濟桓輿天帝護諱難木極粹生天帝工機顯房廣風至化天帝孟麟九中南方八天慶炎崇古天帝信師拜凡緑眞應羅天帝賁寧禱玄宗理髙明天帝玄攸叙嘉日旗招炁天帝太一紫庭液華澤限天帝雲蒲緑英常經衞和天帝燿靈洎元洞空蔚陽天帝飛日路咸青宫啓生天帝士勝育居西方八天定曦扶晨天帝光空極眞曲桑漱瓊天帝嬰定泰郊群黎寂鎻天帝炁摩幽寧玄墟正魔天帝直鐶湛罘運曆開靈天帝時維康假素𢍆治律天帝召可司非西清玉賔天帝茨留江道元聖山天帝臺堅庸北方八天潜池演滋天帝決隲少披虚闕對神天帝渺秩禄冝寞羅帝陀天帝呼畫頥光酆營緫監天帝述盧猶朋智廬降眞天帝蘇杜善提號都佐理保福天帝部尤允淝海靜雲儀玉夷天帝洞義明持壬領六司天帝考按鬼神三十二天三十二帝諸天隠諱諸天隠名天中空洞自然靈章諸天隱韻青陽之音青陽之尊青陽之神青陽燿晶青陽之靈九炁十華變化上清无量之奥深不可詳敷落神眞普度天人今日欣慶受度歷關諸天木眞九皇倚杖扶桑妙靈攝炁結爲青陽青陽飛精碧光髙升大圓照空億炁爲程仁德逮下福資聖君普覆區宇變化生靈仙眞神龍克應至神和煬慈恕微妙彰明上學感靈仰味天精神光下流骨玉顔金䇿登神霄彼服組紋拔苦扶難振祐生民請滅三惡斬絶地根扶桑吐華蟠條散英瓊緑萬葉蒼雲千層上生靈寳紫光丹靈九芒纒虚煥爛東晨遐想青軿龍仗𦆯紛青炁如絃挹采玄曛洗髓鍊神奔騰玉津飛度九戸廓開八門眞王監舉列告元眞東斗降陽西斗燿明北斗玄沆南斗光淩中斗益生緫括萬靈青華啓暉皓芳開性丹蘂扶衞玄津保命黃英中貫普行教令大帝碧羅三界大定蒼元上眞緑炁東桑丹元上眞鍊玉朱光素元上眞皓華流芳玄元上眞雙闕提綱中元上眞坐鎮明堂五元至神上景之眞含芳拱露交幹雙莚飛龍髙舉落鳯騫星統部靈魔萬神之宗飛行三道緫統仙兵麾幢鼔節遊觀九清自號赫奕諸天齊功上天化民嚴攝羅酆眞王受命普掃祅凶伯華降晶龍燿持鋒太丹流雲威化無邊神帥擲大萬里飛煙金鈴迸擊玉㦸八懸敢有干試拒遏髙仙玄鉞前戮神金後刑屠割祅爽激蕩無停千千截首萬萬翦形魔無干犯鬼無祅精三官九司明按鬼營不得容隱玉馬交呈普告無方萬彚咸聽三界五帝列言上清元洞玉曆東極扶桑未開五劫初判青陽陽華發生三元紀綱生爲神仙道樞已張震動知覺龍漢延康眇眇億劫混沌之中青顯爲色陽墮成淵風爲木神澤爲木元風澤洞虛金石凝天天上天下大化冥冥陽光浩蕩無極無名洪濛大道遼廓無光丹暉啓圖運度自然青華安鎮緑誥瓊篇赤書王字九炁龍文保制劫運使天長存梵炁彌羅萬範開張木眞流演四羅諸天輪轉綱維回度無邊旋角歷箕粲斗車廂傍俠天經運化五帝玉城九門青帝東郷三十五分緫炁上元八景冥合炁入玄玄玄中太皇玉極仙眞乗景步虚下照桑林千眞共會帝庭飲食青陽浩劫冞淪汎景紫霄吟詠洞章金眞朗秀流響雲宫靈音化景混合回風太虛鬱微輔翼玄空青陽入肝碧樓玉山中有少童錦衣美𠜍手執天籥吹嘘百關内通境界感御披蘭白珠累累霐流三田鼓橐茹和赫然成丹千和萬合自然成眞眞爲青陽陽中有神長生大君曜元公子浩晶尊神方諸司命晹谷合延執符把籙保命生根上遊九清出入琳房八關之内細微之中下鎭人身瓊樓絳宫中理五炁混合百神十轉回靈與炁俱仙仙道貴生蒼垣度人上開九門青光大輪司治天政下劾鬼神中主人民罪福因縁普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有碧桑雲葉自然青陽空洞之謡眞王靈篇辭參髙眞第一碧海扶桑飛空之音玉都翠京下速碧淵光霞億萬青陽九玄寒波泛溢蒼景扶桑並生萬尋神風化綱葉暎碧落中祕龍章歌空成韻枝舞鸞翔元精縈羅緑英瑶璫林宻如雲中有上眞寳弁嵳峩交龍羽裙厥號太帝扶桑之尊無英伯華龍胎九魂主教至學灌鍊五形千變萬化八道揚旌勒我上範方諸紀名第二青陽寳燿眞王之章扶桑連理並幹相倚接雲龍升逼波雷起蟠根蜿蜒接曲千里青宫大神太一元尊碧霞鬱壘玄相老人三界仰德九土蒙恩桑林之眞炁名青陽昇於神天結秀紫房寳燿赫奕傾丹化郷下照億天无極威光生育列聖飛度延康仰引神霞經天緯常悟此得生道識者通神靈吟詠青陽章九天俯雲輪第三東極青華帝君歌曰寳山峙東南上有眞王宫盤根淩太虚下眄九霄中内列諸靈司洞治億天宗元嗣輔上帝統御興眞風鑑觀圎羅下驂駕飛天龍十極秉元化大魔爲攷功收制六天兵使道永興隆飛章請玉詔玄符赦羅酆大慈憫長夜五苦使咸停與我本同氣翛然宴赤明變化無邊際普度諸天民胡爲樂須㬰貪欲勞其神不學上眞道歷嵗空悲辛我今爲此歌清音感玄人此三界之上飛空之中眞王歌音音參洞章誦之百徧名度南宫誦之千徧眞王保迎萬徧道備飛昇太空過度三界位登仙公有聞靈音眞王召神敕制地祇侍衞送迎拔出地戸五苦八難七祖升遷永離幽山魂度朱陵受鍊更生是謂无量普度无窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈眞王隱祕之音顯明扶桑之山仙國宏遠其山面方萬里在碧海之東去中國九十萬里上通神霄五府億萬里中有太眞王扶桑大帝方諸山青童道君東極青華之别宫山生巨桑内黄而外紅其華食之長生其液狀如玉飴服之壽千劫鍊之爲丹餌爲髙眞其根感玉京崑山之玉津孕於桑中下生玉璞如世松根而有茯苓茯苓千年生威善扶桑之下有玉璞温瑩殊美並能制鳳凰立於其上下方生玉玉結未成凝爲流液服之變爲嬰童壽等天地扶桑之上有靈雞鸞鳳九色之鳥日旦升於若木金鳥飛於桑上即日出暘谷其扶桑之頂有炁名青陽上爲木星光照三十萬里徑一百里十二年一周天三百九十九日一見伏凡八十三年七十六見而七周天中有星帝后妃夫人官屬木皇爲之主爾修其道則玄丹太一吐納青炁太一天尊授兆青符無英公子飲兆青精龍煙丈人威盟眞人受兆東方眞文御青陽以東升音旨微妙皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奥難可尋詳上天所寳祕於玄都髙上神霄玉清玉府東藏經室依科三萬七千年應運下傳若有至人齋金寳質心依舊格告盟十天然後而付焉道言夫青陽爲生福之力本有形之類無不頼之至若天地運度否終日月五星虧盈至聖神人休否末學之夫疾傷凡有此災同氣皆當齊心修齋六時行香十徧轉經福德立降消諸不祥无量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太隂臨過之時同學至人為其行香誦經十過以度屍形如法則東極青華帝君賜通光之符召青陽之炁於無英之宫流太玄青精生炁入兆之肝府死戸閉塞木皇内遊含明丈人爲兆啓紫蘭之室開青珠之檢授兆隱文兆之精靈按而誦之魂神徑上南宫隨其學功計日而得更生輪轉不惑便得神仙道言夫天地運終星宿錯度日月失明四時失序隂陽不調國土災怪水火厄難疫毒流行兆民死傷師友命過善士横殃皆當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎭帝王下禳毒害以度兆民生死受頼其福難勝故曰无量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋焼香誦經十過皆諸天記名萬神侍衞右别至人剋得爲聖君金闕之臣諸天記人功過毫分無失天中眞王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語无量音道君撰元始靈書扶桑青陽玉篇東方八天翟軒嵋羅傾音謨光曆紀𢘍響迎贖丘玄濟淙欹累固淵蔽芒憫恊華迹曜度氐房竒魚立𡣕制儀䝉剛海鄒夜潭舒毗琳琅扁幾合無遘盈東祥矧測雉兊兟胡并唐南方八天戰熾兠郢陀騰炯瞻戚孺臧殷命魔設官極臺勑吏走驛告嚴陽居始都究萌部端猛聚定棘鹿温冥牢景補皇位靜部尤常烈卑柄重吉祺信諭茂期諶于昆熈夷光西方八天瑟那志靈褥逹侯度頂磋蔚京陸省備助菴乙布獰求銖閱正狼文薢嶇途營譔兵厭騰釋璘葆疇尹倉萬彦師倫池府爵屍犇竇印里述冥關蘭幽河斗神金名祝伸北方八天扶曦霞梁絶革忮疆燿學素寂抱帝澤門䕡符紫丁夜舍追擬託詫藴朒叵沙燕偁縳爾泉弇交奇浮綱淨信同法罔慈擊亢瀆延龍裒計羅卓傳業俞鄭璠石雷皓清道言此諸天中大梵隱語无量之音舊文刻書青華帝君左闕玉臺之上青陽洞煥木道其昌仁澤純被壽樂靈遐施生於地惠德於天中遊至虛妙歸三元福貴本始道賞其玄字皆廣長一丈天眞皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大成眞王保舉木眞道備剋得遊行三界昇入金門此音無所不辟無所不禳無所不度無所不成天真自然之音也故誦之致神王下觀上帝遥唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響十方肅清河海靜黙山嶽吞煙萬靈振伏召集群仙天無氛穢地無祅塵冥慧洞清大量玄玄也元始无量度人上品妙經卷之十七

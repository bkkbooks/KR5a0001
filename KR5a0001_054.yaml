front:
  text: 靈寶無量度人上品妙經卷之五十四宙四
  hash: sha256:194cc0e4944404522b061fb1beb244007016b9846cbed6b8895eb1889af50cbe
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_054-001a, image: hfl/0011/0011-126.png}
body:
  text: 斬馘不祥品道言昔於始青天中紫陽泛歌大福樂土受元始度人斬馘不祥妙品元始天尊當說是經周回十過以召十方始當詣座天真大神上聖髙尊妙行真人靈威神王黑天玉京大將斬邪馘毒威兵巨魁伏魔誅魂都吏無鞅散衆乘空而來寶雲接天明霞履海瑶車玉輪珠景垂䕃飛華妙光疊彩葱薈森映碧空三日三夜諸天宫殿山川溪谷混交九色三辰定照五斗停機四極運明神烟澄霽一國地土都鄙人物遞相鑒燭萬身入於一身一影普涵萬影色空同顯神氣合冥遐邇若等無復髙下土變柔碧洞徹九虛衆真侍座元始天尊玄坐雙景回旋神龍天寶之座說經一遍諸天大聖同時稱善是時一國男女天身淨睦妙香飄馥說經二遍天境髙嚴九霄散縟說經三遍沆露凝珠寶林綴網說經四遍天籟成音瓊金流響自然法唱讃詠冲玄說經五遍水光湛瑩海嶽呈祥說經六遍飛仙揚花彌空錦色說經七遍靈威降世掃滅祅氛說經八遍三界䝉福人道安寧說經九遍六氣順常三災消殄說經十遍天真下濟說法度人是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品靈威勑法大神無鞅之衆浮空而至說經二遍南方無極無量品靈威斬祅大神無鞅之衆浮空而至說經三遍西方無極無量品靈威斬鬼大神無鞅之衆浮空而至說經四遍北方無極無量品靈威斬精大神無鞅之衆浮空而至說經五遍東北無極無量品靈威典獄大神無鞅之衆浮空而至說經六遍東南無極無量品靈威斯邪大神無鞅之衆淨空而至說經七遍西南無極無量品靈威飛符大神無鞅之衆浮空而至說經八遍西北無極無量品靈威吐毒大神無鞅之衆浮空而至說經九遍上方無極無量品靈威九首大神無鞅之衆浮空而至說經十遍下方無極無量品靈威殺伐大神無鞅之衆浮空而至十遍周竟十方無極靈威大神一時同至一國男女傾心歸仰來者有如歸雲斂霧無鞅之衆遍滿一國咸覬和寧斬馘群醜不祥捐蕩境字鎮清駢呇凝瞻非可禁止於是元始天尊於眉間示現金色光明色光宛轉於其光中化出十方宫殿戶牖敞對重堂巍閣光氣同流冉冉浮空去地五丈也元始登引天真大神上聖髙尊妙行真人十方無極靈威大神無鞅數衆俱入化宫之中天人仰看惟見勃勃從化宫金光中入既入光中不知所在國人廓散神宮流轉勢如旋虹元始即於其內說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度邪正道分斬魔馘祅蕩滅不祥傾土歸仰咸行善心正智正道正神正念正思正意正力正威正行正儀言詞朗直口慧和聲齊同慈愛異骨成親國安民豐欣樂太平正教開廓魑魅馘平道妙至真悉廣明心寶奉宗禮皆得度世道言元始天尊說經中所言並是諸天上帝正真內名隱韻之音亦是十方靈威神王內諱斬馘不祥之隱名也非世之常辭上聖已成真人探妙極微能悉其章誦之十過諸天命靈八威鼓氣神官執剌魔帥禀章綱緯合軌元魁吐暉邪精滅迹鬼徒喪形正道通心真光衛魂陽施至德死而更生至學之士誦之十過則九天䇿名五帝給乘三元備兵惡注逃殞生功充盈邪關杜塞赤書降庭福源自布災殃不經所以爾者學士感徹玉清高上遐鑒羽葆列營召制十方威被六天道為太極所仰萬靈咸尊已試無難固守黃寧地祇敬伏攝御魔靈辟除災病永與生存輕誦此章削落胎元神盧圯摧七魄蹈揚供養尊禮門戶興隆霄京降契福䘵共滂大帥秉鉞斬馘不祥世授道德孫葉茂昌慶善相因萬災伏藏斯經尊妙獨步玉京度人無量為大法之宗巍巍正氣天德自勝道言凡誦是經十過諸天齊到神綱五斗巨天斬馘天騶甲士威南巨兵五天大帥部率十方靈威河魁大神銜符操鉞即至其所摉捕九醜暗澤幽川古空巫祠一切祅魅及以魂爽依附木石潜遘生人誣訟三官覬伺禱祭四目大呼神虎奮翅毒獸舉牙擲火激電斬首馘耳世之不祥應皆蠲蕩也上學之士修誦是經青房大神鳴鈴以却穢紫戶將軍引劔以辟魔玉女叩瓊於九室黃老振音於三素也世人受誦則延壽長年黃庭之下戶白雲之窮閭泉曲寒池萬鬼弭蟄腎海不波水怪竄迹上宫唱善三府樂玄後皆得作尸解之道魔鬼不得而徴呼地司不得而攝録神氣藴形自成法體魔精受鍊飛行太空此經微妙普度無窮一切天人莫不受慶天界五魔中元五尸地司五考永斷不祥長保元吉無量之福生死䝉惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衛神文保衛受經者身道言正月長齊誦詠是經召攝北清洞隂尊神部督神兵奏詣上宫七月長齊誦詠是經召攝中天五帥三界大魔紫微帝君統按百神滌蕩邪源掃滅祅氛十月長齊誦詠是經召攝六天洞臺之靈三官曹局考魂大神執御八山勾鎖勑殺大神九首龍君斬馘故氣不祥窮魂五殟疫毒土木百精害於生類羌夷鬼神使國界安寧人民遂成國王帝主君臣父子安鎮國祚保天長存世世不絶常為人君安鎮其方民稱太平八節之日誦詠是經召攝八天大威烟火洞熏太一八神八殺靈君領駕風雲遊盻九宮孤虛竒門斬馘不祥無使亂程本命之日誦詠是經召攝三真升入泥丸斗極紫烟中黃上真口吐青華鎮兆等身三尸消落殃疰枯焚黑結白姧斬伐無停三帝紀功七真運靈神童導前身有光明三界侍衛五帝司迎萬神朝禮名書上夭功滿德就飛升上清道言行道之日皆當香湯沐浴齊戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黃白三色雲氣之中內外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右三天直事左右兵吏殺鬼使者斬馘天騶森然備衛日月照明洞煥室內項生圓象光映十方如此分明密呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齊清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引氣三十二過東向誦經元始無量度人上品妙經元始洞玄靈寶本章斬馘不祥十回度人破邪隱韻離合自然太無無名混洞北清太一正真化為老人紫羽錦䙱腰帶流鈴首建天英執御洞經口吐靈和斬馘百精天和至真真氣煥明五色玄黃八角成文龍章虎書符圖啓靈化生六甲役使六丁三元定録五帝變形開廓隂穢正道聿興無文不光無文不明無文不立無文不成無文不度無文不生是謂大梵天中之夭玉符妙重諸天所尊變化金闕上清之神太霄九華梵氣洞冥圎羅紫極七九合玄玄臺玉京中有上皇斬邪討姧惡源消斷真道自然自然靈威火山炎池冶鍊至神龍巾鳳衣主攝不祥聖頥通開萬二千神符圖火兵俠衛上皇都校三元眇眇玄道若亡若存雙景內朝隂陽循環紫景白霏嚴駕不停大行梵氣周回十方中有三天正法之神中有北玄斬邪之君中有司禁勑法之神中有神符保命之君中有六天普護丈人中有九天司命採察之君巡遊五嶽丈人都禁真官身化水火立生風雲神公萬億虎賁兆民斬馘不祥無量度人今日校緑諸天臨軒東方無極靈威神王長生大聖無量度人南方無極靈威神王長生大聖無量度人西方無極靈威神王長生大聖無量度人北方無極靈威神王長生大聖無量度人東北無極靈威神王長生大聖無量度人東南無極靈威神王長生大聖無量度人西南無極靈威神王長生大聖無量度人西北無極靈威神王長生大聖無量度人上方無極靈威神王長生大聖無量度人下方無極靈威神王長生大聖無量度人十方至真靈威神王長生度世無量大神並乘紫氣丹霞佪光赫衝翠旌錦節素蓋瓊輿驂御龍虎導從仙真建五神流輝之幢三素翔鸞之紱前嘯玉籟齊唱後吹碧籥同鳴絳鵲青禽嘯歌噰噰四明治道五仙陪車億乘萬騎浮空而來傾光回駕檢録不祥諸天上公北鄷真宰九天都司七政八靈騁霧凌風奔馳炎獸擲旗鼓革號呼獵響執案考籍齊到帝前隨所應度嚴校諸夭下及人都幽關冥界無極神鄉泉曲之府北都羅鄷三官九府十二河源爍羅鬼國二十四境幽獄罪徒生魂死魄停繫嶽瀆注害世間喜為不祥促人壽命發災興毒成厄誣冤放施毒邪臨民命祿使福德不備智暗偏禀剋夭族屬隂曹肆便宄惑綿邈嚴奉赤文祇行符命神刀斬戮萬鬼縻睛解釋祖考億劫種親及大魔魂攻蝕攝考肆虐生民不得拘留逼合鬼群元始符命時刻升遷赦過伐罪一一記名北都寒池部衛形魂制魔保舉度品南宫世無災殃福慶自生不斬馘者鬼録課盟死魂受鍊仙化成人生身受度億劫無傾隂陽九六常與善循隨劫輪轉與天齊年永度三途五苦八難超凌三界逍遙上清上清之天天帝玉真無色之境梵行東方八天紫景玉華天帝肇符喜生都極重明天帝鬱黎兼登宣真都正天帝覺霞定符穹耀思微天帝正辨九區蒼微露帝天帝敦和學謀至正常無天帝孔彰儀能靈姬肇符天帝元昌崇耀樞觀化天帝龍扶越聰南方八天赤明耀明天帝賈須騫蒲阮諸綿丙天帝珠鋹祕圖太真素霞天帝鳳趺玉孤道山空際天帝九星演湖洞浮紫華天帝光平敷元理妙機天帝奧庭竟星嶠嶼洞洪天帝别南彥冥烈歘髙晨天帝黨輔元需西方八天廖霞雲素天帝偃庭干鉏化宛丘緒天帝援揚斗然九道化陽天帝勃羅㑹明八地素曆天帝願慈真逾太微妙觀天帝孽嶺昭淵飛華浩圓天帝翥祺夷妃金映灝都天帝那離權機玉鍊道成天帝虞亭玞北方八天冥洞斗魁天帝術遐卷承雉室羅宏天帝雲笏潜虛玄靈修化天帝尚賢玉明除真穹臺天帝羅都元虛太霞玄真天帝暮緣景昌混明耀景天帝真期陽靜順慶宗天帝部靜祉詹玄精秀光天帝卞丁千期三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻天正之音天正之尊天正之神天正大魔天正之靈氣和道合變化此清出教布正萬邪莫干劔芒斬梟鬼井逃奔玄文紫書雲篇洞章敷落神真普度天人生兆正氣奕奕法輪長矛巨矢瀝血喪睛今日急速關察火令橫摧斬馘刳滅五帝列儀炎烟萬丈雷電交馳車破鬼營兵散積尸冥官送檄九道併追飛行五門順逐三竒神王稽顙六天迎魔東斗降氣西斗垂綱北斗勑法南斗火然中斗紫宸役御九天青帝變文白帝斬形赤帝傳符黑帝運神黃帝出令萬靈咸聽青天神王瞿羅彭興赤天神王鼓畢冲明白天神王虎目昌英黑天神王礔石漂凌黃天神王皛都罙凝五天神王萬神之宗斬鬼億千馘殄不祥總領鬼兵泛泳大荒麾幢鼓節遊盻翶翔霞結成書龍舉為章火風赫炎諸天齊功上天斬邪嚴攝北酆神公受命普掃不祥丹靈敷熾黃越誅殃六手操兵鐵額擲烟食邪之獸啖鬼之王霜甲秋陳殺氣夜河元帥統軍大帝命魔玄老前戮龍將殿圍擁騎雲崿玉鉞迎阿玄獸吞鎗青斗列言速登我前敢有干試拒遏上真羽葆轉碧鸞惟翊軒萬旅震途群真回軿屠割摧裂毒求激淵邪道靜默有誅無捐萬萬截首千千劓勍魔無干犯鬼無祅精三官北酆明檢鬼營不得容隱金馬驛呈普告無窮靈威俯聽地司五皇列言上清寥無恢運幽虛含精龍漠延康浩浩赤明劫成界開隂陽體名倏忽變化三景玉清上通無玄下際無淵風為隂火水為陽津風秀成爓水凝為石洞虛穹貫三十二天中有正氣為道髙真辟除萬邪㑹歸正明至化通玄鬼試莫干道為天父神為氣根金剛乘天天無幽冥天無形影天無極窮溟涬大梵為道之宗遼廓天光萬象畢容爰有九都為鬼之皇與帝同生龍穴倣徨擅治六天害正無
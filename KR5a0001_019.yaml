front:
  text: 靈寶無量度人上品妙經卷之十九地九
  hash: sha256:2fa8a80ea3b78234e18f85a3628339fd8e911b9ccef7e16d94f3e5a8a076e93d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_019-001a, image: hfl/0004/0004-122.png}
body:
  text: 十方聖境品道言昔於靈華天中景耀回風大圓化土受元始度人十方聖境無量上品元始天尊當說是經周回十過以召十方始當詣座天真大神上聖髙尊妙行真人十方聖境化土世界仙君仙王無鞅數衆乘空而來玄雲飛霞鳳輿朱輪葆蓋交䕃琅碧騰輝洞徹八冥晃耀太空九日九夜諸天月月宫府星垣帝闕寶觀朱樓神嶽瓊山璇臺劫仞下及蒼丹之界玄素之鄉清都九淵六周十極光明照朗通逹無礙一國地土山川林木緬平一等無復髙下土皆作黃玉中天正氣交灌坤丘神化平夷無有異色衆真環侍元始天尊安坐太虛九芒赤文火玉之座說經一遍諸天大聖同時稱善是時一國男女仰聽玄音悉悟妙道說經二遍目覩神化洞徹萬緣說經三遍合會正氣皆能闡法說經四遍億劫積滯隨念消融說經五遍金真散結百關流通說經六遍地生寶華天敷玉文說經七遍悠悠群類克保完堅說經八遍鬼官罷對幽魂上升說經九遍虛皇妙光照映十方無量元宫分形應化一切天人隨方敬仰說經十遍玉符下降安鎮神山度世升平永無劫運是時一國是男是女莫不傾心皆受開濟咸得長生道言是時元始天尊說經一遍東方無極無量品仁旺大神無鞅之衆浮空而至說經二遍南方無極無量品合明大神無鞅之衆浮空而至說經三遍西方無極無量品皓元大神無鞅之衆浮空而至說經四遍北方無極無量品玄光大神無鞅之衆浮空而至說經五遍東北元極無量品保安大神無鞅之衆浮空而至說經六遍東南無極元量品流運大神無鞅之衆浮空而至說經七遍西南無極無量品鎮紀大神無鞅之衆浮空而至說經八遍西北無極無量品持綱大神無鞅之衆浮空而至說經九遍上方無極無量品生方大神無鞅之衆浮空而至說經十遍下方無極無量品延康大神無鞅之衆浮空而至十遍周竟十方天真聖境大神一時同至一國男女傾心歸嚮來者有如輕塵重霧億乘萬騎玄雲四㑹天澤密周素煙層沓非可禁止於是元始手出妙光化一圓象結成寶雲瑩若明月在空玄之中去地百丈元始登引天真大神上聖髙尊妙行真人十方無極天真大神無鞅數衆俱入寶輪之中天人仰看惟見導從目輪影中入既入輪影不知所在國人廓散地常清潤無復更變元始即於寶輪之內說經都竟衆真監度以授於我當此之時欣慶難言法事周悉衆靈復位俄爾之間杳無遺音是時天民遇此大範普獲惠濟全其天年無有夭傷合境歸仰咸悟道緣不懈不退不敗不遷不苟不諂不私不偏不佞不黨不過不愆言宗至理命保長延齊同慈智心𢍆髙玄國境豐寧帝祚綿綿法始流布一國以道預有至心宗奉敬衛皆得度世道言元始天尊說經中所言並是三天化氣謡歌大範之音亦是十方聖境真仙之隱名也非世之常辭上元開運真人通微悟玄能悉其章誦之十過九天稱慶群靈列言三官執藉簡奏玉京日月騰輝星網順行大魔伏謁衆祅束形濟生度死朽骸成人太極飛仙誦之十過則十方境界無極靈鄉下逮神洲洞泉海嶽有生安泰各遂逍遙所以爾者上聖高真挺自然之秀育質碧霄生而知道故感格玉清無所不度飛仙中真積學修鍊而𢍆於玄雖證位同聖非上元之比但濟世境而已不能制天政也輕誦此章身則被殃宗敬保祕立著元功世世昌熾善根興隆衆邪不干天神護門斯經玄奧萬境所尊度人無極為生道之宗皇皇正範難可勝量道言凡誦是經十過洞章玄音上達玉清感格虛皇降三天正真九陽積妙太玄之氣下開八門灌注流入羅酆幽音泉曲冥關度爾億曾萬祖受苦魂爽克得化鍊上升朱陵皆應真期靈符攝生得為至人而好學上經果備功圓皆得飛仙超升玉闕遊眄九霄也鴻學之士修誦是經皆即受度髙宴南宫世人受誦則壽極三元後皆得證太隂鍊形之道藏質九淵寄身后土魂不蕩空魄不沉滯歷劫同運即獲更生一切天人悉獲受度無量景福幽顯䝉惠上玄所禁不傳于世至士特重寶效心盟誓而傳輕泄玉章殃連七祖長役土官侍經聖境玉童玉女各四十八人營衛神文保護受經者身道言正月長齊誦詠是經真光下濟漙釋幽隂為上世亡魂斷滅罪結升度朱宫七月長齊誦詠是經正真生氣流灌心田金籙注名身得髙仙十月長齊誦詠是經聖境內通法耀外明為國王帝主保延世境安鎮萬邦欣樂升平大福無疆三辰寧順天夀永昌八節之日誦詠是經得為流珠絳闕保生真人本命之日誦詠是經十方大聖化境髙尊乘雲駕龍來詣監盟書名元斗列奏玄冥百神集㑹功著九天大魔保舉形飛列仙道言行道之日皆當香湯沐浴齊戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐碧絳紫三色雲氣之中內外蓊冥有青龍白虎朱雀玄武師子白鶴羅列左右十方聖境一時同見日月照明洞煥室內項生圓象光映十方如此分明密呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齊清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引氣三十二過東向誦經元始無量度人上品妙經元始洞玄靈寶本章十方聖境上品神霄神化度人赤符隱韻騰耀自然混漢洞冥虛無玉真肇開元範大合神靈虛皇一氣植立諸天斬構十方五劫推遷七變神洲十轉天關玄妙聖境仙真帝臣開明三道散化五形萬象齊立虛極靈根上周復景獨運為身華晶至應大朴靈文九霄沖感風激飛煙迅綱木輪交瓊深淵皓皇廣布元運包纒是為造化十極將分鬱嶽瓊臺蕭仞遐京上窮圓象琳闕飛青眇眇帝氣巍巍劫城三靈玉筵太上玄庭金閣華房森列流精廣霞育氣周變千靈中有十天校録之神中有方諸上道之君中有洪聖妙元之真中有合境開導丈人中有東華南極西靈北鬱四維上下列聖髙真共敷大範開化天人執天正憲無量度人今日集會攝召臨軒東方聖境賢善世界正化神王長生大聖無量度人南方聖境明離世界真慧神王長生大聖無量度人西方聖境皓洞世界招仙神王長生大聖無量度人北方聖境清淨世界多吉神王長生大聖無量度人東北聖境妙華世界威德神王長生大聖無量度人東南聖境九真世界福滿神王長生大聖無量度人西南聖境流光世界金華神王長生大聖無量度人西北聖境玉宸世界神智神王長生大聖無量度人上方聖境紫虛世界道樞神王長生大聖無量度人下方聖境慈護世界救厄神王長生大聖無量度人十方無極通變神王飛空度世開化大神並乘絳雲緑輿碧輦羽蓋瑶輪驂駕玄鳳白虎斑龍建元暉王節七耀靈幡前列十天大帥後從黃闕化兵猛馬蒼麟騰擲辟邪天官啓塗玄真翼轅億乘萬騎浮空而來傾光回駕聖境度生太微玉輔元素上靈神章鴻化大洞髙尊統天執法齊㑹帝前隨方立應簡示諸天普告八極寒夜靈關洞神左府北水九淵太上羅酆六洞三宫曲池龍廄大劫河源威光九仞長役風庭火山永鏡億零女青大君符命時刻飛升斷絶惡趣消滅罪根陽輝下濟原赦幽魂朱宫受鍊仙變成人生身合氣隨運長存因緣輪轉與天同年永度陽九百六風刀水火之難超淩三界逍遙九清九清之天天帝鑑冥無色之境梵行東方八天靈蘭雲室天帝記行宛盈聞真成化天帝閻濟莊祕景凝神天帝逸塗獨雲玉陽聖境天帝赤序畢升海國飛鄉天帝穆衍離嶽靜虛音天帝感時慶昭智常極仁天帝述俱辭名神島遊車天帝益憑子柯南方八天炎正司治天帝諒官承方百豐就和天帝迪宗中宜朱陵典禁天帝沖仙九純降都昭靈天帝兵禳仲和字庭校精素魔天帝暉道清剛璣度光天帝響邦署枚都神耀羅天帝達玄宥窺威明廣兵天帝成都祈陽西方八天束臺羽武天帝河稽魯傳韓官篤辜天帝明維子康龜巖西臺天帝冒興黎嚴直申迅靈天帝悉託思幽墟潜校天帝伯耀光挈瀆垂神天帝逐防廓明波關龍濟天帝和沖孚參首慶生天帝勑利住賔北方八天洞隂夜城天帝定平若澄孤光王峯天帝寂蒙變兟黑㟪雷司天帝澤披戢光正居錫玄天帝悲盧祈昌太一張遙天帝尤全子營素氣徊堂天帝慜都交華龍威捨湟天帝逐間辟晞至澤洪靈天帝杜祥示恭三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻天中之音天中之尊天中之神天中大魔天中之靈九開十闢混合上清玄關大典幽妙難量造天立極敷落十方今日欣慶會遇考試諸天已滅世纍斬絶惡根飛度五難乘景髙奔真王監察無制玄門東斗注生西斗司伐北斗執𢍆南斗定格中斗帝室宣流聖澤青帝布機白帝持算赤帝御氣黑帝交貫黃帝中居大化分判青天真王寶慶合離赤天真王玄真糾非白天真王太素運時黑天真王天化霄暉黃天真王靈氣所歸五天真王萬境之尊飛行三界總領威兵持幢仗節遊行太清位號顯著與天同生上玄化民嚴制幽扃紫微受詔掃殄祅祥天蓬執印神虎恢張流火前馳朱鳳後翔六天大醜收付魁罡敢有干犯拒抗天真神兵左戮巨殺右刑屠割除滅風火無停千千截首萬萬誅形魔無侵試鬼無逆淩三官北酆明察鬼營敢容怠縱飛章奏呈普告十方無量神靈八冥諸帝列言紫宸混元無名非濁非清分為兩半素玄肇平積微為仞大化生方劫號既定冥變龍康眇眇祖源混合文昌上無景色下無化淵風行太虛空洞無邊自然聖境至道之玄碧霄降地金水成天天上天下大舍沉冥無輝無影無象無形溟涬元氣雙耀交并赤明玉虛運周自然天一流化金簡玉篇赤陽至精八垣玄文保制崑丘永劫長存梵氣彌羅萬法施張元綱交貫九地九天輪轉空無生成億千旋繞蕭山回度飛𨇠三十九帝總攝上元十方聖境統治丹玄玄中太真上景髙皇泛氣玉霞吟嘯洞清金延秀賴流盼雲營天音朗韻靈光散煙太蕭鬱羅明化金編千和萬合自然成真真中有神長生大君青華左踞玉妃右蹲太一司命桃康合淳執符把籍保度靈根上遊紫清出入玄丹三方之內六極之中下鎮人身明堂絳宫分治五神合㑹百骸十運回風萬氣俱仙飛神召靈變化無邊仙道貴生無量度人十方玄極開通八門飛行三界受書玉宸罪福禁戒宿命因緣咸受濟度天正生身身得受生上聞諸天諸天之上各有生門中有天元合變之章太上靈篇辭參髙真第一十方聖境飛空之音玄光赤運大梵無名飛境飄飄化闕九門玉城盤回碧落敷明旋臺萬劫音華耀文中有大聖龍衣虎裳首建紫宸腰帶金璫持握四境化土中方爾能長齊鍊度文昌蕩穢紫戶納真絳房二神擲火元一揚光見我真形出沒低昻粲粲存工灼灼在傍乘神以遊緑室朱窗我道杳密心合靈鄉第二十方聖境之章一氣所變萬境澄清玄嶽鬱嵳仙都玉京長林茂秀大有玉庭朱衣龍章開化生根聖緣天運正道開揚氣貫飛煙結花無常穹樓千尺巨闕明堂龍游虎馳朱斾雲綱隱如太空顯如宿張發現應所行即明善惡方玉真跨斑龍神風得髙翔第三十方聖境歌曰龍漢大劫萬品玄虛元始開天先造空無大洞上元清微禹餘靈文九訓玄真七舒蕩蕩八垣髙升四隅赤明啓運列聖御圖五山嵳峩敷落赤書蕩蕩天闕巍巍帝居靈光下濟息役三塗頒赦河源真風廣敷式歌此音與聖同符此三界之上飛空之中真王歌音音參洞章誦之百遍名度南宫誦之千遍真王保迎萬遍道備飛升太空過度三界位登仙公有聞靈音魔王敬形勑制地祇侍衛送迎拔出地戶五苦八難七祖升遷永離幽關魂度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈真王隱祕之音深啓至玄發明洪化使彼天民咸入聖境皆是大梵之言非世常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寶祕於髙上神霄玉清玉府大君行教應氣流傳若有至人齎金寶質心依舊格告盟十天然後而付焉道言夫天地運度否終日月五星虧盈至聖神人休否末學之夫疾傷凡有此災同氣皆當齊心修齊六時行香十遍轉經福德立降消諸不祥無量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太隂臨過之時同學至人為其行香誦經十過以度尸形如法則生身所行善功所營隂德當滅度時十方聖境皆現元始天尊安座說法或援手接引幡蓋來迎魂神徑上南官隨其學功計日而得更生輪轉不惑便得神仙道言夫天地運終星宿錯度日月失光四時失序隂陽不調國境生災疫毒流行兆民死傷師友命過淨友災殃皆當修齊行香誦經夫齊戒誦經功德甚重上消天災保鎮帝王下禳毒害以度兆民生死受頭其福難勝故曰無量普度天人道言凡有是經能為天地帝主兆民行是功德有災之日發心修齊燒香誦經十過皆諸天記名萬神侍衛右别至人克得為聖君金闕之臣諸天記人功過毫分無失天中真王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君撰元始靈書十方聖境祕篇東方八天群陀湮索召鑑淵沛靈馬逾綱期韜式晦遼闌彌敻列都夷悌濛巖眷羅逸還周器烏陽演赤皓凶乾鋭報美丙山璐章蕕粹祝多時延緑真英仙湛那覩泊至良微瞻南方八天竇夏昆略鯨池紫澶跛玖但思蕭南𡵨顛寶節徂徠密盟書玄樂藻梯莫直幾進綿注黍乙趨離咸資權藍傍依序歷髙次宣靈僅霄華臺他閲城璣黨扶驅洞籟潯溟西方八天庫岍甡勻丘慈始傷庚井龍羅柏房停香酌嶰留激屛麻辭真雲嶪定相敝多淪神徹虛琅璖燕都景凝感族揚鄙智傳齊謨混覺測靈維玞粗根亮苕已禱部墟塗垠北方八天侯汪迹元披景奪靈衣篤變𢍆郭多民逵鍊泓寒穴招仙賁輪蕩交逸區爭光蒲形早氣冶東司萌決同智騫環耀規璘冀沖洞育邈里嬴魁謁豐萬仙合絶空靈實功道言此諸天中十方聖境大梵隱語無量之音舊文題十方洞臺天闕玉都之上神化十方靈隨應出空合道微悟解之者神鄉聖境無不普現字皆廣長一丈天真皇人昔書其文以為正音有知其音能齊而誦之者諸天皆遣十方聖境化土神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大功真王保舉上真道備克得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成天真自然之音也故誦之𦤺十方飛天下觀上帝遙唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅震響十方肅清河海靜默山嶽吞煙萬靈振伏招集群仙天無氛穢地無祅塵冥慧洞清大量玄玄也元始無量度人上品妙經卷之十九

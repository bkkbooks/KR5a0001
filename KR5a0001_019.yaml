front:
  text: 靈寳无量度人上品妙經卷之十九地九
  hash: sha256:c7cd6a4140b9357581e7938d3cbf0eb57e18062bcbcbe6a7d1c5aefaf780134d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_019-001a, image: hfl/0004/0004-122.png}
body:
  text: 十方聖境品道言昔於靈華天中景燿廻風大圓化土受元始度人十方聖境无量上品元始天尊當說是經周迴十過以召十方始當詣座天眞大神上聖髙尊妙行眞人十方聖境化土世界仙君仙王無鞅數衆乗空而來玄雲飛霞鳳輿朱輪葆蓋交䕃琅碧騰煇洞徹八冥晃燿太空九日九夜諸天月月宫府星垣帝闕寳觀朱樓神嶽瓊山璇臺劫仞下及蒼丹之界玄素之郷清都九淵六周十極光明照朗通逹無礙一國地土山川林木緬平一等無復髙下土皆作黄玉中天正炁交灌坤丘神化平夷無有異色衆眞環侍元始天尊安坐太虚九芒赤文火玉之座說經一徧諸天大聖同時稱善是時一國男女仰聽玄音悉悟妙道說經二徧目覩神化洞徹萬縁說經三徧合會正炁皆能闡法說經四徧億劫積滯隨念消融說經五徧金眞散結百關流通說經六徧地生寳華天敷玉文說經七徧悠悠群類克保完堅說經八徧鬼官罷對幽魂上升說經九徧虚皇妙光照暎十方无量元宫分形應化一切天人隨方敬仰說經十徧玉符下降安鎭神山度世升平永無劫運是時一國是男是女莫不傾心皆受開濟咸得長生道言是時元始天尊說經一徧東方无極无量品仁旺大神無鞅之衆浮空而至說經二徧南方无極无量品合明大神無鞅之衆浮空而至說經三徧西方无極无量品皓元大神無鞅之衆浮空而至說經四徧北方无極無量品玄光大神無鞅之衆浮空而至說經五徧東北元極无量品保安大神無鞅之衆浮空而至說經六徧東南无極元量品流運大神無鞅之衆浮空而至說經七徧西南无極无量品鎭紀大神無鞅之衆浮空而至說經八徧西北无極无量品持綱大神無鞅之衆浮空而至說經九徧上方无極无量品生方大神無鞅之衆浮空而至說經十徧下方無極無量品延康大神無鞅之衆浮空而至十徧周竟十方天眞聖境大神一時同至一國男女傾心歸嚮來者有如輕塵重霧億乗萬騎玄雲四㑹天澤宻周素煙層沓非可禁止於是元始手出妙光化一圓象結成寳雲瑩若明月在空玄之中去地百丈元始登引天眞大神上聖髙尊妙行眞人十方无極天眞大神無鞅數衆俱入寳輪之中天人仰㸔惟見導從目輪影中入既入輪影不知所在國人廓散地常清潤無復更變元始即於寳輪之内說經都竟衆眞監度以授於我當此之時欣慶難言法事周悉衆靈復位俄爾之間杳無遺音是時天民遇此大範普獲惠濟全其天年無有夭傷合境歸仰咸悟道縁不懈不退不敗不遷不苟不諂不私不偏不佞不黨不過不愆言宗至理命保長延齊同慈智心𢍆髙玄國境豐寧帝祚綿綿法始流布一國以道預有至心宗奉敬衛皆得度世道言元始天尊說經中所言並是三天化炁謡歌大範之音亦是十方聖境眞仙之隱名也非世之常辭上元開運眞人通微悟玄能悉其章誦之十過九天稱慶群靈列言三官執藉簡奏玉京日月騰煇星網順行大魔伏謁衆祅束形濟生度死朽骸成人太極飛仙誦之十過則十方境界无極靈郷下逮神洲洞泉海嶽有生安泰各遂逍遥所以爾者上聖高眞挺自然之秀育質碧霄生而知道故感格玉清無所不度飛仙中眞積學修鍊而𢍆於玄雖證位同聖非上元之比但濟世境而已不能制天政也輕誦此章身則被殃宗敬保祕立著元功世世昌熾善根興隆衆邪不干天神護門斯經玄奥萬境所尊度人無極爲生道之宗皇皇正範難可勝量道言凡誦是經十過洞章玄音上達玉清感格虚皇降三天正眞九陽積妙太玄之炁下開八門灌注流入羅酆幽音泉曲冥關度爾億曾萬祖受苦魂爽克得化鍊上升朱陵皆應眞期靈符攝生得爲至人而好學上經果備功圓皆得飛仙超升玉闕遊眄九霄也鴻學之士修誦是經皆即受度髙宴南宫世人受誦則壽極三元後皆得證太隂鍊形之道藏質九淵寄身后土魂不蕩空魄不沉滯歷劫同運即獲更生一切天人悉獲受度无量景福幽顯䝉惠上玄所禁不傳于世至士特重寳效心盟誓而傳輕泄玉章殃連七祖長役土官侍經聖境玉童玉女各四十八人營衛神文保護受經者身道言正月長齋誦詠是經眞光下濟漙釋幽隂爲上世亡魂斷滅罪結升度朱宫七月長齋誦詠是經正眞生炁流灌心田金籙注名身得髙仙十月長齋誦詠是經聖境内通法燿外明爲國王帝主保延世境安鎭萬邦欣樂昇平大福無疆三辰寧順天夀永昌八節之日誦詠是經得爲流珠絳闕保生眞人本命之日誦詠是經十方大聖化境髙尊乘雲駕龍來詣監盟書名元斗列奏玄冥百神集㑹功著九天大魔保舉形飛列仙道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐碧絳紫三色雲炁之中内外蓊冥有青龍白虎朱雀玄武師子白鶴羅列左右十方聖境一時同見日月照明洞煥室内項生圓象光暎十方如此分明宻呪曰无上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋清堂修行至經无量度人願所啓上徹徑御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始无量度人上品妙經元始洞玄靈寳本章十方聖境上品神霄神化度人赤符隱韻騰燿自然混漢洞冥虛無玉眞肇開元範大合神靈虛皇一炁植立諸天斬構十方五劫推遷七變神洲十轉天關玄妙聖境仙眞帝臣開明三道散化五形萬象齊立虛極靈根上周復景獨運爲身華晶至應大朴靈文九霄沖感風激飛煙迅綱木輪交瓊深淵皓皇廣布元運包纒是爲造化十極將分鬱嶽瓊臺蕭仞遐京上窮圓象琳闕飛青眇眇帝炁巍巍劫城三靈玉筵太上玄庭金閣華房森列流精廣霞育炁周變千靈中有十天校録之神中有方諸上道之君中有洪聖妙元之眞中有合境開導丈人中有東華南極西靈北鬱四維上下列聖髙眞共敷大範開化天人執天正憲无量度人今日集會攝召臨軒東方聖境賢善世界正化神王長生大聖无量度人南方聖境明離世界眞慧神王長生大聖无量度人西方聖境皓洞世界招仙神王長生大聖无量度人北方聖境清浄世界多吉神王長生大聖无量度人東北聖境妙華世界威德神王長生大聖无量度人東南聖境九眞世界福滿神王長生大聖无量度人西南聖境流光世界金華神王長生大聖无量度人西北聖境玉宸世界神智神王長生大聖无量度人上方聖境紫虚世界道樞神王長生大聖无量度人下方聖境慈護世界救厄神王長生大聖无量度人十方无極通變神王飛空度世開化大神並乗絳雲緑輿碧輦羽蓋瑶輪驂駕玄鳳白虎斑龍建元暉王節七燿靈旛前列十天大帥後從黃闕化兵猛馬蒼麟騰擲辟邪天官啓塗玄眞翼轅億乗萬騎浮空而來傾光回駕聖境度生太微玉輔元素上靈神章鴻化大洞髙尊統天執法齊㑹帝前隨方立應簡示諸天普告八極寒夜靈關洞神左府北水九淵太上羅酆六洞三宫曲池龍廐大劫河源威光九仞長役風庭火山永鏡億零女青大君符命時刻飛昇斷絶惡趣消滅罪根陽煇下濟原赦幽魂朱宫受鍊仙變成人生身合炁隨運長存因縁輪轉與天同年永度陽九百六風刀水火之難超淩三界逍遥九清九清之天天帝鑑冥無色之境梵行東方八天靈蘭雲室天帝記行宛盈聞眞成化天帝閻濟莊祕景凝神天帝逸塗獨雲玉陽聖境天帝赤序畢升海國飛郷天帝穆衍离嶽靜虛音天帝感時慶昭智常極仁天帝述俱辭名神島遊車天帝益憑子柯南方八天炎正司治天帝諒官承方百豐就和天帝迪宗中宜朱陵典禁天帝沖仙九純降都昭靈天帝兵禳仲和字庭校精素魔天帝暉道清剛璣度光天帝響邦署枚都神耀羅天帝達玄宥窺威明廣兵天帝成都祈陽西方八天束臺羽武天帝河稽魯傳韓官篤辜天帝明維子康龜巖西臺天帝冒興黎嚴直申迅靈天帝悉託思幽墟潜校天帝伯耀光挈瀆垂神天帝逐防廓明波關龍濟天帝和沖孚參首慶生天帝勑利住賔北方八天洞隂夜城天帝定平若澄孤光王峯天帝寂蒙變兟黑㟪雷司天帝澤披戢光正居錫玄天帝悲盧祈昌太一張遙天帝尤全子營素炁徊堂天帝慜都交華龍威捨湟天帝逐閑辟晞至澤洪靈天帝杜祥示恭三十二天三十二帝諸天隠諱諸天隱名天中空洞自然靈章諸天隠韻天中之音天中之尊天中之神天中大魔天中之靈九開十闢混合上清玄關大典幽妙難量造天立極敷落十方今日欣慶會遇考試諸天已滅世累斬絶惡根飛度五難乗景髙奔眞王監察無制玄門東斗注生西斗司伐北斗執𢍆南斗定格中斗帝室宣流聖澤青帝布機白帝持筭赤帝御炁黑帝交貫黄帝中居大化分判青天眞王寳慶合離赤天眞王玄眞糾非白天眞王太素運時黑天眞王天化霄暉黄天眞王靈炁所歸五天眞王萬境之尊飛行三界緫領威兵持幢仗節遊行太清位號顯著與天同生上玄化民嚴制幽扃紫微受詔掃殄祅祥天蓬執印神虎恢張流火前馳朱鳳後翔六天大醜收付魁罡敢有干犯拒抗天眞神兵左戮巨殺右刑屠割除滅風火無停千千截首萬萬誅形魔無侵試鬼無逆淩三官北酆明察鬼營敢容怠縱飛章奏呈普告十方无量神靈八冥諸帝列言紫宸混元無名非濁非清分爲兩半素玄肇平積微爲仞大化生方劫號既定冥變龍康眇眇祖源混合文昌上無景色下無化淵風行太虛空洞無邊自然聖境至道之玄碧霄降地金水成天天上天下大舍沉冥無煇無影無象無形溟涬元炁雙燿交并赤明玉虚運周自然天一流化金簡玉篇赤陽至精八垣玄文保制崑丘永劫長存梵炁彌羅萬法施張元綱交貫九地九天輪轉空無生成億千旋遶蕭山回度飛𨇠三十九帝緫攝上元十方聖境統治丹玄玄中太眞上景髙皇汎炁玉霞吟嘯洞清金延秀頼流盼雲營天音朗韻靈光散煙太蕭鬱羅明化金編千和萬合自然成眞眞中有神長生大君青華左踞玉妃右蹲太一司命桃康合淳執符把籍保度靈根上遊紫清出入玄丹三方之内六極之中下鎮人身明堂絳宫分治五神合㑹百骸十運回風萬炁俱仙飛神召靈變化無邊仙道貴生无量度人十方玄極開通八門飛行三界受書玉宸罪福禁戒宿命因縁咸受濟度天正生身身得受生上聞諸天諸天之上各有生門中有天元合變之章太上靈篇辭參髙眞第一十方聖境飛空之音玄光赤運大梵無名飛境飄飄化闕九門玉城盤回碧落敷明旋臺萬劫音華燿文中有大聖龍衣虎裳首建紫宸腰帶金璫持握四境化土中方爾能長齋鍊度文昌蕩穢紫戸納眞絳房二神擲火元一揚光見我眞形出没低昻粲粲存工灼灼在傍乗神以遊緑室朱䆫我道杳宻心合靈郷第二十方聖境之章一炁所變萬境澄清玄嶽鬱嵳仙都玉京長林茂秀大有玉庭朱衣龍章開化生根聖縁天運正道開揚炁貫飛煙結花無常穹樓千尺巨闕明堂龍游虎馳朱斾雲綱隠如太空顯如宿張發現應所行即明善惡方玉眞跨斑龍神風得髙翔第三十方聖境歌曰龍漢大劫萬品玄虚元始開天先造空无大洞上元清微禹餘靈文九訓玄眞七舒蕩蕩八垣髙升四隅赤明啓運列聖御圖五山嵳峩敷落赤書蕩蕩天闕巍巍帝居靈光下濟息役三塗頒赦河源眞風廣敷式歌此音與聖同符此三界之上飛空之中眞王歌音音參洞章誦之百徧名度南宫誦之千徧眞王保迎萬徧道備飛昇太空過度三界位登仙公有聞靈音魔王敬形勑制地祇侍衞送迎拔出地戸五苦八難七祖升遷永離幽關魂度朱陵受鍊更生是謂无量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈眞王隱祕之音深啓至玄發明洪化使彼天民咸入聖境皆是大梵之言非世常辭言無韻麗曲無華宛故謂玄奥難可尋詳上天所寳祕於髙上神霄玉清玉府大君行教應炁流傳若有至人齎金寳質心依舊格告盟十天然後而付焉道言夫天地運度否終日月五星虧盈至聖神人休否末學之夫疾傷凡有此災同炁皆當齊心修齋六時行香十徧轉經福徳立降消諸不祥无量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太隂臨過之時同學至人爲其行香誦經十過以度屍形如法則生身所行善功所營隂徳當滅度時十方聖境皆現元始天尊安座說法或援手接引旛蓋來迎魂神徑上南官隨其學功計日而得更生輪轉不惑便得神仙道言夫天地運終星宿錯度日月失光四時失序隂陽不調國境生災疫毒流行兆民死傷師友命過淨友災殃皆當修齋行香誦經夫齋戒誦經功徳甚重上消天災保鎭帝王下禳毒害以度兆民生死受頭其福難勝故曰无量普度天人道言凡有是經能爲天地帝主兆民行是功徳有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衞右别至人克得爲聖君金闕之臣諸天記人功過毫分無失天中眞王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語无量音道君撰元始靈書十方聖境祕篇東方八天群陀湮索召鑑淵沛靈馬逾綱期韜式晦遼闌彌夐列都夷悌濛巖睠羅𨓜還周器烏陽演赤皓兇乾銳報羙丙山璐章蕕粹祝多時延緑眞英仙湛那覩泊至良微瞻南方八天竇夏昆略鯨池紫澶跛玖但思蕭南𡵨顛寳節徂徠宻盟書玄樂藻梯莫直幾進綿注黍乙趨離咸資權藍傍依序歷髙次宣靈僅霄華臺他閱城璣黨扶驅洞籟潯溟西方八天庫岍甡匀丘慈始傷庚井龍羅柏房停香酌嶰留激屛麻辭眞雲嶪定相敝多淪神徹虛琅璖燕都景凝感族揚鄙智傳齊謨混覺測靈維玞粗根亮苕已禱部墟塗垠北方八天侯汪迹元披景奪靈衣篤變𢍆郭多民逵鍊泓寒穴招仙賁輪蕩交逸區爭光蒲形早炁冶東司萌決同智騫環燿規璘冀沖洞育邈里嬴魁謁豐萬仙合絶空靈寔功道言此諸天中十方聖境大梵隱語无量之音舊文題十方洞臺天闕玉都之上神化十方靈隨應出空合道微悟解之者神郷聖境無不普現字皆廣長一丈天眞皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣十方聖境化土神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大功眞王保舉上眞道備克得遊行三界升入金門此音无所不辟无所不禳無所不度無所不成天眞自然之音也故誦之𦤺十方飛天下觀上帝遥唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅震響十方肅清河海靜黙山嶽吞煙萬靈振伏招集群仙天無氛穢地無祅塵冥慧洞清大量玄玄也元始无量度人上品妙經卷之十九

十過以度尸形如法魂神徑上南宫隨其學功計日而得更生轉輪不惑便得神仙道言夫天地運終亦當修齊行香誦經星宿錯度日月失昏亦當修齊行香誦經四時失度隂陽不調亦當修齊行香誦經夷戎寇境軍事暴行亦當修齊行普誦經疫毒流行兆民死傷亦當修齊行香誦經師友命過亦當修齊行香誦經夫齊戒誦經功德甚重上消天災保鎮帝王下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能知太一神變護國禳兵之道能為天地帝主兆民行是功德有災之日發心修齊燒香誦經十過皆諸天記名萬神恃衛右别至人剋得為聖君金闕之臣諸天記人功過毫分無失天中九宫大神亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音太一神變護國禳兵玉篇東方七天吉洛慶持迷漏乙施漳陀蹇江並庚殊離乾曦蔚宛紫敕由幾贊華穴利黎紂淵宜越亶回多韓司冥河洞寂玄若緑景曜羅池盟演樞攴竟幽歌南方七天尾丹曰途館丁彥盧帝契浩都綿多英堬飊盈沖游微氣白孤道散上京嶽獄察蘇昌陽健區堯晃光舒音定法輔天琳紅腴治無攝緒九真嘯圖西方七天蘭濤役商罥池希陽散率鬼都荀候敕符浪澤寒渚斗司髙蘇正辨夷直仙遠煙濡卦說琅璇竒洞輔皇邈初景章鬼泉馘藏銜娘適漠合神郁蒼北方七天魚録海定扶騫彌華安膚祅玄智洪仙霞混元逸隸光通濛嘉圭召神竦書羅芒搖黑獸籲元赤駝龍表夀鏡寶除攴方謨宣覺益華雲神瑛奏環道言太一神變氣行二十八天天氣布流九宫此諸天九宫中大梵隱語無量之言舊文刻書太微鳳館青壁之上字皆廣長一丈天真皇人昔書其文以為正音有知其音能齊而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳三元保舉太一道備剋得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成太一天真自然之音也故誦之致飛天下觀太一遙應萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響十方肅清天輪髙映萬象懸明海光湛徹嶽穴凝煙萬國振伏稽顙帝前兵道自勝神勇自然冥慧洞清大量玄玄也元始無量度人上品妙經卷之六

front:
  text: 靈寶無量度人上品妙經卷之六天六
  hash: sha256:a6f85cf76553f5ccfe2e6e61050f148a528a81df21bdbe26d912eb4b254cb9f0
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_006-001a, image: hfl/0002/0002-004.png}
body:
  text: 太一神變五福護國禳兵品道言昔於始青天中碧落空歌大浮黎土受元始度人太一神變妙品元始天尊當說是經周回十過以召十方始當詣座天真大神上聖髙尊妙行真人三元太一真君九宫八史靈圖玉局大神無鞅數衆乘空而來九光泛駕紫霄薦芷緑煙裊香丹鳳雲輿班龍寶輦雕輪層蓋注玉凝輝縟彩爭華仙雲呈麗洞照八極九日九夜諸天神嶽靜布靈風蕩除纎翳廓清區海澄覽太和一國地土山川林木芳潤等齊碧霞回宛周視寥虛妙光同色衆真侍座元始天尊玄坐空浮玉京金梁八風浮臺雲珠寶構曲晨萬龍天德之座說經一遍諸天大聖同時稱善是時混沌營胎自無成有說經二遍太一禀生狀如蓮菂說經三遍含華吐蘂真氣流虹說經四遍九色雲芽迸勾為甲說經五遍太一居中外羅八景說經六遍玄液同滋元氣內輔說經七遍天嬰七竅開爽能聲說經八遍人物出胎太一仰視說經九遍太一試步九宫旋行說經十遍身御錦衣手持玉式是時一國是男是女欣覩天尊演示太一神變道機元宗降福度人冥信歸誠皆受濟護咸得長生道言是時元始天尊說經一遍東方三元太一慶生真君至真大神無鞅之衆浮空而至說經二遍南方三元太一廣明真君至真大神無鞅之衆淨空而至說經三遍西方三元太一神虎真君至真大神無鞅之衆浮空而至說經四遍北方三元太一隱道真君至真大神無鞅之衆浮空而至說經五遍東北三元太一鬼䇿真君至真大神無鞅之衆浮空而至說經六遍東南三元太一本生真君至真大神無鞅之衆浮空而至說經七遍西南三元太一坤母真君至真大神無鞅之衆浮空而至說經八遍西北三元太一大老真君至真大神無鞅之衆浮空而至說經九遍上方三元太一天呱真君至真大神無鞅之衆浮空而至說經十遍下方三元太一地齒真君至真大神無鞅之衆浮空而至十遍周竟十方三元太一真君無鞅之衆一時同至一國男女傾心歸仰來者皆從上元九宮太一真君中元九宮太一真君下元九宮太一真君三元每宮太一各變三宮於其三宫又變九官九宮之內每宮九宫九九各變八十一宫太一居中十方太一垂光度人是諸天人咸詣元始瞻聽大法衆不可計侍從三元太一真君雲填海赴滿餘一國聖地震動觀闕傾搖晃耀無極不可禁止於是元始不起于座上攀玉鋼手把大魁忽從空落天人遠矚華蓋燦然萬寶縈結惟見斗口元魁墜空六炳昭列碧影之間圓映金色熠熠吐霞如大火聚其中有太上真君金牀玉帳紫繡錦裙項負九色手持星珠瑩煥瓊都天尊顧視天人宣告無鞅乃曰三元九宮太一真君各乘宫室神變福祥在人身中號中黃太一宴處玄丹今作神變降道元魁遐想玉城未逾方寸我以神力無量度人太一變身同我說法於是元始登引天真大神上聖髙尊妙行真人十方無極三元太一真君至真大神無鞅數衆俱入元魁之中天人仰看惟見勃勃從魁星中入既入星宮不知所在國人廓散地還平正無復𣣱震元始即於星宫之內說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度太一神變隨運降福全其本年不有害傷傾土歸仰咸悟道心無難無兵無饑無病無暴無天無變無刑無畏無驚言符休應口饒善聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是三元太一內名隱韻之音亦是九宮內諱百靈之隱名也非世上之常辭上聖已成真人通玄究微能悉其章誦之十過太一下觀三元鼓節天輪錯翠地局界金日月合璧星宿連珠河漢揚清山嶽嚴峙靈風蕩虛萬穴吹籟移網轉機化職自行群魔束形鬼精滅爽回尸起死白骨成人太一之福滅而更生至學之士誦之十過則五帝仗鉞三元命旙太一乘車周臨八埏福從氣行萬道克先斷除不祥災饉播遷魔鬼掃迹幽爽升仙君德所加慶熙億年神威無方位居綱前疾病垂死遇而能全所以爾者學士候氣待時太一命真以制十方威攝萬天伏御地祇束縳魔靈辟災却死脫難就生太一神文變化回靈輕誦此章身則被殃供養尊禮門戶興隆世世昌熾與善因緣萬災不干太一守門斯經尊妙獨步玉京度人無量為萬道之宗巍巍大範德難可勝道言凡誦是經十過當知太一神變之道夫三元二十七宫天元人元地元三部各有太一真君主之隨九氣九星九宫之色各以定世之禍福濟時衛世護國保君使帝壽永隆天象共泰乃太一之玄功天之九宫北帝居東北遊樞東育生東南望黎南朱陵西南女房西皓清西北虛徵中黃靈其太一曰古蒼竹孚冥由紫儀九首白旗定嘉速吉兵囚人之九宫北道玄東北吐魂東嬰兒東南鬼都南火山西南虎身西熊女西北乾父中福堂其太一曰長生帝康伯輪臣斧玄圖九殺丹精七甲人母地之九宫北玄室東北蒼提東玄青東南宜明南赤兵西南將印西伏殺西北道京中普登其太一曰玄虎緑齒披髮九身青蛇白䝉血噬猖奴孟錞三元之隱名與世所稱異其道甚祕中宫五福之庭土神之精上為天皇中為太一下為玄一在學道者身為帝所而思之為玄一得其道者以一為萬以萬為一通變化知生根壽而不死長生仙也五土之氣為帝主福故四十五年而遷其室居北者九年而遷居西南者十八年而遷居東者二十七年而遷居東南者三十六年而遷居西者六十三年而遷居東北者七十二年而遷居南者八十一年而遷遷不背逆下無臨制上無刑剋則災害不生日享太平或履非其位遇非其時上下不相得則隨宮為𧕏其災眚亦繫道德之所致也能誦是經則太一回旗使者執節召福致氣不戰而勝兵道大利吉歸帝尊與天齊年太一神變難可詳知太一者三元之貴神以福人君者也其變無常知之夀無紀極道德來備太一之氣朝變為慶雲中變為重輪暮變為流金星光夜流又餘者是也見之焚香誦經以迎其福坐致天䘵得為神仙遊宴飛升自然得道雲如辨士者五福在北也雲如飛龍者太一在東也雲如舟魚者太一在南也雲如旗常者太一在西也雲如繖蓋者太一在中也雲如遊女者太一在東北也雲如火炬者太一在東南也雲如丘隴者太一在西南也雲如戈矛介士者太一在西也雲如輅車者太一在西北也上學之士不以道俗望雲燒香誦經十過太一降九宫騎吏護國安人福慶普賴皆即受度長生神仙太一真君護國帝王保安人民有知太一總臨萬天近居一身則億曾萬祖幽魂苦爽皆悉受度上升朱宫格皆九年受化更生得為貴人身自受誦心識意解則延壽長年後皆得作尸解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮太一神變天人受度無量之福生死蒙惠上天所寶不傅下世至士齎全寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齊誦詠是經迎上元太一真君從官將吏九宮大神為上世亡魂斷地逮役兵刑殞命度上南宮七月長齊誦詠是經迎中元太一真君從官將吏九宫大神消兵却敵佐輔帝王福及人民身得神仙諸天書名黃籙白簡削死上生十月長齊誦詠是經迎下元太一真君從官將吏九宫大神為國王帝主禳解五兵寧鎮八方盜賊喪形姦宄不生君臣父子安鎮國祚保天長存世世不絶常為人君安鎮其方人樂太平八節之日誦詠是經奉迎五福太一真君入居中宫得為九宫真人本命之日誦詠是經迎三元太一真君入居命局降福兆身魂神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齊戒入室東向叩齒三十三通上聞三十二天心拜三十二過閉目靜思身坐青黃曰三色雲氣之中內外蓊冥儼見十方太一各乘本宫布氣天內有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室內項生圓象光映十方如此分明密呪曰無上玄元太上道君召出臣身中三五功曹左右官使者待香玉重傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齊清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引氣三十三過東向誦經元始無量度人上品妙經元始洞玄靈寶本章太一神變五福度人三元隱韻離合自然混黃窈茫無門無傍朗朗太空道氣無方八十一劫遼廓無光混沌胞胎不從隂陽忽生至神強名太一乘駕黃龍手把天綱狀玉嬰兒丹錦緑裳回旋左右真正八鄉萬靈伏從莫有敢當太一大神是為天根時遊玉清上聖之身泥丸九宫下生萬天及以人民各有知識分别種倫分形萬物居人腦宫是為明覺一真大神上居太微中安福庭下此九宫為帝之賔太一生誕元始同真上無復祖惟道為身一既植立天地乃凝無一不光無一不明無一不立無一不成無一不度無一不生是為大梵天中之天太一真形遊步玉京上極無上大羅玉清眇眇劫仞若亡若存乘道之精三元布宫以九為程太一御之垂福弭兵與道同遷元始俱生動靜消息進退晦明前有金闕後有玉房東淨西霐太一經行支演梵氣周回十方中有三元九圖之神中有玉局行算之君中有易度遷室之神中有揚旗望歲赤幘直符丈人中有太一前驅後部八殺五福六氣九虛尊神回骸起死無量度人今日校録諸天臨軒東方無極三元九宫太一真皇長生大聖無量度人南方無極三元九宫太一真皇長生大聖無量度人西方無極三元九宫太一真皇長生大聖無量度人北方無極三元九宫太一真皇長生大聖無量度人東北無極三元九宫太一真皇長生大聖無量度人東南無極三元九宫太一真皇長生大聖無量度人西南無極三元九宫太一真皇長生大聖無量度人西北無極三元九宫太一真皇長生大聖無量度人上方無極三元九宫太一真皇長生大聖無量度人下方無極三元九宫太一真皇長生大聖無量度人十方至真太一真皇長生度世無量大神並乘碧霞紫白交雲流光照空丹轂緑輿蚪輪鳳軿羽翣朱紱䕃映搖曵驂駕九色巨天神獸玉宸飊歘之龍建青髦之節七曜洞神靈幡前嘯九歌齊唱後吹八音同鳴天馬辟邪鼓舞躑躅鸞鶴鴻䳱嘯集噰噰六甲啓途玉女扶轅億乘萬騎浮空而來傾光回駕御運度生太一直符三元九宫布䇿推局招搖大神天目飛鳥揆氣推時下臨方外福禍應期執籙把籍齊到帝前隨所應度嚴校諸天普告三界九維八極二十八分所臨邦國兵饑水旱暴卒癘疫祥瑞福應君壽道德合符下上剋制所經三官九府十二河源隂陽氣局內外一千二百度運天界人域主治福禍下逮生民祖考億劫種親福㑹所臨太一降氣幽爽䝉度冥泉發光疾除罪簿落滅惡根不得拘留逼合鬼群太一符命時刻升遷迎氣修誦升壇叩靈以祈福應雖植災宫所臨之國至信祈禳則三官鳴軫太一回轅災變為福享國太平帝夀億年世人命曆所加當為災害依法祈請天光映身及世長生太一紫宫福及天人至有滅化在貴福之分則北都寒池部衛形魂制魔保舉度品南宫死魂受鍊仙化成人生身受度劫劫長存隨圖輪轉御代直年有知其神身為仙真永度三災四殺五鬼六害七傷八難九厄超凌三界逍遙上清上清之天天帝玉真無色之境梵行東方八天太一所行九宫三十二天九色之氣隨宫灌之三十二天亦九宫之分太一所臨制也學者存思服天氣避害迎福真氣下降太一來應可致神仙有天下者依為福之天以祈請奏告神機立應羽真洞無天帝善契淵空元渚流祺天帝降流明蟄紫度九宫天帝華定膺太玄步氣天帝覺
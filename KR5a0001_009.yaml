front:
  text: 靈寶無量度人上品妙經卷之九天九
  hash: sha256:0ed0f55ed6651e99dc3253c823d7f6d22d8fad9fffd440af80d9e02376050d2a
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_009-001a, image: hfl/0002/0002-118.png}
body:
  text: 禹餘玉律品道言昔於金映碧光天中絳霄流歌太元妙土受元始度人禹餘玉律無量上品元始天尊當說是經周回十過以召十方始當詣座天真大神上聖髙尊妙行真人上清九真禹餘真仙三境真王無鞅數衆乘空而來緑華紫煙寶輿雲輔靈輝翠蓋交蔭晨霞萬色鬱煥映耀霄虛七日七夜諸天日月合景星斗停機瓊樓玉闕一時同明天風惠和海嶽晏清一國地土山川林木緬平一等無復髙下土皆瑩碧潤澤流鮮無有異色衆真侍座元始天尊玄坐空浮九光玉華寶局之上說經一遍諸天大聖同時稱善是時一國男女超悟圓覺妙性悉獲靈明說經二遍耳目聰明悟此上清為元空界說經三遍神精固真說經四遍纍業解散共證清虛說經五遍災疾不生時序和平說經六遍妙氣運化萬物皆昌說經七遍真風浹洽道德日新說經八遍翁艾返壯皆得長年說經九遍普受開度俱登如仙說經十遍天上天下萬聖稱歎是時一國是男是女皆被玄澤仰戴無窮道言是時元始天尊說經一遍東方無極無量品至真大神無鞅之衆浮空而至說經二遍南方無極無量品至真大神無鞅之衆浮空而至說經三遍西方無極無量品至真大神無鞅之衆浮空而至說經四遍北方無極無量品至真大神無鞅之衆浮空而至說經五遍東北無極無量品至真大神無鞅之衆浮空而至說經六遍東南無極無量品至真大神無鞅之衆浮空而至說經七遍西南無極無量品至真大神無鞅之衆浮空而至說經八遍西北無極無量品至真大神無鞅之衆浮空而至說經九遍上方無極無量品至真大神無鞅之衆浮空而至說經十遍下方無極無量品至真大神無鞅之衆浮空而至十遍周竟十方無極天真大神一時同至一國男女傾心歸仰來者有如細雨密霧天人微妙洞合至真化體結形分變萬億咸各相謂我等歷劫悟道無諸塵漏證位法身自入氣觀了悟玄虛初居大赤玄氣境界道妙之域無為之中次達禹餘位進清真髙證妙果涉於道極禹言廣大餘言遼遠廣天無窮故號禹餘混同元體普該一切我聞元始說法開示禹餘玉律之文最上大法檢真檢仙制命衆魔辟却邪精化惡歸善無鞅之衆迮國一半土皆偏陷非可禁止天尊俯觀普告而言爾今衆等學道登真位列上清身居禹餘法性自然已無遷變粗習俱淨細著不生自無過尤何用其律若有立教垂訓於人不立科律而辦修行譬之天帝仙真地超九品緣法俱盡而猶圓冠方屨帶劔搢圭乘駕羽軒龍旗鳳扆所以為法豈可不議今我出禹餘玉律之妙檢天地神聖之文奉之一身蔭及萬祖行之千日恩遍十方子其敬聽母忽神文也於是元始懸一寶珠大如𥞫米在空玄之中去地五丈元始登引天真大神上聖髙尊妙行真人十方無極至真大神無鞅數衆俱入寶珠之中天人仰看惟見拂拂從珠口中入既入珠口不知所在國人廓散地還平正無復𣣱陷元始即於寶珠之內說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸行道真無私無惡無漏無染無結無想無欲無穢無貪無嗔言無妄誕口詠善聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有志心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是禹餘玉律真王內諱百靈之隱名也為上清之祕九真之要知其道者因法即真因真會道道妙合神忘神於虛守道於無先天地而為主後天地而獨居匪禹餘之玉律安能使神化於無隅蓋非世之常辭上聖已成真人通玄究微能悉其章誦之十過諸仙稱譛萬帝咸欣天地清肅和氣沖融三元降瑞九壘發祥振伏邪祅凶怪蕩滅苦趣消除俱登快樂至學之士誦之十過則感降真靈招延妙精鍊神致仙司命保迎超度七祖受化朱陵回禳災禍無所不神所以爾者元真之氣出於上皇玄虛之音該契洞極混元交激布德生成一切庶彚普被其恩輕誦此章身則被殃供飬尊禮門户興隆世世昌熾與善因緣萬災不干神眀護門斯經尊妙獨步玉京度人無量為萬道之宗巍巍大範德難可勝道言凡誦是經十過萬聖竦聞諸天齊到以禹餘玉律檢察仙聖戒制神靈無不尊畏勑赦北酆億曽萬祖幽魂苦爽皆即受度上升朱宫格皆九年受化更生得為貴人而好學至經功滿德就攝制萬靈道被群品皆得神仙飛升金闕逰宴玉京也上學之士修誦是經神帝降㑹三田九官洞房集明煥耀玉光一身靈固遂獲長生世人受誦則宿罪消釋奉道希仙勤積善功當超世緣後皆得作尸解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齊誦詠是經則青帝奉律天官奏功為上世亡魂斷地逮役度上南宫七月長齊誦詠是經則白帝奉律地官奏功身得神仙諸天書名黃籙白簡削死上生十月長齊誦詠是經則黑帝奉律水官奏功為國王帝主君臣父子安鎮國祚保天長存世世不絶常為人君安鎮其方民見太平八節之日誦詠是經律總八天譬勵百神得為九宫真人本命之日誦詠是經絳宮納真依律致神魂魄澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齊戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐九色光明雲氣之中內外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室內項生圓象光映十方如此分明密呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齊清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引氣三十二過東向誦經元始無量度人上品妙經元始洞玄靈寶本章禹餘玉律上品度人帝真隱韻離合自然赤混太無玄上玉虛三元開劫生化禹餘廣大遼遠至妙之墟靈寶天君洞玄之神挺秀玉都結真上清龍漢之始積氣華明飛靈煥鬱輝煌妙文列成科簡典録之章主治萬天仙聖靈真分别善惡拘制祅氛不得橫馳敗試失正規敕邪源塞絶禍端是為元範化育所存太和華闕八景雲城大明紫宫玉霄琳房太微協晨七映長樓穹窿連落流光散浮中有玄真度命之神中有丹靈延生定簡之君中有玉晨上生大神中有都天太元丈人中有無上紫微典録察姦司過檢校尊神回骸起死無量度人今日校録諸天臨軒東方無極飛天主律神王長生大聖無量度人南方無極飛天主律神王長生大聖無量度人西方無極飛天主律神王長生大聖無量度人北方無極飛天主律神王長生大聖無量度人東北無極飛天主律神王長生大聖無量度人東南無極飛天主律神王長生大聖無量度人西南無極飛天主律神王長生大聖無量度人西北無極飛天主律神王長生大聖無量度人上方無極飛天主律神王長生大聖無量度人下方無極飛天主律神王長生大聖無量度人十方至真飛天主律神王長生度世無量大神並乘晨霞丹車寶輿翠葆羽軿驂駕玉華神鳳九氣驪龍建上清三色之節萬景靈幡前導太和妙樂後歌洞化神章獅子白鶴嘯歌噰噰九色翊麾三素衛軒億乘萬騎浮空而來儛輪霄穹流盻髙玄八極真帝十方道君神官主律靈官上卿紫文青簡總御齊臨校功度善察制邪源驛馳萬域洞府冥關太元定録保命童初三十六府崑閬易遷各承律令保度生民却除災氣延致吉祥陶鍊靈質與道俱昌下濟幽泉三官北酆者原罪福鍊化朱陵咸會真氣返形受生生身受度劫劫長存隨劫輪轉與天齊年永度三塗五苦八難超凌三界逍遙上清上清之天天帝淨霐玄虛之境梵行東方八天青化陽範天帝惠吉浦尊部真符龍天帝尼何義元景昌太明天帝窈常鄙雲左元道父天帝祝馳迅舒真氣修胃神制天帝會婆南祁柏仙鍊和天帝蔚長孳飛玉素籍玄天帝招扶隔炎蘄陽純膺天帝隱牙樞敦南方八天駐思結神天帝降婺靈棲元弼貴生天帝闕運洙滄赤宗鼓時天帝步方九關雲殿列華天帝中靜惠顔九明思微天帝耀華靈淵紀道順陽天帝宗符致空康緒顯玄天帝降須尚晨交露變玄天帝景崇元陀西方八天鍊延至定天帝曾咸宜聰少華肅登天帝祖皇述辛真明管元天帝利達辨寧太素耀靈九山天帝洞侯陽圖玉機度人天帝祚希仙王元梵象變天帝塗光上玄太霄隱虛天帝良都輔昌洞微帝真天帝總監靈神北方八天太嶽嘉慜天帝雲靈啓先玄戶理幽天帝韓婁卷䝉北司平力天帝隂政驅時真道顯芳崇令天帝覺龍宗王玄黃洞虛煥落天帝妙生智雲玉庭元素天帝力真衛濆龍梵變嬰天帝格常居泉靈極𡨕天帝推百雷三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻禹餘之音上清之尊上清之神上清真魔上清之靈玄虛至用萬化生根無量之奧深不可詳驄轄靈綱營機運真今日宣揚妙化普告三元摧魔滅試舉善升遷簡定圖籙標名帝仙玄師保舉越度太玄東斗主曆西斗定刑北斗察非南斗司姦中斗奉化統布大權青帝保生白帝輔成赤帝奏功黑帝赦罪黃帝周行恢張吉會青律神王護帝羅天赤律神王顯告刑原白律神王斬馘酆泉黑律神王拯判幽姦黃律神王五嶽都官檢律真魔萬神之宗飛行鼓從總領鬼兵麾幢鼓節遊觀太空神威赫奕諸天齊功上清玉律嚴攝北酆神王受命普掃不祥金精䳱輝飛電四騰參尾前驅玉甲揚旌流精擲火威南八衝敢有干試拒遏上真金首前戮天騶後刑屠割鬼爽風火無停千千截首萬萬翦形魔無干犯鬼無祅精三官北酆明檢鬼營不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列言上清禹餘玉律天文一百六十一字禹餘真王檢萬神制律刻玉嚴五刑敢有十道亂天經風刀割裂羅酆城九幽文人披錦巾朝騎金馬登玉京手提罪録斬鬼神敕使五帝來考魂鑊湯火飛惡煙萬兵帶甲守曲泉元因巨罰苦號天亂臣賊子審此言無犯玉律墮汝顛萬神奉律受玄文公平忠孝道之門胡為自是守空山何不立功救無間自然天帝錫子仙七祖解脫升太玄使民夀樂見太平上清司命策子名依律奉行朝帝君入景浮駕生紫宸右青書白素佩之百神衛形刋文赤棗心用以印萬病效萬神隨心所用立應玉晨大律三天妙文三氣洞合混化元清天號大赤元為上清天號禹餘始為玉清天號清微三氣未分溟洞為一三景開光三氣乃分赤混之代玉律冥冥元氣絪緼羅絡成文其氣伏藏混為玉精眇眇億劫混沌之中上玄鬱藹下元散分妙氣磅礴玉光凝精元始帝魂始為神嬰風元水玄洞虛為體金輝耀天華文之始道範既彰開化無窮禹餘之境萬道所宗流演科條運度自然經維衆度無量億千玄官神録檢御真冥保持劫會生氣長存元梵纒結三十二天運輪靈德周度十方上關帝宅下歷洞宫宣告隱篇九品符章嘯詠攝氣靈風聚煙紫虛鬱秀輔翼萬仙千和萬合自然成真真中有神長生大君無英公子白元尊神四極之君元皇主宰掌禁尊神玄都典録定簡髙靈總該玄籍舉度當仙上遊上清出入華房降延真氣靈妙之精下灌生關泥丸絳房中合五氣混合百神九變回風萬氣齊仙仙道貴生無量度人上開八門飛神運誠朝謁帝皇七祖齊升罪福禁戒宿命因緣普受開度死魂生身身得受生上聞諸天諸天之上各有仙門中有空洞謡歌之章真王靈篇辭參髙真第一禹餘玉律清玄飛空之音寥寥三界外浩氣結丹玄玉樓華靄間絳闕連朱煙中有虛無君統化御諸天妙檢著玉文出在太始先三光煥明鬱經緯總萬神察制遏百非保度道德人沖素應格言何足畏魔群洞景無遐纍億劫忘虧成誰知此至用可以保長存第二玉律檢制神靈之章赤明大劫初玄清耀玉文巍巍靈寶君掌握萬化元天地山川主神司乘我權隂陽適妙會蕩蕩無凶姦調運太平氣邪正勿相干遵奉我律章日保道德隆敢有肆橫毒敗我清靜風五帝馳威伐速送流火宫詭妄徒紛紛檢制皆不容功過無毫忒簡奏玉霄房超度升有緣同歸太妙門第三玉律元皇超升歌曰我行上清境回觀三界中指顧臨萬天歘忽轡飛龍人身如籧廬寸田百妄攻不知神氣盡五道如樊籠當思絶學觀道氣常沖融神凝形自分玄影相朦朧隂盡滅魔穢清虛合太空結鍊成仙質簡奏青華童真妙既充盈福慶及先宗躡景步寥廓萬劫年何窮自非髙真才安我希鴻濛天人同我遊勝樂靡不崇若非因律言奚所振玄風此三界之上飛空之中真王歌音音參洞章誦之百遍名度南宫誦之千遍真王保迎萬遍道備飛升太空過度三界位登仙公有聞靈音真王敬形敕制地祇侍衛送迎拔出地戶五苦八難七祖升遷永離地關魂度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈真王隱祕之音禹餘玉律統御天地檢仙制神天禁至重之文非世上常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寶祕於神霄玉清玉府東經寶室道君開教應運流傳若有至人齎金寶質心依舊格告盟十天然後而付焉道言禹餘玉律監察萬真簡定功過攝察百神夫天地運度否終日月五星虧盈至聖神人休否末學之夫疾傷凡有此災皆有天司掌轄之吏主之故眚得失干於天政玉律之所考按不得而私也敢有私蔽妄為殃咎律所不赦同氣皆當齊心修齊六時行香十遍轉經至若道士登壇嚴肅齊整如法誦此玉律大經福德立降消諸不祥無量之文普度無窮道言夫末學道淺或仙品末充運應滅度身經太隂臨過之時同學至人為其行香誦經十過以度尸形如法則地官奉律統察地祇拘魂鍊尸土中風虎不得侵害魂神徑上南宫隨其學功計日而得更生輪轉不惑便得神仙道言夫天地運終星宿錯度日月失明四時失度隂陽不調國境水旱兵盜間起疫毒流行兆民死傷師友命過同氣終歿玉律之所違犯神靈之所嚴畏皆當修齊行香誦經夫齊戒誦經功德甚重上消天災保鎮帝王下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能為天地帝主兆民行是功德有災之日發心修齊燒香誦經十過皆諸天記名萬神侍衛右别至人剋得為聖君金闕之臣諸天記人功過毫分無失天中真王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君撰元始禹餘靈書玉篇東方八天室乾頌交韓陀誓晦韜漏頥侯真阿琯參徼冒絹撲青逗驛岑瓘存興治號桓罟九逸羅端丑霞紡捐金露耀忽卓慶陂溪尋喜陳玉靜寶液鼎淫辨甲宅祥戍何三真南方八天神霄干露警青虎霞壼方中定敕法使靈岫將斬魔慧光滌元賴巫來見考魂隱宣仙功惟意真華命呼離塗救焚大宸紫君天嶽祕諱內閟法輪蓬府司監化度種人西方八天玉闕明都啓昆瑶月火令擲雷八殺戮檢魁壘神帝震誠理仙恍蕩役罰俊召龍崿遁鐫遐逵昌門入真飛甲奔鉞定竒左神略晉尹泉幽通爽魂返化冥護東符道君北方八天道沆美時虛精黃治遍俱菩那法寶玩詣玉玄經皓卯光胞幾藏粹貫遙漠洞純微絳祠覺靈依來輔王眄濟廣浦澤潤麗荒斗童録圖潢津祖糧綿冥罔著蕭回魯剛道言此諸天中大梵隱語玉律內章無量之音舊文刻禹餘玉闕之上以正玉律之文上中下真天官貴神恭以佩之不敢違也非地下官君二千石之長所遵禀爾字皆廣長一文至學得之可以飛神禹餘受事玉宸或隱靜雲宅下遊人間用其道召檄山靈考録萬鬼書名上清天真皇人昔書其文以為正音有知其音能齊而誦之者諸天皆遣中天神魔七名大將太一仙真下觀其身附其本神為兆致靈書其功勤上奏諸天萬神朝禮地祇侍門大功真王保舉神霄道備剋得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成天真自然之音也故誦之致神魔下觀上帝遙唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響十方肅清河海靜默山嶽吞煙萬靈振伏招集群仙天無氛穢地無祅塵冥慧洞清大量玄玄也元始無量度人上品妙經卷之九

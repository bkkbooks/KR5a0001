front:
  text: 靈寶無量度人上品妙經卷之五十二宙二
  hash: sha256:4e1b2f5abc2afa5f3cb2e5691ade6d42a6333416e5cf5c1a8c94c16090cf74c6
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_052-001a, image: hfl/0011/0011-044.png}
body:
  text: 玄明洞淵品道言昔於紫元天中緑景空歌太晨光土受元始度人玄明洞淵無量上品元始天尊當說是經周回十過以召十方始當詣座天真大神上聖髙尊妙行真人玄明洞淵五靈玄老水帝八方九海洞淵龍王水官四十二曹江河泉源官屬將吏無鞅數衆升空而來流雲靄霧黳玉之輿玄明之輦紫蓋神輪洞霄垂蔭流虹寶光萬色鬱勃洞煥太空五日五夜諸天日月星宿象沈海影綱蟠玉樞珠暈璣徽停輪駐耀神宮鎮靜靈嶽收雲天浮八騫氣清九野一國地土山川林木緬平一等無復髙下土明玉晶無有異色衆真侍座元始天尊玄坐空浮玉光七變靈鼇寶座之上說經一遍諸天大衆同時稱善是時一國男女歸依元始玄明洞淵之法悟此生元先從珠露說經二遍信知真水變化無窮說經三遍知見柔明利物幾道說經四遍思念生宫初降洞淵之氣腎華甲坼神龜漾遊說經五逼心穴宏敷靈潮機動玄明散液萬竅滋流諦觀靜念體妙無為說經六遍天霐澄湛明可分神一一玄中具我身相說經七遍洞淵靜碧龍神奉教說經八遍海雲擎露甘液潤生說經九遍水光發爓宫殿千層中有天民咸悟道法說經十遍玄明之氣化成紫雲普履諸天現無為海幽沈苦爽解脫逍遙是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品玄明洞淵至真大神無鞅之衆淨空而至說經二遍南方無極無量品玄明洞淵至真大神無鞅之衆浮空而至說經三遍西方無極無量品玄明洞淵至真大神無鞅之衆浮空而至說經四遍北方無極無量品玄明洞淵至真大神無鞅之衆浮空而至說經五遍東北無極無量品玄明洞淵至真大神無鞅之衆浮空而至說經六遍東南無極無量品玄明洞淵至真大神無鞅之衆浮空而至說經七遍西南無極無量品玄明洞淵至真大神無鞅之衆浮空而至說經八遍西北無極無量品玄明洞淵至真大神無鞅之衆浮空而至說經九遍上方無極無量品玄明洞淵至真大神無鞅之衆浮空而至說經十遍下方無極無量品玄明洞淵至真大神無鞅之衆浮空而至十遍周竟十方無極玄明洞淵天真大神一時同至一國男女傾心歸仰咸相議言元始天尊來降此天百寶紫元天宫為諸仙衆顯揚玄妙五行真水之法其氣名曰玄明洞淵我聞玄明為真水之德形色俱美洞淵為真水之量幽深無涯若以我等所見五行之水滔天洋洋洪浩不測不知無形五行謂之真水名曰玄明洞淵作何體狀天地未分先有真土土能固攝十方上下其中真水無量無邊風氣鼓之凝為萬物是生命本為大道元始天尊今日宣演五行無形真氣之妙我若得聞自得超升神霄上境皆當朝禮天尊覬獲太慈遺我勝法作如是說敬禮再拜來者有如細雨密霧無鞅之衆迮國一半土皆偏陷非可禁止於是元始懸一寶珠大如黍米在空玄之中去地五丈元始登引天真大神上聖髙尊妙行真人玄明洞淵五靈玄老水帝八方九海洞淵龍王水官四十二曹靈司掾吏無鞅數衆俱入寶珠之中天人仰看惟見勃勃從珠口中入既入珠口不知所在國人廓散地還平正無復欹陷元始即於寶珠之內說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏欻之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸行清淨妙靈智心心行如水利澤無盡明一明順明通明照明智明慧明辨明道明玄明空心無留滯默契玄妙同造杳冥深悟至要國安民康逍遙太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是真王內諱百靈之隱名也妙化無形真水玄明洞淵之法夫玄明為水之情性洞淵為水之室宅流則為智靜則為慧流故能通靜故能照爾能體之自然得道天地以靜真水生民物以靜真水行燥熱為火靜寒為水燥可勝寒靜可勝熱真水生故也爾若安靜真水自行變化日生靜為命元靜則長生非世之常辭上聖已成真人通玄究微能悉其章誦之十過諸天遙唱萬帝設禮河海靜默通導淵源日月合度璇璣不行群魔束形鬼精滅爽回尸超死白骨成人至學之士誦之十過則五帝侍衛三界稽首魔精喪眼鬼祅滅爽濟度垂死絶而得生所以爾者學士穢氣未消體未洞真召制十方威未制天政德可伏御地祇束縳魔靈但却死而已不能更生輕誦此章身則被殃供養尊禮門戶興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人無量為萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到水帝列言泉曲悉宥開朗冥關億曽萬祖幽魂苦爽皆即受度上升朱宫格皆九年受化更生得為貴人而好學至經功滿德就皆得神仙飛升金闕遊宴玉京也上學之士修誦是經真水上應五臟育嬰升入泥丸玄霜紫冰皆即受度飛升南宮世人受誦則洞靈激奔神泉八周益軀生神延壽長年後皆得作尸解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役右官侍經五帝玉童玉女各六十四人營衛神文保護受經者身道言正月長齊誦詠是經九變三真澤及重泉為上世亡魂斷地逮役度上南宫七月長齊誦詠是經真水出胎道受永年身得神仙諸天書名黃籙白簡削死上生十月長齊誦詠是經復本還源功歸上玄總攝正氣統御髙仙為國王帝主君臣父子安鎮國祚保天長存世世不絶常為人君安鎮其方民樂太平八節之日誦詠是經神泉流轉玉關冲盈得為九宮真人本命之日誦詠是經真水清明內照形神出紫入黃五臟生英魂神澄正萬氣長存不經苦惱身有光明三界侍軒五帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齊戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黃白三色雲氣之中內外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室內玄明洞淵之氣狀如紫烟羅絡交灌洞見百神項生圓象光映十方如此分明密呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齊清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引氣三十二過東向誦經元始無量度人上品妙經元始洞玄靈寶本章玄明洞淵上品泉關度人蒼華隱韻肇氣自然混合玄明虛無至真一元立本二氣始陳至陽下降純隂上升天真開發包絡飛騰元和大朴流結冲融氣逹崑丘精通如泉泉號玄明積為洞淵洞淵生龍龍為玄蟲九首兩翼金額銅胸恍惚之中變化神通主持氣毋宰育群容品物既宣玄道亦傳元始祖劫化生諸天玉光開景是植玄根元氣為祖惟道為身大明結華華芒蔚文五宮建立變化神靈是為大梵天中之天鬱察玄峯龜臺玉城上極元景泰洞髙清眇眇曆紀劫刃飛精三華廣堂虛梵琳庭金闕丹陽耀寶神池降注天液保度無衰玄明成霐流空洞淵洞淵無極九壘剛源變化之妙升入九天周行正氣運轉天關中有玄明洞淵之神中有南極長生大帝中有東極青華帝君中有度世司馬大神中有好生韓君丈人中有玄上司變司化持天保劫大洞尊神回骸起死無量度人今日校録諸天臨軒東方無極飛天玄明洞淵神王長生大聖無量度人南方無極飛天玄明洞淵神王長生大聖無量度人西方無極飛天玄明洞淵神王長生大聖無量度人北方無極飛天玄明洞淵神王長生大聖無量度人東北無極飛天玄明洞淵神王長生大聖無量度人東南無極飛天玄明洞淵神王長生大聖無量度人西南無極飛天玄明洞淵神王長生大聖無量度人西北無極飛天玄明洞淵神王長生大聖無量度人上方無極飛天玄明洞洲神王長生大聖無量度人下方無極飛天玄明洞淵神王長生大聖無量度人十方至真飛天神王長生度世無量大神並乘明雲紫淵之輿青玄玉輦鳳蓋霓輪驂駕九鳳七色蒼龍建汗漫總靈之節十方洞淵之幡前嘯衆真齊唱後吹列羽同嗚獅子白鶴嘯歌噰噰大帝啓途千宮翼轅億乘萬騎浮空而來傾光回駕監真度生太玄丞相暘谷靈宫玄司主録下元水官執籙把籍齊到帝前默召玄明制地參天萬生被浹枯涸生泉玄明真水凝化億門髙嶽巨山寶闕珍林皆資玄明結固變成九河水帝玄津大神上循閬崑十二洞樓絳海黃池素波紫川骨鍊金石面流渥丹長生隱遷司命帝闕隨所應度嚴校諸天普告三界無極神鄉泉關幽夜北闕酆都四空大帥六洞靈魔寒夜暗域考察玄司四瀆七澤十二溪真上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼群洞淵符命時刻升遷九源玉池部衛形魂制魔保舉度品南宫死魂受鍊遷變成人生身受度劫劫長存隨劫輪轉與天齊年永度三途五苦八難超凌三界逍遙上清上清之天天帝厚冲無色之境梵行東方八天龍明瑞玉天帝肅辭祕登滋慶道兟天帝承翰鴻暉玉真辨玄天帝殿運晞逢流華注靈天帝無惟育光崇延竟祝天帝盟章奉髙理懷變化夭帝玄玄鑒侯雲府降澤天帝執珠登全道英晶無天帝爽造延士南方八天圭辰鎮陽天帝録莊修皇赤射飛光天帝保氣曜備洞溪迎龍天帝對榆倚玄化國雲宫天帝尚丁惟寧照玄生氣天帝著時量瓊天英和液天帝生演輔童龍肖溢真天帝拂化慈元聖正仙期天帝洞梁無瓊西方八天毫靈伯江天帝足宗寧方金根養無天帝道微斥廬玄合流素天帝廣淡題徊朝仙變瀆天帝優玄賜封契真恭淨天帝翻山白從迂寂思冲天帝濮并屏閶逐神化幾天帝妙洞止評洋思定曆天帝籌突紀庸北方八天寶笥扈書天帝拂億蠢兹列源正一天帝命仙儀中瑶光述液天帝逸常京昌英正理和真天帝隨洪次章攝司㑹光天帝召神略玄祈聖格淵天帝昌回敷紳現龍降河天帝擇毗衍門幾紀因盟天帝孚廷剛三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章玄明隱韻洞淵之音玄明之尊洞淵之神玄明真魔洞淵之靈九品十階變化上清洞淵之奧深不可詳龍以水神風為火靈水中出火龍火水精真氣返履敷落神真火中出水心動精成天中之水子命之神若有能之普度天人今日欣慶受度飲咀玄明身入洞淵歷關諸天請滅隂惡斬絶地根高超六氣神升太玄真王監舉無拘天門東斗蒼精西斗素童北斗玄真南斗丹風中斗黃耀珠光化鎔如是神王居洞淵宮外玄內明八海攸同一氣變形真水潛通天地合德萬物安豐生氣之海中有九龍太霄合景上與天通身關大運六氣之真飈歘乘邁超遇九神青帝生魂白帝育魄赤帝攝氣黑帝滋血黃帝正極肇立真宅青帝龍王安寶飛華赤帝龍王元善鬱羅白帝龍王玄霄玉霞黑帝龍王道桑顯和黃帝龍王甲建持波五帝龍王玄明之靈生化洞淵飛行紫清總領真仙太上神兵麾幢鼓節遊觀杳冥自號赫奕諸天應機上天度人泉臺散開神王受命普度災危玄獸吐毒神龍八馳玉甲秉鉞青童執旗擲火萬里流光四施敢有干試拒遏上聖風刀奔突巨天橫飛流鈴交煥玄仙振威千千截首萬萬滅形魔無干犯鬼無祅精三官北酆明立嚴刑不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列奏太清玄化九變洞極圓方生育神龍持運隂陽與道同範體正純剛廣羅天闕妙立無形造化之本雲雨所藏真水九淵回度元綱渺渺曆劫混沌之中上玄為色下河為淵風轉玉輪威光戴天一身九首蟠繞群京蒼源瑶海龍嶽飛城天上天下無幽無冥洋洋洞淵萬龍斯官雲書玉字元始赤
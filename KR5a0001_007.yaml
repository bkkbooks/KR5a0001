body:
  text: 顯瑞符應品道言昔於大丹天中洞陽幽𡪹赤精境土受元始度人顯瑞符應上品元始天尊當說是經周廻十過以召十方始當詣座顯化大神立瑞靈尊符應真人無鞅數衆乗空而來泛氣紫霄瑶輦琅輿華蓋垂蔭金碧交光飛雲蔚藹朗燿大虚九日九夜元綱天輪慶煙髙浮七曜凝煇坤靈發祥三元肅靜四炁澄清諸天寳闕瓊樓瑞霞照映皆現八會真文洞煥上宫無有異色衆真侍座元始天尊玄坐空浮五色寳山之上說經一徧諸天列聖同時稱善俄有丹鳳黄龍來告升平說經二徧大地山川七寳湧出說經三徧渺景隂華光結重輪說經四徧天市太微皆現景星說經五徧瑶華滿空慶雲四飛說經六徧甘露凝珠潤澤一切說經七徧城闕臺觀玉芝羅生說經八徧靈書敷陳真符下降說經九徧天授玄圖帝膺寳籙說經十徧人民康樂普受百福草木昆蟲咸均至化是時一國是男是女莫不傾心覩見玄瑞符合聖時各受護度皆得長生道言是時元始天尊說經一徧東方无極无量品舉仙大神無鞅之衆浮空而至說經二徧南方无極无量品丹池大神無鞅之衆浮空而至說經三徧西方无極无量品明燿大神無鞅之衆浮空而至說經四徧北方无極无量品雙闕大神無鞅之衆浮空而至說經五徧東北无極无量品碧霞大神無鞅之衆浮空而至說經六徧東南无極無量品黄上大神無鞅之衆浮空而至說經七徧西南无極无量品中皇大神無鞅之衆浮空而至說經八徧西北无極无量品天元大神無鞅之衆浮空而至說經九徧上方无極无量品玄虚大神無鞅之衆浮空而至說經十徧下方无極无量品洞淵大神無鞅之衆浮空而至十徧周竟十方无極顯瑞符應大神一時同至一國男女各相謂言我等昔聞五篇初岀三界始分天尊帝王降生諸天神靈告瑞夑化其中今聞元始演陳天地之本悉歸帝王帝王之德配於天地道隆德廣神備炁充五行至精各顯玄妙挺生竒異敷告帝王爲瑞符應理該洞玄傾心歸仰來者有如潮期風信無鞅之衆迮國一半土皆偏陷非可禁止於是元始放大光明隱顯莫測所御寳山化成一珠大如朗月在太虚之中去地萬丈元始登引九天列真上聖髙尊妙行飛仙十方无極瑞應大神無鞅數衆俱入寳珠之中天人仰看惟見拂拂從珠口中入既入珠口不知所在國人廓散地還平正無復欹䧟元始即於寳珠之内說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土蹄仰咸行善心不妄不謟不黨不偏不苟不佞不恣不憍不慢不欺心行恭讓口無浮言齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心尊奉禮敬皆得度世道言元始天尊說經中所言並是洞神祖炁靈寳内名隱韻之音亦是降瑞符聖列真内諱飛仙之隱名也非世之常辭上聖已成真人通玄究微能悉其章誦之十過諸天降瑞萬帝錫符河海靜黙山嶽藏雲地瑞顯明髙靈燭幽群魔束形鬼精滅爽廻屍起死白骨成人至學之士誦之十過則五帝納瑞三界告盟顯應至仁式揚至道所以爾者天地發祥符合聖真爲瑞之炁其炁妙微思而不得論而不知萬物爲變五行化竒人感其精不爲朽屍輕誦此章身刖被殃供養尊禮門戸興隆世世昌熾與善因縁萬災不干神明護門斯經尊妙獨歩玉京度人无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過精感上玄克集瑞祥妙炁凝結萬物化光上輔人君道運無疆永保億年而好學至經功滿徳就皆得神仙飛昇金闕遊宴玉京也上學之士修誦是經天瑞昭應福被一方簡奏天官名度南宫世人受誦則靈芝發生池涌醴泉降集道炁制靈召和精鍊服餌延夀長年遊行五嶽位證地仙此經微妙普受無邊一切天人莫不受慶無量之福生死䝉惠上天所寳不傅下世至士齎金寳效心盟天而傳輕泄漏慢殃及七玄長役鬼官侍經五帝玉童玉女各一十二人營衛寳章守護受經者身道言正月長齋誦詠是經使天炁和平草木發榮物無疵癘萬寳俱成七月長齋誦詠是經九天降神山嶽孕精産育賢人慕道學仙十月長齋誦詠是經天地開通封山致靈符瑞臻應俱會帝庭永鎮萬方民稱太平八節之日誦詠是經五榖繁滋異秀呈祥月晦之日誦詠是經丹碧靈芝以度兆身不經干試身有光明玉華燿映羽葆司迎萬神朝禮名書上天功滿德就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐蒼碧赤三色雲炁之中内外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室内項生圓象光映十方如此分明宻呪曰无上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋清堂修行至經无量度人願所啓上徹俓御元上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始无量度人上品妙經元始洞玄靈寳本章上品顯瑞符應變化度人玄微隱韻符合自然蒼混流精鍊胎結仙妙光景煇化生赤文融構羅絡慶煙交纒植立玄根烱燿諸天丹光玉書普集五靈虚无曠邈浮響幽寥真宫帝炁絳籙生音流布九霄水火飛騰是爲珍瑞混一之居七寳玄臺紫微上宫上極太無髙清鬱單把握元機巍巍至尊統御隂陽造化生成上範虚漠理微太幽宴處大羅遐覽十方中有玄元大化之真中有上清七變之君中有顯揚天瑞之尊中有符應帝運真人中有斡旋天綱鎮安地紀飛行空界立極尊神總校圖録无量化身今日慶會萬神臨軒東方无極仁德神王長生大聖无量度人南方无極明德神王長生大聖无量度人西方无極化德神王長生大聖无量度人北方无極智德神王長生大聖无量度人東北无極柔德神王長生大聖无量度人東南无極正德神王長生大聖无量度人西南无極文德神王長生大聖无量度人西北无極清德神王長生大聖无量度人上方无極玄德神王長生大聖无量度人下方无極厚德神王長生大聖无量度人十方顯瑞符應神王長生度世无量大神並乗絳煙瓊車瑶輦紫盖龍旂驂駕天鹿靈鳳騶虞建玄英之節三素神旛左列飛天大將右徔流金火鈴天馬麒麟騰擲辟邪十華啓途五佐翼轅億乗萬騎浮空而來靈光回耀命仙集真龜臺典録崑崙閬風玄司主宰符瑞大神執簡侍章同到玉庭隨所昭應攝召諸天普告域中仙境神洲八海四瀆名山大川洞天宫府十二靈源大地曹局黄闕九宫速布道化肇發嘉祥不得壅遏元瑞克臻真王受符福蔭下民寒暑順時三景長明物無災癘百榖豐登化被四夷仁及昆蟲遂性逍遥欣樂太平隨劫輸轉俱獲飛仙永斷六天魔試之難凌空歩虚遊宴太冥太冥之天天帝文昌極道之境梵行東方八天應德寳玄天帝太京祖門顯靈恭燿天帝伯公容運慶冥感天帝后元留常貟明化氣天帝召林永仙開光妙真天帝合季沖仙度仁受天帝正光通生旻章廣志天帝昊集髙𡖖玄化澤都天帝覃承理弓南方八天崇文惠聞天帝拂鑒朗紀延大功天帝祝求聞禮尊告玄天帝連最招敦太華綵靈天帝將賢匪庸髙虚明惠天帝洞浦臨正力定方天帝敷要驄竒君慈布仁天帝景回萬容用成積化天帝穹景資西方八天育王宗變天帝防監淨康方義端妙天帝洪飛益梁厚信興教天帝混至杯庚成敏施周慶生天帝道昌化延微嗇元映天帝巒宏遠衝玄監流精天帝召闕山希元聖品仙天帝卓抱臨瑞莊明符天帝恭䝉比元北方八天法海龍煇大寳天帝崑羅燿空洞宻昭天帝覺神機宗元妙光天帝好從輔昌融混豐炁天帝守蒼流軒彌印合輪天帝揚旗布安太妙護世天帝吉攴越初歷變全道天帝圖斯騫門廣生章觀上加天帝合輔召嚴三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隠韻大洞之音靈寳之尊瑞應之神開祥啓運混炁之靈九轉十徧登虚躡空神妙玄奥髙蔭二儀敷落丹華顯應天人今日同欣至化歷感諸天泛景紫霄回儛雲營超渉弱淵玉燿靈津仙聖錫符受書帝門東斗運神西斗鍊精北斗凝結南斗布靈中斗攝炁符瑞化生青天命真素天舉仙玄天定録丹天召仙黄天慶會總闢元關廣霞神王經紀彌綸長離神王上炎流煙昌開神王主制七關鬱單神王仙鍊八威中黄神王監真紏非五天髙真萬化之尊統御天政運斡璇璣乗龍駕雲飛行太微照辟祅氣正氣同歸上帝降圖丹景炎光大君受詔威制十方百邪摧滅道化施張嘉祥來至境界澄清五行順軌皇道長明敢有暴亂束送女青三元列曹定罪嚴刑九天八極考校無停人主受福國安民豐社稷綿綿億劫無终克享太平與道俱隆神飛玉京遊宴上宫宣示萬神普告無窮三界五帝列奏髙穹大運澄廓啓極丹光植立諸天流變隂陽上騰三氣下化百常元洞幽奥飛範堅剛玄曆數周六濁九清太漠鬱微無象無形混沌玄黄靈音散生敷我至化廣運自然炎精扇猋鼓躍天淵瑶編赤簡玉籙正文攝召沖炁役使萬靈天書森羅大法恢張隨劫開演大素妙篇授圖神霄永鎮瓊宫數當慶會應運流傳普度群品同蹄三元至教清明功參上玄玄中瑞符來應真人生民樂康境土常寧含煇隱煇鎮息綿綿保精玄華鍊胎紫煙乗霞泛景舉形飛仙千變萬化與氣合真真中至神萬道之君正天御極億劫獨尊號曰元始是爲我身三界治官總統生根上遊玉虚飛神太無圓羅之内混黄之中洞淵無色八極靈關速召大魔制會玄都十轉回風慶及幽㝠天道降祥无量度人上開生門經入飛輪考校圖籙善惡因縁咸受開濟死魂生身身得受生上奏紫清紫清之上各有玄音中有顯瑞符應之篇三素玉章辭參髙真第一飛仙吟詠元始立極之音眇眇觀大無諸天宗虚皇龍漢既已徃冥冥度延康天地返鴻濛八垣藏精光三界皆化消生靈遂渺茫獨有極道境群有無夭傷赤光開玄圖真文散十方妙炁降清微飛輪結元綱靈寳育三景萬化復恢彰玄符鎮五山世祚永無疆上聖生圓羅常居大福堂正統皇極道永以付真王第二大魔讃歎說經昭感之篇朗朗玄綱周流八虚輪轉諸天統會玄都嚴嚴萬神環侍帝居上聖弘至教洞陽羅簡書十過演靈章群品皆昭蘇妙道無窮極億天藏一珠仙真慶無已玉虚受玄符赤文煥碧霄祥煙滿空浮大地發珍竒騫𣗳生瓊琚鳳麟降世間玉芝秀庭隅萬劫護昇平玄化從此敷第三真人宣告顯瑞符應之章元始虚皇髙居玉清生育三景立天之根右列玄煇左運貟明分炁下中天斗極爲至尊端坐朝八維下應於人君人君順天道嘉祥隨德生地出長生籙天授玄景文山川浮秀氣珍瑞集王庭兆民無災癘五榖保豐登明宣太上㫖萬天咸使聞群品盡歡悅稽首荷玄恩此三界之上飛空之中真魔歌音音參洞章誦之百徧名度南宮誦之千徧真魔保迎萬徧道備飛昇太空過度三界位登仙公有聞靈音天瑞降身魔王敬形勑制地祇侍衛送迎拔出地户五苦八難七祖昇遷永離冥官魂度朱陵受鍊更生是謂无量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝至靈隱祕之音上元太和萬福之氣爲祥爲瑞顯吿於君爲人爲忠良賢達在物爲寳玉偉異於禽獸爲麟鳳龜龍於地爲五芝竒木珍石山河之祥於天爲慶雲景星甘露人君有道符應所行之德皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奥難可尋詳上天所寳祕於神霄玉清玉府東藏經室數行壬辰運應下傳若有至人齎金寳質心依舊格告盟三天然後而付焉道言夫爲善仁之德則天顯瑞符應以報其君爲惡眚之過則天顯災異以告於民故於天地運度否终日月五星虧盈至聖神人休否末學之夫病傷凡有此災同氣皆當齊心修齋六時行香十徧轉經嘉瑞立降消諸不祥無量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太隂臨過之時同學至人爲其行香誦經十過以度屍形如法靈瑞之氣黙降於身魂神俓上南宫隨其學功計日而得更生轉輪不惑便得神仙道言夫天地運终星宿錯度日月失明四時失度隂陽不調國境不安農商失利疫毒流行兆民死傷師友命過皆當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎮帝王下禳毒害以度兆民生死受賴其福難勝故日无量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋焼香誦經十過肇降嘉祥永保太平皆諸天記名萬神侍衛右别至人剋得爲聖君金闕之臣諸天記人功過毫分無失天中真魔亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語无量音道君譔元始靈書瑞符曲篇東方八天蟄積扈演仇非琯忱彌羅漫醻決都合岑古娥罔籍綿洪美欽洞荷丙珞華瑶子尋屈波樊那明魔大林妙際極梵目奮玄深侁住戌解曆瓊闢辛忽灼徧柯銘謀符歆南方八天晢遅延殊救嘉珉賢果澄利頂公祕景單越那鬱諾顯社兹元瞀俊豆閣宜正復騫和舒慜農畢室九回郎化止伯思巳懸居社嘉法祈録足尉微光屯幽爽乾靈自催西方八天沖廣魯淵牟陁焵宣弼乙旦娑氣䝉師匀薄約龍淀甫幽建存踐將横卒蔽仙浦全杳温澤臺應晞蒼輪聿兀昭素雲和鼓瓊寥延鹿迷攝精祕𡖖陸謨吁恪寳輪猷屯北方八天角還悟鏜夷林希疆玄遁清微古慎匪揚霞巒邀塵問覺通皇智平由逵矴機式郎耦都離珊召封化光龔寵祖迂斗轅兵剛漂盧健需玄釜隂當靈肘捐度太赤混方道言此諸天中大梵隱語无量之音舊文書中天黄靈臺招十二玄瑞二十四應於元始五老大福堂之境赤書玉文顯瑞符應之始字皆廣長一丈天真皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勲真魔保舉神霄道備剋得遊行三界昇入金門此音無所不辟無所不禳無所不度無所不成天真自然之音也故誦之致飛天下觀上帝遥唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響十方肅清河海靜黙山嶽吞煙萬靈振伏招集群仙天無氛穢地無祅塵冥慧洞清大量玄玄也元始无量度人上品妙經卷之七

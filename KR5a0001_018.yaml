front:
  text: 靈寶無量度人上品妙經卷之十八地八
  hash: sha256:b63db59f4afaf8c84bf6237247f207cc5dcecf7151539acef924321c7f9a8f55
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_018-001a, image: hfl/0004/0004-082.png}
body:
  text: 素景曜靈品道言昔於元洞天中慶霞流音太空化土受元始度人素景耀靈無量上品元始天尊當說是經周回十過以召十方始當詣座天真大神上聖髙尊妙行真人西華玉妃四極真王黃素元君飛天騎吏仙官主宰無鞅數衆乘空而來白雲緑霞羽駕飊輿華蓋浮晨珠璧交光五色鬱勃洞煥太空九日九夜諸天日官月府星闕長樓元斗停機三道平周剛風鎮靜崑嶽收雲地浮五瑞天開八門境土山川誠廓林木緬平一等無復髙下土皆變瓊瑤無有異色衆真侍座元始天尊玄坐空浮萬葉寶蓮之上說經一遍諸天大聖同時稱善是時一國男女仰聽法音神識開悟說經二遍靈府虛明說經三遍默𢍆玄妙說經四遍真氣灌身萬疾皆愈說經五遍體合正道衆惡消摧說經六遍三十二天發見真文說經七遍九天玉境四極玄宫三洞寶經昭然徹見說經八遍貟羅之下太空之中一切音聲皆參大範說經九遍九色妙光下燭幽夜普赦北酆受苦罪魂說經十遍十方萬類遂性逍遙是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品華林大神無鞅之衆浮空而至說經二遍南方無極無量品赤文大神無鞅之衆浮空而至說經三遍西方無極無量品帝符大神無鞅之衆浮空而至說經四遍北方無極無量品元景大神無鞅之衆浮空而至說經五遍東北無極無量品青精大神無鞅之衆浮空而至說經六遍東南無極無量品圓珠大神無鞅之衆浮空而至說經七遍西南無極無量品廣霞大神無鞅之衆浮空而至說經八遍西北無極無量品金華大神無鞅之衆浮空而至說經九遍上方無極無量品紫霄大神無鞅之衆浮空而至說經十遍下方無極無量品靈都大神無鞅之衆浮空而至十遍周竟十方九極天真大神一時同至一國男女傾心歸仰欣聞元始宜說素景耀靈之法外生天地結成混沌內生萬物變為嶽瀆皆由無形五行真金之性虛明同力不可破壞至生人神知見悲喜率因素景不鑿之剛耀靈明察之體而以為之物有堅脆其成為一人有聖凡其知為一我等雖懷此金未經冶鍊今遇元始以此法火瑩此神金鑄為法器成此道力無量變化作是說已欣樂再拜旋繞座側來者有如細雨密霧無鞅之衆迮國一半土皆遍陷非可禁止於是元始懸一寶珠大如黍米在空玄之中去地七丈元始登引天真大神上聖髙真妙行真人十方無極素景耀靈至真大神無鞅數衆俱入寶珠之中天人仰看惟見勃勃從珠口中入既入珠口不知所在國人廓散地還平正無復欹陷元始即於寶珠之內說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸知妙微無執無滯無想無結無愛無憎無苦無惱無敗無虧心行正道言合天機齊同慈愛異骨成親國上康安永慶太平經始出教一國以道頂有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是真王內諱百靈之隱名也開示道妙無形五行先天地生同寓一氣浩劫不分內有神金素景耀靈外成諸天內為真神剛堅無壞萬物仰成爾能知之可以長存非世之常辭上聖已成真人能悉其章誦之十過諸天遙唱萬帝設禮河海靜默山嶽藏雲金輪停景玉璣不行浩浩太空飛度生門柔為至剛虛為至藏大不可圍廣不可量金光素景耀靈無方堅凝流行得道之疆群魔東形鬼精滅爽回尸起死白骨成人至學之士誦之十過則金門校仙真籙奉玄五帝侍衛三界稽首魔精喪眼鬼祅滅爽濟度垂死絶而得生所以爾者學士穢氣未消體未洞真神金未堅遇火則鎔素景未潔耀靈昏曚召制十方威未制天政德可伏御地祇束縳魔靈但却死而已不能更生輕誦此章身則被殃供養尊禮門戶興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人無量為萬道之宗巍巍大範德難可勝道言凡誦是經十過素靈神金不散至靈耀魄長存隂關自開諸天齊到億曽萬祖幽魂苦爽皆即受度上升朱宫格皆九年受化更生得為貴人而好學至經功滿德就皆得神仙飛升金闕遊宴玉京也上學之士修誦是經素靈合性空體至神金身得道栖泊上清皆得受度飛升南宫世人受誦真一守身金德不朽業火不焚則延壽長年後皆得作尸解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死䝉惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役冥官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齊誦詠是經木表金胎五藏生春枯朽老敗得新長生為上世亡魂斷地逮役度上南宫七月長齊誦詠是經耀景金津神威內冥百關堅彊淵池𣿼靈身得神仙諸天書名黃籙白簡削死上生十月長齊誦詠是經水得其金結為聖胎天地一塵至妙至玄爾能行之變化飛仙為國王帝主君臣父子安鎮國祚保天長存世世不絶長為人君安鎮其方民稱太平八節之日誦詠是經水火土木併蝕於金永固其神得為九宫真人本命之日誦詠是經太一下臨素景耀靈呼子三魂左三右七役使無停魂神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書土天功滿德就飛升上清道言行道之日皆當香湯沐浴齊戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黃白三色雲氣之中內外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右素景耀靈之氣晃如皎月輝耀頂上日月照明洞煥室內項生圓象光映十方如此分明密呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齊清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引氣三十二過東向誦經元始無量度人上品妙經元始洞玄靈寶本章素景耀靈上品妙首開天度人虛皇隱韻混合自然大洞元金空玄至真堅剛明決神化彌綸不壞無染變境髙清包含太虛內生九元無形真妙道性靈玄元皇布氣肇立諸天剛風內鼓素耀外旋至陽凝質梵氣液泉結為大器二象乃分開明素景是為靈根上無復祖惟道為身耀華流結普植神靈無上玉篇安鎮丹城無文不光無文不明無文不立無文不成無文不度無文不生是為大梵天中之天鬱羅蕭峯金闕瓊山上極玄上大赤清源眇眇浩劫若亡若存三輝帝室大有黃庭瑶刃朱宫天真玉房太素化氣同遍十方中有素景耀靈之真中有南極九玄之君中有度世皇老大神中有太霄成妙真人中有紫庭真帝元素道君中有南昌定命司變主録運化保鎮尊神回骸起死無量度人今日校録諸天臨軒東方無極華林神王長生大聖無量度人南方無極赤文神王長生大聖無量度人西方無極帝符神王長生大聖無量度人北方無極元景神王長生大聖無量度人東北無極青精神王長生大聖無量度人東南無極圎珠神王長生大聖無量度人西南無極廣霞神王長生大聖無量度人西北無極金華神王長生大聖無量度人上方無極紫霄神王長生大聖無量度人下方無極靈都神王長生大聖無量度人十方素景耀靈神王長生度世無量大神並乘層雲金霄八景之輦玉輿羽軿素蓋飛輪驂駕九光神虎玄甲蒼龍建流金之節招靈大旙前列太玄寶仗後從三天化兵白鳳麒麟嘯歌噰噰七耀啓塗三真翼轅億乘萬騎浮空而來傾光回駕召靈度生西崑上空瑶闕髙仙九微太妙黃景元君執符把籙齊到帝前原兆生胎禀道以來業識念想纒思億𡨚汩亂素境耀靈翳昏神光正性曠劫冥頑元始洞火冶鍊純堅金華變體當為真人粗辱毀敗逐愛散分隨所應度嚴校神靈普告洞淵無極名山泉沙之嶽北闕寒庭神州五鎮十二溪源三河四瀆溟海咸池疾除罪簿落滅惡根不得留滯怠縱魔群元始開化隨運升遷六天隂官拔度沉魂制玄監舉鍊度朱陵太清降氣仙變成真生身受度劫劫長存隨劫輪轉與天齊年永度三塗五苦八難超淩三界逍遙上清上清之天天帝妙玄無色之境梵行東方八天玉𡵨英實天帝伯戊景勳秀峯翠華天帝眇珍叢池寶林耀光天帝芳霄宛驛真元靈韞天帝冥成妙沂玄符顯靈天帝肇啓元皇集瑞慶皇天帝方稽生瑶瑰映虛仙穴天帝澤嶽匠靈汶波碧洞神宮天帝道光仙南方八天陽台化景鍊真天帝寶宣紀延南明洞陽天帝劾章測神司炎治明天帝護生極言檢真定曆天帝執機主民降氣大光天帝嚴威四衝沖和總領天帝化令正行溟無赤景天帝奉皇玉尊變化定籍天帝鑑英皓定西方八天主福定生天帝巽都景陽素景耀靈天帝綿觀典常閬圃瑶琳天帝露漙順華西臺玉匣天帝寶當元畸靈玉治方天帝訊先求爽剛山頂龍天帝奮光紫神七絶神虎天帝力關威京梵氣金乘天帝巖幾靜山北方八天玄老海藏天帝宅神嶽羅龍光萬虛天帝耀金爓剛雲營周華天帝微玄部清忠嶽洞波碧琳天帝絶崿珠瓊宫無極天帝昭髙𤪽佪蒼目化山天帝拔方起雲京臺海穴天帝濯上慈真五神泛洋召靈天帝宛令西波三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻天中之音天中之尊天中之神大化真魔合變之靈九復於一十還於九九合十遷素景生輝金無結滯與神同并神無變壞鍊之即鮮耀光為澤共名火宫神金鼓冶合會太清無量之奧杳不可詳敷落三華普鍊神人今日欣逢化度歷試諸天請降至妙大慶因緣飛步五辰名列髙玄真王監察拘制元關東斗授神西斗化形北斗注籍南斗開生中斗黃華合景耀靈三真之氣發為金英青帝執規白帝御兵赤帝守衛黑帝結凝黃帝演化萬道乃成蒼華天王攝氣舉仙丹霄天王上炎流煙素景天王開天召山玄耀天王通導百川混極天王坐鎮崑山五天真王萬神之宗飛行六合遊宴天宫總氣耀靈敷散太空自號赫奕諸天齊功上天鍊真同會明堂神王震威掃蕩不祥青霞布天電火施張丹靈扇飊收滅遊光域中大帥擲劒剛風騰耀萬里流鈴八衝敢有千試拒抗三官玄鉞前戮神金後刑屠割祅魅風火無停千千斬戮萬萬誅形邪無侵犯保護生民六天九宫明檢鬼營不得怠縱金馬交呈普告羅酆無間溟泠三界大魔飛章玉京元洞玉冊五氣混淪金氣為骨木氣為筋水氣為血火氣為神土氣為意物乃化形虛皇妙道三象告成玄元建立羅列神靈明以燭物烈以辨真動則成禮靜則晦溫神光變化火復依金金體無變運幹飛輪貟華震耀風扇於明乃成大象皇極髙清元微大素金現長庚紫融灌虛白章洞旻流結五氣生育七玄大洞消魔玉惠靈篇共敷至化天晶妙光九龍大劫數極延康眇眇億劫混化堅剛五氣為色五精為淵風水相包泰極無邊黃臺杳邈朱闕沉冥無形無影無極無窮鴻濛太朴遼廓開生芒華流彩運度自然虛皇保劫元素玉章丹景結璘大布青房赤耀至靈演氣十方旋斗歷箕回度五常三垣化闕明列元綱八景赤文攝氣髙玄玄中太真上帝飛仙素景金霞嘯詠洞虛耀靈緑羅交響雲輿玉音泛霄黃華執符紫清鬱嶽轉翼元居金為神液流貫蒼圖千和萬合自然成真真中至神南昌上靈通班元老安寶帝尊玄一九輔司命真君簡閲生章變化飛根上遊清單出入華源八冥之內細微之中下極重泉九壘淵宫中治生民萬物混同十轉回靈與氣俱仙仙道貴生無量度人上開八門耀景天輪罪業禁戒考校因緣普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有升遷顯耀之章黃素靈篇辭參高真第一素景顯妙飛空之音太虛生至真太空成有形運轉無津涯普育諸神靈玄清化圓羅混黃沉杳冥錯謬散為物沖和構人倫朗朗諸天境持握生道根蕩蕩大化基八冥歸玉京元始顯真妙素景融神金既悟重玄旨合體通靈明七祖升天堂南昌朝帝尊五苦永解脫天魔詠謡音齊樂真王化群類皆長生第二耀靈常照真王之章龍漢立劫仞丹光建元圖大聖玄一帝敷落飛天書髙仙受天命正道祕清都洞章下玉京靈光煥八隅元尊示神變億天藏蘂珠故以常明金冶鍊貪愛徒神金真化氣灌注度凡軀明明無濁汚玄精當不枯耀靈玉景源常照成空無巍巍太慈尊宣演開生符妙微上清旨真悟合玄虛鍊氣登種民玉篇從此敷第三成道變化之歌百魔樂沉溺飛仙唯好生神氣常堅完三界無死生既悟上清道與化相順成宴景常陽宫東井浥天津逍遙度剛風三垣朝帝尊茫茫大輪下俯世何營營一瞬為虛空浩劫焉有程擕手誦大範素景永清澄運轉法輪綱變化通神靈東桑觀濯羅西崑眄長庚使爾見真教靈府長虛明刻名玉真檢削落鄷泉名振衣淩太霄稽首虛皇庭此三界之上飛空之中飛仙歌音音參洞章誦之百遍名度南宫誦之千遍真王保迎萬遍道備飛升太空過度三界位登仙公有聞靈音魔王敬形敕制地祇侍衛送迎拔出地戶五苦八難七祖升遷永離冥關魂度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地嶽禍及七祖翁道言此二章並是諸天上帝及至靈真王隱祕之音發明至真妙本生元大神雖因元始洞陽九鍊赤氣玄空真火以為明識覺了能知之體珠不知堅固不壞經劫不變今古常存湛然定觀全依無上清淨不動至大至剛真金為質能生能動木風為助金風相耀遂成炎景洞然而明名曰純一妙靈之氣為道之玄奧成立混沌生育三才無不由此兆若體之瑩我靈根以自神力遍無窮界仙靈鬼神人龍萬物自我陶鎔十方諸天不從外得皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寶祕於玄都神霄玉清玉府東寶經室依科三萬七千年應運下傳若有至人齎金寶質心依舊格告盟道君然後而付焉道言夫天地運度否終日月五星虧盈至聖神人休否末學之夫疾傷此皆神氣內虧素金不靈故耀空有待則制殃衰凡有此災同氣皆當齊心修齊六時行香十遍轉經福德立降消諸不祥無量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太隂臨過之時同學至人為其行香誦經十過以度尸形如法素景還復耀靈更明魂神徑上南宫隨其學功計日而得更生輪轉不滅便得神仙道言夫天地運終星宿錯度日月失昏四時失度隂陽不調國土生災水火風劫疾毒流行兆民死傷師友命過同學終亡皆當修齊行香誦經夫齊戒誦經功德甚重上消天災保鎮帝王下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能為天地帝主兆民行是功德有災之日發心修齊燒香誦經十過皆諸天記名萬神侍衛右别至人克得為聖君金闕之臣諸天記人功過毫分無失天中真王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君撰元始素景耀靈玉篇東方八天奎都出陌化揚入參霞虛激璘延歌沂涔萬竦柘宿淇華幾欽轉蘭彩望晨精典尋昭盈靈肆溢卜奚登擎莊荷露龍蚾捐沉靜佐亟道劉彬緒忱秷稂蕩卑里適逾金南方八天蓬整絶力赫難志外寅珞尤趣延需利瑾琢華透方儀奔汾郡哲疆仙稀珍異實進燎灘蕩虞色離弼應杳坤陳歆祕野桓定角聻敕戮陽山𦤺信風演孔雄曆帝充仞西方八天素景奠生紏都佳萌健納甲竺誓攻本神迮東獻威相妃蘄尊敬罷欽役奴軍總雲吉堂洄侶至戈鼎熒萬鑑獨持化師九成便良日辟斗往岡生浪恥達隨圭山啓兵北方八天闠程鋏遼景生系郎玄進紫玉投遠趣光董真樞靈星侔箕羌遁履太幽北昆杳房庇夜軍利氏瑟齊邦度潜倚霞命旗灑藏桑碧螭首洞玄辭皇律躋魔丑臺止賔祥道言此諸天中大梵隱語無量之音舊文刻書玉臺西真素景之堂以開三辰之光太一典經紫靈醮香元帝命神萬靈聿章目見口言神金流剛舉天承地使兆慧良總持冥機恍惚存亡鬼入神出變化無方帝之寶書豈世所聞字皆廣長一丈天真皇人昔書其文以為正音有知其音能齊而誦之者諸天皆遣素景神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳魔王保舉上真道備剋得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成天真自然之音也故誦之致素景下觀上帝遙唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響十方肅清河海靜默山嶽吞煙萬靈振伏招集群仙天無氛穢地無祅塵冥慧洞清大量玄玄也元始無量度人上品妙經卷之十八

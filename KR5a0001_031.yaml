莬棊純精杳紛韜祕幽諱交渾治崙氣徹内返神嬰自存職熾嶼崵偶銜丕容吟宂潜納寳粹温通屈流地海頂遘繪同玉霐延和仙鍊輔沖南方八天玻回霞液凝降崿樓玄黃滋化曲窊漕濛奎室虚光三宸皎昌青白英元黄真火堂冏照東華飲瀹粲張扶思舉龍軨車控翔熒庚楠壇玄井護昆綱射激明靈魔渾然西方八天庭雲鬱披鋌瓊感機左池汩鳴結英懽尸灌引天淵復運太微眇私山玄恍命薰怡隂斗弼軀異爽挾和赤章緑典道廓應施合就匪緒忽辨意衡象肧先元化華甦宣北方八天獄酆都首影酪魂醜馥味音姦籍官統祅龍委瀆谷米聿輪腠此㖟宏出洞真和玖騭功衛子壽頥煒觀呼徵大殺韓司詔候移超隱峯黙彰離遘無號幙研碧空浮遷道言此諸天中大梵隱語無量之音舊文九炁丈人染赤彪之獸流丹之液題書長生大帝君南明之殿青環之𤩹空中出字皆廣長一丈金氣鏤縷采明以紫寔丹入玄玄又入丹丹玄起煙鬱勃上元題寫佩服誦習相傳最上妙訣慎勿妄宣天真皇人昔書其文以爲正音有知其音能齋而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門太勲魔王保舉上仙道備尅得遊行三界昇入金門此音無所不辟無所不禳無所不度無所不成天真自然之音也故誦之致飛天下觀上帝遥唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅清河海靜黙山嶽吞煙萬靈振伏招集羣仙天無氛穢地無祅塵㝠慧洞清大量玄玄也元始無量度人上品妙經卷之三十一

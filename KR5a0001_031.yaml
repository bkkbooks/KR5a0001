front:
  text: 靈寶無量度人上品妙經卷之三十一黃一
  hash: sha256:5da30df9df3658a2a5b513459024cded016dd44a6bdedad8c71ab227e159e5b6
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_031-001a, image: hfl/0007/0007-004.png}
body:
  text: 長生久視品道言昔於始青天中朱景瓊明洞真化土天際有大玄樂天號曰長生中有帝君號長生大帝君丹瓊之宮絳霄玉宸之闕紫雲繚繞黃霧苾芬帝藏寶室山川林木煙霞風露皆作晴虹赬靄之色仙官神吏僚佐書史以億萬計而此天中東連東蒙之宮紫極之天明真之臺希琳之殿西接協宸之宫耀景之天寶靈之臺太和之殿天垂清微九光之雲以為承覆聳海霞碧瑶之氣以結几席廓然輝耀諸天之中號為極樂元始天尊當説是經開示長生久視大法元始即於始青天中五色獅子座上遙存瓊明天際大玄樂天中長生大帝君以其元始上帝元胄之長福德充備付囑長生大帝君令為十方天人一劫衆生説此長生久視轉凡成聖之要長生大帝君默感元始玄密之旨即從座起敕命左右侍真天宫僕射侍經典者香官玉童玉女一切部屬無量天人及諸仙衆來詣朱景玄洞延康南和之殿無上大法疊玉之座子丹靈童升扶希之樓擊斑龍雷音之鼓閻洞玉女升霽虛雙景之樓叩黃庭九絶神金之鐘聖衆大集普天同悅長生大帝君將演妙法周回十過以召十方始當詣座天真大神上聖髙尊妙行真人無鞅數衆乘空而來自然妙氣流光沖霄八照圓象洞煥景耀幡蓋輿輦九色合成萬種分輝千真交影龍鳯結彩山水流形本無窒礙隱顯靡常宮殿臺畹音樂法具持幢建節泛景乘煙境瑩晨華土成文玉衆真侍座長生帝君玄坐空浮九轉七變赤精紅蓮之座説經一遍紫虛回映天籙字生説經二遍玉京吐晶變化千億説經三遍道空內易徹見祖源説經四遍神顯真形羣類長生説經五遍玉帝啓緘寶符永命説經六遍琪林嘯風宛成虛梵説經七遍靈潢湛清黛海同色説經八遍日月合輝絳霧飄香説經九遍道運無窮天壽長生説經十遍熒芝成盤甘露敷空是時一國是男是女莫不傾心皆受護度咸得長生道言是時長生帝君説經一遍東方無極無量品長生大神無鞅之衆浮空而至説經二遍南方無極無量品長生大神無鞅之衆浮空而至説經三遍西方無極無量品長生大神無鞅之衆浮空而至説經四遍北方無極無量品長生大神無鞅之衆浮空而至説經五遍東北無極無量品長生大神無鞅之衆浮空而至説經六遍東南無極無量品長生大神無鞅之衆浮空而至説經七遍西南無極無量品長生大神無鞅之衆浮空而至説經八遍西北無極無量品長生大神無鞅之衆浮空而至説經九遍上方無極無量品長生大神無鞅之衆浮空而至説經十遍下方無極無量品長生大神無鞅之衆浮空而至十遍周竟十方無極長生大神一時同至一國男女傾心歸仰來者有如萬山出雲千江湧浪轟雷震海無鞅之衆遍諸天界壓疊圖畿非可禁止於是長生大帝君舉手南嚮於此空中化出百億寶光一一寶光有諸世界一一世界百千樓閣或依山水林木岡阜或近都邑溪畔樵野見有仙衆飛身步空水火激射乘龍按轡遊盻神州駕鳳梯雲倏歘騫逸圍繞太息渴佇法言覬度此生見長生道脫離法網超悟真階得悟大乘盡忘習染長生大帝君登引天真大神上聖髙尊紫虛真人十方無極長生久視大神俱登神境之中天人仰看聖集傾依徹見道根本無變滅元始一氣能得之者浩劫無終內視五體外觀萬象日月齊照無有已期長生則道本無生生而不滅久視則邈然無視洞照三清求生於死死化為生久視於無無極為有潛精內息默觀自然無生死中妄有生死生死流轉不能止者以視不久也久視則定定照則真境自現八十一天洞如指掌衆生所以不得長生久視者以刑尅敗絶其氣有無真妄其心心著生死則形亦隨化心與道一一與神冥守神忘心生道長久太微玉符續生和形使氣無害九仙玄籙使視久而徹徹則見道道來現形與子相守長生寶符使道性不遷遺心抱神神變無方十方世界八景妙空一得長生自然久視浮沉萬象應時消殞惟見長生大帝君無量境界無邊法身無窮惠用無極變化一時出現如同眉睫一切天人悟此大法乘雲駕龍來往空洞視十方太空如一黍米仙真教化應世權實超證玉清位登真極説經都竟衆真受度作證於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度長生久視與道同居傾土歸仰咸住輪轉無生無死無壯無老無疾無衰無苦無滅無作無為言無戾中口無惡聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言長生大帝君説經中所言並是諸天上帝內名隱韻之音亦是長生大帝君內諱百靈之隱名也非世之常辭上聖已成真人通玄究微能悉其章誦之十過諸天遙唱萬帝設禮三景順行五行不尅道氣自然長久不終久視無極河海淵凝山嶽崇深日月降精璇璣煥明羣魔束形鬼精滅爽道在無為保命無傾至學之士誦之十過則五帝侍衛三界稽首靈氣來輔無所不成痼液垂死以氣能行皆由道真長生自然營致神氣絶而得生所以爾者學士感契大道常與生俱神合洞真召制十方天光入身久視玉京默朝上帝攝録魔精運應革易生道日新七情六欲永斷妄根五臟百體久視如鑑百神現形授兆要言與神同軿入侍帝軒輕誦此章身則被殃供養尊禮門戶興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人無量為萬道之宗巍巍太梵德難可勝道言凡誦是經十過諸天齊到檢定生名罔墜元惡及有冥愆守道正心神來守身身得長生後天永存凡不聞道喜怒日遷水火尅伐金本相連不滋真水寧制炎光水升火降道備登仙平則火降伏藏太淵怒則焚身四極惡煙知長生道義入玄玄擲水泳珠火居九泉炎火鍊形金體永堅水火二用非聖不傳中有真土名曰自然自然無知萬物以生杳冥恍惚動靜無間天地三界從自然生自然為土土能變遷皆從太空自然中生生則無盡與道齊年內見九宮無英白元黃老運神與兆精連知之長生大帝五篇雲章玉書攝氣舉仙世人受誦則延壽長年尸解得道形變升玄呼吸剛風乘駕六龍南和賜策青帝給童此經微妙普度無窮一切天人莫不受慶無量之福三界蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齋誦詠是經佩服太微玉符召東華真公齋滿之氣下入身中以生木火之氣長生久視後天無窮七月長齋韻詠是經佩服九仙玄籙召西靈真母陽色之氣下入身中以生金土之氣長生久視後天無窮十月長齋誦詠是經佩服玉帝長生寶符召北方三氣君葛賢之氣下入身中以生水木之氣長生久視後天無終八節之日誦詠是經佩服大君久視之章召中黃帝君務猶之氣下入身中以生火土之氣命得長生神朝玉真魂神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黃白三色雲氣之中內外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室內項生圓象光十方如此分明密呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齋清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引氣三十二過東向誦經元始無量度人上品妙經太微玉符九仙玄籙玉帝長生寶符土命人制木氣尅賊令長生久視金命人制火氣尅賊令長生久視水命人制土氣尅賊令長生久視木命人制金氣尅賊令長生久視火命人制水氣尅賊令長生久視大君久視之章右青書絳箔上火化之面東清水調服之取長生日忌上制下尅賊宜以開建日或春甲寅夏丙午秋辛酉冬壬子大吉佩用丹書青箔上服用丹書赤氣在齋九十日佩服致神仙長生久視大驗書符密室勿以語人長生大帝君刻以丹金瓊鳳之簡封以玉帝長生之章藏南和瓊明帝阿九洞寶室之內劫盡一出以度緣骨宿名之士有此玉文不知祕道為尸解仙佩服忌厭穢犯之考身元始洞玄靈寶本章長生久視十回度人南極隱韻離合自然浩虛眇玄恍惚精轉中變化生無極諸天大梵妙氣祖劫綿綿玉霞結山真明為仙靈光煌煌絳阿碧巔上出九色內列三便九室曲峙下流玄泉緑窗金樓神風回煙太和攝録雲書洞篇斑斑龍鱗落落鳳紋宛轉流迹寶華委紛真元題象空無生神神運無形氣貫如繩眇眇莽莽若亡若存玄渾彌羅蘂宫嵳峩育嬰日池真粹潛施得者長生勿失璇璣天珠浥液雲綱八闢轉紫成青三真檢飭視表徹裹遐照千億翠影九還洞陽孕丹黃父赭帔守魂久視見之萬年金鎖玉關神虎衛門真毋奏香杳杳梵氣周回十方中有度人不死之神中有南極長生之君中有度世司馬大神中有好生韓君丈人中有南上司命司録延夀益算度厄尊神長生久視無量度人今日校録諸天臨軒東方無極生氣神王長生大聖無量度人南方無極生精神王長生大聖無量度人西方無極生液神王長生大聖無量度人北方無極生道神王長生大聖無量度人東北無極生化神王長生大聖無量度人東南無極生質神王長生大聖無量度人西南無極生識神王長生大聖無量度人西北無極生妙神王長生大聖無量度人上方無極生定神王長生大聖無量度人下方無極生感神王長生大聖無量度人十方至真長生久視神王長生度世無量大神並乘四規八照之輿三氣九光之華洞皇蒨粲之雲流霄浪霞之蓋雙虹之輪七絶之節驂駕神虎紺鬃之龍前嘯金鶴齊唱後吹玉律同音丹鳳青鸞嘯歌噰噰五老啓途羣仙翼轅億乘萬騎浮空而來傾光回駕監真度生諸天丞相南昌上宫韓司主録監生大神執符把籙齊到帝前隨所應度嚴校諸天普告三界無極神鄉泉曲之府北都羅酆三官九府十二河源分別種民簡記善功授道真氣佩籙希玄身得長生久視永年心感生德神入太玄紫童內觀真境現前洞徹無極仙道自然坐知休否得天中天大劫不爽萬氣洪源性合光空騁雲泝煙元始符命時刻升遷還嬰録氣易形變仙適爾百齡有頃億千制魔保舉度品南宫玉符受鍊仙化成真生身受度劫劫長存隨劫輪轉與天齊年永度三塗五苦八難超凌三界逍遙上清上清之天天帝玉真無色之境梵行東方八天道遠殊明天帝普斗元真滄淵煥奕天帝婁乾至多德照清華天帝建朱覩謨昌祐極宗天帝鈕俞詵喬皓際預光天帝寶丘銘鍊度無欲天帝覺杜容晨光延祚天帝玉堵阿窗澄虛幽完天帝九曲上英南方八天太微耀通天帝苟常貽先太皇深華天帝洞無冥施慶煙鳳真天帝敕禁魔源梵化炎虛天帝崿期祖強露真應化天帝映留度仙超玄紫宸天帝仲康霞廣生妙神天帝麗光蘇丹琳三華天帝祐閬密音西方八天皛真鼎貫天帝洪儀剛需延永轉飛天帝率輅登虛素華慶壽天帝月髻同渠浩蘭安平天帝嶽汗騫敷沖靈洞幽天帝求常卑寥太玄鬱晨天帝竇勤巴方玉景明逺天帝逸玄沖合景九微天帝斷注王北方八天韓司普監天帝神驛召魔洞室曜靈天帝越部南太極玄都天帝正治宗公大寂玄清天帝長生丕明髙虛梵寶天帝鄒儲靖竒龍浮羽葆天帝宥單都孫靈化抱淵天帝柳玄夜鄉樞光九華天帝延祐百靈三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻南上之音南上之尊南上之神南上大君南上之靈九和十合延命億齡神瞳內徹久視惟明長生道在變化上清無量之奧深不可詳敷落神真普度天人今日欣慶受度歷關諸天請滅死道續命長生飛度五户入斗升玄洞見無極渺渺玉天瓊樓億壘金闕千門中有南極長生大君戴寶披青御朱履玄執秉命籌為兆添年東斗度魂西斗制魄北斗鍊真南斗養神中斗華蓋下蔭九元青帝護魂白帝侍魄赤帝養氣黑帝通血黃帝中主萬神無越青天元王玉文保真赤天元王丹符攝精白天元王金籙命神黑天元王玄圖護身黃天元王五老監真五天元王萬神之宗飛行鼓從總領仙兵遊行太空長生玉册天帝檢封雲羅錦帟萬舞鳴鍾碧堂突空繞九飛龍賜兆長生規正方瞳坐察億程幽微密通授號拱璧位為真公兆臣造玄普掃不祥巨獸吐毒髙刁四張兵鋒前施真武侍幡天狼擲火威劔揚煙敢有干試拒遏上真钁天前戮蒼舌後刑黑天斬祅炎帝食精三官迅車北酆列部不得容隱猛馬八征普告無窮萬神咸聽三界五帝列言上清太玄始分五老命神三元變化是為真身口吐紫氣纏絡天根化開五符萬有成形符為天根倏忽變真玉帝居室三景回明六合洞房入玄出青瓊膏黃飴凝為赤城金臺萬重碧嶽千層下沸混海洪波杳冥蒼龍九首火帝七身蜿埏百里噴煙閃睛日月為目氣如奔雲甲錯黑頑護世保民負載𩴹是道真形剛風石堅積陽為天天上天下無幽無冥無形無影無極無窮溟涬大梵遼廓無光赤明東升元始育嬰至丙南陵朱光絳庭中有大帝號長生君與天同生與天齊明鳳衣藻裳青霞為巾正坐洞宮保兆永存返照長樓氣連玉京北斗覆已太一餔精視極幽朗奄見神文五篇八素神虎龜章元氣流演三十二天輪轉無色周回十方旋翼歷軫回度五常三十五分總氣上元八景冥合氣入玄玄玄中授籙賜兆長生一瞬易劫久視萬年太皇大君上帝髙真泛景流霄嘯詠洞經金光旋激震響雲營圎曜攝氣八海洞清寶淵蔚秀縟彩浮京千和萬合自然成真真中有神長生大君無英公子白元尊神太一司命桃康合延執符把籙保命生根上遊上清出入華房八冥之內細微之中下鎮人身泥丸絳宫中理五氣混合百神十轉回靈萬氣齊仙仙道貴生無量度人長與生俱視極杳冥上開八門飛天法輪罪福禁戒宿命因緣普受開度道化生身身得長生上聞諸天諸天之上各有生門中有空洞謡歌之章諸仙靈篇辭參髙真第一長生神仙南和真君飛空之音我適飛輿遐造八荒空洞生風玉音遼遼鳳軒崛起環山復水紫金作宫蟠基六龍內有大君金姿玉容儼坐紫雲絳衣剪虹下觀兆人録紀善功冥與化通長生無終照覽十天騁霧浮空左挾金真右扶玉童詠此洞章神升九重第二久視真妃瓊明玉符之章明璣龍翹冠彼緑縝錦裾流雲香車華軫南宫九門日惟月隱時乘六淳金鸞玉衮夕眄龍山芝田霞嶺天官捧策神使列請書兆生籍鬱清涵景雙珠四規宏視無影無極道君虛真寶名梵氣回環玉符變形生兆神氣青帝凝魂朱芒藴光八威輝煌咽以瓊泉龍低虎昻賜兆祕訣晨風錦光第三長生大帝君宮中太微神母歌曰六星爛爛對臨天剛宮浮紫煙玉翬昊蒼帝君丹袍瑶笏龍刀三魂七魄竟井魁魒天嬰煒秀嘯泛雲濤口吐赤文光纏景霄六真夫人錦帳金韜迅風朱陵鳳背鸞腰飲月咀日碧霜琅膏玄芝萬株絳實殷桃授以長生久視遊遨揖此晨暉仙露飴醪變骨為玉英歌此玄中豪此三界之上瓊明天中飛空歌音音參洞章誦之百遍名度南宮誦之千遍天帝保迎萬遍道備飛升太空過度三界位登仙公有聞靈音仙王敬形敕制地祇侍衛送迎流火玉眸自然入身身光如瞳洞照萬神長生神仙道胎結嬰龍氣灌濯南極同盟親拜黃老口受神文是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是長生大帝君及長生神王隱祕之音皆是大梵之言非世上常辭言無韻麗皆是長生久視永存大法隱祕其章故謂玄奧難可尋詳上天所寶祕於玄都紫微上宫依玄科四萬劫一傳若有至人齎金寶傾心依舊格告盟十天然後而付焉道書夫天地運度亦有否終日月五星亦有虧盈至聖神人亦有休否未學之夫亦有疾傷欲延生續命過度運會皆當祈叩長生大帝君南極神王則命注玉檢名刋金格免過三塗超濟八難凡有此災同氣皆當齊心修齋六時行香十遍轉經福德立降消諸不祥無量之文普度無窮道言夫學長生久視大法心契自然玄默懷道與造化冥一誠通玉清而世患縈縻緣賞未際或運當易骨五臟更生或神棲九宮鍊華脫化或末學道淺仙品未充運應滅度身經太隂雖長生久視大法未備見身功缺而心洞無有神已長生骨肉未鍊臨過之時同學至人為其行香誦經十過以度生名如法徑上南宮賜以生道隨其學功計日而得更生轉輪不惑便得神仙道言夫長生久視之法其禁至重或守心自然玄契妙道或從師請法能致久生或隂營衆德功及羣靈天官列言得以永世或神觀內洞徹見道根俯視二儀遐窺往劫近若旦夜宿命因緣善功業債如觀尋尺與造化為徒出生入死運用由己延日為劫促劫為日千春為朝萬劫為夜長生久視卷舒在意則非學道修誦所能或天稟特異氣質不凡如天有神仙地有松柏人有耆艾皆靈成自然聞道而得聞道而生不原於教理別得天真卓挺於世者也至若天地運終三辰失次四時不調國境生災兵劫不息疫毒流行師友命過亦當修齋行香誦詠此經夫齋戒誦經功德甚重上消天災保鎮帝王下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能為天地帝主兆民行是功德有災之日發心修齋燒香誦經十過皆諸天記名萬神侍衛右別至人尅得為聖君金闕之臣諸天記人功過毫分無失天中真王亦保舉爾身得道者乃當洞明至言也諸天中天大梵隱語無量音道君撰長生大帝君靈書玉篇東方八天明柯遜淳靜微樂惇幾研莬棊純精杳紛韜祕幽諱交渾治崙氣徹內返神嬰自存職熾嶼崵偶銜丕容吟冗潛納寶粹溫通屈流地海頂遘繪同玉霐延和仙鍊輔沖南方八天玻回霞液凝降崿樓玄黃滋化曲窊漕濛奎室虛光三宸皎昌青白英元黃真火堂冏照東華飲瀹粲張扶思舉龍軨車控翔熒庚楠壇玄井護昆綱射激明靈魔渾然西方八天庭雲鬱披鋌瓊感機左池汩鳴結英歡尸灌引天淵復運太微眇私山玄恍命薰怡隂斗弼軀異爽挾和赤章緑典道廓應施合就匪緒忽辨意衡象胚先元化華蘇宣北方八天獄酆都首影酪魂醜馥味音姦籍官統祅龍委瀆谷米聿輪腠此㖟宏出洞真和玖騭功衛子壽頥煒觀呼徵大殺韓司詔候移超隱峯默彰離遘無號幕研碧空浮遷道言此諸天中大梵隱語無量之音舊文九氣丈人染赤彪之獸流丹之液題書長生大帝君南明之殿青環之𤩹空中出字皆廣長一丈金氣鏤縷采明以紫實丹入玄玄又入丹丹玄起煙鬱勃上元題寫佩服誦習相傳最上妙訣慎勿妄宣天真皇人昔書其文以為正音有知其音能齋而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門太勳魔王保舉上仙道備尅得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成天真自然之音也故誦之致飛天下觀上帝遙唱萬神朝禮三界侍軒羣祅束首鬼精自亡琳琅振響十方肅清河海靜默山嶽吞煙萬靈振伏招集羣仙天無氛穢地無祅塵冥慧洞清大量玄玄也元始無量度人上品妙經卷之三十一

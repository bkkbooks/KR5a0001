front:
  text: 靈寳無量度人上品妙經卷之三十一黄一
  hash: sha256:715700de4c2bfec6ca517e0ebc1c38f2680e278862f27f3c790410e0ed310d8f
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_031-001a, image: hfl/0007/0007-004.png}
body:
  text: 長生久視品道言昔於始青天中朱景瓊明洞真化土天際有大玄樂天號曰長生中有帝君號長生大帝君丹瓊之宮絳霄玉宸之闕紫雲繚繞黄霧苾芬帝藏寳室山川林木煙霞風露皆作晴虹赬靄之色仙官神吏僚佐書史以億萬計而此天中東連東蒙之宮紫極之天明真之臺希琳之殿西接恊宸之宫燿景之天寳靈之臺太和之殿天垂清微九光之雲以爲承覆聳海霞碧瑶之氣以結几席廓然煇燿諸天之中號爲極樂元始天尊當說是經開示長生久視大法元始即於始青天中五色獅子座上遥存瓊明天際大玄樂天中長生大帝君以其元始上帝元冑之長福德充備付囑長生大帝君令爲十方天人一刼衆生說此長生久視轉凡成聖之要長生大帝君黙感元始玄宻之旨即從座起敕命左右侍真天宫僕射侍經典者香官玉童玉女一切部屬無量天人及諸仙衆來詣朱景玄洞延康南和之殿無上大法疊玉之座子丹靈童升扶希之樓擊斑龍雷音之鼔閻洞玉女升霽虚雙景之樓叩黄庭九絶神金之鐘聖衆大集普天同悦長生大帝君將演妙法周回十過以召十方始當詣座天真大神上聖髙尊妙行真人無鞅數衆乗空而來自然妙氣流光沖霄八照圓象洞煥景燿旛蓋輿輦九色合成萬種分煇千真交影龍鳯結彩山水流形本無窒礙隱顯靡常宮殿臺畹音樂法具持幢建節泛景乗煙境瑩晨華土成文玉衆真侍座長生帝君玄坐空浮九轉七變赤精紅蓮之座說經一遍紫虚回映天籙字生說經二遍玉京吐晶變化千億說經三遍道空内易徹見祖源說經四遍神顯真形羣類長生說經五遍玉帝啓緘寳符永命說經六遍琪林嘯風宛成虚梵說經七遍靈潢湛清黛海同色說經八遍日月合煇絳霧飄香說經九遍道運無窮天壽長生說經十遍熒芝成盤甘露敷空是時一國是男是女莫不傾心皆受護度咸得長生道言是時長生帝君說經一遍東方無極無量品長生大神無鞅之衆浮空而至說經二遍南方無極無量品長生大神無鞅之衆浮空而至說經三遍西方無極無量品長生大神無鞅之衆浮空而至說經四遍北方無極無量品長生大神無鞅之衆浮空而至說經五遍東北無極無量品長生大神無鞅之衆浮空而至說經六遍東南無極無量品長生大神無鞅之衆浮空而至說經七遍西南無極無量品長生大神無鞅之衆浮空而至說經八遍西北無極無量品長生大神無鞅之衆浮空而至說經九遍上方無極無量品長生大神無鞅之衆浮空而至說經十遍下方无極无量品長生大神無鞅之衆浮空而至十遍周竟十方無極長生大神一時同至一國男女傾心歸仰來者有如萬山出雲千江湧浪轟雷震海無鞅之衆遍諸天界壓疊圖畿非可禁止於是長生大帝君舉手南嚮於此空中化出百億寳光一一寳光有諸世界一一世界百千樓閣或依山水林木岡阜或近都邑谿畔樵野見有仙衆飛身歩空水火激射乗龍按轡遊盻神州駕鳳梯雲倏歘騫逸圍繞太息渇佇法言覬度此生見長生道脫離法網超悟真階得悟大乗盡忘習染長生大帝君登引天真大神上聖髙尊紫虚真人十方无極長生久視大神俱登神境之中天人仰看聖集傾依徹見道根本無變滅元始一炁能得之者浩劫無終内視五體外觀萬象日月齊照無有已期長生則道本無生生而不滅久視則邈然無視洞照三清求生於死死化爲生久視於无无極爲有潜精内息黙觀自然無生死中妄有生死生死流轉不能止者以視不久也久視則定定照則真境自現八十一天洞如指掌衆生所以不得長生久視者以刑尅敗絶其氣有無真妄其心心著生死則形亦隨化心與道一一與神冥守神忘心生道長久太微玉符續生和形使氣無害九仙玄籙使視久而徹徹則見道道來現形與子相守長生寳符使道性不遷遺心抱神神變無方十方世界八景妙空一得長生自然久視浮沉萬象應時消殞惟見長生大帝君無量境界無邊法身無窮惠用无極變化一時出現如同眉睫一切天人悟此大法乗雲駕龍來徃空洞視十方太空如一黍米仙真教化應世權實超證玉清位登真極說經都竟衆真受度作證於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度長生久視與道同居傾土歸仰咸住輪轉無生無死無壯無老無疾無衰無苦無滅無作無爲言無戾中口無惡聲齊同慈愛異骨成親國安民豐忻樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言長生大帝君說經中所言並是諸天上帝内名隱韻之音亦是長生大帝君内諱百靈之隱名也非世之常辭上聖已成真人通玄究微能悉其章誦之十過諸天遥唱萬帝設禮三景順行五行不尅道炁自然長久不終久視无極河海淵凝山嶽崇深日月降精璇璣煥明羣魔束形鬼精滅爽道在無爲保命無傾至學之士誦之十過則五帝侍衛三界稽首靈氣來輔無所不成痼液垂死以氣能行皆由道真長生自然營致神氣絶而得生所以爾者學士感契大道常與生俱神合洞真召制十方天光入身久視玉京黙朝上帝攝録魔精運應革易生道日新七情六慾永斷妄根五臓百體久視如鑑百神現形授兆要言與神同軿入侍帝軒輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因縁萬災不干神明護門斯經尊妙獨歩玉京度人無量爲萬道之宗巍巍太梵德難可勝道言凡誦是經十過諸天齊到檢定生名罔墜元惡及有㝠愆守道正心神來守身身得長生後天永存凡不聞道喜怒日遷水火尅伐金本相連不滋真水寧制炎光水升火降道備登仙平則火降伏藏太淵怒則焚身四極惡煙知長生道義入玄玄擲水泳珠火居九泉炎火鍊形金體永堅水火二用非聖不傳中有真土名曰自然自然無知萬物以生杳㝠恍惚動靜無間天地三界從自然生自然爲土土能變遷皆從太空自然中生生則無盡與道齊年内見九宮無英白元黃老運神與兆精連知之長生大帝五篇雲章玉書攝氣舉仙世人受誦則延壽長年尸解得道形變升玄呼吸剛風乗駕六龍南和賜策青帝給童此經微妙普度無窮一切天人莫不受慶无量之福三界蒙惠上天所寳不傳下世至士齎金寳效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齋誦詠是經佩服太微玉符召東華真公齋滿之炁下入身中以生木火之氣長生久視後天無窮七月長齋韻詠是經佩服九仙玄籙召西靈真母陽色之氣下入身中以生金土之氣長生久視後天無窮十月長齋誦詠是經佩服玉帝長生寳符召北方三氣君葛賢之氣下入身中以生水木之炁長生久視後天無終八節之日誦詠是經佩服大君久視之章召中黄帝君務猶之炁下入身中以生火土之氣命得長生神朝玉真魂神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿徳就飛昇上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黄白三色雲氣之中内外蓊㝠有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室内項生圓象光十方如此分明宻呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齋清堂修行至經无量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始無量度人上品妙經太微玉符九仙玄籙玉帝長生寳符土命人制木氣尅賊令長生久視金命人制火氣尅賊令長生久視水命人制土氣尅賊令長生久視木命人制金氣尅賊令長生久視火命人制水氣尅賊令長生久視大君久視之章右青書絳箔上火化之面東清水調服之取長生日忌上制下尅賊宜以開建日或春甲寅夏丙午秋辛酉冬壬子大吉佩用丹書青箔上服用丹書赤炁在齋九十日佩服致神仙長生久視大驗書符宻室勿以語人長生大帝君刻以丹金瓊鳳之簡封以玉帝長生之章藏南和瓊明帝阿九洞寳室之内劫盡一出以度縁骨宿名之士有此玉文不知祕道爲尸解仙佩服忌厭穢犯之考身元始洞玄靈寳本章長生久視十回度人南極隱韻離合自然浩虚眇玄恍惚精轉中變化生无極諸天大梵妙氣祖劫綿綿玉霞結山真明爲仙靈光煌煌絳阿碧巓上出九色内列三便九室曲峙下流玄泉緑䆫金樓神風回煙太和攝録雲書洞篇斑斑龍鱗落落鳳紋宛轉流迹寶華委紛真元題象空無生神神運無形氣貫如繩眇眇莽莽若亡若存玄渾彌羅蘂宫嵳峩育嬰日池真粹潜施得者長生勿失璇璣天珠浥液雲綱八闢轉紫成青三真檢飭視表徹裹遐照千億翠影九還洞陽孕丹黃父赭帔守魂久視見之萬年金鎖玉關神虎衛門真毋奏香杳杳梵氣周回十方中有度人不死之神中有南極長生之君中有度世司馬大神中有好生韓君丈人中有南上司命司録延夀益筭度厄尊神長生久視無量度人今日校録諸天臨軒東方無極生氣神王長生大聖無量度人南方無極生精神王長生大聖無量度人西方無極生液神王長生大聖無量度人北方無極生道神王長生大聖無量度人東北無極生化神王長生大聖無量度人東南無極生質神王長生大聖無量度人西南無極生識神王長生大聖無量度人西北無極生妙神王長生大聖無量度人上方無極生定神王長生大聖無量度人下方無極生感神王長生大聖無量度人十方至真長生久視神王長生度世無量大神並乗四規八照之輿三氣九光之華洞皇蒨粲之雲流霄浪霞之蓋雙虹之輪七絶之節驂駕神虎紺鬃之龍前嘯金鶴齊唱後吹玉律同音丹鳳青鸞嘯歌噰噰五老啓途羣仙翼轅億乗萬騎浮空而來傾光回駕監真度生諸天丞相南昌上宫韓司主録監生大神執符把籙齊到帝前随所應度嚴校諸天普告三界無極神郷泉曲之府北都羅酆三官九府十二河源分別種民簡記善功授道真氣佩籙希玄身得長生久視永年心感生德神入太玄紫童内觀真境現前洞徹無極仙道自然坐知休否得天中天大劫不爽萬氣洪源性合光空騁雲泝煙元始符命時刻昇遷還嬰録氣易形變仙適爾百齡有頃億千制魔保舉度品南宫玉符受鍊仙化成真生身受度劫劫長存隨劫輪轉與天齊年永度三塗五苦八難超凌三界逍遥上清上清之天天帝玉真無色之境梵行東方八天道遠殊明天帝普斗元真滄淵煥奕天帝婁乾至多徳照清華天帝建朱覩謨昌祐極宗天帝鈕俞詵喬皓際預光天帝寳丘銘鍊度無欲天帝覺杜容晨光延祚天帝玉堵阿䆫澄虚幽完天帝九曲上英南方八天太微耀通天帝苟常貽先太皇深華天帝洞無㝠施慶煙鳳真天帝敕禁魔源梵化炎虚天帝崿期祖強露真應化天帝映留度仙超玄紫宸天帝仲康霞廣生妙神天帝麗光蘇丹琳三華天帝祐閬宻音西方八天皛真鼎貫天帝洪儀剛需延永轉飛天帝率輅登虚素華慶壽天帝月髻同渠浩蘭安平天帝嶽汗騫敷冲靈洞幽天帝求常卑寥太玄鬱晨天帝竇勤巴方玉景明逺天帝逸玄沖合景九微天帝斷注王北方八天韓司普監天帝神驛召魔洞室曜靈天帝越部南太極玄都天帝正治宗公大寂玄清天帝長生丕明髙虚梵寳天帝鄒儲靖竒龍浮羽葆天帝宥單都孫靈化抱淵天帝柳玄夜郷樞光九華天帝延祐百靈三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻南上之音南上之尊南上之神南上大君南上之靈九和十合延命億齡神瞳内徹久視惟明長生道在變化上清無量之奥深不可詳敷落神真普度天人
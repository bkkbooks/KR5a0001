front:
  text: 靈寳无量度人上品妙經卷之四天四
  hash: sha256:78147d3993a409102ae02923cd9e988a3b760a8f5a98b555e463bb2212a1ee1e
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_004-001a, image: hfl/0001/0001-136.png}
body:
  text: 永延劫運保世升平品道言昔於皇靈天中妙化飛音大黎樂土受元始度人永延劫運保世升平无量上品元始天尊當說是經周廻十過以召十方始當詣座天真大神上聖髙尊妙行真人無鞅數衆乗空而來瑞彩瀰漫靈香飛空龍車紫蓋交映拱扶流霞煇煥洞朗萬天九日九夜諸天浮蓋圓象森羅樞斗一時停機二景合光八極廓清湛然澄瑩一國山林川澤淵數緬平蔚薈無不華明土皆作柔玉光照凝鮮無有異色衆真侍座元始天尊玄坐太空九色玄龍寳局之上說經一徧諸天大聖同時稱善萬物民人咸皆遂性說經二徧物無札癘民息憂虞說經三徧人安其化無所爭求說經四徧時稱豐樂不識災凶說經五徧萬方率服遐邇同風說經六徧禽魚胎卵各保生成說經七徧麟鳳來儀天地應祥說經八徧至德熈洽民物還淳說經九徧國君王侯永保世續說經十徧普天率土咸證道妙是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一徧東方无極无量品延劫保世至真大神無鞅之衆浮空而至說經二徧南方无極无量品延劫保世至真大神無鞅之衆浮空而至說經三徧西方无極无量品延劫保世至真大神無鞅之衆浮空而至說經四徧北方无極无量品延劫保世至真大神無鞅之衆浮空而至說經五徧東北无極无量品延劫保世至真大神無鞅之衆浮空而至說經六徧東南无極无量品延劫保世至真大神無鞅之衆浮空而至說經七徧西南无極无量品延劫保世至真大神無鞅之衆浮空而至說經八徧西北无極无量品延劫保世至真大神無鞅之衆浮空而至說經九徧上方无極无量品延劫保世至真大神無鞅之衆浮空而至說經十徧下方无極无量品延劫保世至真大神無鞅之衆浮空而至十徧周竟十方无極天真大神一時同至一國男女傾心歸仰來者萬億普徧方土咸皆欣願來詣天尊觀聽上法洞達妙無劫運綿長保世升平萬國歸依天人和同無鞅之衆迮國一半土皆徧陷非可禁止於是元始凝目歛神飛出妙氣結爲圓光大如赤日在空玄之中去地九丈元始登引天真大神上聖髙尊妙行真人十方无極至真大神無鞅数衆倶入圓光之内天人仰看惟見拂拂從光明中入既入圓光不知所在國人廓散地還平正無復欹陷元始即於圓光之内說經都竟衆真監度以授於我當此之時延度劫數保世升平福德无量道法自然萬彚樂育喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸契大道無夭無閼無患無殃無爭無擾無惡無邪無徧無黨意無貪欲心無怨憎齊同慈愛異骨成親國安民豐欣樂太平經始岀教一國以道預有至心宗奉禮敬永延劫運道言元始天尊說經中所言並是諸天上帝内名隱韻之音亦是魔王内諱百靈之隱名也皆至道之神機天地之宻文可以永延大小劫運保世升平帝享萬歷民物咸亨非世之常辭上聖已成真人通玄究微能悉其章誦之十過天地合泰運度無愆三災消革五氣常平善瑞咸臻帝祚綿昌至學之士誦之十過則身躬永固命運長延保世億齡感真致仙濟度垂死絶而得生所以爾者學士道氣未純體未合靈召制十方威未制天政德可伏御地祇延度災襄但却死而巳不能更生輕誦此章身則被殃供養尊禮門戸興隆世世昌熾與善因縁萬災不干神明護門斯經尊妙獨歩玉京保延无量爲萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到推延妙氣制水伏火不得凌犯劫運永長無有時災永保升平凡學至經功滿德就皆能保衛成其至治欣樂年豐也上學之士修誦是經外保六合內保一身内外一理同獲永延小大䝉福幽顯被恩此經微妙保衛無窮一切天人莫不受慶无量之福萬劫䝉惠上天所寳不傳下世至士齎金寳效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齋誦詠是經歷劫萬世數會無窮道化長存七月長齋誦詠是經消除乖沴召致福祥十月長齋誦詠是經爲國王帝主君臣父子安鎮國祚保天長存世世不絶常爲人君安鎮其方民稱太平八節之日誦詠是經永延劫運保世升平身受道德祖禰超登得爲九宫三天真人離合之日誦詠是經普濟生靈咸獲福夀擾競永消普世率寧萬神鎮衛五帝司存晏眄無窮以度億齡道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黃白三色雲氣之中內外蓊冥有青龍白虎朱崔玄武獅子白鶴羅列左右日月照明洞煥室內項生圓象光映十方如此分明宻呪曰无上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十二人關啓所言今日吉慶長齋清堂修行至經无量度人願所啓上徹俓御无上三十二天元始上帝至尊几前畢引炁三十二過東向誦經元始无量度人上品妙經元始洞玄靈寳本章上品妙首十回度人百神隱韻離合自然妙化玉真髙玄上神孕育元氣融結萬天開明華景和合隂陽隂陽合變五運推行寒暑代遷萬化生成冥冥大範妙數該通盛衰周布各有窮極陽九百六水火相厄號曰劫災造化俱忒大劫所交水火蕩焚乾坤滅景惟道獨存元始安鎮瓊書上篇總真命靈撿校諸天星宿分度軌運無愆攝召蛟龍負塞河源東井不傾江海停淵統持世界各有真神衛世之君太平髙尊五靈玄老三氣丈人中有護國十方大聖永制劫仞度厄尊神回災散禍保世清貞今日宣布諸天臨軒東方无極飛天保延世劫神王長生大聖无量度人南方无極飛天保延世劫神王長生大聖无量度人西方无極飛天保延世劫神王長生大聖无量度人北方无極飛天保延世劫神王長生大聖无量度人東北无極飛天保延世劫神王長生大聖无量度人東南无極飛天保延世劫神王長生大聖无量度人西南无極飛天保延世劫神王長生大聖无量度人西北无極飛天保延世劫神王長生大聖无量度人上方无極飛天保延世劫神王長生大聖无量度人下方无極飛天保延世劫神王長生大聖无量度人十方至真飛天神王永延劫運保世升平无量大神並乗靈瑞祥雲明霞寳輿翠蓋華輪驂駕玉龍侍衛辟邪建紫旄之節雲錦神旛前嘯鸞歌𨓜響後吹簘籟相和普天稱慶莫不欣歡金童散香玉女翼轅安天大將赤甲萬兵齊麾並驅擁衛髙真保度劫災蕩熄祅氛三元正吏九天上靈統化元老安鎮大神檢校運會簡奏帝前隂陽滯結隨應開宣斡旋大紐檢極靈關曆數相厄回順彌綸水火流布生成自然超凌安泰杜絶災原凶勃殄滅萬慶咸臻不容乖忒無招禍愆靈寳玉字安鎮劫延君民安泰億劫長存乾坤靜肅日月合明昆蟲遂性至化無邊神真恊賛世作長年與道齊德功歸萬天越度三災福䘵純全億兆無爲逍遙太平太平之機總攝上玄無色之境梵行東方八天義明昭正天帝殊師彦希泰智雲陽天帝妙定無炎昌機游玄天帝肇初兹成魯思元舉天帝荘華永恩玄章變梵天帝無寂阮監韶動希音天帝陽浴利生度生救靈天帝辯混持雷周井虚秦天帝雲無藻彌南方八天朱海霞藏天帝皓塞沖圖瑶扈璇侣天帝祭勤董猷利正京符天帝晉句頥澤六常賔愬天帝九方真童呼耻更回天帝保紀定明魁神總令天帝捧罡飛霄抱日慶交天帝確生鼎孚量乎文珙天帝瑟那東西方八天察非正憲天帝崇四欽靈兆籍羅公天帝斬𦍙斗兵楮牧妙覩天帝陋都内真幹定道庸天帝樂明報先龍羅竦持天帝漂粗尉宜候宿推霞天帝大微亮宗道至玉𨌺天帝祈明俱唐上虛寳有天帝曲擇薈房北方八天沈淵泛生天帝廣侯無希冥回杳迹天帝魏覽變祥羽演蔞籍天帝居門雲芒淵靈浪元天帝土狨庚驅遼微斷極天帝鑑伯真侔鼎焞召氣天帝屢無遘規酌并傲㝠天帝擢寒連妙微昆定天帝道驗中皇三十二天三十二帝諸天隠諱諸天隱名天中空洞自然靈章諸天隱韻天中之音天中之尊天中之神延劫大魔天中之靈和會帝氣統化上清无量之奥深不可詳敷教神霄保衛無窮今日欣慶受度歷關諸天統御劫化保世升平開延紀曆氣運無愆混合太一回度五行歲星衛生太白司成辰星藏養熒惑敷榮鎮星中主皇一周行青靈定仁皓靈輔義丹靈賛禮玄靈衛智中央元老恢張沖氣東皇大神木祅蕩𧕏南真大神炎禍寧極白帝大神金兵消華元晶大神玄會合德中皇大神總御符靈五方十界萬道之神握鈴仗鉞嚴衛億千鼔運化綱召制神真歷劫天地保鎮不傾二十八宿抗禦四𨇠中斗臨向弭禍開生四序旋列寒暑循環隂陽輪轉怪沴勿干大劫至期辟却災群五河主宰溟泠大神促令檢録開除水津元始符告敢有稽停攝送上宫所誅無存姦邪喪氣祅亂滅根世受大福道化澄清永載慶昌仁善興隆普推衆妙同升上宫順扶曆數列奏髙空元始大梵三氣推延分判二象植立萬天神靈羅布造化生成生成陶育五氣流行六氣代遷榮謝相仍氣運否塞大劫纒綿命有數會水火風災華燿隳没生靈滅根溟津幽寥三景藏輝善惡無别凶咎交馳元始安鎮福德自然靈書大䇿寳録上篇促召諸天十方大神統握玄圖綿綿不窮範圍道氣妙用開通神綱經緯運劫法輪樞轄造化常保无貞靈風鼓扇八極和平和氣沖融善瑞咸臻敷楊天政歴奏上真真中有神長生大君神霄後聖青華帝君東極西臺左右仙卿執符定簡以保希夷威明將吏掃絶百非上奉九天下制三災四維八區一德咸歸邪穢蕩盡魔癘折摧億萬斯載冨樂又寧不容姦慝上善日新忠良輔化與道合明道貴保延无量劫津悉除鬼盜風火無停海宇清謐天地廓澄慶逮幽壌滯爽超登沈魂滅對釋解冤愆純化蕩蕩稱讃諸天諸天大聖咸喜歡言中爲空洞謡歌之章魔王靈篇辭參髙真第一欲界飛空永劫之音神化恢張吉慶方亨邪道滅兮嘉祥來臻天道昭昭息絶祅氛仁善歸至德姦凶造惡根貪愛忘真守天經錯謬行勿使成華愆當令保太平惡魔樂殘敗傷困勞生靈擾我清淨境怨毒苦相仍髙上玉清王賜我靈寳章攝制綿長劫常膺無上功真風既蕩蕩世祚日興隆紫清降福洞微天尊永劫寳符第二色界魔王延運之章混洞乾坤曆運無常隂陽否愆厄塞劫津劫災所至水火蕩焚萬景三辰冥冥莫存賴我衆靈安鎮普天推延大紀解釋災根調御四氣寒暑相和人何知此以享我恩禍害沈息清晏自然此時樂兮護度億齡煌煌群生一合俱真上帝寳符敷落山川宗社寧肅永保太平善應元吉我道當尊太皇萬福天尊延運寳符第三無色界魔王保世歌曰三天之上萬景之宗元皇統御我界所崇勑制神靈保衛天根三災化蕩八道清明劫輪無滯順化流行檢校星𨇠宿度悉分我奉帝符勑制魔群敢有姦橫陽光激燌太平開化安鎮長存永膺福慶後天無傾造化玄樞上攝天機若不知此道何以登真梯無令逢運會群祅得放威太平護國天尊保世真符已上三符以金銅鑄安闕門殿廡之上大吉學道者佩服延年却災度厄丹書赤紙如科此三界之上飛空之中真魔謡詠之音音參洞章受之永延劫運帝祚克昌誦之百徧消却時災誦之千徧魔王衛靈萬徧道備億世升平保度劫化萬凶摧傾有聞靈音魔王敬形勑制地祇侍衛神真臣民康樂超脱禍難福慶大來莫不咸臻是謂无量保度无窮有祕上天文諸天共所崇泄慢堕地獄禍及七祖翁道言此二章並是諸天上帝及至靈魔王隱祕之音皆是大梵之言扶佑劫運衛世降祥招真致神惠民安國言無韻麗曲無華宛故謂玄奥難可尋詳上天所寳祕於神霄玉清五府經室華堂應運六萬劫下傳若有至人齎内寳質心依舊格告盟九天然後而付焉道言夫天地運度亦有否终日月五星亦有虧盈劫數世運亦有促延至聖神人亦有休否末學之夫亦有疾傷凡有此災同氣皆當齊心修齋六時行香十徧轉經福德立降消諸不祥无量之文普度无窮道言夫末學道淺或仙品未充運應滅度身劫將終神經太隂臨過之時同學至人爲其行香誦經十過以度尸形如五鍊生尸法魂神俓上南宫度名天機玄省隨其學功計日而得更生轉輪不惑便得神仙道言夫天地運終亦當修齋行香誦經星宿錯度日月失昏亦當修齋行香誦經四時失度隂陽不調亦當修齋行香誦經大小劫終五運改易世紀廷續亦當修齋行香誦經疫毒流行兆民死傷亦當修齋行香誦經稼𥣱不登亦當修齋行香誦經夫齋戒誦經功德甚重上消天災保鎮帝王下禳毒害以度兆民生死受賴其福難勝故曰无量普度天人道言凡有是經能爲天地帝主兆民行是功德有災之日發心修齋焼香誦經十過皆諸天記名萬神侍衛右别至人剋得爲聖君金闕之臣諸天記人功過毫分無失天中魔王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語无量音道君撰元始靈書永延劫運護世太平玉篇東方八天鬱羅高張化運玄庸歷譜縁世憫憒慈宫幸祐夷拱敷卓姦求輅儆題攸覺租沂鉤祝屠覩需琳局鄙幽大格省急宰録并由獻嶽遘塞雲業道解鍚疇帝房畧勿鋤諫南方八天褒嶤儲析星簡昉泰神音謹忱醮伯呼在漢延徂墀伐靈力心第粤著廷髙始耿亨昭符江愬山尸毛樊乙愬通輻卷白彼關升童照腦精延內鑒運意神占寸曠允閑西方八天明思彪陁鐸哥淨淙瓊阜煙佪媾兹緑姬蒙虚遥諴露液宻樂抱連卯墟玄冥洞覺蕪晶縻常活欲耻孤熾動命得無何劫空定本爲防真絶乖當一同龍初子胎幻如北方八天罔光摇潤結沫䧟海抽丘擬岡流漫溢蔓忽影紛象興沒降伏妄有認匪混獨消止生恩名慈伐毒𢷤非隨自納祥天收赴微繩逺丕固糅蔞邈窺榮竟弗悼諱契啓施道言此諸天中大梵隱語无量之音舊文字皆廣長一丈天真皇人以絳玉之簡刻書其文以爲正音布諸臺闕及太微紫微館室之上以攝大小劫運世數水火克復不祥有知其音能齋而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勲真王保舉上仙道備剋得遊行三界升入金門此音無所不碎無所不禳無所不度無所不成天真自然之音也故誦之致飛天下觀上帝遥唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響十方肅清河海靜黙山嶽吞烟萬靈振伏招集群仙天無氛穢地無祅塵冥慧洞清大量玄玄也元始无量度人上品妙經卷之四

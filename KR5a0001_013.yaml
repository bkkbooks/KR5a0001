body:
  text: 太乙元精品道言昔於元黃天中紫空金碧大方明土受元始度人太乙元精無量上品元始天尊當說是經周回十過以召十方始當詣座天真大神上聖髙尊妙行真人黃老元帝太乙元精妙空真君中央九壘三十六皇君仙王地真大神土中真皇靈仙土下官曹司馬無鞅數衆乘空而來碧霞黃雲緑輿瓊輪丹華垂隂元精玉光叢萃瑞色洞煥太空五日五夜太乙神真遍覆諸天日月宮府星斗宮闕龍馭無馳玉機停揵纒曆凝輝洞如金色泠飈靜夷天谷深湛緑煙低微明輝昭敞碧天流綱紫煙飛靄三元浩回四氣眇清一國地土山川林木緬妥平砥無復髙下土皆金璃厚柔含輝彩縟霞觀無有異色衆真侍座元始天尊玄座空浮五色神龍之上說經一遍諸天大聖同時稱善是時一國男女目覩心思諸天諸地辰景山海瓊臺寶閣仙聖鬼神自何出生而具此相說經二遍思念日月交流河海並注憑何運搖依空獨立說經三遍一切天人回光洞視氣入玄元道合虛皇說經四遍一切天人俯仰三界雲動風施荐臻嘉瑞說經五遍證悟化本太乙元精九形真土感化而生說經六遍靈心頓開懸知天地隂陽順度萬物遂成說經七遍玄沆泛灑玉芝自生龍虎悲吟感悟法相說經八遍身鍊為空空化為真如是神通實為希有說經九遍大會咸恱瞻見元始得悟道機元精為妙說經十遍天樂流韻萬籟齊聲玉相垂慈潔如空素是時一國是男是女莫不傾心皆受護度咸得長生道言見時元始天尊說經一遍東方無極無量品太乙元精至真大神無鞅之衆浮空而至說經二遍南方無極無量品太乙元精至真大神無鞅之衆浮空而至說經三遍西方無極無量品太乙元精至真大神無鞅之衆浮空而至說經四遍北方無極無量品太乙元精至真大神無鞅之衆浮空而至說經五遍東北無極無量品太乙元精至真大神無鞅之衆浮空而至說經六遍東南無極無量品太乙元精至真大神無鞅之衆浮空而至說經七遍西南無極無量品太乙元精至真大神無鞅之衆浮空而至說經八遍西北無極無量品太乙元精至真大神無鞅之衆浮空而至說經九遍上方無極無量品太乙元精至真大神無鞅之衆浮空而至說經十遍下方無極無量品太乙元精至真大神無鞅之衆浮空而至十遍周竟十方無極太乙元精天真大神一時同至一國男女傾心歸仰咸聞元始天尊宣演太乙元精之法出生天地三界仙聖鬼神必依真土胞胎飬育然後而成真土者非有形頑滯之土兹乃五行鍊化先天地生道之全體無形真土識此真土自然得道必當禮覲元始求此妙法來者有如細雨密霧無鞅之衆迮國一半土皆遍陷非可禁止於是元始懸一寶珠大如黍米在空玄之中去地五丈元始登引天真大神上聖髙尊妙行真人黃老元帝太乙元精妙空真君土中土下一切真靈無量聖衆十方無極大乙元精至真大神無鞅數衆俱入寶珠之中天人仰看惟見拂拂從珠口中入既入珠口不知所在國人廓散地還平正無復𣣱陷元始即於寶珠之內說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人值遇經法普得濟度全其本年無有中傷傾土歸仰咸行信心信道信經信師信法信位信證信常信生信化信本言無華曲口無邪聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名隱韻之音亦是真王內諱百靈之隱名也太乙元精者無形真土也真土無形即是太空太空為土其中生出三界一切天地真仙龍神人鬼兆若知之以有合無以性合空以神合道即為髙真非世之常辭上聖已成真人通玄究微能悉其章誦之十過諸天遙唱萬神設禮太一臨景河海靜默元精布化山嶽藏雲真土孕明內生日月無形示象璇璣不行群魔束形鬼精滅爽回尸起死白骨成人至學之士誦之十過則五帝侍衛三界稽首魔精喪眼鬼祅滅爽濟度垂死絶而得生太一施德元精散靈收氣於空招神於無續命繼生土為命先所以爾者學士穢氣未消體未洞真以制十方威未制天政德可伏御地祇束縳魔靈但却死而已不能更生輕誦此章身則被殃供飬尊禮門戶興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人無量為萬道之宗巍巍大範德難可勝道言凡誦是經十過諸天齊到太乙元精土真變生道胎分神泉曲開明億曽萬祖幽魂苦爽皆即受度上升朱宫格皆九年受化更生得為貴人而好學至經功滿德就皆得神仙飛升金闕遊宴玉京也上學之士修誦是經太一孕靈土主五福元精入身皆得受度飛升南宫世人受誦則延燾長年土為金母水為土孫土為元氣金為真鉛水既遇金鉛與汞親識者不死遇者知真然後皆得作尸解之道魂神暫滅不經地嶽即得返形遊行太空含咀土精普度無窮一切天人莫不受無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及七祖長役三塗侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齊誦詠是經太乙元精萬變生形為上世亡魂斷地逮役度上南宫七月長齊誦詠是經太乙元清土為生根身得神仙諸天書名黃籙白簡削死上生十月長齊誦詠是經太乙元精土號帝尊中臨四方乘黃豐文為國王帝主君臣父子安鎮國祚保天長存世世不絶常為人君安鎮其方民樂太平八節之日誦詠是經太乙元精八風朝元太一在庭五福來佑八難不經得為九宫真人本命之日誦詠是經太乙元精保命長生無形上祖元始前生生命之本隱于太玄開目無見惟覩空玄空玄為寶悟之升仙魂神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齊戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黃白三色雲氣之中內外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明洞煥室內太乙元精之氣炯炯赤景居兆頂上項生圎象光映十方如此分明密呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齊清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引氣三十二過東向誦經元始無量度人上品妙經元始洞玄靈寶本章太乙元精上品妙首黃庭度人百魔隱韻離合自然太乙元精無元上真元始祖土名為太空空為太一祖土元精胞飬三界化生諸天開明三景是為天根上無復祖惟道為身無處無空無所非土空土土空為道之母無形為空有形為土空能生化是為真空土元無形是為真土土為生命識空者仙空可獨化土有至文太乙元精真土之名五文開廓普殖神靈無文不光無文不明無文不立無文不成無文不度無文不生是為大梵天中之天鬱羅蕭臺玉山上京上極無上大羅玉清眇眇劫仞若亡若存三華離便大有妙庭金闕玉房森羅淨霐神霄梵氣周回十方中有太乙元精之神中有南極長生帝君中有東極青華帝君中有度世司馬大神中有好生韓君丈人中有南上司命司録延燾益算度厄尊神回骸起死無量度人今日校録諸天臨軒東方無極飛天太乙元精神王長生大聖無量度人南方無極飛天太乙元精神王長生大聖無量度人西方無極飛天太乙元精神王長生大聖無量度人北方無極飛天太乙元精神王長生大聖無量度人東北無極飛天太乙元精神王長生大聖無量度人東南無極飛天太乙元精神王長生大聖無量度人西南無極飛天太乙元精神王長生大聖無量度人西北無極飛天太乙元精神王長生大聖無量度人上方無極飛天太乙元精神王長生大聖無量度人下方無極飛天太乙元精神王長生大聖無量度人十方至真飛天太乙元精神王長生度世無量大神並乘祥雲絳輿青輦華蓋文輪驂駕黃鳳五色金龍建太一之節元精靈幡前嘯貔虎齊唱後吹鸞鶴同鳴師子辟邪嘯歌噰噰五老啓途群仙翼轅億乘萬騎浮空而來傾光回駕監真度生皇極丞相南昌上宫韓司主録監生大神執籙把籍齊到帝前體化探玄考驗靈關玄牝之門八極之根吸引太空土氣氤氲空中有真祖命之神接和咽液腦有土精下流黃庭上通泥丸玄牝呼吸空氣無端天光入淵七世命仙隨所應度嚴校諸天普告三界無極神鄉泉曲之府北都羅酆三官九署十二河源上解祖考意劫種親疾除罪簿落滅惡根不得拘留逼合鬼群元始符命時刻升遷北都寒池部衛形魂制魔保舉度品南宫死魂受鍊仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度三塗五苦八難超淩三界逍遙上清上清之天天帝洞真無色之境梵行東方八天昭體通生天帝傅輝子談義明理陽天帝虞戶逸承神英化靈天帝無竟訶孫真慧無方天帝抱淵力南光持蒼景天帝匠洄庶嘉履昌收期天帝載彊幽低洞虛耀靈天帝直夷𨚧婁純化道威天帝尾頂內鮮南方八天龍梵信光天帝還求耳光大元逝炎天帝哲育辨徊丹輿平雲天帝黨遙復交耀華九光天帝卓爓鍊琚文為空海天帝乙靈播成朱明散景天帝滔槩爽塗佐孚執符天帝密嶽敬良耀赤浮修天帝阿𨽻宥公西方八天儲神衍丘天帝崇幾種聞金真浩懷天帝陸時碧仙真妙簡升天帝亮剛質他太空無思天帝虎凡禱韓太白定真天帝泰物田果才極輔天帝落儒祈倪雽里齊明天帝突盧偃祉亶功慶恭天帝秉康俞垂北方八天淨鍊按地天帝略茹經玄蓋斷淨天帝覺玄奔承華洞虛天帝度仙變明道龍𢍆明天帝報順思泉宫計真天帝遊玄定蒙斗嚴校録天帝拘神綩牢驅魔掖功天帝邈載靜髙湛截珠孕天帝象希祕雲三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻太一之音太一之尊太一之神太一元精太一之靈虛一為九一為土基極數為十十為土成土非形土變化上清無量之奧深不可詳敷落神真普度天人今日欣慶受度還元知祖見道歸真仰空引和土胎金神立兆生命為兆真身歷關諸天請滅三惡斬絶死根飛度五門名列太玄真王監舉無拘天關東斗青龍西斗金虎北斗靈龜南斗𨻑首中斗大魁四像依土土為隂胞脫胎乃生青帝付魂白帝育魄赤帝生神黑帝傳靈黃帝主意注性飛神青土神王驅魔遣尸赤土神王勾吒血嗤白土神王磨堅遁儀黑土神王照精馘騤黃土神王屈多繁徒五方真土太一元精普周太空與空同形變化之母萬神之宗飛行鼓從總領鬼兵麾幢鼓節出入太空自號赫奕諸天齊功出生兩儀化成九宫三界分立真土納容太一元精使兆得道升真達靈上天度人嚴攝此酆神王受命普掃不祥長牙吐毒方顱四張錦額前驅嚴斗仗幡擲火萬里流鈴八衝敢有干試拒遏上真金鉞前戮巨獸後刑屠割鬼爽風火無停千千截首萬萬翦形魔無干犯鬼無祅精三官北酆明檢鬼營不得容隱金馬驛呈普告無窮萬神咸聽三界五帝列言上清空洞元精太一未名土行六虛變化萬生玉京金城神倉九清一土所生諸天備成非土不生非土無陽祖土為空下出龍康眇眇億劫混沌之中上空生色下空生淵空極生風風蕩水傾風澤洞虛金剛乘天天上天下無幽無冥無形無影無極無窮溟𣸉真土疆名太一內號元精元精之陽遼廓無光赤明開圖運度自然元始道先安鎮土元空梵成文敷落五篇赤書玉字八威龍文保制劫運使天長存梵氣彌羅萬範開張元綱流演三十二天輪轉無色周回十方旋斗歷箕回度五常三十五分總氣上元八景冥合氣入玄玄玄中太皇上帝髙真泛景太霞嘯詠洞章金真朗郁流響雲營玉音攝氣靈風聚煙紫虛鬱秀輔翼萬仙是皆真土太一元精變氣化成無土不成與道為盟土雖無形內有生真土為牝牡播精留神千和萬合自然成真真中有神長生大君青華公子玉妃尊神太一元精司命大神桃康合延體玉揚津執符把籙保命生根上遊上清出入華房八冥之內細微之中下鎮人身泥丸絳宫中理五氣混合百神十轉回靈萬氣齊仙仙道貴生無量度人上開八門飛天法輪罪福禁戒宿命因緣普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有空洞謡歌之章真王靈篇辭參髙真第一太一元精太空之音三界未造天地無名十方皆空空亦寓稱不識道祖以空述形空為無有遍處混成一切衆生但知土名為空所隔不見道真不知空者空非本稱認空棄道著空滯聲不知其空所空無形無形者何是真土精不知真土妄認為空空性頑慢何緣物生故知三界萬天九清玉京大山鬱羅髙臺不能自有因土乃生土名真空出生萬化離空求真皆是幻假勿取此空自障其目拂空翳除真土露形蕩蕩道體無所不成兆之玄牝日飲土精故能長生遨遊赤城真土之氣立可仙身第二太一元精真王之章髙上神霄去地百萬周回八方真遊降盻神霄之境碧空為徒不知碧空是土所居此非世間隂濁之土獨能植生嵗除月更春至則復遇夏乃繁況此真土無為無形不有不無萬化之門積雲成霄剛氣所持履之如綿萬鈞可支玉臺千劫宏樓八披梵氣所乘雖髙不巍內有真土神力固維太一元精世不能知我今為此章清音自合離第三太一元精真王歌曰朝登太元阿夕宴天河源人間已再劫閬風春正鮮星羽整巍冠轡龍御神風霄程不計里紫雲但瞳朧玉女戞鳴庚清音自寥寥喚此浩劫迷爽愷登雲濤香煙起緑窗赤錦回紫霄翠色悚長樓電旗隨雲飄彩虹展瓊梁萬仙舞靈謡世界量三千真土所倫陶不知道德母委聖奔蕭翹哀此塵中流歌此撫雲璈此三界之上飛空之中真王歌音音參洞章誦之百遍名度南宫誦之千遍真王保迎萬遍道備飛升太空過度三界位登位公有聞靈音真王敬形勑制地祇侍衛送迎拔出地戶五苦八難七祖升遷永離鬼官魂度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及至靈真王隱祕之音判指真土道之所歸太一元精長養光輝兆能體之不有凶衰性金空土子順母和定而守之息息不離太元之山巨樓雙溪納真吐氣兆命所依滅空見土萬氣可補神氣相融死戶自封皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寶祕於玄都神霄玉清王府運行壬辰大君下降奉教以傳若有至人齎金寶質心依舊格告盟十天然後而付焉道言夫天地運度否終日月五星虧盈至聖神人休否末學之夫疾傷凡有此災同氣皆當齊心修齊六時行香十遍轉經福德立降消諸不詳無量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太隂臨過之時同學至人為其行香誦經十過以度尸形如法則太一護宅元精灌形真王長生生氣來並魂神徑上南宫隨其學功計日而得更生輪轉不惑便得神仙道言夫天地運終星宿錯度日月失明四時失序隂陽不調國土有災兵刑鬼盜疫毒流行兆民死傷師友命過法學禍殃亦當修齊行香誦經夫齊戒誦經功德甚重上消天災保鎮帝王下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能為天地帝主兆民行是功德有災之日發心修齊燒香誦經十過皆諸天記名萬神侍衛右别至人剋得為聖君金關之臣諸天記人功過毫分無決天中真王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語無量音道君撰元始靈書太一元精中篇東方八天華生豐角遍阿靈昧至冥辨谷烈令均馳獻迪陽循離連國鄰召證荷頂席度招𡖖桓卓野遷盧丁素稱馬闌召靜越度井庚茁苓球部騫靈處登溢揚秉弛辜訾徒澄南方八天嶽俞莊乾弊炎鍾利廓璘曠時偃阮輪技迸並驛司牛霐輦符治止物肅丹巒古洲燕漏鼎洞隔彭輳流柄否激敦力奚玄焚潜求猛需液釡紀昆真昻嵯幾耀梵就溫西方八天覩莽浩都意梵寂類悅廣侈特亶想冥閎祝闌文克鬪關洪依蹈悅奔權秀真雲微罷蒮杏候迎東胃旗鍊祖頓思遠曠被圭鎮摹孽注協黨建宏敷落賚系淵覺祕㳙北方八天臭漠澤官斗軍司韓庭曆潘真金房璧完隸畜渾島巴龍幽湍釋池頓魂萬畢左盤軸樊滋巡酉岨瑟觀灞霞注智略汧洞關攝簡命神帝皇符溟作𢍆爓海澗章暄盈道言此諸天中大梵隱語無量之音舊文太始真王以玄狩之毫總括書之太空之中時隱時顯以招太一元精之氣元始祖土出生萬靈為混沌有物之毋太玄有命之先兆能知之與空隱淪兆身本空寓精成身自有損實寶去還虛虛乃空號身入太無入空如煙散化萬天出空成仙應感隨緣念之即現忘之返玄不知所以自然而然字皆廣長一丈天真皇人昔書其文以為正音有知其音能齊而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祇侍門大勳魔王保舉上真道備剋得遊行三界升入金門此音無所不辟無所不禳無所不度無所不成天真自然之音也故誦之𦤺真王下觀上帝遙唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響十方肅清河海靜默山嶽吞煙萬靈振伏招集群仙天無氛穢地無祅塵冥慧洞清大量玄玄也元始無量度人上品妙經卷之十三

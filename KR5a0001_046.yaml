front:
  text: 靈寶無量度人上品妙經卷之四十六字六
  hash: sha256:9fd71e46eefb57ea458885d75f29b6ec5755c22615ece28f8437b7c5f6dab7b2
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_046-001a, image: hfl/0010/0010-004.png}
body:
  text: 除禳水火漂焚品道言昔於靜樂天中飛青寥歌大無畏土受元始度人除禳水火漂焚妙品元始天尊當說是經周回十過以召十方始當詣座天真大神上聖髙尊水火二司大將仙君將軍吏兵行水發火官曹掾吏度厄拔難真人無鞅數衆乘空而來紅黑奔雲虎輿甲馬黃麾絳節翠葆朱幡疾雷沸天雄風偃嶽異彩祥光縹眇鬱勃洞煥太空七日七夜諸天宫鑰震鳴殿觀傾動日月星辰靈芒噴射煒耀停輪仙梵佇雲回霞繞斗碧影輕泛紫烟結樓一國地土山川林木緬平一等無復髙下土皆作蒼玉無有異色衆真侍座元始天尊玄坐空浮五色自然飛仙十華之座說經一遍諸天大聖同時稱善是時一國男女受福諸天常樂道化說經二遍太微紫微水火二曹奏功紀德隂陽調平說經三遍日帝奉笏月后致恭說經四遍二曜三元咸來禀命說經五遍水毋運機延劫永世火官布算增曆益年說經六遍考罰得宜無有橫枉說經七遍漂焚息苦燒溺業消說經八遍三界晏安不生驚擾說經九遍地爐天竈飛伏合倫說經十遍厄運俱濟人物乂寧是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊說經一遍東方無極無量品水火司功大神無鞅之衆浮空而至說經二遍南方無極無量品水火司察大神無鞅之衆浮空而至說經三遍西方無極無量品水火司罰大神無鞅之衆浮空而至說經四遍北方無極無量品水火司直大神無鞅之衆浮空而至說經五遍東北無極無量品水火司厄大神無鞅之衆浮空而至說經六遍東南無極無量品水火司令大神無鞅之衆浮空而至說經七遍西南無極無量品水火司録大神無鞅之衆浮空而至說經八遍西北無極無量品水火司禁大神無鞅之衆浮空而至說經九遍上方無極無量品水火司命大神無鞅之衆浮空而至說經十遍下方無極無量品水火司非大神無鞅之衆浮空而至十遍周竟十方無極水火二司典録大神一時同至一國男女傾心歸仰來者皆各頂禮讃歎已證天尊願不罹水火大小劫災三界遷易之難尚處世身願不罹水火焚漂燒溺之厄不為三官考按罪録刑在水火罰於漂焚乞使二曹順理天政和均人界清裕鬼道沈鎮邪神祅吏無妄行水發火作非橫之厄稽首元始欣聞至要各以天寶妙具神州真𧵥勢同雲集無鞅之衆迮國一半土皆偏陷非可禁止於是元始流眄十方俯觀衆㑹振衣進几回天轉地吹為水光呵為火耀二景交飛遊龍宛轉翔騰虛極良久之間變成寶珠大如黍米懸處髙空去地七丈元始登引天真大神上聖髙尊度厄拔難真人水火二司曹掾將吏漂溺焚𤑔執罰大神無鞅數衆俱入寶珠之中天人仰看惟見勃勃從珠口中入既入珠口不知所在國人廓散地還平正無復𣣱陷元始即於寶珠之內說經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸行善心不猛不怒不侈不迅不察不蕩不散不時不諂不回言尚明析口無惡聲齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊說經中所言並是諸天上帝內名除禳水火漂溺焚燒隱韻之音亦是真王內諱禁勑水火二司不得妄溢行發二考虐暴生民呼召主宰百靈之隱名也非世之常辭上聖已成真人通玄究微法寶已靈水火之變尋源得涇燔燎炎暴知究祖因能悉其章誦之十過諸天遙唱萬帝設禮水土火藏淵靜明離河海湛默赫烈防扄日月停景璇璣不行群魔東形鬼精滅爽焚爍潜息漂溺自平至學之士誦之十過則黑精守位赤怪不生魔魅喪眼鬼妖滅爽濟度水火危厄不生所以爾者學士丹宮未成水騰火降體未洞真召制二司威未制天政德可伏御姦祅束縳遊火大醜故氣但却邪度厄而已不能使水火二神絶諸考罰輕誦此章身則被殃供養尊禮門戶興隆世世昌熾與善因緣水火不干神明護門斯經尊妙獨步玉京制御水火除禳漂焚為萬道之宗巍巍大梵德難可勝道言水火二司有大威神號五嶽總領真君主放大水漂流蕩溺發暴火焚𤑔燒延護善去惡考罰罪人下逮地獄寒池火車漂焚重苦烹注亡魂謫役泉曲火山之府煮瀆焦然悉𨽻真君天有二耀隂陽靈根照映下民而惠災福非行禍厄之權也此大威神與九天司命採訪使者五嶽丈人五嶽都司共治水火水火之罰有六將軍以布令行災主水之將河魁將軍杜元吉天録將軍張子華執符將軍沙伯晃主火之將捷疾將軍劉天鏹定界將軍周君采發火將軍石完夫世界有水火之冗伏蕆隂陽之精化為水火之龍民有危厄則飛龍降災水火併至北斗中勑北帝列司領水火神龍之政號玉光紫靈夫人官吏數千典掌其職生人先世有罪幽魂在水火之獄徒水大之役運水灌四瀆之穴伐薪煎百里之鑊洪波滔天烈火亘地一日一夜受苦無量凡誦是經十過諸天齊到受苦衆生出離水獄遊神紫臺出離火獄上升朱宫格皆九年受化更生得為貴人除禳漂焚福慶自生而好學至經功滿德就靈寶成丹身生水火七返九還皆得神仙飛升金闕遊宴玉京也上學之士修誦是經真水上浮靈火下溫日藏於海萬竅生雲皆即受度飛升南宫世人受誦則延壽長年後皆得作尸解之道魂神暫滅不經地獄水火漂焚即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齊金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齊誦詠是經為上世亡魂斷地逮役水火功考度上南宫七月長齊誦詠是經除禳水火漂梵身得神仙諸天書名黃籙白簡削死上生十月長齊誦詠是經除禳水火使二氣和平為國王帝主君臣父子安鎮國祚保天長存世世下絶常為人君安鎮其方民稱太平八節之日誦詠是經赤黑順界萬物遂成得為九宫真人本命之日誦詠是經隂無僣陽臣忠於君火降水升德下而尊魂神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齊戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青紫絳三色雲氣之中內外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右典總水火二大靈司神官將吏備衛前後日月照明洞煥室內項生圓象光映十方如此分明密呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齊清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引氣三十二過東向誦經元始無量度人上品妙經元始洞玄靈寶本章除禳水火漂焚保劫度人百魔隱韻從濟自然二象交輪無無上真元始祖劫神化無神有一未形氣生空玄大器內溫溫則氣升升為玄露降為天津水為帝先太一杳冥溫氣成炎火為神津火明水晦二象備成水盈器中火動神溫溫久泫液結凝玉京九宫八門安鎮十方開明赤黑是為天根水火無祖一九化真丹靈焚惑玄老大辰辟非朱鳳蒼龍皛精百六陽九剪滅凶群游火黑祅戰物災民道可除禳化空成文是名大法玄中之玄三元八㑹鳳真玉篇髙祕神文億千萬年真玉治世應運流傳普度生死一切苦魂威悉應符永劫長年歷水過火三災不登暴氣邪侈移變世間成災可除將至乃禳焚𤑔漂溺速離逺方帝君行令敢有來當太虛焚氣運轉元綱中有除禳水火漂焚之神中有南極長生之君中有度世司馬大神中有好生韓君丈人中有南上司命司録延壽益算度厄尊神回骸起死無量度人今日校録諸天臨軒東方無極風力神王長生大聖無量度人南方無極威耀神王長生大聖無量度人西方無極金光神王長生大聖元量度人北方無極洞淵神王長生大聖無量度人東北無極制姦神王長生大聖無量度人東南無極熾𤓁神王長生大聖無量度人西南無極水藏神王長生大聖無量度人西北無極禳禍神王長生大聖無量度人上方無極拔難神王長生大聖無量度人下方無極度厄神王長生大聖無量度人十方至真除禳水火漂焚神王長生度世無量大神並乘宸霞錦光玉輿紫清瓊輦彩蓋霓輪驂駕五鳳十二玄龍建招真之節八景靈旙前嘯金巢齊唱後吹玉錀同鳴獅子白鶴嘯歌噰噰列真啓途群仙翼轅億乘萬騎浮空而來傾駕水火監檢生靈神霄府相青華上宫韓君仙伯消災大神執籙把籍齊到帝前隨所應度嚴校諸天普告三界無極神鄉連宛之府靈紐之宫六天九獄冰池火山救解衝蕩漂溺焚燼過度生關沈尸苦魂釋赦三官上解祖考億劫種親疾除罪簿落滅惡根不得拘留逼合鬼群元始符命時刻升遷火翳寒庭部衛形魂制魔保舉度厄南昌死魂受鍊仙化成人生身受度劫劫長存隨劫輪轉與天齊年永度漂沈焚蕩之苦超淩三界逍遙上清上清之天天帝洞覺無色之境梵行東方八天慶華瑶虞天帝臺昌舞霞歷明資玄天帝靈谷振光控神九真天帝巴慈引祥日觀揚靈天帝都竒升方步竒乘角天帝統貟羅氐舍次東天帝真陀流淵妙律垂科天帝閲道維美定儀師微天帝伯初桃英南方八天爍寰理赫天帝孫愚道奕禁明威勇天帝鄱滿祁桓安樂昭仁天帝鬱禎英陽化度仙天帝幽雲靜坊微境冲遊天帝子殊衡史滔逸魂天帝符乾處寧赤洞顯幽天帝遍常澤墟利泰猶和天帝召無僅剛西方八天梵氣七真靈曜天帝繼元正基白章文皇天帝越定莊台玄極義天帝仙閔弗冥江霞子湘天帝韜樞蓋倉中遙玄變天帝師元同瑰靜妙委神天帝嶽録華由洞光素耀天帝落丘造章制飛鎮精天帝穴汨求輔北方八天麗正真期天帝黃武明超空升化碧炎天帝詔智賔玉奔紫景露陽天帝宗耀湟祕清瑶章神府天帝仲季綿寶陳華几降龍天帝學吉隆雲澤敷成天帝達司進行紫融通微夭帝芾儀開正真萬齡天帝建裕崑三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻除禳水火漂焚之音水元太一之尊火元赤皇之神發水大魔行火真靈九陽十隂變化上清無量之奧深不可詳敷落神真濟拔漂焚今日欣慶度厄除禳却氛禁敕典司歷關諸天請滅漂焚斬絶邪冤飛度水火名列太玄魔王監舉無拘天門東斗紀善西斗降祥北斗水考南斗火殃中斗定刑燎溺存亡罪大殞命貴輕受厄青帝監魂白帝攝𩲸赤帝執炬風火煥赫黑帝揚波漂蕩無極黃帝中主統行誅殛青天魔王監試群姦赤天魔王擲火騰烟白天魔王洶濤反山黑天魔王洪波汩淵黃天魔王焦尸泛骸五帝大魔萬神之宗飛行水火總領威兵麾幢鼓節遊觀太空熾爓赫奕滔天縳龍上天度人嚴勑北酆真王受命救難迎祥八威衛駕猛馬巡疆飛天息火大帥塞洋除禳橫厄厭解擊衝敢有干試抗拒上真司非定罪巨天注名赤祅大醜收行天丁千千遏塞萬萬滅形敢有漂溺燒害良民三官北酆明檢鬼營不得容隱金馬驛程普告無窮萬神咸聽三界五帝列言上清元洞同域水火二鄉隂含陽精陽賴隂疆二氣成物能柔能剛眇眇億劫混沌之中上淨為色下沈為淵水火遍空合質凝天天上天下無幽無冥無形無影無極無窮溟涬大梵遼廓無光水火既生三界境完久則氣勝進退升遷制暴遏邪水火立官考校罪業泉曲火山醜類僣逆僞妄行歡漂溺天人焚燎區寰昊帝震怒符召百神玉章正氣赤文命靈黑精啓胞龍毋拖紳钁天振威主領萬兵郁默執旗醜伯攝精元老奉詔掃蕩妖氛收捕遊火開通水精不得犯縱明敬教言清肅字宙歸奏帝前威光下照廓開八門普赦北酆受報窮魂悉令玄悟明道之根因緣輪轉上生諸天永享大福鍊胎飛仙超出三界髙居太清蘂臺遊宴齊對功貞玉音攝氣洪波自平靈風聚煙狂爓不然停波息爛水火二光接科金律神文化真真中至神長生大君御火旺德萬天稱尊飛形九霄統政萬靈無英輔相白元泳淵太一冥耀司命光旋桃康二景字合精延執符把籙保命生根上遊上清出入華房八冥之內細微之中下鎮人身泥丸絳宫中理五氣混合百神十轉回靈萬氣齊仙除禳漂焚救苦度人消滅厄㑹散解危迍帝君頒令罪福甄分普受開度死魂生身身得受生上聞諸天諸天之上各有生門中有空洞謡歌之章真王靈篇辭參髙真第一除滅水厄漂溺飛空之音水官檢精總御北元理隂制陽平定河源醜類亂天道群祅歸一時蕩蕩移山嶽舟楫安能施河伯逺避勢𧕏蜃來助威生民罹此災空闊天難知血肉飽魚鱉骨骸落沙泥悲風吹九隂呱呱終夜啼大命既夭枉流浪無所依祅乘其祭祀靈爽知何之真王降九霄攝凶送七非馘耳斷腰頸山河戮其尸玉符召靈死魂受生詠此洞章丹簡書名皆受拔度上升朱陵第二禳解火難焚𤑔之章火官察惡領典南司大星熒熒老人赤衣臂弓鶉首乘駕辟非萬物賴功流火玉池天機御省六門景輝下官竊政亂行誅夷中夜忽起疾風交馳碧煙如龍烈𤓁橫施萬丈灼灼聲侔隱雷驚呼垣奔迷不出帷肉潰脂流殤鬼急追斷髻焦髮氣逐餘灰魂遊冥冥猛火離離脫有來饗惡鬼嗅之渴不得飲困不獲栖仙聖在天孰謂使知天官按行執凶紏非玉符制火鬼道莫違帝君有命普獲純禧生民晏安不涉傾危第三除禳度厄拔難歌曰玉清之上神霄鬱開帝都九門中有大君錦裳絳衣碧冠珠纓統治三界十方萬天千二百曹咸職列官八百七十按局群仙七元罪福水火氣元制命勑律佐理億千校録生死河海溪泉敢有故氣變化幽關妄行水火毒害生靈焚𤑔漂溺猖獗不停寶章玉符密告帝庭威劔巨斧斬伐鬼精水平火息厄難無侵誦詠洞文祈天引誠真王下觀青籙記名除禳度死七祖超升氣鍊變仙神飛意靈萬世蒙福俱登玉京此三界之上飛空之中真王歌音音參洞章誦之百遍永禳焚溺名度南宫誦之千遍真王保迎萬遍道備飛升太空過度三界位登仙公有聞靈音魔王敬形勑制地祗侍衛送迎拔出地戶水火厄難七祖升遷永離幽冥魂度朱陵受鍊更生是謂無量普度無窮有祕上天文諸天共所崇泄慢墮地獄禍及七祖翁道言此二章並是諸天上帝及神霄真王隱祕之音除滅漂蕩之厄禳解燔燎之災邪精魔類盜行水火毒害生靈妄求血食鍾鼓之響真王檢察斬戮邪魔安施玉符辟斷非橫水火之厄若有身殁水火魂𩲸精識為上古傷鬼男女之𦍙所憑自赴水火或世世水厄年年火災皆是邪神竊權天司擅興焚蕩學者敬誦此經以為救度即能除斷皆是大梵之言非世上常辭言無韻麗曲無華宛故謂玄奧難可尋詳上天所寶祕於神霄玉清王府東華藏室應運下傳若有至人齎金寶質心依舊格告盟真王然後而付焉道言夫天地為水火之神器天河在上則水鼎上居火海在下則火鼎下儲太空在中日月為藥日月者水火之根本繫於南北二斗為太微紫微兩極都曹以水親大則水能尅火以火隔水則火能尅水水火均等則既濟成物水火有太少之運則萬物為之刑災上天以水火為生化之樞機樞機得則天政成下官故氣六天鬼魔盜水火而用之以害生類帝君出除禳之法救濟在危厄者大至天地運度否終日月五星虧盈至聖神人休否細至末學之夫疾傷凡有此災同氣皆當齊心修齊六時行香十遍轉經福德立降消諸不祥無量之文普度無窮道言夫末學道淺或仙品未充運應滅度身經太隂此皆身中淨霐之水與明堂之火未能升降身中之神與司命殺鬼戰於水火之門臨過之時同學至人為其行香誦經十過以度尸形如法魂神徑上南宫隨其學功計日而得更生轉輪不惑便得神仙道言夫天北運終星宿錯度日月失昏四時失序隂陽不調國境焚漂四民失業疫毒流行兆民死傷師友命過同學夭傷皆由水火不調勝負為災天官墮政魔怪為𦍙雖外無焚𤑔漂溺之厄氣失其平奔注騰熾內為失度暴發之咎皆當修齊行香誦經夫齊戒誦經功德甚重上消天災保鎮帝王下禳毒害以度兆民生死受賴其福難勝故曰無量普度天人道言凡有是經能為天地帝主兆民行是功德有災之日發心修齊燒香誦經十過皆諸天記名萬神侍衛右别至人尅得為聖君金闕之臣諸天記人功過毫分無失天中真王亦保舉爾身得道者乃當洞明至言也諸天中大梵隱語除禳水火無量音道君撰元始靈書中篇東方八天飊忽保靈蔚元浮砂覺濟飛泝迎機濮耶駛江兖敷即玄蘄㠓允答貺䇿幽榭穆崇獻翰强憊資氓逸聰熛定澱化制碑畢戎弄斗閣越籍司奎鍾昊叙漾建池鄒卷沖南方八天濡穴探益神命革遙聮彼洞宥極京龍桃錯鑿棤阮㵧蹇漠常杜髙謹載晞蒸巴敖碧連運變亨極盧楊檢勑方帝烈飊疾裒熏露渙落統莫虛隆急制北律萬呼冥冥西方八天梵度乾煆慈傳龜喏漸截鬼憂并野部嬴詔端鼎察意謨虛形曇現罔寂玄河祭賔演漢洞譙月姑張兊采迅茹華紫令遹盛丁治鷺石刀丹録魔胡賽判決神靂渾微北方八天虎臼緣璇箕論頓核甎陽銲世知閬遷火榜縉董掖麗珍元娑井估候驛延蘇慶隨灾稼厥展補因夸離銼減越潔靦踈柷基浩朏遘忽指嶽池瓖調明趨管遼儺蘊綽道言此諸天中大梵隱語無量之音舊文書北元逮臺水帝七精之室南靈騫陀未館飛華之宫用平制水火舉抑璇璣進退二候以成大化天地交泰日月運行隂陽發生仙聖變化升降上下比之權衡斟酌量宜以畜萬有其道不忒三辰順𨇠攝受失理則五魔盜柄太上所祕藏之寶瓶神通自然一切無礙翔為龍鳳伏為龜蛇道妙都括不使世知字皆廣長一丈天真皇人昔書其文以為正音有知其音能齊而誦之者諸天皆遣神府玉郎真王上吏下觀其身書其功勤上奏諸天萬神朝禮地祗侍門大勳真王保舉上清道備尅得遊行三界升入金門此音無所不除無所不禳無所不度無所不成天真自然之音也故誦之致飛天下觀上帝遙唱萬神朝禮三界侍軒群祅束首鬼精自亡琳琅振響十方肅清水無漂溺火不炎燔萬靈振伏招集群仙天無氛穢地無祅塵冥慧洞清大量玄玄也元始無量度人上品妙經卷之四十六

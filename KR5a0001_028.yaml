front:
  text: 靈寶無量度人上品妙經卷之二十八玄八
  hash: sha256:dacdb87be195d1ead01c72785e24b40ebd93827e84c3504bc950f453c5bacf45
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5a0001_HFL_028-001a, image: hfl/0006/0006-084.png}
body:
  text: 三辰光輝保命延生品道言昔於始青天中碧落空歌大浮黎土受元始度人無量上品元始天尊當説是經周回十過應現諸天説此度人六周十遍無量神靈盡來集會聽法大衆咸皆濟度其經藏於髙上神霄玉府宣説玉音演暢大法元始天尊自上皇開基散布真氣造立道境復於太皇之末中皇之始下於東方建通靈禁上太霞洞元之天開上皇梵飛世界運仙化飛升之風舒飛仙洞羅之氣南方洞陽太光之天開陽明洞耀世界運赫炎朱火之風舒三天火鍊丹池之氣西方九仙梵行之天開渺行霒雲世界運髙皇大霏之風舒少隂開明運仙之氣北方隂生廣靈之天開玄滋駕光回飛世界運上極羅天之風舒真洞飛光之氣至於東北始青木皇之天開碧落空歌世界運融和九氣之風舒始陽震生之氣埀珠攝煙建法略竟元始法身示現三百六十變化大放九色神光洞照空有元始一氣敷落萬真青陽宫中寶胤聖胎三氣周流木母生火出於東鄉玉雲萬華溫明世界紫金巍闕狀如嬰童黃朱錦衣巾金帶瓊坐鎮三垣為萬象之主膺我玉宸元皇之號現圓象於太空日月列宿儼侍左右赤景至陽為日黃華純隂為月八素流精為星辰九元五章為神靈鎮天剛之樞居三辰之上即於太素天中景霄虛隂長樂化境受元始度人三辰光輝保命延生之法始當詣座天真大神上聖髙尊妙行真人無鞅數衆乘空而來三素飛雲八景琅輿華幡翠節流彩揚光五色鬱勃洞煥髙虛靈霞散空三辰交映華芒四射妙氣結形自成龍鳳甘露飄珠神煙卷縷纒綿縝靜綱紐旋回聖真心目照達明徹山川林木互入無礙天蓋圓浮土如碧玉無有異色列仙環侍元始天尊玄坐虛浮火玉交光神虎之座説經一遍諸天大聖同時稱善是時太極元綱星羅雙耀宮闕通明説經二遍景星騰光照朗太微説經三遍黃氣陽精徊天儛空説經四遍五緯列真同會玉闕説經五遍日闕月宫發現嘉祥説經六遍靈氣感降民獲延年説經七遍得見赤文齊修上範説經八遍執詠洞章挹景奔辰説經九遍功圓果滿下拔幽冥説經十遍萬品化成永開生道是時一國是男是女莫不傾心皆受護度咸得長生道言是時元始天尊説經一遍東方無極無量品明真大神無鞅之衆浮空而至説經二遍南方無極無量品真陽大神無鞅之衆浮空而至説經三遍西方無極無量品太素大神無鞅之衆浮空而至説經四遍北方無極無量品羽明大神無鞅之衆浮空而至説經五遍東北無極無量品碧落大神無鞅之衆浮空而至説經六遍東南無極無量品洞戶大神無鞅之衆浮空而至説經七遍西南無極無量品飛符大神無鞅之衆浮空而至説經八遍西北無極無量品辟非大神無鞅之衆浮空而至説經九遍上房無極無量品青都天神無鞅之衆浮空而至説經十遍下方無極無量品遠昌大神無鞅之衆浮空而至十遍周竟十方無極天真大神一時同至一國男女傾心歸仰來者各乘七耀明霞三辰寶輦無邊翾積非可禁止各見日帝月皇列星宮殿各處世界一一宮中皆有帝尊群臣吏民佐史國土境域不可臆度遍計天仙髙真羽蓋丹輿斑龍獅子驂駕往來採鍊奔挹明諸上道於是元始化現妙光大若圓象乃登引天真大神上聖髙尊妙行真人十方無極至真大神無鞅數衆俱入妙光論説三辰光輝保命延生大法示教至妙之先道非形相混成有物金水凝魂魂養胎宫光由神發乃立妙無上帝妙有大帝混元大帝三帝萬變經九七六億萬之數句陳上宫命天皇大帝左宮命太陽尊帝右宫命太隂元君中宮命紫微北極大帝總統二象運行五氣共領三辰斡以元斗三百六十五度四分度之一周流六十甲子運九陽之精為日十隂之精為月和合日月之精為星辰日有九色月有十華日號九色圓象月為十華圓光統大道之神靈故號太一天靈之光太玄無夜之光太蒼洞清之光緑璃赤景之光五色濯羅耀明之光白素黃華神耀之光丹霞朱火之光太素玉華之光絳炎九微之光光中煥然自然梵氣結成紫書瓊簡真文龍章鳳璽雲霞五篇之篆八方之氣支勢曲折隱韻垂芒作八卦之狀普濟天人救脫衆苦日之周徑一千里日行一度月之周徑一千里晝夜平行一十三度遲行十二度速行十四度日月合則萬物生成星大九百里小及百里行各有次水火之度不可為準三辰光輝文理埀形靈書八會妙章玄圖曲素大洞知光輝之道參於風雲氣雨玄津玉液則形神洞妙奔光咽霞引景步星則為太上之真人元始即於妙光之內説經都竟衆真監度以授於我當此之時喜慶難言法事粗悉諸天復位倏歘之間寂無遺響是時天人遇值經法普得濟度全其本年無有中傷傾土歸仰咸悟光明神合於光氣合於明保命不終延生無窮三辰在天真道冥沖三辰入心飛舉成真三辰照地七寶鎮世識其道則骨成龍文飲其光則肉化金色出入有無永斷生滅齊同慈愛異骨成親國安民豐欣樂太平經始出教一國以道預有至心宗奉禮敬皆得度世道言元始天尊説經中所言並是諸天上帝內名隱諱之音亦是日月內諱星宿之隱名也非世之常辭三辰光輝所以能保命延生者三光之精天真之神下接人氣神氣混淪光性為照於人為識識在氣存神不離根是之謂命命洞斯旨可保而有命為生主主在生延延生得道道妙自然上聖以成真人通玄究微能悉其章誦之十過諸天遙唱萬帝設禮河海靜默山嶽藏雲日月停景璇璣不行群魔束首鬼精滅爽回尸起死白骨成人至學之士誦之十過則真神上奔三辰接景乘駕龍車與帝扶擕遊宴華庭尸蠧蕩滅胎穢淨明伏御地祇束縳魔靈返老却死還年更生輕誦此章身則被殃供養尊禮門戶興隆世世昌熾與善因緣萬災不干神明護門斯經尊妙獨步玉京度人無量為萬道之宗巍巍大範德難可勝道言凡誦是經十過則三辰之精下覆爾身心光上騰景氣冥一始輝之童採華之女執空青之紱以招三靈之神鍊神泥丸恍惚奔登燕觀太無諸天齊到億曾萬祖幽魂苦爽皆即受度上升朱宫格皆九年受化更生得為貴人而好學至經功滿德就皆得神仙飛升金闕遊宴玉亰也上學之士修誦是經自然奔辰皆即受度飛升南宮世人受誦則三辰光輝降流身中注鍊形魂五臟金色面有玉光延壽長年後皆得作尸解之道魂神暫滅不經地獄即得返形遊行太空此經微妙普度無窮一切天人莫不受慶無量之福生死蒙惠上天所寶不傳下世至士齎金寶效心盟天而傳輕泄漏慢殃及九祖長役鬼官侍經五帝玉童玉女各二十四人營衛神文保護受經者身道言正月長齋誦詠是經日帝下觀天光接身九霞鍊骨紫氣合神為上世亡魂斷地逮役度上南宮七月長齋誦詠是經星帝下觀天光接身寶霞鍊質金色化精身得神仙諸天書名黃籙白簡削死上生十月長齋誦詠是經月帝下觀天光接身寶霞鍊氣三光合身神奔意感萬變更生為國王帝主君臣父子安鎮國祚保天長存世世不絶常為人君安鎮其方民稱太平八節之日誦詠是經雙景朝元閉目內冥光洞天谷赤景鍊神五星降真三辰繞身八威吐火元氣自生得為九宫真人本命之日誦詠是經日月煥照九元絡形朱煙飄溶使爾玄通乘龍紫霄據斗攀魁徘徊三陽遊行三玄辟試除殃八靈七政坐卧斗中辟却萬凶三辰光輝為我還容魂神澄正萬氣長存不經苦惱身有光明三界侍衛五帝司迎萬神朝禮名書上天功滿德就飛升上清道言行道之日皆當香湯沐浴齋戒入室東向叩齒三十二通上聞三十二天心拜三十二過閉目靜思身坐青黃白三色雲氣之中內外蓊冥有青龍白虎朱雀玄武獅子白鶴羅列左右日月照明五星交蔭洞煥室內項生圓象光映十方如此分明密呪曰無上玄元太上道君召出臣身中三五功曹左右官使者侍香玉童傳言玉女五帝直符直日香官各三十六人關啓所言今日吉慶長齋清堂修行至經無量度人願所啓上徹徑御無上三十二天元始上帝至尊几前畢引氣三十二過東向誦經元始無量度人上品妙經元始洞玄靈寶本章三辰光輝保命延生妙品十回度人三垣隱韻變化自然大範騰輝靈光散凝真氣鴻濛混合杳冥外黃內赤二象交并隂陽吸和天寶成文玉字五篇八方威神造化之祖二儀之源大化玄同溟涬無垠開明三景是為天根日月含胞九道乃分元晶玄晶萬天化生上無復祖惟道為身五文開廓普植神靈光氣結縷宛轉億尋龍章虎書置玉布金華芒蔚構離合真精劫仞圓羅玉山蕭亰上極太無混洞三清渺渺鬱微紫蓋黃庭左日右月中有赤熒六氣交纒三光結形五帝告符七曜玄經雲綱結帶神池育嬰中有奔景赤黑之神中有梵氣周回之君中有日童月女星妃之真中有鬱儀結璘壘珠飛青耀紫之英中有挹輝採華八素之文中有赤帝黃老天魂髙奔上靈圓景方象九色霞津灌鍊五臟澡治百關迅駕龍車上造帝軒三辰光輝保命延生回骸起死無量度人今日校録諸天臨軒東方無極明真神王長生大聖無量度人南方無極真陽神王長生大聖無量度人西方無極太素神王長生大聖無量度人北方無極羽明神王長生大聖無量度人東北無極碧落神王長生大聖無量度人東南無極洞戶神王長生大聖無量度人西南無極飛符神王長生大聖無量度人西北無極辟非神王長生大聖無量度人上方無極清都神王長生大聖無量度人下方無極遠昌神王長生大聖無量度人十方至真三辰光輝飛天神王長生度世無量大神並乘八素之雲紫霞之輦洞光之輿飛龍遊鳳杳靄萬香之車金碧瓊文之蓋神明之節鬱絶之旙前擊嗚璈節奏後吹曲素生音玄鶴青鸞嘯歌嗈嗈九真啓塗十華翼轅億乘萬騎浮空而來傾光回駕保命延生天魁內相玉輔帝靈太微司命玄合大神執籙把籍齊到帝前隨所應度嚴校諸天髙奔赤帝吸御九元五辰協氣感接太玄光輝俯流保命億千朱景緑英飊象韜騫炎照虹離結璘黃華刻名絳臺鍊腦飛霞坐鎮明空佩服靈篇普告三界無極神鄉日宮月府左紀右綱九天五斗東井河源降氣玄丹同會昆崘疾除罪簿落滅惡根不得拘留逼合鬼群元始符命時刻升遷三辰流火變化寒泉制魔保舉奔景成仙隂質受鍊神光綿綿三宫極真道化玄精生身受度劫劫長存隨劫輪轉與天齊年永度三途五苦八難超凌辰極上登三垣三垣之天天帝紫微無色之境梵行東方八天三辰光輝應化之天如三奔之道上造日月宫有樓闕仙民世界皆晶光所生光洞極瑶天帝越靜靈公明梵耀白天帝道謹觀元玄德恱生天帝伯茲命棲恭紀彥張天帝角牢同氐妙玄九真天帝兆育勤精洞關罙莊天帝永幽九英太飛玄頗天帝定正常無冥窈漏度天帝棘茲莊攸南方八天九道淵魚天帝日觀浮都林元允風天帝僑平子虛化淨寂夷天帝還竇阿婁梵雲深玄天帝憫江幽升成德寶氣天帝順護彥丘靜正霄敷天帝洞真端堯升降治臻天帝𡖖度司兵清真紫虛天帝奉貫治王西方八天混合寶真天帝太素亰保印又玄天帝剎陀奚洪拱祖秀天帝度仙元尊列辰九師天帝皇因太微虛明光無天帝敞冥氣玄韓司明禁天帝華屢真機流精瓊球天帝博洞備符神龍變至天帝玉清監真北方八天變度化真天帝求何普林空梵影藏天帝覺仙蕩如風元易氣天帝鄙遲忽俞臨山降仙天帝斗魁玉宸集慶蒼室天帝覩多沙留朝燕猛部天帝泰師宣遐劫仞吉明天帝洞演務陂相夔島正天帝郝陂山尊三十二天三十二帝諸天隱諱諸天隱名天中空洞自然靈章諸天隱韻天中之音天中之尊天中之神天中大魔天中之靈九芒十華變化上清無量之奧深不可詳敷落神真普度天人今日欣慶受度歷
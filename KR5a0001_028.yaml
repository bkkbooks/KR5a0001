迅心和罔墜俟昔紛統煙繞梵由明緣法易玻鄒西方八天閻浮玉嵒穎吕總監無玄鏡即鋤暮忱炎廓霐台北防斗德銜華舊由黎辨部平漂紫巒儼論謹邈馥芬巴靜戶央池演將奔於閴藪藏帝伯幾魂冶覩騫都陳漠卑孫北方八天玄宥猷度澄璠亷關鄭紇巫萍茲槎雲庭金太越還羅澤祺詩薄好率籍汶定淵恢周盟革鏐岵栗題營轉化嚳窈變冥祠丁資靈攝亰和時莽桃寶宛辨育邈頗何枚道言此諸天中大梵隱語無量之音招三辰之光輝引九天之真氣清詠佩閲天真下迎舊文自然梵氣生於三辰之宮以制三界大小之殃水火之變天真皇人刻題日月中及大宿星次以禳厄會斷絶否塞增駐運度有識其文勑制鬼神役使六丁保命延生與空傳靈字方廣一丈八角書形佩服朱綱玉策紀名有知其音能齋而誦之者諸天皆遣飛天神王下觀其身書其功勤上奏諸天萬神朝禮地祗侍門大勳魔王保舉上真道備尅得遊行三界升入金門此音無所不辟無所不襄無所不度無所不成天真自然之音也故誦之三辰降光九霞攝氣化鍊凡骼祖考同仙頂生金華相具瓊顔壽等圓輝得道自然飛天下觀上帝遙唱萬神朝禮三界持軒群祅束首鬼精自亡琳琅振響十方肅清河海靜默山嶽吞煙萬靈振伏招集群仙天無氛穢地無祅麈冥慧洞清大量玄玄也元始無量度人上品妙經卷之二十八
